<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lịch sử làm đề · Night IELTS</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24242A">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--ink2:#34343C;--panel:#F4F4F7;--line:#EEEEF3;--mut:#6B6B78;--mut2:#9A9AA8;--lilac:#6C70DC;--lilac-l:#EDEEFD;--peach:#FF9E5E;--peach-l:#FFF1E7;--teal:#0F9D8A;--teal-l:#E3F6F2}
*{box-sizing:border-box}html,body{margin:0}
body{background:#E9E9EF;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:10px 10px calc(30px + env(safe-area-inset-bottom))}
button,select{font-family:inherit;color:inherit}
.frame{max-width:72rem;margin:0 auto;background:var(--ink);border-radius:28px;padding:6px;box-shadow:0 30px 70px -20px rgba(36,36,42,.55)}
header{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;color:#fff;flex-wrap:wrap}
header a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
header .logo{width:38px;height:38px;border-radius:999px;background:var(--lilac);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,255,255,.1)}
header h1{margin:0;font-size:17px;font-weight:800}header h1 small{display:block;font-size:11px;font-weight:600;color:#A9A9B8}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.who select{background:var(--ink2);color:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;max-width:240px}
main{background:var(--panel);border-radius:22px;padding:18px}
@media(min-width:768px){main{padding:26px}}
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--lilac);color:#fff;padding:24px;min-height:170px}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:999px;border:34px solid rgba(255,255,255,.12)}
.hero .k{position:relative;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h2{position:relative;margin:6px 0 0;font-size:1.8rem;line-height:1.15;font-weight:800;max-width:30rem}
.hero p{position:relative;margin:8px 0 0;font-size:14px;line-height:1.55;opacity:.92;max-width:32rem}
.hero img{position:absolute;right:20px;bottom:0;height:88%;max-height:180px}
@media(max-width:640px){.hero{padding-bottom:130px}.hero img{height:120px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.st{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px}
.st small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.st b{display:block;font-size:28px;font-weight:800;margin-top:4px}
.st span{font-size:12px;color:var(--mut)}
.card{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px}
.h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:0 0 12px}.h .dot{width:9px;height:9px;border-radius:99px;background:var(--lilac)}
.tabs{display:flex;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px;margin:0 0 14px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--mut);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px}
.row .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:16px}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{color:var(--mut);font-size:12px}
.row .sc{text-align:right;flex:none}.row .sc b{display:block;font-size:17px}.row .sc small{font-size:11.5px;font-weight:800;color:var(--mut)}
.row .go{display:flex;gap:6px;flex:none}
.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:12.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.ink{background:var(--ink);color:#fff}.btn.ghost{background:var(--panel);color:var(--ink)}
@media(max-width:600px){.row{flex-wrap:wrap}.row .go{width:100%;justify-content:flex-end}}
.band{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px 10px;line-height:1.6}.empty img{height:120px;display:block;margin:0 auto 10px}
.note{background:var(--peach-l);color:#9A3412;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:14px}
svg text{font-family:'Plus Jakarta Sans',sans-serif}
</style>
</head>
<body>
<div class="frame">
  <header>
    <a class="home" href="index.html"><span class="logo"><i class="fa-solid fa-clock-rotate-left"></i></span><h1>Lịch sử làm đề<small>Night IELTS · Reading &amp; Listening</small></h1></a>
    <div class="who" id="who"></div>
  </header>
  <main>
    <section class="hero"><span class="k">Reading · Listening</span><h2 id="heroT">Nhìn lại hành trình làm đề</h2><p>Mỗi lần nộp bài đều được lưu lại: điểm, band và từng câu bạn đã chọn. Bấm <b>Xem lại</b> để mở đúng bài làm cũ với đáp án đúng/sai.</p><img src="khoahoc/img/ira/graph_up.webp" alt=""></section>
    <div id="view"><div class="empty">Đang tải…</div></div>
  </main>
</div>
<script src="night-login.js"></script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import * as A from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
const app = getApps().length ? getApp() : initializeApp({ apiKey: 'AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8', authDomain: 'night-ielts-land.firebaseapp.com', projectId: 'night-ielts-land', storageBucket: 'night-ielts-land.firebasestorage.app', messagingSenderId: '408519436407', appId: '1:408519436407:web:a9f0b9ba23368b54427e72' });
const auth = A.getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { me: null, role: 'user', udoc: null, uid: null, list: null, tab: 'all', studs: [] };
const fmtD = t => { const d = new Date(t); return d.toLocaleDateString('vi-VN') + ' · ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }); };
const fmtS = s => !s ? '' : s >= 3600 ? Math.floor(s / 3600) + 'g' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') : Math.max(1, Math.round(s / 60)) + ' phút';
const bandCol = b => { const x = parseFloat(b); return !(x > 0) ? ['#F4F4F7', '#6B6B78'] : x >= 7 ? ['#E3F6F2', '#0F7A6B'] : x >= 6 ? ['#EDEEFD', '#4B4FC0'] : x >= 5 ? ['#FFF1E7', '#C2410C'] : ['#FFE4E6', '#BE123C']; };

async function load(uid) {
  S.uid = uid; S.list = null; render();
  try {
    const snap = await getDocs(query(collection(db, 'testAttempts'), where('uid', '==', uid)));
    const now = Date.now(), L = [];
    snap.forEach(d => { const x = d.data(); const ex = x.expiresAt && x.expiresAt.toMillis ? x.expiresAt.toMillis() : 0; if (!ex || ex > now) L.push(Object.assign({ id: d.id }, x)); });
    L.sort((a, b) => (b.at || 0) - (a.at || 0));
    S.list = L;
  } catch (e) { S.list = []; S.err = e.message; }
  render();
}
function chart(L) {
  const pts = L.filter(x => parseFloat(x.band) > 0).slice(0, 20).reverse();
  if (pts.length < 2) return '';
  const W = 640, H = 170, pl = 30, pr = 12, pt = 14, pb = 26, xs = i => pl + i * (W - pl - pr) / (pts.length - 1), ys = b => pt + (9 - b) * (H - pt - pb) / 6;
  let grid = ''; for (let b = 3; b <= 9; b++) grid += `<line x1="${pl}" x2="${W - pr}" y1="${ys(b)}" y2="${ys(b)}" stroke="#EEEEF3"/><text x="4" y="${ys(b) + 4}" font-size="10" fill="#9A9AA8">${b}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(Math.max(3, parseFloat(p.band))).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${xs(i)}" cy="${ys(Math.max(3, parseFloat(p.band)))}" r="4.5" fill="${p.kind === 'listening' ? '#FF9E5E' : '#6C70DC'}" stroke="#fff" stroke-width="2"><title>${esc(p.title)} · Band ${esc(p.band)}</title></circle>`).join('');
  return `<div class="card"><div class="h"><span class="dot"></span>Band 20 lần gần nhất <span style="margin-left:auto;font-size:12px;color:var(--mut);font-weight:700"><span style="color:#6C70DC">●</span> Reading &nbsp; <span style="color:#FF9E5E">●</span> Listening</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ band">${grid}<path d="${line}" fill="none" stroke="#24242A" stroke-width="2" stroke-linejoin="round" opacity=".35"/>${dots}</svg></div>`;
}
function render() {
  const v = $('#view');
  if (!S.me) { v.innerHTML = `<div class="card empty"><img src="khoahoc/img/ira/test_shiken_woman.webp" alt="">Đăng nhập để xem lịch sử làm đề của bạn.<br><br><button class="btn ink" id="login">Đăng nhập</button></div>`; const b = $('#login'); if (b) b.onclick = () => NightLogin.open({ auth, authM: A }); return; }
  if (!S.list) { v.innerHTML = '<div class="empty">Đang tải…</div>'; return; }
  const all = S.list, L = S.tab === 'all' ? all : all.filter(x => x.kind === S.tab);
  const rd = all.filter(x => x.kind === 'reading'), ls = all.filter(x => x.kind === 'listening');
  const avg = a => { const b = a.map(x => parseFloat(x.band)).filter(x => x > 0); return b.length ? (b.reduce((s, x) => s + x, 0) / b.length).toFixed(1) : '–'; };
  const best = a => { const b = a.map(x => parseFloat(x.band)).filter(x => x > 0); return b.length ? Math.max(...b).toFixed(1) : '–'; };
  const mine = S.uid === S.me.uid, free = mine && S.role === 'user' || (mine && S.role === 'pro' && !(Number(S.udoc && S.udoc.proUntil) > Date.now()));
  v.innerHTML = (free ? `<div class="note" style="margin-top:16px">Tài khoản thường giữ lịch sử <b>30 ngày</b>. Nâng cấp <b>Pro / Astra</b> để giữ mãi mọi lần làm.</div>` : '') +
    `<div class="stats">
      <div class="st"><small>Đã làm</small><b>${all.length}</b><span>${rd.length} Reading · ${ls.length} Listening</span></div>
      <div class="st"><small>Band Reading TB</small><b style="color:#4B4FC0">${avg(rd)}</b><span>cao nhất ${best(rd)}</span></div>
      <div class="st"><small>Band Listening TB</small><b style="color:#C2410C">${avg(ls)}</b><span>cao nhất ${best(ls)}</span></div>
      <div class="st"><small>Lần gần nhất</small><b style="font-size:17px;margin-top:10px">${all[0] ? fmtD(all[0].at) : '–'}</b></div>
    </div>` + chart(all) +
    `<div class="tabs">${[['all', 'Tất cả'], ['reading', 'Reading'], ['listening', 'Listening']].map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>` +
    (L.length ? L.map(x => { const [bg, fg] = bandCol(x.band), lis = x.kind === 'listening';
      return `<div class="row"><span class="ic" style="background:${lis ? '#FF9E5E' : '#6C70DC'}"><i class="fa-solid ${lis ? 'fa-headphones' : 'fa-book-open'}"></i></span>
        <span class="t"><b>${esc(x.title || x.path)}</b><small>${fmtD(x.at)}${x.secs ? ' · ' + fmtS(x.secs) : ''}${x.mode === 'exam' ? ' · Thi thật' : ''}</small></span>
        <span class="sc"><b>${x.score}/${x.total}</b>${x.band ? `<span class="band" style="background:${bg};color:${fg}">Band ${esc(x.band)}</span>` : ''}</span>
        <span class="go"><a class="btn ink" href="${esc(x.path)}?review=${x.id}"><i class="fa-solid fa-eye"></i>Xem lại</a><a class="btn ghost" href="${esc(x.path)}"><i class="fa-solid fa-rotate-right"></i>Làm lại</a></span></div>`; }).join('')
      : `<div class="card empty"><img src="khoahoc/img/ira/test_print_gakkari_schoolgirl.webp" alt="">${S.uid === S.me.uid ? 'Chưa có lần làm nào được lưu.<br>Làm một đề Reading hoặc Listening rồi bấm <b>Nộp bài</b> nhé.' : 'Học viên này chưa có lần làm nào.'}</div>`);
  v.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
}
async function teacherPicker() {
  try {
    const snap = await getDocs(query(collection(db, 'users'), where('role', 'in', ['student', 'pro', 'user'])));
    const L = []; snap.forEach(d => L.push({ id: d.id, n: d.data().name || d.data().email || d.id, r: d.data().role }));
    L.sort((a, b) => a.n.localeCompare(b.n, 'vi'));
    $('#who').innerHTML = `<select id="pick" aria-label="Xem lịch sử của"><option value="${S.me.uid}">Của tôi (thầy)</option>${L.map(x => `<option value="${x.id}">${esc(x.n)}${x.r === 'student' ? '' : x.r === 'pro' ? ' · Pro' : ' · User'}</option>`).join('')}</select>`;
    $('#pick').onchange = e => { const o = e.target.selectedOptions[0]; $('#heroT').textContent = e.target.value === S.me.uid ? 'Nhìn lại hành trình làm đề' : 'Lịch sử của ' + o.textContent.replace(/ · .*/, ''); load(e.target.value); };
    const q = new URLSearchParams(location.search).get('uid'); if (q) { $('#pick').value = q; $('#pick').onchange({ target: $('#pick') }); }
  } catch (e) {}
}
A.onAuthStateChanged(auth, async u => {
  S.me = u || null;
  if (!u) return render();
  try { const s = await getDoc(doc(db, 'users', u.uid)); S.udoc = s.exists() ? s.data() : {}; S.role = S.udoc.role || 'user'; } catch (e) {}
  if (S.role === 'admin') teacherPicker();
  load(u.uid);
});
render();
</script>
<script src="night-app.js" defer></script>
</body>
</html>
