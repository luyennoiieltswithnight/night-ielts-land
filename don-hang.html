<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đơn hàng & người mua · Night IELTS</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#24242A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--mut:#6B6B78;--line:#EEEEF3;--panel:#F4F4F7;--pri:#6C70DC;--ok:#15803D;--okb:#DCFCE7;--bad:#B91C1C;--badb:#FEE2E2;--warn:#B45309;--warnb:#FEF3C7}
*{box-sizing:border-box}html,body{background:#E9E9EF}
body{margin:0;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:10px 10px 40px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
.frame{max-width:76rem;margin:0 auto;background:var(--ink);border-radius:28px;padding:6px}
header{display:flex;align-items:center;gap:12px;color:#fff;padding:10px 12px 14px;flex-wrap:wrap}
header a{text-decoration:none;color:var(--ink);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px}
header h1{margin:0;font-size:17px;font-weight:800}header h1 small{display:block;font-size:11px;color:#A9A9B8;font-weight:600}
.body{background:#fff;border-radius:24px;padding:20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13.5px;cursor:pointer;background:var(--panel)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs i{font-style:normal;background:#EF4444;color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-size:11px}
.hint{font-size:13px;color:var(--mut);margin:0 0 12px;line-height:1.5}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;min-width:220px}
.card{border-radius:18px;background:var(--panel);padding:13px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card .who{flex:1;min-width:220px}.card .who b{font-size:14.5px}.card .who small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;word-break:break-all}
.ords{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ord{background:#fff;border-radius:12px;padding:7px 9px;font-size:12.5px;display:flex;gap:8px;align-items:center;box-shadow:inset 0 0 0 1px #E4E4EC}
.ord code{font-weight:800;font-size:12.5px}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#E7E7EE;color:#4B4B58;white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}.pill.warn{background:var(--warnb);color:var(--warn)}
.b{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;background:var(--ink);color:#fff}
.b.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #E4E4EC}.b.red{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1px #FCA5A5}
.b:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
td.c{word-break:break-all;max-width:360px;color:#4B4B58}
.empty{padding:30px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13.5px;z-index:9;display:none}
@media(max-width:640px){.body{padding:14px}table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-bottom:1px solid var(--line);padding:6px 0}td{border:0;padding:3px 0}}
</style>
</head>
<body>
<div class="frame">
  <header><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Trang chủ</a><h1>Đơn hàng & người mua<small>Chỉ giáo viên · duyệt tay khi SePay không tự duyệt</small></h1></header>
  <div class="body">
    <div class="tabs" id="tabs">
      <button class="on" data-t="pend">Đơn chờ duyệt<i id="nPend" style="display:none"></i></button>
      <button data-t="pay">Tiền vào (SePay)<i id="nUnm" style="display:none"></i></button>
      <button data-t="buys">Người mua khoá 39k</button>
      <button data-t="plans">Người dùng Pro / Astra</button>
    </div>
    <div id="view"><div class="empty">Đang tải…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, limit, getDocs, getDoc, doc, updateDoc, setDoc, deleteField } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
const app = getApps()[0] || initializeApp({ apiKey: 'AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8', authDomain: 'night-ielts-land.firebaseapp.com', projectId: 'night-ielts-land', storageBucket: 'night-ielts-land.firebasestorage.app', messagingSenderId: '408519436407', appId: '1:408519436407:web:a9f0b9ba23368b54427e72' });
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAY = 864e5, MONTH = 30 * DAY;
const COURSES = { giaotiep: 'Giao tiếp Thực chiến', speaking6: 'IELTS Speaking 6.0', writing: 'IELTS Writing 6.0 → 8.0', chuyende: '25 Chuyên đề', tiengtrung: 'Tiếng Trung Quyển 1' };
const PLAN = { pro: 'Pro', astra: 'Astra' };
const vt = t => t ? new Date(Number(t) + 7 * 3600e3).toISOString().slice(0, 16).replace('T', ' ').split(' ').map((x, i) => i ? x : x.split('-').reverse().join('/')).join(' ') : '–';
const vd = t => t ? new Date(Number(t) + 7 * 3600e3).toISOString().slice(0, 10).split('-').reverse().join('/') : '–';
const money = a => (Number(a) || 0).toLocaleString('vi-VN') + 'đ';
const what = o => o.kind === 'course' ? 'Khoá ' + (COURSES[o.course] || o.course) + ' · 30 ngày' : 'Gói ' + (PLAN[o.plan] || o.plan) + ' · ' + (o.months || 1) + ' tháng';
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => e.style.display = 'none', 3200); }

let tab = 'pend', ORD = [], PAY = [], USERS = null;

/* Duyệt tay: y hệt máy chủ thanh toán (Code.gs handle) */
async function approve(code, amountNote) {
  const os = await getDoc(doc(db, 'payOrders', code)); if (!os.exists()) throw new Error('Không thấy đơn ' + code);
  const o = os.data(); if (o.status === 'paid') throw new Error('Đơn này đã duyệt rồi');
  const us = await getDoc(doc(db, 'users', o.uid)); const u = us.exists() ? us.data() : {};
  const now = Date.now(); let result = '';
  if (o.kind === 'course' && o.course) {
    const until = Math.max(now, Number((u.buys || {})[o.course]) || 0) + MONTH;
    await updateDoc(doc(db, 'users', o.uid), { ['buys.' + o.course]: until });
    result = 'khoá ' + o.course + ' đến ' + vd(until);
  } else {
    if (u.role === 'admin' || u.role === 'student') throw new Error('Tài khoản này là ' + u.role + ', không đổi gói được');
    const until = Math.max(now, Number(u.proUntil) || 0) + (Number(o.months) || 1) * MONTH;
    const tier = o.plan === 'pro' && u.tier === 'astra' && Number(u.proUntil) > now ? 'astra' : o.plan;
    await updateDoc(doc(db, 'users', o.uid), { role: 'pro', tier, proUntil: until });
    result = 'gói ' + tier + ' đến ' + vd(until);
  }
  await updateDoc(doc(db, 'payOrders', code), { status: 'paid', paidAt: now, paidAmount: Number(o.amount) || 0, manual: true });
  await setDoc(doc(db, 'payments', 'manual_' + code), { id: 'manual_' + code, amount: Number(o.amount) || 0, content: 'Duyệt tay ' + code + (amountNote ? ' · ' + amountNote : ''), at: now, matched: true, manual: true, code, uid: o.uid, result });
  return result;
}

async function loadOrders() {
  const s = await getDocs(query(collection(db, 'payOrders'), where('createdAt', '>', Date.now() - 7 * DAY)));
  ORD = []; s.forEach(d => ORD.push({ code: d.id, ...d.data() })); ORD.sort((a, b) => b.createdAt - a.createdAt);
}
async function loadPays() {
  const s = await getDocs(query(collection(db, 'payments'), orderBy('at', 'desc'), limit(120)));
  PAY = []; s.forEach(d => { if (d.id !== '__costs') PAY.push({ id: d.id, ...d.data() }); });
}
async function loadUsers() {
  if (USERS) return; const s = await getDocs(collection(db, 'users')); USERS = []; s.forEach(d => USERS.push({ uid: d.id, ...d.data() }));
}

function paintPend() {
  const paidUid = {}; ORD.filter(o => o.status === 'paid').forEach(o => { paidUid[o.uid] = o; });
  const by = {}; ORD.filter(o => o.status !== 'paid').forEach(o => { (by[o.uid] = by[o.uid] || { name: o.name, email: o.email, list: [] }).list.push(o); });
  const people = Object.keys(by).map(k => ({ uid: k, ...by[k] }));
  $('nPend').style.display = people.length ? '' : 'none'; $('nPend').textContent = people.length;
  $('view').innerHTML = '<p class="hint">Mỗi lần người dùng bấm thử một gói là tạo 1 đơn, nên một người có thể có nhiều đơn chờ. Chỉ duyệt <b>đúng đơn có mã (NI…) trong nội dung chuyển khoản</b> mà bạn thấy trên SePay / app ngân hàng. Đơn chờ quá 7 ngày không hiện.</p>' +
    '<div class="bar"><input id="q" placeholder="Tìm mã đơn NI…, email, tên…"></div>' +
    (people.length ? people.map(p => '<div class="card" data-s="' + esc((p.name + ' ' + p.email + ' ' + p.list.map(o => o.code).join(' ')).toLowerCase()) + '"><div class="who"><b>' + esc(p.name || '(chưa có tên)') + '</b><small>' + esc(p.email) + (paidUid[p.uid] ? ' · đã có 1 đơn được duyệt gần đây: ' + esc(paidUid[p.uid].code) : '') + '</small>' +
      '<div class="ords">' + p.list.map(o => '<span class="ord"><code>' + esc(o.code) + '</code>' + esc(what(o)) + ' · <b>' + money(o.amount) + '</b><span class="pill">' + vt(o.createdAt) + '</span><button class="b" data-ap="' + esc(o.code) + '">Duyệt</button></span>').join('') + '</div></div></div>').join('')
      : '<div class="empty">Không có đơn nào đang chờ.</div>');
  $('q').oninput = e => { const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('.card[data-s]').forEach(c => c.style.display = !v || c.dataset.s.includes(v) ? '' : 'none'); };
}
function paintPay() {
  const unm = PAY.filter(p => !p.matched);
  $('nUnm').style.display = unm.length ? '' : 'none'; $('nUnm').textContent = unm.length;
  $('view').innerHTML = '<p class="hint">Các lần SePay báo tiền vào mà máy chủ đã nhận được. <b>Lần nào SePay gửi lỗi (như sáng nay khi Firebase hết lượt miễn phí) thì không có ở đây</b>: so với danh sách giao dịch trên my.sepay.vn rồi duyệt tay ở tab "Đơn chờ duyệt". Dòng đỏ = tiền vào nhưng không khớp đơn: gõ mã đơn để gán.</p>' +
    '<table><thead><tr><th>Thời gian</th><th>Số tiền</th><th>Nội dung chuyển khoản</th><th>Kết quả</th></tr></thead><tbody>' +
    PAY.map(p => '<tr><td>' + vt(p.at) + '</td><td><b>' + money(p.amount) + '</b></td><td class="c">' + esc(p.content) + '</td><td>' +
      (p.matched ? '<span class="pill ok">' + esc(p.result || 'đã duyệt') + '</span>' + (p.manual ? ' <span class="pill">duyệt tay</span>' : '')
        : '<span class="pill bad">' + esc(p.note || 'chưa khớp') + '</span><div class="bar" style="margin:6px 0 0"><input style="min-width:140px" placeholder="Mã đơn NI…" data-code="' + esc(p.id) + '"><button class="b" data-assign="' + esc(p.id) + '">Gán & duyệt</button></div>') + '</td></tr>').join('') + '</tbody></table>';
}
function paintBuys() {
  const now = Date.now(), rows = [];
  USERS.forEach(u => Object.keys(u.buys || {}).forEach(k => rows.push({ u, k, until: Number(u.buys[k]) || 0 })));
  rows.sort((a, b) => b.until - a.until);
  const act = rows.filter(r => r.until > now).length;
  $('view').innerHTML = '<p class="hint">Tất cả người đã mua lẻ khoá học (39k / 30 ngày). <b>' + act + '</b> lượt đang còn hạn. Thêm tay cho ai đó: gõ email, chọn khoá, bấm Thêm 30 ngày.</p>' +
    '<div class="bar"><input id="bEmail" placeholder="Email người mua (Gmail đăng nhập web)"><select id="bCourse">' + Object.keys(COURSES).map(k => '<option value="' + k + '">' + COURSES[k] + '</option>').join('') + '</select><button class="b" id="bAdd">+ Thêm 30 ngày</button></div>' +
    '<div class="bar"><input id="q" placeholder="Lọc theo email / tên / khoá…"></div>' +
    (rows.length ? '<table><thead><tr><th>Người mua</th><th>Khoá</th><th>Hết hạn</th><th></th></tr></thead><tbody>' + rows.map(r => {
      const d = Math.ceil((r.until - now) / DAY);
      return '<tr data-s="' + esc(((r.u.name || '') + ' ' + (r.u.email || '') + ' ' + r.k + ' ' + (COURSES[r.k] || '')).toLowerCase()) + '"><td><b>' + esc(r.u.name || '') + '</b><br><small style="color:#6B6B78">' + esc(r.u.email || r.u.uid) + '</small></td><td>' + esc(COURSES[r.k] || r.k) + '</td><td>' + vd(r.until) + ' <span class="pill ' + (d < 0 ? 'bad' : d <= 5 ? 'warn' : 'ok') + '">' + (d < 0 ? 'hết hạn' : 'còn ' + d + ' ngày') + '</span></td>' +
        '<td><button class="b ghost" data-ext="' + esc(r.u.uid) + '|' + r.k + '">+30 ngày</button> <button class="b red" data-rm="' + esc(r.u.uid) + '|' + r.k + '">Gỡ</button></td></tr>';
    }).join('') + '</tbody></table>' : '<div class="empty">Chưa có ai mua lẻ khoá học.</div>');
  $('q').oninput = e => { const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('tr[data-s]').forEach(c => c.style.display = !v || c.dataset.s.includes(v) ? '' : 'none'); };
  $('bAdd').onclick = async () => {
    const em = $('bEmail').value.trim().toLowerCase(), k = $('bCourse').value, u = USERS.find(x => (x.email || '').toLowerCase() === em);
    if (!u) return toast('Không thấy tài khoản có email này (người đó cần đăng nhập web 1 lần).');
    const until = Math.max(Date.now(), Number((u.buys || {})[k]) || 0) + MONTH;
    await updateDoc(doc(db, 'users', u.uid), { ['buys.' + k]: until }); (u.buys = u.buys || {})[k] = until; toast('Đã mở ' + COURSES[k] + ' cho ' + em + ' đến ' + vd(until)); paintBuys();
  };
}
function paintPlans() {
  const now = Date.now(), L = USERS.filter(u => u.role === 'pro').map(u => ({ u, until: Number(u.proUntil) || 0 })).sort((a, b) => b.until - a.until);
  const act = L.filter(x => x.until > now);
  $('view').innerHTML = '<p class="hint"><b>' + act.length + '</b> tài khoản Pro / Astra đang còn hạn (' + act.filter(x => x.u.tier !== 'pro').length + ' Astra, ' + act.filter(x => x.u.tier === 'pro').length + ' Pro). Đổi gói / gia hạn chi tiết vẫn làm ở 👑 Tài khoản trên trang chủ.</p><div class="bar"><input id="q" placeholder="Lọc theo email / tên…"></div>' +
    '<table><thead><tr><th>Người dùng</th><th>Gói</th><th>Hết hạn</th></tr></thead><tbody>' + L.map(x => { const d = Math.ceil((x.until - now) / DAY); return '<tr data-s="' + esc(((x.u.name || '') + ' ' + (x.u.email || '')).toLowerCase()) + '"><td><b>' + esc(x.u.name || '') + '</b><br><small style="color:#6B6B78">' + esc(x.u.email || x.u.uid) + '</small></td><td>' + (x.u.tier === 'pro' ? 'Pro' : 'Astra') + '</td><td>' + vd(x.until) + ' <span class="pill ' + (d < 0 ? 'bad' : d <= 5 ? 'warn' : 'ok') + '">' + (d < 0 ? 'hết hạn' : 'còn ' + d + ' ngày') + '</span></td></tr>'; }).join('') + '</tbody></table>';
  $('q').oninput = e => { const v = e.target.value.trim().toLowerCase(); document.querySelectorAll('tr[data-s]').forEach(c => c.style.display = !v || c.dataset.s.includes(v) ? '' : 'none'); };
}
async function paint() {
  $('view').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    if (tab === 'pend') { await loadOrders(); paintPend(); }
    else if (tab === 'pay') { await loadPays(); paintPay(); }
    else { await loadUsers(); tab === 'buys' ? paintBuys() : paintPlans(); }
  } catch (e) { $('view').innerHTML = '<div class="empty">Lỗi tải dữ liệu: ' + esc(e.message) + '</div>'; }
}
$('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); paint(); };
$('view').addEventListener('click', async e => {
  const ap = e.target.closest('[data-ap]'), as = e.target.closest('[data-assign]'), ex = e.target.closest('[data-ext]'), rm = e.target.closest('[data-rm]');
  try {
    if (ap) {
      const o = ORD.find(x => x.code === ap.dataset.ap);
      if (!confirm('Duyệt đơn ' + o.code + ' cho ' + (o.name || o.email) + ':\n' + what(o) + ' · ' + money(o.amount) + '\n\nChỉ duyệt khi bạn đã thấy tiền vào với mã này.')) return;
      ap.disabled = true; const r = await approve(o.code); toast('Đã duyệt: ' + r); USERS = null; await loadOrders(); paintPend();
    } else if (as) {
      const code = (document.querySelector('[data-code="' + as.dataset.assign + '"]').value || '').trim().toUpperCase();
      if (!/^NI[A-Z0-9]{8}$/.test(code)) return toast('Mã đơn dạng NI + 8 ký tự, vd NIAB12CD34');
      if (!confirm('Gán khoản tiền này cho đơn ' + code + ' và duyệt?')) return;
      as.disabled = true; const r = await approve(code, 'gán từ giao dịch ' + as.dataset.assign);
      await updateDoc(doc(db, 'payments', as.dataset.assign), { matched: true, code, result: r, manual: true }); toast('Đã duyệt: ' + r); await loadPays(); paintPay();
    } else if (ex) {
      const [uid, k] = ex.dataset.ext.split('|'), u = USERS.find(x => x.uid === uid), until = Math.max(Date.now(), Number(u.buys[k]) || 0) + MONTH;
      await updateDoc(doc(db, 'users', uid), { ['buys.' + k]: until }); u.buys[k] = until; toast('Đã gia hạn đến ' + vd(until)); paintBuys();
    } else if (rm) {
      const [uid, k] = rm.dataset.rm.split('|'); if (!confirm('Gỡ quyền khoá ' + (COURSES[k] || k) + ' của người này?')) return;
      await updateDoc(doc(db, 'users', uid), { ['buys.' + k]: deleteField() }); delete USERS.find(x => x.uid === uid).buys[k]; toast('Đã gỡ'); paintBuys();
    }
  } catch (err) { toast('Lỗi: ' + err.message); }
});
onAuthStateChanged(auth, async u => {
  if (!u) { $('view').innerHTML = '<div class="empty">Đăng nhập tài khoản giáo viên ở trang chủ trước nhé.</div>'; return; }
  const me = await getDoc(doc(db, 'users', u.uid));
  if (!me.exists() || me.data().role !== 'admin') { $('view').innerHTML = '<div class="empty">Trang này chỉ dành cho giáo viên.</div>'; return; }
  paint();
});
</script>
</body>
</html>
