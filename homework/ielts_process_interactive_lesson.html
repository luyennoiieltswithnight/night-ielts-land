<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Task 1: Process Master</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes bounceShort { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .animate-bounce-short { animation: bounceShort 0.3s ease-in-out 2; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVGs Icons ---
        const IconCheckCircle = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconXCircle = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>;
        const IconBookOpen = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const IconListOrdered = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>;
        const IconAlignLeft = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="21" y1="6" x2="3" y2="6"></line><line x1="15" y1="12" x2="3" y2="12"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>;
        const IconAward = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>;
        const IconInfo = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconArrowDown = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;

        const PROCESS_DATA = {
            title: "The diagram below shows how to recycle plastic bottles",
            image: "https://lh3.googleusercontent.com/d/1M3TF7j5QBf4Q3qbvRbW2JixEFnHky_Aa", 
            
            vocabulary: [
                { word: "First and foremost / Initially / At the beginning of the process", type: "sequencing", meaning: "Đầu tiên và quan trọng nhất (dùng cho bước 1)" },
                { word: "Subsequently / Then / Next", type: "sequencing", meaning: "Sau đó, tiếp theo (dùng cho các bước giữa)" },
                { word: "Following this / After that / In the subsequent stage", type: "sequencing", meaning: "Tiếp theo điều này (dùng cho các bước giữa)" },
                { word: "Once [V3/ed] / After being [V3/ed]", type: "sequencing", meaning: "Một khi đã được... / Sau khi được... (rút gọn mệnh đề)" },
                { word: "Finally / Lastly / In the final stage", type: "sequencing", meaning: "Cuối cùng (dùng cho bước cuối)" },
                { word: "To be collected / To be gathered", type: "topic", meaning: "Được thu gom" },
                { word: "To be transported / To be delivered / To be taken to", type: "topic", meaning: "Được vận chuyển / đưa đến" },
                { word: "To be sorted / To be separated / To be categorized", type: "topic", meaning: "Được phân loại" },
                { word: "To be compressed / To be compacted / To be pressed into blocks", type: "topic", meaning: "Được nén thành các khối" },
                { word: "To be crushed / To be broken into small pieces / To be ground", type: "topic", meaning: "Được nghiền nát / đập vụn" },
                { word: "To be washed / To be cleaned / To be rinsed", type: "topic", meaning: "Được rửa sạch" },
                { word: "To be processed into / To be transformed into", type: "topic", meaning: "Được chế biến/chuyển hóa thành" },
                { word: "To be heated / To be melted", type: "topic", meaning: "Được đun nóng / nung chảy" },
                { word: "To be manufactured / To be produced / To be created", type: "topic", meaning: "Được sản xuất / tạo ra" }
            ],
            
            overviewQuestions: [
                { question: "How many main stages are there in this process?", options: ["7 stages", "8 stages", "9 stages"], answer: "9 stages" },
                { question: "What is the initial step?", options: ["Compressing into blocks", "Throwing bottles into designated bins", "Sorting at the center"], answer: "Throwing bottles into designated bins" },
                { question: "What is the final outcome?", options: ["Producing raw materials", "Producing end products (clothes, boxes)", "Washing the pellets"], answer: "Producing end products (clothes, boxes)" }
            ],
            
            overviewSort: {
                vietnamese: "Nhìn chung, có 9 bước chính trong quy trình tuần hoàn này, bắt đầu bằng việc vứt rác thải nhựa và kết thúc bằng việc sản xuất ra các sản phẩm mới.",
                chunks: [
                    { id: 'o1', text: "Overall, it is clear that" },
                    { id: 'o2', text: "this cyclical process" },
                    { id: 'o3', text: "comprises nine distinct stages," },
                    { id: 'o4', text: "commencing with" },
                    { id: 'o5', text: "the disposal of plastic waste" },
                    { id: 'o6', text: "and culminating in" },
                    { id: 'o7', text: "the production of newly manufactured items." }
                ],
                correctOrder: ['o1', 'o2', 'o3', 'o4', 'o5', 'o6', 'o7']
            },

            grammarQuiz: [
                {
                    question: "Trong Writing Task 1 Process (Quy trình sản xuất), chúng ta ưu tiên sử dụng thì và thể nào?",
                    options: [
                        "Thì hiện tại tiếp diễn - Thể chủ động (is sorting)",
                        "Thì hiện tại đơn - Thể bị động (is/are sorted)",
                        "Thì quá khứ đơn - Thể bị động (was/were sorted)"
                    ],
                    answer: "Thì hiện tại đơn - Thể bị động (is/are sorted)",
                    explanation: "Đúng! Quy trình là một sự thật hiển nhiên (Hiện tại đơn). Trong quy trình công nghiệp, vật liệu (chai nhựa) nhận hành động là chính, người thực hiện không quan trọng (Bị động)."
                }
            ],

            body1Sentences: [
                {
                    id: "s1",
                    vietnamese: "Câu 1 (Bước 1 & 2): Bắt đầu quy trình, mọi người vứt chai nhựa đã qua sử dụng vào thùng rác. Sau đó, xe chở rác thu gom rác này và vận chuyển nó đến một trung tâm tái chế.",
                    chunks: [
                        { id: 'c1', text: "At the beginning of the process," },
                        { id: 'c2', text: "individuals throw their used plastic bottles" },
                        { id: 'c3', text: "into designated recycling bins." },
                        { id: 'c4', text: "Subsequently," },
                        { id: 'c5', text: "a garbage truck collects this rubbish" },
                        { id: 'c6', text: "and transports it to a specialized center." }
                    ],
                    correctOrder: ['c1', 'c2', 'c3', 'c4', 'c5', 'c6']
                },
                {
                    id: "s2",
                    vietnamese: "Câu 2 (Bước 3 & 4): Ngay khi đến nơi, rác thải trải qua giai đoạn phân loại trước khi được nén thành các khối rắn, lớn.",
                    chunks: [
                        { id: 'c1', text: "Upon arrival," },
                        { id: 'c2', text: "the waste undergoes a sorting phase" },
                        { id: 'c3', text: "before being compressed" },
                        { id: 'c4', text: "into large, solid blocks." }
                    ],
                    correctOrder: ['c1', 'c2', 'c3', 'c4']
                }
            ],

            body2Sentences: [
                {
                    id: "s1",
                    vietnamese: "Câu 1 (Bước 5 & 6): Ở giai đoạn tiếp theo, những khối này được nghiền thành những mảnh nhỏ hơn, thứ mà sau đó được rửa sạch và chế biến để sản xuất hạt nhựa.",
                    chunks: [
                        { id: 'c1', text: "In the next stage of the procedure," },
                        { id: 'c2', text: "these blocks are crushed into smaller pieces," },
                        { id: 'c3', text: "which are then washed" },
                        { id: 'c4', text: "and processed to produce plastic pellets." }
                    ],
                    correctOrder: ['c1', 'c2', 'c3', 'c4']
                },
                {
                    id: "s2",
                    vietnamese: "Câu 2 (Bước 7, 8, 9): Cuối cùng, những hạt này được nung nóng để tạo thành nguyên liệu thô, thứ mà được sử dụng để sản xuất nhiều loại sản phẩm cuối cùng như quần áo và túi xách.",
                    chunks: [
                        { id: 'c1', text: "Finally," },
                        { id: 'c2', text: "these pellets are heated to form a raw material," },
                        { id: 'c3', text: "which is utilized to manufacture" },
                        { id: 'c4', text: "a variety of end products" },
                        { id: 'c5', text: "such as clothing and bags." }
                    ],
                    correctOrder: ['c1', 'c2', 'c3', 'c4', 'c5']
                }
            ],

            sampleEssay: `The provided diagram illustrates the step-by-step process of recycling plastic bottles.

<span class="bg-yellow-200 px-1 rounded font-semibold group relative cursor-help">Overall, it is clear that<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Cụm từ nối để bắt đầu đoạn Overview rất tự nhiên.</span></span> this cyclical process comprises nine distinct stages, <span class="bg-green-200 px-1 rounded font-semibold group relative cursor-help">commencing with<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Từ vựng ăn điểm thay cho 'starting with' (V-ing phrase chỉ nguyên nhân/kết quả).</span></span> the disposal of plastic waste and <span class="bg-green-200 px-1 rounded font-semibold group relative cursor-help">culminating in<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Từ vựng ăn điểm thay cho 'ending with'.</span></span> the production of various newly manufactured items.

<span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">At the beginning of the process<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Sequencing phrase mở đầu đoạn Body 1.</span></span>, individuals throw their used plastic bottles into designated recycling bins. <span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">Subsequently<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Trạng từ chỉ trình tự: Sau đó.</span></span>, a garbage truck collects this rubbish and <span class="bg-purple-200 px-1 rounded font-semibold group relative cursor-help">transports it to<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Collocation: Vận chuyển đến.</span></span> a specialized recycling center. <span class="bg-yellow-200 px-1 rounded font-semibold group relative cursor-help">Upon arrival<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Cấu trúc giới từ + Noun: Ngay khi đến nơi (Thay cho 'when it arrives').</span></span>, the waste undergoes a sorting phase where workers manually separate the plastic items on a conveyor belt. <span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">Following this sorting stage<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Cụm từ nối tiếp nối ý rất chặt chẽ.</span></span>, the sorted bottles are <span class="bg-purple-200 px-1 rounded font-semibold group relative cursor-help">compressed into large, solid blocks<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-64 z-10">Vocabulary topic: Nén thành các khối lớn, rắn.</span></span> to facilitate easier handling in the next phases.

<span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">In the next stage of the procedure<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Mở đầu Body 2, chuyển tiếp mượt mà.</span></span>, these blocks are fed into a machine to be <span class="bg-purple-200 px-1 rounded font-semibold group relative cursor-help">crushed into smaller pieces<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Vocabulary topic: Nghiền thành mảnh nhỏ.</span></span>, <span class="bg-yellow-200 px-1 rounded font-semibold group relative cursor-help">which are then washed<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Mệnh đề quan hệ (Relative Clause) - Ngữ pháp ăn điểm phức tạp.</span></span> thoroughly in a water tank. <span class="bg-yellow-200 px-1 rounded font-semibold group relative cursor-help">Once cleaned<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Cấu trúc rút gọn mệnh đề trạng ngữ (Khi đã được làm sạch) thay cho 'After they are cleaned'.</span></span>, the crushed plastic is processed to produce plastic pellets. These pellets are then heated to form a raw material, which is formed into large rolls. <span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">Finally<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Chỉ bước cuối cùng.</span></span>, this newly created raw material is utilized to <span class="bg-purple-200 px-1 rounded font-semibold group relative cursor-help">manufacture a variety of end products<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Collocation: Sản xuất nhiều loại sản phẩm cuối cùng.</span></span>, <span class="bg-blue-200 px-1 rounded font-semibold group relative cursor-help">such as<span class="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-8 left-0 w-48 z-10">Đưa ra ví dụ cụ thể để làm rõ ý.</span></span> clothing, bags, and donation boxes.`
        };

        const GuideCard = ({ title, children }) => (
            <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg mb-6 shadow-sm">
                <h4 className="font-bold text-blue-900 flex items-center mb-2">
                    <IconInfo className="mr-2 text-blue-600" size={20} /> {title}
                </h4>
                <div className="text-blue-800 text-sm space-y-2">
                    {children}
                </div>
            </div>
        );

        const InteractiveSortBuilder = ({ data, onComplete }) => {
            const [selectedChunks, setSelectedChunks] = useState([]);
            const [isCorrect, setIsCorrect] = useState(null);
            const [shuffledChunks, setShuffledChunks] = useState([]);

            useEffect(() => {
                const array = [...data.chunks];
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                setShuffledChunks(array);
                setSelectedChunks([]);
                setIsCorrect(null);
            }, [data]);

            const handleSelectChunk = (chunk) => {
                if (!selectedChunks.find(c => c.id === chunk.id)) {
                    const newSelection = [...selectedChunks, chunk];
                    setSelectedChunks(newSelection);
                    
                    if (newSelection.length === data.chunks.length) {
                        const isOrderCorrect = newSelection.every((c, idx) => c.id === data.correctOrder[idx]);
                        setIsCorrect(isOrderCorrect);
                        if (isOrderCorrect && onComplete) onComplete();
                    } else {
                        setIsCorrect(null);
                    }
                }
            };

            const handleRemoveChunk = (chunk) => {
                setSelectedChunks(selectedChunks.filter(c => c.id !== chunk.id));
                setIsCorrect(null);
            };

            return (
                <div className="mt-3">
                    <p className="text-gray-700 italic mb-3 bg-white p-3 rounded border-l-4 border-indigo-400 text-sm shadow-sm">
                        Dịch ý: <span className="font-semibold">"{data.vietnamese}"</span>
                    </p>
                    <div className="min-h-[60px] bg-indigo-50 border-2 border-dashed border-indigo-300 rounded-lg p-3 flex flex-wrap gap-2 items-center mb-3 transition-all">
                        {selectedChunks.length === 0 && <span className="text-gray-400 italic text-sm">Click vào các cụm từ bên dưới để ghép câu...</span>}
                        {selectedChunks.map(chunk => (
                            <span 
                                key={chunk.id} 
                                onClick={() => handleRemoveChunk(chunk)}
                                className="bg-indigo-600 text-white px-3 py-1.5 rounded-md shadow cursor-pointer hover:bg-red-500 transition flex items-center text-sm"
                                title="Click to remove"
                            >
                                {chunk.text}
                            </span>
                        ))}
                    </div>

                    {isCorrect === true && (
                        <div className="p-2 bg-green-100 text-green-800 rounded-md mb-3 flex items-center text-sm font-medium animate-bounce-short">
                            <IconCheckCircle className="mr-2" size={18} /> Chính xác! 
                        </div>
                    )}
                    {isCorrect === false && (
                        <div className="p-2 bg-red-100 text-red-800 rounded-md mb-3 flex items-center text-sm font-medium">
                            <IconXCircle className="mr-2" size={18} /> Chưa đúng thứ tự. Click vào cụm từ bên trên để gỡ ra xếp lại.
                        </div>
                    )}

                    <div className="flex flex-wrap gap-2">
                        {shuffledChunks.filter(c => !selectedChunks.find(sc => sc.id === c.id)).map(chunk => (
                            <button
                                key={chunk.id}
                                onClick={() => handleSelectChunk(chunk)}
                                disabled={isCorrect}
                                className={`bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-md shadow-sm hover:bg-gray-50 hover:border-indigo-400 transition text-sm ${isCorrect ? 'opacity-50 cursor-not-allowed' : ''}`}
                            >
                                {chunk.text}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const VocabularySection = () => (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 animate-fade-in">
                <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <IconBookOpen className="mr-2 text-indigo-600" size={24} /> 1. Vocabulary & Synonyms
                </h3>
                <p className="text-gray-600 mb-4 text-sm">Mở rộng vốn từ với các từ đồng nghĩa (synonyms) để tránh lặp từ trong bài thi. <strong>Di chuột (Hover) vào từ để xem nghĩa.</strong></p>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <h4 className="font-semibold text-purple-700 mb-2 border-b pb-1">Từ nối (Sequencing Words)</h4>
                        <ul className="space-y-2">
                            {PROCESS_DATA.vocabulary.filter(v => v.type === 'sequencing').map((v, idx) => (
                                <li key={idx} className="group relative bg-purple-50 p-2 rounded cursor-help border border-purple-100 hover:bg-purple-100 transition text-sm">
                                    <span className="font-medium text-purple-900 block">{v.word}</span>
                                    <div className="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-10 left-0 w-64 z-10 shadow-lg pointer-events-none">
                                        {v.meaning}
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-semibold text-green-700 mb-2 border-b pb-1">Động từ Chủ đề (Topic Verbs)</h4>
                        <ul className="space-y-2">
                            {PROCESS_DATA.vocabulary.filter(v => v.type === 'topic').map((v, idx) => (
                                <li key={idx} className="group relative bg-green-50 p-2 rounded cursor-help border border-green-100 hover:bg-green-100 transition text-sm">
                                    <span className="font-medium text-green-900 block">{v.word}</span>
                                    <div className="absolute hidden group-hover:block bg-gray-800 text-white text-xs p-2 rounded -top-10 left-0 w-64 z-10 shadow-lg pointer-events-none">
                                        {v.meaning}
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            </div>
        );

        const OverviewSection = () => {
            const [quizAnswers, setQuizAnswers] = useState({});
            const [showQuizResult, setShowQuizResult] = useState(false);
            
            const handleQuizChange = (qIndex, option) => setQuizAnswers({...quizAnswers, [qIndex]: option});
            const checkQuiz = () => setShowQuizResult(true);

            const isQuizPerfect = Object.keys(quizAnswers).length === PROCESS_DATA.overviewQuestions.length && 
                PROCESS_DATA.overviewQuestions.every((q, idx) => quizAnswers[idx] === q.answer);

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 animate-fade-in">
                    <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                        <IconListOrdered className="mr-2 text-indigo-600" size={24} /> 2. Master the Overview
                    </h3>
                    
                    <GuideCard title="Chiến thuật viết Overview cho dạng Process:">
                        <ul className="list-disc pl-5">
                            <li><strong>Nguyên tắc 1:</strong> Không mô tả chi tiết, chỉ tóm tắt bức tranh toàn cảnh.</li>
                            <li><strong>Nguyên tắc 2:</strong> Phải nêu được <strong>Tổng số bước (Total stages)</strong>.</li>
                            <li><strong>Nguyên tắc 3:</strong> Phải nêu được <strong>Bước bắt đầu (Starts with)</strong> và <strong>Bước kết thúc (Ends with)</strong>.</li>
                        </ul>
                    </GuideCard>

                    <div className="mb-6 bg-slate-50 p-5 rounded-lg border border-slate-200">
                        <h4 className="font-semibold text-slate-800 mb-3 text-lg">Bước 1: Phân tích biểu đồ</h4>
                        <p className="text-sm text-gray-600 mb-4">Hoàn thành 3 câu hỏi sau để rút ra ý chính cho Overview.</p>
                        {PROCESS_DATA.overviewQuestions.map((q, qIndex) => (
                            <div key={qIndex} className="mb-4">
                                <p className="font-medium text-gray-800 mb-2">{qIndex + 1}. {q.question}</p>
                                <div className="flex flex-col space-y-2">
                                    {q.options.map((opt, oIndex) => {
                                        const isSelected = quizAnswers[qIndex] === opt;
                                        const isCorrectAns = q.answer === opt;
                                        let btnClass = "text-left px-4 py-2 rounded-md border transition text-sm md:text-base ";
                                        
                                        if (showQuizResult) {
                                            if (isSelected && isCorrectAns) btnClass += "bg-green-100 border-green-500 text-green-800 font-medium";
                                            else if (isSelected && !isCorrectAns) btnClass += "bg-red-100 border-red-500 text-red-800";
                                            else if (!isSelected && isCorrectAns) btnClass += "bg-green-50 border-green-300 text-green-700";
                                            else btnClass += "bg-white border-gray-200 text-gray-500";
                                        } else {
                                            btnClass += isSelected ? "bg-indigo-100 border-indigo-400 text-indigo-900" : "bg-white border-gray-300 hover:bg-gray-50 text-gray-700";
                                        }

                                        return (
                                            <button key={oIndex} onClick={() => handleQuizChange(qIndex, opt)} disabled={showQuizResult} className={btnClass}>
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                        {!showQuizResult && (
                            <button onClick={checkQuiz} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-md font-medium transition mt-2 shadow-sm">
                                Kiểm tra đáp án
                            </button>
                        )}
                    </div>

                    {showQuizResult && isQuizPerfect && (
                        <div className="bg-indigo-50/50 p-5 rounded-lg border border-indigo-100 animate-fade-in mt-6">
                            <h4 className="font-semibold text-indigo-900 mb-3 text-lg flex items-center">
                                Bước 2: Xếp từ thành câu Overview <IconArrowDown size={18} className="ml-2"/>
                            </h4>
                            <InteractiveSortBuilder data={PROCESS_DATA.overviewSort} />
                        </div>
                    )}
                </div>
            );
        };

        const BodySection = () => {
            const [grammarAnswers, setGrammarAnswers] = useState({});
            const [showGrammarResult, setShowGrammarResult] = useState(false);
            const [activeSentenceIndex1, setActiveSentenceIndex1] = useState(0);
            const [activeSentenceIndex2, setActiveSentenceIndex2] = useState(0);

            const handleGrammarChange = (qIndex, option) => setGrammarAnswers({...grammarAnswers, [qIndex]: option});
            const checkGrammar = () => setShowGrammarResult(true);

            const isGrammarPerfect = Object.keys(grammarAnswers).length === PROCESS_DATA.grammarQuiz.length && 
                PROCESS_DATA.grammarQuiz.every((q, idx) => grammarAnswers[idx] === q.answer);

            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 animate-fade-in">
                    <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                        <IconAlignLeft className="mr-2 text-indigo-600" size={24} /> 3. Writing Body Paragraphs
                    </h3>

                    <GuideCard title="Chiến thuật viết Body cho Process:">
                        <ul className="list-disc pl-5">
                            <li><strong>Ngữ pháp cốt lõi:</strong> Bắt buộc dùng <strong>Câu Bị Động (Passive Voice)</strong> vì quy trình công nghiệp thì đối tượng chịu tác động (chai nhựa) quan trọng hơn người làm. Cấu trúc: <code>is/are + V3/ed</code>.</li>
                            <li><strong>Mạch lạc (Coherence):</strong> Luôn bắt đầu mỗi bước bằng các từ nối trình tự (First, Next, Then, After that, Finally).</li>
                            <li><strong>Phân đoạn:</strong> Nên chia làm 2 đoạn (Body 1: Thu gom & Sơ chế; Body 2: Xử lý sâu & Ra thành phẩm).</li>
                        </ul>
                    </GuideCard>

                    <div className="mb-6 bg-yellow-50 p-5 rounded-lg border border-yellow-200">
                        <h4 className="font-semibold text-yellow-900 mb-3 text-lg">Khởi động: Ôn tập Ngữ Pháp</h4>
                        {PROCESS_DATA.grammarQuiz.map((q, qIndex) => (
                            <div key={qIndex} className="mb-4">
                                <p className="font-medium text-gray-800 mb-2">{qIndex + 1}. {q.question}</p>
                                <div className="flex flex-col space-y-2">
                                    {q.options.map((opt, oIndex) => {
                                        const isSelected = grammarAnswers[qIndex] === opt;
                                        const isCorrectAns = q.answer === opt;
                                        let btnClass = "text-left px-4 py-2 rounded-md border transition text-sm ";
                                        
                                        if (showGrammarResult) {
                                            if (isSelected && isCorrectAns) btnClass += "bg-green-100 border-green-500 text-green-800";
                                            else if (isSelected && !isCorrectAns) btnClass += "bg-red-100 border-red-500 text-red-800";
                                            else if (!isSelected && isCorrectAns) btnClass += "bg-green-50 border-green-300 text-green-700";
                                            else btnClass += "bg-white border-gray-200 text-gray-400";
                                        } else {
                                            btnClass += isSelected ? "bg-yellow-200 border-yellow-400 text-yellow-900" : "bg-white border-gray-300 hover:bg-gray-50 text-gray-700";
                                        }

                                        return (
                                            <button key={oIndex} onClick={() => handleGrammarChange(qIndex, opt)} disabled={showGrammarResult} className={btnClass}>
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                                {showGrammarResult && grammarAnswers[qIndex] === q.answer && (
                                    <p className="mt-2 text-sm text-green-700 bg-green-50 p-2 rounded border border-green-200"><IconInfo size={16} className="inline mr-1"/>{q.explanation}</p>
                                )}
                            </div>
                        ))}
                        {!showGrammarResult && (
                            <button onClick={checkGrammar} className="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded-md font-medium transition mt-2 shadow-sm">
                                Chốt đáp án
                            </button>
                        )}
                    </div>

                    {showGrammarResult && isGrammarPerfect && (
                        <div className="space-y-6 animate-fade-in mt-8 border-t pt-6">
                            <h4 className="font-bold text-xl text-slate-800">Thực hành Viết Body</h4>
                            
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                <h5 className="font-bold text-indigo-800 mb-4 text-lg border-b pb-2">Body Paragraph 1: Từ thu gom đến đóng khối (Steps 1-4)</h5>
                                {PROCESS_DATA.body1Sentences.map((sentence, idx) => (
                                    <div key={idx} className={`transition-all duration-500 ${idx <= activeSentenceIndex1 ? 'opacity-100' : 'opacity-50 pointer-events-none hidden'}`}>
                                        <InteractiveSortBuilder 
                                            data={sentence} 
                                            onComplete={() => { if (idx === activeSentenceIndex1 && idx < PROCESS_DATA.body1Sentences.length - 1) setActiveSentenceIndex1(idx + 1); }} 
                                        />
                                        {idx < PROCESS_DATA.body1Sentences.length - 1 && idx === activeSentenceIndex1 && <div className="my-4 border-b border-dashed border-gray-300"></div>}
                                    </div>
                                ))}
                            </div>

                            {activeSentenceIndex1 === PROCESS_DATA.body1Sentences.length - 1 && (
                               <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 animate-fade-in">
                                    <h5 className="font-bold text-indigo-800 mb-4 text-lg border-b pb-2">Body Paragraph 2: Từ xử lý sâu đến thành phẩm (Steps 5-9)</h5>
                                    {PROCESS_DATA.body2Sentences.map((sentence, idx) => (
                                        <div key={idx} className={`transition-all duration-500 ${idx <= activeSentenceIndex2 ? 'opacity-100' : 'opacity-50 pointer-events-none hidden'}`}>
                                            <InteractiveSortBuilder 
                                                data={sentence} 
                                                onComplete={() => { if (idx === activeSentenceIndex2 && idx < PROCESS_DATA.body2Sentences.length - 1) setActiveSentenceIndex2(idx + 1); }} 
                                            />
                                            {idx < PROCESS_DATA.body2Sentences.length - 1 && idx === activeSentenceIndex2 && <div className="my-4 border-b border-dashed border-gray-300"></div>}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const SampleEssay = () => (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-6 animate-fade-in">
                <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center">
                    <IconAward className="mr-2 text-indigo-600" size={24} /> 4. Full Sample Essay (Band 8.0+)
                </h3>
                <p className="text-gray-600 mb-4 text-sm">Đọc bài mẫu hoàn chỉnh dưới đây. <strong>Di chuột qua các phần được tô màu</strong> để xem giải thích chi tiết về từ vựng và cấu trúc ngữ pháp "ăn điểm".</p>
                
                <div className="bg-slate-50 p-6 rounded-lg border border-slate-200 text-slate-800 leading-relaxed text-lg font-serif whitespace-pre-wrap shadow-inner" dangerouslySetInnerHTML={{__html: PROCESS_DATA.sampleEssay}}>
                </div>
                
                <div className="mt-5 flex flex-wrap gap-4 text-sm text-gray-600 justify-center">
                    <span className="flex items-center"><span className="w-4 h-4 bg-yellow-200 inline-block mr-2 rounded border border-yellow-300"></span> Ngữ pháp/Cấu trúc hay</span>
                    <span className="flex items-center"><span className="w-4 h-4 bg-green-200 inline-block mr-2 rounded border border-green-300"></span> Từ vựng Paraphrase</span>
                    <span className="flex items-center"><span className="w-4 h-4 bg-blue-200 inline-block mr-2 rounded border border-blue-300"></span> Từ nối (Sequencing)</span>
                    <span className="flex items-center"><span className="w-4 h-4 bg-purple-200 inline-block mr-2 rounded border border-purple-300"></span> Cụm từ (Collocations)</span>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div>
                    <header className="bg-gradient-to-r from-slate-900 to-indigo-900 text-white p-6 shadow-lg sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight">IELTS Writing Task 1: Process Master</h1>
                                <p className="text-indigo-200 text-sm mt-1">Interactive Lesson - Recycling Plastic Bottles</p>
                            </div>
                            <div className="hidden md:flex space-x-2">
                                <span className="bg-white/10 border border-white/20 px-3 py-1 rounded-full text-xs backdrop-blur-sm">Target: Band 7.0+</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 mt-6">
                        
                        {/* Left Column: Image Reference (Sticky) */}
                        <div className="lg:col-span-5 relative">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 lg:sticky lg:top-28">
                                <h2 className="font-bold text-slate-800 mb-3 text-center text-lg flex items-center justify-center">
                                    <IconBookOpen size={20} className="mr-2 text-indigo-500"/> Reference Diagram
                                </h2>
                                <div className="bg-slate-50 p-2 rounded-xl border border-slate-100">
                                    <img 
                                        src={PROCESS_DATA.image} 
                                        alt="Recycling Process Diagram" 
                                        className="w-full h-auto rounded-lg shadow-sm"
                                        onError={(e) => {
                                            e.target.onerror = null; 
                                            e.target.src = "https://placehold.co/600x400/f8fafc/64748b?text=Image+Loading+Failed";
                                        }}
                                    />
                                </div>
                                <p className="text-xs text-center text-slate-500 mt-4 px-4 bg-slate-50 py-2 rounded-lg">Cuộn các bài tập ở bên phải và luôn đối chiếu với biểu đồ này.</p>
                            </div>
                        </div>

                        {/* Right Column: Interactive Exercises */}
                        <div className="lg:col-span-7 space-y-2">
                            <VocabularySection />
                            <OverviewSection />
                            <BodySection />
                            <SampleEssay />
                        </div>
                    </main>
                </div>
            );
        };

        // Render the app using Babel standard method
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
