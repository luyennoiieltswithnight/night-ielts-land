<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindset Foundation | Unit 01</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { 
                        brand: { 
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            300: '#86efac', 400: '#4ade80', 500: '#22c55e', 
                            600: '#16a34a', 700: '#15803d', 900: '#14532d' 
                        } 
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#dcfce7 1px, transparent 1px);
            background-size: 24px 24px;
            color: #334155;
            min-height: 100vh;
        }
        .mission-card { background: rgba(255,255,255,0.95); border-radius: 24px; box-shadow: 0 10px 30px -10px rgba(22, 163, 74, 0.15); border: 1px solid #bbf7d0; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #dcfce7; }
        
        /* 3D Flashcards */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-x-180 { transform: rotateX(180deg); }
        .flip-transition { transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #86efac; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4ade80; }
    </style>
</head>
<body class="font-sans antialiased pb-20">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- SVG ICONS ---
        const Icons = {
            Check: () => <svg className="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>,
            Book: () => <svg className="w-6 h-6 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
        };

        // --- GAME ENGINES ---

        // 1. FLASHCARD ENGINE
        const FlashcardEngine = ({ words }) => {
            return (
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 my-4">
                    {words.map((item, idx) => {
                        const [flipped, setFlipped] = useState(false);
                        return (
                            <div key={idx} onClick={() => setFlipped(!flipped)} className="w-full h-24 perspective-1000 cursor-pointer group">
                                <div className={`relative w-full h-full transform-style-3d flip-transition rounded-xl shadow-sm ${flipped ? 'rotate-x-180' : ''}`}>
                                    <div className="absolute w-full h-full backface-hidden bg-brand-50 border border-brand-200 rounded-xl flex items-center justify-center p-2 text-center group-hover:border-brand-400">
                                        <span className="font-bold text-slate-700">{item.en}</span>
                                    </div>
                                    <div className="absolute w-full h-full backface-hidden bg-brand-500 text-white rounded-xl flex items-center justify-center p-2 text-center rotate-x-180">
                                        <span className="font-bold text-sm">{item.vi}</span>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // 2. MATCHING ENGINE
        const MatchEngine = ({ pairs }) => {
            const [matches, setMatches] = useState([]);
            const [selectedLeft, setSelectedLeft] = useState(null);
            
            const [leftList] = useState(() => [...pairs].map(p => ({id: p.id, text: p.left})));
            const [rightList] = useState(() => [...pairs].sort(() => Math.random() - 0.5).map(p => ({id: p.id, text: p.right})));

            const handleRightClick = (id) => {
                if (!selectedLeft) return;
                if (selectedLeft === id) {
                    setMatches([...matches, id]);
                    setSelectedLeft(null);
                } else {
                    setSelectedLeft(null); 
                }
            };

            return (
                <div className="grid grid-cols-2 gap-4 my-4">
                    <div className="flex flex-col gap-2">
                        {leftList.map(item => {
                            const isMatched = matches.includes(item.id);
                            return (
                                <button key={'L'+item.id} disabled={isMatched} onClick={() => setSelectedLeft(item.id)}
                                    className={`p-3 text-sm font-bold rounded-xl border-2 text-left transition-all
                                    ${isMatched ? 'bg-slate-50 text-slate-300 border-slate-100' : 
                                      selectedLeft === item.id ? 'bg-brand-600 text-white border-brand-600 shadow-md' : 'bg-white text-slate-700 border-slate-200 hover:border-brand-300'}`}>
                                    {item.text}
                                </button>
                            );
                        })}
                    </div>
                    <div className="flex flex-col gap-2">
                        {rightList.map(item => {
                            const isMatched = matches.includes(item.id);
                            return (
                                <button key={'R'+item.id} disabled={isMatched} onClick={() => handleRightClick(item.id)}
                                    className={`p-3 text-sm font-bold rounded-xl border-2 text-center transition-all
                                    ${isMatched ? 'bg-brand-500 text-white border-brand-500' : 'bg-brand-50 text-brand-900 border-brand-200 hover:bg-brand-100'}`}>
                                    {item.text}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // 3. INLINE CHOICE ENGINE
        const InlineChoiceEngine = ({ textParts, options, correctIndex }) => {
            const [selected, setSelected] = useState(null);
            const [isCorrect, setIsCorrect] = useState(false);

            const handleSelect = (index) => {
                if (isCorrect) return;
                setSelected(index);
                if (index === correctIndex) {
                    setIsCorrect(true);
                } else {
                    setIsCorrect(false);
                }
            };

            return (
                <div className="my-3 p-5 bg-white rounded-2xl border border-slate-200 shadow-sm">
                    <p className="text-lg text-slate-700 leading-relaxed font-medium mb-4">
                        {textParts[0]}
                        <span className="inline-block mx-2">
                            {selected === null ? "_______" : (
                                <span className={`font-bold px-3 py-1 rounded-lg border-2 ${isCorrect ? 'bg-brand-50 border-brand-500 text-brand-700' : 'bg-red-50 border-red-400 text-red-600'}`}>
                                    {options[selected]}
                                </span>
                            )}
                        </span>
                        {textParts[1]}
                    </p>
                    <div className="flex flex-wrap gap-2">
                        {options.map((opt, idx) => {
                            let btnStyle = "bg-slate-50 text-slate-600 border-slate-200 hover:border-brand-400";
                            if (selected === idx) {
                                btnStyle = isCorrect ? "bg-brand-500 border-brand-500 text-white" : "bg-red-500 border-red-500 text-white";
                            }
                            return (
                                <button key={idx} disabled={isCorrect} onClick={() => handleSelect(idx)}
                                    className={`px-4 py-2 text-sm font-bold rounded-xl border-2 transition-all ${btnStyle}`}>
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // 4. SORTING ENGINE
        const SortEngine = ({ items, categories }) => {
            const [placed, setPlaced] = useState({}); 
            const [activeItem, setActiveItem] = useState(null);

            const handleBucketClick = (catId) => {
                if(!activeItem) return;
                const itemData = items.find(i => i.id === activeItem);
                if(itemData.cat === catId) {
                    setPlaced(prev => ({...prev, [activeItem]: catId}));
                    setActiveItem(null);
                } else {
                    setActiveItem(null); 
                }
            };

            const remainingItems = items.filter(i => !placed[i.id]);

            return (
                <div className="my-4 bg-white p-5 rounded-2xl border border-slate-200">
                    <div className="flex flex-wrap gap-2 mb-6 min-h-[44px] justify-center">
                        {remainingItems.map(item => (
                            <button key={item.id} onClick={() => setActiveItem(item.id)}
                                className={`px-4 py-2 text-sm font-bold rounded-xl transition-all border-2 
                                ${activeItem === item.id ? 'bg-brand-600 text-white border-brand-600 shadow-md' : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-brand-400'}`}>
                                {item.text}
                            </button>
                        ))}
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        {categories.map(cat => (
                            <div key={cat.id} onClick={() => handleBucketClick(cat.id)}
                                className="border-2 border-dashed border-brand-300 rounded-2xl p-4 bg-brand-50 hover:bg-brand-100 cursor-pointer flex flex-col items-center min-h-[140px]">
                                <h4 className="font-extrabold text-brand-800 uppercase tracking-wider text-sm mb-3">{cat.title}</h4>
                                <div className="flex flex-wrap gap-2 justify-center">
                                    {items.filter(i => placed[i.id] === cat.id).map(i => (
                                        <span key={i.id} className="px-3 py-1 bg-white border border-brand-200 text-brand-700 text-sm font-bold rounded-lg shadow-sm">{i.text}</span>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };


        // --- MISSIONS CONTENT ---

        const PartHeader = ({ title, sub }) => (
            <div className="mb-4 mt-8">
                <h3 className="font-extrabold text-xl text-slate-800">{title}</h3>
                {sub && <p className="text-slate-500 text-sm font-medium">{sub}</p>}
            </div>
        );

        const SectionBadge = ({ text }) => <span className="inline-block px-3 py-1 bg-brand-100 text-brand-800 text-xs font-black rounded-full uppercase tracking-widest mb-2 border border-brand-200">{text}</span>;

        // MISSION 1: LEAD-IN
        const Tab1 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Lead-in 01 & 02" />
                <h2 className="text-3xl font-black text-slate-800">Daily Routine</h2>
                
                <PartHeader title="01. Match the activities" sub="Match the Vietnamese meaning to the correct English phrase." />
                <MatchEngine pairs={[
                    {id:1, left:'Thức dậy', right:'Get up'}, {id:2, left:'Bắt xe buýt', right:'Catch the bus'},
                    {id:3, left:'Lên mạng', right:'Go online'}, {id:4, left:'Thư giãn với bạn bè', right:'Relax with friends'},
                    {id:5, left:'Đi ngủ', right:'Go to bed'}, {id:6, left:'Ăn sáng', right:'Have breakfast'},
                    {id:7, left:'Bỏ bữa sáng', right:'Skip breakfast'}
                ]} />

                <PartHeader title="02. Discussing Time" sub="Before discussing what time you do activities, let's learn some key terms!" />
                <FlashcardEngine words={[
                    {en: "Habit", vi: "Thói quen"}, {en: "Exercise", vi: "Tập thể dục"},
                    {en: "Germs / Bacteria", vi: "Vi khuẩn"}, {en: "Skip breakfast", vi: "Bỏ bữa sáng"}
                ]} />
            </div>
        );

        // MISSION 2: VOCABULARY & SPEAKING
        const Tab2 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Vocabulary 03 & 04" />
                <h2 className="text-3xl font-black text-slate-800">Ping's Language Trip</h2>
                
                <PartHeader title="03. Fill in the blanks" sub="Read about Ping and choose the best word. You can try again if you guess wrong!" />
                <InlineChoiceEngine textParts={["Ping", "at 7:30am every morning and has breakfast with his host family."]} options={["gets up", "stands up", "stays up"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["At 8:30am, he", "the bus to his language school."]} options={["goes", "catches", "travels"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["During the day, Ping studies English and", "to his classmates."]} options={["laughs", "chats", "tells"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Everyone speaks English in his class because the students all", "from different countries around the world."]} options={["arrive", "live", "come"]} correctIndex={2} />
                <InlineChoiceEngine textParts={["After Ping finishes school at 3:00pm, he often", "some sightseeing in the city with his friends."]} options={["does", "makes", "has"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["In the evening, Ping relaxes with his host family,", "TV or goes online."]} options={["watches", "sees", "looks"]} correctIndex={0} />

                <PartHeader title="04. Speaking Prep" sub="Flip the cards to learn useful phrases before discussing your routine." />
                <FlashcardEngine words={[
                    {en: "Host family", vi: "Gia đình bản xứ (chủ nhà)"}, {en: "Exchange student", vi: "Học sinh trao đổi"},
                    {en: "Do sightseeing", vi: "Đi ngắm cảnh / Tham quan"}, {en: "Definitely", vi: "Chắc chắn rồi"}
                ]} />
            </div>
        );

        // MISSION 3: READING (A DAY IN THE LIFE)
        const Tab3 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Reading 05 & 06" />
                <h2 className="text-3xl font-black text-slate-800">A Day in the Life</h2>
                
                <PartHeader title="05. Reading Vocab Prep" sub="Learn these keywords before reading about Ava, Nina, and Michael." />
                <FlashcardEngine words={[
                    {en: "College", vi: "Trường cao đẳng/đại học"}, {en: "Folk dancing", vi: "Múa dân gian"},
                    {en: "Cross-country skiing", vi: "Trượt tuyết băng đồng"}, {en: "Cattle farm", vi: "Trang trại gia súc"},
                    {en: "Instead of", vi: "Thay vì"}, {en: "Switch off", vi: "Tắt (đèn/thiết bị)"}
                ]} />

                <PartHeader title="06. Reading Comprehension" sub="Based on the text, who does what? (Ava, Michael, or Nina?)" />
                <InlineChoiceEngine textParts={["Who finishes studying before 1pm?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Who works with a member of the family after college?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["Who goes out in the car in the evenings?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={2} />
                <InlineChoiceEngine textParts={["Who gets a lift in a car to college most mornings?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["Who prepares the evening meal for the family?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Who pays to do extra activities in the afternoons?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={2} />
                <InlineChoiceEngine textParts={["Who finds it difficult to watch TV in the evenings?", ""]} options={["Ava", "Michael", "Nina"]} correctIndex={0} />
            </div>
        );

        // MISSION 4: GRAMMAR (PRESENT SIMPLE)
        const Tab4 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Grammar 07, 08, 09" />
                <h2 className="text-3xl font-black text-slate-800">Grammar & Speaking</h2>
                
                <PartHeader title="07. Grammar Rules" sub="Match the questions about Present Simple to the correct answers." />
                <MatchEngine pairs={[
                    {id:1, left:"What do we use the present simple for?", right:"To talk about every day routines and habits."},
                    {id:2, left:"Why do we use adverbs of frequency?", right:"To say how often we do something."},
                    {id:3, left:"What do regular verbs for he/she/it end in?", right:"End in -s or -es"}
                ]} />

                <PartHeader title="09. Speaking Vocab" sub="Keywords to help you talk about your partner's routine." />
                <FlashcardEngine words={[
                    {en: "Always", vi: "Luôn luôn (100%)"}, {en: "Usually", vi: "Thường xuyên"},
                    {en: "Often", vi: "Thường thường"}, {en: "Sometimes", vi: "Thỉnh thoảng"},
                    {en: "Never", vi: "Không bao giờ (0%)"}, {en: "Swap roles", vi: "Đổi vai (thực hành)"}
                ]} />
            </div>
        );

        // MISSION 5: READING & WRITING (DAN'S ROUTINE & CHORES)
        const Tab5 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Reading 10 & 12" />
                <h2 className="text-3xl font-black text-slate-800">Routine & Chores</h2>
                
                <PartHeader title="10. Dan's University Routine" sub="Choose the correct form of the verb in brackets." />
                <InlineChoiceEngine textParts={["Dan usually", "(get up) at 8am."]} options={["get up", "gets up", "getting up"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["He usually returns home and", "(make) lunch for himself."]} options={["make", "makes", "making"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["At 3pm, he often", "(meet) a friend for coffee."]} options={["meet", "meets", "meeting"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["At 3:30pm, they sometimes", "(go) to the library together."]} options={["goes", "go", "going"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["He always", "(study) for a few hours."]} options={["study", "studies", "studys"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["In the evening, he sometimes", "(exercise) at the gym."]} options={["exercise", "exercises", "exercising"]} correctIndex={1} />

                <PartHeader title="12. Chore Match-Up" sub="Match the phrases that have similar meanings." />
                <MatchEngine pairs={[
                    {id:1, left:'do the laundry', right:'wash the clothes'}, {id:2, left:'tidy up', right:'put things away'},
                    {id:3, left:'wash up', right:'clean the dishes'}, {id:4, left:'make lunch/dinner', right:'prepare a meal'},
                    {id:5, left:'put the rubbish out', right:'take out the bins'}, {id:6, left:'do the cleaning', right:'do the housework'}
                ]} />
            </div>
        );

        // MISSION 6: LISTENING (STUDENT EXCHANGE)
        const Tab6 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Listening 15, 16, 17" />
                <h2 className="text-3xl font-black text-slate-800">Student Exchange</h2>
                
                <PartHeader title="15. Website Info (True or False)" sub="Read the website info and decide if the sentences are true or false." />
                <InlineChoiceEngine textParts={["All students spend at least a year abroad.", ""]} options={["True", "False"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Host families give students pocket money during their stay.", ""]} options={["True", "False"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Students should do housework and be involved with family activities.", ""]} options={["True", "False"]} correctIndex={0} />

                <PartHeader title="17. Listening Vocab Prep" sub="Flip the cards to learn the activity vocabulary before listening." />
                <FlashcardEngine words={[
                    {en: "Cooking", vi: "Nấu ăn"}, {en: "Going to the gym", vi: "Đi tập gym"},
                    {en: "Taking care of the garden", vi: "Chăm sóc khu vườn"}, {en: "Doing art", vi: "Làm nghệ thuật / Vẽ"},
                    {en: "Repairing things", vi: "Sửa chữa đồ đạc"}, {en: "Reading books", vi: "Đọc sách"},
                    {en: "Shopping", vi: "Mua sắm"}, {en: "Playing team sports", vi: "Chơi thể thao đồng đội"}
                ]} />
            </div>
        );

        // MISSION 7: G&V - TIMES & COLLOCATIONS
        const Tab7 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Grammar & Vocab 01 & 03" />
                <h2 className="text-3xl font-black text-slate-800">Times & Make/Do</h2>
                
                <PartHeader title="01. Telling the Time" sub="Match the digital times with the times in words." />
                <MatchEngine pairs={[
                    {id:1, left:'05:15', right:'quarter past five'}, {id:2, left:'08:20', right:'twenty past eight'},
                    {id:3, left:'06:45', right:'quarter to seven'}, {id:4, left:'14:30', right:'half past two'},
                    {id:5, left:'20:50', right:'ten to nine'}, {id:6, left:'09:10', right:'ten past nine'},
                    {id:7, left:'12:00', right:'twelve o\'clock'}
                ]} />

                <PartHeader title="03. Make vs Do" sub="Sort the nouns into the correct verb category." />
                <SortEngine categories={[{id:'make', title:'MAKE'}, {id:'do', title:'DO'}]} items={[
                    {id:1, text:'a mess', cat:'make'}, {id:2, text:'the laundry', cat:'do'},
                    {id:3, text:'the cleaning', cat:'do'}, {id:4, text:'a noise', cat:'make'},
                    {id:5, text:'the beds', cat:'make'}, {id:6, text:'the shopping', cat:'do'},
                    {id:7, text:'dinner', cat:'make'}, {id:8, text:'some homework', cat:'do'},
                    {id:9, text:'the housework', cat:'do'}, {id:10, text:'lunch', cat:'make'}
                ]} />
            </div>
        );

        // MISSION 8: G&V - GAP FILLS (EMAILS)
        const Tab8 = () => (
            <div className="mission-card p-6 md:p-8">
                <SectionBadge text="Grammar & Vocab 04 & 08" />
                <h2 className="text-3xl font-black text-slate-800">Emails Gap Fill</h2>
                
                <PartHeader title="04. Harry's Email" sub="Choose the correct verb for Harry's routine in France." />
                <InlineChoiceEngine textParts={["My host family are very nice. They", "in an apartment..."]} options={["live", "walk", "finish"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["...and they both", "as journalists."]} options={["meet", "work", "catch"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["They", "the house before me."]} options={["leave", "live", "have"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["I", "breakfast at about 8am..."]} options={["get up", "have", "meet"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["I usually", "the bus."]} options={["walk", "catch", "go out"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["Lessons at the school", "at 4pm and we can go home."]} options={["finish", "meet", "leave"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["We", "after school in a cafe..."]} options={["meet", "go out", "catch"]} correctIndex={0} />

                <PartHeader title="08. William's Email" sub="Choose the correct verb for William's new job." />
                <InlineChoiceEngine textParts={["I", "work at 8am and the shop..."]} options={["finish", "start", "clean"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["...and the shop", "at 9am."]} options={["opens", "tells", "enjoys"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["I", "the shelves with food products..."]} options={["fill", "tidy", "clean"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["...and", "the floors and work at the checkout."]} options={["clean", "shout", "open"]} correctIndex={0} />
                <InlineChoiceEngine textParts={["My manager is very nice. She", "me what to do..."]} options={["gets", "takes", "tells"]} correctIndex={2} />
                <InlineChoiceEngine textParts={["...and never", "at me."]} options={["tells", "shouts", "enjoys"]} correctIndex={1} />
                <InlineChoiceEngine textParts={["We", "three breaks a day..."]} options={["take", "finish", "get"]} correctIndex={0} />
            </div>
        );

        // MISSION 9: G&V - VERB FORMS & REORDER

                <InlineChoiceEngine textParts={["every/go/to/months/I/the/dentist/six ->", ""]} options={["I go to the dentist every six months.", "I to the dentist go every six months."]} correctIndex={0} />

        );

        // --- ROOT COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(1);
            
            const tabs = [
                {id: 1, label: 'L.1 & L.2: Lead-in'},

                                <div className="flex flex-col gap-2">
