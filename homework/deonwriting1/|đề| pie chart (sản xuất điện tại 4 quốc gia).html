<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Task 1 - Masterclass Pro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 900: '#4c1d95' },
                        accent: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#22c55e', 600: '#16a34a' },
                    },
                    boxShadow: {
                        'floating': '0 20px 40px -15px rgba(124, 58, 237, 0.15)',
                        'premium': '0 10px 30px -5px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #faf5ff;
            background-image: 
                radial-gradient(at 40% 20%, hsla(270,100%,94%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,92%,1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(270,100%,96%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-flip-transition { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .tooltip-arrow::before {
            content: ''; position: absolute; bottom: -4px; left: 50%;
            transform: translateX(-50%) rotate(45deg); width: 8px; height: 8px; background-color: #1e293b;
        }
        
        /* Tùy chỉnh thanh cuộn cho đẹp */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
        
        .chunks-container::-webkit-scrollbar-track { background-color: #f5f3ff; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
</head>
<body class="text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: #7c3aed; margin-bottom: 1.5rem;"></i>
            <h2 style="color: #4c1d95; font-size: 1.5rem; font-weight: 700;">Đang khởi tạo không gian học tập...</h2>
        </div>
    </div>

    <script type="text/babel">
        const { useState } = React;

        const InteractiveVocab = ({ english, vietnamese, type }) => {
            const [isFlipped, setIsFlipped] = useState(false);
            return (
                <div className="w-full h-32 perspective-1000 cursor-pointer group" onClick={() => setIsFlipped(!isFlipped)}>
                    <div className={`relative w-full h-full transform-style-3d card-flip-transition rounded-2xl shadow-premium ${isFlipped ? 'rotate-y-180' : ''}`}>
                        <div className="absolute w-full h-full backface-hidden bg-gradient-to-br from-white to-brand-50 rounded-2xl p-4 flex flex-col items-center justify-center border-2 border-brand-100 group-hover:border-brand-300 group-hover:shadow-floating transition-all">
                            <span className="text-[10px] font-bold text-brand-500 uppercase tracking-widest mb-1.5 bg-brand-100 px-2.5 py-0.5 rounded-full">{type}</span>
                            <span className="text-base font-extrabold text-brand-900 text-center leading-tight">{english}</span>
                            <div className="absolute bottom-2 right-2 text-brand-300 group-hover:text-brand-500 transition-colors text-sm"><i className="fa-solid fa-rotate"></i></div>
                        </div>
                        <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-accent-50 to-green-100 rounded-2xl p-4 flex items-center justify-center border-2 border-accent-500 shadow-inner-soft">
                            <span className="text-sm font-bold text-accent-700 text-center">{vietnamese}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const LearningBlock = ({ number, title, icon, children, aside, colorTheme = "brand" }) => (
            <div className="flex flex-col sm:flex-row gap-4 sm:gap-6 relative mb-12">
                <div className="hidden sm:flex flex-col items-center">
                    <div className={`w-12 h-12 rounded-full bg-white shadow-premium flex items-center justify-center border-4 border-${colorTheme}-500 z-10 shrink-0`}>
                        <span className={`text-xl font-black text-${colorTheme}-600`}>{number}</span>
                    </div>
                    <div className={`w-1 h-full bg-${colorTheme}-200 my-2 rounded-full opacity-50`}></div>
                </div>
                
                <div className="flex-1 glass-panel rounded-3xl p-6 sm:p-8 shadow-premium">
                    <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-200/60">
                        <div className={`sm:hidden w-10 h-10 rounded-full bg-${colorTheme}-100 flex items-center justify-center shrink-0`}>
                            <span className={`text-base font-black text-${colorTheme}-600`}>{number}</span>
                        </div>
                        <div className={`w-10 h-10 rounded-xl bg-${colorTheme}-50 flex items-center justify-center text-${colorTheme}-500 text-xl shadow-inner-soft shrink-0`}>
                            <i className={icon}></i>
                        </div>
                        <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">{title}</h2>
                    </div>
                    
                    {aside && (
                        <div className={`mb-8 bg-${colorTheme}-50/50 p-5 rounded-2xl border border-${colorTheme}-100 shadow-inner-soft`}>
                            <h3 className={`text-sm font-black text-${colorTheme}-700 uppercase tracking-widest mb-3 flex items-center gap-2`}>
                                <i className="fa-solid fa-lightbulb text-amber-500"></i> Gợi ý & Mẹo
                            </h3>
                            {aside}
                        </div>
                    )}
                    
                    <div className="space-y-6">{children}</div>
                </div>
            </div>
        );

        const SentenceBuilder = ({ index, vnSentence, chunks, correctOrder }) => {
            const [availableChunks, setAvailableChunks] = useState([...chunks].sort(() => Math.random() - 0.5));
            const [selectedChunks, setSelectedChunks] = useState([]);
            const [isCorrect, setIsCorrect] = useState(null);

            const handleSelect = (chunk) => {
                setSelectedChunks([...selectedChunks, chunk]);
                setAvailableChunks(availableChunks.filter(c => c !== chunk));
                setIsCorrect(null);
            };

            const handleDeselect = (chunk) => {
                setAvailableChunks([...availableChunks, chunk]);
                setSelectedChunks(selectedChunks.filter(c => c !== chunk));
                setIsCorrect(null);
            };

            const checkAnswer = () => {
                const currentAnswer = selectedChunks.join(" ");
                const expectedAnswer = correctOrder.join(" ");
                setIsCorrect(currentAnswer === expectedAnswer);
            };

            const reset = () => {
                setAvailableChunks([...chunks].sort(() => Math.random() - 0.5));
                setSelectedChunks([]);
                setIsCorrect(null);
            };

            return (
                <div className="bg-white border-2 border-slate-100 rounded-2xl p-5 mb-6 shadow-sm hover:shadow-md transition-all duration-300 relative overflow-hidden group">
                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-brand-200 group-hover:bg-brand-500 transition-colors"></div>
                    
                    <div className="mb-4 pl-2">
                        <span className="inline-flex items-center gap-1.5 bg-brand-50 text-brand-700 text-[11px] font-black px-2.5 py-1 rounded-md mb-2 uppercase tracking-wide border border-brand-100">
                            <i className="fa-solid fa-pen-ruler"></i> Câu {index}
                        </span>
                        <p className="text-slate-700 font-medium text-base border-l-4 border-brand-300 pl-3 py-0.5">"{vnSentence}"</p>
                    </div>

                    <div className={`min-h-[60px] p-3 rounded-xl border-2 border-dashed mb-4 flex flex-wrap gap-2 transition-colors ${selectedChunks.length === 0 ? 'border-slate-300 bg-slate-50' : 'border-brand-300 bg-brand-50/50'}`}>
                        {selectedChunks.length === 0 && <span className="text-slate-400 text-xs my-auto ml-2 font-medium"><i className="fa-solid fa-puzzle-piece mr-1.5"></i>Click mảnh ghép...</span>}
                        {selectedChunks.map((chunk, idx) => (
                            <button key={`sel-${idx}`} onClick={() => handleDeselect(chunk)} className="px-3 py-1.5 bg-brand-600 text-white rounded-lg text-sm font-semibold hover:bg-brand-700 shadow-sm transform hover:-translate-y-0.5 transition-all">
                                {chunk} <i className="fa-solid fa-xmark ml-1 opacity-60 text-xs"></i>
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-wrap gap-2 mb-5 chunks-container pb-2">
                        {availableChunks.map((chunk, idx) => (
                            <button key={`avail-${idx}`} onClick={() => handleSelect(chunk)} className="px-3 py-1.5 bg-white border-2 border-slate-200 text-slate-700 rounded-lg text-sm font-semibold hover:border-brand-500 hover:text-brand-600 shadow-sm transition-colors">
                                {chunk}
                            </button>
                        ))}
                    </div>

                    <div className="flex items-center gap-3 pt-3 border-t border-slate-100 pl-2">
                        <button 
                            onClick={checkAnswer}
                            disabled={selectedChunks.length !== chunks.length}
                            className={`px-4 py-1.5 rounded-lg text-sm font-bold transition-all flex items-center gap-1.5 ${selectedChunks.length === chunks.length ? 'bg-slate-800 text-white shadow-md hover:bg-black hover:-translate-y-0.5' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                        >
                            <i className="fa-solid fa-check"></i> Kiểm tra
                        </button>
                        <button onClick={reset} className="text-slate-500 hover:text-brand-600 text-sm font-semibold transition-colors flex items-center gap-1">
                            <i className="fa-solid fa-rotate-right"></i> Làm lại
                        </button>
                        
                        <div className="ml-auto">
                            {isCorrect === true && <span className="text-accent-600 font-black flex items-center gap-1.5 text-sm bg-accent-50 px-3 py-1 rounded-md border border-accent-200"><i className="fa-solid fa-circle-check"></i> Đúng!</span>}
                            {isCorrect === false && <span className="text-red-500 font-black flex items-center gap-1.5 text-sm bg-red-50 px-3 py-1 rounded-md border border-red-200"><i className="fa-solid fa-circle-xmark"></i> Sai!</span>}
                        </div>
                    </div>
                </div>
            );
        };

        const AnnotatedWord = ({ word, note, type }) => (
            <span className="relative group inline-block cursor-help">
                <span className="font-bold text-brand-700 border-b-2 border-dashed border-brand-400 group-hover:bg-brand-100 transition-colors px-1 rounded">{word}</span>
                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max max-w-[250px] bg-slate-800 text-white text-xs rounded-xl p-3 opacity-0 group-hover:opacity-100 transition-all pointer-events-none z-20 shadow-xl tooltip-arrow transform group-hover:-translate-y-1">
                    <span className="block text-[10px] text-brand-300 font-black uppercase tracking-widest mb-1"><i className="fa-solid fa-tag mr-1"></i> {type}</span>
                    <span className="leading-relaxed">{note}</span>
                </div>
            </span>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('v1');

            const vocabList = [
                { id: 1, type: "Noun Phrase", en: "Alternative energy sources", vn: "Các nguồn năng lượng thay thế" },
                { id: 2, type: "Verb Phrase", en: "Heavily depended on", vn: "Phụ thuộc nặng nề vào" },
                { id: 3, type: "Verb", en: "Generated / Derived from", vn: "Được tạo ra từ / Bắt nguồn từ" },
                { id: 4, type: "Noun Phrase", en: "Electricity generation", vn: "Việc sản xuất điện" },
                { id: 5, type: "Verb Phrase", en: "Utilizing all three sources", vn: "Sử dụng cả ba nguồn" },
                { id: 6, type: "Phrase", en: "Showed different levels of dependency", vn: "Thể hiện mức độ phụ thuộc khác nhau" }
            ];

            const introOverviewExercises = [
                { vn: "Các biểu đồ tròn so sánh sự đóng góp của nhiên liệu hóa thạch, thủy điện và năng lượng hạt nhân đã thay đổi như thế nào trên bốn quốc gia khác nhau trong khoảng thời gian từ năm 2003 đến 2008.", chunks: ["The pie charts compare", "how the contribution of", "fossil fuel, hydropower,", "and nuclear power", "varied across four different countries", "during the period of 2003 to 2008."] },
                { vn: "Nhìn chung, Ấn Độ và Việt Nam phụ thuộc nặng nề vào nhiên liệu hóa thạch,", chunks: ["Overall,", "India and Vietnam", "heavily depended on", "fossil fuels,"] },
                { vn: "trong khi Thụy Điển và Ma-rốc thể hiện sự chú trọng lớn hơn vào các nguồn năng lượng thay thế.", chunks: ["while Sweden and Morocco", "demonstrated a greater emphasis", "on alternative energy sources."] }
            ];

            const body1Exercises = [
                { vn: "Ấn Độ và Thụy Điển là những quốc gia duy nhất sử dụng cả ba nguồn năng lượng, nhưng họ thể hiện các mức độ phụ thuộc khác nhau.", chunks: ["India and Sweden", "were the only countries", "utilizing all three energy sources,", "but they showed", "different levels of dependency."] },
                { vn: "Ở Thụy Điển, thủy điện nắm giữ một phần đáng kể là 52% trong sản xuất điện, gấp hơn ba lần sản lượng của Ấn Độ.", chunks: ["In Sweden,", "hydroelectric power held", "a substantial share of 52%", "in electricity generation,", "more than triple", "India's production."] },
                { vn: "Năng lượng hạt nhân là một nhân tố đóng góp lớn khác cho Thụy Điển, chiếm một tỷ lệ đáng kể 44% trong tổng sản lượng điện của quốc gia này,", chunks: ["Nuclear power was", "another major contributor", "for Sweden,", "accounting for a significant 44%", "of the country's", "total electricity production"] },
                { vn: "trong khi Ấn Độ dựa vào năng lượng hạt nhân chỉ cho 4% lượng điện của mình.", chunks: ["whereas India relied on", "nuclear power", "for only 4% of its power."] }
            ];

            const body2Exercises = [
                { vn: "Chỉ có thủy điện và nhiên liệu hóa thạch là có sẵn ở Ma-rốc và Việt Nam trong suốt khoảng thời gian được khảo sát.", chunks: ["Only hydropower and fossil fuels", "were available in", "Morocco and Vietnam", "during the surveyed period."] },
                { vn: "Ma-rốc phụ thuộc nặng nề vào thủy điện, với 95% lượng điện được sản xuất từ nguồn này.", chunks: ["Morocco heavily depended", "on hydropower,", "with 95% of its electricity", "produced from this source."] },
                { vn: "Ở Việt Nam, nhiên liệu hóa thạch thống trị ở mức 56% tổng sản lượng điện, trong khi thủy điện đóng góp 44%.", chunks: ["In Vietnam,", "fossil fuels dominated", "at 56% of total", "electricity generation,", "while hydropower", "contributed 44%."] }
            ];

            return (
                <div className="max-w-[1600px] mx-auto px-4 py-8 lg:py-12">
                    
                    {/* BỐ CỤC LƯỚI CHIA ĐÔI MÀN HÌNH (SPLIT-SCREEN) */}
                    <div className="flex flex-col xl:flex-row gap-8 items-start">
                        
                        {/* ========================================== */}
                        {/* CỘT TRÁI - STICKY (CỐ ĐỊNH KHI CUỘN)      */}
                        {/* ========================================== */}
                        <div className="w-full xl:w-[45%] xl:sticky xl:top-8 z-20 space-y-6">
                            
                            {/* HEADER */}
                            <header className="glass-panel p-6 rounded-[2rem] shadow-sm relative overflow-hidden">
                                <div className="absolute inset-0 -z-10 bg-brand-200 blur-3xl opacity-20 rounded-full w-full mx-auto h-full"></div>
                                <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-brand-100 text-brand-700 rounded-full text-[11px] font-bold mb-4 border border-brand-200 uppercase tracking-widest">
                                    <i className="fa-solid fa-chart-pie"></i> IELTS Writing Task 1
                                </div>
                                <h1 className="text-3xl lg:text-4xl font-black text-slate-900 tracking-tight mb-3 leading-tight">
                                    Pie Chart <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-600 to-accent-500">Masterclass</span>
                                </h1>
                                <p className="text-sm text-slate-600 font-medium">Đề bài: Các nguồn sản xuất điện tại 4 quốc gia (2003-2008).</p>
                            </header>

                            {/* BIỂU ĐỒ */}
                            <div className="glass-panel p-4 rounded-[2rem] shadow-premium relative overflow-hidden border-2 border-brand-100 hover:border-brand-300 transition-colors">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-brand-400 via-purple-400 to-accent-400"></div>
                                <div className="bg-slate-50 rounded-xl p-2">
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1BIq7vVckuJAak3Hm6fSOfUhfGx9W7Ts3" 
                                        alt="Biểu đồ nguồn năng lượng" 
                                        className="w-full rounded-lg object-contain"
                                        onError={(e) => { 
                                            e.target.onerror = null; 
                                            e.target.src = "https://placehold.co/800x400/f5f3ff/7c3aed?text=Lỗi+hiển+thị+ảnh!+Link+bị+chặn."; 
                                        }}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* ========================================== */}
                        {/* CỘT PHẢI - SCROLL (NỘI DUNG CUỘN)        */}
                        {/* ========================================== */}
                        <div className="w-full xl:w-[55%] pb-20">
                            
                            {/* STEP 1: VOCABULARY */}
                            <LearningBlock 
                                number="1" title="Từ Vựng Cốt Lõi" icon="fa-solid fa-layer-group" 
                                aside={<ul className="space-y-2 text-slate-700 text-sm font-medium"><li><i className="fa-solid fa-bolt text-amber-500 w-5"></i> Nguồn phát (sources, generation)</li><li><i className="fa-solid fa-link text-blue-500 w-5"></i> Phụ thuộc (reliance on, depended on)</li><li><i className="fa-solid fa-industry text-purple-500 w-5"></i> Khai thác (generated from, derived from)</li></ul>}
                            >
                                <div className="grid grid-cols-2 gap-4">
                                    {vocabList.map(vocab => <InteractiveVocab key={vocab.id} english={vocab.en} vietnamese={vocab.vn} type={vocab.type} />)}
                                </div>
                            </LearningBlock>

                            {/* STEP 2: INTRO & OVERVIEW */}
                            <LearningBlock 
                                number="2" title="Intro & Overview" icon="fa-solid fa-chess-knight" 
                                aside={<p className="text-slate-700 text-sm font-medium leading-relaxed">Hãy phân chia nhóm: Ấn Độ & VN mạnh về năng lượng hóa thạch (Fossil fuels). Trong khi Thụy Điển & Ma-rốc ưu tiên năng lượng thay thế (Alternative energy).</p>}
                            >
                                {introOverviewExercises.map((ex, i) => <SentenceBuilder key={`intro-${i}`} index={`1.${i+1}`} vnSentence={ex.vn} chunks={ex.chunks} correctOrder={ex.chunks} />)}
                            </LearningBlock>

                            {/* STEP 3: BODY PARAGRAPHS */}
                            <LearningBlock 
                                number="3" title="Body Paragraphs (Country-based)" icon="fa-solid fa-pen-nib" 
                                aside={<ul className="space-y-2 text-slate-700 text-sm font-medium"><li><strong>Body 1:</strong> Phân tích Ấn Độ & Thụy Điển (vì 2 nước này khai thác cả 3 nguồn năng lượng).</li><li><strong>Body 2:</strong> Phân tích Ma-rốc & Việt Nam (chỉ khai thác 2 nguồn năng lượng).</li></ul>}
                            >
                                <div className="inline-flex items-center gap-2 px-3 py-1 bg-slate-100 text-slate-600 rounded-md text-xs font-bold mb-4 uppercase tracking-widest"><i className="fa-solid fa-globe"></i> Đoạn 1: India & Sweden</div>
                                {body1Exercises.map((ex, i) => <SentenceBuilder key={`b1-${i}`} index={`2.${i+1}`} vnSentence={ex.vn} chunks={ex.chunks} correctOrder={ex.chunks} />)}
                                
                                <div className="h-px bg-slate-200 w-full my-8 relative">
                                    <div className="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 bg-white px-3 text-slate-300"><i className="fa-solid fa-arrow-down"></i></div>
                                </div>
                                
                                <div className="inline-flex items-center gap-2 px-3 py-1 bg-slate-100 text-slate-600 rounded-md text-xs font-bold mb-4 uppercase tracking-widest"><i className="fa-solid fa-globe"></i> Đoạn 2: Morocco & Vietnam</div>
                                {body2Exercises.map((ex, i) => <SentenceBuilder key={`b2-${i}`} index={`3.${i+1}`} vnSentence={ex.vn} chunks={ex.chunks} correctOrder={ex.chunks} />)}
                            </LearningBlock>

                            {/* STEP 4: DUAL MODEL ESSAYS (TABBED VIEW) */}
                            <LearningBlock number="4" title="Bài Mẫu Band 8.0+" icon="fa-solid fa-gem">
                                
                                {/* Tabs Header */}
