<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Writing Task 1 - Bar Chart Masterclass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        vocab: { front: '#fef3c7', back: '#dcfce7' }
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'premium': '0 4px 20px -2px rgba(0,0,0,0.05), 0 0 3px rgba(0,0,0,0.02)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-flip-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .tooltip-arrow::before {
            content: ''; position: absolute; bottom: -4px; left: 50%;
            transform: translateX(-50%) rotate(45deg); width: 8px; height: 8px; background-color: #1e293b;
        }
        .chunks-container::-webkit-scrollbar { height: 6px; }
        .chunks-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
</head>
<body class="text-slate-800 antialiased min-h-screen">
    <div id="root">
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; color: #3b82f6; margin-bottom: 1rem;"></i>
            <h2 style="color: #1e293b; font-size: 1.25rem; font-weight: 600;">Đang tải bài học VocaFlow...</h2>
        </div>
    </div>

    <script type="text/babel">
        const { useState } = React;

        const InteractiveVocab = ({ english, vietnamese, type }) => {
            const [isFlipped, setIsFlipped] = useState(false);
            return (
                <div className="w-full h-32 perspective-1000 cursor-pointer group" onClick={() => setIsFlipped(!isFlipped)}>
                    <div className={`relative w-full h-full transform-style-3d card-flip-transition rounded-2xl shadow-premium ${isFlipped ? 'rotate-y-180' : ''}`}>
                        <div className="absolute w-full h-full backface-hidden bg-vocab-front rounded-2xl p-4 flex flex-col items-center justify-center border border-amber-200 group-hover:shadow-floating transition-shadow">
                            <span className="text-xs font-semibold text-amber-700 uppercase tracking-wider mb-1">{type}</span>
                            <span className="text-lg font-bold text-amber-900 text-center leading-tight">{english}</span>
                            <div className="absolute bottom-2 right-2 text-amber-400 opacity-50"><i className="fa-solid fa-rotate"></i></div>
                        </div>
                        <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-vocab-back rounded-2xl p-4 flex items-center justify-center border border-green-200">
                            <span className="text-base font-medium text-green-800 text-center">{vietnamese}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const LearningBlock = ({ number, title, icon, children, aside }) => (
            <div className="flex flex-col md:flex-row gap-6 md:gap-10 relative mb-16">
                <div className="hidden md:flex flex-col items-center">
                    <div className="w-12 h-12 rounded-full bg-white shadow-premium flex items-center justify-center border-2 border-primary-500 z-10">
                        <span className="text-xl font-bold text-primary-600">{number}</span>
                    </div>
                    <div className="w-px h-full bg-slate-200 my-2"></div>
                </div>
                <div className="flex-1 bg-white/80 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-floating border border-slate-100">
                    <div className="flex items-center gap-3 mb-6">
                        <div className="md:hidden w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center">
                            <span className="text-sm font-bold text-primary-600">{number}</span>
                        </div>
                        <i className={`${icon} text-2xl text-primary-500`}></i>
                        <h2 className="text-2xl font-bold text-slate-800">{title}</h2>
                    </div>
                    <div className="flex flex-col lg:flex-row gap-8">
                        <div className="flex-1">{children}</div>
                        {aside && (
                            <div className="w-full lg:w-1/3 shrink-0">
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 h-full sticky top-6">
                                    <h3 className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Gợi ý & Mẹo</h3>
                                    {aside}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );

        const SentenceBuilder = ({ index, vnSentence, chunks, correctOrder }) => {
            const [availableChunks, setAvailableChunks] = useState([...chunks].sort(() => Math.random() - 0.5));
            const [selectedChunks, setSelectedChunks] = useState([]);
            const [isCorrect, setIsCorrect] = useState(null);

            const handleSelect = (chunk) => {
                setSelectedChunks([...selectedChunks, chunk]);
                setAvailableChunks(availableChunks.filter(c => c !== chunk));
                setIsCorrect(null);
            };

            const handleDeselect = (chunk) => {
                setAvailableChunks([...availableChunks, chunk]);
                setSelectedChunks(selectedChunks.filter(c => c !== chunk));
                setIsCorrect(null);
            };

            const checkAnswer = () => {
                const currentAnswer = selectedChunks.join(" ");
                const expectedAnswer = correctOrder.join(" ");
                setIsCorrect(currentAnswer === expectedAnswer);
            };

            const reset = () => {
                setAvailableChunks([...chunks].sort(() => Math.random() - 0.5));
                setSelectedChunks([]);
                setIsCorrect(null);
            };

            return (
                <div className="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm hover:shadow-md transition-shadow">
                    <div className="mb-4">
                        <span className="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded-md mb-2">Câu {index}</span>
                        <p className="text-slate-700 font-medium italic border-l-4 border-indigo-400 pl-3">"{vnSentence}"</p>
                    </div>

                    <div className={`min-h-[60px] p-3 rounded-xl border-2 border-dashed mb-4 flex flex-wrap gap-2 transition-colors ${selectedChunks.length === 0 ? 'border-slate-300 bg-slate-50' : 'border-primary-300 bg-primary-50'}`}>
                        {selectedChunks.length === 0 && <span className="text-slate-400 text-sm my-auto ml-2">Click vào các mảnh ghép bên dưới để xếp câu...</span>}
                        {selectedChunks.map((chunk, idx) => (
                            <button key={`sel-${idx}`} onClick={() => handleDeselect(chunk)} className="px-3 py-1.5 bg-primary-500 text-white rounded-lg text-sm font-medium hover:bg-primary-600 shadow-sm transform hover:-translate-y-0.5">
                                {chunk}
                            </button>
                        ))}
                    </div>

                    <div className="flex flex-wrap gap-2 mb-6 chunks-container pb-2">
                        {availableChunks.map((chunk, idx) => (
                            <button key={`avail-${idx}`} onClick={() => handleSelect(chunk)} className="px-3 py-1.5 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:border-primary-400 hover:text-primary-600 shadow-sm">
                                {chunk}
                            </button>
                        ))}
                    </div>

                    <div className="flex items-center gap-4">
                        <button 
                            onClick={checkAnswer}
                            disabled={selectedChunks.length !== chunks.length}
                            className={`px-5 py-2 rounded-xl font-semibold transition-all ${selectedChunks.length === chunks.length ? 'bg-indigo-600 text-white shadow-md hover:bg-indigo-700' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                        >
                            Kiểm tra
                        </button>
                        <button onClick={reset} className="text-slate-500 hover:text-slate-700 text-sm font-medium underline">Làm lại</button>
                        {isCorrect === true && <span className="text-green-600 font-bold flex items-center gap-1"><i className="fa-solid fa-circle-check"></i> Chính xác!</span>}
                        {isCorrect === false && <span className="text-red-500 font-bold flex items-center gap-1"><i className="fa-solid fa-circle-xmark"></i> Chưa đúng!</span>}
                    </div>
                </div>
            );
        };

        const AnnotatedWord = ({ word, note, type }) => (
            <span className="relative group inline-block cursor-help">
                <span className="font-semibold text-primary-600 border-b-2 border-dotted border-primary-400 group-hover:bg-primary-100 transition-colors px-1 rounded">{word}</span>
                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max max-w-xs bg-slate-800 text-white text-sm rounded-lg p-3 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20 shadow-xl tooltip-arrow">
                    <span className="block text-xs text-primary-300 font-bold uppercase mb-1">{type}</span>
                    {note}
                </div>
            </span>
        );

        const App = () => {
            const vocabList = [
                { id: 1, type: "Verb Phrase", en: "Engaging in regular physical activity", vn: "Tham gia hoạt động thể chất thường xuyên" },
                { id: 2, type: "Noun Phrase", en: "Participation rates", vn: "Tỷ lệ tham gia" },
                { id: 3, type: "Verb Phrase", en: "Peaked in middle age", vn: "Đạt đỉnh ở độ tuổi trung niên" },
                { id: 4, type: "Noun Phrase", en: "Adolescents and young adults", vn: "Thanh thiếu niên và thanh niên" },
                { id: 5, type: "Verb", en: "Stabilizing", vn: "Ổn định, giữ ở mức" },
                { id: 6, type: "Phrase", en: "Remaining engaged in", vn: "Tiếp tục tham gia vào" }
            ];

            const body1Exercises = [
                { vn: "Nam thanh thiếu niên và thanh niên, từ 15-24 tuổi, đã báo cáo tỷ lệ tham gia hoạt động thể chất cao nhất, đạt gần 53%.", chunks: ["Male adolescents", "and young adults,", "aged 15-24,", "reported the highest rate", "of physical activity participation,", "reaching nearly 53%."] },
                { vn: "Tuy nhiên, độ tuổi này đánh dấu mức đỉnh điểm đối với nam giới, vì tỷ lệ tham gia của họ bắt đầu giảm xuống 42.2% ở nhóm tuổi 25-34.", chunks: ["Nevertheless,", "this age range", "marked the peak for men,", "as their participation rates", "began to decrease", "to 42.2%", "in the 25-34 age group."] },
                { vn: "Và xuống điểm thấp nhất trong nhóm tuổi 35-44 (39.5%).", chunks: ["and to", "the lowest point", "in the 35-44", "age group (39.5%)."] },
                { vn: "Từ 45 tuổi trở đi, các con số bắt đầu phục hồi, ổn định trong khoảng từ 43% đến 47%.", chunks: ["From the age of", "45 onwards,", "the figures", "started to recover,", "stabilizing between", "43% and 47%."] }
            ];

            const body2Exercises = [
                { vn: "Ngược lại, chỉ khoảng 48% nữ thanh thiếu niên và thanh niên tham gia tập thể dục thường xuyên, đây là một trong những tỷ lệ thấp nhất đối với nữ giới.", chunks: ["Conversely,", "only about 48%", "of female teenagers", "and young adults", "engaged in regular exercise,", "which is one of", "the lowest rates for females."] },
                { vn: "Tuy nhiên, khi nữ giới đạt đến độ tuổi trung niên, sự tham gia của họ đã tăng lên.", chunks: ["Nevertheless,", "as females reached", "their middle ages,", "their participation rose."] },
                { vn: "Các con số đạt 52.5% ở nhóm 35-44 và đạt đỉnh ở mức 53.3% cho những người từ 45-54 tuổi.", chunks: ["The figures", "reached 52.5%", "in the 35-44 group", "and peaked at 53.3%", "for those aged 45-54."] }
            ];

            return (
                <div className="max-w-5xl mx-auto px-4 py-12">
                    <header className="text-center mb-16">
                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold mb-4">
                            <i className="fa-solid fa-chart-bar"></i> IELTS Writing Task 1
                        </div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">Bar Chart Masterclass</h1>
                        <p className="text-lg text-slate-500 max-w-2xl mx-auto">Chủ đề: Tỷ lệ tập luyện thể thao của nam và nữ giới tại Úc (2010).</p>
                    </header>

                    {/* SỬ DỤNG LINK "HACK" CHUẨN CỦA GOOGLE ĐỂ LẤY ẢNH TRỰC TIẾP */}
                    <div className="bg-white p-4 rounded-3xl shadow-premium border border-slate-100 mb-16 max-w-3xl mx-auto">
                        <img 
                            src="https://lh3.googleusercontent.com/d/1m-ouNOY31bPBrWNNjxAOUQmqEZeNwjtj" 
                            alt="Biểu đồ tập luyện thể dục thể thao" 
                            className="w-full rounded-2xl object-cover border border-slate-100"
                            onError={(e) => { 
                                e.target.onerror = null; 
                                e.target.src = "https://placehold.co/800x400/eff6ff/1e3a8a?text=Lỗi+hiển+thị+ảnh!+Link+Google+Drive+có+thể+đã+bị+chặn."; 
                            }}
                        />
                    </div>

                    <div className="relative">
                        <div className="absolute left-4 top-0 bottom-0 w-px bg-slate-200 md:hidden z-0"></div>

                        <LearningBlock number="1" title="Nạp Từ Vựng Cốt Lõi" icon="fa-solid fa-dumbbell" aside={<div><p className="text-sm text-slate-600 mb-3">Với biểu đồ so sánh các nhóm tuổi, hãy chú ý từ vựng về:</p><ul className="text-sm space-y-2 text-slate-700"><li><i className="fa-solid fa-users text-blue-500 w-5"></i> Các độ tuổi (adolescents, middle ages)</li><li><i className="fa-solid fa-chart-pie text-purple-500 w-5"></i> Tỷ lệ (rates, percentages, figures)</li><li><i className="fa-solid fa-bolt text-amber-500 w-5"></i> Sự tham gia (participation, engaged in)</li></ul></div>}>
                            <p className="text-slate-600 mb-6">Click vào các thẻ dưới đây để lật và xem nghĩa tiếng Việt. Bỏ túi ngay các cụm từ đắt giá này cho chủ đề Physical Activity.</p>
                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-4">
                                {vocabList.map(vocab => <InteractiveVocab key={vocab.id} english={vocab.en} vietnamese={vocab.vn} type={vocab.type} />)}
                            </div>
                        </LearningBlock>

                        <LearningBlock number="2" title="Chiến Thuật Viết Overview" icon="fa-solid fa-magnifying-glass-chart" aside={<div className="bg-primary-50 rounded-xl p-4 border border-primary-100 text-sm"><span className="font-bold text-primary-700 block mb-1">Quy tắc vàng:</span><span className="text-slate-700">Chỉ ra xu hướng tổng thể và so sánh bao quát, tuyệt đối không trích dẫn số % cụ thể vào phần này.</span></div>}>
                            <div className="space-y-4">
                                <p className="text-slate-700">Hãy nhìn tổng thể bức tranh, ta thấy 2 điểm khác biệt rõ ràng giữa 2 phái:</p>
                                <div className="bg-slate-50 border-l-4 border-amber-400 p-4 rounded-r-xl">
                                    <ol className="list-decimal list-inside space-y-2 text-slate-700">
                                        <li><strong>Tổng quan:</strong> Nữ giới (cột cam) thường có tỷ lệ tham gia cao hơn nam giới (cột xanh) ở phần lớn các nhóm tuổi.</li>
                                        <li><strong>Sự khác biệt về "đỉnh":</strong> Nữ giới đạt đỉnh chăm tập thể thao ở <strong>độ tuổi trung niên</strong>. Trong khi đó, nam giới lại tập nhiều nhất lúc <strong>thanh niên (15-24)</strong>, sau đó rớt thảm hại khi bước vào tuổi trung niên.</li>
                                    </ol>
                                </div>
                            </div>
                        </LearningBlock>

                        <LearningBlock number="3" title="Luyện Tập Ghép Câu (Body)" icon="fa-solid fa-pen-nib" aside={<div><p className="text-sm text-slate-600 mb-3"><strong>Chiến lược nhóm thông tin:</strong></p><ul className="text-sm space-y-2 text-slate-700"><li><strong>Đoạn 1 (Subject-based):</strong> Phân tích toàn bộ dữ liệu của Nam giới (Males).</li><li><strong>Đoạn 2 (Subject-based):</strong> Phân tích toàn bộ dữ liệu của Nữ giới (Females). Cách này giúp bài viết rành mạch, dễ đối chiếu.</li></ul></div>}>
                            <p className="text-slate-600 mb-6">Hãy rèn luyện kỹ năng nối câu. Bắt đầu với <strong>Đoạn 1 (Phân tích sự thay đổi của Nam giới)</strong>:</p>
                            {body1Exercises.map((ex, i) => <SentenceBuilder key={`b1-${i}`} index={`1.${i+1}`} vnSentence={ex.vn} chunks={ex.chunks} correctOrder={ex.chunks} />)}
                            
                            <div className="my-10 border-t border-slate-200"></div>
                            <p className="text-slate-600 mb-6">Tiếp tục xử lý <strong>Đoạn 2 (Phân tích mảng Nữ giới)</strong>:</p>
                            {body2Exercises.map((ex, i) => <SentenceBuilder key={`b2-${i}`} index={`2.${i+1}`} vnSentence={ex.vn} chunks={ex.chunks} correctOrder={ex.chunks} />)}
                        </LearningBlock>

                        <LearningBlock number="4" title="Bài Mẫu Band 8.0+" icon="fa-solid fa-star">
                            <p className="text-slate-600 mb-6">Rê chuột vào các <strong>từ được in xanh</strong> để xem các cấu trúc "ăn điểm" trong bài.</p>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-slate-700 leading-relaxed space-y-5 text-lg">
                                <p>The bar chart illustrates how the percentage of Australian men and women <AnnotatedWord word="engaging in regular physical activity" note="Tham gia hoạt động thể chất thường xuyên" type="Paraphrase" /> varied across six different age groups in 2010.</p>
                                <p>Although females typically had higher <AnnotatedWord word="participation rates" note="Tỷ lệ tham gia (Thay thế cho percentage of people)" type="Vocabulary" /> than males across most age groups, their patterns were different. Female rates <AnnotatedWord word="peaked in middle age" note="Đạt đỉnh ở độ tuổi trung niên" type="Collocation" />, while males began highest in the 15-24 age group, but saw a decline to their lowest levels in middle age.</p>
                                <p>Male <AnnotatedWord word="adolescents and young adults" note="Thanh thiếu niên và thanh niên (Paraphrase nhóm 15-24)" type="Lexical Resource" />, aged 15-24, reported the highest rate of physical activity participation, reaching nearly 53%. Nevertheless, this age range marked the peak for men, as their participation rates began to decrease to 42.2% in the 25-34 age group and to the lowest point in the 35-44 age group (39.5%). From the age of 45 onwards, the figures started to recover, <AnnotatedWord word="stabilizing" note="Ổn định (Dùng dạng V-ing để nối mệnh đề rút gọn)" type="Grammar" /> between 43% and 47%.</p>
                                <p><AnnotatedWord word="Conversely" note="Ngược lại (Từ nối so sánh hoàn hảo)" type="Cohesion" />, only about 48% of female teenagers and young adults engaged in regular exercise, which is one of the lowest rates for females. Nevertheless, as females reached their middle ages, their participation rose. The figures reached 52.5% in the 35-44 group and peaked at 53.3% for those aged 45-54. Subsequently, a slight decline started, with around 53% <AnnotatedWord word="remaining engaged in" note="Tiếp tục tham gia vào" type="Advanced Structure" /> regular exercises for those aged 55-64, and approximately 47% for the 65+ group. In the 65 and older group, male and female participation rates were nearly equal.</p>
                            </div>
                        </LearningBlock>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
