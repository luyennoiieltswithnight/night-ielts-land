            script: `Hi guys, it's Jeff, again. Can you let me know when you've received this message? I've just realised that I probably won't be able to be there at the start of the competition because I have an appointment that I can't cancel, so I'm going to tell you what event I want each of you to organise during the day, just so that you know. I've tried to work it out so that each of you can be in charge of the event you prefer as far as possible. So, first of all, the morning: now, Steve and Amanda, I know that you both like badminton and Amanda, you used to do gymnastics, so I know you'd be happy with either, but I have to make sure of the best arrangement on the day. Amanda, if I remember rightly, you also once did some training in the rules of badminton, so it might be best if you take that on, rather than the gymnastics. It will be useful to have you there to help with judging line calls and so on. That means either you, Steve, or you Malik, with the gymnastics. Either of you is capable of doing that, but that leaves the weightlifting. Both of you do a lot of the general training in our sports centre, but this is a bit more specialist in terms of getting the weights right for each competitor. OK, for the moment, I'll put Steve in charge of the gymnastics and Malik can take care of the weightlifting in the morning, as I think you have just that bit more experience of dealing with weights, Malik. For the afternoon, I know Amanda and Malik would both love to do the basketball as you both play it, but Malik, you're already doing the weightlifting, so perhaps Amanda, you can do the basketball. Actually, no, I've just thought. I'm pretty certain I'll be in for the afternoon, so Malik, you won't need to do the weightlifting then. How about you do the basketball, Malik? Then I can take over the weightlifting in the afternoon, as I'm particularly keen on that, as you all know, and I'd like a chance to get involved with it. So then, Amanda, you can do the table tennis, but that leaves Steve without anything. No, that's OK, actually, if we leave it at that. Steve, you can be available to help wherever you're needed in the afternoon, and if something happens and I can't make it in the early afternoon, you can take care of the weightlifting till I arrive, though I don't think there'll be any problems. OK, if you need I to check on anything, call me on my mobile. Otherwise, see you next week. I think we're going to have a great day!`,

          20: {
            script: `A: All I'm saying is that if this government wins the election tomorrow, I think they'll just continue with the same things they've been doing over the last five years and make the economic situation worse in this country. People are already finding it difficult to live with prices going up and salaries staying the same.\nB: I don't think they'll win. People have had enough and are ready to vote for a change. I hope they do. If the other party gets in, it'll be like them winning the World Cup!\nA: Yeah, I saw it last night. I think it was really good the way that all the characters were actually well developed and interacted with each other. The danger with that kind of film is that the science fiction aspect just takes over and you get spaceships and battles with aliens who are trying to take over the Earth.\nB: I'm going to see it tonight. I listened to the review on the radio this afternoon and the critic really liked it, which is unusual because he doesn't usually recommend big commercial projects, which just aim to make as much money as possible.\nA: Did you see that report on the news tonight- the one about the robot football competition?\nB: Yeah. It was quite amazing. I mean, it wasn't like real football, but it is amazing what they can get machines to do with the right programming these days. I mean, those robots can detect the ball as it moves around the pitch and pass it to each other. And that winning goal was like Messi scoring!\nA: Yeah, I can see it becoming a real money-making business, just like the real thing!\n\nSpeaker 1: It's so important that we tackle this issue head on. We can't let it go on any longer without taking action. All the science shows that it's going to get out of control if we fail to act. The government should be supporting renewable forms of energy and we really need to reduce our dependence on oil and gas. I just wish other people could see that!\nSpeaker 2: There's so much nonsense spoken about it. Really           21: {
            script: `Speaker 1: I don't really have much of an opinion about it. As far as I'm concerned, if it appeals to someone, that's fine. If it doesn't, then why should anyone complain about that? Personally, I like some of it, but I'm not really bothered. I can take it or leave it.\nSpeaker 2: Well, from what I can see, you have a lot of people looking at it and talking nonsense about how good it is. Then you also have people with too much money and too little sense, who are prepared to waste their money on this stuff. It's ridiculous! There's no comparison with the great art of the past few centuries.\nSpeaker 3: Oh, I think not enough people appreciate it. They look at it and think, well, my kid could do that. They think that something from the eighteenth or nineteenth century is true art and they don't understand that art develops and changes over time. These artists today are just as skilled and creative as those in the past and they should be appreciated for what they do.`,

          22: {
            script: `Maria: Hello Simon.\nSimon: Hi Maria.\nMaria: OK. What topic do you think we should choose for the project we're starting next week? I think we need to make sure that it's going to last over the next few months so that we can complete the project.\nSimon: Well, there are several possibilities. Have you heard of the Pluto expedition? The spacecraft is about to arrive there and it's going to send back pictures that we've never seen before. It should be really interesting.\nMaria: That sounds like a good idea. What do you think, Dr Thornton?\nDr Thornton: Well, I'm not so sure about that one. I mean, it's already been going for ten years and I think we should look at something which is planned for the future, but hasn't started yet. It would give you a better chance to study it in depth and do far more analysis for your monthly update reports.\nSimon: I don't think that's a problem. There'll be a lot of coverage on the news over the next few weeks.\nMaria: Hmm... that's true... but we really need something to last for a few months. On second thoughts maybe Dr Thornton's right. Perhaps we should look at something which hasn't started yet. Isn't there something I heard about a new Mars expedition? I think there's a group of people out in America somewhere who are preparing for a trip to Mars.\nSimon: Yes. It was in the news last week. They've built a sort of camp in the desert in Arizona. There are ten people living there for six months, just like they would be together on the trip to Mars and after they arrive there.\nDr Thornton: That'd be ideal. Six months is just right for you. You could follow their progress and how the project develops. From what I know, the Pluto project is already a success, but with the Mars one you can assess how successful it is as it progresses and you can write it up for your final report.\nMaria: Hmm... yeah... that sounds promising.\nSimon: OK, but before we decide, I'd just like to mention one more. I heard that the Chinese are planning an expedition to the moon.\nMaria: What? Another man or woman on the moon? That's already been done. I don't think the moon's particularly interesting these days.\nDr Thornton: Simon has a point. I mean, the Chinese are coming up now and they've got some new ideas. I don't think they're sending any astronauts. I think it's just an expedition with robots and machines to find the best place to start a colony.\nMaria: Yes, but I don't think that's particularly interesting. I mean, no one has ever seen Pluto close up and no one has tried to go to Mars, so I think they'd be more interesting expeditions to do.\nSimon: You have a point. Perhaps it would be better to focus on one of the other two.\nDr Thornton: OK, if you ask me, I'd prefer to see how a group of people get along living together in a difficult situation, like they'll be doing in Arizona in preparation for their trip. I think you'd get far more out of that, but the final decision is yours. What do you think?\nMaria: I agree. I'd prefer to go for that one.\nSimon: So that's agreed then. Good. Let's make a start.\nDr Thornton: Excellent. I'll make a note of that. We'll meet again next Wednesday and you can give me your project outline. I'm looking forward to seeing it.`,
            annotations: []
          },

          25: {

          27: {
            script: `Dr Thornton: Well, as psychology tutor, I find that really interesting. Many types of people participate in projects studying the effects of isolation. We all know that one of the main issues with a project like this is how people will get on when they are locked away together for such a long time. It can produce all kinds of psychological and emotional problems. That's what I'm particularly interested in and one of the reasons why I wanted you to do this particular project.\nSimon: Me too. That'll be one of the most important things to come out of this project - how people can control their emotions and feelings over a long time when they can't get away from each other.\nMaria: True, but we have to remember that this is a science project and not some soap opera or television series with lots of silly people locked up in a big house or something.\nDr Thornton: I can see what both of you are saying, but there are always going to be problems like these so it's not surprising when they happen. In fact, this is the first time someone has got really angry in the first three months, so I think that's quite a positive thing.\nMaria: So what do you think will happen? Will they make him leave?\nSimon: I don't think they can. It's all part of the programme. And anyway, as the environmental engineer, Joe is an essential member of the team. If he left, then the whole environment of the building would go wrong, so I think they'll just have to work the situation out. Remember last month, when the ventilation system broke down? They almost lost all their fresh air. He only had a couple of hours to fix it and he managed to do it.\nDr Thornton: I'm sure they'll work it out. So what else have you found out...?`,

          28: {
            script: `Dr Thornton: So now that the project has ended, we need to review it and I can help you plan your final assignments.\nMaria: Yes. I never thought that of the ten who started out only six would finish in the end, and it was really hard for them to get through the whole programme. So, what have we learnt?\nSimon: Well, I've got lots of data on the environmental systems and life support, and that's the key focus of my project report, especially considering the events last week, when the whole system came close to failing.\nMaria: Right. When the life support system went offline for four hours, they had to really race to fix it. If that happened on a real trip, it'd be a disaster! They could all die.\nSimon: I know. It's good that they weren't actually in danger in this project, but I agree, in a real situation people could have been killed. Who would've thought that it'd be on the front page and first item on the evening bulletin? It shows how much interest there's been in the project. Anyway, I'm hoping to use the data to design a new system if it's not too difficult.\nDr Thornton: That would be challenging but fascinating at the same time. I think you'll do well with that, Simon. Personally, I'd love to focus on the particularly interesting and useful data on the health of the participants. I think it'd be worthwhile writing about the physical effects of the project, you know, how they kept healthy in the long term, even though they became ill sometimes, but also about the psychological effects of living in an enclosed group like that. It'd be interesting to see it any of them will have any long-term health changes. Would either of you like to take that on?\nSimon: Well, I'm not sure if I could take that on as well as producing an assessment of the life support issues. I feel that those are more significant in view of the current developments in technology to support this kind of expedition. I've already\nMaria: That'd be a great idea, Simon - to write an article - but for me, the main thing is the efficiency of the crew and how well they managed to perform their duties. I'm focusing specifically on their abilities to work under the stresses of living in an enclosed environment. I'm going to analyse how well they managed to maintain their effectiveness over time.\nDr Thornton: That's interesting. Maybe you could include a section on the psychological effects of long-term isolation. Remember the incident early in the project? It'd be very interesting to follow that up with the latest developments and results. I can give you some of the latest research on the subject from other studies for you to compare. I think it would significantly enhance your research and findings.\nMaria: OK. That sounds like a good idea. It shouldn't be too difficult to develop a wider theme to include the psychological studies. I'll work out a structure for next week.\nDr Thornton: That's great, Maria. We can meet again next Wednesday and I can help you structure it. And what about you, Simon? Do you think you have enough?\nSimon: Yes, thanks, Dr Thornton. I've got plenty to think about, especially as the study of life support was the main aim of the whole project. I could include some observations about the effects on the physical and mental health of the participants, as it's relevant.\nDr Thornton: That's fine, then. Is there anything else you want to discuss?\nSimon: One thing I'm really surprised about, is that they managed to complete the project without any extra costs. Everyone was expecting it to go over the original $10 million. I personally thought that it might even go up to something like $12 million.\nDr Thornton: Well, actually, it says here that the final cost was $9.5 million, so they saved half a million in the end.\nSimon: They could give that to us to fund our projects! Is there anything about future developments?\nDr Thornton: Well, I heard that they're going to share their research results with government and private organisations. There are a few other organisations planning trips to Mars that would love to study the results. I'm not sure the government is planning anything, but they'd be interested anyway.\nMaria: What about a follow-up? Are they planning another project?\nDr Thornton: Well, depending on the results from this one, they're going to decide whether to have another one that will last a -year. Obviously, they'll have to find some more participants. Would either of you be interested in taking part?\nMaria: It depends. I wouldn't say no, but I'd have to think a long time about it. I don't know if I'd want to be cut off for so long.\nDr Thornton: I think you should bear it in mind. It would be so interesting to see how staying in a situation like that for a year affects physical and mental health. I'd love to follow your progress myself. I might even volunteer! What about you Simon?\nSimon: Oh, you wouldn't catch me inside one of those places! I'll be happy to follow what goes on and see how the whole system works over a year, but definitely from the outside, not the inside... I wouldn't mind working for the company, though. It'd be great to study it and get paid at the same time!\nDr Thornton: Well, thank you, both of you. You've produced excellent results and I'm looking forward to seeing your final submissions.`,

          42: {
            script: `Dr Lethbridge: In last week's lecture I talked about employment and aspects related to it, including contracts, income tax and so on. However, people are increasingly looking at other forms of earning a living by working for themselves and being in greater control of their working lives. Today Dr Korpis and I are going to talk about three different ways in which people can work for themselves. They can set up a company, set up a partnership, or they can work as a sole trader. There are important legal and financial matters to take into consideration when choosing one of these structures as a way of doing business in the UK. First, I just want to outline the main differences between these three types of business structure, which are to do with tax and registration. Regarding registration, those wanting to set up a limited liability company have to legally register the company with Companies House, the government department responsible for businesses. 'Limited liability' means that, if the business fails and the owners owe a lot of money, they only lose the money and goods which are in the business, and not their own personal money and goods. This is because the owners of the company are separate from the company itself. On the other hand, a sole trader doesn't need to set up a company; he or she can simply start working without any legal registration. A partnership can be limited or unlimited. An unlimited partnership is just like a sole trader, but with two or more partners. In this situation, each partner shares expenses and also income. A limited liability partnership, or LLP for short, is like a limited company, because it must be legally registered in the same way. So just to summarise: with limited liability companies and limited liability partnerships, the owners and the company are separate in legal terms, but with simple partnerships and sole traders, the business and the owner are not legally separate. The other main difference is to do with money- both with finding money to start your business, and with paying tax. For example, it might be difficult to borrow money from the bank if you're a sole trader, but easier if you have a limited company, as banks trust companies more. Regarding tax, limited companies pay corporation tax, which, unlike income tax, is a tax on business profits, not personal earnings. This is more favourable for companies, as corporation tax is usually less than income tax. On the other hand, with sole traders and partnerships, whether simple partnerships or limited liability partnerships, the owners must pay income tax, which may be higher than corporation tax.`,
            annotations: []
          },
          43: {
            script: `Dr Korpis: Thank you, Dr Leth bridge, for your introduction. I'd now like to move on to the details of each type of business structure and discuss the advantages and disadvantages of each, starting with the sole trader. This is simply a person who runs a business alone. On the practical side, there's no need to register with Companies House, which means the sole trader is not legally the same as a registered company. The trader can simply choose any name and start trading without paying any fees. There's no need to register an office, so the trader can even work from home. There are also no legal requirements to submit financial accounts to Companies House. As a result, this is the simplest and most straightforward way to start out in business and work for yourself. Another benefit of being a sole trader is that you are your own boss. You don't have to answer to anybody else, you make your own decisions and you don't have to share your earnings with a partner. However, it doesn't mean that you have to do everything alone. You can also employ or give contracts to other people to do work for you, though, of course, you need to be aware of regulations regarding employing others. So these are the desirable aspects of being a sole trader but there are other matters which need careful consideration. When you're in employment, you are taxed at source, which means your employer takes your tax from your earnings every month and sends it to the tax office, so you don't need to worry about it. However, as a sole trader, you are self-employed, which means you are responsible for what you earn, what you spend and the tax that you must pay. This means you have to complete an annual tax return. This is a document which you send to the tax office once a year showing what you earn from your business and what you spend in running your business. On the positive side, you're only taxed on your earnings after expenses, such as transport, electricity, office equipment and so on. So, if you work from home, you can save tax by declaring some of your use of electricity as necessary for your business. Another consideration is that if you earn over a certain amount, you pay a higher rate of income tax, which is higher than the corporation tax rates that companies pay. You'll also have 'unlimited liability', which means that if you can't pay your business debts, you may lose your house and car to pay for them, as you are your business. Finally, many sole traders find it difficult to take holidays and breaks from the business and find that they spend far more time working than employed people. The typical traders associated with this type of business structure are skilled manual workers, such as builders, plumbers and electricians, or professions in which people usually work alone, such as photographers and writers. However, increasingly these days, with the reduction in long-term employment and job security, sole traders are coming from other professions, such as computer programming and even teaching, especially tutoring. Certainly, being a sole trader is a very useful way of starting out in business by yourself.`,

          44: {
            script: `Dr Lethbridge: Thank you, Dr Korpis. The next form of business structure that I would like to discuss is the 'partnership'. There are two kinds of partnership - a simple partnership and a limited liability partnership or 'LLP'. I'll talk about each of these in turn. Forming a simple partnership is straightforward, like becoming a sole trader, except that you have to agree to work with someone else. A partnership could be between a husband and wife, or two members of the into the partnership if it fails. However, if partners earn a lot of money, they will still pay more tax than the owner of a limited liability company pays.`,

          45: {
            script: `Dr Korpis: Thank you, Dr Leth bridge. The last form of business I'd like to talk about is the limited liability company. The owners of a limited liability company are called 'members' or 'shareholders' as they own shares in the company. A 'share' is a divided-up unit or part of the company. All businesses run the risk of failing or going bankrupt. If a business goes bankrupt, it has to close because it owes money and is not able to pay the money back. As I mentioned before, setting up a limited liability company, like an LLP, means that if the company fails or goes bankrupt, the business owners lose only what they have put into the business and not their own personal goods and property. This is the idea of liability- how much a business owes in debt if it can no longer operate and has to close. For example, if a sole trader goes bankrupt, he or she may need to sell his or her own house and possessions in order to pay any debts, because the business is not separate from the owner. With LLPs and limited liability companies, the owners and the businesses are separate, so property and goods owned by the business can be sold to pay debts, but not property and goods personally owned by the members or company shareholders. Just as with LLPs, limited liability companies (or 'limited companies' for short) must be legally registered with Companies House. This means they must have a registered address, where all the company documents and records must be kept. As with LLPs, accounts and annual returns must be submitted every year so that anyone can have a look at the company's finances before doing business with it. The level of administration is higher than with other business structures and you need to have a managing director and at least one shareholder. In terms of paying tax, the company has to pay corporation tax on its profits, which is far less than income tax on large amounts, especially over around £50,000. However, you also have to pay income tax on any money you take as a salary from your company. As with the other business structures, the company tax assessment must be submitted to the tax office, but for corporation tax`,

          46: {
            script: `Dr Lethbridge: So, let me summarise the differences and similarities between each business structure. On the one hand, it's fairly simple and inexpensive to set up as a sole trader. You don't have to worry about lots of administration and financial organisation, and you can keep total control of your business and decision making. On the other hand, you may end up paying more in tax than you would as a limited company, you are personally responsible for your debts and losses and it might be more difficult to get valuable contracts if your business does not have limited liability. With regard to partnerships, there are two kinds: simple partnerships and LLPs. In comparison with sole traders, partnerships have the benefit of more people to plan and make decisions. It's easier to take care of the business when one partner is not able to take an active part, and it can also be easier to borrow money than for a sole trader. On the negative side, liability is shared among the partners and having more than one owner can make things more complicated when there are disagreements, or if the business needs to be brought to a close. One other difference between sole traders and partnerships is that the partners need to trust each other. If a partnership has serious money problems, one partner may leave the other to deal with the debts. Clearly this is not a problem for sole traders. One similarity between partnerships and sole traders, though, is to do with tax. The sole trader must submit a yearly income tax assessment to the tax office. The same is true of partnerships, as members are treated individually for this purpose. When we compare simple partnerships with LLPs, we can find various differences. For example, LLPs are legally required to submit their accounts and annual returns to Companies House. This is not something that is required for simple partnerships. Another difference is to do with debt. In an LLP, the partners' personal possessions and property are protected. In a simple partnership, however, like sole traders, the members are personally responsible for any business debts. Finally, limited liability companies have two main advantages over simple partnerships and sole traders: this type of structure limits the financial liabilities of the owners to business losses and not personal losses, and it can save money, as corporation tax is generally lower than income tax. On the other hand, there are a lot more administrative and legal requirements. Company accounts and an annual return must be sent to Companies House. Similarly, there is a legal requirement to keep company records at the registered address.`,

ness. Melissa has also taken a Master's degree in Business Administration, so she's confident about her skills as a businesswoman. They've managed to save over £3,000 to rent office space and £10,000 to buy equipment to run their business. The best option for them would be to register a limited company and start trading straight away as they have a good level of knowledge and experience which will benefit them. They don't intend to employ anyone immediately, but the option is there if they need to in the future.`,

            script: `Lecturer: Despite the benefits of tracking, which its supporters claim, there are clearly various concerns connected with it. Some of these are real, but it's possible that they're not as well-founded as opponents of tracking would have us believe. So, what exactly are these concerns? Well, we can divide them into three categories: environmental concerns, health concerns, and economic concerns. To begin with, let' s look at the environmental concerns. The first, and possibly most significant environmental concern is that, despite producing lower levels of carbon dioxide, shale gas is still a cause of global warming and so it should not be used. In effect, it simply stops energy producers and governments focusing on the real need to develop renewable sources of energy. What's more, it's likely that, although countries, which produce shale gas will use less coal and oil, the use of coal and oil will still continue to increase in other places, so globally there will be little or no benefit to the environment.`,
            annotations: [
              {"term": "significant", "level": "B2", "meaning_vi": "đáng kể/quan trọng"}
            ]
          },
          57: {
            script: `Lecturer: While tracking is being used around the world, we've seen that there are serious concerns about it. What's clear is that tracking isn't the answer to the growing worldwide need for energy as countries increase their consumption. Already, the amount of carbon dioxide in the atmosphere has reached 400 parts per million. This may not seem very high, but we have to remember that 200 years ago the level was around 280 parts per million, so it's increased by over a third since then. As a result, it's estimated that global temperatures have already increased by almost one degree Celsius. This increase changes the climate and affects the weather in many parts of the world. Many places, such as north-west Europe, are expected to become warmer and wetter and we've seen winter storms becoming worse in this region. Other places such as sub-Saharan Africa are expected to become hotter and drier, with deserts growing in area and seriously affecting farmland. Ice in the polar regions will melt and sea levels will rise, which will put coastal cities in greater danger of flooding. Clearly, we need to reduce, and eventually stop using non-renewable resources, like coal, oil and gas. It may well be true that tracking can slow down global warming for a while and allow us to develop better renewable resources. However, these resources, like wind, wave and solar power, are currently far more expensive to develop than shale gas production. On top of that, they take a long time to develop and start paying for themselves. Consumers have to pay higher bills to help the development of cleaner sources, and energy companies don't want to lose customers by asking them to pay more. Consequently, it's important for international organisations like the United Nations and national governments to support the development of renewable resources. The problem here, of course, is that governments usually think of short-term answers to energy problems and not longer-term ones. They're afraid that if they reduce the production and use of gas and oil, their economies will do worse than other economies, so they don't want to take action to increase the use of renewable sources.`,
            annotations: []
          },

            script: `A: I'm sorry to hear that you didn't get the grades to get into university. What are you going to do now?\nB: I'm not sure. I can take my exams again at the local college, but I'm not sure if I want to do that. Maybe I'll take a vocational course there instead to learn the skills for a particular job, like accountancy or business studies. At least if I pass that, I can go straight into work.\nA: So how's Jenny settling down? It's always difficult when they start school. My son, Timmy, took weeks to get used to being away from me all day.\nB: Oh, she's fine. She loves it, especially learning to write. She doesn't miss me at all. I'm the one with the problem. I really miss her being at home all day. But after all, it's the law - she has to go!\nA: I've found this evening course in photography at my local centre. It's two evenings a week and only costs £150 for the term. You've always been interested in photography as a hobby. Why don't you come too?\nB: Oh, I did that course last year. It's really good. I'm planning to take a course on setting up a website, so that I can display all my photos. It does seem strange, though, to be learning something new again after so many years!\nA: I think it's really useful for them to start early. I know it can be expensive, but it's worth it because they already know what it's like to be with others in a class when they start school.\nB: That's true. In my case, it's not just the benefits of socialising with other children, it also means I can go back to work. It's a pity I can't get a free place for my son - though I don't have to pay very much, thank goodness.\nA: Well, my daughter is off tomorrow to start her degree course - a whole new adventure in a new city. I'm nervous, but she's really thrilled about it. There's a week for the new students - it's called freshers' week - when they find out what they need to know, join clubs and get used to being away from home, and then the course starts the week after.\           62: {
            script: `Lecturer: Now I'd like to turn to educational opportunities between the ages of 16 and 18. There are various choices open to pupils of this age. The first thing to decide is whether to start work or to continue studying full-time. Of course, starting work means going straight into employment, although young people aged between 16 and 18 will still need either to study part-time, as well as doing their job, or to join an apprenticeship or traineeship scheme. For those who want to continue studying full-time, there are two paths: academic and vocational. Academic qualifications, mainly Advanced level exams, known as 'A levels', are taken by students aiming for university study. Vocational qualifications, such as those offered by the Business and Technology Education Council (or 'BTEC' for short), prepare pupils for a specific profession, such as engineering or computing. Most of those who wish to continue academic studies will go to the sixth form in their school or a specialist sixth form college. Alternatively, they can study A levels at a further education college, also known as an 'FE' college. Either of these routes will take students to university. On the other hand, those who wish to study a vocational qualification will typically go to a Further Education college, and, after qualifying, will be ready for employment. There are other options for those who want to start work at 16. Since 2015, young people between the ages of 16 and 18 must continue to learn in a specified learning environment, in addition to working for an employer. The first option is to work for an employer and study part-time for a vocational qualification, such as a National Vocational Qualification`,

          63: {
            script: `Mr Green: So, Amanda, you want me to help you with your application. Let's have a look at the UCAS website. Do you know what 'UCAS' stands for, by the way? It's the University and Colleges Admissions Service. Have you set up an account with them yet? Amanda: Yes. I did it last week, but I haven't completed my application. One thing I need to know is how many universities can I apply to? Mr Green: Well, first of all, you need to see how many offer the course you want. Remember, you'll want to choose the universities, which have the best reputation, but you need to have some kind of back-up in case you don't get into your first choice. What are you studying? Amanda: I'm doing A levels in Biology, Chemistry and Psychology, so I'm thinking of taking Biochemistry. Mr Green: OK. Well, there are seven good choices I could give you. Apart from Oxford and Cambridge, Imperial College in London is very good, and York is also a good possibility and easier to get into. Amanda: OK. I don't think I'll get into Oxford or Cambridge, so I can include York and Imperial College. Mr Green: OK. I think you should go for those two, plus three others, because the maximum number that you can put on your application is five. How about Durham, Sheffield and Exeter? Amanda: OK, I'll look at those. Another thing I'm not sure about is how to make a good assessment of myself and my skills and abilities. I've always found that difficult.. too much as a lot of that might not be relevant to the question. Terry: So I should aim for between two and three thousand as a rule... there's one last thing I wanted to check about assignments, and that's references. How many do we need generally? Dr Harris: Well, as your course is international finance, you have to use banking, finance and news sources as well as academic sources. Ideally, you should have around ten.references for each assignment to show that you've read widely, but we expect a minimum of five sources which are academic journals and books. From the other sources, we'd generally expect three to be used. Terry: OK, thank you Dr Harris. That's cleared up a lot of things for me. Dr Harris: Glad to be of help, Terry. See you next week.`,

          64: {
            script: `Dr Harris: Hi, Terry. Come in. What can I do for you? Terry: Hi, Dr Harris. Well, I just wanted to check on some information about the course, as it's all new to me. Dr Harris: Of course. What do you need to know? Terry: Well, first of all, I'm not sure exactly what a seminar is for. We never had them at school. I know it's to discuss things together, but is it more than that? Dr Harris: Well, yes, you're right, it is really. You see, at university we typically have lectures, you know, with about 100 or 200 students in the lecture theatre together. It's a one-way form of learning. The lecturer sets out the topic and discusses it and you take notes. Then you need to review your notes following the lecture and also do some extra reading. Terry: And where does the seminar fit in? Dr Harris: It could come at any time once you've had some time to think about the lecture. When you attend the seminar, you should have some of your own ideas to discuss with the other students, usually up to ten of you. It allows you to discuss the topic, exchange ideas and prepare for your assignments. Terry: OK, thanks. And what about tutorials? Are they like seminars? Dr Harris: Well, usually we try to space them out over the term, so that we can have a chance to check on your progress and how well you're doing with your assignments. It often depends on when your tutor is available, and at times that might mean you have three weeks between tutorials. Normally every term you should have one at the beginning, then usually another four, spaced out depending on your programme, and one before the holiday. So that works out about one every two weeks. Terry: Right. And what about assessment? How many exams do we have to do? Dr Harris: Well, that varies from course to course, but generally we focus on continuous assessment more than exams, though exams are, of course, very important too. We tend to assess you over the first two years through your assignments, which is over half of your overall assessment, usually 60%, and then most of your exams will come in the final year. Terry: OK, I'm happy with that. I get really nervous before exams. And talking about assignments, how long should they be? Dr Harris: On all undergraduate courses, students tend to write about 3,000 words or so, but it varies depending on the question. However, there's a minimum of 2,000, and while there's no upper limit, you should be careful that you don't write`,

y without actually being an employee, but possibly with some pay. It'll give you a chance to develop your career and also learn more about your subject specialisation in a commercial environment. After that, you may well get a good position in the company. We have some good commercial Jessica: contacts for internships here. That might be the best option, but I wouldn't Dr Ross: earn much to begin with, would I? No, you wouldn't. You could try getting a permanent job now if you want. There's a graduate fair here in the city every year, as well as in other cities around the country. You'll have the chance to meet all the leading companies in Jessica: the sector and discuss opportunities with them. It's worth considering. Well, I have a lot to think Dr Ross: about. Can I meet you again next week? Of course. Just send me an email and let me know when would be a good time.`,

          67: {
            script: `Examiner: In your opinion, what is the effect of private tutoring on education?\nStudent: I think we have an education system where those who have lots of money do better than those who haven't, because many students can't afford private tutors. The tutors teach things at a higher level than the school curriculum, so many students see regular school as a waste of time. That's not really fair, so the government should change the law to limit the cost of private tutoring, so that it's more equal for everybody.\nExaminer: Is private tutoring more important today than it was in the past?\nStudent: Well, I think that private tutoring is certainly more important now than in the past. I mean, in the past we only had tutors for English lessons as it was hard to find people who spoke English well enough to teach conversation in schools. But now we have tutors for everything, even tutors who teach three-year-olds how to pass interviews. Perhaps things have gone a bit too far now.\nExaminer: What more can governments do to reduce the need for private tutoring?\nStudent: I think that governments must make changes to the curriculum so that schools cover all the subjects that are usually taught by private tutors, like English conversation, art, music and other things. If we can get these subjects taught more in schools, then students might not need to go to private tutors to learn them.\nExaminer: How can we encourage more parents to teach their children at home?\nStudent: I know that parents are very busy, but they at least have free time at the weekend. This doesn't mean that they should spend their weekends making their children memorise lists of vocabulary,. but perhaps if parents make time to do things like drawing pictures, reading, or\nSpeaker 3: One of the main issues that we had with this event was that the main attraction Paul Simmons, had to cancel at the las{ minute as he'd been suffering from a serious throat infection for a week and hadn't managed to recover in time. As a result, we had to find another act, and managed to get Nicky Munroe at very short notice. She performed magnificently, the audience loved her and that saved the festival I would say. Everyone agreed that she has an amazing vocal range.\nSpeaker 4: The most successful aspect of the event was the variety of products that were on offer. It's wonderful to see students being so creative. We saw practical applications that'll make significant developments in education and even business if they go into production, as well as very entertaining ideas, especially the robot football game. I'm pleased to say that our college team won! I'm sure you'll all agree when I say that the quality of the talks and performances over the last three days was very high. The talk given by the top novelist, Henry Peters, on effective plotting and characterisation was excellent, and the audience will have learnt a great deal to help them with planning and writing their future works. What's more, the quality of verse produced in the workshops was very high, and we hope to run that again next time with greater overall participation. While there were some wonderful and fascinating works on display, I felt that there wasn't enough variety. Unfortunately, this was because of the limited exhibition space we had. This meant that we could only have one room for portraits and another for landscapes. We hope to extend that next year into other forms, such as still life and abstract, but we'll have to see what rooms are available. We also hope to install clay ovens next year to give our students the chance to create their own pottery and display it for the visitors.`,

          69: {
            script: `Dr Saunders: Hello everybody. Welcome to this meeting to review this year's arts festival. As you know, this is the fourth and biggest festival that we've run at the university and it's clear now that it's fast becoming a fixture in the calendar of the city and the county and attracting attention from the rest of the country, as well as from abroad. First of all, I'd like to review the preparations for the festival, then go on to do an analysis of the festival itself and how well it went. The plan is then for you to work in teams of three, with one tutor and two students in each team, and for you to discuss the festival in more detail so you can come up with suggestions for the organising committee to consider for next year's festival. Well, as I said, we're in our fourth year and we added some new events. The first festival focused mainly on music and the performing arts, as it was felt that those would be the best types of event for both students and the public to take part in. More forms of art, in particular short films and photography, were added over the next two years and this year we have extended our offer to include painting and crafts, with a particular focus on the students here producing their own work, both for exhibition and competition. This was largely successful, but I'll discuss that in detail later. We also invited professional artists in some of the fields to perform, and that will be something for you to review for the next event. What was particularly encouraging this year, was that we had contributions to the festival from the highest number of students to date, with representatives from every nationality at the university. As in previous years, we planned to use the spare university accommodation for all the visitors, both students and non students, but as we expected a greater attendance at this year's festival, we also arranged accommodation at the city college three miles from here and arranged coach transfers between the college and the university campus. Unfortunately, that`,

          71: {
            script: `Dr Reynolds: So, first of all, we need to look at the events and see what should be included in next year's festival and what changes should be made. Dr Saunders mentioned that there were issues with the music and crafts. What are your feelings on those two issues? Do you want to start, Sangita?\nSangita: Well, as regards the music, I think we need to have another artist in reserve in case the main act can't perform, like in this year's festival. It doesn't have to be a well-known band. It could be a small act, like a student band. What do you think, Lawrence?\nLawrence: You have a point, but I'm not really sure if any artists wou\\d be happy to perform only if the main act lets us down. In any case, how often does that happen? This was the first time, and I don't see it happening again in the future.\nDr Reynolds: I'm not sure we can take that for granted, Lawrence. If you look at what happened, we lost £3,000 as we had to return money\nLawrence: How about we arrange the programme so that on one night there isn't a famous headline act but a good local band, so that we can change the programme to make them the main act if anyone else isn't able to perform. We could put them on the last evening, and tell them that they may be needed on the other evenings, just in case. That way, we're helping good local talent and making sure that our visitors are happy.\nSangita: Yes, I can see that working. Then we could use the student band to play the last night if we have to switch the local band from the last night to an earlier night.\nDr Reynolds: OK... good ideas. I'll make a note so that we can take it back to the organising committee. Now, let's move on to the question of crafts. As we heard, the event didn't go very well and lacked visitors. What do you think we should do, Sangita?\nSangita: Well, I have a personal interest in this. I've been creating my own fashion designs and I had some clothes on display mixing Western and Indian themes. Actually, I spent some time watching the visitors and I thought they liked clothes a lot. I think we have to be careful to distinguish the clothes from the other crafts.\nLawrence: Yes, I noticed that. I spent the third day in the craft section helping visitors and I noticed that the clothes exhibition was the most appreciated. I think the glass and ceramic section had hardly any visitors when I was there. Perhaps we should just have the clothes on display, maybe even extend that section?\nDr Reynolds: Yes, that could be a good solution. I don't think we should get rid of the glass and pottery altogether, but I certainly think we should promote the clothes section more.\nLawrence: Well, here's a suggestion: we could even think of turning that into a separate fashion show. What do you think of that?\nSangita: Good idea! I was thinking about that anyway. Can we put that to the committee?\nDr Reynolds: Of course. I've made a note of it. Regarding the theatre and poetry, do you think we need to make any changes?\nLawrence: Nothing major, I don't think, but perhaps we should use at least one day to present new plays and poems by our own students. It's wonderful putting on plays by well-known\nDr Reynolds: Excellent idea, Lawrence. What do you think, Sangita?\nSangita: Yes, but let's not limit it to just English. We could also have performances from our international students in their languages. I think that would really help promote the festival as an international event.\nDr Reynolds: Fine. We can propose that as well. And as far as the photography and cinema sections are concerned, they'll keep expanding.\nLawrence: Well, personally, I don't think the quality of the photography exhibition was very high. I think there are issues with digital photography being presented as a printed exhibition. You can never really capture the true meaning of the photograph like that. I would suggest just having digital displays, you know, tablets that visitors can use to see the photographer's collection. That way, it'll encourage photographers to develop their ideas and think about their exhibits almost as films with a story. I think that's the way photography is going these days.\nSangita: I don't agree. I think each image should be appreciated in its own way, as the photographer intends. I don't think we should, push photographers into one direction. That said, I think the idea of having tablets and digital screens is a good idea if we can afford it. Perhaps we could have two sections - digital displays and non-digital displays.\nDr Reynolds: Sounds good, Sangita. I can certainly put that to the committee and see if they'll consider it. So, if that's all about the events themselves, I'd like to discuss the organisation of the festival...`,

udents about the festival earlier in the year and invite them to suggest themes and also to volunteer their own cooking skills to help with it. I think that'll make sure that we vary what we offer from year to year, so that we don't just repeat the same dishes each time.\nLawrence: But we should always have fish and chips on the menu! We can't do without that! Seriously though, I agree.\nDr Reynolds: OK. I'll make a note of that as well. Moving on to the helpers, you were both directly involved in that. Do you think it was a good idea to get professionals for the organising?\nLawrence: In a word, 'no'. I think the ones that I worked with didn't really know what they were doing. We were paying them a lot to do their work, but I don't think they really took it as seriously as they should have. They were thinking it was just a student event. On more than one occasion, some of the volunteers had to take charge and make sure that the events went smoothly.\nSangita: Yes, you're right. That was my experience as well. We ended up paying them a lot of money for poor service. It was one of the reasons why there were too few volunteers at some events - because the organisation was so poor. I think the idea of bringing back former students is a good idea. At least then we can be more certain that they know about the university and they'll probably be more committed to doing a good job.\nDr Reynolds: I think you're both right. I was disappointed and I think former students will be a great improvement, so I'll note that as well. We need to talk about finance, but before that, I just want to mention the issue of security. Thinking about the stolen paintings, what do you think we should do about that?\nLawrence: I'm not really sure. I mean, we had the university security guards on duty the whole time, so I don't think we can really add to that.\nSangita: Well, I noticed on more than one occasion that there were windows open in some rooms which made it easy for people to climb in and steal things. I think the main thing is to remind students and volunteers that it's their personal responsibility to be careful and look out for any security issues. So if one of us sees an open window, we should either check with security why it's open, or simply close it.\nDr Reynolds: You're right, Sangita. I'm sure the committee is aware of this, but I'll note it just to show that we've given it some thought. Now finance - what are your feelings on Dr Saunders' suggestions about sponsorship?\nLawrence: I don't think that will go down too well with most students. I mean, personally, I'm not against it, but I think students generally won't be very keen to have businesses involved in what they see as their arts festival. I'm sure they'll be happy to take part in more events to raise money throughout the year before the festival, but they won't be happy about big businesses taking over and having their names all over the university.\nSangita: Well, I think it's going to happen anyway. Everything is commercial to some extent these days. I don't think it's a bad idea, as long as it's done in good taste. I think any businesses that do want to sponsor us or advertise should be aware that they need to work closely with us and respect the spirit of the festival.\nLawrence: Perhaps we could involve local businesses as well as national ones that don't just put their name on the festival, but can actually sponsor specific events, award prizes, and so on. So, for example, a local cinema could sponsor the short film event and even send along a representative to judge the films, that sort of thing.\nDr Reynolds: Yes, I see what you mean. In that way, they'll be directly involved in the festival, which will encourage them to take an active part and build up their reputations for supporting the arts. Well, thank you both. We have a lot of useful suggestions to take back to the committee.\nDr Saunders: Well, first of all, I think that the fashion show is a good idea as it can help the international students to get involved in more activities and develop their ideas with clothes. But I'm not keen to get rid of the glass and pottery exhibitions completely, as it's important for the university to be seen to encourage all forms of art and not just the most popular ones, so we should keep that for the time being.\nDr Reynolds: OK... now... regarding theatre and poetry, they felt that it would be good for students to write and perform their own plays and poetry, as well as those by famous playwrights and poets.\nDr Saunders: That sounds like an excellent idea! It'd help a lot to raise standards in writing and performance. I'd love to see that taking place.\nDr Reynolds: Also on that topic, there was a feeling that works in other languages should be encouraged.\nDr Saunders: Most certainly. That would help the international students feel far more at home and valued as part of the university.\nDr Reynolds: There was one other event we discussed, and that was photography. It was felt that we should have both digital and non-digital exhibits.\nDr Saunders: I don't think we could manage that, at least not yet. Quality tablets and screens would be too expensive, especially with the number we'd have to buy, so it's not an option for next year because of the high cost.\nDr Reynolds: OK... as for the accommodation and the catering, they felt that we could use the holiday park that's being built nearby, and we should encourage students to take a greater part in cooking and helping with the catering.\nDr Saunders: Well, first, I know for a fact that the new holiday park is not likely to be completed by festival time next year as they've run into trouble with the building, but we could certainly think about it in the future. I do like the idea of the students having a greater role in the catering and cooking, as it will clearly be helpful for their all-round development.`,

            const [isReady, setIsReady] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [currentTime, setCurrentTime] = useState('0:00');

            const speeds = [0.5, 0.75, 1, 1.25, 1.5];

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            useEffect(() => {
                if (!waveformRef.current || !track) return;

                setIsReady(false);
                setIsPlaying(false);
                setCurrentTime('0:00');
                
                setShowTranscript(false);
                setTooltipData({ show: false, x: 0, y: 0, text: '' });

                if (wavesurfer.current) {
                    wavesurfer.current.destroy();
                }

                wavesurfer.current = WaveSurfer.create({
                    container: waveformRef.current,
                    waveColor: '#c7d2fe',
                    progressColor: '#6366f1',
                    cursorColor: '#312e81',
                    barWidth: 3,
                    barGap: 2,
                    barRadius: 3,
                    height: 60,
                    normalize: true,
                    backend: 'MediaElement',
                    url: track.url,
                    minPxPerSec: zoom,
                    hideScrollbar: false
                });

                wavesurfer.current.on('ready', () => {
                    setIsReady(true);
                    setDuration(formatTime(wavesurfer.current.getDuration()));
                    wavesurfer.current.play();
                    wavesurfer.current.setPlaybackRate(speed);
                });

                wavesurfer.current.on('play', () => setIsPlaying(true));
                wavesurfer.current.on('pause', () => setIsPlaying(false));
                wavesurfer.current.on('finish', () => {
                    setIsPlaying(false);
                    if(onNext) onNext();
                });
                
                wavesurfer.current.on('audioprocess', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });
                
                wavesurfer.current.on('seek', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });

                const container = waveformRef.current;
                const handleWheel = (e) => {
                    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
                        e.preventDefault();
                        const zoomDelta = e.deltaY < 0 ? 10 : -10;
                        setZoom(prev => {
                            const newZoom = Math.max(10, Math.min(prev + zoomDelta, 300));
                            if (wavesurfer.current) wavesurfer.current.zoom(newZoom);
                            return newZoom;
                        });
                    }
                };
                container.addEventListener('wheel', handleWheel, { passive: false });

                return () => {
                    container.removeEventListener('wheel', handleWheel);
                    if (wavesurfer.current) {
                        wavesurfer.current.destroy();
                    }
                };
            }, [track]);

            // --- XỬ LÝ SỰ KIỆN BÔI ĐEN VÀ HIỂN THỊ TOOLTIP DỊCH ---
            const handleMouseUp = () => {

                    if (text.length > 0 && selection.rangeCount > 0) {
                        const range = selection.getRangeAt(0);
                        const rect = range.getBoundingClientRect();
                        
                        setTooltipData({
                            show: true,
                            x: (rect.left + rect.width / 2) || 0,
                            y: (rect.top - 8) || 0,
                            text: text
                        });
                    } else {
                        setTooltipData(prev => prev.show ? { ...prev, show: false } : prev);
                    }
                }, 50);
            };

            // Ẩn Tooltip khi click bên ngoài
            useEffect(() => {
                const hideTooltip = (e) => {
                    if (e.target.closest('#translate-btn')) return;
                    const selection = window.getSelection();
                    if (!selection || selection.toString().trim() === '') {
                        setTooltipData(prev => prev.show ? { ...prev, show: false } : prev);
                    }
                };
                document.addEventListener('mousedown', hideTooltip);
                return () => document.removeEventListener('mousedown', hideTooltip);
            }, []);

            // Mở Tab Google Dịch
            const openTranslate = () => {

                    setTooltipData({ show: false, x: 0, y: 0, text: '' });
                    if (window.getSelection) {

                    }
                }

                                    </button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-5">
                                    <button onClick={() => skip(-5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Lùi 5 giây">
                                        <i className="fas fa-undo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                    
                                    <button onClick={togglePlay} disabled={!isReady} className={`w-16 h-16 flex items-center justify-center rounded-full shadow-premium transition transform hover:scale-105 ${isReady ? 'bg-primary hover:bg-primaryHover text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                        <i className={`fas text-2xl ${isPlaying ? 'fa-pause' : 'fa-play pl-1'}`}></i>
                                    </button>
                                    
                                    <button onClick={() => skip(5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Tiến 5 giây">
                                        <i className="fas fa-redo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button onClick={changeSpeed} className="md:hidden px-3 h-10 flex items-center justify-center rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm transition min-w-[3.5rem]" title="Tốc độ đọc">
                                        {speed}x
                                    </button>
                                    <button onClick={onNext} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center">
                                        <i className="fas fa-step-forward"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [currentTrackIndex, setCurrentTrackIndex] = useState(null);
            
            const handlePlayTrack = (index) => {
                setCurrentTrackIndex(index);
            };

            const playNext = () => {
                if (currentTrackIndex !== null && currentTrackIndex < tracks.length - 1) {
                    setCurrentTrackIndex(currentTrackIndex + 1);
                }
            };

            const playPrev = () => {
                if (currentTrackIndex !== null && currentTrackIndex > 0) {
                    setCurrentTrackIndex(currentTrackIndex - 1);
                }
            };

            return (
                <div className={`flex-grow transition-all duration-300 ${currentTrackIndex !== null ? 'pb-[26rem] md:pb-[30rem]' : 'pb-20'}`}>
                    <header className="pt-16 pb-12 px-4 text-center">
                        <div className="max-w-3xl mx-auto">
                            <div className="inline-block px-5 py-2 bg-white/10 text-white font-bold rounded-full text-sm mb-4 tracking-wider uppercase border border-white/20 backdrop-blur-md shadow-sm">
                                VOCABULARY & TRANSCRIPT MODULE
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight drop-shadow-lg">
                                Sách Mindset 2
                            </h1>
                            <p className="text-slate-300 font-medium text-lg drop-shadow">Hệ thống phân tích sóng âm & Học từ vựng thông minh</p>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-xl">
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                {tracks.map((track, index) => {
                                    const isActive = currentTrackIndex === index;
                                    const hasTranscript = track.script && !track.script.includes("Hệ thống đang tiếp tục được cập nhật");
                                    return (
                                        <button 
                                            key={track.id}
                                            onClick={() => handlePlayTrack(index)}
                                            className={`
                                                relative overflow-hidden group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all duration-200 
                                                ${isActive 
                                                    ? 'bg-indigo-500 border-indigo-600 text-white shadow-lg transform scale-[1.02]' 
                                                    : 'bg-white/70 border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 hover:shadow-md'
                                                }
                                            `}
                                        >
                                            {isActive && (
                                                <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=')] opacity-30"></div>
                                            )}
                                            
                                            {hasTranscript && !isActive && (
                                                <div className="absolute top-2 right-2 text-indigo-400 opacity-70 group-hover:opacity-100" title="Đã có Transcript">
                                                    <i className="fas fa-book-open text-[10px]"></i>
                                                </div>
                                            )}

                                            <div className={`w-10 h-10 mb-2 rounded-full flex items-center justify-center text-lg shadow-sm transition-colors ${isActive ? 'bg-white text-indigo-600' : 'bg-slate-100 text-slate-500 group-hover:bg-indigo-100 group-hover:text-indigo-500'}`}>
                                                {isActive ? <i className="fas fa-volume-up animate-pulse"></i> : <i className="fas fa-play ml-0.5"></i>}
                                            </div>
                                            <span className="font-bold text-lg leading-none tracking-tight">Track {String(track.id).padStart(2, '0')}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {currentTrackIndex !== null && (
                        <WaveAudioPlayer 
                            track={tracks[currentTrackIndex]} 
                            onNext={playNext}
                            onPrev={playPrev}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        // Dùng Error Boundary để ngăn trang trắng nếu có lỗi Render
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
