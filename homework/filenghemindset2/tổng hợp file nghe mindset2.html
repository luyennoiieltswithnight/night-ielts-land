    22: `Maria: Hello Simon.\nSimon: Hi Maria.\nMaria: OK. What topic do you think we should choose for the project we're starting next week? I think we need to make sure that it's going to last over the next few months so that we can complete the project.\nSimon: Well, there are several possibilities. Have you heard of the Pluto expedition? The spacecraft is about to arrive there and it's going to send back pictures that we've never seen before. It should be really interesting.\nMaria: That sounds like a good idea. What do you think, Dr Thornton?\nDr Thornton: Well, I'm not so sure about that one. I mean, it's already been going for ten years and I think we should look at something which is planned for the future, but hasn't started yet. It would give you a better chance to study it in depth and do far more analysis for your monthly update reports.\nSimon: I don't think that's a problem. There'll be a lot of coverage on the news over the next few weeks.\nMaria: Hmm ... that's true ... but we really need something to last for a few months. On second thoughts maybe Dr Thornton's right. Perhaps we should look at something which hasn't started yet. Isn't there something I heard about a new Mars expedition? I think there's a group of people out in America somewhere who are preparing for a trip to Mars.\nSimon: Yes. It was in the news last week. They've built a sort of camp in the desert in Arizona. There are ten people living there for six months, just like they would be together on the trip to Mars and after they arrive there.\nDr Thornton: That'd be ideal. Six months is just right for you. You could follow their progress and how the project develops. From what I know, the Pluto project is already a success, but with the Mars one you can assess how successful it is as it progresses and you can write it up for your final report.\nMaria: Hmm ... yeah ... that sounds promising.\nSimon: OK, but before we decide, I'd just like to mention one more. I heard that the Chinese a     32: `Sophie: So where are the worst affected places in town?\nRobert: I would say one of the worst is by the Arts Centre.\nSophie: I'm not sure about that. Statistics show that the worst place is by the town hall.\nRobert: Well, as most of the traffic comes in from the east of town, that would be the Arts Centre. The town hall is further over.\nSophie: Actually, Robert, that's not quite right. The traffic gets quite bad along East Road, further out of town. It's been getting worse over the last year or so, especially by the Starview Cinema.\nRobert: The Starview?\nSophie: Yes, haven't you ever been there?\nRobert: No, I haven't. I thought it was by the main roundabout.\nSophie: Well, in actual fact, it's by the junction of East Road and Station Road. That's where the traffic has been getting really bad, especially in the mornings. It's especially bad for the buses coming from the station as they can't turn right into East Road to get to the centre.\nRobert: OK. So that's the first bad spot, then.\nSophie: Yes. Sometimes the traffic backs up for almost a kilometre, and in the evening, when everyone is trying to get home, it gets bad all the way back to the main roundabout. It's bad in the morning and the afternoon as the traffic also comes in from the north and the south. Remember, there's Liverton to the north and Scotsfield to the south and a lot of people commute to both places for work.\nRobert: That's true. I live a few kilometres down the Scotsfield Road and I have a lot of trouble coming in during the morning rush hour. It's especially bad just by the Arts Centre where the road comes into the roundabout. The buses have a lot of trouble getting through that as well. OK ... so those are the two main hotspots, the Starview and the Arts Centre. I've marked them on the map. And that leaves the town hall.\nSophie: Hmm ... yes. I mean, the whole area around Central Park is bad, but you're right, the town hall side of Central Park is the worst in the area. It's bad enough right by the shopping centre on the other side of Central Park, but`,
    33: `Sophie: The first proposal is to introduce bus and cycle lanes on the roads coming into each of the trouble spots, but I'm not really sure that that will solve the problem by itself.\nRobert: What do you mean? I think it's a really good idea. I think it would help a lot.\nSophie: On the face of it, yes, but in actual fact it can make things worse. There've been a few studies of towns and cities where they've put schemes like that into operation and one serious problem is that car traffic tends to go off into the areas around town where people live, and that causes more traffic in places where there haven't been problems before. Drivers think they can find emptier roads in residential areas and it just sends the problem there instead.\nRobert: Hmm ... I hadn't thought about that. What about the second one, a park-and-ride scheme?\nSophie: Well, we build car parks on the edge of town where the main roads come in. When cars come into town from further out, they can park there cheaply and take special buses into the town centre. It's been quite popular in a few other towns around the country. •\nRobert: In some places, yes, but not in all. I've had a look at some of those schemes. The main problem is lack of take-up. Drivers just don't use them. A lot of these car parks stay empty for a long time and the buses are often less than half-full. It's not always a good use of public money, especially when drivers avoid using the services and prefer to come into town and pay higher parking fees.\nSophie: You've got a point there. We need to bear that in mind. Do you think either of the other proposals would work? I think the pedestrian area is a very interesting proposal. We could turn the whole of the centre, including the shopping areas, into a pedestrian zone and put in a one-way system round it.\nRobert: I'm not convinced that would work. You'd move all the traffic further out of the centre and cause more problems. But the biggest problem would actually be with the shops themselves. It's fine to stop traffic around the shopping areas, but there would be huge problems with deliveries. Some shops could go out of business if they have difficulty getting lorries in with their goods.\nSophie: Right. I'll note that as well. The last one is a new tram system. We'll have to lay down a new line through the centre of town and also from north to south. It's quite a popular solution to traffic problems.\nRobert: That may be so, but the main problem with that kind of project is the expense. The initial financial requirements would be huge and so would the maintenance expenses. It might well be far more than the council is prepared to spend on a solution.\nSophie: I'll note that as well. Which brings us to the next point, the question of cost ... 4 C 3 A 2 D`,

    35: `Sophie: So we've discussed the negative aspects and costs of these proposals, but now I'd like to look at the real benefits which we think each proposal will bring.\nRobert: Well, I really think that one of the most important benefits is better public transport. The most important thing is to get more people out of their cars and onto public transport.\nSophie: Well, three of the proposals would help with that - park-and-ride, bus- and cycle-only routes and the new tram transport system. Which do you think would be the best out of those three?\nRobert: I think the bus and cycle routes would be great for town centre transport, but they might push car traffic further out and make it more difficult for buses outside the centre. That leads me to think that the tram system would actually improve public transport the most, even though it's the most expensive, as there will be a new form of transport in the centre, without affecting other parts of town .\nSophie: I think you have a good point there. I agree that in the long term it would be the best thing. Do you think that proposal would also increase the number' of visitors in town?\nRobert: Well, of course. Any of the solutions would do that, but I'm not sure if the tram system would be the best. What do you think?\nSophie: I think the park-and-ride would be better than the tram system for that. The trams would help people who are already in town, but a park and-ride would bring more of them in from outside.\nRobert: So you think the park-and-ride would bring most visitors in?\nSophie: Actually, I think if people know that they can get around the centre more easily, do their shopping and so on, they would come in more. So perhaps the pedestrian area and one-way system would be best in that respect.\nRobert: True. I've seen other town centres become really busy when they've put in pedestrian areas, so that's clearly the best way of bringing visitors in. So we agree on that, then.\nSophie: And I think that people's health will improve as well as they will be walking around the pedestrian area, rather than driving around town.\nRobert: Up to a point, yes, but I'm sure you'd agree that encouraging people to do more cycling would help their health far more.\nSophie: Of course. Creating bus- and cycle-only routes would be the best way of getting people to exercise. It would also help reduce pollution, so even the people who don't cycle will breathe cleaner air.\nRobert: And we agree that producing less pollution is a really important part of this scheme, though I think that the park-and-ride would be better at doing that than the bus-and cycle-only routes.\nSophie: I'm not sure. Lots of people would need to use the park-and-ride to help reduce pollution. Bus- and cycle-only routes keep cars out of the centre.\nRobert: Yes, but if people are encouraged to use park and-ride more, it would produce the best results. There would be far fewer cars in the centre and the air would be much cleaner.\nSophie: Yes, that's true, but that's a lot of work for the council. OK, we'll agree on a park-and-ride, then. What about safety? I'd say the bus and cycle routes would be best from that point of view.\nRobert: Probably. I think I agree with you on that.\nSophie: OK then, so we agree on safety.\nRobert: Actually, no. When I think about it, you have to take pedestrians into account as well. It's safer for cyclists when there are no cars around, but I'm not sure that it's safer for pedestrians.`,

    42: `In last week's lecture I talked about Dr Lethbridge: employment and aspects related to it, including contracts, income tax and so on. However, people are increasingly looking at other forms of earning a living by working for themselves and being in greater control of their working lives. Today Dr Korpis and I are going to talk about three different ways in which people can work for themselves. They can set up a company, set up a partnership, or they can work as a sole trader. There are important legal and financial matters to take into consideration when choosing one of these structures as a way of doing business in the UK .`,
    43: `Dr Korpis: Thank you, Dr Leth bridge, for your introduction. I'd now like to move on to the details of each type of business structure and discuss the advantages and disadvantages of each, starting with the sole trader. This is simply a person who runs a business alone. On the practical side, there's no need to register with Companies House, which means the sole trader is not legally the same as a registered company. The trader can simply choose any name and start trading without paying any fees. There's no need to register an office, so the trader can even work from home. There are also no legal requirements to submit financial accounts to Companies House. As a result, this is the simplest and most straightforward way to start out in business and work for yourself. Another benefit of being a sole trader is that you are your own boss. You don't have to answer to anybody else, you make your own decisions and you don't have to share your earnings with a partner. However, it doesn't mean that you have to do everything alone. You can also employ or give contracts to other people to do work for you, though, of course, you need to be aware of regulations regarding employing others. So these are the desirable aspects of being a sole trader but there are other matters which need careful consideration. When you're in employment, you are taxed at source, which means your employer takes your tax from your earnings every month and sends it to the tax office, so you don't need to worry about it. However, as a sole trader, you are self-employed, which means you are responsible for what you earn, what you spend and the tax that you must pay. This means you have to complete an annual tax return. This is a document which you send to the tax office once a year showing what you earn from your business and what you spend in running your business. On the positive side, you're only taxed on your earnings after expenses, such as transport, electricity, office equipment and so on. So, if you work from home, you can save tax by declaring some of your use of electricity as necessary for your business. Another consideration is that if you earn over a certain amount, you pay a higher • rate of income tax, which is higher than the same family or close friends. For example, a couple might run a catering business, or two car mechanics might leave employed work to set up a partnership together repairing cars. One obvious advantage of this is that, if one partner is sick or on holiday, the other partner can carry on the business, and another is that it can be easier for a partnership to borrow money from a bank than it can for a sole trader. Of course, partners usually have an informal agreement to work together, but it's always better to have a formal arrangement to avoid disagreements. As with sole traders, each partner must be registered with the tax office as self-employed and must send in a tax return once a year. In addition, as the partnership is unlimited, all members are responsible for debt, so you and your partners may lose your ' r personal possessions to pay debts if the business fails. The other structure for a partnership is the 'limited liability partnership', or 'LLP'. This is similar to a simple partnership as the partners share the income and expenses and also have to pay their own taxes to the tax office, but there are important differences. On the one hand, sole traders and simple partnerships don't have to legally register their businesses. On the other hand, LLPs have to be legally registered with Companies House. This means that at least two of the members are legally responsible for the partnership. They have to make sure that they send accounts to Companies House, as well as to the tax office. They also need to send in an annual return, which is a document showing the name, address and members of the partnership and any changes. If they don't do this, they may go to prison, so it's important to understand exactly what setting up an LLP means. So why should partners enter into a limited liability partnership? Usually, an LLP suits certain types of professionals who provide services, such as accountants, la\N')'ers, consultants and financial service providers. Another reason may be that partners want to do business with larger organisations, who would prefer to give contracts to a registered company or partnership. In any event, an LLP offers the flexibility of being in a simple partnership, but also gives the partners protection so that they only lose the money that they have put`,
    44: `Dr Lethbridge: Thank you, Dr Korpis. The next form of business structure that I would like to discuss is the 'partnership'. There are two kinds of partnership - a simple partnership and a limited liability partnership or 'LLP'. I'll talk about each of these in turn. Forming a simple partnership is straightforward, like becoming a sole trader, except that you have to agree to work with someone • else. A partnership could be between a husband and wife, or two members of the into the partnership if it fails. However, if partners earn a lot of money, they will still pay more tax than the owner of a limited liability company pays.\n1 borrow money\n2 pay debts\n3 accounts\n4 contracts\n5 tax`,
    45: `Dr Korpis: Thank you, Dr Leth bridge. The last form of business I'd like to talk about is the limited liability company. The owners of a limited liability company are called 'members' or 'shareholders' as they own shares in the company. A 'share' is a divided-up unit or part of the company. All businesses run the risk of failing or going bankrupt. If a business goes bankrupt, it has to close because it owes money and is not able to pay the money back. As I mentioned before, setting up a limited liability company, like an LLP, means that if the company fails or goes bankrupt, the business owners lose only what they have put into the business and not their own personal goods and property. This is the idea of liability- how much a business owes in debt if it can no longer operate and has to close. For example, if a sole trader goes bankrupt, he or she may need to sell his or her own house and possessions in order to pay any debts, because the business is not separate from the owner. With LLPs and limited liability companies, the owners and the businesses are separate, so property and goods owned by the business can be sold to pay debts, but not property and goods personally owned by the members or company shareholders. Just as with LLPs, limited liability companies (or 'limited companies' for short) must be legally registered with Companies House. This means they must have a registered address, where all the company documents and records must be kept. As with LLPs, accounts and annual returns must be submitted every year so that anyone can have a look at the company's finances before doing business with it. The level of administration is higher than with other business structures and you need to have a managing director and at least one shareholder. In terms of paying tax, the company has to pay corporation tax on its profits, which is far less than income tax on large amounts, especially over around £50,000. However, you also have to pay income tax on any money you take as a salary from your company. As with the other business structures, the company tax assessment must be submitted to the tax office, but for corporation tax`,

    47: `To conclude this lecture, I'd like to present Dr Korpis: three case studies to show the different structures in action. I'll present each case, briefly discuss the possibilities and recommend the most suitable structure. First, there's the case of Sanjay and Tanya, a couple who want to set up a catering service delivering food to businesses. The idea is to take orders from businesses on a daily basis and prepare food for delivery during the business day. They aim to target businesses in their local area to begin with, and then further afield as they expand. Their plans include a website to display their daily international menus and to provide an online service for customers to order and check when the food will be delivered. Clearly, it's not suitable to be sole traders, but they could organise themselves as a partnership or a limited company. It depends partly on how much money they can raise and how many people they intend to employ to prepare and deliver the orders. It might be best for them to start as an LLP, so that they can get funding more easily than if they were a simple partnership. They could start small and build from there. They could hand out contracts to other companies for some of their services, particularly for the website and delivery, if they intend to prepare the food themselves. Alternatively, they could set up a limited liability company if they expect to grow quickly and want to keep every aspect of their business in-house, employing staff directly. However, I would say the LLP model would work better here - giving them more time to focus on growing the business, rather than dealing with a lot of administration from the start. Melissa and Jane have an idea for a website design service. They both studied software engineering at university and so they are both well-skilled in their field. They have both worked as designers for major organisations, so they have a good understanding of what's involved in running such a business. Meliss     52: `Lecturer: One interesting fact is that fracking isn't new. It's been used for many years around the world, mostly to get the last oil from old wells after the pressure's dropped. But the process has become much better known with the move to tracking for gas and the search for new fracking sites. Take Canada, for example. Fracking has been used there to extract oil for over 50 years and gas for almost 40 years. More recently, a huge amount of shale gas has been found in many areas of the country and drilling companies are trying to get licences to drill in these areas. For example, in the western region of British Columbia, it's estimated that there are over seven trillion cubic metres of gas which can be extracted. However, most regions haven't allowed tracking to take place because of various environmental issues, which I'll talk about later. In the USA, the production of shale gas now is around six times greater than it was ten years ago, with more and more licences being given to companies to drill. As a result, shale`,
    53: `Lecturer: the USA, tracking has been increasing because governments see many benefits for energy supply and their economies. I'd like to discuss these benefits now and then talk about the problems which people have raised about tracking. Well, although increased production of shale gas will make sure that there's always enough gas for people's energy needs and the production of electrical energy, the economic benefit to the consumer is usually seen as more significant. As the supply of shale gas grows, energy prices will come down and consumers will save a lot of • money, according to supporters of tracking.\nA: does not ... chemicals ... harmful\nB: slightly less ... coal ... oil\nC: much less water ... coal ... oil burning 4\nA: less\nB: more water ... production ... coal ... oil\nC: time ... environmentally friendly 3 Correct answer: A 4 Correct answer: C Tapescript 56\nLecturer: Despite the benefits of tracking, which its supporters claim, there are clearly various concerns connected with it. Some of these are real, but it's possible that they're not as well-founded as opponents of tracking would have us believe. So, what exactly are these concerns? Well, we can divide them into three categories: environmental concerns, health concerns, and economic concerns. To begin with, let' s look at the environmental concerns. The first, and possibly most significant environmental concern is that, despite producing lower levels of carbon dioxide, shale gas is still a cause of global warming and so it should not be used. In effect, it simply stops energy producers and governments focusing on the real need to develop renewable sources of energy. What's more, it's likely that, although countries, which produce shale gas will use less coal and oil, the use of coal and oil will still continue to increase in other places, so globally there will be little or no benefit to the environment.`,

    56: `Lecturer: Despite the benefits of tracking, which its supporters claim, there are clearly various concerns connected with it. Some of these are real, but it's possible that they're not as well-founded as opponents of tracking would have us believe. So, what exactly are these concerns? Well, we can divide them into three categories: environmental concerns, health concerns, and economic concerns. To begin with, let' s look at the environmental concerns. The first, and possibly most significant environmental concern is that, despite producing lower levels of carbon dioxide, shale gas is still a cause of global warming and so it should not be used. In effect, it simply stops energy producers and governments focusing on the real need to develop renewable sources of energy. What's more, it's likely that, although countries, which produce shale gas will use less coal and oil, the use of coal and oil will still continue to increase in other places, so globally there will be little or no benefit to the environment.`,
    57: `Lecturer: While tracking is being used around the world, we've seen that there are serious concerns about it. What's clear is that tracking isn't the answer to the growing worldwide need for energy as countries increase their consumption. Already, the amount of carbon dioxide in the atmosphere has reached 400 parts per million. This may not seem very high, but we have to remember that 200 years ago the level was around 280 parts per million, so it's increased by over a third since then. As a result, it's estimated that global temperatures have already increased by almost one degree Celsius. This increase changes the climate and affects the weather in many parts of the world. Many places, such as north-west Europe, are expected to become warmer and wetter and we've seen winter storms becoming worse in this region. Other places such as sub-Saharan Africa are expected to become hotter and drier, with deserts growing in area and seriously affecting farmland. Ice in the polar regions will melt and sea levels will rise, which will put coastal cities in greater danger of flooding. Clearly, we need to reduce, and eventually stop using non-renewable resources, like coal, oil and gas. It may well be true that tracking can slow down global warming for a while and allow us to develop better renewable resources. However, these resources, like wind, wave and solar power, are currently far more expensive to develop than shale gas production. On top of that, they take a long time to develop and start paying for themselves. Consumers have to pay higher bills to help the development of cleaner sources, and energy companies don't want to lose customers by asking them to pay more. Consequently, it's important for international organisations like the United Nations and national governments to support the development of renewable resources. The problem here, of course, is that governments usually think of short-term answers to energy problems and not longer-term ones. They're afraid that if they reduce the production and use of gas and oil, their economies will do worse than other economies, so they don't want to take action to increase the use of • renewable sources.`,

    61: `Lecturer: The British education system is not the same everywhere in the UK. Scotland has its own system, and while Northern Ireland has the same basic system as England and Wales, there are some differences. Because of this, I'm going to focus mainly on England and Wales. The system in England and Wales is divided into three main levels: primary, secondary and tertiary. In the first part of my lecture, I'll talk about the primary and secondary levels up to the age of 16, and in the second part I'll discuss the options between 16 and 18. Then, finally, I'll talk about tertiary, or 'higher' level education. As in most similar countries, education at school is compulsory between the ages of five and 16. Pupils can leave school at 16 but they must stay in an approved learning environment until the age of 18. This can be full-time education, a job or volunteering combined with part-time study, or an apprenticeship, sometimes called a 'traineeship'. Before the age of five, children can attend nursery, though they don't have to attend`,
    62: `Lecturer: Now I'd like to turn to educational opportunities between the ages of 16 and 18. There are various choices open to pupils of this age. The first thing to decide is whether to start work or to continue studying full-time. Of course, starting work means going straight into employment, although young people aged between 16 and 18 will still need either to study part-time, as well as doing their job, or to join an apprenticeship or traineeship scheme. For those who want to continue studying full-time, there are two paths: academic and vocational. Academic qualifications, mainly Advanced level exams, known as 'A levels', are taken by students aiming for university study. Vocational qualifications, such as those offered by the Business and Technology Education Council (or 'BTEC' for short), prepare pupils for a specific profession, such as engineering or computing. Most of those who wish to continue academic studies will go to the sixth form in their school or a specialist sixth form college. Alternatively, they can study A levels at a further education college, also known as an 'FE' college. Either of these routes will take students to university. On the other hand, those who wish to study a vocational qualification will typically go to a Further Education college, and, after qualifying, will be ready for employment. There are other options for those who want to start work at 16. Since 2015, young people between the ages of 16 and 18 must continue to learn in a specified learning environment, in addition to working for an employer. The first option is to work for an employer and study part-time for a vocational qualification, such as a National Vocational Qualification •\nMr Green: You mean your 'personal statement'? Well, just be honest. I can help you phrase it so that it reads well, but you need to note down what you want to include. If you can do that by Friday, we can write it up together. Amanda: That's great! Thanks. Well, that's what I'm here f     68: `Speaker 1: So, in conclusion, we can say that, despite the difficulties we had at the beginning, we managed to complete the programme over the three days without any further problems. In total, ten thousand attended the three days and feedback suggests that the events were exciting and produced true champions, especially the athletics events. Next year we'll have more money, so we're going to add new events to increase the competition and participation levels.\nSpeaker 2: It's clear, then, that the events didn't go as well as originally planned, so we will have to rethink our arrangements for next year. Clearly, a large tent in the college grounds is not ideal for an event of this type if we're hit by bad weather again, as we were with this year's event. This caused a lot of problems with the preparation of the dishes and the display of the produce from different parts of the world. It also meant that visitors couldn't really get a chance to try everything on display. As a result, much of it went to waste, which is something we have to avoid next time.`,
    69: `Dr Saunders: to review this year's arts festival. As you know, this is the fourth and biggest festival that we've run at the university and it's clear now that it's fast becoming a fixture in the calendar of the city and the county and attracting attention from the rest of the country, as well as from abroad. First of all, I'd like to review the preparations for the festival, then go on to do an analysis of the festival itself and how well it went. The plan is then for you to work in teams of three, with one tutor and two students in each team, and for you to discuss the festival in more detail so you can come up with suggestions for the organising committee to consider for next year's festival. Well, as I said, we're in our fourth year and we added some new events. The first festival focused mainly on music and the performing arts, as it was felt that those would be the best types of event for both students and the public to take part in. More forms of art, in particular short films and photography, were added over the next two years and this year we have extended our offer to include painting and crafts, with a particular focus on the students here producing their own work, both for exhibition and competition. This was largely successful, but I'll discuss that in detail later. We also invited professional artists in some of the fields to perform, and that will be something for you to review for the next event. What was particularly encouraging this year, was that we had contributions to the festival from the highest number of students to date, with representatives from every nationality at the university. As in previous years, we planned to use the spare university accommodation for all the visitors, both students and non students, but as we expected a greater attendance at this year's festival, we also arranged accommodation at the city college three miles from here and arranged coach transfers between the college and the university campus. Unfortunately     72: `Dr Reynolds: discuss is the accommodation situation. It seems clear that the number of visitors is set to grow, so we need to have a suitable plan in place to deal with the •\nLawrence: Actually, I saw the accommodation that we used at the city college, and it was pretty basic, though it was clean and tidy. There was only a bed and a desk in each room. Another thing the visitors complained about was the lack of Wi-Fi in the rooms, especially as they'd paid for rooms with Wi- Fi. It certainly wasn't ideal.\nDr Reynolds: Do you have anything to add, Sangita?\nSangita: Yeah ... I can understand why they weren't happy. I'd have felt the same in their position.\nDr Reynolds: Well, there's that new holiday development at Elm Park, quite close to the university. Perhaps we could use their rooms. After all, it won't be the holiday high season, so there should be plenty of empty rooms that we could use.\nSangita: That's true. How about taking over some of their rooms and advertising them as accommodation specifically for families with children? They're going to have an outdoor and an indoor adventure area for young people. We had quite a few teenagers this year coming with their parents. If we can attract more by offering them the facilities at the holiday park in a special package, they can go there if they get bored with the festival.\nLawrence: Excellent idea! They'll be around 15 or 16 years old and when they come to the festival, they'll get an idea of what it'd be like to study here. I'm sure it'll help our future prospects as a university.\nDr Reynolds: I agree. I'll be happy to present those ideas to the committee. Moving on to the catering, it seems clear that the idea of theme days with different kinds of national and regional dishes went down very well. I'll recommend repeating it next year, but do you have anything else to say about the catering?\nSangita: Not really ... one thing is maybe we could tell the students about the festival earlier in the year reens would be too expensive, especially with the number we'd have to buy, so it's not an option for next year because of the high cost. catering, they felt that we could use the holiday park that's being built nearby, and we should encourage students to take a greater part in cooking and helping with the catering.\nDr Reynolds: OK ... as for the accommodation and the\nDr Saunders: Well, first, I know for a fact that the new holiday park is not likely to be completed by festival time next year as they've run into trouble with the building, but we could certainly think about it in the future. I do like the idea of the students having a greater role in the catering and cooking, as it will clearly be helpful for their all-round development.`,
    73: `Dr Reynolds: Hello Dr Saunders. I just want to tell you about the suggestions that Lawrence and Sangita made during our discussion and see what you think.\nDr Saunders: Thanks, yes. Please do.\nDr Reynolds: First of all, regarding the music, they think that it might be a good idea to have a good local band who can replace the main act if it has to let us down at the last minute, which is what happened this year. The band could be scheduled for later in the week on the understanding that they might have to play on an earlier night. We could also have one evening with a student band.\nDr Saunders: Well, it sounds good in theory to plan a rearrangement, but I think it would be too complicated to arrange. We would depend too much on all the bands being able to play on any of the nights. I think it's simpler just to give the audience a refund if it happens again. But I'm happy to have one evening\nDr Reynolds: OK. The next thing is the professional organisers. They felt that the standard was quite low and that the volunteers didn't experience good leadership from them. They think it would be better to ask former students to work as organisers, as they'd be more familiar with the university and more committed, too.\nDr Saunders: I appreciate that, but unfortunately that wouldn't work. It'd be too much trouble trying to find them and get them employed. However, I think we should review the organisers that we used this year and have a much better selection system in place for the next festival.\nDr Reynolds: Now the last two points are about security and finance. As far as security goes, they think we should do more to encourage the students to take it seriously.\nDr Saunders: I agree. If we can encourage students to be more aware of security, not just during the festival, it'd really help to increase trust among all our students because they'll be looking out for each other.\nDr Reynolds: As for finance, they thought that, first, we could encourage students to hel                     wavesurfer.current.setPlaybackRate(speed);
                });

                wavesurfer.current.on('play', () => setIsPlaying(true));
                wavesurfer.current.on('pause', () => setIsPlaying(false));
                wavesurfer.current.on('finish', () => {
                    setIsPlaying(false);
                    if(onNext) onNext();
                });
                
                wavesurfer.current.on('audioprocess', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });
                
                wavesurfer.current.on('seek', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });

                const container = waveformRef.current;
                const handleWheel = (e) => {
                    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
                        e.preventDefault();
                        const zoomDelta = e.deltaY < 0 ? 10 : -10;
                        setZoom(prev => {
                            const newZoom = Math.max(10, Math.min(prev + zoomDelta, 300));
                            if (wavesurfer.current) wavesurfer.current.zoom(newZoom);
                            return newZoom;
                        });
                    }
                };
                container.addEventListener('wheel', handleWheel, { passive: false });

                return () => {
                    container.removeEventListener('wheel', handleWheel);
                    if (wavesurfer.current) {
                        wavesurfer.current.destroy();
                    }
                };
            }, [track]);

            const togglePlay = () => {
                if (wavesurfer.current && isReady) {
                    wavesurfer.current.playPause();
                }
            };

            const skip = (amount) => {
                if (wavesurfer.current && isReady) {
                    wavesurfer.current.skip(amount);
                }
            };

            const changeSpeed = () => {
                if (wavesurfer.current) {
                    const nextIndex = (speeds.indexOf(speed) + 1) % speeds.length;
                    const newSpeed = speeds[nextIndex];
                    setSpeed(newSpeed);
                    wavesurfer.current.setPlaybackRate(newSpeed);
                }
            };

            const handleZoomSlider = (e) => {
                const val = Number(e.target.value);
                setZoom(val);
                if (wavesurfer.current) wavesurfer.current.zoom(val);
            };

            if (!track) return null;

            return (
                <div className="fixed bottom-0 left-0 w-full z-50 p-4 pb-6 md:pb-8 flex flex-col items-center pointer-events-none">
                    <div className="w-full max-w-4xl pointer-events-auto">
                        
                        {/* PANEL TRANSCRIPT (ẨN/HIỆN) */}
                        <div className={`transition-all duration-300 ease-in-out origin-bottom ${showTranscript ? 'opacity-100 translate-y-0 mb-4 scale-100' : 'opacity-0 translate-y-10 h-0 scale-95 overflow-hidden'}`}>
                            <div className="glass-panel rounded-3xl p-5 shadow-floating border border-white/50 bg-white/95">
                                <div className="flex justify-between items-center mb-3 border-b border-indigo-100 pb-2">
                                    <h3 className="font-bold text-indigo-900"><i className="fas fa-file-alt mr-2"></i>Tapescript</h3>
                                    <button onClick={() => setShowTranscript(false)} className="text-slate-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="transcript-scroll max-h-[40vh] overflow-y-auto pr-3 text-slate-700 leading-relaxed text-sm md:text-base font-medium whitespace-pre-wrap">
                                    {track.transcript}
                                </div>
                            </div>
                        </div>

                        {/* PLAYER CHÍNH */}
                        <div className="glass-panel rounded-3xl p-4 md:p-6 shadow-premium border-t border-white/40 animate-fade-in-up">
                            {/* Header */}
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-2 px-2 gap-2">
                                <div className="font-bold text-indigo-900 text-lg flex items-center">
                                    <i className="fas fa-headphones-alt mr-3 text-indigo-500"></i>
                                    {track.title}
                                </div>
                                
                                <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                                    {/* Nút bật tắt Transcript */}
                                    <button 
                                        onClick={() => setShowTranscript(!showTranscript)}
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${showTranscript ? 'bg-indigo-600 text-white shadow-md' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}`}
                                    >
                                        <i className={`fas ${showTranscript ? 'fa-eye-slash' : 'fa-book-open'}`}></i>
                                        {showTranscript ? 'Ẩn Transcript' : 'Đọc Transcript'}
                                    </button>

                                    {/* Zoom Slider */}
                                    <div className="hidden md:flex items-center gap-2" title="Kéo để dãn sóng âm">
                                        <i className="fas fa-search-minus text-[10px] text-slate-400"></i>
                                        <input 
                                            type="range" min="10" max="250" value={zoom}
                                            onChange={handleZoomSlider}
                                            className="w-24 h-1 bg-indigo-100 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                                        />
                                        <i className="fas fa-search-plus text-[10px] text-slate-400"></i>
                                    </div>
                                    
                                    <div className="text-sm font-semibold text-slate-500 font-mono min-w-[90px] text-right">
                                        {isReady ? `${currentTime} / ${duration}` : 'Loading...'}
                                    </div>
                                </div>
                            </div>

                            {/* Sóng âm */}
                            <div className="relative w-full h-[60px] mb-4 bg-slate-50/50 rounded-xl cursor-pointer" title="Dùng 2 ngón tay vuốt lên/xuống để Zoom">
                                {!isReady && (
                                    <div className="absolute inset-0 flex items-center justify-center text-indigo-400 font-medium text-sm animate-pulse z-10 bg-slate-50/80 rounded-xl">
                                        <i className="fas fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu sóng âm...
                                    </div>
                                )}
                                <div ref={waveformRef} className="w-full h-full rounded-xl"></div>
                            </div>

                            {/* Thanh công cụ */}
                            <div className="flex items-center justify-between gap-4">
                                <div className="flex items-center gap-2">
                                    <button onClick={onPrev} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center">
                                        <i className="fas fa-step-backward"></i>
                                    </button>
                                    <button onClick={changeSpeed} className="hidden md:flex px-3 h-10 items-center justify-center rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm transition min-w-[3.5rem]" title="Tốc độ đọc">
                                        {speed}x
                                    </button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-5">
                                    <button onClick={() => skip(-5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Lùi 5 giây">
                                        <i className="fas fa-undo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                    
                                    <button onClick={togglePlay} disabled={!isReady} className={`w-16 h-16 flex items-center justify-center rounded-full shadow-premium transition transform hover:scale-105 ${isReady ? 'bg-primary hover:bg-primaryHover text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                        <i className={`fas text-2xl ${isPlaying ? 'fa-pause' : 'fa-play pl-1'}`}></i>
                                    </button>
                                    
                                    <button onClick={() => skip(5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Tiến 5 giây">
                                        <i className="fas fa-redo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button onClick={changeSpeed} className="md:hidden px-3 h-10 flex items-center justify-center rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm transition min-w-[3.5rem]" title="Tốc độ đọc">
                                        {speed}x
                                    </button>
                                    <button onClick={onNext} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center">
                                        <i className="fas fa-step-forward"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [currentTrackIndex, setCurrentTrackIndex] = useState(null);
            
            const handlePlayTrack = (index) => {
                setCurrentTrackIndex(index);
            };

            const playNext = () => {
                if (currentTrackIndex !== null && currentTrackIndex < tracks.length - 1) {
                    setCurrentTrackIndex(currentTrackIndex + 1);
                }
            };

            const playPrev = () => {
                if (currentTrackIndex !== null && currentTrackIndex > 0) {
                    setCurrentTrackIndex(currentTrackIndex - 1);
                }
            };

            return (
                <div className={`flex-grow transition-all duration-300 ${currentTrackIndex !== null ? 'pb-80 md:pb-96' : 'pb-20'}`}>
                    <header className="pt-16 pb-12 px-4 text-center">
                        <div className="max-w-3xl mx-auto">
                            <div className="inline-block px-5 py-2 bg-white/10 text-white font-bold rounded-full text-sm mb-4 tracking-wider uppercase border border-white/20 backdrop-blur-md shadow-sm">
                                TÍCH HỢP TRANSCRIPT
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight drop-shadow-lg">
                                Sách Mindset 2
                            </h1>
                            <p className="text-slate-300 font-medium text-lg drop-shadow">Hệ thống phân tích sóng âm & Đối chiếu kịch bản tự động</p>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-xl">
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                {tracks.map((track, index) => {
                                    const isActive = currentTrackIndex === index;
                                    const hasTranscript = track.transcript && !track.transcript.includes("Hệ thống đang tiếp tục được cập nhật");
                                    return (
                                        <button 
                                            key={track.id}
                                            onClick={() => handlePlayTrack(index)}
                                            className={`
                                                relative overflow-hidden group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all duration-200 
                                                ${isActive 
                                                    ? 'bg-indigo-500 border-indigo-600 text-white shadow-lg transform scale-[1.02]' 
                                                    : 'bg-white/70 border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 hover:shadow-md'
                                                }
                                            `}
                                        >
                                            {isActive && (
                                                <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=')] opacity-30"></div>
                                            )}
                                            
                                            {hasTranscript && !isActive && (
                                                <div className="absolute top-2 right-2 text-indigo-400 opacity-70 group-hover:opacity-100" title="Đã có Transcript">
                                                    <i className="fas fa-book-open text-[10px]"></i>
                                                </div>
                                            )}

                                            <div className={`w-10 h-10 mb-2 rounded-full flex items-center justify-center text-lg shadow-sm transition-colors ${isActive ? 'bg-white text-indigo-600' : 'bg-slate-100 text-slate-500 group-hover:bg-indigo-100 group-hover:text-indigo-500'}`}>
                                                {isActive ? <i className="fas fa-volume-up animate-pulse"></i> : <i className="fas fa-play ml-0.5"></i>}
                                            </div>
                                            <span className="font-bold text-lg leading-none tracking-tight">Track {String(track.id).padStart(2, '0')}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {currentTrackIndex !== null && (
                        <WaveAudioPlayer 
                            track={tracks[currentTrackIndex]} 
                            onNext={playNext}
                            onPrev={playPrev}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
