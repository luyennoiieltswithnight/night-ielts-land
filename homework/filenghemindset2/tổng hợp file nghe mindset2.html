•\nuse so, too, either and neither to agree or disagree with\nsomeone\n•\ncomplete a summary with words from a box or words\nfrom a passage.\nOUTCOMES \nFocus students' attention on the unit topic of the natural \nenvironment. Elicit from students what is meant by natural \nenvironment (sea, land, air, in fact anything which is not \nman-made) \nAsk students if they are interested in specific environmental \ntopics. Have them work in pairs to brainstorm topics, issues \nand related vocabulary. This will help gauge their interest in \nthe subject and generate some key vocabulary, which can \nsubsequently be shared with the class. \nThis unit teaches students how to approach Yes/No/Not \nGiven questions. Questions which test students' ability \nto match statements in the questions to the writer's views. \nIt also gives students practice at the summary completion \ntask type. \nLEAD-IN \n01 The words in Exercise 01 are common when dealing with \ntexts on the environment. Have students check meanings in \na dictionary if necessary. Tell students to match the words in \nthe box with their definitions. Encourage stronger students \nto give examples of the use of some of the vocabulary or \nsituations in which they have met them. Some students \nmay be able to talk about of illegal poaching in Africa or give \nexamples of animals that are in danger of extinction. \n1 habitat 2 extinction 3 conservation 4 endangered \n5 species 6 threaten 7 poach 8 captivity \nI \nExtension \nIf you have time and if appropriate, you may also want to \ndrill the pronunciation of these words, as this topic is also \ncommon in the speaking exam. \nExercises 02, 03 and 04 discuss Yes/No/Not Given questions, \na common task in the reading exam. The purpose of this \ntask is to identify if the statements in the questions match \nthe views or claims of the writer. Focus students' attention \non Tip \n2, which explains the difference between a view and \na claim. Ask students to give their own examples of 'views' \nand 'claims'. (If appropriate with stronger groups, let them \nc.hoose their own contexts for these.) \n• \n02 Tell students to read the short text in exercise 02 and answer \nthe questions. \n1 Yes 2 Not Given 3 No 4 Yes \n1 involvement - contribution / make an impact - makes \na difference \n3 most people - the majority of [us] \n4 do a great deal - go to great lengths \nMake students aware that texts are not this short in the exam \nand that this exercise is just to give students the idea of the \ntask type. Ask students to discuss in pairs the synonyms and \nother words and phrases that helped them find the answers, \nHave pairs share their findings with the class afterwards. \n03 In order to help students tackle a longer text, Exercise 03 \nsuggests a possible approach. Tell students to order the \nsteps. If some students find this difficult, you could suggest \nthey choose the first and last steps first, and then they \ndecide on the middle stages. \nI\nAlternative \nWith weaker classes, write the steps on cards and ask students \nto work in small groups and put them into a logical sequence. \na 4b7c\n5d3 e\nlf6g2 \n04 Tell students to read the title of the text in Exercise 04. \nAlternative \nIn order to personalise the topic and increase student \ninvolvement, you could ask: \nDo you like visiting zoos? Why/why not? \nWhat are the advantages/disadvantages of keeping wild \nanimals in captivity? \nDo you know of any 'famous' zoo animals? \nHow do you think zoos have changed in the last fifty years? \nWhat kind of things do you predict the article will say? \nTell students to skim read the text and answer the questions, \nfollowing the approach suggested in exercise 03. Before \nstarting the task, draw students' attention to Tip 4, stating \nthat the questions appear in the same order as the text. \n1 Not Given 2 Not Given 3 No 4 Yes \nGRAMMAR FOCUS: SO, TOO, EITHER AND \nNEITHER \n05 Exercises 05 & 06 \nexplore the use of, so, too, either and \nneither, phrases used to agree or disagree with someone. \nUnderstanding the use of these small words is important, as \nthey can have a huge impact on the meaning of a sentence. \nTell students to complete exercises 05 & 06. \n\n06 \n1 'Me too.' I 'So do I.' I 'I do too.' \n2 'I wouldn't.' \n3 'Me too.' I 'So am I.' I 'I am too.' \n4 'Neither do I.'/ 'Me neither.' \nI \nAlternative \nIf there is time, encourage students to work in pairs or \nsmall groups and do simple role plays involving the \nenvironmental topics. \nExercises 07 to 10 discuss summary completion tasks. \nAs stated in the information box, there are two types of \nsummary completion task. One provides a box with possible \nanswers and the other requires an answer from the text. \n07 In this exercise students have to choose from a list of words. \nTell students to complete the summary. \nWhen they have finished, draw their attention to Tip 7, \nstating that in order to confirm they have chosen the correct \nanswers, they should read through the sentences to check \nthey are also grammatically accurate. Encourage students to \ndo peer correction and feedback the results whole class. \n1C2E3A4G \n08 \nExercise 08 draws students' attention to distractors. Feed or \nelicit from students the meaning of distractors. Ask stronger \nstudents to identify the best distractors in their view and \njustify their choice. \nquickly- 3 animal - 2 \n09 \nExercise 09 gives an example of a summary completion \ntask, whereby students need to fill the gaps with a word \nfrom the text. \nTell students to complete \nExercise 09 by skimming the text \nto understand the main ideas. \n10 Draw students' attention to Tip 10, stating that before \nscanning the text for a word, they should decide what type \nof word they are looking for. \nExample: Mountain gorillas are one of the most \n1 \nspecies in the world. \nElicit from students that the type of word missing from the \nsentence above is an adjective. Then elicit how they know \nthis? (follows "most"- superlative phrase) \nBefore asking students to scan the text for the word, ask \nthem to predict the answer. (interesting, desired etc..) \n1 endangered 2 habitats 3 poached 4 conservation \nEXAM SKILLS \n11 Tell students to complete the practice exam task in Exercise 11, \nusing the skills and knowledge acquired throughout the lesson. \n1 No 2 Yes 3 Not Given 4 No \n1E 2F3B4JSG6K \nFinally ask students to summarise in their own words \nthe techniques and approaches learned in the lesson \nand agree three or four bullet points to guide them in \nthe future. \nWRITING \nOUTCOMES \n•\navoid writing irrelevant ideas in an 'agree or disagree' essay \n•\nexpress your ideas clearly in an essay\n•\nwrite in an appropriate neutral/ formal style\n•\navoid repeating words and phrases. \nOUTCOMES \nThe outcomes of this unit focus on Part 2 of the writing \ntest, in which students may be asked to write an "agree or \ndisagree" essay. This lesson explains how to keep essays \nrelevant and how students can express their ideas clearly \nand focuses on the key components of a successful answer. \nIt also teaches students how to write in an appropriate \nstyle and use a wide range of vocabulary in order to \navoid repetition. \nLEAD-IN \n01 \nAsk students to discuss the questions in Exercise 01, \nintroducing them to the topic of recycling/ saving energy a \ntheme, which could feature in the exam. \nEncourage them to \ncompare and contrast approaches and attitudes to the topic \nin different countries. Which countries in their experience \nare the best/worst at conservation? \n02 Exercise 02 asks students to decide whether they agree, \ndisagree or agree to a certain extent, with a set of \nstatements concerning the environment. This is good \npractice for Part 2 of the writing exam, in which students \nare asked to provide their opinion in this way. \nAlternative \nSome students may find this exercise difficult, either \nbecause they are not used to expressing their opinion \nor because they do not know much about this topic. \nIf this is the case, you could complete the exercise as a \nwhole class and write some of the most relevant ideas \non the board. \n03 This exercise teaches students how to ensure that their \nessays for Part 2 are always relevant; a key requirement \nfor this part of the test. Tell students to focus on the \ninformation box, which reminds them of the need to read \nthe task carefully, underline key words and then spend \ntime planning their answer. Write the task in Exercise 03 \non the board and as a whole class underline the key words. \n(Some people believe ... should be fined ... do not recycle ... \nwhat extent ... agree .. . disagree) \nTeti students to read the sample answer and then answer \nquestions 2-4 \nin Exercise 03. \n•\n\n03 Sample answers \n1 Some people believe ... should be fined ... do not \nrecycle ... what extent ... agree ... disagree \n2 It is not only recycling which ... educate themselves \nabout environmental issues and then take action. \nGovernments could do more ... in general. \n3 The writer decided to write about the topic instead of \nthe actual question in the task. \nThe writer needed more ideas to complete at least \n250 words. \nThe writer did not start with a plan and forgot to keep \nthe answer relevant. \n4. Check the words in the task carefully, make a good\nplan, ensure it is relevant and then follow it.\nAnother important aspect of the writing test is the use of the \ncorrect writing style in essays. The language used must be \nformal and academic. Students should not include therefore, \nany abbreviations, bullet points or slang/ colloquial \nlanguage. Ask students to work with a partner and make a list \nof examples of common abbreviations and slang/colloquial \nlanguage. Have pairs share the results of their deliberations \nwith the class afterwards. Collate examples on the board. \nDefinition \nSlang: informal language, often language that is only used by \npeople who belong to a particular group \nAbbreviation: a shorter form of a word or phrase, especially \nUsed in writing: A doctor is often called a 'GP', an abbreviation \nfor 'general practitioner'. \nAdvice \nStudents should also be aware of the following when writing \nformally: \nDo not use contractions (it's, I'm, his name's) \nGenerally, avoid phrasal verbs e.g. get away with, carry on \nAvoid vague words e.g. nice, things \nDon't use exclamation marks, dashes or etc. \n04 Tell students to rewrite the sentences in Exercise 04, so they \nsound more formal. \n1 Environmental problems are getting worse every day. \n2 We might not be able to see all the pollution in our \nenvironment, but it certainly exists. \n3 If this continues, our families will struggle in the future. \n4 There are many things teenagers and families can do \nto prevent pollution. For example, hand-washing \nclothes or riding a bike to school or work instead of \nusing the car. \n5 There could be a solution to helping our environment \nif we educate others and help them to understand how \nserious the problem is . \n• \nExtension \nIf students need further practice at distinguishing between \nformal and informal language you could ask them to write \nshort role plays in both styles. Present the dialogue below \nas an example to students. \nA: Hiya, how are you doing? My name's Mary. I've come to do \na bit of research on the environment, for something I need \nto write for school. Have you got any info for me? \nB: Yes, we have lots of books on this. \nA: That's awesome! How many books can I take away \nwith me? \nB: You can have a maximum of five. \nIn order to add a fun element to the exercise, students could \nthen practise role playing in pairs. \nDraw students' attention to Tip 4, stating that another way \nto sound more formal is to use the passive. Elicit some \nexamples of the effective use of the passive, for example \ndescribing processes or when the person doing the action is \nunknown or not important. \nAsk students to read the information box, stating that \nanother way students can get a good score in the exam is by \nusing a wide range of vocabulary and avoiding repetition. \n05 This exercise demonstrates how repetition can be avoided. \nTell students to complete the sample essay, using the words \nfrom the box. \nDo the first question as a whole-class and elicit from \nstudents which word they are trying not to repeat (world) \n1 planet's 2 these ideas 3 increase in population \n4 it 5 it 6 it 7 They 8 it 9 issue \nEXAM SKILLS \n06 Tell students to complete the timed exam task in Exercise 06. \nInform students they will be marked on the following: \n• the relevancy of the answer\n• their ability to express their ideas clearly\n• their use of a formal/academic style\n• their range of vocabulary/ avoiding repetition\nSample answer \nIt is certainly true that environmental problems should \nbe taken seriously in order to prevent disaster in the \nfuture. Unfortunately, however, most people do not take \nthis threat seriously enough and this is for a number of \nreasons. The following essay will outline why the majority \nof people do not care enough about the environment. \nPerhaps the main reason people do not give the \nenvironment much thought is because at the moment it \ndoes not affect their daily life. This is because, generally, \nthey cannot see how global warming or pollution is \nreasons behind it. However, these are soon forgotten and \nthe situation is once again ignored. \n\nAnother reason environmental issues are ignored is \nthat people do not know enough about them. Although \nit is generally understood that recycling helps to save \nresources, this is perhaps the only step people take to \nhelp the situation. Most people have heard of global \nwarming and pollution, but do not fully understand the \nimplications. If they did, I am sure they would use their \ncar less and try at all costs to save resources more. \nMany people also believe that these environmental \nproblems will not impact society for another fifty to one \nhundred years. Consequently, people feel these problems \ncan be dealt with then by future generations. \nOverall therefore, whilst there may be some people who \nare fully aware of the environmental problems facing the \nplanet, the majority of the population still do not give \nthem the attention they deserve. \nAfter the exam ask students to recapitulate the main points in \nthe lesson in their own words. \nLISTENING \nOUTCOMES \n• \ncomplete a diagram showing a process\n• answer multiple-choice questions\n• \nunderstand the use of signposting words\n• revise quantifiers with countable and uncountable nouns. \nOUTCOMES \nThis unit discusses two task types from the listening test; \ncompleting a diagram showing a process and answering \nmultiple choice questions. \nThis lesson also looks at the use of sign-posting words \nand phrases, as these are important when being asked \nto follow a lecture or talk, a possible requirement for \nPart 2 & 4 of the test. \nDefinition \nSign-posting: words and phrases give the listener an indication \nof where they are in a talk and/or what they are expected to \nhear next. \nThey might indicate, for example, how many points will be \ncovered, give examples or provide, a summary. \nHave students work in pairs to write a list of sign-posting words \nand phrases and then have pairs share their ideas with the \nclass. (firstly, secondly, and then, after that, in the next part of \nthe talk, finally, to conclude, in conclusion) \nThe fourth outcome revises the use of quantifiers with \ncountable/ uncountable nouns. This is an aspect of grammar \nwhich many students often need practise with. \nDefinition \nQuantifier: a word or group of words that is used before a noun \nto show an amount of that noun. For example the words 'many', \n'some', and 'a lot of' are quantifiers. \nCountable noun: a noun that has both plural and singular forms. \nUncountable noun: a noun that does not have a plural form \nand cannot be used with 'a' or 'one'. For example 'music' and \n'furniture' are uncountable nouns. \nAsk students to give examples of other uncountable words. \n(water, sugar, milk, food, metal etc.) \nLEAD-IN \nTell students they are going to listen to a lecture about the \nenvironment and energy sources. Before playing the recording \nfeed or elicit the meaning of renewable and non-renewable \nenergy sources (A renewable form of energy can be produced \nas quickly as it is used/ non-renewable sources cannot be \nreplaced once they have been used). \nAsk students to explain in their own words what the energy \nsources in the box and in the table mean. They might be able to \ngive examples of countries which rely heavily on each source. \nAsk them to look up words they don't know in a dictionary. \nI \nAlternative \nGive students a copy of the definitions below and then ask \nthem to work in pairs or groups to match the energy source \nto the definition. \nDefinition \nFracking: a method of getting oil or gas from the rock below the \nsurface of the ground by making large cracks in it. Fracking is \nshort for "hydraulic fracturing" \nPetroleum: thick oil found under the Earth's surface which is \nused to produce petrol and other substances \nSolar Power: electricity produced by using the energy from the sun \nWave power: power taken from the motion of sea waves \nHydroelectric power: using the force of water to create electricity \nCoal: a hard, black substance that is dug from under the ground \nand burnt as fuel \nNatural gas: a gas that is found under the ground and is used for \ncooking and heating \nTell students to listen to the lecture and complete the table \nwith words from the box.`,
    49: `Lecturer: \nThis week in environmental studies, we're going \nto look at the latest developments in \nthe energy industry and how they might affect \nour lives in the future. As we've already seen, \nthere are basically two types of energy source -\nrenewable and non-renewable. As you no \ndoubt remember, renewable sources are those \nwhich can be used again and again, while \nnon-renewable sources can be used only once \n•\n\nand then they're finished. Historically, coal has \nbeen the most-used form of non-renewable \nenergy, but it has also been the most polluting. \nIt's widely accepted that we need to use less \nof it to help protect the environment for the \nfuture. The oldest renewable source is wind \npower, which has been used for centuries to \npower windmills and other devices, and which \nhas now been developed further, giving us wind \nturbines which produce electricity. Over the \nlast 200 years or so, petroleum has become the \nmost important non-renewable source, though \nnatural gas is overtaking it as it's far cleaner and \nless polluting. Hydroelectric power has been \nin use for many years as a renewable resource, \nespecially with dams on rivers and lakes, but \nthese are expensive to create and maintain, and \ncan affect the local environment in negative \nways. More recently, there've been great \ndevelopments in two renewable sources: solar \npower - that is, power produced directly from \nthe sun, and wave power, which comes from \nthe movement of waves at sea, but, of course, \nthese are only effective in areas with a lot of sun \nor coastal areas. While there are clear benefits \nto expanding solar and wave power, one other \nsource has become particularly significant and \nimportant, and that is tracking, which is a way \nof getting natural gas out of the ground. So, \nthe main focus of today's lecture is on tracking \nand why there's been so much discussion and \ndebate about it in the media. \nRenewable sources: wave power, solar power \nNon-renewable sources: tracking, petroleum \n02 Exercise 02 discusses a listening task type in which students \nhave to complete a diagram showing a process. Students need \nto listen to the recording and complete the missing labels. \nExtension \nEncourage stronger students to do the matching activity \nin 2 before they listen to the text. They can, perhaps, use \nprevious knowledge to do one or two matches and then use \nvisual clues to make educated guesses about the others. \nThen ask them to listen to the recording and confirm if their \npredictions were correct.`,
    50: `1 \nYou can use this machine to make a hole in something. For \nexample, you use a small one to make a hole in the wall to \nhang a picture, or a big one.to make a hole in the ground. \n2 \nThis is a hole in the ground, which is dug in order to \nextract water, oil or gas. \n3 \nThis is a kind of rock deep in the ground that isn't very \nhard and is easy to break. \n4 \nThis is a narrow space, which appears inside rock when \nthe rock breaks. The space can fill up with water or gas. \nA 2 \nB 4 \nC 1 \nD 3 \n• \n03 Try to elicit as much of the information below through \nguidĚd questioning. Feed the information if students are \nnot forthcoming. If necessary, get students to state the \ninformation in their own words to ensure they understand. \n1 \nYou shouldlo'ok atthe whole diagram to get a general \nidea of the topic but your ITlain focus should be on the \nmissing words, thinking about what tney might be. \n2 \nYou do not need to understand all tne words. Your main \nfocus should be on the missing words: The e><am will \nnot test your knowledge of difficult words, which might \nappear in the d-iagram. In this diagram, it is,clear which \npart is above ground and which part is below ground, \nso you can get a good idea that a vyord you do_n't know \nrefers to something under the ground. However, you \ndon't need to worry about this as your focus should be \non the missing words. \n3 \nThe large circle shows you some important \ninformation in more detail and focuseě your attention \non an important part of the process. The colours in \nthe large circle help y()u understand how the process \nworks as it progresseĜ - in particular, how certain \nliquids flow in and out. \n4 \nIt starts at the well where certain materials go down \ninto the ground a_nd then turn to go along through one \nof the layers. Then something else comes out and goes \nback up to the well at the top. \n5 \nThe first and second word_s clearly refer t6 the layers. The \nthird word clearly refers to something happening in the \nground: Tne fourth word clearly refers to something that \ncomes OL1t of the grounc:f. When you look at the diagram, \nfocus on these words arid'listen for the sections where \nthese parts of the process are discussed. Don't worry \nabout othe.r words that you might not understand. \n04`,
    51: `Lecturer: \nSo, what exactly is tracking? It's a way of getting \ngas out of the ground. Both oil and gas are \nfound deep underground, so to get to them \na well must be drilled. Normally, when a well \nis drilled into ground where there's gas, the \nnatural pressure of the gas pushes it to the \nsurface, where it can easily be taken away and \nstored. However, a lot of gas is found inside a \ntype of rock called 'shale', where there is no \nnatural pressure to push the gas out. If a well is \ndrilled into shale, the gas will not come out by \nitself. It needs extra help. This is when tracking \nis an important way of getting the gas out. \nThe tracking process works in this way: first, \na we\\ is dri\\ed into the ground, through the \nwater table (which is the natural level of fresh \nwater). When the drill reaches the shale, which \nis where the gas is, it turns sideways through \n90 degrees and continues horizontally through \nthe shale. So, to put it simply, the drill goes \ndown into the shale, where the gas is, and then \nturns to the side. Then, a mixture of water, sand \nand various chemicals are sent down into the \n\nwell. The mixture creates pressure in the rock \nand the rock breaks. These small breaks in the \nrock are known as 'fissures', and these fissures \nrelease the gas from the shale. The pressure of \nthe mixture causes the gas to rise to the surface, \nwhere it can be collected and stored. \n3 fissures \n4 gas \nThis section of the lesson discusses the use of quantifiers. \nAn understanding of how to use quantifiers accurately is \nimportant, especially in this part of the test when they are \nfrequently used. \nTell students to read the information box and then ask for \nexamples of quantifiers and countable/uncountable, as \noutlined at the beginning of the lesson. \n05 Tell students to work independently and complete Exercise 05, \nby choosing the correct quantifier. Then have them discuss \ntheir answers with a partner and finally feedback their joint \ndecisions to the class. \n1 Few \n2 much \n3 All \n4 Some \n5 a lot of \nFeedback \nFor each question elicit from students why they choose their \nanswer. \n06 Tell students to complete Exercise 06 by listening to the \nrecording. If appropriate, play the recording more than \nonce, but make them aware that in the actual exam, they \nwill only be given the opportunity to listen once. \n1 a Jot of \n4 more \n2 few \n5 a little \n3 some \n6 fewer \nI \nAlternative \nHave stronger students predict which words/phrases fit into \nthe gaps before they listen to the recording. Afterwards ask \nthem to say how many of their predictions were correct. \nAlso elicit why they chose any correct predictions.`,
    52: `Lecturer: One interesting fact is that fracking isn't new. It's\nbeen used for many years around the world, mostly to get \nthe last oil from old wells after the pressure's dropped. But \nthe process has become much better known with the move \nto tracking for gas and the search for new fracking sites. \nTake Canada, for example. Fracking has been used there \nto extract oil for over 50 years and gas for almost 40 years. \nMore recently, a huge amount of shale gas has been found in \nmany areas of the country and drilling companies are trying \nto get licences to drill in these areas. For example, in the \nwestern region of British Columbia, it's estimated that there \nare over seven trillion cubic metres of gas which can be \nextracted. However, most regions haven't allowed tracking \nto take place because of various environmental issues, \nwhich I'll talk about later. \nIn the USA, the production of shale gas now is around six \ntimes greater than it was ten years ago, with more and more \nlicences being given to companies to drill. As a result, shale \ngas now provides around a quarter of all gas used in the \nUS, and the cost of gas is only about a third of the cost in \nEurope and a fifth of the cost in Japan. However, because \nthe price has fallen so much, companies are reducing their \nproduction and exporting more. \nAs in the USA, production in Australia has grown massively. \nAlthough production in Australia was always lower than \nin the United States, it's over 20 times greater than it was \nten years ago and now supplies a quarter of Australia's gas \nrequirement. It's also helped Australia to become a major \nexporter of gas. Billions of dollars are being invested in gas \nexploration and Australia may well become the biggest \nexporter of gas over the next few years. \nThe situation in the UK, however, is quite different. The \namount of shale gas in the UK has been estimated to be as \nhigh as 400 trillion cubic metres. Although fracking could \nwell provide over 70,000 jobs and attract over £3 billion \nin investment, very little has been done to develop the \nindustry in the UK. Some estimates say that gas bills could \nbe 5% lower if shale gas is produced in large quantities. \nHowever, the main problem for fracking in the UK is the high \nlevel of population. While in the USA there are on average \nonly 40 people per square kilometre, in the UK there are \nalmost 250 people, so tracking in any area will affect far \nmore people in the United Kingdom. \n1 1 a lot of 2 few 3 some 4 more 5 a little 6 fewer \n07 Tell students to complete the table using the words from the \nbox in Exercise 06. \nUsed only with countable nouns: few, fewer, several,\nmany, every \nUsed only with uncountable nouns: little, much, less\nUsed with both countable and uncountable nouns: all,\n[a] lot [of], more, some\n08-15 Another task type students will encounter in the listening\nexam, is multiple- choice questions. As seen in the reading \nexam, some of the options given will be distractors, and \nstudents must be aware of this. Exercises 08-15 practise \nthis task type and give students strategies in dealing with \ndistractors.`,
    53: `Lecturer: \nAs you've heard, in countries like Australia and \nthe USA, tracking has been increasing because \ngovernments see many benefits for energy supply \nand their economies. I'd like to discuss these \nbenefits now and then talk about the problems \nwhich people have raised about tracking. Well, \nalthough increased production of shale gas will \nmake sure that there's always enough gas for \npeople's energy needs and the production of \nelectrical energy, the economic benefit to the \nconsumer is usually seen as more significant. \nAs the supply of shale gas grows, energy prices \nwill come down and consumers will save a lot of \nmoney, according to supporters of tracking. \n•\n\n08 \n09 \nsignificant ... ; prices will come down ... according to \nsupporters of tracking. The question says 'those who are in \nfavour of tracking' which refers to the supporters of fracking. \nThe correct answer is 'lower energy bills', which is the same \nas saying prices will come down. The idea of 'main benefit' \nin the question is reflected by 'more significant' in the script. \nDistractors: A is incorrect because although better \nenergy supply is referred to, it is not referred to as the \nmain benefit; C is incorrect because although electriGity \ngeneration is also referred to, there is nothing to say it is \nincreased generation \nsupporters of tracking; economic benefit; energy prices \nwill come down \n11`,
    54: `11 \nLecturer: \nAnother important economic consideration \nis the increase in economic activity \nand employment that results from the \ndevelopment of tracking wells. When a new \narea is developed, the local economy benefits, \nwith increases in services to the tracking \ncompany. Furthermore, as with all industrial \ndevelopments, employment opportunities \nincrease, with most new workers recruited \nfrom the population in the surrounding area -\nalthough many workers from outside the \narea are also attracted by the new vacancies. \nOf course, companies often bring their own \nworkers with them when they start a new well. \nQuestion: tracking starts \nA: local businesses ... lose ... employees \nB: bring in .... most \nC: more opportunities \nincreases in services to the frocking company. The question \nsays 'it creates more opportunities for businesses in the \narea; which is the same as saying the local economy \nbenefits. \nDistractors: A is incorrect because the script says 'with \nmost new people recruited from the surrounding area' \nbut it does not mention these people moving from other \nlocal businesses. B is incorrect because the script says \n'companies often bring their own workers', but there is no \nreference to this being 'most of the workers'. \n13`,
    55: `Lecturer: \nApart from the economic benefits of \ntracking, its supporters claim that there are \nsignificant environmental benefits as well. \nFirst, although burning gas produces carbon \ndioxide, which is the main greenhouse gas \ncausing global warming, the quantities that \n• \n13 \nit produces are far less than the quantities \nproduced by burning coal and oil. Some \npeople estimate that it produces up to 50% \nless than the other fuels. Burning coal and \noil also produces sulphur and mercury, \nwhich can be very dangerous to health if \nbreathed in. Another benefit of tracking is \nthat it reduces the amount of water needed \nfor gas production. There's evidence that \ngas production through tracking uses half \nthe water needed for coal, and a tenth of the \nwater needed for oil. One final benefit could \nbe its use as a bridge to carbon-free energy. \nThis means that, although gas produces \ncarbon dioxide, if gas can replace oil and \ncoal, then the production of carbon dioxide \nwill slow down and the development of \nrenewable sources of energy can take longer. \nSample answers \nA: does not ... chemicals ... harmful \nB: slightly less ... coal ... oil \nC: much less water ... coal ... oil burning \n4 \nA: less \nB: more water ... production ... coal ... oil \nC: time ... environmentally friendly \n3 Correct answer: A \n4 Correct answer: C`,
    56: `Lecturer: \nDespite the benefits of tracking, which its \nsupporters claim, there are clearly various \nconcerns connected with it. Some of these \nare real, but it's possible that they're not as \nwell-founded as opponents of tracking would \nhave us believe. So, what exactly are these \nconcerns? Well, we can divide them into three \ncategories: environmental concerns, health \nconcerns, and economic concerns. \nTo begin with, let' s look at the environmental \nconcerns. The first, and possibly most \nsignificant environmental concern is that, \ndespite producing lower levels of carbon \ndioxide, shale gas is still a cause of global \nwarming and so it should not be used. In \neffect, it simply stops energy producers and \ngovernments focusing on the real need to \ndevelop renewable sources of energy. What's \nmore, it's likely that, although countries, \nwhich produce shale gas will use less coal \nand oil, the use of coal and oil will still \ncontinue to increase in other places, so \nglobally there will be little or no benefit to \nthe environment. \n\nAnother environmental concern is pollution. \nIf the production site is badly maintained, \ndangerous chemicals can get into water \nsources and rivers and contaminate the \nwater. While there's some evidence of this \nhappening at existing production sites, it \nisn't clear whether this problem happens \neverywhere, so more research is needed. \nThe last environmental concern connected \nwith drilling is that of earthquakes. We're \nmore familiar with earthquakes happening \nin certain areas of the world like Japan and \nChina, but there's evidence that drilling can \ndisturb the ground in the local area, causing \nit to move and shake, which in turn damages \nbuildings. Usually, these movements aren't \nserious, but they can cause a lot of worry \nto the local population, so they need to be \nconsidered. In fact, very few of these ground \nmovements have definitely been caused \nby drilling, and it might be that people are \nworried because of what they hear or read \nin the media rather than the actual reality of \nthe situation. \nNow I'd like to turn to the economic concerns. \nOpponents of tracking say that the economic \nbenefits are not as great as its supporters \nclaim. While there's clearly an increase in \neconomic activity in the areas where tracking \nis carried out, as I discussed earlier, there \nare often negative effects on agriculture \nand farming in these areas and there's good \nevidence that house prices fall, because \npeople aren't willing to move into areas \nwhere tracking is taking place or has taken \nplace. Another economic concern is that gas \nproduction can be very high at the beginning \nof the tracking process, but it can drop quickly, \ndown to as little as 10% in five years. This can \nresult in more drilling and greater use of water, \nwhich increases the cost of getting the gas \nout of the ground. The other main economic \nproblem is that the estimated amount of gas \nin the ground may not be anywhere near as \nhigh as tracking supporters claim, so investing \nhuge amounts of money in new wells may not \nbenefit the economy at all. \nThis brings me to the last major concern: \nhealth. Fracking can bring with it a pollution \nproblem. If the well isn't deep enough - less \nthan 600 metres - or if there are problems \nwith drilling, the chemicals can leak into the \ndrinking water supply and cause problems \nfor the local population. There've even been \nreports of residents opening their water taps \nand seeing brown water and mud coming \nout. However, it's not only the water supply, \nwhich can be affected. Pollution can also be \ncarried in the air to local towns and affect \n14 \npeople with existing medical problems, \nespecially those with breathing difficulties. \nThere've even been reports of more cases of \ncancer among people living near production \nsites, as well as among the workers \nthemselves. Clearly, a lot more research \nneeds to be done on the effects of tracking \non health. \nSo to summarise, there are significant \nenvironmental, economic and health concerns \nconnected with tracking, but we need to \ncarry out a lot more research to see whether \nthese concerns are real. Whether they're \nreal or not, they're having an effect on the \ntracking industry right now. In many places \naround the world, local people have protested \nangrily when they've found out that tracking \nis planned in their area. These concerns \nhave also led local, regional and national \ngovernments to announce that tracking won't \nstart until they're quite sure that it's safe. \nThis means that they'll prevent any activity \nconnected with tracking until there's enough \nevidence to assure its safety, especially in \nareas with higher populations. In fact, in \nFrance, they've decided not to allow tracking \nanywhere in the country. We can see that the \nfuture is very uncertain, and that's what I'd \nnow like to discuss. \n1 Correct answer: B although countries which produce \nshale gas . . .  will still continue to increase . . .  little or no \nbenefit to the environment \n2 Correct answer: A there is good evidence that house \nprices fall \n3 Correct answer: A chemicals can enter the drinking \nwater supply ... residents . . .  seeing brown water and \nmud coming out \n4 Correct answer: B local, regional and national \ngovernments . . .  frocking will not start until they are quite \nsure that it is safe . . .  they will prevent any activity ... \nenough evidence to assure its safety \nThis section helps students follow a lecture or talk, a \nscenario they are likely to encounter in section two or \nfour of the listening test, in which students will be given a \nmonologue to listen to. \nIn order to help people follow a lecture/ talk, speakers \noften use signposting. Elicit the meaning of signposting, \nas outlined at the beginning of the lesson. Draw students' \nattention to the information box, which gives examples of \nsignposting strategies. \n16 Tell students to complete Exercise 16. \n1 first (SE) 2 What's more (AD) 3 Secondly (SE) 4 [ast (SE) \n5 Now (T) 6 While (C) 7 earlier (SE) 8 Clearly {AT) \n9 summarise {SU) 10 that {T) \n•\n\nTell students to focus their attention on Tip 16, outlining the \nimportance of signposting. \nEXAM SKILLS \n17 Tell students to complete the practice exam task, using the \nskills and knowledge acquired throughout the lesson.`,
    57: `Lecturer: \n• \nWhile tracking is being used around the \nworld, we've seen that there are serious \nconcerns about it. What's clear is that tracking \nisn't the answer to the growing worldwide \nneed for energy as countries increase their \nconsumption. Already, the amount of carbon \ndioxide in the atmosphere has reached 400 \nparts per million. This may not seem very \nhigh, but we have to remember that 200 \nyears ago the level was around 280 parts \nper million, so it's increased by over a third \nsince then. As a result, it's estimated that \nglobal temperatures have already increased \nby almost one degree Celsius. This increase \nchanges the climate and affects the weather \nin many parts of the world. Many places, \nsuch as north-west Europe, are expected to \nbecome warmer and wetter and we've seen \nwinter storms becoming worse in this region. \nOther places such as sub-Saharan Africa are \nexpected to become hotter and drier, with \ndeserts growing in area and seriously affecting \nfarmland. Ice in the polar regions will melt \nand sea levels will rise, which will put coastal \ncities in greater danger of flooding. \nClearly, we need to reduce, and eventually \nstop using non-renewable resources, like \ncoal, oil and gas. It may well be true that \ntracking can slow down global warming \nfor a while and allow us to develop better \nrenewable resources. However, these \nresources, like wind, wave and solar power, \nare currently far more expensive to develop \nthan shale gas production. On top of that, \nthey take a long time to develop and start \npaying for themselves. Consumers have to \npay higher bills to help the development of \ncleaner sources, and energy companies don't \nwant to lose customers by asking them to \npay more. Consequently, it's important for \ninternational organisations like the United \nNations and national governments to support \nthe development of renewable resources. The \nproblem here, of course, is that governments \nusually think of short-term answers to energy \nproblems and not longer-term ones. They're \nafraid that if they reduce the production and \nuse of gas and oil, their economies will do \nworse than other economies, so they don't \nwant to take action to increase the use of \nrenewable sources. \nAs I mentioned earlier, there are many people \nin different countries, like Canada, the UK and \nFrance, who don't support tracking, especially \nif it's going to take place near where they live. \nEnvironmental groups also oppose tracking, \nnot just because they want to protect people \nliving in areas where tracking is planned, but \nalso because they see tracking as part of the \nold way of doing things, like bu ming coal, oil \nand gas and increasing global warming. They \nwant to see continued action and are trying to \npersuade governments to develop wind, wave \nand solar power, as well as other renewable \nforms of energy, to fight global warming and \nensure the supply of energy in the future. \nCertainly, coal, oil and gas will run out one day, \nand if we haven't developed other forms of \nrenewable energy, we'll have serious problems \nwith supplying energy to the growing world \npopulation, and the problems of tracking will \nseem relatively unimportant. \nSPEAKING \nOUTCOMES \n•\nspeak in detail.about cpnservati9n and the environment\n•\nreCognise different functions ih Speaking Part,3 questions \n•\nexpress your opinions wi.th the appropriate emotion.\nOUTCOMES \nDraw students' attention to the outcomes of this lesson, which \nprepare students to speak about the topic of conservation \nand the environment. This is a subject they may be asked to \ntalk about in the exam, especially in Part 3 where they need to \nspeak on more global issues. \nThis unit focuses mostly on Part 3 of the test, in which students \nare asked to express their opinions and they must also be \nable to recognise different functions for example comparing, \nassessing and explaining. \nLEAD-IN \n01 Focus students' attention on the two photographs. What \ndo they show? Would you like to visit these places? Why/ \nwhy not? \nTell students to discuss questions 1-3 in pairs. Go round \nand monitor the discussions and ask pairs who have had \ninteresting discussions to feed back to the class. \nThis section of the lesson provides students with some \nuseful vocabulary, which they may need when talking about \nthe environment. Tell them to look at the words in the box \nand discuss the meaning of any unknown words. Drill the \npronunciation of each word. Drought and tsunamis are \nwords, which are likely to be tricky for students . \n\nElicit from students what type of natural disasters they have \nrecently heard about in the news and also elicit any major \ndisasters from the past. Ask if them to mention parts of the \nworld where there are frequent natural disasters. Similarly \nget them to talk about any major incidents of man-made \npollution they have read/heard about.. \n02 Tell students to complete the table using words from the box. \nNatural disasters \nMan-made pollution \nvolcanic eruptions \ncarbon monoxide \ntsunamis \nacid rain \ndrought \nradiation leaks \nhail \nthunderstorms \ntornados \n(floods, forest fires, landslides and sinkholes can go in \neither column) \n03 This exercise asks students to put some of the words from \nExercise 02 into a context. This will help to consolidate the \nnew vocabulary, \nAlternative \nWith a weaker class, you could first ask them to underline \nthe key words in each statement and then match the key \nwords to one of the words from the box. \nExample \n1.\nHumanity/blame/increase/emissions - carbon monoxide\n2.\nResult/ homes/ burned down - forest fires\nSample answers \n1 carbon monoxide 2 Forest fires \n3 oil spills/ radiation leaks 4 earthquakes / tsunamis \n5 Acid rain 6 floods I landslides I sinkholes \n04 This exercise personalizes the topic for students, by asking \nwhich environmental factors they have been affected by. \nPersonalising the topic will make it easier for students to \nremember any new vocabulary. Be aware, however, that this \ncould be potentially upsetting for some. \nTell students to discuss Exercise 04 in pairs. Go round \nand monitor the discussions and ask pairs who have had \ninteresting/frightening/exciting experiences to feed back \nto the class. \nExtension \nYou could extend this section further by asking students to \ndiscuss the following: \nWhy do you think certain areas are affected by these threats? \nWhat can be done to prevent some of these problems? \n05-06 Exercises 05 and 06 discuss words in English, which have\nsilent letters when spoken. \nIt is important that students are aware of this when \nspeaking, in order to achieve a good score in the exam. \n06 \nTell students to listen to the examples of this in Exercise 05 and \nthen complete Exercise 06. Play the recording twice if needed.`,

plain \n6 predict 7 compare 8 suggest 9 assess \nExercises 14, 15 and 16 teach students how to express their \nopinions, a requirement of Part 3. Exercise 14 discusses \nhow a student's level of certainty in their opinion can be \nexpressed by using certain words. \nTell students to complete the table using the words from \nthe box. \n'i \n!i \nCertain im \nCareful \ncertainly \nlikely \nindeed \nperhaps \nsurely \nmaybe \nclearly \n. \nunlikely \nno doubt \nalmost .. ·. \nwill \nmight \nof course \noccasionally \ndefinitely \nseeminglyz\nExtension \nIn pairs tell students to practise using these words in \nsentences, for example: \n• I am unlikely to go out this evening.\n• I will definitely pass my exam\n' \nWith weaker students, do this activity as a whole class.\n15 As stated in Exercise 15, it is important that students are \nprepared to have an opinion on any topic. \nTell students to complete Exercise 15. \nStatement \nAgree \nDisagree \nThat's true. \n./ \n1 That's right. \n./ \n2 I'm not sure about that. \n3 That's also how I feel about it. \n./ \n4 I have to side with you on \nthat one. \n5 Me neither. \n./ \n6 That's incorrect. \n./ \n7 I beg to differ. \n./ \n8 You might have a point there. \n./ \n9 I'm afraid I don't share that \npoint of view \n\n16 Tell students to discuss the statements in Exercise 16, using \nthe example phrases in 15. \nEXAM SKILLS \nIn this sample exam task, students are given the opportunity to \npractise all three parts of the test. \nTell students to practise exercises 17, 18 and 19 in pairs. As one \nstudent speaks the other should keep time. \nAs you monitor, tell students you will be looking for the \nfollowing: \n•\ntheir ability to speak in detail about conservation and the\nenvironment.\n•\ntheir ability to understand and respond appropriately to the\nfunction being asked of them.\n•\ntheir ability to express their opinions with emotion.\nEncourage some strong pairs to demonstrate their discussions \nto the whole class if
