    37: `Jane: \nHave you got the results from the survey we \ndid about the changes that've been made to \nAshtown iri the last 25 years? \nBill: \nJane: \nBill: \nJane: \nBill: \nJane: \nBill: \nJane: \nBill: \nJane: \nBill: \n• \nYes, and there've been a lot of changes. Some \nof the people are happy about and some of \nthem they aren't. \nWhat, for example? \nWell, for example the bus system used to \nbe much better and, even though the old \nuncomfortable buses have been replaced with \nnew stylish ones, fewer people use them. \nWhy is that? \nA lot of people think it is because fares are \nhigher, but that isn't true. In fact, the cost \ncompared to average salaries is pretty much \nthe same as 25 years ago. The fact is that \nthe buses now just go to the most popular \ndestinations and, as the city centre no longer \nallows vehicles, there are even fewer places \nwhere buses can go. \nMost people must be happy with fewer cars in \nthe town centre though? \nI'm not so sure. Five years ago a bypass was \nsupposed to be built so that people could \neasily get from one side of the town to the \nother, without going into the centre, but those \nplans still haven't happened. The biggest \nsuccess in my opinion is the building of areas \nfor cyclists. Far more people are travelling \nby bike and using the facilities than anybody \ncould have imagined. \nThat's all very interesting, but how have the \njobs that people do in the city changed? That's \nsure to have had an impact on what the town \nlooks like. \nYou're not wrong there. The town used \nto be a lot more polluted due to all of the \nproducts that were made in factories here. \nManufacturing is still important of course \nand services such as accountancy firms and \nwebsite developers employ a lot of people in \nthe town, but you only have to see the number \nof universities and colleges that have opened \nin the town in the last 25 years to see that is \nwhere most of the jobs are now. \nOK, now shall we have a look at how some of \nthe buildings have changed? \nI think that first of all we should look at how \nthe railway station has changed. As there are \nnow fewer buses, more people drive to the \nrailway station to take a train. Twenty-five \nyears ago the car park was much smaller \nand, although it might not look very modern, \nmost of the spaces have only been there for \nfive years . \nJane: \nBill: \nJane: \nBill: \nJane: \nBill: \nJane: \nBill: \nJane: \nOh yes, didn't the cinema used to be quite \nnear the railway station? I suppose they built \nmore spaces when they knocked it down. \nThat's right, the Grand Cinema used to be next \nto the railway station, but they rebuilt one \nexactly the same as the old one over in King \nStreet. \nWhat about the indoor market? My mum says \nthere used to be an outdoor one, but that \nclosed down a long time ago. \nYes and when the outdoor market closed down, \nthe.indoor market became a lot more popular. \nTen years ago it looked like it would close down \ntoo, as the building was really old and it had \nbecome dangerous. It used to be owned by the \ncouncil, but a private business bought it and \nmade the changes so that it could stay open. \nIt's good to see it's so popular still despite all \nof the new supermarkets in town. I bet the \nlibrary isn't as popular as it used to be though? \nYou'd be surprised. A lot of people still use the \nlibrary! Most people think that people are less \nkeen on borrowing books than in the past, but \nthe library has adapted to changes. It's true that \nfewer people go in there to borrow books, but \nsince they made tablets and computers available, \nmore people have started visiting it. It has really \nfast Wi-Fi too, so people like it because of that. \nQuite a few of the factories have closed down \nor been sold in the last 25 years though, so \nwhat happened to all of the buildings that \nused to house them? I suppose they're all shut \ndown now? \nSome of them have been demolished, and \nsome have been converted for other uses, but \nthat isn't surprising. The thing that I found \nsurprising was that, although education has \nbecome more important to the economy of the \ntown, there isn't an art college any more. In fact \nthe art college is now used as a doctor's surgery. \nOh really? Anyway, I think we need to look at \nhow we're going to present these findings to ... \nlC \n2B \n3C \n4G \nSA \n6F \n7C \n8B \nSPEAKING \nOUTCOMES \n•\nplan your long-turn answer for Speaking Part 2\n•\nuse the correct sequencing words to give your answer\na clear structure\n•\nunderstand sentence stress when using sequencing words \n•\ndeal with follow-up questions after your long turn.\n\nOUTCOMES \nFocus students' attention on the outcomes of the unit, which \ndiscusses Speaking Part 2. In this part of the test students are \ngiven a task by the examiner and they have one minute to \nprepare their answer and then approximately two minutes to \nproduce the answer. When students have finished, they may \nhave to answer follow up questions from the examiner. \nThe aims of this lesson, therefore, focus on helping students \nprepare their answer, produce the answer and deal with any \nfollow up questions. \nSequencing words are also a focus of this lesson, as they \nare particularly important in this long turn task type. This is \nbecause students are essentially recounting a short story and \nthe examiner must be able to understand the structure and \nflow of what is being said. \nDefinition \nSequencing words: words which link ideas together \ne.g and, but, because, therefore \nLEAD-IN \n01 In order to draw students into the unit topic, ask them to \nlook at the pictures and answer questions 1-4 in pairs. \n02 Ask students what they have to do in Part 2 of the Speaking \ntest (outlined at the beginning of the lesson) \nTell students they are going to listen to the examiner give \ninstructions at the start of Speaking Part 2. Students need to \nlisten to     38: `Now I am going to give you a topic and I'd like you to talk about \nit for between one and two minutes. You have one minute to \nthink about your answer and you can make notes if you wish. \nAll right? Remember you have one to two minutes for this, \nso don't worry if I stop you. I'll tell you when the time is up. \nCan you start speaking now, please? \n1 The examiner will give you a topic. \n2 You have one minute to make notes. \n3 You should make notes on the note paperprovided. \n4 The maximum time to talk is two minutes. \n5 You should keep talking until the examiner stops you. \n03 This exercise, gives students an example of the kind of task \nthey may be given in this part of the test. Draw students' \nattention to Tip 3, stating that they should speak about their \ntopic, using the order given. \n04 This exercise helps students to write a set of notes about \ntheir topic. As shown in the table provided, each point \nshould be addressed individually and in the order given on \nthe card. As stated in Tip 4, adding questions can sometimes \nhelp students think of more to say. \nTell students to complete Exercise 04. \nExtension \nIn order to practise the note taking section of the test \nfurther, you could give students another topic to practise. \ne.g Describe the best or worst holiday you have ever had.\nYou should say: \n• where you went/ who you went with\n• why it was good or bad\n• if you would do it again -why/why not \n05 As stated in the information box, for this particular task type, \nsequencing words are very important. \nAsk students for examples of sequencing words, outlined at \nthe beginning of the lesson . \nTell students to close their books and listen to a student \nattempting the task in Exercise 03.`,
    39: `Student: \nI remember a trip I took last year, on the \n12th August, I believe. I boarded a plane to \nParis, which was rather exciting as I'd never \ndone that before. Since I come from China \nit took a long time to arrive, but when I got \nthere, the first thing I did was go to the Louvre \nMuseum. You know, where the big triangle is \nby the entrance, and took some pictures. After \nthat, I boarded a subway train to the Eiffel \nTower to take more pictures. Because I was \npretty hungry around that time, I went to a \nrestaurant, although I had trouble ordering \nfood because I don't speak any French. Once \nI'd eaten, I then took a tour bus to the Champs \nElysees in order to do a bit of shopping, \nwhere I went on to buy as much as I could. \nI even bought a souvenir snowglobe for my \nfriend Julie, as she collects them. However, \nwhen I got back on the tour bus and started \ntaking pictures, I dropped my camera over the \nside, watching it break on the ground. After \neverything was over, I took the flight back \nto China. It was a great experience, although \nnext time I think I should study some French \nbefore I go! \nAsk students to look at the pictures and listen again. As they \nlisten to the recording they have to order the illustrations. \nExtension \nYou could ask students to discuss what was good and what \ncould be improved, about this sample answer. Students \ncould make notes as they listen or weaker students could be \ngiven a copy of the tapescript to discuss. \n4 \n06 In this exercise students have to produce their own answer \nto the speaking task, using the linkers in the box. Check that \nweaker students understand the meaning and use of all \nthese words. Perhaps choose the less familiar ones and ask \nstudents to write a sentence for each. \n•\n\nLess familiar: until, in order to, once, since, although, \nwhether, while, yet. \n07 This exercise focuses on sentence stress. Sentence stress \nis important, because it helps to convey the meaning of \nwhat is being said. Write this example sentence on the \nboard and elicit from students why the two words in bold \nare stressed: \ne.g. The best holiday I have had, was when I went to \nAustralia. \nTell students to complete Exercise 07.`,
    40: `1 I boarded a plane to Paris, which was rather exciting as \nI'd never done that before. \n2 Since I come from China, it took a long time to arrive, but \nwhen I got there, the first thing I did was go to the Louvre \nMuseum. \n3 I had trouble ordering food because I don't speak any \nFrench. \n4 Once I'd eaten, I then took a tour bus to the Champs \nElysees in order to do a bit of shopping. \n5 As I got back on the tour bus and started taking pictures, \nI dropped my camera over the side. \n1 I boarded a plane to Paris [stressed], which was rather \nexciting [stressed] as I had never done that before. \n2 Since I come from China, it [unstressed] took a long \ntime to arrive, but when [unstressed] I got there, the \nfirst thing I did was to go to the Louvre Museum. \n3 I had [unstressed] trouble ordering food [stressea] \nbecause I don't [unstressed] speak any French [stressed]. \n4 Once [unstressed] I had eaten [stressed], I then took \n[unstressed] a tour bus to the Champs Elysees in order \nto [unstressed] do a bit of shopping. \n5 When I got [unstressed(back on the tour bus and \nstarted [unstressed] taking pictures [stressed], \nI dropped my camera [stressed] over the side. \nExtension \nAsk students to read the sentences to their partner and \npractise stressing the appropriate words. Stronger classes \ncould write their own sentences, involving stressed words, \nrelated to the unit topic. \nTell students to complete Exercise 08 \nSample answers \n1 This was rather exciting AS/ SINCE/ BECAUSE I had \nnever done that before. \n2 It took a long time to arrive AS/ SINCE/ BECAUSE \nI come from China. \n3 It was a great experience ALTHOUGH next time I think \nI should study French. \n4 I went to a restaurant AS/ SINCE/ BECAUSE I was \npretty hungry around tt:lat time. \n5 I went to the Champs Elysees to do a bit of shopping \nWHERE/ AND I went on to buy as much as I could . \n• \n6 I then took a tour bus ONCE I had eaten. \n7 I took the flight back to Chin n•\n\nREADING \nOUTCOMES \n• \nskim a text to identify facts, opinions and theories\n• \nmatch a fact, opinion or theory with a person \n• \nrecognise the use of will and going to future forms\n• \nmatch sentence beginnings and endings about a\npassage. \nOUTCOMES \nThe main aim of this unit is to help students to quickly identify \nfacts, opinions and theories and to match these with a person. \nElicit from students the difference between a fact, opinion \nand theory. The easiest way to do this is to ask students for an \nexample of each. \nDefinition \nFact: something that you know is true, exists, or has happened. \nFor example: \nEngland won the World Cup in 1966. \nOpinion: a thought or belief about something or someone. \nFor example: \nI think that Andy Murray will win Wimbledon again next year. \nTheory: an idea or set of ideas that is intended to explain \nsomething. \nFor example: \nAccording to all the sports experts, the new range of racing bikes \nwill lead to new world speed records for at least the next two or \nthree years \nThe unit also deals with two task types: matching features and \nmatching sentence beginnings to sentence endings, relating \nto a reading passage. Students also learn to recognise and \nunderstand the use of the future forms, will and going to. \nLEAD-IN \n01 Tell students to read statements 1-3, and decide which is a \nfact, opinion or theory. Have them share their ideas with the \nclass to ensure there is a consensus. \n1 opinion \n2 theory \n3 fact \nElicit from students which words/phrases helped them \nidentify which statement was a theory and which was an \nopinion. \n• \nExtension \nIn order to give students further practice, give them the \nfollowing exercise: \nDecide whether the following introductory phrases express \nan opinion or a theory: \nMany scientists believe in ... \nIn my view ... \nSeveral experiments have proved .... \nI would argue that ... . \nI do not believe ..... . \n02 In pairs, ask students to discu uld be asked to write an essay on the advantages \nand disadvantages of a particular topic. \nPoint out that students don't always do well in this type of \nessays, because they don't use appropriate structures or \nlinkers. \nTell students to look at the photographs of people working in \nthe country and in the city. In pairs, ask students to discuss \nquestions 1 & 2. \nIn order to help students think of ideas for question 1, \ndiscuss a few examples as a whole class. Alternatively have \nstudents brainstorm in pairs and then share their ideas \nwith the class. \nSample answers \nCountry \nAdvantages: more physical work, healthier, more enjoyable,\nless stressful \nDisadvantages: paid less, less opportunity for promotion,\ndifficult in bad weather \nCity \nAdvantages: higher pay, busy, exciting, lots of opportunities\nDisadvantages: tiring, busy, difficult to get to work\nAs stated in Tip 1, this speaking exercise reflects the type \nof content needed in the writing answer. Students need to \npresent both sides of the argument and then give their own \nopinion. \nExercises 02 & 03 focus on helping students' plan their answer \neffectively. Planning is particularly important in Part 2 as the \nessay should be approximately 250 words. As this answer needs \nto be fairly long therefore, it important students keep their \nanswer relevant, structured and coherent, as highlighted in the \ninformation box. \nI\nAlternative \nSuggest that students make notes of their discussion to get \nthem used to preparing written answers. Students could \nwork in pairs and groups to correct spelling and grammar. \nEncourage students to discuss the problems in 2 and see if \nt \nI \n\nI\nthey can add any others. For 3 get students to share their \nexperiences in pairs and then collate them with the whole \nclass on the board. \n04 \nDraw students' attention to the information box, stating the \nimportance of analysing the task carefully. Perhaps the most \nimportant aspect students need to realize about part 2, is \nthat their answer needs to be relevant. \nAdvice \nIt is crucial for students to analyse the task carefully \nbefore attempting to answer it in order to ensure that \nthey are answering the specific question being asked \nrather than a similar one they may have done before \nwhen practising. \nAsk questions to focus on the importance of analysing the \ntask. e.g. \nWhy should you analyse the task before writing? Discuss \nin pairs which of the following are valid reasons, then feed \nback to the class. \nA To make sure your ideas are relevant. \nB So you can change the topic if you can't answer the \nquestions. \nC To make sure you answer all parts of the questions. \nD To be able to plan out the paragraphs you will need to \nanswer the question fully. \nAll are valid reasons except B \n1 Task: extent / agree/ disagree\nTopic: workplace after school I more beneficial I\nuniversity \n2 Task: advantages / disadvantages\nTopic: get a job I unpaid internships\n3 Task: reasons, How ... tackled\nTopic: stress/ major problem\nOS Tell students to discuss their answers. \nThe second stage in the planning process is for students \nto brainstorm their ideas. As explained in the information \nsection, brainstorming allows students to focus solely \non their ideas, and not be worried by other aspects, such \nas grammar. \nThis section shows students two of the methods, which \nI\ncan be used to brainstorm mind maps, involving circular \ndiagrams or linear plans, such as tables. \n06 Tell students to brainstorm ideas for questions 1 & 2. They \nshould use both methods and decide which one they feel \nmost comfortable with. \nGive students a maximum of 5/10 minutes to complete \neach plan as it's important that students should get used to \nwriting down their ideas quickly. \n1 Wearing a uniform \n2 Big company \nAdvantages \nMeet more people \nMore opportunities for \npromotion \nDisadvantages \nLess personal \nPerhaps limited to one type \nof task case in the actual exam. \nSample answer \nThe way in which we work has changed a great deal in \nrecent years. \nWhilst some people still travel to their place of work each \nday, others have the option to work from home. This has \nall become possible since the birth of the internet and. \nsmartphones, which enable workers to be in constant contact \nwith their colleagues and clients all over the world. There are \nboth advantages and disadvantages to this new development. \nThey are definite advantages to people being allowed \nto work from home. The main advantage is that it gives \nworkers more flexibility in their working life. This can \nbe particularly useful for parents or people who live far \nfrom their workplace. Working from home is also more \ncomfortable and you can take a break whenever needed. \nAnother advantage is that you have the possibility to work \nfor companies in other countries, through the use of the \ninternet. Therefore people can apply for jobs globally as \nwell as locally. \nOn the other hand, working from home can also have \nits disadvantages. Travelling to work and working in \nan office with others can be a very sociable activity, \nwhich many people enjoy, especially if they live on their \nown. Without this social interaction many people might \nfeel very lonely. Furthermore, many people may lack \nsufficient discipline to complete the work they need to \ndo without colleagues around. \nIn conclusion therefore, there are clearly advantages and \ndisadvantages to working from home. Perhaps the ideal \narrangement would be to spend part of the working week \nin an office with colleagues, and part of the working week \nat home, with a certain amount of flexibility and comfort. \nLISTENING \nOUTCOMES \n•\nuse notes to follow a talk or lecture\n•\nidentify information needed to complete notes or sentences\n•\nrecognise the language of comparison and contrast to\npredict ideas in a talk.\n• \nOUTCOMES \nIn this lesson students will use notes to follow a talk or lecture. \nThis context is common for sections 3 & 4 of the listening test, \nwhich are always set in either an educational or training context. \nThe second outcome teaches students to complete notes or \nsentences, by identifying the relevant information; a common task \nin the listening. The third outcome shows students that they can \nuse the skill of prediction to help them locate the correct answer, \nthrough recognising the language of comparison and contrast. \nLEAD- IN \n01 In order to generate interest in the unit topic, ask students \nto discuss the pictures in Exercise 01. What jobs are the \npeople doing? Do you think they work for a company or for \nthemselves? Try to elicit what students also know about \ndifferent types of business in their own country and in the \nEnglish-speaking world. Encourage students to talk about \nfriends or family members, who work for themselves, have \npartnerships or businesses with a small number of employees. \nGet them to talk about others who work for bigger companies \netc, and ask them to describe what sort of companies they are. \nCollate different ideas on the board. Encourage students to use \ndictionaries to clarify the three different types of business in \nthe box: sole trader, partnership and limited liability company. \nBefore playing the recording, tell students to underline \nthe key words in the descriptions and make sure they \nunderstand their meaning. \nDefinition \nFinance: money \nCorporation: business \nTax: money that you have to pay to the government from what \nyou earn or when you buy things \nShares: a part of a company \nIncome tax: tax that you have to pay on the money you earn \nMuch of the language may be new to students, so it might be \nnecessary to play the recording more than once. \nI \nAlternative \nIf students need more help with this, give them a copy of the \ntapescript and ask them to underline the key words in each \nparagraph.`,
    42: `Dr Lethbridge: \nIn last week's lecture I talked about \nemployment and aspects related to it, \nincluding contracts, income tax and so \non. However, people are increasingly \nlooking at other forms of earning a living \nby working for themselves and being in \ngreater control of their working lives. Today \nDr Korpis and I are going to talk about three \ndifferent ways in which people can work for \nthemselves. They can set up a company, \nset up a partnership, or they can work as a \nsole trader. There are important legal and \nfinancial matters to take into consideration \nwhen choosing one of these structures as a \nway of doing business in the UK .\n\nFirst, I just want to outline the main \ndifferences between these three types \nof business structure, which are to do \nwith tax and registration. Regarding \nregistration, those wanting to set up a \nlimited liability company have to legally \nregister the company with Companies \nHouse, the government department \nresponsible for businesses. 'Limited \nliability' means that, if the business fails \nand the owners owe a lot of money, \nthey only lose the money and goods \nwhich are in the business, and not their \nown personal money and goods. This \nis because the owners of the company \nare separate from the company itself. \nOn the other hand, a sole trader doesn't \nneed to set up a company; he or she can \nsimply start working without any legal \nregistration. A partnership can be limited \nor unlimited. An unlimited partnership \nis just like a sole trader, but with two \nor more partners. In this situation, \neach partner shares expenses and also \nincome. A limited liability partnership, or \nLLP for short, is like a limited company, \nbecause it must be legally registered in \nthe same way. So just to summarise: with \nlimited liability companies and limited \nliability partnerships, the owners and \nthe company are separate in legal terms, \nbut with simple partnerships and sole \ntraders, the business and the owner are \nnot legally separate. \nThe other main difference is to do with \nmoney- both with finding money to start \nyour business, and with paying tax. For \nexample, it might be difficult to borrow \nmoney from the bank if you're a sole \ntrader, but easier if you have a limited \ncompany, as banks trust companies more. \nRegarding tax, limited companies pay \ncorporation tax, which, unlike income tax, \nis a tax on business profits, not personal \nearnings. This is more favourable for \ncompanies, as corporation tax is usually \nless than income tax. On the other hand, \nwith sole traders and partnerships, \nwhether simple partnerships or limited \nliability partnerships, the owners must \npay income tax, which may be higher than \ncorporation tax . \nA limited liability company \nC partnership \nB sole trader \nElicit from students which words/phrases helped them to \nfind the correct answers. \nAs demonstrated in Exercise 01, listening out for key words, \nis essential for the note completion task. \n02 Tell students to listen to a second lecturer talk about \nbeing a sole trader and ask students to correct the notes \nif necessary. Again, if needed, extra support can be given \nby playing the recording more than once, by stopping \nthe recording at key points or by giving students a copy \nof the tapescript.`,
    43: `Dr Korpis: \nThank you, Dr Leth bridge, for your \nintroduction. I'd now like to move on \nto the details of each type of business \nstructure and discuss the advantages and \ndisadvantages of each, starting with the sole \ntrader. This is simply a person who runs a \nbusiness alone. On the practical side, there's \nno need to register with Companies House, \nwhich means the sole trader is not legally \nthe same as a registered company. The \ntrader can simply choose any name and start \ntrading without paying any fees. There's \nno need to register an office, so the trader \ncan even work from home. There are also \nno legal requirements to submit financial \naccounts to Companies House. As a result, \nthis is the simplest and most straightforward \nway to start out in business and work for \nyourself. Another benefit of being a sole \ntrader is that you are your own boss. You \ndon't have to answer to anybody else, you \nmake your own decisions and you don't \nhave to share your earnings with a partner. \nHowever, it doesn't mean that you have to \ndo everything alone. You can also employ or \ngive contracts to other people to do work for \nyou, though, of course, you need to be aware \nof regulations regarding employing others. \nSo these are the desirable aspects of being \na sole trader but there are other matters \nwhich need careful consideration. When \nyou're in employment, you are taxed at \nsource, which means your employer takes \nyour tax from your earnings every month and \nsends it to the tax office, so you don't need \nto worry about it. However, as a sole trader, \nyou are self-employed, which means you \nare responsible for what you earn, what you \nspend and the tax that you must pay. This \nmeans you have to complete an annual tax \nreturn. This is a document which you send to \nthe tax office once a year showing what you \nearn from your business and what you spend \nin running your business. On the positive \nside, you're only taxed on your earnings after \nexpenses, such as transport, electricity, office \nequipment and so on. So, if you work from \nhome, you can save tax by declaring some of\nyour use of electricity as necessary for your \nbusiness. Another consideration is that if you \nearn over a certain amount, you pay a higher \nrate of income tax, which is higher than the \n•\n\nA Correct \ncorporation tax rates that companies pay. \nYou'll also have 'unlimited liability', which \nmeans that if you can't pay your business \ndebts, you may lose your house and car \nto pay for them, as you are your business. \nFinally, many sole traders find it difficult to \ntake holidays and breaks from the business \nand find that they spend far more time \nworking than employed people. \nThe typical traders associated with this type \nof business structure are skilled manual \nworkers, such as builders, plumbers and \nelectricians, or professions in which people \nusually work alone, such as photographers \nand writers. However, increasingly these \ndays, with the reduction in long-term \nemployment and job security, sole traders \nare coming from other professions, such as \ncomputer programming and even teaching, \nespecially tutoring. Certainly, being a sole \ntrader is a very useful way of starting out in \nbusiness by yourself. \nB Incorrect: sole traders may employ other people \nC Incorrect: sole traders must pay tax every year, \nnot every month \nD Correct \nE Correct \n03 Exercises 03 & 04 focus on completion tasks, which specify \nhow many words/numbers are needed to complete the \nmissing information. It is very important that students keep \nto this word limit, otherwise they will lose marks. \nCheck students understand the words in the box, \neliciting meanings or by having students check meanings \nin a dictionary. \nDefinition \nAccounts: an official record of all the money a company or \norganization has received or paid \nContracts: a legal agreement between two people or \norganizations \nDebts: an amount of money that you owe someone`,
    44: `Dr Lethbridge: \nThank you, Dr Korpis. The next form of \nbusiness structure that I would like to \ndiscuss is the 'partnership'. There are \n• \ntwo kinds of partnership - a simple \npartnership and a limited liability \npartnership or 'LLP'. I'll talk about \neach of these in turn. Forming a simple \npartnership is straightforward, like \nbecoming a sole trader, except that you \nhave to agree to work with someone \nelse. A partnership could be between a \nhusband and wife, or two members of the \nsame family or close friends. For example, \na couple might run a catering business, or \ntwo car mechanics might leave employed \nwork to set up a partnership together \nrepairing cars. One obvious advantage \nof this is that, if one partner is sick or on \nholiday, the other partner can carry on \nthe business, and another is that it can \nbe easier for a partnership to borrow \nmoney from a bank than it can for a sole \ntrader. Of course, partners usually have \nan informal agreement to work together, \nbut it's always better to have a formal \narrangement to avoid disagreements. \nAs with sole traders, each partner must \nbe registered with the tax office as \nself-employed and must send in a tax \nreturn once a year. In addition, as \nthe partnership is unlimited, all \nmembers are responsible for debt, so \nyou and your partners may lose your \npersonal possessions to pay debts if the \nbusiness fails. \nThe other structure for a partnership is \nthe 'limited liability partnership', or 'LLP'. \nThis is similar to a simple partnership \nas the partners share the income and \nexpenses and also have to pay their \nown taxes to the tax office, but there are \nimportant differences. On the one hand, \nsole traders and simple partnerships \ndon't have to legally register their \nbusinesses. On the other hand, LLPs have \nto be legally registered with Companies \nHouse. This means that at least two of \nthe members are legally responsible for \nthe partnership. They have to make sure \nthat they send accounts to Companies \nHouse, as well as to the tax office. They \nalso need to send in an annual return, \nwhich is a document showing the name, \naddress and members of the partnership \nand any changes. If they don't do this, \nthey may go to prison, so it's important \nto understand exactly what setting up an \nLLP means. \nSo why should partners enter into a \nlimited liability partnership? Usually, an \nLLP suits certain types of professionals \nwho provide services, such as \naccountants, la\N')'ers, consultants and \nfinancial service providers. Another \nreason may be that partners want to \ndo business with larger organisations, \nwho would prefer to give contracts to a \nregistered company or partnership. In \nany event, an LLP offers the flexibility of \nbeing in a simple partnership, but also \ngives the partners protection so that they \nonly lose the money that they have put \n' \nr \n\ninto the partnership if it fails. However, if \npartners earn a lot of money, they will still \npay more tax than the owner of a limited \nliability company pays. \n1 borrow money \n4 contracts \n2 pay debts \n5 tax \n3 accounts`,
    45: `Dr Korpis: \nThank you, Dr Leth bridge. The last form of \nbusiness I'd like to talk about is the limited \nliability company. The owners of a limited \nliability company are called 'members' or \n'shareholders' as they own shares in the \ncompany. A 'share' is a divided-up unit or \npart of the company. All businesses run the \nrisk of failing or going bankrupt. If a business \ngoes bankrupt, it has to close because it owes \nmoney and is not able to pay the money back. \nAs I mentioned before, setting up a limited \nliability company, like an LLP, means that if the \ncompany fails or goes bankrupt, the business \nowners lose only what they have put into the \nbusiness and not their own personal goods \nand property. This is the idea of liability- how \nmuch a business owes in debt if it can no \nlonger operate and has to close. For example, \nif a sole trader goes bankrupt, he or she \nmay need to sell his or her own house and \npossessions in order to pay any debts, because \nthe business is not separate from the owner. \nWith LLPs and limited liability companies, the \nowners and the businesses are separate, so \nproperty and goods owned by the business \ncan be sold to pay debts, but not property and \ngoods personally owned by the members or \ncompany shareholders. \nJust as with LLPs, limited liability companies \n(or 'limited companies' for short) must be \nlegally registered with Companies House. This \nmeans they must have a registered address, \nwhere all the company documents and \nrecords must be kept. As with LLPs, accounts \nand annual returns must be submitted every \nyear so that anyone can have a look at the \ncompany's finances before doing business \nwith it. The level of administration is higher \nthan with other business structures and you \nneed to have a managing director and at least \none shareholder. \nIn terms of paying tax, the company has to \npay corporation tax on its profits, which is \nfar less than income tax on large amounts, \nespecially over around £50,000. However, you \nalso have to pay income tax on any money \nyou take as a salary from your company. \nAs with the other business structures, the \ncompany tax assessment must be submitted \nto the tax office, but for corporation tax \nrather than income tax. The shareholders \nalso have to submit their own personal tax \nassessments separately. As we've already \nmentioned, the company owners must also \nsubmit accounts to Companies House. This \ncan all be quite complicated, so it's a good \nidea to get professional help and advice from \nan accountant. It's important to remember \nthat running a limited company is more \ncomplex than being a sole trader, so it's \nimportant to do careful research and consider \nyour situation before deciding which type of \nbusiness to run. In any case, you could start \nas a sole trader and, if business is doing well, \nturn your business into a limited company at a \nlater date. \n04 Exercise 04 presents students with a slightly different \ncompletion task. This type of exercise asks students to \ncomplete statements, which summarise the information \nfrom the listening. \nOS In this exercise, the recording is discussing the advantages \nand disadvantages of different business structures. The \ntopic may be something that students are not familiar \nwith, but by looking at the structures used they should \nbe able to predict which word is needed. It is important \nto point out to students that in IELTS as a whole they \nmay come across topics they are not familiar with, but \nthe tasks will be structured in a way that they can use \nthe knowledge that they already have to complete them \nsuccessfully. \nTell students to look at the table of notes and ask them to \npredict answers \n1-5, using the words from the box. Students may not exactly\nget the right answers, but at least they will have an idea of\nthe kind of words they are listening out for.\nI \nAlternative \nYou may wish to write the     46: `Dr Lethbridge: \nSo, let me summarise the differences \nand similarities between each business \nstructure. On the one hand, it's fairly \nsimple and inexpensive to set up as a \nsole trader. You don't have to worry \nabout lots of administration and financial \norganisation, and you can keep total \ncontrol of your business and decision­\nmaking. On the other hand, you may end \nup paying more in tax than you would as \na limited company, you are personally \nresponsible for your debts and losses and \nit might be more difficult to get valuable \ncontracts if your business does not have \nlimited liability. \nWith regard to partnerships, there are \ntwo kinds: simple partnerships and \nLLPs. In comparison with sole traders, •\n\npartnerships have the benefit of more \npeople to plan and make decisions. It's \neasier to take care of the business when \none partner is not able to take an active \npart, and it can also be easier to borrow \nmoney than for a sole trader. On the \nnegative side, liability is shared among \nthe partners and having more than one \nowner can make things more complicated \nwhen there are disagreements, or if the \nbusiness needs to be brought to a close. \nOne other difference between sole traders \nand partnerships is that the partners need \nto trust each other. If a partnership has \nserious money problems, one partner \nmay leave the other to deal with the \ndebts. Clearly this is not a problem for \nsole traders. One similarity between \npartnerships and sole traders, though, \nis to do with tax. The sole trader must \nsubmit a yearly income tax assessment \nto the tax office. The same is true of \npartnerships, as members are treated \nindividually for this purpose. \nWhen we compare simple partnerships \nwith LLPs, we can find various \ndifferences. For example, LLPs are legally \nrequired to submit their accounts and \nannual returns to Companies House. \nThis is not something that is required \nfor simple partnerships. Another \ndifference is to do with debt. In an LLP, \nthe partners' personal possessions and \nproperty are protected. In a simple \npartnership, however, like sole traders, \nthe members are personally responsible \nfor any business debts. \nFinally, limited liability companies \nhave two main advantages over simple \npartnerships and sole traders: this type \nof structure limits the financial liabilities \nof the owners to business losses and not \npersonal losses, and it can save money, \nas corporation tax is generally lower than \nincome tax. On the other hand, there \nare a lot more administrative and legal \nrequirements. Company accounts and an \nannual return must be sent to Companies \nHouse. Similarly, there is a legal \nrequirement to keep company records at \nthe registered address. \n1 the other hand \n3 the same is true \n2 the negative side \n4 however \n5 Similarly \nEXAM SKILLS \nDraw students' attention to Tip 6, reminding students that \nspelling accuracy is very important and they could lose marks if \nanswers are spelt incorrectly. \n• \nI \nAlternative \nYou could ask students to predict the answers before \nplaying the recording. You would then be able to \nassess whether they were approaching the task in \nthe correct way.`,
    47: `Dr Korpis: \nTo conclude this lecture, I'd like to present \nthree case studies to show the different \nstructures in action. I'll present each \ncase, briefly discuss the possibilities and \nrecommend the most suitable structure. \nFirst, there's the case of Sanjay and Tanya, \na couple who want to set up a catering \nservice delivering food to businesses. The \nidea is to take orders from businesses on \na daily basis and prepare food for delivery \nduring the business day. They aim to target \nbusinesses in their local area to begin with, \nand then further afield as they expand. Their \nplans include a website to display their daily \ninternational menus and to provide an online \nservice for customers to order and check \nwhen the food will be delivered. Clearly, it's \nnot suitable to be sole traders, but they could \norganise themselves as a partnership or a \nlimited company. It depends partly on how \nmuch money they can raise and how many \npeople they intend to employ to prepare \nand deliver the orders. It might be best for \nthem to start as an LLP, so that they can \nget funding more easily than if they were a \nsimple partnership. They could start small \nand build from there. They could hand out \ncontracts to other companies for some of \ntheir services, particularly for the website \nand delivery, if they intend to prepare the \nfood themselves. Alternatively, they could \nset up a limited liability company if they \nexpect to grow quickly and want to keep \nevery aspect of their business in-house, \nemploying staff directly. However, I would \nsay the LLP model would work better here -\ngiving them more time to focus on growing \nthe business, rather than dealing with a lot of \nadministration from the start. \nMelissa and Jane have an idea for a \nwebsite design service. They both studied \nsoftware engineering at university and so \nthey are both well-skilled in their field. \nThey have both worked as designers for \nmajor organisations, so they have a good \nunderstanding of what's involved in running \nsuch a business. Melissa has also taken a \nMaster's degree in Business Administration, \nso she's confident about her skills as a \nbusinesswoman. They've managed to save \nover £3,000 to rent office space and \n£10,000 to buy equipment to run their \nbusiness. The best option for them would \n\nbe to register a limited company and start \ntrading straight away as they have a good \nlevel of knowledge and experience which \nwill benefit them. They don't intend to \nemploy anyone immediately, but the option \nis there if they need to in the future. An \nalternative would be for them to start as a \nsimple partnership and expand from there, \nseeing how their work grows and then maybe \nsetting up a limited liability company in the \nfuture (or they could make their partnership \na limited one). But if they have confidence \nin themselves, there's nothing to stop them \nsetting up a limited company immediately. \nBarry is a motorbike enthusiast with many \nyears of experience riding bikes. He's been \nworking for a courier company delivering \nletters and parcels for over five years now \nand thinks that he'd do better if he worked \nfor himself. The courier company provided \nhim with his work bike and took care of \nmaintenance and repairs, so if he works for \nhimself, he'll have to buy his own bike for \nwork and take care of it himself. This isn't \na problem for him as he has three bikes for \nhis own use already. He knows that he can \nbuild up regular clients from his contacts, \nbut he's not sure if working as a sole trader \nis the best thing for him, as he's never been \nself-employed before. Another possibility \nwould be to set up a limited company with \na family member. This person wouldn't take \nan active part in the business - they would \nbe known as a 'sleeping partner'. Finally, he \ncould also choose to work in a partnership \nwith other riders who are thinking of leaving \nthe company, but he's not sure if that \narrangement would last. On balance, the \nbest option for him would be to start off as \na sole trader with his own work bike and do \nthat for a year or two to see how well it went, \nand then make a decision about whether to \nset up a limited company in the future. \n1 food, businesses \n2 limited (liability) \n3 £10,000, equipment \n4 knowledge, experience \n5 three I 3 (motor)bikes I own (motor)bikes \n6 sleeping partner \nAfter the exam have students listen to the recording again \nwhile reading the tapescript. Have them spend time \nanalysing the text in pairs and then share their ideas with \nthe class. Do students note any particular techniques used \nby the examiner, which will help them to do other listening \nactivities more successfully? \nSPEAKING \nOUTCOMES \n•\nspeak in detail about business and work for Speaking\nPart 2\n•\nexpress your wishes and intentions in a variety of ways\n•\nexpand your answer to a Speaking Part 2 task using\nsubordinate clauses\n•\nuse contractions when speaking to sound more natural.\nOUTCOMES \nDraw students' attention to the outcomes of this unit, which \nfocus on Part 2 of the speaking exam. In Part 2, students are \ngiven a task card and asked to speak for two minutes. Using the \ntopic of business and work, students practise this task type and \nare given ways to expand their answer, in order to ensure they \nspeak for the full amount of time. \nThis unit also equips students with a variety of expressions \nthey can use to describe their wishes and intentions, which is a \nfrequent requirement of the exam. \nThe third outcome, gives students practice with subordinate \nclauses. Students will need a good understanding of these, in \norder to expand on some of their points in Part 2. Try to elicit or \nfeed examples of subordinate clauses. \nDefinition \nSubordinate clause: in grammar a clause that cannot form a \nseparate sentence but adds information to the main clause. \nI would to read four descriptions \nof jobs and they need to match each posting with a \njob title. \nAlternative \nWith a weaker class, ask them to underline the key \nvocabulary in each posting and elicit the meaning of \nany unknown words. Tell students to match the posting \nto the job. \n1 b \n2 d \n3 a \n4 c \n04 Many students will need support in completing the table. \nIt might be helpful to complete the table for the first job \nwith the whole class. Have students brainstorm and collate \ntheir ideas on the board. Then have students complete the \nrest of the task in pairs or small groups. \nFinally ask students to discuss whether they would like to \ndo each job. Check which is the most/least popular job. \nSample answers \nJob \nQualifications I \nResponsibilities \nPay I \nBenefits \nct:aaractercistics \n,Salary I \n(e.g. \nneeded \nWage \npromotion, \nretirement) \nModel \nTall, good-\n. Showing off \nApprox \nFree clothes, \nlooking \nclothes, having \n$50,000 \nearly \n. pktures taJKn \nper year \nretirement \nPolitician \nGood talker, \nSpending public \n$100,000 \nFree \ntrustworthy \nm(l)ney, voting orJ \n{?er year \napartment \n. SQCia/ issues\nplus \nand transport \nexpenses \nReporter \nGood memory; \nLooking fqr \n$500 per · Free camera, \nfast typing skills \nbreaking news \nstory \neasy access to \nstories and \npublic figures \nreporting on,them \n• \nSailor \nStrong .stomach, \ncalmness in \nstormy waters \nNavigation of the \nship, ensuring \nsafety of goods \non board \n$50, 000 \nper year \nGood travel \nopportunities \nOS Exercises 05 & 06 give students examples of the kind of task \ncards they may encounter in Part 2 of the exam. They also \ngive some useful advice and practice on how students can \nexpand on each point.Tell students to read and answer in \npairs the first task card, relating to the topic of jobs. Students \nhave two minutes to speak about the task, one student \nshould keep time, whilst the other speaks, and then change \nrol
