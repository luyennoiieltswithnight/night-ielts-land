    73: `Dr Reynolds: \nDr Saunders: \nDr Reynolds: \nDr Saunders: \nHello Dr Saunders. I just want to tell you \nabout the suggestions that Lawrence and \nSangita made during our discussion and see \nwhat you think. \nThanks, yes. Please do. \nFirst of all, regarding the music, they think \nthat it might be a good idea to have a good \nlocal band who can replace the main act if it \nhas to let us down at the last minute, which \nis what happened this year. The band could \nbe scheduled for later in the week on the \nunderstanding that they might have to play \non an earlier night. We could also have one \nevening with a student band. \nWell, it sounds good in theory to plan a \nrearrangement, but I think it would be too \ncomplicated to arrange. We would depend \ntoo much on all the bands being able to play \non any of the nights. I think it's simpler just \nto give the audience a refund if it happens \nagain. But I'm happy to have one evening \nsupporting local bands and student bands, \nas that's the main point of the festival - to \nencourage people to take part. \nDr Reynolds: \nThe next thing is the crafts. They felt that \na fashion show would be a good way of \nexpanding the clothes exhibition, and that \nperhaps we should reduce or even get rid of \nthe glass and pottery exhibition. \nDr Saunders: \nWell, first of all, I think that the fashion \nshow is a good idea as it can help the \ninternational students to get involved in \nmore activities and develop their ideas with \nclothes. But I'm not keen to get rid of the \nglass and pottery exhibitions completely, as \nit's important for the university to be seen \nto encourage all forms of art and not just \nthe most popular ones, so we should keep \nthat for the time being. \nDr Reynolds: \nOK ... now ... regarding theatre and poetry, \nthey felt that it would be good for students \nto write and perform their own plays \nand poetry, as well as those by famous \nplaywrights and poets. \nDr Saunders: That sounds like an excellent idea! It'd \nhelp a lot to raise standards in writing and \nperformance. I'd love to see that taking \nplace. \nDr Reynolds: \nAlso on that topic, there was a feeling \nthat works in other languages should be \nencouraged. \nDr Saunders: \nMost certainly. That would help the \ninternational students feel far more at home \nand valued as part of the university. \nDr Reynolds: \nThere was one other event we discussed, \nand that was photography. It was felt that \nwe should have both digital and non-digital \nexhibits. \nDr Saunders: \nI don't think we could manage that, at \nleast not yet. Quality tablets and screens \nwould be too expensive, especially with \nthe number we'd have to buy, so it's not \nan option for next year because of the \nhigh cost. \nDr Reynolds: OK ... as for the accommodation and the \ncatering, they felt that we could use the \nholiday park that's being built nearby, \nand we should encourage students \nto take a greater part in cooking and \nhelping with the catering. \nDr Saunders: \nWell, first, I know for a fact that the new \nholiday park is not likely to be completed \nby festival time next year as they've run \ninto trouble with the building, but we could \ncertainly think about it in the future. I do like \nthe idea of the students having a greater role \nin the catering and cooking, as it will clearly \nbe helpful for their all-round development. \n\nDr Reynolds: \nOK. The next thing is the professional \norganisers. They felt that the standard was \nquite low and that the volunteers didn't \nexperience good leadership from them. \nThey think it would be better to ask former \nstudents to work as organisers, as they'd be \nmore familiar with the university and more \ncommitted, too. \nDr Saunders: \nI appreciate that, but unfortunately that \nwouldn't work. It'd be too much trouble \ntrying to find them and get them employed. \nHowever, I think we should review the \norganisers that we used this year and have \na much better selection system in place for \nthe next festival. \nDr Reynolds: \nNow the last two points are about security \nand finance. As far as security goes, they \nthink we should do more to encourage the \nstudents to take it seriously. \nDr Saunders: \nI agree. If we can encourage students to \nbe more aware of security, not just during \nthe festival, it'd really help to increase trust \namong all our students because they'll be \nlooking out for each other. \nDr Reynolds: \nAs for finance, they thought that, first, we \ncould encourage students to help raise \nmoney throughout the year, and, secondly, \nwe could encourage businesses to sponsor \nthe events and advertise more, though it \nneeds to be handled with care. \nDr Saunders: \nWell, regarding sponsorship and \nadvertising, the committee is already \nlooking at the possibilities as it will \nencourage more interest in the activities \nthat we do and also help our reputation \ngenerally. Unfortunately, I don't think \nasking the students to raise more money \nduring the year is a good idea as we already \nhave a programme in place for that and, if \nthe students are involved any more, they'll \nspend less time on their studies and I don't \nwant anything to disrupt those. \n1 forms I types I kinds \n2 standards \n3 high cost \n4 development \n5 trust \n6 studies I studying I (academic) work I course(s) \nSPEAKING \nOUTCOMES \n•\nspeak in detail about celebrations and special events\n•\nmake comparisons between the past and the present, or\nbetween similarities and differences\n•\nuse words and phrases that show 'concession' to look at\nboth sides of an argument\n•\nstress key words to comparisons .\n• \nOUTCOMES \nThis unit teaches students how to speak in detail about \ncelebrations and special events which is a topic, which could \narise in any part of the Speaking exam. \nOutcomes 2,3 & 4 focus on Part 3 of the exam in which students \nmay be asked to make comparisons or present both sides of an \nargument. \nLEAD-IN \n01 In all parts of the speaking exam, students could be asked \nto describe or answer questions on festivals and traditions, \nparticularly relating to their own country. \nIn order to prepare students for this, Exercise 01 ask them to \ndiscuss typical exam type questions .. \nTell students to discuss questions 1-4 in pairs. \nExtension \nAsk students to think of other questions, related to this \ntopic. \nE.g. How did you celebrate your last birthday? What is your\nfavourite celebration and why? Do you know people who\ndon't like celebrating? Why? Why not?\nYou could then write all the questions on the board and \nask students to practise answering them. For variety, tell \nstudents to swap partners or present this as a whole class \nmingling activity. \nThis section of the lesson discusses Part 3 of the exam, \nwhen students could be asked to compare the importance \nof a topic in the past and present. Tell students to read \nan example of this in the information box. As also stated \nhere, it is important that students discuss both sides of the \nargument in their answer. Exercise 02 focuses on this aspect \nof the task. \n02 Tell students to complete Exercise 02 by completing \neach of the statements. If needed, complete the first \nas a whole class. \nSample answer \nCelebrations were important in the past beeause \na people were usually all together as aefr"amily. \nb celebrations were not always about money. \nCelebrations are important now because \na we spend a lot of money on them. \nb it is harder for families to get together all the time. \nCelebrations were not important in the past because \na people had to work longer hours and had less time \nto celebrate. \nb people had less money to spend on celebrating. \nCelebrations are not important now because \na some smaller celebrations are no longer celebrated. \nb the focus is only on money and not the meaning of \nthe event. \n\n03 Tell students to complete Exercise 03 and draw their \nattention to Tip 3, stating that their answers should be detailed \nand include a range of tenses. \nSample answers in bold. \n1 Well, on the one hand, we still spend a lot of money \nevery year on celebrations - and it seems like we spend \nmore every year! On the other hand, it could be that \nsome of the smaller public holidays and events are \nbecoming less important as everyone is too focused \non the bigger ones. I also think that in the past \ncelebrations were more important because they were \nless about money and more about the meaning behind \nthe event. \n2 I think celebrations are more important now than they \nwere in the past. Because people work longer hours \nand sometimes live far from where they grew up, it \nis hard for families to get together all the time. While \ncelebrations were also important in the past because \nwe were all together as a family, I think that they are \neven more meaningful now as we cannot take meeting \nour loved ones for granted. \n04 This exercise explains to students that another useful way of \nmaking comparisons is using, "would." Write the following \nexamples on the board. \nIn the past, people would spend less money on birthdays \nand Christmas. \nIn the past, people used to spend less money on birthdays \nand Christmas. \nIn these examples both would and used to are used to \ndescribe past habits. \nAsk students if they can think of other examples related \nto festivals and celebrations. Collate good ideas on \nthe board. \nOS As mentioned in Exercise 02, it is important that students \nconsider both sides of the argument, when presented with \nthis type of question. Exercise 05 gives students some key \nvocabulary which can be used to express different points of \nview. \nDraw students' attention to the information box, which \ngives some examples of this type of phrase: although, even \nthough, while etc.. \nTell students to complete Exercise 05 and draw their \nattention to Tip 5, providing further similar expressions. \n06 Another aspect students could be asked to discuss, is talking \nabout similarities and differences. Exercises 06, 07 and 08 \npractise this idea of making comparisons. \n08 Tell students to look at the adjectives in the box. Adjectives \nare key when comparing and contrasting, so it is important \nthey have a good knowledge of these. \nElicit the meaning of any unknown words. \nDraw students' attention to Tip 8, stating the difference \nbetween compare and contrast. This is important for \nstudents to understand as they could be asked to do \neither or both in the exam. Try to elicit or feed examples of \ncomparing and contrasting and collate them on the board. \n09 This exercise focuses on word stress in order to emphasise \ndifference when speaking. \nTell students to listen to the sentences and underline the \nwords which the speakers stress.`,
    74: `1 I prefer spending time with my family on my birthday \nrather than spending time with them at New Vear. \n2 This holiday is much more exciting than that holiday. \n3 These ideas might be better for a celebration than \nthose ideas. \n4 Some people don't enjoy public holidays as much as \nother people I know. \n10 Tell students to complete Exercise 10 individually and then \nwork togethTr in pairs to practise stressing key words. Go \nround and monitor and support. Write up good examples on \nthe board, if appropriate. \nEXAM SKILLS \n11-12 This sample exam task gives students practice in all parts\nof the exam. \nTell students to complete Exercises 11 & 12 in pairs. \n13 Exercise 13 provides students with an example of how Part 3 \ncould be answered in this case.`,
    75: `Examiner: \nWhat is the difference between how people \ncelebrate special events today compared with \nthe past? \nStudent: \nWell, I think that in the past people would \nspend a long time preparing food or going \nshopping for presents, but now people tend to \neat out and order their presents online. While \nthis might seem more convenient, perhaps \nmaking an effort is part of what makes the \nfestivals so important. I think we're losing \nthat now. \nExaminer: \nShould we learn about the special events of \nother countries in school? \nStudent: \nI certainly think we should find out as much \nas possible about how people in other \ncountries live. However, I'm not sure we need \nto introduce all international festivals into our \ncalendar, as people might think less of our own \nimportant festivals and culture. \n•\n\nExaminer: \nWhat will special events be like in the future? \nStudent: \nI think as people are getting busier, fewer \nevents will continue to be celebrated, as \npeople just don't have the time to celebrate \nall of them. On the other hand, we might also \nsee an increase in online-only events, where \nfamily members don't travel to their parents' \nhouse but instead wish them Happy New \nYear or something over webchat software. \nThat way, although people might live far \naway from each other, they can still celebrate \nover video chat. \nExaminer: \nDo we spend too much money on special \nevents like Valentine's Day or birthdays? \nStudent: \nI'm not so sure about that. I think we've \nalways spent lots of money on those things, \nalthough obviously some people do like to \nspend more than others. Anyway, I don't \nthink it's the money, but the thought \nthat counts. \nTell students to practise the same questions \nin pairs. \nI\nAlternative \nAfter the listening, students could discuss why they thought \nthe candidate did well. \n•\n\nIELTS Band Score \nMINDSET for IELTS \nTarget Band Score \n7.5 \nLevel 3 \n7.5 \n.................. .................. \n6.5 \nLevel 2 \n6.5 \n.... .,, ...................\n5.5 \nlevel 1 \n5.5 \n4i \n.................. \nFoundation \nThe Cambridge English Corpus is a @\nmultr-billion word collection of written \n• \nand spoken English. It includes the \nCambridge Learner Corpus, a unique \nbank of exam candidate papers. \nOur authors study the Corpus to see how English is \nreally used, and to identify typical learner mistakes. \nThis means that Cambridge materials help students to \navoid mistakes, and you can be confident the language \ntaught is useful, natural and fully up to date. \nwww.cambridge.org/corpus`
        };
        
        const TOTAL_TRACKS = 75;
        const tracks = Array.from({ length: TOTAL_TRACKS }, (_, i) => {
            const trackId = i + 1;
            const numStr = String(trackId).padStart(2, '0');
            return {
                id: trackId,
                title: `Mindset 2 - Track ${numStr}`,
                url: `${BASE_URL}Mindset_L2_${numStr}.mp3`,
                transcript: TRANSCRIPT_DATA[trackId] || "Hệ thống đang tiếp tục được cập nhật Tapescript cho bài này. Xin vui lòng quay lại sau."
            };
        });

        // ==========================================
        // COMPONENT: WaveAudioPlayer
        // ==========================================
        const WaveAudioPlayer = ({ track, onNext, onPrev }) => {
            const waveformRef = useRef(null);
            const wavesurfer = useRef(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isReady, setIsReady] = useState(false);
            const [speed, setSpeed] = useState(1);
            const [currentTime, setCurrentTime] = useState('0:00');
            const [duration, setDuration] = useState('0:00');
            const [zoom, setZoom] = useState(50);
            
            // TRẠNG THÁI HIỂN THỊ TRANSCRIPT
            const [showTranscript, setShowTranscript] = useState(false);

            const speeds = [0.5, 0.75, 1, 1.25, 1.5];

            const formatTime = (seconds) => {
                if (isNaN(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            useEffect(() => {
                if (!waveformRef.current || !track) return;

                setIsReady(false);
                setIsPlaying(false);
                setCurrentTime('0:00');
                
                setShowTranscript(false); // Đóng transcript khi chuyển bài

                if (wavesurfer.current) {
                    wavesurfer.current.destroy();
                }

                wavesurfer.current = WaveSurfer.create({
                    container: waveformRef.current,
                    waveColor: '#c7d2fe',
                    progressColor: '#6366f1',
                    cursorColor: '#312e81',
                    barWidth: 3,
                    barGap: 2,
                    barRadius: 3,
                    height: 60,
                    normalize: true,
                    backend: 'MediaElement',
                    url: track.url,
                    minPxPerSec: zoom,
                    hideScrollbar: false
                });

                wavesurfer.current.on('ready', () => {
                    setIsReady(true);
                    setDuration(formatTime(wavesurfer.current.getDuration()));
                    wavesurfer.current.play();
                    wavesurfer.current.setPlaybackRate(speed);
                });

                wavesurfer.current.on('play', () => setIsPlaying(true));
                wavesurfer.current.on('pause', () => setIsPlaying(false));
                wavesurfer.current.on('finish', () => {
                    setIsPlaying(false);
                    if(onNext) onNext();
                });
                
                wavesurfer.current.on('audioprocess', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });
                
                wavesurfer.current.on('seek', () => {
                    setCurrentTime(formatTime(wavesurfer.current.getCurrentTime()));
                });

                const container = waveformRef.current;
                const handleWheel = (e) => {
                    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 0) {
                        e.preventDefault();
                        const zoomDelta = e.deltaY < 0 ? 10 : -10;
                        setZoom(prev => {
                            const newZoom = Math.max(10, Math.min(prev + zoomDelta, 300));
                            if (wavesurfer.current) wavesurfer.current.zoom(newZoom);
                            return newZoom;
                        });
                    }
                };
                container.addEventListener('wheel', handleWheel, { passive: false });

                return () => {
                    container.removeEventListener('wheel', handleWheel);
                    if (wavesurfer.current) {
                        wavesurfer.current.destroy();
                    }
                };
            }, [track]);

            const togglePlay = () => {
                if (wavesurfer.current && isReady) {
                    wavesurfer.current.playPause();
                }
            };

            const skip = (amount) => {
                if (wavesurfer.current && isReady) {
                    wavesurfer.current.skip(amount);
                }
            };

            const changeSpeed = () => {
                if (wavesurfer.current) {
                    const nextIndex = (speeds.indexOf(speed) + 1) % speeds.length;
                    const newSpeed = speeds[nextIndex];
                    setSpeed(newSpeed);
                    wavesurfer.current.setPlaybackRate(newSpeed);
                }
            };

            const handleZoomSlider = (e) => {
                const val = Number(e.target.value);
                setZoom(val);
                if (wavesurfer.current) wavesurfer.current.zoom(val);
            };

            if (!track) return null;

            return (
                <div className="fixed bottom-0 left-0 w-full z-50 p-4 pb-6 md:pb-8 flex flex-col items-center pointer-events-none">
                    <div className="w-full max-w-4xl pointer-events-auto">
                        
                        {/* PANEL TRANSCRIPT (ẨN/HIỆN) */}
                        <div className={`transition-all duration-300 ease-in-out origin-bottom ${showTranscript ? 'opacity-100 translate-y-0 mb-4 scale-100' : 'opacity-0 translate-y-10 h-0 scale-95 overflow-hidden'}`}>
                            <div className="glass-panel rounded-3xl p-5 shadow-floating border border-white/50 bg-white/95">
                                <div className="flex justify-between items-center mb-3 border-b border-indigo-100 pb-2">
                                    <h3 className="font-bold text-indigo-900"><i className="fas fa-file-alt mr-2"></i>Tapescript</h3>
                                    <button onClick={() => setShowTranscript(false)} className="text-slate-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="transcript-scroll max-h-[40vh] overflow-y-auto pr-3 text-slate-700 leading-relaxed text-sm md:text-base font-medium whitespace-pre-wrap">
                                    {track.transcript}
                                </div>
                            </div>
                        </div>

                        {/* PLAYER CHÍNH */}
                        <div className="glass-panel rounded-3xl p-4 md:p-6 shadow-premium border-t border-white/40 animate-fade-in-up">
                            {/* Header */}
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-2 px-2 gap-2">
                                <div className="font-bold text-indigo-900 text-lg flex items-center">
                                    <i className="fas fa-headphones-alt mr-3 text-indigo-500"></i>
                                    {track.title}
                                </div>
                                
                                <div className="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                                    {/* Nút bật tắt Transcript */}
                                    <button 
                                        onClick={() => setShowTranscript(!showTranscript)}
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${showTranscript ? 'bg-indigo-600 text-white shadow-md' : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100'}`}
                                    >
                                        <i className={`fas ${showTranscript ? 'fa-eye-slash' : 'fa-book-open'}`}></i>
                                        {showTranscript ? 'Ẩn Transcript' : 'Đọc Transcript'}
                                    </button>

                                    {/* Zoom Slider */}
                                    <div className="hidden md:flex items-center gap-2" title="Kéo để dãn sóng âm">
                                        <i className="fas fa-search-minus text-[10px] text-slate-400"></i>
                                        <input 
                                            type="range" min="10" max="250" value={zoom}
                                            onChange={handleZoomSlider}
                                            className="w-24 h-1 bg-indigo-100 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                                        />
                                        <i className="fas fa-search-plus text-[10px] text-slate-400"></i>
                                    </div>
                                    
                                    <div className="text-sm font-semibold text-slate-500 font-mono min-w-[90px] text-right">
                                        {isReady ? `${currentTime} / ${duration}` : 'Loading...'}
                                    </div>
                                </div>
                            </div>

                            {/* Sóng âm */}
                            <div className="relative w-full h-[60px] mb-4 bg-slate-50/50 rounded-xl cursor-pointer" title="Dùng 2 ngón tay vuốt lên/xuống để Zoom">
                                {!isReady && (
                                    <div className="absolute inset-0 flex items-center justify-center text-indigo-400 font-medium text-sm animate-pulse z-10 bg-slate-50/80 rounded-xl">
                                        <i className="fas fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu sóng âm...
                                    </div>
                                )}
                                <div ref={waveformRef} className="w-full h-full rounded-xl"></div>
                            </div>

                            {/* Thanh công cụ */}
                            <div className="flex items-center justify-between gap-4">
                                <div className="flex items-center gap-2">
                                    <button onClick={onPrev} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center">
                                        <i className="fas fa-step-backward"></i>
                                    </button>
                                    <button onClick={changeSpeed} className="hidden md:flex px-3 h-10 items-center justify-center rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm transition min-w-[3.5rem]" title="Tốc độ đọc">
                                        {speed}x
                                    </button>
                                </div>

                                <div className="flex items-center gap-3 md:gap-5">
                                    <button onClick={() => skip(-5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Lùi 5 giây">
                                        <i className="fas fa-undo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                    
                                    <button onClick={togglePlay} disabled={!isReady} className={`w-16 h-16 flex items-center justify-center rounded-full shadow-premium transition transform hover:scale-105 ${isReady ? 'bg-primary hover:bg-primaryHover text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>
                                        <i className={`fas text-2xl ${isPlaying ? 'fa-pause' : 'fa-play pl-1'}`}></i>
                                    </button>
                                    
                                    <button onClick={() => skip(5)} className="w-12 h-12 flex flex-col items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 transition text-slate-600 shadow-sm" title="Tiến 5 giây">
                                        <i className="fas fa-redo-alt text-sm mb-0.5"></i>
                                        <span className="text-[9px] font-black tracking-tighter">5s</span>
                                    </button>
                                </div>

                                <div className="flex items-center gap-2">
                                    <button onClick={changeSpeed} className="md:hidden px-3 h-10 flex items-center justify-center rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold text-sm transition min-w-[3.5rem]" title="Tốc độ đọc">
                                        {speed}x
                                    </button>
                                    <button onClick={onNext} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 transition flex items-center justify-center">
                                        <i className="fas fa-step-forward"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        const App = () => {
            const [currentTrackIndex, setCurrentTrackIndex] = useState(null);
            
            const handlePlayTrack = (index) => {
                setCurrentTrackIndex(index);
            };

            const playNext = () => {
                if (currentTrackIndex !== null && currentTrackIndex < tracks.length - 1) {
                    setCurrentTrackIndex(currentTrackIndex + 1);
                }
            };

            const playPrev = () => {
                if (currentTrackIndex !== null && currentTrackIndex > 0) {
                    setCurrentTrackIndex(currentTrackIndex - 1);
                }
            };

            return (
                <div className={`flex-grow transition-all duration-300 ${currentTrackIndex !== null ? 'pb-80 md:pb-96' : 'pb-20'}`}>
                    <header className="pt-16 pb-12 px-4 text-center">
                        <div className="max-w-3xl mx-auto">
                            <div className="inline-block px-5 py-2 bg-white/10 text-white font-bold rounded-full text-sm mb-4 tracking-wider uppercase border border-white/20 backdrop-blur-md shadow-sm">
                                TÍCH HỢP TRANSCRIPT
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight drop-shadow-lg">
                                Sách Mindset 2
                            </h1>
                            <p className="text-slate-300 font-medium text-lg drop-shadow">Hệ thống phân tích sóng âm & Đối chiếu kịch bản tự động</p>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 relative z-10">
                        <div className="glass-panel rounded-3xl p-6 md:p-8 shadow-xl">
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                {tracks.map((track, index) => {
                                    const isActive = currentTrackIndex === index;
                                    const hasTranscript = track.transcript && !track.transcript.includes("Hệ thống đang tiếp tục được cập nhật");
                                    return (
                                        <button 
                                            key={track.id}
                                            onClick={() => handlePlayTrack(index)}
                                            className={`
                                                relative overflow-hidden group flex flex-col items-center justify-center p-4 rounded-2xl border transition-all duration-200 
                                                ${isActive 
                                                    ? 'bg-indigo-500 border-indigo-600 text-white shadow-lg transform scale-[1.02]' 
                                                    : 'bg-white/70 border-slate-200 text-slate-700 hover:bg-indigo-50 hover:border-indigo-300 hover:shadow-md'
                                                }
                                            `}
                                        >
                                            {isActive && (
                                                <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=')] opacity-30"></div>
                                            )}
                                            
                                            {hasTranscript && !isActive && (
                                                <div className="absolute top-2 right-2 text-indigo-400 opacity-70 group-hover:opacity-100" title="Đã có Transcript">
                                                    <i className="fas fa-book-open text-[10px]"></i>
                                                </div>
                                            )}

                                            <div className={`w-10 h-10 mb-2 rounded-full flex items-center justify-center text-lg shadow-sm transition-colors ${isActive ? 'bg-white text-indigo-600' : 'bg-slate-100 text-slate-500 group-hover:bg-indigo-100 group-hover:text-indigo-500'}`}>
                                                {isActive ? <i className="fas fa-volume-up animate-pulse"></i> : <i className="fas fa-play ml-0.5"></i>}
                                            </div>
                                            <span className="font-bold text-lg leading-none tracking-tight">Track {String(track.id).padStart(2, '0')}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {currentTrackIndex !== null && (
                        <WaveAudioPlayer 
                            track={tracks[currentTrackIndex]} 
                            onNext={playNext}
                            onPrev={playPrev}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
