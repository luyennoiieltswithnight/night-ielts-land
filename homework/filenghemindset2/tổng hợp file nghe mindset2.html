    19: `1 My favourite sport is hockey. It's amazing! \n2 I like swimming, but I wish there were more places to swim \nwhere I live. \n3 I've always liked fishing but I don't have time to do it \nanymore. \n4 I'm really excited about all the new video games that will \ncome out soon. I can't wait! \nJ \n-----.. \n \n----------\n---------\n13 2 I like swimming, but I wish there were more places to swim \nwhere IZ \nJ \n..____;, \n...--,. \n.......---.,. \n...--,. \n3 I've always liked fishing but I don't have time to do it any \nmore . \n...._.;, \n__} \n__,} \n4 I'm really excited about all the new video games that will \n__.. \ncome out soon. I can't wait! \n14 Monitor students' pair work. \n15 Exercise 15 provides students with a useful selection of \nsports verbs. Students need to learn how to use these verbs \ncorrectly in order to comfortably talk about this topic in the \nexam. Elicit the meaning of any unknown vocabulary. \nExtension \nTo ensure the correct use of these verbs you could ask students \nto create their own sentences and personalise the topic. \ne.g. When I was younger, I used to beat my brother at pool.\nHe wasn't very happy about it, because he likes to win.\nSample answers \n1 I didn't think Mayweather would [beat I defeat I lose \nto I knock out] Pacquaio in that boxing match. \n2 It has always been a dream of mine to [play I compete I\nqualify/ win I represent my country] at Wimbledon. \n3 I try to [exercise I train I compete I play] about three \ntimes a week, so that I can keep playing well. \n4 I [support/ watch] Liverpool Football Club. I've been a \nfan for a very long time. \n5 Their international football team [shoot I tackle] plenty \nof times during a game but usually [score] very few goals. \nEXAM SKILLS \n16-17 Tell students they will now complete a practice exam\ntask in pairs. Exercise 16, gives an example of Part 1 and \nexercise 17 gives students an example of Part 2. \nThe tasks will be timed and for part 2 (exl 7) they will \nhave one minute to prepare notes, before speaking for \ntwo minutes. One student will speak, whilst the other \nkeeps time and listens. Students will then exchange roles. \nTell students that they will be monitored on the \nfollowing: their use and range of vocabulary \ntheir ability to provide complete answers, including reasons \ntheir use and understanding of connecting words \ntheir use of sentence stress and intonation. \na clear structure, with the logical progression of ideas \nI\nExtension \nChoose a few of the student pairs to demonstrate their \nanswers to question 16 & 17 to the whole-class. \nl!I \n\nREADING \nOUTCOMES \n•\nmatch information in a question with information in\na text\n•\nskim a text to identify types of information\n•\nrecognise the passive.\nOUTCOMES \nDraw students' attention to the outcomes of the lesson, \nthe first two of which focus on the exam task of matching \ninformation in a question with information in the text. The \nsecond outcome teaches students how to locate the answer \nquickly, by skimming the text and identifying the type of \ninformation in each paragraph. Timesaving skills are very \nimportant in the reading exam, as the time limit is one of the \nmost challenging aspects for candidates. \nTell students that this unit focuses on The News & Media, a \nsubject, which may arise in any part of the exam. Elicit sources of \nnews and media and ask students how they consume the news \n(e.g television, radio, newspapers, ipads, smartphones etc..) \nLEAD-IN \n01 Tell students to read the quotes in Exercise 01, expressing \ndifferent opinions on how the news is consumed. Elicit the \nmeaning of any unknown words. \n02 Tell students to match statements 1-4 with quotes A-D. \nDraw students' attention to Tip 2, stating that this type \nof task may feature in the exam. The texts will be much \nlonger however and they will need to match a question to a \nparagraph. The statements will paraphrase the meaning of \nthe information in the text. \nDefinition \nParaphrase: to express something that has been said or written \nin a different way, usually so that it is clearer \nI \nAlternative \nWith a weaker class you could ask students to first underline \nthe key words in the statements 1-4 and then ask them to \nmatch these words to parts of the text. \ne.g continual exposure- 24hrs a day, 7 days a week\n03 Tell students to complete this exercise, by discussing \nwhether they agree/disagree with the quotes in Exercise 01. \nMake sure they also give reasons for their answers. Monitor \nstudents and ask some of the stronger pairs to demonstrate \ntheir discussion . \n• \nI \nExtension \nStudents could also discuss whether or not these quotes \nreflect the opinions of the people they know, in these \nparticular age groups. \n04 In this exercise students are going to practise matching \ninformation in the question with information in a paragraph; \na task, which features in the exam. \n05 Tell students to skim the text to understand the general \nmeaning of each paragraph and then complete Exercise 05. \nElicit the meaning of skimming and how this can be achieved. \nSample answer \nto read the text quickly for the general idea, by focussing \nmainly on key words. \nMake sure that they read the instructions carefully, which \nstate that they can write any letter more than once. \n06 This exercise gives students some important information, \nwhich they must remember about this task type. Students \nneed to consider their answers to Exercise 05 and then \ndecide if each statement is True or False. \n4. T\nI \nAdvice \nIt is important that students remember these points, \nparticularly statement 1, as this is one of the few tasks where \nthe answers do not follow in the same order as the text. If \nstudents do not remember this, they may struggle in the exam. \n07 This exercise focuses on the importance of synonyms in this \ntask type. Like many of the reading exercises, the words \nin the question are rarely the same as those in the text. \nAn understanding of this is key to being successful in the \nreading exam. \nTell students to complete the table in this exercise with the \nmissing words/ phrases from either the text in Exercise 04 or \nquestion in Exercise 05. If appropriate, complete gap 1 as a \nwhole class. \n1 the most popular way \n2 66% \n3 several methods \n4 25% \n5 survey \n6 on a weekly basis \nI \nAdvice \nWhen recording new vocabulary, tell students to form the \nhabit of also making a note of synonyms. An awareness \nand knowledge of synonyms will help them greatly in the \nreading exam, as they are a feature in the majority of tasks. \n\nExtension \nDictate/give the following news report to students and ask \nthem to change some of the words by using synonyms. \nA homeowner was arrested on suspicion of assaulting \na burglar in his house . \nTom Watson, 45, was held in jail for around 12 hours, accused \nof attacking Peter Knight, 21. The burglar was found with \nsevere head injuries following his attempt to rob four homes \non the same street. \n1 the most popular way \n2 66% \n3 several methods \n4 25% \n5 survey \n6 on a weekly basis \nWith a weaker class, you could write the synonyms on the \nboard, for them to choose from. \n08 Draw students' attention to the information box, stating that \none way of saving time in the matching information task is \nto identify the type of information in each paragraph. Once \nthe purpose of the paragraph is identified, it can then be \nmatched to the statement with the same/similar purpose. \nMake sure students are familiar with all of these categories. \n09 \nExercises 08 & 09, practise this idea of labelling the type of \ninformation featured in each paragraph. Complete question \n1 as a whole class. Elicit from students which words helped \nthem choose the type? \ne.g. left shocked- reaction \n1 reaction \n4 summary \n2 opinion \n3 cause and effect \n6 account \n5 description \nB reason/ factual \nC cause and effect \nD problems / factual \nE opinion \nF summary \nGRAMMAR FOCUS: THE PASSIVE \n10 \nExercises 10 to 13 focus on the use of the passive. The \npassive is used regularly in news sources to express a sense \nof formality. It is important that students recognise this \ntense in the reading, as it says a great deal about the tone of \na text. If needed, do the first question of each exercise as a \nwhole class, in order to give students an example. \n2 it was also revealed - past simple passive \n3 social networks are being used selectively - present \ncontinuous passive \n4 there has been growing concern by researchers -\npresent perfect passive \n11 \n12 \n13 \nThe passive voice is commonly used in formal writing. \nAlso in sentences 1-3, the agent is not important (e.g. in \nsentence 1 we are not interested in who uses social media \nto break news). \n2 has been delayed (present perfect) / is delayed \n(present simple) \n3 were named (past simple) \n4 is being developed \nExtension \nIf some students struggle with this task, you may want to \ndiscuss which words in these statements indicate the use of \na certain tense. \ne.g\n3 earlier this morning- past simple \n1 ... is blamed for all the wet weather. \n2 ... was found unconscious in his Manhattan apartment. \n3 ... has been recovered from a sunken Spanish ship. \n4 ... is being celebrated today. \n14 This exercise assesses how much the students have learnt \nabout this particular exam task, throughout the lesson. Tell \nstudents to complete Exercise 14. \nQuestions and instructions \n2 Synonyms \n3 No \n4 Yes \n5 No \nI \nAlternative\nThis could also be done as a short class quiz. \nEXAM SKILLS \n15 Set a time limit and tell students to complete this practice \nexam task. (suggested time limit, 7 mins) \nI \nAlternative \nWith a weaker class, ask students to firstly underline the key \nwords in the questions before attempting the task. \nWRITING \nOUTCOMES \n•\nuse time markers and the passive to describe a process\n•\nplan a description of a process\n•\ninterpret scientific and technical diagrams.\nOUTCOMES \nThis lesson relates to writing task 1, in which candidates could \nbe asked to describe a process. Draw students' attention to the \noutcomes, which all focus on completing this task type successfully . \n•\n\nOutcome 1 focuses on the use of time markers and the passive, \nessential tools for this task type. Time markers ensure that \nthe answer is logically organised and the use of the passive \nprovides the formal tone, used when describing a process. \nMake sure students understand the meaning of time markers. \nTime markers: words which help describe a sequence of \nevents e.g firstly, secondly, thirdly etc. \nThe second and third outcome focus on two aspects which \nstudents may find challenging with this task; planning their answer \nand interpreting/understanding the diagram they are given. \nLEAD-IN \n01 In order to get students used to the idea of describing a \nprocess, this first exercise shows the simple process of \nwriting a local news story. Sentences a-g give students an \nexample of how this particular process might be described. \nTell students to order the sentences, using the pictures as \na guide. \nI\nAlternative \nWith a weaker class you could discuss the pictures first and \ndescribe what they each depict, before attempting the task. \n1 e \n2 g \n3 c \n4 d \n5 a \n6 f \n7 b \nExercises 02-06 focus on the use of time markers. At this \nlevel, students are required to use a range of vocabulary to \nproduce an answer, which demonstrates a clear logical order \nand progression. For this type of task therefore, the use of \ntime markers is essential. \n02-03 Tell students to complete Exercises 02 & 03.\n02 \nFirst, Secondly, Thirdly, Next, Then, After that \n03 \nSet 3 \n04 Tell students to read the process of how a newsroom works \nand then the sample answer. Make sure students know how \nthe diagram works: e.g It starts with point 1, then follows on \nclockwise. \n05 \n06 \nDraw students' attention to Tip 4, stating that the wording in \nthe diagram should not be repeated in the answer. \ne.g How a newsroom works- diagram \nHow news stories are created- answer. Tell students to \ncomplete Exercises 05 & 06. With a weaker class answer \nthese questions as a whole class. \n1 No \n2 No \n3 Yes - although it's better to use synonyms if possible \nSample answers \n1 First/to begin with \n4 Then I After That \n2 Secondly \n5 Finally \n3 Thirdly \n07 As with any of the writing tasks, planning is an essential \npart of answering the question. Draw students' attention to \nthe information section, stating that planning will not only \nensure the answer is logical and structured, it may also help \nthem to understand the question more and choose the most \nsignificant features. \nThis exercise gives students a suggested plan for describing \na process. Tell students to read this carefully. They will need \nto remember to come up with and follow a plan like this in \nthe Writing exam. \n08 In order to practise this idea of describing a process, this \nexercise asks students to describe some of the familiar \nprocesses from the box. \nFeedback \nAs students are describing some of these familiar processes, \nmonitor their use of time markers and structure. \n09 Tell students to write a plan (like the one in Exercise 07} for \none of these processes. \nKnowledge of the passive tense is essential for this task, as \nwhen writing about a process the style must be formal. \nGRAMMAR FOCUS: THE PASSIVE \n10 Tell students to underline the use of the passive in the diagram \nin Exercise 04 and elicit which passive tense has been used. \nPresent simple passive (are assigned, are booked, are \nallocated, is reviewed are loaded ... saved); passive used \nwith a modal: can be cut \n11 Tell students to complete Exercise 11. Do the first sentence \nas a whole class. \n1 A local news story is chosen. \n2 The story is accompanied by a picture. \n3 A good first line is thought of. \n4 The main body of the article is written. \n5 The article is checked for errors. \n6 A good title is invented. \n7 The article is submitted to a local newspaper. \n12 Draw students' attention to the information box, stating \nthat although diagrams given in this task can vary, they are \noften technical or scientific. It is important that students \nare made aware of this, so they know what to expect in the \nexam. As stated in Tip 12, students are not expected to have \nany previous knowledge of the subject. The answer is purely \nbased on their interpretation of the diagram given. \nExercise 12 gives students some strategies to deal with this. \nTell students to read and order the steps. \nA 3 \nB 5 \nC 2 \nD 4 \nEXAM SKILLS \n13 Give students this timed writing task. Some useful verbs and \nphrases have been supplied here, which will help students \ndescribe this particular process. Make students aware \n\nthat this will not be the case in the actual exam. Elicit the \nmeaning of any unknown words. \nTell students that when you mark their essays you will be \nlooking for the following: \nthe use of time markers to determine a clear structure to \ntheir essay \nthe correct use of the passive \nan accurate interpretation of the process \nSample answer \nThe diagram illustrates a method called 'lithography', a \nprocess used for printing newspapers. After the image \nis transferred onto a press plate, it goes through several \nrollers before being successfully printed onto paper. \nFirst, the plate is passed through dampening rollers, \nwhich provide a mixture of water and chemicals. This is to \ndampen the non-image areas. Secondly, the plate passes \nthrough a set of ink rollers, in order for the ink to stick to \nthe image area. Thirdly, the plate then goes through the \nblanket cylinder. This is to squeeze out the water and the \ninked image area is picked up. Finally, the plate passes \nthrough the impression cylinder. The paper then runs \nbetween the impression cylinder and blanket cylinder, \npressing the image onto the paper. After that, the paper is \ndried with hot and cold air and put on the delivery pile. \nOverall,.the diagram shows that there are four sets of \nrollers used, before the image is transferred onto paper. \nLISTENING \nOUTCOMES \n•\nidentify the attitudes and opinions of speakers through\nexpressions and intonation\n•\nrecognise paraphrases off what speakers say\n•\nunderstand the role of distractors when answering\nmultiple-choice questions.\nOUTCOMES \nDraw students' attention to the outcomes of this lesson, which \nexplore three of the key skills needed for the listening exam: \nidentifying the opinions/attitudes of speakers, recognising \nparaphrasing and understanding the role of distractors. \nThe first outcome deals with how students can identify \nthe opinions/ attitudes of speakers by listening for certain \nexpressions or recognising intonation patterns. \nCheck students understand the meaning of "intonation." \nIntonation-the rise and fall of the voice when speaking. \nThis is particularly useful for students in Sections 1 and 3 of the \nlistening test, when the speakers are often trying to reach an \nagreement or make a decision. Having an understanding of the \nspeakers' opinions can help students tackle these questions c. \nThe second outcome explores paraphrasing, as this is often a \nfeature in the exam, and students must be able to understand \nit. Check students understand the meaning of paraphrasing. \nParaphrasing- to express something that has been said or \nwritten in a different way, usually so that it is clearer . \nThe third outcome focuses on the role of distractors, within \nmultiple-choice questions. Distractors will always feature in \nthis type of questions, so it is vital students understand this \nconcept and think carefully before choosing their answer. \nMake sure students understand the meaning of 'distractors.' \nDistractors- the incorrect option in multiple-choice questions. \nDesigned to distract students from choosing the correct option. \nLEAD-IN \n01 In this exercise, students need to listen for the main idea in \neach discussion. This is an important skill for students to \nacquire, as they must learn to focus on the key points and \nnot be distracted by other minor comments if they are to be \nsuccessful in the exam. \nTell students to listen to the three short discussions and choose \nfrom either A, B or C for each. Students must listen carefully \nand not choose an answer based on the first thing they hear.`,
    20: `Discussion 1 \nA: \nAll I'm saying is that if this government wins the \nelection tomorrow, I think they'll just continue with the \nsame things they've been doing over the last five years \nand make the economic situation worse in this country. \nPeople are already finding it difficult to live with prices \ngoing up and salaries staying the same. \nB: \nI don't think they'll win. People have had enough and are \nready to vote for a change. I hope they do. If the other \nparty gets in, it'll be like them winning the World Cup! \nDiscussion 2 \nA: \nYeah, I saw it last night. I think it was really good \nthe way that all the characters were actually well \ndeveloped and interacted with each other. The danger \nwith that kind of film is that the science fiction aspect \njust takes over and you get spaceships and battles with \naliens who are trying to take over the Earth. \nB: \nI'm going to see it tonight. I listened to the review \non the radio this afternoon and the critic really liked \nit, which is unusual because he doesn't usually \nrecommend big commercial projects, which just aim to \nmake as much money as possible. \nDiscussion 3 \nA: \nDid you see that report on the news tonight- the one \nabout the robot football competition? \nB: \nYeah. It was quite amazing. I mean, it wasn't like real \nfootball, but it is amazing what they can get machines \nto do with the right programming these days. I mean, \nthose robots can detect the ball as it moves around the \npitch and pass it to each other. And that winning goal \nwas like Messi scoring! \n•\n\nA: \nYeah, I can see it becoming a real money-making \nbusiness, just like the real thing! \n02 Exercises 02-06 help students to understand the attitudes \nand opinions of each speaker. Elicit from students why this \nis important for the exam (speakers are often trying to reach \na decision). \nFocus students' attention on Tip 2, which states that attitude \ncan be displayed through intonation, as well as the expressions \na speaker uses. Check students remember the meaning of \n'intonation', outlined at the beginning of the lesson. \nTell students they are going to listen to three speakers and \nthey have to identify whether the tone is positive, negative \nor neutral. \nI \nAlternative \nFor weaker students, you may need to check they understand \nthe meaning of each. In order to express this clearly, you \ncould present students with the following diagram: \nNegative \nNeutral \nPositive \n® \n@ © \nExample \nNegative- I don't like this \nNeutral- I don't mind this \nPostive- I really like this`,
    21: `Topic 1: Modern art \nSpeaker 1: \nI don't really have much of an opinion about it. \nAs far as I'm concerned, if it appeals to someone, \nthat's fine. If it doesn't, then why should anyone \ncomplain about that? Personally, I like some of it, \nbut I'm not really bothered. I can take it or leave it. \nSpeaker 2: \nWell, from what I can see, you have a lot of \npeople looking at it and talking nonsense about \nhow good it is. Then you also have people with \ntoo much money and too little sense, who are \nprepared to waste their money on this stuff. \nIt's ridiculous! There's no comparison with the \ngreat art of the past few centuries. \nSpeaker 3: \nOh, I think not enough people appreciate it. \n• \nThey look at it and think, well, my kid could \ndo that. They think that something from the \neighteenth or nineteenth century is true art and \nthey don't understand that art develops and \nchanges over time. These artists today are just \nas skilled and creative as those in the past and \nthey should be appreciated for what they do. \nTopic 2: Combating climate change \nSpeaker 1: \nIt's so important that we tackle this issue head­\non. We can't let it go on any longer without \ntaking action. All the science shows that it's \ngoing to get out of control if we fail to act. The \ngovernment should be supporting renewable \nforms of energy and we really need to reduce \nour dependence on oil and gas. I just wish \nother people could see that! \nSpeaker 2:\nThere's so much nonsense spoken about it. \nReally, I can't understand why people get so upset \nabout it. They quote all kinds of studies, but they \ndon't amount to anything real. If you ask me, the \nclimate is getting colder, at least in this country. \nLook at the amount of snow we had last winter! \nThey just want to scare people for no reason. \nSpeaker 3: \nI'm not really convinced either way, actually. I \nmean, there are arguments on both sides, but \nI think it's still too early to tell. Yes, we can see \nthat the weather in different parts of the world \nis becoming more extreme, but if you ask the \nclimate experts, they never say that it's definitely \nclimate change and just say they need more time \nto be sure. So that's where I am at the moment. \nTopic 1: Modern art \nPositive: Speaker 3\nNegative: Speaker 2\nNeutral: Speaker 1\nTopic 2: Combating climate change \nPosttive:Speakerl \nNegative: Speaker 2\nNeutral: Speaker 3\n03 Focus students' attention on the picture of space. \nExtension \nIn order to involve students in this topic before listening to \nthe recording, you could ask the following: \nWould you like to travel to space? Why/ why not? \nWhich planet would you travel to and why? \nThis could be done as a whole class activity or discussed \nin pairs. \nTell students to listen to the recording and choose \neither A,B or C.`,
    22: `Maria: \nSimon: \nMaria: \nHello Simon. \nHi Maria. \nOK. What topic do you think we should \nchoose for the project we're starting next \nweek? I think we need to make sure that it's \ngoing to last over the next few months so \nthat we can complete the project. \n\nSimon: \nWell, there are several possibilities. Have \nyou heard of the Pluto expedition? The \nspacecraft is about to arrive there and it's \ngoing to send back pictures that we've \nnever seen before. It should be really \ninteresting. \nMaria: \nThat sounds like a good idea. What do you \nthink, Dr Thornton? \nDr Thornton: \nWell, I'm not so sure about that one. I mean, \nit's already been going for ten years and I \nthink we should look at something which is \nplanned for the future, but hasn't started yet. \nIt would give you a better chance to study it \nin depth and do far more analysis for your \nmonthly update reports. \nSimon: \nI don't think that's a problem. There'll be a \nlot of coverage on the news over the next \nfew weeks. \nMaria: \nHmm ... that's true ... but we really need \nsomething to last for a few months. On second \nthoughts maybe Dr Thornton's right. Perhaps \nwe should look at something which hasn't \nstarted yet. Isn't there something I heard \nabout a new Mars expedition? I think there's \na group of people out in America somewhere \nwho are preparing for a trip to Mars. \nSimon: \nYes. It was in the news last week. They've \nbuilt a sort of camp in the desert in Arizona. \nThere are ten people living there for six \nmonths, just like they would be together on \nthe trip to Mars and after they arrive there. \nDr Thornton: \nThat'd be ideal. Six months is just right for \nyou. You could follow their progress and how \nthe project develops. From what I know, the \nPluto project is already a success, but with \nthe Mars one you can assess how successful \nit is as it progresses and you can write it up \nfor your final report. \nMaria: \nHmm ... yeah ... that sounds promising. \nSimon: \nOK, but before we decide, I'd just like to \nmention one more. I heard that the Chinese \nare planning an expedition to the moon. \nMaria: \nWhat? Another man or woman on the moon? \nThat's already been done. I don't think the \nmoon's particularly interesting these days. \nDr Thornton: \nSimon has a point. I mean, the Chinese are \ncoming up now and they've got some new \nideas. I don't think they're sending any \nastronauts. I think it's just an expedition with \nrobots and machines to find the best place to \nstart a colony. \nMaria: \nYes, but I don't think that's particularly \ninteresting. I mean, no one has ever seen \nPluto close up and no one has tried to go to \nMars, so I think they'd be more interesting \nexpeditions to do. \nSimon: \nYou have a point. Perhaps it would be better \nto focus on one of the other two. \nDr Thornton: \nOK, if you ask me, I'd prefer to see how a \ngroup of people get along living together in \na difficult situation, like they'll be doing in \nArizona in preparation for their trip. I think \nyou'd get far more out of that, but the final \ndecision is yours. What do you think? \nMaria: \nI agree. I'd prefer to go for that one. \nSimon: \nSo that's agreed then. Good. Let's make a start. \nDr Thornton: \nExcellent. I'll make a note of that. We'll meet \nagain next Wednesday and you can give me \nyour project outline. I'm looking forward to \nseeing it. \nB \n04 Tell students to listen to the recording again and complete \nthe table. Remind students to listen carefully, not to write \ndown the first thing they hear and not to be distracted by \nextra information. \nPluto \nMars \nMoon \nexpedition \nexpedition \nexpedition \nSimon \nPositive \nNeutral \nNeutral \nMaria \nPositive \nPositive \nNegative \nDr Thornton \nNegative \nPositive \nNeutral \n05 Exercises 05 & 06 focus on expressions, which may be used \nto show attitudes or opinions. Being able to recognise some \nof these expressions, may help students choose the correct \nanswer in the exam. \nTell students to listen to the recording and choose the \ncorrect option, A,B or C.`,
    23: `Conversation 1 \nA: \nIt looks like the government is going to raise taxes in \nthe budget tomorrow. \nB: \nSeriously? I really don't see how that could be a good \nidea. It'll reduce spending and affect the economy \nwithout a doubt. \nConversation 2 \nA: \nThey just said on the local news that the bus \ncompanies are planning to reduce fares for travel after \nten o'clock to get more people to come into town. \nB: \nThat certainly sounds like it would work well. It would \ndefinitely help shops and businesses, as well as the \nlocal attractions. \nConversation 3 \nA: \nOh no, not again! The air traffic controllers are going \non strike. That will cause massive delays at the airports \nand ruin a lot of travel plans. \nB: \nWell, to be honest, I'm not really worried. I'm travelling \nby train for my holiday. \n•\n\nConversation 4 \nA: \nIt says here in today's paper that the government is \ngoing to offer free dental checks to people over 60. \nB: \nI'm all for that. Anything that helps people take care of \ntheir teeth has to be a good thing. \nConversation 5 \nA: \nThere's a report in the sports section that says Athletic \nare going to buy that Brazilian striker Reginaldo for \n£40 million. \nB: That much? I can't seriously believe that! I really don't \nthink he's as good as the experts say he is. \nConversation 6 \nA: \nThe government is going to bring more doctors and \nmedical staff from abroad to fill vacancies. Maybe they \nshould try to find more here. \nB: \nIt's all the same to me. As long as they're qualified \nand speak good English, it shouldn't matter where \nthey're from. \n06 Tell students to listen to the conversations again and \ncomplete the table with the key words and expressions, \nwhich represent a positive, negative or neutral attitude. \nI \nAlternative \nFor a weaker class, you could provide students with a copy \nof the tapescript and ask them to underline these words/ \nexpressions and then complete the table. \nSample answers \nConversation Keywords/ \nPositive/ \nexpressions \nNegative/Neutral \n1 \nI don't see how \nNegative \n2 \ncertainly, definitely, \nPqsitive \n3 \nwell, to be honest, \nNeutral \nI'm.not really worried \n4 \nI'm all for that, \nPqsitive \na good thing \n5 \nI ]an't s^riously \nNegative \nbelieve that, I really \ndon't think \n6 \nIt's all the same to me, Neutral \n. it shouldn't matter \nExtension \nWth a higher level class, you could brainstorm other \nexpressions which convey a neutral, negative and \npositive tone. \ne.g\nPositive- Yes, I am sure\nNegative- absolutely not\nNeutral- I don't mind either way\n• \n07 Exercises 07-09 look at the role of distractors within the \nlistening exam. Check students understand the meaning of \ndistractors, outlined at the beginning of the lesson. Draw \nstudents' attention to the information box, which clearly \ndefines what they are and what their purpose is. \nTell students to listen to part of the conversation again and \nchoose the correct option, A, B or C.`,
    24: `Dr Thornton: That'd be ideal. Six months is just right for \nyou. You could follow their progress and how \nthe project develops. From what I know, the \nPluto project is already a success, but with \nthe Mars one you can assess how successful \nit is as it progresses and you can write it up \nfor your final report. \nMaria: \nHmm ... yeah ... that sounds promising. \nSimon: \nOK, but before we decide, I'd just like to \nmention one more. I heard that the Chinese \nare planning an expedition to the moon. \nMaria: \nWhat? Another man or woman on the moon? \nThat's already been done. I don't think the \nmoon's particularly interesting these days. \nDr Thornton: Simon has a point. I mean, the Chinese are \ncoming up now and they've got some new \nideas. I don't think they're sending any \nastronauts. I think it's just an expedition with \nrobots and machines to find the best place to \nstart a colony. \nMaria: \nYes, but I don't think that's particularly \ninteresting. I mean, no one has ever seen \nPluto close up and no one has tried to go to \nMars, so I think they'd be more interesting \nexpeditions to do. \nSimon: \nYou have a point. Perhaps it would be better \nto focus on one of the other two. \nDr Thornton: OK, if you ask me, I'd prefer to see how a \ngroup of people get along living together in \na difficult situation, like they'll be doing in \nArizona in preparation for their trip. I think \nyou'd get far more out of that, but the final \ndecision is yours. What do you think? \nC is correct \n08 Tell students to complete Exercise 08. If needed, students can \nlook at a copy of the tapescript to answer these questions. \n1 She mentions that the Pluto project is successful, but \ndoesn't say the same about the Mars project, so A \ncannot be right. \n2 There is information about using robots and machines \nto start a colony, but that is connected with a Chinese \nproj^ct on the Moon, so B cannot be correct. \n3 C must be correct, because the Mars project will last \nsix months and Dr Thornton says that is just the right \nlength of time for the group . \n\n09 Make students aware of Tip 9, which reminds them that \nwhen they have chosen their answer, they should always \ncheck it is correct, by understanding why the other two \noptions are incorrect. This exercise practises this skill. \nTell students to listen to the recording and choose the \ncorrect answer. Once you have checked the answers as \na whole class, ask students to discuss why the other \noptions are wrong. This can be done in pairs or as a \nwhole class.`,
    25: `Dr Thornton: \nI assume you've seen the latest update \nfrom the Mars project? One of the people \nhas had to leave the project in Arizona, \nwhich is a bit of bad news. It only came \nout last night. \nMaria: \nOh, really? We missed that. Who is it? \nDr Thornton: Alfonso, the biologist. That means that they \nwon't be able to monitor the plants they've \nbeen growing for food. Apparently, his \nmother was taken ill, so he decided it was \nmore important to be with her than stay \nwith the project. \nSimon: \nHis mother's ill? That's a pity. I hope it's \nnothing serious. Are they planning to bring \nsomeone else in, or have they got someone \nto take over the plant care? \nDr Thornton: Well, as you know, according to the rules of \nthe project, no one else can come in once it's \nstarted, so they'll just have to make the best \nof it. After all, in a real situation, you can't \njust call up an agency and get someone else. \nMaria: \nI think Carla would be the best person to \ntake over. As chief medical officer, she's had \ntraining in biology. \nSimon: \nThat might be true, but I'm not sure that \nmeans she's the best person for the job. \nMaria: \nWhy not? There's nobody else in the project \nwho's got her experience in that area. \nDr Thornton: \nMaybe, but I personally think the best \nsolution would be to share the work. I'm sure \nthey can all learn how to do it, and what's \nmore, they can make sure that if anything \nelse happens to one of them, the others will \nhave a good idea of what to do. \nSimon: \nYeah, I agree with Dr Thornton. That would \nbe the best solution. But I'm sure they'll \nannounce their plans later. \nDr Thornton: \nRight, so now that update is out of the way, \nlet's see what other progress you've made ... \n1 Correct answer: B\nDistraction: A \n(The participant's mother is ill, not the participant, so it \nis a problem unconnected to the project.) \n2 Correct answer: B\nDistraction: A \n(Dr Thornton clearly states that no one else can come \nin once the project has started.) \n3 Correct answer: B\nDistraction: A \n(Simon agrees with Dr Thornton, who says the work \nshould be shared.) \n10 Exercises 10 & 11 focus on paraphrasing. Check students \nremember the meaning, outlined at the beginning of \nthe lesson. \nTell students they are going to listen to an example of \nparaphrasing and then choose the correct option A, B or C. \nFocus students' attention on Tip 10, which reminds students \nthat in multiple-choice questions in the Listening there is \nalways one correct answer and two distractors. \nThe information box below the question gives students the \ncorrect answer and the rationale for why.`,
    26: `Simon: \nMaria: \nSimon: \nOK, so the latest from the project is that \none of the people taking part, Joe, attacked \nanother person on the team, Martin, and hit \nhim. I really can't believe that Joe would do \nsomething like that! He's been the quietest \nup until now. \nSometimes that's what happens. You think \nsomeone is OK, but it turns out that they're \nnot. Why did he do it? Is it anything to do \nwith personality problems, or is it just a \ndisagreement about something? \nWell, there are strong signs that there've \nbeen some emotional or psychological \nproblems which result from being isolated \nfor so long. \nMaria: \nIsolation? What, so you're saying that Joe \nmight be suffering some kind of psychological \nproblems? I can see how that can happen in an \nenvironment like that, where there's no escape \nfrom the situation ... \nTell students to listen again, to find the phrase in the \nrecording, which determines B as the correct answer. \n(answer in bold in the tapescript above) \n11 Tell students to listen to the next part of the conversation \nand choose the correct option \nI\nAlternative \nBefore the feedback stage, ask students to discuss their \nanswers in pairs. \nAs shown in Exercise 10, they must also explain why \nthe other options are incorrect. Students may need the \ntapescript for this, so they can underline the sentences/ \nphrases relevant to the correct answer. \n•`,
    27: `Dr Thornton: Well, as psychology tutor, I find that really \ninteresting. Many types of people participate \nin projects studying the effects of isolation. \nWe all know that one of the main issues \nwith a project like this is how people will get \non when they are locked away together for \nsuch a long time. It can produce all kinds \nof psychological and emotional problems. \nThat's what I'm particularly interested in and \none of the reasons why I wanted you to do \nthis particular project. \nSimon: \nMe too. That'll be one of the most important \nthings to come out of this project - how \npeople can control their emotions and \nfeelings over a long time when they can't get \naway from each other. \nMaria: \nTrue, but we have to remember that this is \na science project and not some soap opera \nor television series with lots of silly people \nlocked up in a big house or something. \nDr Thornton: I can see what both of you are saying, but \nthere are always going to be problems \nlike these so it's not surprising when they \nhappen. In fact, this is the first time someone \nhas got really angry in the first three months, \nso I think that's quite a positive thing. \nMaria: \nSo what do you think will happen? Will they \nmake him leave? \nSimon: \nI don't think they can. It's all part of \nthe programme. And anyway, as the \nenvironmental engineer, Joe is an essential \nmember of the team. If he left, then the whole \nenvironment of the building would go wrong, \nso I think they'll just have to work the situation \nout. Remember last month, when the \nventilation system broke down? They almost \nlost all their fresh air. He only had a couple of \nhours to fix it and he managed to do it. \nDr Thornton: I'm sure they'll work it out. So what else have \nyou found out ... ? \n1 C She mentions that she is a psychology tutor, and \nthat many types of people take part in studies like this, \nbut she is particularly interested in how people get on \nwhen they are locked away together. \n2 A She is not surprised that these problems happen. \nShe sees Maria's point that it's not a television series \nor soap opera, but she thinks it's positive that the first \nsign of anger came after three months. \n3 B Simon refers to environmental problems, but not \ncaused by Joe. He also talks about solving problems, \nbut this refers to the problems with conflict, not the \nenvironment. He mentions that Joe managed to repair \nthe ventilation system. \n• \nEXAM SKILLS \n12 This exercise is a practise exam task. Students should use \nall of the skills/knowledge acquired during the lesson to \ncomplete it. \nElicit some of the information/ skills acquired throughout \nthe lesson: \ne.g identify the attitude/ opinion of the speaker, recognise\nparaphrasing/ synonyms/ understand the role of distractors.\nI \nAlternative \nWith a weaker class, read the questions as a whole class and \nelicit the meaning of any unknown vocabulary., before playing \nthe recording. You can also play the recording more than once \nand/or pause it after each question to discuss the answer.`,
    28: `Dr Thornton: So now that the project has ended, we need \nto review it and I can help you plan your final \nassignments. \nMaria: \nSimon: \nMaria: \nSimon: \nYes. I never thought that of the ten who started \nout only six would finish in the end, and it was \nreally hard for them to get through the whole \nprogramme. So, what have we learnt? \nWell, I've got lots of data on the environmental \nsystems and life support, and that's the \nkey focus of my project report, especially \nconsidering the events last week, when the \nwhole system came close to failing. \nRight. When the life support system went \noffline for four hours, they had to really race \nto fix it. If that happened on a real trip, it'd be \na disaster! They could all die. \nI know. It's good that they weren't actually \nin danger in this project, but I agree, in a real \nsituation people could have been killed. Who \nwould've thought that it'd be on the front \npage and first item on the evening bulletin? It \nshows how much interest there's been in the \nproject. Anyway, I'm hoping to use the data \nto design a new system if it's not too difficult. \nDr Thornton: \nThat would be challenging but fascinating \nSimon: \nat the same time. I think you'll do well with \nthat, Simon. Personally, I'd love to focus on \nthe particularly interesting and useful data on \nthe health of the participants. I think it'd be \nworthwhile writing about the physical effects \nof the project, you know, how they kept healthy \nin the long term, even though they became ill \nsometimes, but also about the psychological \neffects of living in an enclosed group like that. \nIt'd be interest,ng to see ,t any of them will have \nany long-term health changes. Would either of \nyou like to take that on? \nWell, I'm not sure if I could take that on as well \nas producing an assessment of the life support \nissues. I feel that those are more significant in \nview of the current developments in technology \nto support this ing like $12 million. \nDr Thornton: \nWell, actually, it says here that the final cost \nwas $9.5 million, so they saved half a million \nin the end. \nSimon: \nThey could give that to us to fund our projects! \nIs there anything about future developments? \nDr Thornton: \nWell, I heard that they're going to share \ntheir research results with government and \nprivate organisations. There are a few other \norganisations planning trips to Mars that \nwould love to study the results. I'm not sure \nthe government is planning anything, but \nthey'd be interested anyway. \nMaria: \nWhat about a follow-up? Are they planning \nanother project? \nDr Thornton: \nWell, depending on the results from this \none, they're going to decide whether to have \nanother one that will \ast a -year. Ob\Jious\y, \nthey'll have to find some more participants. \nWould either of you be interested in taking part? \nMaria: \nIt depends. I wouldn't say no, but I'd have to \nthink a long time about it. I don't know if I'd \nwant to be cut off for so long. \nDr Thornton: \nI think you should bear it in mind. It would be \nso interesting t-9 see how staying in a situation \nlike that for a year affects physical and mental \nhealth. I'd love to follow your progress myself. I \nmight even volunteer! What about you Simon? \nSimon: \nOh, you wouldn't catch me inside one of \nthose places! I'll be happy to follow what \ngoes on and see how the whole system works \nover a year, but definitely from the outside, \nnot the inside ... I wouldn't mind working for \nthe company, though. It'd be great to study it \nand get paid at the same time! \nDr Thornton: \nWell, thank you, both of you. You've \nproduced excellent results and I'm looking \nforward to seeing your final submissions. \nred during the lesson to complete the task. \nSPEAKING \nOUTCOMES \n•\nspeak about the news and media for Speaking Part 1\n•\nuse adjectives and intonation to express feelings about\na news story\n•\nuse paraphrase and the pa general terms to mean something is very good­\nextraordinary/ impressive/magnificent/brilliant/marvellous/ \noutstanding/tremendous \nDescribes something as beautiful or attractive­\nstunning \nThen ask students to match the following nouns to the \nappropriate adjective: \nmovie, views, race, results, achievement, evening \n04 Now students have acquired some vocabulary to describe \npositive feelings, they are going to focus on negative \nadjectives. \nWith a different partner, students describe sad news stories \nusing the adjectives from the box. \nAlternative \nAgain, weaker students will need support with this list of \nadjectives. You could either repeat the previous exercise, \nusing a different set of nouns or ask students to come up \nwith their own nouns. Either way students must understand \nthe following: \nAbsurd, bizarre- something is very strange and unusual. \nUpsetting, distressing- makes someone feel worried, \nunhappy or angry \nTerrible, dreadful- something which is very bad \nHarmful- to cause harm \nUncomfortable-not making you feel comfortable \nDisgusting- extremely unpleasant or unacceptable \n\n05 In this exercise, students explore how intonation can also be \nused to express emotion. The use of intonation is important \nin the speaking exam and it is one of the criteria used to \nassess students .. \nTell students to listen to the recording and choose which \nspeaker uses the correct intonation. \nAlternative \nWith weaker students, write the first sentence on the board \nand mark the intonation pattern. Elicit that generally, for \na positive statement the voice goes up and for a negative \nstatement the voice goes down. \nExtension \nDrill the following with students, practising the intonation \npattern marked by the arrows: \nI don't like the fact people read the news on their phones \n(falling) \nI am really excited about reading tomorrow's headlines! \n(rising) \nThere is too much focus on entertainment news these days \n(falling) \nI ravel & Transport. \nTell students to match the words to their definitions. \n1 h2 a3 i4 bS c6j7 g8 d9 elO f \nAsk students to choose four words from the list and use each \nin a sentence. \ne.g. I was offended when he didn't say thank you.\nAlternative \nFor weaker students, do some examples as a whole class \nbefore asking students to form their own sentences. \nWhen students have completed the exercise, feedback \nas a whole class. Check students have understood and \ncontextualized the word correctly, and that sentences are \ngrammatically accurate. \nExtension \nWith a stronger class, you could ask them to use as many of \nthese words as possible in questions, which they could then \nask their partner. \ne.g.\n1 When you travel, do you try and integrate with the locals? \n2 Do you get annoyed by cancellations, when you fly? \nI \nAdvice \nMake students aware that as they learn new vocabulary, \nthey should always try to record it in context, as shown in \nthe previous exercise. \n02 Draw students' attention to the information box, stating \nthat a common task in the reading exam is being asked to \nmatch a list of headings with the correct paragraph/section \nof a text. The headings summarise the main idea of the \nparagraph section. \nTell students to skim read the text on "Travel Tips". As stated \nin Tip 2, students are only reading for the main ideas at this \nstage, so they must ignore any unknown words. This may be \ndifficult for some students, but make sure no dictionaries \nare used, as is the case in the actual exam. \nDraw students' attention to the information section below \nthe reading, highlighting the fact that the heading must \nsummarise the whole section, not just part of it or one line. \nA clear example of this is also given here. Make sure students \nunderstand this concept. \n03-04 Tell students to complete Exercises 03 & 04. As stated\nin Tip 3/ 4, matching words does not ensure a correct \nanswer. In fact, the correct answer (heading) i ents need more practice in this area, you\ncould use an article from a newspaper, magazine or book\nand ask them to write summaries for each paragraph. If you\nchoose a topic your students are interested in, this may help\nthem to grasp the technique better.\n06 In order to involve students in the next text, ask students if \nthey have been on any interesting train journeys? Or, if they \nwould like to go on any? \nExplain to students that The Trans- Siberian Railway, makes \na journey which has been described as one of the most \ninteresting train journeys in the world. \nTell students to skim read the text, in order to understand \nthe general idea. \n(The rest of the questions in this lesson all relate to this text.) \nGRAMMAR FOCUS: PRESENT CONTINUOUS, \nPRESENT PERFECT SIMPLE, PRESENT PERFECT \nCONTINUOUS AND PAST SIMPLE \n07-09 Questions 07-09 practise students' understanding and\nuse of the tenses in the title above. It is particularly \nimportant in the reading that students understand \n• \n07 \n08 \n09 \nhow these tenses are used as it has an impact on \nstudents' ability to understand the text. \n1 a.past simple, prsent perfect \n·b past simple\nc preset per,fect continuous, present continuous passive \n2 past si,ple: p.ast form of verb \npresent perfect: hqs/have +, past participle \npresent perfect ,continuou.s: have/has,+ been + \nverb+ -ing \npres-nt 'P.tinuous passive: is 6e1ng ,,.. present\nparticiple (-ing form), \nhc3ve/'v.e been trav:ellirig \ngot up \n3 has been cancelled \n4 have/'ve been sunbathing \n5 havej've visited \n6 went \n10 Another key element to being successful at the task type, \nMatching Headings, is recognising synonyms. As stated in \nthe information box, the words used in the headings are \nvery often synonyms of words used in the text. \nTell students to match words 1-7 with the correct synonym a-g. \nElicit the meaning of any unknown vocabulary. \n11 This exercise gives students some useful strategies/tips in \norder to dea a logical way\n•\nmake your writing easier to understand by using\ncohesive devices.\nOUTCOMES \nThis unit focuses on Writing Part 1, where students may be \nasked to describe one or more maps. All of the outcomes in this \nunit relate, therefore, to producing a successful answer for this \ntask type. \nThe second outcome focuses on encouraging students to check \ntheir work once it is completed. Under exam conditions, it is \neasy for to make silly mistakes, which can be easily rectified, \nonce identified. \nThe third outcome, deals with cohesion and teaches/practises \nwith students how to organise their ideas in a clear and logical \nway. This is a key element in a successful answer. \nDefinition \nCoherence: the logical progression of ideas. \nThe fourth outcome, focuses on cohesive devices \nDefinition \nCohesive devices: words which help you link ideas together. \ne.g. however, therefore, for example, in conclusion. \nElicit other examples from students. Again, cohesion is a very \nimportant part of an exam answer. Make students aware that they \nwill be assessed on both coherence and cohesion in the exam. \nLEAD-IN \n01 In Writing Part 1, students may be asked to describe one \nor more maps. This exercise gives students some useful \nvocabulary for this type of task. \nTell students to label the maps using the words from the box. \nMake them aware, that as stated in Tip 1, in the actual exam, \nsome of this vocabulary may already be labelled. \n1 stadium 2 windmill 3 skyscraper 4 residential area 5 \nmotorway 6 east 7 north 8 fields 9 hills 10 bridge 11 \nr.iver 12 farm 13 pond 14 church 15 west 16 south \nFor this task type, it is important that students are able \nto read and understand simple maps, as illustrated in the \nprevious exercise. The maps featured in the exam can vary. \nFor example, students could be presented with a map of a \npark, building, street, farm etc. Students must also carefully \nread any information given with the maps. For example, in \nExercise 01, map 1 represents "now" and map 2 represents \n"twenty years ago." This timescale can vary in the exam, for \nexample, students could be presented with a map which \nrepresents "now" and one which depicts "the future". \nAdvice \nAn important aspect of this task is that students are able to \nchoose the most significant features to write about, as is the \nfocus for all Part 1 Writing tasks. This is even more important, \nwhen students are given more than one map to write about, \nas they are aiming to write just 150 words in 20 minutes. \n02 This exercise aims to practise the skill of choosing the most \nsignificant features. \nAs a whole class, tell students to read question 1 and the \nexample given. Elicit which tense has been used and why. \nMore houses have been built {present perfect- because you \nare describing a present result connected to the past) \nElicit from students the form of the present perfect: subject \n+ have/has been+ past participle.\nElicit more answers for question 1, monitoring the correct \nuse of the present perfect. \ne.g. A lot more facilities have been built.\nDraw students' attention to Tip 2 which states that the \naccurate use of prepositions of place are also important in \nthis task. \nDefinition \nPreposition of place: a word or group of words that is used \nbefore a noun or pronoun to show place. \nFor example 'on' in 'Your keys are on the table.' is a \npreposition of place. \nIii \n\nElicit other examples of prepositions of place. \nPossible answers: at, in, in between, through \nTell students to complete Exercise 02 in pairs. \nSample answers \n1 A motorway has been .built through the centre of the \nisland. \nA hospital has been built,in the east of the island. \nA skyscraper has been built in the south of thejsland: \n2 The residential area has inc;reased in size. \n3 The farm and fields have remainea the same. \nThe church and pond near the residential area have \nremained the same. \n03 This exercise aims to personalize the task for students, \nwhich may make producing the target language easier and/ \nor more enjoyable for them .. \nTell students to complete Exercise 03 by discussing the \nchanges in their own town, over the last ten years. Some \nwords have been provided for students to help them \ndescribe change, elicit the meaning of any unknown \nvocabulary. If students learn to use a varied selection \nof verbs accurately, they are more likely to achieve a \nhigher score. \nFeedback \nMonitor students for correct use of the present perfect. \nAs a whole class, ask some of the stronger students to \ndemonstrate their discussions and usage of verbs. \nExtension \nIf you feel students need more practice at interpreting \nmaps and choosing the most significant features, you \ncould give them further examples to discuss. Maps of \nlocal parks, buildings, towns etc. can be easily accessed \non the internet. \n04 Grammatical accuracy is very important in the writing test \nand one of the criteria students are marked on. At this \nlevel, students are expected to produce many sentences, \nwhich are error-free. Exercises 04 to 06 focus on this aspect \nof the task. \n05 \n06 \nTell students to complete Exercises 04-06. \n2 dramatically- dramatically \n3 threw - through \n4 significantally...: significantly \n5 facilites - facilities \n1 changed - has changed \n2 building - built \n3 has built - has been built \n4 has being developed - has been deve:loped \n5 was occurred - has occurred \n1 present perfect \n2 because there is.a connection between the past and1 \npresent \n• \n07 Another criterion students are marked on is coherence \n09 \nand cohesion. Tell students to read the information box, \nwhich clearly explains both terms. Exercises 08 and 09 give \nstudents an example of a sample answer, highlighting how \nstudents could organise their ideas. \nTell students to look at the two maps of Mumbai. Elicit \nwhere Mumbai is. \nTell students to complete Exercises 08 & 09. \nr 1, (9) \n2 (9) 6, 2,4, 8, 5' \n3 3,10 \n4, 7 (sentence 9 could go in the introduction or \nfirst paragrap~) \n10 Having looked at the structure, students are now going to \ncomplete Exercises 10-12, focusing on how their ideas can \nbe joined together. Tell students to read the information \nbox, which explains what cohesive devices are, and how \nthey can be used to link sentences together. \nI \nAdvice \nIt is important that students do not overuse cohesive \ndevices and only include as appropriate. \nTell students to complete Exercises 10-12. \n11 \n12 \nd moeover, in addition, what is more ,, \n2 similarly \n3 ip particular \n4 in.cc:mtrast, iii cgrnparison \nto slJmmarise, in conclusion,to conclude \nfin comparison/ .in contrasr 2 what is more I in addition I\nmoreover 3 To summarise/ In conclusiqn / To conclude \n4 in particular 5 in ontfast \nExtension \nIn order to ensure students have fully understood the use of \nthese cohesive devices, you could ask them to complete this \nextension activity. \nAsk them to write about the changes in their own town (as \ndiscussed in Exercise 03), but this time, they must include \nsome or all of the words in Exercise 12. Give students the \nfollowing example: \nOver the last ten years there has been a lot of development \nin my town. Particularly in residential areas, where more \nflats have been built to accommodate a growing population. \nEXAM SKILLS \n13 Tell students to complete the timed writing task in Exercise \n13. Remind them that they should spend a few minutes\nreviewing their answer when they have finished writing. \nTell students they will be marked on the following: \nidentifying the most important features in a map \ngrammatical accuracy \n\na well organised answer \nthe correct use of cohesive devices to successfully connect \nideas together. \nSample answer \nWhen comparing these two maps, it is evident that this \narea has changed significantly. It has definitely become \nmore modern and busier. \nIn both maps the only feature, which remains the same \nis the clock tower in the middle of the roundabout. In the \npast, there were a few buildings at the side of the road, \nbut the area was mainly covered in sand. \nToday however, the map is quite different: the area by \nthe road is covered with skyscrapers and the road itself is \nheavily used. In addition, trees have been planted on the \nedges of the roundabout. \nOverall therefore, the area has become significantly more \ndeveloped and populated. Numerous skyscrapers fill the \nroadside and it is no longer possible to see areas of sandy \ndesert. The clock tower is the only feature, which remains \nthe same. \nExtension \nIn order to emphasis good practice even further, you could \ngive students a copy of the sample answer and ask them to \nunderline the following: \nthe tenses used (and discuss why they are used) \nthe use of cohesive devices \nLISTENING \nOUTCOMES \n•\nidentify the main subject of conversations\n•\nidentify the functions that speakers use\n•\nmatch questions and options (e.g. solutions to \nadvantages/ disadvantages).\nOUTCOMES \nDraw students' attention to the outcomes of this unit. This unit \ndeals with, "matching questions", a task in which students have \nto match information on paper to information in the recording. \nIn order to complete this task type successfully, students need \nto be able to identify the main subject in a conversation and \nidentify the functions that speakers use. Both of these key skills \nare practised in this unit. \nDefinition \nFunctions: the purpose of a conversation e.g requesting, agreeing, \ncomplaining etc. \nLEAD-IN \nIn order to draw students into the topic and introduce the first \nexercise, tell them to discuss the following questions: \nWhat is your preferred method of transport and why? \nWhich method of transport do you least like and why? \nWhat problems can you encounter when travelling? \nMake students aware that these types of question could also \nfeature in Part 2 of the Speaking exam. \nIn Exercise 01 students are asked to identify the main topic in \neach conversation. \n01 Tell students to listen to the recording and match each \nconversation to the correct letter, A-E.`,
    30: `Conversation 1 \nA: \nThe next bus should be here soon. \nB: \nNo, it won't. I just checked. It's due in twenty minutes. \nA: \nTwenty? I don't believe it! It should be every ten minutes. \nThis service is getting worse and worse! \nB: \nYou're right. It was never this bad. The bus company \njust doesn't care about passengers any more, as long \nas they get the money. \nConversation 2 \nA: \nExcuse me, could you tell me why the 4.50 train to \nLondon hasn't arrived yet? \nB: \nI'm afraid there's been an accident on the line at the \nstation before this one. \nA: \nOh, sorry to hear that. Do you have any idea when it \nmight arrive? \nB: \nWell, at the moment the line's closed but I've just \nheard that the company is arranging buses to \ntake passengers to London. There should be one \nhere soon. \nA: \nThanks for letting me know. \nConversation 3 \nA: \nWhat do you think? Should we take the car? It's the \nquickest way to get to Bristol. It's straight down the \nmotorway. We should be there in two hours. \nB: \nHaven't you heard? There's fog on the motorway and \nthere are massive jams all the way down. There's really \nno point in driving. \nA: \nOh, really? Well, shall we take the train? I know it's \nexpensive, but maybe we can get a cheaper fare. \nI'll have a look at the train website. \nB: \nGood idea. At least we can get there fairly quickly and \nsafely. \nConversation 4 \nA: \nOK, darling, I'm off to work. \nB: \nYou're not using the car, are you? Remember what the \ndoctor said. You need to get more exercise and lose \nweight, especially now that your leg is better. \nA: \nI know, but my leg hurts a bit today. I'd prefer to use \nthe car. \nB: \nYes, but it won't get better if you sit in the car all day. \nI really think you should do some more exercise. And \nit's a lovely day for cycling. You can use the car when \nit rains. \nA: \nOK, OK, I'll cycle today, but I'll need to use the car \ntomorrow as I've got a lot of things to take to work. \n•     31: `Sophie: \n• \nSo the main focus of the project is the \ntransport system in the town. We need to \nlook at the problem carefully and then \ndiscuss possible solutions. We have to \ndecide which one we could recommend to \na transport committee. \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nOK, Sophie. I think the problem is not a simple \none as there are various causes that we have to \ndiscuss. I think the first one is to do with the bus \nservice in the town. In my view, the lack of buses \nhas meant that too many people are using their \ncars. The service isn't reliable enough. \nYes, you have a point there. It would be good if \nwe could have more buses on the road all the \ntime, but I don't think that's the main reason \nfor the heavy traffic and the problem won't go \naway just by improving bus services. \nYou could be right. More buses would be \nuseful, but that's not enough to put things \nright. We have to remember that many people \ncome into town by rail and the rail company \nhas been talking about reducing staff and \nservices because of financial problems. If \nthat happens, then more people will use their \ncars to come in. We need to take that into \nconsideration when deciding on a solution. \nOf course. I think the town council can find \nsome extra money to support the train service \nbecause, if anything, we want to increase the \nservice to reduce the traffic on the roads. The \nmore people travel by rail, the less they'll use \nthe road. And we would have the added benefit \nof safer roads, especially at school travel times. \nTrue, but one good thing is that the road \naccident rate has been falling recently, partly \ndue to the high volume of traffic on the \nroads. After all, when there's too much traffic, \nit moves more slowly and fewer people, \nespecially children, are in danger. \nI realise that, but that's exactly what we \nhave to deal with: the problem of too many \nvehicles coming in. I know children are safer, \nbut the air quality is much worse. We don't \nwant to have more medical problems like \nasthma and bronchitis, especially for children \nand older people. \nTrue, and when I think about it, I can see that \nthe heavy traffic means that businesses lose \nmoney, people are late for work and drivers get \nmore stressed. So, let's think about how we can \ndeal with that and look at the possible solutions. \nC (All the. e>th.er issues an{ mentioned, but are not the \nmain problem under discussion; and thehumber of \nacciclents has a5,:tually fallen} \n05 Exercises 05-08 practise matching information questions. \nIt is important that students are familiar with their format \nbefore taking the exam. \nStudents will be given a list of options (A,B,C etc.) which they \nmust match to the correct question, depending on what \nthey hear in the recording. As stated in Tip 4, the question \nstatements follow the same order as the recording . \n\nTell students to read Exercise 05, which demonstrates how \nthis type of question will be laid out in the exam. Make sure \nthey read the question carefully, noting that there are more \nlocations (1-4) than needed. \nTell students to listen to the recording and complete the \nexercise. If needed, play the audio more than once.`,
    32: `Sophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nSo where are the worst affected places in town? \nI would say one of the worst is by the Arts \nCentre. \nI'm not sure about that. Statistics show that \nthe worst place is by the town hall. \nWell, as most of the traffic comes in from the \neast of town, that would be the Arts Centre. \nThe town hall is further over. \nActually, Robert, that's not quite right. The \ntraffic gets quite bad along East Road, further \nout of town. It's been getting worse over the \nlast year or so, especially by the Starview \nCinema. \nThe Starview? \nYes, haven't you ever been there? \nNo, I haven't. I thought it was by the main \nroundabout. \nWell, in actual fact, it's by the junction of East \nRoad and Station Road. That's where the \ntraffic has been getting really bad, especially in \nthe mornings. It's especially bad for the buses \ncoming from the station as they can't turn \nright into East Road to get to the centre. \nOK. So that's the first bad spot, then. \nYes. Sometimes the traffic backs up for \nalmost a kilometre, and in the evening, when \neveryone is trying to get home, it gets bad all \nthe way back to the main roundabout. It's bad \nin the morning and the afternoon as the traffic \nalso comes in from the north and the south. \nRemember, there's Liverton to the north and \nScotsfield to the south and a lot of people \ncommute to both places for work. \nThat's true. I live a few kilometres down the \nScotsfield Road and I have a lot of trouble \ncoming in during the morning rush hour. It's \nespecially bad just by the Arts Centre where \nthe road comes into the roundabout. The \nbuses have a lot of trouble getting through \nthat as well. OK ... so those are the two main \nhotspots, the Starview and the Arts Centre. \nI've marked them on the map. And that leaves \nthe town hall. \nHmm ... yes. I mean, the whole area around \nCentral Park is bad, but you're right, the town \nhall side of Central Park is the worst in the \narea. It's bad enough right by the shopping \ncentre on the other side of Central Park, but \nRobert: \nSophie: \nit's particularly bad on the town hall side, with \nall the heavy lorries coming into the centre \nfrom the industrial estate on the west side o{ \ntown. They usually make their deliveries in the \nmorning rush hour. \nSo, you're saying that if we stopped them from \ncoming in early to the area by Central Park \nwhere the town hall is, that would make the \ntraffic a lot lighter? \nI'm sure it would. Now that we've established \nwhere the worst places are, let's have a look at \nthe proposals. \nLocation 1: B Location 2: C Location 4: A \nAlternative \nIf students struggle with this exercise, provide a copy of the \ntapescript and ask them to underline the answers. \nAdvice \nAs demonstrated by Exercise 05, there can be a great deal \nof extra information in these audios, which students must \nlearn to ignore so they can focus on what the task is actually \nasking for, which in this case,is location. \n06-08 Exercises 06-08 give students further practice of this type\nof question n. Remind students to listen for only the \nrelevant information. For example, in Exercise 06 students \nare only listening for solutions. Play the recordings more \nthan once if necessary.`,
    33: `Sophie: \nRobert: \nSophie: \nRobert: \nSophie: \nThe first proposal is to introduce bus and \ncycle lanes on the roads coming into each of \nthe trouble spots, but I'm not really sure that \nthat will solve the problem by itself. \nWhat do you mean? I think it's a really good \nidea. I think it would help a lot. \nOn the face of it, yes, but in actual fact it \ncan make things worse. There've been a few \nstudies of towns and cities where they've \nput schemes like that into operation and \none serious problem is that car traffic tends \nto go off into the areas around town where \npeople live, and that causes more traffic in \nplaces where there haven't been problems \nbefore. Drivers think they can find emptier \nroads in residential areas and it just sends the \nproblem there instead. \nHmm ... I hadn't thought about that. What \nabout the second one, a park-and-ride \nscheme? \nWell, we build car parks on the edge of \ntown where the main roads come in. When \ncars come into town from further out, they \ncan park there cheaply and take special \nbuses into the town centre. It's been \nquite popular in a few other towns around \nthe country. \n•\n\nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nIn some places, yes, but not in all. I've had a look \nat some of those schemes. The main problem is \nlack of take-up. Drivers just don't use them. A lot \nof these car parks stay empty for a long time and \nthe buses are often less than half-full. It's not \nalways a good use of public money, especially \nwhen drivers avoid using the services and prefer \nto come into town and pay higher parking fees. \nYou've got a point there. We need to bear \nthat in mind. Do you think either of the other \nproposals would work? I think the pedestrian \narea is a very interesting proposal. We could \nturn the whole of the centre, including the \nshopping areas, into a pedestrian zone and put \nin a one-way system round it. \nI'm not convinced that would work. You'd move \nall the traffic further out of the centre and cause \nmore problems. But the biggest problem would \nactually be with the shops themselves. It's fine \nto stop traffic around the shopping areas, but \nthere would be huge problems with deliveries. \nSome shops could go out of business if they \nhave difficulty getting lorries in with their goods. \nRight. I'll note that as well. The last one is a \nnew tram system. We'll have to lay down a new \nline through the centre of town and also from \nnorth to south. It's quite a popular solution to \ntraffic problems. \nThat may be so, but the main problem with \nthat kind of project is the expense. The initial \nfinancial requirements would be huge and so \nwould the maintenance expenses. It might \nwell be far more than the council is prepared \nto spend on a solution. \nI'll note that as well. Which brings us to the \nnext point, the question of cost ...`,
    34: `Sophie: \nI've got the details on the cost of each of these \nprojects. The tram system comes out as the \ncostliest. It would cost over £20 million just to \nprepare the route and to lay the lines down, \nincluding widening the roads. Then there's \nthe cost of buying the trams themselves and \norganising the system. \nRobert: \nAnd what does it all come to? \nSophie: \nRobert: \nSophie: \n• \nNo less than £30 million in the end. At least that's \nwhat they need to try to keep the costs down to. \n£30 million? That does seem a lot. I thought it \nwas closer to £25 million, but clearly it isn't. \nAnd what about the cheapest? \nWell, it seems that it'd be either the bus and \ncycle lanes plan or the park-and-ride scheme. \nAt the moment, it looks like the bus and cycle \nlanes might be the least expensive overall. The \nchanges wouldn't be so large. They estimate \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \naround £8 million to set up the signs, paint \nthe roads, and so on, and at least another £2 \nmillion or so to make other changes. \nSo you're saying it's around £10 million? That \nseems quite reasonable. What about the park­\nand-ride scheme? \nWell, there are sites which have been identified \nfor development to build the car parks, and \nas they're not in the centre, it won't cost \ntoo much to buy them, probably around £5 \nmillion. Then they'd just need to lay out the car \nparks and put in bus shelters, which should be \naround £6 or £7 million and then and get the \nbuses. If they rent them, they could keep the \ncosts down to around £3 million. \nSo, if I'm right, that comes to around £15 \nmillion for the park-and-ride in total. And then \nthere's the pedestrian and one-way system. \nHow does that work out? \nThat's the second highest. We'd have to re­\nroute all the traffic while the works are done, \nthen change the roads along the routes to \nmake it safer for cyclists, which is around \n£12 million. Then there ar     35: `Sophie: \nRobert: \nSophie: \nRobert: \nSo we've discussed the negative aspects and \ncosts of these proposals, but now I'd like to \nlook at the real benefits which we think each \nproposal will bring. \nWell, I really think that one of the most \nimportant benefits is better public transport. \nThe most important thing is to get more \npeople out of their cars and onto public \ntransport. \nWell, three of the proposals would help with \nthat - park-and-ride, bus- and cycle-only routes \nand the new tram transport system. Which do \nyou think would be the best out of those three? \nI think the bus and cycle routes would be great \nfor town centre transport, but they might \npush car traffic further out and make it more \ndifficult for buses outside the centre. That \nleads me to think that the tram system would \nactually improve public transport the most, \neven though it's the most expensive, as there \nwill be a new form of transport in the centre, \nwithout affecting other parts of town . \n\nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nSophie: \nRobert: \nI think you have a good point there. I agree \nthat in the long term it would be the best \nthing. Do you think that proposal would also \nincrease the number' of visitors in town? \nWell, of course. Any of the solutions would do \nthat, but I'm not sure if the tram system would \nbe the best. What do you think? \nI think the park-and-ride would be better than \nthe tram system for that. The trams would help \npeople who are already in town, but a park­\nand-ride would bring more of them in from \noutside. \nSo you think the park-and-ride would bring \nmost visitors in? \nActually, I think if people know that they can \nget around the centre more easily, do their \nshopping and so on, they would come in more. \nSo perhaps the pedestrian area and one-way \nsystem would be best in that respect. \nTrue. I've seen other town centres become \nreally busy when they've put in pedestrian \nareas, so that's clearly the best way of bringing \nvisitors in. So we agree on that, then. \nAnd I think that people's health will improve \nas well as they will be walking around the \npedestrian area, rather than driving around town. \nUp to a point, yes, but I'm sure you'd agree \nthat encouraging people to do more cycling \nwould help their health far more. \nOf course. Creating bus- and cycle-only routes \nwould be the best way of getting people to \nexercise. It would also help reduce pollution, \nso even the people who don't cycle will \nbreathe cleaner air. \nAnd we agree that producing less pollution is a \nreally important part of this scheme, though I \nthink that the park-and-ride would be better at \ndoing that than the bus-and cycle-only routes. \nI'm not sure. Lots of people would need to use \nthe park-and-ride to help reduce pollution. \nBus- and cycle-only routes keep cars out of the \ncentre. \nYes, but if people are encouraged to use park­\nand-ride more, it would produce the best \nresults. There would be far fewer cars in the \ncentre and the air would be much cleaner. \nYes, that's true, but that's a lot of work for the \ncouncil. OK, we'll agree on a park-and-ride, then. \nWhat about safety? I'd say the bus and cycle \nroutes would be best from that point of view. \nProbably. I think I agree with you on that. \nOK then, so we agree on safety. \nActually, no. When I think about it, you have to \ntake pedestrians into account as well. It's safer \nfor cyclists when there are no cars around, \nbut I'm not sure that it's safer for pedestrians. \nSophie: \nRobert: \nThey still have to avoid cyclists, who don't \nalways pay attention to pedestrians, so I really \nthink the pedestrian area and one-way system \nwould be safer for them. Cyclists won't be \nallowed in the pedestrian areas, so there will \nonly be people walking. \nYes, you have a point there. Shall we change
