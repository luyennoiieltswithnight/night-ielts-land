do you think/ know it differs from school? \n01-02 Tell students to complete Exercises 01 & 02 by matching\nthe words in bold with their definitions. \n02 \n1 lecture \n4 assignment \n7 Master's degree \n10 postgraduate \nl!I \n2 enrol \n3 fund \n5 campus \n6 faculty \n8 undergraduate \n9 Bachelor's degree \nAs a follow-up for consolidation ask students to work in pairs \nand ask each other questions about the vocabulary without \nlooking at heir answers. In a later lesson you could make this \na competitive class activity in the form of a quiz. \nCompleting a flow chart is one of the tasks students may \nbe asked to do in the Reading exam. As stated in Tip 3, it \nisn't necessary for students to understand every word in the \ndiagram or chart. Instead they should practise focusing on \nthe key words and phrases. \n03 Tell students to read the flow-chart in Exercise 03, and \nunderline the key words and phrases. \nE.g. Step 1- once, chosen, apply, university place.\n04 Exercise 04 teaches students how to interpret a flow-chart. If \nstudents remember this list of questions and apply it to any \nflow-chart in the exam, they are less likely to panic. \n1 how to apply to an Australian university as an \ninternational student. \n2 choosing a university and enrolling / applying for a \nstudent visa / booking your flight and accommodation \n1 adverb \n2 noun \n3 noun \n4 adjective \nOS Tell students to read the short text in Exercise 05 and \ncomplete the flow chart using just one word from the \npassage. Draw students' attention to both tips, stating that \nthe answers do not always come in the same order as the \ntext and that numbers/ hyphenated words count as one \nword in the exam. \n1 directly \n2 admission \nAlternative \nIn order to give students more help with this exercise, you \ncould first ask them to underline the key words in each \nsection/ paragraph. Students could also then decide which \nsection relates to which step. In this instance, the answers \ndo follow the order of the text. E.g. gap 1- paragraph 1/ gap \n2,3, 4- paragraph 2. \n06 This exercise shows students how to double-check they \nhave chosen the correct answer. \n07 This exercise gives students an example of a chart \ncompletion task. Elicit from students what the chart shows. \nIt illustrates a weekly timetable / schedule. \n08 Tell students to complete the chart using no more than two \nwords from the text. If needed, ask students to first employ \nthe strategy given in Exercise 05. (underlining key words and \nmatching sections to parts of the chart) \n1 Lecture \n4 Football (training) \n2 Private study \n5 Tutorial \n3 Lecture \n\nGRAMMAR FOCUS: MODAL VERBS OF \nOBLIGATION: SHOULD, HAVE TO AND MUST \n09 Exercises 09, 10 & 11 offer the opportunity to practise the \n09 \n10 \n11 \nuse of modal verbs of obligation. These are important \nfor students to understand as their meaning can have a \nsignificant impact on the meaning of a sentence. \na,b \nb \na: I don't have to attend/ I needn't attend \nb: You don't have to have a great deal ... I You needn't \nhave a great deal... \nc: You mustn't/ You don't have \nto/ You needn't/ You shouldn't choose \n5 a: I had to attend . . . \nb: You had to have ... \nc: You should have chosen something you would enjoy I \nyou would have enjoyed \n1 must 2 don't have to/ needn't 3 should I ought to \n4 must not I mustn't \n1 a - This expresses a rule and therefore something \nwhich is not allowed. \n2 b - This expresses a rule and therefore something \nwhich is not allowed. \n3 a - This expresses an idea which is optional. \n12 This section of the lesson helps students to locate the \nanswers quickly. Elicit from students why this is important. \n(Time is a challenging factor in the reading exam.) \nAs stated in Tip 12, students should identify which reading \ntasks they can tackle quickly, in order to allow more time for \nother tasks which take longer. \n13-14 Tell students to study the diagram. What does it\nrepresent? (a campus map) Tell students to skim read \nthe text and answer questions 13 & 14, which help \nstudents locate the answers quickly. \n13 \n14 \n1 [University] library \n3 Careers centre· \n2 Gym \n4 [Main] reception \n1 No, just the last two paragraphs \n. 2 main student facilities (indicating where the \ninformation is) and prepositions (e.g in front of, behind) \nMake students aware of Tip 13, advising students not to \npanic, if the diagram is difficult to understand at first. \nDiagrams are often scientific or technical in nature and \nstudents must be aware of this. \n15 This exercise gives students an example of a technical \ndiagram. \nAlternative \nIn order to generate more interest in the exercise you \ncould firstly ask students to discuss the following \nin pairs; \nWhat does the picture show? \nWhat was it used for? \nHave you ever used one? \nWhy was it replaced by the computer? \nHave them share their answers with the class afterwards. \nTell students to complete Exercise 15, making a note of Tip 15, \nwhich states that spelling accuracy is important. Also remind \nstudents, that it is not important that they recognise all the \ntechnical terms they are presented with, as these are explained \nin the text. \n2 Lever \n3 Type hammer \n4 Ribbon \n5 Carriage \nAs stated in the previous exercise, it is not necessary \nfor students to recognise technical/scientific terms, but \nthey are required to be able to understand explanations. \nThis section therefore, discusses the way in which these \nexplanations may be presented to students, using either \na footnote, explanation in a text or explanation given \nthrough context. \n16-18 Tell students to complete Exercises 16 to 18, which\ngive students an example of each of these modes of \nexplanation. \n16 \n17 \n18 \nlever: footnote \nribbon: explanation in the text \ncarriage return lever: explanation given by surrounding \ncontext \n1 a explanation in the text \nb explanation in the text \nc explanation given by surrounding context \nd footnote \n1 Hard drive \n2 Input 3 LCD screen \nvx. \nEXAM SKILLS \n19 Tell students to complete this exercise, using the skills and \nknowledge acquired from the lesson . \n1 Professional \n3 Full-time \n2 Honours \n4 Doctoral degree \nm \n\nWRITING \nOUTCOMES \n•\ngenerate ideas about a topic and express your opinion\nclearly\n•\norganise your essay in a logical order\n•\nproofread your writing effectively.\nOUTCOMES \nFocus students' attention on the outcomes of this lesson, which \ndeal with Part 2 of the Writing. The first aim is to teach students, \nhow to generate ideas and express their opinion clearly, which \nare the key requirements of this task. \nThe second aim focuses on structure, and helps students order \ntheir essay in a way, which will be easily understood by the \nexaminer. \nThe third aim, practises proof-reading skills and reminds \nstudents that they need to check their essays carefully, once \nthey have finished writing. \nLEAD-IN \nIn Part 2 of the writing test, students are required to give their \nopinion. In preparation for this task type, it is a good idea \nfor them to practise discussing different topics or perhaps \nhaving debates with classmates or friends. Elicit the meaning \nof debate (discussion or argument about a subject, e.g. a \npolitical debate) \n01 Tell students to complete Exercise 01 using the expressions \nin the box. \nThis activity provides a lot of scope for extended \ndiscussions. There are several different topics, so depending \non time available you might find it useful to allocate one \nor two questions to different pairs. Go round the class and \nmonitor and support the discussions. Make a note of pairs \nwho are generating a lot of useful language and give them \nthe opportunity to perform in front of the class, if they are \nwilling. Encourage students to give feedback to their peers \nafter the pairwork. \n02 It is important that students realize that only some of the \nexpressions in Exercise 01 can be used in written English. \nTell students to complete Exercise 02 individually and then \nagree the expressions whole class. \nFor me, To my mind, Personally, I think \nThis section of the lesson teaches students how to express \ntheir ideas clearly, by structuring their essays well. \n03 Tell students to complete Exercise 03 by allocating \nstatements 1-9 to the introduction, main body or \nconclusion. If students need support with this, tell \nthem to allocate the obvious ones first and then tackle \nthe rest. \nE.g. Introduction- introduce the topic-summary of your main\nideas, conclusion .\n• \nI \nd \n. \nIntro uct1on: 5, 6, 7, 9 \nMain body: 2, 3, 4 \nConclusion: 1, 8 \n04 This exercise demonstrates how this suggested structure \ncan be put into practice. \nI \nAlternative \nWith a weaker class, first ask students to assign each \nparagraph to one or more of the statements in Exercise 03. \nDraw students' attention to Tip 4, stating that in order to \nachieve a good score, they must express their opinion at \ndifferent points throughout their essay. \nThis final section of the lesson focuses on teaching students \nto check their work. As stated in the information section, it \nis easy for them to make silly errors, especially under exam \nconditions. Discuss with students how long they currently \nspend checking the aspects mentioned in the information \nbox (spelling, grammar etc.). \nOS Tell students to read the sample answer in Exercise 05 and \ncorrect the mistakes. There are 19 in total and cover all the \naspects mentioned in the information section. \nAlternative \nHave students do the correction activity in groups. To \nfacilitate this, enlarge a copy of the sample answer and ask \nstudents to use the following correction code: \nP- punctuation\nG- Grammar\nSP- Spelling \nAfter completion of the task, have groups swap answers and \ncheck that they agree with the corrections other students \nhave made. \nUsing a marking code is also useful when you mark their \nessays, as it tells students what type of error they have \nmade, but still leaves them to correct it themselves. \nNowadays, many parents are choosing to home­\nschooling their children rather than sending them to a\nprivate or state school. There are perhaps many reasons\nfor this, but I believe the main reason is that many schools \nare not seen as safe any more. In some areas, schools can \nbe very violent and fighting is a common problem. I do \nnot believe that home-schooling is always more beneficial \nto the student than state school, but in some cases it can \nbe. In the following essay, I will discuss this idea further.\nIf you are lucky enough to be able to attend a good school, \nwith only minor discipline problems, then I think attending \na state school is better for you than being educated at \nhome. School is more than just \eaming about different \nsubjects, it is also a place where you can meet new friends \nand learn to socialise. School also gives you the opportunity \nto join teams and clubs. Subjects are also taught by people \nwho have been trained in that particular area. \n\nIf however, this is not the case, and you have to attend a \nschool with poor discipline or somewhere you feel very \nunhappy, then home-schooling could be more beneficial. \nIt is better to learn in a comfortable environment, where \nyou feel safe than in a disruptive one. In order for home-\nschooling to be successful however, your teacher needs \nto be knowledgeable and follow a set curriculum. \nTo summarise therefore, home-schooling is more \nbeneficial if the child is in a situation which is making \nthem very unhappy. \nEXAM SKILLS \n06 Tell students to complete this timed exam task using the \nskills and knowledge acquired during the lesson. As stated \nin Tip 6, remind students that the neater their handwriting, \nthe easier it is for the examiner to read. \nTell students you will be looking for the following: \nClear expression of ideas \nOverall accuracy \nWell structured essay \nClear handwriting \nTry and use the error code suggested to mark their essays. \nYou may also need the following: \nWW- wrong word \nWO- word order \nSample answer \nM- missing word\n?- Not clear \nRW- try re-writing \nR- register\nThe majority of students start their degree in the same \nyear as finishing school or college. Some students, \nhowever, choose to take a year out before starting \nuniversity. In my opinion, this is a very good idea if \nthe time is used wisely in order to gain new skills or \nknowledge. In the following essay, I will discuss this idea \nfurther. \nIt is very important that, when a gap year is taken, the \ntime is not wasted but used productively. It would not \nlook very impressive to a future employer if the time was \nsimply used to take a break. This does not mean to say \nthat a gap year should not be enjoyed. \nMany people choose to go travelling during their gap year. \nThis can be very beneficial to the individual as it exposes \nthem to new ideas and cultures. It can also mean that \nthey are able to learn a new language. Other students \ndecide to gain work experience during this year. This can \nbe particularly useful, especially if connected to their \nchosen area of study. often, students who have worked \nbefore attending university appreciate their course more, \nas they are able to understand the relevance of what is \nbeing taught. \nOverall, therefore, as discussed in this essay, there can be \nseveral benefits to taking a gap year. It is very important, \nhowever, that this time is used wisely and not wasted. \nThis means that the year needs to be planned carefully in \nadvance to get the most from the experience. \nAlternative \nIf you want to add a fun element to this exam task or give \nstudents extra support, ask them to have a debate on the \ntopic first- either as a whole class or in pairs. Have students \ncollate key vocabulary and phrases on the board. This \nwould give them a range of ideas for the content of their \nessay. \nLISTENING \nOUTCOMES, \n•\nlisten to understand a description\n•\ncomplete a chart, diagram or sentences based on a talk\nor dialogue\n•\nuse notes to follow what a speaker is saying.\nOUTCOMES \nDraw students' attention to the outcomes of the lesson. In this \nunit students will learn about three task types; chart completion, \ndiagram completion and sentence completion. In the exam, \nstudents could be asked to complete one of these by listening to \nan academic lecture or dialogue. This lesson will teach students \nhow to follow both of these and identify key elements. \nLEAD-IN \n01 Tell students to look at the pictures and the table in Exercise 01. \nIn order to introduce students to the topic of the recording, \nask them to discuss what age is associated with different \ntypes of schools in the UK. Students could start by \ndiscussing the places in the photos: (nursery school & sixth­\nform college) \nExtension \nStudents could also compare and contrast the school \nsystem in their own country with the one in the UK. What \nare the similarities/ differences? \nTell students to listen to the short conversations and write \n1-7 next to each type of education. Draw their attention to\nthe example. For a weaker class, play the recording more\nthan once and/or stop after each conversation.\nAlternative \nPlay the recording in sections and ask students to listen \nto each conversation separately and write down the key \nwords. They then discuss these words with a partner before \ncompleting the first column of the table.`,
    60: `Conversation 1 \nA: \nI'm sorry to hear that you didn't get the grades to get \ninto university. What are you going to do now? \nB: \nI'm not sure. I can take my exams again at the local \ncollege, but I'm not sure if I want to do that. Maybe \nI'll take a vocational course there instead to learn the \nskills for a particular job, like accountancy or business \nstudies. At least if I pass that, I can go straight into work . \n•\n\nConversation 2 \nA: \nSo how's Jenny settling down? It's always difficult \nwhen they start school. My son, Timmy, took weeks to \nget used to being away from me all day. \nB: \nOh, she's fine. She loves it, especially learning to \nwrite. She doesn't miss me at all. I'm the one with the \nproblem. I really miss her being at home all day. But \nafter all, it's the law - she has to go! \nConversation 3 \nA: \nI've found this evening course in photography at my \nlocal centre. It's two evenings a week and only costs \n£150 for the term. You've always been interested in \nphotography as a hobby. Why don't you come too? \nB: \nOh, I did that course last year. It's really good. I'm \nplanning to take a course on setting up a website, so \nthat I can display all my photos. It does seem strange, \nthough, to be learning something new again after so \nmany years! \nConversation 4 \nA: \nI think it's really useful for them to start early. I know \nit can be expensive, but it's worth it because they \nalready know what it's like to be with others in a class \nwhen they start school. \nB: \nThat's true. In my case, it's not just the benefits of \nsocialising with other children, it also means I can go \nback to work. It's a pity I can't get a free place for my \nson - though I don't have to pay very much, thank \ngoodness. \nConversation 5 \nA: \nWell, my daughter is off tomorrow to start her degree \ncourse - a whole new adventure in a new city. I'm \nnervous, but she's really thrilled about it. There's a \nweek for the new students - it's called freshers' week \n- when they find out what they need to know, join\nclubs and get used to being away from home, and \nthen the course starts the week after. \nB: \nWell, don't worry. I'm sure she'll be fine. After all, she's \n18 now and they all have to make their own way in the \nworld sometime. \nConversation 6 \nA: \nI'm a bit worried about my son. He's not doing very \nwell. The thing is he needs to understand that it's \nnot like his last school, when he did everything in \nthe same class. He has to make sure he knows his \ntimetable and gets to the right classroom on time. \nHe keeps getting to class late and not doing his \nhomework. \nB: \nDon't worry. It often takes time for them to adjust to \nthe idea of having more responsibility. I'm sure he'll \ndo better when he settles down. \nConversation 7 \nA: \nMy son passed all his GCSE exams and wants to go to \nuniversity in two years' time. We can't decide whether \nhe should continue at his school or go to that new \ncollege near our house. What do you think? \n• \nB: \nWell, the college has taken the best kids from the local \nschools since it opened two years ago and almost \nall of them have passed their A levels and gone on to \nuniversity, so I think it's really good. Also, it makes \nthem feel more grown-up when they go there. \n02 There is a lot of written information for students to become \nfamiliar with before they listen to the recording. With \nweaker groups you could adopt a kinaesthetic approach \nand provide groups with the texts on cut-up slips of paper \nand ask students to label each with a type of school before \nthey listen to the recording. \n01-02\nNursery: 4, E \nPrimary school: 2, F \nSecondary school: 6, D \n. Sixth form college: 7, G \nFurther education: 1, C \nUniversity: 5, A \nAdult education: 3, B \n03 Tell students to read the table carefully and then complete \nthe task, by choosing from the words in Italics. Give \nstudents the first example and make sure they understand \nthe meaning of italics. As stated in the information section, \nthe ages mentioned will help students follow the lecture. \nWith weaker groups you might do the reading in pairs \nfollowed by feedback to the whole class. This section of \nthe lesson shows students how to tackle a chart/diagram \ncompletion task. Draw students' attention to Tip 3, stating \n-that before completing this task type, students should first\nstudy the diagram or chart carefully, and predict the type of \ninformation which is missing.`,
    61: `Lecturer: The British education system is not the same \neverywhere in the UK. Scotland has its own \nsystem, and while Northern Ireland has the same \nbasic system as England and Wales, there are \nsome differences. Because of this, I'm going to \nfocus mainly on England and Wales. \nThe system in England and Wales is divided \ninto three main levels: primary, secondary \nand tertiary. In the first part of my lecture, I'll \ntalk about the primary and secondary levels \nup to the age of 16, and in the second part I'll \ndiscuss the options between 16 and 18. Then, \nfinally, I'll talk about tertiary, or 'higher' level \neducation. \nAs in most similar countries, education at school \nis compulsory between the ages of five and 16. \nPupils can leave school at 16 but they must \nstay in an approved learning environment until \nthe age of 18. This can be full-time education, \na job or volunteering combined with part-time \nstudy, or an apprenticeship, sometimes called a \n'traineeship'. Before the age of five, children can \nattend nursery, though they don't have to attend \n\nany educational institution at all before the age \nof five. However, when they reach the age of \nfour, they usually start school in an early class \ncalled 'Reception', which helps them to adjust to \nregular schooling. \nPrimary school runs from the ages of five to 11. \nThe first part of primary school, between the \nages of five and seven, is traditionally known as \n'infant school' and this is where children learn to \nmanipulate numbers, read and write. Traditional \ninfant schools offer an informal education using \nchild-centered techniques. The second part \nof primary school, from seven to 11, is known \nas 'junior school'. The education system has \nundergone various changes in the last 30 years, \nmost notably with the National Curriculum, \nwhich was put in place in 1988 to specify a set of \ncore main subjects that all school pupils have to \nstudy. These subjects have to be assessed at four \nkey stages up to the age of 16. At certain stages, \nthe children take exams known as 'Standard \nAssessment Tests', or 'SATS'. These tests are \ndesigned to check the pupils' progress against \nthe national standards, as well as to provide \nteachers and parents with an assessment of their \nschool's performance. \nKey Stage 1 assessment comes at the age of \nseven, when the pupils do their first 'Teacher \nAssessments'. Key Stage 2 comes at the age of \n11, when the pupils are ready to leave primary \nschool. Although teachers assess their pupils' \nprogress throughout primary school, at the end \nof Key Stage 2, unlike in Key Stage 1, pupils have \nto take 'Standard Assessment Tests'. Key Stage 3 \nis reached after the first three years in secondary \nschool, when the pupils are 14. However, this \ntime, the students are assessed directly by the \nteachers and not by sitting national tests. These \nassessments help teachers, students and parents \nto decide which subjects the students should \nchoose to prepare for Key Stage 4, when they \ntake exams which will help decide their future \ncareer choices. Unlike SATS, these assessments, \nknown as 'General Certificate of Secondary \nEducation' exams, or 'GCSEs', are not primarily \ndesigned to assess progress or give schools an \nofficial statement of their performance, but \nto provide students with their own personal \nqualifications. \nThe National Curriculum defined a set of \ncompulsory subjects. These are subjects which \nthe law requires all students to study. There are \nalso some subjects which pupils and students \nhave to study at different stages. For example, \nModern Foreign Languages start in primary \nschool, and continue up to Key Stage 3, after \nwhich they're optional. In secondary school, \nstudents take Citizenship from Key Stage 3. \nWhen they enter Key Stage 4, pupils are allowed \nto make more choices. For example, all learners \nhave to take History and Design and Technology \nup to the age of 14, but then they can choose \nwhether to continue them or not. \n1 Reception \n2 Infant \n3 Junior \n4 Standard Assessment Tests \n5 Teacher Assessments \n6 General Certificates of Secondary Education \n7 Modern Foreign Languages \n04 This exercise requires students to do a diagram completion \ntask. Tell students to listen to the lecture and complete the \ngaps using only one or two words. \nAs stated in the previous exercise, remind students to study \nthe diagram carefully before attempting to complete the \ntask. Play the recording more than once if needed. \nI \nAlternative \nIn pairs, ask students to predict the missing information, \nbefore you play the recording.`,
    62: `Lecturer: Now I'd like to turn to educational opportunities \nbetween the ages of 16 and 18. There are various \nchoices open to pupils of this age. The first thing \nto decide is whether to start work or to continue \nstudying full-time. Of course, starting work means \ngoing straight into employment, although young \npeople aged between 16 and 18 will still need \neither to study part-time, as well as doing their \njob, or to join an apprenticeship or traineeship \nscheme. \nFor those who want to continue studying \nfull-time, there are two paths: academic and \nvocational. Academic qualifications, mainly \nAdvanced level exams, known as 'A levels', are \ntaken by students aiming for university study. \nVocational qualifications, such as those offered \nby the Business and Technology Education \nCouncil (or 'BTEC' for short), prepare pupils for \na specific profession, such as engineering or \ncomputing. Most of those who wish to continue \nacademic studies will go to the sixth form in \ntheir school or a specialist sixth form college. \nAlternatively, they can study A levels at a further \neducation college, also known as an 'FE' college. \nEither of these routes will take students to \nuniversity. On the other hand, those who wish \nto study a vocational qualification will typically \ngo to a Further Education college, and, after \nqualifying, will be ready for employment. \nThere are other options for those who want \nto start work at 16. Since 2015, young people \nbetween the ages of 16 and 18 must continue \nto learn in a specified learning environment, \nin addition to working for an employer. The \nfirst option is to work for an employer and \nstudy part-time for a vocational qualification, \nsuch as a National Vocational Qualification \n•\n\n(or NVQ for short). The second is to apply \nfor an apprenticeship or traineeship. With \napprenticeships, young people get to work with \nexperienced staff and gain job-related skills. They \nearn a wage, although this is typically less than a \n'regular' employee, and get to continue studying \npart-time - usually one day a week. They study \ntowards a qualification related to the job they are \ndoing and their apprenticeship can last anywhere \nbetween one and four years. Almost always, \nthey a re offered a permanent job by the same \nemployer at the end of their apprenticeship. \n1 Academic \n4 Employment \n2 · Further education / FE \n3 University \n5 Apprenticeship \nOS This task requires students to listen to a text and then \ncomplete sentences by choosing the correct word. With \nweaker groups have students read the sentences in pairs \nand ask them to say what they are about whole class. Get \nthem to highlight the words they have to choose from each \ntime. With some very weak students you may need to clarify \nthe meaning of some of the choices (What is provisional/ \nconditional?).`,
    63: `Mr Green: So, Amanda, you want me to help you with \nyour application. Let's have a look at the UCAS \nwebsite. Do you know what 'UCAS' stands for, \nby the way? It's the University and Colleges \nAdmissions Service. Have you set up an account \nwith them yet? \nAmanda: Yes. I did it last week, but I haven't completed \nmy application. One thing I need to know is how \nmany universities can I apply to? \nMr Green: Well, first of all, you need to see how many offer \nthe course you want. Remember, you'll want \nto choose the universities, which have the best \nreputation, but you need to have some kind \nof back-up in case you don't get into your first \nchoice. What are you studying? \nAmanda: I'm doing A levels in Biology, Chemistry \nand Psychology, so I'm thinking of taking \nBiochemistry. \nMr Green: OK. Well, there are seven good choices I could \ngive you. Apart from Oxford and Cambridge, \nImperial College in London is very good, and York \nis also a good possibility and easier to get into. \nAmanda: OK. I don't think I'll get into Oxford or Cambridge, \nso I can include York and Imperial College. \nMr Green: OK. I think you should go for those two, plus \nthree others, because the maximum number \nthat you can put on your application is five. How \nabout Durham, Sheffield and Exeter? \nAmanda: OK, I'll look at those. Another thing I'm not sure \nabout is how to make a good assessment of \nmyself and my skills and abilities. I've always \nfound that difficult . \n• \n. \nMr Green: You mean your 'personal statement'? Well, just \nbe honest. I can help you phrase it so that it \nreads well, but you need to note down what you \nwant to include. If you can do that by Friday, we \ncan write it up together. \nAmanda: That's great! Thanks. \nMr Green: Well, that's what I'm here for - to give you the \nadvice that you need. After you've comp\eted \nyour application, I can add the reference and \nyour predicted grades before sending it to UCAS. \nAmanda: Great! After we send it in, what happens next? \nMr Green: Well, UCAS processes your application and \nsends it on to each university that you've \nchosen. Then the universities assess it \nand decide whether to make you an offer. \nRemember that your predicted grades are \nonly provisional, which means they are not \nconfirmed until you get your actual results, \nso you need to pass the exams to actually \nget those grades. Usually any offer from a \nuniversity will be a conditional offer. That \nmeans they can't give you a definite offer \nbecause it depends on your final grades. Then, \nwhen your exam results come through, they get \nsent to the school here and the universities. \nAmanda: Do I have to contact the universities to ask them \nabout my application? \nMr Green: No. They'll contact UCAS about their offer. If \nyou meet the predicted grades, they'll usually \nconfirm the original offer, but if not, they don't \ntend to renew it or change it. \nAmanda: Oh, I hope that doesn't happen. But if it does, \nwhat can I do? \nMr Green: Well, if you don't get a place at any of your \nchosen universities, you can take a year off and \ntry reapplying next year. Alternatively, you can \ntry to get a place through 'clearing'. This is a way \nuniversities fill remaining places on their courses \nand it's a second chance for students to get into \nanother university if they didn't succeed with \nany of their chosen ones. It's a sort of safety net, \nbut I hope it doesn't come to that. \nAmanda: Well, thanks for your help. I'll complete my \napplication and then come and see you on \nFriday. \nMr Green: Glad to help, Amanda. See you then. \n1 five \n2 statement \n3 reference \n4 conditional \n5 confirm \n6 clearing \n06 As demonstrated in the previous exercise, it is very \nimportant that students are able to follow a conversation \nand they are not confused all the extra information. Tell \nstudents to listen to this conversation and choose the \ncorrect set of notes for 1-5. Simplify the task for weaker \nstudents by focusing their attention on the choice of \npossible answers each time.`,
    64: `Dr Harris: Hi, Terry. Come in. What can I do for you? \nTerry: \nHi, Dr Harris. Well, I just wanted to check on \nsome information about the course, as it's all \nnew to me. \nDr Harris: Of course. What do you need to know? \nTerry: \nWell, first of all, I'm not sure exactly what a \nseminar is for. We never had them at school. \nI know it's to discuss things together, but is it \nmore than that? \nDr Harris: Well, yes, you're right, it is really. You see, at \nuniversity we typically have lectures, you know, \nwith about 100 or 200 students in the lecture \ntheatre together. It's a one-way form of learning. \nThe lecturer sets out the topic and discusses it \nand you take notes. Then you need to review \nyour notes following the lecture and also do \nsome extra reading. \nTerry: \nAnd where does the seminar fit in? \nDr Harris: It could come at any time once you've had some \ntime to think about the lecture. When you attend \nthe seminar, you should have some of your \nown ideas to discuss with the other students, \nusually up to ten of you. It allows you to discuss \nthe topic, exchange ideas and prepare for your \nassignments. \nTerry: \nOK, thanks. And what about tutorials? Are they \nlike seminars? \nDr Harris: Well, usually we try to space them out over the \nterm, so that we can have a chance to check on \nyour progress and how well you're doing with \nyour assignments. It often depends on when \nyour tutor is available, and at times that might \nmean you have three weeks between tutorials. \nNormally every term you should have one at the \nbeginning, then usually another four, spaced out \ndepending on your programme, and one before \nthe holiday. So that works out about one every \ntwo weeks. \nTerry: \nRight. And what about assessment? How many \nexams do we have to do? \nDr Harris: Well, that varies from course to course, but \ngenerally we focus on continuous assessment \nmore than exams, though exams are, of course, \nvery important too. We tend to assess you over \nthe first two years through your assignments, \nwhich is over half of your overall assessment, \nusually 60%, and then most of your exams will \ncome in the final year. \nTerry: \nOK, I'm happy with that. I get really nervous \nbefore exams. And talking about assignments, \nhow long should they be? \nDr Harris: On all undergraduate courses, students tend \nto write about 3,000 words or so, but it varies \ndepending on the question. However, there's a \nminimum of 2,000, and while there's no upper \nlimit, you should be careful that you don't write \nTerry: \ntoo much as a lot of that might not be relevant to \nthe question. \nSo I should aim for between two and three \nthousand as a rule ... there's one last thing I \nwanted to check about assignments, and that's \nreferences. How many do we need generally? \nDr Harris: Well, as your course is international finance, you \nhave to use banking, finance and news sources \nas well as academic sources. Ideally, you should \nhave around ten.references for each assignment \nto show that you've read widely, but we expect \na minimum of five sources which are academic \njournals and books. From the other sources, \nwe'd generally expect three to be used. \nTerry: \nOK, thank you Dr Harris. That's cleared up a lot \nof things for me. \nDr Harris: Glad to be of help, Terry. See you next week. \n3 a \n4 a \n5 b \nEXAM SKILLS \n07 This sample exam task practises sentence completion. Tell \nstudents to complete questions 1-5 with no more than two \nwords. Suggest that students should read the sentences \ncarefully and try to predict possible answers before they \nlisten.`,
    65: `Dr Ross: \nSo, Jessica, congratulations! You got a first class \ndegree. I always knew you could manage it. What \nare your plans now? \nJessica: \nThank you! I couldn't have done it without all \nyour help. Well, I'm not sure. I'm still thinking \nabout the possibilities. I'm not sure if I want to \nteach or go into research, or even find a position \nin a company, perhaps. \nDr Ross: \nWell, anyone with a degree in Chemistry will \nalways be in high demand. Have you thought \nabout teaching? \nJessica: \nYes, but don't you need a degree in education to \ndo that? \nDr Ross: \nWell, many teachers do that, but, of course, you \nhave to be sure that you want to teach before \nstarting your degree course. In your case though, \nyour main route into teaching would be to do \na Postgraduate Certificate in Education. That's \nanother year of study, and you'll learn everything \nyou need to know about teaching, while also \ngetting teaching practice in your subject at local \nschools. You could study that here if you want. \nJessica: \nThat sounds like a good idea. I'll think about it, \nbut I feel I have more studying to do in chemistry \nbefore I think about teaching it. \nDr Ross: \nThen you could always take a Master of Science \ndegree. That will allow you to specialise in a \nparticular area of chemistry, but if you want to \n•\n\nteach in secondary schools, you won't need to \nhave such a specialisation. It's up to you. \nJessica: \nYes, I see. Actually, I've often thought of doing a \nresearch degree. \nDr Ross: \nThat would be a very good idea, but remember \nthat it will take you at least three years to \ncomplete that. It would probably be better to do \na Master's degree first and then transfer onto a \nPhD course. It also costs a lot, and you may need \nto fund yourself while you're studying. Have you \nthought of going straight into work? \nJessica: \nYes, I have, but I'm not sure if that's the best \nchoice for me. \nDr Ross: \nWell, you could try doing a company internship \nfor a few months. A company internship is a \nchance to work in a company without actually \nbeing an employee, but possibly with some \npay. It'll give you a chance to develop your \ncareer and also learn more about your subject \nspecialisation in a commercial environment. \nAfter that, you may well get a good position in \nthe company. We have some good commercial \ncontacts for internships here. \nJessica: \nThat might be the best option, but I wouldn't \nearn much to begin with, would I? \nDr Ross: \nNo, you wouldn't. You could try getting a \npermanent job now if you want. There's a \ngraduate fair here in the city every year, as well \nas in other cities around the country. You'll have \nthe chance to meet all the leading companies in \nthe sector and discuss opportunities with them. \nJessica: \nIt's worth considering. Well, I have a lot to think \nabout. Can I meet you again next week? \nDr Ross: \nOf course. Just send me an email and let me \nknow when would be a good time. \n1 Postgraduate Certificate \n3 research degree \n5 graduate fair \nSPEAKING \nOUTCOMES \n•\nspeak in detail about education\n2 Master ... Science \n4 company internship \n•\nconsider reasons, causes and effects for different\nSpeaking Part 3 situations\n•\nmake suggestions or recommendations.\nOUTCOMES \nDraw students' attention to the aims of this unit. The overall \nfocus of this lesson is to teach them how to speak in detail \nabout the topic of education; a subject which can arise in any \npart of the exam . \n• \nThe second and third aims of this unit deal with Part 3 of the \nSpeaking, when students could be asked to discuss some or \nall, of the following: reasons, causes/effects, suggestions and \nrecommendations. In order to make clear to students the \nmeaning of each, write the following on the board and ask \nthem to label each one. \nI could help you with your homework, if you are having trouble. \n(suggestion) \nI don't have my homework because the dog ate it. (reason) \nIf you don't attend your classes, you won't pass the exam. \n(cause/effect) \nYou should read this book. It will really help with your essay. \n(recommendation) \nLEAD-IN \n01 Tell students to discuss questions 1-4 with a partner. This \nactivity provides a lot of scope for extended discussions. \nThere are four different questions, so depending on time \navailable you might find it useful to allocate one or two \nquestions to different pairs. Go round the class and monitor \nand support the discussions. Make a note of pairs who \nare generating a lot of useful language and give them the \nopportunity to perform in front of the class, if they are \nwilling. Encourage students to give feedback to their peers \nafter the pair work. \nI \nAlternative \nAs a whole class collect feedback on questions 2 and 4. \nExercises 02 & 03 introduce some useful vocabulary on the \ntopic of education. \n02 Tell students to look at the words in the box and describe \ntheir meaning to a partner. With a weaker class, encourage \nstudents to look up unknown words in a dictionary and \ndiscuss the meaning as a whole class. \nTell students to complete the sentences 1-5 using words \nfrom the box. \nteachers, discipline \nacademic, private tutors \ntechnical, graduation \n2 tests, grades \n4 curriculum, essays \n03 Tell students to complete Exercise 03 using their own ideas \nand words from the box. \nIt may be useful to give students a short example first. \nDraw students' attention to Tip 3, stating that education is a \ncommon topic in IELTS and may feature in Parts 1, 2 or 3 of \nthe Speaking. \n04 Exercises 04 & 05 give students practice at expanding their \nanswers, by providing reasons for their opinions. This is \nparticularly useful for Part 3 of the test, when students need \nto speak at length about a topic. \nIn pairs, tell students to read the opinions in Exercise \n04 and then brainstorm reasons to support these ideas. \nChoose one of these statements to provide an example on \nthe board. \ne.g. 1. technology is making education more stressful.\n\nideas: sometimes it does not work / people become too \nreliant on it I students can use it to cheat I it costs a lot of \nmoney \nDraw students' attention to Tip 4, stating that in order to \nspeak at length on any given topic, they must have a wide \nvocabulary. \nOS Exercises 06 & 07 discuss cause and effect. Elicit or feed the \nmeaning of this, as outlined at the beginning of the lesson. \nIn Speaking Part 3 students may well be asked to talk about \ncause and effect, in relation to a particular topic. \n06 Tell students to read the problems described in the table \nand complete the causes column. \nSample answers \nProblem \na Parents have to \nspend a lot of \nmoney on private \neducation. \nb Students do not \nhave enough free \ntime to socialise. \nc Many students \nhave reported that \nthey are unhappy \nwith studying \nEnglish. \nCauses \n1 Because students are under \na lot of pressure to get good \ngrades. \n2 As schools do not cover all of \nthe subjects in depth. \n3 Because our society is very \ncompetitive. \n1 Due to the fact that they have to \nstudy from morning until night. \n2 Because they have to prepare \nfor their,exams. \n3 As our parents force them to use \ntheir free time to study. \n1 As they have to spend a lot \nof time memorising lists of \nvocabulary. \n2 Because it is considered as \nmore important than their \nnative language. \n3 Due to the fact that it is difficult \nto learn a foreign language \nquickly. \n07 Tell students to change partners and then focus on a \ndifferent table, completing the effects column. \nSample answers \nCause \na Because students \nare under a lot of \npressure to get \ngood grades \nEffect \n1 Parents have to spend a lot of \nmoney on private education. \n2 Their teachers are very strict. \n3 They finish studying at 11 pm. \nb Due to the fact that \n1 Stedents do not have enough \nwe have to study \n     67: `Examiner: In your opinion, what is the effect of private \ntutoring on education? \nStudent: \nI think we have an education system where \nthose who have lots of money do better than \nthose who haven't, because many students \ncan't afford private tutors. The tutors teach \nthings at a higher level than the school \ncurriculum, so many students see regular school \nas a waste of time. That's not really fair, so the \ngovernment should change the law to limit the \ncost of private tutoring, so that it's more equal \nfor everybody. \nExaminer: Is private tutoring more important today than it \nwas in the past? \nStudent: \nWell, I think that private tutoring is certainly \nmore important now than in the past. I mean, in \nthe past we only had tutors for English lessons \nas it was hard to find people who spoke English \nwell enough to teach conversation in schools. \nBut now we have tutors for everything, even \ntutors who teach three-year-olds how to pass \ninterviews. Perhaps things have gone a bit too \nfar now. \nExaminer: What more can governments do to reduce the \nneed for private tutoring? \nStudent: \nI think that governments must make changes \nto the curriculum so that schools cover all the \nsubjects that are usually taught by private \ntutors, like English conversation, art, music and \nother things. If we can get these subjects taught \nmore in schools, then students might not need \nto go to private tutors to learn them. \nExaminer: How can we encourage more parents to teach \ntheir children at home? \nStudent: \nI know that parents are very busy, but they \n• \nat least have free time at the weekend. This \ndoesn't mean that they should spend their \nweekends making their children memorise lists \nof vocabulary,. but perhaps if parents make time \nto do things like drawing pictures, reading, or \nlistening to music, then children will not need to \ngo to private tutors for those sorts of thing . \nSample answers \n1 people with money do better; students think school \nwaste of time; should limit cost of tutoring \n2 more important now; tutors for three-year-olds \n3 change curriculum to cover all subjects \n4 do things like drawing, reading, listening to music \nAfter students have listened to the recording, ask them to \nanswer the questions with their own ideas. \n\nREADING \nOUTCOMES \n•\nfind factual information in a text to decide if a statement\nis True, False or Not Given\n•\npractise identifying Not Given questions\n•\nrecognise and use the first and second conditional\ncorrectly.\nOUTCOMES \nDraw students' attention to the first two aims of this unit, which \ndeal with True, False or Not Given questions. For this task type, \nstudents need to read a factual text and then decide if the \nstatements given are True, False or Not Given. Particular focus \nis then given to Not Given questions, as these statements are \noften the hardest to identify. \nThe third aim focuses on the recognition and use of the first \nand second conditional. It is important students recognise their \nuse as they can have an important impact on the meaning of a \nsentence. Write the following sentences on the board: \n1. If I had the money, I would celebrate my birthday on the\nbeach. (2nd cond.)\n2. If I have the money, I will celebrate my birthday on the beach.\n(l5t cond.) \nAsk students which conditional is being used in each \nstatement? \nWhat is the difference in meaning between the two sentences? \n(1- unlikely 2- more likely) \nLEAD-IN \n01 Tell students to skim read the three short texts, which \ndescribe some of the most interesting festivals in the world. \nIn order to check understanding, ask students to describe \nthe main points of each festival. \n02 Tell students to complete exercise in pairs. Go round and \nmonitor the discussions and offer support if required. Make \na note of good ideas/use of language and feedback to the \nclass. Also, feedback anonymously on any common errors. \nAlternative \nRead through the first text as a whole class and discuss the \nquestions in Exercise 02. Students then divide into pairs and \neach read one of the remaining texts. Students then re tell \nwhat they have read to their partner and they both discuss \nthe questions in Exercise 02. \n03 Exercises 03-08 discuss True/False/Not Given questions, \na common feature in the Reading. As stated in the \ninformation section, this task type is similar to Yes/No/Not \n03 \n04 \n05 \nGiven questions, but instead of being opinion-based these \nquestions relate only to factual information. Make sure \nstudents know the difference between these two types. \nTell students to complete exercise 03, by choosing True/ \nFalse or Not Given. \nThe texts will not be as short as this in the exam, but this \nexercise will give students a clear idea of the task type. Draw \nstudents' attention to tip 3, which states that the questions \nare in the same order as the text. \n1 False \n2 True \n3 Not Given \nlimit \nadvertising \nAs demonstrated by answering these questions, students \noften need to look for synonyms in the text. \nAs stated in the information section, the hardest part \nof this type of question is probably understanding \nwhen the information is Not Given. It is important that \nstudents do not base any of the answers on their existing \nknowledge. All questions relate directly to the information \nin the text. \n06 Tell students to read the short text on Birthdays and then \nanswer the questions, which follow. This reading may tempt \nstudents to answer True or False, because the topic is well \nknown. In several instances however, the information is \nactually Not Given in the text itself. \n1 Not Given \n5 Not Given \n2 False \n3 True \n4 Not Given \n07-08 Tell students to complete Exercises 07 & 08, which aim\nto summarise the section on this task type. \n07 \n1 rely \n2 order \n3 same \n4 carefully \n5 synonyms \n08 \n1 False \n2 False \n3 True \n4 True \n5 Not Given \nGRAMMAR FOCUS: FIRST AND SECOND \nCONDITIONAL \nThis section of the lesson focuses on the first and second \nconditional. In terms of understanding a text, it is important that \nstudents know how they are used and their difference in meaning. \n•\n\nAlternative \nAsk students to re-read the first line of the text on Chinese \nFestivals. \nIf I could visit any country to be part of their celebrations \nand festivals, it would be China. \nElicit from students the following: \nDoes the speaker think they are likely to visit China? (No) \nWhich tense is used? First or second conditional? Why? \n(second conditional, as the speaker is not expecting to \nvisit China.) \nAsk students to discuss which country they would like to \nvisit for its celebrations and why? For example: \nIf I could visit any country to be part of their celebrations \nand festivals it would be Brazil. They have amazing street \nparties and everyone gets dressed up. \n09-10 Tell students to complete Exercises 09 & 10. \n09 \n1 b \n2 a \nb: second conditional \n3 a: first conditional \n5 present simple \n6 infinitive \n7 past simple \n8 would \n10 \n1 go, will be \n2 had, would/'d go \n3 have, will/'11 \n4 had, would/'d \n5 wears, will/'ll \nEXAM SKILLS \n11 Tell students to read the text and answer the questions, \nwhich follow. \n1 False \n5 False \n2 Not Given \n6 Not Given \n3 False \n7 True \n4 False \nEngage students in a whole class discussion of their \nanswers. Have them justify why they have chosen certain \nanswers and aim to arrive at a class consensus. \nWRITING \nOUTCOMES \n•\nidentify and approach a 'problems and solutions' essay\nquestion\n•\nplan and write an essay answering both parts of the\nquestion\n•\nwrite a suitable introduction and conclusion\n•\nrevise past, present and future tenses.\nOUTCOMES \nThis lesson focuses on the "problems and solutions" essay task, \nwhich can feature in Part 2 of the Writing exam. In this type of \ntask, students are given a problem and required to produce \nseveral solutions. This task type can be expressed in several \ndifferent ways, so this lesson teaches students how to recognise \nand answer it. \n• \nThe aims of the lesson also include teaching/practising with \nstudents how to structure this type of essay and write a suitable \nintroduction and conclusion. \nLEAD-IN \n01 Examples of the type of problems, students may be asked \nto write about, are given in Exercise 01 and relate to the \nunit topic, Festivals and Traditions. Ask students to discuss \nsolutions to statements 1-5 in pairs. If needed, discuss one \nof the statements as a whole class and draw a mind map on \nthe board illustrating possible solutions. \nE.g.\nNowadays many children do not appreciate the presents \nthey are given. \nDo not give children too may gifts. \nLimit present giving to birthdays/Christmas/ special \noccasions. \nParents should teach children to always say thank you and \nperhaps make thank you cards \nMonitor the pair work by walking round and making notes \nof any interesting solutions and share these with the whole \nclass afterwards. \n02 Exercise 02 gives students important advice on how to \nhandle this task type. Tell students to put a tick next to the \ngood advice and a cross next to the bad advice. \nGood advice: \n4 b \n5 a \nDiscuss the answers with the whole class to ensure there is \nconsensus about what constitutes good advice. \nThis section of the lesson concentrates on helping students \nstructure their essay, as this is key component to achieving a \ngood mark. Tell students to read the title carefully and then \nskim read the sample answer. \nAlternative \nIn order to give students practice at answering this type of \nquestion, they could do the following instead: \nread the question carefully and underline the key words \ndiscuss the question in pairs and brainstorm ideas \nwhole class feedback. \n04 Students could then read the sample answer and complete \nthe task on structuring \nTell students to complete exercise 04, by matching \ndescriptions a-e with each section. \nAlternative \nIn order to make this task more interactive for students, \nyou could enlarge the sample answer, delete the \nheadings (introduction, main body etc..) and cut out the \nfive different sections. Give each pair of students a copy \nof the five sections and 1Sk them to order the answer. \nIntroduction: e \nMain body: d, c, b \nConclusion: a \n\nOS This exercise focuses on writing a good introduction and \nconclusion. Making sure an essay starts and finishes well is \nessential, as it has a significant impact on the examiner's \nimpression of a student's essay. \nTell students to answer questions 1 & 2, which focus on the \nintroduction. \n1 too much about spending money "7 dominated by \nshops and companies ... large profits; could be done to \nchange the situation 7 offer some solutions \n2 I will discuss some of the problems ... also offer some \nsolutions \nI Advice \nAs demonstrated in questions 1 & 2, in the introduction \nstudents must rephrase the question and give an indication \nof what will be discussed. Students may need practise at \nrephrasing the question, as this is sometimes challenging. \nTell students to complete questions 3-6, which focus on the \nconclusion. \n3 the second, third and fourth paragraphs \n4 No \n5 No \n6 a recommendation \nDraw students' attention to Tip 5, stating that it is a good \nidea to include a prediction or recommendation in the \nconclusion of this essay type. In order to clarify the meaning \nof each, write the following on the board: \nI do not think you should spend too much money on gifts at \nChristmas- (recommendation) \nEventually people will stop sending cards in the post and \neverything will be done on line (prediction) \nAsk students if they can think of any other predictions/ \nrecommendations associated with the unit topic. \n06 Exercise 06 looks at the various ways in which this essay type \ncan be phrased/expressed. It is important that students are \naware of this, so they do not panic in the exam or waste time \ntrying to identify the essay type. \n1 suggest measures which could be taken to solve this \nproblem \nsuggest ways in which these issues might be tackled \nwhat can be done to minimise these bad effects? \nhow could these problems be solved? \n2 issues, negative aspects, bad effects \n3 D because it asks you to describe the reasons behind \nthe problems \n07 In this exercise students focus on grammatical accuracy and \nusing the correct tenses. \nTell students to read the sample answer and complete it \nusing the correct form of the verbs in the box. If needed, \ncomplete the first gap as a whole class. \n1 (will I shall) discuss 2 is given \n4 has passed \n5 want \n7 be ignored \nExtension \n3 close \n6 do \nIn preparation for the exam task, you could ask students \nto discuss what was good about this answer. Students \nneed to think about the following: structure, clarity \nof ideas, use of vocabulary, grammatical range and \naccuracy. \nEXAM SKILLS \n08 Give students this timed exam task. Remind or elicit from \nstudents the following: \nthey must allow time for planning at the beginning and \nchecking at the end \nthey must read the question carefully and make sure their \nanswer is relevant \nthey must include a strong introduction and conclusion \ntheir ideas must be expressed clearly using an easy to follow \nstructure \nSample answer \nPlanning a large family event or celebration can be a \nstressful experience. There are lots of things to consider \nand you need to make sure the plan for the event is \nsuccessfully communicated to everyone. In the following \nessay I will describe some of the problems you may \nencounter and suggest ways in which these may be \nsolved or avoided. \nPlanning a large event is perhaps difficult enough when \nyou do not know the people attending the celebration. \nWhen you do know the people coming, however, the \ntask can be even harder. For example, when organising \nan event for your family, your guests might have very \nparticular views on how they expect the event to be; \nwhat you should be eating and how the decorations \nshould be done. \nSecondly, because it is a family event, you will need to \nprovide food and entertainment for different age groups. \nYou may have very young children attending, together \nwith your elderly grandparents. \nThe solution to these problems is careful planning. \nYou need to plan early and make sure you have all \nthe information you need to organise your event. \nYou will need to know exactly who is coming so the \ndietary requirements of both young and old can be \ncatered for. You could also ask for opinions on the \nevent during the planning stages, so your guests feel \nmore included. \nIn conclusion, organising a large family event can be \nproblematic. Nevertheless, if you plan carefully and \ninclude relatives during the preparation stage, all should \ngo well. \n•\n\nLISTENING \nOU"FCOMES \n•\nclassify informati.oh as you listen\nO !iste . n carefully to complete sumrn.aries ahd tnu11..-,, ., \nOU"FCOMES \nThis unit focuses on helping students with table and summary \ncompletion tasks. In order to answer these questions \nsuccessfully, students must be able to read and identify the key \ninformation. This lesson teaches students how to interpret the \ntext/data they are given, before listening to the recording. \nLEAD-IN \n01 Draw students' attention to the pictures and ask them to \nlook at the table of events and match one of the events to \neach picture. \nClarify that students understand the different events and \nthen ask them which they would prefer to attend and why. \nThis will introduce and engage them in the topic of the \nlistening. \nTell students to listen to the recording and complete \nExercise 01. With weaker students, you might stop after \neach speaker and discuss the key facts which helped \nstudents to arrive at their answers.`,
    68: `Speaker 1: \nSo, in conclusion, we can say that, despite \nthe difficulties we had at the beginning, we \nmanaged to complete the programme over \nthe three days without any further problems. \nIn total, ten thousand attended the three \ndays and feedback suggests that the events \nwere exciting and produced true champions, \nespecially the athletics events. Next year \nwe'll have more money, so we're going to add \nnew events to increase the competition and \nparticipation levels. \nSpeaker 2: \nIt's clear, then, that the events didn't go as \nwell as originally planned, so we will have \n• \nto rethink our arrangements for next year. \nClearly, a large tent in the college grounds is \nnot ideal for an event of this type if we're hit \nby bad weather again, as we were with this \nyear's event. This caused a lot of problems \nwith the preparation of the dishes and the \ndisplay of the produce from different parts \nof the world. It also meant that visitors \ncouldn't really get a chance to try everything \non display. As a result, much of it went to \nwaste, which is something we have to avoid \nnext time. \nSpeaker 3: One of the main issues that we had with \nthis event was that the main attraction \nPaul Simmons, had to cancel at the las{ \nminute as he'd been suffering from a \nserious throat infection for a week and \nhadn't managed to recover in time. As a \nresult, we had to find another act, and \nmanaged to get Nicky Munroe at very short \nnotice. She performed magnificently, the \naudience loved her and that saved the \nfestival I would say. Everyone agreed that \nshe has an amazing vocal range. \nSpeaker 4: \nThe most successful aspect of the event was \nthe variety of products that were on offer. It's \nwonderful to see students being so creative. \nWe saw practical applications that'll make \nsignificant developments in education and \neven business if they go into production, as \nwell as very entertaining ideas, especially the \nrobot football game. I'm pleased to say that \nour college team won! \nSpeaker 5: \nI'm sure you'll all agree when I say that the \nquality of the talks and performances over \nthe last three days was very high. The talk \ngiven by the top novelist, Henry Peters, on \neffective plotting and characterisation was \nexcellent, and the audience will have learnt \na great deal to help them with planning \nand writing their future works. What's \nmore, the quality of verse produced in the \nworkshops was very high, and we hope to \nrun that again next time with greater overall \nparticipation. \nSpeaker 6: \nWhile there were some wonderful and \nfascinating works on display, I felt that there \nwasn't enough variety. Unfortunately, this \nwas because of the limited exhibition space \nwe had. This meant that we could only \nAlternative \nhave one room for portraits and another for \nlandscapes. We hope to extend that next \nyear into other forms, such as still life and \nabstract, but we'll have to see what rooms \nare available. We also hope to install clay \novens next year to give our students the \nchance to create their own pottery and \ndisplay it for the visitors. \nAsk students to listen again and make a note of the key \nwords, which gave them the correct answer . \n\nThis section of the lesson discusses the summary completion \ntask, which may feature in the listening. Draw students' \nattention to the information box, stating what the task is and \nhow students should approach it. \n02 Tell students to complete Exercise 02 and draw students' \nattention to Tip 2, stating that the information in the \nrecording is in the same order as the summary. With \nweaker groups you might focus students' attention on the \noverall context and the specific details that they will need \nto listen out for.`,
    69: `Dr Saunders: \nHello everybody. Welcome to this meeting \nto review this year's arts festival. As you \nknow, this is the fourth and biggest festival \nthat we've run at the university and it's \nclear now that it's fast becoming a fixture in \nthe calendar of the city and the county and \nattracting attention from the rest of the \ncountry, as well as from abroad. First of all, \nI'd like to review the preparations for the \nfestival, then go on to do an analysis of the \nfestival itself and how well it went. The plan \nis then for you to work in teams of three, \nwith one tutor and two students in each \nteam, and for you to discuss the festival \nin more detail so you can come up with \nsuggestions for the organising committee \nto consider for next year's festival. \nWell, as I said, we're in our fourth year \nand we added some new events. The first \nfestival focused mainly on music and the \nperforming arts, as it was felt that those \nwould be the best types of event for both \nstudents and the public to take part in. \nMore forms of art, in particular short films \nand photography, were added over the next \ntwo years and this year we have extended \nour offer to include painting and crafts, \nwith a particular focus on the students \nhere producing their own work, both for \nexhibition and competition. This was largely \nsuccessful, but I'll discuss that in detail \nlater. We also invited professional artists in \nsome of the fields to perform, and that will \nbe something for you to review for the next \nevent. What was particularly encouraging \nthis year, was that we had contributions \nto the festival from the highest number of \nstudents to date, with representatives from \nevery nationality at the university. \nAs in previous years, we planned to use \nthe spare university accommodation for \nall the visitors, both students and non­\nstudents, but as we expected a greater \nattendance at this year's festival, we also \narranged accommodation at the city \ncollege three miles from here and arranged \ncoach transfers between the college and \nthe university campus. Unfortunately, that \nproved problematic and we won't repeat \nthose arrangements next year. We also \narranged the catering both here and at \nthe city college and one of the new ideas \nwe tried was to experiment with dishes \nbased on different regional themes over the \nfive days. This allowed our international \nstudents ... well, the keen cooks among \nthem anyway ... to create the menus and \nwork with the catering company to produce \nbreakfast, lunch and dinner. \nOf course, one of the main aims of this \nfestival, apart from the obvious ones of \nextending the university's reputation and \ngiving our students the chance to take part \nin a wonderful event, was to help develop \nour young people's organisational skills \nand give them some experience of real \nwork, mostly as volunteers. Of course, we \nhad to pay for professional organisers to \nmake sure the festival ran well, but as our \nmoney was limited and we wanted to give \nas many opportunities to our students as \npossible, we made sure that they ran all of \nthe events themselves under the direction \nof the professionals and, of course, \nalongside the tutors. \n1 painting and crafts \n3 catering \n2 students \n4 volunteers \n03 Exercise 03 gives students an example of summary \ncompletion task. Before they listen to the recording, ask \nstudents to do the following in pairs: \nSkim read the text to identify the topic. \nUnderline key word. \nPredict the missing information and identify what type of \nword is missing (adjective, noun etc.). \nIf necessary, complete the first gap as a whole class. \nE.g. The\nevent was the most popular with many \ndifferent entries. \nAnswer could be noun and/or adjective \nTell students to listen to the recording and complete the \nsummary using up to two words and/or a number.`,
    70: `Dr Saunders: \nSo, now let me turn to the actual event \nand how it went. As I said, we had the \nbiggest offer of arts events in the four years \nwe've been running the festival. In total, \nthe number of visitors over the whole five \ndays was 12,500, which is a 10% increase \non the previous year and just over three \ntimes the number in the first year that we \nheld it. This clearly shows that we're going \nin the right direction by expanding the \nvariety of events on offer. The short film \nevent at the university cinema was the best \nattended, with entries from a wide variety •\n\n• \nof nationalities here at the university on \na number of fascinating topics. I think we \ncan all agree that the quality was excellent, \nas was the standard of the photography \nexhibition and the paintings in the art \ngallery. Our feedback from students and \nvisitors was very positive. \nHowever, there are three issues that we \nshould address in our discussions. First, \nWayne Rogers, our headline music act, had \nto call off two days before the event due \nto illness and we didn't have time to find \nanother act. Needless to say, all those who \nbought tickets for the main concert were \ndisappointed and we had to return their \nmoney. We need to discuss suggestions \nfor avoiding this in the future. Also, while \nwe had some good crafts on display, \nespecially the clothes, pottery, sculptures \nand glass objects, the exhibition was \npoorly attended, so we have to decide if it \nneeds to be changed or perhaps reduced \nin some way. The last issue involves the art \ngallery and, in particular, security. Although \nwe had attendants on duty all the time, \nthree paintings were stolen, much to the \ndisappointment of the artists who painted \nthem. They were valued at around £3, 000 \nin total, and the artists had expected to be \nable to sell them in the future, so we need to \nlook into this and think about how we can \nincrease security for next year, while also \navoiding any unnecessary inconvenience for \nour visitors. \nRegarding the arrangements for \naccommodation and catering, generally \nthings went well, but there were some \nissues with the accommodation in the city \ncollege. As there were a lot of late bookings, \nwe had to provide more accommodation \nthan we originally planned to do, with \nthe result that some people ended up in \naccommodation of a lower standard than \nthey expected. We apologised to them and \ngave them back part of their payments, but \nwe need to avoid this issue in the future, \nespecially as the festival is growing and \nwe don't want to harm our reputation. \nAnother issue was that, at certain times of \nthe day, there were not enough volunteers \non hand to help visitors, so we'll need to \nmake sure that we organise the availability \nof volunteers better next time. On the other \nhand, the transport that we organised \nwas excellent and the catering was highly \nappreciated, in terms of both variety and \nquality. So, I'd like you to think of more \nideas to extend the catering opportunities \nfor next year. \nThe last thing I want to focus on now is how \nmuch we spent. As I said earlier, we had \nbudgeted for £50,000 to organise the event \nand expected £50,000 in earnings from the \nevent, but the final balance sheet showed \nthat the event made just over £90,000, \nso we have some money to go into the \nbudget for next year, which is an excellent \nresult. However, I feel there are still some \nareas where we could cut our spending and \nperhaps reduce charges for visitors. Many \nof the volunteers felt that some of the paid \nhelpers that we brought in to supervise the \nactivities were not really worth the expense. \nThey felt that some of them did very little \nfor what we paid them and others didn't \nreally organise some of the events that \nwell, so I would welcome suggestions on \nimproving organisation while saving money. \nAlso, I feel that another good way of raising \nfunds is to get more business support from \nlocal companies, who could help the festival \ngrow by sponsoring events and advertising \ntheir products and services more around \nthe festival. Now I'd like to turn to ... \npoortyt/;bad ly attnded \ni4 .• low(er}Ioor(er)standard / quality\n6 .bLi.in.ess 'support \n04 Exercises 04 & 05 deal with the task type, which requires \nstudents to complete tables with words from the recording. \nAs stated in the information section, the key to this task, \nis for students read the table carefully before listening to \nthe recording. As with any completion task, students must \ntry to predict what type of information is missing before \nattempting the listening.`,
    71: `Dr Reynolds: \nSo, first of all, we need to look at the events \nand see what should be included in next \nyear's festival and what changes should be \nmade. Dr Saunders mentioned that there \nwere issues with the music and crafts. What \nare your feelings on those two issues? Do \nyou want to start, Sangita? \nSangita: \nWell, as regards the music, I think we need \nto have another artist in reserve in case the \nmain act can't perform, like in this year's \nfestival. It doesn't have to be a well-known \nband. It could be a small act, like a student \nband. What do you think, Lawrence? \nLawrence: \nYou have a point, but I'm not really sure if any \nartists wou\d be happy to perform only if the \nmain act lets us down. In any case, how often \ndoes that happen? This was the first time, and \nI don't see it happening again in the future. \nDr Reynolds: \nI'm not sure we can take that for granted, \nLawrence. If you look at what happened, \nwe lost £3,000 as we had to return money \n\nto the audience. I don't think anything bad \nwould have happened, but I think we need \nto bear in mind that our visitors are the \nmost important aspect of the festival and \nwe have to make sure we keep them happy \nat all costs. \nLawrence: \nHow about we arrange the programme \nso that on one night there isn't a famous \nheadline act but a good local band, so that \nwe can change the programme to make \nthem the main act if anyone else isn't able \nto perform. We could put them on the last \nevening, and tell them that they may be \nneeded on the other evenings, just in case. \nThat way, we're helping good local talent \nand making sure that our visitors are happy. \nSangita: \nYes, I can see that working. Then we could \nuse the student band to play the last night \nif we have to switch the local band from the \nlast night to an earlier night. \nDr Reynolds: \nOK ... good ideas. I'll make a note so that \nwe can take it back to the organising \ncommittee. Now, let's move on to the \nquestion of crafts. As we heard, the event \ndidn't go very well and lacked visitors. What \ndo you think we should do, Sangita? \nSangita: \nWell, I have a personal interest in this. I've \nbeen creating my own fashion designs \nand I had some clothes on display mixing \nWestern and Indian themes. Actually, I \nspent some time watching the visitors and \nI thought they liked clothes a lot. I think we \nhave to be careful to distinguish the clothes \nfrom the other crafts. \nLawrence: \nYes, I noticed that. I spent the third day \nin the craft section helping visitors and I \nnoticed that the clothes exhibition was the \nmost appreciated. I think the glass and \nceramic section had hardly any visitors \nwhen I was there. Perhaps we should just \nhave the clothes on display, maybe even \nextend that section? \nDr Reynolds: \nYes, that could be a good solution. I don't \nthink we should get rid of the glass and \npottery altogether, but I certainly think we \nshould promote the clothes section more. \nLawrence: \nWell, here's a suggestion: we could even \nthink of turning that into a separate fashion \nshow. What do you think of that? \nSangita: \nGood idea! I was thinking about that \nanyway. Can we put that to the committee? \nDr Reynolds: \nOf course. I've made a note of it. Regarding \nthe theatre and poetry, do you think we \nneed to make any changes? \nLawrence: \nNothing major, I don't think, but perhaps we \nshould use at least one day to present new \nplays and poems by our own students. It's \nwonderful putting on plays by well-known \nplaywrights and readings of well-known \npoets, but perhaps we should promote our \nown talent here in the university. It would \ncertainly help the performing arts students \nto expand their coursework, and we could \nhave a competition for the best new works. \nDr Reynolds: \nExcellent idea, Lawrence. What do you \nthink, Sangita? \nSangita: \nYes, but let's not limit it to just English. We \ncould also have performances from our \ninternational students in their languages. \nI think that would really help promote the \nfestival as an international event. \nDr Reynolds: \nFine. We can propose that as well. And as \nfar as the photography and cinema sections \nare concerned, they'll keep expanding. \nLawrence: \nWell, personally, I don't think the quality \nof the photography exhibition was very \nhigh. I think there are issues with digital \nphotography being presented as a printed \nexhibition. You can never really capture the \ntrue meaning of the photograph like that. \nI would suggest just having digital displays, \nyou know, tablets that visitors can use to \nsee the photographer's collection. That way, \nit'll encourage photographers to develop \ntheir ideas and think about their exhibits \nalmost as films with a story. I think that's \nthe way photography is going these days. \nSangita: \nI don't agree. I think each image should \nbe appreciated in its own way, as the \nphotographer intends. I don't think we should, \npush photographers into one direction. That \nsaid, I think the idea of having tablets and \ndigital screens is a good idea if we can afford \nit. Perhaps we could have two sections -\ndigital displays and non-digital displays. \nDr Reynolds: \nSounds good, Sangita. I can certainly put \nthat to the committee and see if they'll \nconsider it. So, if that's all about the \nevents themselves, I'd like to discuss the \norganisation of the festival ... \nl Student band \n2 Book local band for the last night \n3 Show only clothes, 4 Have students' plays and poems \n5 Have digital and non-digital photographs displayed \n05 Tell students to read the table in Exercise 05 carefully. \nAs stated in Tip 5, students should focus on the different \ncategories in order to decide what information is missing. \nFor example, elicit from students which speaker will give \nthem the answer to question 1. (Sangita)`,
