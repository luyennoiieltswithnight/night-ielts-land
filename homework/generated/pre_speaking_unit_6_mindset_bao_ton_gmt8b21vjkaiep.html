<script type="application/json" id="lesson-data">{"title":"pre- speaking: unit 6 mindset: bảo tổn","items":[{"phrase":"acid rain","meaningVi":"mưa axit","sentence":"Acid rain can cause serious environmental damage to forests.","sentenceVi":"Mưa axit có thể gây ra những thiệt hại nghiêm trọng cho môi trường và rừng."},{"phrase":"carbon monoxide","meaningVi":"khí carbon monoxide","sentence":"Carbon monoxide from vehicles can contribute to air pollution.","sentenceVi":"Khí carbon monoxide từ phương tiện giao thông có thể góp phần gây ô nhiễm không khí."},{"phrase":"drought","meaningVi":"hạn hán","sentence":"Drought is becoming a serious problem in some parts of the world.","sentenceVi":"Hạn hán đang trở thành một vấn đề nghiêm trọng ở một số nơi trên thế giới."},{"phrase":"earthquakes","meaningVi":"động đất","sentence":"Earthquakes can destroy buildings and cause serious damage.","sentenceVi":"Động đất có thể phá hủy các tòa nhà và gây ra thiệt hại nghiêm trọng."},{"phrase":"tornadoes","meaningVi":"lốc xoáy","sentence":"Tornadoes can cause enormous damage within a very short time.","sentenceVi":"Lốc xoáy có thể gây ra thiệt hại rất lớn trong một khoảng thời gian rất ngắn."},{"phrase":"landslides","meaningVi":"sạt lở đất","sentence":"Heavy rain can increase the risk of landslides in mountainous areas.","sentenceVi":"Mưa lớn có thể làm tăng nguy cơ sạt lở đất ở các khu vực miền núi."},{"phrase":"volcanic eruptions","meaningVi":"núi lửa phun trào","sentence":"Volcanic eruptions can force local people to leave their homes.","sentenceVi":"Núi lửa phun trào có thể buộc người dân địa phương rời khỏi nhà."},{"phrase":"oil spills","meaningVi":"sự cố tràn dầu","sentence":"Oil spills can seriously damage marine life.","sentenceVi":"Các vụ tràn dầu có thể gây thiệt hại nghiêm trọng cho sinh vật biển."},{"phrase":"radiation leaks","meaningVi":"rò rỉ phóng xạ","sentence":"Radiation leaks can have long-term effects on human health and the environment.","sentenceVi":"Rò rỉ phóng xạ có thể gây ảnh hưởng lâu dài đến sức khỏe con người và môi trường."},{"phrase":"tsunamis","meaningVi":"sóng thần","sentence":"Tsunamis can cause widespread destruction in coastal areas.","sentenceVi":"Sóng thần có thể gây ra sự tàn phá trên diện rộng ở các khu vực ven biển."},{"phrase":"sinkholes","meaningVi":"hố sụt","sentence":"Sinkholes can suddenly appear and damage roads and buildings.","sentenceVi":"Hố sụt có thể xuất hiện đột ngột và làm hư hại đường sá, tòa nhà."},{"phrase":"thunderstorms","meaningVi":"bão có sấm sét","sentence":"Thunderstorms can cause floods and power cuts.","sentenceVi":"Bão có sấm sét có thể gây lũ lụt và mất điện."},{"phrase":"floods","meaningVi":"lũ lụt","sentence":"Floods are becoming more frequent in some low-lying areas.","sentenceVi":"Lũ lụt đang xảy ra thường xuyên hơn ở một số vùng trũng."},{"phrase":"forest fires","meaningVi":"cháy rừng","sentence":"Forest fires can destroy large areas of natural habitat.","sentenceVi":"Cháy rừng có thể phá hủy những khu vực rộng lớn của môi trường sống tự nhiên."},{"phrase":"natural disasters","meaningVi":"thảm họa thiên nhiên","sentence":"Natural disasters can have a devastating impact on local communities.","sentenceVi":"Thảm họa thiên nhiên có thể có tác động tàn phá đến cộng đồng địa phương."},{"phrase":"man-made pollution","meaningVi":"ô nhiễm do con người gây ra","sentence":"Man-made pollution is one of the biggest threats to the environment.","sentenceVi":"Ô nhiễm do con người gây ra là một trong những mối đe dọa lớn nhất đối với môi trường."},{"phrase":"global pollution","meaningVi":"ô nhiễm toàn cầu","sentence":"Global pollution is a serious problem that requires international cooperation.","sentenceVi":"Ô nhiễm toàn cầu là một vấn đề nghiêm trọng cần sự hợp tác quốc tế."},{"phrase":"environmental damage","meaningVi":"thiệt hại môi trường","sentence":"Governments should take action to prevent environmental damage.","sentenceVi":"Chính phủ nên hành động để ngăn ngừa thiệt hại môi trường."},{"phrase":"environmental problems","meaningVi":"các vấn đề môi trường","sentence":"Young people need to understand environmental problems.","sentenceVi":"Người trẻ cần hiểu các vấn đề môi trường."},{"phrase":"environmental issues","meaningVi":"các vấn đề môi trường","sentence":"Environmental issues today are more urgent than they were in the past.","sentenceVi":"Các vấn đề môi trường ngày nay cấp bách hơn so với trước đây."},{"phrase":"natural beauty","meaningVi":"vẻ đẹp tự nhiên","sentence":"The area is famous for its natural beauty.","sentenceVi":"Khu vực này nổi tiếng với vẻ đẹp tự nhiên."},{"phrase":"scenic features","meaningVi":"đặc điểm cảnh quan","sentence":"The most impressive scenic features are the mountains and waterfalls.","sentenceVi":"Những đặc điểm cảnh quan ấn tượng nhất là núi và thác nước."},{"phrase":"scenic beauty","meaningVi":"vẻ đẹp phong cảnh","sentence":"I was amazed by the scenic beauty of the countryside.","sentenceVi":"Tôi rất ấn tượng bởi vẻ đẹp phong cảnh của vùng quê."},{"phrase":"scenic landscape","meaningVi":"phong cảnh đẹp","sentence":"The island has a spectacular scenic landscape.","sentenceVi":"Hòn đảo có một phong cảnh tuyệt đẹp."},{"phrase":"breathtaking","meaningVi":"đẹp đến nghẹt thở","sentence":"The view from the mountain was absolutely breathtaking.","sentenceVi":"Khung cảnh từ trên núi đẹp đến nghẹt thở."},{"phrase":"spectacular","meaningVi":"ngoạn mục, hùng vĩ","sentence":"The sunset over the sea was spectacular.","sentenceVi":"Hoàng hôn trên biển thật ngoạn mục."},{"phrase":"stunning","meaningVi":"tuyệt đẹp, ấn tượng mạnh","sentence":"The lake is surrounded by stunning natural scenery.","sentenceVi":"Hồ được bao quanh bởi phong cảnh thiên nhiên tuyệt đẹp."},{"phrase":"picturesque","meaningVi":"đẹp như tranh","sentence":"The village is a picturesque place surrounded by green hills.","sentenceVi":"Ngôi làng là một nơi đẹp như tranh, được bao quanh bởi những ngọn đồi xanh."},{"phrase":"peaceful","meaningVi":"yên bình","sentence":"I love visiting peaceful places away from busy cities.","sentenceVi":"Tôi thích đến những nơi yên bình, xa các thành phố đông đúc."},{"phrase":"tranquil","meaningVi":"thanh bình, tĩnh lặng","sentence":"The beach was quiet and tranquil early in the morning.","sentenceVi":"Bãi biển yên tĩnh và thanh bình vào sáng sớm."},{"phrase":"lush","meaningVi":"xanh tươi, um tùm","sentence":"The area is covered with lush green forests.","sentenceVi":"Khu vực này được bao phủ bởi những khu rừng xanh tươi."},{"phrase":"lush greenery","meaningVi":"cây cối xanh tươi","sentence":"The lush greenery makes the place feel fresh and relaxing.","sentenceVi":"Cây cối xanh tươi khiến nơi này có cảm giác trong lành và thư giãn."},{"phrase":"mountainous area","meaningVi":"khu vực miền núi","sentence":"People in mountainous areas may face landslides during heavy rain.","sentenceVi":"Người dân ở các khu vực miền núi có thể đối mặt với sạt lở đất khi mưa lớn."},{"phrase":"coastal area","meaningVi":"khu vực ven biển","sentence":"Coastal areas are particularly vulnerable to tsunamis.","sentenceVi":"Các khu vực ven biển đặc biệt dễ bị ảnh hưởng bởi sóng thần."},{"phrase":"low-lying area","meaningVi":"vùng đất thấp","sentence":"People living in low-lying areas are at greater risk of floods.","sentenceVi":"Người sống ở vùng đất thấp có nguy cơ chịu lũ lụt cao hơn."},{"phrase":"marine life","meaningVi":"sinh vật biển","sentence":"Oil spills can kill marine life and damage the ocean ecosystem.","sentenceVi":"Tràn dầu có thể giết sinh vật biển và làm tổn hại hệ sinh thái đại dương."},{"phrase":"natural habitat","meaningVi":"môi trường sống tự nhiên","sentence":"Forest fires can destroy the natural habitat of many animals.","sentenceVi":"Cháy rừng có thể phá hủy môi trường sống tự nhiên của nhiều loài động vật."},{"phrase":"biodiversity","meaningVi":"đa dạng sinh học","sentence":"Protecting forests is essential for maintaining biodiversity.","sentenceVi":"Bảo vệ rừng là điều thiết yếu để duy trì đa dạng sinh học."},{"phrase":"ecosystem","meaningVi":"hệ sinh thái","sentence":"Pollution can seriously damage the marine ecosystem.","sentenceVi":"Ô nhiễm có thể gây thiệt hại nghiêm trọng cho hệ sinh thái biển."},{"phrase":"air pollution","meaningVi":"ô nhiễm không khí","sentence":"Air pollution is a major problem in many large cities.","sentenceVi":"Ô nhiễm không khí là một vấn đề lớn ở nhiều thành phố lớn."},{"phrase":"water pollution","meaningVi":"ô nhiễm nguồn nước","sentence":"Oil spills are a major cause of water pollution.","sentenceVi":"Tràn dầu là một nguyên nhân lớn gây ô nhiễm nguồn nước."},{"phrase":"soil pollution","meaningVi":"ô nhiễm đất","sentence":"Factories can contribute to soil pollution if they dispose of waste improperly.","sentenceVi":"Các nhà máy có thể góp phần gây ô nhiễm đất nếu xử lý chất thải không đúng cách."},{"phrase":"climate change","meaningVi":"biến đổi khí hậu","sentence":"Climate change can make droughts and floods more frequent.","sentenceVi":"Biến đổi khí hậu có thể khiến hạn hán và lũ lụt xảy ra thường xuyên hơn."},{"phrase":"global warming","meaningVi":"nóng lên toàn cầu","sentence":"Global warming is closely linked to human activities.","sentenceVi":"Nóng lên toàn cầu có liên quan chặt chẽ đến các hoạt động của con người."},{"phrase":"greenhouse gases","meaningVi":"khí nhà kính","sentence":"Factories and vehicles release greenhouse gases into the atmosphere.","sentenceVi":"Nhà máy và phương tiện giao thông thải khí nhà kính vào khí quyển."},{"phrase":"carbon emissions","meaningVi":"lượng khí thải carbon","sentence":"Governments should reduce carbon emissions from transport and industry.","sentenceVi":"Chính phủ nên giảm lượng khí thải carbon từ giao thông và công nghiệp."},{"phrase":"fossil fuels","meaningVi":"nhiên liệu hóa thạch","sentence":"Burning fossil fuels contributes to global warming.","sentenceVi":"Đốt nhiên liệu hóa thạch góp phần gây ra nóng lên toàn cầu."},{"phrase":"renewable energy","meaningVi":"năng lượng tái tạo","sentence":"Investing in renewable energy could reduce carbon emissions.","sentenceVi":"Đầu tư vào năng lượng tái tạo có thể làm giảm lượng khí thải carbon."},{"phrase":"solar power","meaningVi":"năng lượng mặt trời","sentence":"Solar power is a cleaner alternative to fossil fuels.","sentenceVi":"Năng lượng mặt trời là một lựa chọn sạch hơn so với nhiên liệu hóa thạch."},{"phrase":"wind power","meaningVi":"năng lượng gió","sentence":"Wind power can provide electricity without producing much pollution.","sentenceVi":"Năng lượng gió có thể cung cấp điện mà không tạo ra nhiều ô nhiễm."},{"phrase":"public transport","meaningVi":"phương tiện giao thông công cộng","sentence":"Better public transport could help reduce air pollution.","sentenceVi":"Giao thông công cộng tốt hơn có thể giúp giảm ô nhiễm không khí."},{"phrase":"reduce emissions","meaningVi":"giảm khí thải","sentence":"Using public transport can help reduce emissions.","sentenceVi":"Sử dụng giao thông công cộng có thể giúp giảm khí thải."},{"phrase":"prevent environmental damage","meaningVi":"ngăn ngừa thiệt hại môi trường","sentence":"Strict laws can help prevent environmental damage.","sentenceVi":"Các luật nghiêm ngặt có thể giúp ngăn ngừa thiệt hại môi trường."},{"phrase":"protect the environment","meaningVi":"bảo vệ môi trường","sentence":"Everyone has a responsibility to protect the environment.","sentenceVi":"Mọi người đều có trách nhiệm bảo vệ môi trường."},{"phrase":"raise awareness","meaningVi":"nâng cao nhận thức","sentence":"Schools can raise awareness of environmental problems among children.","sentenceVi":"Trường học có thể nâng cao nhận thức của trẻ em về các vấn đề môi trường."},{"phrase":"environmental education","meaningVi":"giáo dục môi trường","sentence":"Environmental education should start at an early age.","sentenceVi":"Giáo dục môi trường nên bắt đầu từ khi còn nhỏ."},{"phrase":"take action","meaningVi":"hành động","sentence":"Governments need to take action before environmental problems become worse.","sentenceVi":"Chính phủ cần hành động trước khi các vấn đề môi trường trở nên tồi tệ hơn."},{"phrase":"take responsibility","meaningVi":"chịu trách nhiệm","sentence":"Factories should take responsibility for environmental damage they cause.","sentenceVi":"Các nhà máy nên chịu trách nhiệm về thiệt hại môi trường mà họ gây ra."},{"phrase":"strict regulations","meaningVi":"các quy định nghiêm ngặt","sentence":"Strict regulations can prevent factories from polluting rivers.","sentenceVi":"Các quy định nghiêm ngặt có thể ngăn các nhà máy làm ô nhiễm sông ngòi."},{"phrase":"environmental laws","meaningVi":"luật môi trường","sentence":"Effective environmental laws can reduce pollution.","sentenceVi":"Các luật môi trường hiệu quả có thể làm giảm ô nhiễm."},{"phrase":"government intervention","meaningVi":"sự can thiệp của chính phủ","sentence":"Government intervention may be necessary to control pollution.","sentenceVi":"Sự can thiệp của chính phủ có thể cần thiết để kiểm soát ô nhiễm."},{"phrase":"private businesses","meaningVi":"doanh nghiệp tư nhân","sentence":"Private businesses should do more to prevent environmental accidents.","sentenceVi":"Các doanh nghiệp tư nhân nên làm nhiều hơn để ngăn ngừa các sự cố môi trường."},{"phrase":"industrial pollution","meaningVi":"ô nhiễm công nghiệp","sentence":"Industrial pollution is a serious problem near large cities.","sentenceVi":"Ô nhiễm công nghiệp là một vấn đề nghiêm trọng gần các thành phố lớn."},{"phrase":"factory emissions","meaningVi":"khí thải từ nhà máy","sentence":"Factory emissions can contribute to poor air quality.","sentenceVi":"Khí thải từ nhà máy có thể góp phần làm chất lượng không khí kém."},{"phrase":"environmental accident","meaningVi":"sự cố môi trường","sentence":"An environmental accident can affect thousands of people.","sentenceVi":"Một sự cố môi trường có thể ảnh hưởng đến hàng nghìn người."},{"phrase":"long-term effects","meaningVi":"ảnh hưởng lâu dài","sentence":"Radiation leaks may have serious long-term effects.","sentenceVi":"Rò rỉ phóng xạ có thể có những ảnh hưởng lâu dài nghiêm trọng."},{"phrase":"serious problem","meaningVi":"vấn đề nghiêm trọng","sentence":"I think global pollution is a very serious problem.","sentenceVi":"Tôi nghĩ ô nhiễm toàn cầu là một vấn đề rất nghiêm trọng."},{"phrase":"major threat","meaningVi":"mối đe dọa lớn","sentence":"Climate change is a major threat to future generations.","sentenceVi":"Biến đổi khí hậu là một mối đe dọa lớn đối với các thế hệ tương lai."},{"phrase":"devastating impact","meaningVi":"tác động tàn phá","sentence":"Natural disasters can have a devastating impact on communities.","sentenceVi":"Thảm họa thiên nhiên có thể có tác động tàn phá đến cộng đồng."},{"phrase":"widespread destruction","meaningVi":"sự tàn phá trên diện rộng","sentence":"Tsunamis can cause widespread destruction along the coast.","sentenceVi":"Sóng thần có thể gây ra sự tàn phá trên diện rộng dọc bờ biển."},{"phrase":"vulnerable to","meaningVi":"dễ bị ảnh hưởng bởi","sentence":"Coastal cities are vulnerable to floods and tsunamis.","sentenceVi":"Các thành phố ven biển dễ bị ảnh hưởng bởi lũ lụt và sóng thần."},{"phrase":"at risk of","meaningVi":"có nguy cơ","sentence":"People living near volcanoes may be at risk of volcanic eruptions.","sentenceVi":"Những người sống gần núi lửa có thể có nguy cơ gặp núi lửa phun trào."},{"phrase":"contribute to","meaningVi":"góp phần vào","sentence":"Cars contribute to air pollution in crowded cities.","sentenceVi":"Ô tô góp phần gây ô nhiễm không khí ở các thành phố đông đúc."},{"phrase":"be caused by","meaningVi":"được gây ra bởi","sentence":"Some environmental problems are caused by human activities.","sentenceVi":"Một số vấn đề môi trường được gây ra bởi các hoạt động của con người."},{"phrase":"be responsible for","meaningVi":"chịu trách nhiệm","sentence":"gây ra","sentenceVi":"Factories can be responsible for serious environmental damage."},{"phrase":"have an impact on","meaningVi":"có tác động đến","sentence":"Pollution has a negative impact on marine life.","sentenceVi":"Ô nhiễm có tác động tiêu cực đến sinh vật biển."},{"phrase":"make a difference","meaningVi":"tạo ra sự khác biệt","sentence":"Small changes in our daily lives can make a difference to the environment.","sentenceVi":"Những thay đổi nhỏ trong cuộc sống hằng ngày có thể tạo ra sự khác biệt cho môi trường."},{"phrase":"future generations","meaningVi":"các thế hệ tương lai","sentence":"We need to protect natural resources for future generations.","sentenceVi":"Chúng ta cần bảo vệ tài nguyên thiên nhiên cho các thế hệ tương lai."},{"phrase":"natural resources","meaningVi":"tài nguyên thiên nhiên","sentence":"We should use natural resources more responsibly.","sentenceVi":"Chúng ta nên sử dụng tài nguyên thiên nhiên có trách nhiệm hơn."},{"phrase":"conservation","meaningVi":"bảo tồn","sentence":"Forest conservation is essential for protecting biodiversity.","sentenceVi":"Bảo tồn rừng là điều thiết yếu để bảo vệ đa dạng sinh học."},{"phrase":"wildlife","meaningVi":"động vật hoang dã","sentence":"Forest fires can threaten wildlife and their natural habitat.","sentenceVi":"Cháy rừng có thể đe dọa động vật hoang dã và môi trường sống tự nhiên của chúng."},{"phrase":"recycle waste","meaningVi":"tái chế rác thải","sentence":"People should recycle waste instead of throwing everything away.","sentenceVi":"Mọi người nên tái chế rác thải thay vì vứt bỏ mọi thứ."},{"phrase":"reduce waste","meaningVi":"giảm rác thải","sentence":"Businesses can reduce waste by using less packaging.","sentenceVi":"Doanh nghiệp có thể giảm rác thải bằng cách sử dụng ít bao bì hơn."},{"phrase":"single-use plastic","meaningVi":"nhựa dùng một lần","sentence":"Reducing single-use plastic could help protect marine life.","sentenceVi":"Giảm nhựa dùng một lần có thể giúp bảo vệ sinh vật biển."},{"phrase":"plastic pollution","meaningVi":"ô nhiễm nhựa","sentence":"Plastic pollution is a growing threat to the ocean.","sentenceVi":"Ô nhiễm nhựa là một mối đe dọa ngày càng tăng đối với đại dương."},{"phrase":"clean energy","meaningVi":"năng lượng sạch","sentence":"Governments should invest more in clean energy.","sentenceVi":"Chính phủ nên đầu tư nhiều hơn vào năng lượng sạch."},{"phrase":"sustainable","meaningVi":"bền vững","sentence":"Cities need more sustainable ways of dealing with pollution.","sentenceVi":"Các thành phố cần những cách bền vững hơn để giải quyết ô nhiễm."},{"phrase":"sustainable development","meaningVi":"phát triển bền vững","sentence":"Sustainable development should balance economic growth and environmental protection.","sentenceVi":"Phát triển bền vững nên cân bằng giữa tăng trưởng kinh tế và bảo vệ môi trường."},{"phrase":"urbanisation","meaningVi":"đô thị hóa","sentence":"Rapid urbanisation can put pressure on the environment.","sentenceVi":"Đô thị hóa nhanh có thể gây áp lực lên môi trường."},{"phrase":"overpopulation","meaningVi":"dân số quá đông","sentence":"Overpopulation can increase pressure on natural resources.","sentenceVi":"Dân số quá đông có thể làm tăng áp lực lên tài nguyên thiên nhiên."},{"phrase":"deforestation","meaningVi":"nạn phá rừng","sentence":"Deforestation can destroy natural habitats and increase carbon emissions.","sentenceVi":"Phá rừng có thể phá hủy môi trường sống tự nhiên và làm tăng khí thải carbon."},{"phrase":"plant trees","meaningVi":"trồng cây","sentence":"Schools can encourage children to plant trees and protect nature.","sentenceVi":"Trường học có thể khuyến khích trẻ em trồng cây và bảo vệ thiên nhiên."},{"phrase":"preserve nature","meaningVi":"bảo tồn thiên nhiên","sentence":"Tourism should be managed carefully to preserve nature.","sentenceVi":"Du lịch nên được quản lý cẩn thận để bảo tồn thiên nhiên."},{"phrase":"beautiful scenery","meaningVi":"cảnh đẹp","sentence":"The place is famous for its beautiful scenery and peaceful atmosphere.","sentenceVi":"Nơi này nổi tiếng với cảnh đẹp và bầu không khí yên bình."},{"phrase":"peaceful atmosphere","meaningVi":"bầu không khí yên bình","sentence":"The peaceful atmosphere made me want to stay longer.","sentenceVi":"Bầu không khí yên bình khiến tôi muốn ở lại lâu hơn."},{"phrase":"tourist attraction","meaningVi":"điểm thu hút khách du lịch","sentence":"Its natural beauty has made it a popular tourist attraction.","sentenceVi":"Vẻ đẹp tự nhiên đã khiến nơi đây trở thành một điểm thu hút khách du lịch nổi tiếng."},{"phrase":"famous for","meaningVi":"nổi tiếng vì","sentence":"The area is famous for its spectacular mountains and waterfalls.","sentenceVi":"Khu vực này nổi tiếng vì những ngọn núi và thác nước ngoạn mục."},{"phrase":"visit again","meaningVi":"ghé thăm lại","sentence":"I would definitely like to visit the place again.","sentenceVi":"Tôi chắc chắn muốn ghé thăm nơi đó một lần nữa."},{"phrase":"memorable experience","meaningVi":"trải nghiệm đáng nhớ","sentence":"Seeing the sunset there was a truly memorable experience.","sentenceVi":"Ngắm hoàng hôn ở đó là một trải nghiệm thực sự đáng nhớ."},{"phrase":"what I remember most","meaningVi":"điều tôi nhớ nhất","sentence":"What I remember most is the breathtaking view of the mountains.","sentenceVi":"Điều tôi nhớ nhất là khung cảnh núi non đẹp đến nghẹt thở."}]}</script>
<script>
var DATA = JSON.parse(document.getElementById('lesson-data').textContent);
var TITLE = DATA.title || 'Listening Type Practice';
var ITEMS = DATA.items || [];

var voices = [];
var audioCtx = null;
var selectedVoiceName = null;

var state = {
  viewMode: 'cards',
  practiceType: 'phrase',
  practiceIndex: 0,
  input: '',
  revealed: false,
  completed: false,
  hintActive: false,
  hintEndIndex: -1,
  errorIndex: -1
};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function attrJson(v){ return esc(JSON.stringify(v)); }

var ICON_VOLUME = '<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M17 9.5a4 4 0 0 1 0 5M19.5 7a7.5 7.5 0 0 1 0 10"/></svg>';
var ICON_KEYBOARD = '<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6 9h1M10 9h1M14 9h1M18 9h1M6 13h1M10 13h1M14 13h4M7 16h10"/></svg>';
var ICON_PLAY = '<svg class="w-full h-full" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var ICON_ROTATE = '<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 0 0-13.7-4L4 9"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 13.7 4L20 15"/><path d="M20 19v-4h-4"/></svg>';
var ICON_TURTLE = '<svg class="w-full h-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 14.5c0-3 2.2-5.5 5.2-5.5h1.3c2.4 0 4.3 1.8 4.3 4.1 0 2.5-2.1 4.4-4.7 4.4H10c-2 0-3.5-1.2-3.5-3z"/><path d="M8 13H5.5c-1.1 0-2-.9-2-2s.9-2 2-2h1.2M8 18.5l-1 2M12 18.5v2M17 17.8l1.2 1.8M18.3 11.3c.8-.8 1.8-1.2 2.7-.9"/></svg>';

// ---------------- AUDIO ----------------
var audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  if('speechSynthesis' in window){
    var dummy = new SpeechSynthesisUtterance(' ');
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
  }
  if(!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

function englishVoices(){ return voices.filter(function(v){ return /en(-|_)/i.test(v.lang); }); }

function loadVoices(){
  voices = speechSynthesis.getVoices() || [];
  var s = document.getElementById('voiceSelect');
  if(!s) return;
  var vs = englishVoices();
  s.innerHTML = vs.length ? vs.map(function(v){ return '<option value="' + esc(v.name) + '">' + esc(v.name) + ' (' + esc(v.lang) + ')</option>'; }).join('') : '<option>System Voice</option>';
  var best = vs.find(function(v){ return v.name === selectedVoiceName; }) ||
             vs.find(function(v){ return v.name.indexOf('Google US English') !== -1; }) ||
             vs.find(function(v){ return v.lang === 'en-US'; }) || vs[0];
  if(best){ s.value = best.name; if(!selectedVoiceName) selectedVoiceName = best.name; }
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 250);
}

function updateVoice(name){ selectedVoiceName = name; previewVoice(); }
function previewVoice(){ speak('The sport grew in popularity after it became legal.', 1); }

function speak(text, rate){
  rate = rate || 1;
  if(!('speechSynthesis' in window) || !text) return;
  var synth = window.speechSynthesis;
  synth.cancel();
  setTimeout(function(){
    try{
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-GB'; u.rate = rate; u.pitch = 1; u.volume = 1;
      var selEl = document.getElementById('voiceSelect');
      var selected = selEl ? selEl.value : null;
      var v = voices.find(function(x){ return x.name === selectedVoiceName; }) ||
              voices.find(function(x){ return x.name === selected; }) ||
              englishVoices().find(function(x){ return /^en(-|_)/i.test(x.lang); }) || voices[0];
      if(v) u.voice = v;
      u.onerror = function(){};
      synth.speak(u);
    }catch(e){}
  }, 80);
}

function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, d, vol, type){
  d = d || 0.06; vol = vol || 0.03; type = type || 'sine';
  try{
    var c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + d);
  }catch(e){}
}
function completeSound(){ [523,659,784,988].forEach(function(f,i){ setTimeout(function(){ beep(f,0.15,0.05); }, i*80); }); }
function errorSound(){ beep(150, 0.15, 0.05, 'sawtooth'); }
function fireworks(){
  var r = document.getElementById('practiceBurst') || document.getElementById('fireworks');
  if(!r) return;
  r.innerHTML = '';
  for(var i=0;i<44;i++){
    var s = document.createElement('span');
    var a = Math.random()*Math.PI*2, rad = 80+Math.random()*180;
    s.className = 'spark';
    s.style.left = (42+Math.random()*16)+'%';
    s.style.top = (32+Math.random()*24)+'%';
    s.style.background = (["#22c55e","#4ade80","#bbf7d0","#16a34a","#86efac"])[i%5];
    s.style.setProperty('--dx', Math.cos(a)*rad+'px');
    s.style.setProperty('--dy', Math.sin(a)*rad+'px');
    r.appendChild(s);
  }
  setTimeout(function(){ r.innerHTML=''; }, 1200);
}

// ---------------- TYPING ENGINE ----------------
function current(){
  var item = ITEMS[state.practiceIndex] || ITEMS[0] || {phrase:'',meaningVi:'',sentence:'',sentenceVi:''};
  var isPhrase = state.practiceType === 'phrase';
  return {
    target: isPhrase ? item.phrase : item.sentence,
    promptVi: isPhrase ? item.meaningVi : (item.sentenceVi || item.meaningVi),
    audioText: isPhrase ? item.phrase : item.sentence,
    kind: isPhrase ? 'PHRASE' : 'SENTENCE'
  };
}
function normalizeSpaces(str){
  return str
    .replace(/[\u2018\u2019\u201A\u201B\u2032\u02BC\uFF07]/g, "'")
    .replace(/[\u201C\u201D\u201E\u201F\u2033\uFF02]/g, '"')
    .replace(/\s+/g, ' ');
}

function handleKeyInput(e){
  if(state.completed || state.revealed) return;
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  var typedStr = normalizeSpaces(e.target.value);

  var isValid = true, errIdx = -1;
  for(var i=0;i<typedStr.length;i++){
    if(typedStr[i].toLowerCase() !== (targetStr[i]||'').toLowerCase()){ isValid=false; errIdx=i; break; }
  }
  if(!isValid){
    errorSound();
    e.target.value = typedStr.substring(0, errIdx);
    state.input = e.target.value;
    state.errorIndex = errIdx;
    updateTyping();
    clearTimeout(window.errorTimer);
    window.errorTimer = setTimeout(function(){ state.errorIndex = -1; updateTyping(); }, 350);
    return;
  }
  state.errorIndex = -1;
  state.input = typedStr;
  if(state.hintActive && typedStr.length >= state.hintEndIndex) state.hintActive = false;
  if(typedStr.length > 0) beep(620+Math.min(typedStr.length,12)*24, 0.055, 0.022);

  if(typedStr.toLowerCase() === targetStr.toLowerCase()){
    state.completed = true; state.revealed = true; state.input = c.target; e.target.value = c.target;
    completeSound();
    setTimeout(fireworks, 60);
  }
  updateTyping();
}

function giveHint(){
  if(state.completed || state.revealed) return;
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  if(state.input.length < targetStr.length){
    var startIdx = state.input.length;
    if(targetStr[startIdx] === ' ') startIdx++;
    var nextSpace = targetStr.indexOf(' ', startIdx);
    if(nextSpace === -1) nextSpace = targetStr.length;
    state.hintActive = true; state.hintEndIndex = nextSpace;
    updateTyping();
    setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 50);
  }
}

function updateTyping(){
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  var typedStr = state.input;
  var totalLetters = targetStr.length;

  var visualBox = document.getElementById('visualInputBox');
  if(visualBox){
    var html = '';
    for(var i=0;i<targetStr.length;i++){
      var actualChar = targetStr[i];
      var isSpace = actualChar === ' ';
      var displayChar = isSpace ? '&nbsp;' : '*';
      if(i < typedStr.length){
        html += '<span class="char-box char-typed">' + (isSpace ? '&nbsp;' : esc(typedStr[i])) + '</span>';
      }else if(i === state.errorIndex){
        html += '<span class="char-box char-error">' + (isSpace ? '&nbsp;' : esc(actualChar)) + '</span>';
      }else if(state.hintActive && i >= typedStr.length && i < state.hintEndIndex){
        html += '<span class="char-box char-hint">' + esc(actualChar) + '</span>';
      }else{
        if(state.revealed || state.completed){
          html += '<span class="char-box char-untyped" style="border-bottom-color: transparent;">' + (isSpace ? '&nbsp;' : esc(actualChar)) + '</span>';
        }else{
          html += '<span class="char-box char-untyped"><span class="char-masked">' + displayChar + '</span></span>';
        }
      }
    }
    visualBox.innerHTML = html;
  }

  var progressBar = document.getElementById('purpleProgressBar');
  if(progressBar){
    var percentage = totalLetters ? (typedStr.length/totalLetters)*100 : 0;
    progressBar.style.width = percentage + '%';
    if(state.completed){ progressBar.classList.remove('bg-primary-500'); progressBar.classList.add('bg-emerald-500'); }
    else{ progressBar.classList.remove('bg-emerald-500'); progressBar.classList.add('bg-primary-500'); }
  }

  var wrapper = document.getElementById('inputWrapper');
  if(wrapper){
    if(state.completed) wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-200 rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.1)] text-emerald-800 cursor-text overflow-hidden transition-all duration-300';
    else if(state.revealed) wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl shadow-card cursor-text overflow-hidden transition-all duration-300';
    else wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-primary-100 rounded-2xl shadow-card cursor-text focus-within:border-primary-400 focus-within:shadow-[0_10px_30px_rgba(139,92,246,0.15)] transition-all duration-300 overflow-hidden group';
  }

  var hiddenInp = document.getElementById('hiddenInput');
  if(hiddenInp){ hiddenInp.value = state.input; hiddenInp.disabled = state.completed || state.revealed; }

  var fb = document.getElementById('typingFeedback');
  if(fb){
    if(state.completed) fb.innerHTML = '<span class="text-emerald-600 font-extrabold">&#10003; Xuất sắc!</span>';
    else if(state.revealed) fb.innerHTML = '<span class="text-slate-500 font-bold">Đáp án đã hiện. Nghe lại và ôn tập.</span>';
    else fb.innerHTML = '<span class="text-primary-600/80 font-bold tracking-widest text-[10px] uppercase">Nghe rồi gõ lại chính xác</span>';
  }
}

// ---------------- NAVIGATION ----------------
function mainScroll(){ var m = document.querySelector('main'); return m ? m.scrollTop : 0; }
function setViewMode(m){
  var y = mainScroll();
  state.viewMode = m;
  if(m === 'type'){
    state.practiceIndex = 0; state.practiceType = 'phrase'; state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  }
  render(y);
  if(m === 'type'){ speak(current().audioText, 1); setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120); }
}
function goCards(){ setViewMode('cards'); }
function goType(){ setViewMode('type'); }

function changeType(t){
  var y = mainScroll();
  state.practiceType = t; state.practiceIndex = 0; state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y);
  speak(current().audioText, 1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function setPhraseMode(){ changeType('phrase'); }
function setSentenceMode(){ changeType('sentence'); }

function next(){
  var y = mainScroll();
  state.practiceIndex = (state.practiceIndex+1) % ITEMS.length;
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y); speak(current().audioText,1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function prev(){
  var y = mainScroll();
  state.practiceIndex = (state.practiceIndex-1+ITEMS.length) % ITEMS.length;
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y); speak(current().audioText,1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function retryItem(){
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  updateTyping();
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 50);
}
function reveal(){
  state.revealed = true; state.completed = false; state.input = current().target; state.hintActive=false; state.errorIndex=-1;
  updateTyping();
}

// ---------------- RENDER ----------------
function header(){
  return '<header class="sticky top-0 z-30 glass border-b border-primary-50 px-5 md:px-8 py-4 flex flex-wrap items-center justify-between gap-3">' +
    '<div>' +
      '<div class="text-[9px] font-extrabold tracking-widest text-primary-500 uppercase">NIGHT IELTS &middot; LISTENING TYPE</div>' +
      '<h1 class="text-lg md:text-xl font-extrabold text-slate-800 mt-0.5">' + esc(TITLE) + '</h1>' +
    '</div>' +
    '<div class="flex items-center gap-2 flex-wrap">' +
      '<span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider hidden sm:inline">Voice</span>' +
      '<select id="voiceSelect" onchange="updateVoice(this.value)" class="max-w-[170px] md:max-w-[220px] text-xs font-bold text-primary-700 border border-primary-200 rounded-xl px-3 py-2 bg-primary-50/50 hover:bg-primary-50 transition outline-none cursor-pointer"></select>' +
      '<button onclick="previewVoice()" class="text-[10px] font-extrabold uppercase tracking-wider bg-primary-100 text-primary-700 px-3 py-2 rounded-xl hover:bg-primary-200 transition">Nghe thử</button>' +
    '</div>' +
  '</header>';
}

function cardsView(){
  var cards = ITEMS.map(function(item){
    return '<article class="bg-white border border-primary-100/50 rounded-[26px] p-6 hover:-translate-y-1 hover:shadow-card transition-all">' +
      '<div class="flex justify-between items-center mb-4">' +
        '<span class="text-[9px] font-extrabold px-3 py-1.5 rounded-xl uppercase tracking-widest border bg-purple-100 text-purple-700 border-purple-200">CHUNK</span>' +
        '<button onclick="speak(' + attrJson(item.phrase) + ',1)" class="w-10 h-10 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center">' + ICON_VOLUME + '</button>' +
      '</div>' +
      '<div class="text-[21px] font-extrabold text-slate-800 leading-tight">' + esc(item.phrase) + '</div>' +
      '<div class="text-[13px] font-bold text-slate-500 mt-2">' + esc(item.meaningVi) + '</div>' +
      '<div class="mt-6 p-4 rounded-2xl bg-slate-50 border border-slate-100">' +
        '<div class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">CÂU VÍ DỤ</div>' +
        '<div class="text-sm font-semibold text-slate-700 leading-relaxed">' + esc(item.sentence) + '</div>' +
        '<button onclick="speak(' + attrJson(item.sentence) + ',1)" class="mt-3 text-xs font-extrabold text-primary-600">🔊 Nghe</button>' +
      '</div>' +
    '</article>';
  }).join('');

  return '<div class="space-y-7 fade">' +
    '<div class="flex flex-col md:flex-row md:items-end justify-between gap-4">' +
      '<div>' +
        '<div class="text-[10px] font-extrabold tracking-widest text-primary-500 uppercase">TỪ VỰNG &amp; CÂU</div>' +
        '<h2 class="text-3xl font-extrabold text-slate-800 mt-1.5">Danh sách học</h2>' +
        '<p class="text-sm font-medium text-slate-500 mt-2">' + ITEMS.length + ' mục &middot; Nghe trước, rồi bấm bắt đầu để luyện gõ.</p>' +
      '</div>' +
      '<button onclick="goType()" class="px-8 py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold shadow-[0_8px_20px_rgba(15,23,42,0.3)] transition-all flex items-center gap-3"><span class="w-5 h-5">' + ICON_KEYBOARD + '</span> BẮT ĐẦU LISTENING TYPE</button>' +
    '</div>' +
    '<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">' + cards + '</div>' +
  '</div>';
}

function typeView(){
  if(!ITEMS.length) return '<div class="p-12 text-center text-slate-400">Chưa có dữ liệu.</div>';
  var c = current();
  var list = ITEMS;

  return '<div class="space-y-6 fade max-w-[1100px] mx-auto">' +
    '<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">' +
      '<div>' +
        '<button onclick="goCards()" class="text-xs font-extrabold text-primary-500 flex items-center gap-1.5 mb-3 hover:text-primary-600 transition"><span class="text-lg leading-none">&larr;</span> Quay lại danh sách</button>' +
        '<div class="text-[10px] font-extrabold tracking-widest text-emerald-500 uppercase">LISTEN &rarr; TYPE</div>' +
        '<h2 class="text-3xl font-extrabold text-slate-800 mt-1.5">' + esc(TITLE) + '</h2>' +
      '</div>' +
      '<div class="flex flex-wrap gap-2 p-1.5 bg-white border border-primary-100 rounded-[20px] shadow-sm">' +
        '<button onclick="setPhraseMode()" class="px-6 py-3 rounded-2xl text-[13px] font-extrabold transition-all duration-200 ' + (state.practiceType==='phrase' ? 'bg-primary-50 text-primary-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50') + '">01. Cụm từ</button>' +
        '<button onclick="setSentenceMode()" class="px-6 py-3 rounded-2xl text-[13px] font-extrabold transition-all duration-200 ' + (state.practiceType==='sentence' ? 'bg-primary-50 text-primary-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50') + '">02. Câu</button>' +
      '</div>' +
    '</div>' +
    '<section class="bg-white border border-primary-100/50 rounded-[36px] overflow-hidden relative shadow-card">' +
      '<div id="practiceBurst" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>' +
      '<div class="px-8 py-5 border-b border-primary-50 flex justify-between items-center bg-white">' +
        '<span class="text-[11px] font-extrabold tracking-widest text-slate-400">MỤC ' + (state.practiceIndex+1) + ' / ' + list.length + '</span>' +
        '<span class="px-4 py-1.5 rounded-xl bg-slate-50 border border-slate-100 text-slate-500 text-[10px] font-extrabold tracking-widest uppercase">' + c.kind + '</span>' +
      '</div>' +
      '<div class="p-8 md:p-12">' +
        '<div class="text-center relative">' +
          '<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-primary-100/50 rounded-full animate-ping pointer-events-none"></div>' +
          '<button aria-label="Nghe" onclick="speak(' + attrJson(c.audioText) + ',1); setTimeout(function(){var el=document.getElementById(\'hiddenInput\');if(el)el.focus();},50);" class="relative w-24 h-24 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-[0_12px_30px_rgba(15,23,42,0.35)] mx-auto hover:bg-slate-800 hover:scale-105 transition-all duration-300 z-10">' +
            '<span class="w-10 h-10 inline-block pl-1">' + ICON_PLAY + '</span>' +
          '</button>' +
        '</div>' +
        '<div class="mt-8 text-center">' +
          '<div class="text-[10px] font-extrabold tracking-widest uppercase text-primary-400/80 mb-2">' + (c.kind==='PHRASE' ? 'Nghĩa cụm từ' : 'Nghĩa câu') + '</div>' +
          '<div class="text-xl md:text-2xl font-extrabold text-slate-800">' + esc(c.promptVi) + '</div>' +
        '</div>' +
        '<div id="inputWrapper" class="relative w-full max-w-3xl mx-auto mt-10 bg-white border-2 border-primary-100 rounded-2xl shadow-sm cursor-text focus-within:border-primary-400 transition-all duration-300 overflow-hidden group" onclick="var el=document.getElementById(\'hiddenInput\');if(el)el.focus();">' +
          '<div id="visualInputBox" class="w-full text-center text-[26px] md:text-[32px] font-bold px-6 py-10 flex justify-center flex-wrap leading-[2.2]"></div>' +
          '<input id="hiddenInput" value="' + esc(state.input) + '" oninput="handleKeyInput(event)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" class="absolute opacity-0 pointer-events-none w-full h-full top-0 left-0"' + (state.completed||state.revealed ? ' disabled' : '') + '>' +
          '<div id="purpleProgressBar" class="absolute bottom-0 left-0 h-2 bg-primary-500 transition-all duration-300 ease-out" style="width: 0%"></div>' +
        '</div>' +
        '<div id="typingFeedback" class="mt-6 text-center text-sm font-bold text-slate-400 h-6">Nghe rồi gõ lại chính xác</div>' +
      '</div>' +
      '<div class="border-t border-primary-50 bg-white p-6 md:p-8 flex flex-wrap justify-between gap-4 items-center">' +
        '<button onclick="prev()" class="px-6 py-3.5 rounded-2xl bg-white border-2 border-slate-100 text-[13px] font-extrabold text-slate-500 hover:border-slate-200 hover:bg-slate-50 transition">&larr; Trước</button>' +
        '<div class="flex flex-wrap gap-2.5 justify-center">' +
          '<button onclick="speak(' + attrJson(c.audioText) + ',1); setTimeout(function(){var el=document.getElementById(\'hiddenInput\');if(el)el.focus();},50);" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">' + ICON_VOLUME + '</span> Nghe lại</button>' +
          '<button onclick="retryItem()" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">' + ICON_ROTATE + '</span> Làm lại</button>' +
          '<button onclick="speak(' + attrJson(c.audioText) + ',.7); setTimeout(function(){var el=document.getElementById(\'hiddenInput\');if(el)el.focus();},50);" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">' + ICON_TURTLE + '</span> Chậm</button>' +
          (!state.revealed ? '<button onclick="giveHint()" class="px-6 py-3.5 rounded-2xl bg-primary-50 text-primary-700 text-[13px] font-extrabold hover:bg-primary-100 transition">Gợi ý</button>' : '') +
          (!state.revealed ? '<button onclick="reveal()" class="px-6 py-3.5 rounded-2xl bg-slate-100 text-slate-600 text-[13px] font-extrabold hover:bg-slate-200 transition">Xem đáp án</button>' : '') +
        '</div>' +
        '<button onclick="next()" class="px-10 py-3.5 rounded-2xl bg-slate-900 text-white text-[14px] font-extrabold shadow-lg hover:bg-slate-800 transition transform hover:-translate-y-0.5">Tiếp &rarr;</button>' +
      '</div>' +
    '</section>' +
  '</div>';
}

function render(scrollTop){
  var old = (scrollTop===null||scrollTop===undefined) ? mainScroll() : scrollTop;
  var content = state.viewMode === 'type' ? typeView() : cardsView();
  document.getElementById('app').innerHTML =
    '<div class="min-h-screen flex flex-col">' +
      header() +
      '<main class="flex-1 min-w-0 overflow-y-auto relative">' +
        '<div class="max-w-[1300px] mx-auto p-5 md:p-8 lg:p-10 pb-24">' + content + '</div>' +
      '</main>' +
    '</div>';
  loadVoices();
  requestAnimationFrame(function(){
    var m = document.querySelector('main');
    if(m) m.scrollTop = old;
    if(state.viewMode === 'type') updateTyping();
  });
}
render(0);
</script>
</body>
</html>
