        };

        const GuideCard = ({ title, children, type = "info" }) => {
            const styles = {
                info: "bg-blue-50/80 border-blue-200 text-blue-900",
                success: "bg-emerald-50/80 border-emerald-200 text-emerald-900",
                warning: "bg-amber-50/80 border-amber-200 text-amber-900",
                purple: "bg-purple-50/80 border-purple-200 text-purple-900",
            };
            const iconColors = {
                info: "text-blue-500", success: "text-emerald-500", warning: "text-amber-500", purple: "text-purple-500"
            };
            
            return (
                <div className={`${styles[type]} border rounded-2xl p-5 mb-6 shadow-sm`}>
                    <h4 className={`font-bold flex items-center mb-2.5 ${iconColors[type]}`}>
                        <IconSparkles className="mr-2" size={20} /> <span className="text-slate-800">{title}</span>
                    </h4>
                    <div className="text-sm space-y-2 text-slate-700 leading-relaxed">
                        {children}
                    </div>
                </div>
            );
        };

        const SectionHeader = ({ title, icon: Icon, color = "text-primary-600" }) => (
            <div className="flex items-center mb-6 border-b border-slate-100 pb-4">
                <div className={`p-2 rounded-xl bg-slate-50 border border-slate-100 mr-3 ${color} shadow-sm`}>
                    <Icon size={24} />
                </div>
                <h3 className="text-xl font-bold text-slate-800">{title}</h3>
            </div>
        );

        const InteractiveSortBuilder = ({ data, onComplete }) => {
            const [selectedChunks, setSelectedChunks] = useState([]);
            const [isCorrect, setIsCorrect] = useState(null);
            const [shuffledChunks, setShuffledChunks] = useState([]);
            const [shakeError, setShakeError] = useState(false);

            useEffect(() => {
                const array = [...data.chunks];
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                setShuffledChunks(array);
                setSelectedChunks([]);
                setIsCorrect(null);
            }, [data]);

            const handleSelectChunk = (chunk) => {
                if (!selectedChunks.find(c => c.id === chunk.id)) {
                    const newSelection = [...selectedChunks, chunk];
                    setSelectedChunks(newSelection);
                    
                    if (newSelection.length === data.chunks.length) {
                        const isOrderCorrect = newSelection.every((c, idx) => c.id === data.correctOrder[idx]);
                        setIsCorrect(isOrderCorrect);
                        if (isOrderCorrect) {
                            if(onComplete) onComplete();
                        } else {
                            setShakeError(true);
                            setTimeout(() => setShakeError(false), 500);
                        }
                    } else {
                        setIsCorrect(null);
                    }
                }
            };

            const handleRemoveChunk = (chunk) => {
                setSelectedChunks(selectedChunks.filter(c => c.id !== chunk.id));
                setIsCorrect(null);
            };

            return (
                <div className="mt-4 bg-white border border-slate-200 rounded-2xl p-5 shadow-sm animate-scale-in">
                    <div className="flex items-start bg-slate-50 border border-slate-100 p-3.5 rounded-xl text-sm mb-5 text-slate-700">
                        <span className="bg-slate-200 text-slate-700 text-xs font-bold px-2 py-1 rounded-md mr-3 whitespace-nowrap">Dịch ý</span>
                        <span className="font-medium">"{data.vietnamese}"</span>
                    </div>

                    <div className={`min-h-[80px] bg-slate-50/50 border-2 border-dashed ${isCorrect === false ? 'border-red-300 bg-red-50/30' : isCorrect === true ? 'border-emerald-400 bg-emerald-50/30' : 'border-slate-300'} rounded-xl p-3 flex flex-wrap gap-2 items-center mb-5 transition-all duration-300 ${shakeError ? 'animate-shake' : ''}`}>
                        {selectedChunks.length === 0 && <span className="text-slate-400 font-medium text-sm flex w-full justify-center">👉 Click vào các cụm từ bên dưới để sắp xếp...</span>}
                        {selectedChunks.map((chunk, idx) => (
                            <span 
                                key={chunk.id} 
                                onClick={() => handleRemoveChunk(chunk)}
                                className={`
                                    px-4 py-2 rounded-lg shadow-sm cursor-pointer transition-all flex items-center text-sm font-medium
                                    ${isCorrect === true 
                                        ? 'bg-emerald-500 text-white shadow-emerald-500/20' 
                                        : 'bg-primary-600 text-white shadow-primary-500/20 hover:bg-rose-500 hover:shadow-rose-500/20'}
                                `}
                                title={isCorrect ? "" : "Click để tháo ra"}
                            >
                                {chunk.text}
                            </span>
                        ))}
                    </div>

                    {isCorrect === true && (
                        <div className="p-3.5 bg-emerald-50 text-emerald-800 rounded-xl mb-5 flex items-center text-sm font-bold border border-emerald-200 animate-scale-in">
                            <IconCheckCircle className="mr-2 text-emerald-500" size={20} /> Excellent! Cấu trúc câu rất chuẩn xác.
                        </div>
                    )}
                    {isCorrect === false && (
                        <div className="p-3.5 bg-rose-50 text-rose-800 rounded-xl mb-5 flex items-center text-sm font-bold border border-rose-200 animate-scale-in">
                            <IconXCircle className="mr-2 text-rose-500" size={20} /> Thứ tự chưa đúng logic. Hãy click vào cụm từ bên trên để tháo ra xếp lại.
                        </div>
                    )}

                    <div className="flex flex-wrap gap-2.5">
                        {shuffledChunks.filter(c => !selectedChunks.find(sc => sc.id === c.id)).map(chunk => (
                            <button
                                key={chunk.id}
                                onClick={() => handleSelectChunk(chunk)}
                                disabled={isCorrect}
                                className={`
                                    bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-lg shadow-sm text-sm font-medium
                                    transition-all hover:-translate-y-0.5 hover:shadow-md hover:border-primary-300 hover:text-primary-700
                                    ${isCorrect ? 'opacity-0 scale-95 pointer-events-none' : ''}
                                `}
                            >
                                {chunk.text}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-soft border border-slate-100 mb-8 animate-fade-up" style={{animationDelay: '0.1s'}}>
                <SectionHeader title="1. Map Vocabulary Master" icon={IconCompass} color="text-amber-500" />
                
                <GuideCard title="Đặc sản của bài Map: Giới từ & Động từ" type="info">
                    Khác với biểu đồ Line hay Bar, bài Map yêu cầu bạn phải miêu tả được chính xác <strong>Vị trí (Location)</strong> và <strong>Sự thay đổi (Changes)</strong>. Dưới đây là các cụm từ "ăn điểm". <br/><span className="inline-block mt-2 font-medium text-blue-700 bg-blue-100/50 px-2 py-1 rounded">✨ Tips: Di chuột vào thẻ từ vựng để xem nghĩa!</span>
                </GuideCard>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <h4 className="font-bold text-slate-800 mb-4 flex items-center">
                            <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center mr-2"><IconMap size={16} /></div>
                            Phương Hướng & Vị Trí
                        </h4>
                        <ul className="space-y-2.5">
                            {MAP_DATA.vocabulary.filter(v => v.type === 'location').map((v, idx) => (
                                <li key={idx} className="group relative bg-white p-3 rounded-xl cursor-help border border-slate-200 hover:border-blue-300 hover:shadow-md transition-all duration-200 text-sm">
                                    <span className="font-semibold text-slate-700 block group-hover:text-blue-700 transition-colors">{v.word}</span>
                                    <div className="tooltip-content absolute bottom-full left-0 mb-2 w-max max-w-xs bg-slate-800 text-white text-xs p-3 rounded-lg z-10 font-medium">
                                        {v.meaning}
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>
                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <h4 className="font-bold text-slate-800 mb-4 flex items-center">
                            <div className="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center mr-2"><IconMoveRight size={16} /></div>
                            Động từ Sự Thay Đổi
                        </h4>
                        <ul className="space-y-2.5">
                            {MAP_DATA.vocabulary.filter(v => v.type === 'change').map((v, idx) => (
                                <li key={idx} className="group relative bg-white p-3 rounded-xl cursor-help border border-slate-200 hover:border-purple-300 hover:shadow-md transition-all duration-200 text-sm">
                                    <span className="font-semibold text-slate-700 block group-hover:text-purple-700 transition-colors">{v.word}</span>
                                    <div className="tooltip-content absolute bottom-full left-0 mb-2 w-max max-w-xs bg-slate-800 text-white text-xs p-3 rounded-lg z-10 font-medium">
                                        {v.meaning}
                                    </div>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            </div>
        );

        const OverviewSection = () => {
            const [quizAnswers, setQuizAnswers] = useState({});
            const [showQuizResult, setShowQuizResult] = useState(false);
            
            const handleQuizChange = (qIndex, option) => setQuizAnswers({...quizAnswers, [qIndex]: option});
            const checkQuiz = () => setShowQuizResult(true);

            const isQuizPerfect = Object.keys(quizAnswers).length === MAP_DATA.overviewQuestions.length &&

            return (
                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-soft border border-slate-100 mb-8 animate-fade-up" style={{animationDelay: '0.2s'}}>
                    <SectionHeader title="2. Master the Overview" icon={IconListOrdered} color="text-purple-500" />
                    
                    <GuideCard title="Chiến thuật viết Overview" type="purple">
                        <ul className="list-disc pl-5 space-y-1">
                            <li><strong>Gom nhóm sự thay đổi:</strong> Nhìn chung thị trấn được đô thị hóa hay nhiều cây xanh hơn? (Đô thị hóa/Hiện đại hóa).</li>
                            <li><strong>Nhấn mạnh thay đổi lớn nhất:</strong> Chỉ ra sự xuất hiện của đường xá mới hoặc các cơ sở hạ tầng lớn thay thế cái cũ.</li>
                        </ul>
                    </GuideCard>

                    <div className="mb-6 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                        <h4 className="font-bold text-slate-800 mb-2 text-lg">Bước 1: Phân tích xu hướng chung</h4>
                        <p className="text-sm text-slate-500 mb-6 font-medium">Trả lời 2 câu hỏi sau để nhặt ra ý chính cho phần Overview.</p>
                        
                        {MAP_DATA.overviewQuestions.map((q, qIndex) => (
                            <div key={qIndex} className="mb-6 last:mb-0">
                                <p className="font-bold text-slate-800 mb-3">{qIndex + 1}. {q.question}</p>
                                <div className="flex flex-col space-y-2.5">
                                    {q.options.map((opt, oIndex) => {
                                        const isSelected = quizAnswers[qIndex] === opt;
                                        const isCorrectAns = q.answer === opt;
                                        let btnClass = "text-left px-5 py-3 rounded-xl border-2 transition-all font-medium text-sm ";
                                        
                                        if (showQuizResult) {
                                            if (isSelected && isCorrectAns) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                                            else if (isSelected && !isCorrectAns) btnClass += "bg-rose-50 border-rose-400 text-rose-800";

                                            btnClass += isSelected ? "bg-primary-50 border-primary-500 text-primary-800 shadow-sm" : "bg-white border-slate-200 hover:border-primary-300 text-slate-600 hover:bg-slate-50";
                                        }

                                        return (
                                            <button key={oIndex} onClick={() => handleQuizChange(qIndex, opt)} disabled={showQuizResult} className={btnClass}>
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                        {!showQuizResult && (
                            <div className="mt-6 pt-4 border-t border-slate-200">
                                <button onClick={checkQuiz} disabled={Object.keys(quizAnswers).length < 2} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                                    Xác nhận phân tích
                                </button>
                            </div>
                        )}
                    </div>

                    {showQuizResult && isQuizPerfect && (

            const [grammarAnswers, setGrammarAnswers] = useState({});
            const [showGrammarResult, setShowGrammarResult] = useState(false);
            const [activeSentenceIndex1, setActiveSentenceIndex1] = useState(0);
            const [activeSentenceIndex2, setActiveSentenceIndex2] = useState(0);

            const handleGrammarChange = (qIndex, option) => setGrammarAnswers({...grammarAnswers, [qIndex]: option});
            const checkGrammar = () => setShowGrammarResult(true);

            const isGrammarPerfect = Object.keys(grammarAnswers).length === MAP_DATA.grammarQuiz.length && 
                MAP_DATA.grammarQuiz.every((q, idx) => grammarAnswers[idx] === q.answer);

            return (
                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-soft border border-slate-100 mb-8 animate-fade-up" style={{animationDelay: '0.3s'}}>
                    <SectionHeader title="3. Writing Body Paragraphs" icon={IconAlignLeft} color="text-emerald-500" />

                    <div className="mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                        <h4 className="font-bold text-slate-800 mb-2 text-lg">Khởi động: Logic chia đoạn & Ngữ pháp</h4>
                        <p className="text-sm text-slate-500 mb-6 font-medium">Làm đúng 2 câu này để "mở khóa" phần thực hành viết.</p>
                        
                        {MAP_DATA.grammarQuiz.map((q, qIndex) => (
                            <div key={qIndex} className="mb-6 last:mb-0">
                                <p className="font-bold text-slate-800 mb-3">{qIndex + 1}. {q.question}</p>
                                <div className="flex flex-col space-y-2.5">
                                    {q.options.map((opt, oIndex) => {
                                        const isSelected = grammarAnswers[qIndex] === opt;
                                        const isCorrectAns = q.answer === opt;
                                        let btnClass = "text-left px-5 py-3 rounded-xl border-2 transition-all font-medium text-sm ";
                                        
                                        if (showGrammarResult) {
                                            if (isSelected && isCorrectAns) btnClass += "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm";
                                            else if (isSelected && !isCorrectAns) btnClass += "bg-rose-50 border-rose-400 text-rose-800";
                                            else if (!isSelected && isCorrectAns) btnClass += "bg-white border-emerald-200 text-emerald-600";
                                            else btnClass += "bg-white border-slate-100 text-slate-400 opacity-60";
                                        } else {
                                            btnClass += isSelected ? "bg-emerald-50 border-emerald-500 text-emerald-800 shadow-sm" : "bg-white border-slate-200 hover:border-emerald-300 text-slate-600 hover:bg-slate-50";
                                        }

                                        return (
                                            <button key={oIndex} onClick={() => handleGrammarChange(qIndex, opt)} disabled={showGrammarResult} className={btnClass}>
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                                {showGrammarResult && grammarAnswers[qIndex] === q.answer && (
                                    <div className="mt-3 text-sm text-emerald-800 bg-emerald-100/50 p-4 rounded-xl border border-emerald-200 flex items-start animate-scale-in">
                                        <IconSparkles size={20} className="mr-2 flex-shrink-0 text-emerald-500"/>
                                        <p className="font-medium">{q.explanation}</p>
                                    </div>
                                )}
                            </div>
                        ))}
                        {!showGrammarResult && (
                            <div className="mt-6 pt-4 border-t border-slate-200">
                                <button onClick={checkGrammar} disabled={Object.keys(grammarAnswers).length < 2} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                                    Chốt phương pháp
                                </button>
                            </div>
                        )}
                    </div>

                    {showGrammarResult && isGrammarPerfect && (
                        <div className="space-y-6 animate-fade-up mt-8 border-t border-slate-100 pt-8">
                            <h4 className="font-extrabold text-2xl text-slate-800 mb-6">Thực hành Viết Body từng câu</h4>
                            
                            {/* Body 1 */}
                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                <h5 className="font-bold text-blue-900 mb-1 text-lg">Body 1: Giao thông & Khu vực phía Bắc</h5>
                                <p className="text-sm text-slate-500 mb-5 font-medium">Hoàn thành câu 1 để mở khóa câu tiếp theo.</p>
                                
                                {MAP_DATA.body1Sentences.map((sentence, idx) => (

                            {activeSentenceIndex1 === MAP_DATA.body1Sentences.length - 1 && (
