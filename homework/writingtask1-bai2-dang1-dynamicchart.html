<body class="text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // ==========================================
        // COMPONENTS
        // ==========================================

        const InteractiveVocab = ({ en, vi }) => {
            const [flipped, setFlipped] = useState(false);

                <span

        // Component hiển thị Công thức - Dùng font sans-serif tinh tế, loại bỏ hoàn toàn font code cứng nhắc
        const StructureBox = ({ children, variant = "indigo" }) => {
            const themes = {
                indigo: "bg-gradient-to-r from-indigo-50 to-blue-50 border-indigo-500 text-indigo-900",
                pink: "bg-gradient-to-r from-pink-50 to-rose-50 border-pink-400 text-pink-700"
            };
            const activeTheme = themes[variant];

            return (
                <div className={`${activeTheme} border-l-4 px-5 py-4 rounded-r-xl my-4 shadow-sm inline-block w-full`}>
                    <span className="font-sans font-bold text-[16px] tracking-wide leading-relaxed block">
                        {children}
                    </span>
                </div>
            );
        };

        // Component chèn ảnh dùng kỹ thuật Bypass CORS của Google
        const DriveImage = ({ driveId, alt, title }) => (
            <div className="w-full my-8 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col items-center p-6 relative">
                <div className="absolute top-0 left-0 bg-primary text-white text-xs font-bold px-3 py-1 rounded-br-lg z-10">{title}</div>
                <div className="mt-4 w-full flex flex-col items-center">
                    <img 
                        src={`https://lh3.googleusercontent.com/d/${driveId}`} 
                        alt={alt} 
                        className="w-full max-w-2xl h-auto object-contain rounded-lg shadow-sm border border-slate-100"
                        onError={(e) => { 
                            // Nếu lh3 lỗi, fallback về chế độ thumbnail
                            if (!e.target.dataset.retried) {
                                e.target.dataset.retried = "true";
                                e.target.src = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;
                            } else {
                                e.target.style.display = 'none'; 
                                e.target.nextSibling.style.display = 'block'; 
                            }
                        }}
                    />
                    <div style={{ display: 'none' }} className="text-red-500 font-medium mt-4 text-center px-4">
                        <i className="fas fa-exclamation-triangle text-2xl mb-2"></i><br/>
                        Không thể tải ảnh. Hãy kiểm tra lại file đã bật "Bất kỳ ai có liên kết" chưa.
                    </div>
                </div>
            </div>
        );

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mt-6 flex flex-col md:flex-row gap-6">

                                    <ul className="list-disc ml-5 space-y-2 text-slate-600">
                                        <li>Viết mở bài và phần tổng quan hiệu quả.</li>
                                        <li>Sắp xếp thông tin hợp lý và viết thân bài.</li>

                                    <h4 className="text-primary font-bold mb-3 uppercase tracking-wider text-sm"><i className="fas fa-sitemap mr-2"></i>Cấu trúc bài viết chuẩn</h4>

                                        <div className="flex justify-center text-slate-300"><i className="fas fa-arrow-down"></i></div>

                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8">
                                <h4 className="font-bold text-lg mb-2 text-slate-800">Một số dạng biểu đồ đường thường gặp:</h4>
                                <div className="grid md:grid-cols-2 gap-4">
                                    <DriveImage driveId="1WfFHLTjJvoGQFMfjMMKsNVjMgusw0lxV" title="BIỂU ĐỒ 1" alt="Percentage of tourists to Scotland who visited different attractions (1980–2010)" />
                                    <DriveImage driveId="1buyLEdewl_AQXCcLcnrqAuMSXy0dsdma" title="BIỂU ĐỒ 2" alt="Percentage of total music sales by methods" />
                                </div>
                                <DriveImage driveId="1JG60izgyBA2gec0W5jTuJAQ5KU4GGLN4" title="BIỂU ĐỒ 3 (Đề bài phân tích)" alt="Average annual expenditures on books, technology and clothes in Someland (2011–2020)" />
                                <div className="bg-blue-50 p-5 rounded-xl text-blue-900 border border-blue-100 mt-2 text-sm italic font-medium shadow-sm">
                                    <strong>Đề bài phân tích:</strong> The graph shows consumers’ average annual expenditures on books, technology and clothes in Someland between 2011 and 2020. Summarize the information by selecting and reporting the main features and make comparisons where relevant. Write at least 150 words.
                                </div>
                            </div>
                        </ParagraphBlock>

                        {/* 2. CÁCH VIẾT MỞ BÀI */}
                        <ParagraphBlock num="I" title="Cách viết Mở bài (Introduction Formula)">
                            <p>Mở bài thường giới thiệu tên của biểu đồ và thông tin trong biểu đồ. Thực hiện qua 2 bước:</p>
                            
                            <h4 className="font-bold text-primary mt-6 mb-2 uppercase text-sm tracking-widest flex items-center"><span className="bg-primary text-white rounded-full w-5 h-5 flex items-center justify-center mr-2 text-xs">1</span>BƯỚC 1: Phân tích đề & Paraphrase</h4>

                                <table className="w-full text-left border-collapse bg-white border border-slate-200">

                                        <tr>
                                            <th className="p-4 border-b border-slate-200 font-bold uppercase text-xs tracking-wider">Thành phần</th>

                                    </thead>
                                    <tbody className="text-[15px]">
                                        <tr><td className="p-4 border-b border-slate-100 font-bold text-slate-500 bg-slate-50">Graph name</td><td className="p-4 border-b border-slate-100 text-slate-700">The line graph</td><td className="p-4 border-b border-slate-100 text-primary font-bold">The line graph</td></tr>
                                        <tr><td className="p-4 border-b border-slate-100 font-bold text-slate-500 bg-slate-50">Verb</td><td className="p-4 border-b border-slate-100 text-slate-700">shows</td><td className="p-4 border-b border-slate-100 text-primary font-bold">illustrates / compares</td></tr>
                                        <tr><td className="p-4 border-b border-slate-100 font-bold text-slate-500 bg-slate-50">What</td><td className="p-4 border-b border-slate-100 text-slate-700">consumers’ average annual expenditure on books, technology and clothes</td><td className="p-4 border-b border-slate-100 text-primary font-bold">the average yearly amount of money spent on books, technology and clothes</td></tr>
                                        <tr><td className="p-4 border-b border-slate-100 font-bold text-slate-500 bg-slate-50">Where</td><td className="p-4 border-b border-slate-100 text-slate-700">in Someland</td><td className="p-4 border-b border-slate-100 text-primary font-bold">in Someland</td></tr>
                                        <tr><td className="p-4 border-b border-slate-100 font-bold text-slate-500 bg-slate-50">When</td><td className="p-4 border-b border-slate-100 text-slate-700">between 2011 and 2020</td><td className="p-4 border-b border-slate-100 text-primary font-bold">over a period of 10 years starting from 2011</td></tr>

                            <div className="grid md:grid-cols-2 gap-6 mt-6">
