      "script": "1: Bringing up kids can be stressful, but especially when you're on your own. It's difficult tofind time to relax and then I have trouble sleeping. I dream of having a massage or spa treatment, but actually what I've found works best for me is colouring. I was doing some with my son one day, and I suddenly realized, I just wasn't thinking about anything. We were both just... concentrating hard. So I got some adult colouring books, and if I do some just before bed, well, I sleep like a baby!\n2: After the crash, I was depressed. It was such a huge change in my life and I found it... stressful. People said I should take up painting or something tohelp, but I'm an active person and very competitive - always have been - and so I just th o u g h t... how is that me? Then one day, a friend mentioned asitting volleyball club at a local sports centre. We both decided tohave a go, as anyone can play - not just people with disabilities - and we both loved it. We now play twice a week and I also compete in a national league.\n3: I mainly relax and keep fit just walking everywhere - and I find that's enough. Since I've been pregnant, my mum's worried I do too much and says I should use public transport, but I need my walk home after astressful day. It helps clear my head. The other thing I do, like many people here, is have asauna. My mum worries about that too, but the doctor says it's OK if I turn down the heat and don't stay in too long.\n4: I started doing yoga a couple of years ago at school. I had problems studying. I found it difficult to concentrate and then teachers stressed me out and I'd get angry. So, the school said I had to join their yoga programme. I wasn't keen - but you know what? It really helped. I think I graduated because of yoga. Now I've left school, I still do some every day - just at home. I follow a guy online I like. I might even train to teach itone day. We'll see.\n5: Until recently, most afternoons I go to a place near my home to dance with friends. In China, it's quite common. I started after I retired because I find it lonely in my flat. Lotsof us go to a basketball court nearby and we do square dancing. But can you believe it? Some people don't like it! Neighbours say our music is too loud and the kids complain they can't play on the court. A few weeks ago, there was a big argument about it and the police came and closed the court. I hope they open it soon. I miss it.",

      "audioFile": "out3e_3pi_sb_u06A_ex04.mp3",
      "script": "B: Laura. Sorry I'm late. I was working and didn't notice the time.\nL: Working toohard again, Bella?\nB: Yeah, maybe. How long have you been here?\nL: Only five minutes. Ben was a bit late back from work too, and I couldn't leave Maya.\nB: Of course not. How is she? Do you have a photo?\nL: Obviously! Hundreds!... Look at thisone though - Lucas invited us for lunch. You know, Lucas...\nB: Er, yes, sadly... Oh my word! Maya, she's so cute!\nL: She is when she's not crying.\nB: Aww, well she looks adorable there. And she's grown! How old is she now?\nL: Eight months.\nB: Gosh! I can't believe it! Time goes so quickly. Aww...\nL: I know!\nB: Lovely... Is that a beard Lucas is trying to grow, by the way?\nL: ... Oh, yeah, I'm not sure it suits him.\nB: No... So who's the woman sitting between you and him?\nL: Oh that's his new girlfriend - I think that's why he invited us.\nB: Really? New girlfriend! When did they start dating?\nL: I don't know - three months? He seems keen.\nB: Well, we'll see if it lasts... What's she like, then?\nL: Actually, really, really nice - too good for him really.\nB: Hmm.\nL: Yeah, I mean, we goton immediately. She loved Maya... I think Lucas noticed!\nB: Does he want tohave kids? He never gave me that impression.\nL: Probably n o t... He's never seemed interested in Maya.\nB: Well she's competition for attention! So what does she do, then, this, er - what's her name?\nL: It's Marcia. I'm not sure exactly. Marketing, I think. I think that's how they met. They were working closely on some project...\nB: Somehow that doesn't surprise me... Anyway, just changing the subject, who's the other woman with the blonde hair?\nL: Oh she's...",

    "out3e_3pi_sb_u06C_ex04.mp3": {
      "unit": 6,

      "audioFile": "out3e_3pi_sb_u06C_ex04.mp3",
      "script": "H: Welcome to The Family Way, the show that deals with anything you'd possibly like to know about family life. My name's Harry Freud and today I'm joined by psychologist and child number five of... six, is it?\nS: Six, that's right.\nH: Sharmi Sharma. Sharmi, welcome to the show.\nS: It's a pleasure to be here. I'm a big fan.\nH: Thanks. So Sharmi's here as this week's expert, to discuss birth order - where you come in the family, if you're the eldest, youngest, etc. - and how it affects your character.\nS: Or perhaps n o t...",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u06C_ex07_08.mp3": {
      "unit": 6,
      "lesson": "6C",
      "exercises": "7 & 8",
      "audioFile": "out3e_3pi_sb_u06C_ex07_08.mp3",
      "script": "H: Yeah, so it seems what we thought before is actually... in doubt?\nS: Absolutely. Before, we thought birth order affected character and future jobs. So, for example, the first child was more reliable and studied harder, so they often became leaders. The idea was that the parents were more anxious with their first child, so it got full attention and they were stricter about things like studying.\nH: I see. And the younger ones?\nS: Well, the theory was the youngest basically couldn't compete for attention with the smartest, so they became creative and confident, which is why they were more likely to do creative work like acting.\nH: Right. And if you're in the middle?\nS: Well, the idea was that the parents kindof ignored them, so they became more open and friendly to get attention outside the home.\nH: But you're saying that's actually all wrong.\nS: Well, it seems so. Morerecent research shows the oldest are on average a little bit more intelligent, but... er, the difference is really small. I mean, it's not like one gets grade As and the others Ds. And it certainly doesn't make older children better leaders.\nH: Are we sure? I mean, we all know cases which fit the pattern. Like, isn't Jeff Bezos the oldest child, and -\nS: No, of course. This is what happens. When we hear these theories, we often only remember examples that fit the pattern but ignore other cases. So leaders like Bezosor Angela Merkel were both born first, but then look at Bill Gates and Nelson Mandela - neither of them were the oldest. And then there are families like mine where we're all equally smart, or others where they're all actors!\nH: Understood.\nS: And focusing on famous people is a bad idea because they are a very small, quite unusual partof society. Morerecent research looked at recordsof over twenty thousandordinary people from different countries and families and... well, as I say, they found birth order doesn't affect personality.\nH: Sohow do we explain differences within families, then?\nS: We don't really know. It could be genes, it could be the friends you have, parents feeling stressed. All kindsof things.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u07A_ex02_03.mp3": {

      "script": "Conversation 1\nA: Where are you from, Domi?\nB: France.\nA: Oh nice! Which part?\nB: Metz.\nA: Where's that?\nB: It's asmall city in the north-east. It's around 300 kilometres from Paris. So, say that's Paris, OK? Well, Metz isover here - near the German border.\nA: Oh, OK. So what's it like?\nB: It's very nice. The centre's very old, with some beautiful old buildings, and it's great because it'sonly for pedestrians - you can't drive there, only walk. The city's very green as well. We have some very nice public gardens.\nA: It sounds lovely. So where do you live? In the centre?\nB: Not exactly, but everything is quite near. It's not very big - maybe 120,000 people. And it's easy to get around. I live near theriver, the Moselle, and you can walk along there, which is nice.\nConversation 2\nC: So, where are you from, Kasem?\nD: Thailand.\nC: Oh, really? Whereabouts?\nD: You probably won't know it. It's a little town called Satun. It's right in the south - not far from the border with Malaysia.\nC: Yeah, I know it. In fact, I've been there! A cousin of mine lives in Langkawi with his wife and I went to visit them a few years ago.\nD: Seriously? Wow! What asmall world.\nC: I know, right.\nD: Langkawi is really close to me. So what did you think of it?\nC: Oh, it was lovely. I mean, Satun's a bit quiet, but for a holiday, the whole area's great.\nD: When were you there? What time of year?\nC: February, but the climate's so lovely. It's so warm. I went to the beach quite a lot.\nD: Right. A udio scrip ts\nC: And we took a boat along the coast a couple of times and went fishing.\nD: Did you catch anything?\nC: Not much, but it was just nice to be on the sea.\nD: Well, if you ever come back to Satun, let me know. We could meet and I could show you around.\nC: Sure! Give me your details.\nConversation 3\nE: Where are you from, Rosa?\nF: Belize.\nE: Oh, OK. Belize... I'm really sorry, but where is that exactly? My geography isn't very good.\nF: It's in Central America - on the Caribbean side. So if you imagine you've got Mexico up here and then Guatemalato the le f t... Well, Belize is about here - on theright, above Honduras, if that helps.\nE: OK, I think I know where you mean. And where do you live?\nF: In the capital, Belmopan - in the middle of the country.\nE: Oh, OK. How big is it?\nF: Oh, it's quite small. We only have around 20,000 people, I think. The whole country isonly four hundred thousand, so...\nE: Right. I didn't know that. And what's it like to live in?\nF: Ah, I love it. It's a very modern city. The people are friendly, there's a real mix of cultures, and we can get to the coast in an hour as well!",

    "out3e_3pi_sb_u08A_ex04_05.mp3": {

      "script": "Conversation 1\nA: So, how's school, Ollie? Your father told me you're doing well.\nB: It's OK, I suppose. Some bits are good.\nA: Yeah? What are your favourite subjects?\nB: Spanish and Art. And History's OK as well.\nA: And what year are you in now?\nB: Year eleven.\nA: Sohow long have you got left?\nB: Well, if all goes well, I'll have two more years.\nA: What are you going to do when you leave school? Any plans?\nB: Well, if I can save enough money between now and then, I'll try and take a year off. Maybe go travelling. Dad doesn't want me to, though.\nA: No?\nB: No, he just wants me to go straight to university and study Businessor something - and then when I finish, I can become just like him!\nA: Yeah, well. He's probably just worried about you.\nB: Yeah, right. Whatever!\nConversation 2\nC: So what degree are you doing, Pep?\nD: Maths.\nC: Wow! OK. That sounds hard.\nD: Yeah, it can be, but I'm really enjoying it. To be honest, the most difficult thing for me is doing the whole degree in English, but my teachers are great. Everybody has been very helpful.\nC: What year are you in?\nD: My third, unfortunately. I've got my final exams next April!\nC: Oh, OK. Well, good luck!\nD: Thanks!\nC: What are you going to do after you finish university? Any plans?\nD: Well, if I get the grades I want, I'll probably do a Master's somewhere.\nC: Oh, OK. What in? The same subject?\nD: Maybe. I'm not sure. I'm thinking of maybe doing Physics, actually.\nC: Oh, right. Have you applied anywhere yet?\nD: No, I haven't, actually - not yet. But I probably will in the next few weeks.\nConversation 3\nE: How's work going, Dhanya? Are you enjoying it?\nF: Yes, it's great, thanks. I really like my colleagues and my boss - and I'm learning a lot as well.\nE: Well, that's good.\nF: Yeah. I'm doing a course at the moment, actually.\nE: Really? What kind?\nF: It'son project management.\nE: Right. OK. So what does that involve?\nF: Well, today wasonly the second day, but we've talked about making decisions about what's most important to do, planning, that kindof thing. It's quite interesting - and I think it'll be useful in the future.\nE: Sounds good. How long does the course last?\nF: Four days - so just till the endof the week.",

    "out3e_3pi_sb_u08C_ex05_06.mp3": {
      "unit": 8,
      "lesson": "8C",
      "exercises": "5 & 6",
      "audioFile": "out3e_3pi_sb_u08C_ex05_06.mp3",
      "script": "I: Sohow did you find school when you first moved to Madrid?\nR: A bit mixed, to be honest. I mean, I made friends quite quickly and everyone was very friendly, but I remember that to begin with, my little brother just stood in the corner of the playground watching everyone play. It was sad - so I sortof had to look after him a bit, you know!\nI: But he made friends in the end?\nR: Yeah.\nI: And could you speak Spanish when you first arrived?\nR: Kindof. Mum and Dadoften speak it at home, so I could understand a bit, yeah, but in class I couldn't get everything, which wasn't much fun.\nI: Did you have to do extra Spanish classes?\nR: Not really. There was another girl in the class who spoke English so she translated a lot at the beginning. Then Mum and Dad helped me at home with my homework. And wow! We have to do so much here!\nI: Really?\nR: Yeah, I remember really crying about it when I first came because we didn't have to do much in primary in England - a bitof reading or something. Even now my friends in England complain when they have to do 45 minutes in secondary school, but I often have twohours - and sometimes study for testson top of that.\nI: Wow! OK. That sounds hard. So are classes different?\nR: Primary was, yeah. It's funny, actually, because I did the last year of primary in England, but then I had to do it again here because they have five yearsof secondary school in England, butonly four here, so kids start when they're twelve - not eleven. Sorry, what was the question again?\nI: Are classes different?\nR: Oh yeah. Well, basically, in primary in England we had the same teacher all day, but here we changed teachers. I really liked some, butothers werereally boring! Sometimes we just had to copy from the book. We didn't use textbooks much in England and we did more projects and arty things.\nI: Right. So which do you prefer?\nR: It's difficult to say. Now I'm at institute -\nI: Institute?\nR: Oh right, it's like high school - secondary school. We finish at two o'clock every day and then we get almost three monthsoff in the summer, whereas in England my friends finish at four and they only get six weeks' summer holiday. I chat to my friends in England still or read their updateson social media and they say school is boring too, and they get stressed with exams and stuff - but then they have this thing here, where if your teacher fails you in some subjects, you have to repeat the whole year! I don't like that stress.",
      "mapping": "exact_source_match",
      "note": null
    },

      "script": "Conversation 1\nA: Are you OK?\nB: Yeah... no. I just slept badly.\nA: Really? Do you suffer from that?\nB: No. I'm usually a good sleeper. No, I just felt bad. I had this ache in my legs and back. It was quite uncomfortable.\nA: That's not good. Have you taken anything for it?\nB: I had some paracetamol, which helped. But I still feel a b it... weak.\nA: Do you have atemperature? Maybe you've caught flu or something.\nB: I don't think so.\nA: Still, you should go to the doctor. Just to be sure.\nB: Achh, you have to wait so long - and if it is flu, they'll just tell me to rest and drink lotsof water.\nA: True. You definitely ought to gohome, though. You don't want anyone else to catch it, whatever it is.\nB: I guess. And now we're talking, I can feel something in my throat. It is a bit sore.\nA: Yeah, you're obviously not well.\nB: I know.\nA: Gohome, rest, drink lots.\nB: Yes, doctor!\nConversation 2\nC: Are you OK? That was a bad fall.\nD: Yeah, I think I'm OK.\nC: You've cut your head. There's a bitof blood.\nD: Oh, right. I don't know what happened there.\nC: Maybe I should call an ambulance.\nD: No, no, I'm OK. It's not bleeding badly, is it?\nC: No, but why don't you come and sit down here a moment? I'll go and get something for it.\nD: OK, thanks.\nC: Just stay there. I'll be back in a minute.\nConversation 3\nE: Are you OK? You weren't in class yesterday.\nF: No, I had a really bad headache - I get them sometimes.\nE: Really? That's not good. I have a friend who suffers from that too.\nF: Yeah?\nE: Have you been to the doctor about it?\nF: Yeah, yeah. They've done tests, and there's nothing obvious.\nE: Right. So they don't know what causes it?\nF: I mean, I know sometimes it's stress - and I have allergies, so it might be that.\nE: Right. It's not nice for you, though.\nF: No, but it could be worse. They don't happen too often and they don't last very long.\nE: Well, that's something, I guess.",

    },

      "audioFile": "out3e_3pi_sb_u09C_ex07.mp3",
      "script": "Conversation 1\nA: Are you OK?\nB: Hie! Yeah, I've just got hiccups. Oh gosh! Hie! It's really annoying.\nA: Here. I know a cure. It never fails.\nB: Hie.\nA: Take some water in your mouth, but don't drink it.\nB: Mmm.\nA: Now put your fingers in your ears. Bend down and put your head between your knees and swallow the water slowly.\nB: Mmmm?\nA: Swallow the water!\nB: Mmm.\nA: OK. You can breathe now. Have you still got them?\nB: Um, no, no, I don't think so.\nA: You see. It works every time.\nB: Maybe, but I wouldn't want to do it in frontof everyone! People would think I was mad!\nConversation 2\nC: Yes, can I help you?\nD: Yes, I need something for this.\nC: You have an upset stomach?\nD: Stomach, yes. It's very bad.\nC: In what way? Have you been sick? Does it hurt? Is it diarrhoea?\nD: Sorry, di...?\nC: I mean, are you going to the toilet a lot?\nD: Oh, yes, yes. It's very bad.\nC: But just to check. You haven't been sick?\nD: No, but I'm very thirsty - and... I still... it's a problem.\nC: I understand. It's very unpleasant. You need these. They'll stop the diarrhoea. Take two pills now and then one more if you go to the toilet and it's still bad.\nD: OK.\nC: OK and because you are weak and thirsty, you should probably take this. You mix it with water.\nD: Yes, yes.\nC: What flavour would you like? Orange or blackcurrant?\nD: Oh, orange.\nC: Don't take either for more than 48 hours. If by Wednesday it's still bad, go to the doctor.\nD: OK.\nC: That's £11.49.\nConversation 3\nE: The burn's not too bad. We'll give you some cream for it, but you'll need some stitches in that cut. It's quite deep. What happened?\nF: Well, I cut my head dancing with my son.\nE: I'm sorry?\nF: I was dancing with my five-year-old son and I steppedon one of his toys and I fell and hit my headon the side of the table.\nE: Oh dear. What about the burn, then?\nF: Well, my wife came in when she heard me shout and while she was helping me stand up, she knocked a cup of coffee off the table and it went all over my leg.\nE: Oh dear. I am sorry. I shouldn't laugh!\nF: Don't worry. It was very stupid!\nE: Nurse, could you dress the burn after I've done these stitches?\nG: Of course.",

 depositon a credit card.\nA: So if we have to cancel for whatever reason, we lose that money?\nR: I'm afraid so. The complete payment is made on arrival.\nA: OK. Thanks. I'll call back in a moment.",

      "script": "Conversation 1\nA: Excuse me, excuse me. You can't light a fire here.\nB: But it'sonly asmall barbecue. On your website it said it was fine.\nA: It is, but not here. The ground's very dry and tents could catch fire. We have aspecial area for barbecues.\nB: But there's no space there.\nA: I'm afraid it's always busy at this time. You can book a barbecue place at thereception, though. We also sell wood and lighters.\nB: And now?\nA: I'm afraid you'll have to wait till one becomes available.\nB: Ugh!\nConversation 2\nC: Hi, this is Rena. We're staying in your place.\nD: OK, yes. How are you? You arrived safely, then.\nC: We got a bit loston our way, but we followed your instructions to get the key and it was all very clear.\nD: Good.\nC: It's lovely, and thanks for leaving the snacks - we werereally hungry when we got here.\nD: Glad you like it.\nC: Actually, about the food. There were some eggs in the fridge, but we can't find a frying pan.\nD: Really? There should be one there.\nC: We've looked in all the cupboards and we can only find two big pans for pasta.\nD: Oh dear. I'll bring one over as soon as I can. Probably around six, after I get back from work.\nConversation 3\nE: I'm really sorry, sir. There are a lotof issues today. Where are you travelling to?\nF: Miami, and then I'm getting a connection there to go to Madrid.\nE: Right. I'm afraid that flight is currently delayed by three hours.\nF: But what about my connection in Miami?\nE: When you arrive there, our staff will explain your options. They'll probably organize a flight with another company, but it's possible you'll have to stay overnight.\nF: Really?\nE: I'm afraid so. If that happens, they'll take you to a hotel and provide food and drink, but as I say, that might not be necessary.\nConversation 4\nG: Hi. Everything OK?\nH: Not really. It was boiling in theroom last night and you don't have air conditioning.\nG: I know, but it doesn't usually get this hot here. We have put a fan in there.\nH: It's not very strong, though, and when I opened the window the other girls in theroom complained the traffic was keeping them awake.\nG: I'm sorry. I can't help you with that.\nH: No, I guess not. Actually, what I came to tell you isone of the sinks in the bathroom is blocked.\nG: Is there water on the floor?\nH: No.\nG: OK. I'll have a look when I get the chance - we're a bit short of staff today.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u11A_ex05_06.mp3": {
      "unit": 11,
      "lesson": "11A",
      "exercises": "5 & 6",
      "audioFile": "out3e_3pi_sb_u11A_ex05_06.mp3",
      "script": "Conversation 1\nA: Did you read that article about plastic bags at the bottom of the sea?\nB: No. What's that?\nA: Well, they've found some plastic bags at the bottom of the Mariana Trench - the deepest partof the sea anywhere in the world.\nB: Really? That's awful!\nA: I know. All that plastic's slowly destroying the sea and killing millionsof fish and birds and stuff.\nB: They should really just ban them.\nA: Good idea.\nConversation 2\nC: Did you see that story about this new'exercise pill'?\nD: No. What's that?\nC: So, they've found that exercise makes this special thing in your blood - it's like partof a protein, OK.\nD: Yeah.\nC: And it helps reduce the amount you eat. It makes you less hungry. Sonow they're going to try and make it into a pill.\nD: That sounds amazing.\nC: Yeah, it's great.\nConversation 3\nE: Did you see what they're planning to do on the south coast?\nF: No. What's that?\nE: It saidon the news that they're going to destroy some of the old factories there and create a wildlife area instead.\nF: Really? That's great. A udio scrip ts\nE: I know, right?\nF: They should do more of that kindof thing all over.\nE: Definitely. We all need more green spaces.\nConversation 4\nG: Did you see that story about this new way of transporting drugs that they've discovered?\nH: No. What's that?\nG: Well, they now knowhow to move them without them being affected by heat. In the past, they got hot when they moved them from place to place and that caused problems.\nH: Oh, OK.\nG: Yeah. It said in the paper that it could save millionsof lives.\nH: Really? Well, it makes a change tohear some good news.\nG: Absolutely.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u11C_ex05_06.mp3": {
      "unit": 11,
      "lesson": "11C",
      "exercises": "5 & 6",
      "audioFile": "out3e_3pi_sb_u11C_ex05_06.mp3",
      "script": "P: So the first question today is from Johan Tholson, who asks if it's really true that we only use 10% of our brains? Karen?\nK: Well, this idea has been around for a long time. Since the early 20th century, it's been the subjectof many books, and morerecently, the same idea appears in a Luc Besson film called Lucy. Now, the ideathat we could become much more intelligent if we use that secret 90% of our minds is exciting, but sadly, it's 100% false.\nP: That's ashame!\nK: Yep. But research shows that even when you just say a few words, way more than 10% of the brain is used. In fact, scientists who map the brain haven't found any area - and certainly not 90% of it - that doesn't affect thoughtor movementor feelings in some way.\nP: You've killed my biggest hope for the futureright there.\nK: Sorry.\nP: Oh well. Anyway, next is a question from Francesca Wilkins, whose mum doesn't like her chewing gum and has told her that if it's swallowed, it stays in the stomach for ages. Is Mum right?\nK: She won't thank me for saying this, but she's not, no. My own parents told me it stayed inside you for seven years and I used to imagine this ball of gum growing in my stomach. Now, it is true that it isn't designed to be swallowed - and it's also true that your body can't break down chewing gum - but this doesn't mean it stays in your body. It actually goes right through you and then comesout in the bathroom like anything else.\nP: A bit too much information, but thank you. Sonext up, surely thisone has to be a fact, Karen. Toby - aged eight - asks,'Is it true that mice like cheese?'\nK: Thanks for the question, Toby. It's a goodone. As you probably know, cheese isoften used when people are trying to catch mice. Maybe you've seen it in Tom and Jerry cartoons, say. Actually, though, mice aren't that keen on cheese. They might eat it if there's nothing else around, but studies show that if they're given a choice, they usually pick sweeter foods like fruitor chocolate.\nP: Really? So I've been wrong all these years? Lucky I have a cat! So where does this idea come from, then?\nK: Well, we don't know for certain where this ideastarted, but in the old days, before people had fridges, they used tohang meat from the ceiling, but cheese was just covered in cloth, which made it easier for mice tofind and eat. During times of disease, people stopped eating cheese altogether because they believed that mice were attracted to it. In fact, it was probably just the easiest food the mice could find!",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u12A_ex04_05.mp3": {
      "unit": 12,

      "audioFile": "out3e_3pi_sb_u12A_ex04_05.mp3",
      "script": "Conversation 1\nA: Hey Brendan. What's up?\nB: Hey Liz. Is Neil there? He's not answering his phone.\nA: Hello? Hello? Can't hear you very well. It's a bad signal.\nB: One minute. I'll go into the kitchen. The signal's better there. ... Can you hear me OK now?\nA: Yeah. That's much better.\nB: Phew! Anyway, hi. I'm looking for Neil.\nA: Ah, he's not up yet, I'm afraid. Is it urgent?\nB: No, it's OK. Just tell him we're meeting earlier - at seven, not eight. And tell him he's very lazy! Twelve o'clock and still in bed!\nA: Well, he wasout late last night.\nB: I see. So what time do you think he'll be up?\nA: I imagine in about an hour. He didn't get back home till four.\nB: Oh, right. Well, I'll see him later. Thanks.\nA: That's OK. I'll give himyour message and get him to call you back. Meet at seven, not eight.\nB: Yeah.\nA: Bye now.\nConversation 2\nC: Good morning, DBB. How can I help you?\nD: Hello. Could I speak to Jane Simpson, please?\nC: Of course. I'll just put you through.\nD: Thanks. • • ■\nC: She's not picking up, I'm afraid. Let me just try again.\nE: Hello.\nD: Hi. Jane?\nE: No, it's actually Poppy. I'm afraid Jane'sout visiting customers. Would you like to leave a message?\nD: Yeah, could you tell her Diane Lincoln from ASL called? And that I've already spoken to my boss and he said the price is fine, so we can go ahead with the work. Can you ask her to phone me when she gets back so we can sortout the details?\nE: Of course. Has she got your number?\nD: I'm not sure. Let me give it to you anyway - just to be on the safe side. It's 0772 651 118.\nE: OK. 0772 651 1 18. And what was your name again? Sorry.\nD: Diane Lincoln. L - l - N - C - O - L - N.S o when will she be back?\nE: Probably later this afternoon. I think she said she was going for lunch with someone.\nD: Oh, right. Well, I hope I can speak toher today because I'm actually away on holiday from tomorrow.\nE: Oh, right. Well, I'll let her know. Bye!\nD: OK. Thanks. Bye.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u12C_ex02_05.mp3": {
      "unit": 12,

      "audioFile": "out3e_3pi_sb_u12C_ex02_05.mp3",
      "script": "Conversation 1\nA: Hello, Better Banking.\nK: Oh, hello there. I need to cancel my cards, please. As soon as possible.\nA: OK, no problem, but I'm afraid I have to take you through security first. Can I get your full name, please?\nK: Um... oh, yes, of course. It's Kenji Watanabe. That's K - E - N - J...\nA: OK. You've passed security fine. I'll just put you through to theright department. One moment, please.\nB: Thanks for waiting. So, I've cancelled your cards andordered new ones, and they'll be with you in the next three tofour days. We'll also send you a new PIN number for each card.\nK: Oh, that's great. Thank you so much for your help.\nConversation 2\nC: OK. So can you just tell me how it happened?\nK: Yes. I was in a cafe with a friend and we were chatting and I put my bag down by my side and I guess someone took it while I wasn't looking.\nC: And did you see what this person looked like?\nK: Sadly not, no. I didn't even realize it had happened until we were leaving. But maybe there were cameras there?\nC: We'll check and see.\nK: Thank you.\nC: And I can give you a crimereference number so you can contact your insurance company, if you have one.\nK: OK. And what about my bag?\nC: Well, it's a big city andobviously we don't have the people to go and look for the person who did this, but if we dofind anything, we'll let you know.\nConversation 3\nK: Hey, Ruth, it's Kenji.\nR: Hey, Kenji! How are you doing? I'm so sorry your bag was stolen. I didn't notice anyone take it either - they were very quick!\nK: Yes, they really were!\nR: So did you manage to deal with everything?\nK: That's actually why I'm calling, Ruth. I've got a bitof a problem.\nR: Oh no! What's up?\nK: Well, I called the company that does the locks and I told them someone had stolen my bag and that it had my keys in it, so I needed to get into my apartment.\nR: Right.\nK: And they said I'd need new locks fitted as well - to be on the safe side. But then they asked if I could prove my identity and address.\nR: And?\nK: Well, as I told them, everything was in my bag. Then I said that I was renting the property - I didn'town it - and the owner was actually abroad at the moment and I couldn't contacther... because her number's in my phone!\nR: No! What a nightmare!\nK: I know. So to cut a long story short, they said they couldn't let me in - and so I need a place to sleep tonight!",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u13A_ex05_06.mp3": {

      "script": "A: OK. So what do you want to watch?\nB: I'm not sure. Do you want tohave a look while I make some tea?\nA: Sure, Let's see. Oh, Ozark - I still haven't watched the last season!\nB: I've never seen an episode!\nA: Ah you should! It's so good. I mean, it's a bit violent, but they're great characters.\nB: Maybe - but I'm not really watching any series at the moment. I don't have the time.\nA: I know what you mean.\nB: What films are there?\nA: Let's see... urn... Up in the Air - seen it, H e at-see n it, Titanic - seen it like, 60 times.\nB: Yeah, love it, but definitely not Titanic.\nA: Man Up - not seen it, but it's not supposed to be very good.\nB: Really? What's it about?\nA: It's a British romcom about a couple on a blind date.\nB: Hmm. Who's in it?\nA: Lake Bell and Simon Pegg.\nB: Don't knoweither of them.\nA: Anyway, I don't want to see it. How about Infernal Affairs? I'd watch that again.\nB: What kindof film is it?\nA: It's a Chinese thriller. It's set in Hong Kong.\nB: OK.\nA: It's great - very exciting. It's basically about a police officer who's acting as a criminal and a criminal who's acting as a police officer.\nB: Sounds a bit complicated...\nA: OK. Not that. Oooh, Roma - I loved that film.\nB: Me too - it's so beautiful. I think I need something lighter tonight though. I'm quite tired.\nA: True. It is a bit slow... maybe another night.\nB: Definitely.\nA: La La Land?\nB: Oh no! Why do people like that film?\nA: It's good! I guess it depends if you like musicals!\nB: No, but even then... the songs... they're just a b it... blah.\nA: Ahh, they're great! And it's romantic!\nB: We'll have to disagree.\nA: OK. What about In-touch-ablesor Intouchables - I'm not sure how it's pronounced. Actually, I've wanted to see that for ages.\nB: Don't know it. What's it about?\nA: Basically, it's about this rich guy who becomes disabled after an accid ent...\nB: Sounds a bit heavy.\nA: Wait! Give me a chance... He's looking for someone tohelp him and he employs this unemployed ex-criminal.\nB: It still sounds heavy.\nA: No it's not, it's not. It says it's a comedy drama. It's supposed to be about their relationship - how they help each other.\nB: OK.\nA: It's had great reviews.\nB: Can we watch it in English? I'm not sure I want to read subtitles.\nA: I don't think so. Why didn't you say before?\nB: What was the first filmyou mentioned?\nA: I give up - you look.",
      "mapping": "exact_source_match",

    "out3e_3pi_sb_u13C_ex03_05.mp3": {
      "unit": 13,
      "lesson": "13C",
      "exercises": "3 & 5",
      "audioFile": "out3e_3pi_sb_u13C_ex03_05.mp3",
      "script": "1: I've been a BTS fan for eight years now. It started when I was ill in bed and a friend shared a playlistof K-pop videos to watch. At first, I wasn't keen, but then I watched BTS performing Satoori Rap live on atalent show. They were different - their singing, their energy, their style, everything. So then I wenton the internet and listened to their albums and foundout more about them, how they write their own songs and what the songs mean. And I became a real ARMY, which is what we call ourselves in this great community of people who share a love for all things BTS.\n2: I'm a keen gamer. I think I've been playing every day since I was about six. I started with Angry Birds™ on my clad'sold iPad, but then Minecraft came out. Wow. That was incredible. First you explore these different worlds, but then you can use your imagination and build your own. Then, for about a year, Fortnite® replaced it as my favourite, because some friends were playing it a lot. But I got boredof just shooting and killing and went back to Minecraft. There's so many ways to play, you never get tiredof it. It's just very creative.\n3: I read a lotof history, politics, family dramas, crime novels, all kindsof things, I suppose. Claudia Pineirohas been my favourite writer over the last few years. I first picked up one of her books in ashop because I just liked the cover and what it saidon the back. And when I read it, I loved it, because it mixes being a good thriller with saying things about relationships and society. Since then, I'veread all her books. She's won lotsof prizes and some of her books have been made intofilms. The films are OK, but I prefer the books.\n4: I've wanted to be an artist since I was about five. I remember I did this drawing of our dog and my parents were like,'wow, that's so good' and they kept showing it to their friends. I liked the attention. When I was in secondary school, I started doing paintingsof friends and that's my main interest now. My favourite painter is Kehinde Wiley. He does these incredible portraitsof Black people with beautiful colourful backgrounds. Maybe you've seen the one he didof the US president Barack Obama? As a person of colour, I also love seeing people like me in a gallery.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u14A_ex04.mp3": {
      "unit": 14,
      "lesson": "14A",
      "exercises": "4 & 5",
      "audioFile": "out3e_3pi_sb_u14A_ex04.mp3",
      "script": "R: So, Aisha, the festival - it's in two weeks, right?\nA: Yeah. I can't wait. Are you looking forward to it?\nR: Sorry?\nA: Are you looking forward to the festival? Are you excited? There are so many bands I want to see.\nR: Of course. It's great, but I'm also a bit nervous.\nA: It'll be fine. You'll have a great time.\nR: Yes, but we still need to organize things!\nA: Oh, I see - I think we can do that next week.\nR: But where are we going to sleep?\nA: I have my tent and I have aspare sleeping bag you can use.\nR: I know, but what about... the thing that you puton the floor. You sleep on it.\nA: Oh, a mattress. Yeah, I usually just use my yoga mat.\nR: But that's very uncomfortable. How do you sleep?\nA: It'sonly a couple of nights.\nR: You don't have one which you, urn, how do you say, inflar- you put air in it.\nA: Ah, no. Those air beds are soheavy and then you have to take a pump - you know the thing you use to blow it up - to put the air in.\nR: I see. And what about eating - we'll need a cooker, right?\nA: I think we can manage withoutone. We can buy food there instead - there are lotsof stalls which sell all kindsof dishes.\nR: But that's very expensive.\nA: Maybe a bit, but if we take a gas cooker, we'll alsoneed to take gas and pans, plates, bowls, mugs, cutlery.\nR: C u t...?\nA: Sorry, cutlery - you know, knife, fork and spoon. And we'll have to carry all this stuff. The place where you camp is guite a long way from the car park.\nR: OK. I understand, but maybe we can take food that we don't need to cook - bread, cheese, fruit. Do you have a, urn, what do you call the thing to carry - for cold food?\nA: A cool box. No, but maybe we won't needone. It'll be OK for, say, two days and then on the last day we can buy something instead.\nR: OK. That sounds good. I'll bring some of those tissues to clean your hands - the wetones.\nA: OK, wet wipes, sure. Well that's everything, I think.\nR: Everything? No! What about the sleeping bag...",
      "mapping": "ordered_fallback_match",
      "note": "The source audio-script appendix labels this recording as Lesson 14A, Exercise(s) 4 & 5; the MP3 manifest uses out3e_3pi_sb_u14A_ex04.mp3. The pairing is based on the audio-file order within this lesson."
    },
    "out3e_3pi_sb_u14C_ex02.mp3": {
      "unit": 14,
      "lesson": "14C",
      "exercises": "2 & 4",
      "audioFile": "out3e_3pi_sb_u14C_ex02.mp3",
      "script": "Extract 1 My big sister usually gives me something for my birthday, but it's not usually anything very original - a T-shirtor a book or something. This year was a bit different though. She sent me an empty chocolate box withasmall piece of paper inside. The paper had a website address written on it. When I looked up the address, I realized that the website was the present! I love writing and my sister always says more people should see my stuff. The site was called Angelathe Writer and she'd already postedone of my short storieson there with a lovely design. Extract 2\nA: What should we get him as a leaving present?\nB: Well he says he wants to get fitter, so I'm thinking of some sports stuff like trainersor atennis racket?\nA: Does he play tennis?\nB: Well, he likes watching it!\nA: How about a mountain bike? He used to cycle to work, but his bike was stolen last year and he hasn't replaced it yet.\nB: That's quite generous - can we afford that?\nA: Well, it doesn't have to be top of therange and we can ask everyone at work to pay something.\nB: That's true - there are a lotof us. Let's do it. Extract 3 A few years ago, I wason a first date and the girl said she had a present for me. I was a bit embarrassed and was thinking why didn't I buy her some flowersor a box of chocolates? She then hands me asmooth round rock and she says,'I want you tohave something you'll never forget and can tell your children about.' I said'thanks' to be polite, but I actually thought it was pretty strange! Now, though, I have that rock on my desk to stop papers blowing away and that girl is my wife! Extract 4\nC: Your uncle left you a present.\nD: Oh cool. What? That big box?\nC: Yep - he seemed quite pleased with it.\nD: Oh...\nC: What is that? Is it supposed to be the Eiffel Tower?\nD: I think so.\nC: Your uncle said something about how much you like learning French.\nD: Well, French is cool, but this is so... ugly!\nC: You actually doneed a light next to your bed.\nD: I'm not having that in my bedroom! It'll look silly.\nC: Well, we can't throw it away. Extract 5 My best friend Dietmar and I are both worried about the environment, soneither of us thinks we should buy birthday presents just because society expects it. Instead, to celebrate each other's birthdays, we just arrange to do something nice together. This year we went for a bikeride in the mountains. We also always recycle the same card we gave each other the previous birthday, which is great, because we save paper and we never getolder! The card always says'Happy eighteenth birthday!'",
      "mapping": "ordered_fallback_match",
      "note": "The source audio-script appendix labels this recording as Lesson 14C, Exercise(s) 2 & 4; the MP3 manifest uses out3e_3pi_sb_u14C_ex02.mp3. The pairing is based on the audio-file order within this lesson."
    },
    "out3e_3pi_sb_u15A_ex04_05.mp3": {
      "unit": 15,
      "lesson": "15A",
      "exercises": "4 & 5",
      "audioFile": "out3e_3pi_sb_u15A_ex04_05.mp3",
      "script": "1: I've been here almost two years now, but I'm actually going to go back home in a few months' time. Don't get me wrong. I have enjoyed it here. I mean, the climate's great, the food's great and I love the people - but the economy's not doing well at the moment. Unemployment's gone up quite a lot since the startof the year, and people aren't sure they're going tohave jobs in a year's time, so it feels like a good time to leave.\n2: We don't have much of a gap between rich and poor here, which is good, and average salaries are quite high, so most people get paid pretty well. Also, workers are well protected by the law, so we have good job security. I guess that's why people often say we're one of the happiest countries in the world. It's certainly not because of our weather, anyway. That's for sure.\n3: I work for a big company and we're currently having quite a hard time because our currency is so strong at the moment. I mean, I know it's good for people going on holidays abroad and it'sobviously cheaper if you want to buy foreign goods, but for us, it's a big problem. We sell a lot in other countries, and the exchangerate means thatour product is much more expensive for people paying in other currencies. We're losing sales and I'm not sure how we'll manage.\n4: I'm quite lucky, I guess, because the costof living's still quite low in my town. I used to work in the capital and things are much cheaper here. I mean, eating out is half the price. You can get athree-course meal for about seven dollars here, but a meal there costs more like fifteen or even twenty. Of course, people earn more there as well, but it soon goes. I think life is better here, to be honest. It's where I grew up and life's a bit slower - not everything's about work.\n5: I won't lie. Times are hard. Food prices have gone up a lotover the last couple of years. I mean, basic things like bread and potatoes are much more expensive than they used to be, and gas and electricity are even worse! Prices are two or three times higher than they were last year. I'm ateacher and a lotof my teacher friends have changed jobs because they couldn't afford to live on the money they made. One funny thing, though, is that people have started sharing'horror receipts' on social media - they post photos of receiptsof super expensive food they boughton holiday at the seaside.",
      "mapping": "exact_source_match",
      "note": null
    },
    "out3e_3pi_sb_u15C_ex05_08.mp3": {
      "unit": 15,
      "lesson": "15C",
      "exercises": "5 & 8",
      "audioFile": "out3e_3pi_sb_u15C_ex05_08.mp3",
      "script": "Conversation 1\nA: Yes, Sir?\nB: Can we get the bill, please?\nA: Certainly. One moment.\nB: Thanks.\nC: How much is it?\nB: Don't worry. I'll get this. It's my treat.\nC: Are you sure? I don't mind paying half.\nB: No, really. It's fine. After all, I asked you out.\nC: Thanks. It's really kindof you.\nB: Oh no!\nC: What's up?\nB: I've just realized I left my wallet in my other jacket. It's got all my credit cards and cash in it! I'll have to go and get it.\nC: Don't be silly. It's toofar to go. I'll pay today.\nB: Are you sure? I'll pay you back as soon as I can, I promise.\nC: No, it's fine. Honestly. Oh! Wow! Right. That's a lot! I hope they accept my credit card!\nConversation 2\nD: That looks greaton you.\nE: Really?\nD: Yeah. Really suits you. I'd get that if I were you - before someone else does.\nE: Maybe. How much is it?\nD: Well, it's vintage 60s, you see.\nE: Sorry?\nD: It's very old. From the 1960s. It's hard tofind things like that in this condition.\nE: Oh, yes. Well, it is very nice. Sohow much?\nD: Let's call it 200.\nE: £200? Oof!\nD: Take itor leave it. It's up to you.\nE: I like it, but look. It's not in perfect condition. There's a mark here.\nD: OK, fair enough. So let's say 180.\nE: No, sorry. It's still too much. Thank you.\nD: OK, OK, wait a minute. The best price I can manage is 150. If I sold it for any less, I'd lose money.\nConversation 3\nF: It'd be worth every penny. And if I don't buy it, someone else will.\nG: So you've said, but athousand pounds is athousand pounds - and we're not made of money.\nF: I know, but if I don't have a car, then I'll have to keep getting the bus into town. And that's not cheap either. Prices have just gone up.\nG: Look, if we had the money, we'd be happy to lend it to you, but we don't, so we can't. And anyway, you're working now, so surely you can save up and get something yourself.\nF: I would if I could, Mum, honestly, but it's just impossible! I've got my rent to pay, my food, my travel costs.\nG: Let me talk to your father, OK? Maybe we can borrow some money from the bank.\nF: Really? Oh, that'd be brilliant!\nG: And you can pay us back over time, OK?\nConversation 4\nH: I'm afraid your card was cancelled because of some irregular activity that we noticed.\nI: Irregular activity? What do you mean?\nH: Well, for instance, did you have lunch in Singapore last week?\nI: No! I've never been there in my life.\nH: Right. Well, we think your details were probably stolen sometime last month and after that, someone started using it abroad.\nI: Really? How did they manage to do that? And will I get a refund?\nH: We're still trying tofindout exactly what happened, but we'll refund any stolen money, and we're sending you a new card today. You'll then receive your new PIN number after you get the card. They're sent separately for security reasons.",

      "script": "Conversation 1\nA: Did you have a nice weekend?\nB: Yes, it was great, actually.\nA: Yeah? What did you do? A udio scrip ts\nB: One of my oldest friends got marriedon Saturday, so I went to the wedding in the afternoon and then thereception later on. It was really good.\nA: Oh yeah?\nB: Yeah. They hired an old castle on the coast for it. It was an amazing place. And they had a big buffet there, with really good food, and a DJ and everything.\nA: That sounds great. What was the music like?\nB: It was good, actually. Much better than I was expecting. They hired this guy who played loadsof old hits, so the dance floor was full all evening.\nConversation 2\nC: Did you do anything last night?\nD: Yeah, I did, actually. I went to a friend's house-warming party. She's just moved into this new flat. It's an amazing place. The building it's in used to be a church.\nC: Oh wow! So what was the party like? Was it good?\nD: It was great to begin with, yeah. All the other guests were lovely. Everyone was really warm and friendly and very easy to talk to, but then this guy I used to go to school with arrived.\nC: OK.\nD: Yeah, I never used to geton with him, and to make things worse, he was with someone from my oldoffice.\nC: Oh dear. So what did you do?\nD: Well, it sortof spoiled the night for me, to be honest. I didn't stay much longer after that.\nConversation 3\nE: So what did you do last night? Anything interesting?\nF: Yeah, I had a little dinner party.\nE: Oh, really? What was the occasion?\nF: There wasn'tone. I just felt like inviting some friends round and cooking for them.\nE: Nice. Sohow did it go? Was it good?\nF: Yeah, it was lovely. It was nice to see people and chat.\nE: How many people came?\nF: Twelve.\nE: Wow! That's a lotof cooking.\nF: I know! It took me ages to get everything ready.\nE: Did you cook everything yourself?\nF: Yeah.\nE: You must be a good cook.\nF: I don't know about that! I just follow recipes.\nE: So what did you do?\nF: Well, for starters, I did grilled aubergines covered in yoghurt and served withaslightly spicy sauce and then...",

    "out3e_3pi_sb_u16C_ex02_04.mp3": {

      "script": "1: We call April the 21 st Kartini Day. It's the day that Raden Adjeng Kartini was born in 1879. She's very important in Indonesia because she fought for women's rights at atime when we were very much second-class citizens. She set up the country's first all-girls school and really helped to change the country for the better. There's still some way to go, sure, but it's important to remember her life and celebrate it every year.\n2: My great-grandmother on my mum's side was Ukrainian. We never met, as she died before I was born, but a few years ago my mum and I decided to go on atrip to the village that she came from. We spent a night in the house she'd been born in, which was very moving. The people were very welcoming and I felt a real connection with the place. It was incredible - a day I'll never forget.\n3: The tenth of January will always be a very special day for me, as it's the anniversary of the day David Bowie died. His death in 2016 was a real tragedy and I still miss having him around and still feel his loss today. He was an incredible person and touched the livesof millionsof people all over the world. One of my biggest regrets is that I never got to see him play live, but after he died, I did fly from Poland to London to see all the flowers and paintings and stuff that people left in Brixton, where he grew up. That was amazing.\n4: When I was 23 or 24, I spent six months travelling round south-east Asia. It was an amazing time in my life and I had lotsof great experiences, but perhaps the day I remember best was when I climbed Mount Kinabalu in Malaysia, one of the highest mountains in theregion. We started climbing at midnight, with a local guide, and wereached the peak just as the sun was coming up. It was incredibly beautiful.\n5: The 24th of March is a very special day for me, as it's the anniversary of the day that I got my sight back. Thirteen years ago, my eyes were damaged in an accident at work and I was told I'd never see again. However, two years ago, I agreed tohave this special new operation. It was still in the experimental stage, but amazingly, it worked, and thanks to the team that did the operation, I can now see my two kids. I'll always be grateful for that!",
      "mapping": "exact_source_match",
      "note": null
    }
