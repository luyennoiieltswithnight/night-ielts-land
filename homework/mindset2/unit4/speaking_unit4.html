</head>

            {

                    {
                        q: "Describe an exciting journey you once took.",
                        a: "One exciting journey that I’ll never forget was a trip to Phu Quy Island, which I took with my ex-boyfriend about a year and a half into our relationship. We went there with a couple of his close friends during the summer, and it turned out to be one of the most memorable trips I’ve ever had.\n\nGetting there was actually part of the adventure. We could have taken a coach to Phan Thiet, but instead we decided to ride our motorbikes all the way there. It took quite a few hours, but the ride was surprisingly enjoyable because we could stop whenever we wanted to stretch our legs, grab a drink, or simply admire the scenery. Once we arrived at the harbour, we boarded a ferry that took us to the island.\n\nWhen we finally got there, the first thing that struck me was the weather. It was absolutely scorching hot, but since it was summer and we were visiting an island, we had expected that. Luckily, we had packed plenty of sunscreen, so the heat didn’t stop us from making the most of the trip.\n\nDuring our stay, we spent most of our time swimming in the crystal-clear sea, riding around the island, taking lots of photos, and discovering hidden spots that hadn’t been heavily developed for tourism. Everything felt peaceful and untouched, which made the island even more charming.\n\nOne of the highlights, though, was definitely the food. The local cuisine completely exceeded my expectations. We had incredibly fresh seafood, tried some unusual shellfish that I’d never seen before, and one dish that really stood out was bánh tráng mắm ruốc. It was simple, incredibly flavourful, and surprisingly affordable. To be honest, I couldn’t believe how cheap the food was considering how fresh everything tasted.\n\nLooking back, what I remember most isn’t actually the scenery or the food. It’s the time I spent with my ex-boyfriend. We watched the sunset together, took countless photos, wandered along the beach, chatted for hours, and simply enjoyed each other’s company. Although we’re no longer together, that trip still brings back nothing but warm memories. It was one of the first island holidays we shared, and I think that’s why it has stayed with me for so many years. Even now, whenever I think about Phu Quy Island, I don’t just remember the destination—I remember a really happy chapter of my life.",
                        vocab: [

                            { en: "about a year and a half into our relationship", vi: "Khoảng một năm rưỡi yêu nhau" },
                            { en: "part of the adventure", vi: "Một phần của chuyến phiêu lưu" },
                            { en: "ride our motorbikes all the way there", vi: "Lái xe máy suốt quãng đường" },
                            { en: "stretch our legs", vi: "Duỗi chân (nghỉ ngơi)" },
                            { en: "admire the scenery", vi: "Chiêm ngưỡng phong cảnh" },
                            { en: "boarded a ferry", vi: "Lên phà" },
                            { en: "absolutely scorching hot", vi: "Nóng đổ lửa" },

            {

                questions: [

                        vocab: [
                            { en: "I’d definitely choose", vi: "Chắc chắn sẽ chọn" },
                            { en: "peaceful and less crowded", vi: "Yên bình, ít đông đúc" },
                            { en: "fresh air", vi: "Không khí trong lành" },

                        vocab: [

                        a: "I think there are quite a few reasons. First of all, travelling allows people to take a break from work or study, which helps them relax and reduce stress. Besides that, it’s a great opportunity to experience different cultures, try local cuisine, and meet new people. More importantly, I think travelling broadens your horizons because you get to see how people live in different parts of the world.",
                        vocab: [

        // --- COMPONENTS ---
        const Icon = ({ name }) => {
            const icons = {
                play: <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>,
                lock: <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            };
            return icons[name] || null;
        };

        const AnnotatedText = ({ text, vocabList }) => {
            if (!vocabList || vocabList.length === 0) return <span>{text}</span>;
            let highlightedHtml = text.replace(/\n\n/g, '<br/><br/>');
            vocabList.forEach(v => {
                const regex = new RegExp(`(${v.en})`, 'gi');
                highlightedHtml = highlightedHtml.replace(regex, `<span class="vocab-highlight" title="${v.vi}">$1</span>`);
            });
            return <div className="leading-loose text-lg" dangerouslySetInnerHTML={{ __html: highlightedHtml }} />;
        };

        const VocabCard = ({ vi, en }) => {
            const [flipped, setFlipped] = useState(false);
            return (
                <div 
                    className={`group w-full h-32 perspective-1000 cursor-pointer ${flipped ? 'flipped' : ''}`}
                    onClick={() => setFlipped(!flipped)}
                >
                    <div className="card-inner relative w-full h-full text-center transition-transform duration-500 transform-style-3d shadow-card rounded-2xl">
                        
                        <div className="absolute w-full h-full backface-hidden flex flex-col items-center justify-center p-4 bg-white border-2 border-orange-200 rounded-2xl hover:border-orange-400 transition-colors">
                            <span className="absolute top-3 left-3 bg-orange-100 text-orange-600 px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-widest">VN</span>
                            <p className="text-slate-800 font-bold text-[15px] leading-tight">{vi}</p>

                            <span className="absolute top-3 left-3 bg-white/20 text-white px-2 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-widest backdrop-blur-md">EN</span>
                            <p className="text-white font-extrabold text-[16px] leading-tight">{en}</p>
                        </div>

                    </div>
                </div>
            );
        };

            const [revealed, setRevealed] = useState(false);

            return (

                    <h3 className="text-xl font-extrabold text-brand-dark mb-6">{item.q}</h3>
                    <div className="relative mb-8">
                        {!revealed && (
                            <div className="absolute inset-0 z-10 flex items-center justify-center cursor-pointer" onClick={() => setRevealed(true)}>
                                <span className="bg-brand-dark text-white px-6 py-3 rounded-full font-bold shadow-neon-blue flex items-center gap-2 hover:scale-105 transition-transform">
                                    <Icon name="lock" />
                                    Click để mở khóa Script
                                </span>
                            </div>
                        )}
                        <div 
                            className={`p-6 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 ${revealed ? 'dictation-revealed border-solid border-blue-200 bg-blue-50/30' : 'dictation-blur cursor-pointer'}`}

                        >
                            <AnnotatedText text={item.a} vocabList={item.vocab} />
                        </div>
                    </div>

                    {item.vocab && item.vocab.length > 0 && (
                        <div className="mt-8">
                            <h4 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">🔥 Lật thẻ để ôn từ vựng</h4>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {item.vocab.map((v, idx) => <VocabCard key={idx} vi={v.vi} en={v.en} />)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LessonSection = ({ section, onPlayAudio }) => {
            return (
                <div className="mb-24">
                    <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 bg-brand-dark text-white p-6 rounded-3xl shadow-card">
                        <h2 className="text-2xl font-black tracking-tight">{section.title}</h2>
                        <button 
                            onClick={() => onPlayAudio(section.audioFile, section.title)}
                            className="flex items-center gap-2 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white px-6 py-3 rounded-full font-bold transition shadow-neon-blue"
                        >
                            <Icon name="play" />
                            Phát Âm Thanh
                        </button>
                    </div>

                    {section.questions.map((q, i) => <QuestionAnswer key={i} item={q} />)}

                    {section.bonus && (
                        <div className="bg-gradient-to-br from-orange-100 to-rose-100 border-2 border-orange-200 p-8 rounded-[2rem] mt-10 shadow-card">
                            <h3 className="text-xl font-black text-orange-800 mb-6">{section.bonusTitle}</h3>
                            <div className="grid md:grid-cols-2 gap-4">
                                {section.bonus.map((b, idx) => (
                                    <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-orange-100">
                                        <p className="text-slate-400 text-sm font-medium line-through mb-2">"{b.bad}"</p>
                                        <p className="text-brand-dark font-extrabold text-base">👉 "{b.good}"</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const FloatingAudioPlayer = ({ audioInfo, audioRef }) => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [speed, setSpeed] = useState(1);
            const [currentTime, setCurrentTime] = useState("0:00");
            const [duration, setDuration] = useState("0:00");
            const [error, setError] = useState(false);

            if (!audioInfo) return null;

            const formatTime = (time) => {
                if (isNaN(time)) return "0:00";
                const mins = Math.floor(time / 60);
                const secs = Math.floor(time % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const togglePlay = () => {
                if (audioRef.current.paused) {
                    audioRef.current.play().catch(() => setError(true));
                } else {
                    audioRef.current.pause();
                }
            };

            const handleTimeUpdate = () => {
                const current = audioRef.current.currentTime;
                const dur = audioRef.current.duration;
                setCurrentTime(formatTime(current));
                if (dur) {
                    setProgress((current / dur) * 100);
                    setDuration(formatTime(dur));
                }
            };

            const skip = (amount) => audioRef.current.currentTime += amount;

            const changeSpeed = () => {
                const newSpeed = speed >= 1.5 ? 0.5 : speed + 0.25;
                audioRef.current.playbackRate = newSpeed;
                setSpeed(newSpeed);
            };

            const handleSeek = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audioRef.current.currentTime = percent * audioRef.current.duration;
            };

            return (
                <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-4xl bg-brand-dark/95 backdrop-blur-xl shadow-neon-purple border border-white/10 rounded-full z-50 p-4 px-8 flex flex-col md:flex-row items-center gap-6">
                    <div className="flex-1 w-full text-white">
                        <p className="text-sm font-bold truncate mb-2">{audioInfo.title}</p>
                        {error && <p className="text-xs text-red-400 font-bold mb-1">Lỗi tải Audio. Hãy chắc chắn file .wav nằm cùng thư mục với file HTML này.</p>}
                        
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-mono text-slate-400 w-10">{currentTime}</span>
                            <div className="h-2.5 flex-1 bg-slate-700 rounded-full cursor-pointer overflow-hidden relative" onClick={handleSeek}>
                                <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-purple-500 rounded-full" style={{ width: `${progress}%` }}></div>
                            </div>
                            <span className="text-xs font-mono text-slate-400 w-10">{duration}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-3">
                        <button onClick={() => skip(-5)} className="text-white hover:text-blue-400 font-extrabold text-sm px-3 py-2 bg-white/10 rounded-xl">-5s</button>
                        
                        <button onClick={togglePlay} className="w-14 h-14 flex items-center justify-center bg-white text-brand-dark rounded-full shadow-lg hover:scale-110 transition-transform">
                            {isPlaying ? (
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd"></path></svg>
                            ) : (
                                <svg className="w-6 h-6 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                            )}
                        </button>

                        <button onClick={() => skip(5)} className="text-white hover:text-blue-400 font-extrabold text-sm px-3 py-2 bg-white/10 rounded-xl">+5s</button>
                        <button onClick={changeSpeed} className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-sm font-black transition ml-2">
                            {speed}x
                        </button>
                    </div>

                    <audio ref={audioRef} onTimeUpdate={handleTimeUpdate} onPlay={() => { setIsPlaying(true); setError(false); }} onPause={() => setIsPlaying(false)} onEnded={() => setIsPlaying(false)} onError={() => setError(true)} className="hidden" />
                </div>
            );
        };

        const App = () => {
            const [currentAudio, setCurrentAudio] = useState(null);
            const audioRef = useRef(null);

            const handlePlayAudio = (filename, title) => {
                const fullUrl = AUDIO_BASE_URL + filename;
                setCurrentAudio({ src: fullUrl, title: title });
            };

            useEffect(() => {
                if (currentAudio && audioRef.current) {
                    audioRef.current.src = currentAudio.src;
                    audioRef.current.playbackRate = 1; 
                    audioRef.current.play().catch(e => console.error("Audio error:", e));
                }
            }, [currentAudio]);

            return (
                <div className="max-w-5xl mx-auto px-5 pt-20">
                    <header className="mb-16 text-center">
                        <span className="inline-block bg-gradient-to-r from-purple-600 to-blue-600 text-white px-5 py-2 rounded-full text-sm font-black tracking-widest uppercase mb-6 shadow-neon-purple">Premium EdTech UI</span>
                        <h1 className="text-5xl md:text-6xl font-black text-slate-800 tracking-tight mb-6">Holidays & Travel</h1>
                    </header>
                    <main>
                        {lessonData.map(section => <LessonSection key={section.id} section={section} onPlayAudio={handlePlayAudio} />)}
                    </main>
                    <FloatingAudioPlayer audioInfo={currentAudio} audioRef={audioRef} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
