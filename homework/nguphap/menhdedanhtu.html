<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | Noun Clauses Masterclass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDNJS) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#6366F1', // Indigo 500
                        secondary: '#10B981', // Emerald 500
                        warning: '#F59E0B', // Amber 500
                        danger: '#F43F5E', // Rose 500
                        info: '#3B82F6', // Blue 500
                        brandDark: '#0f172a' // Slate 900
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #fdf2f8 100%);
            color: #334155; 
            line-height: 1.8;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        .slide-down { animation: slideDown 0.3s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-200 selection:text-indigo-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- PURE INLINE SVGS ---
        const SvgCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
        const SvgCross = () => <svg className="w-5 h-5 text-rose-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const SvgWarning = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const SvgInfo = () => <svg className="w-5 h-5 text-indigo-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const SvgChevron = ({ isOpen }) => <svg className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>;
        const SvgBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;
        const SvgTarget = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>;

        // --- FORMATTING COMPONENTS ---
        const Highlight = ({ children, color = "primary" }) => {
            const styles = {
                primary: "bg-indigo-50 text-indigo-700",
                secondary: "bg-emerald-50 text-emerald-700",
                warning: "bg-amber-50 text-amber-700",
                danger: "bg-rose-50 text-rose-700",
                info: "bg-blue-50 text-blue-700"
            };
            return <span className={`inline-block px-2 py-0.5 rounded font-semibold text-[15px] border border-slate-200 ${styles[color]}`}>{children}</span>;
        };
        
        const ExampleBox = ({ children }) => (
            <div className="bg-slate-50 border-l-4 border-indigo-400 p-4 my-3 text-slate-700 rounded-r-lg shadow-sm text-[15px]">
                {children}
            </div>
        );

        const NoteBox = ({ children, type = "info" }) => {
            const styles = {
                warning: "bg-amber-50 border-amber-200 text-amber-900",
                info: "bg-indigo-50 border-indigo-200 text-indigo-900",
                danger: "bg-rose-50 border-rose-200 text-rose-900"
            };
            const icons = { warning: <SvgWarning />, info: <SvgInfo />, danger: <SvgCross /> };
            return (
                <div className={`border p-4 my-4 rounded-xl flex items-start text-[15px] ${styles[type]}`}>
                    <div className="mt-0.5 shrink-0">{icons[type]}</div>
                    <div className="ml-2 w-full">{children}</div>
                </div>
            );
        };

        const Point = ({ num, title, children, isLast }) => (
            <div className={`pb-8 mb-8 ${!isLast ? 'border-b border-dashed border-slate-300' : ''}`}>
                <div className="flex items-center gap-4 mb-4">
                    <span className="bg-indigo-600 text-white font-extrabold px-3 py-1.5 rounded-lg text-sm shadow-sm">Mục {num}</span>
                    <h3 className="font-extrabold text-slate-800 text-lg tracking-wide uppercase">{title}</h3>
                </div>
                <div className="text-slate-600 text-[15px] leading-relaxed space-y-2">
                    {children}
                </div>
            </div>
        );

        const Accordion = ({ title, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-6 bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full p-5 md:p-6 flex justify-between items-center text-left bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl text-indigo-600 shadow-sm">
                                <SvgBook />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                        </div>
                        <SvgChevron isOpen={isOpen} />
                    </button>
                    {isOpen && <div className="p-6 md:p-8 bg-white slide-down">{children}</div>}
                </div>
            );
        };

        const ExplanationBox = ({ isCorrect, exp }) => (
            <div className={`mt-4 p-4 rounded-xl text-[15px] font-medium border flex items-start gap-3 ${isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="mt-0.5 shrink-0">
                    {isCorrect ? <SvgCheck /> : <SvgCross />}
                </div>
                <div className="w-full">
                    <strong className="block mb-1">{isCorrect ? "Chính xác!" : "Sai rồi!"}</strong>
                    {exp}
                </div>
            </div>
        );

        // --- EXERCISE COMPONENTS ---

        // Dạng 1: Nhận diện Noun Clause (Mục 4, 69)
        const ExIdentify = () => {
            const questions = [
                { id: 1, q: "I know that she is busy.", opts: ["that she is busy", "I know that"], ans: "that she is busy", exp: "Noun Clause bắt đầu bằng 'that', đóng vai trò Object của 'know'." },
                { id: 2, q: "She doesn’t know where he lives.", opts: ["where he lives", "She doesn't know"], ans: "where he lives", exp: "Noun Clause bắt đầu bằng 'where', làm Object." },
                { id: 3, q: "I wonder whether they will come.", opts: ["whether they will come", "I wonder whether"], ans: "whether they will come", exp: "Noun Clause bắt đầu bằng 'whether'." },
                { id: 4, q: "What he said surprised me.", opts: ["What he said", "surprised me"], ans: "What he said", exp: "Noun Clause đóng vai trò làm Subject (Chủ ngữ) của câu." },
                { id: 5, q: "The problem is that we are late.", opts: ["that we are late", "The problem is"], ans: "that we are late", exp: "Noun Clause làm Complement (Bổ ngữ) cho to be." },
                { id: 6, q: "I believe that he is right.", opts: ["that he is right", "I believe that"], ans: "that he is right", exp: "Noun Clause làm Object." },
                { id: 7, q: "Tell me what you need.", opts: ["what you need", "Tell me what"], ans: "what you need", exp: "Noun Clause làm Object." },
                { id: 8, q: "Whether she will come is uncertain.", opts: ["Whether she will come", "is uncertain"], ans: "Whether she will come", exp: "Noun Clause làm Subject." },
                { id: 9, q: "It depends on whether he agrees.", opts: ["whether he agrees", "It depends on"], ans: "whether he agrees", exp: "Noun Clause đứng sau giới từ 'on'." },
                { id: 10, q: "I'm interested in what she thinks.", opts: ["what she thinks", "I'm interested in"], ans: "what she thinks", exp: "Noun Clause đứng sau giới từ 'in'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 1: Tìm Mệnh đề Danh từ (Noun Clause) trong câu</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col gap-4">
                                <span className="font-bold text-slate-800 text-lg"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col md:flex-row gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-[15px] font-bold border-2 transition-all text-left md:text-center flex-1 ";
                                        if (!st) style += "bg-white border-slate-300 text-slate-600 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 2: Phân biệt Noun Clause vs Relative Clause (Mục 45-47, 70)
        const ExFunction = () => {
            const questions = [
                { id: 1, q: "I know where he lives.", opts: ["Noun Clause", "Relative Clause"], ans: "Noun Clause", exp: "'where he lives' làm Object của 'know'." },
                { id: 2, q: "The house where he lives is beautiful.", opts: ["Noun Clause", "Relative Clause"], ans: "Relative Clause", exp: "'where he lives' đứng sau Noun 'house' để bổ nghĩa cho nó." },
                { id: 3, q: "I don’t know what she wants.", opts: ["Noun Clause", "Relative Clause"], ans: "Noun Clause", exp: "'what she wants' làm Object của 'know'." },
                { id: 4, q: "The book that she bought is expensive.", opts: ["Noun Clause", "Relative Clause"], ans: "Relative Clause", exp: "'that she bought' bổ nghĩa cho Noun 'book'." },
                { id: 5, q: "I wonder whether they will come.", opts: ["Noun Clause", "Relative Clause"], ans: "Noun Clause", exp: "'whether they will come' làm Object của 'wonder'." },
                { id: 6, q: "The city where I was born is very large.", opts: ["Noun Clause", "Relative Clause"], ans: "Relative Clause", exp: "'where I was born' bổ nghĩa cho 'city'." },
                { id: 7, q: "I know that he likes football.", opts: ["Noun Clause", "Relative Clause"], ans: "Noun Clause", exp: "'that he likes football' làm Object của 'know'." },
                { id: 8, q: "The girl who called you is my sister.", opts: ["Noun Clause", "Relative Clause"], ans: "Relative Clause", exp: "'who called you' bổ nghĩa cho 'girl'." },
                { id: 9, q: "Tell me when the meeting starts.", opts: ["Noun Clause", "Relative Clause"], ans: "Noun Clause", exp: "'when the meeting starts' làm Object." },
                { id: 10, q: "I remember the day when we first met.", opts: ["Noun Clause", "Relative Clause"], ans: "Relative Clause", exp: "'when we first met' bổ nghĩa cho 'day'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 2: Phân biệt Noun Clause và Relative Clause</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-[15px] font-bold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-300 text-slate-700 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 3: Bẫy Đảo ngữ (Mục 19-20, 51-52, 71)
        const ExInversion = () => {
            const questions = [
                { id: 1, s: ["I", "don’t", "know", "where", "is", "he."], errIdx: 4, exp: "Noun Clause không đảo ngữ. Phải là 'where he is'." },
                { id: 2, s: ["Tell", "me", "what", "does", "she", "want."], errIdx: 3, exp: "Không dùng trợ động từ (does) trong Noun Clause. Phải là 'what she wants'." },
                { id: 3, s: ["I", "wonder", "why", "did", "he", "leave."], errIdx: 3, exp: "Không dùng trợ động từ (did). Phải là 'why he left'." },
                { id: 4, s: ["I", "don’t", "know", "if", "is", "she", "ready."], errIdx: 4, exp: "Không đảo to be lên trước chủ ngữ. Phải là 'if she is ready'." },
                { id: 5, s: ["Can", "you", "explain", "how", "does", "it", "work?"], errIdx: 4, exp: "Không đảo ngữ. Phải là 'how it works'." },
                { id: 6, s: ["I", "wonder", "where", "are", "they", "going."], errIdx: 3, exp: "Không đảo ngữ. Phải là 'where they are going'." },
                { id: 7, s: ["She", "asked", "what", "time", "was", "it."], errIdx: 4, exp: "Không đảo ngữ. Phải là 'what time it was'." },
                { id: 8, s: ["He", "didn't", "say", "when", "will", "he", "arrive."], errIdx: 4, exp: "Không đảo ngữ. Phải là 'when he will arrive'." },
                { id: 9, s: ["I", "want", "to", "know", "how", "much", "does", "it", "cost."], errIdx: 6, exp: "Không dùng 'does'. Phải là 'how much it costs'." },
                { id: 10, s: ["I", "don't", "know", "who", "did", "you", "call."], errIdx: 4, exp: "Không dùng 'did'. Phải là 'who you called'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, wIdx, errIdx, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: wIdx, isCorrect: wIdx === errIdx, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Lỗi cực nguy hiểm: Noun Clause KHÔNG đảo ngữ. Click vào TỪ SAI.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-4 bg-white rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-wrap gap-x-1.5 gap-y-2 items-center text-lg mb-2">
                                <span className="text-slate-400 font-bold mr-2 text-base">{q.id}.</span>
                                {q.s.map((word, wIdx) => {
                                    const st = status[q.id];
                                    let style = "cursor-pointer px-3 py-1.5 rounded-lg transition-colors font-semibold border border-transparent ";
                                    if (!st) style += "bg-slate-50 hover:bg-indigo-100 text-slate-700 hover:text-indigo-700 border-slate-200 hover:border-indigo-300";
                                    else {
                                        if (st.selected === wIdx && st.isCorrect) style += "bg-emerald-50 text-emerald-700 border-emerald-500";
                                        else if (st.selected === wIdx && !st.isCorrect) style += "bg-rose-50 text-rose-700 border-rose-500 line-through";
                                        else if (wIdx === q.errIdx) style += "bg-white text-emerald-600 border-dashed border-emerald-400";
                                        else style += "text-slate-400 bg-slate-50";
                                    }
                                    return <span key={wIdx} onClick={() => handleSelect(q.id, wIdx, q.errIdx, q.exp)} className={style}>{word}</span>;
                                })}
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 4: What vs That (Mục 17-18, 48-50, 76)
        const ExWhatThat = () => {
            const questions = [
                { id: 1, q: "I know ________ he wants.", opts: ["that", "what"], ans: "what", exp: "'he wants' đang thiếu Object. What = the thing that (cái mà anh ấy muốn)." },
                { id: 2, q: "I know ________ he wants a new car.", opts: ["that", "what"], ans: "that", exp: "'he wants a new car' đã có đủ S+V+O. That chỉ nối câu, dịch là 'rằng'." },
                { id: 3, q: "I believe ________ she is telling the truth.", opts: ["that", "what"], ans: "that", exp: "Câu đã đủ ý nghĩa hoàn chỉnh -> dùng 'that'." },
                { id: 4, q: "I don’t know ________ happened.", opts: ["that", "what"], ans: "what", exp: "'happened' thiếu Subject -> 'what' làm Subject." },
                { id: 5, q: "We hope ________ everything will be fine.", opts: ["that", "what"], ans: "that", exp: "Câu đã đủ cấu trúc -> dùng 'that'." },
                { id: 6, q: "She didn't hear ________ I said.", opts: ["that", "what"], ans: "what", exp: "'I said' thiếu Object -> dùng 'what' (những gì tôi nói)." },
                { id: 7, q: "They discovered ________ the data was incorrect.", opts: ["that", "what"], ans: "that", exp: "Câu đã đủ S+V+C -> dùng 'that'." },
                { id: 8, q: "Can you show me ________ you have done?", opts: ["that", "what"], ans: "what", exp: "'you have done' thiếu Object -> dùng 'what'." },
                { id: 9, q: "I think ________ this is a good idea.", opts: ["that", "what"], ans: "that", exp: "Đã đủ cấu trúc -> dùng 'that'." },
                { id: 10, q: "________ he did surprised everyone.", opts: ["That", "What"], ans: "What", exp: "'he did' thiếu Object -> dùng 'What' làm chủ ngữ cả câu." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 4: Chọn THAT (Rằng) hay WHAT (Cái mà)?</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-medium text-lg text-slate-800"><span className="text-slate-400 font-bold mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-[15px] font-bold border-2 transition-all w-24 ";
                                        if (!st) style += "bg-white border-slate-300 text-slate-600 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 5: Chuyển câu hỏi thành Noun Clause (Mục 32-34, 52, 73)
        const ExTransform = () => {
            const questions = [
                { id: 1, q: "Where does he live?", opts: ["I don’t know where he lives.", "I don’t know where does he live."], ans: "I don’t know where he lives.", exp: "Không đảo ngữ, bỏ trợ động từ." },
                { id: 2, q: "What does she want?", opts: ["I don’t know what she wants.", "I don’t know what does she want."], ans: "I don’t know what she wants.", exp: "Không đảo ngữ, bỏ 'does'." },
                { id: 3, q: "Why did they leave?", opts: ["I don’t know why did they leave.", "I don’t know why they left."], ans: "I don’t know why they left.", exp: "Bỏ 'did', động từ chia quá khứ (left)." },
                { id: 4, q: "Is he coming?", opts: ["I don’t know if he is coming.", "I don’t know is he coming."], ans: "I don’t know if he is coming.", exp: "Câu hỏi Yes/No -> Dùng 'if' hoặc 'whether', không đảo ngữ." },
                { id: 5, q: "When will the meeting start?", opts: ["I don’t know when the meeting will start.", "I don’t know when will the meeting start."], ans: "I don’t know when the meeting will start.", exp: "Đưa 'will' ra sau chủ ngữ 'the meeting'." },
                { id: 6, q: "How much does it cost?", opts: ["Tell me how much does it cost.", "Tell me how much it costs."], ans: "Tell me how much it costs.", exp: "Bỏ 'does', thêm -s vào 'cost'." },
                { id: 7, q: "Has she finished?", opts: ["I wonder whether she has finished.", "I wonder whether has she finished."], ans: "I wonder whether she has finished.", exp: "Câu hỏi Yes/No -> dùng 'whether', không đảo 'has'." },
                { id: 8, q: "Who called you?", opts: ["I know who did you call.", "I know who called you."], ans: "I know who called you.", exp: "'Who' làm chủ ngữ nên không cần trợ động từ, cấu trúc giữ nguyên." },
                { id: 9, q: "How far is the airport?", opts: ["I don't know how far the airport is.", "I don't know how far is the airport."], ans: "I don't know how far the airport is.", exp: "Chuyển 'is' ra sau 'the airport'." },
                { id: 10, q: "Will they come?", opts: ["I don't know if will they come.", "I don't know if they will come."], ans: "I don't know if they will come.", exp: "Câu hỏi Yes/No -> Dùng 'if', không đảo 'will'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 5: Chuyển Direct Question thành Noun Clause (Lưu ý Đảo Ngữ!)</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col gap-4">
                                <span className="font-bold text-slate-800 text-[17px]"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "text-left px-5 py-3 rounded-lg text-sm font-semibold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-700 hover:border-indigo-500 hover:bg-indigo-50";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-800";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-800";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };


        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            
            return (
                <div className="max-w-4xl mx-auto pt-16 px-4 sm:px-6">
                    
                    <header className="text-center mb-16">
                        <div className="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded-full bg-indigo-100 border border-indigo-200 text-indigo-700 text-sm font-bold tracking-widest uppercase shadow-sm">
                            VocaFlow Grammar Hub
                        </div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-brandDark tracking-tight mb-6 leading-tight">
                            Đóng Gói <span className="text-primary">Mệnh Đề Danh Từ</span> <br className="hidden md:block"/>(Noun Clauses)
                        </h1>
                        <p className="text-[17px] text-slate-600 max-w-2xl mx-auto font-medium leading-relaxed">
                            Biến cả một câu hoàn chỉnh thành một "khối danh từ". Không chỉ học thuộc That/WH-/If, hãy hiểu cách nhận diện, chức năng và bẫy đảo ngữ kinh điển!
                        </p>
                    </header>

                    {/* FULL THEORY (100% Retained) */}
                    <div className="mb-16">
                        <h2 className="text-2xl md:text-3xl font-extrabold text-slate-800 mb-8 text-center border-b-2 border-slate-200 pb-4 inline-block mx-auto">Sổ tay Lý thuyết</h2>
                        
                        <Accordion title="1. Noun Clause là gì? (Mục 1-5)">
                            <Point num="1 - 3" title="Từ Noun đến Noun Clause" isLast={false}>
                                <p className="mb-2">Thông thường, một <b>Noun</b> (danh từ) có thể làm: Chủ ngữ (Subject), Tân ngữ (Object), Bổ ngữ (Complement).</p>
                                <ul className="list-disc pl-5 mb-2 text-[15px]">
                                    <li>Một noun: <i>I know <b>the answer</b>.</i></li>
                                    <li>Một noun phrase: <i>I know <b>the correct answer</b>.</i></li>
                                    <li>Một noun clause: <i>I know <b>what the answer is</b>.</i></li>
                                </ul>
                                <p className="font-bold text-indigo-700">Tư duy cốt lõi: Hãy tưởng tượng một câu hoàn chỉnh được "đóng gói" lại, biến thành một khối danh từ.</p>
                            </Point>

                            <Point num="4 & 5" title="Mẹo nhận diện: 'IT TEST'" isLast={true}>
                                <ExampleBox>
                                    <i>I don’t know <b>where he lives</b>.</i><br/>
                                    Thử thay cả mệnh đề bằng chữ <b>it</b>:<br/>
                                    &rarr; <i>I don’t know <b>it</b>.</i><br/>
                                    Câu vẫn có ngữ pháp hợp lý -> <i>where he lives</i> đang đóng vai trò Noun Clause.
                                </ExampleBox>
                                <NoteBox type="warning">
                                    Nhưng đừng chỉ học mẹo! Quan trọng nhất là hỏi: <b>Cả mệnh đề này đang làm chức năng gì?</b> (Subject / Object / Complement).
                                </NoteBox>
                            </Point>
                        </Accordion>

                        <Accordion title="2. Nhóm 1: THAT-CLAUSE (Mục 7-14, 57-58)">
                            <Point num="7 - 9" title="Cấu trúc & Bản chất của 'That'" isLast={false}>
                                <p className="mb-2"><b>Cấu trúc:</b> that + S + V</p>
                                <p className="mb-2"><b>Lỗi phổ biến:</b> Trong <i>I think that he is right.</i>, "that" không có nghĩa là "cái đó". Nó chỉ là dấu hiệu mở đầu Noun Clause (dịch là "rằng").</p>
                                <ExampleBox>
                                    <i>David believes that the team will win.</i><br/>
                                    - Main clause: David believes<br/>
                                    - Noun clause: that the team will win (Làm Object của "believes").
                                </ExampleBox>
                            </Point>

                            <Point num="11 - 13" title="Sự lược bỏ của That" isLast={false}>
                                <p className="mb-2">Khi Noun clause làm <b>Object</b>, có thể bỏ "that":<br/><i>I think that he is right. &rarr; I think he is right.</i></p>
                                <p className="mb-2 text-rose-600 font-bold">Nhưng không được bỏ máy móc!</p>
                                <p className="text-[15px]">Ví dụ khi làm Subject: <i><b>That</b> he lied surprised everyone.</i> (Không thể bỏ "That").<br/>Thường sẽ viết lại cho tự nhiên (Extraposition): <i><b>It</b> surprised everyone <b>that</b> he lied.</i></p>
                            </Point>

                            <Point num="57 & 58" title="That-clause sau Preposition/Adjective" isLast={true}>
                                <p className="mb-2"><b>Sau Giới từ (Preposition):</b> KHÔNG dùng that-clause trực tiếp.</p>
                                <ul className="list-disc pl-5 mb-2 text-rose-600 text-[15px]">
                                    <li><SvgCross /> <i>We talked about that he was late.</i></li>
                                </ul>
                                <p className="text-[15px] mb-2 text-emerald-700 font-semibold">Phải dùng: <i>We talked about <b>the fact that</b> he was late</i> hoặc <i>We talked about <b>his being</b> late.</i></p>
                                <p className="text-[15px]"><b>Sau Tính từ (Adjective):</b> Rất phổ biến. <i>I’m happy that you came. I’m surprised that he won.</i></p>
                            </Point>
                        </Accordion>

                        <Accordion title="3. Nhóm 2: WH-WORDS (Mục 15-31, 48-50)">
                            <Point num="16 - 18, 48-50" title="Đặc biệt về WHAT" isLast={false}>
                                <p className="mb-2 text-[15px]">What thường mang nghĩa: <b>the thing(s) that…</b> (những thứ mà). Vì vậy 'what' vừa là từ nối, vừa làm 1 thành phần (Object/Subject) bên trong mệnh đề.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-indigo-700 mb-1">THAT (Rằng)</div>
                                        <p className="text-[15px]"><i>I know <b>that</b> he wants a car.</i></p>
                                        <p className="text-sm text-slate-500 mt-1">Nối câu hoàn chỉnh (S+V+O đầy đủ).</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-indigo-700 mb-1">WHAT (Cái mà)</div>
                                        <p className="text-[15px]"><i>I know <b>what</b> he wants.</i></p>
                                        <p className="text-sm text-slate-500 mt-1">Câu thiếu Object. 'What' đóng vai trò Object đó.</p>
                                    </div>
                                </div>
                            </Point>

                            <Point num="21 & 22" title="WHO (S hay O?)" isLast={false}>
                                <ExampleBox>
                                    - <i>I know <b>who</b> called you.</i> (Ai đã gọi bạn -> who = Subject)<br/>
                                    - <i>I know <b>who</b> you called.</i> (Bạn đã gọi ai -> who = Object)
                                </ExampleBox>
                            </Point>

                            <Point num="27 - 31" title="HOW + Adjective / Adverb" isLast={true}>
                                <p className="mb-2">How có thể ghép với Adj/Adv để tạo Noun Clause.</p>
                                <ul className="list-disc pl-5 text-[15px]">
                                    <li><i>I don’t know <b>how difficult</b> the test is.</i></li>
                                    <li><i>Can you tell me <b>how much</b> it costs?</i></li>
                                    <li><i>I don’t know <b>how long</b> he has lived here.</i></li>
                                </ul>
                            </Point>
                        </Accordion>

                        <Accordion title="4. Nhóm 3: IF / WHETHER (Mục 32-39)">
                            <Point num="32 & 33" title="Khi nào dùng If/Whether?" isLast={false}>
                                <p className="mb-2">Dùng khi câu gốc là câu hỏi <b>Yes / No question</b>.</p>
                                <p className="text-[15px]">Ví dụ: <i>Is he coming?</i> &rarr; <i>I don’t know <b>if/whether</b> he is coming.</i></p>
                            </Point>

                            <Point num="35 & 36" title="If vs Whether" isLast={false}>
                                <p className="mb-2">Cả hai đều được, nhưng <b>Whether "mạnh" hơn If</b> (formal hơn). Đặc biệt khi có "or not".</p>
                                <p className="text-emerald-700 font-semibold text-[15px]"><SvgCheck /> I don’t know whether or not he will come.</p>
                                <p className="text-rose-600 font-semibold text-[15px]"><SvgCross /> I don’t know if or not he will come.</p>
                            </Point>

                            <Point num="37 & 38" title="Các cấu trúc ưu tiên Whether" isLast={true}>
                                <ul className="list-disc pl-5 text-[15px]">
                                    <li><b>Whether + To-V:</b> <i>I don’t know whether to go.</i> (Không dùng <i>if to go</i>).</li>
                                    <li><b>Sau Giới từ:</b> <i>It depends on whether he agrees.</i> (Không dùng <i>if</i>).</li>
                                </ul>
                            </Point>
                        </Accordion>

                        <Accordion title="5. BẪY ĐẢO NGỮ (Mục 19-20, 51-52, 68)">
                            <Point num="19, 51, 68" title="LUẬT SỐNG CÒN: Không đảo ngữ trong Noun Clause" isLast={true}>
                                <NoteBox type="danger">
                                    <p className="font-bold text-lg mb-2 uppercase">Noun Clause Không Dùng Word Order Của Direct Question!</p>
                                    <ul className="space-y-2">
                                        <li><SvgCross /> <span className="line-through text-rose-500 mr-2">I don’t know where is he.</span> &rarr; <span className="text-emerald-700 font-bold">where he is.</span></li>
                                        <li><SvgCross /> <span className="line-through text-rose-500 mr-2">Tell me what does she want.</span> &rarr; <span className="text-emerald-700 font-bold">what she wants.</span></li>
                                        <li><SvgCross /> <span className="line-through text-rose-500 mr-2">I wonder why did he leave.</span> &rarr; <span className="text-emerald-700 font-bold">why he left.</span></li>
                                        <li><SvgCross /> <span className="line-through text-rose-500 mr-2">I don’t know if is he ready.</span> &rarr; <span className="text-emerald-700 font-bold">if he is ready.</span></li>
                                    </ul>
                                </NoteBox>
                            </Point>
                        </Accordion>

                        <Accordion title="6. Phân biệt với Relative Clause & Lời Kết (Mục 45-47, 77-82)">
                            <Point num="45 - 47" title="Noun Clause vs Relative Clause" isLast={false}>
                                <p className="mb-2">Nhiều học sinh bị nhầm vì hình thức giống nhau (cùng bắt đầu bằng wh-).</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-indigo-700 mb-1">Noun Clause</div>
                                        <p className="text-[15px]"><i>I know <b>where he lives</b>.</i></p>
                                        <p className="text-sm text-slate-500 mt-1">Làm Object của "know". Trả lời câu hỏi "cái gì?".</p>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-indigo-700 mb-1">Relative Clause</div>
                                        <p className="text-[15px]"><i>The house <b>where he lives</b> is beautiful.</i></p>
                                        <p className="text-sm text-slate-500 mt-1">Đứng sau Noun (house) để bổ nghĩa cho nó. Trả lời "nhà nào?".</p>
                                    </div>
                                </div>
                            </Point>

                            <Point num="77 - 79" title="Phễu Tư Duy & Phân tích Đa Tầng" isLast={false}>
                                <ExampleBox>
                                    <i>I don’t know <b>what the students from Vietnam who joined the course yesterday want</b>.</i><br/><br/>
                                    - Main clause: I don’t know<br/>
                                    - Noun clause: what ... want (Object)<br/>
                                    - Bên trong Noun clause: the students (Head noun) + from VN (Prep phrase) + who joined... (Relative clause) là toàn bộ Subject. "want" là Verb.<br/>
                                    &rarr; Đây chính là kiến thức Noun Phrase được lồng vào Noun Clause.
                                </ExampleBox>
                            </Point>

                            <Point num="81 & 82" title="CÂU CHỐT CỦA CHUYÊN ĐỀ" isLast={true}>
                                <div className="bg-brandDark text-white p-6 rounded-2xl shadow-lg border border-slate-700">
                                    <h3 className="text-xl font-bold text-amber-400 mb-4 text-center">BẢN ĐỒ KẾT NỐI TOÀN HỆ THỐNG DANH TỪ</h3>
                                    <p className="text-center font-bold text-lg text-emerald-400 mb-4">"Mệnh đề quan hệ MÔ TẢ một danh từ.<br/>Mệnh đề danh từ TỰ NÓ HOẠT ĐỘNG như một danh từ."</p>
                                    <div className="bg-white/10 p-4 rounded-xl text-center space-y-2 font-mono text-sm leading-loose">
                                        <p>the talented student <span className="text-slate-400">(Noun Phrase)</span></p>
                                        <p>the talented student <span className="text-amber-300">from Vietnam</span> <span className="text-slate-400">(+ Prep Phrase)</span></p>
                                        <p>the talented student from Vietnam <span className="text-blue-300">who won</span> <span className="text-slate-400">(+ Relative Clause)</span></p>
                                        <p className="border-t border-white/20 pt-2 mt-2">Nhưng khi cả một Clause trở thành Noun:</p>
                                        <p className="text-rose-400 font-bold text-base">I know [what the talented student from Vietnam who won wants].</p>
                                    </div>
                                </div>
                            </Point>
                        </Accordion>
                    </div>

                    {/* Interactive Exercises (Tabs) */}
                    <div id="exercises" className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-12">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-3">Trạm Huấn Luyện (50 CÂU)</h2>
                            <p className="text-slate-600 font-medium">Bấm vào đáp án để nhận giải thích chi tiết. Hãy coi chừng bẫy Đảo Ngữ!</p>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
                            {[
                                { id: 0, title: "Nhận diện", label: "Dạng 1" },
                                { id: 1, title: "Phân biệt N/R", label: "Dạng 2" },
                                { id: 2, title: "Bẫy Đảo ngữ", label: "Dạng 3" },
                                { id: 3, title: "What vs That", label: "Dạng 4" },
                                { id: 4, title: "Chuyển câu", label: "Dạng 5" }
                            ].map((tab, index) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(index)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all
                                    ${activeTab === index 
                                        ? 'bg-indigo-600 text-white shadow-md' 
                                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {tab.label}: {tab.title}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[400px]">
                            {activeTab === 0 && <ExIdentify />}
                            {activeTab === 1 && <ExFunction />}
                            {activeTab === 2 && <ExInversion />}
                            {activeTab === 3 && <ExWhatThat />}
                            {activeTab === 4 && <ExTransform />}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
