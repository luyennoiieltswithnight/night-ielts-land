<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | Plural Nouns Masterclass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React, ReactDOM, Babel via CDNJS -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5', 
                        secondary: '#10B981', 
                        warning: '#F59E0B', 
                        info: '#3B82F6', 
                        accent: '#F43F5E', 
                        brandDark: '#1e1b4b', 
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background-color: #f8fafc;
            color: #334155; 
            line-height: 1.8;
            min-height: 100vh;
        }
        .glass {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .slide-down { animation: slideDown 0.3s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-200 selection:text-indigo-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- PURE INLINE SVGS ---
        const SvgCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
        const SvgCross = () => <svg className="w-5 h-5 text-rose-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const SvgWarning = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const SvgInfo = () => <svg className="w-5 h-5 text-indigo-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const SvgChevron = ({ isOpen }) => <svg className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>;
        const SvgBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;
        const SvgTarget = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>;

        // --- COMPONENTS ---
        const Highlight = ({ children }) => <span className="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-semibold text-[15px] border border-indigo-100">{children}</span>;

        const ExampleBox = ({ children }) => (
            <div className="bg-slate-50 border-l-4 border-indigo-400 p-4 my-3 text-slate-700 rounded-r-lg shadow-sm text-[15px]">
                {children}
            </div>
        );

        const NoteBox = ({ children, type = "info" }) => {
            const styles = {
                warning: "bg-amber-50 border-amber-200 text-amber-900",
                info: "bg-indigo-50 border-indigo-200 text-indigo-900",
                danger: "bg-rose-50 border-rose-200 text-rose-900"
            };
            const icons = { warning: <SvgWarning />, info: <SvgInfo />, danger: <SvgCross /> };
            return (
                <div className={`border p-4 my-4 rounded-xl flex items-start text-[15px] ${styles[type]}`}>
                    <div className="mt-0.5 shrink-0">{icons[type]}</div>
                    <div className="ml-2 w-full">{children}</div>
                </div>
            );
        };

        const Point = ({ num, title, children, isLast }) => (
            <div className={`pb-8 mb-8 ${!isLast ? 'border-b border-dashed border-slate-300' : ''}`}>
                <div className="flex items-center gap-4 mb-4">
                    <span className="bg-indigo-100 text-indigo-800 font-extrabold px-3 py-1.5 rounded-lg text-sm shadow-sm">Mục {num}</span>
                    <h3 className="font-extrabold text-brandDark text-lg tracking-wide uppercase">{title}</h3>
                </div>
                <div className="text-slate-600 text-[15px] leading-relaxed space-y-2">
                    {children}
                </div>
            </div>
        );

        const Accordion = ({ title, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-6 bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full p-5 md:p-6 flex justify-between items-center text-left bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl text-indigo-600 shadow-sm">
                                <SvgBook />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                        </div>
                        <SvgChevron isOpen={isOpen} />
                    </button>
                    {isOpen && <div className="p-6 md:p-8 bg-white slide-down">{children}</div>}
                </div>
            );
        };

        const ExplanationBox = ({ isCorrect, exp }) => (
            <div className={`mt-4 p-4 rounded-xl text-[15px] font-medium border flex items-start gap-3 ${isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="mt-0.5">
                    {isCorrect ? <SvgCheck /> : <SvgCross />}
                </div>
                <div className="w-full">
                    <strong className="block mb-1">{isCorrect ? "Chính xác!" : "Sai rồi!"}</strong>
                    {exp}
                </div>
            </div>
        );

        // --- EXERCISE COMPONENTS ---
        
        // Tab 1: Tạo số nhiều (Form & Rules)
        const ExForm = () => {
            const questions = [
                { id: 1, q: "book &rarr; ________", opts: ["books", "bookes"], ans: "books", exp: "Quy tắc cơ bản: noun + s." },
                { id: 2, q: "class &rarr; ________", opts: ["classs", "classes"], ans: "classes", exp: "Kết thúc bằng -ss &rarr; thêm -es." },
                { id: 3, q: "watch &rarr; ________", opts: ["watchs", "watches"], ans: "watches", exp: "Kết thúc bằng -ch &rarr; thêm -es." },
                { id: 4, q: "baby &rarr; ________", opts: ["babys", "babies"], ans: "babies", exp: "Phụ âm + y &rarr; đổi y thành ies." },
                { id: 5, q: "boy &rarr; ________", opts: ["boies", "boys"], ans: "boys", exp: "Nguyên âm + y &rarr; giữ nguyên y, chỉ thêm s." },
                { id: 6, q: "knife &rarr; ________", opts: ["knifes", "knives"], ans: "knives", exp: "f/fe &rarr; đổi thành ves." },
                { id: 7, q: "roof &rarr; ________", opts: ["roofs", "rooves"], ans: "roofs", exp: "Ngoại lệ f/fe &rarr; chỉ thêm s." },
                { id: 8, q: "tomato &rarr; ________", opts: ["tomatos", "tomatoes"], ans: "tomatoes", exp: "Kết thúc bằng -o &rarr; thêm -es." },
                { id: 9, q: "photo &rarr; ________", opts: ["photos", "photoes"], ans: "photos", exp: "Ngoại lệ kết thúc bằng -o &rarr; chỉ thêm s." },
                { id: 10, q: "child &rarr; ________", opts: ["childs", "children"], ans: "children", exp: "Bất quy tắc: child &rarr; children." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Chọn dạng số nhiều chính xác.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Tab 2: Phát âm đuôi -s/-es
        const ExPronunciation = () => {
            const questions = [
                { id: 1, q: "Phát âm đuôi -s của từ 'books' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/s/", exp: "Kết thúc bằng âm vô thanh /k/ -> /s/." },
                { id: 2, q: "Phát âm đuôi -s của từ 'dogs' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/z/", exp: "Kết thúc bằng âm hữu thanh /g/ -> /z/." },
                { id: 3, q: "Phát âm đuôi -es của từ 'watches' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/ɪz/", exp: "Kết thúc bằng /tʃ/ -> đọc thêm một âm tiết /ɪz/." },
                { id: 4, q: "Phát âm đuôi -s của từ 'cats' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/s/", exp: "Kết thúc bằng âm vô thanh /t/ -> /s/." },
                { id: 5, q: "Phát âm đuôi -s của từ 'pens' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/z/", exp: "Kết thúc bằng âm hữu thanh /n/ -> /z/." },
                { id: 6, q: "Phát âm đuôi -es của từ 'dishes' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/ɪz/", exp: "Kết thúc bằng /ʃ/ -> /ɪz/." },
                { id: 7, q: "Phát âm đuôi -s của từ 'cups' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/s/", exp: "Kết thúc bằng âm vô thanh /p/ -> /s/." },
                { id: 8, q: "Phát âm đuôi -s của từ 'rooms' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/z/", exp: "Kết thúc bằng âm hữu thanh /m/ -> /z/." },
                { id: 9, q: "Phát âm đuôi -es của từ 'buses' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/ɪz/", exp: "Kết thúc bằng /s/ -> /ɪz/." },
                { id: 10, q: "Phát âm đuôi -s của từ 'eggs' là gì?", opts: ["/s/", "/z/", "/ɪz/"], ans: "/z/", exp: "Kết thúc bằng âm hữu thanh /g/ -> /z/." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Chọn cách phát âm đuôi -s/-es chuẩn xác.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Tab 3: Bất quy tắc & Danh từ đặc biệt
        const ExIrregular = () => {
            const questions = [
                { id: 1, q: "man &rarr; ________", opts: ["mans", "men"], ans: "men", exp: "Bất quy tắc: man &rarr; men." },
                { id: 2, q: "woman &rarr; ________", opts: ["womans", "women"], ans: "women", exp: "Bất quy tắc: woman &rarr; women." },
                { id: 3, q: "tooth &rarr; ________", opts: ["teeth", "tooths"], ans: "teeth", exp: "Bất quy tắc: tooth &rarr; teeth." },
                { id: 4, q: "foot &rarr; ________", opts: ["foots", "feet"], ans: "feet", exp: "Bất quy tắc: foot &rarr; feet." },
                { id: 5, q: "mouse &rarr; ________", opts: ["mouses", "mice"], ans: "mice", exp: "Bất quy tắc: mouse &rarr; mice." },
                { id: 6, q: "person &rarr; ________", opts: ["persons", "people"], ans: "people", exp: "Dạng số nhiều thông dụng của person là people." },
                { id: 7, q: "criterion &rarr; ________", opts: ["criterions", "criteria"], ans: "criteria", exp: "Academic plural: criterion &rarr; criteria." },
                { id: 8, q: "phenomenon &rarr; ________", opts: ["phenomenons", "phenomena"], ans: "phenomena", exp: "Academic plural: phenomenon &rarr; phenomena." },
                { id: 9, q: "analysis &rarr; ________", opts: ["analysiss", "analyses"], ans: "analyses", exp: "Academic plural: analysis &rarr; analyses." },
                { id: 10, q: "sheep &rarr; ________", opts: ["sheeps", "sheep"], ans: "sheep", exp: "Giữ nguyên hình thức: sheep &rarr; sheep." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Chọn dạng số nhiều bất quy tắc.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Tab 4: Subject-Verb Agreement & Head Noun
        const ExAgreement = () => {
            const questions = [
                { id: 1, q: "The list of students ________ on the desk.", opts: ["is", "are"], ans: "is", exp: "Head noun là 'list' (số ít) -> Chia 'is'." },
                { id: 2, q: "The students in my class ________ hardworking.", opts: ["is", "are"], ans: "are", exp: "Head noun là 'students' (số nhiều) -> Chia 'are'." },
                { id: 3, q: "A number of students ________ absent today.", opts: ["is", "are"], ans: "are", exp: "'A number of + plural noun' -> Động từ số nhiều (are)." },
                { id: 4, q: "The number of students ________ increasing.", opts: ["is", "are"], ans: "is", exp: "'The number of' (Con số) làm chủ ngữ -> Chia số ít (is)." },
                { id: 5, q: "Mathematics ________ a difficult subject.", opts: ["is", "are"], ans: "is", exp: "Tên môn học kết thúc bằng -s nhưng đi với động từ số ít (is)." },
                { id: 6, q: "The news ________ surprising.", opts: ["is", "are"], ans: "is", exp: "'News' kết thúc bằng -s nhưng là danh từ không đếm được số ít (is)." },
                { id: 7, q: "These trousers ________ black.", opts: ["is", "are"], ans: "are", exp: "Trousers (quần ổng rộng) luôn mang hình thức số nhiều -> Chia 'are'." },
                { id: 8, q: "A group of international students ________ studying.", opts: ["is", "are"], ans: "is", exp: "Head noun là 'group' (số ít) -> Chia 'is'." },
                { id: 9, q: "Two pairs of scissors ________ on the bed.", opts: ["is", "are"], ans: "are", exp: "Động từ phụ thuộc vào từ 'pairs' (số nhiều) -> Chia 'are'." },
                { id: 10, q: "Each student ________ a unique learning style.", opts: ["has", "have"], ans: "has", exp: "'Each' luôn đi với danh từ số ít và động từ số ít (has)." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Chọn động từ phù hợp (Subject-Verb Agreement).</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Tab 5: Lỗi IELTS & Uncountable bẫy
        const ExIELTS = () => {
            const questions = [
                { id: 1, s: ["Nowadays,", "many", "student", "spend", "time", "online."], errIdx: 2, exp: "Sau 'many' bắt buộc phải là danh từ số nhiều (students)." },
                { id: 2, s: ["There", "are", "many", "information", "online."], errIdx: 3, exp: "Information là không đếm được, không có -s." },
                { id: 3, s: ["He", "gave", "me", "two", "good", "advices."], errIdx: 5, exp: "Advice không đếm được. Phải dùng 'two pieces of advice'." },
                { id: 4, s: ["This", "issue", "has", "several", "serious", "consequence."], errIdx: 5, exp: "Sau 'several' bắt buộc phải là danh từ số nhiều (consequences)." },
                { id: 5, s: ["She", "bought", "three", "new", "furnitures."], errIdx: 4, exp: "Furniture không đếm được, không thêm -s." },
                { id: 6, s: ["Researchers", "found", "many", "equipments."], errIdx: 3, exp: "Equipment là không đếm được. Dùng 'pieces of equipment'." },
                { id: 7, s: ["One", "important", "criteria", "is", "cost."], errIdx: 2, exp: "Criterion (số ít) mới đi với 'is'. Ở đây phải là 'criterion'." },
                { id: 8, s: ["The", "news", "are", "surprising."], errIdx: 2, exp: "News là danh từ số ít không đếm được -> Chia 'is'." },
                { id: 9, s: ["I", "have", "a", "good", "news", "for", "you."], errIdx: 4, exp: "News không đi với mạo từ 'a'." },
                { id: 10, s: ["There", "are", "less", "cars", "today."], errIdx: 2, exp: "Cars đếm được số nhiều -> Phải dùng 'fewer cars'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, wIdx, errIdx, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: wIdx, isCorrect: wIdx === errIdx, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Click vào <b>1 TỪ TẠO RA LỖI SAI NGỮ PHÁP</b> trong câu.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-4 bg-white rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-wrap gap-x-1.5 gap-y-2 items-center text-lg mb-2">
                                <span className="text-slate-400 font-bold mr-2 text-base">{q.id}.</span>
                                {q.s.map((word, wIdx) => {
                                    const st = status[q.id];
                                    let style = "cursor-pointer px-3 py-1.5 rounded-lg transition-colors font-semibold border border-transparent ";
                                    if (!st) style += "hover:bg-slate-100 text-slate-700 hover:text-indigo-600";
                                    else {
                                        if (st.selected === wIdx && st.isCorrect) style += "bg-emerald-50 text-emerald-700 border-emerald-500";
                                        else if (st.selected === wIdx && !st.isCorrect) style += "bg-rose-50 text-rose-700 border-rose-500 line-through";
                                        else if (wIdx === q.errIdx) style += "bg-white text-emerald-600 border-dashed border-emerald-400";
                                        else style += "text-slate-400 bg-slate-50";
                                    }
                                    return <span key={wIdx} onClick={() => handleSelect(q.id, wIdx, q.errIdx, q.exp)} className={style}>{word}</span>;
                                })}
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            
            return (
                <div className="max-w-4xl mx-auto pt-16 px-4 sm:px-6">
                    
                    <header className="text-center mb-16">
                        <div className="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded-full bg-indigo-100 border border-indigo-200 text-indigo-700 text-sm font-bold tracking-widest uppercase shadow-sm">
                            VocaFlow Grammar Hub
                        </div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-brandDark tracking-tight mb-6 leading-tight">
                            Danh từ số nhiều &amp; <br className="hidden md:block"/><span className="text-primary">Hệ thống Ngữ pháp liên quan</span>
                        </h1>
                        <p className="text-[17px] text-slate-600 max-w-2xl mx-auto font-medium leading-relaxed">
                            "Số nhiều" không đơn giản là thêm S. Nó kéo theo phát âm, mạo từ, sự hòa hợp chủ vị và các bẫy IELTS Writing kinh điển!
                        </p>
                    </header>

                    {/* FULL THEORY */}
                    <div className="mb-16">
                        <h2 className="text-2xl md:text-3xl font-extrabold text-slate-800 mb-8 text-center border-b-2 border-slate-200 pb-4 inline-block mx-auto">Sổ tay Lý thuyết</h2>
                        
                        <Accordion title="1. Bản chất & Sức mạnh của Plural Nouns">
                            <Point num="1 & 2" title="Số nhiều không chỉ là thêm S" isLast={false}>
                                <p className="mb-2">Học sinh rất dễ hình thành tư duy: <i>singular + s = plural</i> (book &rarr; books, student &rarr; students).</p>
                                <p>Đúng nhưng chưa đủ. Khi học plural nouns, ta cần biết 5 thứ: Khi nào dùng? Thêm -s hay -es? Đổi y/f thế nào? Bất quy tắc ra sao? Và nó ảnh hưởng thế nào đến article, verb, meaning?</p>
                            </Point>

                            <Point num="3 & 4" title="Sức mạnh đứng một mình (General meaning)" isLast={true}>
                                <p className="mb-2">Plural countable noun có thể đứng một mình khi nói chung:</p>
                                <ExampleBox>
                                    <b>Dogs are loyal. / Students need motivation. / Books can change lives.</b><br/>
                                    Không cần: <SvgCross /> <span className="line-through text-rose-500">The dogs are loyal</span> nếu nói về chó nói chung.
                                </ExampleBox>
                            </Point>
                        </Accordion>

                        <Accordion title="2. Quy tắc hình thành & Phát âm (-s / -es)">
                            <Point num="5 - 9" title="Các quy tắc chính & Phát âm 3 chuẩn" isLast={false}>
                                <ul className="space-y-3">
                                    <li><b>Quy tắc cơ bản:</b> Hầu hết noun + s (book &rarr; books, car &rarr; cars).</li>
                                    <li><b>Quy tắc -es:</b> Noun kết thúc bằng -s, -ss, -sh, -ch, -x, -z &rarr; thêm -es (bus &rarr; buses, watch &rarr; watches) để dễ phát âm hơn (tạo thêm 1 syllable /ɪz/).</li>
                                    <li><b>Phụ âm + y:</b> y &rarr; ies (baby &rarr; babies). Nguyên âm + y thì giữ nguyên, chỉ thêm s (boy &rarr; boys).</li>
                                    <li><b>f/fe &rarr; ves:</b> leaf &rarr; leaves, knife &rarr; knives. <i>(Lưu ý: không phải 100% trường hợp, roof &rarr; roofs).</i></li>
                                </ul>
                            </Point>

                            <Point num="10" title="Bảng phát âm chuẩn 3 âm /s/, /z/, /ɪz/" isLast={true}>
                                <div className="bg-slate-50 border border-slate-200 rounded-xl overflow-hidden text-[15px] mt-2">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-800">
                                                <th className="p-3 border-b border-slate-200">Âm cuối (Voiceless / Voiced)</th>
                                                <th className="p-3 border-b border-slate-200">Ví dụ</th>
                                                <th className="p-3 border-b border-slate-200">Cách phát âm</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr><td className="p-3 border-b border-slate-200">Voiceless (/p/, /t/, /k/, /f/, /θ/)</td><td className="p-3 border-b border-slate-200">cups, cats, books, roofs</td><td className="p-3 border-b border-slate-200 font-bold text-indigo-600">/s/</td></tr>
                                            <tr><td className="p-3 border-b border-slate-200">Voiced (còn lại)</td><td className="p-3 border-b border-slate-200">bags, dogs, pens, rooms</td><td className="p-3 border-b border-slate-200 font-bold text-indigo-600">/z/</td></tr>
                                            <tr><td className="p-3">Sibilants (/s/, /z/, /ʃ/, /tʃ/, /dʒ/)</td><td className="p-3">buses, watches, dishes</td><td className="p-3 font-bold text-indigo-600">/ɪz/</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </Point>
                        </Accordion>

                        <Accordion title="3. Bất quy tắc & Danh từ giữ nguyên">
                            <Point num="20 - 26" title="Danh từ bất quy tắc (Irregular Plurals)" isLast={false}>
                                <ul className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <li className="bg-white border p-3 rounded-lg">man &rarr; men | woman &rarr; women</li>
                                    <li className="bg-white border p-3 rounded-lg">tooth &rarr; teeth | foot &rarr; feet</li>
                                    <li className="bg-white border p-3 rounded-lg">mouse &rarr; mice</li>
                                    <li className="bg-white border p-3 rounded-lg">child &rarr; children <span className="text-rose-600 text-xs block font-bold">Không dùng: childs, childrens</span></li>
                                </ul>
                            </Point>

                            <Point num="27 - 34" title="Giữ nguyên & Academic Plurals" isLast={true}>
                                <p className="mb-2"><b>Giữ nguyên:</b> sheep &rarr; sheep, deer &rarr; deer, species &rarr; species, series &rarr; series.</p>
                                <p className="mb-2"><b>Academic Plurals (IELTS):</b></p>
                                <ul className="list-disc pl-5 text-[15px]">
                                    <li>criterion &rarr; criteria (<span className="text-rose-600 font-bold">Lỗi phổ biến: one criteria &rarr; sai</span>)</li>
                                    <li>phenomenon &rarr; phenomena</li>
                                    <li>analysis &rarr; analyses</li>
                                    <li>crisis &rarr; crises</li>
                                </ul>
                            </Point>
                        </Accordion>

                        <Accordion title="4. Subject-Verb Agreement & Head Noun">
                            <Point num="42 - 45" title="Đừng nhìn S, hãy xác định Head Noun" isLast={true}>
                                <p className="mb-2">Động từ phải hòa hợp với <b>Head Noun</b> chứ không phải danh từ đứng gần nó nhất.</p>
                                <ExampleBox>
                                    <i>The list of students <b>is</b> on the table.</i> (Head noun là "list" &rarr; số ít).<br/>
                                    <i>A number of students <b>are</b> absent.</i> (A number of + plural noun &rarr; số nhiều).<br/>
                                    <i>The number of students <b>is</b> increasing.</i> (The number of &rarr; số ít).
                                </ExampleBox>
                            </Point>
                        </Accordion>

                        <Accordion title="5. Lỗi IELTS Writing & Cạm bẫy Uncountable">
                            <Point num="72 - 76" title="Danh từ không đếm được hay bị thêm S" isLast={true}>
                                <NoteBox type="danger">
                                    <b>Tuyệt đối không thêm S vào các từ sau:</b><br/>
                                    - information (Không: informations)<br/>
                                    - advice (Không: advices)<br/>
                                    - equipment (Không: equipments)<br/>
                                    - furniture (Không: furnitures)<br/>
                                    - research (Không: researches)<br/>
                                    <span className="text-slate-700 block mt-2">Muốn đếm, dùng: <i>a piece of information / advice / equipment / furniture</i>.</span>
                                </NoteBox>
                            </Point>
                        </Accordion>
                    </div>

                    {/* Interactive Exercises (Tabs) */}
                    <div id="exercises" className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-12">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-3">Trạm Huấn Luyện (50 CÂU)</h2>
                            <p className="text-slate-600 font-medium">Bấm vào đáp án để Check ngay đúng/sai. Chinh phục IELTS Error Correction nào!</p>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
                            {[
                                { id: 0, title: "Tạo số nhiều", label: "Dạng 1" },
                                { id: 1, title: "Phát âm", label: "Dạng 2" },
                                { id: 2, title: "Bất quy tắc", label: "Dạng 3" },
                                { id: 3, title: "Hòa hợp SV", label: "Dạng 4" },
                                { id: 4, title: "Lỗi IELTS", label: "Dạng 5" }
                            ].map((tab, index) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(index)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all
                                    ${activeTab === index 
                                        ? 'bg-primary text-white shadow-md' 
                                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {tab.label}: {tab.title}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[400px]">
                            {activeTab === 0 && <ExForm />}
                            {activeTab === 1 && <ExPronunciation />}
                            {activeTab === 2 && <ExIrregular />}
                            {activeTab === 3 && <ExAgreement />}
                            {activeTab === 4 && <ExIELTS />}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
