<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | Compound Nouns Masterclass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5', 
                        primaryLight: '#e0e7ff', 
                        secondary: '#10B981', 
                        warning: '#F59E0B', 
                        info: '#3B82F6', 
                        accent: '#F43F5E', 
                        brandDark: '#1e1b4b', 
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background-color: #f8fafc;
            color: #334155; 
            line-height: 1.8;
            min-height: 100vh;
        }
        .glass {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .slide-down { animation: slideDown 0.3s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-200 selection:text-indigo-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- PURE INLINE SVGS ---
        const SvgCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
        const SvgCross = () => <svg className="w-5 h-5 text-rose-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const SvgWarning = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const SvgInfo = () => <svg className="w-5 h-5 text-indigo-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const SvgChevron = ({ isOpen }) => <svg className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>;
        const SvgBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;
        const SvgTarget = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>;

        // --- COMPONENTS ---
        const Highlight = ({ children, color = "primary" }) => {
            const styles = {
                primary: "bg-indigo-50 text-indigo-700",
                secondary: "bg-emerald-50 text-emerald-700",
                warning: "bg-amber-50 text-amber-700",
                accent: "bg-rose-50 text-rose-700",
                info: "bg-blue-50 text-blue-700"
            };
            return <span className={`inline-block px-2 py-0.5 rounded font-semibold text-[15px] ${styles[color]}`}>{children}</span>;
        };

        const ExampleBox = ({ children }) => (
            <div className="bg-slate-50 border-l-4 border-indigo-400 p-4 my-3 text-slate-700 rounded-r-lg shadow-sm text-[15px]">
                {children}
            </div>
        );

        const NoteBox = ({ children, type = "info" }) => {
            const styles = {
                warning: "bg-amber-50 border-amber-200 text-amber-900",
                info: "bg-indigo-50 border-indigo-200 text-indigo-900",
                danger: "bg-rose-50 border-rose-200 text-rose-900"
            };
            const icons = { warning: <SvgWarning />, info: <SvgInfo />, danger: <SvgCross /> };
            return (
                <div className={`border p-4 my-4 rounded-xl flex items-start text-[15px] ${styles[type]}`}>
                    <div className="mt-0.5 shrink-0">{icons[type]}</div>
                    <div className="ml-2 w-full">{children}</div>
                </div>
            );
        };

        const Point = ({ num, title, children, isLast }) => (
            <div className={`pb-8 mb-8 ${!isLast ? 'border-b border-dashed border-slate-300' : ''}`}>
                <div className="flex items-center gap-4 mb-4">
                    <span className="bg-indigo-100 text-indigo-800 font-extrabold px-3 py-1.5 rounded-lg text-sm shadow-sm">Mục {num}</span>
                    <h3 className="font-extrabold text-brandDark text-lg tracking-wide uppercase">{title}</h3>
                </div>
                <div className="text-slate-600 text-[15px] leading-relaxed space-y-2">
                    {children}
                </div>
            </div>
        );

        const Accordion = ({ title, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-6 bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full p-5 md:p-6 flex justify-between items-center text-left bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl text-indigo-600 shadow-sm">
                                <SvgBook />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                        </div>
                        <SvgChevron isOpen={isOpen} />
                    </button>
                    {isOpen && <div className="p-6 md:p-8 bg-white slide-down">{children}</div>}
                </div>
            );
        };

        const ExplanationBox = ({ isCorrect, exp }) => (
            <div className={`mt-4 p-4 rounded-xl text-[15px] font-medium border flex items-start gap-3 ${isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="mt-0.5">
                    {isCorrect ? <SvgCheck /> : <SvgCross />}
                </div>
                <div className="w-full">
                    <strong className="block mb-1">{isCorrect ? "Chính xác!" : "Sai rồi!"}</strong>
                    {exp}
                </div>
            </div>
        );

        // --- EXERCISE COMPONENTS ---

        // Dạng 1: Tìm Head Noun (Mục 61, 66, 67)
        const ExHeadNoun = () => {
            const questions = [
                { id: 1, q: ["school", "bus"], ans: "bus", exp: "Bus là danh từ chính. School bổ nghĩa cho bus." },
                { id: 2, q: ["football", "player"], ans: "player", exp: "Player là danh từ chính. Football cho biết loại người chơi." },
                { id: 3, q: ["coffee", "shop"], ans: "shop", exp: "Shop là danh từ chính. Coffee chỉ loại cửa hàng." },
                { id: 4, q: ["tennis", "court"], ans: "court", exp: "Court là danh từ chính." },
                { id: 5, q: ["swimming", "pool"], ans: "pool", exp: "Pool là danh từ chính. Swimming chỉ mục đích (hồ để bơi)." },
                { id: 6, q: ["traffic", "problem"], ans: "problem", exp: "Problem là danh từ chính." },
                { id: 7, q: ["sports", "equipment"], ans: "equipment", exp: "Equipment là danh từ chính." },
                { id: 8, q: ["bus", "stop"], ans: "stop", exp: "Stop là danh từ chính." },
                { id: 9, q: ["a", "modern", "sports", "training", "centre"], ans: "centre", exp: "Centre nằm cuối (đóng vai trò head noun chính). Các từ trước đều bổ nghĩa." },
                { id: 10, q: ["government", "education", "policy"], ans: "policy", exp: "Policy là danh từ chính. Nghĩa là chính sách giáo dục của chính phủ." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Xác định Danh từ chính (Head Noun) trong cụm.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-wrap gap-2 items-center mb-2">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span></span>
                                {q.q.map(opt => {
                                    const st = status[q.id];
                                    let style = "px-3 py-1.5 rounded-lg text-[15px] font-bold border-2 transition-all cursor-pointer ";
                                    if (!st) style += "border-transparent bg-slate-50 text-slate-700 hover:border-primary hover:text-primary";
                                    else {
                                        if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                        else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700 line-through";
                                        else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                        else style += "bg-white border-transparent text-slate-400 opacity-50";
                                    }
                                    return <span key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</span>;
                                })}
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 2: Quy tắc số nhiều (Mục 28-36, 62)
        const ExPlural = () => {
            const questions = [
                { id: 1, q: "bus stop", opts: ["buses stops", "bus stops"], ans: "bus stops", exp: "Head noun là 'stop' -> bus stops." },
                { id: 2, q: "football player", opts: ["football players", "footballs player"], ans: "football players", exp: "Head noun là 'player' -> football players." },
                { id: 3, q: "school bus", opts: ["schools buses", "school buses"], ans: "school buses", exp: "Head noun là 'bus' -> school buses." },
                { id: 4, q: "tennis court", opts: ["tennis courts", "tennises court"], ans: "tennis courts", exp: "Head noun là 'court' -> tennis courts." },
                { id: 5, q: "water bottle", opts: ["waters bottle", "water bottles"], ans: "water bottles", exp: "Head noun là 'bottle' -> water bottles." },
                { id: 6, q: "mother-in-law", opts: ["mother-in-laws", "mothers-in-law"], ans: "mothers-in-law", exp: "Head noun của cụm có gạch nối này là 'mother' -> mothers-in-law." },
                { id: 7, q: "passer-by", opts: ["passers-by", "passer-bys"], ans: "passers-by", exp: "Head noun là 'passer' -> passers-by." },
                { id: 8, q: "editor-in-chief", opts: ["editors-in-chief", "editor-in-chiefs"], ans: "editors-in-chief", exp: "Head noun là 'editor' -> editors-in-chief." },
                { id: 9, q: "toothbrush", opts: ["teethbrush", "toothbrushes"], ans: "toothbrushes", exp: "Đã thành một từ khép kín (closed compound) -> toothbrushes." },
                { id: 10, q: "swimming pool", opts: ["swimmings pool", "swimming pools"], ans: "swimming pools", exp: "Head noun là 'pool' -> swimming pools." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Chọn dạng số nhiều đúng cho Danh từ ghép.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 3: Compound hay Cụm bình thường? (Mục 14-20, 63-65)
        const ExMeaning = () => {
            const questions = [
                { id: 1, q: "a blackbird", opts: ["một con chim có màu đen", "một loài chim cụ thể"], ans: "một loài chim cụ thể", exp: "Viết liền (compound noun) -> Tên một loài chim riêng biệt." },
                { id: 2, q: "a black bird", opts: ["một con chim có màu đen", "một loài chim cụ thể"], ans: "một con chim có màu đen", exp: "Viết cách (adj + noun) -> Mô tả con chim có màu đen." },
                { id: 3, q: "darkroom", opts: ["phòng bị tối", "phòng rửa/in ảnh"], ans: "phòng rửa/in ảnh", exp: "Compound noun -> Một khái niệm/tên gọi riêng." },
                { id: 4, q: "dark room", opts: ["phòng bị tối", "phòng rửa/in ảnh"], ans: "phòng bị tối", exp: "Adj + Noun -> Mô tả căn phòng bị tối." },
                { id: 5, q: "greenhouse", opts: ["ngôi nhà sơn màu xanh", "nhà kính trồng cây"], ans: "nhà kính trồng cây", exp: "Compound noun -> Khái niệm mới (nhà kính)." },
                { id: 6, q: "paper bag", opts: ["túi làm bằng giấy", "túi chứa giấy bên trong"], ans: "túi làm bằng giấy", exp: "Modifier + Head -> Chất liệu làm nên túi." },
                { id: 7, q: "a bag of paper", opts: ["túi làm bằng giấy", "túi chứa giấy bên trong"], ans: "túi chứa giấy bên trong", exp: "Head + of + Noun -> Cấu trúc chỉ vật chứa (túi) và nội dung (giấy)." },
                { id: 8, q: "water bottle", opts: ["chai dùng để chứa nước", "chai đang chứa nước bên trong"], ans: "chai dùng để chứa nước", exp: "Compound noun -> Chỉ một LOẠI chai (vật dụng)." },
                { id: 9, q: "a bottle of water", opts: ["chai dùng để chứa nước", "chai đang chứa nước bên trong"], ans: "chai đang chứa nước bên trong", exp: "Head + of + Noun -> Nhấn mạnh nội dung chứa trong chai." },
                { id: 10, q: "coffee cup", opts: ["cốc dùng để uống cà phê", "cốc đang có cà phê bên trong"], ans: "cốc dùng để uống cà phê", exp: "Compound noun -> Chỉ LOẠI cốc (chức năng)." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Viết liền/cách/có "of" sẽ thay đổi ý nghĩa. Chọn nghĩa đúng.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "text-left px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 4: Cấu trúc Nâng cao & Phân tích (Mục 54, 70, 71)
        const ExAnalysis = () => {
            const questions = [
                { id: 1, q: "the football players’ changing room", opts: ["phòng thay đồ của 1 cầu thủ", "phòng thay đồ của các cầu thủ"], ans: "phòng thay đồ của các cầu thủ", exp: "players' = possessive plural (sở hữu của nhiều người)." },
                { id: 2, q: "my brother's bedroom", opts: ["phòng ngủ của anh trai tôi", "những anh trai có chung phòng ngủ"], ans: "phòng ngủ của anh trai tôi", exp: "brother's = possessive singular." },
                { id: 3, q: "a new football training centre", opts: ["Trung tâm mới dùng để huấn luyện bóng đá", "Trung tâm đào tạo cầu thủ bóng đá mới"], ans: "Trung tâm mới dùng để huấn luyện bóng đá", exp: "'new' là Adjective đứng trước toàn bộ cụm 'football training centre'." },
                { id: 4, q: "urban traffic-reduction policy", opts: ["Chính sách giảm giao thông đô thị", "Giao thông đô thị làm giảm chính sách"], ans: "Chính sách giảm giao thông đô thị", exp: "Head noun là 'policy'. Các từ trước bổ nghĩa cho policy." },
                { id: 5, q: "a large international sports training centre", opts: ["Có 2 adjectives (large, international)", "Có 4 adjectives"], ans: "Có 2 adjectives (large, international)", exp: "large, international là Adj. Sports, training là Noun Modifiers." },
                { id: 6, q: "Trong cụm 'sports equipment', equipment là:", opts: ["Countable", "Uncountable"], ans: "Uncountable", exp: "Equipment luôn là U. Do đó chỉ dùng 'some sports equipment', không thêm s." },

                            <p className="text-slate-600 font-medium">Test phản xạ tức thì. Bấm vào đáp án để nhận giải thích chi tiết!</p>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
                            {[
                                { id: 0, title: "Head Noun", label: "Dạng 1" },
                                { id: 1, title: "Số nhiều", label: "Dạng 2" },
                                { id: 2, title: "Nghĩa & 'Of'", label: "Dạng 3" },
                                { id: 3, title: "Phân tích cụm", label: "Dạng 4" },
                                { id: 4, title: "Lỗi IELTS", label: "Dạng 5" }
                            ].map((tab, index) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(index)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all
                                    ${activeTab === index 
                                        ? 'bg-primary text-white shadow-md' 
                                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {tab.label}: {tab.title}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[400px]">
                            {activeTab === 0 && <ExHeadNoun />}
                            {activeTab === 1 && <ExPlural />}
                            {activeTab === 2 && <ExMeaning />}
                            {activeTab === 3 && <ExAnalysis />}
                            {activeTab === 4 && <ExIELTS />}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
