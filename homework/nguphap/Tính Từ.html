<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | OSASCOMP Masterclass</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#6366F1', // Indigo 500
                        secondary: '#10B981', // Emerald 500
                        warning: '#F59E0B', // Amber 500
                        danger: '#F43F5E', // Rose 500
                        info: '#3B82F6', // Blue 500
                        dark: '#1e293b' // Slate 800
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0e7ff 50%, #fdf2f8 100%);
            color: #334155; 
            line-height: 1.8;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .slide-down { animation: slideDown 0.3s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
    </style>
</head>
<body class="antialiased selection:bg-indigo-200 selection:text-indigo-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- PURE INLINE SVGS (0% Emojis, 0% External Fonts) ---
        const SvgCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
        const SvgCross = () => <svg className="w-5 h-5 text-rose-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const SvgWarning = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const SvgInfo = () => <svg className="w-5 h-5 text-indigo-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const SvgChevron = ({ isOpen }) => <svg className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>;
        const SvgBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;

        // --- FORMATTING COMPONENTS ---
        const Highlight = ({ children, color = "primary" }) => {
            const styles = {
                primary: "bg-indigo-50 text-indigo-700",
                secondary: "bg-emerald-50 text-emerald-700",
                warning: "bg-amber-50 text-amber-700",
                danger: "bg-rose-50 text-rose-700",
                info: "bg-blue-50 text-blue-700"
            };
            return <span className={`inline-block px-2 py-0.5 rounded font-semibold text-[15px] border border-slate-200 ${styles[color]}`}>{children}</span>;
        };
        
        const ExampleBox = ({ children }) => (
            <div className="bg-white border-l-4 border-indigo-500 p-4 my-4 rounded-r-lg text-slate-700 text-[15px] shadow-sm">
                {children}
            </div>
        );

        const NoteBox = ({ children, type = "info" }) => {
            const styles = {
                warning: "bg-amber-50 border-amber-200 text-amber-900",
                info: "bg-indigo-50 border-indigo-200 text-indigo-900",
                danger: "bg-rose-50 border-rose-200 text-rose-900"
            };
            const icons = {
                warning: <SvgWarning />,
                info: <SvgInfo />,
                danger: <SvgCross />
            };
            return (
                <div className={`border p-4 my-4 rounded-xl flex items-start text-[15px] ${styles[type]}`}>
                    <div className="mt-0.5 shrink-0">{icons[type]}</div>
                    <div className="ml-2 w-full">{children}</div>
                </div>
            );
        };

        const Point = ({ num, title, children, isLast }) => (
            <div className={`pb-8 mb-8 ${!isLast ? 'border-b border-dashed border-slate-300' : ''}`}>
                <div className="flex items-center gap-4 mb-4">
                    <span className="bg-indigo-600 text-white font-extrabold px-3 py-1.5 rounded-lg text-sm shadow-sm">Mục {num}</span>
                    <h3 className="font-extrabold text-slate-800 text-lg tracking-wide uppercase">{title}</h3>
                </div>
                <div className="text-slate-600 text-base leading-relaxed space-y-3">
                    {children}
                </div>
            </div>
        );

        const Accordion = ({ title, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-6 bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition-all">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full p-5 md:p-6 flex justify-between items-center text-left bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-indigo-600 shadow-sm">
                                <SvgBook />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                        </div>
                        <SvgChevron isOpen={isOpen} />
                    </button>
                    {isOpen && <div className="p-6 md:p-8 bg-white slide-down">{children}</div>}
                </div>
            );
        };

        const ExplanationBox = ({ isCorrect, exp }) => (
            <div className={`mt-4 p-4 rounded-xl text-[15px] font-medium border flex items-start gap-3 ${isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="mt-0.5 shrink-0">
                    {isCorrect ? <SvgCheck /> : <SvgCross />}
                </div>
                <div className="w-full">
                    <strong className="block mb-1">{isCorrect ? "Chính xác!" : "Sai rồi!"}</strong>
                    {exp}
                </div>
            </div>
        );

        const FlipCard = ({ front, back, frontColor, backColor }) => {
            const [isFlipped, setIsFlipped] = useState(false);
            return (
                <div className="perspective-1000 w-full h-28 group cursor-pointer" onClick={() => setIsFlipped(!isFlipped)}>
                    <div className={`relative w-full h-full duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        <div className={`absolute inset-0 backface-hidden rounded-2xl flex flex-col items-center justify-center p-4 text-center shadow-sm border border-white/50 ${frontColor}`}>
                            <span className="font-extrabold text-lg">{front}</span>
                        </div>
                        <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-2xl flex items-center justify-center p-4 text-center shadow-lg border border-transparent ${backColor}`}>
                            <span className="font-bold text-[15px]">{back}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // --- EXERCISE COMPONENTS ---

        const ExCategory = () => {
            const questions = [
                { id: 1, word: "beautiful", opts: ["Opinion", "Size", "Shape", "Color"], ans: "Opinion", exp: "Beautiful là quan điểm/đánh giá chủ quan của người nói." },
                { id: 2, word: "enormous", opts: ["Size", "Age", "Origin", "Material"], ans: "Size", exp: "Enormous nghĩa là to lớn, khổng lồ &rarr; Kích thước (Size)." },
                { id: 3, word: "ancient", opts: ["Age", "Shape", "Color", "Purpose"], ans: "Age", exp: "Ancient nghĩa là cổ đại, lâu đời &rarr; Tuổi (Age)." },
                { id: 4, word: "round", opts: ["Size", "Shape", "Material", "Opinion"], ans: "Shape", exp: "Round nghĩa là hình tròn &rarr; Hình dáng (Shape)." },
                { id: 5, word: "blue", opts: ["Age", "Color", "Origin", "Purpose"], ans: "Color", exp: "Blue là Màu sắc (Color)." },
                { id: 6, word: "Japanese", opts: ["Opinion", "Size", "Origin", "Material"], ans: "Origin", exp: "Japanese chỉ nguồn gốc, xuất xứ từ Nhật Bản &rarr; Nguồn gốc (Origin)." },
                { id: 7, word: "wooden", opts: ["Shape", "Color", "Origin", "Material"], ans: "Material", exp: "Wooden chỉ chất liệu làm bằng gỗ &rarr; Chất liệu (Material)." },
                { id: 8, word: "sleeping", opts: ["Opinion", "Age", "Material", "Purpose"], ans: "Purpose", exp: "Sleeping bag (túi ngủ) &rarr; Sleeping chỉ mục đích sử dụng (Purpose)." },
                { id: 9, word: "expensive", opts: ["Opinion", "Size", "Shape", "Origin"], ans: "Opinion", exp: "Expensive (đắt) là đánh giá chủ quan &rarr; Opinion." },
                { id: 10, word: "tiny", opts: ["Size", "Age", "Color", "Material"], ans: "Size", exp: "Tiny (nhỏ xíu) chỉ kích thước &rarr; Size." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 1: Phân loại Tính từ theo hệ thống OSASCOMP</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-slate-800 text-lg"><span className="text-slate-400 mr-2">{q.id}.</span> {q.word}</span>
                                <div className="flex flex-wrap gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-[15px] font-bold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        const ExOrder = () => {
            const questions = [
                { id: 1, q: "Huy bought a... (table)", opts: ["wooden beautiful old", "beautiful old wooden"], ans: "beautiful old wooden", exp: "Opinion (beautiful) &rarr; Age (old) &rarr; Material (wooden)." },
                { id: 2, q: "Kim Phụng drives an... (car)", opts: ["Italian expensive sports", "expensive Italian sports"], ans: "expensive Italian sports", exp: "Opinion (expensive) &rarr; Origin (Italian) &rarr; Purpose (sports)." },
                { id: 3, q: "Peter has a... (bag)", opts: ["large red leather", "red large leather"], ans: "large red leather", exp: "Size (large) &rarr; Color (red) &rarr; Material (leather)." },
                { id: 4, q: "Michael bought a... (dress)", opts: ["traditional beautiful Vietnamese", "beautiful traditional Vietnamese"], ans: "beautiful traditional Vietnamese", exp: "Opinion (beautiful) &rarr; Age/Style (traditional) &rarr; Origin (Vietnamese)." },
                { id: 5, q: "Gia Hưng likes the... (table)", opts: ["small round glass", "round small glass"], ans: "small round glass", exp: "Size (small) &rarr; Shape (round) &rarr; Material (glass)." },
                { id: 6, q: "Look at that... (building)", opts: ["huge old", "old huge"], ans: "huge old", exp: "Size (huge) &rarr; Age (old)." },
                { id: 7, q: "I wear a... (shirt)", opts: ["new lovely silk", "lovely new silk"], ans: "lovely new silk", exp: "Opinion (lovely) &rarr; Age (new) &rarr; Material (silk)." },
                { id: 8, q: "She sat on an... (chair)", opts: ["ugly big plastic", "big ugly plastic"], ans: "ugly big plastic", exp: "Opinion (ugly) &rarr; Size (big) &rarr; Material (plastic)." },
                { id: 9, q: "We bought a... (sofa)", opts: ["comfortable old leather", "old comfortable leather"], ans: "comfortable old leather", exp: "Opinion (comfortable) &rarr; Age (old) &rarr; Material (leather)." },
                { id: 10, q: "He found an... (vase)", opts: ["ancient fascinating Chinese", "fascinating ancient Chinese"], ans: "fascinating ancient Chinese", exp: "Opinion (fascinating) &rarr; Age (ancient) &rarr; Origin (Chinese)." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 2: Sắp xếp theo OSASCOMP (Chọn cụm đúng)</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex flex-col gap-4">
                                <span className="font-bold text-slate-800 text-lg"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "text-left px-5 py-3 rounded-lg text-[15px] font-semibold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-700 hover:border-indigo-500 hover:bg-indigo-50";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-800";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-800";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        const ExComma = () => {
            const questions = [
                { id: 1, q: "a beautiful elegant dress", ans: "Coordinate", exp: "Cả hai đều là Opinion &rarr; Cùng nhóm &rarr; Coordinate (Có thể dùng phẩy hoặc and)." },
                { id: 2, q: "a beautiful old house", ans: "Cumulative", exp: "Opinion &rarr; Age. Các tính từ xây dựng thông tin theo lớp &rarr; Cumulative (Không dùng phẩy)." },
                { id: 3, q: "a long difficult journey", ans: "Coordinate", exp: "Có thể chèn 'and' (a long and difficult journey) &rarr; Coordinate." },
                { id: 4, q: "a cold rainy day", ans: "Coordinate", exp: "Cùng nhóm mô tả thời tiết (a cold and rainy day) &rarr; Coordinate." },
                { id: 5, q: "a large wooden table", ans: "Cumulative", exp: "Size &rarr; Material. Không tự nhiên nếu nói 'large and wooden table' &rarr; Cumulative." },
                { id: 6, q: "a tall smart man", ans: "Coordinate", exp: "Có thể đảo ngược 'a smart tall man' hoặc chèn 'and' &rarr; Coordinate." },
                { id: 7, q: "a cheap plastic toy", ans: "Cumulative", exp: "Opinion &rarr; Material &rarr; Cumulative." },
                { id: 8, q: "a dark scary forest", ans: "Coordinate", exp: "Cùng nhóm Opinion/Mô tả. Dùng phẩy hoặc 'and' &rarr; Coordinate." },
                { id: 9, q: "a small black cat", ans: "Cumulative", exp: "Size &rarr; Color &rarr; Cumulative." },
                { id: 10, q: "a happy energetic child", ans: "Coordinate", exp: "Cùng nhóm Opinion/Tính cách &rarr; Coordinate." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 3: Coordinate (Đồng đẳng) hay Cumulative (Tích lũy)?</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-slate-800 text-[17px]"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex gap-2">
                                    {["Coordinate", "Cumulative"].map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-2 rounded-lg text-[15px] font-bold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        const ExHeadNoun = () => {
            const questions = [
                { id: 1, q: ["swimming", "pool"], ans: "pool", exp: "Pool là danh từ chính. Swimming là purpose (hồ để bơi)." },
                { id: 2, q: ["dining", "table"], ans: "table", exp: "Table là danh từ chính." },
                { id: 3, q: ["running", "shoes"], ans: "shoes", exp: "Shoes là danh từ chính." },
                { id: 4, q: ["coffee", "cup"], ans: "cup", exp: "Cup là danh từ chính. Coffee là Noun Modifier." },
                { id: 5, q: ["beautiful", "old", "house"], ans: "house", exp: "House là danh từ chính." },
                { id: 6, q: ["expensive", "leather", "bag"], ans: "bag", exp: "Bag là danh từ chính." },
                { id: 7, q: ["three", "large", "red", "boxes"], ans: "boxes", exp: "Boxes là danh từ chính." },
                { id: 8, q: ["travel", "bag"], ans: "bag", exp: "Bag là danh từ chính. Travel là Purpose." },
                { id: 9, q: ["kitchen", "table"], ans: "table", exp: "Table là danh từ chính. Kitchen là Noun Modifier." },
                { id: 10, q: ["language", "school"], ans: "school", exp: "School là danh từ chính." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, word, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: word, isCorrect: word === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

                                <p className="mb-2">Hãy tưởng tượng Head Noun ở giữa, rồi thông tin được "xây" dần từ ngoài vào: <b>Opinion &rarr; Size &rarr; Age &rarr; Shape &rarr; Color &rarr; Origin &rarr; Material &rarr; Purpose &rarr; HEAD NOUN</b>.</p>
                                <NoteBox type="info">
                                    <b>MUST REMEMBER:</b><br/>
                                    1. Không phải noun phrase nào cũng cần đủ 8 loại.<br/>
                                    2. Không phải từ đứng trước noun nào cũng là adjective (school bus).<br/>
                                    3. Purpose thường đứng rất gần noun.<br/>
                                    4. OSASCOMP là guideline để giúp tự nhiên hơn, không phải luật tuyệt đối áp dụng máy móc.
                                </NoteBox>
                                <p className="font-bold text-indigo-700 mt-4 text-center text-lg">Grammar cho em biết câu nào đúng. Sense of language giúp em biết câu nào tự nhiên.</p>
                            </Point>
                        </Accordion>
                    </div>

                    {/* Interactive Exercises (Tabs) */}
                    <div id="exercises" className="glass rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-12">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-3">Trạm Huấn Luyện (50 CÂU)</h2>
                            <p className="text-slate-600 font-medium">Bấm vào đáp án để Check ngay đúng/sai. Đừng để dính bẫy nhé!</p>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
                            {[
                                { id: 0, title: "Phân loại", label: "Dạng 1" },
                                { id: 1, title: "Sắp xếp", label: "Dạng 2" },
                                { id: 2, title: "Cumulative", label: "Dạng 3" },
                                { id: 3, title: "Head Noun", label: "Dạng 4" },
                                { id: 4, title: "Độ tự nhiên", label: "Dạng 5" }
                            ].map((tab, index) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(index)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all
                                    ${activeTab === index 
                                        ? 'bg-indigo-600 text-white shadow-md' 
                                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {tab.label}: {tab.title}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[400px]">
                            {activeTab === 0 && <ExCategory />}
                            {activeTab === 1 && <ExOrder />}
                            {activeTab === 2 && <ExComma />}
                            {activeTab === 3 && <ExHeadNoun />}
                            {activeTab === 4 && <ExNatural />}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
