<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | Reported Speech Masterclass</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDNJS) -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#6366F1', // Indigo 500
                        secondary: '#10B981', // Emerald 500
                        warning: '#F59E0B', // Amber 500
                        danger: '#F43F5E', // Rose 500
                        info: '#3B82F6', // Blue 500
                        brandDark: '#0f172a' // Slate 900
                    },
                    boxShadow: {
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #fdf2f8 100%);
            color: #334155; 
            line-height: 1.8;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        .slide-down { animation: slideDown 0.3s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="antialiased selection:bg-indigo-200 selection:text-indigo-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- PURE INLINE SVGS ---
        const SvgCheck = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>;
        const SvgCross = () => <svg className="w-5 h-5 text-rose-500 inline-block mr-1 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>;
        const SvgWarning = () => <svg className="w-5 h-5 text-amber-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const SvgInfo = () => <svg className="w-5 h-5 text-indigo-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const SvgChevron = ({ isOpen }) => <svg className={`w-5 h-5 text-slate-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>;
        const SvgBook = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>;
        const SvgTarget = () => <svg className="w-5 h-5 text-emerald-500 inline-block mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>;

        // --- FORMATTING COMPONENTS ---
        const Highlight = ({ children, color = "primary" }) => {
            const styles = {
                primary: "bg-indigo-50 text-indigo-700",
                secondary: "bg-emerald-50 text-emerald-700",
                warning: "bg-amber-50 text-amber-700",
                danger: "bg-rose-50 text-rose-700",
                info: "bg-blue-50 text-blue-700"
            };
            return <span className={`inline-block px-2 py-0.5 rounded font-semibold text-[15px] border border-slate-200 ${styles[color]}`}>{children}</span>;
        };
        
        const ExampleBox = ({ children }) => (
            <div className="bg-white border-l-4 border-indigo-400 p-4 my-3 text-slate-700 rounded-r-lg shadow-sm text-[15px]">
                {children}
            </div>
        );

        const NoteBox = ({ children, type = "info" }) => {
            const styles = {
                warning: "bg-amber-50 border-amber-200 text-amber-900",
                info: "bg-indigo-50 border-indigo-200 text-indigo-900",
                danger: "bg-rose-50 border-rose-200 text-rose-900"
            };
            const icons = { warning: <SvgWarning />, info: <SvgInfo />, danger: <SvgCross /> };
            return (
                <div className={`border p-4 my-4 rounded-xl flex items-start text-[15px] ${styles[type]}`}>
                    <div className="mt-0.5 shrink-0">{icons[type]}</div>
                    <div className="ml-2 w-full">{children}</div>
                </div>
            );
        };

        const Point = ({ num, title, children, isLast }) => (
            <div className={`pb-8 mb-8 ${!isLast ? 'border-b border-dashed border-slate-300' : ''}`}>
                <div className="flex items-center gap-4 mb-4">
                    <span className="bg-indigo-600 text-white font-extrabold px-3 py-1.5 rounded-lg text-sm shadow-sm">Mục {num}</span>
                    <h3 className="font-extrabold text-brandDark text-lg tracking-wide uppercase">{title}</h3>
                </div>
                <div className="text-slate-600 text-[15px] leading-relaxed space-y-2">
                    {children}
                </div>
            </div>
        );

        const Accordion = ({ title, children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mb-6 bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                    <button onClick={() => setIsOpen(!isOpen)} className="w-full p-5 md:p-6 flex justify-between items-center text-left bg-slate-50 hover:bg-slate-100 transition-colors">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl text-indigo-600 shadow-sm">
                                <SvgBook />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                        </div>
                        <SvgChevron isOpen={isOpen} />
                    </button>
                    {isOpen && <div className="p-6 md:p-8 bg-white slide-down">{children}</div>}
                </div>
            );
        };

        const ExplanationBox = ({ isCorrect, exp }) => (
            <div className={`mt-4 p-4 rounded-xl text-[15px] font-medium border flex items-start gap-3 ${isCorrect ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"}`}>
                <div className="mt-0.5">
                    {isCorrect ? <SvgCheck /> : <SvgCross />}
                </div>
                <div className="w-full">
                    <strong className="block mb-1">{isCorrect ? "Chính xác!" : "Sai rồi!"}</strong>
                    {exp}
                </div>
            </div>
        );

        // --- EXERCISE COMPONENTS ---

        // Dạng 1: Chuyển câu (Tense & Pronouns)
        const ExTransform = () => {
            const questions = [
                { id: 1, q: 'He said, "I am tired."', opts: ["He said that I was tired.", "He said that he was tired."], ans: "He said that he was tired.", exp: "Đổi 'I' -> 'he', lùi 'am' -> 'was'." },
                { id: 2, q: 'Mary said, "I have finished my homework."', opts: ["Mary said that she had finished her homework.", "Mary said that she finished her homework."], ans: "Mary said that she had finished her homework.", exp: "Đổi 'I' -> 'she', 'my' -> 'her'. Lùi 'have finished' -> 'had finished'." },
                { id: 3, q: 'Tom said, "I will call you tomorrow."', opts: ["Tom said that he would call me tomorrow.", "Tom said that he would call me the next day."], ans: "Tom said that he would call me the next day.", exp: "Lùi 'will' -> 'would'. Đổi 'tomorrow' -> 'the next day'." },
                { id: 4, q: 'Anna said, "I can help you."', opts: ["Anna said that she could help me.", "Anna said that she can help me."], ans: "Anna said that she could help me.", exp: "Đổi 'I' -> 'she'. Lùi 'can' -> 'could'." },
                { id: 5, q: 'The teacher said, "Water boils at 100°C."', opts: ["The teacher said that water boiled at 100°C.", "The teacher said that water boils at 100°C."], ans: "The teacher said that water boils at 100°C.", exp: "Sự thật khoa học hiển nhiên -> KHÔNG lùi thì." },
                { id: 6, q: 'John said to Mary, "I will help you."', opts: ["John told Mary that he would help her.", "John told Mary that she would help him."], ans: "John told Mary that he would help her.", exp: "'I' là John (he), 'you' là Mary (her)." },
                { id: 7, q: '"I am busy now," he said.', opts: ["He said that he was busy then.", "He said that he is busy now."], ans: "He said that he was busy then.", exp: "Lùi 'am' -> 'was'. Đổi 'now' -> 'then'." },
                { id: 8, q: '"I saw him yesterday," she said.', opts: ["She said that she had seen him the day before.", "She said that she saw him yesterday."], ans: "She said that she had seen him the day before.", exp: "Lùi 'saw' -> 'had seen'. Đổi 'yesterday' -> 'the day before'." },
                { id: 9, q: '"I live here," he said.', opts: ["He said that he lived here.", "He said that he lived there."], ans: "He said that he lived there.", exp: "Lùi 'live' -> 'lived'. Đổi 'here' -> 'there'." },
                { id: 10, q: '"We are working," they said.', opts: ["They said that they were working.", "They said that we were working."], ans: "They said that they were working.", exp: "Đổi 'We' -> 'they'. Lùi 'are' -> 'were'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 1: Chuyển đổi Câu Trực tiếp sang Câu Tường thuật (Lùi thì, Đổi đại từ/Trạng từ)</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col gap-4">
                                <span className="font-bold text-slate-800 text-lg"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "px-4 py-3 rounded-lg text-[15px] font-bold border-2 transition-all text-left ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-600 hover:border-indigo-500 hover:text-indigo-600";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 2: Câu hỏi (Đảo ngữ)
        const ExQuestions = () => {
            const questions = [
                { id: 1, q: '"Are you busy?" she asked me.', opts: ["She asked me if I was busy.", "She asked me if was I busy."], ans: "She asked me if I was busy.", exp: "Đưa về Noun Clause: KHÔNG đảo to-be lên trước chủ ngữ." },
                { id: 2, q: '"Where do you live?" he asked.', opts: ["He asked me where did I live.", "He asked me where I lived."], ans: "He asked me where I lived.", exp: "Bỏ mượn trợ động từ 'do/does/did', lùi thì động từ chính (lived)." },
                { id: 3, q: '"Will you come tomorrow?" she asked.', opts: ["She asked whether I would come the next day.", "She asked whether would I come tomorrow."], ans: "She asked whether I would come the next day.", exp: "Lùi 'will' -> 'would', 'tomorrow' -> 'the next day'. Không đảo ngữ." },
                { id: 4, q: '"What are you doing?" she asked me.', opts: ["She asked me what I was doing.", "She asked me what was I doing."], ans: "She asked me what I was doing.", exp: "Không đảo 'was' lên trước 'I'." },
                { id: 5, q: '"Why did you leave?" he asked.', opts: ["He asked me why I had left.", "He asked me why did I leave."], ans: "He asked me why I had left.", exp: "Bỏ 'did', lùi Quá khứ đơn -> Quá khứ hoàn thành (had left)." },
                { id: 6, q: '"Do you like coffee?" he asked me.', opts: ["He asked me whether I liked coffee.", "He asked me if did I like coffee."], ans: "He asked me whether I liked coffee.", exp: "Bỏ 'do', lùi thì 'like' -> 'liked'." },
                { id: 7, q: '"Can you swim?" she asked.', opts: ["She asked if I could swim.", "She asked if could I swim."], ans: "She asked if I could swim.", exp: "Lùi 'can' -> 'could'. Không đảo ngữ." },
                { id: 8, q: '"Where is the station?" she asked.', opts: ["She asked where the station was.", "She asked where was the station."], ans: "She asked where the station was.", exp: "Chuyển 'is' ra sau chủ ngữ, lùi thành 'was'." },
                { id: 9, q: '"Have you finished?" he asked.', opts: ["He asked me if I had finished.", "He asked me if had I finished."], ans: "He asked me if I had finished.", exp: "Lùi 'have' -> 'had'. Không đảo ngữ." },
                { id: 10, q: '"When will it start?" she asked.', opts: ["She asked when it would start.", "She asked when would it start."], ans: "She asked when it would start.", exp: "Lùi 'will' -> 'would'. Không đảo ngữ." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 2: Tường thuật Câu Hỏi (Tuyệt đối KHÔNG đảo ngữ)</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col gap-4">
                                <span className="font-bold text-slate-800 text-lg"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "text-left px-4 py-3 rounded-lg text-[15px] font-semibold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-700 hover:border-indigo-500 hover:bg-indigo-50";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-800";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-800";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 3: Động từ Đặc biệt (Mệnh lệnh, Yêu cầu...)
        const ExVerbs = () => {
            const questions = [
                { id: 1, q: '"Open your book," the teacher said.', opts: ["The teacher told me to open my book.", "The teacher said me to open my book."], ans: "The teacher told me to open my book.", exp: "Dùng 'tell somebody to do something'. Không dùng 'say somebody'." },
                { id: 2, q: '"Don’t make noise," she said.', opts: ["She told us not to make noise.", "She told us to not make noise."], ans: "She told us not to make noise.", exp: "Phủ định: tell/ask somebody NOT to do something." },
                { id: 3, q: '"Please wait here," she said.', opts: ["She asked me to wait there.", "She asked me wait there."], ans: "She asked me to wait there.", exp: "Yêu cầu: ask somebody TO do something. Đổi 'here' -> 'there'." },
                { id: 4, q: '"You should study harder," he said.', opts: ["He advised me to study harder.", "He advised me study harder."], ans: "He advised me to study harder.", exp: "Khuyên bảo: advise somebody TO do something." },
                { id: 5, q: '"Don’t touch that!" he said.', opts: ["He warned me not to touch that.", "He warned me don't touch that."], ans: "He warned me not to touch that.", exp: "Cảnh báo: warn somebody NOT to do something." },
                { id: 6, q: '"I’ll help you," John said.', opts: ["John offered to help me.", "John offered me to help."], ans: "John offered to help me.", exp: "Đề nghị giúp: offer TO do something (không cần tân ngữ 'me' ở giữa)." },
                { id: 7, q: '"I will call you tomorrow," she said.', opts: ["She promised to call me the next day.", "She promised calling me tomorrow."], ans: "She promised to call me the next day.", exp: "Hứa: promise TO do something." },
                { id: 8, q: '"No, I won’t do it," he said.', opts: ["He refused doing it.", "He refused to do it."], ans: "He refused to do it.", exp: "Từ chối: refuse TO do something." },
                { id: 9, q: 'He said, "Why don\'t we go out?"', opts: ["He suggested me to go out.", "He suggested going out."], ans: "He suggested going out.", exp: "Bẫy rất lớn: Không dùng 'suggest somebody to do'. Dùng 'suggest V-ing'." },
                { id: 10, q: '"Don’t forget to call me," she said.', opts: ["She reminded me to call her.", "She reminded me not forget to call her."], ans: "She reminded me to call her.", exp: "Nhắc nhở: remind somebody TO do something. Thể hiện ý 'đừng quên'." }
            ];
            const [status, setStatus] = useState({});
            const handleSelect = (qId, opt, ans, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: opt, isCorrect: opt === ans, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-indigo-800">Dạng 3: Các Cấu trúc Động từ Tường thuật Đặc biệt</p>
                        <span className="font-bold text-indigo-700 bg-white border border-indigo-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10 Điểm</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-5 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <span className="font-bold text-lg text-slate-800"><span className="text-slate-400 mr-2">{q.id}.</span> {q.q}</span>
                                <div className="flex flex-col gap-2">
                                    {q.opts.map(opt => {
                                        const st = status[q.id];
                                        let style = "text-left px-4 py-2 rounded-lg text-sm font-bold border-2 transition-all ";
                                        if (!st) style += "bg-white border-slate-200 text-slate-600 hover:border-primary hover:text-primary";
                                        else {
                                            if (st.selected === opt && st.isCorrect) style += "bg-emerald-50 border-emerald-500 text-emerald-700";
                                            else if (st.selected === opt && !st.isCorrect) style += "bg-rose-50 border-rose-500 text-rose-700";
                                            else if (opt === q.ans) style += "bg-white border-emerald-300 text-emerald-600 border-dashed";
                                            else style += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                                        }
                                        return <button key={opt} onClick={() => handleSelect(q.id, opt, q.ans, q.exp)} className={style}>{opt}</button>;
                                    })}
                                </div>
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // Dạng 4: Tìm Lỗi Sai (Checklist 7 giây)
        const ExMistakes = () => {
            const questions = [
                { id: 1, s: ["She", "asked", "me", "where", "was", "I", "going."], errIdx: 4, exp: "Đảo ngữ sai: phải là 'where I was going'." },
                { id: 2, s: ["He", "told", "that", "he", "was", "tired."], errIdx: 1, exp: "Sau 'told' bắt buộc phải có Tân ngữ (me/him/her). Sửa: 'said that' hoặc 'told me that'." },
                { id: 3, s: ["She", "said", "me", "that", "she", "was", "busy."], errIdx: 1, exp: "Không dùng 'say somebody'. Sửa: 'told me' hoặc 'said to me'." },
                { id: 4, s: ["He", "suggested", "me", "to", "go."], errIdx: 2, exp: "Không dùng 'suggest somebody to do'. Sửa: 'suggested going' hoặc 'suggested that I go'." },
                { id: 5, s: ["I", "asked", "her", "whether", "would", "she", "come."], errIdx: 4, exp: "Đảo ngữ sai: phải là 'whether she would come'." },
                { id: 6, s: ["He", "said", "that", "he", "will", "help", "me."], errIdx: 4, exp: "Chưa lùi thì. Phải lùi 'will' -> 'would'." },
                { id: 7, s: ["They", "asked", "what", "was", "my", "name."], errIdx: 3, exp: "Đảo ngữ sai: phải là 'what my name was'." },
                { id: 8, s: ["She", "offered", "me", "to", "carry", "the", "bags."], errIdx: 2, exp: "Không dùng 'offer somebody to do'. Sửa: 'offered to carry'." },
                { id: 9, s: ["He", "said", "that", "he", "saw", "her", "yesterday."], errIdx: 6, exp: "Chưa đổi trạng từ thời gian. Sửa: 'the day before' / 'the previous day'." },
                { id: 10, s: ["The", "teacher", "told", "to", "us", "to", "be", "quiet."], errIdx: 3, exp: "Dư giới từ 'to'. Sửa: 'told us to be quiet'." }
            ];

            const [status, setStatus] = useState({});
            const handleSelect = (qId, wIdx, errIdx, exp) => {
                if (status[qId]) return;
                setStatus(prev => ({ ...prev, [qId]: { selected: wIdx, isCorrect: wIdx === errIdx, exp } }));
            };
            const score = Object.values(status).filter(s => s.isCorrect).length;

            return (
                <div className="space-y-4">
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl border border-indigo-100 mb-6">
                        <p className="font-bold text-slate-700"><SvgTarget /> Click vào <b>1 TỪ GÂY RA LỖI SAI</b> trong câu.</p>
                        <span className="font-black text-xl text-primary bg-white border border-slate-200 px-4 py-1.5 rounded-lg shadow-sm">{score}/10</span>
                    </div>
                    {questions.map((q) => (
                        <div key={q.id} className="p-4 bg-white rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex flex-wrap gap-x-1.5 gap-y-2 items-center text-lg mb-2">
                                <span className="text-slate-400 font-bold mr-2 text-base">{q.id}.</span>
                                {q.s.map((word, wIdx) => {
                                    const st = status[q.id];
                                    let style = "cursor-pointer px-3 py-1.5 rounded-lg transition-colors font-semibold border border-transparent ";
                                    if (!st) style += "hover:bg-slate-100 text-slate-700 hover:text-indigo-600";
                                    else {
                                        if (st.selected === wIdx && st.isCorrect) style += "bg-emerald-50 text-emerald-700 border-emerald-500";
                                        else if (st.selected === wIdx && !st.isCorrect) style += "bg-rose-50 text-rose-700 border-rose-500 line-through";
                                        else if (wIdx === q.errIdx) style += "bg-white text-emerald-600 border-dashed border-emerald-400";
                                        else style += "text-slate-400 bg-slate-50";
                                    }
                                    return <span key={wIdx} onClick={() => handleSelect(q.id, wIdx, q.errIdx, q.exp)} className={style}>{word}</span>;
                                })}
                            </div>
                            {status[q.id] && <ExplanationBox isCorrect={status[q.id].isCorrect} exp={status[q.id].exp} />}
                        </div>
                    ))}
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            
            return (
                <div className="max-w-4xl mx-auto pt-16 px-4 sm:px-6">
                    
                    <header className="text-center mb-16">
                        <div className="inline-flex items-center justify-center px-4 py-1.5 mb-6 rounded-full bg-indigo-100 border border-indigo-200 text-indigo-700 text-sm font-bold tracking-widest uppercase shadow-sm">
                            VocaFlow Grammar Hub
                        </div>
                        <h1 className="text-4xl md:text-5xl font-extrabold text-brandDark tracking-tight mb-6 leading-tight">
                            Hiểu Sâu <span className="text-primary">Câu Tường Thuật</span> <br className="hidden md:block"/>(Reported Speech)
                        </h1>
                        <p className="text-[17px] text-slate-600 max-w-2xl mx-auto font-medium leading-relaxed">
                            Đừng học vẹt "gặp tường thuật thì lùi thì". Hãy hiểu bản chất: Reported Speech chính là một ứng dụng của Mệnh đề danh từ (Noun Clause).
                        </p>
                    </header>

                    <div className="mb-16">
                        <h2 className="text-2xl md:text-3xl font-extrabold text-slate-800 mb-8 text-center border-b-2 border-slate-200 pb-4 inline-block mx-auto">Sổ tay Lý thuyết</h2>
                        
                        <Accordion title="1. Bản chất: Tường thuật & Noun Clause (Mục 1-3)">
                            <Point num="1" title="Câu tường thuật liên quan gì đến Mệnh đề danh từ?" isLast={false}>
                                <p className="mb-2">Khi tường thuật: <i>He said (that) he was tired.</i></p>
                                <p className="mb-2">Phần <b>that he was tired</b> chính là một Noun Clause, đóng vai trò là NỘI DUNG mà anh ấy nói.</p>
                                <p className="font-bold text-indigo-700">Reported Speech = Reporting Verb + Noun Clause</p>
                            </Point>

                            <Point num="2 & 3" title="Công thức tư duy: 3 Bước" isLast={true}>
                                <p className="mb-4">Đừng nhắm mắt lùi thì. Hãy đi theo 3 bước:</p>
                                <ol className="list-decimal pl-5 space-y-3 font-medium bg-slate-50 p-5 rounded-xl border border-slate-200">
                                    <li><b>BƯỚC 1:</b> Xác định người nói (<i>He said... / She told me...</i>).</li>
                                    <li><b>BƯỚC 2:</b> Xác định nội dung (Đưa vào Noun Clause).</li>
                                    <li><b>BƯỚC 3:</b> Điều chỉnh "Góc nhìn" (Đổi đại từ, thì, thời gian, nơi chốn nếu cần).</li>
                                </ol>
                            </Point>
                        </Accordion>

                        <Accordion title="2. Quy tắc Lùi thì & Ngoại lệ (Mục 4-7)">
                            <Point num="4 & 5" title="Bảng Lùi thì bắt buộc" isLast={false}>
                                <p className="mb-2">Khi Reporting Verb ở Quá khứ (said, told, asked...), lời nói thường bị "lùi một bậc về quá khứ".</p>
                                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden text-[15px] mt-2">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr className="bg-slate-50 text-slate-800">
                                                <th className="p-3 border-b border-slate-200">Câu trực tiếp</th>
                                                <th className="p-3 border-b border-slate-200 text-indigo-700">Tường thuật (Lùi thì)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr><td className="p-3 border-b border-slate-200 font-semibold">Hiện tại đơn (V1)</td><td className="p-3 border-b border-slate-200 text-indigo-600 font-bold">Quá khứ đơn (V2/ed)</td></tr>
                                            <tr><td className="p-3 border-b border-slate-200 font-semibold">Hiện tại tiếp diễn (am/is/are V-ing)</td><td className="p-3 border-b border-slate-200 text-indigo-600 font-bold">Qk tiếp diễn (was/were V-ing)</td></tr>
                                            <tr><td className="p-3 border-b border-slate-200 font-semibold">Quá khứ đơn (V2) / Hiện tại HT</td><td className="p-3 border-b border-slate-200 text-indigo-600 font-bold">Quá khứ hoàn thành (had V3)</td></tr>
                                            <tr><td className="p-3 font-semibold">will / can / may / must</td><td className="p-3 text-indigo-600 font-bold">would / could / might / had to</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </Point>

                            <Point num="6 & 7" title="Khi nào KHÔNG lùi thì?" isLast={true}>
                                <NoteBox type="info">
                                    Nếu điều được nói là <b>sự thật hiển nhiên/chân lý</b>, ta GIỮ NGUYÊN thì.<br/>
                                    VD: <i>The teacher said, "Water boils at 100°C." &rarr; The teacher said that water boils at 100°C.</i>
                                </NoteBox>
                                <p className="mt-2 text-[15px]">Cũng áp dụng nếu hành động VẪN ĐÚNG ở hiện tại. (<i>He said he lives in Vietnam</i> - nếu giờ vẫn sống đó).</p>
                            </Point>
                        </Accordion>

                        <Accordion title="3. Đổi Đại từ & Trạng từ (Mục 8-12)">
                            <Point num="8 & 9" title="Đổi Đại từ (Pronouns): Phải hỏi 'Ai đang nói?'" isLast={false}>
                                <p className="mb-2 text-rose-600 font-bold">Lỗi phổ biến: Quên đổi Đại từ theo góc nhìn.</p>
                                <ExampleBox>
                                    <i>John said to Mary, "<b>I</b> will help <b>you</b>."</i><br/>
                                    - "I" là người nói (John = he).<br/>
                                    - "you" là người nghe (Mary = her).<br/>
                                    &rarr; John told Mary that <b>he</b> would help <b>her</b>.
                                </ExampleBox>
                            </Point>

                            <Point num="10 - 12" title="Đổi Nơi chốn & Thời gian" isLast={true}>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2 text-[15px]">
                                    <div className="bg-white border border-slate-200 p-4 rounded-xl">
                                        <ul className="space-y-2">
                                            <li>today &rarr; <b>that day</b></li>
                                            <li>tomorrow &rarr; <b>the next day</b></li>
                                            <li>yesterday &rarr; <b>the day before</b></li>
                                            <li>now &rarr; <b>then</b></li>
                                        </ul>
                                    </div>
                                    <div className="bg-white border border-slate-200 p-4 rounded-xl">
                                        <ul className="space-y-2">
                                            <li>here &rarr; <b>there</b></li>
                                            <li>this / these &rarr; <b>that / those</b></li>
                                            <li>come &rarr; <b>go</b></li>
                                        </ul>
                                    </div>
                                </div>
                            </Point>
                        </Accordion>

                        <Accordion title="4. Tường thuật Câu hỏi & Đảo Ngữ (Mục 18-22)">
                            <Point num="18 - 20" title="Câu hỏi Yes/No (Dùng If/Whether)" isLast={false}>
                                <p className="mb-2"><b>Công thức:</b> ask + somebody + if/whether + S + V</p>
                                <ExampleBox>
                                    Direct: <i>"Are you tired?"</i><br/>
                                    Reported: <i>He asked me <b>if I was</b> tired.</i>
                                </ExampleBox>
                                <p className="text-rose-600 font-bold mt-2"><SvgCross /> CỰC KỲ QUAN TRỌNG: Tuyệt đối KHÔNG đảo ngữ trong câu tường thuật (Không dùng: <i>if was I tired</i>).</p>
                            </Point>

                            <Point num="21 & 22" title="Câu hỏi WH- (Giữ nguyên từ để hỏi)" isLast={true}>
                                <p className="mb-2"><b>Công thức:</b> ask + somebody + WH-word + S + V</p>
                                <p className="font-bold text-indigo-700">Tư duy: Bỏ mượn trợ động từ (do/does/did), động từ chính lùi thì bình thường.</p>
                                <ExampleBox>
                                    Direct: <i>"Where do you live?"</i><br/>
                                    Reported: <i>He asked me <b>where I lived</b>.</i>
                                </ExampleBox>
                            </Point>
                        </Accordion>

                        <Accordion title="5. Các Động từ Tường thuật Đặc biệt (Mục 13-15, 23-36)">
                            <Point num="13 - 15" title="SAY vs TELL" isLast={false}>
                                <ul className="space-y-2 text-[15px]">
                                    <li><Highlight color="primary">Say + (that) + Clause</Highlight>: <i>He said that...</i> (Không có tân ngữ "me/him").</li>
                                    <li><Highlight color="secondary">Tell + Somebody + (that)</Highlight>: <i>He told me that...</i> (TELL luôn cần người nghe).</li>
                                </ul>
                                <p className="text-rose-600 text-sm mt-2"><SvgCross /> Không dùng: <i>He said me that...</i> hoặc <i>He told that...</i></p>
                            </Point>

                            <Point num="23 - 36" title="Mệnh lệnh, Yêu cầu, Lời khuyên (Verb + TO-V)" isLast={true}>
                                <p className="mb-4">Rất nhiều động từ được theo sau bởi cấu trúc <b>to-V / not to-V</b> thay vì một mệnh đề (Noun Clause).</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-[15px]">
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-slate-800 mb-2">Động từ + sb + To-V</div>
                                        <ul className="space-y-1 text-slate-700">
                                            <li><b>tell / ask:</b> bảo/yêu cầu ai làm gì</li>
                                            <li><b>advise:</b> khuyên ai</li>
                                            <li><b>remind:</b> nhắc nhở ai</li>
                                            <li><b>warn:</b> cảnh báo ai (not to-V)</li>
                                        </ul>
                                    </div>
                                    <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                                        <div className="font-bold text-slate-800 mb-2">Động từ + To-V (Không cần sb)</div>
                                        <ul className="space-y-1 text-slate-700">
                                            <li><b>offer:</b> đề nghị giúp</li>
                                            <li><b>promise:</b> hứa</li>
                                            <li><b>refuse:</b> từ chối</li>
                                            <li><b>agree / threaten</b></li>
                                        </ul>
                                    </div>
                                </div>
                                <NoteBox type="warning">
                                    <b>Bẫy lớn với SUGGEST:</b><br/>
                                    Không dùng: <span className="line-through text-rose-500">He suggested me to go</span>.<br/>
                                    Đúng: <i>He suggested <b>going</b></i> HOẶC <i>He suggested <b>that I (should) go</b>.</i>
                                </NoteBox>
                            </Point>
                        </Accordion>
                    </div>

                    {/* Interactive Exercises (Tabs) */}
                    <div id="exercises" className="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-200 mb-12">
                        <div className="text-center mb-8">
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-3">Trạm Huấn Luyện (40 CÂU)</h2>
                            <p className="text-slate-600 font-medium">Click chọn đáp án để rèn luyện phản xạ (Checklist 7 giây).</p>
                        </div>

                        {/* Tabs Navigation */}
                        <div className="flex flex-wrap gap-2 mb-8 border-b border-slate-200 pb-4">
                            {[
                                { id: 0, title: "Chuyển câu", label: "Dạng 1" },
                                { id: 1, title: "Câu Hỏi", label: "Dạng 2" },
                                { id: 2, title: "Động từ đặc biệt", label: "Dạng 3" },
                                { id: 3, title: "Tìm Lỗi", label: "Dạng 4" }
                            ].map((tab, index) => (
                                <button 
                                    key={tab.id}
                                    onClick={() => setActiveTab(index)}
                                    className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all
                                    ${activeTab === index 
                                        ? 'bg-indigo-600 text-white shadow-md' 
                                        : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                                >
                                    {tab.label}: {tab.title}
                                </button>
                            ))}
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[400px]">
                            {activeTab === 0 && <ExTransform />}
                            {activeTab === 1 && <ExQuestions />}
                            {activeTab === 2 && <ExVerbs />}
                            {activeTab === 3 && <ExMistakes />}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
