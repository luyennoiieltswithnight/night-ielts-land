<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaFlow | Grammar: Gerunds & Infinitives</title>

    <!-- Google Fonts: Strictly Plus Jakarta Sans ONLY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            darker: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        body { 
            background-color: #f8fafc; 
            color: #1e293b; 
            line-height: 1.7;
        }
        
        /* Dark pattern background mimicking the image */
        .hero-pattern {
            background-color: #0f172a;
            background-image: linear-gradient(30deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b), linear-gradient(150deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b), linear-gradient(30deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b), linear-gradient(150deg, #1e293b 12%, transparent 12.5%, transparent 87%, #1e293b 87.5%, #1e293b), linear-gradient(60deg, #1e293b77 25%, transparent 25.5%, transparent 75%, #1e293b77 75%, #1e293b77), linear-gradient(60deg, #1e293b77 25%, transparent 25.5%, transparent 75%, #1e293b77 75%, #1e293b77);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .yellow-badge {
            background-color: #fef3c7;
            color: #92400e;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-weight: 700;
            font-size: 0.875rem;
            display: inline-block;
            margin: 0.25rem;
        }

        .content-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="antialiased selection:bg-purple-500 selection:text-white pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- COMPONENTS ---

        const SectionGradientHeader = ({ title, icon }) => (
            <div className="bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-2xl p-5 mb-6 text-white shadow-lg flex items-center gap-4">
                <i className={`fas ${icon} text-2xl opacity-90`}></i>
                <h2 className="text-2xl font-extrabold tracking-wide uppercase">{title}</h2>
            </div>
        );

        const Tag = ({ children }) => <span className="yellow-badge">{children}</span>;

        const Correct = () => <span className="text-emerald-500 font-bold mx-1">✅</span>;
        const Incorrect = () => <span className="text-rose-500 font-bold mx-1">❌</span>;

        const ExampleRow = ({ wrong, right }) => (
            <div className="bg-white rounded-lg p-3 border border-slate-200 shadow-sm my-2 font-medium">
                {wrong && <div className="text-slate-500 line-through"><Incorrect /> {wrong}</div>}
                {right && <div className="text-slate-800"><Correct /> {right}</div>}
            </div>
        );

        // --- EXERCISE COMPONENTS ---

        const ExFillBlank = () => {
            const [showAns, setShowAns] = useState(false);
            const questions = [
                { q: "________ early in the morning is a good habit.", v: "wake up", ans: "Waking up", context: "" },
                { q: "Michael enjoys ________ football with his friends.", v: "play", ans: "playing", context: "" },
                { q: "Kim Phụng decided ________ abroad.", v: "study", ans: "to study", context: "" },
                { q: "He avoids ________ too much coffee.", v: "drink", ans: "drinking", context: "" },
                { q: "Peter's goal is ________ IELTS 7.5.", v: "get", ans: "to get", context: "" },
                { q: "They suggested ________ by train.", v: "go", ans: "going", context: "" },
                { q: "I hope ________ you again soon.", v: "see", ans: "to see", context: "" },
                { q: "She is interested in ________ Chinese.", v: "learn", ans: "learning", context: "" },
                { q: "Gia Hưng promised ________ me.", v: "help", ans: "to help", context: "" },
                { q: "I don’t mind ________ here.", v: "wait", ans: "waiting", context: "" }
            ];

            return (
                <div className="content-box">
                    <div className="flex items-center justify-between mb-4 border-b border-slate-200 pb-3">
                        <h3 className="text-lg font-bold text-purple-700"><span className="bg-purple-100 text-purple-700 w-8 h-8 inline-flex items-center justify-center rounded-full mr-2">1</span> Chọn V-ing hay To-V</h3>
                        <button onClick={() => setShowAns(!showAns)} className="text-sm font-bold bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg transition-colors">
                            {showAns ? "Ẩn đáp án" : "Xem đáp án"}
                        </button>
                    </div>
                    <div className="space-y-3">
                        {questions.map((item, idx) => (
                            <div key={idx} className="flex flex-wrap items-center gap-2 text-[15px]">
                                <span className="font-bold text-slate-400">{idx + 1}.</span>
                                <span>{item.q.split("________")[0]}</span>
                                {showAns ? (
                                    <span className="font-bold text-emerald-600 border-b-2 border-emerald-500 px-2">{item.ans}</span>
                                ) : (
                                    <span className="font-bold text-purple-500 border-b-2 border-purple-300 px-2">({item.v})</span>
                                )}
                                <span>{item.q.split("________")[1]}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ExExplain = () => {
            const [active, setActive] = useState(null);
            const items = [
                { id: 1, s: "Huy enjoys reading books.", exp: "'enjoy' + V-ing: diễn tả sở thích/trải nghiệm." },
                { id: 2, s: "Kim Phụng wants to become a doctor.", exp: "'want' + to-V: chỉ mục tiêu, mong muốn chưa xảy ra." },
                { id: 3, s: "They are good at playing football.", exp: "Sau giới từ 'at' bắt buộc dùng V-ing." },
                { id: 4, s: "Michael decided to stay home.", exp: "'decide' + to-V: sự lựa chọn, quyết định hướng tới tương lai." },
                { id: 5, s: "She suggested leaving earlier.", exp: "'suggest' + V-ing: đề xuất một hành động/ý tưởng." },
                { id: 6, s: "Peter's dream is to study abroad.", exp: "To-V làm Bổ ngữ (Complement) giải thích nội dung cho 'dream'." },
                { id: 7, s: "Exercising regularly is important.", exp: "V-ing làm Chủ ngữ chỉ một sự thật/hoạt động nói chung." },
                { id: 8, s: "I went to the gym to stay fit.", exp: "To-V chỉ mục đích (Purpose) - để làm gì." }
            ];

            return (
                <div className="content-box">
                    <h3 className="text-lg font-bold text-purple-700 mb-4 border-b border-slate-200 pb-3"><span className="bg-purple-100 text-purple-700 w-8 h-8 inline-flex items-center justify-center rounded-full mr-2">2</span> Đừng chỉ điền, hãy giải thích WHY?</h3>
                    <p className="text-sm text-slate-500 mb-4">Click vào từng câu để xem giải thích chức năng của từ.</p>
                    <div className="space-y-2">
                        {items.map(item => (
                            <div key={item.id} className="border border-slate-200 rounded-lg overflow-hidden">
                                <button onClick={() => setActive(active === item.id ? null : item.id)} className="w-full text-left px-4 py-3 bg-white hover:bg-slate-50 font-medium flex justify-between items-center">
                                    <span>{item.s}</span>
                                    <i className={`fas fa-chevron-down text-slate-400 transition-transform ${active === item.id ? 'rotate-180' : ''}`}></i>
                                </button>
                                {active === item.id && (
                                    <div className="px-4 py-3 bg-purple-50 text-purple-900 border-t border-slate-200 text-sm font-medium">
                                        <i className="fas fa-lightbulb text-amber-500 mr-2"></i> {item.exp}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ExChallenge = () => {
            const [showAns, setShowAns] = useState(false);
            const challenges = [
                { wrong: "I enjoy to play football.", right: "I enjoy playing football." },
                { wrong: "Gia Hưng decided studying abroad.", right: "Gia Hưng decided to study abroad." },
                { wrong: "I’m interested in learn English.", right: "I’m interested in learning English." },
                { wrong: "He suggested to go home.", right: "He suggested going home." },
                { wrong: "I look forward to meet you.", right: "I look forward to meeting you." },
                { wrong: "She made me to laugh.", right: "She made me laugh." },
                { wrong: "To waking up early is healthy.", right: "Waking up early is healthy." }
            ];

            return (
                <div className="content-box">
                    <div className="flex items-center justify-between mb-4 border-b border-slate-200 pb-3">
                        <h3 className="text-lg font-bold text-purple-700"><span className="bg-purple-100 text-purple-700 w-8 h-8 inline-flex items-center justify-center rounded-full mr-2">3</span> Mini Challenge: Sửa lỗi sai</h3>
                        <button onClick={() => setShowAns(!showAns)} className="text-sm font-bold bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg transition-colors">
                            {showAns ? "Ẩn đáp án" : "Xem đáp án"}
                        </button>
                    </div>
                    <div className="space-y-3">
                        {challenges.map((c, i) => (
                            <div key={i} className="bg-white p-3 border border-slate-200 rounded-lg">
                                <div className="text-slate-500 line-through font-medium mb-1"><Incorrect /> {c.wrong}</div>
                                {showAns && <div className="text-emerald-700 font-bold bg-emerald-50 p-2 rounded"><Correct /> {c.right}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ---

        const App = () => {
            return (
                <div className="min-h-screen">
                    
                    {/* Hero Section (Dark Pattern) */}
                    <div className="hero-pattern pt-20 pb-32 px-4 text-center">
                        <div className="inline-block border border-slate-600 text-slate-300 rounded-full px-5 py-1.5 text-xs font-bold tracking-[0.2em] mb-6">
                            VOCAFLOW GRAMMAR HUB
                        </div>
                        <h1 className="text-4xl md:text-6xl font-extrabold text-white mb-4 tracking-tight">
                            Gerunds & <span className="bg-gradient-to-r from-amber-300 via-rose-400 to-fuchsia-400 text-transparent bg-clip-text">Infinitive Phrases</span>
                        </h1>
                        <p className="text-slate-400 text-lg md:text-xl font-medium">
                            Khi Động từ "hóa thân" thành Danh từ. Hiểu sâu bản chất, nói không với học vẹt!
                        </p>
                    </div>

                    {/* Main Content Container */}
                    <div className="max-w-4xl mx-auto bg-white rounded-[2rem] shadow-2xl p-4 md:p-8 mt-[-4rem] relative z-10 mx-4 md:mx-auto">
                        
                        {/* 0. TẠI SAO ĐỘNG TỪ LẠI “HÓA” THÀNH DANH TỪ? */}
                        <SectionGradientHeader title="1. Bản chất: Tại sao phải hóa Danh Từ?" icon="fa-seedling" />
                        <div className="content-box">
                            <p className="mb-4">Hãy nhìn hai câu sau:</p>
                            <div className="bg-slate-100 p-4 rounded-lg font-mono text-sm mb-4 border border-slate-200">
                                <div><b className="text-blue-600">I study English every day.</b></div>
                                <div className="text-slate-500 mt-1">→ <b>study</b> = động từ (mô tả hành động).</div>
                            </div>
                            <p className="mb-4">Nhưng nếu bạn muốn nói: <i>"Việc học tiếng Anh rất quan trọng."</i> Thì bạn đang nói về <b>"việc học tiếng Anh"</b> như một sự vật/khái niệm.</p>
                            <ExampleRow wrong="Study English is very important." />
                            <p className="mt-4">Bởi vì <b>study</b> vẫn đang ở dạng động từ nguyên mẫu. Ta cần biến cả hành động thành một thứ có thể đứng ở vị trí của danh từ. Có hai cách: <b>V-ing</b> và <b>to + V</b>.</p>
                        </div>

                        {/* 1. V-ING LÀM DANH TỪ: GERUND */}
                        <SectionGradientHeader title="2. V-ing làm Danh từ (Gerund)" icon="fa-history" />
                        <div className="content-box">
                            <p className="mb-4">Khi V-ing đóng vai trò như một danh từ, ta gọi nó là <b>GERUND (Danh động từ)</b>.</p>
                            <ExampleRow right="Learning English is very important." />
                            <p className="text-sm text-slate-500 mb-6">Ở đây: <i>learning = học</i>, nhưng cả cụm <i>Learning English = việc học tiếng Anh</i>. Nó đang đứng ở vị trí Chủ ngữ (Subject).</p>
                            
                            <h3 className="font-bold text-lg text-slate-800 mb-2 border-b border-slate-200 pb-2"><i className="fas fa-exclamation-triangle text-amber-500 mr-2"></i> Đừng nhầm "V-ing" với "Đang..."</h3>
                            <ul className="space-y-3 mb-6">
                                <li><b>She is studying English.</b> → <i>is studying = đang học (Present Continuous).</i></li>
                                <li><b>Studying English is important.</b> → <i>Studying English = việc học (Gerund).</i></li>
                            </ul>
                            <div className="bg-amber-50 text-amber-800 p-3 rounded-lg border border-amber-200 text-sm font-bold">
                                V-ing không phải lúc nào cũng có nghĩa là “đang…”. Phải nhìn FUNCTION (Chức năng) của nó trong câu!
                            </div>
                        </div>

                        {/* CÁC VỊ TRÍ CỦA V-ING */}
                        <div className="content-box">
                            <h3 className="font-bold text-lg text-purple-700 mb-3"><i className="fas fa-map-pin mr-2"></i> Vị trí của Gerund</h3>
                            
                            <div className="mb-6">
                                <h4 className="font-bold text-slate-800 mb-2">A. Làm Chủ Ngữ (Subject)</h4>
                                <div className="space-y-1 text-slate-700">
                                    <div><Correct/> <u className="font-bold">Reading</u> is useful.</div>
                                    <div><Correct/> <u className="font-bold">Learning English every day</u> is important. <i>(Cụm Gerund có thể rất dài)</i></div>
                                </div>
                            </div>

                            <div className="mb-6">
                                <h4 className="font-bold text-slate-800 mb-2">B. Làm Tân Ngữ (Object)</h4>
                                <p className="text-sm text-slate-600 mb-3">Một số động từ <b>BẮT BUỘC</b> yêu cầu phía sau là V-ing:</p>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                                    <div className="font-bold text-slate-500 text-xs tracking-wider mb-2 uppercase">Các Verb quan trọng + V-ing</div>
                                    <Tag>enjoy</Tag> <Tag>avoid</Tag> <Tag>finish</Tag> <Tag>suggest</Tag> <Tag>consider</Tag> <Tag>mind</Tag> <Tag>admit</Tag> <Tag>deny</Tag> <Tag>risk</Tag> <Tag>practice</Tag> <Tag>keep</Tag>
                                </div>
                                <div className="space-y-1 text-slate-700">
                                    <div><Correct/> I <b className="text-purple-600">enjoy</b> reading. <span className="text-slate-400 text-sm italic">(Không dùng: I enjoy to read)</span></div>
                                    <div><Correct/> She <b className="text-purple-600">avoids</b> eating late at night.</div>
                                </div>
                            </div>

                            <div>
                                <h4 className="font-bold text-slate-800 mb-2">C. Sau Giới Từ (Preposition)</h4>
                                <div className="bg-rose-50 text-rose-800 p-3 rounded-lg border border-rose-200 text-sm font-bold mb-3">
                                    Nguyên tắc sống còn: Preposition + V-ing (KHÔNG BAO GIỜ dùng to-V)
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                                    <Tag>be interested in</Tag> <Tag>be good at</Tag> <Tag>look forward to</Tag> <Tag>object to</Tag> <Tag>apologize for</Tag> <Tag>succeed in</Tag>
                                </div>
                                <p className="text-sm text-slate-500"><i className="fas fa-lightbulb text-amber-500 mr-1"></i> <b>Bẫy cực lớn:</b> Chữ "to" trong "look forward to" là Giới từ, không phải Infinitive marker. Nên phải là <b>look forward to meeting</b>!</p>
                            </div>
                        </div>

                        {/* 7. TO-V LÀM DANH TỪ */}
                        <SectionGradientHeader title="3. To-V làm Danh Từ (Infinitive)" icon="fa-rocket" />
                        <div className="content-box">
                            <p className="mb-4">To-V cũng có thể đóng vai trò như một Noun Phrase.</p>
                            <ExampleRow right="To learn English is important." />
                            <p className="mb-4 mt-2">Tuy nhiên, trong văn phong hiện đại, <b>V-ing</b> làm Chủ ngữ nghe tự nhiên hơn. Nếu dùng To-V, người ta thường dùng chủ ngữ giả <b>"It"</b>:</p>
                            <ExampleRow right="It is important to learn English." />

                            <h3 className="font-bold text-lg text-slate-800 mt-6 mb-2 border-b border-slate-200 pb-2"><i className="fas fa-bullseye text-red-500 mr-2"></i> To-V để nói về Mục Đích</h3>
                            <p className="mb-3">Đây là chỗ rất dễ nhầm. To-V không phải lúc nào cũng là Danh từ.</p>
                            <div className="bg-slate-100 p-4 rounded-lg border border-slate-200 mb-4">
                                <span className="font-bold">I went to the library <u className="text-blue-600">to study</u>.</span>
                                <div className="text-slate-600 text-sm mt-1">Ở đây <b>to study</b> trả lời câu hỏi <i>Why? (Purpose = để học)</i>. Nó không phải danh từ.</div>
                            </div>
                        </div>

                        <div className="content-box">
                            <h3 className="font-bold text-lg text-purple-700 mb-3"><i className="fas fa-list-check mr-2"></i> Các nhóm động từ đi với To-V</h3>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                                <div className="font-bold text-slate-500 text-xs tracking-wider mb-2 uppercase">Nhóm Verb + To-V</div>
                                <Tag>want</Tag> <Tag>need</Tag> <Tag>hope</Tag> <Tag>plan</Tag> <Tag>decide</Tag> <Tag>promise</Tag> <Tag>agree</Tag> <Tag>refuse</Tag> <Tag>manage</Tag> <Tag>expect</Tag>
                            </div>
                            
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4 mt-4">
                                <div className="font-bold text-slate-500 text-xs tracking-wider mb-2 uppercase">Nhóm Verb + Object + To-V</div>
                                <Tag>want you to</Tag> <Tag>tell him to</Tag> <Tag>allow me to</Tag> <Tag>encourage</Tag> <Tag>advise</Tag> <Tag>remind</Tag>
                            </div>
                            
                            <div className="bg-rose-50 p-4 rounded-xl border border-rose-200 shadow-sm mt-4">
                                <div className="font-bold text-rose-700 text-xs tracking-wider mb-2 uppercase">Đặc biệt: Verb + Object + V-bare (KHÔNG TO)</div>
                                <div><Correct/> She <b className="text-rose-600">made me laugh</b>. <ExampleRow wrong="She made me to laugh."/></div>
                                <div className="mt-2"><Correct/> My teacher <b className="text-rose-600">let me go</b>.</div>
                            </div>
                        </div>

                        {/* ĐỘNG TỪ HAI MẶT */}
                        <SectionGradientHeader title="4. Những động từ 'Hai mặt'" icon="fa-masks-theater" />
                        <div className="content-box">
                            <p className="mb-4">Có những verb mà việc đổi V-ing / To-V làm <b>thay đổi hoàn toàn ý nghĩa</b>.</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                                    <div className="text-xl font-black text-slate-800 mb-2 tracking-wide uppercase">Remember</div>
                                    <div className="mb-2">
                                        <b className="text-purple-600">+ V-ing:</b> Nhớ lại một trải nghiệm trong quá khứ.<br/>
                                        <span className="text-sm text-slate-500">I remember meeting him. (Nhớ là đã gặp)</span>
                                    </div>
                                    <hr className="my-2 border-slate-100"/>
                                    <div>
                                        <b className="text-blue-600">+ To-V:</b> Nhớ thực hiện một việc cần làm.<br/>
                                        <span className="text-sm text-slate-500">Remember to call me. (Nhớ gọi nhé)</span>
                                    </div>
                                </div>

                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                                    <div className="text-xl font-black text-slate-800 mb-2 tracking-wide uppercase">Stop</div>
                                    <div className="mb-2">
                                        <b className="text-purple-600">+ V-ing:</b> Ngừng hẳn việc đang làm.<br/>
                                        <span className="text-sm text-slate-500">He stopped smoking. (Bỏ hút thuốc)</span>
                                    </div>
                                    <hr className="my-2 border-slate-100"/>
                                    <div>
                                        <b className="text-blue-600">+ To-V:</b> Dừng lại ĐỂ làm việc khác.<br/>
                                        <span className="text-sm text-slate-500">He stopped to smoke. (Dừng lại để lấy thuốc hút)</span>
                                    </div>
                                </div>

                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                                    <div className="text-xl font-black text-slate-800 mb-2 tracking-wide uppercase">Try</div>
                                    <div className="mb-2">
                                        <b className="text-purple-600">+ V-ing:</b> Thử một phương pháp.<br/>
                                        <span className="text-sm text-slate-500">Try using this approach.</span>
                                    </div>
                                    <hr className="my-2 border-slate-100"/>
                                    <div>
                                        <b className="text-blue-600">+ To-V:</b> Cố gắng làm.<br/>
                                        <span className="text-sm text-slate-500">Try to understand the question.</span>
                                    </div>
                                </div>
                                
                                <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                                    <div className="text-xl font-black text-slate-800 mb-2 tracking-wide uppercase">Regret</div>
                                    <div className="mb-2">
                                        <b className="text-purple-600">+ V-ing:</b> Hối tiếc vì ĐÃ làm.<br/>
                                        <span className="text-sm text-slate-500">I regret saying that.</span>
                                    </div>
                                    <hr className="my-2 border-slate-100"/>
                                    <div>
                                        <b className="text-blue-600">+ To-V:</b> Rất tiếc PHẢI (thông báo/làm gì).<br/>
                                        <span className="text-sm text-slate-500">We regret to inform you that...</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* TỔNG KẾT */}
                        <div className="bg-slate-800 text-white p-6 rounded-2xl shadow-xl mb-8 border border-slate-700">
                            <h3 className="text-xl font-bold text-amber-400 mb-4"><i className="fas fa-fire mr-2"></i> FINAL TAKEAWAY</h3>
                            <p className="mb-4 text-slate-200">Để chọn đúng, đừng chỉ hỏi <i>"V-ing hay To-V?"</i>. Hãy tự hỏi 5 câu này:</p>
                            <ul className="space-y-2 font-medium text-slate-300">
                                <li><i className="fas fa-check text-emerald-400 mr-2"></i> Nó đang làm chức năng gì (Subject, Object, Purpose...)?</li>
                                <li><i className="fas fa-check text-emerald-400 mr-2"></i> Động từ đứng trước yêu cầu pattern gì?</li>
                                <li><i className="fas fa-check text-emerald-400 mr-2"></i> Có Giới từ (preposition) phía trước không?</li>
                                <li><i className="fas fa-check text-emerald-400 mr-2"></i> Ý nghĩa là hoạt động chung chung, hay một dự định/mục tiêu?</li>
                            </ul>
                        </div>

                        {/* BÀI TẬP */}
                        <SectionGradientHeader title="5. Trạm Huấn Luyện (Practice)" icon="fa-dumbbell" />
                        <ExFillBlank />
                        <ExExplain />
                        <ExChallenge />
                        
                        <div className="text-center mt-12 mb-4 text-slate-400 font-bold text-sm tracking-widest uppercase">
                            Designed for VocaFlow Students
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
