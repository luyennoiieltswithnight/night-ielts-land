        // ==========================================
        class GlobalErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error: error.message }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-10 text-center">
                            <h1 className="text-2xl font-bold text-red-600 mb-4">Lỗi hiển thị nội dung!</h1>
                            <p className="text-slate-700 bg-red-50 p-4 rounded-xl border border-red-200 inline-block font-mono text-sm">{this.state.error}</p>
                            <button className="block mx-auto mt-4 px-4 py-2 bg-slate-800 text-white rounded-lg" onClick={() => window.location.reload()}>Tải lại trang</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ==========================================
        // 2. EXERCISE DATA ENGINE (BỘ BÀI TẬP)
        // ==========================================
        const quizData = {
            "np-forms-lesson": {
                ex1: [
                    { q: "Điền vào chỗ trống: '______ early in the morning is a good habit.'", o: ["To waking up", "Waking up", "Wake up"], a: "Waking up", e: "Khi muốn diễn tả một thói quen, một sự thật hiển nhiên làm Chủ ngữ, ta ưu tiên dùng V-ing (Danh động từ)." },
                    { q: "Xác định vai trò của cụm trong ngoặc: 'My main goal is [to pass the IELTS exam].'", o: ["Chủ ngữ (Subject)", "Bổ ngữ (Complement)", "Tân ngữ (Object)"], a: "Bổ ngữ (Complement)", e: "Cụm 'to pass...' đứng sau to-be 'is' để giải thích cho Chủ ngữ (my main goal). Nó là Bổ ngữ cho Chủ ngữ." },

                    { q: "Điền vào chỗ trống: 'Alex gave up ______ junk food.'", o: ["to eat", "eating", "eat"], a: "eating", e: "Sau giới từ 'up' (trong phrasal verb give up), động từ BẮT BUỘC phải ở dạng V-ing." }

            "head-noun-lesson": {

                    { q: "Tìm Head Noun trong cụm sau: 'The beautiful development of the city.'", o: ["beautiful", "development", "city"], a: "development", e: "Mẹo: Tìm từ nằm NGAY TRƯỚC giới từ đầu tiên ('of'). Đó chính là 'development'." },

            },
            "singular-lesson": {
                ex1: [

                    { q: "Khi nhắc đến 'Mặt trời', ta dùng mạo từ nào?", o: ["a sun", "an sun", "the sun"], a: "the sun", e: "Mặt trời là thực thể duy nhất trong vũ trụ của chúng ta, luôn luôn dùng 'the'." },

                ex2: [

            },
            "plural-lesson": {

                ],
                ex2: [
                    { q: "Danh từ số nhiều của 'child' là:", o: ["childs", "children", "childrens"], a: "children", e: "Children bản thân nó đã là số nhiều, tuyệt đối không thêm -s thành childrens." },
                    { q: "Tìm từ CÓ dạng số ít và số nhiều GIỐNG NHAU:", o: ["foot", "sheep", "person"], a: "sheep", e: "Một số loài vật (sheep, deer, fish) có số ít và số nhiều y hệt nhau." }
                ]
            },

                ex1: [
                    { q: "Làm thế nào để đếm từ 'bread' (bánh mì)?", o: ["a bread", "a loaf of bread", "a piece of breads"], a: "a loaf of bread", e: "Bread không đếm được. Để chỉ 1 ổ bánh mì, ta dùng lượng từ 'a loaf of'." },
                    { q: "Muốn đếm 'rice' (gạo), ta dùng cụm từ nào?", o: ["a grain of rice", "a drop of rice", "a slice of rice"], a: "a grain of rice", e: "Rice là hạt. Đơn vị đếm hạt là 'grain' (một hạt gạo)." },
                    { q: "Từ 'money' (tiền) là đếm được hay không đếm được?", o: ["Đếm được", "Không đếm được"], a: "Không đếm được", e: "Bản thân chữ 'money' là khái niệm trừu tượng (U). Ta chỉ đếm được ĐƠN VỊ TIỀN TỆ (1 dollar, 2 VND)." }
                ],
                ex2: [
                    { q: "Câu nào ĐÚNG ngữ pháp?", o: ["Alex gave me a good advice.", "Alex gave me a piece of good advice."], a: "Alex gave me a piece of good advice.", e: "Advice (lời khuyên) không đếm được. Không dùng 'a' hay thêm '-s'. Phải dùng 'a piece of'." },
                    { q: "Tìm lỗi sai: 'I need to buy some equipments.'", o: ["Sai chữ 'some'", "Sai chữ 'equipments'"], a: "Sai chữ 'equipments'", e: "Equipment (trang thiết bị) là danh từ không đếm được, tuyệt đối không thêm '-s'." }
                ]
            },
            "compound-lesson": {
                ex1: [
                    { q: "Từ nào viết ĐÚNG danh từ số nhiều của 'bus stop'?", o: ["buses stop", "bus stops", "buses stops"], a: "bus stops", e: "Trong danh từ ghép, từ cuối cùng (stop) là Head Noun, do đó ta chỉ thêm -s vào từ cuối cùng." },

            "prep-lesson": {

                    { q: "Cụm nào chỉ 'Chàng trai đeo kính'?", o: ["The boy with glasses", "The boy in glasses"], a: "The boy with glasses", e: "'With' mang nghĩa sở hữu/có mang theo vật thể trên người (đeo kính, cầm dù)." }
                ],
                ex2: [

                    { q: "Chữ 'O' đầu tiên trong OSASCOMP là gì?", o: ["Origin", "Opinion", "Old"], a: "Opinion", e: "Opinion (Quan điểm cá nhân: đẹp, xấu, tốt...) luôn được ưu tiên đứng đầu tiên." }
                ],
                ex2: [
                    { q: "Xếp đúng: 'A / leather / black / jacket'", o: ["A black leather jacket", "A leather black jacket"], a: "A black leather jacket", e: "Color (black) đứng trước Material (leather)." },

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200"><Highlight color="green">of</Highlight><br/>Thuộc về.</div>
                </div>
                <MultiQuiz questions={getQuiz("prep-lesson", "ex1")} />
                <MultiQuiz questions={getQuiz("prep-lesson", "ex2")} />
            </div>
        );

        const LessonAdjectives = () => (
            <div className="lesson-content animate-fade-in pb-10">
                <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Trật Tự Tính Từ OSASCOMP</h2>
                <div className="bg-brand-50 border-2 border-brand-300 p-6 rounded-3xl text-center mb-8 shadow-sm">
                    <p className="font-black text-2xl text-brand-700 mb-2">Ông Sáu Ăn Súp Cua Ông Mập Phì</p>
                    <p className="text-sm text-slate-600 font-bold tracking-widest">O - S - A - S - C - O - M - P</p>
                </div>
                <UIBox color="purple">
                    <ul className="space-y-2 text-sm">
                        <li><strong className="text-purple-700">O (Ông) = Opinion:</strong> Quan điểm (beautiful). <em>*Đứng đầu tiên!</em></li>
                        <li><strong className="text-purple-700">S (Sáu) = Size:</strong> Kích thước (big).</li>
                        <li><strong className="text-purple-700">A (Ăn) = Age:</strong> Tuổi (old).</li>
                        <li><strong className="text-purple-700">S (Súp) = Shape:</strong> Hình dáng (round).</li>
                        <li><strong className="text-purple-700">C (Cua) = Color:</strong> Màu (red).</li>
                        <li><strong className="text-purple-700">O (Ông) = Origin:</strong> Nguồn gốc (Vietnamese).</li>
                        <li><strong className="text-purple-700">M (Mập) = Material:</strong> Chất liệu (wooden).</li>
                        <li><strong className="text-purple-700">P (Phì) = Purpose:</strong> Mục đích (swimming).</li>
                    </ul>
                </UIBox>
                <MultiQuiz questions={getQuiz("adjectives-lesson", "ex1")} />
                <MultiQuiz questions={getQuiz("adjectives-lesson", "ex2")} />
            </div>
        );

        const LessonRelativeClause = () => (
            <div className="lesson-content animate-fade-in pb-10">
                <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Mệnh Đề Quan Hệ (MĐQH)</h2>
                
                <UIBox color="amber" title="1. Phân tích bản chất sâu sắc">
                    <p className="mb-4">Hãy quan sát cách câu tiếng Việt hoạt động để hiểu bản chất MĐQH.</p>
                    <div className="bg-white border-2 border-dashed border-amber-300 p-4 rounded-xl text-center mb-4">
                        <span className="font-bold">"<Highlight color="amber">Quán nước có bảng hiệu màu xanh</Highlight> là Phúc Long."</span>
                    </div>
                    <ul className="space-y-2 text-sm">
                        <li>👉 <strong>Động từ chính:</strong> Từ "là".</li>
                        <li>👉 <strong>Chủ ngữ:</strong> Cả cụm <em>"Quán nước có bảng hiệu màu xanh"</em>.</li>
                        <li>👉 <strong>Head Noun:</strong> Từ <em>"Quán nước"</em>.</li>
                        <li>👉 <strong>Hậu bổ nghĩa:</strong> Phần <em>"có bảng hiệu màu xanh"</em> tự thân nó là một mệnh đề (có động từ 'có'). Nó đứng đó làm nhiệm vụ như một <strong>Tính Từ</strong> miêu tả cho quán nước. ➔ Gọi là <strong>Mệnh đề tính ngữ</strong>.</li>
                    </ul>
                </UIBox>

                <UIBox color="blue" title="2. Đại Từ vs Trạng Từ Quan Hệ">
                    <div className="space-y-4 text-sm">
                        <div><strong className="text-blue-700">A. Đại từ (Who, Which, That, Whose):</strong> Làm S hoặc O trong mệnh đề. Phía sau nó có thể thiếu S hoặc thiếu O.</div>
                        <div><strong className="text-green-700">B. Trạng từ (Where, When, Why):</strong> Phía sau nó <strong className="text-red-500">BẮT BUỘC</strong> phải là mệnh đề đủ (đã có S + V).</div>
                        <div className="bg-green-50 p-2 rounded text-center font-bold">Mẹo: Where = In/On/At + Which</div>
                    </div>
                </UIBox>

                <UIBox color="rose" title="3. Rút gọn MĐQH">
                    - <strong>Chủ động:</strong> Đưa về <strong>V-ing</strong>. <em>(The boy standing there)</em>
                    <br/>- <strong>Bị động:</strong> Đưa về <strong>V3/ed</strong>. <em>(The car made in Japan)</em>
                </UIBox>

                <MultiQuiz questions={getQuiz("relative-clauses-lesson", "ex1")} />
                <MultiQuiz questions={getQuiz("relative-clauses-lesson", "ex2")} />
            </div>
        );

        const LessonNounClause = () => (
            <div className="lesson-content animate-fade-in pb-10">
                <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Mệnh Đề Danh Từ</h2>
                <UIBox color="teal" title="Khái niệm & Tuyệt chiêu nhận diện">
                    <p className="mb-2">Mệnh đề danh từ là một câu hoàn chỉnh bị "bắt cóc" để làm danh từ.</p>
                    <div className="bg-teal-100 p-2 rounded-lg text-teal-900 text-center font-bold">Mẹo thử nghiệm "IT"</div>
                    <p className="text-sm mt-2">Thay toàn bộ mệnh đề bằng chữ <strong>IT</strong>. Nếu câu có nghĩa, đó là Noun Clause. <br/>Vd: I don't know [where he lives] ➔ I don't know IT.</p>
                </UIBox>
                <div className="space-y-4 mb-6">
                    <div className="bg-white p-4 rounded-xl border-l-4 border-l-rose-500 shadow-sm">
                        <p className="font-bold text-rose-700 mb-1">1. That + S + V</p>
                        <Example eng="David believes [that the team will win]." vie="David tin [rằng đội bóng sẽ thắng]." />
                    </div>
                    <div className="bg-white p-4 rounded-xl border-l-4 border-l-orange-500 shadow-sm">
                        <p className="font-bold text-orange-700 mb-1">2. Wh-word + S + V</p>
                        <Example eng="He doesn't know [where she went]." vie="Tuyệt đối không đảo ngữ." />
                    </div>
                    <div className="bg-white p-4 rounded-xl border-l-4 border-l-green-500 shadow-sm">
                        <p className="font-bold text-green-700 mb-1">3. If / Whether + S + V (Dùng cho Yes/No)</p>
                        <Example eng="I wonder [if it will rain]." vie="Tôi tự hỏi [liệu trời có mưa không]." />
                    </div>
                </div>
                <MultiQuiz questions={getQuiz("noun-clauses-lesson", "ex1")} />
            </div>
        );

        const LessonReportedSpeech = () => (
            <div className="lesson-content animate-fade-in pb-10">
                <h2 className="text-3xl font-extrabold text-slate-800 mb-2">Câu Tường Thuật</h2>
                <UIBox color="blue" title="Bản chất">
                    Ứng dụng lớn nhất của Mệnh đề danh từ. Khi tường thuật, ta áp dụng luật <strong className="text-red-600">LÙI THÌ</strong> và đổi đại từ.
                </UIBox>
                <div className="space-y-4 mb-6">
                    <div className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-blue-500">
                        <p className="font-bold text-slate-800">1. Lùi Thì</p>
                        <Example eng="He said, 'I am tired.'" vie="➔ He said (that) he was tired." />
                    </div>
                    <div className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-amber-500">
                        <p className="font-bold text-slate-800">2. Đổi thời gian</p>
                        <Example eng="Alex said, 'I will do it tomorrow.'" vie="➔ Alex said (that) he would do it the next day." />
                    </div>
                </div>
                <MultiQuiz questions={getQuiz("reported-speech-lesson", "ex1")} />
            </div>
        );

        // ==========================================
        // 5. CẤU TRÚC VẼ SƠ ĐỒ (TREENODE ĐÃ ĐƯỢC PHỤC HỒI)
        // ==========================================

        const TreeNode = ({ nodeId, expandedNodes, toggleNode, openLesson }) => {
            const node = graphData[nodeId];
            if(!node) return null;
            
            const isExpanded = expandedNodes.has(nodeId);
            const hasChildren = node.children && node.children.length > 0;

            return (
                <div className="tree-node group/node">
                    <div className="relative z-10 flex items-center gap-3 bg-white/95 backdrop-blur px-5 py-4 rounded-2xl shadow-node border border-slate-200 hover:border-brand-400 hover:shadow-node-hover transition-all duration-300 min-w-[280px]">
                        
                        {hasChildren ? (
                            <button onClick={() => toggleNode(nodeId)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-brand-500 hover:text-white font-bold transition-colors shrink-0">
                                {isExpanded ? '−' : '+'}
                            </button>
                        ) : (
                            <div className="w-8 h-8 rounded-full bg-slate-50 border border-slate-100 shrink-0"></div>
                        )}
                        
                        <div className="flex-1 cursor-default">
                            {node.subtitle && <span className="text-[10px] font-bold text-brand-500 uppercase tracking-widest block mb-1">{node.subtitle}</span>}
                            <h3 className="text-sm font-bold text-slate-800 leading-tight">{node.title}</h3>
                        </div>

                        {node.hasLesson && (
                            <button onClick={() => openLesson(node.lessonId)} className="ml-2 px-4 py-2 bg-slate-800 text-white text-xs font-bold rounded-xl hover:bg-brand-600 transition-colors shadow-sm shrink-0">
                                Học
                            </button>
                        )}
                    </div>

                    {isExpanded && hasChildren && (
                        <div className="children-container">
                            {node.children.map(childId => (
                                <div key={childId} className="child-wrapper">
                                    <TreeNode nodeId={childId} expandedNodes={expandedNodes} toggleNode={toggleNode} openLesson={openLesson} />
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 6. MAIN APP CỦA CHÚNG TA ĐÂY
        // ==========================================

        const App = () => {
            const [expandedNodes, setExpandedNodes] = useState(new Set(["noun-phrase", "head-noun", "pre-modifier", "post-modifier", "simple-noun", "relative-clauses", "noun-clauses"]));
            const [activeLesson, setActiveLesson] = useState(null);
            
            const canvasRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [pos, setPos] = useState({ top: 0, left: 0, x: 0, y: 0 });

            useEffect(() => {
                if(canvasRef.current) {
                    canvasRef.current.scrollTop = 250;
                    canvasRef.current.scrollLeft = 50;
                }
            }, []);

            const toggleNode = (nodeId) => {
                setExpandedNodes(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(nodeId)) newSet.delete(nodeId);
                    else newSet.add(nodeId);
                    return newSet;
                });
            };

            const onMouseDown = (e) => {
                if(e.target.closest('button') || e.target.closest('a') || e.target.closest('.lesson-content')) return; 
                setIsDragging(true);
                setPos({ left: canvasRef.current.scrollLeft, top: canvasRef.current.scrollTop, x: e.clientX, y: e.clientY });
            };
            const onMouseMove = (e) => {
                if (!isDragging) return;
                canvasRef.current.scrollTop = pos.top - (e.clientY - pos.y);
                canvasRef.current.scrollLeft = pos.left - (e.clientX - pos.x);
            };
            const onMouseUp = () => setIsDragging(false);

            const renderLessonContent = () => {
                switch(activeLesson) {
                    case "np-intro": return <LessonNPIntro />;
                    case "np-forms-lesson": return <LessonNPForms />;
                    case "head-noun-lesson": return <LessonHeadNoun />;
                    case "compound-lesson": return <LessonCompound />;
                    case "uncountable-lesson": return <LessonUncountable />;
                    case "singular-lesson": return <LessonSingular />;
                    case "plural-lesson": return <LessonPlural />;
                    case "determiners-lesson": return <LessonDeterminers />;
                    case "quantifiers-lesson": return <LessonQuantifiers />;
                    case "adjectives-lesson": return <LessonAdjectives />;
                    case "prep-lesson": return <LessonPrep />;
                    case "relative-clauses-lesson": return <LessonRelativeClause />;
                    case "noun-clauses-lesson": return <LessonNounClause />;
                    case "reported-speech-lesson": return <LessonReportedSpeech />;
                    default: return <div className="mt-10 text-center text-slate-500 font-medium">Đang tải kiến thức...</div>;
                }
            };

            return (
                <div className="w-full h-full relative overflow-hidden bg-grid">
                    
                    <div className="absolute top-6 left-6 z-40 bg-white/90 backdrop-blur-md p-5 rounded-3xl shadow-sm border border-slate-200/60 pointer-events-none">
                        <h1 className="text-3xl font-black text-slate-800 tracking-tight flex flex-col">
                            <span>Grammar</span>
                            <span className="text-brand-600">Knowledge Graph</span>
                        </h1>
                        <p className="text-sm text-slate-500 mt-2 font-medium">Kéo thả để di chuyển. Bấm Học để xem chi tiết.</p>
                    </div>

                    <div 
                        id="canvas-container"
                        ref={canvasRef}
                        className="w-full h-full overflow-auto pt-[150px] pl-[40px] pb-[800px] pr-[800px]"
                        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
                    >
                        <div className="inline-block min-w-max">
                            <TreeNode nodeId="noun-phrase" expandedNodes={expandedNodes} toggleNode={toggleNode} openLesson={setActiveLesson} />
                        </div>
                    </div>

                    <div className={`absolute top-0 right-0 h-full w-full md:w-[700px] bg-white/95 backdrop-blur-xl shadow-drawer border-l border-slate-200 flex flex-col z-50 transition-transform duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)] ${activeLesson ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-white/50 shrink-0">
                            <div className="flex items-center gap-3">
                                <span className="w-3 h-3 rounded-full bg-brand-500 animate-pulse"></span>
                                <span className="font-bold text-slate-800 tracking-wide uppercase text-sm">Trạm Kiến Thức Chuyên Sâu</span>
                            </div>
                            <button onClick={() => setActiveLesson(null)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900 font-bold transition-all">✕</button>
                        </div>
                        
                        {activeLesson && (
                            <div className="flex-1 overflow-y-auto p-8 scrollbar-hide flex flex-col">
                                <div className="flex-1">
                                    <GlobalErrorBoundary>
                                        {renderLessonContent()}
                                    </GlobalErrorBoundary>
                                </div>
                                <div className="mt-10 pt-6 border-t border-slate-200 shrink-0">
    <a 
        href={activeLesson === "np-intro" ? "./homework/nguphap/Làm chủ Cụm Danh Từ.html" : `./lesson-${activeLesson}.html`}
        target="_blank"
        className="block w-full text-center py-4 rounded-xl bg-slate-900 text-white font-bold text-lg hover:bg-brand-600 shadow-lg transform transition hover:-translate-y-1 cursor-pointer"
    >
        Học Sâu & Làm Thêm Bài Tập 🚀
    </a>
</div>
                            </div>
                        )}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <GlobalErrorBoundary>
                <App />
            </GlobalErrorBoundary>
        );
    </script>
</body>
</html>
