<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm phát âm từng âm · Night IELTS</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F1B3A;--mut:#6B6890;--bg:#F6F4FF;--card:#fff;--line:#E7E4F5;--ok:#16A34A;--okb:#DCFCE7;--near:#B45309;--nearb:#FEF3C7;--bad:#DC2626;--badb:#FEE2E2;--pri:#5B4BDB;--pri2:#FF6B9A}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(120% 60% at 100% 0%,#E9E4FF 0%,var(--bg) 55%);color:var(--ink);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;margin:4px 0 4px;font-weight:800}
.sub{color:var(--mut);margin:0 0 18px;font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px -18px rgba(60,40,160,.35);margin-bottom:16px}
label{font-weight:700;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
textarea{width:100%;margin-top:8px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:600 18px/1.45 "Plus Jakarta Sans",sans-serif;color:var(--ink);resize:vertical;min-height:74px;outline:0}
textarea:focus{border-color:var(--pri)}
.samples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.samples button{border:1px solid var(--line);background:#FAF9FF;border-radius:999px;padding:5px 11px;font:600 12.5px inherit;font-family:inherit;color:var(--mut);cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.rec{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:13px 22px;font:800 16px "Plus Jakarta Sans",sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pri),#8B5CF6);box-shadow:0 10px 20px -10px var(--pri)}
.rec.on{background:linear-gradient(135deg,#EF4444,var(--pri2));animation:pulse 1.2s infinite}
.rec:disabled{opacity:.5;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(239,68,68,.15)}}
.dot{width:12px;height:12px;border-radius:50%;background:#fff}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font:700 14px "Plus Jakarta Sans",sans-serif;color:var(--ink);cursor:pointer}
.st{font-size:13.5px;color:var(--mut)}
.srv{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-left:auto}
.srv i{width:8px;height:8px;border-radius:50%;background:#CBD5E1;display:inline-block}.srv.ok i{background:var(--ok)}.srv.wait i{background:#F59E0B}
.score{display:flex;align-items:center;gap:18px}
.ring{--v:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--ok)) calc(var(--v)*1%),#EEE 0);flex:none}
.ring b{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;font-weight:800}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--b)}
.words{display:flex;flex-wrap:wrap;gap:10px}
.w{border:1.5px solid var(--line);border-radius:16px;padding:9px 11px 8px;background:#fff;cursor:pointer;transition:.15s;min-width:56px}
.w:hover{transform:translateY(-2px)}
.w.sel{border-color:var(--pri);box-shadow:0 0 0 3px #E4DFFF}
.w .t{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px}
.w .t small{font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff;background:var(--c)}
.w.fnw{opacity:.75}
.ph{display:flex;align-items:flex-start;gap:3px;margin-top:6px;flex-wrap:wrap}
.p{font-family:"Noto Sans",sans-serif;font-size:14px;border-radius:7px;padding:1px 6px;font-weight:700}
.p.ok{background:var(--okb);color:var(--ok)}.p.near{background:var(--nearb);color:var(--near)}.p.sub{background:var(--badb);color:var(--bad)}
.p.miss{background:#fff;color:var(--bad);outline:1.5px dashed var(--bad);text-decoration:line-through}
.p.extra{background:#F1F5F9;color:#64748B;font-style:italic}
.detail{border-radius:18px;background:linear-gradient(180deg,#FBFAFF,#fff);border:1px solid var(--line);padding:16px;margin-top:14px}
.detail h3{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail .ipa{font-family:"Noto Sans",sans-serif;color:var(--mut);font-size:15px;font-weight:400}
.big{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin:12px 0}
.big .p{font-size:22px;padding:4px 11px;border-radius:10px}
.fix{border-left:4px solid var(--c);background:#fff;border-radius:12px;padding:11px 13px;margin-top:9px;box-shadow:0 4px 14px -10px rgba(0,0,0,.25)}
.fix b.h{display:block;margin-bottom:3px}
.fix .how{color:#3F3D56;font-size:14.5px;line-height:1.5}
.fix .eg{color:var(--mut);font-size:13px;margin-top:4px}
.play{border:0;background:#EEEAFE;color:var(--pri);border-radius:999px;padding:6px 12px;font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
.allgood{color:var(--ok);font-weight:700}
.heard{font-family:"Noto Sans",sans-serif;font-size:13px;color:var(--mut);margin-top:12px;word-break:break-word}
.err{color:var(--bad);font-weight:700}
.hide{display:none}
@media(max-width:560px){h1{font-size:22px}.w .t{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Chấm phát âm từng âm</h1>
  <p class="sub">Gõ câu muốn đọc, bấm ghi âm, đọc to rồi bấm dừng. AI chỉ ra âm nào đúng, âm nào sai, âm nào bị thiếu, kèm cách sửa.</p>

  <div class="card">
    <label for="txt">Câu sẽ đọc</label>
    <textarea id="txt">I think pronunciation is really important for my future job.</textarea>
    <div class="samples" id="samples"></div>
    <div class="row">
      <button class="rec" id="rec"><span class="dot"></span><span id="recT">Bấm để ghi âm</span></button>
      <button class="ghost hide" id="again">Nghe lại bài của mình</button>
      <span class="st" id="st"></span>
      <span class="srv" id="srv"><i></i><span>Đang kiểm tra máy chấm…</span></span>
    </div>
  </div>

  <div class="card hide" id="res">
    <div class="score">
      <div class="ring" id="ring"><b id="sc">0</b></div>
      <div>
        <div style="font-weight:800;font-size:18px" id="verdict"></div>
        <div class="legend"><span style="--b:var(--okb)">Đúng</span><span style="--b:var(--nearb)">Gần đúng</span><span style="--b:var(--badb)">Sai âm</span><span style="--b:#fff;outline:1px dashed var(--bad)">Thiếu âm</span></div>
        <div class="st" style="margin-top:6px">Bấm vào từng chữ để xem lỗi và cách sửa.</div>
      </div>
    </div>
    <div class="words" id="words" style="margin-top:16px"></div>
    <div id="detail"></div>
    <div class="heard" id="heard"></div>
  </div>
</div>
<script>
(function () {
  var API = 'https://nightruan31-night-pron.hf.space';
  var $ = function (id) { return document.getElementById(id); };
  var SAMPLES = ['I think pronunciation is really important for my future job.', 'She sells seashells by the seashore.', 'Three thin thieves thought a thousand thoughts.', 'My favourite subject at school was chemistry.', 'I usually walk to work because it is cheaper.', 'The weather in my hometown is quite hot and humid.'];
  SAMPLES.forEach(function (s) { var b = document.createElement('button'); b.textContent = s.length > 34 ? s.slice(0, 32) + '…' : s; b.onclick = function () { $('txt').value = s; }; $('samples').appendChild(b); });

  /* ---------- Cách sửa từng âm (bỏ dấu dài ː khi tra) ---------- */
  var TIP = {
    p: ['/p/ bật hơi', 'Mím 2 môi rồi bật mạnh ra, có luồng hơi phụt ra. Để tờ giấy trước miệng, đọc "p" thấy giấy rung. Ở cuối từ (stop, help) vẫn phải ngậm môi lại, đừng bỏ.', 'pen, people, help'],
    b: ['/b/', 'Mím 2 môi, rung cổ họng, hơi bật nhẹ hơn /p/.', 'big, job, rubber'],
    t: ['/t/ bật hơi', 'Đầu lưỡi chạm phía sau răng cửa trên (không phải chạm răng), bật hơi mạnh. Không đọc như "t" tiếng Việt. Ở cuối từ phải chặn lưỡi lại rõ ràng.', 'time, important, what'],
    d: ['/d/', 'Đầu lưỡi chạm phía sau răng cửa trên, rung cổ họng. Ở cuối từ (played, good) vẫn phải chạm lưỡi.', 'day, good, played'],
    k: ['/k/ bật hơi', 'Cuống lưỡi nâng chạm vòm mềm, bật hơi mạnh. Ở cuối từ (think, book) phải chặn hơi ở cổ, đừng nuốt mất.', 'cat, think, book'],
    g: ['/g/', 'Giống /k/ nhưng rung cổ họng.', 'go, big, again'],
    f: ['/f/', 'Răng trên chạm nhẹ môi dưới, thổi hơi ra liên tục.', 'five, life, coffee'],
    v: ['/v/', 'Răng trên chạm môi dưới, rung cổ họng. Ở cuối từ (have, live) vẫn phải giữ âm.', 'very, have, live'],
    'θ': ['/θ/ (th vô thanh)', 'Đặt đầu lưỡi giữa 2 hàm răng, thè ra một chút, thổi hơi qua. KHÔNG đọc thành "th" tiếng Việt hay /t/, /s/.', 'think, three, month'],
    'ð': ['/ð/ (th hữu thanh)', 'Đầu lưỡi đặt giữa 2 hàm răng như /θ/ nhưng rung cổ họng. Không đọc thành "đ" hay /d/, /z/.', 'the, this, mother'],
    s: ['/s/', 'Đầu lưỡi gần răng trên, thổi hơi xì mảnh như rắn. Ở cuối từ (books, likes) phải nghe rõ tiếng "xì".', 'see, bus, students'],
    z: ['/z/', 'Như /s/ nhưng rung cổ họng (tiếng ong "zzz"). Đuôi -s sau âm hữu thanh đọc /z/: dogs, plays.', 'zoo, is, dogs'],
    'ʃ': ['/ʃ/', 'Tròn môi, đưa ra trước, lưỡi lùi về sau hơn /s/, thổi hơi "sh". Giống "s" tiếng Việt miền Bắc đọc nặng.', 'she, nation, fish'],
    'ʒ': ['/ʒ/', 'Như /ʃ/ nhưng rung cổ họng.', 'usually, television, measure'],
    'tʃ': ['/tʃ/', 'Bật từ /t/ sang /ʃ/, tròn môi. Không đọc như "ch" tiếng Việt (mềm hơn và không bật).', 'cheap, teacher, much'],
    'dʒ': ['/dʒ/', 'Như /tʃ/ nhưng rung cổ họng. Ở cuối từ (job, large... ) giữ âm rõ.', 'job, large, judge'],
    m: ['/m/', 'Mím môi, ngân âm qua mũi. Ở cuối từ phải ngậm môi lại.', 'my, time, summer'],
    n: ['/n/', 'Đầu lưỡi chạm sau răng trên, ngân qua mũi. Ở cuối từ (nation, sun) giữ lưỡi chạm, đừng biến thành /ŋ/.', 'no, sun, nation'],
    'ŋ': ['/ŋ/', 'Cuống lưỡi chạm vòm mềm như "ng" tiếng Việt. Đừng thêm /g/ hay /k/ phía sau.', 'sing, thinking, long'],
    l: ['/l/', 'Đầu lưỡi chạm sau răng trên. Ở cuối từ (school, feel) phải giữ lưỡi chạm, không được bỏ hay đọc thành "ô".', 'light, school, feel'],
    'ɹ': ['/r/ tiếng Anh', 'Cong đầu lưỡi lên và lùi về sau, KHÔNG chạm vòm miệng, môi hơi tròn. Không rung lưỡi như "r" tiếng Việt.', 'red, very, really'],
    w: ['/w/', 'Tròn môi nhỏ như sắp huýt sáo rồi mở ra. Không đọc như "qu" hay "v".', 'we, walk, quite'],
    j: ['/j/', 'Như "d" miền Nam / "y" trong "yêu".', 'yes, you, use'],
    h: ['/h/', 'Thở hắt hơi nhẹ từ cổ họng.', 'he, how, hot'],
    i: ['/iː/ (i dài)', 'Kéo căng môi như đang cười, kéo dài âm "iii".', 'see, cheap, people'],
    'ɪ': ['/ɪ/ (i ngắn)', 'Âm "i" ngắn, thả lỏng, hơi giống "ê" một chút. Đọc nhanh và dứt khoát.', 'sit, ship, important'],
    'ɛ': ['/e/', 'Mở miệng vừa như "e" tiếng Việt.', 'bed, red, many'],
    'æ': ['/æ/', 'Mở miệng thật rộng, hạ hàm, như nửa "a" nửa "e".', 'cat, bad, hand'],
    'ʌ': ['/ʌ/', 'Âm "ă" ngắn tiếng Việt, miệng hơi mở.', 'cup, but, much'],
    'ə': ['/ə/ (schwa)', 'Âm "ơ" rất nhẹ và ngắn, thả lỏng miệng. Âm không nhấn, đừng đọc rõ như nguyên âm chính.', 'about, teacher, pronunciation'],
    'ɑ': ['/ɑː/', 'Mở miệng rộng, "a" dài và sâu.', 'car, father, hot (giọng Mỹ)'],
    'ɔ': ['/ɔː/', 'Tròn môi, "o" dài.', 'law, walk, more'],
    'ʊ': ['/ʊ/ (u ngắn)', '"u" ngắn, môi thả lỏng.', 'book, good, put'],
    u: ['/uː/ (u dài)', 'Tròn môi chu ra, kéo dài "uuu".', 'food, school, two'],
    'ɜ': ['/ɜː/', 'Như "ơ" dài, lưỡi giữa miệng (giọng Mỹ có cong lưỡi /r/).', 'work, bird, learn'],
    'eɪ': ['/eɪ/', 'Trượt từ "ê" sang "i": "ây".', 'day, nation, great'],
    'aɪ': ['/aɪ/', 'Trượt từ "a" sang "i": "ai".', 'my, time, like'],
    'ɔɪ': ['/ɔɪ/', 'Trượt từ "o" sang "i": "oi".', 'boy, enjoy, voice'],
    'aʊ': ['/aʊ/', 'Trượt từ "a" sang "u": "ao".', 'now, house, how'],
    'oʊ': ['/oʊ/', 'Trượt từ "ô" sang "u": "âu" tròn môi.', 'go, home, know'],
    'ɪɹ': ['/ɪr/', '"i" rồi cong lưỡi /r/.', 'here, near, clear'],
    'ɛɹ': ['/er/', '"e" rồi cong lưỡi /r/.', 'where, care, there'],
    'ʊɹ': ['/ʊr/', '"u" rồi cong lưỡi /r/.', 'sure, tour, pure'],
    'ɑɹ': ['/ɑr/', '"a" sâu rồi cong lưỡi /r/.', 'car, hard, start'],
    'ɔɹ': ['/ɔr/', '"o" rồi cong lưỡi /r/.', 'more, four, important'],
    'oɹ': ['/ɔr/', '"o" rồi cong lưỡi /r/.', 'more, four, important']
  };
  var key = function (p) { return String(p || '').replace(/[ˈˌːʲ]/g, ''); };
  var tipOf = function (p) { return TIP[key(p)] || ['/' + p + '/', 'Nghe phát âm chuẩn rồi đọc lại chậm, phóng đại khẩu hình.', '']; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var VOW = /^(i|ɪ|ɛ|e|æ|ʌ|ə|ɐ|ɑ|ɔ|o|ʊ|u|ɜ|ɚ|ɝ|ᵻ|a|eɪ|aɪ|ɔɪ|aʊ|oʊ|ɪɹ|ɛɹ|ʊɹ|ɑɹ|ɔɹ|oɹ)$/;

  /* ---------- Máy chấm: đánh thức + trạng thái ---------- */
  function ping() {
    var s = $('srv');
    fetch(API + '/', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      s.className = 'srv ' + (j.ready ? 'ok' : 'wait'); s.lastChild.textContent = j.ready ? 'Máy chấm sẵn sàng' : 'Máy chấm đang khởi động…';
      if (!j.ready) setTimeout(ping, 5000);
    }).catch(function () { s.className = 'srv wait'; s.lastChild.textContent = 'Máy chấm đang khởi động (lần đầu có thể mất vài phút)…'; setTimeout(ping, 8000); });
  }
  ping();

  /* ---------- Ghi âm ---------- */
  var mr = null, chunks = [], blob = null, url = null, stream = null;
  $('rec').onclick = function () {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (st) {
      stream = st; chunks = [];
      var mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].filter(function (m) { return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); })[0];
      mr = new MediaRecorder(st, mime ? { mimeType: mime } : undefined);
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        $('rec').classList.remove('on'); $('recT').textContent = 'Ghi âm lại';
        blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob);
        $('again').classList.remove('hide');
        send();
      };
      mr.start(); $('rec').classList.add('on'); $('recT').textContent = 'Đang ghi… bấm để dừng'; $('st').textContent = '';
    }).catch(function () { $('st').innerHTML = '<span class="err">Chưa cho phép dùng micro.</span>'; });
  };
  $('again').onclick = function () { if (url) new Audio(url).play(); };

  function send() {
    var text = $('txt').value.trim();
    if (!text) { $('st').innerHTML = '<span class="err">Gõ câu cần đọc trước nhé.</span>'; return; }
    var fd = new FormData(); fd.append('audio', blob, 'rec.' + (/mp4/.test(blob.type) ? 'm4a' : 'webm')); fd.append('text', text);
    $('rec').disabled = true; $('st').textContent = 'Đang chấm từng âm…';
    var t0 = Date.now();
    fetch(API + '/score', { method: 'POST', body: fd }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) throw new Error(j.error);
      $('st').textContent = 'Chấm xong trong ' + ((Date.now() - t0) / 1000).toFixed(1) + ' giây.';
      show(j);
    }).catch(function (e) { $('st').innerHTML = '<span class="err">' + esc(e.message && !/fetch/i.test(e.message) ? e.message : 'Máy chấm đang bận hoặc đang khởi động, thử lại sau ít phút nhé.') + '</span>'; })
      .then(function () { $('rec').disabled = false; });
  }

  /* ---------- Hiển thị ---------- */
  var colorOf = function (v) { return v >= 85 ? 'var(--ok)' : v >= 60 ? '#F59E0B' : 'var(--bad)'; };
  var DATA = null;
  function show(j) {
    DATA = j;
    $('res').classList.remove('hide');
    $('ring').style.setProperty('--v', j.score); $('ring').style.setProperty('--c', colorOf(j.score)); $('sc').textContent = j.score;
    $('verdict').textContent = j.score >= 85 ? 'Phát âm rất tốt!' : j.score >= 70 ? 'Khá ổn, còn vài âm cần sửa' : j.score >= 50 ? 'Cần luyện thêm một số âm' : 'Nhiều âm chưa chuẩn, luyện chậm từng chữ nhé';
    $('words').innerHTML = j.words.map(function (w, i) {
      return '<div class="w' + (w.fn ? ' fnw' : '') + '" data-i="' + i + '" style="--c:' + colorOf(w.score) + '"><div class="t">' + esc(w.w) + ' <small>' + w.score + '</small></div><div class="ph">' +
        w.ph.map(function (p) { return '<span class="p ' + p.st + '">' + esc(key(p.p)) + '</span>'; }).join('') +
        w.extra.map(function (x) { return '<span class="p extra">+' + esc(key(x)) + '</span>'; }).join('') + '</div></div>';
    }).join('');
    $('heard').textContent = 'Âm AI nghe được: /' + j.heard + '/';
    var worst = j.words.map(function (w, i) { return [w.fn ? 999 : w.score, i]; }).sort(function (a, b) { return a[0] - b[0]; })[0];
    pick(worst ? worst[1] : 0);
    $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('words').onclick = function (e) { var w = e.target.closest('.w'); if (w) pick(+w.dataset.i); };

  function say(t, rate) { try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = rate || .85; var v = speechSynthesis.getVoices().filter(function (x) { return /en-US/.test(x.lang); })[0]; if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }

  function pick(i) {
    var w = DATA.words[i]; if (!w) return;
    [].forEach.call(document.querySelectorAll('.w'), function (el) { el.classList.toggle('sel', +el.dataset.i === i); });
    var n = w.ph.length, fixes = [];
    w.ph.forEach(function (p, k) {
      if (p.st === 'ok') return;
      var t = tipOf(p.p), pos = k === 0 ? 'đầu' : k === n - 1 ? 'cuối' : 'giữa', title;
      if (p.st === 'miss') title = (pos === 'cuối' && !VOW.test(key(p.p)) ? 'Nuốt mất âm cuối ' : 'Thiếu âm ') + '/' + key(p.p) + '/' + (pos !== 'cuối' ? ' ở ' + pos + ' từ' : '');
      else if (p.st === 'sub') title = 'Đọc /' + key(p.p) + '/ thành /' + key(p.got) + '/';
      else title = '/' + key(p.p) + '/ gần đúng (bạn đọc /' + key(p.got) + '/)';
      fixes.push('<div class="fix" style="--c:' + (p.st === 'near' ? '#F59E0B' : 'var(--bad)') + '"><b class="h">' + esc(title) + '</b><div class="how"><b>Cách đọc ' + esc(t[0]) + ':</b> ' + esc(t[1]) + '</div>' + (t[2] ? '<div class="eg">Luyện với: ' + esc(t[2]) + '</div>' : '') + '</div>');
    });
    if (w.extra.length) fixes.push('<div class="fix" style="--c:#94A3B8"><b class="h">Thừa âm ' + w.extra.map(function (x) { return '/' + esc(key(x)) + '/'; }).join(' ') + '</b><div class="how">Bạn đọc thêm âm không có trong từ. Đọc gọn lại, đừng thêm "ơ" hay "s" phía sau.</div></div>');
    $('detail').innerHTML = '<div class="detail"><h3>' + esc(w.w) + ' <span class="ipa">/' + esc(w.ph.map(function (p) { return key(p.p); }).join('')) + '/</span>' +
      '<button class="play" data-say="1">Nghe chuẩn</button><button class="play" data-say=".55">Nghe chậm</button></h3>' +
      '<div class="big">' + w.ph.map(function (p) { return '<span class="p ' + p.st + '" title="' + (p.st === 'ok' ? 'Đúng' : p.st === 'miss' ? 'Thiếu' : 'Bạn đọc: ' + esc(key(p.got))) + '">' + esc(key(p.p)) + '</span>'; }).join('') + '</div>' +
      (fixes.length ? fixes.join('') : '<div class="allgood">Chữ này bạn phát âm đúng hết các âm.</div>') + '</div>';
    [].forEach.call(document.querySelectorAll('[data-say]'), function (b) { b.onclick = function () { say(w.w, +b.dataset.say === 1 ? .85 : .55); }; });
  }
})();
</script>
</body>
</html>
