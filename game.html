<script>
// Màu chủ đề (primary) tham chiếu tới CSS custom properties bên dưới, để có thể
// đổi màu theo từng bài (colorKey) ngay khi tải xong dữ liệu, không cần Tailwind

tailwind.config={theme:{extend:{colors:{primary:{
  50:'var(--primary-50)',100:'var(--primary-100)',200:'var(--primary-200)',300:'var(--primary-300)',400:'var(--primary-400)',
  500:'var(--primary-500)',600:'var(--primary-600)',700:'var(--primary-700)',800:'var(--primary-800)',900:'var(--primary-900)'
}},boxShadow:{card:'0 10px 30px rgba(20,184,166,.08)'}}}};

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary-50:#f0f9ff;--primary-100:#e0f2fe;--primary-200:#99f6e4;--primary-300:#7dd3fc;--primary-400:#38bdf8;
  --primary-500:#0ea5e9;--primary-600:#0d9488;--primary-700:#0369a1;--primary-800:#075985;--primary-900:#134e4a;
  --char-untyped-border:#99f6e4;--char-typed-color:#134e4a;--char-typed-border:#0d9488;
}
*{box-sizing:border-box}html,body{margin:0;background:#f7fffc;color:#1e293b;font-family:'Plus Jakarta Sans',sans-serif;overscroll-behavior-y:none;}
button,input,select{font-family:'Plus Jakarta Sans',sans-serif;outline:none;}
.fade{animation:fade .3s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:rgba(255,255,255,.85);backdrop-filter:blur(16px)}
#fireworks{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.spark{position:absolute;width:7px;height:7px;border-radius:50%;animation:burst 1.05s ease-out forwards}@keyframes burst{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.char-box{display:inline-block;min-width:0.8em;border-bottom:3px solid transparent;text-align:center;margin:0 2px;transition:all .15s ease-in-out;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:1.15em;}
.char-untyped{color:#cbd5e1;border-bottom:3px solid var(--char-untyped-border);}
.char-masked{color:#cbd5e1;}
.char-typed{color:var(--char-typed-color);border-bottom:3px solid var(--char-typed-border);transform:translateY(-2px);}
.char-error{color:#fff;background-color:#ef4444;border-radius:6px;border-bottom:3px solid #b91c1c;transform:translateY(-2px);box-shadow:0 4px 10px rgba(239,68,68,.3);animation:shake .3s ease-in-out;}
.char-hint{color:#d97706;background-color:#fef3c7;border-radius:6px;font-weight:800;border-bottom:3px solid transparent;transform:translateY(-2px);box-shadow:0 4px 10px rgba(251,191,36,.15);opacity:.8;}
@keyframes shake{0%,100%{transform:translateX(0) translateY(-2px);}25%{transform:translateX(-4px) translateY(-2px);}75%{transform:translateX(4px) translateY(-2px);}}
.scrollbar::-webkit-scrollbar{width:8px;height:8px}.scrollbar::-webkit-scrollbar-thumb{background:var(--primary-200);border-radius:99px}
</style>

<!-- ============================================================
     ENGINE: Listen -> Type (giữ nguyên đúng bản gốc)
     ============================================================ -->
<script>
var TITLE = 'Bài tập VocaFlow';
var ITEMS = [];
var completedSet = new Set();
var SPARK_COLORS = ['#0ea5e9','#38bdf8','#99f6e4','#0d9488','#7dd3fc'];

var voices = [];
var audioCtx = null;
var selectedVoiceName = null;

var state = {
  viewMode: 'cards',
  practiceType: 'phrase',
  practiceIndex: 0,
  input: '',
  revealed: false,
  completed: false,
  hintActive: false,
  hintEndIndex: -1,
  errorIndex: -1
};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function attrJson(v){ return esc(JSON.stringify(v)); }

// ---------------- AUDIO ----------------
var audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  if('speechSynthesis' in window){
    var dummy = new SpeechSynthesisUtterance(' ');
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
  }
  if(!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', unlockAudio, {once:true});
document.addEventListener('click', unlockAudio, {once:true});

function englishVoices(){ return voices.filter(function(v){ return /en(-|_)/i.test(v.lang); }); }

function loadVoices(){
  voices = ('speechSynthesis' in window) ? (speechSynthesis.getVoices() || []) : [];
  var s = document.getElementById('voiceSelect');
  if(!s) return;
  var vs = englishVoices();
  s.innerHTML = vs.length ? vs.map(function(v){ return '<option value="' + esc(v.name) + '">' + esc(v.name) + ' (' + esc(v.lang) + ')</option>'; }).join('') : '<option>System Voice</option>';
  var best = vs.find(function(v){ return v.name === selectedVoiceName; }) ||
             vs.find(function(v){ return v.name.indexOf('Google US English') !== -1; }) ||
             vs.find(function(v){ return v.lang === 'en-US'; }) || vs[0];
  if(best){ s.value = best.name; if(!selectedVoiceName) selectedVoiceName = best.name; }
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 250);
}

function updateVoice(name){ selectedVoiceName = name; previewVoice(); }
function previewVoice(){ speak('The sport grew in popularity after it became legal.', 1); }

function speak(text, rate){
  rate = rate || 1;
  if(!('speechSynthesis' in window) || !text) return;
  var synth = window.speechSynthesis;
  synth.cancel();
  setTimeout(function(){
    try{
      var u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'en-GB'; u.rate = rate; u.pitch = 1; u.volume = 1;
      var selEl = document.getElementById('voiceSelect');
      var selected = selEl ? selEl.value : null;
      var v = voices.find(function(x){ return x.name === selectedVoiceName; }) ||
              voices.find(function(x){ return x.name === selected; }) ||
              englishVoices().find(function(x){ return /^en(-|_)/i.test(x.lang); }) || voices[0];
      if(v) u.voice = v;
      u.onerror = function(){};
      synth.speak(u);
    }catch(e){}
  }, 80);
}

function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, d, vol, type){
  d = d || 0.06; vol = vol || 0.03; type = type || 'sine';
  try{
    var c = ac(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + d);
  }catch(e){}
}
function completeSound(){ [523,659,784,988].forEach(function(f,i){ setTimeout(function(){ beep(f,0.15,0.05); }, i*80); }); }
function errorSound(){ beep(150, 0.15, 0.05, 'sawtooth'); }
function fireworks(){
  var r = document.getElementById('practiceBurst') || document.getElementById('fireworks');
  if(!r) return;
  r.innerHTML = '';
  for(var i=0;i<44;i++){
    var s = document.createElement('span');
    var a = Math.random()*Math.PI*2, rad = 80+Math.random()*180;
    s.className = 'spark';
    s.style.left = (42+Math.random()*16)+'%';
    s.style.top = (32+Math.random()*24)+'%';
    s.style.background = SPARK_COLORS[i%5];
    s.style.setProperty('--dx', Math.cos(a)*rad+'px');
    s.style.setProperty('--dy', Math.sin(a)*rad+'px');
    r.appendChild(s);
  }
  setTimeout(function(){ r.innerHTML=''; }, 1200);
}

// ---------------- PROGRESS (báo về Firestore, đọc bởi index.html) ----------------
function currentPercent(){ return ITEMS.length ? Math.round((completedSet.size / ITEMS.length) * 100) : 0; }
function updateProgressBadge(){
  var el = document.getElementById('progressBadge');
  if(!el) return;
  var p = currentPercent();
  el.classList.remove('hidden');
  el.classList.add('inline-flex');
  el.textContent = 'Hoàn thành ' + p + '%';
  if(p >= 100){ el.className = 'inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-[11px] font-extrabold'; }
  else if(p > 0){ el.className = 'inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-primary-50 text-primary-700 text-[11px] font-extrabold'; }
  else{ el.className = 'inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-100 text-slate-500 text-[11px] font-extrabold'; }
}
function markSentenceDone(idx){
  if(completedSet.has(idx)) return;
  completedSet.add(idx);
  updateProgressBadge();
  if(window.__persistProgress) window.__persistProgress(idx, currentPercent());
}

// ---------------- TYPING ENGINE ----------------
function current(){
  var item = ITEMS[state.practiceIndex] || ITEMS[0] || {phrase:'',meaningVi:'',sentence:'',sentenceVi:''};
  var isPhrase = state.practiceType === 'phrase';
  return {
    target: isPhrase ? item.phrase : item.sentence,
    promptVi: isPhrase ? item.meaningVi : (item.sentenceVi || item.meaningVi),
    audioText: isPhrase ? item.phrase : item.sentence,
    kind: isPhrase ? 'PHRASE' : 'SENTENCE'
  };
}
function normalizeSpaces(str){ return str.replace(/\s+/g, ' '); }

function handleKeyInput(e){
  if(state.completed || state.revealed) return;
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  var typedStr = normalizeSpaces(e.target.value);

  var isValid = true, errIdx = -1;
  for(var i=0;i<typedStr.length;i++){
    if(typedStr[i].toLowerCase() !== (targetStr[i]||'').toLowerCase()){ isValid=false; errIdx=i; break; }
  }
  if(!isValid){
    errorSound();
    e.target.value = typedStr.substring(0, errIdx);
    state.input = e.target.value;
    state.errorIndex = errIdx;
    updateTyping();
    clearTimeout(window.errorTimer);
    window.errorTimer = setTimeout(function(){ state.errorIndex = -1; updateTyping(); }, 350);
    return;
  }
  state.errorIndex = -1;
  state.input = typedStr;
  if(state.hintActive && typedStr.length >= state.hintEndIndex) state.hintActive = false;
  if(typedStr.length > 0) beep(620+Math.min(typedStr.length,12)*24, 0.055, 0.022);

  if(typedStr.toLowerCase() === targetStr.toLowerCase()){
    state.completed = true; state.revealed = true; state.input = c.target; e.target.value = c.target;
    completeSound();
    setTimeout(fireworks, 60);
    if(state.practiceType === 'sentence') markSentenceDone(state.practiceIndex);
  }
  updateTyping();
}

function giveHint(){
  if(state.completed || state.revealed) return;
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  if(state.input.length < targetStr.length){
    var startIdx = state.input.length;
    if(targetStr[startIdx] === ' ') startIdx++;
    var nextSpace = targetStr.indexOf(' ', startIdx);
    if(nextSpace === -1) nextSpace = targetStr.length;
    state.hintActive = true; state.hintEndIndex = nextSpace;
    updateTyping();
    setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 50);
  }
}

function updateTyping(){
  var c = current();
  var targetStr = normalizeSpaces(c.target);
  var typedStr = state.input;
  var totalLetters = targetStr.length;

  var visualBox = document.getElementById('visualInputBox');
  if(visualBox){
    var html = '';
    for(var i=0;i<targetStr.length;i++){
      var actualChar = targetStr[i];
      var isSpace = actualChar === ' ';
      var displayChar = isSpace ? '&nbsp;' : '*';
      if(i < typedStr.length){
        html += '<span class="char-box char-typed">' + (isSpace ? '&nbsp;' : esc(typedStr[i])) + '</span>';
      }else if(i === state.errorIndex){
        html += '<span class="char-box char-error">' + (isSpace ? '&nbsp;' : esc(actualChar)) + '</span>';
      }else if(state.hintActive && i >= typedStr.length && i < state.hintEndIndex){
        html += '<span class="char-box char-hint">' + esc(actualChar) + '</span>';
      }else{
        if(state.revealed || state.completed){
          html += '<span class="char-box char-untyped" style="border-bottom-color: transparent;">' + (isSpace ? '&nbsp;' : esc(actualChar)) + '</span>';
        }else{
          html += '<span class="char-box char-untyped"><span class="char-masked">' + displayChar + '</span></span>';
        }
      }
    }
    visualBox.innerHTML = html;
  }

  var progressBar = document.getElementById('purpleProgressBar');
  if(progressBar){
    var percentage = totalLetters ? (typedStr.length/totalLetters)*100 : 0;
    progressBar.style.width = percentage + '%';
    if(state.completed){ progressBar.classList.remove('bg-primary-500'); progressBar.classList.add('bg-emerald-500'); }
    else{ progressBar.classList.remove('bg-emerald-500'); progressBar.classList.add('bg-primary-500'); }
  }

  var wrapper = document.getElementById('inputWrapper');
  if(wrapper){
    if(state.completed) wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-200 rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.1)] text-emerald-800 cursor-text overflow-hidden transition-all duration-300';
    else if(state.revealed) wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl shadow-card cursor-text overflow-hidden transition-all duration-300';
    else wrapper.className = 'relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-primary-100 rounded-2xl shadow-card cursor-text focus-within:border-primary-400 focus-within:shadow-[0_10px_30px_rgba(139,92,246,0.15)] transition-all duration-300 overflow-hidden group';
  }

  var hiddenInp = document.getElementById('hiddenInput');
  if(hiddenInp){ hiddenInp.value = state.input; hiddenInp.disabled = state.completed || state.revealed; }

  var fb = document.getElementById('typingFeedback');
  if(fb){
    if(state.completed) fb.innerHTML = '<span class="text-emerald-600 font-extrabold">&#10003; Xuất sắc!</span>';
    else if(state.revealed) fb.innerHTML = '<span class="text-slate-500 font-bold">Đáp án đã hiện. Nghe lại và ôn tập.</span>';
    else fb.innerHTML = '<span class="text-primary-600/80 font-bold tracking-widest text-[10px] uppercase">Nghe rồi gõ lại chính xác</span>';
  }
}

// ---------------- NAVIGATION ----------------
function mainScroll(){ var m = document.getElementById('mainArea'); return m ? m.scrollTop : 0; }
function setViewMode(m){
  var y = mainScroll();
  state.viewMode = m;
  if(m === 'type'){
    state.practiceIndex = 0; state.practiceType = 'phrase'; state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  }
  render(y);
  if(m === 'type'){ speak(current().audioText, 1); setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120); }
}
function goCards(){ setViewMode('cards'); }
function goType(){ setViewMode('type'); }

function changeType(t){
  var y = mainScroll();
  state.practiceType = t; state.practiceIndex = 0; state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y);
  speak(current().audioText, 1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function setPhraseMode(){ changeType('phrase'); }
function setSentenceMode(){ changeType('sentence'); }

function next(){
  var y = mainScroll();
  state.practiceIndex = (state.practiceIndex+1) % ITEMS.length;
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y); speak(current().audioText,1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function prev(){
  var y = mainScroll();
  state.practiceIndex = (state.practiceIndex-1+ITEMS.length) % ITEMS.length;
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  render(y); speak(current().audioText,1);
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 120);
}
function retryItem(){
  state.input=''; state.revealed=false; state.completed=false; state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
  updateTyping();
  setTimeout(function(){ var el=document.getElementById('hiddenInput'); if(el) el.focus(); }, 50);
}
function reveal(){
  state.revealed = true; state.completed = false; state.input = current().target; state.hintActive=false; state.errorIndex=-1;
  updateTyping();
}

// ---------------- RENDER ----------------
function cardsView(){
  var cards = ITEMS.map(function(item, idx){
    var isDone = completedSet.has(idx);
    return '<article class="relative bg-white border border-primary-100/50 rounded-[26px] p-6 hover:-translate-y-1 hover:shadow-card transition-all">' +
      (isDone ? '<div class="absolute -top-2.5 -right-2.5 w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[11px] shadow-card"><i class="fa-solid fa-check"></i></div>' : '') +
      '<div class="flex justify-between items-center mb-4">' +
        '<span class="text-[9px] font-extrabold px-3 py-1.5 rounded-xl uppercase tracking-widest border bg-purple-100 text-purple-700 border-purple-200">CHUNK</span>' +
        '<button onclick="speak(' + attrJson(item.phrase) + ',1)" class="w-10 h-10 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center"><i class="fa-solid fa-volume-high"></i></button>' +
      '</div>' +
      '<div class="text-[21px] font-extrabold text-slate-800 leading-tight">' + esc(item.phrase) + '</div>' +
      '<div class="text-[13px] font-bold text-slate-500 mt-2">' + esc(item.meaningVi) + '</div>' +
      '<div class="mt-6 p-4 rounded-2xl bg-slate-50 border border-slate-100">' +
        '<div class="text-[9px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">CÂU VÍ DỤ</div>' +
        '<div class="text-sm font-semibold text-slate-700 leading-relaxed">' + esc(item.sentence) + '</div>' +
        '<button onclick="speak(' + attrJson(item.sentence) + ',1)" class="mt-3 text-xs font-extrabold text-primary-600"><i class="fa-solid fa-volume-high"></i> Nghe</button>' +
      '</div>' +
    '</article>';
  }).join('');

  return '<div class="space-y-7 fade">' +
    '<div class="flex flex-col md:flex-row md:items-end justify-between gap-4">' +
      '<div>' +
        '<div class="text-[10px] font-extrabold tracking-widest text-primary-500 uppercase">TỪ VỰNG &amp; CÂU</div>' +
        '<h2 class="text-3xl font-extrabold text-slate-800 mt-1.5">Danh sách học</h2>' +
        '<p class="text-sm font-medium text-slate-500 mt-2">' + ITEMS.length + ' mục &middot; Đã hoàn thành ' + completedSet.size + '/' + ITEMS.length + '. Nghe trước, rồi bấm bắt đầu để luyện gõ.</p>' +
      '</div>' +
      '<button onclick="goType()" class="px-8 py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold shadow-[0_8px_20px_rgba(15,23,42,0.3)] transition-all flex items-center gap-3"><i class="fa-solid fa-keyboard"></i> BẮT ĐẦU LISTENING TYPE</button>' +
    '</div>' +
    '<div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">' + cards + '</div>' +
  '</div>';
}

function typeView(){
  if(!ITEMS.length) return '<div class="p-12 text-center text-slate-400">Chưa có dữ liệu.</div>';
  var c = current();
  var list = ITEMS;

  return '<div class="space-y-6 fade max-w-[1100px] mx-auto">' +
    '<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">' +
      '<div>' +

function render(scrollTop){
  var old = (scrollTop===null||scrollTop===undefined) ? mainScroll() : scrollTop;
  var content = state.viewMode === 'type' ? typeView() : cardsView();
  document.getElementById('app').innerHTML = content;
  loadVoices();
  requestAnimationFrame(function(){
    var m = document.getElementById('mainArea');
    if(m) m.scrollTop = old;
    if(state.viewMode === 'type') updateTyping();
  });
}

// Gọi bởi script Firebase khi tải xong dữ liệu bài tập (xem cuối trang)
window.__assignmentLoaded = function(title, items, completedIndices, deadlineAt){
  TITLE = title;
  ITEMS = items;
  (completedIndices || []).forEach(function(i){ completedSet.add(i); });
  document.getElementById('lessonTitle').textContent = TITLE;
  updateProgressBadge();

  var dlBadge = document.getElementById('deadlineBadge');
  if(deadlineAt){
    var dlStr = new Date(deadlineAt).toLocaleDateString('vi-VN');
    var overdue = Date.now() > deadlineAt;
    dlBadge.className = 'inline-flex items-center gap-1 text-[10px] font-black px-2 py-0.5 rounded-full mt-1 ' + (overdue ? 'bg-red-50 text-red-500' : 'bg-slate-100 text-slate-500');
    dlBadge.innerHTML = (overdue ? '<i class="fa-solid fa-triangle-exclamation"></i> Đã quá hạn nộp (' + dlStr + ')' : '<i class="fa-regular fa-clock"></i> Hạn nộp: ' + dlStr);
  } else {
    dlBadge.classList.add('hidden');
  }

  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('mainArea').classList.remove('hidden');
  render(0);
};

window.__assignmentLoadError = function(msg){
  document.getElementById('loadingScreen').innerHTML =
    '<div class="text-center px-6"><i class="fa-solid fa-triangle-exclamation text-4xl text-rose-500 mb-4"></i>' +
    '<p class="font-bold text-rose-600">' + esc(msg) + '</p>' +
    '<a href="index.html" class="inline-block mt-5 px-6 py-2.5 bg-slate-800 text-white rounded-full font-bold text-sm">Quay lại trang chủ</a></div>';
};
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8",
    authDomain: "night-ielts-land.firebaseapp.com",
    databaseURL: "https://night-ielts-land-default-rtdb.firebaseio.com",
    projectId: "night-ielts-land",
    storageBucket: "night-ielts-land.firebasestorage.app",
    messagingSenderId: "408519436407",
    appId: "1:408519436407:web:a9f0b9ba23368b54427e72"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const taskId = urlParams.get('id');
  const docRef = taskId ? doc(db, 'assignments', taskId) : null;

  // 7 sắc cầu vồng — khớp với bảng màu trong Listening Type Generator
  const PALETTES = {
    red:    {50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d'},
    orange: {50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12'},
    yellow: {50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f'},
    green:  {50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},
    blue:   {50:'#f0f9ff',100:'#e0f2fe',200:'#99f6e4',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0d9488',700:'#0369a1',800:'#075985',900:'#134e4a'},
    indigo: {50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'},
    violet: {50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87'}
  };

  // Đổi màu chủ đề của trang này theo colorKey lưu trong bài giao (nếu có),
  // bằng cách ghi đè CSS custom properties — không cần Tailwind biên dịch lại.
  window.__applyPalette = function(colorKey){
    const palette = PALETTES[colorKey] || PALETTES.blue;
    const root = document.documentElement.style;
    [50,100,200,300,400,500,600,700,800,900].forEach(function(k){
      root.setProperty('--primary-' + k, palette[k]);
    });
    root.setProperty('--char-untyped-border', palette[200]);
    root.setProperty('--char-typed-color', palette[900]);
    root.setProperty('--char-typed-border', palette[600]);
    window.SPARK_COLORS = [palette[500], palette[400], palette[200], palette[600], palette[300]];
  };

  // Được engine gọi mỗi khi học sinh gõ đúng 1 câu (chế độ Sentence)
  window.__persistProgress = async function(idx, percent){
    if(!docRef) return;
    try{
      await updateDoc(docRef, {
        completedIndices: arrayUnion(idx),
        percent: percent,
        updatedAt: Date.now()
      });
    }catch(e){
      console.error('Không lưu được tiến độ:', e);
    }
  };

  (async function boot(){
    if(!taskId){ window.__assignmentLoadError('Không tìm thấy ID bài tập trong đường dẫn.'); return; }
    let snap;
    try{
      snap = await getDoc(docRef);
    }catch(e){
      console.error(e);
      window.__assignmentLoadError('Lỗi kết nối máy chủ. Kiểm tra lại mạng và thử tải lại trang.');
      return;
    }
    if(!snap.exists()){
      window.__assignmentLoadError('Bài tập không tồn tại hoặc đã bị xoá.');
      return;
    }
    const data = snap.data();
    window.__applyPalette(data.colorKey || 'blue');
    const items = (data.vocabList || []).map(function(it){
      return {
        phrase: it.phrase || '',
        meaningVi: it.meaningVi || '',
        sentence: it.sentence || it.phrase || '',
        sentenceVi: it.sentenceVi || it.meaningVi || ''
      };
    });
    window.__assignmentLoaded(data.title || 'Bài tập VocaFlow', items, data.completedIndices || [], data.deadlineAt || null);
  })();
</script>
