                                                <i className="fas fa-file-export"></i> Xuất {selectedExportPages.size > 0 ? selectedExportPages.size + ' trang' : ''}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* HỘP THOẠI CHỌN "Xuất tất cả" hay "Chọn trang cụ thể" khi bấm nút Xuất PDF */}
                    {showExportChoice && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4" onClick={() => setShowExportChoice(false)}>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 animate-modal-pop" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-extrabold text-slate-800 mb-1 flex items-center gap-2">
                                    <i className="fas fa-file-pdf text-emerald-500"></i> Xuất PDF
                                </h3>
                                <p className="text-sm text-slate-500 mb-5">Bạn muốn xuất toàn bộ tài liệu hay chỉ vài trang cụ thể?</p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={handleExportAll} className="w-full px-4 py-3 rounded-2xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold flex items-center gap-3 transition-colors border border-indigo-100">
                                        <i className="fas fa-copy text-lg w-5 text-center"></i> Xuất tất cả ({numPages} trang)
                                    </button>
                                    <button onClick={handleOpenExportPicker} className="w-full px-4 py-3 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold flex items-center gap-3 transition-colors border border-emerald-100">
                                        <i className="fas fa-list-check text-lg w-5 text-center"></i> Chọn trang cụ thể
                                    </button>
                                </div>
                                <button onClick={() => setShowExportChoice(false)} className="w-full mt-4 text-center text-sm font-bold text-slate-400 hover:text-slate-600 py-2">Huỷ</button>
                            </div>
                        </div>
                    )}

                    {/* CHỈ BÁO TIẾN TRÌNH khi đang xuất nhiều trang (chụp ảnh từng trang + ghép PDF) */}
                    {exportProgress && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-7 flex flex-col items-center gap-4">
                                <i className="fas fa-circle-notch fa-spin text-emerald-500 text-3xl"></i>
                                <p className="text-sm font-bold text-slate-700">Đang xuất PDF… ({exportProgress.done}/{exportProgress.total} trang)</p>
                                <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                    <div className="h-full bg-emerald-500 transition-all duration-200" style={{ width: (exportProgress.total > 0 ? (exportProgress.done / exportProgress.total) * 100 : 0) + '%' }}></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT PANE */}
                    <div className="flex-1 h-full relative flex flex-col z-10 overflow-hidden bg-slate-200">
                        
                        {/* TOP HEADER */}
                        {/* QUAN TRỌNG — TÌM ĐÚNG GỐC "control bar bị che mất 1 khúc": không phải do hình
                            dạng bo góc (đã thử sửa nhầm chỗ đó) — mà do khung header này trước đây có
                            chiều cao CỐ ĐỊNH `h-16` (64px). Khi toolbar ở giữa (DRAWING TOOLBAR) wrap
                            xuống 2 dòng (vd bật thêm hàng "Độ dày bút chì"), nội dung cao hơn 64px nhưng
                            khung header vẫn báo cáo layout là ĐÚNG 64px — hàng thứ 2 của toolbar bị tràn
                            ra khỏi đáy header, đè lên/bị che bởi nội dung PDF hoặc panel tra từ (fixed
                            top-24) render ngay bên dưới. Đổi `h-16` (cố định) thành `min-h-16` (tối
                            thiểu 64px, tự giãn thêm khi cần) — header giờ tự cao lên đúng bằng nội dung
                            thật sự, không còn hàng nào bị tràn ra ngoài/bị che nữa. */}
                        <div className="min-h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-20 shadow-sm shrink-0">
                            
                            <div className="flex items-center gap-4 w-1/4">
                                {pdfUrl && (
                                    <button onClick={() => setShowTOC(true)} className="w-10 h-10 flex items-center justify-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl transition-colors border border-indigo-100 shadow-sm" title="Mở mục lục">
                                        <i className="fas fa-list-ul"></i>
                                    </button>
                                )}
                                {pdfUrl && (
                                    <button onClick={() => setShowExportChoice(true)} className="w-10 h-10 flex items-center justify-center bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-xl transition-colors border border-emerald-100 shadow-sm shrink-0" title="Xuất PDF (tất cả hoặc trang đã chọn)">
                                        <i className="fas fa-file-export"></i>
                                    </button>
                                )}
                                <div className="font-extrabold text-xl text-slate-800 tracking-tight truncate flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                        <i className="fas fa-book"></i>
                                    </div>
                                    TÀI LIỆU IELTS
                                </div>

                                {/* NÚT KHOÁ ZOOM — bấm để khoá cứng pinch/double-tap-zoom (tránh lỡ tỳ tay
                                    khi viết trên iPad làm phóng to/thu nhỏ ngoài ý muốn); bấm lại để mở khoá,
                                    zoom hoạt động bình thường. Phóng to/thu nhỏ trang PDF vẫn dùng nút +/- % riêng. */}
                                <button
                                    onClick={() => setZoomLocked(z => !z)}
                                    className={"w-9 h-9 shrink-0 rounded-xl flex items-center justify-center transition-colors border shadow-sm " + (zoomLocked ? 'bg-emerald-500 text-white border-emerald-500 hover:bg-emerald-600' : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50 hover:text-slate-600')}
                                    title={zoomLocked ? 'Đang khoá zoom — bấm để mở lại zoom bình thường' : 'Khoá zoom (chặn pinch/double-tap-zoom khi lỡ tỳ tay lúc viết)'}
                                >
                                    <i className={"fas text-sm " + (zoomLocked ? 'fa-lock' : 'fa-lock-open')}></i>
                                </button>
                            </div>
                            
                            {/* DRAWING TOOLBAR */}
                            {/* QUAN TRỌNG — gọn lại thanh công cụ ("quá nhiều bút, mỗi bút lại kèm theo cả
                                đống tuỳ chọn cỡ nét/kiểu vẽ nhét thẳng vào thanh chính, rất rối mắt"): thanh
                                chính giờ CHỈ còn các nút chọn BÚT + bảng màu — mọi tuỳ chọn riêng của từng
                                bút (cỡ nét, kiểu vẽ, độ ổn định, kiểu tẩy, màu glow...) được gom vào 1 thanh
                                PHỤ nhỏ hiện ngay BÊN DƯỚI, mặc định ẨN, CHỈ hiện khi bấm ĐÚP (double-click)
                                vào đúng nút của bút đó (xem expandedToolOptions/toggleToolOptions) — bấm đúp
                                lại hoặc đổi sang bút khác để ẩn đi. Đổi div bọc ngoài từ hàng ngang
                                (justify-center) sang cột (flex-col) để 2 thanh xếp chồng, vẫn căn giữa. */}
                            <div className="flex-1 flex flex-col items-center justify-center gap-2 min-w-0">
                                {pdfUrl && isDrawingMode && (
                                    // GHI CHÚ: từng thử đổi rounded-full sang bo góc cố định ở đây, nhưng đó không
                                    // phải gốc vấn đề (hình dạng cũ vẫn đẹp) — gốc thật nằm ở header cha bị giới
                                    // hạn chiều cao cứng h-16, xem sửa ở "TOP HEADER" phía trên. Trả lại rounded-full
                                    // như cũ.
                                    <div className="flex items-center flex-wrap justify-center gap-2 bg-slate-50 border border-slate-200 rounded-full px-3 py-1.5 shadow-sm animate-fade-in max-w-full">
                                        <button onClick={() => handleToolButtonClick('pencil')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'pencil' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Bút chì (bấm đúp để xem cỡ nét/kiểu vẽ/độ ổn định)"><i className="fas fa-pencil-alt text-md"></i></button>

                                        <button onClick={() => handleToolButtonClick('magic')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'magic' ? 'bg-amber-100 text-amber-600 shadow-inner' : 'text-amber-500 hover:bg-slate-200 hover:text-amber-600')} title="Bút Thần Kỳ OCR: Quét Chữ & Dịch (bấm đúp để chọn kiểu khoanh vùng)">
                                            <i className="fas fa-wand-magic-sparkles text-md"></i>
                                        </button>

                                        <button onClick={() => setTool('ipa')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'ipa' ? 'bg-sky-100 text-sky-600 shadow-inner' : 'text-sky-500 hover:bg-slate-200 hover:text-sky-600')} title="Bút IPA: Quét chữ, hiện từ vừa quét & mở thẳng Cambridge Dictionary">
                                            <i className="fas fa-spell-check text-md"></i>
                                        </button>

                                        <button onClick={() => setTool('photo')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'photo' ? 'bg-rose-100 text-rose-600 shadow-inner' : 'text-rose-500 hover:bg-slate-200 hover:text-rose-600')} title="Bút tra ảnh minh hoạ: Mở Google Hình ảnh cho chữ vừa quét">
                                            <i className="fas fa-images text-md"></i>
                                        </button>

                                        <button onClick={() => handleToolButtonClick('pen')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'pen' ? 'bg-rose-100 text-rose-600 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Bút Present: nét trắng viền glow màu, tự mờ dần và biến mất sau 1.5 giây — dùng để khoanh/nhấn mạnh tạm thời lúc giảng bài (bấm đúp để chọn màu glow/độ ổn định)"><i className="fas fa-highlighter text-md"></i></button>
                                        <button onClick={() => handleToolButtonClick('text')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'text' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Chèn Text (bấm đúp để chọn cỡ chữ)"><i className="fas fa-font text-md"></i></button>
                                        <button onClick={() => handleToolButtonClick('eraser')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'eraser' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Tẩy nét vẽ (bấm đúp để chọn kiểu tẩy)"><i className="fas fa-eraser text-md"></i></button>

                                        <div className="w-px h-5 bg-slate-300 mx-2"></div>
                                        {/* Bảng màu có sẵn — bấm 1 phát chọn màu ngay, thay cho việc phải mở bảng màu
                                            của hệ điều hành. Ô cuối (icon ống hút) vẫn mở bảng màu tuỳ chỉnh khi cần
                                            màu ngoài 4 màu có sẵn — QUAN TRỌNG: ô này giờ tự đổi màu nền theo ĐÚNG
                                            màu đang chọn (isCustomColorActive) mỗi khi đó là màu tuỳ chỉnh (không
                                            trùng 1 trong các màu có sẵn) — trước đây ô này luôn chỉ là viền chấm chấm
                                            trống, chọn màu xong không có phản hồi thị giác nào là đã áp dụng màu đó. */}
                                        <div className={"flex items-center gap-1.5 bg-white border border-slate-200 rounded-full px-2 py-1 shadow-sm " + ((tool === 'magic' || tool === 'ipa' || tool === 'photo' || tool === 'pen') ? 'opacity-40 pointer-events-none' : '')} title="Chọn màu bút">
                                            {PRESET_COLORS.map(c => (
                                                <button
                                                    key={c}
                                                    type="button"
                                                    onClick={() => setColor(c)}
                                                    className={"w-6 h-6 rounded-full shrink-0 border-2 transition-transform " + (color.toLowerCase() === c.toLowerCase() ? 'border-indigo-400 scale-110' : 'border-white hover:scale-110')}
                                                    style={{ backgroundColor: c }}
                                                    title={c}
                                                ></button>
                                            ))}
                                            <div className="w-px h-5 bg-slate-200 mx-0.5"></div>
                                            {(() => {
                                                const isCustomColorActive = !PRESET_COLORS.some(c => c.toLowerCase() === color.toLowerCase());
                                                return (
                                                    <label
                                                        className={"relative w-6 h-6 rounded-full shrink-0 cursor-pointer border-2 flex items-center justify-center overflow-hidden transition-transform " + (isCustomColorActive ? 'border-indigo-400 scale-110' : 'border-dashed border-slate-300 hover:scale-110')}
                                                        style={isCustomColorActive ? { backgroundColor: color } : {}}
                                                        title={isCustomColorActive ? ('Màu tuỳ chỉnh đang chọn: ' + color) : 'Màu tuỳ chỉnh'}
                                                    >
                                                        <i className={"fas fa-eye-dropper text-[9px] pointer-events-none " + (isCustomColorActive ? 'text-white drop-shadow' : 'text-slate-400')}></i>
                                                        <input type="color" value={color} onChange={(e) => setColor(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Đổi màu" disabled={tool === 'magic' || tool === 'ipa' || tool === 'photo' || tool === 'pen'} />
                                                    </label>
                                                );
                                            })()}
                                        </div>
                                    </div>
                                )}

                                {/* THANH TUỲ CHỌN PHỤ — chỉ hiện khi bấm đúp đúng nút của bút ĐANG chọn (xem
                                    giải thích ở đầu khối "DRAWING TOOLBAR" phía trên). */}
                                {pdfUrl && isDrawingMode && expandedToolOptions === tool && (
                                    <div className="flex items-center flex-wrap justify-center gap-3 bg-white border border-slate-200 rounded-full px-4 py-1.5 shadow-md animate-fade-in max-w-full">
                                        {tool === 'pencil' && (
                                            <React.Fragment>
                                                <div className="flex items-center gap-1" title="Độ dày bút chì">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Cỡ</span>
                                                    {PENCIL_SIZES.map((sz, i) => (
                                                        <button
                                                            key={sz}
                                                            onClick={() => setPencilSize(sz)}
                                                            className={"w-7 h-7 rounded-full flex items-center justify-center transition-colors " + (pencilSize === sz ? 'bg-indigo-100' : 'hover:bg-slate-100')}
                                                            title={['Nhỏ', 'Vừa', 'Lớn'][i]}
                                                        >
                                                            <span
                                                                className={"rounded-full transition-colors " + (pencilSize === sz ? 'bg-indigo-600' : 'bg-slate-400')}
                                                                style={{ width: (6 + i * 4) + 'px', height: (6 + i * 4) + 'px' }}
                                                            ></span>
                                                        </button>
                                                    ))}
                                                </div>
                                                <div className="w-px h-5 bg-slate-200"></div>
                                                <div className="flex items-center gap-1" title="Kiểu vẽ">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Kiểu</span>
                                                    <button onClick={() => setPencilShapeMode('freehand')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (pencilShapeMode === 'freehand' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:bg-slate-100')} title="Tự do (vẽ tay)">
                                                        <i className="fas fa-signature text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setPencilShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (pencilShapeMode === 'rect' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — tiện cho Mac/trackpad)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                                <div className="w-px h-5 bg-slate-200"></div>
                                                <div className="flex items-center gap-1" title="Độ ổn định nét vẽ (làm mượt run tay)">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Ổn định</span>
                                                    {PEN_STABILITY_LEVELS.map((lvl, i) => (
                                                        <button
                                                            key={lvl}
                                                            onClick={() => setPenStability(lvl)}
                                                            className={"px-3 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-colors whitespace-nowrap " + (penStability === lvl ? 'bg-indigo-100 text-indigo-700' : 'text-slate-500 hover:bg-slate-100')}
                                                        >
                                                            {['Tắt', 'Vừa', 'Cao'][i]}
                                                        </button>
                                                    ))}
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {tool === 'pen' && (
                                            <React.Fragment>
                                                <div className="flex items-center gap-1" title="Độ ổn định nét vẽ (làm mượt run tay)">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Ổn định</span>
                                                    {PEN_STABILITY_LEVELS.map((lvl, i) => (
                                                        <button
                                                            key={lvl}
                                                            onClick={() => setPenStability(lvl)}
                                                            className={"px-3 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-colors whitespace-nowrap " + (penStability === lvl ? 'bg-indigo-100 text-indigo-700' : 'text-slate-500 hover:bg-slate-100')}
                                                        >
                                                            {['Tắt', 'Vừa', 'Cao'][i]}
                                                        </button>
                                                    ))}
                                                </div>
                                                <div className="w-px h-5 bg-slate-200"></div>
                                                {/* Màu viền glow — bảng màu đậm có sẵn (PEN_GLOW_COLORS) + 1 ô tuỳ chỉnh
                                                    (eyedropper), cùng kiểu với bảng màu chính — ô tuỳ chỉnh cũng tự đổi
                                                    nền theo màu đang chọn khi đang dùng màu ngoài bảng có sẵn. */}
                                                <div className="flex items-center gap-1.5" title="Màu viền glow">
                                                    <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Glow</span>
                                                    {PEN_GLOW_COLORS.map(c => (
                                                        <button
                                                            key={c}
                                                            type="button"
                                                            onClick={() => setPenGlowColor(c)}
                                                            className={"w-6 h-6 rounded-full shrink-0 border-2 transition-transform " + (penGlowColor.toLowerCase() === c.toLowerCase() ? 'border-indigo-400 scale-110' : 'border-white hover:scale-110')}
                                                            style={{ backgroundColor: c, boxShadow: '0 0 4px ' + c }}
                                                            title={c}
                                                        ></button>
                                                    ))}
                                                    {(() => {
                                                        const isCustomGlowActive = !PEN_GLOW_COLORS.some(c => c.toLowerCase() === penGlowColor.toLowerCase());
                                                        return (
                                                            <label
                                                                className={"relative w-6 h-6 rounded-full shrink-0 cursor-pointer border-2 flex items-center justify-center overflow-hidden transition-transform " + (isCustomGlowActive ? 'border-indigo-400 scale-110' : 'border-dashed border-slate-300 hover:scale-110')}
                                                                style={isCustomGlowActive ? { backgroundColor: penGlowColor } : {}}
                                                                title={isCustomGlowActive ? ('Màu glow tuỳ chỉnh đang chọn: ' + penGlowColor) : 'Màu glow tuỳ chỉnh'}
                                                            >
                                                                <i className={"fas fa-eye-dropper text-[9px] pointer-events-none " + (isCustomGlowActive ? 'text-white drop-shadow' : 'text-slate-400')}></i>
                                                                <input type="color" value={penGlowColor} onChange={(e) => setPenGlowColor(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Đổi màu glow" />
                                                            </label>
                                                        );
                                                    })()}
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {tool === 'eraser' && (
                                            <div className="flex items-center gap-1" title="Kiểu tẩy">
                                                <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Kiểu</span>
                                                <button onClick={() => setEraserShapeMode('point')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (eraserShapeMode === 'point' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:bg-slate-100')} title="Theo điểm (kéo tới đâu tẩy tới đó)">
                                                    <i className="fas fa-hand-pointer text-xs"></i>
                                                </button>
                                                <button onClick={() => setEraserShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (eraserShapeMode === 'rect' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:bg-slate-100')} title="Chọn vùng (kéo-thả hình chữ nhật)">
                                                    <i className="fas fa-vector-square text-xs"></i>
                                                </button>
                                            </div>
                                        )}

                                        {tool === 'magic' && (
                                            <div className="flex items-center gap-1" title="Kiểu khoanh vùng">
                                                <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Kiểu</span>
                                                <button onClick={() => setMagicShapeMode('lasso')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'lasso' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Tự do (vẽ tay)">
                                                    <i className="fas fa-signature text-xs"></i>
                                                </button>
                                                <button onClick={() => setMagicShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'rect' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — tiện cho Mac/trackpad)">
                                                    <i className="fas fa-vector-square text-xs"></i>
                                                </button>
                                            </div>
                                        )}

                                        {tool === 'text' && (
                                            <div className="flex items-center gap-1" title="Kích cỡ chữ Text">
                                                <span className="text-[10px] font-bold text-slate-400 uppercase mr-0.5">Cỡ chữ</span>
                                                <button onClick={() => setFontSize(s => Math.max(8, s - 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-minus text-[10px]"></i></button>
                                                <span className="text-xs font-bold text-slate-700 w-6 text-center">{fontSize}</span>
                                                <button onClick={() => setFontSize(s => Math.min(48, s + 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-plus text-[10px]"></i></button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center justify-end gap-5 w-1/4">
                                <label className="cursor-pointer px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 rounded-xl text-sm font-bold transition-all flex items-center gap-2 border border-slate-200 shadow-sm">
                                    <i className="fas fa-upload text-indigo-500"></i> <span className="hidden sm:inline">Tải sách</span>
                                    <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                </label>

                                {pdfUrl && (
                                    <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-sm">
                                        <button onClick={() => { captureZoomAnchor(getContentAreaCenterY()); setScale(s => Math.max(0.5, s - 0.2)); }} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-minus"></i></button>
                                        <span className="text-sm font-bold text-slate-600 w-12 text-center">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => { captureZoomAnchor(getContentAreaCenterY()); setScale(s => Math.min(3, s + 0.2)); }} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-plus"></i></button>
                                    </div>
                                )}

                                {pdfUrl && (
                                    <button
                                        onClick={() => {
                                            setIsDrawingMode(!isDrawingMode);
                                            if(!isDrawingMode && (tool==='magic' || tool==='ipa' || tool==='photo')) setTool('pencil');
                                            unlockAudio();
                                        }}
                                        className={"px-5 py-2 rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 " + (isDrawingMode ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm')}
                                    >
                                        <i className="fas fa-pen-fancy"></i>
                                        {isDrawingMode ? 'Đóng Note' : 'Bật Note'}
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        {/* PDF CONTENT AREA */}
                        {/* GHI CHÚ: đã thử tắt overflow-anchor (scroll anchoring) ở đây 2 LẦN riêng biệt
                            — cả 2 lần đều làm cuộn TỆ HƠN theo phản hồi thực tế, dù bối cảnh DOM đã khác
                            nhau giữa 2 lần thử. Kết luận: giữ nguyên mặc định (auto) của trình duyệt ở
                            đây, KHÔNG đụng vào nữa — gốc vấn đề nằm ở chỗ khác (xem PdfPage: bỏ re-render
                            thừa mỗi khi 1 trang cũ quay lại vùng nhìn thấy). */}
                        <div ref={pdfContentAreaRef} className="flex-1 overflow-y-auto relative p-6 pb-32 flex flex-col items-center justify-start">
                            
                            {!pdfUrl ? (
                                <div className="flex-1 flex flex-col items-center justify-center p-8 w-full max-w-2xl text-center animate-fade-in">
                                    <div className="w-32 h-32 bg-gradient-to-br from-indigo-50 to-violet-100 rounded-3xl shadow-xl flex items-center justify-center mb-8 border border-slate-100 animate-gentle-bounce">
                                        <i className="fas fa-file-pdf text-6xl text-indigo-500"></i>
                                    </div>
                                    <h2 className="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">Night IELTS Land</h2>
                                    <p className="text-slate-500 mb-10 text-lg leading-relaxed">Hỗ trợ đọc PDF Offline siêu tốc. Trải nghiệm vẽ Zero-latency mượt mà và quét Dịch AI thông minh được thiết kế đặc quyền cho iPad.</p>

                                    <label className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-2xl font-bold cursor-pointer shadow-xl shadow-indigo-200 transition-all transform hover:-translate-y-1 active:scale-95 text-lg flex items-center gap-3">
                                        <i className="fas fa-cloud-upload-alt text-2xl"></i> Chọn Sách PDF từ máy
                                        <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                            ) : (
                                pdfDoc && Array.from(new Array(numPages), (el, index) => (
                                    <PdfPage
                                        key={index + 1}
                                        pageNum={index + 1}
                                        pdf={pdfDoc}
                                        scale={scale}
                                        isDrawingMode={isDrawingMode}
                                        tool={tool}
                                        magicShapeMode={magicShapeMode}
                                        pencilShapeMode={pencilShapeMode}
                                        eraserShapeMode={eraserShapeMode}
                                        penStability={penStability}
                                        penGlowColor={penGlowColor}
                                        pencilSize={pencilSize}
                                        color={color}
                                        fontSize={fontSize}
                                        basePageSize={basePageSize}
                                        onExtractText={onExtractText}
                                        onIPALookup={onIPALookup}
                                        onPhotoLookup={onPhotoLookup}
                                        forceVisible={forcedVisiblePage === index + 1}
                                        onRenderedForExport={handlePageRenderedForExport}
                                    />
                                ))
                            )}
                        </div>

                        {/* THANH ĐIỀU HƯỚNG DẠNG CHẤM DỌC — mặc định ẩn, bấm nút nhỏ ở mép phải để
                            hiện/ẩn. Chỉ hiện khi đã có file PDF và có nhiều hơn 1 trang (1 trang thì
                            thanh này không có tác dụng gì). QUAN TRỌNG: mỗi chấm được định vị bằng
                            % (top tính theo tỉ lệ trang / tổng số trang) thay vì xếp flex bình thường
                            — nhờ vậy dù sách có VÀI TRĂM trang, các chấm vẫn luôn gói gọn đúng trong
                            chiều cao cố định của thanh (không bị tràn/vỡ layout như xếp flex thường
                            sẽ gặp khi số chấm nhân với kích thước tối thiểu vượt quá chiều cao thanh). */}
                        {pdfUrl && numPages > 1 && (
                            <div className="fixed right-3 top-1/2 transform -translate-y-1/2 z-40 flex items-center gap-2">
                                {showPageNav && (
                                    <div
                                        ref={pageNavRailRef}
                                        onPointerDown={handleNavPointerDown}
                                        onPointerMove={handleNavPointerMove}
                                        onPointerUp={handleNavPointerUp}
                                        onPointerCancel={handleNavPointerUp}
                                        className="glass-panel rounded-full shadow-xl border border-slate-200 relative cursor-pointer animate-fade-in touch-none"
                                        style={{ height: 'min(70vh, 640px)', width: '16px' }}
                                        title={`Trang ${currentPageForNav}/${numPages} — kéo hoặc bấm để tới trang`}
                                    >
                                        {Array.from(new Array(numPages), (el, i) => i + 1).map(p => (
                                            <span
                                                key={p}
                                                className={"absolute left-1/2 rounded-full pointer-events-none transition-all " + (p === currentPageForNav ? 'bg-indigo-600' : 'bg-slate-300')}
                                                style={{
                                                    top: (numPages > 1 ? (p - 1) / (numPages - 1) : 0) * 100 + '%',
                                                    transform: 'translate(-50%, -50%)',
                                                    width: p === currentPageForNav ? '7px' : '4px',
                                                    height: p === currentPageForNav ? '7px' : '4px'
                                                }}
                                            ></span>
                                        ))}
                                    </div>
                                )}
                                <button
                                    onClick={() => setShowPageNav(v => !v)}
                                    className={"w-8 h-8 rounded-full flex items-center justify-center shadow-lg border transition-colors " + (showPageNav ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-400 border-slate-200 hover:text-indigo-600')}
                                    title={showPageNav ? 'Ẩn thanh điều hướng trang' : 'Hiện thanh điều hướng trang'}
                                >
                                    <i className="fas fa-grip-lines-vertical text-xs"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
