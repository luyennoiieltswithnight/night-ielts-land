                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) e.preventDefault();
                    lastTouchEnd = now;
                };

                document.addEventListener('gesturestart', onGesture, { passive: false });
                document.addEventListener('gesturechange', onGesture, { passive: false });
                document.addEventListener('gestureend', onGesture, { passive: false });
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });

                return () => {
                    document.removeEventListener('gesturestart', onGesture);
                    document.removeEventListener('gesturechange', onGesture);
                    document.removeEventListener('gestureend', onGesture);
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
            }, [zoomLocked]);

            // useCallback: giữ nguyên "địa chỉ" hàm giữa các lần render, để các PdfPage đã
            // memo hoá (React.memo) không phải render lại toàn bộ mỗi khi App có state khác
            // đổi (vd: đang gõ chữ trong 1 ô note) — giúp phản hồi nhanh & mượt hơn, nhất là
            // với sách PDF nhiều trang trên iPad.
            const handleFileUpload = useCallback((e) => {
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    const objectUrl = URL.createObjectURL(file);
                    setPdfUrl(objectUrl);
                    pdfjsLib.getDocument(objectUrl).promise.then(loadedPdf => {
                        setPdfDoc(loadedPdf);
                        setNumPages(loadedPdf.numPages);
                    }).catch(err => alert("Lỗi khi mở file."));
                }
            }, []);

            const onExtractText = useCallback((text, processing) => {
                setMagicText(text);
                setIsOcrProcessing(processing);
                // Bắt đầu 1 lượt quét mới (processing=true, text rỗng) -> dọn box IPA cũ để
                // không hiển thị nhầm thông tin của từ trước đó trong lúc đang chờ kết quả mới.
                if (processing) setIpaInfo(null);
            }, []);

            // Tra phiên âm (IPA) + từ loại cho bút IPA — chạy song song, không chặn luồng dịch/đọc.
            const onIPALookup = useCallback(async (text) => {
                setIpaInfo({ word: '', phonetic: '', partOfSpeech: '', error: '', loading: true });
                const info = await fetchIPAInfo(text);
                setIpaInfo({ ...info, loading: false });
            }, []);

            // Luôn hiện panel "Mở ảnh trên Google" khi quét được chữ — không phụ thuộc việc popup
            // tự động có bị trình duyệt chặn hay không (xem giải thích ở openPhotoLookupWindow).
            const onPhotoLookup = useCallback((text) => {
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setPhotoLookup(null);
                    return;
                }
                setPhotoLookup({ text: clean });
            }, []);

            return (
                <div
                    className="flex h-screen w-full font-sans bg-slate-100 overflow-hidden"
                >
                    {/* Box dịch: giữ NGUYÊN vị trí canh giữa màn hình như trước — không bao giờ bị
                        box IPA làm xê dịch, vì box IPA được định vị ĐỘC LẬP (không ghép flex chung). */}
                    <MagicTranslationBar text={magicText} isProcessing={isOcrProcessing} onClose={() => { setMagicText(""); setIsOcrProcessing(false); setIpaInfo(null); }} />

                    {/* Box IPA: định vị riêng, bám sát ngay mép trái của box dịch bằng calc() — box
                        dịch không hề hay biết sự tồn tại của box này nên không bao giờ bị lệch. */}
                    {ipaInfo && (magicText || isOcrProcessing) && (
                        <div
                            className="fixed top-24 z-[100] hidden sm:block animate-slide-down"
                            style={{ right: 'calc(50% + min(45vw, 24rem) + 12px)' }}
                        >
                            <IPAPanel info={ipaInfo} onClose={() => setIpaInfo(null)} />
                        </div>
                    )}

                    {/* Thông báo/nút mở kết quả ảnh minh hoạ cho bút Tra ảnh — luôn hiện ra khi có
                        chữ vừa quét, để KHÔNG phụ thuộc vào việc trình duyệt có chặn popup hay không:
                        bấm nút là mở tab/cửa sổ Google Hình ảnh thật, chắc chắn không bị chặn vì đó
                        là 1 cú bấm chuột/chạm thật của người dùng. */}
                    {photoLookup && (
                        <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[100] glass-panel rounded-2xl shadow-2xl border-2 border-rose-100 px-5 py-3 flex items-center gap-4 animate-slide-down max-w-[92%]">
                            <i className="fas fa-images text-rose-500 text-xl shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Đã quét được</p>
                                <p className="text-sm font-bold text-slate-800 truncate max-w-[220px]">{photoLookup.text}</p>
                            </div>
                            <button
                                onClick={() => { window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(photoLookup.text), '_blank'); }}
                                className="shrink-0 px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 shadow-md shadow-rose-200"
                            >
                                <i className="fas fa-up-right-from-square"></i> Mở ảnh trên Google
                            </button>
                            <button onClick={() => setPhotoLookup(null)} className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors bg-white border border-slate-200">
                                <i className="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    )}

                    {/* FLOATING WINDOW: MỤC LỤC TRANG DẠNG GRID */}
                    {showTOC && pdfDoc && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 sm:p-8" onClick={() => setShowTOC(false)}>
                            <div className="bg-slate-100 rounded-3xl shadow-2xl w-full max-w-5xl max-h-full flex flex-col overflow-hidden animate-modal-pop" onClick={e => e.stopPropagation()}>
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-white shadow-sm z-10">
                                    <h3 className="text-xl font-extrabold text-slate-800 tracking-tight">
                                        <i className="fas fa-th-large text-indigo-500 mr-3"></i> Chọn trang nhanh
                                    </h3>
                                    <button onClick={() => setShowTOC(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-red-500 hover:text-white flex items-center justify-center transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1 pb-10">
                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-6">
                                        {Array.from(new Array(numPages), (el, index) => (
                                            <PdfThumbnail 
                                                key={index} 
                                                pdf={pdfDoc} 
                                                pageNum={index + 1} 
                                                onClick={() => {
                                                    const el = document.getElementById(`pdf-page-${index + 1}`);
                                                    if(el) el.scrollIntoView({behavior: 'smooth'});
                                                    setShowTOC(false);
                                                }}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT PANE */}
                    <div className="flex-1 h-full relative flex flex-col z-10 overflow-hidden bg-slate-200">
                        
                        {/* TOP HEADER */}
                        <div className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-20 shadow-sm shrink-0">
                            
                            <div className="flex items-center gap-4 w-1/4">
                                {pdfUrl && (
                                    <button onClick={() => setShowTOC(true)} className="w-10 h-10 flex items-center justify-center bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl transition-colors border border-indigo-100 shadow-sm" title="Mở mục lục">
                                        <i className="fas fa-list-ul"></i>
                                    </button>
                                )}
                                <div className="font-extrabold text-xl text-slate-800 tracking-tight truncate flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                        <i className="fas fa-book"></i>
                                    </div>
                                    TÀI LIỆU IELTS
                                </div>

                                {/* NÚT KHOÁ ZOOM — bấm để khoá cứng pinch/double-tap-zoom (tránh lỡ tỳ tay
                                    khi viết trên iPad làm phóng to/thu nhỏ ngoài ý muốn); bấm lại để mở khoá,
                                    zoom hoạt động bình thường. Phóng to/thu nhỏ trang PDF vẫn dùng nút +/- % riêng. */}
                                <button
                                    onClick={() => setZoomLocked(z => !z)}
                                    className={"w-9 h-9 shrink-0 rounded-xl flex items-center justify-center transition-colors border shadow-sm " + (zoomLocked ? 'bg-emerald-500 text-white border-emerald-500 hover:bg-emerald-600' : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50 hover:text-slate-600')}
                                    title={zoomLocked ? 'Đang khoá zoom — bấm để mở lại zoom bình thường' : 'Khoá zoom (chặn pinch/double-tap-zoom khi lỡ tỳ tay lúc viết)'}
                                >
                                    <i className={"fas text-sm " + (zoomLocked ? 'fa-lock' : 'fa-lock-open')}></i>
                                </button>
                            </div>
                            
                            {/* DRAWING TOOLBAR */}
                            <div className="flex-1 flex justify-center">
                                {pdfUrl && isDrawingMode && (
                                    <div className="flex items-center flex-wrap justify-center gap-2 bg-slate-50 border border-slate-200 rounded-full px-3 py-1.5 shadow-sm animate-fade-in max-w-full">
                                        <button onClick={() => setTool('pencil')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'pencil' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Bút chì"><i className="fas fa-pencil-alt text-md"></i></button>

                                        <button onClick={() => setTool('magic')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'magic' ? 'bg-amber-100 text-amber-600 shadow-inner' : 'text-amber-500 hover:bg-slate-200 hover:text-amber-600')} title="Bút Thần Kỳ OCR: Quét Chữ & Dịch">
                                            <i className="fas fa-wand-magic-sparkles text-md"></i>
                                        </button>

                                        <button onClick={() => setTool('ipa')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'ipa' ? 'bg-sky-100 text-sky-600 shadow-inner' : 'text-sky-500 hover:bg-slate-200 hover:text-sky-600')} title="Bút IPA: Quét chữ để tra phiên âm & từ loại">
                                            <i className="fas fa-spell-check text-md"></i>
                                        </button>

                                        <button onClick={() => setTool('photo')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-all " + (tool === 'photo' ? 'bg-rose-100 text-rose-600 shadow-inner' : 'text-rose-500 hover:bg-slate-200 hover:text-rose-600')} title="Bút tra ảnh minh hoạ: Mở Google Hình ảnh cho chữ vừa quét">
                                            <i className="fas fa-images text-md"></i>
                                        </button>

                                        <button onClick={() => setTool('pen')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'pen' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Bút bi"><i className="fas fa-pen-nib text-md"></i></button>
                                        <button onClick={() => setTool('text')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'text' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Chèn Text"><i className="fas fa-font text-md"></i></button>
                                        <button onClick={() => setTool('eraser')} className={"w-10 h-10 rounded-full flex items-center justify-center transition-colors " + (tool === 'eraser' ? 'bg-indigo-100 text-indigo-700 shadow-inner' : 'text-slate-500 hover:bg-slate-200 hover:text-slate-700')} title="Tẩy nét vẽ"><i className="fas fa-eraser text-md"></i></button>

                                        <div className="w-px h-5 bg-slate-300 mx-2"></div>
                                        <input type="color" value={color} onChange={(e) => setColor(e.target.value)} className="w-8 h-8 rounded-full cursor-pointer border-2 border-white shadow-sm p-0" title="Đổi màu" disabled={tool === 'magic' || tool === 'ipa' || tool === 'photo'} />

                                        {/* Chọn kiểu khoanh vùng cho bút Magic: Tự do (freehand) hoặc Hình chữ nhật (kéo-thả, tiện cho Mac/trackpad) */}
                                        {tool === 'magic' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-0.5 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kiểu khoanh vùng">
                                                    <button onClick={() => setMagicShapeMode('lasso')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'lasso' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Tự do (vẽ tay)">
                                                        <i className="fas fa-signature text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setMagicShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'rect' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — tiện cho Mac/trackpad)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {/* Kích thước chữ Text */}
                                        {tool === 'text' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kích cỡ chữ Text">
                                                    <button onClick={() => setFontSize(s => Math.max(8, s - 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-minus text-[10px]"></i></button>
                                                    <span className="text-xs font-bold text-slate-700 w-6 text-center">{fontSize}</span>
                                                    <button onClick={() => setFontSize(s => Math.min(48, s + 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-plus text-[10px]"></i></button>
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {/* Gợi ý cách dùng bút IPA / tra ảnh: giờ cả 2 bút đều chọn vùng bằng cách
                                            KÉO-THẢ 1 Ô CHỮ NHẬT quanh đúng chữ cần (giống bút Magic ở chế độ hình
                                            chữ nhật) thay vì kiểu bút highlight quét ngang trước đây. */}
                                        {(tool === 'ipa' || tool === 'photo') && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <span className="text-[11px] font-semibold text-slate-400 px-1 flex items-center gap-1.5 whitespace-nowrap">
                                                    <i className="fas fa-vector-square text-[10px]"></i> Kéo-thả ô chữ nhật quanh chữ cần chọn
                                                </span>
                                            </React.Fragment>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center justify-end gap-5 w-1/4">
                                <label className="cursor-pointer px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 rounded-xl text-sm font-bold transition-all flex items-center gap-2 border border-slate-200 shadow-sm">
                                    <i className="fas fa-upload text-indigo-500"></i> <span className="hidden sm:inline">Tải sách</span>
                                    <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                </label>

                                {pdfUrl && (
                                    <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-sm">
                                        <button onClick={() => setScale(s => Math.max(0.5, s - 0.2))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-minus"></i></button>
                                        <span className="text-sm font-bold text-slate-600 w-12 text-center">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => setScale(s => Math.min(3, s + 0.2))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-plus"></i></button>
                                    </div>
                                )}

                                {pdfUrl && (
                                    <button
                                        onClick={() => {
                                            setIsDrawingMode(!isDrawingMode);
                                            if(!isDrawingMode && (tool==='magic' || tool==='ipa' || tool==='photo')) setTool('pencil');
                                            unlockAudio();
                                        }}
                                        className={"px-5 py-2 rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 " + (isDrawingMode ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm')}
                                    >
                                        <i className="fas fa-pen-fancy"></i>
                                        {isDrawingMode ? 'Đóng Note' : 'Bật Note'}
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        {/* PDF CONTENT AREA */}
                        <div className="flex-1 overflow-y-auto relative p-6 pb-32 flex flex-col items-center justify-start">
                            
                            {!pdfUrl ? (
                                <div className="flex-1 flex flex-col items-center justify-center p-8 w-full max-w-2xl text-center animate-fade-in">
                                    <div className="w-32 h-32 bg-gradient-to-br from-indigo-50 to-violet-100 rounded-3xl shadow-xl flex items-center justify-center mb-8 border border-slate-100 animate-gentle-bounce">
                                        <i className="fas fa-file-pdf text-6xl text-indigo-500"></i>
                                    </div>
                                    <h2 className="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">Night IELTS Land</h2>
                                    <p className="text-slate-500 mb-10 text-lg leading-relaxed">Hỗ trợ đọc PDF Offline siêu tốc. Trải nghiệm vẽ Zero-latency mượt mà và quét Dịch AI thông minh được thiết kế đặc quyền cho iPad.</p>

                                    <label className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-2xl font-bold cursor-pointer shadow-xl shadow-indigo-200 transition-all transform hover:-translate-y-1 active:scale-95 text-lg flex items-center gap-3">
                                        <i className="fas fa-cloud-upload-alt text-2xl"></i> Chọn Sách PDF từ máy
                                        <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                            ) : (
                                pdfDoc && Array.from(new Array(numPages), (el, index) => (
                                    <PdfPage
                                        key={index + 1}
                                        pageNum={index + 1}
                                        pdf={pdfDoc}
                                        scale={scale}
                                        isDrawingMode={isDrawingMode}
                                        tool={tool}
                                        magicShapeMode={magicShapeMode}
                                        highlightThickness={highlightThickness}
                                        color={color}
                                        fontSize={fontSize}
                                        onExtractText={onExtractText}
                                        onIPALookup={onIPALookup}
                                        onPhotoLookup={onPhotoLookup}
                                    />
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
