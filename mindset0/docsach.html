                // không chặn popup, mà không còn làm gián đoạn thao tác kéo nữa.

                isDrawingRef.current = true;

                // Chế độ khoanh vùng "Hình chữ nhật" (kéo-thả): bút Magic khi bật chế độ hình chữ
                // nhật (tiện dùng chuột/trackpad trên Mac), LUÔN LUÔN với bút IPA / tra ảnh (2 bút
                // này giờ chỉ còn 1 cơ chế chọn vùng duy nhất — kéo-thả ô chữ nhật — thay cho kiểu bút
                // highlight quét ngang trước đây, để chọn trúng khít đúng phần chữ cần, không mất nét),
                // và giờ thêm cả bút chì khi bật chế độ "Hình chữ nhật" (pencilShapeMode) — dùng
                // CHUNG code vẽ khung chữ nhật này, chỉ khác ở bước lưu strokeRef không phục vụ OCR.
                if ((tool === 'magic' && magicShapeMode === 'rect') || tool === 'ipa' || tool === 'photo' || (tool === 'pencil' && pencilShapeMode === 'rect')) {
                    currentStrokeRef.current = { id: Date.now(), tool, color, shape: 'rect', points: [coords, coords] };
                    return;
                }

                currentStrokeRef.current = { id: Date.now(), tool, color, points: [coords] };
                // "Bút Present": lưu kèm màu glow ĐANG CHỌN vào chính nét này — mỗi nét nhớ đúng màu
                // lúc vẽ, đổi penGlowColor sau đó không ảnh hưởng ngược lại các nét cũ đã vẽ.
                if (tool === 'pen') currentStrokeRef.current.glowColor = penGlowColor;
                // Reset điểm "mượt hoá" (xem penStability/handlePointerMove) về đúng điểm bắt đầu nét —
                // để nét mới luôn bắt đầu chính xác tại điểm đặt bút, không bị mượt hoá kéo lệch đi.
                smoothedPointRef.current = coords;

                // QUAN TRỌNG — nguồn thứ 2 gây "viết vài nét là đứng màn hình iPad": trước đây MỖI
                // LẦN pointermove đều gọi lại applyToolStyle() (gán strokeStyle/lineWidth/globalAlpha
                // + cấp phát mảng mới cho setLineDash) dù các giá trị này KHÔNG hề đổi trong suốt 1
                // nét vẽ (chỉ phụ thuộc tool/color/scale — cố định từ lúc đặt bút xuống). Với tần suất
                // sự kiện cao của Apple Pencil, việc gán lại y hệt hàng trăm lần/giây vẫn tốn CPU và
                // cấp phát bộ nhớ (garbage) không cần thiết, cộng dồn với việc reflow ở trên càng dễ
                // làm nghẽn luồng chính. Giờ set style CHỈ 1 LẦN DUY NHẤT ngay khi đặt bút xuống (TRỪ
                // "Bút Present" — luôn cần vẽ 2 lượt glow+lõi nên strokePenTwoPass tự set style riêng
                // mỗi lần, xem handlePointerMove) — context canvas tự giữ nguyên các thuộc tính này cho
                // các lệnh stroke() tiếp theo, không cần (và không nên) gán lại mỗi lần di chuyển.
                const ctx = drawCanvasRef.current.getContext('2d');
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(coords.x * scale, coords.y * scale);
                ctx.lineTo(coords.x * scale, coords.y * scale);
                if (tool === 'pen') {
                    strokePenTwoPass(ctx, scale, pencilSize, penGlowColor, 1);
                } else {
                    applyToolStyle(ctx, tool, color, scale, pencilSize);
                    ctx.stroke();
                }
            };

            const handlePointerMove = (e) => {
                if (!isDrawingRef.current) return;
                if (e.pointerType === 'touch') return;

                const coords = getCoordinates(e);

                // Chế độ tẩy "Chọn vùng": cập nhật góc đối diện của khung xem trước, giống hệt cơ chế
                // kéo-thả của bút Magic/IPA/tra ảnh — phải kiểm tra TRƯỚC nhánh tẩy theo điểm bên dưới.
                if (tool === 'eraser' && eraserShapeMode === 'rect') {
                    if (!currentStrokeRef.current) return;
                    currentStrokeRef.current.points[1] = coords;
                    redrawStrokes();
                    return;
                }

                if (tool === 'eraser') {
                    handleErase(coords.x, coords.y);
                    return;
                }

                if (!currentStrokeRef.current) return;

                if ((tool === 'magic' && magicShapeMode === 'rect') || tool === 'ipa' || tool === 'photo' || (tool === 'pencil' && pencilShapeMode === 'rect')) {
                    // Cập nhật góc đối diện của khung chữ nhật và vẽ lại toàn bộ canvas — chi phí
                    // rẻ vì số nét lưu trên 1 trang thường ít, vẫn mượt ở cả Mac lẫn iPad.
                    currentStrokeRef.current.points[1] = coords;
                    redrawStrokes();
                    return;
                }

                const canvas = drawCanvasRef.current;
                if (!canvas) return;

                // QUAN TRỌNG — "Độ ổn định nét vẽ" (penStability, 0 = tắt hẳn = giữ NGUYÊN hành vi cũ):
                // làm mượt điểm chạm thô bằng bộ lọc trung bình trượt theo cấp số nhân (EMA) trước khi
                // lưu/vẽ — điểm vẽ ra sẽ "đuổi theo" điểm chạm thật với 1 độ trễ nhỏ, giúp khử rung tay/
                // Apple Pencil, nét viết mượt và tròn trịa hơn. penStability càng cao thì điểm vẽ càng
                // "bám" chậm theo tay hơn (mượt hơn nhưng trễ hơn 1 chút) — đánh đổi hợp lý, y hệt thanh
                // trượt "ổn định nét bút" ở các app vẽ chuyên nghiệp (Procreate, Photoshop...).
                let point = coords;
                if (penStability > 0) {
                    const prevSmoothed = smoothedPointRef.current || coords;
                    const factor = 1 - penStability;
                    point = { x: prevSmoothed.x + (coords.x - prevSmoothed.x) * factor, y: prevSmoothed.y + (coords.y - prevSmoothed.y) * factor };
                    smoothedPointRef.current = point;
                }

                const lastPoint = currentStrokeRef.current.points[currentStrokeRef.current.points.length - 1];
                currentStrokeRef.current.points.push(point);

                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(lastPoint.x * scale, lastPoint.y * scale);
                ctx.lineTo(point.x * scale, point.y * scale);
                if (tool === 'pen') {
                    // "Bút Present" cần set lại style riêng mỗi đoạn (glow + lõi, 2 lượt stroke()) —
                    // không dùng được tối ưu "set style 1 lần" vì bản chất luôn cần 2 kiểu style khác
                    // nhau cho cùng 1 đoạn.
                    strokePenTwoPass(ctx, scale, pencilSize, currentStrokeRef.current.glowColor, 1);
                } else {
                    // Style đã được set 1 lần lúc pointerDown — không gọi lại applyToolStyle() ở đây
                    // nữa (xem giải thích chi tiết ở handlePointerDown), chỉ còn vẽ đoạn nối ngắn.
                    ctx.stroke();
                }
            };

            const handlePointerUp = (e) => {
                if (!isDrawingRef.current) return;
                isDrawingRef.current = false;

                try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}

                // Chế độ tẩy "Chọn vùng": đã đủ 2 góc khung chọn — xoá mọi nét có ÍT NHẤT 1 điểm rơi
                // vào trong khung đó (cùng logic với tẩy theo bán kính ở handleErase, chỉ đổi điều
                // kiện "khoảng cách < bán kính" thành "nằm trong hình chữ nhật đã kéo").
                if (tool === 'eraser' && eraserShapeMode === 'rect' && currentStrokeRef.current) {
                    const [p1, p2] = currentStrokeRef.current.points;
                    const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
                    const minY = Math.min(p1.y, p2.y), maxY = Math.max(p1.y, p2.y);
                    currentStrokeRef.current = null;
                    setStrokes(prev => prev.filter(stroke => {
                        for (let pt of stroke.points) {
                            if (pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY) return false;
                        }
                        return true;
                    }));
                    setTimeout(() => redrawStrokes(), 0);
                    return;
                }

                if (!currentStrokeRef.current || tool === 'eraser') return;

                if (tool === 'magic') {
                    if (magicShapeMode === 'rect') {
                        const [p1, p2] = currentStrokeRef.current.points;
                        currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    }
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    performMagicOCR(strokeToOCR);
                    return;
                }

                if (tool === 'ipa') {
                    // Kéo-thả ô chữ nhật (giống bút Magic ở chế độ hình chữ nhật) — chọn trúng khít
                    // đúng vùng chữ cần tra, không còn cần "phình" nét như kiểu bút highlight cũ nữa.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup — vẫn là 1 cử chỉ chạm/bấm thật, trình duyệt
                    // không chặn) SAU KHI cú kéo đã xong, để không làm gián đoạn thao tác kéo-thả.
                    const popupWin = openIPALookupWindow();
                    performIPAOCR(strokeToOCR, popupWin);
                    return;
                }

                if (tool === 'photo') {
                    // Kéo-thả ô chữ nhật — cùng cơ chế với bút IPA/Magic ở trên.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup), sau khi cú kéo đã xong — xem giải thích chi
                    // tiết ở nhánh 'ipa' phía trên.
                    const popupWin = openPhotoLookupWindow();
                    performPhotoOCR(strokeToOCR, popupWin);
                    return;
                }

                // Bút chì / bút bi (Present) / bút chì hình chữ nhật: lưu nét vẽ như bình thường —
                // currentStrokeRef.current đã đúng hình dạng sẵn, không cần thêm gì, TRỪ bút Present
                // (tool 'pen') cần đánh dấu thêm createdAt để hiệu ứng tự mờ dần sau 3 giây hoạt động
                // (xem TOOL_STYLES.pen.fade + drawLine + effect "hiệu ứng mờ dần" phía trên).
                const strokeToSave = { ...currentStrokeRef.current };
                if (tool === 'pen') strokeToSave.createdAt = Date.now();
                setStrokes(prev => [...prev, strokeToSave]);
                currentStrokeRef.current = null;
                smoothedPointRef.current = null;
            };

            const handleErase = (x, y) => {
                const eraseRadius = 15;
                setStrokes(prev => prev.filter(stroke => {
                    for (let pt of stroke.points) {
                        if (Math.hypot(pt.x - x, pt.y - y) < eraseRadius) return false;
                    }
                    return true;
                }));
                setTimeout(() => redrawStrokes(), 0);
            };

            // --- LÕI OCR DÙNG CHUNG CHO CẢ 3 BÚT (Magic / IPA / Tra ảnh) ---
            // Gộp về 1 chỗ để chắc chắn cả 3 bút hoạt động ổn định như nhau, tránh lặp code.
            const getStrokeBounds = (stroke) => {
                if (!viewport || !stroke || !stroke.points || stroke.points.length < 3) return null;
                const xs = stroke.points.map(p => p.x * scale);
                const ys = stroke.points.map(p => p.y * scale);
                const minX = Math.min(...xs), maxX = Math.max(...xs);
                const minY = Math.min(...ys), maxY = Math.max(...ys);
                const width = maxX - minX, height = maxY - minY;
                if (width < 10 || height < 10) return null;
                return { xs, ys, minX, minY, width, height };
            };

            const runOCROnBounds = async (bounds) => {
                try {
                    const canvas = canvasRef.current;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = bounds.width;
                    tempCanvas.height = bounds.height;
                    const tempCtx = tempCanvas.getContext('2d');

                    tempCtx.fillStyle = 'white';
                    tempCtx.fillRect(0, 0, bounds.width, bounds.height);

                    tempCtx.beginPath();
                    tempCtx.moveTo(bounds.xs[0] - bounds.minX, bounds.ys[0] - bounds.minY);
                    for (let i = 1; i < bounds.xs.length; i++) {
                        tempCtx.lineTo(bounds.xs[i] - bounds.minX, bounds.ys[i] - bounds.minY);
                    }
                    tempCtx.closePath();
                    tempCtx.clip();

                    tempCtx.drawImage(canvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);

                    const imageDataUrl = tempCanvas.toDataURL('image/png');
                    const result = await Tesseract.recognize(imageDataUrl, 'eng');
                    const text = result.data.text.replace(/\n/g, ' ').trim();
                    return text.length > 0 ? text : "Không tìm thấy chữ trong vùng chọn.";
                } catch (err) {
                    console.error("OCR Error:", err);
                    return "Lỗi nhận diện chữ.";
                }
            };

            const performMagicOCR = async (stroke) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) return;
                onExtractText("", true);
                const text = await runOCROnBounds(bounds);
                onExtractText(text, false);
            };

            const performIPAOCR = async (stroke, popupWin) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) {
                    if (popupWin && !popupWin.closed) { try { popupWin.close(); } catch (e) {} }
                    return;
                }
                onExtractText("", true);
                const text = await runOCROnBounds(bounds);
                onExtractText(text, false);
                if (text !== "Không tìm thấy chữ trong vùng chọn." && text !== "Lỗi nhận diện chữ." && onIPALookup) {
                    onIPALookup(text);
                }
                // Thử điều hướng popup Cambridge Dictionary đã mở sẵn (best effort — nếu bị chặn thì
                // nút "Mở Cambridge Dictionary" trong box IPA vẫn chắc chắn hoạt động).
                navigateIPALookupWindow(popupWin, extractFirstWord(text));
            };

            const performPhotoOCR = async (stroke, popupWin) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) {
                    if (popupWin && !popupWin.closed) { try { popupWin.close(); } catch (e) {} }
                    return;
                }
                const text = await runOCROnBounds(bounds);
                // Thử điều hướng popup đã mở sẵn (nếu trình duyệt không chặn) — best effort.
                navigatePhotoLookupWindow(popupWin, text);
                // LUÔN báo về App để hiện nút "Mở ảnh trên Google" — cách này chắc chắn hoạt động
                // dù popup tự động có bị chặn hay không, vì bấm nút là 1 cú chạm/bấm thật.
                if (onPhotoLookup) onPhotoLookup(text);
            };

            const updateText = (id, newProps) => {
                setTexts(prev => prev.map(t => t.id === id ? newProps : t));
            };

            const removeText = (id) => {
                setTexts(prev => prev.filter(t => t.id !== id));
            };

            return (
                <div id={`pdf-page-${pageNum}`} ref={containerRef} className="pdf-page-container" style={
                    // QUAN TRỌNG — sửa dứt điểm lỗi "cuộn giật/nhảy trang", "bấm mục lục đến sai trang",
                    // "có text box thì cuộn bị nhảy giật": trước đây khung TRANG luôn đổi từ kích thước
                    // ước lượng (basePageSize) SANG kích thước thật (viewport) đúng lúc trang đó vừa
                    // render xong — dù đã ước lượng khá sát, việc ĐỔI kích thước này (dù chỉ 1 lần/trang)
                    // vẫn là 1 lần reflow thật, và khi nhiều trang cùng đổi gần như đồng thời lúc cuộn
                    // nhanh, các lần reflow dồn lại làm view "nhảy" xa hơn hẳn thao tác cuộn thật của
                    // người dùng — cũng chính là lý do trình duyệt tự "kéo" lại về gần ô đang có focus
                    // (text box) mỗi khi có reflow ở ngay phía trên nó. Giờ ưu tiên basePageSize LUÔN
                    // LUÔN (một khi đã có — chỉ mất đúng 1 lần load ngay khi mở file) làm kích thước
                    // DUY NHẤT và CỐ ĐỊNH cho MỌI trang, không đổi sang viewport riêng của từng trang
                    // nữa — vì tuyệt đại đa số PDF có mọi trang cùng kích thước nên basePageSize vốn dĩ
                    // đã khớp chính xác, và giờ khung trang không còn đổi kích thước lần nào sau khi
                    // mount nữa => không còn nguồn gây reflow/nhảy cuộn nào từ việc này nữa.
                    basePageSize
                        ? { width: basePageSize.width * scale, height: basePageSize.height * scale }
                        : (viewport
                            ? { width: viewport.width, height: viewport.height }
                            : { width: '100%', minHeight: (1131 * scale) + 'px' })
                }>
                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC "cuộn lùi nhảy vọt lên trang đầu": trước đây 2 canvas
                        + spinner tuy đã được mount sẵn cố định (không unmount nữa), nhưng vẫn ẩn/hiện
                        bằng CSS `display: none/block`. `display` đổi qua lại nghĩa là phần tử bị GỠ hẳn
                        khỏi/rồi CHÈN LẠI vào Layout Tree (cây bố cục) — mỗi lần cuộn lùi qua nhiều trang
                        đã từng hiện ra trước đó, hàng loạt canvas cùng lúc chuyển từ none -> block, cây
                        bố cục bị coi như "vừa có nội dung mới chèn vào phía trên", khiến cơ chế "scroll
                        anchoring" của trình duyệt (vốn dùng để tự bù cuộn khi có nội dung thật sự bị
                        chèn/xoá phía trên) hiểu lầm và tự ý bù vị trí cuộn — đúng kiểu jump đột ngột (không
                        tăng dần như quán tính) mà không hề liên quan gì tới lực lướt hay tốc độ wheel cả.
                        Sửa: đổi hẳn sang `visibility: hidden/visible` thay cho `display` — visibility
                        vẫn ẩn hoàn toàn hình ảnh (không tốn công vẽ) và vẫn tự động không nhận sự kiện
                        chuột/bút khi ẩn (giống display:none), NHƯNG không hề đụng tới Layout Tree — phần
                        tử vẫn luôn ở đó, chỉ đổi trạng thái hiển thị, nên trình duyệt không còn lý do gì
                        để "giật mình" bù cuộn nữa. */}
                    <canvas ref={canvasRef} className="pdf-canvas" style={{ visibility: isVisible ? 'visible' : 'hidden' }} />
                    <canvas
                        ref={drawCanvasRef}
                        className="draw-canvas cursor-crosshair"
                        style={{ visibility: isVisible ? 'visible' : 'hidden', pointerEvents: isDrawingMode ? 'auto' : 'none' }}
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerCancel={handlePointerUp}
                        onPointerOut={handlePointerUp}
                    />
                    <div
                        className="absolute inset-0 w-full h-full flex items-center justify-center bg-slate-50 text-slate-300 pointer-events-none"
                        style={{ visibility: isVisible ? 'hidden' : 'visible' }}
                    >
                        <i className="fas fa-circle-notch fa-spin text-4xl"></i>
                    </div>

                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC lỗi "cuộn (đặc biệt lùi về trang trước) bị nhảy
                        vọt tới 1 vị trí xa lạ, không liên quan gì tới tốc độ lướt": Text Box trước đây
                        nằm CHUNG trong khối chỉ render khi isVisible — nghĩa là mỗi khi 1 trang cuộn ra
                        khỏi rồi quay lại vùng đệm (rất hay xảy ra khi cuộn qua lại nhiều), TOÀN BỘ text
                        box trên trang đó bị HUỶ rồi TẠO MỚI lại từ đầu. PdfTextBox có state "active"
                        khởi tạo mặc định = true kèm useEffect tự gọi textareaRef.focus() ngay khi mount
                        — nghĩa là mỗi lần "tạo mới lại" như vậy, ô textarea đó lại được focus() lại 1
                        lần nữa, và trình duyệt sẽ TỰ ĐỘNG cuộn tới đúng vị trí ô đang được focus đó —
                        đây mới là nguyên nhân thật của cú "nhảy" (không phải do quán tính cuộn hay do
                        reflow kích thước trang). Giờ Text Box được tách ra render LUÔN LUÔN, không phụ
                        thuộc isVisible nữa — chỉ mất đúng 1 lần mount/focus duy nhất lúc thật sự tạo
                        note mới, không bao giờ tự mount lại (nên không bao giờ tự focus lại) chỉ vì
                        cuộn qua cuộn lại nữa. */}
                    {texts.map(t => (
                        <PdfTextBox
                            key={t.id}
                            t={t}
                            scale={scale}
                            updateText={updateText}
                            removeText={removeText}
                        />
                    ))}
                </div>
            );
        });

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [pdfUrl, setPdfUrl] = useState(null);
            const [pdfDoc, setPdfDoc] = useState(null);
            const [numPages, setNumPages] = useState(0);
            const [scale, setScale] = useState(1.2);
            // QUAN TRỌNG — sửa lỗi "cuộn bị giật/nhảy qua nhiều trang": trước đây, TRƯỚC KHI 1 trang
            // kịp render, khung chứa của nó dùng 1 chiều cao ƯỚC LƯỢNG cố định (1131px * scale) làm
            // placeholder. Với sách có kích thước trang khác con số đó (rất phổ biến), ngay khi trang
            // render xong và đổi sang chiều cao THẬT, khung sẽ đổi kích thước đột ngột — đẩy lệch toàn
            // bộ các trang bên dưới, khiến vị trí cuộn hiện tại bị "nhảy" theo, càng rõ khi cuộn nhanh
            // qua nhiều trang chưa kịp render (mỗi trang đổi kích thước là 1 lần giật). Giờ lấy kích
            // thước THẬT của trang 1 (chỉ 1 lần, ngay sau khi mở file — rất nhẹ, không phải render)
            // rồi dùng chung cho placeholder của MỌI trang: vì tuyệt đại đa số PDF có các trang cùng
            // kích thước, placeholder sẽ khớp gần như chính xác kích thước thật ngay từ đầu, không còn
            // phải "nhảy" khi trang render xong nữa.
            const [basePageSize, setBasePageSize] = useState(null); // { width, height } ở scale 1
            
            const [isDrawingMode, setIsDrawingMode] = useState(false);
            const [tool, setTool] = useState('pencil');
            // Mặc định ưu tiên "Hình chữ nhật" (kéo-thả) cho bút Magic — nhanh/tiện hơn cho đa số
            // trường hợp quét chữ; vẫn có thể đổi sang "Tự do" (vẽ tay/khoanh vùng bất kỳ) qua nút
            // chọn kiểu khoanh vùng trên thanh công cụ khi cần.
            const [magicShapeMode, setMagicShapeMode] = useState('rect'); // 'rect' (hình chữ nhật, mặc định) | 'lasso' (tự do)
            // Chế độ vẽ cho bút chì: 'freehand' (vẽ tay, mặc định — giữ nguyên như trước giờ) hoặc
            // 'rect' (kéo-thả khung hình chữ nhật, dùng chung logic với bút Magic/IPA/tra ảnh —
            // xem redrawStrokes/handlePointerDown/Move trong PdfPage, đều xử lý "shape: 'rect'" theo
            // đúng màu/độ dày của bút chì như bình thường, không cần thêm code vẽ riêng).
            const [pencilShapeMode, setPencilShapeMode] = useState('freehand');
            const [color, setColor] = useState('#4F46E5');
            const [fontSize, setFontSize] = useState(10); // Mặc định 10
            // Độ dày bút chì: 3 mức, mặc định là mức nhỏ nhất (giữ nguyên độ dày cũ), 2 mức còn lại
            // lớn hơn 1 chút.
            const [pencilSize, setPencilSize] = useState(DEFAULT_PENCIL_SIZE);

            // "Độ ổn định nét vẽ" (làm mượt run tay) — áp dụng chung cho các bút vẽ tự do (bút chì,
            // bút Present). Mặc định TẮT (0) để giữ nguyên y hệt cảm giác viết cũ — chỉ đổi khi người
            // dùng chủ động bấm chọn mức khác.
            const [penStability, setPenStability] = useState(PEN_STABILITY_LEVELS[0]);
            // Màu viền glow của "Bút Present" — mặc định đỏ, đổi được qua thanh tuỳ chọn riêng của bút
            // này (bấm đúp vào nút bút Present). Mỗi nét đã vẽ tự nhớ đúng màu lúc vẽ (stroke.glowColor)
            // nên đổi màu ở đây chỉ ảnh hưởng tới các nét vẽ MỚI sau đó.
            const [penGlowColor, setPenGlowColor] = useState(PEN_GLOW_COLORS[0]);

            // Chế độ tẩy: 'point' (mặc định, giữ NGUYÊN hành vi cũ — tẩy theo bán kính quanh điểm chạm/
            // kéo) hoặc 'rect' (kéo-thả chọn vùng hình chữ nhật rồi tẩy hết nét trong đó, giống cơ chế
            // của bút Magic/IPA/tra ảnh/bút chì hình chữ nhật).
            const [eraserShapeMode, setEraserShapeMode] = useState('point');

            // --- THANH TUỲ CHỌN RIÊNG CHO TỪNG BÚT (ẩn mặc định, bấm ĐÚP vào nút bút để hiện) ---
            // QUAN TRỌNG: trước đây MỌI tuỳ chọn (cỡ nét, kiểu vẽ, độ ổn định, kiểu tẩy...) đều nhét
            // thẳng vào thanh công cụ chính — quá nhiều nút cùng lúc, rất rối mắt, nhất là khi vài loại
            // đang hiện cùng lúc. Giờ thanh chính CHỈ còn các nút chọn BÚT + bảng màu; các tuỳ chọn theo
            // từng bút được gom vào 1 thanh nhỏ RIÊNG hiện ngay bên dưới, CHỈ hiện khi bấm đúp (double-
            // click) vào đúng nút của bút đó — bấm đúp lại (hoặc đổi sang bút khác) để ẩn đi.
            // expandedToolOptions: tên bút đang mở thanh tuỳ chọn, hoặc null nếu đang ẩn.
            const [expandedToolOptions, setExpandedToolOptions] = useState(null);
            const toggleToolOptions = useCallback((toolName) => {
                setExpandedToolOptions(prev => prev === toolName ? null : toolName);
            }, []);
            // Đổi sang bút khác (bấm đơn — chọn công cụ) thì tự ẩn thanh tuỳ chọn của bút CŨ đi, vì
            // tuỳ chọn đó không còn áp dụng cho bút đang chọn nữa.
            useEffect(() => { setExpandedToolOptions(null); }, [tool]);

            // QUAN TRỌNG — sửa lỗi "trên iPad bấm 2 lần vào nút bút không hiện thanh tuỳ chọn": sự
            // kiện `onDoubleClick` của React là sự kiện CHUỘT (mouse dblclick) — Safari trên iPad KHÔNG
            // tự tổng hợp sự kiện này từ 2 lần chạm ngón tay/Apple Pencil liên tiếp (dblclick vốn chỉ
            // dành cho chuột thật), nên double-tap trên iPad không bao giờ kích hoạt được onDoubleClick,
            // dù trên Mac (dùng chuột thật) vẫn hoạt động bình thường — đây là lý do bug chỉ xảy ra
            // trên iPad. Sửa bằng cách TỰ phát hiện double-tap dựa trên `onClick` (sự kiện này CÓ xảy
            // ra nhất quán cho cả chuột lẫn chạm ngón tay/bút trên mọi nền tảng): tự đếm thời gian giữa
            // 2 lần bấm liên tiếp VÀO ĐÚNG CÙNG 1 nút bút — nếu cách nhau dưới 400ms thì coi là double-
            // tap và mở thanh tuỳ chọn, còn lại thì chỉ chọn công cụ như bình thường.
            const lastToolTapRef = useRef({ tool: null, time: 0 });
            const handleToolButtonClick = useCallback((toolName) => {
                setTool(toolName);
                const now = Date.now();
                if (lastToolTapRef.current.tool === toolName && now - lastToolTapRef.current.time < 400) {
                    toggleToolOptions(toolName);
                    lastToolTapRef.current = { tool: null, time: 0 }; // reset để tránh bấm 3 lần liên tiếp lại tính thành double-tap lần nữa
                } else {
                    lastToolTapRef.current = { tool: toolName, time: now };
                }
            }, [toggleToolOptions]);

            const [magicText, setMagicText] = useState("");
            const [isOcrProcessing, setIsOcrProcessing] = useState(false);
            const [ipaInfo, setIpaInfo] = useState(null); // { word } — chỉ còn đúng từ vừa quét, không tra IPA/API ngoài nữa
            const [photoLookup, setPhotoLookup] = useState(null); // { text } — bút tra ảnh minh hoạ

            const [showTOC, setShowTOC] = useState(false);
            // --- TÍNH NĂNG XUẤT PDF (xuất tất cả trang hoặc chỉ các trang được chọn trong mục lục) ---
            // tocExportMode: khi true, mở mục lục để CHỌN TRANG xuất (bấm vào ô = tích chọn, không
            // chuyển trang nữa) thay vì mở mục lục bình thường để điều hướng.
            const [tocExportMode, setTocExportMode] = useState(false);
            const [selectedExportPages, setSelectedExportPages] = useState(() => new Set());
            // Hộp thoại nhỏ hỏi "Xuất tất cả" hay "Chọn trang cụ thể" khi bấm nút Xuất PDF.
            const [showExportChoice, setShowExportChoice] = useState(false);
            // { done, total } trong lúc đang xuất nhiều trang (chụp ảnh + ghép PDF) — null khi không xuất.
            const [exportProgress, setExportProgress] = useState(null);
            // App tạm thời ép ĐÚNG 1 trang phải "hiện ra thật" (forceVisible) để html2canvas chụp được
            // nội dung của trang đó dù trang chưa từng lọt vào vùng nhìn thấy / chưa từng được cuộn qua.
            const [forcedVisiblePage, setForcedVisiblePage] = useState(null);
            // Nhớ lại NHỮNG TRANG nào đã từng render xong ít nhất 1 lần trong phiên này (dùng Set vì
            // chỉ cần biết có/không, không cần thứ tự) — KHÔNG BAO GIỜ xoá trong suốt phiên, vì canvas
            // của PdfPage vẫn giữ nguyên nội dung khi ẩn đi (visibility, không unmount) nên trang đã
            // render 1 lần rồi thì luôn "sẵn sàng" ngay lập tức cho các lượt xuất PDF sau đó.
            const renderedPagesForExportRef = useRef(new Set());
            const handlePageRenderedForExport = useCallback((pageNum) => {
                renderedPagesForExportRef.current.add(pageNum);
            }, []);
            // Chờ tới khi 1 trang được báo là "đã render xong" (qua renderedPagesForExportRef), tối đa
            // timeoutMs rồi TỰ BỎ QUA (không treo mãi) — phòng trường hợp hiếm khi trang lỗi không bao
            // giờ render xong (vd file PDF hỏng 1 trang) thì vẫn tiếp tục xuất các trang còn lại được.
            const waitForPageRendered = useCallback(async (pageNum, timeoutMs) => {
                const start = Date.now();
                while (!renderedPagesForExportRef.current.has(pageNum)) {
                    if (Date.now() - start > timeoutMs) return false;
                    await new Promise(r => setTimeout(r, 60));
                }
                return true;
            }, []);
            // Số ô mục lục đang được dựng trong modal — bắt đầu từ 1 đợt nhỏ (TOC_BATCH_SIZE), tự
            // tăng dần khi cuộn gần tới cuối (qua handleTocScroll). Xem giải thích chi tiết ở khai
            // báo TOC_BATCH_SIZE phía trên (sửa lỗi "mở mục lục file nặng tải rất lâu").
            const [tocVisibleCount, setTocVisibleCount] = useState(TOC_BATCH_SIZE);
            useEffect(() => {
                if (showTOC) setTocVisibleCount(TOC_BATCH_SIZE); // mỗi lần mở lại modal, reset về đợt đầu
            }, [showTOC]);
            // Tham chiếu tới đúng vùng cuộn nội dung PDF (không phải toàn trang) — dùng để tự tính
            // và cuộn tới đúng trang khi bấm từ mục lục, xem giải thích chi tiết ở nơi dùng bên dưới.
            const pdfContentAreaRef = useRef(null);
            // Tham chiếu tới vùng cuộn BÊN TRONG modal Mục lục — dùng để tự "tải thêm" 1 đợt ô mới
            // khi cuộn gần tới cuối, xem giải thích chi tiết ở useEffect ngay bên dưới.
            const tocScrollRef = useRef(null);
            // true trong lúc app TỰ cuộn bằng lệnh (vd bấm mục lục) — cho phép bộ khống chế tốc độ
            // cuộn bên dưới bỏ qua, không chặn nhầm cú cuộn mượt do chính app gây ra.
            const isProgrammaticScrollRef = useRef(false);
            // Hẹn giờ tự tắt cờ isProgrammaticScrollRef ở trên — tách riêng thành 1 ref chung (thay
            // vì tạo setTimeout rời rạc mỗi lần) để có thể clearTimeout đúng lượt cũ khi gọi liên
            // tiếp thật nhanh (vd đang kéo thanh điều hướng dạng chấm) — tránh 1 lượt gọi CŨ tự ý tắt
            // cờ SỚM hơn lượt MỚI vẫn đang cần cờ này còn bật.
            const progScrollTimerRef = useRef(null);

            // QUAN TRỌNG — THANH ĐIỀU HƯỚNG DẠNG CHẤM DỌC (mỗi trang = 1 chấm): thêm mới theo yêu
            // cầu, có nút nhỏ để bật/tắt (mặc định ẩn, đỡ chiếm diện tích màn hình). Dùng lại đúng
            // cách tính "delta rồi scrollTo" đã dùng ổn định cho việc bấm mục lục — không đụng gì tới
            // cơ chế cuộn bằng wheel/trackpad đã sửa rất kỹ ở các bản trước, nên không có rủi ro làm
            // lại đúng mấy lỗi "nhảy trang" từng gặp. Cuộn qua thanh này CỐ TÌNH dùng behavior:'auto'
            // (tức thời, không animation) thay vì 'smooth' — giống hệt cảm giác kéo thanh cuộn thật
            // của hệ điều hành: kéo tới đâu, trang cập nhật NGAY tới đó, không có animation nào chạy
            // ngầm để mà chồng chéo/xung đột nhau khi kéo nhanh liên tục — đây chính là cách tránh
            // "giật/nhảy" khi kéo mà người dùng yêu cầu, thay vì cố gắng làm mượt bằng animation.
            const [showPageNav, setShowPageNav] = useState(false);
            const pageNavRailRef = useRef(null);
            const isDraggingNavRef = useRef(false);
            const [currentPageForNav, setCurrentPageForNav] = useState(1);

            // Cuộn thẳng tới đúng trang pageNum trong khung đọc PDF chính — dùng chung cho cả bấm
            // VÀ kéo trên thanh điều hướng dạng chấm.
            const scrollToPage = useCallback((pageNum) => {
                const container = pdfContentAreaRef.current;
                const target = document.getElementById(`pdf-page-${pageNum}`);
                if (!container || !target) return;
                const containerRect = container.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                const delta = targetRect.top - containerRect.top;
                isProgrammaticScrollRef.current = true;
                container.scrollTo({ top: container.scrollTop + delta - 16, behavior: 'auto' });
                clearTimeout(progScrollTimerRef.current);
                progScrollTimerRef.current = setTimeout(() => { isProgrammaticScrollRef.current = false; }, 200);
            }, []);

            // Quy đổi vị trí Y của con trỏ/ngón tay trên thanh điều hướng thành số trang tương ứng
            // (0 ở đỉnh thanh = trang 1, cuối thanh = trang cuối) rồi cuộn thẳng tới đó.
            const handleNavPointerToPage = useCallback((clientY) => {
                const rail = pageNavRailRef.current;
                if (!rail || !numPages) return;
                const rect = rail.getBoundingClientRect();
                const fraction = rect.height > 0 ? Math.max(0, Math.min(1, (clientY - rect.top) / rect.height)) : 0;
                const pageNum = Math.max(1, Math.min(numPages, Math.round(fraction * (numPages - 1)) + 1));
                scrollToPage(pageNum);
            }, [numPages, scrollToPage]);

            const handleNavPointerDown = useCallback((e) => {
                isDraggingNavRef.current = true;
                try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
                handleNavPointerToPage(e.clientY);
            }, [handleNavPointerToPage]);

            const handleNavPointerMove = useCallback((e) => {
                if (!isDraggingNavRef.current) return;
                handleNavPointerToPage(e.clientY);
            }, [handleNavPointerToPage]);

            const handleNavPointerUp = useCallback((e) => {
                isDraggingNavRef.current = false;
                try { e.target.releasePointerCapture(e.pointerId); } catch (err) {}
            }, []);

            // Theo dõi trang đang xem để tô sáng đúng chấm tương ứng trên thanh điều hướng — dùng 1
            // IntersectionObserver DUY NHẤT theo dõi TẤT CẢ khung trang, thu hẹp vùng "tính là đang
            // xem" về đúng dải giữa màn hình (rootMargin âm cả trên lẫn dưới) để chỉ 1 trang khớp tại
            // 1 thời điểm. Đây CHỈ để tô sáng (hiển thị), hoàn toàn tách biệt khỏi mọi observer khác
            // của từng PdfPage (dùng để lazy-render) — không ảnh hưởng gì tới cơ chế render/cuộn hiện có.
            useEffect(() => {
                if (!pdfDoc || !numPages) return;
                const observer = new IntersectionObserver((entries) => {
                    let best = null;
                    entries.forEach(entry => {
                        if (entry.isIntersecting && (!best || entry.intersectionRatio > best.intersectionRatio)) {
                            best = entry;
                        }
                    });
                    if (best) {
                        const match = best.target.id.match(/pdf-page-(\d+)/);
                        if (match) setCurrentPageForNav(Number(match[1]));
                    }
                }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] });

                const els = document.querySelectorAll('[id^="pdf-page-"]');
                els.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [pdfDoc, numPages]);

            // QUAN TRỌNG — LỊCH SỬ sửa lỗi "lướt lùi về trang trước bị nhảy vọt": đã thử rất nhiều lớp
            // can thiệp trực tiếp vào wheel/scrollTop (giảm tốc 1 chiều, tự bù mỗi rAF, chặn hẳn wheel
            // lấy lại toàn quyền cuộn bằng tay, giới hạn từng sự kiện, rồi "ngân sách" quãng đường theo
            // từng đợt lướt) — không lớp nào dứt điểm, có lớp còn làm trải nghiệm TỆ HƠN (khựng cứng khi
            // hết ngân sách), và tất cả đều đánh đổi mất luôn quán tính (momentum) mượt mà vốn có của
            // trackpad. Đã TÌM RA ĐÚNG GỐC thật sự: không liên quan gì tới wheel/tốc độ lướt cả — do
            // canvas/spinner của PdfPage đổi qua lại bằng CSS `display: none/block` mỗi khi cuộn qua,
            // việc này làm trình duyệt tưởng có nội dung mới chèn vào Layout Tree phía trên, khiến cơ
            // chế "scroll anchoring" mặc định tự ý bù sai vị trí cuộn — đúng kiểu jump đột ngột, không
            // tăng dần. Đã sửa tận gốc bằng cách đổi `display` thành `visibility` (xem style của canvas/
            // spinner trong PdfPage) — phần tử không còn bị gỡ khỏi/chèn lại Layout Tree khi ẩn/hiện
            // nữa, nên anchoring không còn lý do gì để bù nhầm. Nhờ vậy KHÔNG CẦN can thiệp wheel bằng
            // tay nữa — bỏ hẳn useEffect chặn wheel ở đây, trả lại nguyên bản cảm giác lướt/quán tính tự
            // nhiên của trackpad/Trackpad Mac và cảm ứng iPad.

            // --- KHOÁ ZOOM (nút bật/tắt, thay cho cơ chế tự động chặn pinch-zoom trước đây vốn
            // "chưa hoạt động hiệu quả lắm" trên thực tế) — mặc định TẮT (zoom bình thường), người
            // dùng tự bấm bật khi cần viết/note để tránh lỡ tỳ tay làm phóng to/thu nhỏ ngoài ý muốn.
            const [zoomLocked, setZoomLocked] = useState(false);

            // QUAN TRỌNG — sửa lỗi "viết vài nét là bị đứng màn hình iPad" VẪN CÒN xảy ra sau khi đã
            // sửa unlockAudio: trước đây các listener chặn pinch/double-tap-zoom ở dưới được GẮN SẴN
            // VĨNH VIỄN vào document (useEffect chạy 1 lần, deps rỗng) NGAY TỪ LÚC TẢI TRANG — dù
            // "Khoá zoom" có đang tắt hay không, listener touchmove/touchend/gesture* (đều passive:
            // false, tức bắt buộc Safari phải đợi JS chạy xong mới quyết định có cho cuộn/zoom hay
            // không) vẫn LUÔN chạy trên MỌI cử động của bút Apple Pencil khi viết. Việc trộn lẫn giữa
            // Pointer Events (dùng để vẽ, có setPointerCapture) và Touch Events có preventDefault
            // chạy song song cho CÙNG 1 thao tác chạm bút là nguyên nhân gây "kẹt" bộ xử lý cảm ứng
            // của WebKit trên iPadOS — đúng kiểu lỗi chỉ hồi phục khi trang mất rồi lấy lại focus.
            // Sửa lại: CHỈ gắn các listener này khi "Khoá zoom" thực sự đang BẬT — mặc định (TẮT) sẽ
            // không có bất kỳ listener chặn cảm ứng nào chạy cả, viết bằng bút mượt như trước khi có
            // tính năng Khoá zoom này.
            useEffect(() => {
                if (!zoomLocked) return;

                let lastTouchEnd = 0;

                // Safari bắn các sự kiện "gesture*" riêng khi chụm/mở 2 ngón — chặn hẳn.
                const onGesture = (e) => { e.preventDefault(); };
                // Chặn pinch-zoom bằng 2 ngón tay (không ảnh hưởng cuộn/vẽ 1 ngón hay bút Apple Pencil).
                const onTouchMove = (e) => {
                    if (e.touches && e.touches.length > 1) e.preventDefault();
                };
                // Chặn double-tap-to-zoom (chạm nhanh 2 lần liên tiếp).
                const onTouchEnd = (e) => {
                    const now = Date.now();
                    if (now - lastTouchEnd <= 300) e.preventDefault();
                    lastTouchEnd = now;
                };

                document.addEventListener('gesturestart', onGesture, { passive: false });
                document.addEventListener('gesturechange', onGesture, { passive: false });
                document.addEventListener('gestureend', onGesture, { passive: false });
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd, { passive: false });

                return () => {
                    document.removeEventListener('gesturestart', onGesture);
                    document.removeEventListener('gesturechange', onGesture);
                    document.removeEventListener('gestureend', onGesture);
                    document.removeEventListener('touchmove', onTouchMove);
                    document.removeEventListener('touchend', onTouchEnd);
                };
            }, [zoomLocked]);

            // --- GIỮ NGUYÊN VỊ TRÍ ĐANG XEM KHI ĐỔI ĐỘ PHÓNG (SCALE) ---
            // QUAN TRỌNG — sửa lỗi "bấm +/- % làm nhảy tới trang khác rất xa": mỗi trang PdfPage có
            // chiều cao = basePageSize.height * scale (xem style trong PdfPage) — khi scale đổi, TẤT
            // CẢ các trang (kể cả những trang đã cuộn qua từ lâu, ở rất xa phía trên) đều đổi chiều cao
            // CÙNG LÚC. Nếu không tự bù lại vị trí cuộn, trình duyệt vẫn giữ nguyên scrollTop (tính bằng
            // pixel tuyệt đối) — nhưng cùng 1 giá trị scrollTop đó giờ ứng với 1 vị trí nội dung hoàn
            // toàn khác (vì tổng chiều cao các trang phía trên đã đổi), sách càng dài thì càng lệch xa,
            // đúng như hiện tượng "nhảy đi trang khác rất rất xa" người dùng gặp phải.
            // Cách sửa: trước khi đổi scale, "neo" lại đúng trang + vị trí tương đối bên trong trang đó
            // đang nằm ở 1 điểm mốc cố định trên màn hình (giữa khung nhìn khi bấm nút +/-, hoặc đúng
            // điểm 2 ngón tay đang chụm khi pinch) — sau khi scale đổi xong (layout đã cập nhật), đo lại
            // vị trí THẬT của đúng trang đó (getBoundingClientRect — không đoán/tính theo tỉ lệ vì
            // margin cố định 10px/30px giữa các trang không co giãn theo scale, tính theo tỉ lệ sẽ bị
            // lệch dần khi sách nhiều trang) rồi chỉnh scrollTop sao cho điểm mốc đó vẫn nằm nguyên tại
            // vị trí đã neo trên màn hình — không còn "nhảy" đi đâu nữa.
            const zoomAnchorRef = useRef(null);
            const scaleRef = useRef(scale);
            useEffect(() => { scaleRef.current = scale; }, [scale]);
            const zoomLockedRef = useRef(zoomLocked);
            useEffect(() => { zoomLockedRef.current = zoomLocked; }, [zoomLocked]);

            const captureZoomAnchor = useCallback((anchorClientY) => {
                const container = pdfContentAreaRef.current;
                if (!container || !numPages) { zoomAnchorRef.current = null; return; }
                let target = null;
                for (let p = 1; p <= numPages; p++) {
                    const el = document.getElementById(`pdf-page-${p}`);
                    if (!el) continue;
                    const r = el.getBoundingClientRect();
                    if (anchorClientY <= r.bottom) { target = { pageNum: p, r }; break; }
                }
                if (!target) {
                    const lastEl = document.getElementById(`pdf-page-${numPages}`);
                    if (!lastEl) { zoomAnchorRef.current = null; return; }
                    target = { pageNum: numPages, r: lastEl.getBoundingClientRect() };
                }
                const fraction = target.r.height > 0 ? (anchorClientY - target.r.top) / target.r.height : 0;
                zoomAnchorRef.current = { pageNum: target.pageNum, fraction, anchorClientY };
            }, [numPages]);

            const getContentAreaCenterY = useCallback(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return 0;
                const r = container.getBoundingClientRect();
                return r.top + r.height / 2;
            }, []);

            // Chạy NGAY SAU KHI layout đã cập nhật theo scale mới (useLayoutEffect, không phải
            // useEffect thường) để tránh 1 khung hình bị "chớp" lệch vị trí trước khi kịp bù lại.
            useLayoutEffect(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return;

                // QUAN TRỌNG — sửa lỗi "zoom xong nội dung nhảy lệch sang lề trái" (vẫn còn xảy ra dù đã
                // sửa lại cơ chế pinch giống hệt nút +/-%): hoá ra gốc vấn đề không nằm ở cách bắt cử chỉ
                // pinch hay cách tính scale — nút +/- VÀ pinch giờ CÙNG đi qua đúng 1 đường setScale() —
                // mà nằm ở chính CSS: vùng nội dung PDF canh giữa trang theo chiều ngang bằng flexbox
                // (`items-center`), nhưng cách canh giữa này CHỈ đáng tin cậy khi trang KHÔNG tràn khỏi
                // bề ngang container. Ngay khi trang phóng to tới mức RỘNG HƠN vùng nhìn thấy (dễ xảy ra
                // khi zoom cao), container tự đổi ngầm overflow-x thành "auto" (quy tắc CSS: 1 trục
                // overflow non-visible sẽ buộc trục còn lại cũng hết "visible") — và trình duyệt mặc
                // định lấy `scrollLeft = 0` làm điểm bắt đầu cho nội dung ĐANG được flexbox canh giữa mà
                // lại tràn ra, cắt mất phần tràn bên TRÁI thay vì tự cuộn ra đúng giữa — nhìn giống hệt
                // "nội dung nhảy sang lề trái". Bấm nút +/-% mỗi lần chỉ đổi 0.2 nên độ tràn tăng dần từ
                // từ, hiếm khi nhảy rõ; còn pinch có thể đổi scale rất nhanh trong 1 cử chỉ (từ vừa khít
                // tới tràn nhiều) nên lộ rõ hẳn — đây là lý do 2 cách bấm/pinch "nhìn" khác nhau dù cùng
                // 1 cơ chế đổi scale. Sửa TẬN GỐC: sau MỌI lần đổi scale, LUÔN tự đặt lại `scrollLeft` để
                // cuộn nội dung về đúng GIỮA theo chiều ngang — không trông chờ flexbox tự lo việc này
                // khi đã tràn nữa (khi chưa tràn, phép tính dưới đây tự ra 0, không ảnh hưởng gì).
                if (container.scrollWidth > container.clientWidth) {
                    container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
                } else {
                    container.scrollLeft = 0;
                }

                const anchor = zoomAnchorRef.current;
                if (!anchor || !container) return;
                const el = document.getElementById(`pdf-page-${anchor.pageNum}`);
                if (!el) return;
                const r = el.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const desiredViewportY = anchor.anchorClientY - containerRect.top;
                const currentAnchorOffsetFromContainerTop = (r.top - containerRect.top) + anchor.fraction * r.height;
                const delta = currentAnchorOffsetFromContainerTop - desiredViewportY;
                if (Math.abs(delta) > 0.5) container.scrollTop = container.scrollTop + delta;
            }, [scale]);

            // --- PINCH 2 NGÓN TAY ĐỂ PHÓNG TO/THU NHỎ — CHỈ TRÊN VÙNG NỘI DUNG PDF ---
            // QUAN TRỌNG — LẦN 3 sửa cơ chế pinch-zoom, lần này dùng ĐÚNG CƠ CHẾ CỦA NÚT +/-% (theo yêu
            // cầu trực tiếp): 2 lần sửa trước đều dùng CSS `transform: scale()` để "xem trước" trong lúc
            // pinch (đẩy việc cho GPU, không đụng React) — hết được rung/giật thật, NHƯNG lại lộ ra 1 lỗi
            // khác: layout THẬT luôn canh giữa trang theo chiều ngang (flexbox `items-center`), còn ảnh
            // xem trước bằng transform lại phóng to quanh đúng điểm 2 ngón tay (dù đã thử ép cứng gốc
            // ngang về "50%" ở lần sửa trước, vẫn còn bị lệch/giật về lề trái trên máy thật — có thể do
            // cách Safari tự tính lại kích thước/toạ độ của 1 phần tử ĐANG cuộn (overflow-y-auto) mà lại
            // bị áp transform, phức tạp hơn suy đoán). Nút +/-% thì KHÔNG hề có vấn đề này vì nó luôn đổi
            // THẲNG state `scale` thật (không qua bước xem trước bằng CSS) nên layout luôn nhất quán.
            // Cách sửa LẦN NÀY: bỏ hẳn CSS transform preview, gọi setScale() TRỰC TIẾP (y hệt cơ chế nút
            // +/-: captureZoomAnchor() rồi setScale()) — NHƯNG gộp nhiều lần gesturechange bắn ra liên
            // tiếp (hàng chục lần/giây) lại thành ĐÚNG 1 lần setScale() cho MỖI KHUNG HÌNH màn hình vẽ ra
            // (dùng requestAnimationFrame làm hàng đợi) — đây chính là nguyên nhân gây rung ở bản đầu
            // tiên: không phải "gọi setScale() là sai", mà là gọi setScale() NHIỀU LẦN HƠN tốc độ màn
            // hình có thể vẽ ra, khiến các lần re-render/tính scrollTop chồng chéo lên nhau chưa xong lần
            // trước đã bắt đầu lần sau. Gộp về đúng nhịp 1 lần/khung hình (60-120 lần/giây tuỳ máy) vẫn
            // đủ mượt mắt thường, mà không còn chồng chéo công việc nữa — đồng thời dùng lại NGUYÊN VẸN
            // cơ chế neo vị trí (captureZoomAnchor + useLayoutEffect) đã được kiểm chứng đúng 100% với
            // nút +/-, nên không còn khả năng lệch vị trí/lệch lề trái nữa.
            // KHÔNG đụng tới thẻ <meta viewport> (vẫn giữ user-scalable=no như cũ) — nhờ vậy pinch ở bất
            // kỳ đâu KHÁC vùng nội dung PDF (thanh công cụ, mục lục, các nút bấm...) hoàn toàn không bị
            // ảnh hưởng. Tôn trọng luôn nút "Khoá zoom" đã có sẵn: khi đang khoá thì pinch cũng không
            // đổi scale (đúng như ý nghĩa của việc khoá).
            useEffect(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return;
                let pinching = false;
                let pinchStartScale = 1;
                let rafId = null;
                let latestGestureScale = 1;
                let latestClientY = 0;

                // Chạy ĐÚNG 1 lần cho MỖI khung hình (được lên lịch bởi requestAnimationFrame trong
                // onGestureChange bên dưới) — dù gesturechange có bắn ra bao nhiêu lần trong cùng 1 khung
                // hình đó, chỉ giá trị MỚI NHẤT được áp dụng, y hệt cách nút +/- hoạt động (neo vị trí rồi
                // chốt scale thật) chỉ khác là lặp lại tự động theo từng khung hình trong lúc đang pinch.
                const commitPinchScale = () => {
                    rafId = null;
                    if (!pinching) return;
                    captureZoomAnchor(latestClientY);
                    const next = Math.max(0.5, Math.min(3, pinchStartScale * latestGestureScale));
                    setScale(next);
                };

                const onGestureStart = (e) => {
                    e.preventDefault();
                    if (zoomLockedRef.current) return;
                    pinching = true;
                    pinchStartScale = scaleRef.current;
                    latestGestureScale = e.scale;
                    latestClientY = e.clientY;
                };
                const onGestureChange = (e) => {
                    e.preventDefault();
                    if (!pinching || zoomLockedRef.current) return;
                    latestGestureScale = e.scale;
                    latestClientY = e.clientY;
                    // Chỉ lên lịch 1 lần cho khung hình SẮP TỚI — nếu đã có 1 lần đang chờ (rafId khác
                    // null) thì bỏ qua, để nhiều lần gesturechange dồn về cùng 1 lần commit duy nhất.
                    if (rafId == null) {
                        rafId = requestAnimationFrame(commitPinchScale);
                    }
                };
                const onGestureEnd = (e) => {
                    e.preventDefault();
                    if (!pinching) return;
                    pinching = false;
                    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
                    // Luôn chốt lại đúng 1 lần cuối bằng giá trị scale THẬT SỰ cuối cùng lúc buông tay
                    // (không chỉ dựa vào lần commit gần nhất của rAF, có thể đã hơi cũ 1 khung hình).
                    captureZoomAnchor(e.clientY);
                    const finalScale = Math.max(0.5, Math.min(3, pinchStartScale * e.scale));
                    setScale(finalScale);
                };

                container.addEventListener('gesturestart', onGestureStart, { passive: false });
                container.addEventListener('gesturechange', onGestureChange, { passive: false });
                container.addEventListener('gestureend', onGestureEnd, { passive: false });
                return () => {
                    if (rafId != null) cancelAnimationFrame(rafId);
                    container.removeEventListener('gesturestart', onGestureStart);
                    container.removeEventListener('gesturechange', onGestureChange);
                    container.removeEventListener('gestureend', onGestureEnd);
                };
            }, [captureZoomAnchor]);

            // useCallback: giữ nguyên "địa chỉ" hàm giữa các lần render, để các PdfPage đã
            // memo hoá (React.memo) không phải render lại toàn bộ mỗi khi App có state khác
            // đổi (vd: đang gõ chữ trong 1 ô note) — giúp phản hồi nhanh & mượt hơn, nhất là
            // với sách PDF nhiều trang trên iPad.
            // Tải thêm 1 đợt ô mục lục khi cuộn gần tới cuối danh sách hiện có — xem giải thích ở
            // khai báo TOC_BATCH_SIZE. useCallback để không tạo hàm mới mỗi khi App render lại vì lý
            // do khác không liên quan tới mục lục.
            const handleTocLoadMore = useCallback(() => {
                setTocVisibleCount(c => Math.min(numPages, c + TOC_BATCH_SIZE));
            }, [numPages]);

            // QUAN TRỌNG — sửa lỗi "mở mục lục file lớn thì nhiều trang không hiện": cách cũ dùng 1
            // IntersectionObserver quan sát 1 ô "sentinel" ở cuối danh sách, chỉ bắn callback khi ô đó
            // CHUYỂN TRẠNG THÁI (từ ngoài màn hình vào trong hoặc ngược lại). Với modal cao/vùng đệm
            // rootMargin rộng, sau khi tải thêm 1 đợt, sentinel có thể vẫn tiếp tục nằm trong vùng
            // "đang giao nhau" — tức KHÔNG hề chuyển trạng thái — nên callback không bắn lại nữa, và
            // việc tải thêm bị "kẹt" mãi ở đó dù người dùng vẫn đang cuộn, khiến các trang phía sau
            // không bao giờ được tải. Giờ chuyển sang cách chắc chắn hơn: theo dõi trực tiếp vị trí
            // cuộn (onScroll) và so sánh còn cách đáy bao xa — kiểm tra lại MỖI lần cuộn, không phụ
            // thuộc việc "chuyển trạng thái" nên không thể bị kẹt. Thêm 1 effect tự tải thêm ngay cả
            // khi CHƯA cuộn (vd: file ít trang hơn 1 màn hình, hoặc màn hình rất to) — vì lúc đó modal
            // không đủ nội dung để tạo ra sự kiện cuộn nào cả.
            useEffect(() => {
                if (!showTOC) return;
                const el = tocScrollRef.current;
                if (!el) return;
                if (tocVisibleCount < numPages && el.scrollHeight <= el.clientHeight + 200) {
                    handleTocLoadMore();
                }
            }, [showTOC, tocVisibleCount, numPages, handleTocLoadMore]);

            // --- LOGIC XUẤT PDF ---
            // Đổi 1 canvas thành bytes JPEG thô (Uint8Array) qua canvas.toBlob + arrayBuffer() — nhanh/
            // nhẹ hơn hẳn so với đường vòng canvas.toDataURL() (base64 text, tốn thêm ~33% dung lượng
            // và phải decode lại) rồi mới convert ngược lại thành bytes cho pdf-lib.
            const canvasToJpegBytes = useCallback((canvas, quality) => {
                return new Promise((resolve, reject) => {
                    canvas.toBlob((blob) => {
                        if (!blob) { reject(new Error('Không tạo được ảnh từ canvas')); return; }
                        blob.arrayBuffer().then(buf => resolve(new Uint8Array(buf))).catch(reject);
                    }, 'image/jpeg', quality);
                });
            }, []);

            // Chụp lại đúng khung hiển thị của 1 trang (gồm cả nội dung PDF gốc + nét bút vẽ tay +
            // các ô ghi chú/text box) bằng html2canvas — vì strokes/texts chỉ tồn tại dưới dạng state
            // cục bộ bên trong từng PdfPage (không có ở đâu khác để "vẽ lại" theo cách khác), nên chụp
            // ảnh trực tiếp phần DOM đang hiển thị là cách duy nhất chắc chắn lấy đủ mọi thứ đang thấy
            // trên màn hình, kể cả trên các trang KHÔNG dùng font/canvas giống hệt nhau.
            const capturePageImage = useCallback(async (pageNum) => {
                const pageEl = document.getElementById(`pdf-page-${pageNum}`);
                if (!pageEl) return null;
                // Ép trang này "hiện thật" (canvas không còn visibility:hidden) rồi đợi tới khi render xong.
                setForcedVisiblePage(pageNum);
                // Nhường 1 nhịp cho React thực sự áp dụng prop forceVisible mới trước khi bắt đầu chờ.
                await new Promise(r => setTimeout(r, 30));
                await waitForPageRendered(pageNum, 8000);
                // Thêm 1 nhịp nhỏ nữa để chắc chắn redrawStrokes() (chạy trong effect riêng, bắn ra
                // ngay sau khi isVisible/render xong) đã kịp vẽ xong các nét bút lên canvas nét vẽ.
                await new Promise(r => setTimeout(r, 60));
                const canvas = await window.html2canvas(pageEl, { backgroundColor: '#ffffff', useCORS: true, scale: 2, logging: false });
                return canvas;
            }, [waitForPageRendered]);

            const exportPagesToPdf = useCallback(async (pageNumbers) => {
                if (!pageNumbers || pageNumbers.length === 0 || !window.PDFLib || !window.html2canvas) return;
                setExportProgress({ done: 0, total: pageNumbers.length });
                try {
                    const { PDFDocument } = window.PDFLib;
                    const outDoc = await PDFDocument.create();
                    const pageW = basePageSize ? basePageSize.width : 595;
                    const pageH = basePageSize ? basePageSize.height : 842;
                    for (let i = 0; i < pageNumbers.length; i++) {
                        const pageNum = pageNumbers[i];
                        const canvas = await capturePageImage(pageNum);
                        if (canvas) {
                            const jpgBytes = await canvasToJpegBytes(canvas, 0.9);
                            const jpgImage = await outDoc.embedJpg(jpgBytes);
                            const outPage = outDoc.addPage([pageW, pageH]);
                            outPage.drawImage(jpgImage, { x: 0, y: 0, width: pageW, height: pageH });
                        }
                        setExportProgress({ done: i + 1, total: pageNumbers.length });
                    }
                    setForcedVisiblePage(null);
                    const pdfBytes = await outDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'tai-lieu' + (pageNumbers.length === numPages ? '' : '-trang-chon') + '.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (err) {
                    console.error('Lỗi xuất PDF:', err);
                    alert('Xuất PDF thất bại: ' + (err && err.message ? err.message : 'lỗi không xác định'));
                } finally {
                    setForcedVisiblePage(null);
                    setExportProgress(null);
                }
            }, [basePageSize, capturePageImage, canvasToJpegBytes, numPages]);

            const handleExportAll = useCallback(() => {
                setShowExportChoice(false);
                const all = Array.from(new Array(numPages), (el, i) => i + 1);
                exportPagesToPdf(all);
            }, [numPages, exportPagesToPdf]);

            const handleOpenExportPicker = useCallback(() => {
                setShowExportChoice(false);
                setSelectedExportPages(new Set());
                setTocExportMode(true);
                setShowTOC(true);
            }, []);

            const toggleExportPageSelected = useCallback((pageNum) => {
                setSelectedExportPages(prev => {
                    const next = new Set(prev);
                    if (next.has(pageNum)) next.delete(pageNum); else next.add(pageNum);
                    return next;
                });
            }, []);

            const handleConfirmExportSelected = useCallback(() => {
                const sorted = Array.from(selectedExportPages).sort((a, b) => a - b);
                if (sorted.length === 0) return;
                setTocExportMode(false);
                setShowTOC(false);
                exportPagesToPdf(sorted);
            }, [selectedExportPages, exportPagesToPdf]);

            const handleTocScroll = useCallback((e) => {
                const el = e.target;
                if (el.scrollHeight - el.scrollTop - el.clientHeight < 800) {
                    handleTocLoadMore();
                }
            }, [handleTocLoadMore]);

            const handleFileUpload = useCallback((e) => {
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    const objectUrl = URL.createObjectURL(file);
                    setPdfUrl(objectUrl);
                    setBasePageSize(null);
                    pdfjsLib.getDocument(objectUrl).promise.then(loadedPdf => {
                        setPdfDoc(loadedPdf);
                        setNumPages(loadedPdf.numPages);
                        // Lấy kích thước thật (scale 1) của trang đầu tiên — chỉ đọc thông tin trang,
                        // KHÔNG rasterize/render nên rất nhẹ — dùng làm placeholder chung cho mọi trang
                        // (xem giải thích chi tiết ở khai báo basePageSize phía trên).
                        loadedPdf.getPage(1).then(page => {
                            const vp = page.getViewport({ scale: 1 });
                            setBasePageSize({ width: vp.width, height: vp.height });
                        }).catch(err => {});
                    }).catch(err => alert("Lỗi khi mở file."));
                }
            }, []);

            const onExtractText = useCallback((text, processing) => {
                setMagicText(text);
                setIsOcrProcessing(processing);
                // Bắt đầu 1 lượt quét mới (processing=true, text rỗng) -> dọn box IPA cũ để
                // không hiển thị nhầm thông tin của từ trước đó trong lúc đang chờ kết quả mới.
                if (processing) setIpaInfo(null);
            }, []);

            // Bút IPA: KHÔNG còn tra cứu API từ điển ngoài nữa (theo yêu cầu — chỉ cần quét chữ, hiện
            // từ vừa quét, rồi mở thẳng Cambridge Dictionary chứ không cần "truy xuất IPA" gì thêm) —
            // Cambridge đã tự mở/điều hướng riêng ở navigateIPALookupWindow ngay khi quét xong, hàm này
            // chỉ còn việc tách đúng từ để hiện lên box bên cạnh, không có bước chờ mạng nào cả.
            const onIPALookup = useCallback((text) => {
                const word = extractFirstWord(text);
                setIpaInfo(word ? { word } : null);
            }, []);

            // Luôn hiện panel "Mở ảnh trên Google" khi quét được chữ — không phụ thuộc việc popup
            // tự động có bị trình duyệt chặn hay không (xem giải thích ở openPhotoLookupWindow).
            const onPhotoLookup = useCallback((text) => {
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setPhotoLookup(null);
                    return;
                }
                setPhotoLookup({ text: clean });
            }, []);

            return (
                <div
                    className="flex h-screen w-full font-sans bg-slate-100 overflow-hidden"
                >
                    {/* Box dịch + box IPA — theo yêu cầu, box IPA giờ nằm CHÍNH GIỮA, ngay bên DƯỚI box
                        dịch (trước đây box IPA nằm tách riêng bên cạnh mép trái). Gộp cả 2 vào chung
                        1 khung bọc ngoài, xếp cột dọc (flex-col) + canh giữa ngang (items-center):
                        khung bọc mới là nơi DUY NHẤT giữ vị trí "fixed, canh giữa màn hình, cách đỉnh
                        24" — bản thân MagicTranslationBar không còn tự định vị fixed nữa (xem sửa ở
                        component đó), nên xếp thành cột tự nhiên, khoảng cách luôn đúng dù box dịch cao
                        hay thấp (không cần tính toán offset thủ công như cách "bám mép trái" cũ). */}
                    {(magicText || isOcrProcessing) && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] w-[90%] max-w-3xl flex flex-col items-center gap-3 animate-slide-down">
                            <MagicTranslationBar text={magicText} isProcessing={isOcrProcessing} onClose={() => { setMagicText(""); setIsOcrProcessing(false); setIpaInfo(null); }} />
                            {ipaInfo && (
                                <div className="hidden sm:block animate-slide-down-y">
                                    <IPAPanel info={ipaInfo} onClose={() => setIpaInfo(null)} />
                                </div>
                            )}
                        </div>
                    )}

                    {/* Thông báo/nút mở kết quả ảnh minh hoạ cho bút Tra ảnh — luôn hiện ra khi có
                        chữ vừa quét, để KHÔNG phụ thuộc vào việc trình duyệt có chặn popup hay không:
                        bấm nút là mở tab/cửa sổ Google Hình ảnh thật, chắc chắn không bị chặn vì đó
                        là 1 cú bấm chuột/chạm thật của người dùng. */}
                    {photoLookup && (
                        <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[100] glass-panel rounded-2xl shadow-2xl border-2 border-rose-100 px-5 py-3 flex items-center gap-4 animate-slide-down max-w-[92%]">
                            <i className="fas fa-images text-rose-500 text-xl shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Đã quét được</p>
                                <p className="text-sm font-bold text-slate-800 truncate max-w-[220px]">{photoLookup.text}</p>
                            </div>
                            <button
                                onClick={() => { window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(photoLookup.text), '_blank'); }}

                                <i className="fas fa-up-right-from-square"></i> Mở ảnh trên Google
                            </button>
                            <button onClick={() => setPhotoLookup(null)} className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors bg-white border border-slate-200">
                                <i className="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    )}

                    {/* FLOATING WINDOW: MỤC LỤC TRANG DẠNG GRID — dùng chung cho cả điều hướng thường
                        VÀ chế độ chọn trang để Xuất PDF (tocExportMode) */}
                    {showTOC && pdfDoc && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 sm:p-8" onClick={() => { setShowTOC(false); setTocExportMode(false); }}>
                            <div className="bg-slate-100 rounded-3xl shadow-2xl w-full max-w-5xl max-h-full flex flex-col overflow-hidden animate-modal-pop" onClick={e => e.stopPropagation()}>
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-white shadow-sm z-10">
                                    <h3 className="text-xl font-extrabold text-slate-800 tracking-tight">
                                        <i className={"fas mr-3 " + (tocExportMode ? 'fa-file-export text-emerald-500' : 'fa-th-large text-indigo-500')}></i>
                                        {tocExportMode ? 'Chọn trang để xuất PDF' : 'Chọn trang nhanh'}
                                    </h3>
                                    <button onClick={() => { setShowTOC(false); setTocExportMode(false); }} className="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-red-500 hover:text-white flex items-center justify-center transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div ref={tocScrollRef} onScroll={handleTocScroll} className="p-6 overflow-y-auto flex-1 pb-10">
                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-6">

                                            <PdfThumbnail
                                                key={index}
                                                pdf={pdfDoc}
                                                pageNum={index + 1}
                                                selected={tocExportMode ? selectedExportPages.has(index + 1) : undefined}

                                                    // Ở chế độ chọn trang xuất PDF: bấm vào ô chỉ tích/bỏ tích chọn, KHÔNG
                                                    // đóng mục lục cũng không cuộn trang — người dùng chọn xong mới bấm nút
                                                    // "Xuất" ở thanh nổi phía dưới.
                                                    if (tocExportMode) {
                                                        toggleExportPageSelected(index + 1);
                                                        return;
                                                    }
                                                    // QUAN TRỌNG — sửa lỗi "bấm chuyển trang từ mục lục làm nguyên trang bị kéo lên,
                                                    // khuất mất thanh công cụ, kéo xuống lại không được": trước đây dùng
                                                    // el.scrollIntoView() — hàm này để TRÌNH DUYỆT TỰ CHỌN cuộn ancestor scroll
                                                    // nào, và trên Safari/iPadOS đôi khi nó cuộn luôn CẢ container cha lẫn
                                                    // document/viewport thay vì chỉ đúng vùng nội dung PDF, đẩy luôn thanh công cụ
                                                    // (nằm NGOÀI vùng cuộn đó) ra khỏi màn hình theo. Giờ tự tính khoảng cách và
                                                    // chỉ gọi scrollTo() trên ĐÚNG 1 vùng cuộn nội dung PDF (pdfContentAreaRef) —
                                                    // không đụng tới bất kỳ phần tử nào khác, nên thanh công cụ không bao giờ bị
                                                    // trôi theo nữa.
                                                    const container = pdfContentAreaRef.current;
                                                    const target = document.getElementById(`pdf-page-${index + 1}`);
                                                    if (container && target) {
                                                        const containerRect = container.getBoundingClientRect();
                                                        const targetRect = target.getBoundingClientRect();
                                                        const delta = targetRect.top - containerRect.top;
                                                        // Đánh dấu đây là cú cuộn app TỰ ra lệnh — để bộ khống chế tốc độ cuộn lùi
                                                        // (xem isProgrammaticScrollRef) không chặn nhầm cú cuộn mượt này.
                                                        isProgrammaticScrollRef.current = true;
                                                        container.scrollTo({ top: container.scrollTop + delta - 16, behavior: 'smooth' });
                                                        setTimeout(() => { isProgrammaticScrollRef.current = false; }, 900);
                                                    }
                                                    setShowTOC(false);
                                                }}
                                            />
                                        ))}
                                    </div>
                                    {tocVisibleCount < numPages && (
                                        <div className="flex items-center justify-center gap-2 text-slate-400 text-xs font-semibold py-6">
                                            <i className="fas fa-circle-notch fa-spin"></i> Đang tải thêm trang…
                                        </div>
                                    )}
                                </div>
                                {/* Thanh nổi hiện số trang đã chọn + nút Xuất/Huỷ — chỉ hiện ở chế độ chọn trang xuất PDF */}

                                    <div className="px-6 py-3 border-t border-slate-200 bg-white flex items-center justify-between gap-4 shrink-0">
                                        <span className="text-sm font-bold text-slate-600">
                                            Đã chọn <span className="text-emerald-600">{selectedExportPages.size}</span> trang
                                        </span>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => { setShowTOC(false); setTocExportMode(false); }} className="px-4 py-2 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100 transition-colors">Huỷ</button>
                                            <button
                                                onClick={handleConfirmExportSelected}
                                                disabled={selectedExportPages.size === 0}
