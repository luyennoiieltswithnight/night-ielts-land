        // textarea, 8px mỗi bên = 16px, cộng thêm 1 chút cho con trỏ nhập khỏi bị che/xuống dòng
        // hụt 1 nhịp ngay khi vừa gõ thêm ký tự).
        const TEXTBOX_PADDING_PX = 24;

        // --- TRÌNH PHÁT FILE ÂM THANH NỔI (kéo-thả được) — hằng số dùng chung — port từ bản Night
        // IELTS Land. ---
        // Các mức tốc độ phát cho phép, bấm nút "1x" để đổi vòng qua từng mức theo đúng thứ tự này.
        const AUDIO_SPEED_STEPS = [0.5, 0.75, 1, 1.25];
        // Số "cột" (bucket) biên độ đỉnh tính trước cho CẢ file — cố định, không đổi theo mức zoom.
        // Zoom chỉ đổi cách VẼ lại (mỗi cột màn hình ứng với ít/nhiều bucket hơn), không tính lại từ
        // đầu — xem drawWaveform trong AudioPlayerBar. 4000 bucket đủ mịn để zoom sâu vẫn rõ nét với
        // hầu hết file (bài nghe thường 2-5 phút).
        const AUDIO_WAVEFORM_PEAKS = 4000;
        // Số pixel/giây tối đa khi zoom hết cỡ (giới hạn trên, tránh canvas quá khổ với file dài).
        const AUDIO_MAX_PX_PER_SEC = 600;
        const formatAudioTime = (s) => {
            if (!isFinite(s) || s < 0) s = 0;
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + String(sec).padStart(2, '0');
        };

        // --- COMPONENT TEXT BOX THÔNG MINH CÓ 3 NÚM RESIZE ---
        // QUAN TRỌNG (viết lại theo yêu cầu "text box khó dùng" — port từ bản Night IELTS Land):
        // TRƯỚC ĐÂY box có kích thước CỐ ĐỊNH (150x40) trừ khi tự kéo resize thủ công — gõ dài ra là
        // chữ bị bó hẹp/xuống dòng chật chội trong khung cũ, phải tự kéo giãn ra mới thấy hết. GIỜ
        // box tự "phình" ra theo đúng bề ngang chữ đang gõ (đo bằng canvas.measureText, khớp CHÍNH
        // XÁC font đang hiển thị) cho tới khi chạm mép phải trang (maxWidthPdf, App tính từ
        // basePageSize truyền xuống qua PdfPage) thì tự xuống dòng + tự cao thêm (đo bằng scrollHeight
        // của chính textarea) — gõ/xoá bớt chữ thì box cũng tự thu nhỏ lại theo, không còn khoảng
        // trống thừa. Việc kéo núm resize thủ công giờ có vai trò MỚI: phóng to/thu nhỏ CỠ CHỮ (đồng
        // thời với việc box đổi kích thước theo đúng ngón tay/con trỏ) — thay vì tự đặt 1 kích thước
        // khung cố định, vì khung giờ luôn tự khớp theo nội dung + cỡ chữ rồi.
        const PdfTextBox = React.memo(function PdfTextBox({ t, scale, updateText, removeText, maxWidthPdf }) {
            const [active, setActive] = useState(true);
            // QUAN TRỌNG (sửa lỗi "gõ bị nhảy giật giật nhẹ"): TRƯỚC ĐÂY viền đậm + nút Xoá + nắm kéo
            // Move + 3 núm resize hiện ra NGAY khi vừa chạm 1 lần vào box (dùng chung điều kiện "active"
            // với việc cho phép gõ chữ) — trong lúc gõ, box liên tục tự đổi kích thước (2 effect tự-giãn
            // bên dưới), kéo theo viền + 5 phần tử điều khiển định vị tuyệt đối đó phải định vị lại theo
            // MỌI lần đổi kích thước, tạo cảm giác "giật" nhẹ. Giờ TÁCH RIÊNG 2 khái niệm: "active" (cho
            // phép gõ chữ — vẫn bật ngay từ 1 lần chạm, để gõ chữ mượt mà không đợi) và "controlsVisible"
            // (hiện viền đậm + toàn bộ nút điều khiển — CHỈ bật khi chạm/click ĐÚP vào box, theo đúng yêu
            // cầu) — lúc chỉ đang gõ (controlsVisible=false), không còn phần tử điều khiển nào phải định
            // vị lại nữa nên hết giật.
            const [controlsVisible, setControlsVisible] = useState(false);
            // Mốc thời gian lần chạm gần nhất vào CHÍNH box này — dùng để tự bắt double-tap/double-click
            // (giống cơ chế bắt double-tap tạo box mới ở PdfPage) thay vì dựa vào sự kiện "dblclick" có
            // sẵn (không đáng tin cậy với Apple Pencil/chạm trên iPad).
            const lastBoxTapRef = useRef(0);
            const containerRef = useRef(null);
            const textareaRef = useRef(null);
            // Đang kéo resize thủ công (đổi cỡ chữ) -> tạm ngưng 2 effect tự-giãn-theo-nội-dung bên
            // dưới, tránh 2 cơ chế "giằng co" kích thước với nhau ngay trong lúc đang kéo.
            const isManualResizingRef = useRef(false);
            // Đếm nhịp mỗi khi VỪA buông tay sau khi kéo resize xong — đưa vào deps của 2 effect tự
            // giãn bên dưới để chúng CHẮC CHẮN được đánh giá lại đúng 1 lần ngay sau đó (dùng state
            // local, không đụng gì tới t/updateText, nên không có nguy cơ đọc phải closure t "cũ" từ
            // lúc bắt đầu kéo như khi cố tình gọi lại updateText ở đây).
            const [resizeTick, setResizeTick] = useState(0);
            // Hiện/ẩn bảng chọn cỡ chữ nổi phía trên nắm kéo Move — bật bằng cách chạm/click ĐÚP vào
            // chính nắm kéo đó (xem onMoveHandlePointerDown), tắt bằng cách chạm lại vào box hoặc chạm
            // ra ngoài (theo đúng yêu cầu "bấm lại vào box thì nó mất đi").
            const [showFontSizeControl, setShowFontSizeControl] = useState(false);
            // Mốc thời gian lần chạm gần nhất vào ĐÚNG nắm kéo Move — tách riêng khỏi lastBoxTapRef
            // (dùng cho double-tap vào THÂN box để hiện controlsVisible) vì đây là double-tap vào 1
            // phần tử con khác, cần đếm nhịp độc lập.
            const lastMoveHandleTapRef = useRef(0);

            // Focus tự động khi tạo mới
            useEffect(() => {
                if (active && textareaRef.current) {
                    textareaRef.current.focus();
                }
            }, [active]);

            // Bấm ra ngoài -> Ẩn box viền (tàng hình) + ẩn luôn các nút điều khiển nếu đang hiện.
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) {
                        setActive(false);
                        setControlsVisible(false);
                        setShowFontSizeControl(false);
                    }
                };
                document.addEventListener('pointerdown', handleClickOutside);
                return () => document.removeEventListener('pointerdown', handleClickOutside);
            }, []);

            // TỰ GIÃN CHIỀU RỘNG theo đúng bề ngang chữ đang gõ (đo bằng canvas, khớp chính xác font
            // đang hiển thị: fontPx = t.size * scale, y hệt style fontSize thật của textarea bên
            // dưới), giới hạn tối đa bằng maxWidthPdf (mép phải trang) — vượt quá thì tự đứng lại ở
            // mức tối đa, chữ sẽ tự xuống dòng bên trong (xử lý bởi effect đo chiều cao kế tiếp).
            // QUAN TRỌNG (sửa theo yêu cầu "resize không đổi cỡ chữ nữa"): nếu người dùng đã từng tự
            // kéo núm resize ngang/góc (t.manualWidth có giá trị — xem startResize), coi đó là bề rộng
            // CỐ ĐỊNH người dùng muốn (ví dụ cố tình để box hẹp lại cho xuống dòng sớm, hoặc rộng ra
            // thoáng hơn nội dung) — không còn tự co/giãn về đúng khít nội dung nữa, CHỈ vẫn tôn trọng
            // trần mép trang (maxWidthPdf) để không tràn ra ngoài. Chưa từng tự kéo lần nào thì vẫn tự
            // khít theo nội dung như trước (hành vi mặc định không đổi).
            useEffect(() => {
                if (isManualResizingRef.current) return;
                const maxAllowedPx = maxWidthPdf != null
                    ? Math.max(TEXTBOX_MIN_WIDTH * scale, maxWidthPdf * scale)
                    : Infinity;
                let desiredPx;
                if (t.manualWidth != null) {
                    desiredPx = Math.min(maxAllowedPx, Math.max(TEXTBOX_MIN_WIDTH * scale, t.manualWidth * scale));
                } else {
                    const fontPx = t.size * scale;
                    const maxLineWidthPx = measureMaxLineWidthPx(t.text, fontPx);
                    desiredPx = Math.min(maxAllowedPx, Math.max(TEXTBOX_MIN_WIDTH * scale, maxLineWidthPx + TEXTBOX_PADDING_PX));
                }
                const desiredPdf = desiredPx / scale;
                if (Math.abs(desiredPdf - (t.width || 150)) > 1) {
                    updateText(t.id, { ...t, width: desiredPdf });
                }
                // Cố ý CHỈ phụ thuộc vào nội dung/cỡ chữ/scale/giới hạn mép trang/bề rộng tự đặt — KHÔNG
                // phụ thuộc t.width/t (object đổi identity liên tục) để tránh vòng lặp effect vô hạn.
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [t.text, t.size, scale, maxWidthPdf, t.manualWidth, resizeTick]);

            // TỰ GIÃN CHIỀU CAO — chạy SAU khi chiều rộng ở effect trên đã áp dụng xong vào DOM
            // (useLayoutEffect, đồng bộ trước khi trình duyệt vẽ khung hình kế tiếp) để đo scrollHeight
            // ĐÚNG theo bề ngang MỚI (chữ đã xuống dòng khớp bề ngang đó), tránh đo hụt/thừa 1 nhịp.
            // Kỹ thuật chuẩn: tạm bỏ khoá "h-full" bằng style.height='auto' để textarea co theo đúng
            // nội dung thật, đọc scrollHeight, rồi trả lại như cũ — toàn bộ diễn ra TRƯỚC khi trình
            // duyệt vẽ hình (useLayoutEffect + setState đồng bộ) nên không hề có 1 khung hình nào bị
            // "nháy" giữa lúc đo và lúc áp dụng kích thước mới.
            // QUAN TRỌNG: nếu người dùng đã tự kéo núm resize dọc/góc (t.manualHeight), coi đó là chiều
            // cao TỐI THIỂU mong muốn (sàn) — vẫn LUÔN tự cao thêm nếu nội dung cần nhiều chỗ hơn (không
            // bao giờ để chữ bị cắt/khuất), nhưng không tự thu nhỏ xuống dưới mức đã tự đặt nữa khi xoá
            // bớt chữ (khác với chiều rộng — chiều cao luôn phải đủ để KHÔNG BAO GIỜ cắt mất chữ).
            useLayoutEffect(() => {
                if (isManualResizingRef.current) return;
                const ta = textareaRef.current;
                if (!ta) return;
                const prevHeight = ta.style.height;
                ta.style.height = 'auto';
                const neededPx = ta.scrollHeight;
                ta.style.height = prevHeight;
                const minHeightPx = TEXTBOX_MIN_HEIGHT * scale;
                const manualHeightPx = t.manualHeight != null ? t.manualHeight * scale : 0;
                const desiredPx = Math.max(minHeightPx, manualHeightPx, neededPx);
                const desiredPdf = desiredPx / scale;
                if (Math.abs(desiredPdf - (t.height || 40)) > 1) {
                    updateText(t.id, { ...t, height: desiredPdf });
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [t.text, t.size, t.width, scale, t.manualHeight, resizeTick]);

            // THUẬT TOÁN KÉO DI CHUYỂN BOX (di chuyển vị trí)
            // SỬA LỖI "text box không di chuyển được": trước đây việc kéo-thả di chuyển được lập
            // trình gián tiếp qua rất nhiều tầng (PdfTextBox -> PdfPage -> App giữ "dragState" ->
            // App lắng nghe pointermove/pointerup ở tận div gốc -> tự dò canvas bằng
            // document.querySelectorAll('.draw-canvas')[pageNum-1] -> bắn CustomEvent để PdfPage
            // nhận lại) — chuỗi này rất dễ gãy, đặc biệt khi có trang PDF nào đó CHƯA được render
            // (lazy-mount ngoài vùng nhìn thấy) làm lệch chỉ số canvas cần tìm. Bút TẨY/RESIZE vốn
            // đã hoạt động tốt vì tự xử lý gọn trong chính component, không phụ thuộc tầng nào khác
            // — nay áp dụng ĐÚNG cách làm y hệt cho việc "di chuyển", đơn giản & chắc chắn hơn hẳn:
            // tự tính độ lệch chuột ngay trong component này rồi gọi thẳng updateText, không cần
            // đi vòng qua App/PdfPage nữa.
            const startMove = (e) => {
                e.stopPropagation();
                e.preventDefault();

                const startX = e.clientX;
                const startY = e.clientY;
                const startTX = t.x;
                const startTY = t.y;

                const onMove = (ev) => {
                    const newX = startTX + (ev.clientX - startX) / scale;
                    const newY = startTY + (ev.clientY - startY) / scale;
                    updateText(t.id, { ...t, x: newX, y: newY });
                };

                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            // THUẬT TOÁN KÉO RESIZE BOX — theo yêu cầu MỚI: 3 núm resize (ngang/dọc/góc) giờ CHỈ đổi
            // kích thước khung, KHÔNG còn kèm đổi cỡ chữ nữa (đổi cỡ chữ giờ có cách riêng — xem bảng
            // chọn cỡ chữ nổi lên khi chạm đúp vào nắm kéo Move, bên dưới). Kích thước vừa kéo được ghi
            // luôn vào t.manualWidth/t.manualHeight — 2 effect "tự giãn theo nội dung" ở trên đọc lại 2
            // giá trị này để không tự ý ghi đè kích thước người dùng vừa tự đặt (xem giải thích chi tiết
            // ở 2 effect đó). Đặt cờ isManualResizingRef=true trong suốt lúc kéo để 2 effect đó tạm đứng
            // yên, không giằng co ngược lại kích thước đang kéo bằng tay.
            const startResize = (e, direction) => {
                e.stopPropagation();
                e.preventDefault();

                isManualResizingRef.current = true;

                const startX = e.clientX;
                const startY = e.clientY;

                // Lấy kích thước thực tế hiện tại
                const rect = containerRef.current.getBoundingClientRect();
                const startW = rect.width / scale;
                const startH = rect.height / scale;

                const onMove = (ev) => {
                    let w = startW;
                    let h = startH;
                    if (direction === 'w' || direction === 'both') {
                        w = startW + (ev.clientX - startX) / scale;
                    }
                    if (direction === 'h' || direction === 'both') {
                        h = startH + (ev.clientY - startY) / scale;
                    }
                    w = Math.max(TEXTBOX_MIN_WIDTH, w);
                    h = Math.max(TEXTBOX_MIN_HEIGHT, h);

                    const next = { ...t, width: w, height: h };
                    if (direction === 'w' || direction === 'both') next.manualWidth = w;
                    if (direction === 'h' || direction === 'both') next.manualHeight = h;
                    updateText(t.id, next);
                };

                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    // Buông tay xong mới cho 2 effect tự-giãn-theo-nội-dung chạy lại — chúng đọc lại
                    // manualWidth/manualHeight vừa ghi ở trên để tôn trọng đúng kích thước vừa kéo (chỉ
                    // vẫn tự cao thêm nếu nội dung cần nhiều chỗ hơn, không bao giờ để chữ bị cắt). Dùng
                    // resizeTick (state LOCAL) để ép effect chạy lại — KHÔNG gọi updateText({...t}) ở
                    // đây vì `t` trong closure này là giá trị "cũ" chụp lại lúc BẮT ĐẦU kéo, gọi lại sẽ
                    // vô tình ghi ĐÈ mất kích thước vừa kéo xong bằng giá trị cũ đó.
                    isManualResizingRef.current = false;
                    setResizeTick(v => v + 1);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            // Chạm/click ĐÚP vào nắm kéo Move -> bật/tắt bảng chọn cỡ chữ nổi phía trên (thay vì kéo di
            // chuyển) — chạm/kéo 1 lần vẫn di chuyển box như bình thường. Tự đo thời gian giữa 2 lần
            // chạm liên tiếp (giống mọi chỗ bắt double-tap khác trong file này) thay vì dùng "dblclick"
            // có sẵn của trình duyệt, vì sự kiện đó không đáng tin cậy với Apple Pencil/chạm trên iPad.
            const onMoveHandlePointerDown = (e) => {
                const now = Date.now();
                const isDouble = now - lastMoveHandleTapRef.current < 400;
                lastMoveHandleTapRef.current = now;
                if (isDouble) {
                    e.stopPropagation();
                    e.preventDefault();
                    setShowFontSizeControl(v => !v);
                    return;
                }
                startMove(e);
            };

            // Đổi cỡ chữ qua bảng chọn nổi (nút -/+) — áp dụng ngay lập tức, thấy chữ to/nhỏ dần liền.
            const adjustFontSize = (delta) => {
                const newSize = Math.max(8, Math.min(72, (t.size || 10) + delta));
                updateText(t.id, { ...t, size: newSize });
            };

            return (
                <div
                    ref={containerRef}
                    style={{
                        position: 'absolute',
                        left: t.x * scale,
                        top: t.y * scale,
                        width: (t.width || 150) * scale,
                        height: (t.height || 40) * scale,
                        // QUAN TRỌNG — sửa lỗi "chuyển qua bút chì thì không chọn được text box nữa,
                        // vẽ/viết đè lên box luôn": trước đây khi KHÔNG active, z-index box = 10, TRÙNG
                        // với z-index cố định (10) của canvas vẽ (.draw-canvas) — 2 phần tử này chỉ còn
                        // phân biệt được nhờ đúng vào THỨ TỰ trong DOM (box vốn nằm sau canvas trong
                        // JSX nên VỀ LÝ THUYẾT vẫn được vẽ đè lên trên), nhưng box khi không active lại
                        // gần như trong suốt hoàn toàn (không viền, không nền — xem className bên dưới)
                        // nên bất kỳ nét mực nào lỡ vẽ NGAY DƯỚI nó (canvas z=10, cùng mức) vẫn hiện rõ
                        // xuyên qua như thể vẽ ĐÈ LÊN box — đúng hiện tượng người dùng gặp phải. Nâng
                        // hẳn z-index box khi không active lên 15 (rõ ràng CAO HƠN canvas z=10, không
                        // còn dựa vào thứ tự DOM để "may rủi" phân định nữa) — box giờ LUÔN nhận đúng
                        // sự kiện chạm trước tiên để có thể chọn lại/di chuyển, bất kể đang ở chế độ vẽ
                        // hay không.
                        zIndex: active ? 100 : 15,
                    }}
                    /* QUAN TRỌNG — sửa lỗi kéo-thả/resize bị "ghì lại", không mượt: trước đây dùng
                       class "transition-all" ở đây, khiến MỌI thay đổi style (kể cả left/top/width/
                       height cập nhật liên tục bằng inline style lúc đang kéo) đều bị CSS animate
                       trong ~150ms thay vì áp dụng ngay lập tức — tạo cảm giác box bị "đuổi theo"
                       con trỏ/ngón tay có độ trễ thay vì bám sát tức thời. Đổi sang "transition-colors"
                       để CHỈ hiệu ứng mượt cho phần đổi màu viền/nền khi bật/tắt active, còn vị trí và
                       kích thước luôn cập nhật NGAY LẬP TỨC, bám sát 100% theo thao tác kéo. */
                    className={`group transition-colors ${controlsVisible ? 'border-2 border-dashed border-emerald-400 bg-white/70 shadow-lg backdrop-blur-md rounded-lg' : 'border-2 border-transparent bg-transparent'}`}
                    onPointerDown={(e) => {
                        e.stopPropagation();
                        setActive(true);
                        // Bấm/chạm vào thân box -> ẩn bảng chọn cỡ chữ nổi nếu đang hiện (theo đúng yêu
                        // cầu "bấm lại vào box thì nó mất đi"). Bảng chọn cỡ chữ tự chặn sự kiện này
                        // (stopPropagation riêng) nên bấm NGAY TRÊN bảng đó không bị tính là "bấm vào box".
                        setShowFontSizeControl(false);
                        // Bắt double-tap/double-click NGAY TRÊN box (tự đo thời gian giữa 2 lần chạm
                        // liên tiếp, giống cơ chế bắt double-tap tạo box mới trong PdfPage) — chỉ chạm
                        // đúp mới hiện viền đậm + các nút điều khiển, chạm 1 lần chỉ để gõ chữ tiếp.
                        const now = Date.now();
                        const isDouble = now - lastBoxTapRef.current < 400;
                        lastBoxTapRef.current = now;
                        if (isDouble) setControlsVisible(true);
                    }}
                >
                    {/* Nút Xóa — chỉ hiện khi đã chạm đúp (controlsVisible) */}
                    {controlsVisible && (
                        <button
                            onPointerDown={(e) => { e.stopPropagation(); removeText(t.id); }}
                            className="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-md touch-none z-20 hover:scale-110 transition-transform"
                        >
                            <i className="fas fa-times text-[10px]"></i>
                        </button>
                    )}

                    {/* Nắm Kéo Move (Bên Trên) — chỉ hiện khi đã chạm đúp vào box. Chạm/kéo 1 lần: di
                        chuyển box (như cũ). Chạm/click ĐÚP vào chính nắm này: hiện/ẩn bảng chọn cỡ chữ
                        nổi ngay phía trên (xem onMoveHandlePointerDown + bảng render bên dưới). */}
                    {controlsVisible && (
                        <div
                            onPointerDown={onMoveHandlePointerDown}
                            className="absolute -top-5 left-1/2 transform -translate-x-1/2 w-14 h-5 bg-emerald-500 text-white rounded-t-lg cursor-move shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600 transition-colors"
                            title="Kéo để di chuyển — chạm/click đúp để đổi cỡ chữ"
                        >
                            <i className="fas fa-grip-lines text-[10px]"></i>
                        </div>
                    )}

                    {/* Bảng chọn cỡ chữ nổi — hiện khi chạm đúp vào nắm kéo Move ở trên. Tự chặn sự
                        kiện pointerdown của chính nó (stopPropagation) để bấm nút -/+ bên trong KHÔNG bị
                        tính là "bấm vào box" (vốn dĩ sẽ tự ẩn bảng này đi, xem onPointerDown của container). */}
                    {controlsVisible && showFontSizeControl && (
                        <div
                            onPointerDown={(e) => e.stopPropagation()}
                            className="absolute -top-16 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white rounded-xl shadow-xl px-1.5 py-1.5 flex items-center gap-1.5 z-30 touch-none whitespace-nowrap"
                        >
                            <button
                                onPointerDown={(e) => { e.stopPropagation(); adjustFontSize(-1); }}
                                className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors active:scale-95"
                            >
                                <i className="fas fa-minus text-[10px]"></i>
                            </button>
                            <span className="text-xs font-bold w-8 text-center tabular-nums">{Math.round(t.size)}</span>
                            <button
                                onPointerDown={(e) => { e.stopPropagation(); adjustFontSize(1); }}
                                className="w-7 h-7 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors active:scale-95"
                            >
                                <i className="fas fa-plus text-[10px]"></i>
                            </button>
                        </div>
                    )}

                    {/* 3 NÚM ĐIỀU KHIỂN RESIZE CHO IPAD — chỉ hiện khi đã chạm đúp */}
                    {controlsVisible && (
                        <>
                            {/* Núm ngang */}
                            <div
                                onPointerDown={(e) => startResize(e, 'w')}
                                className="absolute top-1/2 -right-2 transform -translate-y-1/2 w-4 h-8 bg-emerald-500 text-white rounded-md cursor-e-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600"
                            >
                                <i className="fas fa-ellipsis-v text-[8px]"></i>
                            </div>

                            {/* Núm dọc */}
                            <div
                                onPointerDown={(e) => startResize(e, 'h')}
                                className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-8 h-4 bg-emerald-500 text-white rounded-md cursor-s-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600"
                            >
                                <i className="fas fa-ellipsis-h text-[8px]"></i>
                            </div>

                            {/* Núm 2 chiều góc dưới */}
                            <div
                                onPointerDown={(e) => startResize(e, 'both')}
                                className="absolute -bottom-2 -right-2 w-5 h-5 bg-emerald-600 text-white rounded-full cursor-se-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-700 hover:scale-110 transition-transform"
                            >
                                <i className="fas fa-expand-arrows-alt text-[10px] rotate-90"></i>
                            </div>
                        </>
                    )}

                    <textarea
                        ref={textareaRef}
                        value={t.text}
                        onChange={(e) => updateText(t.id, { ...t, text: e.target.value })}
                        placeholder="Gõ chữ..."
                        style={{
                            color: t.color,
                            fontSize: (t.size * scale) + 'px',
                            resize: 'none' // Khóa resize native vì đã dùng núm xịn
                        }}
                        className={`w-full h-full outline-none bg-transparent p-2 font-sans block leading-relaxed overflow-hidden ${active ? 'pointer-events-auto' : 'pointer-events-none'}`}
                    />
                </div>
            );
        });

        // --- PDF THUMBNAIL (FLOATING WINDOW) ---
        const PdfThumbnail = React.memo(function PdfThumbnail({ pdf, pageNum, onClick, selected }) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { setIsVisible(entry.isIntersecting); },
                    { rootMargin: '200px 0px' } 
                );
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!pdf || !isVisible) return;
                let cancelled = false;
                let realRenderTask = null;

                // Gộp CẢ getPage() LẪN render() làm 1 việc, đi qua chung hàng đợi (xem giải thích chi
                // tiết ở effect tương tự trong PdfPage) — tránh dồn hàng chục getPage() cùng lúc khi
                // cuộn nhanh trong mục lục file nhiều trang.
                const task = scheduleRender(() => {
                    const p = pdf.getPage(pageNum).then(page => {
                        if (cancelled) return;
                        const canvas = canvasRef.current;
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');
                        // Hạ tiếp độ phân giải render ảnh thu nhỏ (0.3 -> 0.2 -> 0.13): ô mục lục hiển
                        // thị rất nhỏ trên lưới (CSS đã tự co vừa khung qua object-cover) nên gần như
                        // không thấy khác biệt độ nét, nhưng giảm thêm ~58% số pixel so với mức 0.2
                        // trước đó — giúp mở mục lục và cuộn trong đó nhanh/nhẹ hơn nữa với file nhiều trang.
                        const viewport = page.getViewport({ scale: 0.13 });
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        realRenderTask = page.render({ canvasContext: ctx, viewport });
                        return realRenderTask.promise;
                    });
                    return {
                        promise: p,
                        cancel: () => {
                            cancelled = true;
                            if (realRenderTask) { try { realRenderTask.cancel(); } catch (err) {} }
                        }
                    };
                });

                return () => task.cancel();
            }, [pdf, pageNum, isVisible]);

            return (
                <div
                    ref={containerRef}
                    onClick={onClick}
                    className={"cursor-pointer border-2 rounded-xl overflow-hidden bg-white shadow-sm hover:shadow-xl transition-all flex flex-col relative group transform hover:-translate-y-1 " + (selected ? 'border-emerald-500 ring-2 ring-emerald-300' : 'border-slate-200 hover:border-emerald-500')}
                >
                    <div className="bg-slate-100 w-full aspect-[1/1.4] flex items-center justify-center relative overflow-hidden">
                        {isVisible ? <canvas ref={canvasRef} className="w-full h-full object-cover" /> : <i className="fas fa-file-pdf text-slate-300 text-3xl absolute"></i>}
                        <div className={"absolute inset-0 transition-opacity " + (selected ? 'bg-emerald-600/20 opacity-100' : 'bg-emerald-600/10 opacity-0 group-hover:opacity-100')}></div>
                        {/* Dấu tích chọn — chỉ hiện khi ở chế độ chọn trang để Xuất PDF (selected !== undefined).
                            Port từ bản Night IELTS Land. */}
                        {selected !== undefined && (
                            <div className={"absolute top-2 right-2 w-6 h-6 rounded-full flex items-center justify-center border-2 shadow " + (selected ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-white/80 border-slate-300 text-transparent')}>
                                <i className="fas fa-check text-xs"></i>
                            </div>
                        )}
                    </div>
                    <div className="absolute bottom-0 w-full bg-slate-900/70 backdrop-blur-sm text-center py-1.5">
                        <span className="text-xs font-extrabold text-white tracking-widest uppercase">Trang {pageNum}</span>
                    </div>
                </div>
            );
        });

        // --- CẤU HÌNH KIỂU NÉT VẼ CHO TỪNG LOẠI BÚT (1 nguồn duy nhất, dùng lại ở mọi nơi) ---
        // Gộp về 1 chỗ để tránh lặp code 3 nơi khác nhau (từng là nguyên nhân dễ gây lệch nét
        // giữa lúc đang vẽ và lúc redraw) — sửa độ dày/màu ở đây là áp dụng đồng bộ toàn bộ.
        // 3 mức độ dày cho bút chì: nhỏ nhất (mức cũ, mặc định) + 2 mức lớn hơn 1 chút.
        const PENCIL_SIZES = [2, 3.5, 5];
        const DEFAULT_PENCIL_SIZE = PENCIL_SIZES[0];
        // 3 mức "Độ ổn định nét vẽ" (làm mượt run tay khi viết) — port từ bản Night IELTS Land — 0 =
        // Tắt (giữ nguyên hành vi vẽ cũ, luôn là mặc định), 2 mức còn lại làm mượt tăng dần. Xem cách
        // dùng ở handlePointerMove trong PdfPage (bộ lọc trung bình trượt theo cấp số nhân — EMA). Áp
        // dụng chung cho bút chì lẫn Bút Present.
        const PEN_STABILITY_LEVELS = [0, 0.4, 0.65];
        // Bảng màu glow (viền phát sáng) có sẵn cho "Bút Present" — mặc định đỏ, người dùng có thể đổi
        // qua bảng nhỏ trong thanh tuỳ chọn riêng của bút này (bấm đúp vào nút bút Present để mở).
        const PEN_GLOW_COLORS = ['#EF4444', '#F97316', '#22D3EE', '#A855F7', '#22C55E'];
        // Thời gian tự mờ dần rồi biến mất của "Bút Present": bắt đầu mờ ở PEN_FADE_START_MS, biến
        // mất hẳn ở PEN_FADE_TOTAL_MS (1.5 giây).
        const PEN_FADE_TOTAL_MS = 1500;
        const PEN_FADE_START_MS = 800;

        // Bảng màu bút có sẵn (bấm chọn nhanh) — thay cho việc phải bấm vào 1 chấm tròn nhỏ để
        // mở bảng màu của hệ điều hành mỗi lần muốn đổi màu. Vẫn giữ 1 ô "tuỳ chỉnh" (icon ống hút
        // màu) cạnh bên để chọn màu bất kỳ ngoài 4 màu có sẵn này khi cần.
        const PRESET_COLORS = ['#4F46E5', '#EF4444', '#10B981', '#000000']; // rút gọn còn 4 màu cho thanh công cụ gọn hơn

        // QUAN TRỌNG — sửa lỗi "mở mục lục file nặng tải rất lâu": trước đây modal Mục lục tạo ra
        // CÙNG LÚC 1 component PdfThumbnail (kèm 1 IntersectionObserver riêng) cho TẤT CẢ các trang
        // của file — với sách vài trăm trang, chỉ riêng việc React dựng hàng trăm ô lưới + hàng trăm
        // observer trong 1 lần "commit" đã đủ làm nghẽn luồng chính ngay khi vừa bấm mở, trước khi ảnh
        // thu nhỏ nào kịp hiện ra. Giờ modal chỉ dựng 1 ĐỢT nhỏ (TOC_BATCH_SIZE ô) khi vừa mở, rồi tự
        // "tải thêm" từng đợt khi người dùng cuộn gần tới cuối danh sách hiện có — xem handleTocScroll.
        const TOC_BATCH_SIZE = 30;
        const TOOL_STYLES = {
            // Bút Magic (OCR + dịch + đọc): nét mảnh, đứt nét — mảnh hơn bản trước (3 -> 1.5)
            magic: { color: '#FBBF24', width: () => 1.5, alpha: 0.9, dash: [7, 5], useColorProp: false },
            // Bút IPA và bút tra ảnh: giờ CHỈ dùng cơ chế "kéo-thả ô chữ nhật" (giống bút Magic ở chế
            // độ hình chữ nhật) thay vì kiểu bút highlight quét ngang trước đây, nên khung vẽ ra chỉ là
            // 1 viền mảnh để người dùng thấy rõ vùng mình đang chọn — không còn tô phủ dày trong suốt nữa.
            ipa: { color: '#38BDF8', width: () => 2, alpha: 0.95, dash: [6, 4], useColorProp: false },
            photo: { color: '#FB7185', width: () => 2, alpha: 0.95, dash: [6, 4], useColorProp: false },
            // Bút AI: cùng kiểu viền mảnh đứt nét với Magic/IPA/tra ảnh (dễ phân biệt khỏi bút chì tô
            // đặc), riêng màu tím để khớp với màu chủ đạo của Box Bút AI (violet) — port từ bản IELTS.
            ai: { color: '#8B5CF6', width: () => 2, alpha: 0.95, dash: [6, 4], useColorProp: false },
            // Độ dày bút chì giờ lấy từ "pencilSize" (chọn được qua 3 nút chấm tròn trên thanh công
            // cụ khi đang dùng bút chì) thay vì cố định — mặc định vẫn y hệt độ dày cũ (2).
            pencil: { width: (s, pencilSizeVal) => (pencilSizeVal || DEFAULT_PENCIL_SIZE) * s, alpha: 0.6, dash: [], useColorProp: true },
            pen: { width: (s) => 4 * s, alpha: 1.0, dash: [], useColorProp: true },
            // "Bút Present" — port từ bản Night IELTS Land, TÁCH RIÊNG khỏi "pen" (Bút bi) hiện có để
            // không mất tính năng cũ: lõi trắng + viền glow đậm màu (mặc định đỏ, chọn được qua
            // PEN_GLOW_COLORS) — mô phỏng bút trình chiếu (như con trỏ laser/bút "present" trong
            // PowerPoint), dùng để khoanh/nhấn mạnh tạm thời lúc giảng bài chứ không phải ghi chú vĩnh
            // viễn — xem "fade" bên dưới (mờ dần rồi tự xoá, xem PEN_FADE_TOTAL_MS/PEN_FADE_START_MS).
            // Lõi LUÔN cố định màu trắng (useColorProp không dùng ở đây, xem strokePenTwoPass), CHỈ
            // riêng màu viền glow là tuỳ chỉnh được (lưu theo từng nét ở stroke.glowColor).
            present: { color: '#FFFFFF', width: (s) => (4 / 3) * s, glow: { defaultColor: PEN_GLOW_COLORS[0], blur: 7 / 3 }, fade: true },
            // Viền xem trước khi kéo-thả chọn vùng để TẨY (eraserShapeMode 'rect') — nét đứt màu đỏ,
            // cùng kiểu với viền xem trước của bút IPA/tra ảnh cho dễ nhận biết là đang ở chế độ chọn
            // vùng — port từ bản IELTS.
            eraser: { color: '#EF4444', width: () => 2, alpha: 0.9, dash: [6, 4], useColorProp: false },
        };
        // QUAN TRỌNG: hàm này KHÔNG dùng cho "Bút Present" (tool 'present') — bút đó cần vẽ 2 lượt
        // (glow + lõi) nên có helper riêng bên dưới (strokePenTwoPass). Vẫn luôn reset shadowBlur về 0
        // ở đây cho MỌI bút còn lại — bắt buộc phải reset vì ctx là dùng chung, nếu không glow của bút
        // Present (vẽ ở lượt trước đó trong cùng 1 lần vẽ lại) có thể "dính" lây sang các nét sau. Port
        // từ bản Night IELTS Land.
        const applyToolStyle = (ctx, toolName, colorProp, scaleVal, thicknessVal) => {
            const cfg = TOOL_STYLES[toolName];
            if (!cfg) return;
            ctx.strokeStyle = cfg.useColorProp ? colorProp : cfg.color;
            ctx.setLineDash(cfg.dash);
            ctx.lineWidth = cfg.width(scaleVal, thicknessVal);
            ctx.globalAlpha = cfg.alpha;
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
        };

        // "Bút Present" (tool 'present') — port từ bản Night IELTS Land: bút trình chiếu, lõi trắng +
        // viền glow đậm màu tự chọn, tự mờ dần rồi biến mất sau PEN_FADE_TOTAL_MS — dùng để khoanh/
        // nhấn mạnh tạm thời lúc giảng bài chứ không phải ghi chú vĩnh viễn, KHÔNG thay thế "Bút bi"
        // (tool 'pen') hiện có — 2 bút tồn tại song song, mỗi bút giữ đúng công dụng riêng.
        // "Bút Present": vẽ 2 lượt lên CÙNG 1 path đã dựng sẵn (moveTo/lineTo... — hàm này KHÔNG tự
        // gọi beginPath, chỉ lo việc tô 2 lượt lên path hiện có của ctx) — lượt 1 là viền glow bản to,
        // màu đậm nguyên khối kèm thêm chút shadowBlur toả mờ dần ra rìa ngoài (tạo cảm giác "gradient"
        // đậm dần từ trong ra ngoài); lượt 2 là lõi trắng mảnh, sắc nét, không glow, đè lên trên cùng.
        const PEN_GLOW_WIDTH_FACTOR = 1.6; // viền glow to hơn lõi bao nhiêu lần (theo blur*scale)
        const strokePenTwoPass = (ctx, scaleVal, thicknessVal, glowColorProp, alphaMultiplier) => {
            const cfg = TOOL_STYLES.present;
            const glowColor = glowColorProp || cfg.glow.defaultColor;
            const coreWidth = cfg.width(scaleVal, thicknessVal);
            const mult = alphaMultiplier == null ? 1 : alphaMultiplier;

            ctx.setLineDash([]);
            ctx.strokeStyle = glowColor;
            ctx.lineWidth = coreWidth + cfg.glow.blur * scaleVal * PEN_GLOW_WIDTH_FACTOR;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = cfg.glow.blur * scaleVal;
            ctx.globalAlpha = 0.9 * mult;
            ctx.stroke();

            ctx.strokeStyle = cfg.color;
            ctx.lineWidth = coreWidth;
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1 * mult;
            ctx.stroke();
        };

        // Chuyển 2 điểm chéo (kéo-thả kiểu marquee) thành 4 góc hình chữ nhật theo chiều kim đồng
        // hồ — dùng chung cho CẢ BA bút: Magic (chế độ hình chữ nhật), IPA và tra ảnh (giờ cả 2 bút
        // này đều LUÔN dùng kéo-thả hình chữ nhật thay vì kiểu highlight quét ngang trước đây, để
        // chọn trúng khít đúng vùng chữ cần, không còn bị mất nét/sai chữ do vùng cắt quá hẹp nữa).
        const rectPointsFromDiagonal = (p1, p2) => {
            const x1 = Math.min(p1.x, p2.x), x2 = Math.max(p1.x, p2.x);
            const y1 = Math.min(p1.y, p2.y), y2 = Math.max(p1.y, p2.y);
            return [{ x: x1, y: y1 }, { x: x2, y: y1 }, { x: x2, y: y2 }, { x: x1, y: y2 }];
        };

        // --- DỊCH VĂN BẢN (helper dùng chung cho cả thanh dịch Magic lẫn box tra Pinyin) ---
        // translate.googleapis.com/translate.google.com là API "chui" (không chính thức, không có
        // tài liệu công khai) mà Google dùng cho chính trang dịch của họ — không phải API dành cho
        // ai cũng gọi tự do, nên Google có cơ chế phát hiện & tạm khoá các thiết bị/IP gọi endpoint
        // này quá nhiều/quá nhanh (hiện đúng trang "We're sorry... your computer or network may be
        // sending automated queries"), KHÔNG liên quan gì đến Wi-Fi/4G hay Safari/CORS gì cả — đơn
        // giản là do gọi thử đi thử lại nhiều lần lúc test nên bị đánh dấu khả nghi. Vì lỗi này có
        // thể tự nhiên xảy ra bất cứ lúc nào (không đoán trước được, không phải lỗi trong code), nếu
        // chỉ dựa vào 1 mình Google thì app sẽ có lúc bị "đứng dịch" hoàn toàn. Nên ở đây: thử lần
        // lượt 2 domain của Google trước (nhanh, không giới hạn khi chưa bị khoá), nếu CẢ 2 đều lỗi
        // (bị khoá, mất mạng, JSON trả về không hợp lệ...) thì tự động rơi xuống dùng MyMemory
        // (api.mymemory.translated.net) — 1 dịch vụ dịch máy MIỄN PHÍ, CHÍNH THỨC cho phép gọi trực
        // tiếp từ trình duyệt (có bật CORS công khai, không cần khoá API), nên không bị chặn kiểu
        // "automated queries" như trên. Giới hạn dùng ẩn danh khoảng vài trăm chữ/lượt, đủ cho 1
        // câu/đoạn ngắn quét được bằng bút Magic hay Pinyin.
        const translateText = async (text, sl, tl) => {
            const googleHosts = ['translate.googleapis.com', 'translate.google.com'];
            for (const host of googleHosts) {
                try {
                    const url = 'https://' + host + '/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
                    const res = await fetch(url);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!data || !data[0]) throw new Error('Dữ liệu trả về rỗng');
                    let result = '';
                    data[0].forEach(chunk => { if (chunk[0]) result += chunk[0]; });
                    if (result) return result;
                } catch (err) { /* thử domain/nguồn tiếp theo */ }
            }

            // Cả 2 domain Google đều lỗi — rơi xuống MyMemory.
            const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + encodeURIComponent(sl + '|' + tl);
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            const result = data && data.responseData && data.responseData.translatedText;
            if (!result) throw new Error('Dữ liệu trả về rỗng');
            return result;
        };

        // Tách cụm chữ Hán đầu tiên từ văn bản OCR ra được — dùng chung cho tra pinyin (pinyin-pro)
        // lẫn mở link từ điển đầy đủ (Hanzii).
        // Khác tiếng Anh (từ cách nhau bằng dấu cách nên tách bằng [A-Za-z']+), chữ Hán không có dấu
        // cách giữa các từ — nên lấy nguyên cụm ký tự Hán liên tiếp đầu tiên nhận diện được (đúng với
        // cách dùng: người dùng khoanh vùng đúng 1 từ/cụm từ muốn tra), bỏ qua số/dấu câu/ký tự latin
        // lẫn vào do OCR nhận nhầm.
        const extractFirstWord = (rawText) => {
            // U+4E00–U+9FFF: CJK Unified Ideographs (khoi chu Han chinh) - U+3400–U+4DBF: CJK Extension A - U+F900–U+FAFF: CJK Compatibility Ideographs.
            const match = (rawText || '').match(/[一-鿿㐀-䶿豈-\ufaff]+/);
            return match ? match[0] : '';
        };

        // --- TRA CỨU PINYIN + NGHĨA TIẾNG VIỆT — pinyin-pro (thư viện chạy hoàn toàn phía client,
        // không cần gọi API/mạng cho phần phiên âm — window.pinyinPro.pinyin(text) trả về pinyin có
        // dấu thanh điệu, ví dụ "汉语拼音" -> "hàn yǔ pīn yīn") ghép với 1 lần gọi Google Dịch để lấy
        // nghĩa tiếng Việt ngắn gọn cho đúng từ/cụm từ vừa quét (dùng lại endpoint dịch không chính
        // thức sl=zh-CN&tl=vi giống thanh dịch Magic ở trên, chỉ khác là dịch 1 từ đơn lẻ).
        const _dictCache = {}; // cache theo từ để tránh gọi lại API khi quét trùng 1 từ nhiều lần
        const fetchIPAInfo = async (rawText) => {
            const word = extractFirstWord(rawText);
            if (!word) return { word: '', error: 'Không nhận diện được chữ Hán trong vùng đã quét.' };
            if (_dictCache[word]) return _dictCache[word];

            try {
                const pinyin = (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function')
                    ? window.pinyinPro.pinyin(word)
                    : '';

                let definition = '';
                try {
                    definition = (await translateText(word, 'zh-CN', 'vi')).trim();
                } catch (e) { /* bỏ qua lỗi dịch, vẫn giữ pinyin nếu có */ }

                const result = { word, pinyin, definition, error: (!pinyin && !definition) ? 'Không tra được dữ liệu cho từ này.' : '' };
                // Chỉ cache khi có ít nhất pinyin hoặc nghĩa — tránh việc 1 lần lỗi mạng tạm thời bị
                // nhớ mãi, khiến những lần quét lại từ này sau (dù mạng đã ổn định) vẫn báo lỗi cũ.
                if (pinyin || definition) _dictCache[word] = result;
                return result;
            } catch (err) {
                const result = { word, pinyin: '', definition: '', error: 'Không tìm thấy từ "' + word + '" trong từ điển.' };
                return result;
            }
        };

        // --- BÚT TRA ẢNH MINH HOẠ: mở 1 cửa sổ Google Hình ảnh THẬT, đặt bên phải màn hình ---
        // Vì Google chặn nhúng (iframe) trang kết quả của họ vào web khác, cách khả thi & đúng ý
        // "cửa sổ nằm bên phải, hình chữ nhật đứng to" là mở 1 popup window thật với kích thước/
        // vị trí được set sẵn (trên Mac/laptop sẽ đúng như ý; trên iPad Safari trình duyệt sẽ tự
        // mở dạng tab do hệ điều hành quản lý, đó là giới hạn của chính Safari chứ không phải bug).
        //
        // Để KHÔNG bị trình duyệt chặn popup: cửa sổ được mở NGAY LẬP TỨC (đồng bộ) trong lúc
        // đang xử lý cử chỉ chạm/thả bút của người dùng — trước khi chờ kết quả OCR bất đồng bộ —
        // sau đó mới điều hướng cửa sổ đó sang URL tìm kiếm thật khi có chữ.
        const openPhotoLookupWindow = () => {
            try {
                const w = 460;
                const h = Math.max(500, Math.round((window.screen.availHeight || 900) * 0.85));
                const left = Math.max(0, Math.round((window.screen.availWidth || window.innerWidth) - w - 24));
                const top = 50;
                const win = window.open('about:blank', 'nightChinesePhotoLookup', `width=${w},height=${h},left=${left},top=${top}`);
                if (win && win.document) {
                    win.document.title = 'Đang tra ảnh minh hoạ…';
                    win.document.body.style.cssText = 'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#ECFDF5;font-family:sans-serif;color:#059669;font-size:18px;text-align:center;padding:24px;box-sizing:border-box;';
                    win.document.body.textContent = 'Đang quét chữ & tìm ảnh minh hoạ…';
                }
                return win;
            } catch (err) { return null; }
        };
        const navigatePhotoLookupWindow = (win, text) => {
            if (!win || win.closed) return;
            const clean = (text || '').replace(/\s+/g, ' ').trim();
            if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                try {
                    win.document.body.textContent = 'Không nhận diện được chữ trong vùng đã quét. Cửa sổ này sẽ tự đóng…';
                    setTimeout(() => { try { win.close(); } catch (e) {} }, 1800);
                } catch (e) {}
                return;
            }
            win.location.href = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(clean);
        };

        // --- BÚT IPA: mở 1 cửa sổ Hanzii THẬT cho từ vừa quét ---
        // Dùng lại y hệt cơ chế "mở popup rỗng ngay trong cử chỉ chạm -> điều hướng sau khi có
        // kết quả OCR" của bút tra ảnh ở trên, để trình duyệt không chặn popup. Đặt cùng vị trí/
        // kích thước bên phải màn hình cho nhất quán. Hanzii.net = từ điển Trung-Việt, chủ yếu index
        // chữ giản thể — mở trang word đầy đủ (nghĩa tiếng Việt, ví dụ câu) bổ sung cho box pinyin
        // tóm tắt lấy từ pinyin-pro + Google Dịch ở trên.
        const openIPALookupWindow = () => {
            try {
                const w = 460;
                const h = Math.max(500, Math.round((window.screen.availHeight || 900) * 0.85));
                const left = Math.max(0, Math.round((window.screen.availWidth || window.innerWidth) - w - 24));
                const top = 50;
                const win = window.open('about:blank', 'nightChineseIPALookup', `width=${w},height=${h},left=${left},top=${top}`);
                if (win && win.document) {
                    win.document.title = 'Đang tra Hanzii…';
                    win.document.body.style.cssText = 'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#EFF6FF;font-family:sans-serif;color:#0284C7;font-size:18px;text-align:center;padding:24px;box-sizing:border-box;';
                    win.document.body.textContent = 'Đang quét chữ & mở từ điển Hanzii…';
                }
                return win;
            } catch (err) { return null; }
        };
        const navigateIPALookupWindow = (win, word) => {
            if (!win || win.closed) return;
            if (!word) {
                try {
                    win.document.body.textContent = 'Không nhận diện được chữ Hán trong vùng đã quét. Cửa sổ này sẽ tự đóng…';
                    setTimeout(() => { try { win.close(); } catch (e) {} }, 1800);
                } catch (e) {}
                return;
            }
            win.location.href = 'https://hanzii.net/search/word/' + encodeURIComponent(word) + '?hl=vi';
        };

        // --- SINGLE PDF PAGE ---
        // Bọc thêm React.forwardRef (giữ nguyên React.memo bên ngoài) để App có thể "gọi vào" từng
        // trang lấy ảnh chụp nét vẽ + text đã ghi (getAnnotationSnapshot, xem useImperativeHandle bên
        // dưới) — phục vụ tính năng "Lưu ghi chú vào file" (xuất PDF đã dán note) ở component App.
        const PdfPage = React.memo(React.forwardRef(function PdfPage({ pdf, pageNum, scale, isDrawingMode, tool, magicShapeMode, aiShapeMode, pencilShapeMode, eraserShapeMode, penStability, penGlowColor, color, fontSize, pencilSize, basePageSize, onExtractText, onIPALookup, onPhotoLookup, onAILookup, onTextsChange }, ref) {
            const canvasRef = useRef(null);
            const drawCanvasRef = useRef(null);
            const [viewport, setViewport] = useState(null);

            const [strokes, setStrokes] = useState([]);
            const [texts, setTexts] = useState([]);
            // Khung tẩy "Chọn vùng" đã kéo xong, đang chờ bấm nút "Xoá" mới thực sự xoá (xem
            // handlePointerUp) — { p1, p2 } đơn vị PDF-space (scale=1), hoặc null khi không có.
            // Port từ bản Night IELTS Land.
            const [pendingErase, setPendingErase] = useState(null);
            const [isVisible, setIsVisible] = useState(false);
            const containerRef = useRef(null);

            const isDrawingRef = useRef(false);
            const currentStrokeRef = useRef(null);
            // smoothedPointRef: điểm đã "mượt hoá" gần nhất (xem penStability/handlePointerMove) —
            // reset về điểm bắt đầu mỗi khi đặt bút xuống. Port từ bản Night IELTS Land.
            const smoothedPointRef = useRef(null);
            // Đếm thời điểm + vị trí lần chạm gần nhất bằng bút "text" — dùng để bắt "gõ đúp" (double
            // tap/click) thay vì tạo box ngay từ lần chạm đầu tiên (giảm tạo nhầm box khi chỉ định
            // chạm 1 lần để làm việc khác, ví dụ chọn công cụ rồi lỡ chạm nhầm vào trang). Port từ
            // bản Night IELTS Land.
            const lastTextTapRef = useRef({ time: 0, x: 0, y: 0 });
            // QUAN TRỌNG — nhớ đã render xong cho (pdf, scale) nào rồi: canvas giờ LUÔN nằm sẵn
            // trong DOM (chỉ ẩn/hiện bằng display, không hề unmount) nên nội dung đã vẽ vẫn còn
            // nguyên khi ẩn đi rồi hiện lại — KHÔNG cần render lại từ đầu mỗi lần isVisible bật lại
            // true nữa. Phải nhớ CẢ pdf (không chỉ scale): vì các PdfPage dùng key={pageNum} cố định,
            // khi người dùng mở 1 file MỚI (pdfDoc đổi nhưng cùng số trang) thì React TÁI SỬ DỤNG lại
            // đúng các instance PdfPage cũ theo key — nếu chỉ so scale mà quên so cả pdf, trang của
            // file mới sẽ bị coi nhầm là "đã render rồi" và không chịu vẽ lại.
            const renderedRef = useRef({ pdf: null, scale: null });

            useEffect(() => {
                // Vùng đệm preload nhỏ hơn (600px thay vì 1000px): vẫn đủ để cuộn mượt mà không
                // giữ quá nhiều canvas nặng cùng lúc trong bộ nhớ — quan trọng với iPad vì RAM
                // hạn chế hơn nhiều so với máy Mac, giúp giảm nguy cơ Safari phải "giải phóng" tab.
                const observer = new IntersectionObserver(
                    ([entry]) => { setIsVisible(entry.isIntersecting); },
                    { rootMargin: '600px 0px' }
                );
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            // QUAN TRỌNG — nguyên nhân THẬT SỰ của "cuộn lùi bị nhảy mấy chục trang" (đã đào sâu lại
            // sau nhiều lần sửa wheel không ăn thua): effect này trước đây RENDER LẠI TỪ ĐẦU (gọi lại
            // pdf.getPage + page.render + redrawStrokes — đều là việc NẶNG) MỖI LẦN isVisible chuyển
            // từ false -> true, kể cả khi trang đó đã render xong rồi và chỉ đơn giản cuộn ra xa rồi
            // quay lại! Khi cuộn LÙI qua 1 vùng đã đọc/ghi chú trước đó (đúng như người dùng nhận xét:
            // "trang đó đã tải rồi"), rất nhiều trang ĐÃ RENDER cùng lúc lọt lại vào vùng đệm 600px và
            // toàn bộ đều bị render lại từ đầu + vẽ lại hết các nét bút đã ghi (redrawStrokes) — dồn 1
            // đợt việc nặng lên luồng chính, đúng lúc đang xử lý cả loạt sự kiện wheel, gây khựng/dồn
            // input rồi "nhảy" ra ngoài ý muốn. Cuộn XUÔI ít gặp vì đa số trang phía trước là trang
            // "nguội" (chưa render lần nào) — quét qua landmark thường chậm dần đều chứ không dồn cục.
            // Sửa TẬN GỐC: chỉ render 1 LẦN cho mỗi (file, scale) — dùng renderedRef nhớ lại đã render
            // cho pdf/scale nào, lần isVisible bật lại true sau đó (cùng file, cùng scale) sẽ bỏ qua
            // toàn bộ, canvas vẫn còn nguyên nội dung cũ vì chưa từng bị gỡ khỏi DOM. Chỉ render lại
            // thật sự khi đổi scale (zoom) hoặc đổi sang file khác — 2 trường hợp bắt buộc phải vẽ lại.
            useEffect(() => {
                if (!pdf || !isVisible) return;
                if (renderedRef.current.pdf === pdf && renderedRef.current.scale === scale) return; // đã render đúng file+scale này rồi — khỏi làm lại
                let cancelled = false;
                let realRenderTask = null;

                const task = scheduleRender(() => {
                    const p = pdf.getPage(pageNum).then(page => {
                        if (cancelled) return; // effect đã bị dọn (vd trang cuộn ra khỏi vùng đệm) trước khi tới lượt

                        const vp = page.getViewport({ scale });
                        setViewport(vp);

                        // QUAN TRỌNG — sửa lỗi "trang bị trắng ra 1 tý rồi mới trở lại khi zoom (đặc
                        // biệt rõ khi pinch/zoom 2 ngón trên trackpad)" — port từ bản Night IELTS Land:
                        // trước đây đổi canvas.width/height của canvas ĐANG HIỂN THỊ ngay lập tức — mà
                        // cứ đổi width/height của 1 canvas là trình duyệt XOÁ TRẮNG nội dung cũ NGAY TỨC
                        // THÌ, còn phải đợi page.render() (việc bất đồng bộ, tốn 1 khoảng thời gian) vẽ
                        // xong nội dung mới thì mới hết trắng — chính là khoảng "trắng trang" người dùng
                        // thấy. Sửa: render vào 1 canvas TẠM (offscreen, không nằm trong DOM, người dùng
                        // không nhìn thấy) trước — canvas đang hiển thị vẫn giữ NGUYÊN nội dung cũ (chỉ
                        // tự động co giãn theo CSS 100% để khớp khung đã đổi kích thước, hơi mờ 1 chút
                        // trong lúc chờ — coi như hiệu ứng xem trước khi zoom, không hề bị trắng). Chỉ
                        // khi nào render xong hoàn toàn mới đổi width/height của canvas thật rồi vẽ ảnh
                        // đã render sẵn qua NGAY LẬP TỨC (đồng bộ, cùng 1 nhịp) — khoảng trắng chỉ tồn
                        // tại trong đúng 1 canvas tạm vô hình, không bao giờ lọt vào khung hình mà người
                        // dùng thực sự nhìn thấy.
                        const offCanvas = document.createElement('canvas');
                        offCanvas.width = vp.width;
                        offCanvas.height = vp.height;
                        const offCtx = offCanvas.getContext('2d');
                        realRenderTask = page.render({ canvasContext: offCtx, viewport: vp });
                        return realRenderTask.promise.then(() => {
                            if (cancelled) return;
                            const canvas = canvasRef.current;
                            const drawCanvas = drawCanvasRef.current;
                            if (!canvas || !drawCanvas) return;

                            canvas.height = vp.height;
                            canvas.width = vp.width;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(offCanvas, 0, 0);

                            drawCanvas.height = vp.height;
                            drawCanvas.width = vp.width;

                            redrawStrokes();
                            renderedRef.current = { pdf, scale };
                        });
                    });
                    return {
                        promise: p,
                        cancel: () => {
                            cancelled = true;
                            if (realRenderTask) { try { realRenderTask.cancel(); } catch (err) {} }
                        }
                    };
                });

                return () => task.cancel();
            }, [pdf, pageNum, scale, isVisible]);

            // GHI CHÚ: từng thử thay listener JS dưới đây bằng CSS "touch-action: none" để đỡ tốn JS,
            // nhưng touch-action là thuộc tính CSS thuần — không phân biệt được ngón tay hay Apple
            // Pencil, nên "none" chặn cứng LUÔN CẢ việc cuộn trang bằng ngón tay, làm hỏng tính năng
            // quan trọng "ngón tay để cuộn, bút để viết, tỳ tay không bị nhận nhầm nét vẽ". Đã revert
            // lại đúng cơ chế JS phân biệt theo touchType như cũ — CHỈ preventDefault khi phát hiện
            // có Apple Pencil trong lượt chạm, ngón tay/tỳ tay vẫn cuộn trang bình thường.
            useEffect(() => {
                const canvas = drawCanvasRef.current;
                if (!canvas || !isVisible) return;

                const preventTouchScroll = (e) => {
                    if (!isDrawingMode) return;
                    let isStylus = false;
                    if (e.touches && e.touches.length > 0) {
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].touchType === 'stylus' || e.touches[i].touchType === 'pen') {
                                isStylus = true;
                            }
                        }
                    }
                    if (isStylus) e.preventDefault();
                };

                canvas.addEventListener('touchstart', preventTouchScroll, { passive: false });
                canvas.addEventListener('touchmove', preventTouchScroll, { passive: false });

                return () => {
                    canvas.removeEventListener('touchstart', preventTouchScroll);
                    canvas.removeEventListener('touchmove', preventTouchScroll);
                };
            }, [isDrawingMode, isVisible]);

            const redrawStrokes = useCallback(() => {
                const drawCanvas = drawCanvasRef.current;
                if (!drawCanvas) return;
                const ctx = drawCanvas.getContext('2d');
                ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const drawLine = (stroke) => {
                    if (!stroke || !stroke.points || stroke.points.length === 0) return;

                    // QUAN TRỌNG — hiệu ứng "Bút Present" tự mờ dần rồi biến mất — port từ bản Night
                    // IELTS Land: mỗi nét của bút này có kèm createdAt (lúc lưu ở handlePointerUp) —
                    // mỗi lần vẽ lại, tính tuổi của nét NGAY LÚC ĐANG VẼ (không lưu sẵn vào state, luôn
                    // tính mới từ Date.now() để mờ dần mượt theo thời gian thực) rồi nhân thêm vào
                    // globalAlpha. Bỏ hẳn việc vẽ khi đã hết hạn — nét đó sẽ được dọn khỏi state ngay
                    // sau (xem effect "hiệu ứng mờ dần" trong PdfPage) nên không cần lo tồn đọng.
                    const cfgForFade = TOOL_STYLES[stroke.tool];
                    let fadeFactor = 1;
                    if (cfgForFade && cfgForFade.fade && stroke.createdAt) {
                        const age = Date.now() - stroke.createdAt;
                        if (age >= PEN_FADE_TOTAL_MS) return;
                        if (age > PEN_FADE_START_MS) fadeFactor = 1 - (age - PEN_FADE_START_MS) / (PEN_FADE_TOTAL_MS - PEN_FADE_START_MS);
                    }

                    ctx.beginPath();

                    // Chế độ "Hình chữ nhật" (kéo-thả): dùng chung cho bút Magic (khi bật chế độ hình
                    // chữ nhật) VÀ bút IPA / tra ảnh (giờ luôn dùng kéo-thả) — vẽ khung chữ nhật thay
                    // vì nối các điểm như nét vẽ tay thường. "Bút Present" không bao giờ dùng shape:
                    // 'rect' nên nhánh này không cần quan tâm tới strokePenTwoPass.
                    if (stroke.shape === 'rect' && stroke.points.length >= 2) {
                        applyToolStyle(ctx, stroke.tool, stroke.color, scale, pencilSize);
                        ctx.globalAlpha = ctx.globalAlpha * fadeFactor;
                        const p1 = stroke.points[0], p2 = stroke.points[1];
                        const x = Math.min(p1.x, p2.x) * scale;
                        const y = Math.min(p1.y, p2.y) * scale;
                        const w = Math.abs(p2.x - p1.x) * scale;
                        const h = Math.abs(p2.y - p1.y) * scale;
                        ctx.strokeRect(x, y, w, h);
                        ctx.setLineDash([]);
                        return;
                    }

                    ctx.moveTo(stroke.points[0].x * scale, stroke.points[0].y * scale);
                    for (let i = 1; i < stroke.points.length; i++) {
                        ctx.lineTo(stroke.points[i].x * scale, stroke.points[i].y * scale);
                    }

                    if (stroke.tool === 'present') {
                        // "Bút Present": vẽ 2 lượt (glow + lõi) lên CÙNG path vừa dựng ở trên.
                        strokePenTwoPass(ctx, scale, pencilSize, stroke.glowColor, fadeFactor);
                    } else {
                        applyToolStyle(ctx, stroke.tool, stroke.color, scale, pencilSize);
                        ctx.globalAlpha = ctx.globalAlpha * fadeFactor;
                        ctx.stroke();
                    }
                    ctx.setLineDash([]);
                };

                strokes.forEach(drawLine);
                if (currentStrokeRef.current) drawLine(currentStrokeRef.current);
                // Khung tẩy đang chờ xác nhận (đã buông tay, đợi bấm nút "Xoá") — vẽ lại y hệt kiểu
                // viền đứt đỏ như lúc đang kéo, để khung không biến mất trong lúc chờ người dùng quyết
                // định xoá hay không. Port từ bản Night IELTS Land.
                if (pendingErase) drawLine({ tool: 'eraser', shape: 'rect', points: [pendingErase.p1, pendingErase.p2] });
            }, [strokes, scale, pencilSize, pendingErase]);

            useEffect(() => { if(isVisible) redrawStrokes(); }, [redrawStrokes, isVisible]);

            // QUAN TRỌNG — vòng lặp riêng cho hiệu ứng "Bút Present" tự mờ dần rồi biến mất — port từ
            // bản Night IELTS Land: CHỈ chạy khi trang đang hiện ra (isVisible) VÀ đang thực sự có ít
            // nhất 1 nét bút Present còn "sống" — tránh tốn CPU chạy requestAnimationFrame vô ích ở
            // các trang không liên quan. Mỗi khung hình gọi lại redrawStrokes() để mờ dần mượt theo
            // thời gian thực, đồng thời dọn khỏi state những nét đã hết hạn.
            useEffect(() => {
                if (!isVisible) return;
                const hasFadingStrokes = strokes.some(s => s.tool === 'present' && s.createdAt);
                if (!hasFadingStrokes) return;
                let rafId;
                const tick = () => {
                    redrawStrokes();
                    const now = Date.now();
                    setStrokes(prev => {
                        const kept = prev.filter(s => !(s.tool === 'present' && s.createdAt && now - s.createdAt >= PEN_FADE_TOTAL_MS));
                        return kept.length === prev.length ? prev : kept;
                    });
                    rafId = requestAnimationFrame(tick);
                };
                rafId = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(rafId);
            }, [strokes, isVisible, redrawStrokes]);

            // QUAN TRỌNG — 1 trong 2 nguồn gây "viết vài nét là đứng màn hình iPad": mỗi lần
            // getCoordinates() chạy, canvas.getBoundingClientRect() buộc trình duyệt phải tính lại
            // layout (forced synchronous reflow) NGAY LẬP TỨC. Apple Pencil trên iPad Pro/ProMotion
            // có thể bắn sự kiện pointermove tới 120-240 lần/giây — nếu mỗi lần di chuyển bút đều ép
            // tính lại layout, chỉ vài giây viết liên tục là hàng trăm/nghìn lần reflow dồn vào luồng
            // chính, đủ để làm nghẽn hẳn UI (giống hệt "đứng hình"). Vì canvas KHÔNG đổi vị trí/kích
            // thước trong lúc đang vẽ 1 nét, giờ chỉ tính rect 1 LẦN DUY NHẤT lúc đặt bút xuống
            // (refreshRect=true) rồi dùng lại (cache) cho toàn bộ các lần di chuyển tiếp theo của
            // đúng nét đó — không còn ép reflow liên tục theo tần suất bút nữa.
            const canvasRectRef = useRef(null);
            const getCoordinates = (e, refreshRect) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                if (refreshRect || !canvasRectRef.current) {
                    canvasRectRef.current = canvas.getBoundingClientRect();
                }
                const rect = canvasRectRef.current;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: ((e.clientX - rect.left) * scaleX) / scale,
                    y: ((e.clientY - rect.top) * scaleY) / scale
                };
            };

            const handlePointerDown = (e) => {
                if (!isDrawingMode) return;
                if (e.pointerType === 'touch') return;

                // refreshRect=true: đầu 1 nét vẽ mới — tính lại rect 1 lần, cache dùng cho cả nét.
                const coords = getCoordinates(e, true);

                // QUAN TRỌNG — chốt chặn thứ 2 (bên cạnh việc nâng z-index của text box ở trên) cho lỗi
                // "chuyển qua bút chì thì vẽ/viết đè lên text box": phòng trường hợp điểm đặt bút NẰM
                // TRÙNG đúng lên 1 text box đang có sẵn (kể cả khi trình duyệt vì lý do nào đó vẫn coi
                // canvas là target, ví dụ đang rê 1 nét bắt đầu từ ngoài box rồi quét ngang qua nó) —
                // huỷ hẳn, không bắt đầu nét vẽ nào cả, để tránh mực đè lên/xuyên qua đúng lúc box đang
                // gần như trong suốt (không viền/không nền khi chưa active). Người dùng cần bấm lại
                // ĐÚNG vào giữa box để chọn nó thay vì vẽ nhầm lên.
                const hitTextBox = texts.some(t => {
                    const w = t.width || 150, h = t.height || 40;
                    return coords.x >= t.x && coords.x <= t.x + w && coords.y >= t.y && coords.y <= t.y + h;
                });
                if (hitTextBox) return;

                // Mở khoá audio ngay trong cử chỉ chạm thật gần nhất trước khi có thể cần đọc to
                // văn bản (bút Magic/IPA) — giúp giọng đọc Online chắc chắn được Safari/iPadOS cho
                // phép phát thay vì âm thầm chặn. Gọi vô hại với các bút khác, không tốn kém.
                unlockAudio();

                try { e.target.setPointerCapture(e.pointerId); } catch(err) {}

                if (tool === 'eraser') {
                    isDrawingRef.current = true;
                    // Chế độ tẩy "Chọn vùng" (kéo-thả hình chữ nhật, giống mấy cây bút khác) — KHÔNG
                    // xoá ngay khi buông tay nữa (xem handlePointerUp): chỉ vẽ khung xem trước, đợi
                    // người dùng bấm nút "Xoá" hiện ra phía trên khung mới thực sự xoá — tránh xoá nhầm
                    // khi chỉ định kéo thử/chỉnh lại vùng chọn. Bắt đầu 1 lượt chọn MỚI thì dọn khung
                    // "Xoá" cũ (nếu có) đi luôn. Port từ bản Night IELTS Land.
                    if (eraserShapeMode === 'rect') {
                        setPendingErase(null);
                        currentStrokeRef.current = { id: Date.now(), tool: 'eraser', shape: 'rect', points: [coords, coords] };
                        return;
                    }
                    handleErase(coords.x, coords.y);
                    return;
                }

                if (tool === 'text') {
                    // YÊU CẦU "gõ đúp mới tạo box" (thay vì chạm 1 lần) — tự bắt double-tap/double-click
                    // ở đây thay vì dựa vào sự kiện "dblclick" có sẵn của trình duyệt, vì "dblclick" KHÔNG
                    // hoạt động đáng tin cậy với Apple Pencil/chạm trên iPad. So khớp cả thời gian
                    // (<450ms) LẪN vị trí (lệch không quá ~24px màn hình, quy đổi ra đơn vị PDF-space
                    // bằng cách chia cho scale) để tránh 2 lần chạm ở 2 chỗ xa nhau trong lúc đang cuộn/
                    // rê cũng bị tính là gõ đúp. Port từ bản Night IELTS Land.
                    const now = Date.now();
                    const last = lastTextTapRef.current;
                    const dtMs = now - last.time;
                    const distPdf = Math.hypot(coords.x - last.x, coords.y - last.y);
                    const isDoubleTap = dtMs < 450 && distPdf < (24 / scale);
                    lastTextTapRef.current = { time: now, x: coords.x, y: coords.y };
                    if (!isDoubleTap) return;
                    // Đã xác nhận gõ đúp -> reset lại mốc để lần chạm kế tiếp không bị tính gộp luôn
                    // vào làm "đúp" với chính box vừa tạo.
                    lastTextTapRef.current = { time: 0, x: 0, y: 0 };
                    setTexts(prev => [...prev, {
                        id: Date.now(), x: coords.x, y: coords.y, text: '', color, size: fontSize, width: 150, height: 40
                    }]);
                    return;
                }

                // QUAN TRỌNG — sửa lỗi "kéo-thả ô chữ nhật không dùng được" của bút IPA/tra ảnh:
                // trước đây popup (Hanzii / Google Hình ảnh) được mở NGAY tại đây
                // (pointerdown), tức là NGAY LÚC BẮT ĐẦU kéo — việc mở 1 cửa sổ/tab mới đúng lúc đó
                // làm trình duyệt cướp mất focus khỏi canvas đang vẽ, khiến toàn bộ chuỗi sự kiện kéo
                // (pointermove/pointerup) bị đứt gãy giữa chừng nên KHÔNG kéo-thả được nữa — đây chính
                // là lý do bút Magic (không mở popup lúc pointerdown) vẫn kéo-thả bình thường còn 2 bút
                // này thì không. Bút Magic không hề bị ảnh hưởng nên không cần sửa gì ở bút đó.
                // Cách sửa: dời việc mở popup xuống handlePointerUp — lúc đó cú kéo đã HOÀN TẤT, và
                // pointerup vẫn là 1 cử chỉ người dùng thật 100% (giống hệt click) nên trình duyệt vẫn
                // không chặn popup, mà không còn làm gián đoạn thao tác kéo nữa.

                isDrawingRef.current = true;

                // Chế độ khoanh vùng "Hình chữ nhật" (kéo-thả): bút Magic khi bật chế độ hình chữ
                // nhật (tiện dùng chuột/trackpad trên Mac), LUÔN LUÔN với bút IPA / tra ảnh (2 bút
                // này giờ chỉ còn 1 cơ chế chọn vùng duy nhất — kéo-thả ô chữ nhật — thay cho kiểu bút
                // highlight quét ngang trước đây, để chọn trúng khít đúng phần chữ cần, không mất nét),
                // và giờ thêm cả bút chì khi bật chế độ "Hình chữ nhật" hoặc "Đường thẳng"
                // (pencilShapeMode) — dùng CHUNG code vẽ khung chữ nhật này, chỉ khác ở bước lưu
                // strokeRef không phục vụ OCR. Bút chì kiểu "Đường thẳng" (phím tắt L) dùng CHUNG cơ
                // chế kéo-thả 2 điểm với "Hình chữ nhật" (chỉ cập nhật điểm cuối khi rê chuột/bút,
                // không nối nhiều điểm như vẽ tay), nhưng đánh dấu shape: 'line' (không phải 'rect')
                // để drawLine() vẽ 1 đường thẳng nối 2 điểm thay vì khung chữ nhật — drawLine vốn dĩ
                // ĐÃ vẽ đúng vậy cho mọi stroke không phải shape 'rect' (nối các điểm bằng moveTo/
                // lineTo), nên không cần thêm nhánh vẽ riêng nào cho 'line' cả. Port từ bản Night
                // IELTS Land.
                if ((tool === 'magic' && magicShapeMode === 'rect') || (tool === 'ai' && aiShapeMode === 'rect') || tool === 'ipa' || tool === 'photo' || (tool === 'pencil' && (pencilShapeMode === 'rect' || pencilShapeMode === 'line'))) {
                    const shape = (tool === 'pencil' && pencilShapeMode === 'line') ? 'line' : 'rect';
                    currentStrokeRef.current = { id: Date.now(), tool, color, shape, points: [coords, coords] };
                    return;
                }

                currentStrokeRef.current = { id: Date.now(), tool, color, points: [coords] };
                // "Bút Present": lưu kèm màu glow ĐANG CHỌN vào chính nét này — mỗi nét nhớ đúng màu
                // lúc vẽ, đổi penGlowColor sau đó không ảnh hưởng ngược lại các nét cũ đã vẽ. Port từ
                // bản Night IELTS Land.
                if (tool === 'present') currentStrokeRef.current.glowColor = penGlowColor;
                // Reset điểm "mượt hoá" (xem penStability/handlePointerMove) về đúng điểm bắt đầu nét
                // — để nét mới luôn bắt đầu chính xác tại điểm đặt bút, không bị mượt hoá kéo lệch đi.
                smoothedPointRef.current = coords;

                // QUAN TRỌNG — nguồn thứ 2 gây "viết vài nét là đứng màn hình iPad": trước đây MỖI
                // LẦN pointermove đều gọi lại applyToolStyle() (gán strokeStyle/lineWidth/globalAlpha
                // + cấp phát mảng mới cho setLineDash) dù các giá trị này KHÔNG hề đổi trong suốt 1
                // nét vẽ (chỉ phụ thuộc tool/color/scale — cố định từ lúc đặt bút xuống). Với tần suất
                // sự kiện cao của Apple Pencil, việc gán lại y hệt hàng trăm lần/giây vẫn tốn CPU và
                // cấp phát bộ nhớ (garbage) không cần thiết, cộng dồn với việc reflow ở trên càng dễ
                // làm nghẽn luồng chính. Giờ set style CHỈ 1 LẦN DUY NHẤT ngay khi đặt bút xuống (TRỪ
                // "Bút Present" — luôn cần vẽ 2 lượt glow+lõi nên strokePenTwoPass tự set style riêng
                // mỗi lần, xem handlePointerMove) — context canvas tự giữ nguyên các thuộc tính này cho
                // các lệnh stroke() tiếp theo, không cần (và không nên) gán lại mỗi lần di chuyển.
                const ctx = drawCanvasRef.current.getContext('2d');
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(coords.x * scale, coords.y * scale);
                ctx.lineTo(coords.x * scale, coords.y * scale);
                if (tool === 'present') {
                    strokePenTwoPass(ctx, scale, pencilSize, penGlowColor, 1);
                } else {
                    applyToolStyle(ctx, tool, color, scale, pencilSize);
                    ctx.stroke();
                }
            };

            const handlePointerMove = (e) => {
                if (!isDrawingRef.current) return;
                if (e.pointerType === 'touch') return;

                const coords = getCoordinates(e);

                // Chế độ tẩy "Chọn vùng": cập nhật góc đối diện của khung xem trước, giống hệt cơ chế
                // kéo-thả của bút Magic/IPA/tra ảnh — phải kiểm tra TRƯỚC nhánh tẩy theo điểm bên dưới.
                // Port từ bản Night IELTS Land.
                if (tool === 'eraser' && eraserShapeMode === 'rect') {
                    if (!currentStrokeRef.current) return;
                    currentStrokeRef.current.points[1] = coords;
                    redrawStrokes();
                    return;
                }

                if (tool === 'eraser') {
                    handleErase(coords.x, coords.y);
                    return;
                }

                if (!currentStrokeRef.current) return;

                if ((tool === 'magic' && magicShapeMode === 'rect') || (tool === 'ai' && aiShapeMode === 'rect') || tool === 'ipa' || tool === 'photo' || (tool === 'pencil' && (pencilShapeMode === 'rect' || pencilShapeMode === 'line'))) {
                    // Cập nhật góc đối diện của khung chữ nhật (hoặc điểm cuối của đường thẳng) và vẽ
                    // lại toàn bộ canvas — chi phí rẻ vì số nét lưu trên 1 trang thường ít, vẫn mượt ở
                    // cả Mac lẫn iPad.
                    currentStrokeRef.current.points[1] = coords;
                    redrawStrokes();
                    return;
                }

                const canvas = drawCanvasRef.current;
                if (!canvas) return;

                // QUAN TRỌNG — "Độ ổn định nét vẽ" (penStability, 0 = tắt hẳn = giữ NGUYÊN hành vi cũ)
                // — port từ bản Night IELTS Land: làm mượt điểm chạm thô bằng bộ lọc trung bình trượt
                // theo cấp số nhân (EMA) trước khi lưu/vẽ — điểm vẽ ra sẽ "đuổi theo" điểm chạm thật
                // với 1 độ trễ nhỏ, giúp khử rung tay/Apple Pencil, nét viết mượt và tròn trịa hơn.
                // penStability càng cao thì điểm vẽ càng "bám" chậm theo tay hơn (mượt hơn nhưng trễ
                // hơn 1 chút) — đánh đổi hợp lý, y hệt thanh trượt "ổn định nét bút" ở các app vẽ
                // chuyên nghiệp (Procreate, Photoshop...).
                let point = coords;
                if (penStability > 0) {
                    const prevSmoothed = smoothedPointRef.current || coords;
                    const factor = 1 - penStability;
                    point = { x: prevSmoothed.x + (coords.x - prevSmoothed.x) * factor, y: prevSmoothed.y + (coords.y - prevSmoothed.y) * factor };
                    smoothedPointRef.current = point;
                }

                const lastPoint = currentStrokeRef.current.points[currentStrokeRef.current.points.length - 1];
                currentStrokeRef.current.points.push(point);

                // Style đã được set 1 lần lúc pointerDown — không gọi lại applyToolStyle() ở đây nữa
                // (xem giải thích chi tiết ở handlePointerDown), chỉ còn vẽ đoạn nối ngắn giữa 2 điểm.
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(lastPoint.x * scale, lastPoint.y * scale);
                ctx.lineTo(point.x * scale, point.y * scale);
                if (tool === 'present') {
                    // "Bút Present" cần set lại style riêng mỗi đoạn (glow + lõi, 2 lượt stroke()) —
                    // không dùng được tối ưu "set style 1 lần" vì bản chất luôn cần 2 kiểu style khác
