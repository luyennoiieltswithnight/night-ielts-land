                    // mount nữa => không còn nguồn gây reflow/nhảy cuộn nào từ việc này nữa.
                    basePageSize
                        ? { width: basePageSize.width * scale, height: basePageSize.height * scale }
                        : (viewport
                            ? { width: viewport.width, height: viewport.height }
                            : { width: '100%', minHeight: (1131 * scale) + 'px' })
                }>
                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC "cuộn lùi nhảy vọt lên trang đầu": trước đây 2 canvas
                        + spinner tuy đã được mount sẵn cố định (không unmount nữa), nhưng vẫn ẩn/hiện
                        bằng CSS `display: none/block`. `display` đổi qua lại nghĩa là phần tử bị GỠ hẳn
                        khỏi/rồi CHÈN LẠI vào Layout Tree (cây bố cục) — mỗi lần cuộn lùi qua nhiều trang
                        đã từng hiện ra trước đó, hàng loạt canvas cùng lúc chuyển từ none -> block, cây
                        bố cục bị coi như "vừa có nội dung mới chèn vào phía trên", khiến cơ chế "scroll
                        anchoring" của trình duyệt (vốn dùng để tự bù cuộn khi có nội dung thật sự bị
                        chèn/xoá phía trên) hiểu lầm và tự ý bù vị trí cuộn — đúng kiểu jump đột ngột (không
                        tăng dần như quán tính) mà không hề liên quan gì tới lực lướt hay tốc độ wheel cả.
                        Sửa: đổi hẳn sang `visibility: hidden/visible` thay cho `display` — visibility
                        vẫn ẩn hoàn toàn hình ảnh (không tốn công vẽ) và vẫn tự động không nhận sự kiện
                        chuột/bút khi ẩn (giống display:none), NHƯNG không hề đụng tới Layout Tree — phần
                        tử vẫn luôn ở đó, chỉ đổi trạng thái hiển thị, nên trình duyệt không còn lý do gì
                        để "giật mình" bù cuộn nữa. */}
                    <canvas ref={canvasRef} className="pdf-canvas" style={{ visibility: isVisible ? 'visible' : 'hidden' }} />
                    <canvas
                        ref={drawCanvasRef}
                        className="draw-canvas cursor-crosshair"
                        style={{ visibility: isVisible ? 'visible' : 'hidden', pointerEvents: isDrawingMode ? 'auto' : 'none' }}
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerCancel={handlePointerUp}
                        onPointerOut={handlePointerUp}
                    />
                    <div
                        className="absolute inset-0 w-full h-full flex items-center justify-center bg-slate-50 text-slate-300 pointer-events-none"
                        style={{ visibility: isVisible ? 'hidden' : 'visible' }}
                    >
                        <i className="fas fa-circle-notch fa-spin text-4xl"></i>
                    </div>

                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC lỗi "cuộn (đặc biệt lùi về trang trước) bị nhảy
                        vọt tới 1 vị trí xa lạ, không liên quan gì tới tốc độ lướt": Text Box trước đây
                        nằm CHUNG trong khối chỉ render khi isVisible — nghĩa là mỗi khi 1 trang cuộn ra
                        khỏi rồi quay lại vùng đệm (rất hay xảy ra khi cuộn qua lại nhiều), TOÀN BỘ text
                        box trên trang đó bị HUỶ rồi TẠO MỚI lại từ đầu. PdfTextBox có state "active"
                        khởi tạo mặc định = true kèm useEffect tự gọi textareaRef.focus() ngay khi mount
                        — nghĩa là mỗi lần "tạo mới lại" như vậy, ô textarea đó lại được focus() lại 1
                        lần nữa, và trình duyệt sẽ TỰ ĐỘNG cuộn tới đúng vị trí ô đang được focus đó —
                        đây mới là nguyên nhân thật của cú "nhảy" (không phải do quán tính cuộn hay do
                        reflow kích thước trang). Giờ Text Box được tách ra render LUÔN LUÔN, không phụ
                        thuộc isVisible nữa — chỉ mất đúng 1 lần mount/focus duy nhất lúc thật sự tạo
                        note mới, không bao giờ tự mount lại (nên không bao giờ tự focus lại) chỉ vì
                        cuộn qua cuộn lại nữa. */}
                    {texts.map(t => (
                        <PdfTextBox
                            key={t.id}
                            t={t}
                            scale={scale}
                            updateText={updateText}
                            removeText={removeText}
                            // Mép phải trang (đơn vị PDF-space, scale=1) tính từ basePageSize trừ đi vị
                            // trí x của chính box đó và 1 khoảng lề nhỏ — dùng để effect tự-giãn-chiều-
                            // rộng trong PdfTextBox biết dừng lại đúng lúc chạm mép trang rồi tự xuống
                            // dòng, thay vì tràn ra ngoài trang. Port từ bản Night IELTS Land.
                            maxWidthPdf={basePageSize ? Math.max(TEXTBOX_MIN_WIDTH, basePageSize.width - t.x - 20) : undefined}
                        />
                    ))}

                    {/* Nút "Xoá" nổi ngay phía trên khung tẩy "Chọn vùng" vừa kéo xong — bấm vào là xoá
                        NGAY LẬP TỨC (không hỏi lại lần nữa). Toạ độ tính từ 2 góc đã kéo (pendingErase,
                        đơn vị PDF-space) nhân với scale để ra đúng vị trí CSS pixel thật, canh giữa
                        theo chiều ngang của khung, đặt hẳn lên phía trên mép trên khung (translateY
                        -100% + cách thêm 1 chút) để không che mất nội dung bên trong khung. Port từ
                        bản Night IELTS Land. */}
                    {pendingErase && (
                        <button
                            onPointerDown={(e) => { e.stopPropagation(); confirmPendingErase(); }}
                            className="absolute z-30 px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-xs font-bold shadow-lg flex items-center gap-1.5 transition-colors active:scale-95 touch-none"
                            style={{
                                left: ((Math.min(pendingErase.p1.x, pendingErase.p2.x) + Math.max(pendingErase.p1.x, pendingErase.p2.x)) / 2) * scale,
                                top: Math.min(pendingErase.p1.y, pendingErase.p2.y) * scale,
                                transform: 'translate(-50%, calc(-100% - 8px))',
                            }}
                        >
                            <i className="fas fa-trash text-[10px]"></i> Xoá
                        </button>
                    )}
                </div>
            );
        }));

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [pdfUrl, setPdfUrl] = useState(null);
            const [pdfDoc, setPdfDoc] = useState(null);
            const [numPages, setNumPages] = useState(0);
            const [scale, setScale] = useState(1.2);
            // QUAN TRỌNG — sửa lỗi "cuộn bị giật/nhảy qua nhiều trang": trước đây, TRƯỚC KHI 1 trang
            // kịp render, khung chứa của nó dùng 1 chiều cao ƯỚC LƯỢNG cố định (1131px * scale) làm
            // placeholder. Với sách có kích thước trang khác con số đó (rất phổ biến), ngay khi trang
            // render xong và đổi sang chiều cao THẬT, khung sẽ đổi kích thước đột ngột — đẩy lệch toàn
            // bộ các trang bên dưới, khiến vị trí cuộn hiện tại bị "nhảy" theo, càng rõ khi cuộn nhanh
            // qua nhiều trang chưa kịp render (mỗi trang đổi kích thước là 1 lần giật). Giờ lấy kích
            // thước THẬT của trang 1 (chỉ 1 lần, ngay sau khi mở file — rất nhẹ, không phải render)
            // rồi dùng chung cho placeholder của MỌI trang: vì tuyệt đại đa số PDF có các trang cùng
            // kích thước, placeholder sẽ khớp gần như chính xác kích thước thật ngay từ đầu, không còn
            // phải "nhảy" khi trang render xong nữa.
            const [basePageSize, setBasePageSize] = useState(null); // { width, height } ở scale 1
            
            const [isDrawingMode, setIsDrawingMode] = useState(false);
            const [tool, setTool] = useState('pencil');
            // Mặc định ưu tiên "Hình chữ nhật" (kéo-thả) cho bút Magic — nhanh/tiện hơn cho đa số
            // trường hợp quét chữ; vẫn có thể đổi sang "Tự do" (vẽ tay/khoanh vùng bất kỳ) qua nút
            // chọn kiểu khoanh vùng trên thanh công cụ khi cần.
            const [magicShapeMode, setMagicShapeMode] = useState('rect'); // 'rect' (hình chữ nhật, mặc định) | 'lasso' (tự do)
            // Bút AI: y hệt kiểu chọn vùng của bút Magic (mặc định "Hình chữ nhật" cho nhanh, đổi được
            // sang "Tự do" qua thanh tuỳ chọn phụ khi đang chọn bút AI). Port từ bản Night IELTS Land.
            const [aiShapeMode, setAiShapeMode] = useState('rect'); // 'rect' (mặc định) | 'lasso' (tự do)
            // Chế độ vẽ cho bút chì: 'freehand' (vẽ tay, mặc định — giữ nguyên như trước giờ), 'line'
            // (kéo-thả 1 đường thẳng) hoặc 'rect' (kéo-thả khung hình chữ nhật, dùng chung logic với
            // bút Magic/IPA/tra ảnh — xem redrawStrokes/handlePointerDown/Move trong PdfPage). Port
            // từ bản Night IELTS Land — có thêm phím tắt F/L/S khi đang dùng bút chì (xem useEffect
            // bàn phím bên dưới).
            const [pencilShapeMode, setPencilShapeMode] = useState('freehand');
            const [color, setColor] = useState('#4F46E5');
            const [fontSize, setFontSize] = useState(10); // Mặc định 10
            // Độ dày bút chì: 3 mức, mặc định là mức nhỏ nhất (giữ nguyên độ dày cũ), 2 mức còn lại
            // lớn hơn 1 chút. Gộp cả 3 vào chung 1 nút cho gọn thanh công cụ — bấm nút mới hiện bảng
            // chọn nhỏ (popover) thay vì chiếm sẵn 3 ô liên tục trên thanh.
            const [pencilSize, setPencilSize] = useState(DEFAULT_PENCIL_SIZE);
            // Chế độ tẩy: 'point' (mặc định, giữ NGUYÊN hành vi cũ — tẩy theo bán kính quanh điểm chạm/
            // kéo) hoặc 'rect' (kéo-thả chọn vùng hình chữ nhật rồi tẩy hết nét trong đó, giống cơ chế
            // của bút Magic/IPA/tra ảnh/bút chì hình chữ nhật). Port từ bản Night IELTS Land.
            const [eraserShapeMode, setEraserShapeMode] = useState('point');
            const [showPencilSizeMenu, setShowPencilSizeMenu] = useState(false);
            const pencilSizeMenuRef = useRef(null);
            useEffect(() => {
                if (tool !== 'pencil') setShowPencilSizeMenu(false); // đổi công cụ khác thì tự đóng bảng chọn
            }, [tool]);
            useEffect(() => {
                if (!showPencilSizeMenu) return;
                const handleClickOutside = (e) => {
                    if (pencilSizeMenuRef.current && !pencilSizeMenuRef.current.contains(e.target)) {
                        setShowPencilSizeMenu(false);
                    }
                };
                document.addEventListener('pointerdown', handleClickOutside);
                return () => document.removeEventListener('pointerdown', handleClickOutside);
            }, [showPencilSizeMenu]);

            const [magicText, setMagicText] = useState("");
            const [isOcrProcessing, setIsOcrProcessing] = useState(false);
            const [ipaInfo, setIpaInfo] = useState(null); // { word, pinyin, definition, error, loading }
            const [photoLookup, setPhotoLookup] = useState(null); // { text } — bút tra ảnh minh hoạ

            // --- BÚT AI (Groq) — port từ bản Night IELTS Land, thích nghi cho tiếng Trung ---
            // aiApiKey: đọc 1 lần từ localStorage lúc khởi tạo (lazy init qua callback trong useState,
            // tránh phải đọc localStorage lại mỗi lần App render). Chỉ tồn tại trên đúng máy/trình duyệt
            // này — dùng cả Mac lẫn iPad thì mỗi máy cần nhập riêng 1 lần (xem giải thích ở AI_STORAGE_KEY).
            const [aiApiKey, setAiApiKey] = useState(() => {
                try { return localStorage.getItem(AI_STORAGE_KEY) || ''; } catch (e) { return ''; }
            });
            const [showAiKeyModal, setShowAiKeyModal] = useState(false);
            const [aiApiKeyDraft, setAiApiKeyDraft] = useState(''); // nội dung đang gõ dở trong modal, tách khỏi aiApiKey thật để bấm Huỷ không làm mất key cũ
            const openAiSettings = useCallback(() => {
                setAiApiKeyDraft(aiApiKey);
                setShowAiKeyModal(true);
            }, [aiApiKey]);
            const [aiLookup, setAiLookup] = useState(null); // { text, ocrLoading } — box Bút AI

            // --- TÍNH NĂNG "TÓM TẮT PHIÊN DẠY" ---
            // Gom TẤT CẢ notes (text box) trên mọi trang + các câu trả lời Bút AI ĐÃ LƯU trong phiên đang
            // mở, gửi cho Groq để tổng hợp thành 1 bản tóm tắt. Cố ý dùng REF (không phải state) cho 2
            // kho dữ liệu nguồn này (allTextsRef, aiHistoryRef) vì chúng được ghi liên tục (mỗi lần gõ
            // chữ note ở BẤT KỲ trang nào, mỗi lần Bút AI trả lời) — nếu dùng state thì mỗi lần gõ 1 ký
            // tự note ở 1 trang bất kỳ sẽ làm re-render lại TOÀN BỘ App (và mọi PdfPage khác đang mount),
            // rất tốn kém. Dùng ref: chỉ ĐỌC ra đúng lúc người dùng bấm "Tóm tắt ngay". Port từ bản Night
            // IELTS Land.
            const allTextsRef = useRef({}); // { [pageNum]: [{id,text,...}] }
            const aiHistoryRef = useRef([]); // [{ scannedText, promptLabel, answer, timestamp }] — CHỈ những câu đã bấm "Lưu"
            const onPageTextsChange = useCallback((pageNum, texts) => {
                allTextsRef.current[pageNum] = texts;
            }, []);
            const onAIHistoryEntry = useCallback((entry) => {
                aiHistoryRef.current = [...aiHistoryRef.current, entry];
            }, []);
            const [showSessionSummary, setShowSessionSummary] = useState(false);
            // savedSummaries: CHỈ lưu trong phiên đang mở (state thường, KHÔNG ghi localStorage) — theo
            // đúng lựa chọn ban đầu, vì mục đích là để gộp thủ công với notes khác thành 1 bản tóm tắt
            // cuối cùng gửi học sinh NGAY trong buổi dạy đó, không cần tồn tại lâu dài qua các lần mở lại.
            const [savedSummaries, setSavedSummaries] = useState([]);

            const [showTOC, setShowTOC] = useState(false);
            // Số ô mục lục đang được dựng trong modal — bắt đầu từ 1 đợt nhỏ (TOC_BATCH_SIZE), tự
            // tăng dần khi cuộn gần tới cuối (qua handleTocScroll). Xem giải thích chi tiết ở khai
            // báo TOC_BATCH_SIZE phía trên (sửa lỗi "mở mục lục file nặng tải rất lâu").
            const [tocVisibleCount, setTocVisibleCount] = useState(TOC_BATCH_SIZE);
            useEffect(() => {
                if (showTOC) setTocVisibleCount(TOC_BATCH_SIZE); // mỗi lần mở lại modal, reset về đợt đầu
            }, [showTOC]);
            // Tham chiếu tới đúng vùng cuộn nội dung PDF (không phải toàn trang) — dùng để tự tính
            // và cuộn tới đúng trang khi bấm từ mục lục, xem giải thích chi tiết ở nơi dùng bên dưới.
            const pdfContentAreaRef = useRef(null);
            // Tham chiếu tới vùng cuộn BÊN TRONG modal Mục lục — dùng để tự "tải thêm" 1 đợt ô mới
            // khi cuộn gần tới cuối, xem giải thích chi tiết ở useEffect ngay bên dưới.
            const tocScrollRef = useRef(null);
            // true trong lúc app TỰ cuộn bằng lệnh (vd bấm mục lục) — cho phép bộ khống chế tốc độ
            // cuộn bên dưới bỏ qua, không chặn nhầm cú cuộn mượt do chính app gây ra.
            const isProgrammaticScrollRef = useRef(false);

            // --- PHỤC VỤ TÍNH NĂNG "LƯU GHI CHÚ VÀO FILE" (xem handleExportAnnotatedPdf) ---
            // originalFileRef: giữ nguyên File gốc người dùng đã chọn (không phải objectUrl) — cần
            // đọc lại byte gốc bằng file.arrayBuffer() lúc xuất, để pdf-lib mở đúng file PDF gốc rồi
            // "dán" thêm lớp ghi chú lên trên, thay vì phải render lại từ đầu (giữ nguyên chữ/hình gốc
            // sắc nét). pageRefs: map { [pageNum]: ref-instance-của-PdfPage } — mỗi PdfPage tự đăng ký
            // vào đây qua ref callback (xem JSX render danh sách trang bên dưới), để App có thể "gọi
            // vào" lấy getAnnotationSnapshot() của TỪNG trang khi xuất file.
            const originalFileRef = useRef(null);
            const pageRefs = useRef({});
            const [isExporting, setIsExporting] = useState(false);

            // QUAN TRỌNG — LỊCH SỬ sửa lỗi "lướt lùi về trang trước bị nhảy vọt": đã thử rất nhiều lớp
            // can thiệp trực tiếp vào wheel/scrollTop (giảm tốc 1 chiều, tự bù mỗi rAF, chặn hẳn wheel
            // lấy lại toàn quyền cuộn bằng tay, giới hạn từng sự kiện, rồi "ngân sách" quãng đường theo
            // từng đợt lướt) — không lớp nào dứt điểm, có lớp còn làm trải nghiệm TỆ HƠN (khựng cứng khi
            // hết ngân sách), và tất cả đều đánh đổi mất luôn quán tính (momentum) mượt mà vốn có của
            // trackpad. Đã TÌM RA ĐÚNG GỐC thật sự: không liên quan gì tới wheel/tốc độ lướt cả — do
            // canvas/spinner của PdfPage đổi qua lại bằng CSS `display: none/block` mỗi khi cuộn qua,
            // việc này làm trình duyệt tưởng có nội dung mới chèn vào Layout Tree phía trên, khiến cơ
            // chế "scroll anchoring" mặc định tự ý bù sai vị trí cuộn — đúng kiểu jump đột ngột, không
            // tăng dần. Đã sửa tận gốc bằng cách đổi `display` thành `visibility` (xem style của canvas/
            // spinner trong PdfPage) — phần tử không còn bị gỡ khỏi/chèn lại Layout Tree khi ẩn/hiện
            // nữa, nên anchoring không còn lý do gì để bù nhầm. Nhờ vậy KHÔNG CẦN can thiệp wheel bằng
            // tay nữa — bỏ hẳn useEffect chặn wheel ở đây, trả lại nguyên bản cảm giác lướt/quán tính tự
            // nhiên của trackpad/Trackpad Mac và cảm ứng iPad.

            // --- KHOÁ ZOOM (nút bật/tắt, thay cho cơ chế tự động chặn pinch-zoom trước đây vốn
            // "chưa hoạt động hiệu quả lắm" trên thực tế) — mặc định TẮT (zoom bình thường), người
            // dùng tự bấm bật khi cần viết/note để tránh lỡ tỳ tay làm phóng to/thu nhỏ ngoài ý muốn.
            const [zoomLocked, setZoomLocked] = useState(false);

            // QUAN TRỌNG — sửa lỗi "viết vài nét là bị đứng màn hình iPad" TÁI PHÁT đúng lúc bật "Khoá
            // zoom" (y hệt lỗi đã tìm ra & sửa bên bản Night IELTS Land — port lại đúng bản sửa đó):
            // 2 listener "onTouchMove" (chặn pinch 2 ngón) và "onTouchEnd" (chặn double-tap-zoom) ở
            // dưới là touchmove/touchend THÔ, gắn thẳng vào document với passive:false — trộn lẫn với
            // Pointer Events (dùng để vẽ, có setPointerCapture) cho CÙNG 1 luồng chạm bút là nguyên
            // nhân khiến bộ xử lý cảm ứng của WebKit trên iPadOS bị "kẹt" (chỉ hồi phục khi trang mất
            // rồi lấy lại focus) — và vì chỉ gắn khi zoomLocked=true, bug này đúng lúc "Khoá zoom" đang
            // BẬT, tức là ngay lúc người dùng cần viết ổn định nhất. Bỏ HẲN 2 listener touchmove/
            // touchend thô này — không thực sự cần thiết: (1) chặn pinch 2 ngón đã có "gesturestart/
            // change/end" bên dưới lo rồi (sự kiện pinch RIÊNG của Safari, không đụng luồng touch/
            // pointer dùng để vẽ nên không xung đột với bút), và (2) chặn double-tap-to-zoom vốn dĩ
            // KHÔNG CẦN THIẾT trên trang này — meta viewport đầu file đã có "width=device-width" nên
            // Safari hiện đại tự động bỏ hẳn cử chỉ double-tap-to-zoom cho trang kiểu này rồi. Giữ lại
            // ĐÚNG "gesturestart/change/end" — vẫn chặn được pinch-zoom cả trang khi 2 ngón chạm ngoài
            // vùng PDF, mà không đụng gì tới việc viết bằng Apple Pencil.
            useEffect(() => {
                if (!zoomLocked) return;

                const onGesture = (e) => { e.preventDefault(); };

                document.addEventListener('gesturestart', onGesture, { passive: false });
                document.addEventListener('gesturechange', onGesture, { passive: false });
                document.addEventListener('gestureend', onGesture, { passive: false });

                return () => {
                    document.removeEventListener('gesturestart', onGesture);
                    document.removeEventListener('gesturechange', onGesture);
                    document.removeEventListener('gestureend', onGesture);
                };
            }, [zoomLocked]);

            // --- PHÍM TẮT CHỌN NHANH KIỂU VẼ CHO BÚT CHÌ (F = Tự do/Free-writing, L = Đường thẳng,
            // S = Hình chữ nhật) — port từ bản Night IELTS Land. Chỉ áp dụng khi ĐANG chọn bút chì
            // (tool === 'pencil') — bấm L/S lúc đang dùng bút khác thì không có tác dụng gì (tránh đổi
            // nhầm kiểu vẽ của bút chì trong khi không hề định dùng nó). QUAN TRỌNG: phải tự kiểm tra
            // xem đang gõ chữ ở đâu đó hay không (input/textarea/contentEditable, ví dụ đang gõ note
            // trong Text Box) rồi bỏ qua hoàn toàn trong trường hợp đó — nếu không, gõ chữ "l" hay "s"
            // bình thường trong 1 note sẽ vô tình bị nuốt mất thành phím tắt đổi kiểu vẽ bút chì.
            useEffect(() => {
                const onKeyDown = (e) => {
                    if (tool !== 'pencil') return;
                    const target = e.target;
                    const tag = target && target.tagName;
                    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable);
                    if (isTyping) return;
                    if (e.metaKey || e.ctrlKey || e.altKey) return;
                    const key = e.key.toLowerCase();
                    if (key === 'f') {
                        e.preventDefault();
                        setPencilShapeMode('freehand');
                    } else if (key === 'l') {
                        e.preventDefault();
                        setPencilShapeMode('line');
                    } else if (key === 's') {
                        e.preventDefault();
                        setPencilShapeMode('rect');
                    }
                };
                document.addEventListener('keydown', onKeyDown);
                return () => document.removeEventListener('keydown', onKeyDown);
            }, [tool]);

            // useCallback: giữ nguyên "địa chỉ" hàm giữa các lần render, để các PdfPage đã
            // memo hoá (React.memo) không phải render lại toàn bộ mỗi khi App có state khác
            // đổi (vd: đang gõ chữ trong 1 ô note) — giúp phản hồi nhanh & mượt hơn, nhất là
            // với sách PDF nhiều trang trên iPad.
            // Tải thêm 1 đợt ô mục lục khi cuộn gần tới cuối danh sách hiện có — xem giải thích ở
            // khai báo TOC_BATCH_SIZE. useCallback để không tạo hàm mới mỗi khi App render lại vì lý
            // do khác không liên quan tới mục lục.
            const handleTocLoadMore = useCallback(() => {
                setTocVisibleCount(c => Math.min(numPages, c + TOC_BATCH_SIZE));
            }, [numPages]);

            // QUAN TRỌNG — sửa lỗi "mở mục lục file lớn thì nhiều trang không hiện": cách cũ dùng 1
            // IntersectionObserver quan sát 1 ô "sentinel" ở cuối danh sách, chỉ bắn callback khi ô đó
            // CHUYỂN TRẠNG THÁI (từ ngoài màn hình vào trong hoặc ngược lại). Với modal cao/vùng đệm
            // rootMargin rộng, sau khi tải thêm 1 đợt, sentinel có thể vẫn tiếp tục nằm trong vùng
            // "đang giao nhau" — tức KHÔNG hề chuyển trạng thái — nên callback không bắn lại nữa, và
            // việc tải thêm bị "kẹt" mãi ở đó dù người dùng vẫn đang cuộn, khiến các trang phía sau
            // không bao giờ được tải. Giờ chuyển sang cách chắc chắn hơn: theo dõi trực tiếp vị trí
            // cuộn (onScroll) và so sánh còn cách đáy bao xa — kiểm tra lại MỖI lần cuộn, không phụ
            // thuộc việc "chuyển trạng thái" nên không thể bị kẹt. Thêm 1 effect tự tải thêm ngay cả
            // khi CHƯA cuộn (vd: file ít trang hơn 1 màn hình, hoặc màn hình rất to) — vì lúc đó modal
            // không đủ nội dung để tạo ra sự kiện cuộn nào cả.
            useEffect(() => {
                if (!showTOC) return;
                const el = tocScrollRef.current;
                if (!el) return;
                if (tocVisibleCount < numPages && el.scrollHeight <= el.clientHeight + 200) {
                    handleTocLoadMore();
                }
            }, [showTOC, tocVisibleCount, numPages, handleTocLoadMore]);

            const handleTocScroll = useCallback((e) => {
                const el = e.target;
                if (el.scrollHeight - el.scrollTop - el.clientHeight < 800) {
                    handleTocLoadMore();
                }
            }, [handleTocLoadMore]);

            const handleFileUpload = useCallback((e) => {
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    originalFileRef.current = file; // giữ lại File gốc — dùng khi xuất file có ghi chú
                    pageRefs.current = {}; // file mới -> danh sách ref trang cũ (nếu có) không còn hợp lệ
                    const objectUrl = URL.createObjectURL(file);
                    setPdfUrl(objectUrl);
                    setBasePageSize(null);
                    pdfjsLib.getDocument(objectUrl).promise.then(loadedPdf => {
                        setPdfDoc(loadedPdf);
                        setNumPages(loadedPdf.numPages);
                        // Lấy kích thước thật (scale 1) của trang đầu tiên — chỉ đọc thông tin trang,
                        // KHÔNG rasterize/render nên rất nhẹ — dùng làm placeholder chung cho mọi trang
                        // (xem giải thích chi tiết ở khai báo basePageSize phía trên).
                        loadedPdf.getPage(1).then(page => {
                            const vp = page.getViewport({ scale: 1 });
                            setBasePageSize({ width: vp.width, height: vp.height });
                        }).catch(err => {});
                    }).catch(err => alert("Lỗi khi mở file."));
                }
            }, []);

            // --- LƯU GHI CHÚ VÀO FILE (xuất PDF gốc + toàn bộ nét vẽ/note đã dán đè lên đúng vị trí) ---
            // GIỚI HẠN QUAN TRỌNG cần hiểu trước khi đọc code bên dưới: Safari/iPadOS (khác hẳn 1 app
            // "native" thật sự) KHÔNG có File System Access API — không website/web app nào trên iPad
            // có thể tự ý ghi đè thẳng vào ĐÚNG file gốc trong Files mà không cần người dùng thao tác
            // gì, đây là giới hạn bảo mật của chính hệ điều hành/trình duyệt, không phải app này thiếu
            // tính năng. Cách TỐT NHẤT có thể làm trên iPad: xuất ra 1 bản PDF mới (giữ nguyên chữ/hình
            // trang gốc sắc nét — chỉ CHÈN THÊM 1 lớp ảnh trong suốt chứa nét vẽ/note lên trên, không
            // rasterize lại từ đầu), đặt ĐÚNG TÊN file gốc, rồi mở thẳng bảng "Chia sẻ" (Web Share API)
            // — trong đó bấm "Lưu vào Files", chọn lại đúng thư mục đang chứa file gốc, iOS sẽ tự hỏi
            // "Thay thế?" vì trùng tên; bấm Thay thế coi như đã "ghi đè" file gốc thành công (chỉ tốn
            // thêm vài thao tác chạm, không thể làm hoàn toàn tự động/im lặng được). Trên máy tính
            // (không có Share Sheet, vd Mac/Windows) sẽ tự động tải file mới xuống như bình thường.
            const handleExportAnnotatedPdf = useCallback(async () => {
                if (!originalFileRef.current || !numPages || isExporting) return;
                if (!window.PDFLib) {
                    alert("Không tải được thư viện xử lý PDF (pdf-lib) — kiểm tra lại kết nối mạng rồi thử lại.");
                    return;
                }
                setIsExporting(true);
                try {
                    const arrayBuffer = await originalFileRef.current.arrayBuffer();
                    // ignoreEncryption: một số file PDF quét/tải về có đặt hạn chế in ấn/chỉnh sửa
                    // (nhưng vẫn xem/đọc bình thường) — nếu không có cờ này, pdf-lib sẽ từ chối mở
                    // thẳng những file đó. Bản xuất ra sẽ không giữ lại hạn chế gốc (chấp nhận được,
                    // vì đây là file ghi chú cá nhân của người dùng).
                    const pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const pdfLibPages = pdfLibDoc.getPages();

                    for (let i = 1; i <= numPages; i++) {
                        const pageApi = pageRefs.current[i];
                        const snap = pageApi && pageApi.getAnnotationSnapshot && pageApi.getAnnotationSnapshot();
                        if (!snap) continue; // trang "sạch" (không note gì) hoặc chưa từng render — giữ nguyên, khỏi tốn công

                        const pdfLibPage = pdfLibPages[i - 1];
                        if (!pdfLibPage) continue;

                        const pngBytes = await (await fetch(snap.dataUrl)).arrayBuffer();
                        const pngImage = await pdfLibDoc.embedPng(pngBytes);
                        const { width: pw, height: ph } = pdfLibPage.getSize();
                        // Ảnh nền TRONG SUỐT (chỉ có nét vẽ/chữ note) dán đè full khung trang — phần
                        // không vẽ gì vẫn để lộ nguyên nội dung trang gốc bên dưới, không mất chi tiết.
                        pdfLibPage.drawImage(pngImage, { x: 0, y: 0, width: pw, height: ph });
                    }

                    const outBytes = await pdfLibDoc.save();
                    const blob = new Blob([outBytes], { type: 'application/pdf' });
                    const fileName = originalFileRef.current.name || 'tai-lieu-da-ghi-chu.pdf';

                    let shared = false;
                    try {
                        const outFile = new File([blob], fileName, { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [outFile] })) {
                            await navigator.share({ files: [outFile], title: fileName });
                            shared = true;
                        }
                    } catch (shareErr) {
                        // Người dùng bấm Huỷ trên bảng Chia sẻ (AbortError) — coi là bình thường, không
                        // báo lỗi gì thêm. Các lỗi khác thì rơi xuống tải file thông thường bên dưới.
                        if (shareErr && shareErr.name === 'AbortError') { shared = true; }
                    }

                    if (!shared) {
                        // Máy tính / trình duyệt không hỗ trợ chia sẻ file (vd Chrome/Firefox trên máy
                        // tính) — tải file mới xuống như bình thường, người dùng tự chuyển vào đúng chỗ.
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 30000);
                    }
                } catch (err) {
                    console.error('Lỗi xuất PDF đã ghi chú:', err);
                    alert("Không xuất được file PDF đã ghi chú. Vui lòng thử lại.");
                } finally {
                    setIsExporting(false);
                }
            }, [numPages, isExporting]);

            const onExtractText = useCallback((text, processing) => {
                setMagicText(text);
                setIsOcrProcessing(processing);
                // Bắt đầu 1 lượt quét mới (processing=true, text rỗng) -> dọn box IPA cũ để
                // không hiển thị nhầm thông tin của từ trước đó trong lúc đang chờ kết quả mới.
                if (processing) setIpaInfo(null);
            }, []);

            // Tra pinyin + nghĩa cho bút Pinyin — chạy song song, không chặn luồng dịch/đọc.
            const onIPALookup = useCallback(async (text) => {
                setIpaInfo({ word: '', pinyin: '', definition: '', error: '', loading: true });
                const info = await fetchIPAInfo(text);
                setIpaInfo({ ...info, loading: false });
            }, []);

            // Luôn hiện panel "Mở ảnh trên Google" khi quét được chữ — không phụ thuộc việc popup
            // tự động có bị trình duyệt chặn hay không (xem giải thích ở openPhotoLookupWindow).
            const onPhotoLookup = useCallback((text) => {
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setPhotoLookup(null);
                    return;
                }
                setPhotoLookup({ text: clean });
            }, []);

            // Bút AI: theo đúng dạng "onExtractText(text, processing)" đã quen thuộc trong app — gọi
            // với processing=true ngay khi bắt đầu OCR (hiện spinner "Đang quét chữ..." trong Box Bút
            // AI), rồi gọi lại với processing=false kèm text thật khi xong. Port từ bản Night IELTS Land.
            const onAILookup = useCallback((text, processing) => {
                if (processing) { setAiLookup({ text: '', ocrLoading: true }); return; }
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setAiLookup(null);
                    return;
                }
                setAiLookup({ text: clean, ocrLoading: false });
            }, []);

            return (
                <div
                    className="flex h-screen w-full font-sans bg-slate-100 overflow-hidden"
                >
                    {/* Box dịch + box IPA — theo yêu cầu, box IPA giờ nằm CHÍNH GIỮA, ngay bên DƯỚI box
                        dịch (trước đây box IPA nằm tách riêng bên cạnh mép trái). Gộp cả 2 vào chung
                        1 khung bọc ngoài, xếp cột dọc (flex-col) + canh giữa ngang (items-center):
                        khung bọc mới là nơi DUY NHẤT giữ vị trí "fixed, canh giữa màn hình, cách đỉnh
                        24" — bản thân MagicTranslationBar không còn tự định vị fixed nữa (xem sửa ở
                        component đó), nên xếp thành cột tự nhiên, khoảng cách luôn đúng dù box dịch cao
                        hay thấp (không cần tính toán offset thủ công như cách "bám mép trái" cũ). */}
                    {(magicText || isOcrProcessing) && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] w-[90%] max-w-3xl flex flex-col items-center gap-3 animate-slide-down">
                            <MagicTranslationBar text={magicText} isProcessing={isOcrProcessing} onClose={() => { setMagicText(""); setIsOcrProcessing(false); setIpaInfo(null); }} />
                            {ipaInfo && (
                                <div className="hidden sm:block animate-slide-down-y">
                                    <IPAPanel info={ipaInfo} onClose={() => setIpaInfo(null)} />
                                </div>
                            )}
                        </div>
                    )}

                    {/* Thông báo/nút mở kết quả ảnh minh hoạ cho bút Tra ảnh — luôn hiện ra khi có
                        chữ vừa quét, để KHÔNG phụ thuộc vào việc trình duyệt có chặn popup hay không:
                        bấm nút là mở tab/cửa sổ Google Hình ảnh thật, chắc chắn không bị chặn vì đó
                        là 1 cú bấm chuột/chạm thật của người dùng. */}
                    {photoLookup && (
                        <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[100] glass-panel rounded-2xl shadow-2xl border-2 border-rose-100 px-5 py-3 flex items-center gap-4 animate-slide-down max-w-[92%]">
                            <i className="fas fa-images text-rose-500 text-xl shrink-0"></i>

                    {/* FLOATING WINDOW: MỤC LỤC TRANG DẠNG GRID */}

                                                    // QUAN TRỌNG — sửa lỗi "bấm chuyển trang từ mục lục làm nguyên trang bị kéo lên,
                                                    // khuất mất thanh công cụ, kéo xuống lại không được": trước đây dùng
                                                    // el.scrollIntoView() — hàm này để TRÌNH DUYỆT TỰ CHỌN cuộn ancestor scroll
                                                    // nào, và trên Safari/iPadOS đôi khi nó cuộn luôn CẢ container cha lẫn
                                                    // document/viewport thay vì chỉ đúng vùng nội dung PDF, đẩy luôn thanh công cụ
                                                    // (nằm NGOÀI vùng cuộn đó) ra khỏi màn hình theo. Giờ tự tính khoảng cách và
                                                    // chỉ gọi scrollTo() trên ĐÚNG 1 vùng cuộn nội dung PDF (pdfContentAreaRef) —
                                                    // không đụng tới bất kỳ phần tử nào khác, nên thanh công cụ không bao giờ bị
                                                    // trôi theo nữa.
                                                    const container = pdfContentAreaRef.current;
                                                    const target = document.getElementById(`pdf-page-${index + 1}`);
                                                    if (container && target) {
                                                        const containerRect = container.getBoundingClientRect();
                                                        const targetRect = target.getBoundingClientRect();
                                                        const delta = targetRect.top - containerRect.top;
                                                        // Đánh dấu đây là cú cuộn app TỰ ra lệnh — để bộ khống chế tốc độ cuộn lùi
                                                        // (xem isProgrammaticScrollRef) không chặn nhầm cú cuộn mượt này.
                                                        isProgrammaticScrollRef.current = true;
                                                        container.scrollTo({ top: container.scrollTop + delta - 16, behavior: 'smooth' });
                                                        setTimeout(() => { isProgrammaticScrollRef.current = false; }, 900);
                                                    }
                                                    setShowTOC(false);
                                                }}
                                            />

                                            <i className="fas fa-spell-check text-md"></i>

                                            (popover) chọn 1 trong 3 mức, bấm ra ngoài hoặc chọn xong tự đóng lại. */}

                                            </React.Fragment>
                                        )}

                                        {/* Kiểu vẽ cho bút chì: Tự do / Đường thẳng (MỚI) / Hình chữ nhật — phím tắt
                                            F/L/S khi đang dùng bút chì (xem useEffect lắng nghe bàn phím trong App).
                                            Port từ bản Night IELTS Land. */}
                                        {tool === 'pencil' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-0.5 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kiểu vẽ (phím tắt: F = Tự do, L = Đường thẳng, S = Hình chữ nhật)">
                                                    <button onClick={() => setPencilShapeMode('freehand')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (pencilShapeMode === 'freehand' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:bg-slate-100')} title="Tự do / Free-writing (vẽ tay — phím tắt F)">
                                                        <i className="fas fa-signature text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setPencilShapeMode('line')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (pencilShapeMode === 'line' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:bg-slate-100')} title="Đường thẳng (kéo-thả — phím tắt L)">
                                                        <i className="fas fa-slash text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setPencilShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (pencilShapeMode === 'rect' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — phím tắt S)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {/* Chọn kiểu khoanh vùng cho bút Magic: Tự do (freehand) hoặc Hình chữ nhật (kéo-thả, tiện cho Mac/trackpad) */}
                                        {tool === 'magic' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-0.5 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kiểu khoanh vùng">
                                                    <button onClick={() => setMagicShapeMode('lasso')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'lasso' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Tự do (vẽ tay)">
                                                        <i className="fas fa-signature text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setMagicShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (magicShapeMode === 'rect' ? 'bg-amber-100 text-amber-600' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — tiện cho Mac/trackpad)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {/* Chọn kiểu khoanh vùng cho bút AI (y hệt bút Magic) + trạng thái/
                                            cài đặt API key Groq. Port từ bản Night IELTS Land. */}
                                        {tool === 'ai' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-0.5 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kiểu khoanh vùng">
                                                    <button onClick={() => setAiShapeMode('lasso')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (aiShapeMode === 'lasso' ? 'bg-violet-100 text-violet-600' : 'text-slate-400 hover:bg-slate-100')} title="Tự do (vẽ tay)">
                                                        <i className="fas fa-signature text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setAiShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (aiShapeMode === 'rect' ? 'bg-violet-100 text-violet-600' : 'text-slate-400 hover:bg-slate-100')} title="Hình chữ nhật (kéo-thả — tiện cho Mac/trackpad)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <button
                                                    onClick={openAiSettings}
                                                    className={"px-3 h-8 rounded-full flex items-center gap-1.5 text-xs font-bold transition-colors whitespace-nowrap border " + (aiApiKey ? 'bg-emerald-50 text-emerald-600 border-emerald-100 hover:bg-emerald-100' : 'bg-amber-50 text-amber-600 border-amber-100 hover:bg-amber-100')}
                                                    title="Cài đặt API key Groq cho Bút AI"
                                                >
                                                    <i className="fas fa-key text-[10px]"></i> {aiApiKey ? 'Đã có API key' : 'Chưa có API key'}
                                                </button>
                                            </React.Fragment>
                                        )}

                                        {/* Kích thước chữ Text */}
                                        {tool === 'text' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kích cỡ chữ Text">
                                                    <button onClick={() => setFontSize(s => Math.max(8, s - 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-minus text-[10px]"></i></button>
                                                    <span className="text-xs font-bold text-slate-700 w-6 text-center">{fontSize}</span>
                                                    <button onClick={() => setFontSize(s => Math.min(48, s + 2))} className="w-6 h-6 flex items-center justify-center text-slate-500 hover:bg-slate-100 rounded-full"><i className="fas fa-plus text-[10px]"></i></button>
                                                </div>
                                            </React.Fragment>
                                        )}

                                        {/* Kiểu tẩy: Theo điểm (mặc định, giữ nguyên hành vi cũ) hoặc Chọn vùng
                                            (kéo-thả hình chữ nhật rồi bấm nút "Xoá" mới thực sự xoá — xem pendingErase/
                                            confirmPendingErase trong PdfPage). Port từ bản Night IELTS Land. */}
                                        {tool === 'eraser' && (
                                            <React.Fragment>
                                                <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                                <div className="flex items-center gap-0.5 bg-white border border-slate-200 rounded-full p-1 shadow-sm" title="Kiểu tẩy">
                                                    <button onClick={() => setEraserShapeMode('point')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (eraserShapeMode === 'point' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:bg-slate-100')} title="Theo điểm (kéo tới đâu tẩy tới đó)">
                                                        <i className="fas fa-hand-pointer text-xs"></i>
                                                    </button>
                                                    <button onClick={() => setEraserShapeMode('rect')} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors " + (eraserShapeMode === 'rect' ? 'bg-emerald-100 text-emerald-700' : 'text-slate-400 hover:bg-slate-100')} title="Chọn vùng (kéo-thả hình chữ nhật)">
                                                        <i className="fas fa-vector-square text-xs"></i>
                                                    </button>
                                                </div>
                                            </React.Fragment>
                                        )}
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center justify-end gap-5 w-1/4">
                                <label className="cursor-pointer px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 rounded-xl text-sm font-bold transition-all flex items-center gap-2 border border-slate-200 shadow-sm">
                                    <i className="fas fa-upload text-emerald-500"></i> <span className="hidden sm:inline">Tải sách</span>
                                    <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                </label>

                                {pdfUrl && (
                                    <div className="flex items-center gap-1 bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-sm">
                                        <button onClick={() => setScale(s => Math.max(0.5, s - 0.2))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-minus"></i></button>
                                        <span className="text-sm font-bold text-slate-600 w-12 text-center">{Math.round(scale * 100)}%</span>
                                        <button onClick={() => setScale(s => Math.min(3, s + 0.2))} className="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white rounded-lg text-sm transition-colors"><i className="fas fa-plus"></i></button>
                                    </div>
                                )}

                                {pdfUrl && (
                                    <button
                                        onClick={() => {
                                            setIsDrawingMode(!isDrawingMode);
                                            if(!isDrawingMode && (tool==='magic' || tool==='ipa' || tool==='photo' || tool==='ai')) setTool('pencil');
                                            unlockAudio();
                                        }}
                                        className={"px-5 py-2 rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 " + (isDrawingMode ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-200' : 'bg-white text-slate-700 hover:bg-slate-50 border border-slate-200 shadow-sm')}
                                    >
                                        <i className="fas fa-pen-fancy"></i>
                                        {isDrawingMode ? 'Đóng Note' : 'Bật Note'}
                                    </button>
                                )}

                                {/* LƯU GHI CHÚ VÀO FILE: xuất PDF gốc + toàn bộ nét vẽ/note đã dán đè,
                                    rồi mở bảng Chia sẻ (Web Share API) với đúng tên file gốc — trên iPad,
                                    chọn "Lưu vào Files" > chọn lại đúng thư mục cũ > bấm "Thay thế" khi
                                    được hỏi, coi như đã ghi đè vào đúng file gốc (xem giải thích đầy đủ
                                    ở handleExportAnnotatedPdf — Safari không có API ghi thẳng vào file
                                    như 1 app native nên đây là cách gần nhất/tốt nhất làm được). */}
                                {pdfUrl && (
                                    <button
                                        onClick={handleExportAnnotatedPdf}
                                        disabled={isExporting}
                                        className={"px-4 py-2 rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 border shadow-sm " + (isExporting ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-emerald-600 hover:bg-emerald-50 border-emerald-200')}
                                        title="Lưu toàn bộ nét vẽ/note vào file PDF (mở bảng Chia sẻ để lưu đè vào đúng file gốc trong Files)"
                                    >
                                        <i className={"fas " + (isExporting ? 'fa-circle-notch fa-spin' : 'fa-floppy-disk')}></i>
                                        <span className="hidden sm:inline">{isExporting ? 'Đang lưu…' : 'Lưu ghi chú'}</span>
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        {/* PDF CONTENT AREA */}
                        {/* GHI CHÚ: đã thử tắt overflow-anchor (scroll anchoring) ở đây 2 LẦN riêng biệt
                            — cả 2 lần đều làm cuộn TỆ HƠN theo phản hồi thực tế, dù bối cảnh DOM đã khác
                            nhau giữa 2 lần thử. Kết luận: giữ nguyên mặc định (auto) của trình duyệt ở
                            đây, KHÔNG đụng vào nữa — gốc vấn đề nằm ở chỗ khác (xem PdfPage: bỏ re-render
                            thừa mỗi khi 1 trang cũ quay lại vùng nhìn thấy). */}
                        <div ref={pdfContentAreaRef} className="flex-1 overflow-y-auto relative p-6 pb-32 flex flex-col items-center justify-start">
                            
                            {!pdfUrl ? (
                                <div className="flex-1 flex flex-col items-center justify-center p-8 w-full max-w-2xl text-center animate-fade-in">
                                    <div className="w-32 h-32 bg-gradient-to-br from-emerald-50 to-emerald-200 rounded-3xl shadow-xl flex items-center justify-center mb-8 border border-slate-100 animate-gentle-bounce">
                                        <i className="fas fa-file-pdf text-6xl text-emerald-500"></i>
                                    </div>
                                    <h2 className="text-4xl font-extrabold text-slate-800 mb-4 tracking-tight">Night Chinese Land</h2>
                                    <p className="text-slate-500 mb-10 text-lg leading-relaxed">Hỗ trợ đọc PDF Offline siêu tốc. Trải nghiệm vẽ Zero-latency mượt mà và quét Dịch AI thông minh cho tài liệu tiếng Trung giản thể (Trung Quốc), được thiết kế đặc quyền cho iPad.</p>

                                    <label className="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-4 rounded-2xl font-bold cursor-pointer shadow-xl shadow-emerald-200 transition-all transform hover:-translate-y-1 active:scale-95 text-lg flex items-center gap-3">
                                        <i className="fas fa-cloud-upload-alt text-2xl"></i> Chọn Sách PDF từ máy
                                        <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                    </label>
                                </div>
                            ) : (
                                pdfDoc && Array.from(new Array(numPages), (el, index) => (
                                    <PdfPage
                                        key={index + 1}
                                        ref={(el) => { if (el) pageRefs.current[index + 1] = el; }}
                                        pageNum={index + 1}
                                        pdf={pdfDoc}
                                        scale={scale}
                                        isDrawingMode={isDrawingMode}
                                        tool={tool}
                                        magicShapeMode={magicShapeMode}
                                        aiShapeMode={aiShapeMode}
                                        pencilShapeMode={pencilShapeMode}
                                        eraserShapeMode={eraserShapeMode}
                                        pencilSize={pencilSize}
                                        color={color}
                                        fontSize={fontSize}
                                        basePageSize={basePageSize}
                                        onExtractText={onExtractText}
                                        onIPALookup={onIPALookup}
                                        onPhotoLookup={onPhotoLookup}
                                        onAILookup={onAILookup}
                                        onTextsChange={onPageTextsChange}
                                    />
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
