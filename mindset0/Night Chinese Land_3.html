                    // nhau cho cùng 1 đoạn.
                    strokePenTwoPass(ctx, scale, pencilSize, currentStrokeRef.current.glowColor, 1);
                } else {
                    ctx.stroke();
                }
            };

            const handlePointerUp = (e) => {
                if (!isDrawingRef.current) return;
                isDrawingRef.current = false;

                try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}

                // Chế độ tẩy "Chọn vùng": đã đủ 2 góc khung chọn — KHÔNG xoá ngay nữa, chỉ "chốt" lại
                // khung này vào pendingErase để hiện nút "Xoá" phía trên (xem JSX render + confirmPendingErase
                // bên dưới) — bấm vào nút đó mới thực sự xoá những nét nằm trong khung. Bỏ qua nếu khung
                // quá nhỏ (gần như 1 điểm, khả năng là bấm nhầm chứ không định kéo chọn vùng). Port từ
                // bản Night IELTS Land.
                if (tool === 'eraser' && eraserShapeMode === 'rect' && currentStrokeRef.current) {
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current = null;
                    const minSizePdf = 4 / scale;
                    if (Math.abs(p2.x - p1.x) < minSizePdf && Math.abs(p2.y - p1.y) < minSizePdf) {
                        redrawStrokes();
                        return;
                    }
                    setPendingErase({ p1, p2 });
                    return;
                }

                if (!currentStrokeRef.current || tool === 'eraser') return;

                if (tool === 'magic') {
                    if (magicShapeMode === 'rect') {
                        const [p1, p2] = currentStrokeRef.current.points;
                        currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    }
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    performMagicOCR(strokeToOCR);
                    return;
                }

                // Bút AI: y hệt cơ chế của bút Magic (hỗ trợ cả 2 kiểu chọn vùng — tự do lẫn hình chữ
                // nhật, qua aiShapeMode), chỉ khác ở bước sau OCR: không dịch, mà báo kết quả về App qua
                // onAILookup để hiện lên Box Bút AI (chọn prompt có sẵn rồi hỏi AI qua Groq) — xem
                // performAIOCR. Port từ bản Night IELTS Land.
                if (tool === 'ai') {
                    if (aiShapeMode === 'rect') {
                        const [p1, p2] = currentStrokeRef.current.points;
                        currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    }
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    performAIOCR(strokeToOCR);
                    return;
                }

                if (tool === 'ipa') {
                    // Kéo-thả ô chữ nhật (giống bút Magic ở chế độ hình chữ nhật) — chọn trúng khít
                    // đúng vùng chữ cần tra, không còn cần "phình" nét như kiểu bút highlight cũ nữa.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup — vẫn là 1 cử chỉ chạm/bấm thật, trình duyệt
                    // không chặn) SAU KHI cú kéo đã xong, để không làm gián đoạn thao tác kéo-thả.
                    const popupWin = openIPALookupWindow();
                    performIPAOCR(strokeToOCR, popupWin);
                    return;
                }

                if (tool === 'photo') {
                    // Kéo-thả ô chữ nhật — cùng cơ chế với bút IPA/Magic ở trên.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup), sau khi cú kéo đã xong — xem giải thích chi
                    // tiết ở nhánh 'ipa' phía trên.
                    const popupWin = openPhotoLookupWindow();
                    performPhotoOCR(strokeToOCR, popupWin);
                    return;
                }

                // Bút chì / bút bi / bút Present: lưu nét vẽ như bình thường — TRỪ bút Present (tool
                // 'present') cần đánh dấu thêm createdAt để hiệu ứng tự mờ dần sau 1.5 giây hoạt động
                // (xem TOOL_STYLES.present.fade + drawLine + effect "hiệu ứng mờ dần" phía trên). Port
                // từ bản Night IELTS Land.
                const strokeToSave = { ...currentStrokeRef.current };
                if (tool === 'present') strokeToSave.createdAt = Date.now();
                setStrokes(prev => [...prev, strokeToSave]);
                currentStrokeRef.current = null;
                smoothedPointRef.current = null;
            };

            const handleErase = (x, y) => {
                const eraseRadius = 15;
                setStrokes(prev => prev.filter(stroke => {
                    for (let pt of stroke.points) {
                        if (Math.hypot(pt.x - x, pt.y - y) < eraseRadius) return false;
                    }
                    return true;
                }));
                setTimeout(() => redrawStrokes(), 0);
            };

            // Bấm nút "Xoá" hiện phía trên khung tẩy "Chọn vùng" -> xoá thật sự mọi nét có ít nhất 1
            // điểm rơi vào trong khung đó (đúng logic lọc như bút tẩy theo điểm, chỉ dời thời điểm áp
            // dụng sang lúc bấm nút thay vì xoá ngay khi vừa buông tay). Port từ bản Night IELTS Land.
            const confirmPendingErase = () => {
                if (!pendingErase) return;
                const { p1, p2 } = pendingErase;
                const minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
                const minY = Math.min(p1.y, p2.y), maxY = Math.max(p1.y, p2.y);
                setStrokes(prev => prev.filter(stroke => {
                    for (let pt of stroke.points) {
                        if (pt.x >= minX && pt.x <= maxX && pt.y >= minY && pt.y <= maxY) return false;
                    }
                    return true;
                }));
                setPendingErase(null);
            };

            // Dọn khung "Xoá" đang chờ khi người dùng đổi sang tool khác hoặc đổi kiểu tẩy — tránh nút
            // "Xoá" bị "mồ côi" nổi lơ lửng trên trang trong khi đang dùng bút khác. Port từ bản Night
            // IELTS Land.
            useEffect(() => {
                if (!(tool === 'eraser' && eraserShapeMode === 'rect')) setPendingErase(null);
            }, [tool, eraserShapeMode]);

            // --- LÕI OCR DÙNG CHUNG CHO CẢ 3 BÚT (Magic / IPA / Tra ảnh) ---
            // Gộp về 1 chỗ để chắc chắn cả 3 bút hoạt động ổn định như nhau, tránh lặp code.
            const getStrokeBounds = (stroke) => {
                if (!viewport || !stroke || !stroke.points || stroke.points.length < 3) return null;
                const xs = stroke.points.map(p => p.x * scale);
                const ys = stroke.points.map(p => p.y * scale);
                const minX = Math.min(...xs), maxX = Math.max(...xs);
                const minY = Math.min(...ys), maxY = Math.max(...ys);
                const width = maxX - minX, height = maxY - minY;
                if (width < 10 || height < 10) return null;
                return { xs, ys, minX, minY, width, height };
            };

            const runOCROnBounds = async (bounds) => {
                try {
                    const canvas = canvasRef.current;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = bounds.width;
                    tempCanvas.height = bounds.height;
                    const tempCtx = tempCanvas.getContext('2d');

                    tempCtx.fillStyle = 'white';
                    tempCtx.fillRect(0, 0, bounds.width, bounds.height);

                    tempCtx.beginPath();
                    tempCtx.moveTo(bounds.xs[0] - bounds.minX, bounds.ys[0] - bounds.minY);
                    for (let i = 1; i < bounds.xs.length; i++) {
                        tempCtx.lineTo(bounds.xs[i] - bounds.minX, bounds.ys[i] - bounds.minY);
                    }
                    tempCtx.closePath();
                    tempCtx.clip();

                    tempCtx.drawImage(canvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);

                    const imageDataUrl = tempCanvas.toDataURL('image/png');
                    // 'chi_sim' = gói ngôn ngữ Chữ Hán GIẢN THỂ (Simplified Chinese) của Tesseract.js —
                    // đúng với chữ dùng ở Trung Quốc đại lục/Singapore, khác với 'chi_tra' (phồn thể,
                    // dùng ở Đài Loan/Hồng Kông). Không cần \n -> khoảng trắng như tiếng Anh (chữ Hán
                    // không cách nhau bằng dấu cách), nhưng vẫn giữ lại để dọn xuống dòng thừa do OCR
                    // đôi khi chèn vào.
                    const result = await Tesseract.recognize(imageDataUrl, 'chi_sim');
                    const text = result.data.text.replace(/\s+/g, '').trim();
                    return text.length > 0 ? text : "Không tìm thấy chữ trong vùng chọn.";
                } catch (err) {
                    console.error("OCR Error:", err);
                    return "Lỗi nhận diện chữ.";
                }
            };

            const performMagicOCR = async (stroke) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) return;
                onExtractText("", true);
                const text = await runOCROnBounds(bounds);
                onExtractText(text, false);
            };

            // Bút AI: quét chữ y hệt bút Magic (dùng chung runOCROnBounds — 'chi_sim'), chỉ khác ở việc
            // báo kết quả về đúng state riêng của bút AI (onAILookup) thay vì onExtractText (state đó
            // dành cho box dịch của bút Magic). Port từ bản Night IELTS Land.
            const performAIOCR = async (stroke) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) return;
                if (onAILookup) onAILookup("", true);
                const text = await runOCROnBounds(bounds);
                if (onAILookup) onAILookup(text, false);
            };

            const performIPAOCR = async (stroke, popupWin) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) {
                    if (popupWin && !popupWin.closed) { try { popupWin.close(); } catch (e) {} }
                    return;
                }
                onExtractText("", true);
                const text = await runOCROnBounds(bounds);
                onExtractText(text, false);
                if (text !== "Không tìm thấy chữ trong vùng chọn." && text !== "Lỗi nhận diện chữ." && onIPALookup) {
                    onIPALookup(text);
                }
                // Thử điều hướng popup Hanzii đã mở sẵn (best effort — nếu bị chặn thì
                // nút "Mở Hanzii" trong box IPA vẫn chắc chắn hoạt động).
                navigateIPALookupWindow(popupWin, extractFirstWord(text));
            };

            const performPhotoOCR = async (stroke, popupWin) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) {
                    if (popupWin && !popupWin.closed) { try { popupWin.close(); } catch (e) {} }
                    return;
                }
                const text = await runOCROnBounds(bounds);
                // Thử điều hướng popup đã mở sẵn (nếu trình duyệt không chặn) — best effort.
                navigatePhotoLookupWindow(popupWin, text);
                // LUÔN báo về App để hiện nút "Mở ảnh trên Google" — cách này chắc chắn hoạt động
                // dù popup tự động có bị chặn hay không, vì bấm nút là 1 cú chạm/bấm thật.
                if (onPhotoLookup) onPhotoLookup(text);
            };

            const updateText = (id, newProps) => {
                setTexts(prev => prev.map(t => t.id === id ? newProps : t));
            };

            const removeText = (id) => {
                setTexts(prev => prev.filter(t => t.id !== id));
            };

            // Báo nội dung text box của TRANG NÀY lên App mỗi khi đổi — dùng cho tính năng "Tóm tắt
            // phiên dạy" (App gom notes của TẤT CẢ các trang lại). Cố ý để App ghi vào 1 ref (không phải
            // state) nên việc gõ chữ ở đây KHÔNG hề gây re-render toàn bộ App/các trang khác — chỉ đọc
            // lại ref đó đúng lúc người dùng bấm "Tóm tắt ngay". Port từ bản Night IELTS Land.
            useEffect(() => {
                if (onTextsChange) onTextsChange(pageNum, texts);
            }, [texts, pageNum, onTextsChange]);

            // --- "CHỤP" LẠI TOÀN BỘ GHI CHÚ CỦA TRANG NÀY THÀNH 1 ẢNH PNG NỀN TRONG SUỐT ---
            // Dùng cho tính năng "Lưu ghi chú vào file" ở App (xem handleExportAnnotatedPdf) — App gọi
            // vào đây qua ref (useImperativeHandle bên dưới) để lấy ảnh rồi dán đè lên đúng trang PDF
            // gốc bằng pdf-lib. Trả về null nếu trang chưa từng render (chưa có viewport — nghĩa là
            // người dùng chưa từng cuộn tới, chắc chắn cũng chưa ghi note gì) hoặc trang không có nét
            // vẽ/text nào (không cần tốn công dựng ảnh cho trang "sạch").
            const getAnnotationSnapshot = useCallback(() => {
                const drawCanvas = drawCanvasRef.current;
                if (!drawCanvas || !viewport) return null;
                if (strokes.length === 0 && texts.length === 0) return null;

                // Vẽ lên 1 canvas TẠM, không đụng gì tới canvas đang hiển thị cho người dùng. Canvas
                // tạm bắt đầu bằng đúng nét vẽ đã có (redrawStrokes đã tự vẽ sẵn lên drawCanvas), rồi
                // vẽ thêm các ô Text (PdfTextBox vốn là <textarea> DOM riêng, không tự nằm trên canvas).
                const temp = document.createElement('canvas');
                temp.width = drawCanvas.width;
                temp.height = drawCanvas.height;
                const ctx = temp.getContext('2d');
                ctx.drawImage(drawCanvas, 0, 0);

                const PAD = 8; // khớp class Tailwind "p-2" (0.5rem = 8px) của <textarea> trong PdfTextBox
                texts.forEach(t => {
                    const content = (t.text || '').trim();
                    if (!content) return; // ô text rỗng — không có gì để in ra
                    const fontPx = t.size * scale;
                    ctx.font = fontPx + 'px "Plus Jakarta Sans", "Noto Sans TC", sans-serif';
                    ctx.fillStyle = t.color;
                    ctx.textBaseline = 'alphabetic';

                    const boxX = t.x * scale;
                    const boxY = t.y * scale;
                    const maxWidth = Math.max(10, (t.width || 150) * scale - PAD * 2);
                    const lineHeight = fontPx * 1.4; // xấp xỉ "leading-relaxed" của Tailwind

                    // Tự xuống dòng theo TỪNG KÝ TỰ (không theo từ) — đúng cách chữ Hán/tiếng Trung tự
                    // nhiên xuống dòng ở bất kỳ đâu (không có khoảng trắng ngăn "từ" như tiếng Anh).
                    // Với chữ Việt gõ trong ô note đây là cách xuống dòng gần đúng (best-effort, có thể
                    // ngắt giữa từ) chứ không tự nhiên hệt như trình duyệt tự render <textarea> — nhưng
                    // vẫn đọc được đủ nội dung, không bị cắt mất chữ nào.
                    let lineIndex = 0;
                    const drawLineAt = (str) => {
                        ctx.fillText(str, boxX + PAD, boxY + PAD + lineHeight * lineIndex + fontPx * 0.85);
                        lineIndex++;
                    };
                    content.split('\n').forEach(paragraph => {
                        if (paragraph === '') { lineIndex++; return; }
                        let current = '';
                        for (const ch of paragraph) {
                            const test = current + ch;
                            if (current !== '' && ctx.measureText(test).width > maxWidth) {
                                drawLineAt(current);
                                current = ch;
                            } else {
                                current = test;
                            }
                        }
                        if (current) drawLineAt(current);
                    });
                });

                return { pageNum, dataUrl: temp.toDataURL('image/png') };
            }, [strokes, texts, viewport, scale, pageNum]);

            useImperativeHandle(ref, () => ({ getAnnotationSnapshot }), [getAnnotationSnapshot]);

            return (
                <div id={`pdf-page-${pageNum}`} ref={containerRef} className="pdf-page-container" style={
                    // QUAN TRỌNG — sửa dứt điểm lỗi "cuộn giật/nhảy trang", "bấm mục lục đến sai trang",
                    // "có text box thì cuộn bị nhảy giật": trước đây khung TRANG luôn đổi từ kích thước
                    // ước lượng (basePageSize) SANG kích thước thật (viewport) đúng lúc trang đó vừa
                    // render xong — dù đã ước lượng khá sát, việc ĐỔI kích thước này (dù chỉ 1 lần/trang)
                    // vẫn là 1 lần reflow thật, và khi nhiều trang cùng đổi gần như đồng thời lúc cuộn
                    // nhanh, các lần reflow dồn lại làm view "nhảy" xa hơn hẳn thao tác cuộn thật của
                    // người dùng — cũng chính là lý do trình duyệt tự "kéo" lại về gần ô đang có focus
                    // (text box) mỗi khi có reflow ở ngay phía trên nó. Giờ ưu tiên basePageSize LUÔN
                    // LUÔN (một khi đã có — chỉ mất đúng 1 lần load ngay khi mở file) làm kích thước
                    // DUY NHẤT và CỐ ĐỊNH cho MỌI trang, không đổi sang viewport riêng của từng trang
                    // nữa — vì tuyệt đại đa số PDF có mọi trang cùng kích thước nên basePageSize vốn dĩ
                    // đã khớp chính xác, và giờ khung trang không còn đổi kích thước lần nào sau khi
                    // mount nữa => không còn nguồn gây reflow/nhảy cuộn nào từ việc này nữa.
                    basePageSize
                        ? { width: basePageSize.width * scale, height: basePageSize.height * scale }
                        : (viewport
                            ? { width: viewport.width, height: viewport.height }
                            : { width: '100%', minHeight: (1131 * scale) + 'px' })
                }>
                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC "cuộn lùi nhảy vọt lên trang đầu": trước đây 2 canvas
                        + spinner tuy đã được mount sẵn cố định (không unmount nữa), nhưng vẫn ẩn/hiện
                        bằng CSS `display: none/block`. `display` đổi qua lại nghĩa là phần tử bị GỠ hẳn
                        khỏi/rồi CHÈN LẠI vào Layout Tree (cây bố cục) — mỗi lần cuộn lùi qua nhiều trang
                        đã từng hiện ra trước đó, hàng loạt canvas cùng lúc chuyển từ none -> block, cây
                        bố cục bị coi như "vừa có nội dung mới chèn vào phía trên", khiến cơ chế "scroll
                        anchoring" của trình duyệt (vốn dùng để tự bù cuộn khi có nội dung thật sự bị
                        chèn/xoá phía trên) hiểu lầm và tự ý bù vị trí cuộn — đúng kiểu jump đột ngột (không
                        tăng dần như quán tính) mà không hề liên quan gì tới lực lướt hay tốc độ wheel cả.
                        Sửa: đổi hẳn sang `visibility: hidden/visible` thay cho `display` — visibility
                        vẫn ẩn hoàn toàn hình ảnh (không tốn công vẽ) và vẫn tự động không nhận sự kiện
                        chuột/bút khi ẩn (giống display:none), NHƯNG không hề đụng tới Layout Tree — phần
                        tử vẫn luôn ở đó, chỉ đổi trạng thái hiển thị, nên trình duyệt không còn lý do gì
                        để "giật mình" bù cuộn nữa. */}
                    <canvas ref={canvasRef} className="pdf-canvas" style={{ visibility: isVisible ? 'visible' : 'hidden' }} />
                    <canvas
                        ref={drawCanvasRef}
                        className="draw-canvas cursor-crosshair"
                        style={{ visibility: isVisible ? 'visible' : 'hidden', pointerEvents: isDrawingMode ? 'auto' : 'none' }}
                        onPointerDown={handlePointerDown}
                        onPointerMove={handlePointerMove}
                        onPointerUp={handlePointerUp}
                        onPointerCancel={handlePointerUp}
                        onPointerOut={handlePointerUp}
                    />
                    <div
                        className="absolute inset-0 w-full h-full flex items-center justify-center bg-slate-50 text-slate-300 pointer-events-none"
                        style={{ visibility: isVisible ? 'hidden' : 'visible' }}
                    >
                        <i className="fas fa-circle-notch fa-spin text-4xl"></i>
                    </div>

                    {/* QUAN TRỌNG — TÌM RA ĐÚNG GỐC lỗi "cuộn (đặc biệt lùi về trang trước) bị nhảy
                        vọt tới 1 vị trí xa lạ, không liên quan gì tới tốc độ lướt": Text Box trước đây
                        nằm CHUNG trong khối chỉ render khi isVisible — nghĩa là mỗi khi 1 trang cuộn ra
                        khỏi rồi quay lại vùng đệm (rất hay xảy ra khi cuộn qua lại nhiều), TOÀN BỘ text
                        box trên trang đó bị HUỶ rồi TẠO MỚI lại từ đầu. PdfTextBox có state "active"
                        khởi tạo mặc định = true kèm useEffect tự gọi textareaRef.focus() ngay khi mount
                        — nghĩa là mỗi lần "tạo mới lại" như vậy, ô textarea đó lại được focus() lại 1
                        lần nữa, và trình duyệt sẽ TỰ ĐỘNG cuộn tới đúng vị trí ô đang được focus đó —
                        đây mới là nguyên nhân thật của cú "nhảy" (không phải do quán tính cuộn hay do
                        reflow kích thước trang). Giờ Text Box được tách ra render LUÔN LUÔN, không phụ
                        thuộc isVisible nữa — chỉ mất đúng 1 lần mount/focus duy nhất lúc thật sự tạo
                        note mới, không bao giờ tự mount lại (nên không bao giờ tự focus lại) chỉ vì
                        cuộn qua cuộn lại nữa. */}
                    {texts.map(t => (
                        <PdfTextBox
                            key={t.id}
                            t={t}
                            scale={scale}
                            updateText={updateText}
                            removeText={removeText}
                            // Mép phải trang (đơn vị PDF-space, scale=1) tính từ basePageSize trừ đi vị
                            // trí x của chính box đó và 1 khoảng lề nhỏ — dùng để effect tự-giãn-chiều-
                            // rộng trong PdfTextBox biết dừng lại đúng lúc chạm mép trang rồi tự xuống
                            // dòng, thay vì tràn ra ngoài trang. Port từ bản Night IELTS Land.
                            maxWidthPdf={basePageSize ? Math.max(TEXTBOX_MIN_WIDTH, basePageSize.width - t.x - 20) : undefined}
                        />
                    ))}

                    {/* Nút "Xoá" nổi ngay phía trên khung tẩy "Chọn vùng" vừa kéo xong — bấm vào là xoá
                        NGAY LẬP TỨC (không hỏi lại lần nữa). Toạ độ tính từ 2 góc đã kéo (pendingErase,
                        đơn vị PDF-space) nhân với scale để ra đúng vị trí CSS pixel thật, canh giữa
                        theo chiều ngang của khung, đặt hẳn lên phía trên mép trên khung (translateY
                        -100% + cách thêm 1 chút) để không che mất nội dung bên trong khung. Port từ
                        bản Night IELTS Land. */}
                    {pendingErase && (
                        <button
                            onPointerDown={(e) => { e.stopPropagation(); confirmPendingErase(); }}
                            className="absolute z-30 px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-xs font-bold shadow-lg flex items-center gap-1.5 transition-colors active:scale-95 touch-none"
                            style={{
                                left: ((Math.min(pendingErase.p1.x, pendingErase.p2.x) + Math.max(pendingErase.p1.x, pendingErase.p2.x)) / 2) * scale,
                                top: Math.min(pendingErase.p1.y, pendingErase.p2.y) * scale,
                                transform: 'translate(-50%, calc(-100% - 8px))',
                            }}
                        >
                            <i className="fas fa-trash text-[10px]"></i> Xoá
                        </button>
                    )}
                </div>
            );
        }));

        // --- TRÌNH PHÁT FILE ÂM THANH NỔI (kéo-thả được) ---
        // Tính năng MỚI: chọn 1 file âm thanh bất kỳ từ máy (mp3/m4a/wav...), hiện 1 thanh điều khiển
        // nổi (giống 1 "cửa sổ" nhỏ, độc lập với trang PDF đang xem) có phân tích sóng âm (waveform)
        // trực quan, kéo-thả được tới bất kỳ đâu trên màn hình, chỉnh tốc độ phát, bấm/chạm thẳng vào
        // sóng âm để tua tới đúng vị trí, và zoom 2 ngón tay (hoặc kéo thanh trượt) để phóng to/thu
        // nhỏ sóng âm khi cần tua chính xác vào 1 đoạn ngắn. Tách hẳn thành 1 component riêng
        // (React.memo) — mọi state cập nhật liên tục lúc đang phát (thời gian, vị trí playhead...) chỉ
        // khiến component NHỎ này tự vẽ lại, hoàn toàn không đụng tới/làm App hay các trang PDF (vốn
        // có thể rất nặng với sách nhiều trang) phải render lại theo.
        const AudioPlayerBar = React.memo(function AudioPlayerBar({ src, fileName, onClose }) {
            // Phát tiếng bằng 1 thẻ <audio> thuần (không gắn vào DOM hiển thị — chỉ dùng làm "động cơ"
            // phát/tua/đổi tốc độ, đơn giản và ổn định hơn hẳn tự dựng lại bằng Web Audio API). Tạo
            // đúng 1 lần duy nhất cho mỗi lần mount (component được gắn key=src ở App -> đổi file khác
            // sẽ tự unmount/mount lại component MỚI, không cần tự tay reset từng state một).
            const audioElRef = useRef(null);
            if (!audioElRef.current) audioElRef.current = new Audio();

            const barRef = useRef(null);
            const scrollRef = useRef(null);
            const canvasRef = useRef(null);

            const [playing, setPlaying] = useState(false);
            const [duration, setDuration] = useState(0);
            const [displayTime, setDisplayTime] = useState(0);
            const [rateIdx, setRateIdx] = useState(2); // mặc định trỏ vào AUDIO_SPEED_STEPS[2] = 1x
            const [peaks, setPeaks] = useState(null); // Float32Array biên độ đỉnh, null = chưa xong/lỗi
            const [waveformError, setWaveformError] = useState('');
            const [analyzing, setAnalyzing] = useState(true);
            const [fitPxPerSec, setFitPxPerSec] = useState(50);
            const [pxPerSec, setPxPerSec] = useState(50);
            const [dragPos, setDragPos] = useState(null); // null = dùng vị trí mặc định (căn giữa trên)

            // Refs "gương" của vài state — để các listener sự kiện gốc (gesture/wheel, gắn 1 lần duy
            // nhất) luôn đọc được giá trị MỚI NHẤT mà không cần gỡ-gắn lại listener mỗi khi state đổi
            // (giống hệt kiểu scaleRef/zoomLockedRef đã dùng cho pinch-zoom trang PDF ở trên).
            const currentTimeRef = useRef(0);
            const pxPerSecRef = useRef(pxPerSec);
            useEffect(() => { pxPerSecRef.current = pxPerSec; }, [pxPerSec]);
            const fitPxPerSecRef = useRef(fitPxPerSec);
            useEffect(() => { fitPxPerSecRef.current = fitPxPerSec; }, [fitPxPerSec]);
            const durationRef = useRef(duration);
            useEffect(() => { durationRef.current = duration; }, [duration]);
            const zoomInitedRef = useRef(false);
            const pendingAnchorRef = useRef(null);
            const rafRef = useRef(null);

            // Nạp file: lấy duration NGAY qua metadata của thẻ audio (nhanh, không cần đợi giải mã
            // toàn bộ) để phần khung/thời lượng hiện ra liền — việc phân tích sóng âm (nặng hơn) chạy
            // riêng, xong tới đâu tự cập nhật hình sóng tới đó.
            useEffect(() => {
                const audio = audioElRef.current;
                audio.pause();
                audio.src = src;
                audio.playbackRate = AUDIO_SPEED_STEPS[rateIdx];
                const onLoadedMeta = () => setDuration(audio.duration || 0);
                const onTimeUpdate = () => {
                    currentTimeRef.current = audio.currentTime;
                    setDisplayTime(audio.currentTime);
                };
                const onPlay = () => setPlaying(true);
                const onPause = () => setPlaying(false);
                const onEnded = () => setPlaying(false);
                audio.addEventListener('loadedmetadata', onLoadedMeta);
                audio.addEventListener('timeupdate', onTimeUpdate);
                audio.addEventListener('play', onPlay);
                audio.addEventListener('pause', onPause);
                audio.addEventListener('ended', onEnded);
                return () => {
                    audio.pause();
                    audio.removeEventListener('loadedmetadata', onLoadedMeta);
                    audio.removeEventListener('timeupdate', onTimeUpdate);
                    audio.removeEventListener('play', onPlay);
                    audio.removeEventListener('pause', onPause);
                    audio.removeEventListener('ended', onEnded);
                };
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [src]);

            // Phân tích sóng âm: giải mã toàn bộ file (Web Audio API) rồi rút gọn thành đúng
            // AUDIO_WAVEFORM_PEAKS "cột" biên độ đỉnh (lấy kênh đầu tiên — đủ đại diện cho hình dạng
            // sóng, nhanh gấp đôi so với gộp cả 2 kênh stereo). Việc này CÓ THỂ mất vài giây với file
            // dài — không chặn phần phát/tua (đã chạy độc lập ở effect trên qua thẻ <audio>), chỉ ảnh
            // hưởng riêng phần hình vẽ sóng. Lỗi giải mã (định dạng lạ trình duyệt không đọc được bằng
            // Web Audio, dù thẻ <audio> vẫn phát được) không chặn phát nhạc — chỉ hiện thanh trơn thay
            // cho hình sóng.
            useEffect(() => {
                let cancelled = false;
                setAnalyzing(true);
                setWaveformError('');
                setPeaks(null);
                (async () => {
                    try {
                        const res = await fetch(src);
                        const buf = await res.arrayBuffer();
                        const Ctx = window.AudioContext || window.webkitAudioContext;
                        const ctx = new Ctx();
                        let audioBuffer;
                        try {
                            audioBuffer = await ctx.decodeAudioData(buf);
                        } finally {
                            ctx.close().catch(() => {});
                        }
                        if (cancelled) return;
                        const data = audioBuffer.getChannelData(0);
                        const total = data.length;
                        const bucketSize = Math.max(1, Math.floor(total / AUDIO_WAVEFORM_PEAKS));
                        const result = new Float32Array(AUDIO_WAVEFORM_PEAKS);
                        for (let i = 0; i < AUDIO_WAVEFORM_PEAKS; i++) {
                            const start = i * bucketSize;
                            const end = Math.min(total, start + bucketSize);
                            let peak = 0;
                            for (let j = start; j < end; j++) {
                                const av = data[j] < 0 ? -data[j] : data[j];
                                if (av > peak) peak = av;
                            }
                            result[i] = peak;
                        }
                        if (cancelled) return;
                        setPeaks(result);
                        if (!durationRef.current) setDuration(audioBuffer.duration || 0);
                    } catch (err) {
                        if (!cancelled) setWaveformError('Không phân tích được hình sóng — vẫn phát/tua bình thường.');
                    } finally {
                        if (!cancelled) setAnalyzing(false);
                    }
                })();
                return () => { cancelled = true; };
            }, [src]);

            // Zoom mặc định = "vừa khít" toàn bộ chiều dài audio trong đúng bề ngang khung nhìn thấy
            // (giống hệt hình mẫu — thấy trọn cả bài ngay khi mở, không cần cuộn). Chỉ tự đặt lại
            // ĐÚNG 1 LẦN khi vừa biết duration; sau đó nếu cửa sổ đổi kích thước, chỉ nâng lại mức
            // TỐI THIỂU (fitPxPerSec) chứ không ép zoom hiện tại của người dùng về lại mức khít nữa.
            useEffect(() => {
                const computeFit = () => {
                    const el = scrollRef.current;
                    if (!el || !duration) return;
                    const fit = Math.max(4, el.clientWidth / duration);
                    setFitPxPerSec(fit);
                    if (!zoomInitedRef.current) {
                        zoomInitedRef.current = true;
                        setPxPerSec(fit);
                    } else {
                        setPxPerSec(p => Math.max(p, fit));
                    }
                };
                computeFit();
                window.addEventListener('resize', computeFit);
                return () => window.removeEventListener('resize', computeFit);
            }, [duration]);

            // Đổi kích thước canvas thật (bù devicePixelRatio cho nét trên màn Retina/iPad) mỗi khi
            // duration/pxPerSec đổi — bề rộng canvas = duration*pxPerSec (đủ hiển thị hết khi cuộn),
            // tối thiểu bằng đúng bề ngang khung nhìn thấy để không bị hụt khi chưa zoom vào.
            const getCssWidth = useCallback(() => {
                const el = scrollRef.current;
                const w = el ? el.clientWidth : 0;
                return Math.max(w, Math.ceil(duration * pxPerSec));
            }, [duration, pxPerSec]);

            const drawWaveform = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas || !duration) return;
                const cssW = getCssWidth();
                const cssH = 64;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, cssW, cssH);
                const mid = cssH / 2;
                const px = pxPerSecRef.current;
                const playedX = currentTimeRef.current * px;

                ctx.strokeStyle = 'rgba(16,185,129,0.25)';
                ctx.setLineDash([2, 4]);
                ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(cssW, mid); ctx.stroke();
                ctx.setLineDash([]);

                const barW = 3, gap = 2;
                const step = barW + gap;
                const totalBars = Math.ceil(cssW / step);
                for (let i = 0; i < totalBars; i++) {
                    const x = i * step;
                    let amp;
                    if (peaks) {
                        const t = x / px;
                        const idx = Math.max(0, Math.min(peaks.length - 1, Math.floor((t / duration) * peaks.length)));
                        amp = peaks[idx] || 0;
                    } else {
                        amp = 0.12; // chưa có dữ liệu sóng thật -> vạch phẳng thấp, chỉ để thấy có "track"
                    }
                    const barH = Math.max(3, amp * (cssH * 0.88));
                    ctx.fillStyle = x <= playedX ? '#10b981' : '#a7f3d0';
                    ctx.fillRect(x, mid - barH / 2, barW, barH);
                }

                ctx.strokeStyle = '#064e3b';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(playedX, 0); ctx.lineTo(playedX, cssH); ctx.stroke();
            }, [peaks, duration, getCssWidth]);

            useLayoutEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || !duration) return;
                const cssW = getCssWidth();
                const cssH = 64;
                const dpr = window.devicePixelRatio || 1;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
                canvas.width = Math.round(cssW * dpr);
                canvas.height = Math.round(cssH * dpr);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawWaveform();
                // Sau khi đổi cỡ canvas do zoom (KHÔNG phải do cuộn/phát bình thường) -> khôi phục lại
                // đúng vị trí cuộn sao cho đúng THỜI ĐIỂM đang neo (pendingAnchorRef, ghi lúc pinch/
                // lăn chuột) vẫn nằm nguyên dưới đúng điểm ngón tay/con trỏ, không bị "nhảy" đi chỗ khác.
                const anchor = pendingAnchorRef.current;
                const scrollEl = scrollRef.current;
                if (anchor && scrollEl) {
                    pendingAnchorRef.current = null;
                    const rect = scrollEl.getBoundingClientRect();
                    scrollEl.scrollLeft = Math.max(0, anchor.time * pxPerSecRef.current - (anchor.clientX - rect.left));
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [duration, pxPerSec, peaks]);

            // Vòng lặp requestAnimationFrame trong lúc đang phát: tự vẽ lại playhead mượt mà + tự cuộn
            // theo cho playhead luôn nằm trong vùng nhìn thấy — không đụng setState mỗi khung hình (chỉ
            // displayTime đã tự cập nhật qua sự kiện timeupdate ở effect nạp file, tần suất thấp hơn
            // nhiều, đủ mượt cho ô hiển thị thời gian dạng số).
            useEffect(() => {
                if (!playing) return;
                const tick = () => {
                    currentTimeRef.current = audioElRef.current.currentTime;
                    drawWaveform();
                    const scrollEl = scrollRef.current;
                    if (scrollEl) {
                        const playedX = currentTimeRef.current * pxPerSecRef.current;
                        const viewL = scrollEl.scrollLeft;
                        const viewR = viewL + scrollEl.clientWidth;
                        if (playedX < viewL || playedX > viewR - 48) {
                            scrollEl.scrollLeft = Math.max(0, playedX - scrollEl.clientWidth * 0.3);
                        }
                    }
                    rafRef.current = requestAnimationFrame(tick);
                };
                rafRef.current = requestAnimationFrame(tick);
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [playing, drawWaveform]);

            // --- ZOOM 2 NGÓN TAY TRÊN SÓNG ÂM — y hệt cơ chế zoom nội dung PDF ở trên (Safari:
            // gesturestart/change/end; Chrome/Firefox trackpad: wheel+ctrlKey) — nhưng ÁP DỤNG RIÊNG
            // cho khung sóng âm này, không đụng gì tới zoom trang PDF. Vì component này rất nhẹ (chỉ tự
            // vẽ lại 1 canvas nhỏ, không phải hàng chục trang PDF), không cần kỹ thuật "xem trước bằng
            // CSS transform" phức tạp như bên PDF — đổi thẳng pxPerSec (state) mỗi lần là đủ mượt.
            useEffect(() => {
                const el = scrollRef.current;
                if (!el) return;
                let pinching = false;
                let pinchStartPx = 50;

                const applyZoomAtClientX = (newPx, clientX) => {
                    const rect = el.getBoundingClientRect();
                    const time = ((clientX - rect.left) + el.scrollLeft) / pxPerSecRef.current;
                    pendingAnchorRef.current = { clientX, time };
                    const clamped = Math.max(fitPxPerSecRef.current, Math.min(AUDIO_MAX_PX_PER_SEC, newPx));
                    setPxPerSec(clamped);
                };

                const onGestureStart = (e) => { e.preventDefault(); pinching = true; pinchStartPx = pxPerSecRef.current; };
                const onGestureChange = (e) => { e.preventDefault(); if (!pinching) return; applyZoomAtClientX(pinchStartPx * e.scale, e.clientX); };
                const onGestureEnd = (e) => { e.preventDefault(); pinching = false; };
                const onWheel = (e) => {
                    if (!e.ctrlKey) return;
                    e.preventDefault();
                    applyZoomAtClientX(pxPerSecRef.current * Math.exp(-e.deltaY * 0.01), e.clientX);
                };

                el.addEventListener('gesturestart', onGestureStart, { passive: false });
                el.addEventListener('gesturechange', onGestureChange, { passive: false });
                el.addEventListener('gestureend', onGestureEnd, { passive: false });
                el.addEventListener('wheel', onWheel, { passive: false });
                return () => {
                    el.removeEventListener('gesturestart', onGestureStart);
                    el.removeEventListener('gesturechange', onGestureChange);
                    el.removeEventListener('gestureend', onGestureEnd);
                    el.removeEventListener('wheel', onWheel);
                };
            }, []);

            const handleZoomSlider = (e) => {
                const t = parseFloat(e.target.value);
                const el = scrollRef.current;
                // Neo theo GIỮA khung nhìn thấy hiện tại (kéo thanh trượt không có toạ độ ngón tay cụ
                // thể trên sóng âm như pinch, nên dùng điểm giữa khung làm mốc hợp lý nhất).
                if (el) {
                    const centerClientX = el.getBoundingClientRect().left + el.clientWidth / 2;
                    const time = (el.scrollLeft + el.clientWidth / 2) / pxPerSecRef.current;
                    pendingAnchorRef.current = { clientX: centerClientX, time };
                }
                setPxPerSec(fitPxPerSec + t * (AUDIO_MAX_PX_PER_SEC - fitPxPerSec));
            };

            const seekToClientX = (clientX) => {
                if (!duration) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const rect = canvas.getBoundingClientRect();
                const t = Math.max(0, Math.min(duration, (clientX - rect.left) / pxPerSecRef.current));
                audioElRef.current.currentTime = t;
                currentTimeRef.current = t;
                setDisplayTime(t);
                drawWaveform();
            };

            const togglePlay = () => {
                const a = audioElRef.current;
                if (a.paused) a.play().catch(() => {});
                else a.pause();
            };
            const skip = (delta) => {
                const a = audioElRef.current;
                const t = Math.max(0, Math.min(duration || 0, a.currentTime + delta));
                a.currentTime = t;
                currentTimeRef.current = t;
                setDisplayTime(t);
                drawWaveform();
            };
            const jumpToStart = () => skip(-Infinity);
            const jumpToEnd = () => { const a = audioElRef.current; const t = Math.max(0, (duration || 0) - 0.05); a.currentTime = t; currentTimeRef.current = t; setDisplayTime(t); drawWaveform(); };
            const cycleRate = () => {
                setRateIdx(i => {
                    const next = (i + 1) % AUDIO_SPEED_STEPS.length;
                    audioElRef.current.playbackRate = AUDIO_SPEED_STEPS[next];
                    return next;
                });
            };

            // Kéo-thả cả thanh tới bất kỳ đâu trên màn hình — nắm kéo là đúng phần tiêu đề (icon +
            // tên file) bên trái, KHÔNG lồng nút bấm nào trong đó nên không cần chặn sự kiện gì thêm.
            const startDrag = (e) => {
                e.preventDefault();
                const rect = barRef.current.getBoundingClientRect();
                const offsetX = e.clientX - rect.left;
                const offsetY = e.clientY - rect.top;
                const onMove = (ev) => {
                    const maxX = window.innerWidth - 60;
                    const maxY = window.innerHeight - 40;
                    setDragPos({
                        x: Math.max(-rect.width + 80, Math.min(maxX, ev.clientX - offsetX)),
                        y: Math.max(0, Math.min(maxY, ev.clientY - offsetY)),
                    });
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const zoomSliderValue = AUDIO_MAX_PX_PER_SEC > fitPxPerSec
                ? Math.max(0, Math.min(1, (pxPerSec - fitPxPerSec) / (AUDIO_MAX_PX_PER_SEC - fitPxPerSec)))
                : 0;

            return (
                <div
                    ref={barRef}
                    className={"fixed z-[260] w-[92%] max-w-3xl bg-white rounded-3xl shadow-2xl border border-slate-100 px-5 sm:px-7 py-5 " + (dragPos ? '' : 'top-24 left-1/2 -translate-x-1/2')}
                    style={dragPos ? { left: dragPos.x, top: dragPos.y } : {}}
                >
                    <button
                        onClick={onClose}
                        className="absolute -top-2.5 -right-2.5 w-7 h-7 bg-slate-700 hover:bg-slate-800 text-white rounded-full flex items-center justify-center shadow-md transition-colors"
                        title="Đóng trình phát âm thanh"
                    >
                        <i className="fas fa-times text-xs"></i>
                    </button>

                    <div className="flex items-center justify-between gap-4 mb-4 flex-wrap">
                        <div onPointerDown={startDrag} className="flex items-center gap-3 min-w-0 cursor-move select-none touch-none" title="Kéo để di chuyển thanh này">
                            <i className="fas fa-headphones-alt text-emerald-500 text-lg shrink-0"></i>
                            <span className="font-extrabold text-slate-800 text-base sm:text-lg truncate">{fileName || 'Âm thanh'}</span>
                        </div>
                        <div className="flex items-center gap-2.5 shrink-0">
                            <i className="fas fa-search-minus text-slate-300 text-xs"></i>
                            <input
                                type="range" min="0" max="1" step="0.01"
                                value={zoomSliderValue}
                                onChange={handleZoomSlider}
                                className="w-20 sm:w-28 accent-emerald-500"
                                title="Phóng to/thu nhỏ sóng âm"
                            />
                            <i className="fas fa-search-plus text-slate-400 text-xs"></i>
                            <span className="text-xs font-bold text-slate-500 tabular-nums w-[86px] text-right">{formatAudioTime(displayTime)} / {formatAudioTime(duration)}</span>
                        </div>
                    </div>

                    <div
                        ref={scrollRef}
                        className="w-full h-16 bg-slate-50 rounded-2xl overflow-x-auto overflow-y-hidden relative"
                    >
                        {analyzing && (
                            <div className="absolute inset-0 flex items-center justify-center gap-2 text-slate-300 text-xs bg-slate-50/80 pointer-events-none z-10">
                                <i className="fas fa-circle-notch fa-spin"></i> Đang phân tích sóng âm...
                            </div>
                        )}
                        {waveformError && !analyzing && (
                            <div className="absolute top-1 left-2 text-[10px] text-amber-500 z-10 pointer-events-none">{waveformError}</div>
                        )}
                        <canvas
                            ref={canvasRef}
                            className="cursor-pointer"
                            onPointerDown={(e) => { e.stopPropagation(); seekToClientX(e.clientX); }}
                        />
                    </div>

                    <div className="grid grid-cols-3 items-center mt-4">
                        <div className="flex items-center gap-2 justify-self-start">
                            <button onClick={jumpToStart} className="w-9 h-9 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center transition-colors" title="Về đầu">
                                <i className="fas fa-step-backward text-xs"></i>
                            </button>
                            <button onClick={cycleRate} className="px-3 h-9 rounded-xl bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold text-sm transition-colors" title="Đổi tốc độ phát">
                                {AUDIO_SPEED_STEPS[rateIdx]}x
                            </button>
                        </div>
                        <div className="flex items-center gap-3 sm:gap-4 justify-self-center">
                            <button onClick={() => skip(-5)} className="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex flex-col items-center justify-center gap-0.5 transition-colors" title="Lùi 5 giây">
                                <i className="fas fa-undo text-sm"></i>
                                <span className="text-[9px] font-bold leading-none">5s</span>
                            </button>
                            <button onClick={togglePlay} className="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-lg shadow-emerald-200 transition-all active:scale-95" title={playing ? 'Tạm dừng' : 'Phát'}>
                                <i className={"fas text-lg " + (playing ? 'fa-pause' : 'fa-play ml-0.5')}></i>
                            </button>
                            <button onClick={() => skip(5)} className="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex flex-col items-center justify-center gap-0.5 transition-colors" title="Tiến 5 giây">
                                <i className="fas fa-redo text-sm"></i>
                                <span className="text-[9px] font-bold leading-none">5s</span>
                            </button>
                        </div>
                        <div className="justify-self-end">
                            <button onClick={jumpToEnd} className="w-9 h-9 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center transition-colors" title="Đến cuối">
                                <i className="fas fa-step-forward text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        });


        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [pdfUrl, setPdfUrl] = useState(null);
            const [pdfDoc, setPdfDoc] = useState(null);
            const [numPages, setNumPages] = useState(0);
            const [scale, setScale] = useState(1.2);
            // QUAN TRỌNG — sửa lỗi "cuộn bị giật/nhảy qua nhiều trang": trước đây, TRƯỚC KHI 1 trang
            // kịp render, khung chứa của nó dùng 1 chiều cao ƯỚC LƯỢNG cố định (1131px * scale) làm
            // placeholder. Với sách có kích thước trang khác con số đó (rất phổ biến), ngay khi trang
            // render xong và đổi sang chiều cao THẬT, khung sẽ đổi kích thước đột ngột — đẩy lệch toàn
            // bộ các trang bên dưới, khiến vị trí cuộn hiện tại bị "nhảy" theo, càng rõ khi cuộn nhanh
            // qua nhiều trang chưa kịp render (mỗi trang đổi kích thước là 1 lần giật). Giờ lấy kích
            // thước THẬT của trang 1 (chỉ 1 lần, ngay sau khi mở file — rất nhẹ, không phải render)
            // rồi dùng chung cho placeholder của MỌI trang: vì tuyệt đại đa số PDF có các trang cùng
            // kích thước, placeholder sẽ khớp gần như chính xác kích thước thật ngay từ đầu, không còn
            // phải "nhảy" khi trang render xong nữa.
            const [basePageSize, setBasePageSize] = useState(null); // { width, height } ở scale 1

            // --- TRÌNH PHÁT FILE ÂM THANH NỔI (kéo-thả được) — port từ bản Night IELTS Land ---
            // audioSrc là 1 Object URL (URL.createObjectURL) trỏ tới file người dùng vừa chọn từ máy —
            // KHÔNG tải/upload lên đâu cả, hoàn toàn cục bộ trong trình duyệt. Chỉ giữ 1 file tại 1
            // thời điểm (chọn file mới sẽ tự thay thế + thu hồi URL cũ, tránh rò rỉ bộ nhớ).
            const [audioSrc, setAudioSrc] = useState(null);
            const [audioFileName, setAudioFileName] = useState('');
            const handleAudioFileSelect = useCallback((e) => {
                const file = e.target.files && e.target.files[0];
                e.target.value = ''; // cho phép chọn lại ĐÚNG file cũ ở lần sau vẫn kích hoạt onChange
                if (!file) return;
                setAudioSrc(prevUrl => {
                    if (prevUrl) URL.revokeObjectURL(prevUrl);
                    return URL.createObjectURL(file);
                });
                setAudioFileName(file.name.replace(/\.[^/.]+$/, ''));
            }, []);
            const handleCloseAudioPlayer = useCallback(() => {
                setAudioSrc(prevUrl => {
                    if (prevUrl) URL.revokeObjectURL(prevUrl);
                    return null;
                });
                setAudioFileName('');
            }, []);
            
            const [isDrawingMode, setIsDrawingMode] = useState(false);
            const [tool, setTool] = useState('pencil');
            // Mặc định ưu tiên "Hình chữ nhật" (kéo-thả) cho bút Magic — nhanh/tiện hơn cho đa số
            // trường hợp quét chữ; vẫn có thể đổi sang "Tự do" (vẽ tay/khoanh vùng bất kỳ) qua nút
            // chọn kiểu khoanh vùng trên thanh công cụ khi cần.
            const [magicShapeMode, setMagicShapeMode] = useState('rect'); // 'rect' (hình chữ nhật, mặc định) | 'lasso' (tự do)
            // Bút AI: y hệt kiểu chọn vùng của bút Magic (mặc định "Hình chữ nhật" cho nhanh, đổi được
            // sang "Tự do" qua thanh tuỳ chọn phụ khi đang chọn bút AI). Port từ bản Night IELTS Land.
            const [aiShapeMode, setAiShapeMode] = useState('rect'); // 'rect' (mặc định) | 'lasso' (tự do)
            // Chế độ vẽ cho bút chì: 'freehand' (vẽ tay, mặc định — giữ nguyên như trước giờ), 'line'
            // (kéo-thả 1 đường thẳng) hoặc 'rect' (kéo-thả khung hình chữ nhật, dùng chung logic với
            // bút Magic/IPA/tra ảnh — xem redrawStrokes/handlePointerDown/Move trong PdfPage). Port
            // từ bản Night IELTS Land — có thêm phím tắt F/L/S khi đang dùng bút chì (xem useEffect
            // bàn phím bên dưới).
            const [pencilShapeMode, setPencilShapeMode] = useState('freehand');
            const [color, setColor] = useState('#4F46E5');
            const [fontSize, setFontSize] = useState(10); // Mặc định 10
            // Độ dày bút chì: 3 mức, mặc định là mức nhỏ nhất (giữ nguyên độ dày cũ), 2 mức còn lại
            // lớn hơn 1 chút. Gộp cả 3 vào chung 1 nút cho gọn thanh công cụ — bấm nút mới hiện bảng
            // chọn nhỏ (popover) thay vì chiếm sẵn 3 ô liên tục trên thanh.
            const [pencilSize, setPencilSize] = useState(DEFAULT_PENCIL_SIZE);
            // "Độ ổn định nét vẽ" (làm mượt run tay, dùng chung cho bút chì lẫn Bút Present) — port từ
            // bản Night IELTS Land. Mặc định luôn ở mức CAO (PEN_STABILITY_LEVELS[2]) — người mới dùng
            // sẽ thấy nét mượt ngay từ đầu, muốn giữ hành vi vẽ "thô" như cũ thì tự chọn mức Tắt.
            const [penStability, setPenStability] = useState(PEN_STABILITY_LEVELS[2]);
            // Màu viền glow đang chọn cho "Bút Present" — mặc định màu đầu tiên trong PEN_GLOW_COLORS.
            const [penGlowColor, setPenGlowColor] = useState(PEN_GLOW_COLORS[0]);
            // Chế độ tẩy: 'point' (mặc định, giữ NGUYÊN hành vi cũ — tẩy theo bán kính quanh điểm chạm/
            // kéo) hoặc 'rect' (kéo-thả chọn vùng hình chữ nhật rồi tẩy hết nét trong đó, giống cơ chế
            // của bút Magic/IPA/tra ảnh/bút chì hình chữ nhật). Port từ bản Night IELTS Land.
            const [eraserShapeMode, setEraserShapeMode] = useState('point');

            // --- THANH TUỲ CHỌN RIÊNG CHO TỪNG BÚT (ẩn mặc định, bấm ĐÚP vào nút bút để hiện) — port
            // từ bản Night IELTS Land. QUAN TRỌNG: trước đây MỌI tuỳ chọn (cỡ nét, kiểu vẽ, kiểu tẩy,
            // kiểu khoanh vùng...) đều nhét thẳng vào thanh công cụ chính — quá nhiều nút cùng lúc, rất
            // rối mắt. Giờ thanh chính CHỈ còn các nút chọn BÚT + bảng màu; các tuỳ chọn theo từng bút
            // được gom vào 1 thanh nhỏ RIÊNG hiện ngay bên dưới, CHỈ hiện khi bấm đúp (double-click)
            // vào đúng nút của bút đó — bấm đúp lại (hoặc đổi sang bút khác) để ẩn đi.
            // expandedToolOptions: tên bút đang mở thanh tuỳ chọn, hoặc null nếu đang ẩn.
            const [expandedToolOptions, setExpandedToolOptions] = useState(null);
            const toggleToolOptions = useCallback((toolName) => {
                setExpandedToolOptions(prev => prev === toolName ? null : toolName);
            }, []);
            // Đổi sang bút khác (bấm đơn — chọn công cụ) thì tự ẩn thanh tuỳ chọn của bút CŨ đi, vì
            // tuỳ chọn đó không còn áp dụng cho bút đang chọn nữa.
            useEffect(() => { setExpandedToolOptions(null); }, [tool]);

            // QUAN TRỌNG — sửa lỗi "trên iPad bấm 2 lần vào nút bút không hiện thanh tuỳ chọn": sự
            // kiện `onDoubleClick` của React là sự kiện CHUỘT (mouse dblclick) — Safari trên iPad KHÔNG
            // tự tổng hợp sự kiện này từ 2 lần chạm ngón tay/Apple Pencil liên tiếp (dblclick vốn chỉ
            // dành cho chuột thật), nên double-tap trên iPad không bao giờ kích hoạt được onDoubleClick,
            // dù trên Mac (dùng chuột thật) vẫn hoạt động bình thường — đây là lý do bug chỉ xảy ra
            // trên iPad. Sửa bằng cách TỰ phát hiện double-tap dựa trên `onClick` (sự kiện này CÓ xảy
            // ra nhất quán cho cả chuột lẫn chạm ngón tay/bút trên mọi nền tảng): tự đếm thời gian giữa
            // 2 lần bấm liên tiếp VÀO ĐÚNG CÙNG 1 nút bút — nếu cách nhau dưới 400ms thì coi là double-
            // tap và mở thanh tuỳ chọn, còn lại thì chỉ chọn công cụ như bình thường.
            const lastToolTapRef = useRef({ tool: null, time: 0 });
            const handleToolButtonClick = useCallback((toolName) => {
                setTool(toolName);
                const now = Date.now();
                if (lastToolTapRef.current.tool === toolName && now - lastToolTapRef.current.time < 400) {
                    toggleToolOptions(toolName);
                    lastToolTapRef.current = { tool: null, time: 0 }; // reset để tránh bấm 3 lần liên tiếp lại tính thành double-tap lần nữa
                } else {
                    lastToolTapRef.current = { tool: toolName, time: now };
                }
            }, [toggleToolOptions]);

            const [magicText, setMagicText] = useState("");
            const [isOcrProcessing, setIsOcrProcessing] = useState(false);
            const [ipaInfo, setIpaInfo] = useState(null); // { word, pinyin, definition, error, loading }
            const [photoLookup, setPhotoLookup] = useState(null); // { text } — bút tra ảnh minh hoạ

            // --- BÚT AI (Groq) — port từ bản Night IELTS Land, thích nghi cho tiếng Trung ---
            // aiApiKey: đọc 1 lần từ localStorage lúc khởi tạo (lazy init qua callback trong useState,
            // tránh phải đọc localStorage lại mỗi lần App render). Chỉ tồn tại trên đúng máy/trình duyệt
            // này — dùng cả Mac lẫn iPad thì mỗi máy cần nhập riêng 1 lần (xem giải thích ở AI_STORAGE_KEY).
            const [aiApiKey, setAiApiKey] = useState(() => {
                try { return localStorage.getItem(AI_STORAGE_KEY) || ''; } catch (e) { return ''; }
            });
            const [showAiKeyModal, setShowAiKeyModal] = useState(false);
            const [aiApiKeyDraft, setAiApiKeyDraft] = useState(''); // nội dung đang gõ dở trong modal, tách khỏi aiApiKey thật để bấm Huỷ không làm mất key cũ
            const openAiSettings = useCallback(() => {
                setAiApiKeyDraft(aiApiKey);
                setShowAiKeyModal(true);
            }, [aiApiKey]);
            const [aiLookup, setAiLookup] = useState(null); // { text, ocrLoading } — box Bút AI

            // --- TÍNH NĂNG "PHỤ ĐỀ TRỰC TIẾP" (Live Subtitles) ---
            // Bật lên hiện 1 thanh màu đen cố định dưới cùng màn hình. Có 2 "động cơ" nhận diện giọng nói
            // khác nhau, tự chọn theo tình huống:
            //   • 'speech' (MẶC ĐỊNH, ưu tiên dùng): Web Speech API (SpeechRecognition) có sẵn miễn phí
            //     trong Chrome — cho phép hiện chữ ra NGAY TỪNG TỪ một lúc đang nói (kết quả "interim"),
            //     rồi khi hết câu (ngắt hơi) mới "chốt" thành 1 dòng phụ đề hoàn chỉnh và nhảy dòng mới —
            //     đúng đúng cảm giác phụ đề trực tiếp kiểu YouTube/Google Meet. NHƯỢC ĐIỂM: chỉ nhận
            //     được đúng 1 nguồn cố định là mic hệ điều hành, không có cách nào đưa thêm 1 MediaStream
            //     tuỳ ý (vd âm thanh tab) vào được, và Safari/iPad hầu như không hỗ trợ API này.
            //   • 'whisper' (dự phòng, TỰ ĐỘNG chuyển sang khi cần): ghi âm từng đoạn ngắn rồi gửi Groq
            //     Whisper phiên âm (xem GROQ_WHISPER_MODELS) — dùng khi (a) trình duyệt không có Web
            //     Speech API (vd Safari/iPad), hoặc (b) người dùng bấm "Thêm âm thanh laptop" (bắt buộc
            //     phải trộn 2 nguồn mic+tab thành 1 luồng duy nhất qua AudioContext rồi ghi âm, việc mà
            //     Web Speech API không làm được) — phụ đề khi đó hiện theo TỪNG ĐOẠN ngắn (~3 giây) thay
            //     vì từng chữ, đây là đánh đổi kỹ thuật bắt buộc chứ không phải thiếu sót.
            const [subtitleActive, setSubtitleActive] = useState(false);
            const [subtitlePaused, setSubtitlePaused] = useState(false);
            const [subtitleStatus, setSubtitleStatus] = useState('idle'); // 'idle' | 'listening' | 'paused' | 'error'
            const [subtitleError, setSubtitleError] = useState('');
            const [subtitleLines, setSubtitleLines] = useState([]); // vài dòng phụ đề ĐÃ CHỐT gần nhất, dạng [{id,text}]
            // subtitleInterimText: dòng đang "gõ dở" hiện theo thời gian thực (CHỈ có ở động cơ 'speech'
            // — bên 'whisper' luôn rỗng vì mỗi đoạn ghi âm chỉ trả về sau khi đã ghi xong cả đoạn).
            const [subtitleInterimText, setSubtitleInterimText] = useState('');
            const [subtitleHasTabAudio, setSubtitleHasTabAudio] = useState(false);
            // subtitleHasTabAudioRef: bản sao qua ref của state trên — subtitleRecordLoop chỉ có đúng 1
            // dependency ([transcribeAudioBlob]) nên đọc state trực tiếp sẽ bị "đóng băng" giá trị cũ lúc
            // closure tạo ra; đọc ref thì luôn thấy giá trị mới nhất ngay cả trong vòng lặp đệ quy dài.
            const subtitleHasTabAudioRef = useRef(false);
            // Modal cảnh báo 1 lần trước khi thật sự gọi getDisplayMedia lấy âm thanh máy — xem
            // SYSTEM_AUDIO_WARNING_KEY và handleClickAddTabAudio phía dưới.
            const [showSystemAudioWarning, setShowSystemAudioWarning] = useState(false);
            // subtitleSilenceHint: gợi ý nhẹ nhàng (KHÔNG phải lỗi cứng, vẫn giữ trạng thái "Đang nghe")
            // hiện ra khi động cơ 'whisper' đã ghi được vài đoạn LIÊN TIẾP mà đoạn nào cũng gần như im
            // lặng hoàn toàn — thường gặp nhất khi: (1) lỡ chọn "Cửa sổ/Tab" thay vì "Toàn bộ màn hình"
            // nên công tắc "Also share system audio" không có tác dụng, (2) macOS chưa cấp quyền "Screen
            // & System Audio Recording" cho trình duyệt trong System Settings, hoặc (3) âm lượng máy
            // đang tắt/để rất nhỏ. Tự biến mất ngay khi phát hiện có âm thanh thật.
            const [subtitleSilenceHint, setSubtitleSilenceHint] = useState('');
            const subtitleSilentStreakRef = useRef(0);
            // subtitleActiveRef/subtitlePausedRef: dùng SONG SONG với state cùng tên — vòng lặp ghi âm/
            // gửi API và các callback của SpeechRecognition (onend...) chạy bất đồng bộ nên đọc state cũ
            // (đóng gói lúc closure tạo ra) sẽ không thấy được lần setState mới nhất khi người dùng bấm
            // tắt/tạm dừng giữa chừng; đọc ref thì luôn thấy giá trị mới nhất ngay lập tức.
            const subtitleActiveRef = useRef(false);
            const subtitlePausedRef = useRef(false);
            const subtitleEngineRef = useRef('speech'); // 'speech' | 'whisper' — động cơ đang dùng
            const recognitionRef = useRef(null); // SpeechRecognition instance (động cơ 'speech')
            const subtitleMicStreamRef = useRef(null);
            const subtitleAudioCtxRef = useRef(null);
            const subtitleDestRef = useRef(null); // MediaStreamDestination cho MIC (động cơ 'whisper' — chỉ dùng khi Web Speech API không có, vd Safari/iPad)
            const subtitleAnalyserRef = useRef(null); // đo năng lượng âm thanh mic — xem SUBTITLE_SILENCE_RMS
            const subtitleEnergyPeakRef = useRef(0);
            const subtitleEnergyIntervalRef = useRef(null);
            const subtitleRecorderRef = useRef(null);
            // --- Đồ thị/vòng ghi âm RIÊNG cho ÂM THANH MÁY TÍNH (tab audio) ---
            // QUAN TRỌNG: tách hẳn thành 1 pipeline ĐỘC LẬP với mic, KHÔNG còn trộn chung vào 1 luồng như
            // trước nữa. Lý do: hồi trước hễ bấm "Nghe âm thanh máy tính" là ép luôn cả mic phải chuyển
            // từ động cơ 'speech' (hiện từng chữ tức thời) sang 'whisper' (chờ hết cả đoạn ~3 giây mới
            // hiện) — người dùng phản ánh đúng: giọng nói của mình qua mic bị "chậm lại" oan uổng dù chỉ
            // muốn nghe THÊM âm thanh máy. Giờ mic luôn được giữ nguyên ở động cơ nhanh nhất có thể
            // (Web Speech API nếu trình duyệt hỗ trợ), còn âm thanh máy (vốn dĩ không phải giọng nói trực
            // tiếp của người dùng nên độ trễ vài giây không quan trọng bằng) đi qua 1 pipeline Whisper
            // theo đoạn HOÀN TOÀN RIÊNG — 2 nguồn chạy song song, không còn phụ thuộc lẫn nhau nữa.
            const subtitleTabStreamRef = useRef(null);
            const tabAudioCtxRef = useRef(null);
            const tabDestRef = useRef(null);
            const tabAnalyserRef = useRef(null);
            const tabEnergyPeakRef = useRef(0);
            const tabEnergyIntervalRef = useRef(null);
            const tabRecorderRef = useRef(null);

            // Gửi 1 đoạn audio đã ghi cho Groq Whisper phiên âm ra chữ — tự thử lần lượt các model trong
            // GROQ_WHISPER_MODELS nếu model hiện tại báo lỗi (giống hệt cơ chế callGroqAPI cho Bút AI).
            const transcribeAudioBlob = useCallback(async (blob) => {
                if (!aiApiKey) {
                    setSubtitleStatus('error');
                    setSubtitleError('Chưa có API key Groq — bấm vào đây để nhập (dùng chung với Bút AI).');
                    return;
                }
                const ext = blob.type.includes('mp4') ? 'mp4' : (blob.type.includes('ogg') ? 'ogg' : 'webm');
                for (let i = 0; i < GROQ_WHISPER_MODELS.length; i++) {
                    const model = GROQ_WHISPER_MODELS[i];
                    const isLastModel = i === GROQ_WHISPER_MODELS.length - 1;
                    try {
                        const form = new FormData();
                        form.append('file', blob, 'chunk.' + ext);
                        form.append('model', model);
                        form.append('response_format', 'json');
                        form.append('temperature', '0');
                        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + aiApiKey },
                            body: form,
                        });
                        if (res.status === 401) {
                            setSubtitleStatus('error');
                            setSubtitleError('API key Groq không hợp lệ — bấm vào đây để sửa lại.');
                            return;
                        }
                        if (!res.ok) {
                            if (!isLastModel && (res.status === 404 || res.status === 400)) continue; // model này lỗi -> thử model kế tiếp
                            throw new Error('HTTP ' + res.status);
                        }
                        const data = await res.json();
                        const text = ((data && data.text) || '').trim();
                        if (text) {
                            setSubtitleStatus('listening');
                            setSubtitleError('');
                            setSubtitleLines(prev => [...prev, { id: Date.now() + Math.random(), text }].slice(-3));
                        }
                        return;
                    } catch (e) {
                        if (isLastModel) {
                            setSubtitleStatus('error');
                            setSubtitleError('Lỗi kết nối tới Groq — đang tự thử lại...');
                        }
                    }
                }
            }, [aiApiKey]);

            // Vòng lặp ghi âm của động cơ 'whisper': tạo 1 MediaRecorder MỚI cho mỗi đoạn (đơn giản/ổn
            // định hơn nhiều so với dùng timeslice trên 1 recorder duy nhất — mỗi lần start() lại sinh ra
            // 1 file audio ĐẦY ĐỦ header, Whisper đọc được ngay). Đệ quy gọi lại chính nó cho tới khi
            // subtitleActiveRef.current thành false (tắt hẳn) hoặc subtitlePausedRef.current thành true
            // (tạm dừng — xem pauseSubtitles).
            const subtitleRecordLoop = useCallback(async () => {
                if (!subtitleActiveRef.current || subtitlePausedRef.current || !subtitleDestRef.current) return;
                let recorder;
                try {
                    const mimeType = pickSubtitleMimeType();
                    recorder = new MediaRecorder(subtitleDestRef.current.stream, mimeType ? { mimeType } : undefined);
                } catch (e) {
                    setSubtitleStatus('error');
                    setSubtitleError('Trình duyệt này không hỗ trợ ghi âm (MediaRecorder).');
                    return;
                }
                subtitleRecorderRef.current = recorder;
                subtitleEnergyPeakRef.current = 0;
                const chunks = [];
                recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                const stopped = new Promise(resolve => { recorder.onstop = resolve; });
                recorder.start();
                await new Promise(r => setTimeout(r, SUBTITLE_CHUNK_MS));
                if (recorder.state !== 'inactive') recorder.stop();
                await stopped;
                if (!subtitleActiveRef.current || subtitlePausedRef.current) return; // đã tắt/tạm dừng trong lúc đang ghi đoạn này
                const peak = subtitleEnergyPeakRef.current;
                if (peak >= SUBTITLE_SILENCE_RMS && chunks.length > 0) {
                    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                    transcribeAudioBlob(blob); // KHÔNG await — chạy song song, không làm chậm vòng ghi âm kế tiếp
                }
                // Im lặng (hoặc không ghi được chunk nào): bình thường, không cần cảnh báo gì — mic chỉ
                // đơn giản là chưa ai nói. Xem tabRecordLoop bên dưới cho phần cảnh báo dành riêng cho
                // pipeline âm thanh máy tính (ở đó im lặng kéo dài mới đáng ngờ, vì đang phát nội dung).
                subtitleRecordLoop();
            }, [transcribeAudioBlob]);

            // Vòng lặp ghi âm RIÊNG cho pipeline âm thanh máy tính (tab audio) — y hệt cơ chế của
            // subtitleRecordLoop ở trên nhưng đọc/ghi vào các ref tab*/subtitleHasTabAudioRef thay vì
            // mic, và chạy HOÀN TOÀN SONG SONG với subtitleRecordLoop hoặc SpeechRecognition của mic (xem
            // giải thích đầy đủ ở cụm khai báo ref tabAudioCtxRef/tabDestRef/... phía trên).
            const tabRecordLoop = useCallback(async () => {
                if (!subtitleActiveRef.current || subtitlePausedRef.current || !subtitleHasTabAudioRef.current || !tabDestRef.current) return;
                let recorder;
                try {
                    const mimeType = pickSubtitleMimeType();
                    recorder = new MediaRecorder(tabDestRef.current.stream, mimeType ? { mimeType } : undefined);
                } catch (e) {
                    return; // âm thanh máy chỉ là tính năng phụ — lỗi ở đây không cần chặn cả phụ đề mic chính
                }
                tabRecorderRef.current = recorder;
                tabEnergyPeakRef.current = 0;
                const chunks = [];
                recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                const stopped = new Promise(resolve => { recorder.onstop = resolve; });
                recorder.start();
                await new Promise(r => setTimeout(r, SUBTITLE_CHUNK_MS));
                if (recorder.state !== 'inactive') recorder.stop();
                await stopped;
                if (!subtitleActiveRef.current || subtitlePausedRef.current || !subtitleHasTabAudioRef.current) return;
                const peak = tabEnergyPeakRef.current;
                if (peak >= SUBTITLE_SILENCE_RMS && chunks.length > 0) {
                    subtitleSilentStreakRef.current = 0;
                    setSubtitleSilenceHint('');
                    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
                    transcribeAudioBlob(blob);
                } else {
                    // Im lặng liên tục vài đoạn khi ĐANG chia sẻ âm thanh máy mới đáng ngờ (khác mic —
                    // nội dung đang phát ra máy thường không im lặng lâu như vậy).
                    subtitleSilentStreakRef.current += 1;
                    if (subtitleSilentStreakRef.current >= 4) {
                        setSubtitleSilenceHint('Chưa phát hiện âm thanh máy tính — kiểm tra lại: đã chọn "Toàn bộ màn hình" + bật "Also share system audio" chưa, và âm lượng máy có đang tắt tiếng không?');
                    }
                }
                tabRecordLoop();
            }, [transcribeAudioBlob]);

            // Dọn dẹp toàn bộ pipeline âm thanh máy tính (dùng cả khi người dùng bấm "Dừng chia sẻ" trên
            // thanh riêng của trình duyệt, lẫn khi bấm Tắt hẳn phụ đề — xem stopSubtitles).
            const stopTabAudioPipeline = useCallback(() => {
                subtitleHasTabAudioRef.current = false;
                setSubtitleHasTabAudio(false);
                if (tabEnergyIntervalRef.current) { clearInterval(tabEnergyIntervalRef.current); tabEnergyIntervalRef.current = null; }
                if (tabRecorderRef.current && tabRecorderRef.current.state !== 'inactive') {
                    try { tabRecorderRef.current.stop(); } catch (e) {}
                }
                tabRecorderRef.current = null;
                if (subtitleTabStreamRef.current) { subtitleTabStreamRef.current.getTracks().forEach(t => t.stop()); subtitleTabStreamRef.current = null; }
                if (tabAudioCtxRef.current) { try { tabAudioCtxRef.current.close(); } catch (e) {} tabAudioCtxRef.current = null; }
                tabDestRef.current = null;
                tabAnalyserRef.current = null;
            }, []);

            // Dựng "đồ thị âm thanh" cho động cơ 'whisper': mic -> (destination TRỘN chung + analyser đo
            // năng lượng). Tách riêng thành hàm dùng chung vì cần gọi lại y hệt ở 2 chỗ: lúc khởi động
            // động cơ whisper từ đầu (không có Web Speech API), và lúc đang dùng động cơ 'speech' mà bấm
            // "Thêm âm thanh laptop" (buộc phải chuyển hẳn sang whisper để trộn được thêm nguồn tab).
            const setupWhisperAudioGraph = useCallback((micStream) => {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioCtx();
                // QUAN TRỌNG — sửa lỗi "share âm thanh xong nhưng phụ đề không bao giờ hiện": AudioContext
                // MỚI tạo ra có thể ở trạng thái "suspended" (Chrome tự tạm ngưng xử lý audio graph nếu
                // không chắc chắn đây là do 1 thao tác bấm chuột/chạm trực tiếp của người dùng — ở đây đã
                // đi qua vài bước await getDisplayMedia/getUserMedia nên có thể rơi vào đúng trường hợp
                // này) — nếu context bị suspended thì MediaStreamDestination vẫn tạo ra 1 MediaStream hợp
                // lệ nhưng chỉ toàn im lặng (0), MediaRecorder ghi âm không lỗi gì cả nhưng Whisper mãi
                // mãi nhận về audio câm, ngưỡng SUBTITLE_SILENCE_RMS không bao giờ vượt qua được -> không
                // request nào được gửi đi, phụ đề đứng im vĩnh viễn dù người dùng nói/phát nhạc rõ ràng.
                // Gọi resume() ngay để chắc chắn context luôn ở trạng thái "running".
                if (audioCtx.state === 'suspended') { audioCtx.resume().catch(() => {}); }
                const destination = audioCtx.createMediaStreamDestination();
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                const micSource = audioCtx.createMediaStreamSource(micStream);
                micSource.connect(destination);
                micSource.connect(analyser);
                subtitleMicStreamRef.current = micStream;
                subtitleAudioCtxRef.current = audioCtx;
                subtitleDestRef.current = destination;
                subtitleAnalyserRef.current = analyser;
                subtitleEnergyIntervalRef.current = setInterval(() => {
                    const a = subtitleAnalyserRef.current;
                    if (!a) return;
                    const data = new Uint8Array(a.fftSize);
                    a.getByteTimeDomainData(data);
                    let sumSquares = 0;
                    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sumSquares += v * v; }
                    const rms = Math.sqrt(sumSquares / data.length);
                    if (rms > subtitleEnergyPeakRef.current) subtitleEnergyPeakRef.current = rms;
                }, 80);
            }, []);

            const startWhisperEngine = useCallback(async () => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    setSubtitleStatus('error');
                    setSubtitleError('Trình duyệt/kết nối hiện tại không hỗ trợ dùng micro (thử mở trang qua https hoặc localhost).');
