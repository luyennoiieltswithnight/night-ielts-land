    <!-- pinyin-pro (chuyển chữ Hán -> pinyin có dấu thanh điệu, chạy hoàn toàn phía client, không cần
         gọi API/mạng) — dùng cho bút Pinyin, xem fetchIPAInfo. Mount ra biến toàn cục window.pinyinPro. -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.2/dist/index.js"></script>

    <style>
        html, body {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, sans-serif;
            background-color: #F1F5F9;
            overflow: hidden;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            /* Bỏ hiệu ứng chớp xám khi chạm trên iPad/Safari + tránh double-tap-zoom trễ 300ms */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        * { font-family: inherit; }

        /* Vùng nội dung PDF/dịch vẫn cho phép bôi đen & copy chữ bình thường */
        .pdf-page-container, .pdf-page-container *,
        .glass-panel, .glass-panel * {
            -webkit-touch-callout: default;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #A7F3D0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6EE7B7; }

        button, [role="button"], input[type="file"] + label, label.cursor-pointer {
            touch-action: manipulation;
        }
        button:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid #34D399;
            outline-offset: 2px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.15), 0 8px 15px -6px rgba(0, 0, 0, 0.1);
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin: 10px auto 30px auto;
            background: white;
            border-radius: 12px;
            /* Không dùng will-change:transform cố định trên mọi trang: với PDF dài,
               mỗi trang sẽ chiếm 1 lớp GPU riêng vĩnh viễn dù đang cuộn xa khỏi màn hình,
               gây ngốn bộ nhớ và là nguyên nhân chính khiến iPad bị đơ/đứng hình sau một lúc dùng. */
            contain: layout style;
            /* GHI CHÚ: từng thử tắt hẳn "scroll anchoring" (overflow-anchor: none) ở đây, nhưng thực
               tế lại làm cuộn TỆ HƠN — bị nhảy ở CẢ 2 HƯỚNG thay vì chỉ 1 hướng như trước. Điều đó cho
               thấy cơ chế anchoring mặc định của trình duyệt vốn đang ÂM THẦM bù lại 1 sự thay đổi nội
               dung/kích thước thật nào đó phía trên vị trí đang xem — tắt nó đi chỉ làm lộ rõ hẳn cú
               nhảy ra thay vì sửa được gốc. Đã revert lại về mặc định (auto) — xem PdfPage để biết
               cách sửa TẬN GỐC (không còn thay đổi cấu trúc DOM khi cuộn nữa) thay vì tắt anchoring. */
        }

        /* width/height 100%: canvas LUÔN lấp đầy đúng khung .pdf-page-container (nay có kích thước
           CỐ ĐỊNH ngay từ đầu — xem basePageSize trong component App) bất kể độ phân giải pixel thật
           bên trong canvas là bao nhiêu — tránh trường hợp hiếm 1 trang có kích thước khác các trang
           còn lại làm canvas tràn ra ngoài khung. getCoordinates() trong PdfPage đã tự quy đổi toạ độ
           theo tỉ lệ canvas.width/rect.width nên toạ độ vẽ vẫn chính xác dù canvas co giãn theo CSS. */
        .pdf-canvas { display: block; border-radius: 12px; width: 100%; height: 100%; }

        .draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* GIỮ "auto" cố định — KHÔNG đổi thành "none" theo isDrawingMode. Đã thử "none" nhưng
               touch-action là thuộc tính CSS thuần, không phân biệt được ngón tay hay Apple Pencil,
               nên chặn cứng luôn cả việc cuộn trang bằng ngón tay (dùng "none" làm hỏng tính năng
               "ngón tay để cuộn, bút để viết, tỳ tay không bị nhận nhầm nét vẽ"). Việc chặn Safari tự
               cuộn/zoom riêng khi CHỈ có Apple Pencil chạm (không chặn khi là ngón tay) phải xử lý
               bằng JS phân biệt theo touchType — xem preventTouchScroll trong component PdfPage.
            */
            touch-action: auto;
            z-index: 10;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px) scale(0.98); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        /* QUAN TRỌNG — .animate-slide-down bên dưới CỐ TÌNH bake sẵn translateX(-50%) vào animation,
           vì trước đây class này chỉ dùng cho các khung ĐANG tự canh giữa bằng `left-1/2
           transform -translate-x-1/2` — animation sẽ THAY THẾ hẳn giá trị transform tĩnh đó (không
           cộng dồn), nên phải tự bake lại -50% vào trong keyframe để không mất canh giữa lúc chạy
           animation. Hệ quả: nếu lỡ gắn class này cho 1 khung KHÔNG tự canh giữa kiểu đó (vd nằm
           trong flex-col bình thường), nó sẽ bị lệch trái oan uổng đúng 50% bề rộng của chính nó. */
        .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Bản KHÔNG bake sẵn dịch ngang — dùng cho khung chỉ cần hiệu ứng trượt xuống dọc, không tự
           canh giữa bằng left-1/2/-translate-x-1/2 (vd nằm trong 1 flex-col cha lo canh giữa sẵn). */
        @keyframes slideDownY {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide-down-y { animation: slideDownY 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-modal-pop { animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-gentle-bounce { animation: gentleBounce 1.6s ease-in-out infinite; }
    </style>
</head>
<body>
    <!-- GHI CHÚ: trước đây có 1 đoạn script khoá pinch-zoom/double-tap-zoom LUÔN LUÔN bật sẵn
         ở đây. Vì cơ chế tự động đó "chưa hoạt động hiệu quả lắm" trong thực tế sử dụng, giờ được
         thay bằng nút "Khoá zoom" điều khiển được (component App bên dưới, ngay cạnh chữ
         "TÀI LIỆU TIẾNG TRUNG") — bấm để bật/tắt khoá theo ý muốn thay vì luôn bật cứng. -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useImperativeHandle } = React;

        // --- BỘ GIỚI HẠN SỐ LƯỢT RENDER PDF.JS CHẠY ĐỒNG THỜI ---
        // QUAN TRỌNG — sửa lỗi "mở mục lục tải lâu, lag khi hiện thị/lướt": page.render() của
        // pdf.js khá nặng CPU (giải mã + rasterize nội dung trang). Trước đây MỌI trang/thumbnail
        // lọt vào vùng nhìn thấy (IntersectionObserver) đều gọi render() NGAY LẬP TỨC — khi mở mục
        // lục, hàng chục ảnh thu nhỏ cùng lọt vào vùng nhìn thấy 1 lúc (do lưới nhiều cột), khiến
        // hàng chục lệnh render() dồn vào luồng chính CÙNG MỘT LÚC, đủ để làm nghẽn hẳn khi mở modal
        // lẫn khi cuộn. Giờ MỌI lệnh render() (cả trang chính lẫn thumbnail) đều đi qua hàng đợi
        // dùng chung này — chỉ tối đa vài lệnh chạy thật sự cùng lúc, còn lại xếp hàng chờ tới lượt,
        // giữ nguyên hành vi hiển thị (không mất trang nào) nhưng luồng chính không bị dồn ứ nữa.
        const MAX_CONCURRENT_PDF_RENDERS = 3;
        let _activePdfRenders = 0;
        const _pdfRenderQueue = [];
        const scheduleRender = (renderFn) => {
            let cancelled = false;
            let realTask = null;
            let resolveOuter, rejectOuter;
            const outerPromise = new Promise((res, rej) => { resolveOuter = res; rejectOuter = rej; });

            const freeSlotAndAdvance = () => {
                _activePdfRenders--;
                const next = _pdfRenderQueue.shift();
                if (next) next();
            };

            const start = () => {
                if (cancelled) { resolveOuter(); return; } // bị huỷ trước khi tới lượt — bỏ qua êm
                _activePdfRenders++;
                try {
                    realTask = renderFn();
                } catch (err) {
                    freeSlotAndAdvance();
                    rejectOuter(err);
                    return;
                }
                realTask.promise.then(
                    (v) => { freeSlotAndAdvance(); resolveOuter(v); },
                    (e) => { freeSlotAndAdvance(); rejectOuter(e); }
                );
            };

            if (_activePdfRenders < MAX_CONCURRENT_PDF_RENDERS) {
                start();
            } else {
                _pdfRenderQueue.push(start);
            }

            // Trả về 1 "renderTask" giả có cùng giao diện (.promise / .cancel()) như renderTask
            // thật của pdf.js, để mọi nơi đang gọi renderTask.cancel()/renderTask.promise.then(...)
            // không cần đổi gì thêm.
            return {
                promise: outerPromise,
                cancel: () => {
                    cancelled = true;
                    if (realTask) { try { realTask.cancel(); } catch (err) {} }
                }
            };
        };

        // --- GLOBAL AUDIO UNLOCKER FOR IPAD ---
        // QUAN TRỌNG: trước đây hàm này tạo MỘT AudioContext THẬT MỚI mỗi lần được gọi
        // (mỗi lần bấm "Bật Note"/"Đóng Note") và không bao giờ đóng lại. Trên Safari/iPadOS,
        // AudioContext không đóng sẽ tích tụ dần và là nguyên nhân chính khiến trang bị
        // "đứng hình" sau một lúc sử dụng (phải bấm ra ngoài app mới hồi lại được).
        // Sửa lại thành 1 AudioContext DÙNG CHUNG (singleton), chỉ tạo 1 lần duy nhất.
        // Hàm này PHẢI được gọi trực tiếp bên trong 1 thao tác chạm/bấm thật của người dùng
        // (không phải trong callback bất đồng bộ) — đó là điều kiện Safari yêu cầu để "mở khoá"
        // phát audio, kể cả cho các lần phát bằng JS sau đó (giọng đọc Online).
        //
        // SỬA TIẾP LỖI "viết khoảng 9 nét là bị đứng màn hình iPad, phải bấm ra ngoài web mới viết
        // tiếp được": nguyên nhân thật sự là hàm này trước đây được gọi lại ở MỖI LẦN đặt bút xuống
        // — tức MỖI NÉT VẼ, kể cả bút chì/bút bi không hề liên quan gì đến âm thanh — và MỖI LẦN gọi
        // đều tạo mới 1 oscillator + phát 1 SpeechSynthesisUtterance (window.speechSynthesis.speak)
        // + play()/pause() lại thẻ <audio>. Cơ chế đọc-giọng-nói (speechSynthesis) trên Safari/iPadOS
        // có lỗi đã biết: gọi .speak() dồn dập nhiều lần trong thời gian ngắn có thể làm "kẹt" tiến
        // trình xử lý âm thanh nội bộ của WebKit, khiến TOÀN BỘ trang bị đứng hình — chỉ hồi phục khi
        // trang mất rồi lấy lại focus, đúng y hệt hiện tượng "bấm ra ngoài web mới hết đứng" mà người
        // dùng gặp phải. Vì việc "mở khoá" phát âm thanh trên Safari chỉ cần làm ĐÚNG 1 LẦN DUY NHẤT
        // trong cả phiên sử dụng (một khi đã mở khoá thành công, các lần phát bằng JS sau đó — kể cả
        // không nằm trong cử chỉ chạm — vẫn hoạt động bình thường, không bị mất khoá), nên thêm cờ
        // "_audioUnlocked" để đảm bảo phần xử lý audio/speech nặng bên dưới CHỈ THỰC SỰ CHẠY 1 LẦN
        // DUY NHẤT cho cả phiên — gọi lại unlockAudio() bao nhiêu lần sau đó (mỗi nét vẽ, mỗi lần bấm
        // Bật Note...) cũng chỉ là 1 lệnh kiểm tra cờ gần như miễn phí, không tạo thêm audio node hay
        // utterance mới nữa.
        let _audioUnlocked = false;
        let _sharedAudioCtx = null;
        const unlockAudio = () => {
            if (_audioUnlocked) return;
            _audioUnlocked = true;
            try {
                if (!_sharedAudioCtx) {
                    const Ctor = window.AudioContext || window.webkitAudioContext;
                    if (Ctor) _sharedAudioCtx = new Ctor();
                }
                if (_sharedAudioCtx && _sharedAudioCtx.state === 'suspended') {
                    _sharedAudioCtx.resume();
                }
                if (_sharedAudioCtx) {
                    const osc = _sharedAudioCtx.createOscillator();
                    const gain = _sharedAudioCtx.createGain();
                    gain.gain.value = 0; // câm lặng — chỉ dùng để "mở khóa" audio, không phát âm thanh thật
                    osc.connect(gain).connect(_sharedAudioCtx.destination);
                    osc.start(0);
                    osc.stop(_sharedAudioCtx.currentTime + 0.05);
                }
            } catch (err) { /* một số trình duyệt chặn — bỏ qua an toàn */ }

            if (window.speechSynthesis) {
                try {
                    const utter = new SpeechSynthesisUtterance(' ');
                    utter.volume = 0;
                    window.speechSynthesis.speak(utter);
                } catch (err) {}
            }
        };

        // GHI CHÚ: trước đây ở đây có thêm 1 chế độ giọng đọc "Online" (phát qua dịch vụ Google
        // Translate TTS) dành riêng cho iPad vì tưởng giọng máy mặc định của Safari nghe "robot"
        // hơn. Trên thực tế dùng, giọng Online trên iPad nghe không khác gì giọng máy bình thường,
        // nên đã BỎ HẲN chế độ Online để gọn hơn — giờ chỉ còn đúng 1 nguồn giọng đọc duy nhất:
        // giọng có sẵn trên máy (window.speechSynthesis), chọn được qua ô dropdown trong box dịch.

        // --- BOX PHIÊN ÂM (PINYIN) — hiện bên trái box dịch khi dùng bút Pinyin ---
        const IPAPanel = React.memo(function IPAPanel({ info, onClose }) {
            if (!info) return null;
            // pinyin (bính âm, lấy từ thư viện pinyin-pro chạy phía client) thay cho "phonetic" kiểu
            // IPA của tiếng Anh; definition (nghĩa tiếng Việt ngắn gọn từ Google Dịch) hiển thị thêm
            // cho tiện tham khảo.
            const { word, pinyin, definition, error, loading } = info;

            return (
                <div className="w-[260px] shrink-0 glass-panel rounded-2xl shadow-2xl border-2 border-sky-100 overflow-hidden flex flex-col animate-slide-down-y">
                    <div className="bg-sky-50 px-3 py-2 flex items-center justify-between border-b border-sky-100">
                        <span className="text-xs font-extrabold text-sky-600 tracking-wide flex items-center gap-1.5">
                            <i className="fas fa-spell-check"></i> PINYIN
                        </span>
                        <button onClick={onClose} className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors">
                            <i className="fas fa-times text-[10px]"></i>
                        </button>
                    </div>
                    <div className="p-4 bg-white flex-1 space-y-3">
                        {loading ? (
                            <div className="flex items-center justify-center gap-2 text-sky-500 py-4">
                                <i className="fas fa-circle-notch fa-spin"></i>
                                <span className="text-xs font-semibold">Đang tra từ điển…</span>
                            </div>
                        ) : error ? (
                            <p className="text-xs text-amber-600 font-semibold leading-relaxed">{error}</p>
                        ) : (
                            <div className="space-y-2">
                                <p className="text-lg font-extrabold text-slate-800 tracking-tight">{word}</p>
                                {pinyin && <p className="text-sky-600 font-semibold text-sm">{pinyin}</p>}
                                {definition && (
                                    <p className="text-xs text-slate-600 leading-relaxed max-h-28 overflow-y-auto pr-1">{definition}</p>
                                )}
                            </div>
                        )}

                        {/* Nút mở Hanzii (từ điển Trung-Việt, chủ yếu index chữ giản thể) — nút bấm thật
                            này LUÔN chắc chắn không bị trình duyệt chặn popup, dù cửa sổ tự mở lúc
                            kéo-thả có bị chặn hay không. Pinyin hiện sẵn ở trên lấy từ pinyin-pro (chạy
                            offline, không cần mạng); nghĩa tiếng Việt lấy từ Google Dịch — nút này chỉ
                            là link "xem đầy đủ hơn" sang Hanzii theo yêu cầu, để xem thêm ví dụ câu. */}
                        {!loading && word && (
                            <button
                                onClick={() => window.open('https://hanzii.net/search/word/' + encodeURIComponent(word) + '?hl=vi', '_blank')}
                                className="w-full px-3 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shadow-sm shadow-sky-200"
                            >
                                <i className="fas fa-up-right-from-square"></i> Mở Hanzii
                            </button>
                        )}
                    </div>
                </div>
            );
        });

        // --- GIỌNG ĐỌC ĐƯỢC CHỌN: LƯU VĨNH VIỄN BẰNG localStorage ---
        // Trước đây selectedVoiceURI chỉ là state nội bộ của MagicTranslationBar — mỗi lần đóng hộp
        // dịch (bấm X, hoặc mở lượt quét chữ MỚI) component này bị UNMOUNT hẳn (xem điều kiện
        // "magicText || isOcrProcessing" ở App, bọc ngoài MagicTranslationBar), nên lần sau là 1 lượt
        // mount MỚI TOANH — state selectedVoiceURI mất sạch, bị tính lại từ đầu theo giọng ưu tiên mặc
        // định. Đây chính là lỗi "chọn giọng xong, bấm dịch lại (quét chữ mới) là bị reset về giọng
        // khác" — sửa bằng cách lưu lựa chọn vào localStorage (tồn tại độc lập với vòng đời component,
        // sống sót qua cả việc đóng hẳn tab/tải lại trang — đúng nghĩa "vĩnh viễn") thay vì chỉ giữ
        // trong useState của riêng 1 lần mount.
        const VOICE_STORAGE_KEY = 'nightChineseLand_selectedVoiceURI';
        const getSavedVoiceURI = () => {
            try { return localStorage.getItem(VOICE_STORAGE_KEY) || ''; } catch (err) { return ''; }
        };
        const saveVoiceURI = (uri) => {
            try { localStorage.setItem(VOICE_STORAGE_KEY, uri); } catch (err) { /* Safari riêng tư có thể chặn — bỏ qua an toàn */ }
        };

        // --- THANH DỊCH THUẬT NỔI ---
        const MagicTranslationBar = ({ text, isProcessing, onClose }) => {
            const [translation, setTranslation] = useState("");
            const [voices, setVoices] = useState([]);
            const [selectedVoiceURI, setSelectedVoiceURI] = useState("");

            const [isMuted, setIsMuted] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);

            const [copiedEn, setCopiedEn] = useState(false);
            const [copiedVi, setCopiedVi] = useState(false);

            const isMutedRef = useRef(isMuted);
            useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);

            // "Thế hệ" của lượt đọc hiện tại — mỗi lần speak() được gọi sẽ tăng số này lên. Mọi
            // callback bất đồng bộ (onstart/onend/onerror của utterance) đều tự kiểm tra xem mình
            // còn đúng là lượt đọc mới nhất hay không trước khi làm bất cứ điều gì, để 1 lượt đọc cũ
            // không bao giờ chen ngang/đọc chồng lên lượt đọc mới.
            const speakGenRef = useRef(0);

            useEffect(() => {
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    // 'zh' bắt cả zh-CN (Trung Quốc đại lục), zh-TW (Đài Loan) lẫn zh-HK (Hồng Kông) —
                    // vẫn giữ tất cả trong danh sách để người dùng tự chọn giọng ưng ý (ví dụ máy có thể
                    // chỉ có giọng zh-TW cài sẵn), nhưng ưu tiên chọn mặc định là giọng Trung Quốc đại lục
                    // (zh-CN) vì nội dung học là tiếng Trung GIẢN THỂ.
                    const zhVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith('zh'));
                    setVoices(zhVoices);

                    // Ưu tiên SỐ 1: giọng người dùng đã tự tay chọn ở lần trước (lưu vĩnh viễn), miễn là
                    // máy hiện tại vẫn có giọng đó — chỉ khi chưa từng chọn (lần đầu mở app) hoặc giọng
                    // đã lưu không còn tồn tại nữa thì mới rơi xuống các mức ưu tiên mặc định bên dưới.
                    const savedURI = getSavedVoiceURI();
                    const savedVoice = savedURI && zhVoices.find(v => v.voiceURI === savedURI);
                    const preferred = savedVoice
                        || zhVoices.find(v => v.lang.toLowerCase() === 'zh-cn')
                        || zhVoices.find(v => v.name.includes('Google') && v.lang.toLowerCase() === 'zh-cn')
                        || zhVoices.find(v => v.lang.toLowerCase().includes('cn'))
                        || zhVoices[0];
                    if (preferred) setSelectedVoiceURI(preferred.voiceURI);
                };
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }, []);

            const stopAllAudio = useCallback(() => {
                speakGenRef.current++; // vô hiệu hoá mọi callback của các lượt đọc trước đó
                window.speechSynthesis.cancel();
                setIsSpeaking(false);
            }, []);

            const speak = useCallback((content) => {
                if (!content || isMutedRef.current) return;
                stopAllAudio();
                const myGen = ++speakGenRef.current; // đánh dấu đây là lượt đọc mới nhất

                const utterance = new SpeechSynthesisUtterance(content);
                const voice = voices.find(v => v.voiceURI === selectedVoiceURI);
                if (voice) utterance.voice = voice;
                utterance.onstart = () => { if (speakGenRef.current === myGen) setIsSpeaking(true); };
                utterance.onend = () => { if (speakGenRef.current === myGen) setIsSpeaking(false); };
                utterance.onerror = () => { if (speakGenRef.current === myGen) setIsSpeaking(false); };
                window.speechSynthesis.speak(utterance);
            }, [voices, selectedVoiceURI, stopAllAudio]);

            useEffect(() => {
                if (isProcessing || !text) return;

                if (text === "Không tìm thấy chữ trong vùng chọn." || text === "Lỗi nhận diện chữ.") {
                    setTranslation("");
                    return;
                }

                setTranslation("Đang dịch...");
                speak(text);

                // sl=zh-CN: nguồn là tiếng Trung GIẢN THỂ (Trung Quốc đại lục) thay vì tiếng Anh — Google
                // Translate vẫn nhận diện đúng chữ phồn thể lẫn trong đó (nếu OCR lỡ nhận nhầm) nên không
                // cần đổi thêm gì khác; đích dịch vẫn là tiếng Việt (tl=vi) như bản gốc.
                const cleanText = text.replace(/\s+/g, ' ').trim();
                const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=" + encodeURIComponent(cleanText);

                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        if(data && data[0]) {
                            let fullTranslation = "";
                            data[0].forEach(chunk => { if (chunk[0]) fullTranslation += chunk[0]; });
                            setTranslation(fullTranslation);
                        } else {
                            setTranslation("Không thể dịch nội dung này.");
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        setTranslation("Lỗi kết nối từ điển.");
                    });

                return () => stopAllAudio();
                // eslint-disable-next-line
            }, [text, isProcessing]);

            const handleCopy = (content, type) => {
                navigator.clipboard.writeText(content);
                if (type === 'en') { setCopiedEn(true); setTimeout(() => setCopiedEn(false), 2000); }
                else { setCopiedVi(true); setTimeout(() => setCopiedVi(false), 2000); }
            };

            const handleClose = () => { stopAllAudio(); onClose(); };
            const toggleMute = () => {
                setIsMuted(m => {
                    const next = !m;
                    if (next) stopAllAudio(); // Mute -> im lặng ngay lập tức
                    return next;
                });
            };

            if (!text && !isProcessing) return null;

            // GHI CHÚ: bỏ hẳn `fixed top-24 left-1/2 -translate-x-1/2 z-[100]` từng có sẵn ở đây —
            // giờ việc định vị (canh giữa màn hình, cách đỉnh bao nhiêu) do khung bọc ngoài ở App lo,
            // để box IPA có thể xếp chung 1 cột ngay bên dưới box này (xem App, nơi gọi component).
            // Cũng bỏ animate-slide-down ở đây (chuyển lên khung bọc ngoài) — class đó bake sẵn
            // translateX(-50%) vào animation, gắn nhầm ở đây (khung này không còn tự canh giữa nữa,
            // chỉ w-full theo khung cha) sẽ làm nó bị lệch trái 50% bề rộng của chính nó.
            return (
                <div className="w-full glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl border-2 border-emerald-100">
                    <div className="bg-slate-100/80 px-4 py-2 border-b border-slate-200 shrink-0">
                        <div className="flex items-center justify-between gap-2 relative">
                        <div className="flex items-center gap-2 flex-wrap">
                            {/* Chọn giọng đọc có sẵn trên máy — đã bỏ chế độ "Online" vì trên iPad nghe
                                không khác gì giọng máy, giữ lại 1 nguồn giọng đọc duy nhất cho gọn. */}
                            <select
                                className="text-xs bg-white border border-slate-300 rounded-md px-2 py-1.5 outline-none text-slate-700 max-w-[170px] truncate shadow-sm font-semibold cursor-pointer"
                                value={selectedVoiceURI}
                                onChange={(e) => { setSelectedVoiceURI(e.target.value); saveVoiceURI(e.target.value); }}
                                title="Chọn giọng đọc (tự động nhớ vĩnh viễn cho các lần sau)"
                            >
                                {voices.map(v => <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>)}
                            </select>

                            {!isProcessing && (
                                <button onClick={() => speak(text)} disabled={isMuted} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm " + (isMuted ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600')} title="Phát âm lại">
                                    <i className={"fas text-xs " + (isSpeaking ? 'fa-volume-high' : 'fa-volume-up')}></i>
                                </button>
                            )}

                            {/* NÚT MUTE — tắt tiếng bất cứ lúc nào cần */}
                            <button onClick={toggleMute} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm border " + (isMuted ? 'bg-red-50 text-red-500 border-red-200 hover:bg-red-100' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100')} title={isMuted ? 'Đang tắt tiếng — bấm để bật lại' : 'Tắt tiếng'}>
                                <i className={"fas text-xs " + (isMuted ? 'fa-volume-xmark' : 'fa-volume-mute')}></i>
                            </button>
                        </div>

                        <button onClick={handleClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-all absolute right-2 top-1/2 transform -translate-y-1/2 bg-white border border-slate-200 hover:border-red-500 shadow-sm">
                            <i className="fas fa-times text-md"></i>
                        </button>
                        </div>
                    </div>

                    <div className="p-6 relative bg-white flex-1">
                        {isProcessing ? (
                            <div className="flex items-center justify-center gap-4 text-emerald-600 py-6">
                                <i className="fas fa-circle-notch fa-spin text-4xl"></i>
                                <span className="font-bold text-xl">AI đang quét & nhận diện chữ (OCR)...</span>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="relative pr-16 group">
                                    <p className="font-bold text-slate-800 text-[18px] leading-relaxed tracking-wide">{text}</p>
                                    <button 
                                        onClick={() => handleCopy(text, 'en')} 
                                        className="absolute top-1/2 transform -translate-y-1/2 right-0 w-11 h-11 flex items-center justify-center rounded-xl text-emerald-600 bg-emerald-50 hover:bg-emerald-600 hover:text-white transition-colors border border-emerald-100 shadow-sm" 
                                    >
                                        <i className={copiedEn ? "fas fa-check text-green-500 text-xl" : "fas fa-copy text-xl"}></i>
                                    </button>
                                </div>
                                
                                <div className="w-full h-px bg-slate-100"></div>
                                
                                {translation && translation !== "Đang dịch..." && (
                                    <div className="relative pr-16 group">
                                        <p className="font-semibold text-emerald-700 text-[17px] leading-relaxed tracking-wide flex items-start">
                                            <i className="fas fa-language mt-1 mr-3 opacity-80 text-xl"></i>
                                            <span>{translation}</span>
                                        </p>
                                        <button 
                                            onClick={() => handleCopy(translation, 'vi')} 
                                            className="absolute top-1/2 transform -translate-y-1/2 right-0 w-11 h-11 flex items-center justify-center rounded-xl text-emerald-600 bg-emerald-50 hover:bg-emerald-600 hover:text-white transition-colors border border-emerald-100 shadow-sm" 
                                        >
                                            <i className={copiedVi ? "fas fa-check text-white text-xl" : "fas fa-copy text-xl"}></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENT TEXT BOX THÔNG MINH CÓ 3 NÚM RESIZE ---
        const PdfTextBox = React.memo(function PdfTextBox({ t, scale, updateText, removeText }) {
            const [active, setActive] = useState(true);
            const containerRef = useRef(null);
            const textareaRef = useRef(null);

            // Focus tự động khi tạo mới
            useEffect(() => {
                if (active && textareaRef.current) {
                    textareaRef.current.focus();
                }
            }, [active]);

            // Bấm ra ngoài -> Ẩn box viền (tàng hình)
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (containerRef.current && !containerRef.current.contains(e.target)) {
                        setActive(false);
                    }
                };
                document.addEventListener('pointerdown', handleClickOutside);
                return () => document.removeEventListener('pointerdown', handleClickOutside);
            }, []);

            // THUẬT TOÁN KÉO DI CHUYỂN BOX (di chuyển vị trí)
            // SỬA LỖI "text box không di chuyển được": trước đây việc kéo-thả di chuyển được lập
            // trình gián tiếp qua rất nhiều tầng (PdfTextBox -> PdfPage -> App giữ "dragState" ->
            // App lắng nghe pointermove/pointerup ở tận div gốc -> tự dò canvas bằng
            // document.querySelectorAll('.draw-canvas')[pageNum-1] -> bắn CustomEvent để PdfPage
            // nhận lại) — chuỗi này rất dễ gãy, đặc biệt khi có trang PDF nào đó CHƯA được render
            // (lazy-mount ngoài vùng nhìn thấy) làm lệch chỉ số canvas cần tìm. Bút TẨY/RESIZE vốn
            // đã hoạt động tốt vì tự xử lý gọn trong chính component, không phụ thuộc tầng nào khác
            // — nay áp dụng ĐÚNG cách làm y hệt cho việc "di chuyển", đơn giản & chắc chắn hơn hẳn:
            // tự tính độ lệch chuột ngay trong component này rồi gọi thẳng updateText, không cần
            // đi vòng qua App/PdfPage nữa.
            const startMove = (e) => {
                e.stopPropagation();
                e.preventDefault();

                const startX = e.clientX;
                const startY = e.clientY;
                const startTX = t.x;
                const startTY = t.y;

                const onMove = (ev) => {
                    const newX = startTX + (ev.clientX - startX) / scale;
                    const newY = startTY + (ev.clientY - startY) / scale;
                    updateText(t.id, { ...t, x: newX, y: newY });
                };

                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            // THUẬT TOÁN KÉO RESIZE BOX
            const startResize = (e, direction) => {
                e.stopPropagation();
                e.preventDefault();
                
                const startX = e.clientX;
                const startY = e.clientY;
                
                // Lấy kích thước thực tế hiện tại
                const rect = containerRef.current.getBoundingClientRect();
                const startW = rect.width / scale;
                const startH = rect.height / scale;

                const onMove = (ev) => {
                    let w = startW;
                    let h = startH;
                    if (direction === 'w' || direction === 'both') {
                        w = startW + (ev.clientX - startX) / scale;
                    }
                    if (direction === 'h' || direction === 'both') {
                        h = startH + (ev.clientY - startY) / scale;
                    }
                    // Giới hạn chiều rộng/cao tối thiểu
                    updateText(t.id, { ...t, width: Math.max(60, w), height: Math.max(30, h) });
                };
                
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            return (
                <div 
                    ref={containerRef}
                    style={{ 
                        position: 'absolute', 
                        left: t.x * scale, 
                        top: t.y * scale,
                        width: (t.width || 150) * scale,
                        height: (t.height || 40) * scale,
                        zIndex: active ? 100 : 10,
                    }}
                    /* QUAN TRỌNG — sửa lỗi kéo-thả/resize bị "ghì lại", không mượt: trước đây dùng
                       class "transition-all" ở đây, khiến MỌI thay đổi style (kể cả left/top/width/
                       height cập nhật liên tục bằng inline style lúc đang kéo) đều bị CSS animate
                       trong ~150ms thay vì áp dụng ngay lập tức — tạo cảm giác box bị "đuổi theo"
                       con trỏ/ngón tay có độ trễ thay vì bám sát tức thời. Đổi sang "transition-colors"
                       để CHỈ hiệu ứng mượt cho phần đổi màu viền/nền khi bật/tắt active, còn vị trí và
                       kích thước luôn cập nhật NGAY LẬP TỨC, bám sát 100% theo thao tác kéo. */
                    className={`group transition-colors ${active ? 'border-2 border-emerald-400 bg-white/70 shadow-lg backdrop-blur-md rounded-lg' : 'border-2 border-transparent bg-transparent'}`}
                    onPointerDown={(e) => { e.stopPropagation(); setActive(true); }}
                >
                    {/* Nút Xóa */}
                    {active && (
                        <button 
                            onPointerDown={(e) => { e.stopPropagation(); removeText(t.id); }}
                            className="absolute -top-3 -right-3 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center shadow-md touch-none z-20 hover:scale-110 transition-transform"
                        >
                            <i className="fas fa-times text-[10px]"></i>
                        </button>
                    )}

                    {/* Nắm Kéo Move (Bên Trên) */}
                    {active && (
                        <div
                            onPointerDown={startMove}
                            className="absolute -top-5 left-1/2 transform -translate-x-1/2 w-14 h-5 bg-emerald-500 text-white rounded-t-lg cursor-move shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600 transition-colors"
                        >
                            <i className="fas fa-grip-lines text-[10px]"></i>
                        </div>
                    )}

                    {/* 3 NÚM ĐIỀU KHIỂN RESIZE CHO IPAD */}
                    {active && (
                        <>
                            {/* Núm ngang */}
                            <div 
                                onPointerDown={(e) => startResize(e, 'w')}
                                className="absolute top-1/2 -right-2 transform -translate-y-1/2 w-4 h-8 bg-emerald-500 text-white rounded-md cursor-e-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600"
                            >
                                <i className="fas fa-ellipsis-v text-[8px]"></i>
                            </div>
                            
                            {/* Núm dọc */}
                            <div 
                                onPointerDown={(e) => startResize(e, 'h')}
                                className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-8 h-4 bg-emerald-500 text-white rounded-md cursor-s-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-600"
                            >
                                <i className="fas fa-ellipsis-h text-[8px]"></i>
                            </div>

                            {/* Núm 2 chiều góc dưới */}
                            <div 
                                onPointerDown={(e) => startResize(e, 'both')}
                                className="absolute -bottom-2 -right-2 w-5 h-5 bg-emerald-600 text-white rounded-full cursor-se-resize shadow-md flex items-center justify-center touch-none z-20 hover:bg-emerald-700 hover:scale-110 transition-transform"
                            >
                                <i className="fas fa-expand-arrows-alt text-[10px] rotate-90"></i>
                            </div>
                        </>
                    )}

                    <textarea
                        ref={textareaRef}
                        value={t.text}
                        onChange={(e) => updateText(t.id, { ...t, text: e.target.value })}
                        placeholder="Gõ chữ..."
                        style={{ 
                            color: t.color, 
                            fontSize: (t.size * scale) + 'px',
                            resize: 'none' // Khóa resize native vì đã dùng núm xịn
                        }}
                        className={`w-full h-full outline-none bg-transparent p-2 font-sans block leading-relaxed overflow-hidden ${active ? 'pointer-events-auto' : 'pointer-events-none'}`}
                    />
                </div>
            );
        });

        // --- PDF THUMBNAIL (FLOATING WINDOW) ---
        const PdfThumbnail = React.memo(function PdfThumbnail({ pdf, pageNum, onClick }) {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => { setIsVisible(entry.isIntersecting); },
                    { rootMargin: '200px 0px' } 
                );
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                if (!pdf || !isVisible) return;
                let cancelled = false;
                let realRenderTask = null;

                // Gộp CẢ getPage() LẪN render() làm 1 việc, đi qua chung hàng đợi (xem giải thích chi
                // tiết ở effect tương tự trong PdfPage) — tránh dồn hàng chục getPage() cùng lúc khi
                // cuộn nhanh trong mục lục file nhiều trang.
                const task = scheduleRender(() => {
                    const p = pdf.getPage(pageNum).then(page => {
                        if (cancelled) return;
                        const canvas = canvasRef.current;
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');
                        // Hạ tiếp độ phân giải render ảnh thu nhỏ (0.3 -> 0.2 -> 0.13): ô mục lục hiển
                        // thị rất nhỏ trên lưới (CSS đã tự co vừa khung qua object-cover) nên gần như
                        // không thấy khác biệt độ nét, nhưng giảm thêm ~58% số pixel so với mức 0.2
                        // trước đó — giúp mở mục lục và cuộn trong đó nhanh/nhẹ hơn nữa với file nhiều trang.
                        const viewport = page.getViewport({ scale: 0.13 });
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        realRenderTask = page.render({ canvasContext: ctx, viewport });
                        return realRenderTask.promise;
                    });
                    return {
                        promise: p,
                        cancel: () => {
                            cancelled = true;
                            if (realRenderTask) { try { realRenderTask.cancel(); } catch (err) {} }
                        }
                    };
                });

                return () => task.cancel();
            }, [pdf, pageNum, isVisible]);

            return (
                <div 
                    ref={containerRef} 
                    onClick={onClick} 
                    className="cursor-pointer border border-slate-200 hover:border-emerald-500 rounded-xl overflow-hidden bg-white shadow-sm hover:shadow-xl transition-all flex flex-col relative group transform hover:-translate-y-1"
                >
                    <div className="bg-slate-100 w-full aspect-[1/1.4] flex items-center justify-center relative overflow-hidden">
                        {isVisible ? <canvas ref={canvasRef} className="w-full h-full object-cover" /> : <i className="fas fa-file-pdf text-slate-300 text-3xl absolute"></i>}
                        <div className="absolute inset-0 bg-emerald-600/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <div className="absolute bottom-0 w-full bg-slate-900/70 backdrop-blur-sm text-center py-1.5">
                        <span className="text-xs font-extrabold text-white tracking-widest uppercase">Trang {pageNum}</span>
                    </div>
                </div>
            );
        });

        // --- CẤU HÌNH KIỂU NÉT VẼ CHO TỪNG LOẠI BÚT (1 nguồn duy nhất, dùng lại ở mọi nơi) ---
        // Gộp về 1 chỗ để tránh lặp code 3 nơi khác nhau (từng là nguyên nhân dễ gây lệch nét
        // giữa lúc đang vẽ và lúc redraw) — sửa độ dày/màu ở đây là áp dụng đồng bộ toàn bộ.
        // 3 mức độ dày cho bút chì: nhỏ nhất (mức cũ, mặc định) + 2 mức lớn hơn 1 chút.
        const PENCIL_SIZES = [2, 3.5, 5];
        const DEFAULT_PENCIL_SIZE = PENCIL_SIZES[0];

        // Bảng màu bút có sẵn (bấm chọn nhanh) — thay cho việc phải bấm vào 1 chấm tròn nhỏ để
        // mở bảng màu của hệ điều hành mỗi lần muốn đổi màu. Vẫn giữ 1 ô "tuỳ chỉnh" (icon ống hút
        // màu) cạnh bên để chọn màu bất kỳ ngoài 4 màu có sẵn này khi cần.
        const PRESET_COLORS = ['#4F46E5', '#EF4444', '#10B981', '#000000']; // rút gọn còn 4 màu cho thanh công cụ gọn hơn

        // QUAN TRỌNG — sửa lỗi "mở mục lục file nặng tải rất lâu": trước đây modal Mục lục tạo ra
        // CÙNG LÚC 1 component PdfThumbnail (kèm 1 IntersectionObserver riêng) cho TẤT CẢ các trang
        // của file — với sách vài trăm trang, chỉ riêng việc React dựng hàng trăm ô lưới + hàng trăm
        // observer trong 1 lần "commit" đã đủ làm nghẽn luồng chính ngay khi vừa bấm mở, trước khi ảnh
        // thu nhỏ nào kịp hiện ra. Giờ modal chỉ dựng 1 ĐỢT nhỏ (TOC_BATCH_SIZE ô) khi vừa mở, rồi tự
        // "tải thêm" từng đợt khi người dùng cuộn gần tới cuối danh sách hiện có — xem handleTocScroll.
        const TOC_BATCH_SIZE = 30;
        const TOOL_STYLES = {
            // Bút Magic (OCR + dịch + đọc): nét mảnh, đứt nét — mảnh hơn bản trước (3 -> 1.5)
            magic: { color: '#FBBF24', width: () => 1.5, alpha: 0.9, dash: [7, 5], useColorProp: false },
            // Bút IPA và bút tra ảnh: giờ CHỈ dùng cơ chế "kéo-thả ô chữ nhật" (giống bút Magic ở chế
            // độ hình chữ nhật) thay vì kiểu bút highlight quét ngang trước đây, nên khung vẽ ra chỉ là
            // 1 viền mảnh để người dùng thấy rõ vùng mình đang chọn — không còn tô phủ dày trong suốt nữa.
            ipa: { color: '#38BDF8', width: () => 2, alpha: 0.95, dash: [6, 4], useColorProp: false },
            photo: { color: '#FB7185', width: () => 2, alpha: 0.95, dash: [6, 4], useColorProp: false },
            // Độ dày bút chì giờ lấy từ "pencilSize" (chọn được qua 3 nút chấm tròn trên thanh công
            // cụ khi đang dùng bút chì) thay vì cố định — mặc định vẫn y hệt độ dày cũ (2).
            pencil: { width: (s, pencilSizeVal) => (pencilSizeVal || DEFAULT_PENCIL_SIZE) * s, alpha: 0.6, dash: [], useColorProp: true },
            pen: { width: (s) => 4 * s, alpha: 1.0, dash: [], useColorProp: true },
        };
        const applyToolStyle = (ctx, toolName, colorProp, scaleVal, thicknessVal) => {
            const cfg = TOOL_STYLES[toolName];
            if (!cfg) return;
            ctx.strokeStyle = cfg.useColorProp ? colorProp : cfg.color;
            ctx.setLineDash(cfg.dash);
            ctx.lineWidth = cfg.width(scaleVal, thicknessVal);
            ctx.globalAlpha = cfg.alpha;
        };

        // Chuyển 2 điểm chéo (kéo-thả kiểu marquee) thành 4 góc hình chữ nhật theo chiều kim đồng
        // hồ — dùng chung cho CẢ BA bút: Magic (chế độ hình chữ nhật), IPA và tra ảnh (giờ cả 2 bút
        // này đều LUÔN dùng kéo-thả hình chữ nhật thay vì kiểu highlight quét ngang trước đây, để
        // chọn trúng khít đúng vùng chữ cần, không còn bị mất nét/sai chữ do vùng cắt quá hẹp nữa).
        const rectPointsFromDiagonal = (p1, p2) => {
            const x1 = Math.min(p1.x, p2.x), x2 = Math.max(p1.x, p2.x);
            const y1 = Math.min(p1.y, p2.y), y2 = Math.max(p1.y, p2.y);
            return [{ x: x1, y: y1 }, { x: x2, y: y1 }, { x: x2, y: y2 }, { x: x1, y: y2 }];
        };

        // Tách cụm chữ Hán đầu tiên từ văn bản OCR ra được — dùng chung cho tra pinyin (pinyin-pro)
        // lẫn mở link từ điển đầy đủ (Hanzii).
        // Khác tiếng Anh (từ cách nhau bằng dấu cách nên tách bằng [A-Za-z']+), chữ Hán không có dấu
        // cách giữa các từ — nên lấy nguyên cụm ký tự Hán liên tiếp đầu tiên nhận diện được (đúng với
        // cách dùng: người dùng khoanh vùng đúng 1 từ/cụm từ muốn tra), bỏ qua số/dấu câu/ký tự latin
        // lẫn vào do OCR nhận nhầm.
        const extractFirstWord = (rawText) => {
            // U+4E00–U+9FFF: CJK Unified Ideographs (khoi chu Han chinh) - U+3400–U+4DBF: CJK Extension A - U+F900–U+FAFF: CJK Compatibility Ideographs.
            const match = (rawText || '').match(/[一-鿿㐀-䶿豈-\ufaff]+/);
            return match ? match[0] : '';
        };

        // --- TRA CỨU PINYIN + NGHĨA TIẾNG VIỆT — pinyin-pro (thư viện chạy hoàn toàn phía client,
        // không cần gọi API/mạng cho phần phiên âm — window.pinyinPro.pinyin(text) trả về pinyin có
        // dấu thanh điệu, ví dụ "汉语拼音" -> "hàn yǔ pīn yīn") ghép với 1 lần gọi Google Dịch để lấy
        // nghĩa tiếng Việt ngắn gọn cho đúng từ/cụm từ vừa quét (dùng lại endpoint dịch không chính
        // thức sl=zh-CN&tl=vi giống thanh dịch Magic ở trên, chỉ khác là dịch 1 từ đơn lẻ).
        const _dictCache = {}; // cache theo từ để tránh gọi lại API khi quét trùng 1 từ nhiều lần
        const fetchIPAInfo = async (rawText) => {
            const word = extractFirstWord(rawText);
            if (!word) return { word: '', error: 'Không nhận diện được chữ Hán trong vùng đã quét.' };
            if (_dictCache[word]) return _dictCache[word];

            try {
                const pinyin = (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function')
                    ? window.pinyinPro.pinyin(word)
                    : '';

                let definition = '';
                try {
                    const res = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=' + encodeURIComponent(word));
                    if (res.ok) {
                        const data = await res.json();
                        definition = (data && data[0] || []).map(seg => seg[0]).join('').trim();
                    }
                } catch (e) { /* bỏ qua lỗi dịch, vẫn giữ pinyin nếu có */ }

                const result = { word, pinyin, definition, error: (!pinyin && !definition) ? 'Không tra được dữ liệu cho từ này.' : '' };
                _dictCache[word] = result;
                return result;
            } catch (err) {
                const result = { word, pinyin: '', definition: '', error: 'Không tìm thấy từ "' + word + '" trong từ điển.' };
                return result;
            }
        };

        // --- BÚT TRA ẢNH MINH HOẠ: mở 1 cửa sổ Google Hình ảnh THẬT, đặt bên phải màn hình ---
        // Vì Google chặn nhúng (iframe) trang kết quả của họ vào web khác, cách khả thi & đúng ý
        // "cửa sổ nằm bên phải, hình chữ nhật đứng to" là mở 1 popup window thật với kích thước/
        // vị trí được set sẵn (trên Mac/laptop sẽ đúng như ý; trên iPad Safari trình duyệt sẽ tự
        // mở dạng tab do hệ điều hành quản lý, đó là giới hạn của chính Safari chứ không phải bug).
        //
        // Để KHÔNG bị trình duyệt chặn popup: cửa sổ được mở NGAY LẬP TỨC (đồng bộ) trong lúc
        // đang xử lý cử chỉ chạm/thả bút của người dùng — trước khi chờ kết quả OCR bất đồng bộ —
        // sau đó mới điều hướng cửa sổ đó sang URL tìm kiếm thật khi có chữ.
        const openPhotoLookupWindow = () => {
            try {
                const w = 460;
                const h = Math.max(500, Math.round((window.screen.availHeight || 900) * 0.85));
                const left = Math.max(0, Math.round((window.screen.availWidth || window.innerWidth) - w - 24));
                const top = 50;
                const win = window.open('about:blank', 'nightIeltsPhotoLookup', `width=${w},height=${h},left=${left},top=${top}`);
                if (win && win.document) {
                    win.document.title = 'Đang tra ảnh minh hoạ…';
                    win.document.body.style.cssText = 'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#ECFDF5;font-family:sans-serif;color:#059669;font-size:18px;text-align:center;padding:24px;box-sizing:border-box;';
                    win.document.body.textContent = 'Đang quét chữ & tìm ảnh minh hoạ…';
                }
                return win;
            } catch (err) { return null; }
        };
        const navigatePhotoLookupWindow = (win, text) => {
            if (!win || win.closed) return;
            const clean = (text || '').replace(/\s+/g, ' ').trim();
            if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                try {
                    win.document.body.textContent = 'Không nhận diện được chữ trong vùng đã quét. Cửa sổ này sẽ tự đóng…';
                    setTimeout(() => { try { win.close(); } catch (e) {} }, 1800);
                } catch (e) {}
                return;
            }
            win.location.href = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(clean);
        };

        // --- BÚT IPA: mở 1 cửa sổ Hanzii THẬT cho từ vừa quét ---
        // Dùng lại y hệt cơ chế "mở popup rỗng ngay trong cử chỉ chạm -> điều hướng sau khi có
        // kết quả OCR" của bút tra ảnh ở trên, để trình duyệt không chặn popup. Đặt cùng vị trí/
        // kích thước bên phải màn hình cho nhất quán. Hanzii.net = từ điển Trung-Việt, chủ yếu index
        // chữ giản thể — mở trang word đầy đủ (nghĩa tiếng Việt, ví dụ câu) bổ sung cho box pinyin
        // tóm tắt lấy từ pinyin-pro + Google Dịch ở trên.
        const openIPALookupWindow = () => {
            try {
                const w = 460;
                const h = Math.max(500, Math.round((window.screen.availHeight || 900) * 0.85));
                const left = Math.max(0, Math.round((window.screen.availWidth || window.innerWidth) - w - 24));
                const top = 50;
                const win = window.open('about:blank', 'nightChineseIPALookup', `width=${w},height=${h},left=${left},top=${top}`);
                if (win && win.document) {
                    win.document.title = 'Đang tra Hanzii…';
                    win.document.body.style.cssText = 'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#EFF6FF;font-family:sans-serif;color:#0284C7;font-size:18px;text-align:center;padding:24px;box-sizing:border-box;';
                    win.document.body.textContent = 'Đang quét chữ & mở từ điển Hanzii…';
                }
                return win;
            } catch (err) { return null; }
        };
        const navigateIPALookupWindow = (win, word) => {
            if (!win || win.closed) return;
            if (!word) {
                try {
                    win.document.body.textContent = 'Không nhận diện được chữ Hán trong vùng đã quét. Cửa sổ này sẽ tự đóng…';
                    setTimeout(() => { try { win.close(); } catch (e) {} }, 1800);
                } catch (e) {}
                return;
            }
            win.location.href = 'https://hanzii.net/search/word/' + encodeURIComponent(word) + '?hl=vi';
        };

        // --- SINGLE PDF PAGE ---
        // Bọc thêm React.forwardRef (giữ nguyên React.memo bên ngoài) để App có thể "gọi vào" từng
        // trang lấy ảnh chụp nét vẽ + text đã ghi (getAnnotationSnapshot, xem useImperativeHandle bên
        // dưới) — phục vụ tính năng "Lưu ghi chú vào file" (xuất PDF đã dán note) ở component App.
        const PdfPage = React.memo(React.forwardRef(function PdfPage({ pdf, pageNum, scale, isDrawingMode, tool, magicShapeMode, color, fontSize, pencilSize, basePageSize, onExtractText, onIPALookup, onPhotoLookup }, ref) {
            const canvasRef = useRef(null);
            const drawCanvasRef = useRef(null);
            const [viewport, setViewport] = useState(null);
            
            const [strokes, setStrokes] = useState([]);
            const [texts, setTexts] = useState([]);
            const [isVisible, setIsVisible] = useState(false);
            const containerRef = useRef(null);

            const isDrawingRef = useRef(false);
            const currentStrokeRef = useRef(null);
            // QUAN TRỌNG — nhớ đã render xong cho (pdf, scale) nào rồi: canvas giờ LUÔN nằm sẵn
            // trong DOM (chỉ ẩn/hiện bằng display, không hề unmount) nên nội dung đã vẽ vẫn còn
            // nguyên khi ẩn đi rồi hiện lại — KHÔNG cần render lại từ đầu mỗi lần isVisible bật lại
            // true nữa. Phải nhớ CẢ pdf (không chỉ scale): vì các PdfPage dùng key={pageNum} cố định,
            // khi người dùng mở 1 file MỚI (pdfDoc đổi nhưng cùng số trang) thì React TÁI SỬ DỤNG lại
            // đúng các instance PdfPage cũ theo key — nếu chỉ so scale mà quên so cả pdf, trang của
            // file mới sẽ bị coi nhầm là "đã render rồi" và không chịu vẽ lại.
            const renderedRef = useRef({ pdf: null, scale: null });

            useEffect(() => {
                // Vùng đệm preload nhỏ hơn (600px thay vì 1000px): vẫn đủ để cuộn mượt mà không
                // giữ quá nhiều canvas nặng cùng lúc trong bộ nhớ — quan trọng với iPad vì RAM
                // hạn chế hơn nhiều so với máy Mac, giúp giảm nguy cơ Safari phải "giải phóng" tab.
                const observer = new IntersectionObserver(
                    ([entry]) => { setIsVisible(entry.isIntersecting); },
                    { rootMargin: '600px 0px' }
                );
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            // QUAN TRỌNG — nguyên nhân THẬT SỰ của "cuộn lùi bị nhảy mấy chục trang" (đã đào sâu lại
            // sau nhiều lần sửa wheel không ăn thua): effect này trước đây RENDER LẠI TỪ ĐẦU (gọi lại
            // pdf.getPage + page.render + redrawStrokes — đều là việc NẶNG) MỖI LẦN isVisible chuyển
            // từ false -> true, kể cả khi trang đó đã render xong rồi và chỉ đơn giản cuộn ra xa rồi
            // quay lại! Khi cuộn LÙI qua 1 vùng đã đọc/ghi chú trước đó (đúng như người dùng nhận xét:
            // "trang đó đã tải rồi"), rất nhiều trang ĐÃ RENDER cùng lúc lọt lại vào vùng đệm 600px và
            // toàn bộ đều bị render lại từ đầu + vẽ lại hết các nét bút đã ghi (redrawStrokes) — dồn 1
            // đợt việc nặng lên luồng chính, đúng lúc đang xử lý cả loạt sự kiện wheel, gây khựng/dồn
            // input rồi "nhảy" ra ngoài ý muốn. Cuộn XUÔI ít gặp vì đa số trang phía trước là trang
            // "nguội" (chưa render lần nào) — quét qua landmark thường chậm dần đều chứ không dồn cục.
            // Sửa TẬN GỐC: chỉ render 1 LẦN cho mỗi (file, scale) — dùng renderedRef nhớ lại đã render
            // cho pdf/scale nào, lần isVisible bật lại true sau đó (cùng file, cùng scale) sẽ bỏ qua
            // toàn bộ, canvas vẫn còn nguyên nội dung cũ vì chưa từng bị gỡ khỏi DOM. Chỉ render lại
            // thật sự khi đổi scale (zoom) hoặc đổi sang file khác — 2 trường hợp bắt buộc phải vẽ lại.
            useEffect(() => {
                if (!pdf || !isVisible) return;
                if (renderedRef.current.pdf === pdf && renderedRef.current.scale === scale) return; // đã render đúng file+scale này rồi — khỏi làm lại
                let cancelled = false;
                let realRenderTask = null;

                const task = scheduleRender(() => {
                    const p = pdf.getPage(pageNum).then(page => {
                        if (cancelled) return; // effect đã bị dọn (vd trang cuộn ra khỏi vùng đệm) trước khi tới lượt

                        const vp = page.getViewport({ scale });
                        setViewport(vp);

                        const canvas = canvasRef.current;
                        const drawCanvas = drawCanvasRef.current;
                        if (!canvas || !drawCanvas) return;

                        canvas.height = vp.height;
                        canvas.width = vp.width;
                        drawCanvas.height = vp.height;
                        drawCanvas.width = vp.width;

                        const ctx = canvas.getContext('2d');
                        realRenderTask = page.render({ canvasContext: ctx, viewport: vp });
                        return realRenderTask.promise.then(() => {
                            if (!cancelled) {
                                redrawStrokes();
                                renderedRef.current = { pdf, scale };
                            }
                        });
                    });
                    return {
                        promise: p,
                        cancel: () => {
                            cancelled = true;
                            if (realRenderTask) { try { realRenderTask.cancel(); } catch (err) {} }
                        }
                    };
                });

                return () => task.cancel();
            }, [pdf, pageNum, scale, isVisible]);

            // GHI CHÚ: từng thử thay listener JS dưới đây bằng CSS "touch-action: none" để đỡ tốn JS,
            // nhưng touch-action là thuộc tính CSS thuần — không phân biệt được ngón tay hay Apple
            // Pencil, nên "none" chặn cứng LUÔN CẢ việc cuộn trang bằng ngón tay, làm hỏng tính năng
            // quan trọng "ngón tay để cuộn, bút để viết, tỳ tay không bị nhận nhầm nét vẽ". Đã revert
            // lại đúng cơ chế JS phân biệt theo touchType như cũ — CHỈ preventDefault khi phát hiện
            // có Apple Pencil trong lượt chạm, ngón tay/tỳ tay vẫn cuộn trang bình thường.
            useEffect(() => {
                const canvas = drawCanvasRef.current;
                if (!canvas || !isVisible) return;

                const preventTouchScroll = (e) => {
                    if (!isDrawingMode) return;
                    let isStylus = false;
                    if (e.touches && e.touches.length > 0) {
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].touchType === 'stylus' || e.touches[i].touchType === 'pen') {
                                isStylus = true;
                            }
                        }
                    }
                    if (isStylus) e.preventDefault();
                };

                canvas.addEventListener('touchstart', preventTouchScroll, { passive: false });
                canvas.addEventListener('touchmove', preventTouchScroll, { passive: false });

                return () => {
                    canvas.removeEventListener('touchstart', preventTouchScroll);
                    canvas.removeEventListener('touchmove', preventTouchScroll);
                };
            }, [isDrawingMode, isVisible]);

            const redrawStrokes = useCallback(() => {
                const drawCanvas = drawCanvasRef.current;
                if (!drawCanvas) return;
                const ctx = drawCanvas.getContext('2d');
                ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const drawLine = (stroke) => {
                    if (!stroke || !stroke.points || stroke.points.length === 0) return;

                    ctx.beginPath();
                    applyToolStyle(ctx, stroke.tool, stroke.color, scale, pencilSize);

                    // Chế độ "Hình chữ nhật" (kéo-thả): dùng chung cho bút Magic (khi bật chế độ hình
                    // chữ nhật) VÀ bút IPA / tra ảnh (giờ luôn dùng kéo-thả) — vẽ khung chữ nhật thay
                    // vì nối các điểm như nét vẽ tay thường.
                    if (stroke.shape === 'rect' && stroke.points.length >= 2) {
                        const p1 = stroke.points[0], p2 = stroke.points[1];
                        const x = Math.min(p1.x, p2.x) * scale;
                        const y = Math.min(p1.y, p2.y) * scale;
                        const w = Math.abs(p2.x - p1.x) * scale;
                        const h = Math.abs(p2.y - p1.y) * scale;
                        ctx.strokeRect(x, y, w, h);
                        ctx.setLineDash([]);
                        return;
                    }

                    ctx.moveTo(stroke.points[0].x * scale, stroke.points[0].y * scale);
                    for (let i = 1; i < stroke.points.length; i++) {
                        ctx.lineTo(stroke.points[i].x * scale, stroke.points[i].y * scale);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                };

                strokes.forEach(drawLine);
                if (currentStrokeRef.current) drawLine(currentStrokeRef.current);
            }, [strokes, scale, pencilSize]);

            useEffect(() => { if(isVisible) redrawStrokes(); }, [redrawStrokes, isVisible]);

            // QUAN TRỌNG — 1 trong 2 nguồn gây "viết vài nét là đứng màn hình iPad": mỗi lần
            // getCoordinates() chạy, canvas.getBoundingClientRect() buộc trình duyệt phải tính lại
            // layout (forced synchronous reflow) NGAY LẬP TỨC. Apple Pencil trên iPad Pro/ProMotion
            // có thể bắn sự kiện pointermove tới 120-240 lần/giây — nếu mỗi lần di chuyển bút đều ép
            // tính lại layout, chỉ vài giây viết liên tục là hàng trăm/nghìn lần reflow dồn vào luồng
            // chính, đủ để làm nghẽn hẳn UI (giống hệt "đứng hình"). Vì canvas KHÔNG đổi vị trí/kích
            // thước trong lúc đang vẽ 1 nét, giờ chỉ tính rect 1 LẦN DUY NHẤT lúc đặt bút xuống
            // (refreshRect=true) rồi dùng lại (cache) cho toàn bộ các lần di chuyển tiếp theo của
            // đúng nét đó — không còn ép reflow liên tục theo tần suất bút nữa.
            const canvasRectRef = useRef(null);
            const getCoordinates = (e, refreshRect) => {
                const canvas = drawCanvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                if (refreshRect || !canvasRectRef.current) {
                    canvasRectRef.current = canvas.getBoundingClientRect();
                }
                const rect = canvasRectRef.current;
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: ((e.clientX - rect.left) * scaleX) / scale,
                    y: ((e.clientY - rect.top) * scaleY) / scale
                };
            };

            const handlePointerDown = (e) => {
                if (!isDrawingMode) return;
                if (e.pointerType === 'touch') return;

                // Mở khoá audio ngay trong cử chỉ chạm thật gần nhất trước khi có thể cần đọc to
                // văn bản (bút Magic/IPA) — giúp giọng đọc Online chắc chắn được Safari/iPadOS cho
                // phép phát thay vì âm thầm chặn. Gọi vô hại với các bút khác, không tốn kém.
                unlockAudio();

                try { e.target.setPointerCapture(e.pointerId); } catch(err) {}

                // refreshRect=true: đầu 1 nét vẽ mới — tính lại rect 1 lần, cache dùng cho cả nét.
                const coords = getCoordinates(e, true);

                if (tool === 'eraser') {
                    handleErase(coords.x, coords.y);
                    isDrawingRef.current = true;
                    return;
                }

                if (tool === 'text') {
                    setTexts(prev => [...prev, {
                        id: Date.now(), x: coords.x, y: coords.y, text: '', color, size: fontSize, width: 150, height: 40
                    }]);
                    return;
                }

                // QUAN TRỌNG — sửa lỗi "kéo-thả ô chữ nhật không dùng được" của bút IPA/tra ảnh:
                // trước đây popup (Hanzii / Google Hình ảnh) được mở NGAY tại đây
                // (pointerdown), tức là NGAY LÚC BẮT ĐẦU kéo — việc mở 1 cửa sổ/tab mới đúng lúc đó
                // làm trình duyệt cướp mất focus khỏi canvas đang vẽ, khiến toàn bộ chuỗi sự kiện kéo
                // (pointermove/pointerup) bị đứt gãy giữa chừng nên KHÔNG kéo-thả được nữa — đây chính
                // là lý do bút Magic (không mở popup lúc pointerdown) vẫn kéo-thả bình thường còn 2 bút
                // này thì không. Bút Magic không hề bị ảnh hưởng nên không cần sửa gì ở bút đó.
                // Cách sửa: dời việc mở popup xuống handlePointerUp — lúc đó cú kéo đã HOÀN TẤT, và
                // pointerup vẫn là 1 cử chỉ người dùng thật 100% (giống hệt click) nên trình duyệt vẫn
                // không chặn popup, mà không còn làm gián đoạn thao tác kéo nữa.

                isDrawingRef.current = true;

                // Chế độ khoanh vùng "Hình chữ nhật" (kéo-thả): bút Magic khi bật chế độ hình chữ
                // nhật (tiện dùng chuột/trackpad trên Mac), và LUÔN LUÔN với bút IPA / tra ảnh (2 bút
                // này giờ chỉ còn 1 cơ chế chọn vùng duy nhất — kéo-thả ô chữ nhật — thay cho kiểu bút
                // highlight quét ngang trước đây, để chọn trúng khít đúng phần chữ cần, không mất nét).
                if ((tool === 'magic' && magicShapeMode === 'rect') || tool === 'ipa' || tool === 'photo') {
                    currentStrokeRef.current = { id: Date.now(), tool, shape: 'rect', points: [coords, coords] };
                    return;
                }

                currentStrokeRef.current = { id: Date.now(), tool, color, points: [coords] };

                // QUAN TRỌNG — nguồn thứ 2 gây "viết vài nét là đứng màn hình iPad": trước đây MỖI
                // LẦN pointermove đều gọi lại applyToolStyle() (gán strokeStyle/lineWidth/globalAlpha
                // + cấp phát mảng mới cho setLineDash) dù các giá trị này KHÔNG hề đổi trong suốt 1
                // nét vẽ (chỉ phụ thuộc tool/color/scale — cố định từ lúc đặt bút xuống). Với tần suất
                // sự kiện cao của Apple Pencil, việc gán lại y hệt hàng trăm lần/giây vẫn tốn CPU và
                // cấp phát bộ nhớ (garbage) không cần thiết, cộng dồn với việc reflow ở trên càng dễ
                // làm nghẽn luồng chính. Giờ set style CHỈ 1 LẦN DUY NHẤT ngay khi đặt bút xuống —
                // context canvas tự giữ nguyên các thuộc tính này cho các lệnh stroke() tiếp theo,
                // không cần (và không nên) gán lại mỗi lần di chuyển.
                const ctx = drawCanvasRef.current.getContext('2d');
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                applyToolStyle(ctx, tool, color, scale, pencilSize);
                ctx.beginPath();
                ctx.moveTo(coords.x * scale, coords.y * scale);
                ctx.lineTo(coords.x * scale, coords.y * scale);
                ctx.stroke();
            };

            const handlePointerMove = (e) => {
                if (!isDrawingRef.current) return;
                if (e.pointerType === 'touch') return;

                const coords = getCoordinates(e);

                if (tool === 'eraser') {
                    handleErase(coords.x, coords.y);
                    return;
                }

                if (!currentStrokeRef.current) return;

                if ((tool === 'magic' && magicShapeMode === 'rect') || tool === 'ipa' || tool === 'photo') {
                    // Cập nhật góc đối diện của khung chữ nhật và vẽ lại toàn bộ canvas — chi phí
                    // rẻ vì số nét lưu trên 1 trang thường ít, vẫn mượt ở cả Mac lẫn iPad.
                    currentStrokeRef.current.points[1] = coords;
                    redrawStrokes();
                    return;
                }

                const canvas = drawCanvasRef.current;
                if (!canvas) return;

                const lastPoint = currentStrokeRef.current.points[currentStrokeRef.current.points.length - 1];
                currentStrokeRef.current.points.push(coords);

                // Style đã được set 1 lần lúc pointerDown — không gọi lại applyToolStyle() ở đây nữa
                // (xem giải thích chi tiết ở handlePointerDown), chỉ còn vẽ đoạn nối ngắn giữa 2 điểm.
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(lastPoint.x * scale, lastPoint.y * scale);
                ctx.lineTo(coords.x * scale, coords.y * scale);
                ctx.stroke();
            };

            const handlePointerUp = (e) => {
                if (!isDrawingRef.current) return;
                isDrawingRef.current = false;

                try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}

                if (!currentStrokeRef.current || tool === 'eraser') return;

                if (tool === 'magic') {
                    if (magicShapeMode === 'rect') {
                        const [p1, p2] = currentStrokeRef.current.points;
                        currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    }
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    performMagicOCR(strokeToOCR);
                    return;
                }

                if (tool === 'ipa') {
                    // Kéo-thả ô chữ nhật (giống bút Magic ở chế độ hình chữ nhật) — chọn trúng khít
                    // đúng vùng chữ cần tra, không còn cần "phình" nét như kiểu bút highlight cũ nữa.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup — vẫn là 1 cử chỉ chạm/bấm thật, trình duyệt
                    // không chặn) SAU KHI cú kéo đã xong, để không làm gián đoạn thao tác kéo-thả.
                    const popupWin = openIPALookupWindow();
                    performIPAOCR(strokeToOCR, popupWin);
                    return;
                }

                if (tool === 'photo') {
                    // Kéo-thả ô chữ nhật — cùng cơ chế với bút IPA/Magic ở trên.
                    const [p1, p2] = currentStrokeRef.current.points;
                    currentStrokeRef.current.points = rectPointsFromDiagonal(p1, p2);
                    const strokeToOCR = currentStrokeRef.current;
                    currentStrokeRef.current = null;
                    redrawStrokes();
                    // Mở popup NGAY TẠI ĐÂY (pointerup), sau khi cú kéo đã xong — xem giải thích chi
                    // tiết ở nhánh 'ipa' phía trên.
                    const popupWin = openPhotoLookupWindow();
                    performPhotoOCR(strokeToOCR, popupWin);
                    return;
                }

                // Bút chì / bút bi: lưu nét vẽ như bình thường
                const strokeToSave = { ...currentStrokeRef.current };
                setStrokes(prev => [...prev, strokeToSave]);
                currentStrokeRef.current = null;
            };

            const handleErase = (x, y) => {
                const eraseRadius = 15;
                setStrokes(prev => prev.filter(stroke => {
                    for (let pt of stroke.points) {
                        if (Math.hypot(pt.x - x, pt.y - y) < eraseRadius) return false;
                    }
                    return true;
                }));
                setTimeout(() => redrawStrokes(), 0);
            };

            // --- LÕI OCR DÙNG CHUNG CHO CẢ 3 BÚT (Magic / IPA / Tra ảnh) ---
            // Gộp về 1 chỗ để chắc chắn cả 3 bút hoạt động ổn định như nhau, tránh lặp code.
            const getStrokeBounds = (stroke) => {
                if (!viewport || !stroke || !stroke.points || stroke.points.length < 3) return null;
                const xs = stroke.points.map(p => p.x * scale);
                const ys = stroke.points.map(p => p.y * scale);
                const minX = Math.min(...xs), maxX = Math.max(...xs);
                const minY = Math.min(...ys), maxY = Math.max(...ys);
                const width = maxX - minX, height = maxY - minY;
                if (width < 10 || height < 10) return null;
                return { xs, ys, minX, minY, width, height };
            };

            const runOCROnBounds = async (bounds) => {
                try {
                    const canvas = canvasRef.current;
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = bounds.width;
                    tempCanvas.height = bounds.height;
                    const tempCtx = tempCanvas.getContext('2d');

                    tempCtx.fillStyle = 'white';
                    tempCtx.fillRect(0, 0, bounds.width, bounds.height);

                    tempCtx.beginPath();
                    tempCtx.moveTo(bounds.xs[0] - bounds.minX, bounds.ys[0] - bounds.minY);
                    for (let i = 1; i < bounds.xs.length; i++) {
                        tempCtx.lineTo(bounds.xs[i] - bounds.minX, bounds.ys[i] - bounds.minY);
                    }
                    tempCtx.closePath();
                    tempCtx.clip();

                    tempCtx.drawImage(canvas, bounds.minX, bounds.minY, bounds.width, bounds.height, 0, 0, bounds.width, bounds.height);

                    const imageDataUrl = tempCanvas.toDataURL('image/png');
                    // 'chi_sim' = gói ngôn ngữ Chữ Hán GIẢN THỂ (Simplified Chinese) của Tesseract.js —
                    // đúng với chữ dùng ở Trung Quốc đại lục/Singapore, khác với 'chi_tra' (phồn thể,
                    // dùng ở Đài Loan/Hồng Kông). Không cần \n -> khoảng trắng như tiếng Anh (chữ Hán
                    // không cách nhau bằng dấu cách), nhưng vẫn giữ lại để dọn xuống dòng thừa do OCR
                    // đôi khi chèn vào.
                    const result = await Tesseract.recognize(imageDataUrl, 'chi_sim');
                    const text = result.data.text.replace(/\s+/g, '').trim();
                    return text.length > 0 ? text : "Không tìm thấy chữ trong vùng chọn.";
                } catch (err) {
                    console.error("OCR Error:", err);
                    return "Lỗi nhận diện chữ.";
                }
            };

            const performMagicOCR = async (stroke) => {
                const bounds = getStrokeBounds(stroke);
                if (!bounds) return;
                onExtractText("", true);
                const text = await runOCROnBounds(bounds);
                onExtractText(text, false);
            };
