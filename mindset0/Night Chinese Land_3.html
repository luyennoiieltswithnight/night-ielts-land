                                            </p>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                {!subtitleHasTabAudio ? (
                                    <button
                                        onClick={handleClickAddTabAudio}
                                        className="px-3 h-9 rounded-full bg-white/10 hover:bg-white/20 text-[11px] sm:text-xs font-bold flex items-center gap-1.5 transition-colors border border-white/20 whitespace-nowrap"
                                        title={'Nghe âm thanh máy tính (nhạc/video/Zoom...) — hộp thoại hiện ra thì chọn "Toàn bộ màn hình" (Entire Screen) rồi bật công tắc "Also share system audio", sau đó bấm Share/Chia sẻ. Sẽ chuyển phụ đề sang hiện theo từng đoạn ngắn thay vì từng chữ.'}
                                    >
                                        <i className="fas fa-volume-high text-[10px]"></i> <span className="hidden sm:inline">Nghe âm thanh máy tính</span>
                                    </button>
                                ) : (
                                    <span className="px-3 h-9 rounded-full bg-emerald-500/20 text-emerald-300 text-[11px] sm:text-xs font-bold flex items-center gap-1.5 border border-emerald-400/30 whitespace-nowrap">
                                        <i className="fas fa-volume-high text-[10px]"></i> <span className="hidden sm:inline">Đã nghe âm thanh máy tính</span>
                                    </span>
                                )}
                                {/* Nút Tạm dừng/Tiếp tục — tắt hẳn mic (không nghe nữa) nhưng GIỮ NGUYÊN mọi
                                    phụ đề đang hiện, khác với nút Tắt (X) bên cạnh sẽ đóng hẳn thanh phụ đề. */}
                                <button
                                    onClick={() => { subtitlePaused ? resumeSubtitles() : pauseSubtitles(); }}
                                    className={"w-9 h-9 rounded-full flex items-center justify-center transition-colors shrink-0 " + (subtitlePaused ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-white/10 hover:bg-white/20 text-white')}
                                    title={subtitlePaused ? 'Tiếp tục nghe (bật lại mic)' : 'Tạm dừng (tắt mic, giữ nguyên phụ đề đang hiện)'}
                                >
                                    <i className={"fas text-xs " + (subtitlePaused ? 'fa-microphone' : 'fa-pause')}></i>
                                </button>
                                <button onClick={stopSubtitles} className="w-9 h-9 rounded-full bg-white/10 hover:bg-red-500 flex items-center justify-center transition-colors shrink-0" title="Tắt hẳn phụ đề trực tiếp">
                                    <i className="fas fa-times text-xs"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Box "Tóm tắt phiên dạy" — cùng vị trí canh giữa/cách đỉnh như Box Bút AI, mở từ
                        nút riêng trên toolbar (không lồng trong Bút AI). Port từ bản Night IELTS Land. */}
                    {showSessionSummary && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] w-[90%] max-w-xl animate-slide-down">
                            <SessionSummaryPanel
                                apiKey={aiApiKey}
                                onOpenSettings={openAiSettings}
                                onClose={() => setShowSessionSummary(false)}
                                allTextsRef={allTextsRef}
                                aiHistoryRef={aiHistoryRef}
                                savedSummaries={savedSummaries}
                                onSave={(item) => setSavedSummaries(prev => [...prev, item])}
                                onDeleteSaved={(id) => setSavedSummaries(prev => prev.filter(s => s.id !== id))}
                            />
                        </div>
                    )}

                    {/* Modal nhập/xoá API key Groq cho Bút AI — mở từ nút bánh răng trong Box Bút AI/
                        Tóm tắt phiên dạy, hoặc từ thanh tuỳ chọn phụ của bút AI trên toolbar. Key lưu
                        thẳng vào localStorage của trình duyệt này (xem giải thích chi tiết ở
                        AI_STORAGE_KEY). Port từ bản Night IELTS Land. */}

                                                    // đóng mục lục cũng không cuộn trang — người dùng chọn xong mới bấm nút

                                                    if (tocExportMode) {

                                                    // QUAN TRỌNG — sửa lỗi "bấm chuyển trang từ mục lục làm nguyên trang bị kéo lên,
                                                    // khuất mất thanh công cụ, kéo xuống lại không được": trước đây dùng
                                                    // el.scrollIntoView() — hàm này để TRÌNH DUYỆT TỰ CHỌN cuộn ancestor scroll
                                                    // nào, và trên Safari/iPadOS đôi khi nó cuộn luôn CẢ container cha lẫn
                                                    // document/viewport thay vì chỉ đúng vùng nội dung PDF, đẩy luôn thanh công cụ
                                                    // (nằm NGOÀI vùng cuộn đó) ra khỏi màn hình theo. Giờ tự tính khoảng cách và
                                                    // chỉ gọi scrollTo() trên ĐÚNG 1 vùng cuộn nội dung PDF (pdfContentAreaRef) —

                                                    // trôi theo nữa.
                                                    const container = pdfContentAreaRef.current;
                                                    const target = document.getElementById(`pdf-page-${index + 1}`);
                                                    if (container && target) {
                                                        const containerRect = container.getBoundingClientRect();
                                                        const targetRect = target.getBoundingClientRect();
                                                        const delta = targetRect.top - containerRect.top;
                                                        // Đánh dấu đây là cú cuộn app TỰ ra lệnh — để bộ khống chế tốc độ cuộn lùi
                                                        // (xem isProgrammaticScrollRef) không chặn nhầm cú cuộn mượt này.

                        {/* TOP HEADER */}

                            ra khỏi đáy header, đè lên/bị che bởi nội dung PDF hoặc panel tra từ (fixed

                                </div>
                            ) : (
                                pdfDoc && Array.from(new Array(numPages), (el, index) => (
                                    <PdfPage
                                        key={index + 1}
                                        ref={(el) => { if (el) pageRefs.current[index + 1] = el; }}
                                        pageNum={index + 1}
                                        pdf={pdfDoc}
                                        scale={scale}
                                        isDrawingMode={isDrawingMode}
                                        tool={tool}
                                        magicShapeMode={magicShapeMode}
                                        aiShapeMode={aiShapeMode}
                                        pencilShapeMode={pencilShapeMode}
                                        eraserShapeMode={eraserShapeMode}
                                        penStability={penStability}
                                        penGlowColor={penGlowColor}
                                        pencilSize={pencilSize}
                                        color={color}
                                        fontSize={fontSize}
                                        basePageSize={basePageSize}
                                        onExtractText={onExtractText}
                                        onIPALookup={onIPALookup}
                                        onPhotoLookup={onPhotoLookup}
                                        onAILookup={onAILookup}
                                        onTextsChange={onPageTextsChange}
                                    />
                                ))
                            )}
                        </div>

                        {/* THANH ĐIỀU HƯỚNG DẠNG CHẤM DỌC — port từ bản Night IELTS Land — mặc định
                            ẩn, bấm nút nhỏ ở mép phải để hiện/ẩn. Chỉ hiện khi đã có file PDF và có
                            nhiều hơn 1 trang (1 trang thì thanh này không có tác dụng gì). QUAN TRỌNG:
                            mỗi chấm được định vị bằng % (top tính theo tỉ lệ trang / tổng số trang)
                            thay vì xếp flex bình thường — nhờ vậy dù sách có VÀI TRĂM trang, các chấm
                            vẫn luôn gói gọn đúng trong chiều cao cố định của thanh. */}
                        {pdfUrl && numPages > 1 && (
                            <div className="fixed right-3 top-1/2 transform -translate-y-1/2 z-40 flex items-center gap-2">
                                {showPageNav && (
                                    <div
                                        ref={pageNavRailRef}
                                        onPointerDown={handleNavPointerDown}
                                        onPointerMove={handleNavPointerMove}
                                        onPointerUp={handleNavPointerUp}
                                        onPointerCancel={handleNavPointerUp}
                                        className="glass-panel rounded-full shadow-xl border border-slate-200 relative cursor-pointer animate-fade-in touch-none"
                                        style={{ height: 'min(70vh, 640px)', width: '16px' }}
                                        title={`Trang ${currentPageForNav}/${numPages} — kéo hoặc bấm để tới trang`}
                                    >
                                        {Array.from(new Array(numPages), (el, i) => i + 1).map(p => (
                                            <span
                                                key={p}
                                                className={"absolute left-1/2 rounded-full pointer-events-none transition-all " + (p === currentPageForNav ? 'bg-emerald-600' : 'bg-slate-300')}
                                                style={{
                                                    top: (numPages > 1 ? (p - 1) / (numPages - 1) : 0) * 100 + '%',
                                                    transform: 'translate(-50%, -50%)',
                                                    width: p === currentPageForNav ? '7px' : '4px',
                                                    height: p === currentPageForNav ? '7px' : '4px'
                                                }}
                                            ></span>
                                        ))}
                                    </div>
                                )}
                                <button
                                    onClick={() => setShowPageNav(v => !v)}
                                    className={"w-8 h-8 rounded-full flex items-center justify-center shadow-lg border transition-colors " + (showPageNav ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-400 border-slate-200 hover:text-emerald-600')}
                                    title={showPageNav ? 'Ẩn thanh điều hướng trang' : 'Hiện thanh điều hướng trang'}
                                >
                                    <i className="fas fa-grip-lines-vertical text-xs"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
