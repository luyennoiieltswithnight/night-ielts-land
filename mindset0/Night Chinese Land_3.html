                    return;
                }
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    setupWhisperAudioGraph(micStream);
                    subtitleRecordLoop();
                } catch (e) {
                    setSubtitleStatus('error');
                    setSubtitleError('Không lấy được quyền micro (kiểm tra đã cho phép trong trình duyệt/hệ thống chưa).');
                }
            }, [setupWhisperAudioGraph, subtitleRecordLoop]);

            // Khởi động động cơ 'speech' (Web Speech API) — trả về true nếu bật được, false nếu trình
            // duyệt không hỗ trợ (gọi nơi dùng tự rơi xuống động cơ 'whisper'). continuous:true +
            // interimResults:true là 2 tuỳ chọn mấu chốt cho đúng hiệu ứng "gõ tới đâu hiện tới đó, hết
            // câu thì chốt dòng và nhảy xuống" mà người dùng yêu cầu.
            const startSpeechRecognitionEngine = useCallback(() => {
                const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognitionCtor) return false;
                const recognition = new SpeechRecognitionCtor();
                recognition.lang = 'zh-CN';
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = (event) => {
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const result = event.results[i];
                        const text = result[0].transcript;
                        if (result.isFinal) {
                            const clean = text.trim();
                            if (clean) setSubtitleLines(prev => [...prev, { id: Date.now() + Math.random(), text: clean }].slice(-3));
                        } else {
                            interim += text;
                        }
                    }
                    setSubtitleInterimText(interim.trim());
                    setSubtitleStatus('listening');
                    setSubtitleError('');
                };
                recognition.onerror = (event) => {
                    // 'no-speech' (im lặng quá lâu) và 'aborted' (do chính app chủ động stop()) là bình
                    // thường, KHÔNG phải lỗi thật — onend bên dưới sẽ tự khởi động lại nếu còn đang bật.
                    if (event.error === 'no-speech' || event.error === 'aborted') return;
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        setSubtitleStatus('error');
                        setSubtitleError('Không có quyền micro (kiểm tra đã cho phép trong trình duyệt chưa).');
                    }
                };
                recognition.onend = () => {
                    // QUAN TRỌNG: Web Speech API tự động dừng hẳn sau 1 khoảng im lặng dù đã đặt
                    // continuous:true (giới hạn của chính trình duyệt, không phải bug ở đây) — phải tự
                    // phát hiện việc này rồi start() lại để phụ đề không bị "chết" giữa buổi dạy dài.
                    if (subtitleActiveRef.current && !subtitlePausedRef.current && subtitleEngineRef.current === 'speech') {
                        try { recognition.start(); } catch (e) {}
                    }
                };
                try {
                    recognition.start();
                } catch (e) {
                    return false;
                }
                recognitionRef.current = recognition;
                return true;
            }, []);

            const startSubtitles = useCallback(async () => {
                if (subtitleActiveRef.current) return;
                subtitleActiveRef.current = true;
                subtitlePausedRef.current = false;
                _subtitleMicBusy = true;
                setSubtitleActive(true);
                setSubtitlePaused(false);
                setSubtitleStatus('listening');
                setSubtitleError('');
                setSubtitleLines([]);
                setSubtitleInterimText('');
                setSubtitleHasTabAudio(false);
                subtitleHasTabAudioRef.current = false;
                subtitleSilentStreakRef.current = 0;
                setSubtitleSilenceHint('');

                const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognitionCtor) {
                    subtitleEngineRef.current = 'speech';
                    if (startSpeechRecognitionEngine()) return;
                }
                // Không có Web Speech API (vd Safari/iPad) -> tự rơi xuống động cơ Groq Whisper theo đoạn.
                subtitleEngineRef.current = 'whisper';
                if (!aiApiKey) {
                    setSubtitleStatus('error');
                    setSubtitleError('Trình duyệt này không hỗ trợ nhận diện giọng nói tức thời — cần API key Groq để dùng chế độ theo đoạn. Bấm vào đây để nhập.');
                    return;
                }
                await startWhisperEngine();
            }, [aiApiKey, startSpeechRecognitionEngine, startWhisperEngine]);

            // Lấy âm thanh phát ra từ MÁY TÍNH (nhạc/video/Zoom/bất kỳ app nào đang phát, không riêng gì
            // 1 tab) — bắt buộc phải qua hộp thoại chia sẻ màn hình của trình duyệt (getDisplayMedia),
            // không có cách nào lấy được âm thanh hệ thống 1 cách "âm thầm" vì lý do bảo mật của trình
            // duyệt/hệ điều hành. QUAN TRỌNG để bắt được ĐÚNG "âm thanh toàn hệ thống" (không chỉ 1 tab):
            //   • constraint `audio: { systemAudio: 'include' }` — báo thẳng cho trình duyệt biết cần âm
            //     thanh hệ thống, Chrome sẽ tự bật SẴN công tắc "Also share system audio" (đúng cái công
            //     tắc trong ảnh chụp màn hình macOS mà người dùng đã thấy) khi có thể.
            //   • constraint `video: { displaySurface: 'monitor' }` — gợi ý trình duyệt ưu tiên chọn sẵn
            //     tab "Toàn bộ màn hình/Entire Screen" trong hộp thoại (chỉ tab NÀY mới có công tắc âm
            //     thanh hệ thống nói trên — nếu người dùng lỡ chọn "Cửa sổ/Window" hoặc "Tab Chrome" thì
            //     công tắc đó sẽ không xuất hiện, dù trình duyệt/hệ điều hành có hỗ trợ đi nữa).
            // Track video lấy kèm theo (bắt buộc phải xin cả video mới xin được audio) bị TẮT ngay lập
            // tức vì chỉ cần âm thanh — đỡ tốn tài nguyên máy.
            // QUAN TRỌNG: từ giờ hàm này KHÔNG còn đụng gì tới mic/động cơ 'speech' của mic nữa — trước
            // đây bấm nút này sẽ ép luôn cả mic phải chuyển sang chế độ chờ-hết-đoạn (mất đúng cái cảm
            // giác "hiện từng chữ" mà người dùng thích), giờ mic được giữ nguyên y hệt đang chạy, âm
            // thanh máy tính đi qua 1 pipeline Whisper hoàn toàn riêng, chạy song song độc lập.
            const addTabAudioToSubtitles = useCallback(async () => {
                if (!subtitleActiveRef.current) return;
                if (!aiApiKey) { openAiSettings(); return; } // pipeline âm thanh máy LUÔN cần Groq Whisper, bất kể mic đang dùng động cơ nào
                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        // frameRate ép rất thấp: track video này chỉ tồn tại vì API bắt buộc phải xin
                        // kèm mới xin được audio — KHÔNG dùng để hiển thị gì cả (tắt ngay dòng dưới), ép
                        // khung hình thấp để đỡ tốn CPU/GPU chụp màn hình trong lúc chờ người dùng bấm
                        // Share, nhất là với máy có màn hình độ phân giải cao. LƯU Ý: trên Safari, việc
                        // hộp thoại chia sẻ màn hình bị giật/xoay xoay con trỏ lúc đang chọn là hạn chế
                        // của chính Safari/macOS khi dựng bản xem trước live của "Toàn bộ màn hình" — xảy
                        // ra TRƯỚC khi trang này kịp nhận được stream nào cả, nên không có constraint nào
                        // ở đây khắc phục được; nếu thấy khó chịu, thử Chrome cho riêng thao tác này.
                        video: { displaySurface: 'monitor', frameRate: { ideal: 1, max: 5 } },
                        audio: { systemAudio: 'include' },
                        preferCurrentTab: false,
                    });
                    const audioTracks = displayStream.getAudioTracks();
                    displayStream.getVideoTracks().forEach(t => t.stop());
                    if (audioTracks.length === 0) {
                        setSubtitleError('Chưa lấy được âm thanh — trong hộp thoại vừa hiện, nhớ chọn mục "Toàn bộ màn hình" (Entire Screen) rồi bật công tắc "Also share system audio" trước khi bấm Share/Chia sẻ.');
                        return;
                    }

                    // Nếu bấm lại nút này lần 2 (vd đổi nguồn khác) mà pipeline cũ vẫn còn -> dọn trước.
                    if (subtitleHasTabAudioRef.current) stopTabAudioPipeline();

                    const tabAudioOnlyStream = new MediaStream(audioTracks);
                    subtitleTabStreamRef.current = tabAudioOnlyStream;

                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioCtx();
                    // Xem giải thích đầy đủ ở setupWhisperAudioGraph (mic) — cùng 1 lý do: context mới
                    // tạo có thể "suspended" khiến ghi âm ra toàn im lặng dù đang phát âm thanh thật.
                    if (audioCtx.state === 'suspended') { audioCtx.resume().catch(() => {}); }
                    const destination = audioCtx.createMediaStreamDestination();
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 512;
                    const tabSource = audioCtx.createMediaStreamSource(tabAudioOnlyStream);
                    tabSource.connect(destination);
                    tabSource.connect(analyser);
                    tabAudioCtxRef.current = audioCtx;
                    tabDestRef.current = destination;
                    tabAnalyserRef.current = analyser;
                    tabEnergyIntervalRef.current = setInterval(() => {
                        const a = tabAnalyserRef.current;
                        if (!a) return;
                        const data = new Uint8Array(a.fftSize);
                        a.getByteTimeDomainData(data);
                        let sumSquares = 0;
                        for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sumSquares += v * v; }
                        const rms = Math.sqrt(sumSquares / data.length);
                        if (rms > tabEnergyPeakRef.current) tabEnergyPeakRef.current = rms;
                    }, 80);

                    setSubtitleHasTabAudio(true);
                    subtitleHasTabAudioRef.current = true;
                    subtitleSilentStreakRef.current = 0;
                    setSubtitleSilenceHint('');
                    // Người dùng có thể bấm "Dừng chia sẻ" ngay trên thanh chia sẻ riêng của trình duyệt
                    // (không phải nút Tắt trong app) — lắng nghe để tự dọn dẹp pipeline riêng này cho khớp
                    // (KHÔNG đụng gì tới mic — mic vẫn tiếp tục chạy bình thường).
                    audioTracks[0].addEventListener('ended', () => { stopTabAudioPipeline(); });

                    if (!subtitlePausedRef.current) tabRecordLoop();
                } catch (e) {
                    // Người dùng bấm Huỷ ở hộp thoại chia sẻ — không phải lỗi thật sự, bỏ qua im lặng.
                }
            }, [aiApiKey, openAiSettings, stopTabAudioPipeline, tabRecordLoop]);

            // Bấm nút "Nghe âm thanh máy tính" đi qua hàm này trước, KHÔNG gọi thẳng addTabAudioToSubtitles
            // — lần đầu tiên trên mỗi trình duyệt sẽ hiện 1 modal cảnh báo về việc macOS có thể yêu cầu
            // cấp quyền + khởi động lại Chrome (xem SYSTEM_AUDIO_WARNING_KEY), tránh để người dùng bị bất
            // ngờ giữa buổi dạy nếu trình duyệt thật sự phải khởi động lại. Các lần bấm sau (đã đọc rồi)
            // thì vào thẳng luôn, không hỏi lại nữa.
            const handleClickAddTabAudio = useCallback(() => {
                let alreadySeen = false;
                try { alreadySeen = localStorage.getItem(SYSTEM_AUDIO_WARNING_KEY) === '1'; } catch (e) {}
                if (alreadySeen) {
                    addTabAudioToSubtitles();
                } else {
                    setShowSystemAudioWarning(true);
                }
            }, [addTabAudioToSubtitles]);

            // Tạm dừng: tắt HẲN mic phần cứng (đúng nghĩa "không nghe nữa") nhưng CỐ TÌNH không đụng tới
            // subtitleLines — mọi phụ đề đang hiện được giữ nguyên trên thanh đen cho tới khi bấm tắt hẳn
            // hoặc bấm tiếp tục nghe.
            const pauseSubtitles = useCallback(() => {
                if (!subtitleActiveRef.current || subtitlePausedRef.current) return;
                subtitlePausedRef.current = true;
                _subtitleMicBusy = false; // mic phần cứng thực sự bị tắt hẳn ngay bên dưới — hết bận.
                setSubtitlePaused(true);
                setSubtitleStatus('paused');
                setSubtitleInterimText('');
                if (subtitleEngineRef.current === 'speech' && recognitionRef.current) {
                    try { recognitionRef.current.onend = null; recognitionRef.current.stop(); } catch (e) {}
                    recognitionRef.current = null;
                }
                if (subtitleRecorderRef.current && subtitleRecorderRef.current.state !== 'inactive') {
                    try { subtitleRecorderRef.current.stop(); } catch (e) {}
                }
                if (subtitleMicStreamRef.current) {
                    subtitleMicStreamRef.current.getTracks().forEach(t => t.stop());
                    subtitleMicStreamRef.current = null;
                }
                // Pipeline âm thanh máy (nếu có): chỉ dừng vòng ghi âm, KHÔNG huỷ luôn stream chia sẻ màn
                // hình (huỷ hẳn sẽ phải hiện lại hộp thoại share khi tiếp tục — làm phiền hơn nhiều so với
                // chỉ tạm ngưng gửi request). subtitlePausedRef đã true nên tabRecordLoop tự dừng lịch ghi
                // tiếp theo, ở đây chỉ cần cắt ngay đoạn đang ghi dở.
                if (tabRecorderRef.current && tabRecorderRef.current.state !== 'inactive') {
                    try { tabRecorderRef.current.stop(); } catch (e) {}
                }
            }, []);

            // Tiếp tục nghe sau khi tạm dừng — bật lại đúng động cơ đang dùng trước đó, KHÔNG xoá phụ đề
            // cũ. Với động cơ 'whisper', mic đã bị tắt hẳn lúc pause nên phải xin quyền lại rồi nối vào
            // ĐÚNG audio graph cũ (destination/analyser cũ vẫn còn nguyên nếu vẫn đang có âm thanh tab).
            const resumeSubtitles = useCallback(async () => {
                if (!subtitleActiveRef.current || !subtitlePausedRef.current) return;
                subtitlePausedRef.current = false;
                _subtitleMicBusy = true;
                setSubtitlePaused(false);
                setSubtitleStatus('listening');
                setSubtitleError('');
                // Pipeline âm thanh máy (nếu đang có, ĐỘC LẬP với động cơ mic bên dưới) — chỉ cần khởi
                // động lại vòng ghi âm, graph/stream chia sẻ màn hình vẫn còn nguyên suốt lúc tạm dừng.
                if (subtitleHasTabAudioRef.current && (!tabRecorderRef.current || tabRecorderRef.current.state === 'inactive')) {
                    tabRecordLoop();
                }
                if (subtitleEngineRef.current === 'speech') {
                    if (!startSpeechRecognitionEngine()) {
                        subtitlePausedRef.current = true;
                        _subtitleMicBusy = false;
                        setSubtitlePaused(true);
                        setSubtitleStatus('error');
                        setSubtitleError('Không bật lại được micro.');
                    }
                    return;
                }
                subtitleSilentStreakRef.current = 0;
                setSubtitleSilenceHint('');
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    subtitleMicStreamRef.current = micStream;
                    if (subtitleAudioCtxRef.current && subtitleDestRef.current) {
                        if (subtitleAudioCtxRef.current.state === 'suspended') { subtitleAudioCtxRef.current.resume().catch(() => {}); }
                        const micSource = subtitleAudioCtxRef.current.createMediaStreamSource(micStream);
                        micSource.connect(subtitleDestRef.current);
                        if (subtitleAnalyserRef.current) micSource.connect(subtitleAnalyserRef.current);
                    } else {
                        setupWhisperAudioGraph(micStream); // hiếm khi xảy ra: graph cũ đã mất hẳn, dựng lại từ đầu
                    }
                    subtitleRecordLoop();
                } catch (e) {
                    subtitlePausedRef.current = true;
                    _subtitleMicBusy = false;
                    setSubtitlePaused(true);
                    setSubtitleStatus('error');
                    setSubtitleError('Không lấy lại được quyền micro.');
                }
            }, [startSpeechRecognitionEngine, setupWhisperAudioGraph, subtitleRecordLoop, tabRecordLoop]);

            const stopSubtitles = useCallback(() => {
                subtitleActiveRef.current = false;
                subtitlePausedRef.current = false;
                _subtitleMicBusy = false;
                subtitleEngineRef.current = 'speech';
                setSubtitleActive(false);
                setSubtitlePaused(false);
                setSubtitleStatus('idle');
                setSubtitleError('');
                setSubtitleLines([]);
                setSubtitleInterimText('');
                subtitleSilentStreakRef.current = 0;
                setSubtitleSilenceHint('');
                if (recognitionRef.current) {
                    try { recognitionRef.current.onend = null; recognitionRef.current.stop(); } catch (e) {}
                    recognitionRef.current = null;
                }
                if (subtitleEnergyIntervalRef.current) { clearInterval(subtitleEnergyIntervalRef.current); subtitleEnergyIntervalRef.current = null; }
                if (subtitleRecorderRef.current && subtitleRecorderRef.current.state !== 'inactive') {
                    try { subtitleRecorderRef.current.stop(); } catch (e) {}
                }
                subtitleRecorderRef.current = null;
                if (subtitleMicStreamRef.current) { subtitleMicStreamRef.current.getTracks().forEach(t => t.stop()); subtitleMicStreamRef.current = null; }
                if (subtitleAudioCtxRef.current) { try { subtitleAudioCtxRef.current.close(); } catch (e) {} subtitleAudioCtxRef.current = null; }
                subtitleDestRef.current = null;
                subtitleAnalyserRef.current = null;
                stopTabAudioPipeline(); // dọn pipeline âm thanh máy tính (nếu có) — riêng biệt hoàn toàn với mic ở trên
            }, [stopTabAudioPipeline]);

            // Đảm bảo dọn dẹp mic/tab-audio/AudioContext/SpeechRecognition nếu người dùng đóng tab/tải
            // lại trang trong lúc phụ đề trực tiếp đang bật — tránh giữ mic mở "vô hình" sau khi rời trang.
            useEffect(() => {
                return () => { stopSubtitles(); };
            }, [stopSubtitles]);

            // --- TÍNH NĂNG "TÓM TẮT PHIÊN DẠY" ---
            // Gom TẤT CẢ notes (text box) trên mọi trang + các câu trả lời Bút AI ĐÃ LƯU trong phiên đang
            // mở, gửi cho Groq để tổng hợp thành 1 bản tóm tắt. Cố ý dùng REF (không phải state) cho 2
            // kho dữ liệu nguồn này (allTextsRef, aiHistoryRef) vì chúng được ghi liên tục (mỗi lần gõ
            // chữ note ở BẤT KỲ trang nào, mỗi lần Bút AI trả lời) — nếu dùng state thì mỗi lần gõ 1 ký
            // tự note ở 1 trang bất kỳ sẽ làm re-render lại TOÀN BỘ App (và mọi PdfPage khác đang mount),
            // rất tốn kém. Dùng ref: chỉ ĐỌC ra đúng lúc người dùng bấm "Tóm tắt ngay". Port từ bản Night
            // IELTS Land.
            const allTextsRef = useRef({}); // { [pageNum]: [{id,text,...}] }
            const aiHistoryRef = useRef([]); // [{ scannedText, promptLabel, answer, timestamp }] — CHỈ những câu đã bấm "Lưu"
            const onPageTextsChange = useCallback((pageNum, texts) => {
                allTextsRef.current[pageNum] = texts;
            }, []);
            const onAIHistoryEntry = useCallback((entry) => {
                aiHistoryRef.current = [...aiHistoryRef.current, entry];
            }, []);
            const [showSessionSummary, setShowSessionSummary] = useState(false);
            // savedSummaries: CHỈ lưu trong phiên đang mở (state thường, KHÔNG ghi localStorage) — theo
            // đúng lựa chọn ban đầu, vì mục đích là để gộp thủ công với notes khác thành 1 bản tóm tắt
            // cuối cùng gửi học sinh NGAY trong buổi dạy đó, không cần tồn tại lâu dài qua các lần mở lại.
            const [savedSummaries, setSavedSummaries] = useState([]);

            const [showTOC, setShowTOC] = useState(false);
            // --- TÍNH NĂNG "CHỌN TRANG CỤ THỂ ĐỂ XUẤT PDF" — port từ bản Night IELTS Land, đặt lên
            // trên pipeline xuất PDF riêng của bản Chinese (pdf-lib dán đè ghi chú lên đúng trang gốc)
            // thay vì thay thế nó. tocExportMode: khi true, mở mục lục để CHỌN TRANG xuất (bấm vào ô =
            // tích chọn, không chuyển trang nữa) thay vì mở mục lục bình thường để điều hướng.
            const [tocExportMode, setTocExportMode] = useState(false);
            const [selectedExportPages, setSelectedExportPages] = useState(() => new Set());
            // Hộp thoại nhỏ hỏi "Xuất tất cả" hay "Chọn trang cụ thể" khi bấm nút "Lưu ghi chú".
            const [showExportChoice, setShowExportChoice] = useState(false);
            // Số ô mục lục đang được dựng trong modal — bắt đầu từ 1 đợt nhỏ (TOC_BATCH_SIZE), tự
            // tăng dần khi cuộn gần tới cuối (qua handleTocScroll). Xem giải thích chi tiết ở khai
            // báo TOC_BATCH_SIZE phía trên (sửa lỗi "mở mục lục file nặng tải rất lâu").
            const [tocVisibleCount, setTocVisibleCount] = useState(TOC_BATCH_SIZE);
            useEffect(() => {
                if (showTOC) setTocVisibleCount(TOC_BATCH_SIZE); // mỗi lần mở lại modal, reset về đợt đầu
            }, [showTOC]);
            // Tham chiếu tới đúng vùng cuộn nội dung PDF (không phải toàn trang) — dùng để tự tính
            // và cuộn tới đúng trang khi bấm từ mục lục, xem giải thích chi tiết ở nơi dùng bên dưới.
            const pdfContentAreaRef = useRef(null);
            // Tham chiếu tới vùng cuộn BÊN TRONG modal Mục lục — dùng để tự "tải thêm" 1 đợt ô mới
            // khi cuộn gần tới cuối, xem giải thích chi tiết ở useEffect ngay bên dưới.
            const tocScrollRef = useRef(null);
            // true trong lúc app TỰ cuộn bằng lệnh (vd bấm mục lục) — cho phép bộ khống chế tốc độ
            // cuộn bên dưới bỏ qua, không chặn nhầm cú cuộn mượt do chính app gây ra.
            const isProgrammaticScrollRef = useRef(false);

            const progScrollTimerRef = useRef(null);

            // QUAN TRỌNG — THANH ĐIỀU HƯỚNG DẠNG CHẤM DỌC (mỗi trang = 1 chấm): thêm mới theo yêu
            // cầu, có nút nhỏ để bật/tắt (mặc định ẩn, đỡ chiếm diện tích màn hình). Dùng lại đúng
            // cách tính "delta rồi scrollTo" đã dùng ổn định cho việc bấm mục lục — không đụng gì tới
            // cơ chế cuộn bằng wheel/trackpad đã sửa rất kỹ ở các bản trước, nên không có rủi ro làm
            // lại đúng mấy lỗi "nhảy trang" từng gặp. Cuộn qua thanh này CỐ TÌNH dùng behavior:'auto'
            // (tức thời, không animation) thay vì 'smooth' — giống hệt cảm giác kéo thanh cuộn thật
            // của hệ điều hành: kéo tới đâu, trang cập nhật NGAY tới đó, không có animation nào chạy
            // ngầm để mà chồng chéo/xung đột nhau khi kéo nhanh liên tục — đây chính là cách tránh
            // "giật/nhảy" khi kéo mà người dùng yêu cầu, thay vì cố gắng làm mượt bằng animation.
            const [showPageNav, setShowPageNav] = useState(false);
            const pageNavRailRef = useRef(null);
            const isDraggingNavRef = useRef(false);
            const [currentPageForNav, setCurrentPageForNav] = useState(1);

            // Cuộn thẳng tới đúng trang pageNum trong khung đọc PDF chính — dùng chung cho cả bấm
            // VÀ kéo trên thanh điều hướng dạng chấm.
            const scrollToPage = useCallback((pageNum) => {
                const container = pdfContentAreaRef.current;
                const target = document.getElementById(`pdf-page-${pageNum}`);
                if (!container || !target) return;
                const containerRect = container.getBoundingClientRect();
                const targetRect = target.getBoundingClientRect();
                const delta = targetRect.top - containerRect.top;
                isProgrammaticScrollRef.current = true;
                container.scrollTo({ top: container.scrollTop + delta - 16, behavior: 'auto' });
                clearTimeout(progScrollTimerRef.current);
                progScrollTimerRef.current = setTimeout(() => { isProgrammaticScrollRef.current = false; }, 200);
            }, []);

            // Quy đổi vị trí Y của con trỏ/ngón tay trên thanh điều hướng thành số trang tương ứng
            // (0 ở đỉnh thanh = trang 1, cuối thanh = trang cuối) rồi cuộn thẳng tới đó.
            const handleNavPointerToPage = useCallback((clientY) => {
                const rail = pageNavRailRef.current;
                if (!rail || !numPages) return;
                const rect = rail.getBoundingClientRect();
                const fraction = rect.height > 0 ? Math.max(0, Math.min(1, (clientY - rect.top) / rect.height)) : 0;
                const pageNum = Math.max(1, Math.min(numPages, Math.round(fraction * (numPages - 1)) + 1));
                scrollToPage(pageNum);
            }, [numPages, scrollToPage]);

            const handleNavPointerDown = useCallback((e) => {
                isDraggingNavRef.current = true;
                try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
                handleNavPointerToPage(e.clientY);
            }, [handleNavPointerToPage]);

            const handleNavPointerMove = useCallback((e) => {
                if (!isDraggingNavRef.current) return;
                handleNavPointerToPage(e.clientY);
            }, [handleNavPointerToPage]);

            const handleNavPointerUp = useCallback((e) => {
                isDraggingNavRef.current = false;
                try { e.target.releasePointerCapture(e.pointerId); } catch (err) {}
            }, []);

            // Theo dõi trang đang xem để tô sáng đúng chấm tương ứng trên thanh điều hướng — dùng 1
            // IntersectionObserver DUY NHẤT theo dõi TẤT CẢ khung trang, thu hẹp vùng "tính là đang
            // xem" về đúng dải giữa màn hình (rootMargin âm cả trên lẫn dưới) để chỉ 1 trang khớp tại
            // 1 thời điểm. Đây CHỈ để tô sáng (hiển thị), hoàn toàn tách biệt khỏi mọi observer khác
            // của từng PdfPage (dùng để lazy-render) — không ảnh hưởng gì tới cơ chế render/cuộn hiện có.
            useEffect(() => {
                if (!pdfDoc || !numPages) return;
                const observer = new IntersectionObserver((entries) => {
                    let best = null;
                    entries.forEach(entry => {
                        if (entry.isIntersecting && (!best || entry.intersectionRatio > best.intersectionRatio)) {
                            best = entry;
                        }
                    });
                    if (best) {
                        const match = best.target.id.match(/pdf-page-(\d+)/);
                        if (match) setCurrentPageForNav(Number(match[1]));
                    }
                }, { rootMargin: '-45% 0px -45% 0px', threshold: [0, 0.25, 0.5, 0.75, 1] });

                const els = document.querySelectorAll('[id^="pdf-page-"]');
                els.forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, [pdfDoc, numPages]);

            // --- PHỤC VỤ TÍNH NĂNG "LƯU GHI CHÚ VÀO FILE" (xem handleExportAnnotatedPdf) ---
            // originalFileRef: giữ nguyên File gốc người dùng đã chọn (không phải objectUrl) — cần
            // đọc lại byte gốc bằng file.arrayBuffer() lúc xuất, để pdf-lib mở đúng file PDF gốc rồi
            // "dán" thêm lớp ghi chú lên trên, thay vì phải render lại từ đầu (giữ nguyên chữ/hình gốc
            // sắc nét). pageRefs: map { [pageNum]: ref-instance-của-PdfPage } — mỗi PdfPage tự đăng ký
            // vào đây qua ref callback (xem JSX render danh sách trang bên dưới), để App có thể "gọi
            // vào" lấy getAnnotationSnapshot() của TỪNG trang khi xuất file.
            const originalFileRef = useRef(null);
            const pageRefs = useRef({});
            const [isExporting, setIsExporting] = useState(false);

            // QUAN TRỌNG — LỊCH SỬ sửa lỗi "lướt lùi về trang trước bị nhảy vọt": đã thử rất nhiều lớp
            // can thiệp trực tiếp vào wheel/scrollTop (giảm tốc 1 chiều, tự bù mỗi rAF, chặn hẳn wheel
            // lấy lại toàn quyền cuộn bằng tay, giới hạn từng sự kiện, rồi "ngân sách" quãng đường theo
            // từng đợt lướt) — không lớp nào dứt điểm, có lớp còn làm trải nghiệm TỆ HƠN (khựng cứng khi
            // hết ngân sách), và tất cả đều đánh đổi mất luôn quán tính (momentum) mượt mà vốn có của
            // trackpad. Đã TÌM RA ĐÚNG GỐC thật sự: không liên quan gì tới wheel/tốc độ lướt cả — do
            // canvas/spinner của PdfPage đổi qua lại bằng CSS `display: none/block` mỗi khi cuộn qua,
            // việc này làm trình duyệt tưởng có nội dung mới chèn vào Layout Tree phía trên, khiến cơ
            // chế "scroll anchoring" mặc định tự ý bù sai vị trí cuộn — đúng kiểu jump đột ngột, không
            // tăng dần. Đã sửa tận gốc bằng cách đổi `display` thành `visibility` (xem style của canvas/
            // spinner trong PdfPage) — phần tử không còn bị gỡ khỏi/chèn lại Layout Tree khi ẩn/hiện
            // nữa, nên anchoring không còn lý do gì để bù nhầm. Nhờ vậy KHÔNG CẦN can thiệp wheel bằng
            // tay nữa — bỏ hẳn useEffect chặn wheel ở đây, trả lại nguyên bản cảm giác lướt/quán tính tự
            // nhiên của trackpad/Trackpad Mac và cảm ứng iPad.

            // --- KHOÁ ZOOM (nút bật/tắt, thay cho cơ chế tự động chặn pinch-zoom trước đây vốn
            // "chưa hoạt động hiệu quả lắm" trên thực tế) — mặc định TẮT (zoom bình thường), người
            // dùng tự bấm bật khi cần viết/note để tránh lỡ tỳ tay làm phóng to/thu nhỏ ngoài ý muốn.
            const [zoomLocked, setZoomLocked] = useState(false);

            // QUAN TRỌNG — sửa lỗi "viết vài nét là bị đứng màn hình iPad" TÁI PHÁT đúng lúc bật "Khoá
            // zoom" (y hệt lỗi đã tìm ra & sửa bên bản Night IELTS Land — port lại đúng bản sửa đó):
            // 2 listener "onTouchMove" (chặn pinch 2 ngón) và "onTouchEnd" (chặn double-tap-zoom) ở
            // dưới là touchmove/touchend THÔ, gắn thẳng vào document với passive:false — trộn lẫn với
            // Pointer Events (dùng để vẽ, có setPointerCapture) cho CÙNG 1 luồng chạm bút là nguyên
            // nhân khiến bộ xử lý cảm ứng của WebKit trên iPadOS bị "kẹt" (chỉ hồi phục khi trang mất
            // rồi lấy lại focus) — và vì chỉ gắn khi zoomLocked=true, bug này đúng lúc "Khoá zoom" đang
            // BẬT, tức là ngay lúc người dùng cần viết ổn định nhất. Bỏ HẲN 2 listener touchmove/
            // touchend thô này — không thực sự cần thiết: (1) chặn pinch 2 ngón đã có "gesturestart/
            // change/end" bên dưới lo rồi (sự kiện pinch RIÊNG của Safari, không đụng luồng touch/
            // pointer dùng để vẽ nên không xung đột với bút), và (2) chặn double-tap-to-zoom vốn dĩ
            // KHÔNG CẦN THIẾT trên trang này — meta viewport đầu file đã có "width=device-width" nên
            // Safari hiện đại tự động bỏ hẳn cử chỉ double-tap-to-zoom cho trang kiểu này rồi. Giữ lại
            // ĐÚNG "gesturestart/change/end" — vẫn chặn được pinch-zoom cả trang khi 2 ngón chạm ngoài
            // vùng PDF, mà không đụng gì tới việc viết bằng Apple Pencil.
            useEffect(() => {
                if (!zoomLocked) return;

                const onGesture = (e) => { e.preventDefault(); };

                document.addEventListener('gesturestart', onGesture, { passive: false });
                document.addEventListener('gesturechange', onGesture, { passive: false });
                document.addEventListener('gestureend', onGesture, { passive: false });

                return () => {
                    document.removeEventListener('gesturestart', onGesture);
                    document.removeEventListener('gesturechange', onGesture);
                    document.removeEventListener('gestureend', onGesture);
                };
            }, [zoomLocked]);

            // --- CHẶN ZOOM TOÀN TRANG BẰNG WHEEL+CTRL (TRACKPAD PINCH TRÊN CHROME/FIREFOX) ---
            // QUAN TRỌNG — lỗi MỚI phát hiện khi chuyển hẳn sang dùng Chrome (Safari không dính): pinch 2
            // ngón trên trackpad Mac trong Chrome/Firefox KHÔNG bắn ra sự kiện "gesturestart/change/end"
            // riêng như Safari — thay vào đó trình duyệt "giả lập" thành sự kiện "wheel" bình thường
            // nhưng có kèm cờ `ctrlKey: true` (giống hệt Ctrl+lăn chuột để zoom trên Windows/Linux) rồi
            // Chrome tự ý zoom TOÀN TRANG (kể cả thanh công cụ, mục lục...) — thẻ
            // <meta viewport ... user-scalable=no> ở đầu file KHÔNG chặn được kiểu zoom này (nó chỉ chặn
            // pinch-zoom trên MÀN HÌNH CẢM ỨNG, không đụng gì tới cử chỉ trackpad kiểu desktop này).
            // Vì không có cách nào phân biệt "Ctrl + lăn chuột thật" với "pinch trackpad bị giả lập
            // thành wheel", mà trang này vốn dĩ không dùng tổ hợp Ctrl+lăn-chuột để làm việc gì khác, nên
            // preventDefault LUÔN cho MỌI sự kiện wheel có ctrlKey — bất kể "Khoá zoom" đang bật hay tắt
            // (khác với việc chặn gesture của Safari ở trên chỉ chặn khi đang khoá) — để trình duyệt
            // KHÔNG BAO GIỜ tự ý zoom toàn trang kiểu native nữa; việc có zoom được vùng PDF hay không
            // (và zoom ra sao) do effect riêng gắn trên vùng nội dung PDF ngay bên dưới tự quyết định.
            useEffect(() => {
                const onWheelBlock = (e) => {
                    if (e.ctrlKey) e.preventDefault();
                };
                document.addEventListener('wheel', onWheelBlock, { passive: false });
                return () => document.removeEventListener('wheel', onWheelBlock);
            }, []);

            // --- PHÍM TẮT CHỌN NHANH KIỂU VẼ CHO BÚT CHÌ (F = Tự do/Free-writing, L = Đường thẳng,
            // S = Hình chữ nhật) — port từ bản Night IELTS Land. Chỉ áp dụng khi ĐANG chọn bút chì
            // (tool === 'pencil') — bấm L/S lúc đang dùng bút khác thì không có tác dụng gì (tránh đổi
            // nhầm kiểu vẽ của bút chì trong khi không hề định dùng nó). QUAN TRỌNG: phải tự kiểm tra
            // xem đang gõ chữ ở đâu đó hay không (input/textarea/contentEditable, ví dụ đang gõ note
            // trong Text Box) rồi bỏ qua hoàn toàn trong trường hợp đó — nếu không, gõ chữ "l" hay "s"
            // bình thường trong 1 note sẽ vô tình bị nuốt mất thành phím tắt đổi kiểu vẽ bút chì.
            useEffect(() => {
                const onKeyDown = (e) => {
                    if (tool !== 'pencil') return;
                    const target = e.target;
                    const tag = target && target.tagName;
                    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable);
                    if (isTyping) return;
                    if (e.metaKey || e.ctrlKey || e.altKey) return;
                    const key = e.key.toLowerCase();
                    if (key === 'f') {
                        e.preventDefault();
                        setPencilShapeMode('freehand');
                    } else if (key === 'l') {
                        e.preventDefault();
                        setPencilShapeMode('line');
                    } else if (key === 's') {
                        e.preventDefault();
                        setPencilShapeMode('rect');
                    }
                };
                document.addEventListener('keydown', onKeyDown);
                return () => document.removeEventListener('keydown', onKeyDown);
            }, [tool]);

            // useCallback: giữ nguyên "địa chỉ" hàm giữa các lần render, để các PdfPage đã
            // memo hoá (React.memo) không phải render lại toàn bộ mỗi khi App có state khác
            // đổi (vd: đang gõ chữ trong 1 ô note) — giúp phản hồi nhanh & mượt hơn, nhất là
            // với sách PDF nhiều trang trên iPad.
            // Tải thêm 1 đợt ô mục lục khi cuộn gần tới cuối danh sách hiện có — xem giải thích ở
            // khai báo TOC_BATCH_SIZE. useCallback để không tạo hàm mới mỗi khi App render lại vì lý
            // do khác không liên quan tới mục lục.
            // --- PINCH 2 NGÓN TAY / WHEEL+CTRL ĐỂ PHÓNG TO-THU NHỎ NỘI DUNG PDF, NEO ĐÚNG VỊ TRÍ ĐANG
            // XEM (không "nhảy" lên đầu trang mỗi lần đổi scale) — port từ bản Night IELTS Land.
            // Ghi lại "trang nào + tỉ lệ (%) tính từ đỉnh trang đó xuống tới điểm đang neo (con trỏ/
            // điểm 2 ngón tay đang chụm khi pinch) — sau khi scale đổi xong (layout đã cập nhật), đo lại
            // vị trí THẬT của đúng trang đó (getBoundingClientRect — không đoán/tính theo tỉ lệ vì
            // margin cố định 10px/30px giữa các trang không co giãn theo scale, tính theo tỉ lệ sẽ bị
            // lệch dần khi sách nhiều trang) rồi chỉnh scrollTop sao cho điểm mốc đó vẫn nằm nguyên tại
            // vị trí đã neo trên màn hình — không còn "nhảy" đi đâu nữa.
            const zoomAnchorRef = useRef(null);
            const scaleRef = useRef(scale);
            useEffect(() => { scaleRef.current = scale; }, [scale]);
            const zoomLockedRef = useRef(zoomLocked);
            useEffect(() => { zoomLockedRef.current = zoomLocked; }, [zoomLocked]);

            const captureZoomAnchor = useCallback((anchorClientY) => {
                const container = pdfContentAreaRef.current;
                if (!container || !numPages) { zoomAnchorRef.current = null; return; }
                let target = null;
                for (let p = 1; p <= numPages; p++) {
                    const el = document.getElementById(`pdf-page-${p}`);
                    if (!el) continue;
                    const r = el.getBoundingClientRect();
                    if (anchorClientY <= r.bottom) { target = { pageNum: p, r }; break; }
                }
                if (!target) {
                    const lastEl = document.getElementById(`pdf-page-${numPages}`);
                    if (!lastEl) { zoomAnchorRef.current = null; return; }
                    target = { pageNum: numPages, r: lastEl.getBoundingClientRect() };
                }
                const fraction = target.r.height > 0 ? (anchorClientY - target.r.top) / target.r.height : 0;
                zoomAnchorRef.current = { pageNum: target.pageNum, fraction, anchorClientY };
            }, [numPages]);

            const getContentAreaCenterY = useCallback(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return 0;
                const r = container.getBoundingClientRect();
                return r.top + r.height / 2;
            }, []);

            // Chạy NGAY SAU KHI layout đã cập nhật theo scale mới (useLayoutEffect, không phải
            // useEffect thường) để tránh 1 khung hình bị "chớp" lệch vị trí trước khi kịp bù lại.
            useLayoutEffect(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return;

                // Xoá ảnh xem trước bằng CSS transform (nếu có, để lại từ lúc đang pinch — xem khối pinch
                // bên dưới) — đúng thời điểm này (ngay sau khi state scale mới đã được React ghi xong
                // kích thước THẬT vào DOM, nhưng TRƯỚC khi trình duyệt kịp vẽ khung hình kế tiếp) là lúc
                // "bàn giao" từ ảnh xem trước sang kích thước thật diễn ra trong đúng 1 nhịp, mắt thường
                // không kịp thấy sai khác. Không đụng gì nếu vốn dĩ không đang có transform nào (vd lúc
                // bấm nút +/-, không qua pinch) — gán 'none'/rỗng khi vốn đã 'none'/rỗng là vô hại.
                container.style.transform = 'none';
                container.style.transformOrigin = '';
                container.style.willChange = '';

                // QUAN TRỌNG — sửa lỗi "zoom xong nội dung nhảy lệch sang lề trái" (vẫn còn xảy ra dù đã
                // sửa lại cơ chế pinch giống hệt nút +/-%): hoá ra gốc vấn đề không nằm ở cách bắt cử chỉ
                // pinch hay cách tính scale — nút +/- VÀ pinch giờ CÙNG đi qua đúng 1 đường setScale() —
                // mà nằm ở chính CSS: vùng nội dung PDF canh giữa trang theo chiều ngang bằng flexbox
                // (`items-center`), nhưng cách canh giữa này CHỈ đáng tin cậy khi trang KHÔNG tràn khỏi
                // bề ngang container. Ngay khi trang phóng to tới mức RỘNG HƠN vùng nhìn thấy (dễ xảy ra
                // khi zoom cao), container tự đổi ngầm overflow-x thành "auto" (quy tắc CSS: 1 trục
                // overflow non-visible sẽ buộc trục còn lại cũng hết "visible") — và trình duyệt mặc
                // định lấy `scrollLeft = 0` làm điểm bắt đầu cho nội dung ĐANG được flexbox canh giữa mà
                // lại tràn ra, cắt mất phần tràn bên TRÁI thay vì tự cuộn ra đúng giữa — nhìn giống hệt
                // "nội dung nhảy sang lề trái". Bấm nút +/-% mỗi lần chỉ đổi 0.2 nên độ tràn tăng dần từ
                // từ, hiếm khi nhảy rõ; còn pinch có thể đổi scale rất nhanh trong 1 cử chỉ (từ vừa khít
                // tới tràn nhiều) nên lộ rõ hẳn — đây là lý do 2 cách bấm/pinch "nhìn" khác nhau dù cùng
                // 1 cơ chế đổi scale. Sửa TẬN GỐC: sau MỌI lần đổi scale, LUÔN tự đặt lại `scrollLeft` để
                // cuộn nội dung về đúng GIỮA theo chiều ngang — không trông chờ flexbox tự lo việc này
                // khi đã tràn nữa (khi chưa tràn, phép tính dưới đây tự ra 0, không ảnh hưởng gì).
                if (container.scrollWidth > container.clientWidth) {
                    container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
                } else {
                    container.scrollLeft = 0;
                }

                const anchor = zoomAnchorRef.current;
                if (!anchor || !container) return;
                const el = document.getElementById(`pdf-page-${anchor.pageNum}`);
                if (!el) return;
                const r = el.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                const desiredViewportY = anchor.anchorClientY - containerRect.top;
                const currentAnchorOffsetFromContainerTop = (r.top - containerRect.top) + anchor.fraction * r.height;
                const delta = currentAnchorOffsetFromContainerTop - desiredViewportY;
                if (Math.abs(delta) > 0.5) container.scrollTop = container.scrollTop + delta;
            }, [scale]);

            // --- PINCH 2 NGÓN TAY ĐỂ PHÓNG TO/THU NHỎ — CHỈ TRÊN VÙNG NỘI DUNG PDF ---
            // QUAN TRỌNG — LẦN 4, kết hợp cả 2 lần sửa trước thay vì chọn 1 trong 2 (mỗi cách chỉ giải
            // quyết được đúng 1 nửa vấn đề):
            //   • Lần 2 (CSS transform preview khi đang pinch): giải quyết đúng vụ RUNG/GIẬT khung hình
            //     (đẩy việc cho GPU compositor, không đụng React/layout trong lúc đang chụm ngón tay) —
            //     nhưng lúc BUÔNG TAY, gọi setScale() để chốt scale thật lại đi qua useLayoutEffect ở
            //     TRÊN — mà bản đó CHƯA có bước tự canh giữa lại `scrollLeft` khi trang tràn khỏi khung
            //     nhìn, nên vẫn dính đúng lỗi "nhảy lệch lề trái" (gốc rễ thật sự, xem giải thích chi
            //     tiết ở useLayoutEffect phía trên).
            //   • Lần 3 (gọi thẳng setScale() qua rAF, y hệt cơ chế nút +/-): giải quyết đúng vụ LỆCH VỊ
            //     TRÍ (luôn đi qua đúng 1 đường setScale() + useLayoutEffect nên được hưởng luôn phần sửa
            //     `scrollLeft` mới) — nhưng đổi lại, MỖI khung hình trong lúc đang pinch đều phải chạy
            //     lại 1 lượt setScale() thật (React re-render toàn bộ App + đo lại layout bằng
            //     getBoundingClientRect trong useLayoutEffect) — với máy/sách nhiều trang, riêng phần
            //     tính toán này có thể tốn hơn 1 khung hình (>16ms ở 60Hz, >8ms ở 120Hz ProMotion) khiến
            //     bị "cắt khung hình"/giật khi đang chụm, dù vị trí cuối cùng luôn đúng.
            // Sửa LẦN NÀY: dùng lại CSS transform để xem trước MƯỢT trong suốt lúc đang pinch (như lần
            // 2, không hề gọi setScale() nào trong lúc này nên không có React re-render nào để mà giật)
            // — nhưng giờ khi BUÔNG TAY (gestureend), chỉ gọi setScale() ĐÚNG 1 LẦN DUY NHẤT, và
            // useLayoutEffect phía trên ĐÃ ĐƯỢC vá thêm bước tự canh giữa `scrollLeft` (từ lần sửa lệch
            // lề trái) — nên lần chốt hạ duy nhất này giờ luôn ra đúng vị trí, không còn lệch nữa. Tóm
            // lại: mượt trong lúc kéo (transform, không đụng React) + đúng vị trí lúc buông tay (chỉ 1
            // lần setScale() duy nhất, hưởng trọn vẹn useLayoutEffect đã sửa đúng).
            // KHÔNG đụng tới thẻ <meta viewport> (vẫn giữ user-scalable=no như cũ) — nhờ vậy pinch ở bất
            // kỳ đâu KHÁC vùng nội dung PDF (thanh công cụ, mục lục, các nút bấm...) hoàn toàn không bị
            // ảnh hưởng. Tôn trọng luôn nút "Khoá zoom" đã có sẵn: khi đang khoá thì pinch cũng không
            // đổi scale (đúng như ý nghĩa của việc khoá).
            useEffect(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return;
                let pinching = false;
                let pinchStartScale = 1;
                // Toạ độ gốc (CHƯA áp transform) của vùng nội dung PDF, đo đúng 1 lần lúc bắt đầu chụm —
                // dùng lại toạ độ này trong suốt cả cử chỉ để tính "gốc phóng to" cục bộ, vì lúc đang
                // preview bằng transform thì getBoundingClientRect() sẽ trả về toạ độ ĐÃ scale, gọi lại
                // giữa chừng sẽ tính sai. Container không cuộn dọc/đổi layout trong lúc preview (chỉ đổi
                // transform) nên toạ độ gốc này không đổi suốt cả cử chỉ.
                let startRect = null;

                const onGestureStart = (e) => {
                    e.preventDefault();
                    if (zoomLockedRef.current) return;
                    pinching = true;
                    pinchStartScale = scaleRef.current;
                    startRect = container.getBoundingClientRect();
                    captureZoomAnchor(e.clientY);
                    // Gốc phóng to CỐ ĐỊNH "50%" theo chiều ngang (khớp với việc trang luôn canh giữa
                    // theo layout thật, kể cả khi tràn — xem useLayoutEffect phía trên), CHỈ riêng chiều
                    // dọc là theo đúng vị trí ngón tay (khớp với neo dọc đã có).
                    container.style.transformOrigin = '50% ' + (e.clientY - startRect.top) + 'px';
                    // Báo trước cho trình duyệt "sắp đổi transform liên tục" để nó promote vùng này thành
                    // 1 compositing layer riêng NGAY TỪ ĐẦU, tránh 1 nhịp giật lúc mới bắt đầu chụm.
                    container.style.willChange = 'transform';
                };
                const onGestureChange = (e) => {
                    e.preventDefault();
                    if (!pinching || zoomLockedRef.current) return;
                    // Cập nhật lại điểm neo dọc + gốc phóng to dọc theo vị trí ngón tay HIỆN TẠI (tay
                    // người dùng thường trôi dần trong lúc pinch) — CHỈ để phục vụ hiển thị xem trước và
                    // chuẩn bị sẵn điểm neo, KHÔNG hề gọi setScale()/đụng React ở đây nên không rung.
                    if (startRect) {
                        container.style.transformOrigin = '50% ' + (e.clientY - startRect.top) + 'px';
                    }
                    captureZoomAnchor(e.clientY);
                    container.style.transform = 'scale(' + e.scale + ')';
                };
                const onGestureEnd = (e) => {
                    e.preventDefault();
                    if (!pinching) return;
                    pinching = false;
                    // Chốt lại điểm neo + scale thật ĐÚNG 1 LẦN DUY NHẤT bằng giá trị cuối cùng lúc buông
                    // tay — KHÔNG tự xoá transform CSS ở đây, cố ý để nguyên cho tới khi useLayoutEffect
                    // (chạy ngay sau khi state scale mới đã áp dụng xong vào DOM) tự xoá đúng lúc, tránh
                    // 1 khung hình bị "giật lùi" thoáng qua giữa ảnh xem trước và kích thước thật.
                    captureZoomAnchor(e.clientY);
                    const finalScale = Math.max(0.5, Math.min(3, pinchStartScale * e.scale));
                    setScale(finalScale);
                };

                container.addEventListener('gesturestart', onGestureStart, { passive: false });
                container.addEventListener('gesturechange', onGestureChange, { passive: false });
                container.addEventListener('gestureend', onGestureEnd, { passive: false });
                return () => {
                    container.removeEventListener('gesturestart', onGestureStart);
                    container.removeEventListener('gesturechange', onGestureChange);
                    container.removeEventListener('gestureend', onGestureEnd);
                };
            }, [captureZoomAnchor]);

            // --- PHÓNG TO/THU NHỎ BẰNG WHEEL+CTRL TRÊN VÙNG NỘI DUNG PDF (TRACKPAD CHROME/FIREFOX) ---
            // Bản dành riêng cho Chrome/Firefox — mirror lại đúng cơ chế "xem trước bằng CSS transform,
            // chốt scale thật đúng 1 lần lúc kết thúc cử chỉ" của khối pinch Safari ngay phía trên, chỉ
            // khác ở chỗ: sự kiện "wheel" không có điểm "kết thúc" rõ ràng như "gestureend" của Safari,
            // nên phải tự đoán lúc nào cử chỉ đã dừng bằng cách đặt hẹn giờ (debounce) — hết một khoảng
            // lặng ngắn (~150ms) không có thêm sự kiện wheel+ctrlKey nào nữa thì coi như đã buông tay,
            // chốt setScale() đúng 1 lần duy nhất (hưởng trọn useLayoutEffect canh giữa/neo vị trí ở
            // trên, giống hệt đường đi của nút +/-% và của pinch Safari).
            // Không phân biệt được "pinch trackpad" với "Ctrl+lăn chuột chuột thật" (cùng ra 1 kiểu sự
            // kiện) — nhưng trang này vốn không dùng Ctrl+lăn-chuột để làm gì khác nên cho zoom nội dung
            // luôn trong cả 2 trường hợp là hợp lý (đúng như kỳ vọng thông thường của người dùng).
            useEffect(() => {
                const container = pdfContentAreaRef.current;
                if (!container) return;
                let pinching = false;
                let pinchStartScale = 1;
                let currentScale = 1;
                let startRect = null;
                let endTimer = null;

                const commitEnd = (clientY) => {
                    pinching = false;
                    captureZoomAnchor(clientY);
                    const finalScale = Math.max(0.5, Math.min(3, currentScale));
                    setScale(finalScale);
                };

                const onWheel = (e) => {
                    if (!e.ctrlKey) return;
                    e.preventDefault();
                    if (zoomLockedRef.current) return;

                    if (!pinching) {
                        pinching = true;
                        pinchStartScale = scaleRef.current;
                        currentScale = pinchStartScale;
                        startRect = container.getBoundingClientRect();
                        captureZoomAnchor(e.clientY);
                        container.style.transformOrigin = '50% ' + (e.clientY - startRect.top) + 'px';
                        container.style.willChange = 'transform';
                    }

                    // deltaY < 0 (chụm 2 ngón ra xa nhau / cuộn "lên") -> Chrome giả lập thành zoom in;
                    // deltaY > 0 -> zoom out. Hệ số 0.01 cho tốc độ zoom vừa phải, dễ kiểm soát bằng
                    // trackpad, tương tự các thư viện bản đồ/canvas quen thuộc dùng cùng công thức này.
                    const factor = Math.exp(-e.deltaY * 0.01);
                    currentScale = Math.max(0.5, Math.min(3, currentScale * factor));

                    if (startRect) {
                        container.style.transformOrigin = '50% ' + (e.clientY - startRect.top) + 'px';
                    }
                    captureZoomAnchor(e.clientY);
                    container.style.transform = 'scale(' + (currentScale / pinchStartScale) + ')';

                    if (endTimer) clearTimeout(endTimer);
                    const clientY = e.clientY;
                    endTimer = setTimeout(() => { commitEnd(clientY); }, 150);
                };

                container.addEventListener('wheel', onWheel, { passive: false });
                return () => {
                    container.removeEventListener('wheel', onWheel);
                    if (endTimer) clearTimeout(endTimer);
                };
            }, [captureZoomAnchor]);

            const handleTocLoadMore = useCallback(() => {
                setTocVisibleCount(c => Math.min(numPages, c + TOC_BATCH_SIZE));
            }, [numPages]);

            // QUAN TRỌNG — sửa lỗi "mở mục lục file lớn thì nhiều trang không hiện": cách cũ dùng 1
            // IntersectionObserver quan sát 1 ô "sentinel" ở cuối danh sách, chỉ bắn callback khi ô đó
            // CHUYỂN TRẠNG THÁI (từ ngoài màn hình vào trong hoặc ngược lại). Với modal cao/vùng đệm
            // rootMargin rộng, sau khi tải thêm 1 đợt, sentinel có thể vẫn tiếp tục nằm trong vùng
            // "đang giao nhau" — tức KHÔNG hề chuyển trạng thái — nên callback không bắn lại nữa, và
            // việc tải thêm bị "kẹt" mãi ở đó dù người dùng vẫn đang cuộn, khiến các trang phía sau
            // không bao giờ được tải. Giờ chuyển sang cách chắc chắn hơn: theo dõi trực tiếp vị trí
            // cuộn (onScroll) và so sánh còn cách đáy bao xa — kiểm tra lại MỖI lần cuộn, không phụ
            // thuộc việc "chuyển trạng thái" nên không thể bị kẹt. Thêm 1 effect tự tải thêm ngay cả
            // khi CHƯA cuộn (vd: file ít trang hơn 1 màn hình, hoặc màn hình rất to) — vì lúc đó modal
            // không đủ nội dung để tạo ra sự kiện cuộn nào cả.
            useEffect(() => {
                if (!showTOC) return;
                const el = tocScrollRef.current;
                if (!el) return;
                if (tocVisibleCount < numPages && el.scrollHeight <= el.clientHeight + 200) {
                    handleTocLoadMore();
                }
            }, [showTOC, tocVisibleCount, numPages, handleTocLoadMore]);

            const handleTocScroll = useCallback((e) => {
                const el = e.target;
                if (el.scrollHeight - el.scrollTop - el.clientHeight < 800) {
                    handleTocLoadMore();
                }
            }, [handleTocLoadMore]);

            const handleFileUpload = useCallback((e) => {
                const file = e.target.files[0];
                if (file && file.type === "application/pdf") {
                    originalFileRef.current = file; // giữ lại File gốc — dùng khi xuất file có ghi chú
                    pageRefs.current = {}; // file mới -> danh sách ref trang cũ (nếu có) không còn hợp lệ
                    const objectUrl = URL.createObjectURL(file);
                    setPdfUrl(objectUrl);
                    setBasePageSize(null);
                    pdfjsLib.getDocument(objectUrl).promise.then(loadedPdf => {
                        setPdfDoc(loadedPdf);
                        setNumPages(loadedPdf.numPages);
                        // Lấy kích thước thật (scale 1) của trang đầu tiên — chỉ đọc thông tin trang,
                        // KHÔNG rasterize/render nên rất nhẹ — dùng làm placeholder chung cho mọi trang
                        // (xem giải thích chi tiết ở khai báo basePageSize phía trên).
                        loadedPdf.getPage(1).then(page => {
                            const vp = page.getViewport({ scale: 1 });
                            setBasePageSize({ width: vp.width, height: vp.height });
                        }).catch(err => {});
                    }).catch(err => alert("Lỗi khi mở file."));
                }
            }, []);

            // --- LƯU GHI CHÚ VÀO FILE (xuất PDF gốc + toàn bộ nét vẽ/note đã dán đè lên đúng vị trí) ---
            // GIỚI HẠN QUAN TRỌNG cần hiểu trước khi đọc code bên dưới: Safari/iPadOS (khác hẳn 1 app
            // "native" thật sự) KHÔNG có File System Access API — không website/web app nào trên iPad
            // có thể tự ý ghi đè thẳng vào ĐÚNG file gốc trong Files mà không cần người dùng thao tác
            // gì, đây là giới hạn bảo mật của chính hệ điều hành/trình duyệt, không phải app này thiếu
            // tính năng. Cách TỐT NHẤT có thể làm trên iPad: xuất ra 1 bản PDF mới (giữ nguyên chữ/hình
            // trang gốc sắc nét — chỉ CHÈN THÊM 1 lớp ảnh trong suốt chứa nét vẽ/note lên trên, không
            // rasterize lại từ đầu), đặt ĐÚNG TÊN file gốc, rồi mở thẳng bảng "Chia sẻ" (Web Share API)
            // — trong đó bấm "Lưu vào Files", chọn lại đúng thư mục đang chứa file gốc, iOS sẽ tự hỏi
            // "Thay thế?" vì trùng tên; bấm Thay thế coi như đã "ghi đè" file gốc thành công (chỉ tốn
            // thêm vài thao tác chạm, không thể làm hoàn toàn tự động/im lặng được). Trên máy tính
            // (không có Share Sheet, vd Mac/Windows) sẽ tự động tải file mới xuống như bình thường.
            // pagesToInclude: mảng số trang (1-based) muốn GIỮ LẠI trong file xuất ra — port tính năng
            // "chọn trang cụ thể" từ bản Night IELTS Land, áp dụng lên pipeline pdf-lib overlay riêng
            // của bản Chinese thay vì thay thế nó. undefined/null hoặc đủ hết numPages trang = xuất
            // toàn bộ (hành vi cũ, không đổi).
            const handleExportAnnotatedPdf = useCallback(async (pagesToInclude) => {
                if (!originalFileRef.current || !numPages || isExporting) return;
                if (!window.PDFLib) {
                    alert("Không tải được thư viện xử lý PDF (pdf-lib) — kiểm tra lại kết nối mạng rồi thử lại.");
                    return;
                }
                setIsExporting(true);
                try {
                    const arrayBuffer = await originalFileRef.current.arrayBuffer();
                    // ignoreEncryption: một số file PDF quét/tải về có đặt hạn chế in ấn/chỉnh sửa
                    // (nhưng vẫn xem/đọc bình thường) — nếu không có cờ này, pdf-lib sẽ từ chối mở
                    // thẳng những file đó. Bản xuất ra sẽ không giữ lại hạn chế gốc (chấp nhận được,
                    // vì đây là file ghi chú cá nhân của người dùng).
                    const pdfLibDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
                    const pdfLibPages = pdfLibDoc.getPages();

                    for (let i = 1; i <= numPages; i++) {
                        const pageApi = pageRefs.current[i];
                        const snap = pageApi && pageApi.getAnnotationSnapshot && pageApi.getAnnotationSnapshot();
                        if (!snap) continue; // trang "sạch" (không note gì) hoặc chưa từng render — giữ nguyên, khỏi tốn công

                        const pdfLibPage = pdfLibPages[i - 1];
                        if (!pdfLibPage) continue;

                        const pngBytes = await (await fetch(snap.dataUrl)).arrayBuffer();
                        const pngImage = await pdfLibDoc.embedPng(pngBytes);
                        const { width: pw, height: ph } = pdfLibPage.getSize();
                        // Ảnh nền TRONG SUỐT (chỉ có nét vẽ/chữ note) dán đè full khung trang — phần
                        // không vẽ gì vẫn để lộ nguyên nội dung trang gốc bên dưới, không mất chi tiết.
                        pdfLibPage.drawImage(pngImage, { x: 0, y: 0, width: pw, height: ph });
                    }

                    // Nếu chỉ xuất một số trang cụ thể: xoá các trang KHÔNG được chọn khỏi tài liệu SAU
                    // KHI đã dán xong ghi chú lên đúng trang gốc — xoá theo thứ tự GIẢM DẦN để chỉ số
                    // các trang phía trước chưa xoá không bị lệch đi giữa chừng.
                    if (Array.isArray(pagesToInclude) && pagesToInclude.length > 0 && pagesToInclude.length < numPages) {
                        const keepSet = new Set(pagesToInclude);
                        for (let i = numPages; i >= 1; i--) {
                            if (!keepSet.has(i)) pdfLibDoc.removePage(i - 1);
                        }
                    }

                    const outBytes = await pdfLibDoc.save();
                    const blob = new Blob([outBytes], { type: 'application/pdf' });
                    const fileName = originalFileRef.current.name || 'tai-lieu-da-ghi-chu.pdf';

                    let shared = false;
                    try {
                        const outFile = new File([blob], fileName, { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [outFile] })) {
                            await navigator.share({ files: [outFile], title: fileName });
                            shared = true;
                        }
                    } catch (shareErr) {
                        // Người dùng bấm Huỷ trên bảng Chia sẻ (AbortError) — coi là bình thường, không
                        // báo lỗi gì thêm. Các lỗi khác thì rơi xuống tải file thông thường bên dưới.
                        if (shareErr && shareErr.name === 'AbortError') { shared = true; }
                    }

                    if (!shared) {
                        // Máy tính / trình duyệt không hỗ trợ chia sẻ file (vd Chrome/Firefox trên máy
                        // tính) — tải file mới xuống như bình thường, người dùng tự chuyển vào đúng chỗ.
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 30000);
                    }
                } catch (err) {
                    console.error('Lỗi xuất PDF đã ghi chú:', err);
                    alert("Không xuất được file PDF đã ghi chú. Vui lòng thử lại.");
                } finally {
                    setIsExporting(false);
                }
            }, [numPages, isExporting]);

            // 4 hàm điều khiển "Xuất tất cả" / "Chọn trang cụ thể" — port từ bản Night IELTS Land.
            const handleExportAll = useCallback(() => {
                setShowExportChoice(false);
                handleExportAnnotatedPdf();
            }, [handleExportAnnotatedPdf]);

            const handleOpenExportPicker = useCallback(() => {
                setShowExportChoice(false);
                setSelectedExportPages(new Set());
                setTocExportMode(true);
                setShowTOC(true);
            }, []);

            const toggleExportPageSelected = useCallback((pageNum) => {
                setSelectedExportPages(prev => {
                    const next = new Set(prev);
                    if (next.has(pageNum)) next.delete(pageNum); else next.add(pageNum);
                    return next;
                });
            }, []);

            const handleConfirmExportSelected = useCallback(() => {
                const sorted = Array.from(selectedExportPages).sort((a, b) => a - b);
                if (sorted.length === 0) return;
                setTocExportMode(false);
                setShowTOC(false);
                handleExportAnnotatedPdf(sorted);
            }, [selectedExportPages, handleExportAnnotatedPdf]);

            const onExtractText = useCallback((text, processing) => {
                setMagicText(text);
                setIsOcrProcessing(processing);
                // Bắt đầu 1 lượt quét mới (processing=true, text rỗng) -> dọn box IPA cũ để
                // không hiển thị nhầm thông tin của từ trước đó trong lúc đang chờ kết quả mới.
                if (processing) setIpaInfo(null);
            }, []);

            // Tra pinyin + nghĩa cho bút Pinyin — chạy song song, không chặn luồng dịch/đọc.
            const onIPALookup = useCallback(async (text) => {
                setIpaInfo({ word: '', pinyin: '', definition: '', error: '', loading: true });
                const info = await fetchIPAInfo(text);
                setIpaInfo({ ...info, loading: false });
            }, []);

            // Luôn hiện panel "Mở ảnh trên Google" khi quét được chữ — không phụ thuộc việc popup
            // tự động có bị trình duyệt chặn hay không (xem giải thích ở openPhotoLookupWindow).
            const onPhotoLookup = useCallback((text) => {
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setPhotoLookup(null);
                    return;
                }
                setPhotoLookup({ text: clean });
            }, []);

            // Bút AI: theo đúng dạng "onExtractText(text, processing)" đã quen thuộc trong app — gọi
            // với processing=true ngay khi bắt đầu OCR (hiện spinner "Đang quét chữ..." trong Box Bút
            // AI), rồi gọi lại với processing=false kèm text thật khi xong. Port từ bản Night IELTS Land.
            const onAILookup = useCallback((text, processing) => {
                if (processing) { setAiLookup({ text: '', ocrLoading: true }); return; }
                const clean = (text || '').trim();
                if (!clean || clean === "Không tìm thấy chữ trong vùng chọn." || clean === "Lỗi nhận diện chữ.") {
                    setAiLookup(null);
                    return;
                }
                setAiLookup({ text: clean, ocrLoading: false });
            }, []);

            return (
                <div
                    className="flex h-screen w-full font-sans bg-slate-100 overflow-hidden"
                >
                    {/* Box dịch + box IPA — theo yêu cầu, box IPA giờ nằm CHÍNH GIỮA, ngay bên DƯỚI box
                        dịch (trước đây box IPA nằm tách riêng bên cạnh mép trái). Gộp cả 2 vào chung
                        1 khung bọc ngoài, xếp cột dọc (flex-col) + canh giữa ngang (items-center):
                        khung bọc mới là nơi DUY NHẤT giữ vị trí "fixed, canh giữa màn hình, cách đỉnh
                        24" — bản thân MagicTranslationBar không còn tự định vị fixed nữa (xem sửa ở
                        component đó), nên xếp thành cột tự nhiên, khoảng cách luôn đúng dù box dịch cao
                        hay thấp (không cần tính toán offset thủ công như cách "bám mép trái" cũ). */}
                    {(magicText || isOcrProcessing) && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] w-[90%] max-w-3xl flex flex-col items-center gap-3 animate-slide-down">
                            <MagicTranslationBar text={magicText} isProcessing={isOcrProcessing} onClose={() => { setMagicText(""); setIsOcrProcessing(false); setIpaInfo(null); }} />
                            {ipaInfo && (
                                <div className="hidden sm:block animate-slide-down-y">
                                    <IPAPanel info={ipaInfo} onClose={() => setIpaInfo(null)} />
                                </div>
                            )}
                        </div>
                    )}

                    {/* Thông báo/nút mở kết quả ảnh minh hoạ cho bút Tra ảnh — luôn hiện ra khi có
                        chữ vừa quét, để KHÔNG phụ thuộc vào việc trình duyệt có chặn popup hay không:
                        bấm nút là mở tab/cửa sổ Google Hình ảnh thật, chắc chắn không bị chặn vì đó
                        là 1 cú bấm chuột/chạm thật của người dùng. */}
                    {photoLookup && (
                        <div className="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-[100] glass-panel rounded-2xl shadow-2xl border-2 border-rose-100 px-5 py-3 flex items-center gap-4 animate-slide-down max-w-[92%]">
                            <i className="fas fa-images text-rose-500 text-xl shrink-0"></i>
                            <div className="min-w-0">
                                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Đã quét được</p>
                                <p className="text-sm font-bold text-slate-800 truncate max-w-[220px]">{photoLookup.text}</p>
                            </div>
                            <button
                                onClick={() => { window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(photoLookup.text), '_blank'); }}
                                className="shrink-0 px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-sm font-bold transition-all active:scale-95 flex items-center gap-2 shadow-md shadow-rose-200"
                            >
                                <i className="fas fa-up-right-from-square"></i> Mở ảnh trên Google
                            </button>
                            <button onClick={() => setPhotoLookup(null)} className="shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors bg-white border border-slate-200">
                                <i className="fas fa-times text-xs"></i>
                            </button>
                        </div>
                    )}

                    {/* Box Bút AI — hiện chữ vừa quét + các nút prompt có sẵn (Groq). Đặt cùng vị trí
                        canh giữa/cách đỉnh với box dịch của bút Magic, vì cũng là 1 kết quả OCR hiện
                        ngay sau khi quét — nhưng KHÔNG lồng chung khung với box dịch (2 bút độc lập,
                        không bao giờ cùng hiện 1 lúc vì chỉ 1 tool đang được chọn tại 1 thời điểm). Port
                        từ bản Night IELTS Land. */}
                    {aiLookup && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-[100] w-[90%] max-w-xl animate-slide-down">
                            <AIPanel info={aiLookup} apiKey={aiApiKey} onClose={() => setAiLookup(null)} onOpenSettings={openAiSettings} onAnswered={onAIHistoryEntry} />
                        </div>
                    )}

                    {/* TRÌNH PHÁT FILE ÂM THANH NỔI — key={audioSrc} để mỗi lần chọn file KHÁC sẽ tự
                        unmount/mount lại 1 component hoàn toàn mới (tự reset sạch mọi state phát/zoom/
                        vị trí kéo-thả cũ), không cần tự tay reset từng state một trong AudioPlayerBar.
                        Port từ bản Night IELTS Land. */}
                    {audioSrc && (
                        <AudioPlayerBar key={audioSrc} src={audioSrc} fileName={audioFileName} onClose={handleCloseAudioPlayer} />
                    )}

                    {/* Modal cảnh báo 1 LẦN DUY NHẤT trước khi thật sự bấm chia sẻ âm thanh máy tính —
                        xem SYSTEM_AUDIO_WARNING_KEY/handleClickAddTabAudio. Lý do cần cảnh báo trước: lần
                        đầu dùng trên Mac, macOS có thể tự hiện hộp thoại xin quyền "Screen & System Audio
                        Recording" cho Chrome — quyền này cần KHỞI ĐỘNG LẠI hẳn trình duyệt mới có hiệu
                        lực (macOS yêu cầu, không phải Chrome hay app này cố ý), khiến trang có thể trông
                        như "đứng hình 1 lúc rồi mất luôn" đúng như người dùng mô tả — về bản chất là Chrome
                        đang tự đóng/mở lại, không phải app bị lỗi/crash. */}
                    {showSystemAudioWarning && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-center justify-center p-4" onClick={() => setShowSystemAudioWarning(false)}>
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-6 space-y-4 animate-modal-pop" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between">
                                    <h3 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                                        <i className="fas fa-triangle-exclamation text-amber-500"></i> Lưu ý trước khi chia sẻ
                                    </h3>
                                    <button onClick={() => setShowSystemAudioWarning(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-red-500 hover:text-white flex items-center justify-center transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    Nếu đây là LẦN ĐẦU dùng tính năng này trên máy Mac này, hệ điều hành có thể tự hiện thêm 1 hộp thoại xin cấp quyền "Screen &amp; System Audio Recording" cho Chrome. Sau khi cấp quyền đó, <strong>macOS thường bắt Chrome phải khởi động lại</strong> mới dùng được — lúc đó trang sẽ trông như đứng hình 1 lúc rồi biến mất, đây là điều bình thường (Chrome tự tắt/mở lại), không phải app bị lỗi.
                                </p>
                                <p className="text-sm text-rose-600 font-semibold leading-relaxed bg-rose-50 border border-rose-100 rounded-xl px-3 py-2">
                                    Chrome khởi động lại sẽ làm MẤT mọi ghi chú/nét vẽ chưa xuất PDF trong phiên đang mở! Nên xuất PDF lưu lại trước khi thử tính năng này lần đầu.
                                </p>
                                <p className="text-xs text-slate-400 leading-relaxed">
                                    Cách tránh gián đoạn giữa buổi dạy: vào System Settings → Privacy &amp; Security → Screen &amp; System Audio Recording, bật sẵn quyền cho Chrome rồi khởi động lại Chrome MỘT LẦN trước khi bắt đầu dạy — các lần dùng sau sẽ không còn hộp thoại này nữa.
                                </p>
                                <button
                                    onClick={() => {
                                        try { localStorage.setItem(SYSTEM_AUDIO_WARNING_KEY, '1'); } catch (e) {}
                                        setShowSystemAudioWarning(false);
                                        addTabAudioToSubtitles();
                                    }}
                                    className="w-full px-4 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-bold transition-all active:scale-95"
                                >
                                    Đã hiểu, tiếp tục chia sẻ
                                </button>
                            </div>
                        </div>
                    )}

                    {/* THANH PHỤ ĐỀ TRỰC TIẾP (Live Subtitles) — cố định dưới cùng màn hình, phủ hết
                        chiều ngang, giống kiểu phụ đề của YouTube/Google Meet. Luôn hiện ra ngay khi bấm
                        nút bật (subtitleActive), kể cả lúc đang lỗi/đang xin quyền micro, để người dùng
                        luôn thấy phản hồi trạng thái thay vì tưởng nút không hoạt động. */}
                    {subtitleActive && (
                        <div className="fixed bottom-0 left-0 right-0 z-[250] bg-black/85 backdrop-blur-sm text-white px-4 sm:px-8 py-4 flex items-center gap-3 sm:gap-5 shadow-[0_-4px_24px_rgba(0,0,0,0.3)] animate-fade-in">
                            <div className="flex flex-col items-center gap-1 shrink-0 w-16 sm:w-20">
                                <span className={"w-3 h-3 rounded-full " + (subtitleStatus === 'error' ? 'bg-red-500' : (subtitleStatus === 'paused' ? 'bg-amber-400' : 'bg-emerald-400 animate-pulse'))}></span>
                                <span className="text-[10px] font-bold uppercase tracking-wide text-slate-300 text-center leading-tight">
                                    {subtitleStatus === 'error' ? 'Lỗi' : (subtitleStatus === 'paused' ? 'Tạm dừng' : 'Đang nghe')}
                                </span>
                            </div>
                            <div className="flex-1 min-w-0 text-center">
                                {subtitleStatus === 'error' && subtitleError ? (
                                    <button onClick={openAiSettings} className="text-sm sm:text-base font-bold text-rose-300 hover:text-rose-200 underline decoration-dotted">
                                        {subtitleError}
                                    </button>
                                ) : (
                                    <React.Fragment>
                                        {subtitleLines.length === 0 && !subtitleInterimText && (
                                            <p className={"text-sm italic " + (subtitleSilenceHint ? 'text-amber-300 font-semibold not-italic' : 'text-slate-400')}>
                                                {subtitleStatus === 'paused'
                                                    ? 'Đã tạm dừng — bấm nút mic để nghe tiếp, phụ đề vẫn được giữ nguyên.'
                                                    : (subtitleSilenceHint || 'Đang chờ giọng nói...')}
                                            </p>
                                        )}
                                        {subtitleLines.map((line, i) => (
                                            <p
                                                key={line.id}
                                                className={"font-bold leading-snug transition-opacity " + ((i === subtitleLines.length - 1 && !subtitleInterimText) ? 'opacity-100 text-lg sm:text-xl' : 'opacity-45 text-sm sm:text-base')}
                                            >
                                                {line.text}
                                            </p>
                                        ))}
                                        {/* Dòng "đang gõ dở" — chỉ có ở động cơ 'speech', cập nhật theo thời gian thực
                                            từng chữ một lúc đang nói, tô màu khác để phân biệt với dòng đã chốt. */}
                                        {subtitleInterimText && (
                                            <p className="font-bold leading-snug text-lg sm:text-xl text-sky-300">
                                                {subtitleInterimText}
