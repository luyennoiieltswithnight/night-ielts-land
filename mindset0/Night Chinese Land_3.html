    <style>
        html, body {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, sans-serif;
            background-color: #F1F5F9;
            overflow: hidden;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            /* Bỏ hiệu ứng chớp xám khi chạm trên iPad/Safari + tránh double-tap-zoom trễ 300ms */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        * { font-family: inherit; }

        /* Vùng nội dung PDF/dịch vẫn cho phép bôi đen & copy chữ bình thường */
        .pdf-page-container, .pdf-page-container *,
        .glass-panel, .glass-panel * {
            -webkit-touch-callout: default;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #A7F3D0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6EE7B7; }

        button, [role="button"], input[type="file"] + label, label.cursor-pointer {
            touch-action: manipulation;
        }
        button:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid #34D399;
            outline-offset: 2px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.15), 0 8px 15px -6px rgba(0, 0, 0, 0.1);
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin: 10px auto 30px auto;
            background: white;
            border-radius: 12px;
            /* Không dùng will-change:transform cố định trên mọi trang: với PDF dài,
               mỗi trang sẽ chiếm 1 lớp GPU riêng vĩnh viễn dù đang cuộn xa khỏi màn hình,
               gây ngốn bộ nhớ và là nguyên nhân chính khiến iPad bị đơ/đứng hình sau một lúc dùng. */
            contain: layout style;
            /* GHI CHÚ: từng thử tắt hẳn "scroll anchoring" (overflow-anchor: none) ở đây, nhưng thực
               tế lại làm cuộn TỆ HƠN — bị nhảy ở CẢ 2 HƯỚNG thay vì chỉ 1 hướng như trước. Điều đó cho
               thấy cơ chế anchoring mặc định của trình duyệt vốn đang ÂM THẦM bù lại 1 sự thay đổi nội
               dung/kích thước thật nào đó phía trên vị trí đang xem — tắt nó đi chỉ làm lộ rõ hẳn cú
               nhảy ra thay vì sửa được gốc. Đã revert lại về mặc định (auto) — xem PdfPage để biết
               cách sửa TẬN GỐC (không còn thay đổi cấu trúc DOM khi cuộn nữa) thay vì tắt anchoring. */
        }

        /* width/height 100%: canvas LUÔN lấp đầy đúng khung .pdf-page-container (nay có kích thước
           CỐ ĐỊNH ngay từ đầu — xem basePageSize trong component App) bất kể độ phân giải pixel thật
           bên trong canvas là bao nhiêu — tránh trường hợp hiếm 1 trang có kích thước khác các trang
           còn lại làm canvas tràn ra ngoài khung. getCoordinates() trong PdfPage đã tự quy đổi toạ độ
           theo tỉ lệ canvas.width/rect.width nên toạ độ vẽ vẫn chính xác dù canvas co giãn theo CSS. */
        .pdf-canvas { display: block; border-radius: 12px; width: 100%; height: 100%; }

        .draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            /* GIỮ "auto" cố định — KHÔNG đổi thành "none" theo isDrawingMode. Đã thử "none" nhưng
               touch-action là thuộc tính CSS thuần, không phân biệt được ngón tay hay Apple Pencil,
               nên chặn cứng luôn cả việc cuộn trang bằng ngón tay (dùng "none" làm hỏng tính năng
               "ngón tay để cuộn, bút để viết, tỳ tay không bị nhận nhầm nét vẽ"). Việc chặn Safari tự
               cuộn/zoom riêng khi CHỈ có Apple Pencil chạm (không chặn khi là ngón tay) phải xử lý
               bằng JS phân biệt theo touchType — xem preventTouchScroll trong component PdfPage.
            */
            touch-action: auto;
            z-index: 10;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px) scale(0.98); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        /* QUAN TRỌNG — .animate-slide-down bên dưới CỐ TÌNH bake sẵn translateX(-50%) vào animation,
           vì trước đây class này chỉ dùng cho các khung ĐANG tự canh giữa bằng `left-1/2
           transform -translate-x-1/2` — animation sẽ THAY THẾ hẳn giá trị transform tĩnh đó (không
           cộng dồn), nên phải tự bake lại -50% vào trong keyframe để không mất canh giữa lúc chạy
           animation. Hệ quả: nếu lỡ gắn class này cho 1 khung KHÔNG tự canh giữa kiểu đó (vd nằm
           trong flex-col bình thường), nó sẽ bị lệch trái oan uổng đúng 50% bề rộng của chính nó. */
        .animate-slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Bản KHÔNG bake sẵn dịch ngang — dùng cho khung chỉ cần hiệu ứng trượt xuống dọc, không tự
           canh giữa bằng left-1/2/-translate-x-1/2 (vd nằm trong 1 flex-col cha lo canh giữa sẵn). */
        @keyframes slideDownY {
            from { opacity: 0; transform: translateY(-20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-slide-down-y { animation: slideDownY 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-modal-pop { animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-gentle-bounce { animation: gentleBounce 1.6s ease-in-out infinite; }

        /* --- Định dạng câu trả lời Markdown của Bút AI (Groq) --- */
        /* QUAN TRỌNG: Tailwind bản Play CDN đang dùng KHÔNG có sẵn plugin "typography" (class
           "prose"), nên phải tự viết CSS style cho HTML do marked.js sinh ra (từ Markdown AI trả
           về: tiêu đề ###, bảng, gạch đầu dòng, in đậm, blockquote, hr...) — nếu không sẽ hiện ra
           đúng ngữ nghĩa HTML nhưng xấu/rối (bảng không viền, heading không rõ cấp bậc...). */
        .ai-markdown { font-size: 0.875rem; line-height: 1.6; color: #1e293b; }
        .ai-markdown > *:first-child { margin-top: 0; }
        .ai-markdown > *:last-child { margin-bottom: 0; }
        .ai-markdown h1, .ai-markdown h2, .ai-markdown h3, .ai-markdown h4 {
            font-weight: 800; color: #0f172a; margin: 1em 0 0.4em;
        }
        .ai-markdown h1 { font-size: 1.15rem; }
        .ai-markdown h2 { font-size: 1.08rem; }
        .ai-markdown h3 { font-size: 1rem; }
        .ai-markdown h4 { font-size: 0.9rem; }
        .ai-markdown p { margin: 0.5em 0; }
        .ai-markdown strong { font-weight: 800; color: #0f172a; }
        .ai-markdown em { font-style: italic; }
        .ai-markdown ul, .ai-markdown ol { margin: 0.5em 0; padding-left: 1.4em; }
        .ai-markdown ul { list-style: disc; }
        .ai-markdown ol { list-style: decimal; }
        .ai-markdown li { margin: 0.25em 0; }
        .ai-markdown li > ul, .ai-markdown li > ol { margin: 0.25em 0; }
        .ai-markdown hr { border: none; border-top: 1px solid #e2e8f0; margin: 1em 0; }
        .ai-markdown blockquote {
            border-left: 3px solid #a78bfa; margin: 0.6em 0; padding: 0.2em 0.9em;
            color: #475569; background: #f5f3ff; border-radius: 0 0.5rem 0.5rem 0;
        }
        .ai-markdown code {
            background: #f1f5f9; color: #7c3aed; padding: 0.1em 0.4em; border-radius: 0.35em;
            font-size: 0.85em; font-family: ui-monospace, monospace;
        }
        .ai-markdown pre {
            background: #0f172a; color: #e2e8f0; padding: 0.8em 1em; border-radius: 0.6em;
            overflow-x: auto; margin: 0.6em 0;
        }
        .ai-markdown pre code { background: transparent; color: inherit; padding: 0; }
        .ai-markdown a { color: #7c3aed; font-weight: 600; text-decoration: underline; }

            border-collapse: collapse; width: 100%; margin: 0.7em 0; font-size: 0.82rem;
            display: block; overflow-x: auto; white-space: nowrap;
        }
        .ai-markdown th, .ai-markdown td {
            border: 1px solid #e2e8f0; padding: 0.45em 0.7em; text-align: left; white-space: normal;
        }
        .ai-markdown th { background: #f5f3ff; color: #4c1d95; font-weight: 800; }
        .ai-markdown tr:nth-child(even) td { background: #fafafa; }

</head>
<body>
    <!-- GHI CHÚ: trước đây có 1 đoạn script khoá pinch-zoom/double-tap-zoom LUÔN LUÔN bật sẵn
         ở đây. Vì cơ chế tự động đó "chưa hoạt động hiệu quả lắm" trong thực tế sử dụng, giờ được
         thay bằng nút "Khoá zoom" điều khiển được (component App bên dưới, ngay cạnh chữ
         "TÀI LIỆU TIẾNG TRUNG") — bấm để bật/tắt khoá theo ý muốn thay vì luôn bật cứng. -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef, useCallback, useImperativeHandle } = React;

        // --- BỘ GIỚI HẠN SỐ LƯỢT RENDER PDF.JS CHẠY ĐỒNG THỜI ---
        // QUAN TRỌNG — sửa lỗi "mở mục lục tải lâu, lag khi hiện thị/lướt": page.render() của
        // pdf.js khá nặng CPU (giải mã + rasterize nội dung trang). Trước đây MỌI trang/thumbnail
        // lọt vào vùng nhìn thấy (IntersectionObserver) đều gọi render() NGAY LẬP TỨC — khi mở mục
        // lục, hàng chục ảnh thu nhỏ cùng lọt vào vùng nhìn thấy 1 lúc (do lưới nhiều cột), khiến
        // hàng chục lệnh render() dồn vào luồng chính CÙNG MỘT LÚC, đủ để làm nghẽn hẳn khi mở modal
        // lẫn khi cuộn. Giờ MỌI lệnh render() (cả trang chính lẫn thumbnail) đều đi qua hàng đợi
        // dùng chung này — chỉ tối đa vài lệnh chạy thật sự cùng lúc, còn lại xếp hàng chờ tới lượt,
        // giữ nguyên hành vi hiển thị (không mất trang nào) nhưng luồng chính không bị dồn ứ nữa.
        const MAX_CONCURRENT_PDF_RENDERS = 3;
        let _activePdfRenders = 0;
        const _pdfRenderQueue = [];
        const scheduleRender = (renderFn) => {
            let cancelled = false;
            let realTask = null;
            let resolveOuter, rejectOuter;
            const outerPromise = new Promise((res, rej) => { resolveOuter = res; rejectOuter = rej; });

            const freeSlotAndAdvance = () => {
                _activePdfRenders--;
                const next = _pdfRenderQueue.shift();
                if (next) next();
            };

            const start = () => {
                if (cancelled) { resolveOuter(); return; } // bị huỷ trước khi tới lượt — bỏ qua êm
                _activePdfRenders++;
                try {
                    realTask = renderFn();
                } catch (err) {
                    freeSlotAndAdvance();
                    rejectOuter(err);
                    return;
                }
                realTask.promise.then(
                    (v) => { freeSlotAndAdvance(); resolveOuter(v); },
                    (e) => { freeSlotAndAdvance(); rejectOuter(e); }
                );
            };

            if (_activePdfRenders < MAX_CONCURRENT_PDF_RENDERS) {
                start();
            } else {
                _pdfRenderQueue.push(start);
            }

            // Trả về 1 "renderTask" giả có cùng giao diện (.promise / .cancel()) như renderTask
            // thật của pdf.js, để mọi nơi đang gọi renderTask.cancel()/renderTask.promise.then(...)
            // không cần đổi gì thêm.
            return {
                promise: outerPromise,
                cancel: () => {
                    cancelled = true;
                    if (realTask) { try { realTask.cancel(); } catch (err) {} }
                }
            };
        };

        // --- GLOBAL AUDIO UNLOCKER FOR IPAD ---
        // QUAN TRỌNG: trước đây hàm này tạo MỘT AudioContext THẬT MỚI mỗi lần được gọi
        // (mỗi lần bấm "Bật Note"/"Đóng Note") và không bao giờ đóng lại. Trên Safari/iPadOS,
        // AudioContext không đóng sẽ tích tụ dần và là nguyên nhân chính khiến trang bị
        // "đứng hình" sau một lúc sử dụng (phải bấm ra ngoài app mới hồi lại được).
        // Sửa lại thành 1 AudioContext DÙNG CHUNG (singleton), chỉ tạo 1 lần duy nhất.
        // Hàm này PHẢI được gọi trực tiếp bên trong 1 thao tác chạm/bấm thật của người dùng
        // (không phải trong callback bất đồng bộ) — đó là điều kiện Safari yêu cầu để "mở khoá"
        // phát audio, kể cả cho các lần phát bằng JS sau đó (giọng đọc Online).
        //
        // SỬA TIẾP LỖI "viết khoảng 9 nét là bị đứng màn hình iPad, phải bấm ra ngoài web mới viết
        // tiếp được": nguyên nhân thật sự là hàm này trước đây được gọi lại ở MỖI LẦN đặt bút xuống
        // — tức MỖI NÉT VẼ, kể cả bút chì/bút bi không hề liên quan gì đến âm thanh — và MỖI LẦN gọi
        // đều tạo mới 1 oscillator + phát 1 SpeechSynthesisUtterance (window.speechSynthesis.speak)
        // + play()/pause() lại thẻ <audio>. Cơ chế đọc-giọng-nói (speechSynthesis) trên Safari/iPadOS
        // có lỗi đã biết: gọi .speak() dồn dập nhiều lần trong thời gian ngắn có thể làm "kẹt" tiến
        // trình xử lý âm thanh nội bộ của WebKit, khiến TOÀN BỘ trang bị đứng hình — chỉ hồi phục khi
        // trang mất rồi lấy lại focus, đúng y hệt hiện tượng "bấm ra ngoài web mới hết đứng" mà người
        // dùng gặp phải. Vì việc "mở khoá" phát âm thanh trên Safari chỉ cần làm ĐÚNG 1 LẦN DUY NHẤT
        // trong cả phiên sử dụng (một khi đã mở khoá thành công, các lần phát bằng JS sau đó — kể cả
        // không nằm trong cử chỉ chạm — vẫn hoạt động bình thường, không bị mất khoá), nên thêm cờ
        // "_audioUnlocked" để đảm bảo phần xử lý audio/speech nặng bên dưới CHỈ THỰC SỰ CHẠY 1 LẦN
        // DUY NHẤT cho cả phiên — gọi lại unlockAudio() bao nhiêu lần sau đó (mỗi nét vẽ, mỗi lần bấm
        // Bật Note...) cũng chỉ là 1 lệnh kiểm tra cờ gần như miễn phí, không tạo thêm audio node hay
        // utterance mới nữa.
        let _audioUnlocked = false;
        let _sharedAudioCtx = null;
        const unlockAudio = () => {
            if (_audioUnlocked) return;
            _audioUnlocked = true;
            try {
                if (!_sharedAudioCtx) {
                    const Ctor = window.AudioContext || window.webkitAudioContext;
                    if (Ctor) _sharedAudioCtx = new Ctor();
                }
                if (_sharedAudioCtx && _sharedAudioCtx.state === 'suspended') {
                    _sharedAudioCtx.resume();
                }
                if (_sharedAudioCtx) {
                    const osc = _sharedAudioCtx.createOscillator();
                    const gain = _sharedAudioCtx.createGain();
                    gain.gain.value = 0; // câm lặng — chỉ dùng để "mở khóa" audio, không phát âm thanh thật
                    osc.connect(gain).connect(_sharedAudioCtx.destination);
                    osc.start(0);
                    osc.stop(_sharedAudioCtx.currentTime + 0.05);
                }
            } catch (err) { /* một số trình duyệt chặn — bỏ qua an toàn */ }

            if (window.speechSynthesis) {
                try {
                    const utter = new SpeechSynthesisUtterance(' ');
                    utter.volume = 0;
                    window.speechSynthesis.speak(utter);
                } catch (err) {}
            }
        };

        // GHI CHÚ: trước đây ở đây có thêm 1 chế độ giọng đọc "Online" (phát qua dịch vụ Google
        // Translate TTS) dành riêng cho iPad vì tưởng giọng máy mặc định của Safari nghe "robot"
        // hơn. Trên thực tế dùng, giọng Online trên iPad nghe không khác gì giọng máy bình thường,
        // nên đã BỎ HẲN chế độ Online để gọn hơn — giờ chỉ còn đúng 1 nguồn giọng đọc duy nhất:
        // giọng có sẵn trên máy (window.speechSynthesis), chọn được qua ô dropdown trong box dịch.

        // --- BOX PHIÊN ÂM (PINYIN) — hiện bên trái box dịch khi dùng bút Pinyin ---
        const IPAPanel = React.memo(function IPAPanel({ info, onClose }) {
            if (!info) return null;
            // pinyin (bính âm, lấy từ thư viện pinyin-pro chạy phía client) thay cho "phonetic" kiểu
            // IPA của tiếng Anh; definition (nghĩa tiếng Việt ngắn gọn từ Google Dịch) hiển thị thêm
            // cho tiện tham khảo.
            const { word, pinyin, definition, error, loading } = info;

            return (
                <div className="w-[260px] shrink-0 glass-panel rounded-2xl shadow-2xl border-2 border-sky-100 overflow-hidden flex flex-col animate-slide-down-y">
                    <div className="bg-sky-50 px-3 py-2 flex items-center justify-between border-b border-sky-100">
                        <span className="text-xs font-extrabold text-sky-600 tracking-wide flex items-center gap-1.5">
                            <i className="fas fa-spell-check"></i> PINYIN
                        </span>
                        <button onClick={onClose} className="w-6 h-6 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors">
                            <i className="fas fa-times text-[10px]"></i>
                        </button>
                    </div>
                    <div className="p-4 bg-white flex-1 space-y-3">
                        {loading ? (
                            <div className="flex items-center justify-center gap-2 text-sky-500 py-4">
                                <i className="fas fa-circle-notch fa-spin"></i>
                                <span className="text-xs font-semibold">Đang tra từ điển…</span>
                            </div>
                        ) : error ? (
                            <p className="text-xs text-amber-600 font-semibold leading-relaxed">{error}</p>
                        ) : (
                            <div className="space-y-2">
                                <p className="text-lg font-extrabold text-slate-800 tracking-tight">{word}</p>
                                {pinyin && <p className="text-sky-600 font-semibold text-sm">{pinyin}</p>}
                                {definition && (
                                    <p className="text-xs text-slate-600 leading-relaxed max-h-28 overflow-y-auto pr-1">{definition}</p>
                                )}
                            </div>
                        )}

                        {/* Nút mở Hanzii (từ điển Trung-Việt, chủ yếu index chữ giản thể) — nút bấm thật
                            này LUÔN chắc chắn không bị trình duyệt chặn popup, dù cửa sổ tự mở lúc
                            kéo-thả có bị chặn hay không. Pinyin hiện sẵn ở trên lấy từ pinyin-pro (chạy
                            offline, không cần mạng); nghĩa tiếng Việt lấy từ Google Dịch — nút này chỉ
                            là link "xem đầy đủ hơn" sang Hanzii theo yêu cầu, để xem thêm ví dụ câu. */}
                        {!loading && word && (
                            <button
                                onClick={() => window.open('https://hanzii.net/search/word/' + encodeURIComponent(word) + '?hl=vi', '_blank')}
                                className="w-full px-3 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-2 shadow-sm shadow-sky-200"
                            >
                                <i className="fas fa-up-right-from-square"></i> Mở Hanzii
                            </button>
                        )}
                    </div>
                </div>
            );
        });

        // --- GIỌNG ĐỌC ĐƯỢC CHỌN: LƯU VĨNH VIỄN BẰNG localStorage ---
        // Trước đây selectedVoiceURI chỉ là state nội bộ của MagicTranslationBar — mỗi lần đóng hộp
        // dịch (bấm X, hoặc mở lượt quét chữ MỚI) component này bị UNMOUNT hẳn (xem điều kiện
        // "magicText || isOcrProcessing" ở App, bọc ngoài MagicTranslationBar), nên lần sau là 1 lượt
        // mount MỚI TOANH — state selectedVoiceURI mất sạch, bị tính lại từ đầu theo giọng ưu tiên mặc
        // định. Đây chính là lỗi "chọn giọng xong, bấm dịch lại (quét chữ mới) là bị reset về giọng
        // khác" — sửa bằng cách lưu lựa chọn vào localStorage (tồn tại độc lập với vòng đời component,
        // sống sót qua cả việc đóng hẳn tab/tải lại trang — đúng nghĩa "vĩnh viễn") thay vì chỉ giữ
        // trong useState của riêng 1 lần mount.
        const VOICE_STORAGE_KEY = 'nightChineseLand_selectedVoiceURI';
        const getSavedVoiceURI = () => {
            try { return localStorage.getItem(VOICE_STORAGE_KEY) || ''; } catch (err) { return ''; }
        };
        const saveVoiceURI = (uri) => {
            try { localStorage.setItem(VOICE_STORAGE_KEY, uri); } catch (err) { /* Safari riêng tư có thể chặn — bỏ qua an toàn */ }
        };

        // --- THANH DỊCH THUẬT NỔI ---
        const MagicTranslationBar = ({ text, isProcessing, onClose }) => {
            const [translation, setTranslation] = useState("");
            const [voices, setVoices] = useState([]);
            const [selectedVoiceURI, setSelectedVoiceURI] = useState("");

            const [isMuted, setIsMuted] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);

            const [copiedEn, setCopiedEn] = useState(false);
            const [copiedVi, setCopiedVi] = useState(false);

            // Tăng lên mỗi lần người dùng bấm "Thử lại" sau khi dịch lỗi — có mặt trong dependency
            // của useEffect dịch bên dưới để ép nó chạy lại đúng với chữ hiện tại, không cần quét
            // lại từ đầu.
            const [retryTick, setRetryTick] = useState(0);

            const isMutedRef = useRef(isMuted);
            useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);

            // "Thế hệ" của lượt đọc hiện tại — mỗi lần speak() được gọi sẽ tăng số này lên. Mọi
            // callback bất đồng bộ (onstart/onend/onerror của utterance) đều tự kiểm tra xem mình
            // còn đúng là lượt đọc mới nhất hay không trước khi làm bất cứ điều gì, để 1 lượt đọc cũ
            // không bao giờ chen ngang/đọc chồng lên lượt đọc mới.
            const speakGenRef = useRef(0);

            useEffect(() => {
                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    // 'zh' bắt cả zh-CN (Trung Quốc đại lục), zh-TW (Đài Loan) lẫn zh-HK (Hồng Kông) —
                    // vẫn giữ tất cả trong danh sách để người dùng tự chọn giọng ưng ý (ví dụ máy có thể
                    // chỉ có giọng zh-TW cài sẵn), nhưng ưu tiên chọn mặc định là giọng Trung Quốc đại lục
                    // (zh-CN) vì nội dung học là tiếng Trung GIẢN THỂ.
                    const zhVoices = availableVoices.filter(v => v.lang.toLowerCase().startsWith('zh'));
                    setVoices(zhVoices);

                    // Ưu tiên SỐ 1: giọng người dùng đã tự tay chọn ở lần trước (lưu vĩnh viễn), miễn là
                    // máy hiện tại vẫn có giọng đó — chỉ khi chưa từng chọn (lần đầu mở app) hoặc giọng
                    // đã lưu không còn tồn tại nữa thì mới rơi xuống các mức ưu tiên mặc định bên dưới.
                    const savedURI = getSavedVoiceURI();
                    const savedVoice = savedURI && zhVoices.find(v => v.voiceURI === savedURI);
                    const preferred = savedVoice
                        || zhVoices.find(v => v.lang.toLowerCase() === 'zh-cn')
                        || zhVoices.find(v => v.name.includes('Google') && v.lang.toLowerCase() === 'zh-cn')
                        || zhVoices.find(v => v.lang.toLowerCase().includes('cn'))
                        || zhVoices[0];
                    if (preferred) setSelectedVoiceURI(preferred.voiceURI);
                };
                loadVoices();
                window.speechSynthesis.onvoiceschanged = loadVoices;
            }, []);

            const stopAllAudio = useCallback(() => {
                speakGenRef.current++; // vô hiệu hoá mọi callback của các lượt đọc trước đó
                window.speechSynthesis.cancel();
                setIsSpeaking(false);
            }, []);

            const speak = useCallback((content) => {
                if (!content || isMutedRef.current) return;
                stopAllAudio();
                const myGen = ++speakGenRef.current; // đánh dấu đây là lượt đọc mới nhất

                const utterance = new SpeechSynthesisUtterance(content);
                const voice = voices.find(v => v.voiceURI === selectedVoiceURI);
                if (voice) utterance.voice = voice;
                utterance.onstart = () => { if (speakGenRef.current === myGen) setIsSpeaking(true); };
                utterance.onend = () => { if (speakGenRef.current === myGen) setIsSpeaking(false); };
                utterance.onerror = () => { if (speakGenRef.current === myGen) setIsSpeaking(false); };
                window.speechSynthesis.speak(utterance);
            }, [voices, selectedVoiceURI, stopAllAudio]);

            useEffect(() => {
                if (isProcessing || !text) return;

                if (text === "Không tìm thấy chữ trong vùng chọn." || text === "Lỗi nhận diện chữ.") {
                    setTranslation("");
                    return;
                }

                setTranslation("Đang dịch...");
                speak(text);

                // sl=zh-CN: nguồn là tiếng Trung GIẢN THỂ (Trung Quốc đại lục) thay vì tiếng Anh — Google
                // Translate vẫn nhận diện đúng chữ phồn thể lẫn trong đó (nếu OCR lỡ nhận nhầm) nên không
                // cần đổi thêm gì khác; đích dịch vẫn là tiếng Việt (tl=vi) như bản gốc. translateText()
                // tự thử domain thay thế, rồi tự chuyển qua nguồn dịch khác (MyMemory) nếu Google lỗi
                // hết (xem giải thích chi tiết ở khai báo hàm).
                const cleanText = text.replace(/\s+/g, ' ').trim();
                let cancelled = false;
                translateText(cleanText, 'zh-CN', 'vi')
                    .then(result => {
                        if (cancelled) return;
                        setTranslation(result || "Không thể dịch nội dung này.");
                    })
                    .catch(err => {
                        console.error(err);
                        if (!cancelled) setTranslation("Lỗi kết nối từ điển.");
                    });

                return () => { cancelled = true; stopAllAudio(); };
                // eslint-disable-next-line
            }, [text, isProcessing, retryTick]);

            const handleCopy = (content, type) => {
                navigator.clipboard.writeText(content);
                if (type === 'en') { setCopiedEn(true); setTimeout(() => setCopiedEn(false), 2000); }
                else { setCopiedVi(true); setTimeout(() => setCopiedVi(false), 2000); }
            };

            const handleClose = () => { stopAllAudio(); onClose(); };
            const toggleMute = () => {
                setIsMuted(m => {
                    const next = !m;
                    if (next) stopAllAudio(); // Mute -> im lặng ngay lập tức
                    return next;
                });
            };

            if (!text && !isProcessing) return null;

            // GHI CHÚ: bỏ hẳn `fixed top-24 left-1/2 -translate-x-1/2 z-[100]` từng có sẵn ở đây —
            // giờ việc định vị (canh giữa màn hình, cách đỉnh bao nhiêu) do khung bọc ngoài ở App lo,
            // để box IPA có thể xếp chung 1 cột ngay bên dưới box này (xem App, nơi gọi component).
            // Cũng bỏ animate-slide-down ở đây (chuyển lên khung bọc ngoài) — class đó bake sẵn
            // translateX(-50%) vào animation, gắn nhầm ở đây (khung này không còn tự canh giữa nữa,
            // chỉ w-full theo khung cha) sẽ làm nó bị lệch trái 50% bề rộng của chính nó.
            return (
                <div className="w-full glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl border-2 border-emerald-100">
                    <div className="bg-slate-100/80 px-4 py-2 border-b border-slate-200 shrink-0">
                        <div className="flex items-center justify-between gap-2 relative">
                        <div className="flex items-center gap-2 flex-wrap">
                            {/* Chọn giọng đọc có sẵn trên máy — đã bỏ chế độ "Online" vì trên iPad nghe
                                không khác gì giọng máy, giữ lại 1 nguồn giọng đọc duy nhất cho gọn. */}
                            <select
                                className="text-xs bg-white border border-slate-300 rounded-md px-2 py-1.5 outline-none text-slate-700 max-w-[170px] truncate shadow-sm font-semibold cursor-pointer"
                                value={selectedVoiceURI}
                                onChange={(e) => { setSelectedVoiceURI(e.target.value); saveVoiceURI(e.target.value); }}
                                title="Chọn giọng đọc (tự động nhớ vĩnh viễn cho các lần sau)"
                            >
                                {voices.map(v => <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>)}
                            </select>

                            {!isProcessing && (
                                <button onClick={() => speak(text)} disabled={isMuted} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm " + (isMuted ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600')} title="Phát âm lại">
                                    <i className={"fas text-xs " + (isSpeaking ? 'fa-volume-high' : 'fa-volume-up')}></i>
                                </button>
                            )}

                            {/* NÚT MUTE — tắt tiếng bất cứ lúc nào cần */}
                            <button onClick={toggleMute} className={"w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm border " + (isMuted ? 'bg-red-50 text-red-500 border-red-200 hover:bg-red-100' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-100')} title={isMuted ? 'Đang tắt tiếng — bấm để bật lại' : 'Tắt tiếng'}>
                                <i className={"fas text-xs " + (isMuted ? 'fa-volume-xmark' : 'fa-volume-mute')}></i>
                            </button>
                        </div>

                        <button onClick={handleClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-all absolute right-2 top-1/2 transform -translate-y-1/2 bg-white border border-slate-200 hover:border-red-500 shadow-sm">
                            <i className="fas fa-times text-md"></i>
                        </button>
                        </div>
                    </div>

                    <div className="p-6 relative bg-white flex-1">
                        {isProcessing ? (
                            <div className="flex items-center justify-center gap-4 text-emerald-600 py-6">
                                <i className="fas fa-circle-notch fa-spin text-4xl"></i>
                                <span className="font-bold text-xl">AI đang quét & nhận diện chữ (OCR)...</span>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="relative pr-16 group">
                                    <p className="font-bold text-slate-800 text-[18px] leading-relaxed tracking-wide">{text}</p>
                                    <button 
                                        onClick={() => handleCopy(text, 'en')} 
                                        className="absolute top-1/2 transform -translate-y-1/2 right-0 w-11 h-11 flex items-center justify-center rounded-xl text-emerald-600 bg-emerald-50 hover:bg-emerald-600 hover:text-white transition-colors border border-emerald-100 shadow-sm" 
                                    >
                                        <i className={copiedEn ? "fas fa-check text-green-500 text-xl" : "fas fa-copy text-xl"}></i>
                                    </button>
                                </div>
                                
                                <div className="w-full h-px bg-slate-100"></div>
                                
                                {translation === "Lỗi kết nối từ điển." ? (
                                    <div className="flex items-center justify-between gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3">
                                        <p className="text-sm text-amber-700 font-semibold flex items-center gap-2">
                                            <i className="fas fa-triangle-exclamation"></i> Lỗi kết nối từ điển — kiểm tra lại mạng rồi thử lại nhé.
                                        </p>
                                        <button
                                            onClick={() => setRetryTick(t => t + 1)}
                                            className="shrink-0 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold transition-all active:scale-95"
                                        >
                                            <i className="fas fa-rotate-right mr-1"></i>Thử lại
                                        </button>
                                    </div>
                                ) : translation && translation !== "Đang dịch..." && (
                                    <div className="relative pr-16 group">
                                        <p className="font-semibold text-emerald-700 text-[17px] leading-relaxed tracking-wide flex items-start">
                                            <i className="fas fa-language mt-1 mr-3 opacity-80 text-xl"></i>
                                            <span>{translation}</span>
                                        </p>
                                        <button
                                            onClick={() => handleCopy(translation, 'vi')}
                                            className="absolute top-1/2 transform -translate-y-1/2 right-0 w-11 h-11 flex items-center justify-center rounded-xl text-emerald-600 bg-emerald-50 hover:bg-emerald-600 hover:text-white transition-colors border border-emerald-100 shadow-sm"
                                        >
                                            <i className={copiedVi ? "fas fa-check text-white text-xl" : "fas fa-copy text-xl"}></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================================================
        // === BÚT AI (Groq) + TÓM TẮT PHIÊN DẠY — port từ bản Night IELTS Land, thích nghi cho việc ===
        // === dạy/học tiếng Trung (thay vì luyện thi IELTS): các preset hỏi AI đổi sang giải nghĩa   ===
        // === từ vựng/ngữ pháp/lục thư chữ Hán..., toàn bộ hạ tầng gọi Groq (callGroqAPI, retry, tự  ===
        // === chuyển model khi bị khai tử...) giữ nguyên vì không phụ thuộc nội dung IELTS hay Trung. ===
        // ============================================================================================

        // QUAN TRỌNG — sửa lỗi "table hay mấy ### định dạng nó vẫn chưa đọc được": AI (Groq) thường
        // trả lời bằng Markdown ĐẦY ĐỦ (tiêu đề ###, bảng |...|, gạch đầu dòng, blockquote, hr...),
        // không chỉ mỗi **in đậm**. Dùng marked.js để chuyển toàn bộ Markdown -> HTML thật sự (đúng
        // nghĩa bảng/tiêu đề/danh sách...), rồi DOMPurify khử trùng HTML đó trước khi chèn vào trang
        // qua dangerouslySetInnerHTML — vì đây là nội dung do AI ngoài tạo ra, luôn phải khử trùng để
        // phòng AI vô tình/bị dẫn dụ trả về HTML/script độc hại. CSS style cho các thẻ này nằm ở class
        // ".ai-markdown" (xem phần <style> đầu file). Đặt Ở MODULE-LEVEL (không nằm trong AIPanel nữa)
        // vì "Tóm tắt phiên dạy" (SessionSummaryPanel) cũng cần dùng lại y hệt hàm này.
        const renderMarkdownAnswerHtml = (raw) => {
            if (!raw) return { __html: '' };
            let html;
            try {
                html = window.marked ? window.marked.parse(raw) : raw.replace(/\n/g, '<br/>');
            } catch (e) {
                html = raw.replace(/\n/g, '<br/>');
            }
            const clean = window.DOMPurify ? window.DOMPurify.sanitize(html) : html;
            return { __html: clean };
        };

        // Khoá localStorage lưu API key Groq — CỐ TÌNH khác với bản Night IELTS Land
        // ('nightIeltsGroqApiKey') để dùng song song 2 app trên cùng 1 trình duyệt không bị lẫn/ghi đè
        // key của nhau.
        const AI_STORAGE_KEY = 'nightChineseLandGroqApiKey';
        // QUAN TRỌNG: Groq KHÔNG có alias kiểu "latest" — mỗi model có 1 tên cố định và Groq công bố
        // ngày "khai tử" cứng trên trang console.groq.com/docs/deprecations, hết hạn là gọi lỗi 404
        // luôn, không tự chuyển hướng. Để đỡ phải sửa code mỗi lần Groq đổi model, liệt kê ở đây MỘT
        // DÃY model theo thứ tự ưu tiên — callGroqAPI bên dưới sẽ tự động thử model kế tiếp trong danh
        // sách nếu model hiện tại báo lỗi 404 "does not exist" (bị khai tử/đổi tên), không cần người
        // dùng làm gì cả.
        const GROQ_MODELS = ['openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'llama-3.3-70b-versatile'];
        // Các prompt có sẵn cho Bút AI — thích nghi cho việc học TIẾNG TRUNG (khác bản IELTS gốc dùng
        // cho tiếng Anh): dịch, giải nghĩa từ vựng, phân tích ngữ pháp câu, mẹo nhớ, đặt câu ví dụ, và
        // THÊM MỚI "Phân tích lục thư" (六书) — phân tích cấu tạo chữ Hán theo 6 cách tạo chữ truyền
        // thống, rất hữu ích cho người học nhớ mặt chữ/nghĩa/âm đọc. buildPrompt nhận vào đúng đoạn
        // chữ vừa quét được, trả về câu prompt đầy đủ gửi cho AI — LUÔN yêu cầu trả lời bằng tiếng Việt
        // (vì học viên là người Việt học tiếng Trung), dùng Markdown.
        const AI_PRESET_OPTIONS = [
            {
                key: 'translate', label: 'Dịch', icon: 'fa-language',
                buildPrompt: (t) => 'Hãy dịch đoạn chữ Hán (tiếng Trung giản thể) sau sang tiếng Việt, dịch chính xác nhưng tự nhiên (không dịch từng chữ máy móc, chú ý đúng ngữ cảnh), chỉ trả về bản dịch (không cần giải thích thêm):\n\n"' + t + '"',
            },
            {
                key: 'explain', label: 'Giải nghĩa từ vựng', icon: 'fa-lightbulb',
                buildPrompt: (t) => 'Bạn là gia sư tiếng Trung giàu kinh nghiệm, đang dạy học viên người Việt. Hãy giải thích ngắn gọn, dễ hiểu nghĩa của từ/cụm từ/đoạn chữ Hán sau: nêu rõ pinyin (có dấu thanh điệu), nghĩa chính, và cách dùng phổ biến trong câu. Trả lời bằng tiếng Việt, dùng Markdown, có thể kèm 1 ví dụ ngắn nếu cần:\n\n"' + t + '"',
            },
            {
                key: 'grammar', label: 'Phân tích ngữ pháp', icon: 'fa-diagram-project',
                buildPrompt: (t) => 'Bạn là gia sư tiếng Trung. Đoạn chữ Hán sau có thể là 1 câu hoặc cụm câu hoàn chỉnh. Hãy phân tích cấu trúc ngữ pháp của câu (chủ ngữ - vị ngữ - tân ngữ, các trợ từ/giới từ/bổ ngữ đặc biệt nếu có, thì/thể...), trả lời ngắn gọn, rõ ràng bằng tiếng Việt, dùng Markdown:\n\n"' + t + '"',
            },
            {
                key: 'mnemonic', label: 'Mẹo nhớ', icon: 'fa-brain',
                buildPrompt: (t) => 'Bạn là gia sư tiếng Trung. Hãy đưa ra 1-2 mẹo hoặc cách liên tưởng thú vị để nhớ lâu mặt chữ/nghĩa/cách viết/cách đọc của chữ Hán hoặc từ vựng sau, trả lời ngắn gọn bằng tiếng Việt:\n\n"' + t + '"',
            },
            {
                key: 'sentence', label: 'Đặt câu ví dụ', icon: 'fa-pen-nib',
                buildPrompt: (t) => 'Bạn là gia sư tiếng Trung. Hãy đặt 2 câu tiếng Trung giản thể trình độ sơ - trung cấp (khoảng HSK 3-4) có dùng từ/cụm từ sau, kèm pinyin và dịch nghĩa tiếng Việt ngắn gọn cho mỗi câu:\n\n"' + t + '"',
            },
            // MỚI — "Phân tích lục thư" (六书, lục thư = 6 cách cấu tạo chữ Hán truyền thống): 象形
            // (tượng hình), 指事 (chỉ sự), 会意 (hội ý), 形声 (hình thanh — bộ phận biểu nghĩa + bộ phận
            // biểu âm, PHỔ BIẾN NHẤT trong chữ Hán hiện đại), 转注 (chuyển chú), 假借 (giả tá). Yêu cầu
            // AI tách phân tích riêng cho TỪNG chữ (nếu đoạn quét có nhiều chữ), theo cấu trúc rõ ràng:
            // phân loại lục thư -> bộ phận cấu tạo (bộ thủ biểu nghĩa/biểu âm) -> nguồn gốc nghĩa. Prompt
            // dài/chi tiết hơn các preset khác một cách có chủ đích vì giải thích văn tự học cần cấu trúc
            // rõ ràng theo từng mục mới dễ hiểu, tránh AI trả lời lan man.
            {
                key: 'liushu', label: 'Phân tích lục thư', icon: 'fa-yin-yang',
                buildPrompt: (t) => 'Bạn là chuyên gia văn tự học (Hán tự học) chữ Hán, giải thích cho học viên người Việt đang học tiếng Trung. Với (các) chữ Hán trong đoạn sau, hãy phân tích theo "Lục thư" (六书 — sáu cách cấu tạo chữ Hán truyền thống): 象形 Tượng hình, 指事 Chỉ sự, 会意 Hội ý, 形声 Hình thanh (bộ phận biểu nghĩa/hình phù + bộ phận biểu âm/thanh phù — cách cấu tạo PHỔ BIẾN NHẤT trong chữ Hán hiện đại), 转注 Chuyển chú, 假借 Giả tá. '
                    + 'Nếu đoạn có NHIỀU chữ, hãy tách phân tích riêng cho TỪNG chữ, mỗi chữ dùng 1 tiêu đề Markdown (###) ghi rõ chữ Hán + pinyin + nghĩa. Với MỖI chữ, trình bày đủ 3 mục sau: '
                    + '(1) **Phân loại** — chữ này thuộc loại nào trong lục thư (một chữ có thể vừa mang yếu tố hình thanh vừa có thêm ý hội ý, hãy nêu rõ nếu có sự pha trộn, không gượng ép chỉ chọn 1 loại); '
                    + '(2) **Bộ phận cấu tạo** — tách chữ ra thành các bộ phận/bộ thủ, nêu rõ bộ phận nào biểu nghĩa (nghĩa phù/hình phù) và bộ phận nào biểu âm (thanh phù) nếu là chữ hình thanh, hoặc mô tả các nét/bộ phận chính nếu là tượng hình/chỉ sự/hội ý; '
                    + '(3) **Nguồn gốc nghĩa** — giải thích các bộ phận đó kết hợp với nhau ra sao để tạo thành nghĩa và/hoặc cách đọc hiện tại của chữ. '
                    + 'Trả lời bằng tiếng Việt, trình bày rõ ràng bằng Markdown, ngắn gọn nhưng đủ ý, phù hợp cho người đang học tiếng Trung (không cần lời dẫn/kết luận dài dòng):\n\n"' + t + '"',
            },
        ];
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        // 1 lần gọi API thật sự — tách riêng khỏi callGroqAPI để dễ gọi lại (retry) khi máy chủ
        // báo quá tải/lỗi tạm thời, thay vì lặp lại y hệt toàn bộ logic timeout/parse mỗi lần retry.
        // Endpoint của Groq tương thích định dạng chuẩn của OpenAI: key nằm trong header
        // "Authorization: Bearer <key>", body {model, messages: [{role, content}]}, kết quả nằm ở
        // data.choices[0].message.content.
        const callGroqAPIOnce = async (apiKey, promptText, model) => {
            const url = 'https://api.groq.com/openai/v1/chat/completions';
            // QUAN TRỌNG — sửa lỗi "AI đang trả lời... cứ load mãi không ra kết quả lẫn không báo lỗi":
            // trước đây fetch() không có giới hạn thời gian nào cả — nếu request bị treo (mất mạng
            // giữa chừng, mạng quá chậm, hoặc kết nối bị "đứng" mà trình duyệt không tự báo lỗi ngay)
            // thì fetch() sẽ không bao giờ resolve/reject, khiến "loading" trong AIPanel treo vĩnh
            // viễn dù code try/catch/finally đã đúng — vì có lỗi gì đâu mà catch, bản thân Promise
            // của fetch() chưa từng settle. Sửa bằng AbortController: tự huỷ request sau 20 giây rồi
            // báo lỗi rõ ràng, để người dùng biết đường thử lại thay vì đợi vô thời hạn.
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);
            let res;
            try {
                res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey,
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: promptText }],
                    }),
                    signal: controller.signal,
                });
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    throw new Error('Quá thời gian chờ phản hồi (20 giây) — kiểm tra kết nối mạng rồi thử lại.');
                }
                throw new Error('Không kết nối được tới Groq — kiểm tra kết nối mạng rồi thử lại.');
            } finally {
                clearTimeout(timeoutId);
            }
            if (!res.ok) {
                let detail = '';
                try { const errJson = await res.json(); detail = errJson && errJson.error && errJson.error.message ? errJson.error.message : ''; } catch (e) {}
                if (res.status === 401 || res.status === 403) throw new Error('API key Groq không hợp lệ hoặc chưa được cấp quyền. Kiểm tra lại key trong Cài đặt.');
                if (res.status === 429) throw new Error('Đã vượt hạn mức miễn phí của Groq trong khoảng thời gian này, thử lại sau ít phút nhé.');
                if (res.status === 404) {
                    // QUAN TRỌNG — Groq hay "khai tử cứng" model (không có alias tự chuyển hướng): model
                    // bị gỡ là gọi thẳng lỗi 404 "does not exist" ngay lập tức, không tự dùng model khác
                    // thay thế. Đánh dấu isModelMissing để callGroqAPI bên dưới tự động thử model KẾ
                    // TIẾP trong danh sách GROQ_MODELS, không bắt người dùng phải biết/sửa.
                    const errModelMissing = new Error('Model Groq "' + model + '" không còn khả dụng.');
                    errModelMissing.isModelMissing = true;
                    throw errModelMissing;
                }
                if (res.status >= 500) {
                    const errOverload = new Error('Máy chủ Groq đang quá tải, đã thử lại vài lần nhưng vẫn chưa được — thử lại sau ít phút nhé.');
                    errOverload.isOverloaded = true;
                    throw errOverload;
                }
                throw new Error('Lỗi gọi Groq API (HTTP ' + res.status + ')' + (detail ? ': ' + detail : '') + '.');
            }
            const data = await res.json();
            const choice = data && data.choices && data.choices[0];
            const answer = choice && choice.message && choice.message.content ? choice.message.content.trim() : '';
            if (!answer) throw new Error('Groq không trả về câu trả lời nào (có thể nội dung bị chặn bởi bộ lọc an toàn).');
            return answer;
        };
        // QUAN TRỌNG: lỗi quá tải máy chủ (5xx) chỉ là TẠM THỜI (thường tự hết sau vài giây), không
        // phải lỗi do code hay do API key sai — nên cách đúng là tự động thử lại vài lần với khoảng
        // chờ ngắn tăng dần (thay vì bắt người dùng tự bấm lại), để "có câu trả lời nhanh nhất" ngay
        // khi máy chủ rảnh trở lại. Chỉ retry cho lỗi quá tải (5xx) — các lỗi khác (key sai, hết quota,
        // mất mạng...) báo lỗi ngay lập tức, không mất thời gian retry vô ích.
        // onRetry (tuỳ chọn): callback(lầnThửHiệnTại, tổngSốLần) — để UI hiện "đang thử lại lần X/Y"
        // thay vì chỉ hiện "AI đang trả lời..." im lìm suốt cả quãng chờ retry, tránh cảm giác treo.
        // Ngoài việc thử lại khi máy chủ quá tải (5xx), hàm này còn tự động chuyển sang model KẾ TIẾP
        // trong GROQ_MODELS nếu model hiện tại báo lỗi 404 (bị Groq khai tử/đổi tên). Chỉ khi TẤT CẢ
        // model trong danh sách đều lỗi 404 thì mới thật sự báo lỗi "hết model dùng được" cho người dùng.
        const callGroqAPI = async (apiKey, promptText, onRetry) => {
            const retryDelaysMs = [500, 1200, 2500];
            for (let modelIdx = 0; modelIdx < GROQ_MODELS.length; modelIdx++) {
                const model = GROQ_MODELS[modelIdx];
                const isLastModel = modelIdx === GROQ_MODELS.length - 1;
                try {
                    for (let attempt = 0; ; attempt++) {
                        try {
                            return await callGroqAPIOnce(apiKey, promptText, model);
                        } catch (err) {
                            const isLastAttempt = attempt >= retryDelaysMs.length;
                            if (err && err.isOverloaded && !isLastAttempt) {
                                if (onRetry) onRetry(attempt + 1, retryDelaysMs.length + 1);
                                await sleep(retryDelaysMs[attempt]);
                                continue;
                            }
                            throw err;
                        }
                    }
                } catch (err) {
                    if (err && err.isModelMissing && !isLastModel) continue;
                    if (err && err.isModelMissing && isLastModel) {
                        throw new Error('Không còn model Groq nào khả dụng trong danh sách — Groq có thể vừa đổi/khai tử toàn bộ, cần cập nhật lại danh sách model trong code.');
                    }
                    throw err;
                }
            }
        };

        // --- BOX BÚT AI: hiện chữ vừa quét + các nút prompt có sẵn + câu trả lời từ Groq ---
        // Không dùng React.memo cho component này (giống MagicTranslationBar ở trên) — nó có state nội
        // bộ (câu trả lời, đang tải...) tự quản lý theo đúng prop `info` truyền vào, không cần tối ưu
        // re-render vì chỉ có 1 bản duy nhất hiện tại 1 thời điểm.
        // onAnswered (tuỳ chọn): báo cho App biết khi người dùng chủ động bấm "Lưu" trên 1 câu trả lời —
        // App gom lại thành "lịch sử Bút AI trong phiên" để tính năng "Tóm tắt phiên dạy" dùng lại. QUAN
        // TRỌNG: KHÔNG tự động lưu MỌI câu trả lời — chỉ những câu trả lời NGƯỜI DÙNG TỰ THẤY HAY và
        // bấm nút "Lưu" (ngay cạnh nút Copy) mới được đưa vào lịch sử, xem handleSaveToHistory bên dưới.
        const AIPanel = ({ info, apiKey, onClose, onOpenSettings, onAnswered }) => {
            const [loading, setLoading] = useState(false);
            const [answer, setAnswer] = useState('');
            const [error, setError] = useState('');
            const [activeLabel, setActiveLabel] = useState('');
            const [showCustomInput, setShowCustomInput] = useState(false);
            const [customQuestion, setCustomQuestion] = useState('');
            const [copied, setCopied] = useState(false);
            // Đã bấm "Lưu" cho đúng câu trả lời đang hiện hay chưa — reset về false mỗi khi có câu trả
            // lời MỚI (xem effect dọn state theo "text" bên dưới VÀ ngay trong runPrompt khi có answer mới).
            const [savedToHistory, setSavedToHistory] = useState(false);
            // Trạng thái đang thử lại (khi Groq báo quá tải) — để hiện "đang thử lại lần X/Y"
            // thay vì chỉ hiện "AI đang trả lời..." im lìm suốt, dễ khiến tưởng nhầm là bị treo.
            const [retryInfo, setRetryInfo] = useState(null);

            const text = info && info.text;
            const ocrLoading = info && info.ocrLoading;

            // Quét chữ MỚI (đoạn text đổi) -> dọn sạch câu trả lời/lựa chọn cũ, tránh hiểu nhầm câu trả
            // lời cũ vẫn đang nói về đoạn chữ mới vừa quét.
            useEffect(() => {
                setAnswer(''); setError(''); setActiveLabel(''); setShowCustomInput(false); setCustomQuestion(''); setRetryInfo(null); setSavedToHistory(false);
            }, [text]);

            if (!info) return null;

            const runPrompt = async (label, promptText) => {
                if (!apiKey) { onOpenSettings(); return; }
                setLoading(true); setError(''); setAnswer(''); setActiveLabel(label); setRetryInfo(null); setSavedToHistory(false);
                try {
                    const result = await callGroqAPI(apiKey, promptText, (attempt, total) => setRetryInfo({ attempt, total }));
                    setAnswer(result);
                } catch (err) {
                    setError(err && err.message ? err.message : 'Có lỗi khi hỏi AI, thử lại nhé.');
                } finally {
                    setLoading(false); setRetryInfo(null);
                }
            };
            const handlePreset = (opt) => runPrompt(opt.label, opt.buildPrompt(text));
            const handleCustomAsk = () => {
                const q = customQuestion.trim();
                if (!q) return;
                runPrompt('Khác', q + '\n\nNgữ cảnh liên quan (đoạn vừa quét được):\n"' + text + '"');
            };
            const handleCopyAnswer = () => {
                navigator.clipboard.writeText(answer);
                setCopied(true); setTimeout(() => setCopied(false), 2000);
            };
            // Bấm "Lưu" -> báo lên App để đưa câu trả lời này vào lịch sử dùng cho "Tóm tắt phiên dạy" —
            // chỉ đúng lúc bấm mới lưu, không tự động.
            const handleSaveToHistory = () => {
                if (!answer || savedToHistory) return;
                if (onAnswered) onAnswered({ scannedText: text, promptLabel: activeLabel, answer, timestamp: Date.now() });
                setSavedToHistory(true);
            };

            return (
                <div className="w-full glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl border-2 border-violet-100">
                    <div className="bg-slate-100/80 px-4 py-2 border-b border-slate-200 shrink-0 flex items-center justify-between gap-2">
                        <span className="text-xs font-extrabold text-violet-600 tracking-wide flex items-center gap-1.5 uppercase">
                            <i className="fas fa-robot"></i> Bút AI
                        </span>
                        <div className="flex items-center gap-2">
                            <button onClick={onOpenSettings} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-violet-600 hover:bg-violet-50 transition-colors" title="Cài đặt API key Groq">
                                <i className="fas fa-gear text-sm"></i>
                            </button>
                            <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors bg-white border border-slate-200">
                                <i className="fas fa-times text-md"></i>
                            </button>
                        </div>
                    </div>

                    <div className="p-5 bg-white flex-1 space-y-4 max-h-[65vh] overflow-y-auto">
                        {ocrLoading ? (
                            <div className="flex items-center justify-center gap-3 text-violet-600 py-4">
                                <i className="fas fa-circle-notch fa-spin text-2xl"></i>
                                <span className="font-bold text-sm">Đang quét chữ (OCR)...</span>
                            </div>
                        ) : (
                            <React.Fragment>
                                <p className="font-bold text-slate-800 text-[16px] leading-relaxed">{text}</p>

                                {!apiKey ? (
                                    <div className="bg-violet-50 border border-violet-100 rounded-xl p-4 text-sm text-violet-700 space-y-2">
                                        <p>Chưa có API key Groq. Nhập key (miễn phí, không cần thẻ ngân hàng, lấy ở Groq Console) để dùng bút AI.</p>
                                        <button onClick={onOpenSettings} className="px-3 py-2 bg-violet-500 hover:bg-violet-600 text-white rounded-lg text-xs font-bold transition-all active:scale-95">
                                            Nhập API key ngay
                                        </button>
                                    </div>
                                ) : (
                                    <React.Fragment>
                                        <div className="grid grid-cols-2 gap-2">
                                            {AI_PRESET_OPTIONS.map(opt => (
                                                <button
                                                    key={opt.key}
                                                    onClick={() => handlePreset(opt)}
                                                    disabled={loading}
                                                    className={"px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 justify-center transition-all active:scale-95 border " + (activeLabel === opt.label ? 'bg-violet-500 text-white border-violet-500' : 'bg-violet-50 text-violet-700 border-violet-100 hover:bg-violet-100') + (loading ? ' opacity-60 cursor-not-allowed' : '')}
                                                >
                                                    <i className={"fas " + opt.icon}></i> {opt.label}
                                                </button>
                                            ))}
                                            <button
                                                onClick={() => setShowCustomInput(v => !v)}
                                                disabled={loading}
                                                className={"px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 justify-center transition-all active:scale-95 border " + (activeLabel === 'Khác' ? 'bg-violet-500 text-white border-violet-500' : 'bg-violet-50 text-violet-700 border-violet-100 hover:bg-violet-100') + (loading ? ' opacity-60 cursor-not-allowed' : '')}
                                            >
                                                <i className="fas fa-ellipsis"></i> Khác
                                            </button>
                                        </div>

                                        {showCustomInput && (
                                            <div className="flex items-center gap-2">
                                                <input
                                                    type="text"
                                                    value={customQuestion}
                                                    onChange={(e) => setCustomQuestion(e.target.value)}
                                                    onKeyDown={(e) => { if (e.key === 'Enter') handleCustomAsk(); }}
                                                    placeholder="Nhập câu hỏi của bạn về đoạn này..."
                                                    className="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-violet-400"
                                                />
                                                <button onClick={handleCustomAsk} disabled={loading || !customQuestion.trim()} className="px-3 py-2 bg-violet-500 hover:bg-violet-600 disabled:opacity-50 text-white rounded-lg text-xs font-bold transition-all active:scale-95 shrink-0">
                                                    Hỏi
                                                </button>
                                            </div>
                                        )}

                                        {loading && (
                                            <div className="flex items-center justify-center gap-3 text-violet-600 py-4">
                                                <i className="fas fa-circle-notch fa-spin text-2xl"></i>
                                                <span className="font-bold text-sm">{retryInfo ? `Máy chủ Groq đang hơi bận, đang thử lại (lần ${retryInfo.attempt}/${retryInfo.total})...` : 'AI đang trả lời...'}</span>
                                            </div>
                                        )}
                                        {error && <p className="text-xs text-amber-600 font-semibold leading-relaxed">{error}</p>}
                                        {answer && !loading && (
                                            <div className="relative bg-slate-50 border border-slate-200 rounded-xl p-4 pr-12">
                                                <div className="ai-markdown" dangerouslySetInnerHTML={renderMarkdownAnswerHtml(answer)}></div>
                                                <div className="absolute top-3 right-3 flex flex-col gap-2">
                                                    <button onClick={handleCopyAnswer} className="w-8 h-8 flex items-center justify-center rounded-lg text-violet-600 bg-violet-50 hover:bg-violet-600 hover:text-white transition-colors border border-violet-100" title="Sao chép">
                                                        <i className={copied ? "fas fa-check text-green-500" : "fas fa-copy"}></i>
                                                    </button>
                                                    {/* Nút "Lưu" — chỉ câu trả lời nào người dùng chủ động bấm lưu ở đây mới được
                                                        đưa vào lịch sử dùng cho "Tóm tắt phiên dạy" (không tự động lưu hết mọi câu
                                                        trả lời, tránh bản tóm tắt cuối bị lẫn những câu không cần thiết). */}
                                                    <button onClick={handleSaveToHistory} className={"w-8 h-8 flex items-center justify-center rounded-lg transition-colors border " + (savedToHistory ? 'text-emerald-600 bg-emerald-50 border-emerald-100' : 'text-indigo-600 bg-indigo-50 hover:bg-indigo-600 hover:text-white border-indigo-100')} title={savedToHistory ? 'Đã lưu vào Tóm tắt phiên dạy' : 'Lưu vào Tóm tắt phiên dạy'}>
                                                        <i className={savedToHistory ? "fas fa-check" : "fas fa-bookmark"}></i>
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                </div>
            );
        };

        // Gom TẤT CẢ notes (text box, mọi trang) + các câu trả lời Bút AI ĐÃ ĐƯỢC LƯU (bấm nút "Lưu"
        // trong Bút AI) trong phiên đang mở thành 1 đoạn văn bản đưa cho Groq — đặt module-level (không
        // phải hàm nội bộ SessionSummaryPanel) để dễ test/đọc độc lập. allTextsRef.current dạng
        // { [pageNum]: [{id,text,...}] }, aiHistoryRef.current dạng mảng { scannedText, promptLabel,
        // answer, timestamp }, cả 2 đều là REF (xem giải thích ở khai báo trong App) nên hàm này chỉ
        // ĐỌC 1 lần đúng lúc gọi, không cần re-render theo dõi.
        const buildSessionMaterialText = (allTextsRef, aiHistoryRef) => {
            const parts = [];

            const pageNums = Object.keys(allTextsRef.current || {})
                .map(n => parseInt(n, 10))
                .filter(n => Array.isArray(allTextsRef.current[n]) && allTextsRef.current[n].some(t => t.text && t.text.trim()))
                .sort((a, b) => a - b);
            if (pageNums.length) {
                let notesBlock = 'GHI CHÚ (TEXT BOX) NGƯỜI DÙNG ĐÃ VIẾT TRÊN TÀI LIỆU:\n';
                for (const p of pageNums) {
                    const notesOnPage = allTextsRef.current[p].map(t => t.text.trim()).filter(Boolean);
                    if (!notesOnPage.length) continue;
                    notesBlock += `- Trang ${p}: ` + notesOnPage.join(' | ') + '\n';
                }
                parts.push(notesBlock.trim());
            }

            const history = aiHistoryRef.current || [];
            if (history.length) {
                let historyBlock = 'LỊCH SỬ HỎI-ĐÁP VỚI BÚT AI TRONG PHIÊN NÀY:\n';
                history.forEach((h, idx) => {
                    historyBlock += `${idx + 1}. [${h.promptLabel}] Đoạn quét: "${h.scannedText}"\n   Trả lời AI: ${h.answer}\n`;
                });
                parts.push(historyBlock.trim());
            }

            return parts.join('\n\n');
        };

        // --- BOX "TÓM TẮT PHIÊN DẠY" ---
        // Gom notes + lịch sử Bút AI trong phiên (xem buildSessionMaterialText ở trên), gửi Groq tổng
        // hợp thành 1 bản tóm tắt sẵn sàng cho việc ôn luyện — có nút Copy (như Bút AI) VÀ nút Lưu riêng
        // (lưu CHỈ trong phiên đang mở, không ghi localStorage) để tý gộp thủ công với các note khác
        // thành 1 bản tóm tắt cuối gửi học sinh. Không dùng React.memo — giống AIPanel, chỉ có 1 bản
        // duy nhất hiện tại 1 thời điểm.
        const SessionSummaryPanel = ({ apiKey, onOpenSettings, onClose, allTextsRef, aiHistoryRef, savedSummaries, onSave, onDeleteSaved }) => {
            const [loading, setLoading] = useState(false);
            const [summary, setSummary] = useState('');
            const [error, setError] = useState('');
            const [retryInfo, setRetryInfo] = useState(null);
            const [copied, setCopied] = useState(false);
            const [savedJustNow, setSavedJustNow] = useState(false);
            const [copiedSavedId, setCopiedSavedId] = useState(null);

            const runSummarize = async () => {
                if (!apiKey) { onOpenSettings(); return; }
                const material = buildSessionMaterialText(allTextsRef, aiHistoryRef);
                if (!material.trim()) {
                    setError('Chưa có ghi chú (text box) hay câu trả lời Bút AI nào đã lưu trong phiên này để tóm tắt.');
                    return;
                }
                setLoading(true); setError(''); setSummary(''); setRetryInfo(null); setSavedJustNow(false);
                const prompt = 'Bạn là trợ giảng tiếng Trung. Dưới đây là ghi chú và lịch sử hỏi-đáp AI mà giáo viên đã thực hiện trong 1 buổi dạy '
                    + '(dùng để ôn tập với học sinh sau buổi học). Hãy tổng hợp lại thành 1 bản tóm tắt bài học rõ ràng, mạch lạc, theo từng ý/'
                    + 'chủ điểm (không lặp lại y nguyên từng dòng thô), phù hợp để gửi thẳng cho học sinh tự ôn — dùng tiếng Việt, giữ nguyên các '
                    + 'chữ Hán/từ vựng quan trọng cần ghi nhớ (kèm pinyin nếu có). Chỉ trả về bản tóm tắt (không cần lời dẫn/giải thích thêm):\n\n'
                    + material;
                try {
                    const result = await callGroqAPI(apiKey, prompt, (attempt, total) => setRetryInfo({ attempt, total }));
                    setSummary(result);
                } catch (err) {
                    setError(err && err.message ? err.message : 'Có lỗi khi tóm tắt, thử lại nhé.');
                } finally {
                    setLoading(false); setRetryInfo(null);
                }
            };

            const handleCopy = (text, markCopied) => {
                navigator.clipboard.writeText(text);
                markCopied();
            };

            const handleSave = () => {
                if (!summary) return;
                onSave({ id: Date.now(), text: summary, timestamp: Date.now() });
                setSavedJustNow(true);
                setTimeout(() => setSavedJustNow(false), 2000);
            };

            return (
                <div className="w-full glass-panel rounded-2xl flex flex-col overflow-hidden shadow-2xl border-2 border-amber-100">
                    <div className="bg-slate-100/80 px-4 py-2 border-b border-slate-200 shrink-0 flex items-center justify-between gap-2">
                        <span className="text-xs font-extrabold text-amber-600 tracking-wide flex items-center gap-1.5 uppercase">
                            <i className="fas fa-clipboard-list"></i> Tóm tắt phiên dạy
                        </span>
                        <div className="flex items-center gap-2">
                            <button onClick={onOpenSettings} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-amber-600 hover:bg-amber-50 transition-colors" title="Cài đặt API key Groq">
                                <i className="fas fa-gear text-sm"></i>
                            </button>
                            <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-white hover:bg-red-500 transition-colors bg-white border border-slate-200">
                                <i className="fas fa-times text-md"></i>
                            </button>
                        </div>
                    </div>

                    <div className="p-5 bg-white flex-1 space-y-4 max-h-[65vh] overflow-y-auto">
                        {!apiKey ? (
                            <div className="bg-amber-50 border border-amber-100 rounded-xl p-4 text-sm text-amber-700 space-y-2">
                                <p>Chưa có API key Groq. Nhập key (miễn phí, không cần thẻ ngân hàng, lấy ở Groq Console) để dùng tính năng này.</p>
                                <button onClick={onOpenSettings} className="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold transition-all active:scale-95">
                                    Nhập API key ngay
                                </button>
                            </div>
                        ) : (
                            <React.Fragment>
                                <p className="text-xs text-slate-500 leading-relaxed">
                                    Gom tất cả ghi chú (Text Box) trên mọi trang + các câu trả lời Bút AI đã bấm "Lưu" trong phiên đang mở này, nhờ AI tổng hợp thành 1 bản tóm tắt sẵn sàng để ôn luyện.
                                </p>
                                <button
                                    onClick={runSummarize}
                                    disabled={loading}
                                    className={"w-full px-3 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 justify-center transition-all active:scale-95 border bg-amber-500 text-white border-amber-500 hover:bg-amber-600" + (loading ? ' opacity-60 cursor-not-allowed' : '')}
                                >
                                    <i className="fas fa-wand-magic-sparkles"></i> Tóm tắt ngay
                                </button>

                                {loading && (
                                    <div className="flex items-center justify-center gap-3 text-amber-600 py-4">
                                        <i className="fas fa-circle-notch fa-spin text-2xl"></i>
                                        <span className="font-bold text-sm">{retryInfo ? `Máy chủ Groq đang hơi bận, đang thử lại (lần ${retryInfo.attempt}/${retryInfo.total})...` : 'AI đang tổng hợp...'}</span>
                                    </div>
                                )}
                                {error && <p className="text-xs text-amber-600 font-semibold leading-relaxed">{error}</p>}
                                {summary && !loading && (
                                    <div className="relative bg-slate-50 border border-slate-200 rounded-xl p-4 pr-12">
                                        <div className="ai-markdown" dangerouslySetInnerHTML={renderMarkdownAnswerHtml(summary)}></div>
                                        <div className="absolute top-3 right-3 flex flex-col gap-2">
                                            <button onClick={() => handleCopy(summary, () => { setCopied(true); setTimeout(() => setCopied(false), 2000); })} className="w-8 h-8 flex items-center justify-center rounded-lg text-amber-600 bg-amber-50 hover:bg-amber-600 hover:text-white transition-colors border border-amber-100" title="Sao chép">
                                                <i className={copied ? "fas fa-check text-green-500" : "fas fa-copy"}></i>
                                            </button>
                                            <button onClick={handleSave} className="w-8 h-8 flex items-center justify-center rounded-lg text-indigo-600 bg-indigo-50 hover:bg-indigo-600 hover:text-white transition-colors border border-indigo-100" title="Lưu (giữ trong phiên này)">
                                                <i className={savedJustNow ? "fas fa-check text-green-500" : "fas fa-bookmark"}></i>
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {savedSummaries && savedSummaries.length > 0 && (
                                    <div className="pt-2 border-t border-slate-100 space-y-2">
                                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wide">Đã lưu trong phiên này ({savedSummaries.length})</p>
                                        {savedSummaries.map(s => (
                                            <div key={s.id} className="relative bg-indigo-50/50 border border-indigo-100 rounded-xl p-3 pr-20 text-xs">
                                                <div className="ai-markdown" dangerouslySetInnerHTML={renderMarkdownAnswerHtml(s.text)}></div>
                                                <div className="absolute top-2 right-2 flex items-center gap-1.5">
                                                    <button onClick={() => handleCopy(s.text, () => { setCopiedSavedId(s.id); setTimeout(() => setCopiedSavedId(null), 2000); })} className="w-7 h-7 flex items-center justify-center rounded-lg text-indigo-600 bg-white hover:bg-indigo-600 hover:text-white transition-colors border border-indigo-100" title="Sao chép">
                                                        <i className={copiedSavedId === s.id ? "fas fa-check text-green-500" : "fas fa-copy text-[11px]"}></i>
                                                    </button>
                                                    <button onClick={() => onDeleteSaved(s.id)} className="w-7 h-7 flex items-center justify-center rounded-lg text-red-500 bg-white hover:bg-red-500 hover:text-white transition-colors border border-red-100" title="Xoá">
                                                        <i className="fas fa-trash text-[11px]"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                </div>
            );
        };

        // Canvas dùng chung (tạo đúng 1 lần, không nằm trong DOM) để đo bề ngang chữ thật sự sẽ
        // được vẽ ra — dùng cho tính năng Text Box "tự giãn theo chữ gõ" bên dưới. Đo bằng canvas
        // 2D context (measureText) chính xác hơn hẳn cách đoán mò theo số ký tự, vì còn tính đúng
        // cả chữ đậm/nhạt, khoảng trắng, ký tự rộng-hẹp khác nhau (i mảnh vs W rộng, chữ Hán vuông...).
        // Port từ bản Night IELTS Land — giữ nguyên font stack "Plus Jakarta Sans" nhưng thêm "Noto
        // Sans TC" khớp với font hiển thị thật của app này (xem getAnnotationSnapshot ở PdfPage).
        const textBoxMeasureCanvas = document.createElement('canvas');
        const textBoxMeasureCtx = textBoxMeasureCanvas.getContext('2d');
        const measureMaxLineWidthPx = (text, fontPx) => {
            textBoxMeasureCtx.font = fontPx + 'px "Plus Jakarta Sans", "Noto Sans TC", sans-serif';
            const lines = (text || '').split('\n');
            let maxW = 0;
            for (const line of lines) {
                const w = textBoxMeasureCtx.measureText(line.length ? line : ' ').width;
                if (w > maxW) maxW = w;
            }
            return maxW;
        };
        // Kích thước tối thiểu của Text Box (đơn vị PDF-space, tức CHƯA nhân "scale" — khớp với
        // t.x/t.y/t.width/t.height vốn dĩ đều đang lưu ở "scale 1").
        const TEXTBOX_MIN_WIDTH = 60;
        const TEXTBOX_MIN_HEIGHT = 30;
        // Khoảng đệm ngang (px CSS thật, KHÔNG nhân theo scale — khớp đúng padding "p-2" của
        // textarea, 8px mỗi bên = 16px, cộng thêm 1 chút cho con trỏ nhập khỏi bị che/xuống dòng
        // hụt 1 nhịp ngay khi vừa gõ thêm ký tự).
        const TEXTBOX_PADDING_PX = 24;

        // --- COMPONENT TEXT BOX THÔNG MINH CÓ 3 NÚM RESIZE ---
        // QUAN TRỌNG (viết lại theo yêu cầu "text box khó dùng" — port từ bản Night IELTS Land):
        // TRƯỚC ĐÂY box có kích thước CỐ ĐỊNH (150x40) trừ khi tự kéo resize thủ công — gõ dài ra là
        // chữ bị bó hẹp/xuống dòng chật chội trong khung cũ, phải tự kéo giãn ra mới thấy hết. GIỜ
        // box tự "phình" ra theo đúng bề ngang chữ đang gõ (đo bằng canvas.measureText, khớp CHÍNH
        // XÁC font đang hiển thị) cho tới khi chạm mép phải trang (maxWidthPdf, App tính từ
        // basePageSize truyền xuống qua PdfPage) thì tự xuống dòng + tự cao thêm (đo bằng scrollHeight
        // của chính textarea) — gõ/xoá bớt chữ thì box cũng tự thu nhỏ lại theo, không còn khoảng
        // trống thừa. Việc kéo núm resize thủ công giờ có vai trò MỚI: phóng to/thu nhỏ CỠ CHỮ (đồng
        // thời với việc box đổi kích thước theo đúng ngón tay/con trỏ) — thay vì tự đặt 1 kích thước
        // khung cố định, vì khung giờ luôn tự khớp theo nội dung + cỡ chữ rồi.
        const PdfTextBox = React.memo(function PdfTextBox({ t, scale, updateText, removeText, maxWidthPdf }) {
            const [active, setActive] = useState(true);
            // QUAN TRỌNG (sửa lỗi "gõ bị nhảy giật giật nhẹ"): TRƯỚC ĐÂY viền đậm + nút Xoá + nắm kéo
            // Move + 3 núm resize hiện ra NGAY khi vừa chạm 1 lần vào box (dùng chung điều kiện "active"
            // với việc cho phép gõ chữ) — trong lúc gõ, box liên tục tự đổi kích thước (2 effect tự-giãn
            // bên dưới), kéo theo viền + 5 phần tử điều khiển định vị tuyệt đối đó phải định vị lại theo
            // MỌI lần đổi kích thước, tạo cảm giác "giật" nhẹ. Giờ TÁCH RIÊNG 2 khái niệm: "active" (cho
            // phép gõ chữ — vẫn bật ngay từ 1 lần chạm, để gõ chữ mượt mà không đợi) và "controlsVisible"
            // (hiện viền đậm + toàn bộ nút điều khiển — CHỈ bật khi chạm/click ĐÚP vào box, theo đúng yêu
            // cầu) — lúc chỉ đang gõ (controlsVisible=false), không còn phần tử điều khiển nào phải định
            // vị lại nữa nên hết giật.
            const [controlsVisible, setControlsVisible] = useState(false);
            // Mốc thời gian lần chạm gần nhất vào CHÍNH box này — dùng để tự bắt double-tap/double-click
            // (giống cơ chế bắt double-tap tạo box mới ở PdfPage) thay vì dựa vào sự kiện "dblclick" có
