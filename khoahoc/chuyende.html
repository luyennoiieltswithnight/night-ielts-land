<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>25 Chuyên đề Tiếng Anh THPT - Night IELTS Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột lộ trình đọc từ trên xuống; mỗi buổi = 1 hàng, lõi Band 6 luôn hiện, Band 8 mở bằng nút */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --ink:#1b2033; --muted:#5d6479; --line:#e1e4ee;
  --b6:#2f4fd8; --b6-soft:#e8ecfd; --b8:#b9770e; --b8-soft:#fdf3e1; --b8-ink:#7a4e05;
  --t1:#2f4fd8; --t2:#0f8a6a; --rev:#9a3d8f;
  --f-display:"Fraunces", Georgia, serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131c; --surface:#1a1d29; --ink:#e8eaf3; --muted:#9ba1b6; --line:#2b2f3f;
  --b6:#8ea2ff; --b6-soft:#222a4d; --b8:#f0b54a; --b8-soft:#2e2514; --b8-ink:#f6cd82;
  --t1:#8ea2ff; --t2:#4fd1aa; --rev:#e08ad4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131c; --surface:#1a1d29; --ink:#e8eaf3; --muted:#9ba1b6; --line:#2b2f3f;
  --b6:#8ea2ff; --b6-soft:#222a4d; --b8:#f0b54a; --b8-soft:#2e2514; --b8-ink:#f6cd82;
  --t1:#8ea2ff; --t2:#4fd1aa; --rev:#e08ad4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);max-width:65ch;margin:0}
header{display:flex;flex-direction:column;gap:12px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.book b{font-size:15px}
.book span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font:600 11px/1 var(--f-mono);padding:5px 7px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.tag.b6{background:var(--b6-soft);color:var(--b6)}
.tag.b8{background:var(--b8-soft);color:var(--b8-ink)}
.howto{font-size:14px;color:var(--muted);margin:0;max-width:70ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.chip{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.b8btn:focus-visible{outline:2px solid var(--b6);outline-offset:2px}
.spacer{flex:1}
.phase{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.phase .bar{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(-1px)}
.phase small{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:12px}
.s{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:64px 1fr;overflow:hidden}
.num{display:flex;flex-direction:column;align-items:center;padding-top:18px;gap:2px;border-right:1px solid var(--line)}
.num b{font:700 24px/1 var(--f-display)}
.num i{font-style:normal;font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.top h3{margin:0;font-size:17px;line-height:1.35;flex:1 1 260px}
.kind{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.part{display:flex;flex-direction:column;gap:6px}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
li{max-width:70ch}
.class{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;color:var(--muted)}
.class b{color:var(--ink)}
.b8btn{align-self:flex-start;font:700 13px var(--f-body);border:1.5px solid var(--b8);color:var(--b8-ink);background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.b8btn[aria-expanded="true"]{background:var(--b8);color:var(--surface)}
.b8btn .arr{transition:transform .2s}
.b8btn[aria-expanded="true"] .arr{transform:rotate(180deg)}
.b8panel{background:var(--b8-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.b8panel .src{color:var(--b8-ink)}
.map{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font:600 13px var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .books{grid-template-columns:1fr}
  .s{grid-template-columns:1fr}
  .num{flex-direction:row;justify-content:flex-start;gap:8px;padding:12px 18px 0;border-right:0}
}
@media (prefers-reduced-motion:reduce){.b8btn .arr{transition:none}}

.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.go{font:700 13px var(--f-body);background:var(--b6);color:var(--surface);text-decoration:none;padding:8px 16px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.soon{font-size:12px;font-weight:600;color:var(--muted);border:1px dashed var(--line);padding:7px 12px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">← Night IELTS Land</a>
    <span class="eyebrow">Night IELTS · Chuyên đề THPT</span>
    <h1>25 Chuyên đề Tiếng Anh THPT</h1>
    <p class="lead">Mỗi chuyên đề là một trang bài giảng: video ngắn 1 phút ở đầu mỗi phần để xem trước, rồi công thức, ví dụ và bài tập tự chấm ngay bên dưới.</p>
    <p class="howto">Chuyên đề nào đã lên bài sẽ hiện nút “Vào học”.</p>
  </header>
  <main id="root"></main>
</div>
<script>
// Thêm/sửa tên chuyên đề ở đây. Quy ước file: Chuyên đề 5 ↔ khoahoc/chuyende/buoi-05.html
const S = [
 {n:1,t:"Phát âm",pts:["Cách làm dạng chọn từ có phần gạch chân đọc khác","Nguyên âm, phụ âm và các chữ cái hay bẫy","Đuôi -s/-es và đuôi -ed, tính từ -ed đặc biệt"]}
];
for(let i=S.length+1;i<=25;i++) S.push({n:i,t:"Chuyên đề "+i,pts:[]});
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
document.getElementById("root").innerHTML=`<div class="list" style="display:flex;flex-direction:column;gap:12px">${S.map(s=>`<article class="s" id="cd-${s.n}">
   <div class="num"><i>Chuyên đề</i><b>${s.n}</b></div>
   <div class="body">
    <div class="top"><h3>${esc(s.t)}</h3></div>
    ${s.pts.length?`<div class="part"><ul>${s.pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`:""}
    <div class="actions"><span class="lesson" data-n="${s.n}"><span class="soon">Đang kiểm tra…</span></span></div>
   </div></article>`).join("")}</div>`;
const LESSON_FOLDER="chuyende/";
document.querySelectorAll(".lesson").forEach(el=>{
  const url=LESSON_FOLDER+"buoi-"+String(el.dataset.n).padStart(2,"0")+".html";
  fetch(url,{method:"HEAD",cache:"no-store"}).then(r=>r.ok).catch(()=>false).then(ok=>{
    el.innerHTML=ok?`<a class="go" href="${url}">Vào học <span aria-hidden="true">→</span></a>`:`<span class="soon">Sắp ra mắt</span>`;
  });
});
</script>
<script src="https://luyennoiieltswithnight.github.io/night-ielts-land/vocab-teach.js" defer></script>
</body>
</html>
