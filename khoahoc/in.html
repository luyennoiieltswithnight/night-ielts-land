<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>In tài liệu cả khoá — Night IELTS</title>
<link rel="icon" href="../icons/favicon-32.png" type="image/png">
<!-- Trang in cả khoá: đọc dữ liệu của mọi buổi (khoahoc/<khoá>/buoi-XX.html) rồi mở trình in của night-engine
     với tất cả các buổi — chọn buổi cần in, cỡ chữ, có/không đáp án… rồi "In / Lưu PDF".
     Mở bằng: in.html?course=writing&title=IELTS%20Writing -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="night-engine.js?v=20261028b"></script>
<style>
  body{margin:0;background:#B9BCF4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#24242A}
  #nv-load{max-width:460px;margin:12vh auto;background:#fff;border-radius:32px;padding:32px;text-align:center;box-shadow:0 30px 70px -25px rgba(36,36,42,.5)}
  #nv-load b{display:block;font-size:22px;margin-bottom:6px}#nv-load p{margin:0;color:#64748b;font-weight:600}
  #nv-load .bar{height:10px;border-radius:99px;background:#EDEEFD;margin-top:18px;overflow:hidden}#nv-load .bar i{display:block;height:100%;width:0;background:#6C70DC;transition:width .2s}
</style>
</head>
<body>
<div id="nv-load"><b>🖨 Đang gom tài liệu cả khoá…</b><p id="nv-msg">Đang tìm các buổi học</p><div class="bar"><i id="nv-bar"></i></div></div>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const course = (q.get("course") || "").replace(/[^a-z0-9_-]/gi, "");
  const msg = document.getElementById("nv-msg"), bar = document.getElementById("nv-bar");
  if (!course) { msg.textContent = "Thiếu tên khoá (?course=…)."; return; }
  const MAX = 60, pad = (n) => String(n).padStart(2, "0");
  let done = 0;
  // Chạy script của trang buổi học với một NightLesson "giả" để lấy dữ liệu bài, không vẽ ra màn hình
  const readLesson = async (n) => {
    const url = `${course}/buoi-${pad(n)}.html`;
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) return null;
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      let got = null;
      const stub = { render(o) { got = o; }, printCourse() {} };
      doc.querySelectorAll("script:not([src])").forEach((sc) => { try { new Function("NightLesson", sc.textContent)(stub); } catch (e) {} });
      if (got) { got.__base = new URL(url, location.href).href; got.__n = n; }
      return got;
    } catch (e) { return null; }
    finally { done++; bar.style.width = Math.round(done / MAX * 100) + "%"; }
  };
  const all = await Promise.all(Array.from({ length: MAX }, (_, i) => readLesson(i + 1)));
  const lessons = all.filter(Boolean);
  if (!lessons.length) { msg.textContent = "Chưa tìm thấy buổi học nào của khoá này."; return; }
  document.getElementById("nv-load").remove();
  NightLesson.printCourse(lessons, { title: q.get("title") || lessons[0].course || course, back: `${course}.html` });
})();
</script>
<script src="/night-app.js" defer></script>
</body>
</html>
