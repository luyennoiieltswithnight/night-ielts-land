      title: "Luyện nói Education & Weather — dùng khung Mở · Chuyển · Kết",
      desc: "Part 2: **1 phút ghi chú** → 2 phút nói, đánh dấu sẵn chỗ dùng *I'd start by saying / Moving on to / So that's about it*. Part 3: **2 ý** nối bằng *To begin with → On top of that*. Xong thì mở tool AI để được chấm.",
      tabs: [
        {
          label: "Part 2 · Education", mode: "part2", prep: 60, talk: 120, target: 90,
          intro: "2 đề trong sách (tr.109, tr.111). Ghi chú theo khung: Now → I'd start by saying → Moving on to → The first reason / On top of that → So that's about it.",
          ai: { title: "Speaking 6.0 · Buổi 12 · Part 2 + 3 (Education)", merge: [1] },
          checklist: ["Có đủ khung: Now / I'd start by saying / Moving on to / So that's about it", "Có ít nhất 1 *for example* + 1 *such as / including* đúng ngữ pháp", "Phần explain có 2 lý do (Firstly / On top of that)", "Giảm âm *to, for, and, of* tự nhiên", "Nói được ít nhất 1:30"],
          items: [
            { card: { topic: "Describe an exam that was very hard for you.", points: ["what exam it was", "when you took this exam", "why you took this exam"], explain: "and explain why this was so hard for you." },
              hints: ["Now I'd like to talk about…", "I'd start by saying that it was…, which…", "Moving on to when / why I took it…", "The exam was so hard because, firstly… On top of that… So that's about it."],
              sample: "Now I'd like to talk about an exam that was really hard for me. **I'd start by saying that** it was the grade 10 entrance exam in Hanoi, which every student has to take to get into a public high school. **Moving on to** when I took it, it was in June about five years ago, when I was fifteen. I took it because I really wanted to study at a well-known high school near my house, and private schools were too expensive for my family. The exam was so hard for me because, **firstly**, there was a huge amount to learn, **including** maths, literature and English, and the questions were much more difficult than the ones we did at school. I spent almost every evening at extra classes for a whole year. **On top of that**, the competition was fierce. **For example**, at my dream school, only about one in five students got a place, so I was **under a lot of pressure**. On the day of the maths test, **my mind went blank** for the first ten minutes, and I thought I'd failed. Luckily, I calmed down and finished it, and in the end I got into the school. **So that's about it** — it was tough, but it taught me a lot about hard work." },
            { card: { topic: "Describe a course you would like to take in the future.", points: ["what this course is about", "where you would like to take it", "what you would learn in that course"], explain: "and explain why you would like to take this course." },
              hints: ["I'd start by saying that I've always been interested in…", "Moving on to where it's offered…", "In this course, I would learn… such as…", "The first reason… On top of that… So I guess that's about it."],
              sample: "Now I'm going to talk about a course I'd like to take in the future. **I'd start by saying that** I've always been terrible at speaking in front of people, so I'd love to take a **public speaking** course. **Moving on to** where I'd like to take it, there are quite a few centres in Ho Chi Minh City that offer short evening courses, and some of them are taught by experienced trainers who used to be TV presenters. In this course, I would learn practical skills **such as** how to structure a talk, how to use my voice and body language, and how to deal with nerves. Most classes involve giving short speeches and getting feedback. **The first reason** why I want to take this course is that it would **boost my confidence**. Right now, even presenting a short project at university makes my hands shake. **On top of that**, I think it would **open doors to** better jobs, because almost every company wants employees who can communicate clearly. **For example**, my cousin took a similar course and got promoted to team leader a year later. It would definitely push me to **step out of my comfort zone**. **So, I guess that's about it.** It's a goal I really want to achieve after I graduate." },

        {
          label: "Part 3 · Education", mode: "part3", talk: 60, target: 40,
          intro: "3 câu trong sách (tr.111) + 1 câu mở rộng. Mỗi câu **2 ý**: *To begin with → On top of that*, có ít nhất 1 ví dụ.",
          ai: { id: "sp6-b12-p1", title: "Speaking 6.0 · Buổi 12 · Part 2 + 3 (Education)", merge: [0] },
          checklist: ["Có 2 ý nối bằng từ nối trình tự", "Có *This is because…* hoặc lý do rõ ràng", "Có 1 ví dụ (*For example,* + câu)", "Không lặp *Firstly, Secondly, Thirdly*", "Nói ≥ 40 giây"],
          items: [
            { q: "What qualities make a good teacher?", vi: "Phẩm chất nào làm nên một giáo viên giỏi?", hints: ["To begin with, … patient / adaptable", "This is because…", "For example, my teacher…", "On top of that, passionate / motivating"],
              sample: "**To begin with**, I'd say a good teacher needs to be **patient**. **This is because** every class has students who learn at different speeds, and some of them need things explained more than once. **For example**, my maths teacher in high school always stayed after class to help weaker students, so nobody was afraid to ask questions. **On top of that**, good teachers should be **passionate** about their subject, because their energy is really **motivating**. **So overall**, I think patience and passion matter even more than knowledge." },
            { q: "What changes would you like to see in the education system in your country?", vi: "Bạn muốn thấy những thay đổi gì trong hệ thống giáo dục nước mình?", hints: ["There are a couple of changes…", "First of all, more practical knowledge", "Another thing… teacher salaries / mental well-being", "If you ask me, …"],
              sample: "**There are a couple of changes** I think are necessary. **First of all**, schools should teach more practical skills, **such as** managing money or basic first aid, to prepare students for **real-life challenges**. Right now, there's too much focus on **theoretical knowledge** and memorising formulas. **Another thing** that should be improved is students' **mental well-being**. Many teenagers study from morning until 10 p.m. at extra classes, which is exhausting. **If you ask me**, schools should have counsellors and fewer exams." },
            { q: "How can parents support their children's education outside of school?", vi: "Cha mẹ có thể hỗ trợ việc học của con ngoài giờ học ở trường như thế nào?", hints: ["To begin with, I'd say parents should…", "help with homework / read together", "On top of that, … limit distractions / museums", "In this way, …"],
              sample: "**To begin with**, I'd say parents should encourage **curiosity** at home, for example by reading with their children or answering their questions patiently. **On top of that**, they can take their kids to places **such as** museums, zoos or historical sites, which give children **hands-on experiences** that textbooks can't. **For instance**, my parents took me to the Temple of Literature when I was ten, and that's when I started loving history. **In this way**, learning becomes fun rather than a duty." },
            { q: "Is online learning as effective as learning in a classroom?", vi: "Học trực tuyến có hiệu quả bằng học trên lớp không?", hints: ["I'd say not completely", "To begin with, online is flexible…", "On top of that / However, easily distracted…", "So overall, a mix…"],
              sample: "**I'd say not completely.** **To begin with**, online learning is very flexible — students can study anytime and anywhere, and they can **take online courses** from top universities for free. **However**, it's much easier to get distracted at home. **For example**, during the pandemic, many of my classmates turned off their cameras and just played games. **On top of that**, students miss out on face-to-face interaction with teachers and friends. **So overall**, I think a mix of both is the best option." },
          ],
        },

          items: [
            { q: "What's the weather like where you live?", vi: "Thời tiết nơi bạn sống thế nào?", hints: ["It depends on the season", "summer: hot and humid · winter: chilly", "for example…"],
              sample: "**It depends on the season.** I live in Hanoi, so we have four seasons. Summer is **boiling hot** and **humid** — **for example**, last June it was nearly 40°C for a whole week. Winter, on the other hand, can be quite **chilly** and damp. Autumn is definitely the best time of year." },
            { q: "Do you prefer hot or cold weather?", vi: "Bạn thích thời tiết nóng hay lạnh?", hints: ["I'd say cold, because…", "I can always put on more layers", "in hot weather I sweat buckets"],
              sample: "**I'd say cold weather**, to be honest. When it's cold, I can always put on more layers, but when it's hot, there's nothing I can do — I **sweat buckets** just riding my motorbike to university. Cold weather also makes me feel more energetic and productive." },
