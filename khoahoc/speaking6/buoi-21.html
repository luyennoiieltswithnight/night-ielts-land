    {
      type: "speak", id: "luyen-noi", nav: "Luyện nói",
      title: "Luyện nói Part 3 — Agree / Disagree & tổng hợp 4 dạng",
      desc: "Câu Agree/Disagree: **lập trường + mức độ ngay câu đầu**, rồi IDEO. Các câu khác (List, Compare, Speculate) áp công thức Buổi 16–19. Mỗi câu cài **1 mệnh đề trạng ngữ**. Xong thì mở tool AI để được chấm.",
      tabs: [
        {
          label: "Animals & Advertising", mode: "part3", talk: 60, target: 40,
          intro: "2 câu trong sách (tr.77–78) + 3 câu **Luyện tập thêm** về Quảng cáo (tr.79–82).",
          ai: { title: "Speaking 6.0 · Buổi 21 · Part 3 Agree/Disagree (Animals & Advertising)" },
          checklist: ["Câu đầu nêu rõ lập trường + mức độ", "Ngữ điệu khớp thái độ (chắc ↘ / cân nhắc ↗↘)", "Có 1 mệnh đề trạng ngữ (although / if / since / so that…)", "Có ví dụ", "Có câu chốt", "Nói ≥ 40 giây"],
          items: [
            { q: "Do you think it's cruel to keep animals in zoos?", vi: "Bạn có nghĩ nhốt động vật trong sở thú là tàn nhẫn không?", hints: ["In a way, yes — especially wild animals", "can't replicate natural habitat — can't roam, hunt", "lose their instincts / stressed", "zoos should mimic nature so that…"],
              sample: "**In a way, yes**, especially **when** it comes to wild animals like tigers or elephants. **This is because** no zoo can truly **replicate their natural habitat**. They're **locked up in** small enclosures, so they can't **roam, hunt or migrate**, and gradually they **lose their instincts**. **For example**, you sometimes see bears walking in circles for hours, which is a sign of stress. **That's why** I believe zoos should **mimic** nature as much as possible, **so that** animals can live more naturally." },
            { q: "Should animals be used for scientific purposes?", vi: "Có nên dùng động vật cho mục đích khoa học không?", hints: ["I believe they should, but…", "crucial for vaccines — test safety and effectiveness", "mice — biological similarities", "Although…, ethical and humane"],
              sample: "**I believe they should**, **although** I know it's a sensitive issue. **Animal testing** is crucial for developing **vaccines and treatments**, **because** new drugs must be tested to ensure their **safety and effectiveness** before humans use them. Mice are used the most **since** they have many **biological similarities** to humans. **So honestly**, I think it's **a necessary evil**. **However**, the research must be done in an **ethical and humane** way." },
            { q: "Do you think advertising influences people's buying decisions?", vi: "Bạn có nghĩ quảng cáo ảnh hưởng đến quyết định mua hàng không?", hints: ["Definitely", "highlight benefits, beautiful visuals, celebrities", "e.g. a celebrity makes us trust a product", "Although ads help introduce products, do research"],
              sample: "**Definitely.** Ads highlight the benefits of products and use attractive visuals and catchy **jingles**, which encourage people to buy things they may not even need. **For instance**, **when** a famous singer appears in a commercial, viewers tend to think the product is more reliable, even if they've never tried it. **Personally**, **although** ads can be helpful for introducing new products, I think consumers should do some research **before** making a decision." },
            { q: "Do you think advertisements always provide truthful information?", vi: "Quảng cáo có luôn cung cấp thông tin trung thực không?", hints: ["Not really", "focus only on positive aspects, exaggerate benefits", "e.g. weight-loss products — instant results, no side effects", "be cautious — stretch the truth"],
              sample: "**Not really.** Companies often focus only on the positive aspects and **exaggerate** the benefits **so that** the product looks more appealing. **For example**, some weight-loss products promise instant results but rarely mention the side effects — it's usually **too good to be true**. **In my opinion**, people should **be cautious** and not **take ads at face value**, **because** companies may **stretch the truth** to boost sales." },
            { q: "Do you think there should be stricter regulations on advertising?", vi: "Có nên có quy định nghiêm ngặt hơn về quảng cáo không?", hints: ["In my view, yes — protect consumers, especially young minds", "some ads promote harmful products", "e.g. ban junk food ads during children's TV programmes", "obese children — tighter regulations"],
              sample: "**In my view, yes**, **because** stricter rules would protect consumers, especially **young minds**. Some ads promote harmful products, so there should be clear **regulations and guidelines** to monitor them. **For instance**, banning junk food ads during children's TV programmes would be a good idea, **since** more and more Vietnamese kids are overweight nowadays. **If** companies **deceive** customers, they should pay a heavy fine. **I couldn't agree more** with tighter controls." },
          ],
        },
        {
          label: "Technology", mode: "part3", talk: 60, target: 40,
          intro: "4 câu trong phần **Mệnh đề trạng ngữ** của sách (tr.195–200) — đủ 4 dạng: Compare, Agree/Disagree, List, Speculate. Nhận dạng trước khi trả lời!",
          ai: { title: "Speaking 6.0 · Buổi 21 · Part 3 (Technology)" },
          checklist: ["Nhận đúng dạng câu → đúng công thức", "Có ít nhất 1 mệnh đề trạng ngữ", "Có ví dụ cụ thể", "Có câu chốt", "Nói ≥ 40 giây"],
          items: [
            { q: "How has technology changed the way people live their daily lives?", vi: "Công nghệ đã thay đổi cuộc sống hằng ngày của mọi người thế nào? (Compare)", hints: ["Compare — chọn 1–2 tiêu chí: shopping / communication / work", "In the past… whereas now…", "e.g. letters vs video calls", "more convenient"],
              sample: "**The way I see it**, technology has **revolutionised** our daily lives, **especially in terms of** communication. **When** my parents were young, they had to write letters or make expensive phone calls to talk to relatives far away, **whereas** now we can video-call anyone for free. Shopping has also changed — **in the past**, people had to go to physical stores, but now we just place an order on our phones and wait for delivery. **Personally**, I think it has made life much more convenient." },
            { q: "Do you think older people have difficulties using modern technology?", vi: "Người lớn tuổi có gặp khó khăn khi dùng công nghệ hiện đại không? (Agree/Disagree)", hints: ["Without a doubt, they do", "since they didn't grow up with it — not familiar", "e.g. my grandma + Zalo", "be patient when we teach them"],
              sample: "**Without a doubt, they do.** **Since** they didn't grow up with technology, they're not **familiar with** how smartphones or apps work, and they often feel **frustrated**. **For example**, it took my grandma almost a month to **get the hang of** video-calling on Zalo. **On top of that**, they can easily become victims of online **scams**. **That's why** I think young people should **be patient when** they teach them, and companies should design more **user-friendly interfaces**." },
            { q: "What are some disadvantages of modern technology?", vi: "Công nghệ hiện đại có những bất lợi gì? (List)", hints: ["The biggest problem: social media addiction — likes, comments", "As a result, waste hours", "Another: AI — students stop thinking critically", "isn't bad, but needs to be used properly"],
              sample: "**The biggest problem I can think of is** social media addiction. **When** people get likes and comments, they feel good about themselves, **so** they keep scrolling for hours and do nothing productive. **Another disadvantage is** AI. Many students now rely on it for their homework, **so that** they don't have to think, and **as a result** they lose the ability to **think critically**. **In my opinion**, technology itself isn't bad, but it's **a double-edged sword** — we need to learn how to use it properly." },
            { q: "What advancements in technology do you expect to see in the next 10 years?", vi: "Bạn mong đợi những tiến bộ công nghệ nào trong 10 năm tới? (Speculate)", hints: ["I expect renewable energy will be widely used", "even though expensive now", "solar panels on homes, electric vehicles", "beneficial to humans and environment"],
              sample: "**In the next ten years, I expect** renewable energy **will be** widely used, **even though** it's quite expensive to set up at the moment. **If** governments keep investing, more and more families **will** put solar panels on their roofs to generate their own electricity. Electric motorbikes **are also likely to** replace petrol ones in Vietnam's big cities, which **will** help reduce air pollution. **For me**, this is the most exciting change, **because** it's good for both people and the planet." },
          ],
        },
        {
          label: "Celebrity", mode: "part3", talk: 60, target: 40,
          intro: "4 câu **Luyện tập thêm** của sách (tr.200–204). Câu cuối là dạng Agree/Disagree — nói rõ lập trường ngay câu đầu.",
          ai: { title: "Speaking 6.0 · Buổi 21 · Part 3 (Celebrity)" },
          checklist: ["Nhận đúng dạng câu", "Có ít nhất 1 mệnh đề trạng ngữ", "Có ví dụ Việt Nam", "Dùng từ vựng Practice 6–8", "Nói ≥ 40 giây"],
          items: [
            { q: "What are the advantages and disadvantages of being a celebrity?", vi: "Làm người nổi tiếng có ưu và nhược điểm gì?", hints: ["Advantage: money — sponsorships → glamorous lifestyle", "However, in the public eye — judged, scrutinised", "harmful to mental health", "not everyone can handle it"],
              sample: "**In my view**, being famous allows you to earn a lot of money from **advertising contracts** and **sponsorships**. **As a result**, celebrities can enjoy a **glamorous lifestyle** that ordinary people can only dream of. **However**, being **in the public eye** also means people constantly judge you and **scrutinise** your every move. **Even if** you make a tiny mistake, it can go viral overnight, which is harmful to your mental health. **So** although many people want to be famous, not everyone can handle the pressure." },
