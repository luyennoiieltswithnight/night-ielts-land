              sample: "**I'd say yes, to some extent.** Fast fashion brands sell clothes **that** are very cheap but not **durable**, so people buy more and throw them away after a few months. This creates a huge amount of waste, **which** is terrible for the environment. **On the other hand**, it makes trendy clothes **affordable** for people on a low income. **So in my opinion**, the solution isn't to ban it, but to encourage people to buy less and donate or resell their old clothes." },
            { q: "Do you think people trust news on social media too much?", vi: "Bạn có nghĩ người ta tin tin tức trên mạng xã hội quá mức không?", hints: ["Yes, I think so, especially older people", "misinformation spreads like wildfire", "example: fake health tips", "fact-check / reliable sources"],
              sample: "**Yes, I think so**, especially older people **who** are new to the internet. On platforms like Facebook or TikTok, anyone can post anything, and **misinformation** **spreads like wildfire**. **For instance**, during the pandemic, my relatives kept sharing fake health tips **that** had no scientific evidence at all. **In my view**, schools should teach young people how to **fact-check** information and find **reliable sources**, **which** is a really important skill these days." },

          items: [
            { q: "How often do you watch or read the news?", vi: "Bạn có hay xem hoặc đọc tin tức không?", hints: ["every morning / in the evening, when…", "on my phone / on TV", ", which helps me…"],
              sample: "**Pretty much every day.** I usually read the news on my phone in the morning, **when** I'm waiting for the bus, **which** helps me **stay updated** without wasting time. My parents, on the other hand, still watch the evening news on VTV every night at 7 p.m. — it's like a family tradition." },
            { q: "What kinds of news are you interested in?", vi: "Bạn quan tâm loại tin tức nào?", hints: ["I'm interested in … news, which keeps me updated about…", "sports / entertainment / business / technology", "but I avoid…"],
              sample: "I'm mostly interested in technology news, **which** keeps me updated about new phones, apps and AI tools. I'm studying IT, so it's actually useful for my major. I also follow football news, especially when the national team plays. **To be honest**, I avoid political news because I find it a bit stressful." },
            { q: "How do you feel about news on social media platforms?", vi: "Bạn nghĩ sao về tin tức trên mạng xã hội?", hints: ["It's convenient, but…", "social media is a place where…", "take it with a pinch of salt / fact-check"],

            { q: "Do you prefer reading news or watching videos about it?", vi: "Bạn thích đọc tin hay xem video tin tức hơn?", hints: ["I'd say watching videos, because…", "short videos that explain…", "but articles give more detail"],
              sample: "**I'd say** watching videos, because I'm a visual learner. I follow a few YouTube channels **that** explain world news in about ten minutes with maps and charts, **which** makes complicated topics much easier to understand. **That said**, when something really important happens, I read a full **article** to get the details." },
