            { q: "What are the differences between keeping a pet and caring for a wild animal?", vi: "Nuôi thú cưng khác chăm sóc động vật hoang dã thế nào?", hints: ["Tiêu chí: living environment / human interaction", "pet: lives in your house", "wild: needs habitat to roam, hunt, explore", "not everyone can…"],

          items: [
            { q: "Is online shopping more convenient than traditional shopping?", vi: "Mua sắm online có tiện hơn mua sắm truyền thống không?", hints: ["Yes, definitely", "Tiêu chí: time & effort", "anytime, anywhere, delivered to your doorstep", "but customer satisfaction: can't try on"],

            { q: "What are the differences between living in the city and in the countryside?", vi: "Sống ở thành phố và nông thôn khác nhau thế nào?", hints: ["Tiêu chí: opportunities vs quality of life", "city: jobs, services, but noisy, polluted", "countryside: fresh air, peaceful, cheaper, but fewer jobs", "pros and cons"],
