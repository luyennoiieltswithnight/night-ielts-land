          items: [
            { q: "Do you like watching movies or TV shows in your free time?", vi: "Bạn thích xem phim lẻ hay chương trình TV khi rảnh?", hints: ["Personally, I prefer…", "episodes are shorter / a complete story in one sitting", "while… / However, on weekends…"],

            { q: "Do you prefer going out or staying at home?", vi: "Bạn thích ra ngoài hay ở nhà hơn?", hints: ["I'd say staying at home, especially after…", "relaxing, recharge my batteries", "In contrast, going out = traffic, spending money", "That said…"],

          items: [
            { q: "Do you think children and adults enjoy the same types of entertainment?", vi: "Trẻ em và người lớn có thích cùng loại hình giải trí không?", hints: ["Personally, I think… different", "Children: colourful, simple — cartoons, toys", "In contrast, adults: thought-provoking — documentaries, podcasts", "That said, both love… board games, theme parks"],
              sample: "**Personally, I think** children and adults enjoy quite different things. Kids usually prefer entertainment that's colourful and simple, like **cartoons** or **animated movies**. **In contrast**, adults tend to like more **thought-provoking** content. **For example**, my dad listens to history **podcasts** every evening, which my little brother finds incredibly boring. **That said**, some things are fun for everyone — **board games** and **theme parks** are popular with the whole family, especially during Tet." },
            { q: "How does watching movies at home compare to watching them in a cinema?", vi: "Xem phim ở nhà so với xem ở rạp thế nào?", hints: ["From my point of view, the experiences are different", "At home: pause, rewind · while in the cinema: follow the schedule", "On top of that: comfort — snacks on the sofa", "For me, I prefer…"],
              sample: "**From my point of view**, the experiences are very different. At home, you can **pause and rewind** whenever you get distracted, **while** in the cinema you have to follow the schedule like everyone else. **On top of that**, home is far more comfortable — you can lie on the sofa with your own snacks. **On the other hand**, cinemas offer a big screen and amazing sound, which you can't get at home. **For me**, I watch most films at home, but action movies are a **must-see** on the big screen." },

              sample: "**I'd say yes, to some extent.** Video games are **interactive** and **engaging**, and many of them require teamwork and problem-solving skills. **For example**, my cousin learned a lot of English from playing online games with foreigners. **On the other hand**, some teenagers become addicted and spend all night gaming instead of sleeping or doing exercise. **So on balance**, games are fine for entertainment, but parents should set clear time limits." },

              sample: "**Personally, I prefer** to travel with others, **because** it's more fun and we can create memories together. It's also cheaper, since we can share the cost of hotels and taxis. Travelling solo, **on the other hand**, can feel a bit lonely. **That said**, I'd love to try a short **solo trip** one day to explore **at my own pace**." },
            { q: "Do you think travelling by plane is better than by train?", vi: "Đi máy bay có tốt hơn đi tàu hỏa không?", hints: ["I think it depends", "long distances, fast → plane", "On the other hand, if time isn't a factor → train, scenic views", "an interesting experience"],
