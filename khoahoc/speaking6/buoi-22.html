            { card: { topic: "Describe something you own that is very important to you.", points: ["what it is", "how long you have had it", "how you got it"], explain: "and explain why it is important to you." },

        {
          label: "Part 3 · 4 dạng", mode: "part3", talk: 60, target: 40,
          intro: "12 câu **mới**, mỗi câu ghi rõ **dạng** — nhận dạng → chọn công thức → nói. Chọn câu theo đúng chủ đề bạn vừa làm ở Part 2.",
          ai: { title: "Speaking 6.0 · Buổi 22 · Tổng ôn Part 3" },
          checklist: ["Nhận đúng dạng câu → đúng công thức", "Câu đầu trả lời thẳng (lập trường / dự đoán / ý chính)", "Có ít nhất 1 từ nối nhân – quả hoặc tương phản", "Có ví dụ cụ thể", "Có câu chốt", "Nói ≥ 40 giây"],
          items: [
            { q: "[List] What qualities make a good teacher or parent?", vi: "Phẩm chất nào làm nên một giáo viên / cha mẹ tốt?", hints: ["The most important quality is… patience", "Another important quality is…", "example"],
              sample: "**The most important quality, I'd say, is** patience. Children learn at different speeds and make lots of mistakes, so a good teacher or parent has to explain things again and again without getting angry. **Another important quality is** being a good listener. **For example**, my mum always listened when I had problems at school, **which** made me trust her completely. **So** patience and listening matter more than being strict." },
            { q: "[Compare] How is the relationship between parents and children different now compared to the past?", vi: "Quan hệ cha mẹ – con cái bây giờ khác trước thế nào?", hints: ["Tiêu chí: communication", "In the past: strict, children obey", "Nowadays: more like friends, open", "a step in the right direction"],
              sample: "**I think the biggest difference is in terms of** communication. **In the past**, Vietnamese parents were quite strict, and children were expected to obey without asking questions. **Nowadays**, many parents try to be more like friends — they talk openly with their kids and listen to their opinions. **For example**, my parents ask what I think before making family decisions, **whereas** my grandparents never did that. **Personally**, I think it's **a step in the right direction**." },
            { q: "[Speculate] Do you think people will have more free time in the future?", vi: "Trong tương lai mọi người có nhiều thời gian rảnh hơn không?", hints: ["I doubt it / I'd imagine…", "technology saves time, but…", "always connected to work", "only time will tell"],
              sample: "**Honestly, I doubt it.** **Although** technology will save us time on things like cooking or travelling, I think people will just fill that time with more work. **This is because** we're always connected — even now, my boss messages me at 10 p.m. **On the other hand**, if hybrid working **becomes the norm**, people might save hours of commuting. **So** it really depends on how we use technology — **only time will tell**." },
            { q: "[Agree/Disagree] Is it better to relax at home or to go out on weekends?", vi: "Cuối tuần nên thư giãn ở nhà hay ra ngoài thì tốt hơn?", hints: ["It depends, but personally…", "home: cheap, rest · out: socialise, fresh air", "That said…"],
              sample: "**I'd say it depends on the person**, but **personally**, I think going out is better. Most of us spend the whole week indoors in front of a screen, **so** getting some fresh air and seeing friends helps us **recharge our batteries**. **That said**, if someone has had an exhausting week, staying home and sleeping might be exactly what they need. **So** the best option is probably a mix of both." },
            { q: "[List] Why do people sometimes feel too busy nowadays?", vi: "Vì sao ngày nay mọi người hay cảm thấy quá bận?", hints: ["The main reason is work pressure", "Another reason: social media, can't switch off", "As a result…"],
              sample: "**I think the main reason is** work pressure. Competition is fierce, so people work long hours and take extra jobs to earn more. **Another reason is that** smartphones make it impossible to switch off — we check emails and social media all day. **As a result**, even our free time doesn't feel relaxing. **For example**, I often scroll on my phone for an hour and then feel I've wasted my evening. **That's why** many people feel constantly busy." },
            { q: "[Agree/Disagree] Should the government spend more money on public parks?", vi: "Chính phủ có nên chi nhiều tiền hơn cho công viên công cộng không?", hints: ["Absolutely", "health, cleaner air, free space for everyone", "e.g. Hanoi's lakes in the morning", "so that…"],
              sample: "**Absolutely.** Parks give everyone, rich or poor, a free place to exercise and relax. **This is because** many people in big cities live in small apartments with no outdoor space. **For example**, every morning you can see hundreds of people doing exercise around the lakes in Hanoi. Trees also help clean the air and cool the city down. **So** I think the government should invest more **so that** every neighbourhood has a green space within walking distance." },
            { q: "[Compare] How have people's hobbies changed over the years?", vi: "Sở thích của mọi người đã thay đổi thế nào qua các năm?", hints: ["Tiêu chí: indoor vs outdoor / technology", "past: outdoor games, collecting stamps", "now: online games, social media", "a far cry from"],
              sample: "**They've changed a lot, especially when it comes to** technology. **In the past**, people's hobbies were mostly offline — collecting stamps, playing chess or doing sports in the neighbourhood. **Nowadays**, many hobbies happen online, like gaming, making TikTok videos or watching streams. **On the other hand**, some old hobbies are coming back — film photography and pickleball are very trendy among young people now. **So** today's hobbies are **a far cry from** the past, but not completely different." },
            { q: "[Speculate] What do you think homes will be like in 50 years?", vi: "Nhà ở 50 năm nữa sẽ như thế nào?", hints: ["My guess is that… smaller, smarter", "smart devices, robots", "more apartments, fewer houses", "I expect…"],
              sample: "**My guess is that** homes will be **smaller but much smarter**. **Since** cities are getting so crowded, most people will probably live in apartments rather than houses. **At the same time**, smart devices will control everything — lights, temperature, even cooking. **For example**, robots might clean the house while we're at work. **I expect** homes will also be more eco-friendly, with solar panels on every roof. **Personally**, I'd love that." },
            { q: "[List] What are the benefits of learning a new skill as an adult?", vi: "Học kỹ năng mới khi đã trưởng thành có lợi ích gì?", hints: ["The biggest benefit is career", "Another benefit: mental health, confidence", "it's never too late to learn"],
              sample: "**The biggest benefit is** for your career. Learning a new skill, like coding or a foreign language, can **open doors to** better jobs and higher salaries. **Another important benefit is that** it keeps your brain active and boosts your confidence. **For example**, my aunt started learning English at 45, and now she travels abroad on her own. **So** I really believe **it's never too late to learn**." },
            { q: "[Agree/Disagree] Do you think young people today are under too much pressure?", vi: "Người trẻ ngày nay có chịu quá nhiều áp lực không?", hints: ["Without a doubt", "This is because exams, jobs, social media comparison", "As a result, stress, mental health", "parents and schools should…"],
              sample: "**Without a doubt.** **This is because** they face pressure from many directions — exams, finding a good job and comparing themselves with others on social media. **As a result**, many young people suffer from stress and even mental health issues. **For instance**, several of my friends had to see a counsellor during their final year. **In my opinion**, parents and schools should focus less on grades and more on students' well-being." },
            { q: "[Speculate] Will cities become better or worse places to live in the future?", vi: "Thành phố sẽ trở thành nơi sống tốt hơn hay tệ hơn?", hints: ["I'd say better, to some extent", "metro, electric vehicles, smart cities", "but overcrowding, housing prices", "a double-edged sword"],
              sample: "**I'd say better, to some extent.** Cities **are likely to** have more metro lines and electric vehicles, which **will** reduce traffic and pollution — Hanoi and Saigon are already building them. **However**, **as** more people move to cities, housing will become even more expensive and crowded. **So** urban growth is **a double-edged sword**: life will be more convenient, but not necessarily cheaper or happier." },
            { q: "[Compare] What are the differences between shopping in a small local shop and a big supermarket?", vi: "Mua sắm ở cửa hàng nhỏ và siêu thị lớn khác nhau thế nào?", hints: ["Tiêu chí: service / choice", "small shop: friendly, personal, bargain", "supermarket: wide range, fixed prices, clean", "each has pros and cons"],
              sample: "**I think the main difference is in terms of** service. In a small local shop, the owner usually knows you, so the service is friendly and personal, and you can even bargain a little. **In contrast**, supermarkets are less personal, **but** they offer a much wider range of products and the prices are fixed and clear. **For example**, I buy vegetables at the market near my house, **while** I go to the supermarket for imported goods. **So** each has its own pros and cons." },
