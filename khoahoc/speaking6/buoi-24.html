            { q: "How has the way people travel long distances changed in your country?", vi: "Cách mọi người đi xa ở nước bạn đã thay đổi thế nào? (Compare)", hints: ["Tiêu chí: speed / cost", "past: trains, buses — 30+ hours", "now: cheap flights, expressways", "far more convenient"],

            { q: "What are the advantages of travelling by train?", vi: "Đi tàu hỏa có những lợi ích gì? (List)", hints: ["The biggest advantage is scenic views", "Another: comfortable, can walk around, sleep", "e.g. Hue – Da Nang route"],
