            { q: "How do you think technology will change the way people work in the next 10 years?", vi: "Công nghệ sẽ thay đổi cách mọi người làm việc thế nào trong 10 năm tới?", hints: ["I'd say we'll work more efficiently", "automation takes over repetitive tasks", "AI tools assist in content creation", "equip ourselves with skills"],

            { q: "Will online learning completely replace traditional classroom education?", vi: "Học trực tuyến có thay thế hoàn toàn lớp học truyền thống không?", hints: ["If you ask me, no", "online is flexible, accessible", "but classrooms: interaction, engagement, group work", "so it won't replace"],
              sample: "**If you ask me**, it **won't**. It's true that online learning is more **flexible** and **accessible** — students can study anywhere, anytime. **However**, a traditional classroom offers much more **face-to-face interaction**. Students can have group discussions, do projects and get instant feedback from teachers, which helps them learn better. **Also**, online learners need to be very **self-disciplined**, and many teenagers aren't. **For that reason**, I think online learning **is here to stay**, but only as a support for classrooms." },
            { q: "How do you think education will change in the future?", vi: "Giáo dục sẽ thay đổi thế nào trong tương lai?", hints: ["In my view, the biggest change will be the curriculum", "more practical skills: finance, computers", "technology & AI in classrooms", "teachers should teach how to use AI properly"],
              sample: "**In my view**, the biggest change **will be** the **curriculum**. Right now, schools focus too much on theory, but in the future, students **will probably learn** more **practical skills**, like managing money, computer skills and time management. **On top of that**, technology **is going to** be used much more in classrooms — AI is already popular among students. **However**, teachers **will need to** show students how to use AI properly; **otherwise**, they'll just use it to cheat in their **assessments**." },

              sample: "**In my opinion**, we'**ll see** many more **independent artists**. **This is because**, with platforms like Spotify, YouTube and TikTok, singers **can** release music and reach fans without signing with a **record label**. **As a result**, there **will be** more **diversity** in the music we listen to. **Besides**, artists from different countries **are going to** collaborate more — **for example**, Vietnamese singers already do songs with Korean and Chinese artists. **To me**, that's an exciting change." },
            { q: "Do you think traditional music will disappear in the future?", vi: "Nhạc truyền thống có biến mất trong tương lai không?", hints: ["It won't be very popular, but it will never disappear", "reflects cultural heritage", "e.g. folk music on TV at Tet, quan họ, ca trù", "reminds young people of their roots"],
