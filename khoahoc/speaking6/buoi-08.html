              sample: "I work as a sales assistant at an electronics store in District 7. **My job involves helping** customers choose phones and laptops. **I've been** there **for** about a year and a half." },
            { q: "What do you like most about your job?", vi: "Bạn thích điều gì nhất ở công việc?", hints: ["Liking — B02", "Personally, I like the fact that…", "colleagues, learning"],
              sample: "**Personally**, I like the fact that I meet so many different people. Every day is different, and **I've learned** a lot about technology on the job. My colleagues are really supportive too." },
            { q: "Is there anything you dislike about your job?", vi: "Có điều gì bạn không thích ở công việc không?", hints: ["To be honest, …", "long hours, weekends", "but…"],
              sample: "**To be honest**, I'm not a big fan of the working hours. Shops are busiest at weekends, so I rarely get a Saturday off. It makes it hard to see my friends." },
            { q: "Have you ever thought about changing your job?", vi: "Bạn đã từng nghĩ đến việc đổi việc chưa?", hints: ["Have you ever — B06", "Yes, … / Not really, but…", "I'm thinking of + V-ing"],
              sample: "**Yes, a few times.** **Last year** I **applied** for an office job, but I **didn't get** it. **Now I'm thinking of** taking a marketing course first, so I'll have a better chance next time." },
            { q: "How do you usually get to work or school?", vi: "Bạn thường đi làm / đi học bằng gì?", hints: ["Habits — B03", "By motorbike / bus…", "How long · Why"],
              sample: "I usually go **by motorbike**. It's only about fifteen minutes if the traffic is OK, but during **rush hour** it can take twice as long. I'd love to take the metro, but there isn't a line near my house yet." },
            { q: "Do you prefer public transport or private transport?", vi: "Bạn thích phương tiện công cộng hay cá nhân?", hints: ["Liking / prefer — B02", "I'd go for… because…", "cost-effective vs flexible"],
              sample: "**I'd go for** private transport, at least in my city. A motorbike is much **more flexible** than a bus, and you can **get from A to B** quickly even down narrow alleys." },
            { q: "Have you ever been late because of traffic?", vi: "Bạn đã từng bị trễ vì kẹt xe chưa?", hints: ["Have you ever — B06", "the last time… (QKĐ)", "stuck in traffic"],
              sample: "**Countless times!** **The last time was** two weeks ago — it **rained** heavily and the streets **were** flooded, so I **got stuck in traffic** for almost an hour and **missed** an important meeting." },
            { q: "Do you think the government should make public transport free?", vi: "Chính phủ có nên miễn phí phương tiện công cộng không?", hints: ["Opinion — B04", "In theory, yes, but…", "fewer vehicles · cost"],
              sample: "**In theory, yes**, because more people would leave their motorbikes at home, **which means** less traffic and pollution. **But to be fair**, it would cost a lot, so maybe making it cheaper for students is more realistic." },
            { q: "Do you often listen to music?", vi: "Bạn có hay nghe nhạc không?", hints: ["Habits — B03", "pretty much every day", "When · Where · Why"],
              sample: "**Pretty much every day.** I **put on some music** while I'm commuting and when I cook dinner. It makes the time go much faster." },
            { q: "What kind of music do you like?", vi: "Bạn thích thể loại nhạc nào?", hints: ["Liking — B02", "For me, it's mainly…", "catchy, upbeat, lyrics"],
              sample: "**For me**, it's mainly K-pop. The songs **are** upbeat and catchy, so they **give** me energy in the morning. I don't understand all the **lyrics**, but I love the melodies." },
            { q: "Have you ever learned to play a musical instrument?", vi: "Bạn đã từng học nhạc cụ chưa?", hints: ["Have you ever — B06", "Yes → when, gave it up? · No → I'd love to…", "it's never too late"],
              sample: "**No, not yet.** My parents couldn't afford lessons when I **was** a kid. But **I've always wanted to** learn the guitar, and **it's never too late**, right?" },
            { q: "Do you think music is important in people's lives?", vi: "Âm nhạc có quan trọng trong cuộc sống không?", hints: ["Opinion — B04", "Absolutely, because…", "relax, connect with others"],
              sample: "**Absolutely.** Music helps people **unwind** after a stressful day and express feelings they can't put into words. **If you ask me**, it's hard to imagine a wedding or a party without it." },
          ],
        },
        {
          label: "Đề luyện thêm", mode: "part1", talk: 30, target: 15,
          intro: "**Hobbies → Books & Reading → Parties.** Dùng khi còn thời gian trên lớp, hoặc tự thi thử ở nhà trước khi luyện với AI.",
          ai: { title: "Speaking 6.0 · Buổi 08 · Mock Test Part 1 · Đề luyện thêm" },
          checklist: ["Câu đầu trả lời thẳng, đúng thì", "2–4 câu, 15–25 giây", "Có discourse marker (không lặp)", "Có 1 idiom / collocation", "Âm cuối, -s, -ed rõ"],
          items: [
            { q: "Do you have a hobby?", vi: "Bạn có sở thích nào không?", hints: ["Liking — B02", "I'm really into…", "it helps me…"],
              sample: "**Yes, I'm really into** photography. I take photos of old buildings around the city at weekends. It **helps me** slow down and notice little things I usually miss." },
            { q: "How much time do you spend on your hobby?", vi: "Bạn dành bao nhiêu thời gian cho sở thích?", hints: ["Habits — B03", "On average, I spend…", "on weekdays vs at the weekend"],
              sample: "**On average**, about five hours a week, mostly **at the weekend**. On weekdays I'm too busy, but I sometimes edit photos on my phone during my lunch break." },
            { q: "Is it a good idea to share your hobby with friends?", vi: "Chia sẻ sở thích với bạn bè có phải ý hay?", hints: ["Opinion — B04", "I'd say so, because…", "more fun, motivation"],
              sample: "**I'd say so.** Doing a hobby with friends **keeps you motivated**, and it's more fun. My friend and I go on photo walks together, and we always learn from each other's shots." },
            { q: "Have you ever given up a hobby?", vi: "Bạn đã từng bỏ một sở thích chưa?", hints: ["Have you ever — B06", "Yes, I used to… but…", "ran out of steam"],
              sample: "**Yes, I have.** I **started** learning to draw in high school, but I **ran out of steam** after a few months because I **wasn't** improving. Maybe I'll **give it another go** one day." },
            { q: "Do you like reading?", vi: "Bạn có thích đọc sách không?", hints: ["Liking — B02", "To be honest, … / I'm a bookworm", "what & when"],
              sample: "**To be honest**, not as much as I used to. I **was** a real **bookworm** as a teenager, but now I mostly read short articles on my phone. I still try to finish one novel a month, though." },
            { q: "When do you usually read?", vi: "Bạn thường đọc sách lúc nào?", hints: ["Habits — B03", "Usually before bed…", "Where · Why"],
              sample: "Usually **before bed**, for about twenty minutes. I leave my phone in the living room and **curl up with a good book** — it helps me fall asleep faster." },
            { q: "Have you ever read a book more than once?", vi: "Bạn đã từng đọc một cuốn sách hơn một lần chưa?", hints: ["Have you ever — B06", "Yes — which book, when", "a page-turner"],
              sample: "**Yes, I have.** I've **read** *The Little Prince* at least three times. The first time **was** when I **was** ten, and every time I read it again, I understand something new." },
            { q: "Do you think e-books will replace paper books?", vi: "Sách điện tử có thay thế sách giấy không?", hints: ["Opinion — B04", "Not completely, because…", "the feel of turning pages"],
              sample: "**Not completely**, in my opinion. E-books are light and portable, but many people still love **the feel of turning the pages**. **In my view**, both will exist side by side." },
            { q: "Do you enjoy going to parties?", vi: "Bạn có thích đi tiệc không?", hints: ["Liking — B02", "It depends on…", "let my hair down / a fish out of water"],
              sample: "**It depends on** the party. I love small gatherings with close friends where I can **let my hair down**, but at big parties full of strangers I **feel like a fish out of water**." },
            { q: "How often do you go to parties?", vi: "Bạn có hay đi tiệc không?", hints: ["Habits — B03", "once in a blue moon / every few weeks", "what kind"],
              sample: "**Every few weeks**, I'd say — usually birthday dinners or someone's **farewell party** at work. During wedding season it can be almost every weekend!" },
            { q: "Have you ever organised a party?", vi: "Bạn đã từng tổ chức tiệc chưa?", hints: ["Have you ever — B06", "Yes → venue, guests · No → I'd love to…", "had a blast"],
              sample: "**Yes, once.** **Last year** I **threw** a small **housewarming party** when I **moved** into my new flat. About fifteen friends **came**, we **cooked** hotpot together and **had a blast**." },
            { q: "Do you think birthday parties are important for children?", vi: "Tiệc sinh nhật có quan trọng với trẻ em không?", hints: ["Opinion — B04", "To some extent, yes…", "feel loved, but not expensive"],
              sample: "**To some extent, yes.** A party makes children **feel loved** and gives them happy memories. **But** it doesn't have to be expensive — **it's the thought that counts**." },
          ],
        },
      ],
    },
