    {

      desc: "Trước khi nói, chọn sẵn dạng câu chẻ sẽ dùng (*What I… is… / The reason why… / The thing… / It's… that…*). Khi nói câu chẻ, **nhấn giọng phần được làm nổi bật**. Xong thì mở tool AI để được chấm.",

        {
          label: "Part 1 · Accommodation", mode: "part1", talk: 40, target: 20,
          intro: "4 câu trong sách (tr.170, Practice 7). Dùng đúng gợi ý câu chẻ của sách cho từng câu.",
          ai: { title: "Speaking 6.0 · Buổi 14 · Part 1 (Accommodation)" },
          checklist: ["Câu đầu trả lời thẳng", "Có 1 câu chẻ đúng ngữ pháp", "Nhấn giọng phần sau *is* trong câu chẻ", "Dùng 1 từ vựng / idiom nhà cửa", "Nói ≥ 20 giây"],
          items: [
            { q: "What kind of house do you live in?", vi: "Bạn sống trong loại nhà nào?", hints: ["I live in…", "What I love about living in this… is…", "for example…"],
              sample: "I live in a narrow **tube house** in Hanoi with my parents and my younger sister. It has four floors, and my bedroom is right at the top. **What I love about living in this house is** the small **rooftop garden** — my mum grows herbs and vegetables there, and I often go up in the evening to **unwind**." },
            { q: "Do you prefer living in a house or an apartment?", vi: "Bạn thích sống ở nhà riêng hay chung cư hơn?", hints: ["For me, I would choose to live in a…", "The reason why … is a better choice is that…", "privacy / amenities / security"],
              sample: "**For me, I would choose to live in** a house. **The reason why** a house **is a better choice is that** it offers more **privacy** — you don't have to **share walls with neighbours**, so you don't hear their karaoke at midnight. A house also gives you the freedom to **renovate** it however you like." },
            { q: "Would you like to move to another place in the future?", vi: "Sau này bạn có muốn chuyển đến nơi khác không?", hints: ["Of course, it is something that I would like to do", "This is because…", "a quieter city / closer to work"],

            { q: "Is there anything you would like to change about your home?", vi: "Bạn có muốn thay đổi điều gì ở ngôi nhà của mình không?", hints: ["The thing that I would like to change is…", "it's too small / old / dark", "I'd love to…"],

          label: "Part 2 · Ideal house / Staying away", mode: "part2", prep: 60, talk: 120, target: 90,
          intro: "2 đề trong sách (tr.170, gợi ý cấu trúc tr.173). Mỗi bài cài **ít nhất 2 câu chẻ**: *What I would love to have… / The reason why…*",

          checklist: ["Có ít nhất 2 câu chẻ khác dạng", "Đi đủ 3 gợi ý + explain", "Có từ vựng loại nhà / phòng / tiện ích", "Đề ideal house: dùng *would* xuyên suốt · Đề staying: quá khứ đơn", "Nói được ít nhất 1:30"],
          items: [
            { card: { topic: "Describe your ideal house.", points: ["where it would be", "what it would look like", "what special features it would have"], explain: "and explain why this would be your ideal house." },
              hints: ["I'd like to start by saying that it would be a … located in…", "There would be … rooms, which include…", "What I would love to have in my house is…", "For me, the reason why this would be my ideal house is that…"],
              sample: "Now I would like to describe my ideal house. **I'd like to start by saying that** it would be a two-storey house located on a quiet hill just outside Da Lat. There would be three bedrooms, a big open kitchen, a small library and a **living room** with huge windows, so the whole house would be full of **natural light**. From the outside, it would look quite simple — white walls, a wooden roof and lots of plants around it. **What I would love to have in my house is** a large garden where I could grow vegetables, flowers and maybe a few fruit trees. I really enjoy gardening, because it's a way for me to connect with nature and **relieve stress**. **For me, the reason why this would be my ideal house is that** I want a slower pace of life. I've lived in Ho Chi Minh City all my life, and although it's convenient, it's noisy and stressful. In Da Lat, I could wake up, open the window and see the mountains, then go for a walk in the fresh air. **It's the peace and quiet that** I miss most in the city. Of course, a house like that is **out of my price range** at the moment, but it's a goal I'm working towards." },
            { card: { topic: "Describe a time you stayed at someone else's house.", points: ["whose house it was", "why you stayed there", "what it was like"], explain: "and explain how you felt about staying there." },
              hints: ["It was … ago that I visited my …'s house", "The reason why I stayed there was that…", "During my stay, I… (quá khứ đơn)", "Talking about how I felt… · felt right at home · make yourself at home"],
              sample: "Now I would like to describe a time I stayed at someone else's house. **It was** last summer **that** I visited my college roommate's family in a small village in Ben Tre. **The reason why I stayed there was that** she invited me to spend a week of our holiday with her, and I had never been to the Mekong Delta before. Her house was a traditional one-storey house surrounded by coconut trees and a small canal. During my stay, we did so many fun things. In the mornings, we rode bicycles to the floating market, and in the afternoons, her dad took us out on his boat to catch fish. In the evenings, her mum cooked amazing local dishes, and we all ate together on a big mat in the yard. Talking about how I felt about staying there, it was such a wonderful experience. On the first day, her parents told me to **make myself at home**, and honestly, I **felt right at home** straight away. **What touched me most was** how they treated me like their own daughter — they even gave me a bag of coconut candy to take home. Thanks to that trip, my friend and I became even closer, and it's a memory I'll always cherish." },

          items: [

          items: [
            { q: "Why do many young people in Vietnam find it hard to buy a home?", vi: "Vì sao nhiều người trẻ ở Việt Nam khó mua được nhà?", hints: ["The main reason why… is that…", "prices vs salaries", "On top of that, … loans / interest", "So many rent / live with parents"],
              sample: "**The main reason why** young people can't buy a home **is that** property prices have risen much faster than salaries. In Hanoi or Ho Chi Minh City, a small apartment can **cost a fortune** — often twenty or thirty years of an average salary. **On top of that**, bank loans have high interest rates, which makes young people afraid of debt. **So**, most of my friends either rent a room or live with their parents until they get married." },
