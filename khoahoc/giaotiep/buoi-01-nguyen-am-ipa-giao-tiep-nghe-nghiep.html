/* ===========================================================
   Speech helper (Web Speech API)
   - Bài này chưa có file audio, nên mọi nút 🔊 dùng giọng đọc
     có sẵn của thiết bị. Không hỗ trợ thì nút tự mờ đi.
=========================================================== */
const TTS_OK = typeof window !== 'undefined' && 'speechSynthesis' in window;
let ACCENT = 'en-GB';

function pickVoice(lang) {
  if (!TTS_OK) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  return (
    voices.find((v) => v.lang === lang && /Google|Natural|Premium|Enhanced/i.test(v.name)) ||
    voices.find((v) => v.lang === lang) ||
    voices.find((v) => v.lang && v.lang.replace('_', '-').startsWith(lang)) ||
    voices.find((v) => v.lang && v.lang.startsWith('en')) ||
    null
  );
}

function speak(text, rate = 0.9) {
  if (!TTS_OK || !text) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = ACCENT;
    const v = pickVoice(ACCENT);
    if (v) u.voice = v;
    u.rate = rate;
    window.speechSynthesis.speak(u);
  } catch (e) { /* bỏ qua */ }
}

if (TTS_OK) {
  // Một số trình duyệt nạp danh sách giọng muộn
  window.speechSynthesis.onvoiceschanged = () => {};
}

function SpeakButton({ text, rate, label, className = '' }) {
  return (
    <button
      type="button"
      disabled={!TTS_OK}
      onClick={(e) => { e.stopPropagation(); speak(text, rate); }}
      aria-label={`Nghe: ${text}`}
      className={`inline-flex items-center gap-1 rounded-full bg-primary-light px-2.5 py-1 text-xs font-semibold text-primary transition hover:bg-indigo-100 disabled:opacity-40 ${className}`}
    >
      <span aria-hidden="true">🔊</span>{label && <span>{label}</span>}
    </button>
  );
}

/* ===========================================================

   - 3D flip vocabulary card.
   - Front (amber/vocab-front): word + phonetic (+ nút nghe).
   - Back (sky-blue/vocab-back): meaning + example sentence.
=========================================================== */
function InteractiveVocab({ word, phonetic, meaning, example }) {
  const [flipped, setFlipped] = useState(false);

  return (
    <div

      onClick={() => setFlipped(!flipped)}

        <div className="flip-card-front flex h-full flex-col items-center justify-center rounded-3xl border border-amber-200 bg-vocab-bg p-4 text-center shadow-floating">
          <p className="text-lg font-bold text-slate-800">{word}</p>

          <p className="text-base font-bold">{meaning}</p>
          {example && <p className="mt-2 text-xs italic text-sky-50">"{example}"</p>}
        </div>
      </div>
    </div>
  );
}

/* ===========================================================

            )}

      {vocabHighlights.length > 0 && (

          {vocabHighlights.map((v, i) => (

        </div>
      )}
    </div>
  );
}

/* ===========================================================
   SelectionTranslateTooltip
   - Wraps the reading area. When the student selects/highlights
     text inside it, a small "Dịch" button pops up BELOW the
     selection (with an up-arrow pointing at the text), so it never
     covers the native OS selection menu that appears above the
     selection on desktop/iPad.
   - Tapping/clicking it opens Google Translate in a new tab with
     the selected text pre-filled.
   - Handles touch (iPad) explicitly: onTouchEnd on the reading
     container detects the end of a drag-to-select gesture, and
     onTouchEnd on the button itself (with preventDefault +
     stopPropagation) stops the tap from being misread as a
     "tap outside closes the tooltip" and firing before the button
     action runs.
=========================================================== */
function SelectionTranslateTooltip({ containerRef }) {
  const [tooltip, setTooltip] = useState(null); // { top, left, text }
  const btnRef = useRef(null);

  const readSelection = useCallback(() => {
    const sel = window.getSelection();
    const text = sel ? sel.toString().trim() : '';
    if (!text || !containerRef.current || sel.rangeCount === 0) {
      setTooltip(null);
      return;
    }
    const range = sel.getRangeAt(0);
    if (!containerRef.current.contains(range.commonAncestorContainer)) {
      setTooltip(null);
      return;
    }
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      setTooltip(null);
      return;
    }
    setTooltip({
      top: rect.bottom + window.scrollY + 10,
      left: rect.left + window.scrollX + rect.width / 2,
      text,
    });
  }, [containerRef]);

  useEffect(() => {
    // A short delay lets the browser finish updating window.getSelection()
    // after the pointer/finger lifts — this matters most on iPad.
    const onMouseUp = () => setTimeout(readSelection, 0);
    const onTouchEnd = () => setTimeout(readSelection, 10);
    const onSelectionChange = () => {
      const sel = window.getSelection();
      if (!sel || sel.toString().trim() === '') setTooltip(null);
    };
    document.addEventListener('mouseup', onMouseUp);
    document.addEventListener('touchend', onTouchEnd);
    document.addEventListener('selectionchange', onSelectionChange);
    return () => {
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchend', onTouchEnd);
      document.removeEventListener('selectionchange', onSelectionChange);
    };
  }, [readSelection]);

  const openTranslate = () => {
    if (!tooltip) return;
    const url = `https://translate.google.com/?sl=auto&tl=vi&text=${encodeURIComponent(tooltip.text)}&op=translate`;
    window.open(url, '_blank', 'noopener');
  };

  if (!tooltip) return null;

  return (
    <button
      ref={btnRef}
      style={{ position: 'absolute', top: tooltip.top, left: tooltip.left, transform: 'translateX(-50%)' }}
      className="z-[60] flex flex-col items-center"
      onClick={openTranslate}
      onTouchEnd={(e) => { e.preventDefault(); e.stopPropagation(); openTranslate(); }}
    >
      <span className="-mb-1 text-sm leading-none text-primary">▲</span>
      <span className="rounded-full bg-primary px-3 py-1.5 text-xs font-semibold text-white shadow-premium">Dịch</span>
    </button>
  );
}

/* ===========================================================
   MinimalPairQuiz — nghe & chọn đúng từ
=========================================================== */
const QUIZ_ROUNDS = 10;

function makeRound() {
  const pair = MINIMAL_PAIRS[Math.floor(Math.random() * MINIMAL_PAIRS.length)];
  const answer = Math.random() < 0.5 ? 'a' : 'b';
  const swap = Math.random() < 0.5;
  return { pair, answer, order: swap ? ['b', 'a'] : ['a', 'b'] };
}

function MinimalPairQuiz() {
  const [round, setRound] = useState(() => makeRound());
  const [n, setN] = useState(1);
  const [score, setScore] = useState(0);
  const [picked, setPicked] = useState(null);
  const [done, setDone] = useState(false);

  const word = round.pair[round.answer];
  const play = () => speak(word, 0.8);

  const choose = (k) => {
    if (picked) return;
    setPicked(k);
    if (k === round.answer) setScore((s) => s + 1);
  };

  const next = () => {
    if (n >= QUIZ_ROUNDS) { setDone(true); return; }
    const r = makeRound();
    setRound(r); setPicked(null); setN(n + 1);
    setTimeout(() => speak(r.pair[r.answer], 0.8), 150);
  };

  const restart = () => { setRound(makeRound()); setN(1); setScore(0); setPicked(null); setDone(false); };

  if (!TTS_OK) {
    return <p className="rounded-3xl bg-white p-6 text-sm text-slate-500 shadow-floating">Thiết bị này chưa hỗ trợ giọng đọc — hãy mở bằng Chrome hoặc Safari để làm quiz.</p>;
  }

  if (done) {
    return (
      <div className="rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-floating">
        <p className="text-sm font-semibold text-slate-500">Kết quả</p>
        <p className="mt-1 text-5xl font-extrabold text-primary">{score}/{QUIZ_ROUNDS}</p>
        <p className="mt-2 text-slate-600">{score >= 8 ? 'Tai nghe rất tốt! 🎉' : 'Nghe lại bảng nguyên âm rồi thử lần nữa nhé.'}</p>
        <button onClick={restart} className="mt-5 rounded-full bg-primary px-5 py-2 text-sm font-semibold text-white shadow-premium">Làm lại</button>
      </div>
    );
  }

  return (
    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-floating">
      <div className="flex items-center justify-between text-xs font-semibold text-slate-400">
        <span>Câu {n}/{QUIZ_ROUNDS}</span>
        <span>Đúng: {score}</span>
      </div>
      <div className="mt-1 h-1.5 w-full rounded-full bg-slate-100">
        <div className="h-1.5 rounded-full bg-primary transition-all" style={{ width: `${(n - 1) / QUIZ_ROUNDS * 100}%` }} />
      </div>
      <div className="mt-6 flex flex-col items-center">
        <button onClick={play} className="flex h-16 w-16 items-center justify-center rounded-full bg-primary text-2xl text-white shadow-premium transition hover:bg-primary-dark">🔊</button>
        <p className="mt-2 text-xs text-slate-400">Bấm để nghe — bạn nghe thấy từ nào?</p>
      </div>
      <div className="mt-6 grid grid-cols-2 gap-3">
        {round.order.map((k) => {
          const w = round.pair[k];
          const ipa = round.pair[k + 'i'];
          let style = 'border-slate-200 bg-slate-50 hover:border-primary/40';
          if (picked) {
            if (k === round.answer) style = 'border-emerald-300 bg-emerald-50';
            else if (k === picked) style = 'border-rose-300 bg-rose-50';
            else style = 'border-slate-200 bg-slate-50 opacity-60';
          }
          return (
            <button key={k} onClick={() => choose(k)} className={`rounded-2xl border-2 p-4 text-center transition ${style}`}>
              <p className="text-xl font-bold text-slate-800">{w}</p>
              <p className="text-sm text-slate-500">{ipa}</p>
            </button>
          );
        })}
      </div>
      {picked && (
        <div className="mt-5 flex flex-wrap items-center justify-between gap-3">
          <p className={`text-sm font-semibold ${picked === round.answer ? 'text-emerald-600' : 'text-rose-500'}`}>
            {picked === round.answer ? 'Chính xác!' : `Chưa đúng — đáp án là “${word}”.`}
          </p>
          <div className="flex gap-2">
            <SpeakButton text={round.pair.a} label={round.pair.a} rate={0.8} />
            <SpeakButton text={round.pair.b} label={round.pair.b} rate={0.8} />
            <button onClick={next} className="rounded-full bg-primary px-4 py-1.5 text-xs font-semibold text-white shadow-premium">
              {n >= QUIZ_ROUNDS ? 'Xem kết quả' : 'Câu tiếp →'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===========================================================
   ReflexDrill — luyện phản xạ có đếm giờ
=========================================================== */
const THINK_SECONDS = 15;

function ReflexDrill() {
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState('ready'); // ready | answering | reveal
  const [left, setLeft] = useState(THINK_SECONDS);
  const [shuffle, setShuffle] = useState(false);
  const [order, setOrder] = useState(QUESTIONS.map((_, i) => i));

  const item = QUESTIONS[order[idx]];

  useEffect(() => {
    if (phase !== 'answering') return;
    if (left <= 0) { setPhase('reveal'); return; }
    const t = setTimeout(() => setLeft((l) => l - 1), 1000);
    return () => clearTimeout(t);
  }, [phase, left]);

  const start = () => { setLeft(THINK_SECONDS); setPhase('answering'); speak(item.q, 0.9); };
  const go = (d) => {
    const ni = (idx + d + order.length) % order.length;
    setIdx(ni); setPhase('ready'); setLeft(THINK_SECONDS);
  };
  const toggleShuffle = () => {
    const next = !shuffle;
    setShuffle(next);
    const base = QUESTIONS.map((_, i) => i);
    if (next) base.sort(() => Math.random() - 0.5);
    setOrder(base); setIdx(0); setPhase('ready');
  };

  const pct = (left / THINK_SECONDS) * 100;

  return (
    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-floating">
      <div className="flex items-center justify-between">
        <span className="text-xs font-semibold text-slate-400">Câu {idx + 1}/{order.length}</span>
        <button onClick={toggleShuffle} className={`rounded-full px-3 py-1 text-xs font-semibold ${shuffle ? 'bg-primary text-white' : 'bg-slate-100 text-slate-500'}`}>🔀 Xáo trộn</button>
      </div>

      <div className="mt-5 text-center">
        <p className="text-2xl font-extrabold text-slate-900 sm:text-3xl">{item.q}</p>
        <p className="mt-1 text-sm text-slate-400">{item.vi}</p>
        <SpeakButton text={item.q} label="Nghe câu hỏi" className="mt-3" />
      </div>

      {phase === 'ready' && (
        <div className="mt-6 text-center">
          <button onClick={start} className="rounded-full bg-primary px-6 py-2.5 text-sm font-semibold text-white shadow-premium hover:bg-primary-dark">Bắt đầu trả lời ({THINK_SECONDS}s)</button>
          <p className="mt-2 text-xs text-slate-400">Nói to câu trả lời của bạn trước khi hết giờ.</p>
        </div>
      )}

      {phase === 'answering' && (
        <div className="mt-6">
          <div className="h-2 w-full rounded-full bg-slate-100">
            <div className={`h-2 rounded-full transition-all duration-1000 ${left <= 5 ? 'bg-rose-400' : 'bg-primary'}`} style={{ width: `${pct}%` }} />
          </div>
          <p className="mt-3 text-center text-4xl font-extrabold tabular-nums text-primary">{left}</p>
          <div className="mt-3 flex flex-wrap justify-center gap-2">
            {item.frames.map((f) => (
              <span key={f} className="rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">{f}</span>
            ))}
          </div>
          <div className="mt-4 text-center">
            <button onClick={() => setPhase('reveal')} className="text-xs font-semibold text-slate-400 underline">Xem câu mẫu luôn</button>
          </div>
        </div>
      )}

      {phase === 'reveal' && (
        <div className="mt-6 rounded-2xl bg-sky-50 p-4">
          <p className="text-[11px] font-bold uppercase tracking-wide text-sky-700">Câu trả lời mẫu</p>
          <p className="mt-1 leading-relaxed text-slate-800">{item.sample}</p>
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <SpeakButton text={item.sample} label="Nghe mẫu" rate={0.85} className="bg-white" />
            <button onClick={start} className="rounded-full bg-white px-3 py-1 text-xs font-semibold text-slate-600 shadow-sm">↺ Thử lại</button>
          </div>
        </div>
      )}

      <div className="mt-6 flex justify-between">
        <button onClick={() => go(-1)} className="rounded-full px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100">← Trước</button>
        <button onClick={() => go(1)} className="rounded-full bg-primary-light px-4 py-2 text-sm font-semibold text-primary hover:bg-indigo-100">Câu tiếp →</button>
      </div>
    </div>
  );
}

function Homework() {
  const KEY = 'night-giaotiep-b01-homework';
  const [done, setDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  });
  const toggle = (i) => {
    const next = done.includes(i) ? done.filter((x) => x !== i) : [...done, i];
    setDone(next);
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
  };
  return (
    <div className="rounded-3xl border border-slate-200 bg-white p-6 shadow-floating">
      <div className="mb-4 flex items-center justify-between">
        <p className="text-sm font-semibold text-slate-500">Hoàn thành {done.length}/{HOMEWORK.length}</p>
        {done.length === HOMEWORK.length && <span className="text-sm font-bold text-emerald-600">Xuất sắc! 🎉</span>}

      <ul className="space-y-2">

          <li key={i}>
            <label className="flex cursor-pointer items-start gap-3 rounded-2xl p-2 hover:bg-slate-50">

    </div>
  );
}

      <main ref={readingRef} className="mx-auto mt-12 max-w-4xl space-y-16 px-4">
        <Section id="phat-am" step="01" title="Hệ thống nguyên âm IPA" desc="20 nguyên âm tiếng Anh, mỗi âm gắn với tên một nghề nghiệp.">
          <VowelChart />
        </Section>

        <Section id="cap-am" step="02" title="Quiz cặp âm tối thiểu" desc="Nghe và chọn đúng từ — luyện tai phân biệt nguyên âm ngắn/dài.">
          <div className="mx-auto max-w-xl"><MinimalPairQuiz /></div>
        </Section>

        <Section id="tu-vung" step="03" title="Từ vựng nghề nghiệp" desc="Lật thẻ để xem nghĩa. Bấm 🔊 để nghe phát âm.">
          <div className="grid grid-cols-2 justify-items-center gap-4 sm:grid-cols-3">
            {JOB_VOCAB.map((v) => <InteractiveVocab key={v.word} {...v} />)}
          </div>
          <div className="mt-6 rounded-3xl border border-slate-200 bg-white p-5 text-sm shadow-floating">
            <p className="mb-2 font-bold text-slate-700">Giới từ đi với “work”</p>
            <div className="grid gap-2 sm:grid-cols-2">
              <p><b className="text-primary">work for</b> + công ty — <i>I work for a bank.</i></p>
              <p><b className="text-primary">work in</b> + lĩnh vực/phòng ban — <i>I work in sales.</i></p>
              <p><b className="text-primary">work at</b> + địa điểm — <i>I work at a hospital.</i></p>
              <p><b className="text-primary">work as</b> + nghề — <i>I work as a tour guide.</i></p>
            </div>
          </div>
        </Section>

        <Section id="hoi-thoai" step="04" title="Hội thoại mẫu: What do you do?" desc="Tom và Linh gặp nhau ở một buổi tiệc. Đọc, nghe từng câu, rồi đóng vai.">
          <div className="space-y-8">
            {DIALOGUE.map((p, i) => <ParagraphBlock key={i} index={i + 1} {...p} />)}
          </div>
          <div className="mt-8 rounded-3xl border border-amber-200 bg-amber-50/70 p-5">
            <p className="mb-3 text-sm font-bold text-amber-800">💬 Giữ mạch hội thoại</p>
            <div className="grid gap-3 sm:grid-cols-2">
              {KEEP_GOING.map((k) => (
                <div key={k.phrase} className="rounded-2xl bg-white p-3 shadow-sm">
                  <p className="flex items-center justify-between gap-2 font-semibold text-slate-800">{k.phrase}<SpeakButton text={k.phrase} /></p>
                  <p className="mt-1 text-xs text-slate-500">{k.note}</p>
                </div>
              ))}
            </div>
          </div>
        </Section>

        <Section id="phan-xa" step="05" title="Phản xạ: Questions about jobs" desc="Nghe câu hỏi → trả lời to trong 15 giây → so với câu mẫu.">
          <div className="mx-auto max-w-2xl"><ReflexDrill /></div>
        </Section>

        <Section id="ve-nha" step="06" title="Bài tập về nhà" desc="Đánh dấu khi hoàn thành — trang sẽ nhớ trên thiết bị này.">
          <div className="mx-auto max-w-2xl"><Homework /></div>
        </Section>
      </main>

      <SelectionTranslateTooltip containerRef={readingRef} />

      <footer className="mx-auto mt-16 max-w-3xl px-4 text-center">
        <p className="text-[11px] text-slate-400">Night IELTS · by Mr. Night</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
