        { text: "This computer works better than that one.\n→ That computer [[doesn't work as well as this one|does not work as well as this one|doesn't work so well as this one|works worse than this one]]." },

        { text: "We set off soon. We will arrive soon.\n→ The sooner [[we set off the sooner we will arrive]]." },
        { text: "The joke is good. The laughter is loud.\n→ The better [[the joke is the louder the laughter is|the joke the louder the laughter]]." },
        { text: "She gets fat. She feels tired.\n→ The fatter [[she gets the more tired she feels]]." },
        { text: "As he gets older, he wants to travel less.\n→ The older [[he gets the less he wants to travel]]." },
        { text: "The children are excited with the difficult games.\n→ The more [[difficult the games are the more excited the children are|difficult the games are the more excited the children get]]." },
        { text: "I meet him much. I hate him much.\n→ The more [[I meet him the more I hate him]]." },
        { text: "My boss works better when he is pressed for time.\n→ The less [[time my boss has the better he works]].", explain: "Bị ép thời gian = **càng ít thời gian** thì làm **càng tốt**." },
        { text: "If you read many books, you will have much knowledge.\n→ The more [[books you read the more knowledge you will have|books you read the more knowledge you have]].", explain: "Danh từ đặt ngay sau **the more**." },
        { text: "He speaks too much and people feel bored.\n→ The more [[he speaks the more bored people feel|he speaks the more bored people get]]." },
        { text: "The growth in the economy makes people's living condition better.\n→ The more [[the economy grows the better people's living condition is|the economy grows the better people's living conditions are]]." },
        { text: "People learn a lot of things as they travel far.\n→ The farther [[people travel the more they learn|people travel the more things they learn|they travel the more they learn|they travel the more things they learn|people travel the more things people learn]].", explain: "Tài liệu in “the more **the** learn” (lỗi đánh máy) — đúng là **the more they learn**." },
        { text: "Her old house is bigger than her new one.\n→ Her new house [[isn't as big as her old one|is not as big as her old one|isn't so big as her old one|is not so big as her old one|is smaller than her old one]]." },
        { text: "I can't cook as well as my mother.\n→ My mother can cook [[better than me|better than I can|better than I do|better than I]]." },
        { text: "The black dress is more expensive than the white one.\n→ The white dress [[isn't as expensive as the black one|is not as expensive as the black one|isn't so expensive as the black one|is not so expensive as the black one|is cheaper than the black one]]." },
        { text: "There isn't anybody as kind-hearted as your mother.\n→ Your mother is [[more kind-hearted than anyone|more kind-hearted than anyone else|more kind-hearted than anybody|more kind-hearted than anybody else|the most kind-hearted person|the most kind-hearted]]." },
        { text: "The black car is cheaper than the red car.\n→ The red car [[isn't as cheap as the black car|is not as cheap as the black car|isn't so cheap as the black car|is not so cheap as the black car|is more expensive than the black car|isn't as cheap as the black one|is not as cheap as the black one]]." },
        { text: "This film is more interesting than that one.\n→ That film is [[not as interesting as this one|not so interesting as this one|less interesting than this one]]." },
        { text: "This is the most interesting film of all.\n→ No other films are [[more interesting than this one|more interesting than this film|as interesting as this one|as interesting as this film]]." },
        { text: "No cars in the world are more expensive than Japanese ones.\n→ Japanese cars [[are the most expensive in the world|are the most expensive cars in the world]].", explain: "Tài liệu in “lapanese” — đúng là **Japanese**." },
        { text: "Other oceans in the world aren't as large as the Pacific one.\n→ The Pacific Ocean is [[larger than any other ocean in the world|larger than other oceans in the world|the largest ocean in the world|the largest in the world|larger than any other ocean]].", explain: "Tài liệu ghi “larger than other oceans”; tự nhiên hơn là **larger than any other ocean** hoặc **the largest ocean in the world**." },
        { text: "No hotel in the city is as comfortable as this.\n→ This hotel is the [[most comfortable in the city|most comfortable hotel in the city|most comfortable one in the city]]." }

        { text: "❌ She can pronounce English words more correct than she could last term.\n✅ She can pronounce English words more [[correctly]] than she could last term.", explain: "Bổ nghĩa cho **pronounce** → trạng từ." },
        { text: "❌ In this class, the students are talking more loudlier than the teacher.\n✅ In this class, the students are talking [[more loudly|louder]] than the teacher.", explain: "Không dùng *more* + *-er* cùng lúc. **loudly** là trạng từ dài → **more loudly** (văn nói: *louder*)." },
        { text: "❌ This summer is hotter and winder than last summer.\n✅ This summer is hotter and [[windier]] than last summer.", explain: "wind là danh từ; tính từ **windy** → **windier**." },

        { tag: "🌍 Thế giới", title: "“Count the beats”", body: "Giáo viên bản xứ dạy vỗ tay đếm âm tiết: **1 nhịp** (tall, fast) → -er/-est. **3 nhịp trở lên** (beau-ti-ful) → more/most. **2 nhịp** thì nhìn đuôi: -y, -er, -le, -ow, -et → -er; còn lại → more." },
        { tag: "🌍 Thế giới", title: "“Never double up”", body: "Không bao giờ dùng **2 dấu hiệu so sánh** cùng lúc: *more bigger*, *more loudlier*, *the most tallest* đều sai. Chọn **một**: hoặc -er, hoặc more." },
        { tag: "🌍 Thế giới", title: "Good – Better – Best", body: "Câu vè tiếng Anh: *“Good, better, best — never let it rest, till your good is better and your better is best.”* Học kèm cặp đôi: **bad – worse – worst**, **little – less – least**." },
        { tag: "🌍 Thế giới", title: "The more, the merrier", body: "Thành ngữ quen thuộc nhất của cấu trúc **càng… càng**. Nhớ câu này là nhớ khuôn: **The + hơn …, the + hơn …** — hai vế đều có **the**." },
        { tag: "🇻🇳 Việt Nam", title: "“Ngắn thêm đuôi, dài mượn more”", bullets: ["Ngắn thì **thêm đuôi** -er, -est", "Dài thì **mượn** more, most", "Gặp đuôi -y đổi thành **i**", "1 nguyên âm 1 phụ âm thì **gấp đôi**"] },
