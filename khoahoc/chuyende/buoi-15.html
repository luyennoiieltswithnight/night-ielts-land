        { text: "❌ Many hundred years ago, there were many villages and little towns in England.\n✅ Many hundred years ago, there were many villages and [[few]] towns in England.", explain: "Theo đáp án tài liệu: **towns** đếm được → few. (Lưu ý: *little towns* cũng có thể hiểu là “thị trấn nhỏ” — nhưng trong đề này lỗi được tính ở chữ little.)" },
        { text: "❌ Almost medical doctors have had some training in psychology and psychiatry.\n✅ [[Most|Almost all]] medical doctors have had some training in psychology and psychiatry.", explain: "Không có *almost + N* → Most (hoặc Almost all)." },
        { text: "❌ Good scientists always cooperate with each others no matter what their nationalities are.\n✅ Good scientists always cooperate with [[each other|one another]] no matter what their nationalities are." },
        { text: "❌ Tom said that if he had to do another homework tonight, he would not be able to attend the concert.\n✅ Tom said that if he had to do [[more homework|homework|any more homework]] tonight, he would not be able to attend the concert.", explain: "**homework** không đếm được → không dùng another. (Tài liệu còn thiếu **to** trong *be able to attend* — đã thêm vào.)" },
        { text: "❌ In Canada much people speak English because they also came from England many years ago.\n✅ In Canada [[many]] people speak English because they also came from England many years ago." },
        { text: "❌ We didn't have many knowledge about physics.\n✅ We didn't have [[much]] knowledge about physics.", explain: "**knowledge** không đếm được." },
        { text: "❌ Neither of the scout leaders know how to trap wild animals or how to prepare them for mounting.\n✅ Neither of the scout leaders [[knows]] how to trap wild animals or how to prepare them for mounting.", explain: "**Neither of + N số nhiều + V số ít**." },
        { text: "❌ The Earth is the only planet with a large number of oxygen in its atmosphere.\n✅ The Earth is the only planet with a large [[amount]] of oxygen in its atmosphere.", explain: "**oxygen** không đếm được → a large amount of." }
