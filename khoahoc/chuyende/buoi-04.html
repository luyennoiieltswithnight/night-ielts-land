        { text: "❌ It is raining hard. We can't do anything until it stopped.\n✅ We can't do anything until it [[stops]].", explain: "Sau until dùng hiện tại đơn." },
        { text: "❌ She had got into her shoes, put on her coat and went to the door.\n✅ She [[got]] into her shoes, put on her coat and went to the door.", explain: "Chuỗi hành động nối tiếp → quá khứ đơn." },
        { text: "❌ What tune had they played when we came in?\n✅ What tune [[were they playing]] when we came in?", explain: "Đang chơi thì chúng tôi bước vào → QKTD." },
        { text: "❌ That evening we stayed up to talk about the town, where he has lived for a long time.\n✅ … the town, where he [[had lived]] for a long time.", explain: "Sống ở đó trước buổi tối hôm ấy (quá khứ) → QKHT." },
        { text: "❌ I have lived in this city for 15 years. My family had moved here when I was 10 years old.\n✅ My family [[moved]] here when I was 10 years old.", explain: "Một mốc quá khứ đơn lẻ → QKĐ." },
        { text: "❌ We are very tired. We have walk for three hours.\n✅ We [[have been walking]] for three hours." },
        { text: "❌ I haven't seen her since we leaved school.\n✅ I haven't seen her since we [[left]] school.", explain: "leave – **left** (bất quy tắc)." },
        { text: "❌ I have been thought about you a lot lately…\n✅ I [[have been thinking]] about you a lot lately…" },
        { text: "❌ Coming into his room, he found that someone broke into it.\n✅ … he found that someone [[had broken]] into it.", explain: "Đột nhập xảy ra **trước** lúc phát hiện → QKHT." },
        { text: "❌ It always rains when they had just cleaned the windows.\n✅ It always rains when they [[have just cleaned]] the windows.", explain: "Câu ở hiện tại (always rains) + just → HTHT." },
        { text: "❌ The last time I saw him, he wore a black suit.\n✅ The last time I saw him, he [[was wearing]] a black suit.", explain: "Lúc gặp, anh ấy đang mặc (trạng thái đang diễn ra) → QKTD." },
        { text: "❌ By the first of next July I had worked for this company for 20 years.\n✅ By the first of next July I [[will have worked]] for this company for 20 years.", explain: "by + mốc tương lai → TLHT." },
        { text: "❌ This is the talk between two friends who had just met up with each other.\n✅ … two friends who [[have just met]] up with each other.", explain: "Câu chính ở hiện tại + just → HTHT." }
      ]

        { tag: "🌍 Thế giới", title: "Vẽ 2 mốc trên trục thời gian", body: "Đặt 2 hành động lên trục: cái nào **trước** thì lùi thêm một bậc (had V3 / will have V3). Cái nào **kéo dài** thì vẽ đường ~~~ và dùng tiếp diễn." },
