    /* ── Bài 1: L10 ── */
    {
      type: "compare", id: "b8-bai-1", nav: "★ Bài 1: Adv–Disadv", band8: true,
      title: "Bài 1 (Adv–Disadv): bài học sinh Band 6 và bài thầy viết lại",
      desc: "Sách Band 8, tr.142–143 và tr.150 · Đề: *In the past, knowledge was contained in books. Nowadays, knowledge is uploaded to the Internet. Do the advantages of this outweigh the disadvantages?*",
      items: [
        { label: "Bài học sinh · 256 từ", tone: "weak", text: "(1) In the past, knowledge could only be found in books. (2) However, these days, everyone can get knowledge, with the help of the Internet. (3) This essay will present the advantages and disadvantages of online knowledge.\n\n(4) On the one hand, uploading knowledge to the Internet is detrimental. (5) Firstly, the knowledge will be robbed. (6) The reason is that there are many illegal websites, such as Z-Library which give user the permission to download knowledge for free. (7) Secondly, learners will be overwhelmed as there are too much information and fake news on the Internet. (8) Therefore, they will not learn anything at all. (9) Finally, there are lots of fake news and false stories on the Internet. (10) As a result, learners will have wrong knowledge, develop distorted thinking and false believes. (11) In the future, these people will turn out to be close-minded people.\n\n(12) On the other hand, despite the aforementioned disadvantages, I believe the benefits are more noteworthy. (13) Firstly, learners can download book course for free and conveniently. (14) To exemplify, I can easily download Harry Potter epub or PDF files of the books for free. (15) They also do not have to carry heavy books in their bags with them to school. (16) In contrast, they can easily open whatever knowledge they need with smartphone. (17) They can also share the knowledge with friends. (18) Secondly with e-books, publishers do not have to cut down trees to produce paper. (19) Therefore, they will reduce logging and save the environment.\n\n(20) In conclusion, despite there are several disadvantages of this practice, I believe the benefits are still a lot stronger.", comment: "TR: liệt kê 3 lợi, 3 hại nhưng **không chứng minh** vì sao lợi nặng hơn; (3) chỉ nói *present the advantages and disadvantages*. Ý nhảy cóc ở (7)→(8), (10)→(11). Ví dụ Harry Potter không hợp với “book course”. Lời lẽ quá mạnh ở (7), (11)." },
        { label: "Bài thầy viết lại · 259 từ", tone: "good", text: "In the past, knowledge was primarily confined to books. However, today's technological era has enabled everyone to acquire knowledge effortlessly. While this digital transition presents several drawbacks, I firmly believe they are outweighed by the advantages.\n\nOn the one hand, uploading knowledge to the Internet can be detrimental. Firstly, it exposes valuable content, such as e-books, to the risk of digital piracy, where unauthorized copies spread widely on pirate websites. This copyright infringement may cause substantial financial harm to publishers and authors, whose hard work might go uncompensated. Secondly, since the Internet is rife with fabricated news, distinguishing truth from falsehood can be a challenge for readers. Exposed to false information, those who lack critical thinking skills may adopt false beliefs, which might lead to misguided decisions.\n\nUploading knowledge on the Internet, I believe, offers substantial benefits that outweigh the drawbacks. Firstly, everyone can access information rapidly with a simple click, significantly reducing the time and effort required. Compared to traditional library research that could take hours or even days, online knowledge offers unparalleled efficiency and accessibility. Secondly, by switching to e-books and online storage, societies can reduce their reliance on paper production. This digital transition, therefore, can contribute to environmental sustainability by reducing the need for logging.\n\nIn conclusion, although online knowledge dissemination can negatively affect authors, publishers, and those lacking critical thinking, these drawbacks are outweighed by the benefits for the general public and the environment. However, it is still important to implement solutions, such as firewalls, subscriptions, fact-checking, and fostering digital literacy, to effectively address the challenges.", comment: "Kết bài **so sánh đối tượng**: hại chỉ ảnh hưởng tác giả, nhà xuất bản và người thiếu tư duy phản biện; lợi đến với **mọi người và môi trường** → lợi nặng hơn. Mỗi ý có giải thích, giọng nói giảm nhẹ (*may, might, can*). Thầy sửa 1 chỗ trong sách: *they are outweighed* → *these drawbacks are outweighed* (đại từ *they* chưa rõ chỉ gì)." },

    {
      type: "compare", id: "b8-cp-l10", nav: "★ Tự chấm bài Toán – Triết", band8: true,
      title: "Comprehensive Practice: chấm bài “Toán và Triết là môn chính” bằng checklist 14 câu",
      desc: "Sách Band 8, tr.151–153 · Đề: *Some schools are teaching subjects such as mathematics and philosophy as core subjects. Do the advantages outweigh the disadvantages?* · Đáp án tr.250 · Checklist 14 câu này dùng lại ở Buổi 15, 18",
      intro: "Đọc bài 1 (Band 6–6.5) và tự chấm theo 14 câu: TR (1–4) · CC (5–7) · LR (8–11) · GRA (12–14). Sau đó so với bài 2 của thầy.",
      items: [
        { label: "Bài 1 · 248 từ · Band 6–6.5", tone: "weak", text: "In the world of education, many schools have integrated subjects such as mathematics and philosophy into the core school curriculum. This raises a crucial question - are the benefits of introducing these subjects greater than any possible drawbacks?\n\nOn the downside, these subjects can bring many disadvantages. Firstly, they are often demanding and time-consuming, and some students may feel stressful and overwhelmed. As a result, the time spent delving into these subjects might take time away from other important ones, such as vocational training. Furthermore, mathematics and philosophy might not help students find jobs when they graduate from school, so studying these subject may be considered a waste of time. Finally, student interests and learning styles are different, and they might not like the abstract nature of philosophy. Therefore, students may feel disengaged and disinterested.\n\nHowever, I would contend that teaching mathematics and philosophy also offer important benefits. Firstly, mathematics allow students to think logically. Logical thinking skills can be applied to any careers. By the same token, philosophy makes students more tolerant, acceptable, and understanding towards people of different cultures. Therefore, students will have better personality development. Finally, delving into these subjects early on gives students a solid foundation for a broader things in life, allowing them to swim in our diverse and globalized world.\n\nIn conclusion, while teaching mathematics and philosophy may bring several disadvantages, it also brings substantial benefits. Therefore, we should carefully consider the best ways to balance these aspects and maximize the advantages.", comment: "Đáp án checklist: (1) **Không** — không kết luận bên nào nặng hơn · (3) chưa đủ — *broader things in life* chưa giải thích · (4) **Không** — kết bài không tóm ý, không nêu lập trường · (7) **Không** — từ nối đều ở đầu câu, giọng máy móc · (11) câu hỏi tu từ ở mở bài làm giảm độ trang trọng · (13) **Không** — lỗi: *offer → offers, mathematics allow → allows, these subject → subjects, feel stressful → stressed, a broader things → broader things*. Các câu còn lại: Có." },
        { label: "Bài 2 · 267 từ · thầy viết", tone: "good", text: "People are still divided on the sets of subjects that are mandatory for every student. Mathematics and philosophy are among the subjects that people think should be made compulsory. In my opinion, although there are several disadvantages, they are outweighed by more significant benefits.\n\nTeaching mathematics and philosophy as core disciplines may indeed be detrimental. The primary drawback lies in the irrelevance or lack of applicability of these subjects. With mathematics, the curriculum in schools frequently places excessive emphasis on numerical formulas that are of little help to learners' day-to-day lives. Similarly, philosophy heavily delves into social theories and ideologies, often at a macro-level, which might not yield immediate practical advantages. Aside from students whose future careers directly involve these disciplines, such as scientists or politicians, others might view mathematics and philosophy as time wasted.\n\nHowever, I would contend that teaching mathematics and philosophy offers more substantial benefits. Mathematics not only enhances numeracy skills, it also fosters logical thinking and quantitative reasoning, enhancing students' ability to analyze and make informed decisions. Similarly, philosophy examines the complexities of human beliefs, allowing students to develop understanding, empathy, and cooperation towards individuals from diverse socio-economic and religious backgrounds. In other words, mathematics and philosophy can enrich students' intellectual growth, teaching them skills that can transcend career boundaries.\n\nIn conclusion, while there might be concerns about the practicality and relevance of teaching mathematics and philosophy, I firmly believe that the advantages, including enhanced logical-thinking skills, empathy and understanding far outweigh any potential drawbacks. After all, the aim of education is to cultivate well-rounded citizens rather than individuals with high earning potential.", comment: "Mỗi bên chỉ **1 ý chính** nhưng phát triển sâu. Câu cuối *After all, the aim of education is…* là lý do khiến lợi nặng hơn → trả lời trọn câu hỏi *outweigh*." },

    {
      type: "compare", id: "b8-bai-2", nav: "★ Bài 2: Discussion", band8: true,
      title: "Bài 2 (Discussion): công ty lớn hay công ty nhỏ?",
      desc: "Sách Band 8, tr.166–167 và tr.175 · Đề: *Some people believe that it is better to work for a large company, while others believe that it is better to work for a small company. Discuss both views and give your opinion.*",
      items: [
        { label: "Bài học sinh · 269 từ · Band 5.5–6", tone: "weak", text: "(1) Some people believe that a large company brings more benefits to workers than a small company. (2) Others believe the opposite. (3) In my opinion, workers themselves should choose where to work.\n\n(4) On the one hand, working for a large firm brings several advantages over small companies. (5) Firstly, a large cooperation can earn great amounts of money. (6) This is due to the fact that big firms often have more department and money, so they can earn lucrative income. (7) Secondly, due to a large number of employees, workers can make friends. (8) They can, for example, give each other tips and advice to do the jobs, which helps them develop their expertise. (9) Finally, working in this type of company, workers can have opportunities to connect with like-minded individuals. (10) This network will also help them develop their careers.\n\n(11) On the other hand, working for a small business can also be beneficial. (12) Employees, first of all, can be promoted more easily. (13) This is because they would have fewer competitions than in large companies. (14) Gradually, workers can earn a lot of money. (15) Furthermore, a small company often has more relaxing and chill atmosphere; therefore, workers may feel more relaxed and happier. (16) This is really important for their mental health. (17) Finally, workers in a small company can easily change jobs. (18) For example, a human resource worker in a small company can easily change to be a customer service, since lacks employees.\n\n(19) In conclusion, while working for a large firm can brings money, opportunities and network, a smaller company can also bring income, happiness, and the ability to change jobs. (20) Therefore, I believe a smaller company is better.", comment: "TR: ý kiến mở bài (*workers should choose*) **khác** ý kiến kết bài (*a smaller company is better*). (7) và (9) cùng một ý (kết bạn). (5)–(6) lập luận vòng tròn. (12)–(14) khái quát quá mức." },
        { label: "Bài thầy viết · 297 từ", tone: "good", text: "One school of thought holds that working for a large company is preferable, while many others contend that a small company brings more benefits. Both viewpoints are valid, but I prefer smaller companies.\n\nThe claim that people should work for large firms is not entirely baseless. Firstly, these companies often provide stable salaries and bonuses, enabling their employees to attain financial security. During times of economic fluctuation, such as in the pandemic, a well-established company is more likely to guarantee a financial safety net for employees. Secondly, since larger firms typically have a broader range of employees, it is more probable to encounter colleagues who share common interests or career goals. Workers, for example, are more likely to find mentorship and support among colleagues with similar career trajectories.\n\nHowever, I would advocate for working in smaller companies. In terms of financial security, employees there often perform multiple tasks, making them less dispensable, and deserving of better compensation. This may not be the case for larger corporations, where employees might be seen as mere cogs in big machines, and the competition for promotions can be intense. Moreover, since smaller companies tend to be more laid-back, employees may experience more freedom within their roles. They can also collaborate more closely with their superiors, making their work feel less rigid and more enjoyable. Larger companies, in contrast, often maintain a formal atmosphere and structured hierarchies, which can sometimes lead to a less dynamic and more regimented work environment.\n\nIn conclusion, while some people advocate seeking jobs in major corporations, I maintain that employees within these companies are often less appreciated and satisfied with their work. Smaller companies, on the other hand, often offer a more welcoming environment and a greater recognition, making them a potentially preferable employment option.", comment: "Đoạn 2 **so sánh trực tiếp** với đoạn 1 (cùng tiêu chí tài chính và môi trường) nên lập trường thuyết phục. Thầy sửa trong sách: *more preferable* → *preferable* (2 chỗ), vì *preferable* đã mang nghĩa so sánh." },

      tasks: [
        { prompt: "**Exercise 2:** thêm 1 câu nêu **kết quả** cho lập luận ở câu (17)–(18): đổi việc dễ thì có lợi gì cho nhân viên?\n(17) Finally, workers in a small company can easily change jobs. (18) For example, a human resource worker in a small company can easily change to be a customer service, since the company often lacks employees.", rows: 3, min: 15,
