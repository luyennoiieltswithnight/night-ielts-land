        { label: "Partially disagree (bài mẫu)", tone: "ok", text: "Nowadays, there is a growing consensus that the best action for mitigating environmental damage is to raise the price of fossil fuels. While I understand the rationale behind this argument, I would contend that increasing fuel prices may not be a holistic enough solution.\n\nIt is without doubt that increasing fuel prices can contribute to environmental protection. Firstly, price hikes can motivate people and businesses to explore more economical options. As fuel prices soar, daily commuters, for instance, might opt for public transportation instead of their private vehicles to save money on gasoline. Similarly, manufacturers may potentially transition from fossil-fueled machinery to more cost-effective options, such as machines powered by solar energy. Raising fuel prices, therefore, has the potential to reduce carbon emissions and improve overall air quality.\n\nNonetheless, I would contend that increasing fuel prices may present certain limitations. For individuals, the higher costs of fuel may result in higher expenses for other essential services, such as electricity, which could place a heavier financial burden on lower-income people. Manufacturers may also face challenges, as elevated fuel costs can lead to reduced production outputs and profit margins. On the societal level, imposing higher fuel prices may have little impact on pollution from non-manufacturing activities, such as livestock and poultry farming. In my opinion, subsidizing the transition to green energy and sustainable agriculture would be a more holistic approach to ensuring a greener future without hurting lower-income individuals or industries.\n\nIn conclusion, considering the limitations for individuals, manufacturers, and societies, I believe raising fuel prices may not be the most comprehensive solution to tackle environmental problems, and there are more effective approaches to consider.", comment: "Thân bài 1 thừa nhận mặt đúng, thân bài 2 chỉ hạn chế + đề xuất giải pháp khác." },
        { label: "Completely disagree (Comprehensive)", tone: "good", text: "There is an ongoing debate about the most effective way to address environmental damage, with some advocating for higher fuel prices. I completely disagree with this solution.\n\nOn the individual level, as fuel costs are often intertwined with transportation expenses, putting a higher price on fuel can raise the costs of essential services. This, in turn, may place a greater financial burden on low-income families who already allocate a significant portion of their income to necessities. From a societal perspective, higher fuel prices may fall short of mitigating pollution from non-manufacturing activities. For instance, farming and raising livestock release substantial amounts of greenhouse gases that do not originate from fuels. (1) Increasing fuel prices, therefore, may not comprehensively address the multifaceted nature of the pollution problem.\n\nI would further argue that there are more effective ways to reduce environmental problems without imposing further financial burdens. Firstly, for individuals, governments can promote greener transportation and discourage private vehicle use through initiatives like carpooling. Similarly, instead of raising the price of fuels for manufacturers, increasing green technologies' affordability and accessibility can be a more practical solution for both manufacturing and non-manufacturing industries. Governments could also promote sustainable and eco-friendly business practices through tax incentives or regulations. (2) Compared to raising fuel prices, which may even be counter-productive, these solutions may have more comprehensive, long-term impacts on environmental protection.\n\nIn conclusion, I would contend that increasing fuel costs is not the most holistic approach to mitigating environmental problems. Other methods, such as promoting cleaner technologies or more sustainable practices, appear more efficient.", comment: "Thân bài 1 = hạn chế (cá nhân, xã hội); thân bài 2 = giải pháp tốt hơn. Câu (1) tóm ý đoạn 1, câu (2) so giải pháp mới với giải pháp trong đề: **cả hai đều cần**." },
      ],
      takeaway: "Hai lập trường dùng gần như cùng một bộ ý. Khác nhau ở chỗ: bài **một phần** dành hẳn 1 đoạn thừa nhận mặt đúng; bài **hoàn toàn** dùng đoạn đó để đưa ra giải pháp thay thế.",
    },
    {
      type: "write", id: "b8-thanh-pho", nav: "★ Viết: sống ở thành phố", band8: true,
      title: "Exercise 2–3 (L13): viết đề giao thông theo hướng một phần",
      desc: "Sách Band 8, tr.185–186 · Bài mẫu 305 từ ở tr.186 · Đáp án tr.255",
      tasks: [
        { prompt: "*The best way to solve traffic and transportation problems is to encourage people to live in cities rather than suburbs and the countryside. To what extent do you agree or disagree?*\n\nGạch chân từ tuyệt đối trong đề, chọn hướng, lập dàn ý rồi viết (40 phút).", rows: 16, min: 250,
          model: "It is often argued that promoting urban residency is the best way to address traffic issues. While I understand the rationale behind this argument, I would contend that relying solely on city living may not be a holistic enough solution to transportation problems.\n\nMany people endorse urban living as an ideal means to alleviate traffic problems, and justifiably so. Firstly, businesses, educational institutions, and various recreational activities are often located in cities. Living there, residents would no longer need to take long commutes, significantly reducing traffic. Additionally, urban areas typically have more advanced, convenient, and accessible public transportation systems. The residents living in Tokyo or Seoul, for example, can easily travel via extensive subway networks, reducing reliance on private cars and traffic congestion.\n\nHowever, promoting city life to reduce traffic issues may do more harm than good. Many cities, whether less developed like Bangkok or more advanced like Tokyo or Seoul, already struggle with overpopulation and inadequate public transportation. Further urbanization, therefore, may exacerbate these problems, potentially lowering residents' quality of life.\n\nFinally, instead of urban living, I would suggest promoting migration to suburban areas to address traffic issues. For suburban regions, this approach could bring more job opportunities, education, and recreational activities to rural regions, reducing the need for long commutes to big cities. For urban regions, encouraging suburban migration can create a more balanced population distribution, alleviating city traffic strain. In my opinion, this strategy is more sustainable as it fosters development in both urban and rural areas rather than focusing solely on cities.\n\nIn conclusion, I believe that encouraging people to embrace an urban lifestyle is not the optimal approach to addressing traffic and transportation problems, as it can detrimentally affect the quality of life and transportation there. A more sustainable solution, in my opinion, is to encourage migration to suburban areas.",
          notes: ["Bố cục 5 đoạn: mở bài → lợi của sống ở thành phố → hại → giải pháp khác (về vùng ven) → kết bài.", "Bài đạt cả 4 tiêu chí theo đáp án sách: có phản biện + giải pháp thay thế (TR), mỗi đoạn một ý (CC), nhiều từ về đô thị và giao thông (LR), câu đa dạng (GRA)."] },
      ],
    },
    {
      type: "compare", id: "b8-toan-hoc", nav: "★ Bài học viên", band8: true, sticker: "teacher_saiten_man.webp",
      title: "L15: bài “hoàn toàn đồng ý” của học viên, sửa qua 3 lần",
      desc: "Sách Band 8, tr.199–204 · Đề: *To succeed in business, one needs to know math. To what extent do you agree or disagree?*",
      intro: "Ba lỗi hay gặp khi đồng ý **hoàn toàn**: (1) ý rời rạc, không có tổ chức (CC) · (2) ý chưa phát triển (TR) · (3) thiếu khách quan (TR). Ngữ pháp và từ vựng trong bài gốc đã được tác giả sửa sẵn để tập trung vào TR và CC.",
      items: [
        { label: "Bản 1 — ý rời rạc", tone: "weak", text: "Firstly, math is really important for running a successful business. This is mainly because managing a business involves calculating a lot of numbers and critical thinking skills. Therefore, every entrepreneur needs to have math skills. If businesspeople cannot understand math, they may make ineffective decisions that can hurt the business. For example, when an entrepreneur does not know how to calculate numbers, they may make wrong calculations about profits and losses. Or similarly, without critical thinking from math, they may make illogical decisions that bring no profit. This can make the company go bankrupt.\n\nThe logical and critical thinking that math teaches learners can be applied into various aspects of doing businesses. For example, when leaders need to analyze market trends, they need logical thinking from doing math exercises. Or similarly, when leaders argue in front of their investors, they also need to know how to present numbers and data…", comment: "Mở bài hứa 2 ý (tính toán, tư duy logic) nhưng cả 2 đoạn đều trộn cả 2 ý. Người đọc không biết đoạn nào nói gì." },
        { label: "Bản 2 — mỗi đoạn 1 ý", tone: "ok", text: "Firstly, math is really important for running a successful business, as it teaches learners how to calculate numbers. When leaders argue in front of their investors, they also need to know how to present numbers and data… If businesspeople understand math, they may make good decisions that will bring lots of benefits to the business. But in contrast, if they do not know math, they may even make wrong numbers, and the company may go bankrupt.\n\nSecondly, math also teaches learners how to think critically and logically. This skill will help learners analyze market trends effectively. For example, when the leader needs to know which market to invest in, they must have critical thinking skills. If they do not have critical thinking skills, they may make a lot of silly decisions…", comment: "Rõ hơn: đoạn 1 = tính toán, đoạn 2 = tư duy. Nhưng ý **chưa được giải thích**: vì sao biết toán thì quyết định đúng? Vì sao không biết toán thì phá sản? Toán dạy tư duy logic **bằng cách nào**?" },
        { label: "Bản của tác giả (305 từ)", tone: "good", text: "One school of thought holds that to excel in the business domain, a grasp of mathematics is essential. I completely agree with this statement for various reasons.\n\nFirstly, managing a business includes multiple numerical tasks, from creating financial statements to forecasting profits and losses. If the leaders lack proficiency in math, they may be more prone to making financial errors, which could jeopardize the company's financial stability. Moreover, understanding numbers is essential in negotiation with banks or potential investors, as business owners need a clear understanding of their company's profitability to persuade these investors to back their venture.\n\nSolving math problems goes beyond simple calculations; it teaches a step-by-step way to tackle challenges. This process can help to train logical and critical thinking — a skill indispensable to entrepreneurs. Take risk assessments as an example: business leaders often have to weigh the potential downsides and upsides of any choices, just as math problems require weighing multiple approaches. In other words, math gives business owners the skills to make logical decisions, enhancing their likelihood of succeeding in the world of business.\n\nGranted, some might say that leaders can rely on other resources to compensate for a lack of math skills. However, I firmly believe that a solid grasp of math remains crucial. For example, even if the company outsources accountants to manage its financial documents, its leaders would still need to understand math to interpret the data accurately. Similarly, even with technologies for analyzing market trends, the decision-makers still need critical and systematic thinking skills to make optimal choices. In these contexts, math still proves to be an invaluable tool.\n\nIn conclusion, the role of mathematics extends far beyond mere numerical calculations; it lays the foundation for strategic decision-making and logical thinking. Hence, I agree that mathematical knowledge is needed for business success.", comment: "Mỗi ý được giải thích đến nơi. Thêm **đoạn nhượng bộ** (*Granted, … However, …*) để trả lời trước phản biện của người đọc: có kế toán, có công nghệ thì sao?" },
      ],
      takeaway: "**Mẹo “đứa trẻ 7 tuổi”** (tr.201): đọc lại từng câu và tự hỏi *nếu mình chưa biết gì về chủ đề, mình có hiểu lập luận này không?* Nếu không, phát triển thêm.",
    },
    {
      type: "formula", id: "b8-nhuong-bo", nav: "★ Nhượng bộ", band8: true,
      title: "Kỹ thuật nhượng bộ (concession) cho bài “hoàn toàn đồng ý”",
      desc: "Sách Band 8, tr.202–204 · Ví dụ 2 người bố bàn về chuyện học giỏi: người bố thứ 2 thuyết phục hơn vì thừa nhận ý ngược lại rồi mới bác bỏ",
      formula: "Granted, some might say that … → However, I firmly believe that … → For example, even if … → In these contexts, … still proves …",
      steps: [
        { tag: "Thừa nhận", label: "Nêu phản biện phổ biến nhất", text: "*Granted, some might say / people might argue that …*" },
        { tag: "Bác bỏ", label: "Vì sao phản biện không làm yếu lập trường", text: "*However, I firmly believe / I would argue that …*" },
        { tag: "Giải thích", label: "Ví dụ “ngay cả khi …”", text: "*For example, even if … · Similarly, even with …*" },
        { tag: "Nối về đề", label: "Chốt lại lập trường", text: "*In these contexts, … still proves to be … · Therefore, the argument that … underestimates …*" },

      examples: [

          { tag: "Giải thích", text: "For example, even if the company outsources accountants to manage its financial documents, its leaders would still need to understand math to interpret the data accurately. Similarly, even with technologies for analyzing market trends, the decision-makers still need critical and systematic thinking skills to make optimal choices." },
          { tag: "Nối về đề", text: "In these contexts, math still proves to be an invaluable tool." },
        ] },
      ],
      note: "Lời khuyên IDP được trích trong sách: *Những điểm nào một người đọc khó tính sẽ phản bác? Hãy trả lời trước đúng lúc họ nghĩ tới.* Thầy sửa: bản gốc tr.204 có *its leaders of the company* (thừa) → *its leaders*.",
    },
    {
      type: "formula", id: "b8-bai-mau-l15", nav: "★ Bài mẫu L15", band8: true,
      title: "Bài mẫu L15: hoàn toàn phản đối (bác sĩ, giáo viên vs nghệ sĩ, vận động viên)",
      desc: "Sách Band 8, tr.204–205 · 268 từ · Đề: *Professional workers such as doctors and teachers should be paid more than sports and entertainment personalities.*",
      formula: "(1)(2) Mở bài → (3)–(6) Lý do 1: đời sống tinh thần → (7)–(10) Lý do 2: tài chính, văn hóa → (11)–(14) Nhượng bộ + bác bỏ → (15)(16) Kết bài",
      steps: [
        { tag: "Mở bài", label: "Paraphrase + hoàn toàn phản đối", text: "Câu (1)(2)" },
        { tag: "Lý do 1", label: "Nghề nào cũng quan trọng", text: "Câu (3)–(6)" },

        { tag: "Kết bài", label: "Nhắc chủ đề + lập trường", text: "Câu (15)(16)" },
      ],
      examples: [
        { q: "Some people believe that professional workers such as doctors and teachers should be paid more than sports and entertainment personalities. To what extent do you agree or disagree?", parts: [
          { tag: "Mở bài", text: "(1) Some people believe that intellectual workers should receive higher pay than sports and entertainment personalities. (2) I completely disagree with this statement for various reasons." },
          { tag: "Lý do 1", text: "(3) Firstly, every occupation plays a vital role within the intricate fabric of our societies. (4) While doctors and teachers contribute to our physical well-being and formal education, entertainers and sportspeople **enrich our mental lives**. (5) They heal the audiences through songs, inspire, entertain, and connect people through their performances. (6) They teach us about human emotions and **foster a sense of togetherness**." },
          { tag: "Lý do 2", text: "(7) Their influence does not only enrich our inner worlds, but also extends towards the financial and cultural aspects. (8) Singing or athletic performances **generate substantial tax revenue** through ticket sales, merchandise, endorsements, and media deals. (9) Their influence impacts fashion, trends, pop cultures, and even social issues. (10) These contributions, in my opinion, are **on par with** that of academic people; therefore, they deserve equal compensation." },
          { tag: "Nhượng bộ", text: "(11) Granted, people might say doctors and educators require more diligent training to attain the expertise needed. (12) However, I would argue that artists and athletes also must invest time, effort, and talent to thrive in their respective fields. (13) This dedication often comes with personal sacrifices and a limited window of **prime performance years**, unlike the more **stable career trajectories** of doctors and educators. (14) Therefore, the argument that knowledge workers should be prioritized in pay grossly underestimates the distinct pressures of the sport and entertainment industry." },
          { tag: "Kết bài", text: "(15) In conclusion, while intellectual occupations undoubtedly deserve competitive compensation for their critical roles, it is unjust to undermine the value of sports and entertainment personalities in society. (16) Therefore, I disagree that the former should be paid more than the latter." },
        ] },

    {
      type: "write", id: "b8-viet", nav: "★ Viết bài L15", band8: true,
      title: "Comprehensive Practice (L15): tiền nhà nước cho thể thao học đường hay nghệ thuật chuyên nghiệp?",
      desc: "Sách Band 8, tr.206 · Bài mẫu 267 từ ở đáp án tr.257",
      tasks: [
        { prompt: "*Government money should be used to support children in school for sports rather than to support professional sports and arts that perform for the general public. To what extent do you agree or disagree?*\n\nViết theo hướng **hoàn toàn** đồng ý hoặc phản đối, có **1 đoạn nhượng bộ** (40 phút).", rows: 16, min: 250,
          model: "Some people argue that government funds should prioritize supporting school sports for children over financing professional sports and arts for the general public. I completely disagree with this statement for various reasons.\n\nFirstly, professional sports and public arts are key for cultural and economic growth. Culturally, these industries provide a platform for showcasing talent at a national or global level, directly fostering national pride and international recognition. Economically, they boost tourism, merchandising, and media broadcasting. In my opinion, the revenue generated and the jobs created in these sectors far outweigh the benefits of confining government funding to school sports alone.\n\nSecondly, children and young adults often idolize professional athletes and artists, finding inspiration in their achievements. Allocating government funds to these professionals not only supports their endeavors but also actively inspires young talents, offering them real-life examples of success. Although academic subjects are crucial, they can sometimes seem abstract and less engaging compared to the immediate, impactful inspiration from seeing one's heroes excel in their fields.\n\nGranted, increasing funding for school sports is essential due to their direct benefits on children's physical education. While this point is valid, simply diverting resources from professional sports and arts might not be the solution. The funds on professional sports and arts offer a wealth of opportunities for young people, including career paths and scholarship possibilities, far outweighing the benefits brought by basic education.\n\nIn conclusion, allocating government funds to support professional sports and arts brings multiple benefits, from economic to inspirational. Given these impacts, I disagree that government funding should prioritize children's school sports over professional sports and public arts.",
          notes: ["Thầy sửa: đề in trong sách tr.206 bị lặp câu hỏi (*To what extent do you agree? To what extent do you agree or disagree?*), thầy giữ một câu.", "Từ chủ đề trong bài mẫu: *showcase talent · foster national pride and international recognition · merchandising · media broadcasting · idolize · allocate government funds · divert resources · career paths and scholarship possibilities*."] },
