      desc: "Sách Band 6, tr.222 · Đề: *Children who grow up in a family short of money are more capable of dealing with problems in adult life than children who are brought up by wealthy parents. To what extent do you agree or disagree?* · Đáp án tr.264",
      intro: "Câu hỏi: (1) gạch từ vựng mới ở bài A, B · (2) tìm từ nối, nằm ở câu nào · (3) lập dàn ý cho bài.",
      items: [
        { label: "Bài mẫu", tone: "ok", text: "(1) One school of thought holds that impoverished children have a higher capacity to handle difficulties in their adulthood than those who are supported by their wealthy families. (2) I agree with this argument.\n\n(3) The first reason is that children from financially disadvantaged families often witness and experience hardships from an early age. (4) They grow up in an environment where resources are limited, and they must find creative solutions to everyday challenges. (5) These experiences foster resilience, adaptability, and problem-solving skills that can be invaluable in adulthood. (6) On the other hand, children from rich families may not face the same hardships and challenges, which can limit their ability to develop the same strength and problem-solving skills as children from poor families.\n\n(7) Furthermore, children from low-income families are more likely to learn the value of hard work at an early age. (8) The reason is that they often witness their parents working tirelessly to make ends meet, which may instill a strong work ethic and determination in them. (9) These qualities are vital in adult life, where setbacks and obstacles are common. (10) In contrast, children from wealthy families might not have the same exposure to the daily struggles of their parents. (11) This means that they may take success for granted, and may not develop the same level of appreciation for hard work. (12) This may also affect their ability to handle challenges in adult life.\n\n(13) In conclusion, I strongly support that growing up in a disadvantaged family provides children with more opportunities for success in adult life.", comment: "Thầy sửa câu (13): *I strongly support that…* chưa tự nhiên → **I strongly believe that…** (*support* không đi với mệnh đề *that*)." },
        { label: "Đáp án", tone: "good", text: "(1) Từ mới: impoverished, have a higher capacity to (1) · financially disadvantaged families, hardships (3) · resilience (5) · strength (6) · low-income families (7) · make ends meet, work ethic, determination (8)\n\n(2) Từ nối: The first reason is that (3) · On the other hand (6) · Furthermore (7) · The reason is that (8) · In contrast (10) · This means that (11)\n\n(3) Dàn ý:\nMở bài: paraphrase + I agree with this argument.\nThân 1: trẻ nhà nghèo trải qua khó khăn từ sớm ← lớn lên thiếu thốn, phải tự giải quyết vấn đề mỗi ngày → kiên cường, thích nghi, giỏi giải quyết vấn đề >< trẻ nhà giàu ít khó khăn → kém các kỹ năng đó.\nThân 2: trẻ nhà nghèo sớm hiểu giá trị lao động ← thấy bố mẹ làm lụng vất vả → tinh thần làm việc, quyết tâm, rất cần khi trưởng thành >< trẻ nhà giàu không thấy bố mẹ vất vả → coi thành công là đương nhiên → kém xoay xở.\nKết bài: In conclusion, I strongly believe that view.", comment: "Mỗi thân bài có 1 lý do + **so sánh với nhóm còn lại** (*On the other hand, In contrast*): đây là cách làm đề so sánh 2 đối tượng." },

    /* ───────────── 4. ÔN 7 DẠNG ĐỀ & THI THỬ ───────────── */
    {
      type: "compare", id: "on-7-dang", nav: "Ôn 7 dạng đề", sticker: "teacher_tensaku_woman.webp",
      title: "Ôn 7 dạng Task 2 qua 7 bài mẫu của sách",
      desc: "Sách Band 6, tr.229–234, bài 8–14 · Mỗi bài kèm một mẹo của nhóm tác giả. Đọc nhanh mở bài và kết bài để nhớ lại khung của từng dạng",
      items: [
        { label: "Bài 8 · Agree–Disagree (hoàn toàn)", tone: "ok", text: "*If a product is good or it meets people's needs, people will buy it. So advertising is unnecessary and no more than entertainment. To what extent do you agree or disagree?*\n\nNowadays, many people question the necessity of advertisement, saying that good quality and useful functions are enough to convince people to buy a product. Some people even say that promotional campaigns are no more than entertainment. Personally, I do not agree with any of these arguments.\n\nFirstly, I disagree that people would buy a product simply for its quality or utility, and advertising is not needed. My reason is that while quality and utility are essential, advertisements help people discover new products and brands they might not know about. Therefore, ads create awareness and interest in different options. For example, a person might see an ad for a new smartphone with exciting features they did not know existed, which could lead them to consider it even if their current phone is still functional.\n\nSecondly, I also disagree that advertisements serve no higher purposes than just amusement. In my opinion, ads can be helpful in introducing useful products and services to the public. For example, a health-related advertisement might encourage people to adopt healthier habits, benefiting their well-being. Furthermore, advertisements increase competition among brands offering the same product, and as a result, consumers could enjoy reduced prices and better quality. The advertising industry has also been generating a lot of money; therefore, it can create jobs for workers and raise tax revenues for governments.\n\nIn conclusion, I do not believe that quality or functions alone can convince consumers to make a buying decision. It would also be unwise to say advertising has no purposes, as this industry brings about far too many economic and educational benefits to both consumers and societies.", comment: "Mẹo: với dạng Agree–Disagree, chọn **hoàn toàn đồng ý / không đồng ý** giúp thể hiện quan điểm rõ ràng. (Thầy sửa lỗi in *a lot of of money*.)" },
        { label: "Bài 9 · Adv–Disadv", tone: "ok", text: "*In some countries, more and more adults are living with their parents after graduating from college, university, or even after finding a job. Do the advantages of this outweigh the disadvantages?*\n\nThere has been much controversy about whether more and more adults living with their parents after graduating from college, university, or even after finding a job brings more benefits or drawbacks. In my opinion, this trend is more disadvantageous.\n\nIt is understandable why some people think living with parents after graduation is beneficial. One advantage of this arrangement is that it helps young adults save money. By sharing living expenses with their parents, they can build up their savings or invest in their future. Additionally, living with parents offers emotional support and a sense of security. This is especially important in challenging times, such as in the COVID pandemic.\n\nHowever, I believe there are stronger drawbacks to this living arrangement. One downside of living with parents after graduation is the potential lack of independence. This is because young adults may become too reliant on their parents, which can limit their ability to face challenges and make important life choices on their own. In contrast, living independently encourages individuals to take responsibility for their own lives, make decisions, and face challenges. It fosters independence, self-reliance, and the development of essential life skills. Another downside is the potential conflicts and tensions. For example, differences in lifestyles or personal preferences may lead to disagreements, conflicts and even hatred among family members.\n\nIn conclusion, it is apparent that living with parents after graduation offers more disadvantages than advantages.", comment: "Mẹo: chọn quan điểm xong thì trình bày **nhiều luận điểm hơn** cho bên mình chọn so với bên đối lập." },
        { label: "Bài 10 · Adv–Disadv (thu hẹp bên lợi)", tone: "ok", text: "*Some students prefer to take a gap year between high school and university. Do the advantages of this outweigh the disadvantages?*\n\nThere has been much controversy about whether taking a gap year between high school and university brings more benefits or drawbacks. In my opinion, this trend is more disadvantageous as students may have to delay their academic progress and suffer lower academic motivation.\n\nOne advantage of taking a gap year is that it can provide students with valuable life experiences. For instance, students who take a gap year can travel, volunteer, or work in international companies, which can expose them to new cultures, challenges, and perspectives. This can help students develop their interpersonal skills, independence, and self-awareness. However, this benefit would only be true for a small number of students with clear goals and plans for their gap year. Some students might find it hard to use their time off effectively.\n\nNonetheless, I believe that the drawbacks are stronger. One clear disadvantage is that it can lead to decreased motivation. Some students may forget some of the knowledge and skills they learn in high schools. Therefore, it may be more difficult for them to succeed in college-level courses. This drawback is crucial for students who want to pursue highly intellectual careers such as doctors or lawyers. Another drawback is that some people might view taking a gap year as a sign of indecisiveness or lack of ambition. This can lead to added stress for students who decide to take this time off.\n\nIn conclusion, it is apparent that taking a gap year after graduation offers more disadvantages than advantages.", comment: "Mẹo: nếu nghiêng về bất lợi, có thể chỉ ra rằng lợi ích **chỉ đúng với một nhóm nhỏ**, không đúng với mọi người. (Thầy sửa *find it hard use* → *find it hard **to** use*.)" },
        { label: "Bài 11 · Agree–Disagree (so sánh 2 lựa chọn)", tone: "ok", text: "*Some people think that it is more important to find a job that you love than to find a job that pays well. To what extent do you agree or disagree?*\n\nOne school of thought holds that finding a job that brings satisfaction is more important than finding a job that offers higher salary packages. I disagree with the view and think that it is better to have a well-paid job.\n\nI believe that a job with a high salary would offer more benefits to individuals than a job that fulfills personal interests. It is because this salary would allow people to have financial stability, which is essential to a sustainable life. Financial stability also allows people to obtain other life goals, such as getting married, taking care of their family members or reaching financial freedom. Meanwhile, people that value their feelings more than earnings might end up doing a job that pays less, not being able to cover their expenses and live an uncomfortable life.\n\nFurthermore, having a high income means that workers can invest in developing themselves. These workers can continue to have up-to-date and in-demand skills, which means their income will continue to increase. In contrast, doing what you love might result in working in a dead-end job because there is a risk that this occupation might not be what the society values, thus providing limited opportunity for growth. In short, a job that is well-paid can offer career development for a person, while the job that a person loves doing might not always guarantee that.\n\nIn conclusion, I am of the opinion that finding a high-paying job with financial stability and security is more crucial. A high-paying job can provide opportunities for personal and professional growth, and the ability to invest in one's future.", comment: "Mẹo: ở kết bài, ngoài việc nhắc lại quan điểm, có thể **tóm tắt lại các luận điểm chính** của thân bài." },
        { label: "Bài 12 · Discussion", tone: "ok", text: "*Some people say that it is possible for a country to be both economically successful and have a clean environment. Others disagree. Discuss both views and give your opinion.*\n\nA number of people believe that it is possible for a country to be both economically successful and environmentally clean. However, many others contend that economic success often harms nature. While both viewpoints are valid, I lean towards the latter perspective.\n\nIt is understandable why some people believe that economic success and a clean environment can coexist. The main reason is that there are eco-friendly production methods that can help produce goods and services without harming the environment. For instance, industries can adopt cleaner technologies, such as using renewable energy sources and energy-efficient machinery. These can help a country reduce harmful emissions and waste while maintaining their economic growth.\n\nHowever, I would argue that achieving both economic success and a clean environment is a challenging task. Firstly, economic growth requires energy to fuel production, transportation, and infrastructure development. However, green energy is often more expensive, and both companies and governments are hesitant to adopt it. As a result, they might choose cheaper but more polluting methods, which can have negative effects on the environment. Economic growth also requires natural resources, such as wood, minerals, and water. However, these activities can lead to deforestation, habitat destruction, which eventually harms biodiversity and ecological balance.\n\nIn conclusion, although both views are valid to some extent, I still believe that it is difficult for a country to be both economically successful and environmentally clean simultaneously.", comment: "Mẹo: Môi trường là chủ đề rất hay gặp, cần ôn kỹ từ vựng chủ đề này." },
        { label: "Bài 13 · Problem–Solution", tone: "ok", text: "*An increasing number of professionals, such as doctors and teachers, are leaving their own poorer countries to work in developed countries. What problems does this cause? What solutions can you suggest to deal with this situation?*\n\nRecently, a growing number of professionals such as doctors and teachers are leaving their own poorer countries to seek opportunities in developed nations. This phenomenon may cause several problems, and several solutions should be considered to address it.\n\nThis migration trend can pose several problems. First, it may lead to a shortage of qualified professionals in poorer countries. This may also lead to decreased access to quality services for the local population. Additionally, the departure of skilled workers can lead to economic inequalities within countries. When they leave, they often contribute to the growth of the more developed countries. On the other hand, the poorer countries may struggle to retain their skilled workforce, and therefore, may experience limited economic growth.\n\nTo mitigate these challenges, several potential solutions can be considered. Firstly, governments in poorer countries could implement policies that encourage skilled professionals to stay and contribute to their home nations. This can be achieved by offering competitive salaries, better working conditions, and professional development opportunities. Secondly, poorer countries can partner with wealthier countries to establish more knowledge exchange programs. This can be achieved through collaborations between universities, research institutions, and businesses. By sharing knowledge and resources, poorer countries can improve their own capabilities and attract skilled professionals to contribute to local development.\n\nIn conclusion, the migration of skilled professionals from poorer countries to developed nations presents significant challenges, such as the shortage of qualified professionals and economic inequalities, as richer countries benefit from the talents of skilled workers while poorer countries struggle to retain them. By implementing supportive policies and fostering collaborations, nations can address these challenges.", comment: "Mẹo: với dạng Cause – Problem – Solution, ôn kỹ các từ chỉ quan hệ nhân – quả (Buổi 18). (Thầy thêm **and** trong *supportive policies and fostering collaborations*.)" },
        { label: "Bài 14 · Agree (so sánh 2 hoạt động)", tone: "ok", text: "*Some people believe that reading stories from a book is better than watching TV or playing computer games for children. To what extent do you agree or disagree?*\n\nSome people say that reading books offers more benefits to children than watching TV or playing computer games. I completely agree with this statement.\n\nMy first reason is that reading from a book improves a child's cognitive abilities. It is because when children read, they have to imagine the characters, settings, and events in their minds. This can promote creativity and critical thinking skills. Unlike passive activities like watching TV or playing computer games, reading actively engages a child's brain, improving their vocabulary, language comprehension, and overall cognitive capacity.\n\nSecondly, reading stories from a book promotes emotional intelligence in children. As they read about different characters' emotions and experiences, they develop empathy and understanding of others. This emotional connection allows them to understand their own feelings better, fostering healthy social interactions and communication skills. In contrast, games often focus more on action, competition rather than exploring emotions and character development.\n\nFinally, I believe reading books is a rather harmless activity, and helps reduce exposure to harmful content. It is because books provide a safe and controlled environment, ensuring that children read age-appropriate and educational content. In contrast, TV shows and computer games often contain violent or inappropriate material, which can negatively impact a child's behavior and mindset.\n\nIn conclusion, I completely agree that reading stories from a book undoubtedly outweighs watching TV or playing computer games for children. Encouraging children to read from a young age would benefit their imagination, emotional intelligence and personal growth, fostering well-rounded individuals.", comment: "Mẹo: với đề so sánh, ngoài việc đồng ý với một bên, nên **so sánh tương phản** với bên không đồng ý (*Unlike…, In contrast…*) để bài cân bằng." },

        { label: "Bài Band 6 · sách tr.216", tone: "ok", text: "It is believed that with the increasing availability of computers and mobile devices, children are spending more time playing computer games and less time on sports. There are two main reasons for the situation and I believe that this trend is a negative development due to its effects on children's long-term mental and physical well-being.\n\nA range of factors are responsible for this problem. One reason why kids indulge in games is the technological advancement. Nowadays, devices such as smartphones or tablets provide instant access to various gaming options that are interactive and engaging, which is why children are increasingly drawn to them. In contrast, traditional sports activities may demand more effort and physical involvement, making them less attractive to some children, especially those with a sedentary lifestyle. Another reason is that many parents, especially those with office jobs, rely heavily on screens for entertainment and avoid outdoor activities. Children tend to copy their parents, and so they also spend more time on screens and less time on sports or physical activities.\n\nIn my opinion, excessive screen time represents a detrimental trend. Firstly, it causes isolation and loneliness in children. The reason is that screen-based games cannot replace the social interactions that happen during team sports. As a result, children who spend too much time in front of screens may have difficulty developing social skills and building relationships with peers. Furthermore, excessive use of technology can put the young at a high risk of health problems. This is because those who are always keeping their eyes on the screen may not be getting enough physical exercise, which is responsible for weight gain, short-sightedness, and scoliosis.\n\nIn conclusion, easy access to technology and parents' behavior are to blame for children choosing to play video games rather than sports, and I strongly
