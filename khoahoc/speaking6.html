            const ref = useRef(null);
            useEffect(() => {

                    if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
                }, { threshold: 0.05 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

                            </div>

                            <h2 className="text-2xl sm:text-3xl md:text-4xl font-black text-white tracking-tight">
                                SPEAKING <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-cyan-400 to-purple-400">PART 1 → 2 → 3</span>
                            </h2>

                            <p className="text-slate-400 text-sm leading-relaxed">
                                Sách chia 4 chương theo <strong className="text-slate-200">4 tiêu chí chấm IELTS Speaking</strong>. Lộ trình đi theo thứ tự <strong className="text-slate-200">Part 1 → Part 2 → Part 3</strong> với Chương 1 làm xương sống, rồi ghép Mạch lạc, Ngữ pháp vào đúng buổi có dạng câu hỏi phù hợp. Phát âm được rải đều <strong className="text-slate-200">20 phút mỗi buổi</strong> thay vì để dồn cuối khóa.
                            </p>

                            <div className="grid grid-cols-2 gap-3 pt-2">
                                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800">
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Thời lượng</p>
                                    <p className="text-xs md:text-sm font-bold text-slate-200">24 buổi · 90 phút / buổi</p>
                                </div>
                                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800">
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Lịch học</p>
                                    <p className="text-xs md:text-sm font-bold text-slate-200">2 buổi / tuần · 12 tuần</p>
                                </div>
                                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800">
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Kiểm tra</p>
                                    <p className="text-xs md:text-sm font-bold text-slate-200">Buổi 8 · 15 · 24</p>
                                </div>
                                <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800">
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Đầu ra</p>
                                    <p className="text-xs md:text-sm font-bold text-emerald-400">Speaking 6.0</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </Reveal>
        );

        // CÔNG CỤ LUYỆN TẬP DÙNG CHUNG CẢ KHÓA
        const TOOLS = [
            { href: 'speaking6/chu-am.html', icon: '🔤', name: 'Chữ ↔ Âm', desc: 'Nhìn từng cụm chữ, xem nó có thể đọc những âm nào và âm nào được dùng trong từ. Dán từ bất kỳ để phân tích.', c: 'from-cyan-400 to-blue-500', tag: 'Phát âm' },
            { href: 'giaotiep/phonics.html', icon: '📚', name: 'Bảng tra Phonics', desc: 'Tổng hợp 44 âm và các cách viết thường gặp: nhìn chữ đoán âm, nghe âm đoán chữ.', c: 'from-amber-400 to-orange-500', tag: 'Tra cứu' },
            { href: '../speaking.html', icon: '🤖', name: 'Luyện nói với AI', desc: 'Ghi âm trả lời câu hỏi Part 1 – 2 – 3, AI chấm theo 4 tiêu chí, thầy xem lại được.', c: 'from-fuchsia-500 to-indigo-500', tag: 'Speaking' }
        ];

        const ToolsBar = () => (
            <Reveal delay={100}>
                <div className="mb-16">
                    <div className="text-center mb-6">
                        <h2 className="text-lg md:text-xl font-bold text-white mb-1 tracking-wide">CÔNG CỤ LUYỆN TẬP</h2>
                        <p className="text-slate-500 text-xs md:text-sm">Dùng được ở mọi buổi — mở trên điện thoại hay máy tính đều được.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {TOOLS.map((t) => (
                            <a key={t.href} href={t.href} className="group relative block p-5 rounded-3xl bg-[#0c1220]/90 border border-slate-800 hover:border-slate-600 hover:-translate-y-0.5 transition-all overflow-hidden">
                                <div className={`absolute -right-10 -top-10 w-32 h-32 rounded-full blur-3xl opacity-20 group-hover:opacity-35 transition-opacity bg-gradient-to-br ${t.c}`}></div>
                                <div className="relative flex items-center gap-3">
                                    <span className={`w-11 h-11 shrink-0 rounded-2xl bg-gradient-to-br ${t.c} flex items-center justify-center text-xl`}>{t.icon}</span>
                                    <div className="min-w-0">
                                        <p className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{t.tag}</p>
                                        <p className="text-base font-extrabold text-white">{t.name} <span className="text-slate-500 group-hover:text-white transition-colors">→</span></p>
                                    </div>
                                </div>
                                <p className="relative mt-3 text-xs text-slate-400 leading-relaxed">{t.desc}</p>
                            </a>
                        ))}
                    </div>
                </div>
            </Reveal>
        );

        // KHUNG MỘT BUỔI 90 PHÚT
        const SESSION_FLOW = [
            { t: '0–10\'', name: 'Khởi động', d: 'Gọi 3–4 HV trả lời lại câu BTVN, không cầm giấy', c: 'text-cyan-400' },
            { t: '10–30\'', name: 'Phát âm', d: 'Một mục nhỏ của Chương 4, luyện trên từ vựng chủ đề hôm đó', c: 'text-indigo-400' },
            { t: '30–55\'', name: 'Lý thuyết', d: 'Công thức trả lời (Ch.1) + cấu trúc ghép (Ch.2/3) + Practice từ vựng', c: 'text-purple-400' },
            { t: '55–80\'', name: 'Luyện nói', d: 'Nói theo cặp / gọi lên bảng với câu hỏi Áp dụng, GV ghi lỗi', c: 'text-pink-400' },
            { t: '80–90\'', name: 'Sửa lỗi', d: 'Sửa lỗi chung + giao BTVN ghi âm phần Luyện tập thêm', c: 'text-amber-400' }
        ];

        const SessionFlow = () => (
            <Reveal delay={100}>
                <div className="mb-16">
                    <div className="text-center mb-6">
                        <h2 className="text-lg md:text-xl font-bold text-white mb-1 tracking-wide">KHUNG MỘT BUỔI HỌC 90 PHÚT</h2>
                        <p className="text-slate-500 text-xs md:text-sm">Buổi nào cũng chạy theo nhịp này để học viên quen nhịp nói.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                        {SESSION_FLOW.map((f, i) => (
                            <div key={i} className="p-4 rounded-2xl bg-[#0c1220]/90 border border-slate-800/80">
                                <p className={`text-xs font-black font-mono ${f.c}`}>{f.t}</p>
                                <p className="text-sm font-bold text-white mt-1">{f.name}</p>
                                <p className="text-xs text-slate-400 leading-relaxed mt-1">{f.d}</p>
                            </div>
                        ))}
                    </div>
                </div>
            </Reveal>
        );

        // Tự nhận biết bài học đã được up lên chưa.
        // Quy ước: "Buổi 05" ↔ file khoahoc/speaking6/buoi-05.html
        // Up file đúng tên lên là thẻ buổi đó tự hiện nút "Vào học".
        const LESSON_FOLDER = 'speaking6/';
        const lessonCheckCache = {};
        const lessonUrlFor = (session) => {
            const num = (session.s.match(/\d+/) || ['0'])[0].padStart(2, '0');
            return `${LESSON_FOLDER}buoi-${num}.html`;
        };
        const checkLesson = (url) => {
            if (!lessonCheckCache[url]) {
                lessonCheckCache[url] = fetch(url, { method: 'HEAD', cache: 'no-store' })
                    .then((r) => r.ok)
                    .catch(() => false);
            }
            return lessonCheckCache[url];
        };
        const useLessonAvailable = (url) => {
            const [ready, setReady] = useState(null); // null = đang kiểm tra
            useEffect(() => {
                let alive = true;
                checkLesson(url).then((ok) => { if (alive) setReady(ok); });
                return () => { alive = false; };
            }, [url]);
            return ready;
        };

        const InfoRow = ({ label, labelClass, text }) => (
            <div className="flex items-start gap-2.5 p-2.5 rounded-xl bg-slate-900/80 border border-slate-800/50">
                <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-md shrink-0 mt-0.5 w-[72px] text-center ${labelClass}`}>
                    {label}
                </span>
                <span className="text-xs text-slate-300 font-medium leading-relaxed">{text}</span>
            </div>
        );

        // Component Thẻ Buổi Học Độc Lập
        const SessionCard = ({ session }) => {
            const st = TYPE_STYLE[session.type] || TYPE_STYLE.part1;
            const lessonUrl = lessonUrlFor(session);
            const available = useLessonAvailable(lessonUrl);

            return (
                <div className="group/session p-4 rounded-2xl bg-[#0c1220]/90 border border-slate-800/80 hover:border-slate-700 hover:bg-[#111a2e] transition-all duration-300 shadow-sm">
                    <div className="flex items-center justify-between gap-2 mb-2.5">
                        <div className="flex items-center gap-2 min-w-0">
                            <span className="text-[11px] font-black px-2.5 py-0.5 rounded-lg bg-slate-800 text-slate-200 border border-slate-700/80 font-mono tracking-tight shadow-inner shrink-0">
                                {session.s}
                            </span>
                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider truncate">
                                {session.u}
                            </span>
                        </div>
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full border shrink-0 ${st.tag}`}>
                            {session.tag}
                        </span>
                    </div>

                    <h4 className="text-sm md:text-base font-bold text-slate-100 group-hover/session:text-white transition-colors mb-3 leading-snug">
                        {session.title}
                    </h4>

                    <div className="space-y-2">
                        <InfoRow label="Trọng tâm" labelClass={st.label} text={session.book} />
                        <InfoRow label="Luyện nói" labelClass="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" text={session.speaking} />
                        {session.pron && session.pron !== '—' && (
                            <InfoRow label="Phát âm" labelClass="bg-sky-500/10 text-sky-300 border border-sky-500/20" text={session.pron} />
                        )}
                    </div>

                    <div className="mt-3 flex justify-end">
                        {available ? (
                            <a href={lessonUrl}
                               className={`inline-flex items-center gap-1.5 rounded-xl px-4 py-2 text-xs font-extrabold text-white transition-all ${st.btn}`}>
                                Vào học <span aria-hidden="true">→</span>
                            </a>
                        ) : (
                            <span className="rounded-xl border border-slate-800 bg-slate-900/60 px-4 py-2 text-[11px] font-bold text-slate-500">
                                {available === null ? 'Đang kiểm tra…' : 'Sắp ra mắt'}
                            </span>
                        )}
                    </div>
                </div>
            );
        };

        const PhaseCard = ({ data, index }) => {
            const isLeft = index % 2 === 0;
            return (
                <Reveal delay={100}>
                    <div className="relative pl-6 md:pl-0 flex w-full">
                        <div className="hidden md:flex absolute left-1/2 -ml-3 mt-8 w-6 h-6 rounded-full bg-[#0B0F19] border-[3px] border-indigo-400 shadow-[0_0_15px_rgba(255,255,255,0.1)] items-center justify-center z-10"></div>
                        <div className="md:hidden absolute left-[-5px] mt-8 w-3 h-3 rounded-full border-2 border-[#0B0F19] bg-slate-500 z-10"></div>

                        <div className={`md:w-[48%] ${isLeft ? 'md:mr-auto md:pr-10' : 'md:ml-auto md:pl-10'} w-full`}>
                            <div className={`bg-[#0d1322]/85 backdrop-blur-xl border border-slate-800 p-5 sm:p-6 md:p-8 rounded-[2rem] shadow-glass-dark transition-all duration-300 relative group ${data.glow} ${data.borderColor}`}>
                                <div className="flex items-center justify-between mb-4">
                                    <span className="text-slate-400 text-[10px] md:text-xs font-bold tracking-widest uppercase border border-slate-700 bg-slate-800/60 px-3 py-1 rounded-full">{data.month}</span>
                                    <span className="text-slate-800 text-3xl font-black italic">{data.id}</span>
                                </div>
                                <p className={`text-xs font-bold tracking-wider mb-1 bg-clip-text text-transparent bg-gradient-to-r ${data.color}`}>{data.phase}</p>
                                <h3 className="text-2xl font-bold text-white mb-1">{data.title}</h3>
                                <p className="text-xs font-semibold text-slate-400 mb-3">{data.unitRange}</p>
                                <p className="text-slate-400 text-xs md:text-sm mb-6 leading-relaxed border-b border-slate-800/80 pb-5">{data.description}</p>

                                <div className="space-y-3.5">
                                    {data.sessions.map((session, i) => (
                                        <SessionCard key={i} session={session} />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </Reveal>
            );
        };

        const App = () => {
            return (
                <div className="max-w-[1240px] mx-auto px-4 sm:px-5 py-12 md:py-20">

                    {/* Header Hero */}
                    <Reveal delay={0}>
                        <div className="text-center mb-10">
                            <div className="inline-flex items-center px-4 py-1.5 mb-6 text-[10px] md:text-xs font-bold tracking-[0.2em] text-emerald-400 bg-emerald-900/20 border border-emerald-800/50 rounded-full">
                                IELTS SPEAKING JOURNEY 6.0 (24 BUỔI)
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black text-white tracking-tight mb-4">
                                LỘ TRÌNH SPEAKING 6.0 <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-500">
                                    NIGHT IELTS LAND
                                </span>
                            </h1>
                            <p className="text-slate-400 md:text-base max-w-2xl mx-auto leading-relaxed">
                                Đi từ Part 1 đến Part 3 trong 12 tuần: công thức phát triển ý cho từng dạng câu hỏi, từ nối mạch lạc, ngữ pháp ăn điểm và phát âm luyện đều mỗi buổi.
                            </p>
                        </div>
                    </Reveal>

                    <CurriculumShowcase />

                    <ToolsBar />

                    <SessionFlow />

                    {/* Timeline các giai đoạn */}
                    <div className="relative pt-6 pb-20">
                        <div className="absolute left-[5px] md:left-1/2 top-0 bottom-0 w-1 timeline-line md:-translate-x-1/2 rounded-full"></div>
                        <div className="space-y-12 md:space-y-24 mt-10">
                            {ROADMAP_DATA.map((phase, index) => <PhaseCard key={phase.id} data={phase} index={index} />)}
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
