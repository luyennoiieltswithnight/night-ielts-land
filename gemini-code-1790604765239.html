        const Reveal = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setIsVisible(true); observer.unobserve(entry.target); }
                }, { threshold: 0.05 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return ( <div ref={ref} className={isVisible ? 'reveal-visible' : 'reveal-hidden'} style={{ transitionDelay: `${delay}ms` }}>{children}</div> );
        };

                            <p className="text-slate-500 text-xs md:text-sm">Trải nghiệm trực tiếp bài tập luyện nói, nghe và chữa lỗi trực tiếp trên hệ thống Web.</p>
                        </div>
                    </Reveal>
                    
                    <WebsiteEmbed />

                    <div className="relative pt-6 pb-20">
                        <div className="absolute left-[5px] md:left-1/2 top-0 bottom-0 w-1 timeline-line md:-translate-x-1/2 rounded-full"></div>
                        <div className="space-y-12 md:space-y-24 mt-10">
                            {ROADMAP_DATA.map((phase, index) => <PhaseCard key={phase.id} data={phase} index={index} />)}
                        </div>
                    </div>
                    
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
