<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chọn giọng đọc · Night IELTS</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1b3a;--mut:#6b6a86;--line:#e6e4f2;--pri:#5b4bdb;--ok:#0f9d76;--bg:#f7f6fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;margin:0 0 6px}p.s{color:var(--mut);margin:0 0 18px;line-height:1.5}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;min-height:64px;background:#fff}
.v{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px}
.v.sel{border-color:var(--ok);box-shadow:0 0 0 2px #0f9d7630}.v .n{flex:1;min-width:0}.v b{display:block}.v small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;background:#efeafe;color:var(--pri)}
.v button{border:0;border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
.play{background:#efeafe;color:var(--pri)}.use{background:var(--ink);color:#fff}.v.sel .use{background:var(--ok)}
.note{background:#fff7e6;border:1px solid #f5dfae;border-radius:14px;padding:12px;margin-top:18px;line-height:1.55;font-size:14px}
.reset{margin-top:12px;background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer}
</style></head><body><main>
<h1>Chọn giọng đọc</h1>
<p class="s">Danh sách dưới đây là các giọng mà trình duyệt này đang cho web dùng. Bấm ▶ để nghe thử, bấm <b>Dùng</b> để cả web (Reading, Listening, khoá học) đọc bằng giọng đó trên máy này.</p>
<div class="tabs"><button data-k="en" class="on">English</button><button data-k="zh">中文</button><button data-k="vi">Tiếng Việt</button></div>
<textarea id="t"></textarea>
<div id="list"></div>
<button class="reset" id="reset">Bỏ chọn — để web tự chọn giọng</button>
<div class="note" id="note"></div>
</main>
<script src="/tts-pref.js?v=2"></script>
<script>
var K='en',SAMPLE={en:'The government should invest more in public transport, because it reduces traffic congestion.',zh:'这些汉字我都不会。我们一起去图书馆吧。',vi:'Xin chào các em, hôm nay chúng ta học bài mới.'};
var t=document.getElementById('t'),list=document.getElementById('list');
function good(n){return /premium|enhanced|nâng cao|cao cấp|natural|neural|google|online/i.test(n)}
function render(){
  var vs=(speechSynthesis.getVoices()||[]).filter(function(v){var l=(v.lang||'').toLowerCase();return K==='zh'?/^zh|^cmn/.test(l):l.indexOf(K)===0});
  vs.sort(function(a,b){return good(b.name)-good(a.name)||a.name.localeCompare(b.name)});
  var cur=localStorage.getItem('nightVoice_'+K)||'';list.innerHTML='';
  var g=document.createElement('div');g.className='v'+(cur==='__google'?' sel':'');
  g.innerHTML='<div class="n"><b>Giọng Google (online)<span class="tag">hay · miễn phí</span></b><small>Cần mạng · giọng giống Google Dịch, máy nào cũng như nhau</small></div><button class="play">▶</button><button class="use">'+(cur==='__google'?'✓ Đang dùng':'Dùng')+'</button>';
  g.querySelector('.play').onclick=function(){var p=localStorage.getItem('nightVoice_'+K);localStorage.setItem('nightVoice_'+K,'__google');speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.value);u.lang=K==='zh'?'zh-CN':K==='vi'?'vi-VN':'en-GB';speechSynthesis.speak(u);if(p)localStorage.setItem('nightVoice_'+K,p);else localStorage.removeItem('nightVoice_'+K)};
  g.querySelector('.use').onclick=function(){localStorage.setItem('nightVoice_'+K,'__google');render()};
  list.appendChild(g);
  if(!vs.length){list.insertAdjacentHTML('beforeend','<p class="s">Trình duyệt này chưa có giọng máy nào cho ngôn ngữ này.</p>')}
  vs.forEach(function(v){var d=document.createElement('div');d.className='v'+((cur===v.voiceURI||cur===v.name)?' sel':'');
    d.innerHTML='<div class="n"><b></b><small></small></div><button class="play">▶</button><button class="use">'+((cur===v.voiceURI||cur===v.name)?'✓ Đang dùng':'Dùng')+'</button>';
    d.querySelector('b').textContent=v.name;if(good(v.name)){var g=document.createElement('span');g.className='tag';g.textContent='hay';d.querySelector('b').appendChild(g)}
    d.querySelector('small').textContent=v.lang+(v.localService===false?' · online':'');
    d.querySelector('.play').onclick=function(){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.value);u.voice=v;u.lang=v.lang;u.rate=K==='zh'?0.85:0.95;speechSynthesis.speak(u)};
    d.querySelector('.use').onclick=function(){localStorage.setItem('nightVoice_'+K,v.voiceURI||v.name);render()};
    list.appendChild(d)});
  var n=document.getElementById('note'),ios=/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document;
  n.innerHTML=cur==='__google'?'Đang dùng giọng Google (online) — cần có mạng; nếu mất mạng web tự đọc bằng giọng máy.':vs.some(function(v){return good(v.name)})?'Có giọng chất lượng cao (gắn nhãn <b>hay</b>) — nên chọn giọng đó.':
    (ios?'Safari trên iPad/iPhone hiện <b>không cho web dùng</b> giọng Nâng cao/Cao cấp hay giọng Siri, kể cả khi đã tải về — nên danh sách chỉ có giọng thường. Thầy thử từng giọng ở trên và chọn giọng nghe ổn nhất (vd. Daniel, Karen, Moira cho tiếng Anh; Tingting cho tiếng Trung). Muốn giọng hay hơn hẳn thì cần dùng giọng AI tạo sẵn file.':'Máy này chưa có giọng chất lượng cao. Trên Chrome máy tính sẽ có giọng Google; trên Edge có giọng "Natural".');
}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelector('.tabs .on').classList.remove('on');b.classList.add('on');K=b.dataset.k;t.value=SAMPLE[K];render()}});
document.getElementById('reset').onclick=function(){localStorage.removeItem('nightVoice_'+K);render()};
t.value=SAMPLE[K];render();speechSynthesis.onvoiceschanged=render;setTimeout(render,600);
</script></body></html>
