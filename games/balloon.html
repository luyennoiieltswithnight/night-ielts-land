<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bắn Bóng Nghe Từ · Night IELTS</title>
<meta name="theme-color" content="#24242A">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
.bl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bl-top .ng-btn{padding:10px 14px;font-size:13.5px}
.bl-st{margin-left:auto;font:11px/1.8 "Press Start 2P",monospace;text-align:right}
.bl-sky{position:relative;height:min(62vh,520px);border-radius:6px;box-shadow:0 0 0 4px #24242A,0 8px 0 4px #24242A;overflow:hidden;background:linear-gradient(#BFE3F7,#FFE9C7);touch-action:manipulation}
.bl-b{position:absolute;bottom:-120px;width:120px;margin-left:-60px;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.bl-b .o{width:110px;height:130px;clip-path:polygon(25% 0,75% 0,75% 4%,88% 4%,88% 10%,96% 10%,96% 22%,100% 22%,100% 62%,96% 62%,96% 74%,88% 74%,88% 84%,75% 84%,75% 92%,58% 92%,58% 100%,42% 100%,42% 92%,25% 92%,25% 84%,12% 84%,12% 74%,4% 74%,4% 62%,0 62%,0 22%,4% 22%,4% 10%,12% 10%,12% 4%,25% 4%);display:grid;place-items:center;text-align:center;padding:10px;font:800 16px/1.2 "Plus Jakarta Sans",sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset -12px -14px 0 rgba(0,0,0,.12),inset 10px 10px 0 rgba(255,255,255,.25)}
.bl-b .s{width:4px;height:46px;background:repeating-linear-gradient(#5B3A21 0 6px,transparent 6px 10px)}
.bl-b.pop .o{animation:pop .25s forwards}@keyframes pop{to{transform:scale(1.5);opacity:0}}
.bl-b.no .o{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bl-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font:14px/1.6 "Press Start 2P",monospace;color:#3A2A4A;pointer-events:none}
.bl-big{font-size:12px;color:#6B6B78;text-align:center;margin-top:8px}
</style>
</head>
<body>
<script src="games-core.js?v=1"></script>
<script>
(function () {
  /* Cặp từ dễ nhầm khi nghe (Night IELTS tự soạn) */
  var PAIRS = ['ship sheep', 'live leave', 'sit seat', 'fill feel', 'bit beat', 'full fool', 'pull pool', 'look Luke', 'cat cut', 'bad bed', 'man men', 'hat hut', 'cap cup', 'ran run', 'walk work', 'law low', 'cost coast', 'not note',
    'think sink', 'three tree', 'thin tin', 'they day', 'though dough', 'math mass', 'mouth mouse', 'clothes close', 'right light', 'rice lice', 'road load', 'fly fry', 'play pray', 'glass grass', 'collect correct',
    'fan van', 'few view', 'berry very', 'boat vote', 'pig big', 'pear bear', 'cold gold', 'coat goat', 'back bag', 'card cart', 'sea she', 'sip ship', 'save shave', 'sour shower', 'chip ship', 'cheap sheep', 'chair share',
    'price prize', 'rice rise', 'bus buzz', 'place plays', 'peace peas', 'west vest', 'wine vine', 'year ear', 'jam yam', 'joke yolk', 'cloth close', 'want won\'t', 'can can\'t', 'fifteen fifty', 'thirteen thirty', 'sixteen sixty',
    'desert dessert', 'quite quiet', 'accept except', 'affect effect', 'advice advise', 'lose loose', 'later latter', 'personal personnel'];
  var body = NG.boot({ id: 'balloon', title: 'BẮN BÓNG NGHE TỪ', sub: 'Nghe từ được đọc · chạm đúng quả bóng', need: 'words', min: 6,
    extra: [['pairs', '👂 Cặp từ dễ nhầm (ship / sheep…)']], extraNote: '75 cặp từ người Việt hay nghe nhầm: nguyên âm dài – ngắn, th / s / t, r / l, âm cuối, số đếm…',
    extraItems: function () { var out = []; PAIRS.forEach(function (p) { var a = p.split(' '); out.push({ w: a[0], alt: a[1] }); out.push({ w: a[1], alt: a[0] }); }); return out; },
    levels: [['easy', '🎈 Dễ · 3 bóng, bay chậm'], ['mid', '🎈🎈 Vừa · 4 bóng'], ['hard', '🎈🎈🎈 Khó · 5 bóng, bay nhanh']],
    help: 'Bấm nghe, rồi chạm đúng quả bóng có chữ vừa được đọc. Để bóng đúng bay mất hoặc chạm sai là mất 1 tim. Có 3 tim.',
    onStart: start });
  var POOL, LV, S, raf, COLORS = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899'];
  function start(pool, src) {
    POOL = pool; LV = src.level;
    body.innerHTML = '<div class="bl-top"><button class="ng-btn" id="rep">🔊 Nghe lại</button><button class="ng-btn ghost" id="slow">🐢 Chậm</button><div class="bl-st"><span>ĐIỂM <b id="sc">0</b></span><br><span id="hp">❤❤❤</span></div></div><div class="bl-sky" id="sky"><div class="bl-msg" id="msg">SẴN SÀNG…</div></div><p class="bl-big">Chạm đúng quả bóng có từ bạn vừa nghe</p>';
    document.getElementById('rep').onclick = function () { if (S && S.t) NG.speak(S.t.w, .9); };
    document.getElementById('slow').onclick = function () { if (S && S.t) NG.speak(S.t.w, .55); };
    reset();
  }
  function reset() {
    cancelAnimationFrame(raf);
    S = { score: 0, hp: 3, n: 0, speed: LV === 'easy' ? 55 : LV === 'mid' ? 75 : 100, wrong: [], balloons: [], alive: true };
    document.getElementById('sc').textContent = 0; document.getElementById('hp').textContent = '❤❤❤';
    setTimeout(wave, 900);
  }
  function wave() {
    if (!S.alive) return;
    document.getElementById('msg').textContent = '';
    var sky = document.getElementById('sky'); sky.querySelectorAll('.bl-b').forEach(function (b) { b.remove(); });
    var t = POOL[S.n++ % POOL.length], n = LV === 'easy' ? 3 : LV === 'mid' ? 4 : 5, opts = [t.w];
    if (t.alt) opts.push(t.alt);
    NG.shuffle(POOL).forEach(function (x) { if (opts.length < n && opts.indexOf(x.w) < 0) opts.push(x.w); });
    opts = NG.shuffle(opts); S.t = t; S.balloons = [];
    var W = sky.clientWidth, H = sky.clientHeight;
    opts.forEach(function (w, i) {
      var el = document.createElement('div'); el.className = 'bl-b';
      el.innerHTML = '<div class="o" style="background:' + COLORS[(S.n + i) % COLORS.length] + '">' + NG.esc(w) + '</div><div class="s"></div>';
      var x = (W / (opts.length + 1)) * (i + 1) + (Math.random() * 30 - 15);
      el.style.left = x + 'px'; sky.appendChild(el);
      var b = { el: el, w: w, y: -120 - Math.random() * 90, x: x, ph: Math.random() * 6 };
      el.onpointerdown = function (e) { e.preventDefault(); hit(b); };
      S.balloons.push(b);
    });
    setTimeout(function () { NG.speak(t.w, .9); }, 300);
    var last = performance.now();
    (function loop(now) {
      var dt = Math.min(.05, (now - last) / 1000); last = now;
      if (!S.alive) return;
      var gone = false;
      S.balloons.forEach(function (b) { if (b.dead) return; b.y += S.speed * dt; b.ph += dt * 2; b.el.style.bottom = b.y + 'px'; b.el.style.left = (b.x + Math.sin(b.ph) * 10) + 'px'; if (b.y > H + 10 && b.w === S.t.w) gone = true; });
      if (gone) { miss('Bóng đúng đã bay mất: <b>' + NG.esc(S.t.w) + '</b>'); return; }
      raf = requestAnimationFrame(loop);
    })(last);
  }
  function hit(b) {
    if (b.dead || !S.alive) return;
    if (b.w === S.t.w) {
      b.dead = true; b.el.classList.add('pop'); NG.SFX.ok(); S.score += 10 + (LV === 'hard' ? 5 : 0); S.speed += 3;
      document.getElementById('sc').textContent = S.score; cancelAnimationFrame(raf);
      setTimeout(wave, 600);
    } else {
      b.el.classList.remove('no'); void b.el.offsetWidth; b.el.classList.add('no');
      S.wrong.push('Nghe <b style="color:#16A34A">' + NG.esc(S.t.w) + '</b> nhưng chọn <b>' + NG.esc(b.w) + '</b>');
      lose();
    }
  }
  function miss(why) { S.wrong.push(why); cancelAnimationFrame(raf); if (lose()) setTimeout(wave, 700); }
  function lose() {
    S.hp--; NG.SFX.bad(); document.getElementById('hp').textContent = '❤'.repeat(Math.max(0, S.hp)) + '♡'.repeat(3 - Math.max(0, S.hp));
    if (S.hp <= 0) { S.alive = false; cancelAnimationFrame(raf); setTimeout(function () { NG.over(body, { id: 'balloon-' + LV, score: S.score, title: 'HẾT TIM RỒI', line: Math.floor(S.score / 10) + ' từ nghe đúng', review: S.wrong, again: reset }); }, 400); return false; }
    return true;
  }
})();
</script>
</body>
</html>
