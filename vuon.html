<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Khu vườn từ vựng · Night IELTS</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F4B">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--night:#1B1F4B;--night2:#2B2F6E;--lilac:#6C70DC;--lilac-l:#EDEEFD;--peach:#FF9E5E;--peach-l:#FFF1E7;--gold:#FFD66B;--leaf:#4CAF50;--mut:#6B6B78;--line:#EEEEF3;--panel:#F4F4F7}
*{box-sizing:border-box}html,body{margin:0}html{background:#1B1F4B}
body{min-height:100vh;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,#141838 0%,#1B1F4B 30%,#2B2F6E 65%,#3B3A78 100%);overflow-x:hidden}
button,input,textarea,select{font-family:inherit}
.zhf{font-family:'Noto Sans SC','PingFang SC',sans-serif}
/* ===== bầu trời ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:99px;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.moon{position:absolute;right:7%;top:70px;width:110px;height:110px;border-radius:999px;background:radial-gradient(circle at 38% 36%,#FFFDF0 0%,#FFF3C4 45%,#F9DF8C 100%);box-shadow:0 0 60px 20px rgba(255,236,170,.35),0 0 140px 50px rgba(255,236,170,.15)}
.moon:after{content:"";position:absolute;left:24%;top:30%;width:18px;height:18px;border-radius:99px;background:rgba(214,186,110,.35);box-shadow:34px 18px 0 -3px rgba(214,186,110,.28),14px 40px 0 -6px rgba(214,186,110,.25)}
.fly{position:absolute;width:6px;height:6px;border-radius:99px;background:#FFF59D;box-shadow:0 0 10px 4px rgba(255,245,157,.7);animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}50%{transform:translate(60px,-80px)}85%{opacity:1}100%{transform:translate(-40px,-160px);opacity:0}}
.wrap{position:relative;z-index:1;max-width:72rem;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
/* ===== thanh trên ===== */
.top{display:flex;align-items:center;gap:10px;background:rgba(20,22,52,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 8px 6px 6px}
.top a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.top .logo{width:40px;height:40px;border-radius:999px;background:#2E7D32;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.top .logo img{height:30px}
.top h1{margin:0;font-size:16px;font-weight:800;white-space:nowrap}.top h1 small{display:block;font-size:11px;color:#B9BCF4;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;white-space:nowrap}
.pill.on{background:#fff;color:var(--ink)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#C9C9E6;font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
/* ===== bảng điều khiển ===== */
.hud{display:grid;gap:14px;margin:16px 0 8px}
@media(min-width:880px){.hud{grid-template-columns:1.35fr 1fr}}
.glass{position:relative;z-index:1;background:rgba(36,40,96,.82);border:1px solid rgba(255,255,255,.1);border-radius:28px;backdrop-filter:blur(8px)}
.water{position:relative;overflow:hidden;padding:22px;min-height:190px}
.water .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B9BCF4}
.water h2{margin:6px 0 2px;font-size:30px;line-height:1.1;font-weight:800;max-width:70%}
.water h2 b{color:var(--gold)}
.water p{margin:6px 0 0;color:#D6D8F5;font-size:13.5px;line-height:1.5;max-width:64%}
.water .jouro{position:absolute;right:18px;top:22px;height:104px;animation:pour 2.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes pour{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-14deg)}}
.drop{position:absolute;width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8FD3FF;opacity:0;animation:drip 2.6s linear infinite}
@keyframes drip{0%,40%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
.go{margin-top:16px;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:linear-gradient(135deg,#FFD66B,#FF9E5E);color:#3A2410;font-weight:800;font-size:15.5px;padding:14px 22px;cursor:pointer;box-shadow:0 14px 30px -10px rgba(255,158,94,.8);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:disabled{opacity:.5;cursor:default;transform:none}
.cd{display:flex;width:max-content;max-width:100%;align-items:center;gap:8px;margin-top:12px;background:rgba(0,0,0,.25);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat{background:rgba(255,255,255,.06);border-radius:20px;padding:12px}
.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#B9BCF4}
.stat b{display:block;font-size:24px;margin-top:2px}
.npd{grid-column:1/-1;background:rgba(255,255,255,.06);border-radius:20px;padding:12px}
.npd .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.npd button{border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
.npd button.on{background:var(--gold);color:#3A2410}
.npd p{margin:8px 0 0;font-size:12px;color:#D6D8F5;line-height:1.5}
/* ===== các tầng mây (6 bậc) ===== */
.garden{position:relative;margin-top:22px;padding-left:52px}
.vine{position:absolute;left:14px;top:10px;bottom:30px;width:16px;border-radius:99px;background:linear-gradient(90deg,#2E7D32,#66BB6A 60%,#2E7D32)}
.vine i{position:absolute;width:26px;height:16px;border-radius:0 99px 0 99px;background:#66BB6A;left:12px;animation:leaf 3.4s ease-in-out infinite;transform-origin:0 50%}
.vine i:nth-child(even){left:-22px;border-radius:99px 0 99px 0;transform-origin:100% 50%}
@keyframes leaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.tier{position:relative;margin-bottom:26px;cursor:pointer}
.tier .head{display:flex;align-items:center;gap:10px;margin:0 0 6px 6px}
.tier .head b{font-size:15px}.tier .head small{color:#B9BCF4;font-size:12px;font-weight:700}
.tier .cnt{margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.tier .cnt.due{background:#FF6B81;color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,129,.6)}50%{box-shadow:0 0 0 8px rgba(255,107,129,0)}}
.cloud{position:relative;min-height:122px;border-radius:60px;background:linear-gradient(180deg,rgba(255,255,255,.98),#E8ECFF);box-shadow:0 14px 30px -12px rgba(0,0,0,.45),inset 0 -8px 0 rgba(180,190,240,.45);padding:12px 18px 18px;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none;transition:transform .2s}
.cloud::-webkit-scrollbar{display:none}
.tier:hover .cloud{transform:translateY(-3px)}
.cloud:before,.cloud:after{content:"";position:absolute;top:-22px;width:90px;height:60px;border-radius:999px;background:#fff;z-index:-1}
.cloud:before{left:40px}.cloud:after{right:70px;width:120px;top:-28px}
.tier{isolation:isolate}
.pl{position:relative;flex:none;width:64px;display:flex;flex-direction:column;align-items:center}
.pl img{height:76px;width:auto;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.12))}
.pl.s0 img{height:22px;margin-bottom:6px}.pl.s1 img{height:40px}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pl .pot{width:44px;height:18px;margin-top:-4px;background:linear-gradient(180deg,#D9774A,#B85A31);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);border-radius:3px}
.pl span{font-size:10.5px;font-weight:800;color:#3B3A78;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pl.dry span{color:#BE123C}
.more{flex:none;align-self:center;margin-left:6px;color:#4B4FC0;font-weight:800;font-size:13px;white-space:nowrap}
.emptycl{color:#7A7FB8;font-weight:700;font-size:13px;align-self:center;padding:0 8px}
.ground{position:relative;margin-top:10px;border-radius:30px;background:linear-gradient(180deg,#2E6B3A,#24552E);padding:18px;display:flex;align-items:flex-end;gap:14px;overflow:hidden;min-height:150px}
.ground .man{height:120px}
.ground .rabbit{position:absolute;right:16px;bottom:10px;height:110px;opacity:.95}
.ground .txt{flex:1;max-width:60%}.ground .txt b{font-size:16px}.ground .txt p{margin:4px 0 0;font-size:13px;color:#D8F0DA;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
/* ===== bảng kho từ ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet>div{background:#fff;color:var(--ink);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:28px}}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet .sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.wl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wl img{height:38px;width:38px;object-fit:contain}
.wl .t{flex:1;min-width:0}.wl .t b{font-size:14.5px}.wl .t small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .due{font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap}
.wl .x{border:0;background:none;color:#C9C9D6;cursor:pointer;width:30px;height:30px;border-radius:99px}.wl .x:hover{background:#FFE4E6;color:#E11D48}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px;outline:none;color:var(--ink);background:#fff;margin-bottom:8px}
.field:focus{border-color:var(--lilac)}
.lock{max-width:520px;margin:60px auto;text-align:center;padding:28px}
.lock img{height:150px}
#player{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:2147483100;background:#E9E9EF;display:none}
#player.show{display:block}#player iframe{width:100%;height:100%;border:0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--ink);padding:11px 18px;border-radius:99px;font-weight:800;font-size:13.5px;z-index:2147483200;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.howto{padding:16px 18px;margin-top:14px;font-size:13px;line-height:1.6;color:#D6D8F5}
.howto b{color:#fff}
.howto summary{cursor:pointer;font-weight:800;color:#fff;font-size:14px}
@media(max-width:640px){.water h2{font-size:24px;max-width:100%}.water p{max-width:100%}.water .jouro{height:80px;opacity:.9;top:14px;bottom:auto}.garden{padding-left:34px}.vine{left:6px;width:12px}.top h1 small{display:none}.ground .txt{max-width:100%}.ground .rabbit{display:none}}

/* ===================== CẢNH ĐÊM & ĐẢO BAY (vẽ tay + hình Irasutoya) ===================== */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:46vh;min-height:260px}
.aurora{position:fixed;left:-10%;right:-10%;top:-8vh;height:46vh;z-index:0;pointer-events:none;background:radial-gradient(40% 60% at 25% 40%,rgba(120,240,200,.18),transparent 70%),radial-gradient(35% 55% at 70% 30%,rgba(160,130,255,.22),transparent 70%);filter:blur(20px);animation:aur 14s ease-in-out infinite alternate}
@keyframes aur{0%{transform:translateX(-3%) skewX(-6deg)}100%{transform:translateX(3%) skewX(6deg)}}
.moon2{position:fixed;z-index:0;right:7%;top:47vh;width:96px;height:96px;border-radius:999px;pointer-events:none;background:radial-gradient(circle at 36% 34%,#FFFEF4 0%,#FFF4C9 50%,#F3D98A 100%);box-shadow:0 0 50px 16px rgba(255,236,170,.32),0 0 140px 60px rgba(255,236,170,.12)}
.moon2 i{position:absolute;border-radius:99px;background:rgba(208,180,110,.33)}
.shoot{position:fixed;z-index:0;top:8vh;left:70%;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;transform:rotate(-24deg);animation:shoot 9s ease-in infinite;pointer-events:none}
@keyframes shoot{0%,86%{opacity:0;transform:translate(0,0) rotate(-24deg)}88%{opacity:1}100%{opacity:0;transform:translate(-520px,230px) rotate(-24deg)}}
.garden{position:relative;margin-top:30px;padding-left:0}
.vine{display:none}
.stalk{position:absolute;left:50%;top:0;bottom:120px;width:240px;transform:translateX(-50%);z-index:0;pointer-events:none}.stalk>svg{display:block}
.stalk svg{width:100%;height:100%}
.isle{position:relative;z-index:1;width:min(100%,820px);margin:0 auto 34px;cursor:pointer;animation:bob 6s ease-in-out infinite}
.isle:nth-child(odd){margin-left:0}.isle:nth-child(even){margin-right:0}
@media(max-width:900px){.isle{margin-left:auto!important;margin-right:auto!important}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.isle .sign{position:relative;z-index:3;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:0 0 2px 26px;background:linear-gradient(180deg,#9A6A3F,#7A4E2B);border:2px solid #5E3A1F;color:#FFF3DE;border-radius:12px;padding:6px 12px;font-weight:800;font-size:13.5px;box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}
.isle .sign img{height:22px}.isle .sign small{font-weight:700;color:#F6DDB8;font-size:11.5px}
.isle .sign .cnt{margin-left:4px;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 9px;font-size:12px}
.isle .sign .cnt.due{background:#FF6B81;animation:pulse 1.6s ease-in-out infinite}
.isle .land{position:relative;height:178px}
.isle .land>svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.isle .row{position:absolute;left:5%;right:5%;top:0;bottom:74px;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-top:24px}
.isle .row::-webkit-scrollbar{display:none}
.isle .row{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.isle .row .pl{scroll-snap-align:start}
.isle .lamp{position:absolute;bottom:84px;width:10px;height:10px;border-radius:99px;background:#FFE08A;box-shadow:0 0 14px 6px rgba(255,214,107,.55);animation:tw 2.6s ease-in-out infinite}
.pl{width:66px}
.pl .pot{background:linear-gradient(180deg,#E08A55,#B85A31);height:20px;width:46px}
.pl span{color:#FFF;text-shadow:0 1px 2px rgba(0,0,0,.6);background:rgba(20,22,52,.55);border-radius:999px;padding:1px 7px;max-width:70px}
.pl.dry span{color:#FFC2CC}
.pl.thirsty:before{content:"";position:absolute;top:-16px;left:50%;width:12px;height:16px;margin-left:-6px;background:#7CCBFF;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 10px 3px rgba(124,203,255,.6);animation:hop 1.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pl.gold:after{content:"";position:absolute;inset:-6px 6px 30px;border-radius:999px;background:radial-gradient(circle,rgba(255,230,140,.45),transparent 70%);animation:tw 2.4s ease-in-out infinite;z-index:-1}
.pl:hover img{transform:translateY(-6px) scale(1.06);animation-play-state:paused}
.isle .emptycl{position:absolute;left:0;right:0;bottom:90px;text-align:center;color:#DDE3FF;font-weight:700;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.isle .more{color:#FFE7A3;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ground{background:linear-gradient(180deg,#2F7A44,#215A31);border:2px solid rgba(255,255,255,.08);position:relative;z-index:1}
.music{width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.music.on{background:var(--gold);color:#3A2410;box-shadow:0 0 0 4px rgba(255,214,107,.25)}
.music.on i{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media(max-width:1100px){.moon2{display:none}}
@media(max-width:640px){.top{gap:6px}.top h1{display:none}.top .sp{flex:1}.top #bankBtn .lbl,.top #visitBtn .lbl{display:none}.top #visitBtn{padding:10px 12px}.top #bankBtn{padding:10px 12px}.seg button{padding:7px 10px}
  .water .jouro,.water .drop{display:none!important}.water h2{max-width:100%}
  .moon2{display:none}.stats{grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}.stat{padding:10px}.stat b{font-size:20px}.stat small{font-size:9.5px;letter-spacing:.06em}
  .go{width:100%;justify-content:center}.cd{max-width:100%;font-size:12px}
  .isle .sign{flex-wrap:wrap;row-gap:2px}.isle .sign small{display:none}
}
@media(max-width:640px){.moon2{width:64px;height:64px;top:52vh}.isle .land{height:160px}.isle .sign{margin-left:10px}.pl{width:58px}.pl img{height:64px}}

/* ===================== BẦU TRỜI THEO GIỜ (sáng · chiều · tối) ===================== */
:root{--m1a:#3A3F86;--m1b:#232659;--m2a:#2A2E6B;--m2b:#181B44;--lk1:#3B4A9A;--lk2:#141838;--cl1:#F6F6FF;--cl2:#DCDFFF;--cl3:#A9AEE8;--clo:#6E73B8}
body{transition:background 1.2s}
html.ph-day body{background:linear-gradient(180deg,#3E9BEA 0%,#76C1FA 35%,#B7E2FF 70%,#E3F4FF 100%)}
html.ph-dawn body{background:linear-gradient(180deg,#3B3F8E 0%,#9B7BC4 32%,#F7A58A 66%,#FFE0B0 100%)}
html.ph-dusk body{background:linear-gradient(180deg,#22265E 0%,#6A4C9C 34%,#E0779A 66%,#FFB27A 100%)}
html.ph-day{--m1a:#8FD49A;--m1b:#5FAE74;--m2a:#5AA86C;--m2b:#3B8655;--lk1:#7FD0FA;--lk2:#3E9BD6;--cl1:#FFFFFF;--cl2:#F2F6FF;--cl3:#CBD8F2;--clo:#8CA2CF}
html.ph-dawn,html.ph-dusk{--m1a:#8C6FA8;--m1b:#5D4983;--m2a:#5E4A86;--m2b:#3A2F63;--lk1:#C58AB0;--lk2:#4A3A70;--cl1:#FFF8F4;--cl2:#FBE2E6;--cl3:#D9B4D2;--clo:#9A7AA8}
html:not(.ph-night) .aurora,html:not(.ph-night) .shoot,html:not(.ph-night) .moon2{display:none}
html.ph-day .star{display:none}html.ph-dawn .star,html.ph-dusk .star{opacity:.3!important}
html.ph-day .fly,html.ph-dawn .fly{display:none}
.sun{position:fixed;z-index:0;pointer-events:none;right:9%;top:9vh;width:120px;height:120px;border-radius:999px;display:none;background:radial-gradient(circle at 40% 38%,#FFFDE8 0%,#FFE680 45%,#FFC93C 100%);box-shadow:0 0 70px 26px rgba(255,220,110,.55),0 0 180px 80px rgba(255,236,160,.28);animation:sunr 8s ease-in-out infinite}

/* ---------- gom từ từ Sổ từ vựng (đề Reading/Listening) ---------- */
async function importNotebook(silent) {
  let n = 0;
  const ctx = (() => { try { return JSON.parse(localStorage.getItem('nv-word-ctx') || '{}'); } catch (e) { return {}; } })();
  try {
    const snap = await getDocs(query(collection(db, 'savedWords'), where('studentId', '==', S.user.uid)));
    snap.forEach(d => { const x = d.data(); if (addWord({ t: x.word, m: x.meaning, s: ctx[String(x.word || '').toLowerCase()] || '', l: /[一-鿿]/.test(x.word) ? 'zh' : 'en', src: x.sourceTitle })) n++; });
  } catch (e) {}
  try { (JSON.parse(localStorage.getItem('ielts_vocab_book') || '[]')).forEach(x => { if (addWord({ t: x.en, m: x.vi, s: ctx[String(x.en || '').toLowerCase()] || '', src: 'Sổ từ vựng' })) n++; }); } catch (e) {}
  /* từ "Trồng vào vườn" từ trang Nghe – Gõ / khoá học (để chờ trong máy nếu chưa mở vườn) */
  try { const q = JSON.parse(localStorage.getItem('vuon-inbox') || '[]'); q.forEach(o => { if (addWord(o)) n++; }); localStorage.removeItem('vuon-inbox'); } catch (e) {}
  if (n) { save(); if (!silent) toast(`Đã gieo ${n} hạt giống mới`); }
  else if (!silent) toast('Không có từ mới trong Sổ từ vựng');
  render();
}

/* ---------- vẽ khu vườn ---------- */
function sky() {
  const sk = $('#sky'); if (sk.dataset.ok) return; sk.dataset.ok = 1;
  let h = '';
  for (let i = 0; i < 90; i++) h += `<span class="star" style="left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${(Math.random() * 3).toFixed(2)}s;opacity:${(.3 + Math.random() * .7).toFixed(2)}"></span>`;
  for (let i = 0; i < 6; i++) { const w = 120 + Math.random() * 160; h += `<span class="dcl" style="width:${w.toFixed(0)}px;height:${(w * .32).toFixed(0)}px;top:${(4 + Math.random() * 34).toFixed(1)}vh;animation-duration:${(70 + Math.random() * 60).toFixed(0)}s;animation-delay:${(-Math.random() * 120).toFixed(0)}s"></span>`; }
  for (let i = 0; i < 3; i++) h += `<span class="bird" style="top:${(10 + Math.random() * 22).toFixed(1)}vh;animation-duration:${(26 + Math.random() * 14).toFixed(0)}s;animation-delay:${(-Math.random() * 30).toFixed(0)}s"><svg viewBox="0 0 26 12"><path d="M1 3 Q7 -1 13 7 Q19 -1 25 3" fill="none" stroke="#3B4A6B" stroke-width="2.2" stroke-linecap="round"/></svg></span>`;
  for (let i = 0; i < 14; i++) h += `<span class="fly" style="left:${Math.random() * 100}%;top:${30 + Math.random() * 65}%;animation-delay:${(Math.random() * 9).toFixed(2)}s;animation-duration:${(7 + Math.random() * 6).toFixed(1)}s"></span>`;
  sk.insertAdjacentHTML('beforeend', h);
}

/* Đảo mây mềm (vẽ tay) + cây trong chậu theo loài hoa */
function plantHTML(x, b, i, sample) {
  const dry = !sample && isDry(x), due = !sample && isDue(x), sp = !!x.fx;
  return `<div class="pl s${b}${dry ? ' dry' : ''}${due ? ' thirsty' : ''}${b === 5 ? ' gold' : ''}${sp ? ' sp' : ''}" ${sample ? '' : `data-w="${x.id}"`} title="${esc(x.t || '')}${x.m ? ' — ' + esc(x.m) : ''}">${GardenArt.plant(flowerOf(x), dry ? 'wilt' : b, { delay: -(i * .37 % 3.4).toFixed(2), special: sp })}${!sample && S.data && S.data.ss && S.data.ss.ids.includes(x.id) ? `<button class="gstar" data-star="${x.id}" aria-label="Nhặt sao">${GardenArt.star(30)}</button>` : ''}${sample ? '' : `<span class="${x.l === 'zh' ? 'zhf' : ''}">${esc(x.t)}</span>`}</div>`;
}
function tier(b, W) {
  const L = W.filter(x => x.b === b).sort((a, c) => (isDue(c) - isDue(a)) || (isDry(c) - isDry(a)) || (a.d - c.d)), dueN = L.filter(isDue).length, MAX = 60;
  const plants = L.slice(0, MAX).map((x, i) => plantHTML(x, b, i)).join('');
  return `<div class="isle" data-tier="${b}" style="animation-delay:${(-b * 1.1).toFixed(1)}s">
    <div class="sign">${GardenArt.plant('sun', b, {}).replace('class="ga"', 'class="ga" style="width:20px;height:28px"')}${STAGE[b].n}<small>${STAGE[b].d}</small><span class="cnt${dueN ? ' due' : ''}">${dueN ? dueN + ' cần tưới · ' : ''}${L.length}</span></div>
    <div class="land">${GardenArt.cloud(b + 1)}<span class="lamp" style="left:4%"></span><span class="lamp" style="right:4%;animation-delay:1.2s"></span>
      ${animalsOn((S.data.an || []).filter(a => a.t === b && a.k !== 'cu').map(a => a.k))}
      ${plants ? `<div class="row">${plants}${L.length > MAX ? `<span class="more">+${L.length - MAX} cây</span>` : ''}</div>` : `<div class="emptycl" style="bottom:120px">${b === 0 ? 'Chưa có hạt giống — bấm Kho hạt giống để gieo' : 'Chưa có cây nào ở bậc này'}</div>`}
    </div></div>`;
}
function magicRow() {
  const n = S.data.mg || 0, st = S.data.streak.n || 0, nx = nextMs(st);
  return `<div class="magic"><svg class="ic" viewBox="-22 -26 44 44">${GardenArt.bloom('rainbow')}</svg><div><b>Phép màu: ${n}</b><small>Giữ chuỗi <b>${nx}</b> ngày (còn ${nx - st}) → được biến <b>${nx * 2}</b> cây thành hoa đặc biệt</small></div><button id="mgBtn" ${n ? '' : 'disabled'}><i class="fa-solid fa-wand-magic-sparkles"></i> Dùng</button></div>`;
}
function tick() {
  const el = $('#cd'); if (!el) return;
  const ms = +el.dataset.t - Date.now();
  if (ms <= 0) { render(); return; }
  const h = Math.floor(ms / 36e5), mi = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  el.textContent = `Lứa cây tiếp theo cần tưới sau ${h >= 24 ? Math.floor(h / 24) + ' ngày ' + (h % 24) + 'g' : String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0') + ':' + String(s).padStart(2, '0')}`;
}

let pubT = 0;

/* ================== CÂY ĐẬU THẦN · SAO · THÚ GIỮ VƯỜN ================== */
function drawStalk() { const el = $('#stalk'); if (!el) return; const H = el.clientHeight; if (H && Math.abs((+el.dataset.h || 0) - H) > 4) { el.dataset.h = H; el.innerHTML = GardenArt.stalk(H); } }
window.addEventListener('resize', () => { clearTimeout(drawStalk.t); drawStalk.t = setTimeout(drawStalk, 200); });
function animalsOn(keys) {
  return keys.map((k, i) => { const d = 34 + (hashN(k) % 22), sc = { ga: .78, ech: .8, vit: .9, nhim: .9, panda: 1.15, cao: 1.05 }[k] || 1; return `<div class="an" style="animation-duration:${d}s;animation-delay:${-(i * 11 + hashN(k) % 9)}s"><div class="an-f" style="animation-duration:${d}s;animation-delay:${-(i * 11 + hashN(k) % 9)}s"><div class="an-b ${k}" style="width:${Math.round(56 * sc)}px">${GardenArt.animal(k)}</div></div></div>`; }).join('');
}
/* Sao: cứ 4 tiếng vườn rụng một đợt sao lên các cây — phải vào vườn nhặt, qua đợt sau sao cũ biến mất */
const slotNow = () => today() + ':' + Math.floor(new Date().getHours() / 4);
function spawnStars() {
  const D = S.data; if (!D) return;
  D.sc = D.sc || 0; D.an = D.an || [];
  const slot = slotNow(); if (D.ss && D.ss.slot === slot) return;
  const shown = []; [0, 1, 2, 3, 4, 5].forEach(b => words().filter(x => x.b === b).sort((a, c) => (isDue(c) - isDue(a)) || (isDry(c) - isDry(a)) || (a.d - c.d)).slice(0, 60).forEach(x => shown.push(x)));
  const pool = shown.filter(x => x.b >= 1).length ? shown.filter(x => x.b >= 1) : shown;
  const n = pool.length ? Math.min(6, Math.max(1, Math.round(pool.length / 8))) : 0, ids = [];
  while (ids.length < n) { const x = pool[Math.floor(Math.random() * pool.length)]; if (!ids.includes(x.id)) ids.push(x.id); }
  D.ss = { slot, ids }; save();
}
function pickStar(btn) {
  const id = btn.dataset.star, D = S.data; if (!D.ss.ids.includes(id)) return;
  D.ss.ids = D.ss.ids.filter(x => x !== id); D.sc = (D.sc || 0) + 1; save();
  const r = btn.getBoundingClientRect(), to = $('#starCnt'), t = to ? to.getBoundingClientRect() : { left: innerWidth - 60, top: 20 };
  const f = document.createElement('div'); f.className = 'starfly'; f.innerHTML = GardenArt.star(34); f.style.left = r.left + 'px'; f.style.top = r.top + 'px'; document.body.appendChild(f);
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transform = `translate(${t.left - r.left}px,${t.top - r.top}px) scale(.6) rotate(220deg)`; f.style.opacity = '.2'; }));
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); [988, 1319, 1760].forEach((fr, i) => { const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = fr; g.gain.setValueAtTime(.0001, a.currentTime + i * .07); g.gain.exponentialRampToValueAtTime(.12, a.currentTime + i * .07 + .01); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + i * .07 + .25); o.connect(g); g.connect(a.destination); o.start(a.currentTime + i * .07); o.stop(a.currentTime + i * .07 + .3); }); setTimeout(() => a.close(), 900); } catch (e) {}
  btn.remove();
  setTimeout(() => { f.remove(); const c = $('#starCnt'); if (c) { c.textContent = D.sc; c.parentElement.classList.remove('pop'); void c.offsetWidth; c.parentElement.classList.add('pop'); } }, 750);
}

/* ---------- chọn loài hoa ---------- */

/* ---------- 1 cây: xem từ, đổi loài hoa, dùng phép màu ---------- */
function openPlant(id) {

    <div class="flw" id="spPick">${SPX().map(f => `<button class="sp ${x.fx === f.k ? 'on' : ''}" data-sp="${f.k}" ${x.fx === f.k || (!mg && x.fx !== f.k) ? 'disabled' : ''}>${GardenArt.chip(f.k)}${f.n}</button>`).join('')}</div>

/* ---------- dùng phép màu cho nhiều cây một lúc ---------- */
function openMagic() {

    <p class="sub">Chọn loài hoa đặc biệt — vườn tự biến những cây lớn nhất trước. Muốn chọn từng cây thì chạm vào cây trong vườn.</p>
    <div class="flw" id="spPick">${SPX().map((f, i) => `<button class="sp ${i ? '' : 'on'}" data-sp="${f.k}">${GardenArt.chip(f.k)}<span>${f.n}<small style="display:block;font-weight:600;color:var(--mut);font-size:11px">${f.d}</small></span></button>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${[...new Set([Math.min(mg, 5), Math.min(mg, 10), mg])].filter(n => n > 0).map(n => `<button class="btn" style="background:var(--ink);color:#fff" data-n="${n}"><i class="fa-solid fa-wand-magic-sparkles"></i> Biến ${Math.min(n, cand.length)} cây</button>`).join('')}</div>`;
  $('#sheet').classList.add('show');
  $('#closeS').onclick = () => $('#sheet').classList.remove('show');
  $('#sheetBody').querySelectorAll('[data-sp]').forEach(bt => bt.onclick = () => { kind = bt.dataset.sp; $('#sheetBody').querySelectorAll('[data-sp]').forEach(y => y.classList.toggle('on', y === bt)); });

  });
}

  if (k !== 'rain' && k !== 'storm' && k !== 'snow') return;
  const heavy = k === 'storm' || [65, 67, 82].includes(WX.code), N = k === 'snow' ? 90 : heavy ? 260 : 150;
  const P = Array.from({ length: N }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, v: k === 'snow' ? .6 + Math.random() : 9 + Math.random() * 8, l: 10 + Math.random() * 14, r: 1 + Math.random() * 2.2 }));
  let flashT = Date.now() + 4000;
  const draw = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (k === 'snow') { ctx.fillStyle = 'rgba(255,255,255,.85)'; P.forEach(p => { p.y += p.v; p.x += Math.sin(p.y / 40) * .6; if (p.y > cv.height) { p.y = -5; p.x = Math.random() * cv.width; } ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }); }
    else {
      ctx.strokeStyle = document.documentElement.classList.contains('ph-day') ? 'rgba(120,150,190,.55)' : 'rgba(200,215,255,.45)'; ctx.lineWidth = 1.3; ctx.beginPath();
      P.forEach(p => { p.y += p.v; p.x -= p.v * .18; if (p.y > cv.height) { p.y = -20; p.x = Math.random() * (cv.width + 100); } ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * .18, p.y - p.l); });
      ctx.stroke();
      if (k === 'storm' && Date.now() > flashT) { const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); flashT = Date.now() + 5000 + Math.random() * 9000; }
    }
    wxRaf = document.hidden ? 0 : requestAnimationFrame(draw);
  };
  draw();
}

/* ================== MÀN MỞ ĐẦU: vườn mẫu nở đầy hoa → bấm vào → mây tụ lại → mở ra vườn của mình ================== */
function intro() {
  const ks = FL().map(f => f.k), sp = SPX().map(f => f.k);
  const isle = (b, n) => {
    const P = Array.from({ length: n }, (_, i) => { const k = (i * 3 + b) % 9 === 4 ? sp[(i + b) % 3] : ks[(i * 5 + b * 3) % ks.length]; return plantHTML({ id: 's' + b + i, t: '', f: k, fx: sp.includes(k) ? k : '' }, b >= 4 ? b : (i % 3 ? 5 : 4), i, true); }).join('');
    return `<div class="isle" style="animation-delay:${(-b * 1.1).toFixed(1)}s"><div class="land">${GardenArt.cloud(b + 11)}<span class="lamp" style="left:4%"></span><span class="lamp" style="right:4%;animation-delay:1.2s"></span>${animalsOn([['cho', 'ga'], ['meo'], ['tho', 'vit'], ['panda'], ['cao', 'ech'], ['nhim']][5 - b])}<div class="row" style="justify-content:center;-webkit-mask-image:none;mask-image:none">${P}</div></div></div>`;
  };
  const d = document.createElement('div'); d.id = 'intro';
  d.innerHTML = `<div class="ttl"><span class="k">Khu vườn mẫu</span><h2>Một khu vườn đã nở rộ</h2><p>Mỗi bông hoa là một từ đã thuộc. Chăm tưới mỗi ngày — vườn của bạn cũng sẽ nở kín các tầng như thế này.</p></div>
    ${[5, 4, 3, 2, 1, 0].map(b => isle(b, innerWidth < 640 ? 5 : 9)).join('')}
    <div class="bar"><small>Đang mở khu vườn của bạn…</small><div class="prog"><i></i></div><button class="go enter" id="enterG"><i class="fa-solid fa-door-open"></i> Vào khu vườn của tôi</button></div>`;
  document.body.appendChild(d);
  const g = document.createElement('div'); g.className = 'gate';
  const puffs = side => Array.from({ length: 9 }, (_, i) => { const sz = 22 + (i * 7) % 16; return `<b style="width:${sz}vh;height:${sz}vh;top:${i * 12 - 4}vh;${side}:${-sz / 2 + 2 + (i % 3) * 2}vh"></b>`; }).join('');
  g.innerHTML = `<div class="half L"><div class="core"></div>${puffs('right')}</div><div class="half R"><div class="core"></div>${puffs('left')}</div>`;
  document.body.appendChild(g);
  requestAnimationFrame(() => requestAnimationFrame(() => { d.querySelector('.prog i').style.width = '100%'; }));
  const t0 = Date.now();
  const ready = () => { if (Date.now() - t0 < 2700 || (S.user && S.ok && !S.data)) return setTimeout(ready, 150); d.classList.add('ready'); };
  setTimeout(ready, 2700);
  const enter = () => {
    if (!d.classList.contains('ready') || g.classList.contains('close')) return;
    if (window.NVMusic && NVMusic.on()) NVMusic.start(); /* lần chạm này mở khoá âm thanh trên iPhone/iPad */
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    g.classList.add('close');
    setTimeout(() => { d.remove(); document.body.classList.remove('intro'); window.scrollTo(0, 0); }, 1150);
    setTimeout(() => { g.classList.remove('close'); setTimeout(() => g.remove(), 1200); }, 1650);
  };
  $('#enterG').onclick = enter;
}
