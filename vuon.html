<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Khu vườn từ vựng · Night IELTS</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1F4B">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--night:#1B1F4B;--night2:#2B2F6E;--lilac:#6C70DC;--lilac-l:#EDEEFD;--peach:#FF9E5E;--peach-l:#FFF1E7;--gold:#FFD66B;--leaf:#4CAF50;--mut:#6B6B78;--line:#EEEEF3;--panel:#F4F4F7}
*{box-sizing:border-box}html,body{margin:0}html{background:#1B1F4B}
body{min-height:100vh;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,#141838 0%,#1B1F4B 30%,#2B2F6E 65%,#3B3A78 100%);overflow-x:hidden}
button,input,textarea,select{font-family:inherit}
.zhf{font-family:'Noto Sans SC','PingFang SC',sans-serif}
/* ===== bầu trời ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:99px;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.moon{position:absolute;right:7%;top:70px;width:110px;height:110px;border-radius:999px;background:radial-gradient(circle at 38% 36%,#FFFDF0 0%,#FFF3C4 45%,#F9DF8C 100%);box-shadow:0 0 60px 20px rgba(255,236,170,.35),0 0 140px 50px rgba(255,236,170,.15)}
.moon:after{content:"";position:absolute;left:24%;top:30%;width:18px;height:18px;border-radius:99px;background:rgba(214,186,110,.35);box-shadow:34px 18px 0 -3px rgba(214,186,110,.28),14px 40px 0 -6px rgba(214,186,110,.25)}
.fly{position:absolute;width:6px;height:6px;border-radius:99px;background:#FFF59D;box-shadow:0 0 10px 4px rgba(255,245,157,.7);animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}50%{transform:translate(60px,-80px)}85%{opacity:1}100%{transform:translate(-40px,-160px);opacity:0}}
.wrap{position:relative;z-index:1;max-width:72rem;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
/* ===== thanh trên ===== */
.top{display:flex;align-items:center;gap:10px;background:rgba(20,22,52,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:6px 8px 6px 6px}
.top a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
.top .logo{width:40px;height:40px;border-radius:999px;background:#2E7D32;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.top .logo img{height:30px}
.top h1{margin:0;font-size:16px;font-weight:800;white-space:nowrap}.top h1 small{display:block;font-size:11px;color:#B9BCF4;font-weight:600}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff;white-space:nowrap}
.pill.on{background:#fff;color:var(--ink)}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#C9C9E6;font-weight:800;font-size:12.5px;padding:7px 12px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
/* ===== bảng điều khiển ===== */
.hud{display:grid;gap:14px;margin:16px 0 8px}
@media(min-width:880px){.hud{grid-template-columns:1.35fr 1fr}}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:28px;backdrop-filter:blur(8px)}
.water{position:relative;overflow:hidden;padding:22px;min-height:190px}
.water .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B9BCF4}
.water h2{margin:6px 0 2px;font-size:30px;line-height:1.1;font-weight:800;max-width:70%}
.water h2 b{color:var(--gold)}
.water p{margin:6px 0 0;color:#D6D8F5;font-size:13.5px;line-height:1.5;max-width:64%}
.water .jouro{position:absolute;right:18px;top:22px;height:104px;animation:pour 2.6s ease-in-out infinite;transform-origin:70% 70%}
@keyframes pour{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-14deg)}}
.drop{position:absolute;width:5px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8FD3FF;opacity:0;animation:drip 2.6s linear infinite}
@keyframes drip{0%,40%{opacity:0;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(46px)}}
.go{margin-top:16px;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:linear-gradient(135deg,#FFD66B,#FF9E5E);color:#3A2410;font-weight:800;font-size:15.5px;padding:14px 22px;cursor:pointer;box-shadow:0 14px 30px -10px rgba(255,158,94,.8);transition:transform .15s}
.go:hover{transform:translateY(-2px)}.go:disabled{opacity:.5;cursor:default;transform:none}
.cd{display:flex;width:max-content;max-width:100%;align-items:center;gap:8px;margin-top:12px;background:rgba(0,0,0,.25);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.stat{background:rgba(255,255,255,.06);border-radius:20px;padding:12px}
.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#B9BCF4}
.stat b{display:block;font-size:24px;margin-top:2px}
.npd{grid-column:1/-1;background:rgba(255,255,255,.06);border-radius:20px;padding:12px}
.npd .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.npd button{border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);color:#fff}
.npd button.on{background:var(--gold);color:#3A2410}
.npd p{margin:8px 0 0;font-size:12px;color:#D6D8F5;line-height:1.5}
/* ===== các tầng mây (6 bậc) ===== */
.garden{position:relative;margin-top:22px;padding-left:52px}
.vine{position:absolute;left:14px;top:10px;bottom:30px;width:16px;border-radius:99px;background:linear-gradient(90deg,#2E7D32,#66BB6A 60%,#2E7D32)}
.vine i{position:absolute;width:26px;height:16px;border-radius:0 99px 0 99px;background:#66BB6A;left:12px;animation:leaf 3.4s ease-in-out infinite;transform-origin:0 50%}
.vine i:nth-child(even){left:-22px;border-radius:99px 0 99px 0;transform-origin:100% 50%}
@keyframes leaf{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.tier{position:relative;margin-bottom:26px;cursor:pointer}
.tier .head{display:flex;align-items:center;gap:10px;margin:0 0 6px 6px}
.tier .head b{font-size:15px}.tier .head small{color:#B9BCF4;font-size:12px;font-weight:700}
.tier .cnt{margin-left:auto;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.tier .cnt.due{background:#FF6B81;color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,129,.6)}50%{box-shadow:0 0 0 8px rgba(255,107,129,0)}}
.cloud{position:relative;min-height:122px;border-radius:60px;background:linear-gradient(180deg,rgba(255,255,255,.98),#E8ECFF);box-shadow:0 14px 30px -12px rgba(0,0,0,.45),inset 0 -8px 0 rgba(180,190,240,.45);padding:12px 18px 18px;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none;transition:transform .2s}
.cloud::-webkit-scrollbar{display:none}
.tier:hover .cloud{transform:translateY(-3px)}
.cloud:before,.cloud:after{content:"";position:absolute;top:-22px;width:90px;height:60px;border-radius:999px;background:#fff;z-index:-1}
.cloud:before{left:40px}.cloud:after{right:70px;width:120px;top:-28px}
.tier{isolation:isolate}
.pl{position:relative;flex:none;width:64px;display:flex;flex-direction:column;align-items:center}
.pl img{height:76px;width:auto;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.12))}
.pl.s0 img{height:22px;margin-bottom:6px}.pl.s1 img{height:40px}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pl .pot{width:44px;height:18px;margin-top:-4px;background:linear-gradient(180deg,#D9774A,#B85A31);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);border-radius:3px}
.pl span{font-size:10.5px;font-weight:800;color:#3B3A78;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pl.dry span{color:#BE123C}
.more{flex:none;align-self:center;margin-left:6px;color:#4B4FC0;font-weight:800;font-size:13px;white-space:nowrap}
.emptycl{color:#7A7FB8;font-weight:700;font-size:13px;align-self:center;padding:0 8px}
.ground{position:relative;margin-top:10px;border-radius:30px;background:linear-gradient(180deg,#2E6B3A,#24552E);padding:18px;display:flex;align-items:flex-end;gap:14px;overflow:hidden;min-height:150px}
.ground .man{height:120px}
.ground .rabbit{position:absolute;right:16px;bottom:10px;height:110px;opacity:.95}
.ground .txt{flex:1;max-width:60%}.ground .txt b{font-size:16px}.ground .txt p{margin:4px 0 0;font-size:13px;color:#D8F0DA;line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
/* ===== bảng kho từ ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,12,30,.6);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet>div{background:#fff;color:var(--ink);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:28px}}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet .sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.wl{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wl img{height:38px;width:38px;object-fit:contain}
.wl .t{flex:1;min-width:0}.wl .t b{font-size:14.5px}.wl .t small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .due{font-size:11.5px;font-weight:800;color:var(--mut);white-space:nowrap}
.wl .x{border:0;background:none;color:#C9C9D6;cursor:pointer;width:30px;height:30px;border-radius:99px}.wl .x:hover{background:#FFE4E6;color:#E11D48}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px;outline:none;color:var(--ink);background:#fff;margin-bottom:8px}
.field:focus{border-color:var(--lilac)}
.lock{max-width:520px;margin:60px auto;text-align:center;padding:28px}
.lock img{height:150px}
#player{position:fixed;inset:0;z-index:2147483100;background:#E9E9EF;display:none}
#player.show{display:block}#player iframe{width:100%;height:100%;border:0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--ink);padding:11px 18px;border-radius:99px;font-weight:800;font-size:13.5px;z-index:2147483200;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.howto{padding:16px 18px;margin-top:14px;font-size:13px;line-height:1.6;color:#D6D8F5}
.howto b{color:#fff}
.howto summary{cursor:pointer;font-weight:800;color:#fff;font-size:14px}
@media(max-width:640px){.water h2{font-size:24px;max-width:100%}.water p{max-width:100%}.water .jouro{height:80px;opacity:.9;top:14px;bottom:auto}.garden{padding-left:34px}.vine{left:6px;width:12px}.top h1 small{display:none}.ground .txt{max-width:100%}.ground .rabbit{display:none}}
</style>
</head>
<body>
<div id="sky"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="index.html"><span class="logo"><img src="khoahoc/img/ira/garden/flower_seichou3.webp" alt=""></span><h1>Khu vườn từ vựng<small>Night IELTS · nghe – gõ – nhớ lâu</small></h1></a>
    <span class="sp"></span>
    <div class="seg" id="langSeg"><button data-l="en">English</button><button data-l="zh"><span class="zhf">中文</span></button></div>
    <button class="pill" id="bankBtn"><i class="fa-solid fa-seedling"></i><span class="lbl">Kho hạt giống</span></button>
  </div>
  <div id="main"></div>
</div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<div id="player"><iframe id="pFrame" title="Ôn từ vựng" allow="autoplay"></iframe></div>

<script src="luyengo/engine-en.js"></script>
<script src="luyengo/engine-zh.js"></script>
<script src="night-login.js"></script>
<script src="night-plan.js?v=20261110a"></script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import * as A from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
const app = getApps().length ? getApp() : initializeApp({ apiKey: 'AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8', authDomain: 'night-ielts-land.firebaseapp.com', projectId: 'night-ielts-land', storageBucket: 'night-ielts-land.firebasestorage.app', messagingSenderId: '408519436407', appId: '1:408519436407:web:a9f0b9ba23368b54427e72' });
const auth = A.getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMG = 'khoahoc/img/ira/garden/';
const DAY = 864e5;

/* ================== CƠ CHẾ SPACED REPETITION ==================
   b = bậc của từ: 0 hạt giống (chưa học) · 1 mầm · 2 cây non · 3 nụ · 4 hoa · 5 vườn hoa (đã thuộc)
   Ôn đúng hạn -> lên bậc, khoảng nghỉ giãn dần: 1 → 3 → 7 → 14 → 30 ngày.
   Kiểu luyện (active recall khó dần): bậc 0–1 nghe + nhìn nghĩa → gõ · bậc 2–3 CHỈ nhìn nghĩa, tự nhớ → gõ (loa = gợi ý)
   · bậc 4–5 nghe cả câu → chép lại cả câu. */
const GAP = [0, 1, 3, 7, 14, 30];
const STAGE = [
  { n: 'Hạt giống', d: 'Từ mới, chưa gieo', img: 'flower_seichou1' },
  { n: 'Mầm', d: 'Ôn lại sau 1 ngày', img: 'flower_seichou2' },
  { n: 'Cây non', d: 'Sau 3 ngày · tự nhớ từ nghĩa', img: 'flower_seichou4' },
  { n: 'Nụ', d: 'Sau 7 ngày · tự nhớ từ nghĩa', img: 'flower_seichou5' },
  { n: 'Hoa', d: 'Sau 14 ngày · chép cả câu', img: 'flower_seichou7' },
  { n: 'Vườn hoa', d: 'Đã thuộc · gặp lại sau 30 ngày', img: 'flower_seichou8' }
];
const WILT = 'flower_seichou9';
const NPD = [10, 20, 30, 50];
const today = () => { const d = new Date(Date.now() - 3 * 36e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }; /* ngày mới tính từ 3h sáng */
const dueAt = gapDays => { const d = new Date(Date.now() + gapDays * DAY); d.setHours(3, 0, 0, 0); return d.getTime(); };

const S = { user: null, role: 'guest', ok: false, lang: 'en', data: null, dirty: false, session: null };
try { S.lang = localStorage.getItem('vuon-lang') === 'zh' ? 'zh' : 'en'; } catch (e) {}

function blank() { return { w: {}, set: { npd: 20 }, day: { d: '', nw: 0, rv: 0 }, streak: { n: 0, last: '' }, sync: 0 }; }
const words = () => Object.entries(S.data.w).map(([id, x]) => Object.assign({ id }, x)).filter(x => (x.l || 'en') === S.lang);
const isDue = x => x.b >= 1 && x.d <= Date.now();
const isDry = x => x.b >= 1 && x.d < Date.now() - DAY; /* quá hạn > 1 ngày: cây héo */
function idOf(t, l) { let h = 0; const s = (l || 'en') + ':' + String(t).toLowerCase().trim(); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'w' + (h >>> 0).toString(36); }
function addWord(o) {
  const t = String(o.t || '').trim(); if (!t) return false;
  const l = o.l || 'en', id = idOf(t, l);
  if (S.data.w[id]) { const x = S.data.w[id]; if (!x.s && o.s) { x.s = o.s; x.sv = o.sv || x.sv; S.dirty = true; } return false; }
  S.data.w[id] = { t, m: String(o.m || '').trim(), s: String(o.s || '').trim(), sv: String(o.sv || '').trim(), l, py: o.py || '', spy: o.spy || '', b: 0, d: 0, a: Date.now(), r: 0, x: 0, src: (o.src || '').slice(0, 60) };
  S.dirty = true; return true;
}

/* ---------- lưu: 1 file / học sinh ---------- */
let saveT = 0;
function save(now) {
  if (!S.user || !S.data) return;
  clearTimeout(saveT);
  const go = () => { S.dirty = false; setDoc(doc(db, 'srs', S.user.uid), Object.assign({ uid: S.user.uid, at: Date.now() }, S.data)).catch(e => toast('Chưa lưu được vườn: ' + e.message)); };
  if (now) go(); else saveT = setTimeout(go, 1200);
}
window.addEventListener('pagehide', () => { if (S.dirty) save(true); });

/* ---------- gom từ từ Sổ từ vựng (đề Reading/Listening) ---------- */
async function importNotebook(silent) {
  let n = 0;
  const ctx = (() => { try { return JSON.parse(localStorage.getItem('nv-word-ctx') || '{}'); } catch (e) { return {}; } })();
  try {
    const snap = await getDocs(query(collection(db, 'savedWords'), where('studentId', '==', S.user.uid)));
    snap.forEach(d => { const x = d.data(); if (addWord({ t: x.word, m: x.meaning, s: ctx[String(x.word || '').toLowerCase()] || '', l: /[一-鿿]/.test(x.word) ? 'zh' : 'en', src: x.sourceTitle })) n++; });
  } catch (e) {}
  try { (JSON.parse(localStorage.getItem('ielts_vocab_book') || '[]')).forEach(x => { if (addWord({ t: x.en, m: x.vi, s: ctx[String(x.en || '').toLowerCase()] || '', src: 'Sổ từ vựng' })) n++; }); } catch (e) {}
  /* từ "Trồng vào vườn" từ trang Nghe – Gõ / khoá học (để chờ trong máy nếu chưa mở vườn) */
  try { const q = JSON.parse(localStorage.getItem('vuon-inbox') || '[]'); q.forEach(o => { if (addWord(o)) n++; }); localStorage.removeItem('vuon-inbox'); } catch (e) {}
  if (n) { save(); if (!silent) toast(`Đã gieo ${n} hạt giống mới`); }
  else if (!silent) toast('Không có từ mới trong Sổ từ vựng');
  render();
}

/* ---------- vẽ khu vườn ---------- */
function sky() {
  const sk = $('#sky'); if (sk.dataset.ok) return; sk.dataset.ok = 1;
  let h = '';
  for (let i = 0; i < 90; i++) h += `<span class="star" style="left:${Math.random() * 100}%;top:${Math.random() * 70}%;animation-delay:${(Math.random() * 3).toFixed(2)}s;opacity:${(.3 + Math.random() * .7).toFixed(2)}"></span>`;
  for (let i = 0; i < 14; i++) h += `<span class="fly" style="left:${Math.random() * 100}%;top:${30 + Math.random() * 65}%;animation-delay:${(Math.random() * 9).toFixed(2)}s;animation-duration:${(7 + Math.random() * 6).toFixed(1)}s"></span>`;
  sk.insertAdjacentHTML('beforeend', h);
}
let cdT = 0;
function render() {
  const m = $('#main');
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
  if (!S.user) { m.innerHTML = `<div class="glass lock"><img src="${IMG}gardening_man.webp" alt=""><h2>Khu vườn từ vựng</h2><p style="color:#D6D8F5">Đăng nhập để mở khu vườn của bạn.</p><button class="go" id="login">Đăng nhập</button></div>`; $('#login').onclick = () => NightLogin.open({ auth, authM: A }); return; }
  if (!S.ok) { m.innerHTML = `<div class="glass lock"><img src="${IMG}tsukimi_jugoya_usagi.webp" alt=""><h2>Khu vườn dành cho Pro · Astra · Học sinh</h2><p style="color:#D6D8F5;line-height:1.6">Mỗi từ bạn lưu sẽ thành một hạt giống. Ôn đúng "thời điểm vàng" bằng cách nghe – gõ, cây sẽ lớn dần thành hoa — và từ đó nằm lại trong trí nhớ rất lâu.</p><button class="go" id="up">Nâng cấp để mở vườn</button></div>`; $('#up').onclick = () => window.NightPlan && NightPlan.openUpgrade('', 'pro'); return; }
  if (!S.data) { m.innerHTML = '<div class="glass lock">Đang mở khu vườn…</div>'; return; }
  const W = words(), due = W.filter(isDue).sort((a, b) => a.d - b.d), seeds = W.filter(x => x.b === 0);
  const d = S.data.day.d === today() ? S.data.day : { nw: 0, rv: 0 }, npd = S.data.set.npd || 20;
  const newLeft = Math.max(0, Math.min(npd - d.nw, seeds.length));
  const total = due.length + newLeft;
  const next = W.filter(x => x.b >= 1 && x.d > Date.now()).sort((a, b) => a.d - b.d)[0];
  const mastered = W.filter(x => x.b === 5).length;
  m.innerHTML = `
  <div class="hud">
    <div class="glass water">
      <div class="k">Hôm nay · ${new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric' })}</div>
      <h2>${total ? `<b>${due.length}</b> cây cần tưới${newLeft ? ` · <b>${newLeft}</b> hạt mới` : ''}` : W.length ? 'Vườn đã tưới xong!' : 'Vườn còn trống'}</h2>
      <p>${total ? 'Mỗi cây là một từ — nghe rồi gõ lại đúng là cây được tưới và lớn thêm một bậc. Đúng "thời điểm vàng" nên nhớ rất lâu.' : W.length ? 'Cây đang nghỉ để lớn. Quay lại đúng giờ vàng bên dưới nhé — ôn sớm quá cũng không giúp nhớ lâu hơn.' : 'Lưu từ khi làm đề Reading/Listening, hoặc bấm "Kho hạt giống" để thêm từ, rồi quay lại tưới vườn.'}</p>
      ${total ? `<button class="go" id="start"><img src="${IMG}gardening_jouro.webp" alt="" style="height:24px"> Tưới vườn ngay · ${total} từ</button>` : ''}
      ${next ? `<div class="cd"><i class="fa-regular fa-hourglass-half"></i><span id="cd" data-t="${next.d}"></span></div>` : ''}
      <img class="jouro" src="${IMG}gardening_jouro.webp" alt="">
      <span class="drop" style="right:112px;top:96px"></span><span class="drop" style="right:104px;top:90px;animation-delay:.3s"></span><span class="drop" style="right:120px;top:102px;animation-delay:.6s"></span>
    </div>
    <div class="glass stats">
      <div class="stat"><small>Chuỗi ngày</small><b style="color:var(--gold)">${S.data.streak.n || 0}</b></div>
      <div class="stat"><small>Trong vườn</small><b>${W.length}</b></div>
      <div class="stat"><small>Đã thuộc</small><b style="color:#9BE7A1">${mastered}</b></div>
      <div class="npd"><b style="font-size:13.5px">Hạt mới mỗi ngày</b>
        <div class="row">${NPD.map(n => `<button data-npd="${n}" class="${npd === n ? 'on' : ''}">${n} từ</button>`).join('')}</div>
        <p>${npd < 30 ? 'Mẹo: học sinh chăm thường chọn <b>30–50 từ/ngày</b> — chọn nhiều lên để vườn lớn nhanh hơn! ' : ''}Số hạt mới chỉ lấy từ kho của bạn${seeds.length < npd ? ` (kho đang còn <b>${seeds.length}</b> hạt — thêm từ để đủ ${npd})` : ''}.</p>
      </div>
    </div>
  </div>
  <div class="garden">
    <div class="vine">${Array.from({ length: 10 }, (_, i) => `<i style="top:${i * 10 + 3}%;animation-delay:${(i * .3).toFixed(1)}s"></i>`).join('')}</div>
    ${[5, 4, 3, 2, 1, 0].map(b => tier(b, W)).join('')}
    <div class="ground"><img class="man" src="${IMG}gardening_man.webp" alt=""><div class="txt"><b>Bí quyết của khu vườn</b><p>Não quên rất nhanh sau khi học. Mỗi lần bạn <b>tự nhớ lại</b> đúng lúc sắp quên, trí nhớ được "tưới" và lần sau quên chậm hơn — nên khoảng nghỉ giãn dần 1 → 3 → 7 → 14 → 30 ngày.</p></div><img class="rabbit" src="${IMG}tsukimi_jugoya_usagi.webp" alt=""></div>
  </div>`;
  const st = $('#start'); if (st) st.onclick = startSession;
  m.querySelectorAll('[data-npd]').forEach(b => b.onclick = () => { S.data.set.npd = +b.dataset.npd; save(); render(); });
  m.querySelectorAll('[data-tier]').forEach(b => b.onclick = () => openBank(+b.dataset.tier));
  clearInterval(cdT); tick(); cdT = setInterval(tick, 1000);
}
function tier(b, W) {
  const L = W.filter(x => x.b === b).sort((a, c) => (isDry(c) - isDry(a)) || (a.d - c.d)), dueN = L.filter(isDue).length, MAX = 14;
  const plants = L.slice(0, MAX).map((x, i) => `<div class="pl s${b}${isDry(x) ? ' dry' : ''}" title="${esc(x.t)} — ${esc(x.m)}"><img src="${IMG}${isDry(x) ? WILT : STAGE[b].img}.webp" alt="" style="animation-delay:${(i * .23 % 3).toFixed(2)}s"><div class="pot"></div><span class="${x.l === 'zh' ? 'zhf' : ''}">${esc(x.t)}</span></div>`).join('');
  return `<div class="tier" data-tier="${b}"><div class="head"><img src="${IMG}${STAGE[b].img}.webp" alt="" style="height:26px"><b>${STAGE[b].n}</b><small>${STAGE[b].d}</small><span class="cnt${dueN ? ' due' : ''}">${dueN ? dueN + ' cần tưới · ' : ''}${L.length}</span></div>
    <div class="cloud">${plants || `<span class="emptycl">${b === 0 ? 'Chưa có hạt giống — bấm Kho hạt giống để gieo' : 'Chưa có cây nào ở bậc này'}</span>`}${L.length > MAX ? `<span class="more">+${L.length - MAX} cây</span>` : ''}</div></div>`;
}
function tick() {
  const el = $('#cd'); if (!el) return;
  const ms = +el.dataset.t - Date.now();
  if (ms <= 0) { render(); return; }
  const h = Math.floor(ms / 36e5), mi = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  el.textContent = `Lứa cây tiếp theo cần tưới sau ${h >= 24 ? Math.floor(h / 24) + ' ngày ' + (h % 24) + 'g' : String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0') + ':' + String(s).padStart(2, '0')}`;
}

/* ---------- kho hạt giống ---------- */
function openBank(b) {
  const W = words(), L = (b == null ? W : W.filter(x => x.b === b)).sort((a, c) => a.b - c.b || a.d - c.d);
  const zh = S.lang === 'zh';
  $('#sheetBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px"><h3 style="flex:1">${b == null ? 'Kho hạt giống' : STAGE[b].n} · ${L.length} từ</h3><button class="btn" style="background:var(--panel)" id="closeS"><i class="fa-solid fa-xmark"></i></button></div>
    <p class="sub">${b == null ? 'Thêm từ để gieo hạt. Từ bạn lưu khi làm đề Reading/Listening tự vào đây.' : STAGE[b].d}</p>
    ${b == null ? `<div style="background:var(--panel);border-radius:18px;padding:12px;margin-bottom:12px">
      <input class="field ${zh ? 'zhf' : ''}" id="nt" placeholder="${zh ? 'Từ (chữ Hán), VD: 起床' : 'Từ / cụm từ, VD: take part in'}">
      ${zh ? '<input class="field" id="npy" placeholder="Pinyin có dấu, mỗi chữ 1 âm tiết: qǐ chuáng">' : ''}
      <input class="field" id="nm" placeholder="Nghĩa tiếng Việt">
      <input class="field ${zh ? 'zhf' : ''}" id="ns" placeholder="Câu ví dụ (không bắt buộc)">
      ${zh ? '<input class="field" id="nspy" placeholder="Pinyin của câu (nếu có câu)">' : ''}
      <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" style="background:var(--ink);color:#fff" id="addW"><i class="fa-solid fa-seedling"></i> Gieo hạt</button><button class="btn" style="background:var(--lilac-l);color:#4B4FC0" id="imp"><i class="fa-solid fa-book"></i> Lấy từ Sổ từ vựng</button></div></div>` : ''}
    ${L.map(x => `<div class="wl"><img src="${IMG}${isDry(x) ? WILT : STAGE[x.b].img}.webp" alt=""><div class="t"><b class="${x.l === 'zh' ? 'zhf' : ''}">${esc(x.t)}</b>${x.py ? ` <small style="display:inline;color:#4B4FC0">${esc(x.py)}</small>` : ''}<small>${esc(x.m)}${x.s && x.s !== x.t ? ' · ' + esc(x.s) : ''}</small></div><span class="due">${x.b === 0 ? 'chưa gieo' : isDue(x) ? '<span style="color:#E11D48">cần tưới</span>' : 'tưới ' + new Date(x.d).toLocaleDateString('vi-VN')}</span><button class="x" data-del="${x.id}" title="Nhổ cây"><i class="fa-solid fa-trash"></i></button></div>`).join('') || '<p class="sub" style="text-align:center;padding:20px">Chưa có từ nào.</p>'}`;
  $('#sheet').classList.add('show');
  $('#closeS').onclick = () => $('#sheet').classList.remove('show');
  const add = $('#addW');
  if (add) add.onclick = () => {
    const t = $('#nt').value.trim(), m = $('#nm').value.trim(), s = $('#ns').value.trim();
    if (!t || !m) return toast('Nhập từ và nghĩa nhé');
    const o = { t, m, s, l: S.lang, src: 'Tự thêm' };
    if (zh) { const py = NVCourse.segPinyin(t, $('#npy').value), spy = s ? NVCourse.segPinyin(s, $('#nspy').value) : py; if (!py || (s && !spy)) return toast('Pinyin chưa khớp số chữ Hán'); o.py = py; o.spy = spy; }
    if (addWord(o)) { save(); toast('Đã gieo hạt "' + t + '"'); openBank(null); render(); } else toast('Từ này đã có trong vườn');
  };
  const imp = $('#imp'); if (imp) imp.onclick = async () => { await importNotebook(false); openBank(null); };
  $('#sheetBody').querySelectorAll('[data-del]').forEach(x => x.onclick = () => { if (!confirm('Nhổ cây này khỏi vườn?')) return; delete S.data.w[x.dataset.del]; save(); openBank(b); render(); });
}
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('show'); };
$('#bankBtn').onclick = () => S.ok && S.data ? openBank(null) : null;
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { S.lang = b.dataset.l; try { localStorage.setItem('vuon-lang', S.lang); } catch (e) {} render(); });

/* ---------- 1 buổi tưới vườn ---------- */
function toItem(x) {
  if (x.l === 'zh') { const s = x.s && x.spy ? x.s : x.t; return { hanzi: x.t, pinyinRaw: x.py, meaningVi: x.m, sentenceHanzi: s, sentencePinyinRaw: x.s && x.spy ? x.spy : x.py, sentenceVi: x.sv || x.m }; }
  return { phrase: x.t, meaningVi: x.m, sentence: x.s || x.t, sentenceVi: x.sv || x.m };
}
function startSession() {
  const W = words(), due = W.filter(isDue).sort((a, b) => a.d - b.d).slice(0, 80);
  const d = S.data.day.d === today() ? S.data.day : (S.data.day = { d: today(), nw: 0, rv: 0 });
  const npd = S.data.set.npd || 20, seeds = W.filter(x => x.b === 0).sort((a, b) => a.a - b.a).slice(0, Math.max(0, npd - d.nw));
  if (S.lang === 'zh') { const bad = seeds.concat(due).filter(x => !x.py); if (bad.length) { bad.forEach(x => { const r = NVCourse.segPinyin(x.t, x.py); if (!r) delete S.data.w[x.id]; }); } }
  const list = due.concat(seeds).filter(x => S.data.w[x.id]);
  if (!list.length) return toast('Hôm nay không còn cây nào cần tưới');
  /* vòng 1: gõ từ (bậc 0–3, và cây bậc 4–5 chưa có câu) · vòng 2: chép cả câu (bậc 4–5 có câu) */
  const sentence = x => x.b >= 4 && x.s && x.s !== x.t && (x.l !== 'zh' || x.spy);
  const r1 = list.filter(x => !sentence(x)), r2 = list.filter(sentence);
  S.session = { rounds: [{ type: 'phrase', items: r1 }, { type: 'sentence', items: r2 }].filter(r => r.items.length), k: 0, moved: { up: 0, keep: 0, down: 0 } };
  playRound();
}
function playRound() {
  const se = S.session, R = se.rounds[se.k].items, type = se.rounds[se.k].type;
  se.type = type; se.cur = R;
  const eng = S.lang === 'zh' ? window.LTG_ZH : window.LTG_EN;
  let html = eng.build('Khu vườn · ' + (type === 'sentence' ? 'Chép cả câu' : 'Gõ từ'), R.map(toItem), S.lang === 'zh' ? 'red' : 'green');
  html = html.replace(/<script src="\/night-app\.js"[^>]*><\/script>/, '');
  const base = new URL('./', location.href).href;
  const cfg = { lang: S.lang, ac: '#2E9E5B', img: base + 'khoahoc/img/ira/', srs: { type, mf: R.map(x => type === 'phrase' && (x.b === 2 || x.b === 3)) } };
  html = html.replace(/<\/body>\s*<\/html>\s*$/, `<script>window.NV_SKIN=${JSON.stringify(cfg)}<\/script><script src="${base}luyengo/skin.js"><\/script><script src="${base}luyengo/srs-skin.js?v=1"><\/script></body></html>`);
  $('#pFrame').srcdoc = html;
  $('#player').classList.add('show'); document.body.style.overflow = 'hidden';
}
function closePlayer() { $('#player').classList.remove('show'); $('#pFrame').srcdoc = ''; document.body.style.overflow = ''; }
window.addEventListener('message', e => {
  const m = e.data || {}, se = S.session;
  if (m === 'nv-close') { closePlayer(); finishSession(); return; }
  if (!se) return;
  if (m.nvSrs) {
    const x = se.cur[m.nvSrs.i]; if (!x || !S.data.w[x.id]) return;
    const w = S.data.w[x.id], g = m.nvSrs.g, wasNew = w.b === 0;
    if (g === 'perfect') { w.b = Math.min(5, Math.max(1, w.b + 1)); se.moved.up++; }
    else if (g === 'ok') { w.b = Math.max(1, w.b); se.moved.keep++; }
    else { if (w.b > 1) w.x = (w.x || 0) + 1; w.b = 1; se.moved.down++; }
    if (wasNew && g !== 'fail') w.b = 1; /* gieo hạt: lần đầu chỉ lên Mầm */
    w.d = dueAt(g === 'fail' ? 1 : GAP[w.b]); w.r = (w.r || 0) + 1;
    const d = S.data.day.d === today() ? S.data.day : (S.data.day = { d: today(), nw: 0, rv: 0 });
    if (wasNew) d.nw++; else d.rv++;
    const st = S.data.streak; if (st.last !== today()) { const y = new Date(Date.now() - 3 * 36e5 - DAY); const yd = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate(); st.n = st.last === yd ? (st.n || 0) + 1 : 1; st.last = today(); }
    save();
  }
  if (m.nvSrsDone) {
    se.k++;
    if (se.k < se.rounds.length) playRound(); else { closePlayer(); finishSession(); }
  }
});
function finishSession() {
  const se = S.session; if (!se) return;
  S.session = null; save(true); render();
  if (se.moved.up + se.moved.keep + se.moved.down) toast(`Đã tưới: ${se.moved.up} cây lớn thêm · ${se.moved.keep} giữ nguyên · ${se.moved.down} trồng lại`);
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }

/* ---------- đăng nhập & quyền ---------- */
A.onAuthStateChanged(auth, async u => {
  S.user = u || null; S.ok = false; S.data = null;
  if (u) {
    try {
      const s = await getDoc(doc(db, 'users', u.uid)), x = s.exists() ? s.data() : {}, r = x.role || 'user';
      S.role = r; S.ok = r === 'admin' || r === 'student' || (r === 'pro' && Number(x.proUntil) > Date.now());
    } catch (e) {}
    if (S.ok) {
      try { const s = await getDoc(doc(db, 'srs', u.uid)); S.data = s.exists() ? Object.assign(blank(), s.data()) : blank(); } catch (e) { S.data = blank(); }
      render(); importNotebook(true);
    }
  }
  render();
});
sky(); render();
</script>
<script src="luyengo/from-course.js"></script>
<script src="night-app.js" defer></script>
</body>
</html>
