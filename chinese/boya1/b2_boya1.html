// ============================================================================
// 3. MỞ KHÓA AUDIO TRÊN IOS / IPAD: Chạm để unlock WebAudio & Speech
// ============================================================================
let audioUnlocked = false;
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance(' ');
        dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
    }
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function save(){localStorage.setItem('boya03_mastered',JSON.stringify(state.mastered));localStorage.setItem('boya03_typed',JSON.stringify(state.typed))}

function chineseVoices(){return voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/Chinese|Mandarin|普通话|中文/i.test(v.name))}

// ============================================================================
// HỆ THỐNG ƯU TIÊN GIỌNG ĐỌC BẮT BUỘC "Google 普通话" HOẶC CHUẨN TQ
// ============================================================================
function bestVoice(){
    const vs=chineseVoices();
    // Bắt buộc ưu tiên giọng Google có chữ "普通话" như trong ảnh
    const exact = vs.find(v => v.name.includes('Google 普通话') || v.name.includes('Google Mandarin'));
    if(exact) return exact;
    
    // Fallback: Tìm các giọng chuẩn khác
    const keys=['Ting-Ting','Mei-Jia','Sin-ji','Eddy','Microsoft Yunxi','Microsoft Xiaoxiao','Microsoft Yunyang'];
    for(const k of keys){
        const v=vs.find(x=>x.name.includes(k));
        if(v) return v;
    }
    // Cuối cùng lấy bất kỳ giọng Trung Quốc nào
    return vs.find(v=>/zh-CN|zh_CN/i.test(v.lang))||vs[0];
}

function loadVoices(){
    voices=speechSynthesis.getVoices()||[];
    const s=document.getElementById('voiceSelect');
    if(!s)return;
    
    const vs=chineseVoices();
    s.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} · ${v.lang}</option>`).join(''):'<option>Giọng mặc định hệ thống</option>';
    
    // 1. Moi tên giọng đã được lưu trong bộ nhớ trình duyệt ra (nếu có)
    const savedVoice = localStorage.getItem('global_saved_voice');
    
    // 2. Ưu tiên gán: Giọng đã lưu -> Giọng Google mặc định -> Các giọng khác
    const b = vs.find(v=>v.name===savedVoice) || bestVoice();
    if(b) s.value=b.name;

    // 3. Mỗi khi bạn chọn giọng mới ở menu, lưu vĩnh viễn nó lại
    s.onchange = function() {
        localStorage.setItem('global_saved_voice', this.value);
    };
}

function speak(text,rate=1){
    if(!('speechSynthesis'in window))return;
    const playUtterance = () => {
        const u=new SpeechSynthesisUtterance(text);
        u.lang='zh-CN'; u.rate=rate; u.pitch=1;
        const s=document.getElementById('voiceSelect'),v=voices.find(x=>x.name===s?.value)||bestVoice();
        if(v) u.voice=v;
        speechSynthesis.speak(u);
    };

    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        setTimeout(playUtterance, 100); 
    } else {
        playUtterance();
    }
}

function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,d=.06,vol=.03){
    try{
        const c=ac(),o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+d);
    }catch(e){}
}
function completeSound(){[523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80))}
function fireworks(){const r=document.getElementById('practiceBurst')||document.getElementById('fireworks');r.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,rad=80+Math.random()*180;s.className='spark';s.style.left=(42+Math.random()*16)+'%';s.style.top=(32+Math.random()*24)+'%';s.style.background=['#0284c7','#10b981','#f59e0b','#8b5cf6','#ec4899'][i%5];s.style.setProperty('--dx',Math.cos(a)*rad+'px');s.style.setProperty('--dy',Math.sin(a)*rad+'px');r.appendChild(s)}setTimeout(()=>r.innerHTML='',1200)}

function normalizePinyin(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}

function practiceList(){return practiceItems.filter(i=>i.type==='vocab')}
function sentenceList(){return practiceItems.filter(i=>i.type==='sentence' && i.pinyin && i.pinyin.trim().length > 0)}
function current(){const l=state.practiceType==='vocab'?practiceList():sentenceList();return l[state.practiceIndex]||l[0]}
function getTargetPinyin(c){return normalizePinyin(c.pinyin)}

function keyTick(index){beep(620+Math.min(index,12)*24,.055,.022)}

// ============================================================================
// 4. LUYỆN GÕ (Nghe -> Nhập Pinyin -> Biến Hán Tự)
// ============================================================================
function typeInput(v){
    if(state.completed) return;
    
    state.input=v;
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(v);

    if(typedStr.length > lastTypedLength){
        keyTick(typedStr.length);
    }
    lastTypedLength = typedStr.length;

    // Check completion
    if(targetStr.startsWith(typedStr)){
        if(typedStr.length === targetStr.length){
            state.completed = true;
            state.revealed = true;
            state.input = c.chinese; 
            state.typed[c.chinese] = (state.typed[c.chinese]||0)+1;
            save();
            completeSound();
            setTimeout(fireworks,60);
        }
    }
    updateTyping();
}

function updateTyping(){
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(state.input);
    const totalLetters=targetStr.length;
    let correctCount=0;
    
    if(!state.completed){
        for(let i=0;i<typedStr.length;i++){
            if(typedStr[i]===targetStr[i]) correctCount++;
            else break;
        }
    }else{
        correctCount=totalLetters;
    }

    const top=document.getElementById('letterProgress');
    if(top){
        top.innerHTML='';
        for(let i=0;i<totalLetters;i++){
            const d=document.createElement('span');
            d.className='letter-segment '+(i<correctCount?'filled':'');
            top.appendChild(d);
        }
    }

    const wrapper=document.getElementById('inputWrapper');
    if(wrapper){
        if(state.completed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-400 rounded-2xl overflow-hidden transition shadow-sm text-emerald-800";
        }else if(state.revealed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-rose-50 border-2 border-rose-400 rounded-2xl overflow-hidden transition shadow-sm";
        }else{
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm";
        }
    }

    const inp=document.getElementById('typingInput');
    if(inp){
        inp.value=state.input;
        inp.disabled=state.completed || state.revealed;
    }
    
    const fb=document.getElementById('typingFeedback');
    if(fb){
        if(state.completed){
            fb.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành xuất sắc!</span>';
        } else if(state.revealed){
            fb.innerHTML=`<span class="text-amber-700 font-bold">Đáp án là: <b>${c.chinese}</b></span>`;
        } else {
            fb.innerHTML=`<span class="text-slate-400 font-bold">Gõ Pinyin (không dấu): ${correctCount} / ${totalLetters} ký tự</span>`;
        }
    }

    const ans=document.getElementById('answerPanel');
    if(ans){
        ans.innerHTML=state.revealed?`
            <div class="text-center fade">
                <div class="cn text-4xl sm:text-5xl font-extrabold text-slate-900">${esc(c.chinese)}</div>
                <div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.pinyin)}</div>
                ${c.type==='vocab'?`
                    <div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div>
                    <div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.wordClass)}</div>
                    <div class="text-sm font-bold text-slate-700 mt-3 border-t border-slate-100 pt-3">${esc(c.meaningVi)}<span class="hidden"></span></div>
                `:`
                    <div class="text-sm font-bold text-slate-700 mt-4 leading-6 border-t border-slate-100 pt-4">${esc(c.meaningVi)}<span class="hidden"></span></div>
                `}
            </div>
        `:`<div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300"><div class="text-7xl font-bold mb-2">?</div><div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div></div>`
    }
}

function setTab(t){state.tab=t;render()}

function changeType(t){state.practiceType=t;state.practiceIndex=0;reset()}
function next(){const l=state.practiceType==='vocab'?practiceList():sentenceList();state.practiceIndex=(state.practiceIndex+1)%l.length;reset()}
function prev(){const l=state.practiceType==='vocab'?practiceList():sentenceList();state.practiceIndex=(state.practiceIndex-1+l.length)%l.length;reset()}
function reveal(){state.revealed=true;state.completed=false;state.input=current().chinese;updateTyping()}
function reset(){
    state.input='';state.revealed=false;state.completed=false;lastTypedLength=0;lastTypedNorm='';

function selectChar(i){state.selectedChar=i;state.charMode='write';render();setTimeout(initWriter,80)}
function charMode(m){state.charMode=m;render();if(m==='write')setTimeout(initWriter,80)}
function toggleMastered(){const c=lessonData.characters[state.selectedChar];const i=state.mastered.indexOf(c.char);if(i>=0)state.mastered.splice(i,1);else state.mastered.push(c.char);save();render()}

function initWriter(){
    const el=document.getElementById('writerTarget');
    if(!el||typeof HanziWriter==='undefined') return;
    el.innerHTML=''; 
    const c=lessonData.characters[state.selectedChar];
    
    try {
        writer=HanziWriter.create('writerTarget',c.char,{
            width:250,height:250,padding:18,showOutline:true,showCharacter:false,
            strokeAnimationSpeed:1.2,delayBetweenStrokes:140,drawingFadeDuration:180,
            highlightOnComplete:true,strokeColor:'#0f172a',outlineColor:'#cbd5e1',
            drawingColor:'#0284c7',highlightColor:'#10b981',showHintAfterMisses:2
        });
    } catch(e) {
        console.error("HanziWriter Error:", e);
        el.innerHTML = `<div class="text-sm text-amber-600 font-bold p-4">Ký tự này hiện chưa hỗ trợ mô phỏng nét viết.</div>`;
    }
}

function animateChar(){if(writer)writer.animateCharacter()}
function quizChar(){
    if(!writer)return;
    const r=document.getElementById('writeResult');
    if(r) r.innerHTML='<span class="text-sky-700 font-bold">Bắt đầu! Viết theo thứ tự nét.</span>';
    writer.quiz({
        showHintAfterMisses:2,
        highlightOnComplete:true,
        onMistake:()=>{if(r)r.innerHTML='<span class="text-amber-700 font-bold">Chưa đúng nét — thử lại.</span>'},
        onComplete:()=>{
            if(r)r.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành chữ!</span>';
            const c=lessonData.characters[state.selectedChar];
            if(!state.mastered.includes(c.char)){state.mastered.push(c.char);save()}
        }
    });
}

function vocabularyView(){const q=state.vocabFilter.toLowerCase(),list=lessonData.vocabulary.filter(v=>v.zh.includes(state.vocabFilter)||v.pinyin.toLowerCase().includes(q)||v.meaningVi.toLowerCase().includes(q)||v.hanViet.toLowerCase().includes(q));return`<div class="space-y-5 fade"><div class="flex flex-col md:flex-row md:items-end justify-between gap-3"><div><div class="text-[10px] font-extrabold tracking-widest text-sky-600 uppercase">${lessonData.vocabulary.length} ITEMS</div><h2 class="text-2xl font-extrabold mt-1">Từ vựng cốt lõi</h2><p class="text-sm text-slate-500 mt-1">Hán tự · Pinyin · Hán Việt · từ loại · nghĩa · câu mẫu.</p></div><input value="${esc(state.vocabFilter)}" oninput="state.vocabFilter=this.value;render()" placeholder="Tìm từ, pinyin, Hán Việt…" class="w-full md:w-72 px-4 py-3 rounded-2xl border border-slate-200 bg-white outline-none focus:border-sky-400 text-sm"></div><div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">${list.map(v=>`<article class="bg-white border border-slate-200 rounded-[25px] p-5 hover:-translate-y-0.5 hover:shadow-card transition"><div class="flex justify-between"><span class="text-[10px] font-extrabold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500">${esc(v.class)}</span><span class="text-[10px] text-slate-400">p.${v.sourcePage}</span></div><div class="text-center py-5"><div class="cn text-5xl font-extrabold">${esc(v.zh)}</div><div class="text-base font-extrabold text-sky-600 mt-2">${esc(v.pinyin)}</div><div class="text-[11px] font-extrabold text-emerald-600 tracking-wide mt-2">${esc(v.hanViet)}</div><div class="text-sm font-semibold text-slate-700 mt-1">${esc(v.meaningVi)}<span class="hidden"></span></div></div><div class="rounded-2xl bg-slate-50 p-4"><div class="text-[9px] font-extrabold tracking-widest text-slate-400 uppercase">Câu mẫu</div><div class="cn text-lg font-bold mt-2">${esc(v.example)}</div><div class="text-xs text-sky-700 mt-1">${esc(v.examplePinyin)}</div><div class="text-xs text-slate-500 mt-1">${esc(v.exampleVi)}<span class="hidden"></span></div><div class="flex gap-2 mt-3"><button onclick="speak('${esc(v.example)}')" class="flex-1 px-3 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center justify-center gap-1"><span class="w-4 h-4 inline-block">${icon.volume}</span> Nghe</button><button onclick="state.practiceType='vocab';state.practiceIndex=${lessonData.vocabulary.indexOf(v)};reset();setTab('practice');" class="flex-1 px-3 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-extrabold flex items-center justify-center gap-1"><span class="w-4 h-4 inline-block">${icon.keyboard}</span> Gõ</button></div></div></article>`).join('')}</div></div>`}

function charactersView(){const c=lessonData.characters[state.selectedChar];return`<div class="space-y-5 fade"><div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3"><div><div class="text-[10px] font-extrabold tracking-widest text-violetx uppercase">CHARACTER LAB</div><h2 class="text-2xl font-extrabold mt-1">Hán tự · Tập viết</h2><p class="text-sm text-slate-500 mt-1">Xem thứ tự nét và tự tay viết để nhớ chữ.</p></div><span class="px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 text-[10px] font-extrabold w-fit">LỤC THƯ = LỚP MỞ RỘNG</span></div><div class="flex gap-2 overflow-x-auto scrollbar pb-1">${lessonData.characters.map((x,i)=>`<button onclick="selectChar(${i})" class="shrink-0 px-4 py-2.5 rounded-2xl border ${i===state.selectedChar?'bg-slate-900 text-white border-slate-900':'bg-white border-slate-200 hover:border-sky-300'}"><span class="cn text-xl font-extrabold">${x.char}</span><span class="text-[10px] ml-2 opacity-70">${x.pinyin}</span></button>`).join('')}</div><div class="grid xl:grid-cols-[310px_1fr] gap-5"><aside class="bg-white border border-slate-200 rounded-[28px] p-6"><div class="flex justify-between"><span class="text-[10px] font-extrabold tracking-widest text-slate-400">SOURCE p.${c.sourcePage}</span><button onclick="toggleMastered()" class="text-[10px] font-extrabold px-2.5 py-1.5 rounded-lg ${state.mastered.includes(c.char)?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'}">${state.mastered.includes(c.char)?'✓ Mastered':'☆ Đánh dấu'}</button></div><div class="grid-paper rounded-[26px] aspect-square mt-5 flex items-center justify-center border border-slate-200"><div class="cn text-[110px] leading-none font-extrabold">${c.char}</div></div><div class="text-center mt-5"><div class="text-2xl font-extrabold">${c.pinyin} <span class="text-xs text-sky-600">(thanh ${c.tone})</span></div><div class="text-sm text-slate-500 mt-1">${c.meaningVi}<span class="hidden"></span></div></div><div class="grid grid-cols-2 gap-2 mt-5"><div class="bg-slate-50 rounded-2xl p-3"><div class="text-[9px] font-extrabold text-slate-400 uppercase">Hán Việt</div><div class="text-sm font-extrabold text-emerald-700 mt-1">${c.hanViet}</div></div><div class="bg-slate-50 rounded-2xl p-3"><div class="text-[9px] font-extrabold text-slate-400 uppercase">Số nét</div><div class="text-sm font-extrabold mt-1">${c.strokeCount}</div></div></div><div class="mt-2 bg-sky-50 rounded-2xl p-3"><div class="text-[9px] font-extrabold text-sky-600 uppercase">Loại chữ</div><div class="text-sm font-extrabold text-sky-800 mt-1">${c.formation}</div></div><div class="mt-2 bg-violet-50 rounded-2xl p-3"><div class="text-[9px] font-extrabold text-violet-600 uppercase">Bộ thủ tra cứu</div><div class="cn text-3xl font-extrabold text-violet-900 mt-1">${c.radical}</div></div></aside><section class="relative bg-white border border-slate-200 rounded-[28px] overflow-hidden"><div class="px-6 py-4 border-b border-slate-100 flex flex-wrap justify-between gap-3"><div class="flex p-1 rounded-xl bg-slate-100"><button onclick="charMode('write')" class="px-4 py-2 rounded-lg text-xs font-extrabold ${state.charMode==='write'?'bg-white shadow-sm text-sky-700':'text-slate-500'} flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.pen}</span>Tập viết</button><button onclick="charMode('structure')" class="px-4 py-2 rounded-lg text-xs font-extrabold ${state.charMode==='structure'?'bg-white shadow-sm text-sky-700':'text-slate-500'} flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.book}</span> Cấu tạo</button><button onclick="charMode('examples')" class="px-4 py-2 rounded-lg text-xs font-extrabold ${state.charMode==='examples'?'bg-white shadow-sm text-sky-700':'text-slate-500'} flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.book}</span> Ví dụ</button></div></div>${state.charMode==='write'?`<div class="p-6 md:p-8"><div class="grid lg:grid-cols-[1fr_300px] gap-7 items-center"><div><div class="rounded-[26px] bg-slate-50 border border-slate-200 p-4 flex items-center justify-center"><div id="writerTarget" class="mizi-grid rounded-xl"></div></div><div class="flex flex-wrap gap-2 mt-4"><button onclick="animateChar()" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-extrabold flex items-center gap-2"><span class="w-4 h-4 inline-block">${icon.keyboard}</span>Xem thứ tự nét</button><button onclick="quizChar()" class="px-4 py-2.5 rounded-xl bg-sky-600 text-white text-xs font-extrabold flex items-center gap-2"><span class="w-4 h-4 inline-block">${icon.pen}</span>Bắt đầu tập viết</button></div><div id="writeResult" class="mt-3 text-sm text-slate-500">Viết trực tiếp lên ô mễ tự. Khung viết cố định để vẽ trên iPad.</div></div><div class="space-y-3"><div class="p-4 rounded-2xl bg-violet-50 border border-violet-100"><div class="text-[9px] font-extrabold text-violet-600 uppercase">Giải nghĩa Lục Thư</div><p class="text-xs text-violet-800/80 mt-2 leading-5 font-medium">${c.components.map(x=>`<b>${x[0]}</b>: ${x[2]||x[1]}`).join('<br>')}</p></div><div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-100"><div class="text-[9px] font-extrabold text-emerald-600 uppercase">Hán Việt</div><div class="font-extrabold mt-1 text-emerald-900">${c.hanViet}</div></div><div class="p-4 rounded-2xl bg-slate-50 border border-slate-100"><div class="text-[9px] font-extrabold text-slate-400 uppercase">Cấu tạo</div>${c.components.map(x=>`<div class="flex justify-between mt-2 items-center"><span class="cn text-xl font-extrabold">${x[0]}</span><span class="text-[10px] text-slate-500 font-bold bg-white px-2 py-1 rounded border border-slate-200">${x[1]}</span></div>`).join('')}</div></div></div></div>`:state.charMode==='structure'?`<div class="p-6 md:p-8 grid md:grid-cols-2 gap-4">${c.components.map((x,i)=>`<div class="rounded-2xl border border-slate-200 bg-slate-50 p-5"><div class="flex justify-between items-center"><span class="cn text-3xl font-extrabold">${x[0]}</span><span class="text-[10px] font-extrabold px-2 py-1 rounded-lg ${i===0?'bg-emerald-100 text-emerald-700':'bg-sky-100 text-sky-700'}">${x[1]}</span></div><div class="mt-3 text-sm font-medium text-slate-600">${x[2]||''}</div></div>`).join('')}<div class="md:col-span-2 p-5 rounded-2xl bg-amber-50 border border-amber-200 text-sm text-amber-900"><b>Ghi chú:</b> Phân tích thành phần cấu tạo chữ Hán theo bộ thủ, ý nghĩa và âm thanh.</div></div>`:`<div class="p-6 md:p-8 space-y-3">${c.examples.map(x=>`<div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-100"><span class="cn text-xl font-bold">${esc(x)}</span><button onclick="speak('${esc(x)}')" class="px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-3 h-3 shrink-0">${icon.volume}</span> Nghe</button></div>`).join('')}</div>`}</section></div></div>`}

function grammarView(){return`<div class="space-y-6 fade"><div><div class="text-[10px] font-extrabold tracking-widest text-sky-600 uppercase">GRAMMAR LAB</div><h2 class="text-2xl font-extrabold mt-1">Ngữ pháp trọng tâm</h2><p class="text-sm text-slate-500 mt-1">Cấu trúc + ví dụ + cảnh báo lỗi.</p></div><div class="grid lg:grid-cols-2 gap-5">${lessonData.grammar.map(g=>`<article class="bg-white border border-slate-200 rounded-[26px] p-6"><h3 class="text-lg font-extrabold">${esc(g.title)}</h3><p class="text-sm text-slate-600 mt-2">${esc(g.meaning)}<span class="hidden"></span></p><div class="mt-4 p-4 rounded-2xl bg-sky-50 text-sky-900 font-extrabold text-sm">${esc(g.structure)}</div><div class="mt-4 space-y-2">${g.examples.map(e=>`<div class="cn bg-slate-50 rounded-xl p-3 font-semibold text-sm">${esc(e)}<span class="hidden"></span></div>`).join('')}</div><div class="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900"><b>Ghi chú:</b> ${esc(g.note)}</div></article>`).join('')}</div><section class="bg-white border border-slate-200 rounded-[26px] p-6"><h3 class="text-lg font-extrabold">Phân biệt từ dễ nhầm</h3><div class="grid md:grid-cols-2 gap-4 mt-5">${lessonData.contrast.map(c=>`<div class="rounded-2xl border border-slate-200 p-5 bg-slate-50/60"><div class="flex items-center gap-2"><span class="cn text-lg font-extrabold px-3 py-1.5 rounded-xl bg-blue-100 text-blue-800">${c.a}</span><span class="text-xs font-extrabold text-slate-400">VS</span><span class="cn text-lg font-extrabold px-3 py-1.5 rounded-xl bg-violet-100 text-violet-800">${c.b}</span></div><div class="text-xs font-bold text-slate-400 mt-3">${c.pinyin}</div><div class="font-bold text-sm mt-2">${c.meaning}<span class="hidden"></span></div><div class="mt-3 space-y-1">${c.examples.map(e=>`<div class="cn text-sm bg-white rounded-xl p-2.5">${e}</div>`).join('')}</div><div class="mt-3 text-xs text-rose-700 bg-rose-50 border border-rose-100 rounded-xl p-3"><b>Lỗi:</b> ${c.mistake}</div></div>`).join('')}</div></section></div>`}

function practiceView(){
    const c=current(),l=state.practiceType==='vocab'?practiceList():sentenceList();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(state.input);
    const totalLetters=targetStr.length;
    let correctCount=0;
    
    if(!state.completed){
        for(let i=0;i<typedStr.length;i++){
            if(typedStr[i]===targetStr[i]) correctCount++;
            else break;
        }
    }else{
        correctCount=totalLetters;
    }

    const segments=Array.from({length:totalLetters},(_,i)=>`<span class="letter-segment ${i<correctCount?'filled':''}"></span>`).join('');
    
    return `<div class="space-y-5 fade">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3">
        <div><div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase">LISTEN → TYPE ENGINE</div><h2 class="text-2xl font-extrabold mt-1">Nghe → Gõ Pinyin</h2><p class="text-sm text-slate-500 mt-1">Gõ Pinyin (không cần dấu thanh). Hoàn thành sẽ tự động hóa giải thành Hán Tự.</p></div>
        <div class="flex flex-wrap gap-2">
          <button onclick="changeType('vocab')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold ${state.practiceType==='vocab'?'bg-slate-900 text-white':'bg-white border border-slate-200 text-slate-600'}">Từ vựng · ${practiceList().length}</button>
          <button onclick="changeType('sentence')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold ${state.practiceType==='sentence'?'bg-slate-900 text-white':'bg-white border border-slate-200 text-slate-600'}">Câu mẫu · ${sentenceList().length}</button>
        </div>
      </div>
      <section class="bg-white border border-slate-200 rounded-[28px] overflow-hidden">
        <div id="practiceBurst" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
            <span class="text-[10px] font-extrabold tracking-widest text-slate-400">${state.practiceIndex+1} / ${l.length}</span>
            <span class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-extrabold">GÕ PINYIN (KHÔNG DẤU)</span>
        </div>
        
        <div class="p-6 md:p-9 flex flex-col md:flex-row gap-8">
          <div class="flex-1 max-w-2xl mx-auto w-full">
            <div class="text-center mt-2">
                <button aria-label="Nghe" onclick="speak('${esc(c.audioText)}',1)" class="w-16 h-16 rounded-2xl bg-sky-600 text-white flex items-center justify-center shadow-lg mx-auto hover:bg-sky-700 transition">
                    <span class="w-8 h-8 inline-block">${icon.volume}</span>
                </button>
                <div class="text-[10px] font-bold text-slate-400 mt-3">Bấm để nghe lại</div>
            </div>
            
            <div class="mt-7 text-center">
                <div class="text-[9px] font-extrabold tracking-widest uppercase text-slate-400">Gợi ý tiếng Việt</div>
                <div class="text-2xl md:text-3xl font-extrabold mt-2 text-sky-800">${esc(c.prompt)}</div>
            </div>

            <!-- Khung nhập liệu với Progress Bar nằm BÊN TRONG -->
            <div id="inputWrapper" class="relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm ${state.completed?'!border-emerald-400 !bg-emerald-50 text-emerald-800':state.revealed?'!border-rose-400 !bg-rose-50':''}">
                <div class="absolute left-0 top-0 w-full px-4 pt-3 flex gap-1" id="letterProgress">
                    ${segments}
                </div>
                <input id="typingInput" value="${esc(state.input)}" oninput="typeInput(this.value)" autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full text-center text-3xl md:text-4xl font-bold p-6 pt-10 pb-8 bg-transparent outline-none cn" placeholder="${state.completed||state.revealed?'':'Gõ pinyin...'}" ${state.completed||state.revealed?'disabled':''}>
            </div>

            <div id="typingFeedback" class="mt-4 text-center text-sm font-bold">
                ${state.completed?'<span class="text-emerald-700">✓ Hoàn thành xuất sắc!</span>':state.revealed?`<span class="text-amber-700">Đáp án là: <b>${c.chinese}</b></span>`:`<span class="text-slate-400">Tiến trình: ${correctCount} / ${totalLetters} ký tự Pinyin</span>`}
            </div>
          </div>

          <!-- NỘI DUNG CẦN NHỚ -->
          <div id="answerPanel" class="w-full md:w-[320px] shrink-0 border border-slate-200 rounded-2xl bg-white p-5">
              <div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase mb-4 text-center bg-emerald-50 rounded px-2 py-1">Nội dung cần nhớ</div>
              ${state.revealed?`
              <div class="text-center fade">
                  <div class="cn text-4xl sm:text-5xl font-extrabold text-slate-900">${esc(c.chinese)}</div>
                  <div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.pinyin)}</div>
                  ${c.type==='vocab'?`
                      <div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div>
                      <div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.wordClass)}</div>
                      <div class="text-sm font-bold text-slate-700 mt-3 border-t border-slate-100 pt-3">${esc(c.meaningVi)}<span class="hidden"></span></div>
                  `:`
                      <!-- DỊCH NGHĨA CHO CÂU MẪU ĐƯỢC HIỂN THỊ Ở ĐÂY -->
                      <div class="text-sm font-bold text-slate-700 mt-4 leading-6 border-t border-slate-100 pt-4">${esc(c.meaningVi)}<span class="hidden"></span></div>
                  `}
              </div>
              `:`
              <div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300">
                  <div class="text-7xl font-bold mb-2">?</div>
                  <div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div>
              </div>
              `}
          </div>
        </div>
        
        <div class="border-t border-slate-100 bg-slate-50 p-4 flex flex-wrap justify-between gap-2">
          <button onclick="prev()" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold">← Trước</button>
          <div class="flex flex-wrap gap-2">
            <button onclick="speak('${esc(c.audioText)}',1)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe</button>
            <button onclick="speak('${esc(c.audioText)}',.65)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.turtle}</span> Chậm</button>
            ${!state.revealed?`<button onclick="reveal()" class="px-4 py-3 rounded-xl bg-slate-200 text-slate-700 text-xs font-extrabold">Xem Đáp án</button>`:''}
          </div>
          <button onclick="next()" class="px-6 py-3 rounded-xl bg-emerald-500 text-white text-sm font-extrabold shadow-md hover:bg-emerald-600 transition">Tiếp tục →</button>
        </div>
      </section>
    </div>`
}

function speakingView(){
    const flow=[
        ['你好！请问你是哪国人？','Hỏi về quốc tịch','你好！我是越南人。','Nǐ hǎo! Wǒ shì Yuènán rén.'],
        ['你今天去哪儿？','Hỏi xem hôm nay đi đâu','今天我去学校学汉语。','Jīntiān wǒ qù xuéxiào xué Hànyǔ.'],
        ['这是谁？','Hỏi xem người đó là ai','这是我的中国朋友。','Zhè shì wǒ de Zhōngguó péngyou.'],
        ['再见！明天见！','Tạm biệt, hẹn ngày mai','好的，明天见！','Hǎo de, míngtiān jiàn!']
    ];
    window.speakStep=window.speakStep||0;const s=flow[window.speakStep];
    return`<div class="max-w-2xl mx-auto fade"><div class="text-[10px] font-extrabold tracking-widest text-violetx uppercase">MEET & GREET</div><h2 class="text-2xl font-extrabold mt-1">Speaking Roleplay</h2><p class="text-sm text-slate-500 mt-1">Hỏi thăm → Giới thiệu địa điểm → Giới thiệu người → Tạm biệt.</p><section class="bg-white border border-slate-200 rounded-[28px] p-7 mt-5"><div class="flex justify-between text-[10px] font-extrabold text-slate-400"><span>BƯỚC ${window.speakStep+1} / 4</span><span>PHẢN XẠ</span></div><div class="mt-5 p-6 rounded-2xl bg-slate-50"><div class="cn text-3xl font-extrabold">${s[0]}</div><button onclick="speak('${esc(s[0])}')" class="mt-4 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe NPC</button></div><div class="mt-5 text-xs font-bold text-slate-500 uppercase tracking-widest">${s[1]}</div><input class="mt-2 w-full p-4 rounded-2xl border-2 border-slate-200 cn text-2xl font-bold outline-none focus:border-sky-400" placeholder="Gõ câu trả lời bằng tiếng Trung…"><button onclick="window.speakStep=(window.speakStep+1)%4;render()" class="w-full mt-3 py-4 rounded-xl bg-sky-600 hover:bg-sky-700 transition text-white font-extrabold shadow-md">Tiếp tục →</button><details class="mt-5"><summary class="cursor-pointer text-xs font-extrabold text-sky-700">Mở gợi ý trả lời</summary><div class="mt-2 p-4 rounded-xl bg-amber-50"><div class="cn text-lg font-bold text-amber-900">${s[2]}</div><div class="text-xs font-bold text-amber-700 mt-1">${s[3]}<span class="hidden"></span></div></div></details></section></div>`}

function reviewView(){const typed=Object.values(state.typed).reduce((a,b)=>a+b,0);return`<div class="space-y-5 fade"><div><div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase">MASTERY DASHBOARD</div><h2 class="text-2xl font-extrabold mt-1">Ôn tập & Mastery</h2><p class="text-sm text-slate-500 mt-1">Tiến độ lưu tự động cục bộ trong trình duyệt.</p></div><div class="grid md:grid-cols-3 gap-4">${stat(state.mastered.length+' / '+lessonData.characters.length,'Hán tự đã học','thuộc cách viết')}${stat(typed,'Lượt gõ hoàn thành','từ / câu mẫu')}${stat(Object.keys(state.typed).length,'Mục đã chạm','không trùng lặp')}</div><section class="bg-white border border-slate-200 rounded-[26px] p-6"><h3 class="font-extrabold">Hán tự đã đánh dấu (Mastered)</h3><div class="flex flex-wrap gap-2 mt-4">${lessonData.characters.map((c,i)=>`<button onclick="selectChar(${i});setTab('characters')" class="px-3 py-2 rounded-xl border ${state.mastered.includes(c.char)?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-white border-slate-200 text-slate-400'}"><span class="cn text-xl font-bold">${c.char}</span></button>`).join('')}</div></section></div>`}

function render(){
    const content=state.tab==='overview'?overview():state.tab==='vocabulary'?vocabularyView():state.tab==='characters'?charactersView():state.tab==='grammar'?grammarView():state.tab==='practice'?practiceView():state.tab==='speaking'?speakingView():reviewView();
    document.getElementById('app').innerHTML=`<div class="min-h-screen flex">${nav()}<main class="flex-1 min-w-0 h-screen overflow-y-auto">${mobileTop()}${header()}<div class="max-w-[1400px] mx-auto p-4 md:p-7 lg:p-9 pb-24">${content}</div></main></div>`;
    loadVoices();
    if(state.tab==='characters'&&state.charMode==='write') setTimeout(initWriter,60);
}

render();
</script>
</body>
</html>
