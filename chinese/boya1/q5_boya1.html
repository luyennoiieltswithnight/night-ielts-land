        // ============================================================================
        // 3. AUDIO ENGINE (Web Speech API Wrapper)
        // ============================================================================
        const useAudioEngine = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [isSupported, setIsSupported] = useState(true);
            const [activeText, setActiveText] = useState(null);

            useEffect(() => {
                if (!window.speechSynthesis) {
                    setIsSupported(false);
                }
            }, []);

            const speak = useCallback((text, rate = 1.0) => {
                if (!window.speechSynthesis) return;

                window.speechSynthesis.cancel(); // Stop current speech
                setIsPlaying(true);
                setActiveText(text);

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = rate;

                // Find a proper Chinese voice if available
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN'));
                if (zhVoice) utterance.voice = zhVoice;

                utterance.onend = () => {
                    setIsPlaying(false);
                    setActiveText(null);
                };
                
                utterance.onerror = () => {
                    setIsPlaying(false);
                    setActiveText(null);
                };

                window.speechSynthesis.speak(utterance);
            }, []);

            const stop = useCallback(() => {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    setIsPlaying(false);
                    setActiveText(null);
                }
            }, []);

            return { speak, stop, isPlaying, isSupported, activeText };
        };

        // UI Component for Audio Control
        const AudioControl = ({ text, engine }) => {
            const [currentRate, setCurrentRate] = useState(1.0);
            
            if (!engine.isSupported) {
                return <div className="text-xs text-slate-400 flex items-center gap-1"><Icons.Info /> <span>Audio unavailable</span></div>;
            }

            const rates = [0.6, 0.8, 1.0, 1.2];
            const isMePlaying = engine.isPlaying && engine.activeText === text;

            const handlePlay = () => {
                if (isMePlaying) engine.stop();
                else engine.speak(text, currentRate);
            };

            return (
                <div className="flex flex-col sm:flex-row items-center gap-2 mt-2 bg-slate-50 p-2 rounded-xl border border-slate-100 w-fit">
                    <button 
                        onClick={handlePlay}
                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition ${isMePlaying ? 'bg-amber-100 text-amber-700' : 'bg-primary text-white hover:bg-primary/90'}`}

                        {isMePlaying ? "Đang phát..." : "Phát âm"}

                    <div className="flex items-center bg-white rounded-lg border border-slate-200 overflow-hidden">
                        {rates.map(rate => (
                            <button
                                key={rate}

                                className={`px-3 py-1.5 text-xs font-semibold border-r border-slate-100 last:border-0 transition ${currentRate === rate ? 'bg-slate-200 text-slate-800' : 'text-slate-500 hover:bg-slate-100'}`}

        // 4. WRITING SYSTEM (Hanzi Writer Wrapper)
        // ============================================================================
        const HanziCanvas = ({ character, mode = 'watch', onStateChange }) => {
            const canvasRef = useRef(null);
            const writerRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !character) return;

                // Initialize Writer
                if (!writerRef.current) {
                    writerRef.current = HanziWriter.create(canvasRef.current, character, {
                        width: 280,
                        height: 280,
                        padding: 15,
                        showOutline: true,
                        strokeAnimationSpeed: 1,
                        delayBetweenStrokes: 50,
                        radar: { strokeColor: '#cbd5e1' },
                        strokeColor: '#0f172a',
                        highlightColor: '#0284c7',
                        drawingWidth: 15,
                        drawingColor: '#0d9488'
                    });
                } else {
                    writerRef.current.setCharacter(character);
                }

                // Apply Mode
                if (mode === 'watch') {
                    writerRef.current.hideCharacter();
                    writerRef.current.animateCharacter();
                    onStateChange("Đang trình diễn thứ tự nét...");
                } else if (mode === 'trace') {
                    writerRef.current.showOutline();
                    writerRef.current.quiz({
                        onMistake: (info) => onStateChange(`Sai nét. Thử lại nét thứ ${info.strokeNum + 1}`),
                        onCorrectStroke: (info) => onStateChange(`Đúng nét! Đang viết nét ${info.strokeNum + 1} / ${info.totalStrokes}`),
                        onComplete: () => onStateChange("Hoàn thành xuất sắc!")
                    });
                } else if (mode === 'copy') {
                    writerRef.current.hideOutline();
                    writerRef.current.showCharacter({ opacity: 0.1 });
                    writerRef.current.quiz({
                        onMistake: (info) => onStateChange(`Sai nét. Thử lại nét thứ ${info.strokeNum + 1}`),
                        onCorrectStroke: (info) => onStateChange(`Đúng nét! Đang viết nét ${info.strokeNum + 1} / ${info.totalStrokes}`),
                        onComplete: () => onStateChange("Hoàn thành xuất sắc!")
                    });
                } else if (mode === 'write') {
                    writerRef.current.hideOutline();
                    writerRef.current.hideCharacter();
                    writerRef.current.quiz({
                        onMistake: (info) => onStateChange(`Sai nét. Thử lại nét thứ ${info.strokeNum + 1}`),
                        onCorrectStroke: (info) => onStateChange(`Đúng nét! Đang viết nét ${info.strokeNum + 1} / ${info.totalStrokes}`),
                        onComplete: () => onStateChange("Hoàn thành xuất sắc!")
                    });
                }

                return () => {
                    if (writerRef.current) writerRef.current.cancelQuiz();
                };
            }, [character, mode]);

            // Prevent scroll while drawing on iPad
            useEffect(() => {
                const handleTouchMove = (e) => e.preventDefault();
                const el = canvasRef.current;
                if (el) el.addEventListener('touchmove', handleTouchMove, { passive: false });
                return () => {
                    if (el) el.removeEventListener('touchmove', handleTouchMove);
                }
            }, []);

            return <div ref={canvasRef} className="mizi-grid rounded-lg mx-auto overflow-hidden"></div>;
        };

                                            </div>

                                            <div className="flex gap-2">
                                                <button onClick={() => engine.speak(item.zh)} className="flex-1 py-2 bg-primary/10 text-primary text-sm font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-primary/20 transition">
                                                    <Icons.Volume2 /> Đọc
                                                </button>
                                                <button onClick={() => setWritingWord(item.zh)} className="flex-1 py-2 bg-slate-100 text-slate-700 text-sm font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-slate-200 transition">
                                                    <Icons.Edit /> Viết
                                                </button>
                                            </div>
                                        </div>

                                        {/* BACK */}
                                        <div className="absolute inset-0 w-full h-full bg-slate-800 text-white rounded-3xl p-6 flex flex-col justify-between rotate-y-180 backface-hidden">
                                            <div>
                                                <div className="flex justify-between items-center text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                                                    <span>Ý NGHĨA</span>
                                                    <button onClick={() => setFlippedId(null)} className="flex items-center gap-1 hover:text-white"><Icons.Refresh /> Lật lại</button>
                                                </div>
                                                <h5 className="text-xl font-bold mb-4">{item.meaningVi}</h5>
                                                
                                                <div className="bg-white/10 p-4 rounded-xl border border-white/10 text-sm space-y-2">
                                                    <div className="text-xs font-bold text-primary-300 uppercase tracking-wider">Ví dụ / Ngữ cảnh</div>
                                                    <div className="chinese-text font-medium text-amber-200 text-lg flex items-center justify-between">
                                                        {item.example}
                                                        <button onClick={() => engine.speak(item.example)} className="text-amber-200 hover:text-white"><Icons.Volume2 /></button>
                                                    </div>
                                                    <div className="text-slate-300">{item.examplePinyin}</div>
                                                    <div className="text-slate-400">{item.exampleVi}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {writingWord && <WritingModal word={writingWord} onClose={() => setWritingWord(null)} />}
                </div>
            );
        }

        function GrammarLabView() {
            return (
                <div className="space-y-8 animate-fadeIn">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {lessonData.grammar.map(item => (
                            <div key={item.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col h-full">
                                <h4 className="text-lg font-bold text-slate-900 mb-2">{item.title}</h4>
                                <p className="text-sm text-slate-600 mb-4">{item.meaning}</p>
                                
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-4 font-mono text-sm text-primary font-bold">
                                    {item.structure}
                                </div>

                                <div className="space-y-2 mb-4 flex-1">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Ví dụ</div>
                                    {item.examples.map((ex, idx) => (
                                        <div key={idx} className="text-sm chinese-text font-medium text-slate-800 bg-white border border-slate-100 p-2.5 rounded-lg">
                                            {ex}
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-sm text-amber-900 mt-auto">
                                    <strong className="flex items-center gap-2 mb-1"><Icons.Info /> Chú ý</strong> {item.note}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-lg">
                        <h4 className="text-xl font-bold mb-6 flex items-center gap-2"><Icons.Layers /> Phân biệt từ dễ nhầm</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {lessonData.contrast.map(item => (
                                <div key={item.id} className="border border-white/20 rounded-2xl p-6 bg-white/5">
                                    <div className="flex items-center gap-3 mb-4">
                                        <span className="px-3 py-1 bg-blue-500/20 text-blue-300 border border-blue-500/30 rounded-lg font-bold text-lg chinese-text">{item.a}</span>
                                        <span className="text-slate-400 font-bold text-xs">VS</span>
                                        <span className="px-3 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 rounded-lg font-bold text-lg chinese-text">{item.b}</span>
                                    </div>
                                    <p className="text-sm font-medium mb-4 text-slate-200">{item.meaning}</p>
                                    
                                    <div className="text-xs text-red-300 bg-red-500/10 p-3 rounded-xl border border-red-500/20">
                                        <strong>Lỗi thường gặp:</strong> {item.mistake}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function PracticeEngineView() {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [score, setScore] = useState(0);
            const [isFinished, setIsFinished] = useState(false);

            const q = lessonData.exercises[currentIdx];

            const handleAnswer = (opt) => {
                setSelectedOption(opt);
                const correct = opt === q.answer;
                setIsCorrect(correct);
                if (correct) setScore(score + 1);
            };

            const nextQuestion = () => {
                setSelectedOption(null);
                setIsCorrect(null);
                if (currentIdx + 1 < lessonData.exercises.length) {
                    setCurrentIdx(currentIdx + 1);
                } else {
                    setIsFinished(true);
                }
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto animate-fadeIn">
                    <div className="flex items-center justify-between">
                        <h3 className="text-xl font-bold text-slate-800">Hệ thống Luyện tập</h3>
                        <span className="text-xs font-bold text-slate-500">Câu {currentIdx + 1} / {lessonData.exercises.length}</span>
                    </div>

                    {!isFinished ? (
                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                            <div className="inline-block px-3 py-1 bg-primary/10 text-primary text-xs font-bold rounded-full uppercase">
                                {q.type}
                            </div>
                            <h4 className="text-lg font-bold text-slate-900">{q.question}</h4>

                            <div className="space-y-3">
                                {q.options.map((opt, idx) => {
                                    let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:border-primary";
                                    if (selectedOption !== null) {
                                        if (opt === q.answer) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 font-bold";
                                        else if (opt === selectedOption) btnStyle = "bg-red-50 border-red-500 text-red-800 font-bold";
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            disabled={selectedOption !== null}
                                            onClick={() => handleAnswer(opt)}
                                            className={`w-full text-left p-4 rounded-2xl border transition text-sm flex items-center justify-between ${btnStyle}`}
                                        >
                                            <span className={q.type === 'Nhận diện' ? 'chinese-text text-lg' : ''}>{opt}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {selectedOption !== null && (
                                <div className="space-y-4 pt-4 border-t border-slate-100 animate-fadeIn">
                                    <div className={`p-4 rounded-2xl text-sm ${isCorrect ? 'bg-emerald-50 text-emerald-800' : 'bg-red-50 text-red-800'}`}>
                                        <strong>{isCorrect ? '✓ Chính xác!' : '✗ Chưa chính xác!'}</strong> {q.explanation}
                                    </div>
                                    <button
                                        onClick={nextQuestion}
                                        className="w-full py-3 bg-primary hover:bg-primary/90 text-white font-semibold rounded-xl transition shadow-lg shadow-primary/20"
                                    >
                                        {currentIdx + 1 < lessonData.exercises.length ? 'Câu tiếp theo' : 'Xem kết quả'}
                                    </button>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-center space-y-4 animate-fadeIn flex flex-col items-center">
                            <Icons.CheckCircle />
                            <h4 className="text-2xl font-bold text-slate-900">Hoàn thành bài tập!</h4>
                            <p className="text-slate-600">Bạn đạt số điểm: <strong className="text-primary">{score} / {lessonData.exercises.length}</strong></p>
                            <button
                                onClick={() => { setCurrentIdx(0); setScore(0); setIsFinished(false); }}
                                className="mt-4 px-6 py-3 bg-primary text-white font-semibold rounded-xl shadow hover:bg-primary/90 transition"
                            >
                                Làm lại bài tập
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function SpeakingRoleplayView() {
            const [step, setStep] = useState(0);
            const [userAnswer, setUserAnswer] = useState('');
            const [showSuggestion, setShowSuggestion] = useState(false);

            const flow = [
                { npc: "你好！请问，您贵姓？", hint: "Trả lời họ của bạn", suggestion: { zh: "我姓阮。", py: "Wǒ xìng Ruǎn.", vi: "Tôi họ Nguyễn." } },
                { npc: "你叫什么名字？", hint: "Trả lời tên của bạn", suggestion: { zh: "我叫陈英书。", py: "Wǒ jiào Chén Yīngshū.", vi: "Tôi tên là Trần Anh Thư." } },
                { npc: "你是哪国人？", hint: "Trả lời quốc tịch", suggestion: { zh: "我是越南人。", py: "Wǒ shì Yuènán rén.", vi: "Tôi là người Việt Nam." } },
            ];

            if (step >= flow.length) {
                return (
                    <div className="bg-white p-10 rounded-3xl border border-slate-200 shadow-sm text-center animate-fadeIn flex flex-col items-center">
                        <Icons.MessageCircle />
                        <h4 className="text-2xl font-bold text-slate-900 mb-2 mt-4">Hoàn thành hội thoại!</h4>
                        <button onClick={() => {setStep(0); setUserAnswer(''); setShowSuggestion(false);}} className="mt-4 px-6 py-3 bg-primary text-white font-semibold rounded-xl hover:bg-primary/90 transition">
                            Luyện tập lại
                        </button>
                    </div>
                );
            }

            const current = flow[step];

            return (
                <div className="max-w-2xl mx-auto space-y-6 animate-fadeIn">
                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                        {/* NPC */}
                        <div className="flex gap-4 mb-8">
                            <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500 shrink-0">NPC</div>
                            <div className="bg-slate-50 p-4 rounded-2xl rounded-tl-none border border-slate-100">
                                <div className="chinese-text text-2xl font-bold text-slate-900">{current.npc}</div>
                            </div>
                        </div>

                        {/* Suggestion Toggle */}
                        <div className="mb-6">
                            <button 
                                onClick={() => setShowSuggestion(!showSuggestion)}
                                className="text-sm font-semibold text-primary hover:underline flex items-center gap-1"
                            >
                                <Icons.Info /> {showSuggestion ? 'Ẩn gợi ý' : 'Xem gợi ý trả lời'}
                            </button>
                            
                            {showSuggestion && (
                                <div className="mt-3 p-4 bg-amber-50 border border-amber-200 rounded-xl animate-fadeIn">
                                    <div className="chinese-text text-lg font-bold text-amber-900">{current.suggestion.zh}</div>
                                    <div className="text-sm text-amber-700">{current.suggestion.py}</div>
                                    <div className="text-sm text-amber-800/70 mt-1">{current.suggestion.vi}</div>
                                </div>
                            )}
                        </div>

                        {/* User Input */}
                        <div>
                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">{current.hint}:</label>
                            <input
                                type="text"
                                value={userAnswer}
                                onChange={(e) => setUserAnswer(e.target.value)}
                                placeholder="Nhập câu trả lời bằng tiếng Trung..."
                                className="w-full p-4 bg-white border border-slate-200 rounded-xl text-lg chinese-text focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-sm"
                            />
                            <button
                                onClick={() => { setUserAnswer(''); setShowSuggestion(false); setStep(step + 1); }}
                                disabled={!userAnswer.trim() && !showSuggestion}
                                className={`mt-4 w-full py-4 rounded-xl font-bold transition flex justify-center items-center gap-2 ${userAnswer.trim() || showSuggestion ? 'bg-primary text-white shadow-lg' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                            >
                                Tiếp tục <Icons.MessageCircle />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render Application
        const rootElement = document.getElementById('root');
        ReactDOM.createRoot(rootElement).render(<App />);
    </script>
</body>
</html>
