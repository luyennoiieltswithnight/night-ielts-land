const grammar=[{"title":"什么 (shénme) — Đại từ nghi vấn “cái gì / gì”","structure":"Động từ + 什么 ? / 什么 + Danh từ","meaning":"Dùng để hỏi sự vật, tên gọi, công việc, học vấn.","examples":["这是什么？ — Đây là gì?","你想学什么？ — Bạn muốn học gì?","你做什么工作？ — Bạn làm công việc gì?","你叫什么名字？ — Bạn tên là gì?"],"note":"什么 nằm đúng vị trí của thành phần cần hỏi; không đảo lên đầu như câu hỏi Wh- trong tiếng Anh."},{"title":"哪 (nǎ) vs 哪儿 (nǎr)","structure":"哪 + Lượng từ + Danh từ / N + 在 + 哪儿","meaning":"哪 dùng để lựa chọn; 哪儿 dùng để hỏi địa điểm.","examples":["你是哪国人？ — Bạn là người nước nào?","你喝哪个？ — Bạn uống cái nào?","你在哪儿？ — Bạn ở đâu?","你住在哪里？ — Bạn sống ở đâu?"],"note":"儿 trong 哪儿 là hậu tố 儿化, không đọc thành một âm tiết er độc lập."},{"title":"了 (le) — Thay đổi trạng thái","structure":"S + V + O + 了 / S + V + 了","meaning":"Biểu thị tình huống mới xuất hiện hoặc sự thay đổi trạng thái.","examples":["老师回家了。 — Giáo viên về nhà rồi.","爸爸喝茶了。 — Bố uống trà rồi.","昨天我去银行取钱了。 — Hôm qua tôi đi ngân hàng rút tiền rồi."],"note":"Không đồng nhất 了 với thì quá khứ tiếng Anh. Cần nhìn vào ngữ cảnh: completion hoặc change of state."},{"title":"吧 (ba) — Đề nghị / làm mềm câu","structure":"Câu mệnh lệnh / gợi ý + 吧","meaning":"Đưa ra lời đề nghị nhẹ nhàng, rủ rê hoặc phỏng đoán tùy ngữ cảnh.","examples":["我们回家吧。 — Chúng ta về nhà nhé.","你喝水吧。 — Bạn uống nước đi.","你去问老师吧。 — Em đi hỏi thầy giáo đi."],"note":"Làm giảm sắc thái ra lệnh, khiến câu nói mềm và thân thiện hơn."},{"title":"们 (men) — Hậu tố số nhiều","structure":"Đại từ / Danh từ chỉ người + 们","meaning":"Chỉ số nhiều cho đại từ nhân xưng và danh từ chỉ người.","examples":["我们 — chúng tôi","你们 — các bạn","老师们 — các thầy cô","同学们 — các bạn học"],"note":"Không dùng 们 cho đồ vật như *书们, *桌子们."},{"title":"来 + V và V + 一下","structure":"我来 + V / V + 一下","meaning":"Biểu thị người nói chủ động xung phong hoặc thực hiện hành động ngắn, nhẹ.","examples":["我来介绍一下。 — Để tôi giới thiệu một chút.","请等一下。 — Xin đợi một lát.","我来帮你。 — Để tôi giúp bạn."],"note":"Hai cấu trúc giúp câu nói tự nhiên và bớt khô cứng."}];

let audioUnlocked = false;
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    
    // Mở khóa Speech Synthesis
    if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance(' ');
        dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
    }
    
    // Mở khóa Web Audio API
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function save(){localStorage.setItem('boya05_mastered',JSON.stringify(state.mastered));localStorage.setItem('boya05_typed',JSON.stringify(state.typed))}

function chineseVoices(){return voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/Chinese|Mandarin|普通话|中文/i.test(v.name))}
function bestVoice(){const vs=chineseVoices(),keys=['Ting-Ting','Mei-Jia','Sin-ji','Eddy','Google 普通话','Microsoft Yunxi','Microsoft Xiaoxiao','Microsoft Yunyang'];for(const k of keys){const v=vs.find(x=>x.name.includes(k));if(v)return v}return vs.find(v=>/zh-CN|zh_CN/i.test(v.lang))||vs[0]}

function loadVoices(){
    voices=speechSynthesis.getVoices()||[];
    const s=document.getElementById('voiceSelect');
    if(!s)return;
    
    const vs=chineseVoices();
    s.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} · ${v.lang}</option>`).join(''):'<option>Giọng mặc định hệ thống</option>';
    
    // 1. Moi tên giọng đã được lưu trong bộ nhớ trình duyệt ra (nếu có)
    const savedVoice = localStorage.getItem('global_saved_voice');
    
    // 2. Ưu tiên gán: Giọng đã lưu -> Giọng Google mặc định -> Các giọng khác
    const b = vs.find(v=>v.name===savedVoice) || bestVoice();
    if(b) s.value=b.name;

    // 3. Mỗi khi bạn chọn giọng mới ở menu, lưu vĩnh viễn nó lại
    s.onchange = function() {
        localStorage.setItem('global_saved_voice', this.value);
    };
}

// Hàm Speak gọi thẳng, tránh setTimeout để không bị iOS chặn Autoplay
function speak(text,rate=1){
    if(!('speechSynthesis'in window))return;
    
    const playUtterance = () => {
        const u=new SpeechSynthesisUtterance(text);
        u.lang='zh-CN'; u.rate=rate; u.pitch=1;
        const s=document.getElementById('voiceSelect'),v=voices.find(x=>x.name===s?.value)||bestVoice();
        if(v) u.voice=v;
        speechSynthesis.speak(u);
    };

    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        setTimeout(playUtterance, 100); // Wait for Safari to actually cancel before speaking again
    } else {
        playUtterance();
    }
}

function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,d=.06,vol=.03){
    try{
        const c=ac(),o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+d);
    }catch(e){}
}
function completeSound(){[523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80))}
function fireworks(){const r=document.getElementById('practiceBurst')||document.getElementById('fireworks');r.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,rad=80+Math.random()*180;s.className='spark';s.style.left=(42+Math.random()*16)+'%';s.style.top=(32+Math.random()*24)+'%';s.style.background=['#0284c7','#10b981','#f59e0b','#8b5cf6','#ec4899'][i%5];s.style.setProperty('--dx',Math.cos(a)*rad+'px');s.style.setProperty('--dy',Math.sin(a)*rad+'px');r.appendChild(s)}setTimeout(()=>r.innerHTML='',1200)}

// BỘ LỌC CỰC MẠNH: TỰ ĐỘNG ĐỔI 'ü' THÀNH 'v' VÀ CHỈ LẤY CHỮ CÁI, SỐ
function normalizePinyin(s){
    let str = s || '';
    // Phân rã chữ cái và dấu bằng NFD
    str = str.normalize('NFD');
    // Thay thế "u" có mang dấu diaeresis (\u0308) thành "v" (bắt trọn cả nǚ, lǚ)
    str = str.replace(/u\u0308/g, 'v').replace(/U\u0308/g, 'V');
    // Xóa toàn bộ các dấu kết hợp (bao gồm thanh điệu) và các ký tự không phải chữ/số
    return str.replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function practiceList(){return vocabulary.map(v=>({...v,type:'vocab',audio:v.zh,prompt:v.meaning}))}
function sentenceList(){return vocabulary.filter(v=>v.example).map(v=>({...v,type:'sentence',audio:v.example,prompt:v.exampleVi}))}
function current(){const l=state.practiceType==='vocab'?practiceList():sentenceList();return l[state.practiceIndex]||l[0]}
function getTargetPinyin(c){return normalizePinyin(c.type==='vocab'?c.pinyin:c.examplePinyin)}

function keyTick(index){beep(620+Math.min(index,12)*24,.055,.022)}

function typeInput(v){
    if(state.completed) return;
    
    state.input=v;
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(v);

    if(typedStr.length > lastTypedLength){
        keyTick(typedStr.length);
    }
    lastTypedLength = typedStr.length;

    // Tự động kiểm tra đúng/đủ
    if(targetStr.startsWith(typedStr)){
        if(typedStr.length === targetStr.length){
            state.completed = true;
            state.revealed = true;
            state.input = c.type === 'vocab' ? c.zh : c.example; // Tự biến thành Hán Tự
            
            // Fix lỗi lưu data của câu mẫu
            const key = c.type === 'vocab' ? c.zh : c.example;
            state.typed[key] = (state.typed[key]||0)+1;
            save();
            completeSound();
            setTimeout(fireworks,60);
        }
    }
    updateTyping();
}

function updateTyping(){
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(state.input);
    const totalLetters=targetStr.length;
    let correctCount=0;
    
    if(!state.completed){
        for(let i=0;i<typedStr.length;i++){
            if(typedStr[i]===targetStr[i]) correctCount++;
            else break;
        }
    }else{
        correctCount=totalLetters;
    }

    // Update Progress Bar
    const top=document.getElementById('letterProgress');
    if(top){
        top.innerHTML='';
        for(let i=0;i<totalLetters;i++){
            const d=document.createElement('span');
            d.className='letter-segment '+(i<correctCount?'filled':'');
            top.appendChild(d);
        }
    }

    const wrapper=document.getElementById('inputWrapper');
    if(wrapper){
        if(state.completed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-400 rounded-2xl overflow-hidden transition shadow-sm text-emerald-800";
        }else if(state.revealed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-rose-50 border-2 border-rose-400 rounded-2xl overflow-hidden transition shadow-sm";
        }else{
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm";
        }
    }

    const inp=document.getElementById('typingInput');
    if(inp){
        inp.value=state.input;
        inp.disabled=state.completed || state.revealed;
    }
    
    const fb=document.getElementById('typingFeedback');
    if(fb){
        if(state.completed){
            fb.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành xuất sắc!</span>';
        } else if(state.revealed){
            fb.innerHTML=`<span class="text-amber-700 font-bold">Đáp án là: <b>${c.type==='vocab'?c.zh:c.example}</b></span>`;
        } else {
            fb.innerHTML=`<span class="text-slate-400 font-bold">Gõ Pinyin (không dấu): ${correctCount} / ${totalLetters} ký tự</span>`;
        }
    }

    const ans=document.getElementById('answerPanel');
    if(ans){
        ans.innerHTML=state.revealed?`<div class="text-center fade"><div class="cn text-5xl font-extrabold text-slate-900">${esc(c.type==='vocab'?c.zh:c.example)}</div><div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.type==='vocab'?c.pinyin:c.examplePinyin)}</div>${c.type==='vocab'?`<div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div><div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.class)}</div>`:`<div class="text-sm font-bold text-slate-700 mt-3">${esc(c.prompt)}</div>`}</div>`:`<div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300"><div class="text-7xl font-bold mb-2">?</div><div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div></div>`
    }
}

function selectChar(i){state.selectedChar=i;state.charMode='write';render();setTimeout(initWriter,80)}
function charMode(m){state.charMode=m;render();if(m==='write')setTimeout(initWriter,80)}
function toggleMastered(){const c=characters[state.selectedChar];const i=state.mastered.indexOf(c.char);if(i>=0)state.mastered.splice(i,1);else state.mastered.push(c.char);save();render()}

function initWriter(){
    const el=document.getElementById('writerTarget');
    if(!el||typeof HanziWriter==='undefined') return;
    el.innerHTML=''; // Reset canvas trước khi khởi tạo
    const c=characters[state.selectedChar];
    
    try {
        writer=HanziWriter.create('writerTarget',c.char,{
            width:250,height:250,padding:18,showOutline:true,showCharacter:false,
            strokeAnimationSpeed:1.2,delayBetweenStrokes:140,drawingFadeDuration:180,
            highlightOnComplete:true,strokeColor:'#0f172a',outlineColor:'#cbd5e1',
            drawingColor:'#0284c7',highlightColor:'#10b981',showHintAfterMisses:2
        });
    } catch(e) {
        console.error("HanziWriter Error:", e);
        el.innerHTML = `<div class="text-sm text-amber-600 font-bold p-4">Ký tự này hiện chưa hỗ trợ mô phỏng nét viết.</div>`;
    }
}

function animateChar(){if(writer)writer.animateCharacter()}
function quizChar(){
    if(!writer)return;
    const r=document.getElementById('writeResult');
    if(r) r.innerHTML='<span class="text-sky-700 font-bold">Bắt đầu! Viết theo thứ tự nét.</span>';
    writer.quiz({
        showHintAfterMisses:2,
        highlightOnComplete:true,
        onMistake:()=>{if(r)r.innerHTML='<span class="text-amber-700 font-bold">Chưa đúng nét — thử lại.</span>'},
        onComplete:()=>{
            if(r)r.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành chữ!</span>';
            const c=characters[state.selectedChar];
            if(!state.mastered.includes(c.char)){state.mastered.push(c.char);save()}
        }
    })

// PRACTICE ENGINE VIEW
function practiceView(){
    const c=current(),l=state.practiceType==='vocab'?practiceList():sentenceList();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(state.input);
    const totalLetters=targetStr.length;
    let correctCount=0;
    
    if(!state.completed){
        for(let i=0;i<typedStr.length;i++){
            if(typedStr[i]===targetStr[i]) correctCount++;
            else break;
        }
    }else{
        correctCount=totalLetters;
    }

    const segments=Array.from({length:totalLetters},(_,i)=>`<span class="letter-segment ${i<correctCount?'filled':''}"></span>`).join('');
    
    return `<div class="space-y-5 fade">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3">
        <div><div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase">LISTEN → TYPE ENGINE</div><h2 class="text-2xl font-extrabold mt-1">Nghe → Gõ Pinyin</h2><p class="text-sm text-slate-500 mt-1">Gõ Pinyin (không cần dấu thanh). Hoàn thành sẽ tự động hóa giải thành Hán Tự.</p></div>
        <div class="flex flex-wrap gap-2">
          <button onclick="changeType('vocab')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold ${state.practiceType==='vocab'?'bg-slate-900 text-white':'bg-white border border-slate-200 text-slate-600'}">Từ vựng · ${practiceList().length}</button>
          <button onclick="changeType('sentence')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold ${state.practiceType==='sentence'?'bg-slate-900 text-white':'bg-white border border-slate-200 text-slate-600'}">Câu mẫu · ${sentenceList().length}</button>
        </div>
      </div>
      <section class="bg-white border border-slate-200 rounded-[28px] overflow-hidden">
        <div id="practiceBurst" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
            <span class="text-[10px] font-extrabold tracking-widest text-slate-400">${state.practiceIndex+1} / ${l.length}</span>
            <span class="px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-[10px] font-extrabold">GÕ PINYIN (KHÔNG DẤU)</span>
        </div>
        
        <div class="p-6 md:p-9 flex flex-col md:flex-row gap-8">
          <div class="flex-1 max-w-2xl mx-auto w-full">
            <div class="text-center mt-2">
                <button aria-label="Nghe" onclick="speak('${esc(c.audio)}',1)" class="w-16 h-16 rounded-2xl bg-sky-600 text-white flex items-center justify-center shadow-lg mx-auto hover:bg-sky-700 transition">
                    <span class="w-8 h-8 inline-block">${icon.volume}</span>
                </button>
                <div class="text-[10px] font-bold text-slate-400 mt-3">Bấm để nghe lại</div>
            </div>
            
            <div class="mt-7 text-center">
                <div class="text-[9px] font-extrabold tracking-widest uppercase text-slate-400">Gợi ý tiếng Việt</div>
                <div class="text-2xl md:text-3xl font-extrabold mt-2 text-sky-800">${esc(c.prompt)}</div>
            </div>

            <div id="inputWrapper" class="relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm ${state.completed?'!border-emerald-400 !bg-emerald-50 text-emerald-800':state.revealed?'!border-rose-400 !bg-rose-50':''}">
                <div class="absolute left-0 top-0 w-full px-4 pt-3 flex gap-1" id="letterProgress">
                    ${segments}
                </div>
                <input id="typingInput" value="${esc(state.input)}" oninput="typeInput(this.value)" autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full text-center text-3xl md:text-4xl font-bold p-6 pt-10 pb-8 bg-transparent outline-none cn" placeholder="${state.completed||state.revealed?'':'Gõ pinyin...'}" ${state.completed||state.revealed?'disabled':''}>
            </div>

            <div id="typingFeedback" class="mt-4 text-center text-sm font-bold">
                ${state.completed?'<span class="text-emerald-700">✓ Hoàn thành xuất sắc!</span>':state.revealed?`<span class="text-amber-700">Đáp án là: <b>${c.type==='vocab'?c.zh:c.example}</b></span>`:`<span class="text-slate-400">Tiến trình: ${correctCount} / ${totalLetters} ký tự Pinyin</span>`}
            </div>
          </div>

          <div id="answerPanel" class="w-full md:w-[320px] shrink-0 border border-slate-200 rounded-2xl bg-white p-5">
              <div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase mb-4 text-center bg-emerald-50 rounded px-2 py-1">Nội dung cần nhớ</div>
              ${state.revealed?`
              <div class="text-center fade">
                  <div class="cn text-4xl sm:text-5xl font-extrabold text-slate-900">${esc(c.type==='vocab'?c.zh:c.example)}</div>
                  <div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.type==='vocab'?c.pinyin:c.examplePinyin)}</div>
                  ${c.type==='vocab'?`<div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div><div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.class)}</div><div class="text-sm font-bold text-slate-700 mt-3 border-t border-slate-100 pt-3">${esc(c.meaning)}<span class="hidden"></span></div>`:`<div class="text-sm font-bold text-slate-700 mt-4 leading-6 border-t border-slate-100 pt-4">${esc(c.prompt)}<span class="hidden"></span></div>`}
              </div>
              `:`
              <div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300">
                  <div class="text-7xl font-bold mb-2">?</div>
                  <div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div>
              </div>
              `}
          </div>
        </div>
        
        <div class="border-t border-slate-100 bg-slate-50 p-4 flex flex-wrap justify-between gap-2">
          <button onclick="prev()" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold">← Trước</button>
          <div class="flex flex-wrap gap-2">
            <button onclick="speak('${esc(c.audio)}',1)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe</button>
            <button onclick="speak('${esc(c.audio)}',.65)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.turtle}</span> Chậm</button>
            ${!state.revealed?`<button onclick="reveal()" class="px-4 py-3 rounded-xl bg-slate-200 text-slate-700 text-xs font-extrabold">Xem Đáp án</button>`:''}
          </div>
          <button onclick="next()" class="px-6 py-3 rounded-xl bg-emerald-500 text-white text-sm font-extrabold shadow-md hover:bg-emerald-600 transition">Tiếp tục →</button>
        </div>
      </section>
    </div>`
}

function speakingView(){
    const flow=[
        ['你好！请问，您贵姓？','Trả lời họ của bạn','我姓阮。','Wǒ xìng Ruǎn.'],
        ['你叫什么名字？','Trả lời tên của bạn','我叫陈英书。','Wǒ jiào Chén Yīngshū.'],
        ['你是哪国人？','Trả lời quốc tịch','我是越南人。','Wǒ shì Yuènán rén.'],
        ['很高兴认识你！','Đáp lại','认识你我也很高兴！','Rènshi nǐ wǒ yě hěn gāoxìng!']
    ];
    window.speakStep=window.speakStep||0;const s=flow[window.speakStep];
    return`<div class="max-w-2xl mx-auto fade"><div class="text-[10px] font-extrabold tracking-widest text-violetx uppercase">FIRST MEETING</div><h2 class="text-2xl font-extrabold mt-1">Speaking Roleplay</h2><p class="text-sm text-slate-500 mt-1">Họ tên → quốc tịch → làm quen.</p><section class="bg-white border border-slate-200 rounded-[28px] p-7 mt-5"><div class="flex justify-between text-[10px] font-extrabold text-slate-400"><span>BƯỚC ${window.speakStep+1} / 4</span><span>PHẢN XẠ</span></div><div class="mt-5 p-6 rounded-2xl bg-slate-50"><div class="cn text-3xl font-extrabold">${s[0]}</div><button onclick="speak('${esc(s[0])}')" class="mt-4 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe NPC</button></div><div class="mt-5 text-xs font-bold text-slate-500 uppercase tracking-widest">${s[1]}</div><input class="mt-2 w-full p-4 rounded-2xl border-2 border-slate-200 cn text-2xl font-bold outline-none focus:border-sky-400" placeholder="Gõ câu trả lời bằng tiếng Trung…"><button onclick="window.speakStep=(window.speakStep+1)%4;render()" class="w-full mt-3 py-4 rounded-xl bg-sky-600 hover:bg-sky-700 transition text-white font-extrabold shadow-md">Tiếp tục →</button><details class="mt-5"><summary class="cursor-pointer text-xs font-extrabold text-sky-700">Mở gợi ý trả lời</summary><div class="mt-2 p-4 rounded-xl bg-amber-50"><div class="cn text-lg font-bold text-amber-900">${s[2]}</div><div class="text-xs font-bold text-amber-700 mt-1">${s[3]}<span class="hidden"></span></div></div></details></section></div>`}

function reviewView(){const typed=Object.values(state.typed).reduce((a,b)=>a+b,0);return`<div class="space-y-5 fade"><div><div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase">MASTERY DASHBOARD</div><h2 class="text-2xl font-extrabold mt-1">Ôn tập & Mastery</h2><p class="text-sm text-slate-500 mt-1">Tiến độ lưu tự động cục bộ trong trình duyệt.</p></div><div class="grid md:grid-cols-3 gap-4">${stat(state.mastered.length+' / '+characters.length,'Hán tự đã học','thuộc cách viết')}${stat(typed,'Lượt gõ hoàn thành','từ / câu mẫu')}${stat(Object.keys(state.typed).length,'Mục đã chạm','không trùng lặp')}</div><section class="bg-white border border-slate-200 rounded-[26px] p-6"><h3 class="font-extrabold">Hán tự đã đánh dấu (Mastered)</h3><div class="flex flex-wrap gap-2 mt-4">${characters.map((c,i)=>`<button onclick="selectChar(${i});setTab('characters')" class="px-3 py-2 rounded-xl border ${state.mastered.includes(c.char)?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-white border-slate-200 text-slate-400'}"><span class="cn text-xl font-bold">${c.char}</span></button>`).join('')}</div></section></div>`}

function render(){
    const content=state.tab==='overview'?overview():state.tab==='vocabulary'?vocabularyView():state.tab==='characters'?charactersView():state.tab==='grammar'?grammarView():state.tab==='practice'?practiceView():state.tab==='speaking'?speakingView():reviewView();
    document.getElementById('app').innerHTML=`<div class="min-h-screen flex">${nav()}<main class="flex-1 min-w-0 h-screen overflow-y-auto">${mobileTop()}${header()}<div class="max-w-[1400px] mx-auto p-4 md:p-7 lg:p-9 pb-24">${content}</div></main></div>`;
    loadVoices();
    if(state.tab==='characters'&&state.charMode==='write') setTimeout(initWriter,60);
}

render();
</script>
</body>
</html>
