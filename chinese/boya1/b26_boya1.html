let audioUnlocked = false;
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance(' ');
        dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
    }
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function save(){localStorage.setItem('boya26_mastered',JSON.stringify(state.mastered));localStorage.setItem('boya26_typed',JSON.stringify(state.typed))}

function chineseVoices(){return voices.filter(v=>/^zh(-|_)/i.test(v.lang)||/Chinese|Mandarin|普通话|中文/i.test(v.name))}
function bestVoice(){const vs=chineseVoices(),keys=['Ting-Ting','Mei-Jia','Sin-ji','Eddy','Google 普通话','Microsoft Yunxi','Microsoft Xiaoxiao','Microsoft Yunyang'];for(const k of keys){const v=vs.find(x=>x.name.includes(k));if(v)return v}return vs.find(v=>/zh-CN|zh_CN/i.test(v.lang))||vs[0]}

function loadVoices(){
    voices=speechSynthesis.getVoices()||[];
    const s=document.getElementById('voiceSelect');
    if(!s)return;
    const old=s.value,vs=chineseVoices();
    s.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} · ${v.lang}</option>`).join(''):'<option>Giọng mặc định hệ thống</option>';
    const b=vs.find(v=>v.name===old)||bestVoice();
    if(b)s.value=b.name;
}
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged=loadVoices;
    setTimeout(loadVoices,250);
}

function speak(text,rate=1){
    if(!('speechSynthesis'in window))return;
    const playUtterance = () => {
        const u=new SpeechSynthesisUtterance(text);
        u.lang='zh-CN'; u.rate=rate; u.pitch=1;
        const s=document.getElementById('voiceSelect'),v=voices.find(x=>x.name===s?.value)||bestVoice();
        if(v) u.voice=v;
        speechSynthesis.speak(u);
    };

    if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        setTimeout(playUtterance, 100); 
    } else {
        playUtterance();
    }
}

function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,d=.06,vol=.03){
    try{
        const c=ac(),o=c.createOscillator(),g=c.createGain();
        o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+d);
    }catch(e){}
}
function completeSound(){[523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80))}
function fireworks(){const r=document.getElementById('practiceBurst')||document.getElementById('fireworks');r.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,rad=80+Math.random()*180;s.className='spark';s.style.left=(42+Math.random()*16)+'%';s.style.top=(32+Math.random()*24)+'%';s.style.background=['#0284c7','#10b981','#f59e0b','#8b5cf6','#ec4899'][i%5];s.style.setProperty('--dx',Math.cos(a)*rad+'px');s.style.setProperty('--dy',Math.sin(a)*rad+'px');r.appendChild(s)}setTimeout(()=>r.innerHTML='',1200)}

function normalizePinyin(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}

function practiceList(){return practiceItems.filter(i=>i.type==='vocab')}
// Đảm bảo chỉ lấy câu có pinyin hợp lệ để thanh progress hoạt động
function sentenceList(){return practiceItems.filter(i=>i.type==='sentence' && i.pinyin && i.pinyin.trim().length > 0)}
function current(){const l=state.practiceType==='vocab'?practiceList():sentenceList();return l[state.practiceIndex]||l[0]}
function getTargetPinyin(c){return normalizePinyin(c.pinyin)}

function keyTick(index){beep(620+Math.min(index,12)*24,.055,.022)}

function typeInput(v){
    if(state.completed) return;
    
    state.input=v;
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(v);

    if(typedStr.length > lastTypedLength){
        keyTick(typedStr.length);
    }
    lastTypedLength = typedStr.length;

    // Check completion
    if(targetStr.startsWith(typedStr)){
        if(typedStr.length === targetStr.length){
            state.completed = true;
            state.revealed = true;
            state.input = c.chinese; 
            state.typed[c.chinese] = (state.typed[c.chinese]||0)+1;
            save();
            completeSound();
            setTimeout(fireworks,60);
        }
    }
    updateTyping();
}

function updateTyping(){
    const c=current();
    const targetStr=getTargetPinyin(c);
    const typedStr=normalizePinyin(state.input);
    const totalLetters=targetStr.length;
    let correctCount=0;
    
    if(!state.completed){
        for(let i=0;i<typedStr.length;i++){
            if(typedStr[i]===targetStr[i]) correctCount++;
            else break;
        }
    }else{
        correctCount=totalLetters;
    }

    const top=document.getElementById('letterProgress');
    if(top){
        top.innerHTML='';
        for(let i=0;i<totalLetters;i++){
            const d=document.createElement('span');
            d.className='letter-segment '+(i<correctCount?'filled':'');
            top.appendChild(d);
        }
    }

    const wrapper=document.getElementById('inputWrapper');
    if(wrapper){
        if(state.completed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-400 rounded-2xl overflow-hidden transition shadow-sm text-emerald-800";
        }else if(state.revealed){
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-rose-50 border-2 border-rose-400 rounded-2xl overflow-hidden transition shadow-sm";
        }else{
            wrapper.className = "relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm";
        }
    }

    const inp=document.getElementById('typingInput');
    if(inp){
        inp.value=state.input;
        inp.disabled=state.completed || state.revealed;
    }
    
    const fb=document.getElementById('typingFeedback');
    if(fb){
        if(state.completed){
            fb.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành xuất sắc!</span>';
        } else if(state.revealed){
            fb.innerHTML=`<span class="text-amber-700 font-bold">Đáp án là: <b>${c.chinese}</b></span>`;
        } else {
            fb.innerHTML=`<span class="text-slate-400 font-bold">Gõ Pinyin (không dấu): ${correctCount} / ${totalLetters} ký tự</span>`;
        }
    }

    // Mã đánh dấu nguồn được ẩn an toàn
    const ans=document.getElementById('answerPanel');
    if(ans){
        ans.innerHTML=state.revealed?`
            <div class="text-center fade">
                <div class="cn text-4xl sm:text-5xl font-extrabold text-slate-900">${esc(c.chinese)}</div>
                <div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.pinyin)}</div>
                ${c.type==='vocab'?`
                    <div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div>
                    <div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.wordClass)}</div>
                    <div class="text-sm font-bold text-slate-700 mt-3 border-t border-slate-100 pt-3">${esc(c.meaningVi)}<span class="hidden">[cite: 16]</span></div>
                `:`
                    <div class="text-sm font-bold text-slate-700 mt-4 leading-6 border-t border-slate-100 pt-4">${esc(c.meaningVi)}<span class="hidden">[cite: 16]</span></div>
                `}
            </div>
        `:`<div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300"><div class="text-7xl font-bold mb-2">?</div><div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div></div>`
    }
}

    if(!writer)return;
    const r=document.getElementById('writeResult');
    if(r) r.innerHTML='<span class="text-sky-700 font-bold">Bắt đầu! Viết theo thứ tự nét.</span>';
    writer.quiz({
        showHintAfterMisses:2,
        highlightOnComplete:true,
        onMistake:()=>{if(r)r.innerHTML='<span class="text-amber-700 font-bold">Chưa đúng nét — thử lại.</span>'},
        onComplete:()=>{
            if(r)r.innerHTML='<span class="text-emerald-700 font-extrabold">✓ Hoàn thành chữ!</span>';
            const c=lessonData.characters[state.selectedChar];
            if(!state.mastered.includes(c.char)){state.mastered.push(c.char);save()}
        }
    });
}

          <div class="flex-1 max-w-2xl mx-auto w-full">
            <div class="text-center mt-2">
                <button aria-label="Nghe" onclick="speak('${esc(c.audioText)}',1)" class="w-16 h-16 rounded-2xl bg-sky-600 text-white flex items-center justify-center shadow-lg mx-auto hover:bg-sky-700 transition">
                    <span class="w-8 h-8 inline-block">${icon.volume}</span>
                </button>
                <div class="text-[10px] font-bold text-slate-400 mt-3">Bấm để nghe lại</div>
            </div>
            
            <div class="mt-7 text-center">
                <div class="text-[9px] font-extrabold tracking-widest uppercase text-slate-400">Gợi ý tiếng Việt</div>
                <div class="text-2xl md:text-3xl font-extrabold mt-2 text-sky-800">${esc(c.prompt)}</div>
            </div>

            <!-- Khung nhập liệu với Progress Bar nằm BÊN TRONG -->
            <div id="inputWrapper" class="relative w-full max-w-xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl overflow-hidden focus-within:border-sky-400 transition shadow-sm ${state.completed?'!border-emerald-400 !bg-emerald-50 text-emerald-800':state.revealed?'!border-rose-400 !bg-rose-50':''}">
                <div class="absolute left-0 top-0 w-full px-4 pt-3 flex gap-1" id="letterProgress">
                    ${segments}
                </div>
                <input id="typingInput" value="${esc(state.input)}" oninput="typeInput(this.value)" autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full text-center text-3xl md:text-4xl font-bold p-6 pt-10 pb-8 bg-transparent outline-none cn" placeholder="${state.completed||state.revealed?'':'Gõ pinyin...'}" ${state.completed||state.revealed?'disabled':''}>
            </div>

            <div id="typingFeedback" class="mt-4 text-center text-sm font-bold">
                ${state.completed?'<span class="text-emerald-700">✓ Hoàn thành xuất sắc!</span>':state.revealed?`<span class="text-amber-700">Đáp án là: <b>${c.chinese}</b></span>`:`<span class="text-slate-400">Tiến trình: ${correctCount} / ${totalLetters} ký tự Pinyin</span>`}
            </div>
          </div>

          <!-- NỘI DUNG CẦN NHỚ -->
          <div id="answerPanel" class="w-full md:w-[320px] shrink-0 border border-slate-200 rounded-2xl bg-white p-5">
              <div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase mb-4 text-center bg-emerald-50 rounded px-2 py-1">Nội dung cần nhớ</div>
              ${state.revealed?`
              <div class="text-center fade">
                  <div class="cn text-4xl sm:text-5xl font-extrabold text-slate-900">${esc(c.chinese)}</div>
                  <div class="text-xl font-extrabold text-sky-600 mt-2">${esc(c.pinyin)}</div>
                  ${c.type==='vocab'?`
                      <div class="text-xs font-extrabold text-emerald-600 tracking-wide mt-2">${esc(c.hanViet)}</div>
                      <div class="text-xs text-slate-500 font-bold mt-2 bg-slate-100 inline-block px-2 py-1 rounded">${esc(c.wordClass)}</div>
                      <div class="text-sm font-bold text-slate-700 mt-3 border-t border-slate-100 pt-3">${esc(c.meaningVi)}<span class="hidden"></span></div>
                  `:`
                      <!-- DỊCH NGHĨA CHO CÂU MẪU ĐƯỢC HIỂN THỊ Ở ĐÂY -->
                      <div class="text-sm font-bold text-slate-700 mt-4 leading-6 border-t border-slate-100 pt-4">${esc(c.meaningVi)}<span class="hidden"></span></div>
                  `}
              </div>
              `:`
              <div class="h-full min-h-[200px] flex flex-col justify-center items-center text-slate-300">
                  <div class="text-7xl font-bold mb-2">?</div>
                  <div class="text-xs font-bold text-center px-4">Gõ đúng để mở khóa thẻ ghi nhớ</div>
              </div>
              `}
          </div>
        </div>
        
        <div class="border-t border-slate-100 bg-slate-50 p-4 flex flex-wrap justify-between gap-2">
          <button onclick="prev()" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold">← Trước</button>
          <div class="flex flex-wrap gap-2">
            <button onclick="speak('${esc(c.audioText)}',1)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe</button>
            <button onclick="speak('${esc(c.audioText)}',.65)" class="px-4 py-3 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-1"><span class="w-4 h-4 shrink-0">${icon.turtle}</span> Chậm</button>
            ${!state.revealed?`<button onclick="reveal()" class="px-4 py-3 rounded-xl bg-slate-200 text-slate-700 text-xs font-extrabold">Xem Đáp án</button>`:''}
          </div>
          <button onclick="next()" class="px-6 py-3 rounded-xl bg-emerald-500 text-white text-sm font-extrabold shadow-md hover:bg-emerald-600 transition">Tiếp tục →</button>
        </div>
      </section>
    </div>`
}

function speakingView(){
    const flow=[
        ['快考试了，你最近怎么准备？','Hỏi bạn dạo này ôn thi thế nào','为了考好，我每天努力学习。','Wèile kǎo hǎo, wǒ měitiān nǔlì xuéxí.'],
        ['你今天先做什么？','Hỏi dự định hôm nay làm gì trước','我先做完作业，再复习语法。','Wǒ xiān zuò wán zuòyè, zài fùxí yǔfǎ.'],
        ['这几天天气不好，我们要改变计划吗？','Hỏi có nên thay đổi kế hoạch du lịch không','考虑到天气不好，我们决定改天出发。','Kǎolǜ dào tiānqì bù hǎo, wǒmen juédìng gǎitiān chūfā.'],
        ['你要去邮局寄什么？','Hỏi đi bưu điện gửi gì','我要寄一个包裹给朋友。','Wǒ yào jì yí ge bāoguǒ gěi péngyou.']
    ];
    window.speakStep=window.speakStep||0;const s=flow[window.speakStep];
    return`<div class="max-w-2xl mx-auto fade"><div class="text-[10px] font-extrabold tracking-widest text-violetx uppercase">DAILY CHAT</div><h2 class="text-2xl font-extrabold mt-1">Speaking Roleplay</h2><p class="text-sm text-slate-500 mt-1">Ôn thi → Lên kế hoạch → Thay đổi lịch → Gửi bưu kiện.</p><section class="bg-white border border-slate-200 rounded-[28px] p-7 mt-5"><div class="flex justify-between text-[10px] font-extrabold text-slate-400"><span>BƯỚC ${window.speakStep+1} / 4</span><span>PHẢN XẠ</span></div><div class="mt-5 p-6 rounded-2xl bg-slate-50"><div class="cn text-3xl font-extrabold">${s[0]}</div><button onclick="speak('${esc(s[0])}')" class="mt-4 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-extrabold flex items-center gap-2"><span class="w-4 h-4 shrink-0">${icon.volume}</span> Nghe NPC</button></div><div class="mt-5 text-xs font-bold text-slate-500 uppercase tracking-widest">${s[1]}</div><input class="mt-2 w-full p-4 rounded-2xl border-2 border-slate-200 cn text-2xl font-bold outline-none focus:border-sky-400" placeholder="Gõ câu trả lời bằng tiếng Trung…"><button onclick="window.speakStep=(window.speakStep+1)%4;render()" class="w-full mt-3 py-4 rounded-xl bg-sky-600 hover:bg-sky-700 transition text-white font-extrabold shadow-md">Tiếp tục →</button><details class="mt-5"><summary class="cursor-pointer text-xs font-extrabold text-sky-700">Mở gợi ý trả lời</summary><div class="mt-2 p-4 rounded-xl bg-amber-50"><div class="cn text-lg font-bold text-amber-900">${s[2]}</div><div class="text-xs font-bold text-amber-700 mt-1">${s[3]}</div></div></details></section></div>`}

function reviewView(){const typed=Object.values(state.typed).reduce((a,b)=>a+b,0);return`<div class="space-y-5 fade"><div><div class="text-[10px] font-extrabold tracking-widest text-emerald-600 uppercase">MASTERY DASHBOARD</div><h2 class="text-2xl font-extrabold mt-1">Ôn tập & Mastery</h2><p class="text-sm text-slate-500 mt-1">Tiến độ lưu tự động cục bộ trong trình duyệt.</p></div><div class="grid md:grid-cols-3 gap-4">${stat(state.mastered.length+' / '+lessonData.characters.length,'Hán tự đã học','thuộc cách viết')}${stat(typed,'Lượt gõ hoàn thành','từ / câu mẫu')}${stat(Object.keys(state.typed).length,'Mục đã chạm','không trùng lặp')}</div><section class="bg-white border border-slate-200 rounded-[26px] p-6"><h3 class="font-extrabold">Hán tự đã đánh dấu (Mastered)</h3><div class="flex flex-wrap gap-2 mt-4">${lessonData.characters.map((c,i)=>`<button onclick="selectChar(${i});setTab('characters')" class="px-3 py-2 rounded-xl border ${state.mastered.includes(c.char)?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-white border-slate-200 text-slate-400'}"><span class="cn text-xl font-bold">${c.char}</span></button>`).join('')}</div></section></div>`}

function render(){
    const content=state.tab==='overview'?overview():state.tab==='vocabulary'?vocabularyView():state.tab==='characters'?charactersView():state.tab==='grammar'?grammarView():state.tab==='practice'?practiceView():state.tab==='speaking'?speakingView():reviewView();
    document.getElementById('app').innerHTML=`<div class="min-h-screen flex">${nav()}<main class="flex-1 min-w-0 h-screen overflow-y-auto">${mobileTop()}${header()}<div class="max-w-[1400px] mx-auto p-4 md:p-7 lg:p-9 pb-24">${content}</div></main></div>`;
    loadVoices();
    if(state.tab==='characters'&&state.charMode==='write') setTimeout(initWriter,60);
}

render();
</script>
</body>
</html>
