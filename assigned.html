<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài Được Giao — Night IELTS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:{50:'#f0f9ff',100:'#e0f2fe',200:'#99f6e4',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0d9488',700:'#0369a1',800:'#075985',900:'#134e4a'}}}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f8fafc;color:#1e293b;font-family:'Plus Jakarta Sans',sans-serif;}
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<header class="border-b border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-20 px-5 md:px-8 py-4 flex items-center gap-3">
  <a href="index.html" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200 transition shrink-0">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <div>
    <div class="text-[9px] font-extrabold tracking-widest text-primary-500 uppercase">NIGHT IELTS &middot; BÀI ĐƯỢC GIAO</div>
    <h1 id="lessonTitle" class="text-lg md:text-xl font-extrabold text-slate-800 mt-0.5">Đang tải...</h1>
  </div>
</header>

<main class="flex-1 flex items-center justify-center p-6">
  <div id="loadingBox" class="text-center">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primary-500 mb-4"></i>
    <p class="font-bold text-slate-500">Đang tải bài tập...</p>
  </div>

  <div id="app" class="hidden w-full max-w-lg">
    <div class="bg-white border-2 border-slate-100 rounded-[28px] p-7 md:p-9 shadow-[0_10px_30px_rgba(20,184,166,.08)] text-center">
      <div id="deadlineBadge" class="hidden inline-flex items-center gap-1 text-[11px] font-black px-3 py-1 rounded-full mb-4"></div>

      <div class="w-16 h-16 mx-auto rounded-2xl bg-primary-50 text-primary-500 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-file-lines"></i>
      </div>
      <h2 id="cardTitle" class="text-xl font-extrabold text-slate-800 mt-4">—</h2>
      <p class="text-sm text-slate-400 font-semibold mt-1">Thầy Night đã giao bài này riêng cho bạn.</p>

      <a id="openLinkBtn" href="#" target="_blank" rel="noopener"
         class="mt-6 inline-flex items-center justify-center gap-2 w-full px-6 py-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-sm shadow-lg transition">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Mở bài tập
      </a>

      <div id="notDoneBox" class="mt-4">
        <p class="text-[12px] text-slate-400 font-semibold mb-3">Làm xong rồi thì quay lại đây bấm nút bên dưới nhé.</p>
        <button id="markDoneBtn" class="w-full px-6 py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-sm shadow-md transition">
          ✅ Đánh dấu đã hoàn thành
        </button>
      </div>

      <div id="doneBox" class="hidden mt-4 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4">
        <p class="text-emerald-700 font-extrabold text-sm"><i class="fa-solid fa-circle-check mr-1"></i> Đã hoàn thành!</p>
        <button id="unmarkDoneBtn" class="mt-2 text-[11px] font-bold text-slate-400 hover:text-slate-600 underline">Bỏ đánh dấu (nếu bấm nhầm)</button>
      </div>
    </div>
  </div>

  <div id="errorBox" class="hidden text-center px-6">
    <i class="fa-solid fa-triangle-exclamation text-4xl text-rose-500 mb-4"></i>
    <p id="errorMsg" class="font-bold text-rose-600">Có lỗi xảy ra.</p>
    <a href="index.html" class="inline-block mt-5 px-6 py-2.5 bg-slate-800 text-white rounded-full font-bold text-sm">Quay lại trang chủ</a>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8",
    authDomain: "night-ielts-land.firebaseapp.com",
    databaseURL: "https://night-ielts-land-default-rtdb.firebaseio.com",
    projectId: "night-ielts-land",
    storageBucket: "night-ielts-land.firebasestorage.app",
    messagingSenderId: "408519436407",
    appId: "1:408519436407:web:a9f0b9ba23368b54427e72",
    measurementId: "G-H3P14NJR76"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const taskId = new URLSearchParams(window.location.search).get('id');
  const docRef = taskId ? doc(db, "assignments", taskId) : null;

  function showError(msg){
    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('errorBox').classList.remove('hidden');
    document.getElementById('errorMsg').textContent = msg;
  }

  function renderDoneState(isDone){
    document.getElementById('notDoneBox').classList.toggle('hidden', isDone);
    document.getElementById('doneBox').classList.toggle('hidden', !isDone);
  }

  (async function boot(){
    if(!docRef){ showError('Không tìm thấy ID bài tập trong đường dẫn.'); return; }
    let snap;
    try{
      snap = await getDoc(docRef);
    }catch(e){
      console.error(e);
      showError('Lỗi kết nối máy chủ. Kiểm tra lại mạng và thử tải lại trang.');
      return;
    }
    if(!snap.exists()){
      showError('Bài tập không tồn tại hoặc đã bị xoá.');
      return;
    }
    const data = snap.data();
    if(!data.link){
      showError('Bài tập này không hợp lệ (thiếu đường dẫn file).');
      return;
    }

    document.getElementById('lessonTitle').textContent = data.title || 'Bài tập';
    document.getElementById('cardTitle').textContent = data.title || 'Bài tập';
    document.getElementById('openLinkBtn').href = data.link;

    if (data.deadlineAt) {
      const dlStr = new Date(data.deadlineAt).toLocaleDateString('vi-VN');
      const overdue = Date.now() > data.deadlineAt;
      const badge = document.getElementById('deadlineBadge');
      badge.classList.remove('hidden');
      badge.classList.add(overdue ? 'bg-red-50' : 'bg-slate-100');
      badge.classList.add(overdue ? 'text-red-500' : 'text-slate-500');
      badge.innerHTML = (overdue ? '<i class="fa-solid fa-triangle-exclamation"></i> Đã quá hạn nộp (' + dlStr + ')' : '<i class="fa-regular fa-clock"></i> Hạn nộp: ' + dlStr);
    }

    renderDoneState(data.completed === true);

    document.getElementById('loadingBox').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    document.getElementById('markDoneBtn').addEventListener('click', async () => {
      const btn = document.getElementById('markDoneBtn');
      btn.disabled = true; btn.innerText = 'Đang lưu...';
      try{
        await updateDoc(docRef, { completed: true, percent: 100, completedAt: Date.now() });
        renderDoneState(true);
      }catch(e){
        console.error(e);
        alert('Không lưu được, thử lại nhé.');
        btn.disabled = false; btn.innerText = '✅ Đánh dấu đã hoàn thành';
      }
    });

    document.getElementById('unmarkDoneBtn').addEventListener('click', async () => {
      try{
        await updateDoc(docRef, { completed: false, percent: 0 });
        renderDoneState(false);
      }catch(e){
        console.error(e);
        alert('Không lưu được, thử lại nhé.');
      }
    });
  })();
</script>
</body>
</html>
