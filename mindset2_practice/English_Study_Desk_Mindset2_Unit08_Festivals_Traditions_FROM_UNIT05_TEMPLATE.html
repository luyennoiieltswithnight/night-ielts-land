// Helper for Tag Colors
function getTagStyle(type) {
    const t = type.toLowerCase();
    if (t.includes('noun')) return 'bg-blue-100 text-blue-700 border-blue-200';
    if (t.includes('verb')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
    if (t.includes('adjective') || t.includes('adj')) return 'bg-amber-100 text-amber-700 border-amber-200';
    if (t.includes('adverb')) return 'bg-orange-100 text-orange-700 border-orange-200';
    if (t.includes('phrase') || t.includes('chunk')) return 'bg-purple-100 text-purple-700 border-purple-200';
    if (t.includes('clause') || t.includes('linker') || t.includes('marker')) return 'bg-rose-100 text-rose-700 border-rose-200';
    return 'bg-slate-100 text-slate-600 border-slate-200';
}

let audioUnlocked = false;
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance(' '); dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
    }
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function save(){localStorage.setItem('esd_u08_mastered_full',JSON.stringify(state.mastered));}

function englishVoices(){return voices.filter(v=>/en(-|_)/i.test(v.lang))}

function loadVoices(){
    voices=speechSynthesis.getVoices()||[];
    const s=document.getElementById('voiceSelect');
    if(!s)return;
    const vs = englishVoices();
    s.innerHTML = vs.length ? vs.map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`).join('') : '<option>System Voice</option>';
    
    // Priority: Saved Global -> Google US -> en-US -> Fallback
    let savedGlobal = localStorage.getItem('global_audio_voice_id');
    let best = vs.find(v => v.name === savedGlobal) || 
               vs.find(v => v.name.includes('Google US English')) || 
               vs.find(v => v.lang === 'en-US') || vs[0];
    
    if(best) {
        s.value = best.name;
        // Mock global save
        if(!savedGlobal) localStorage.setItem('global_audio_voice_id', best.name);
    }
}
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged=loadVoices;
    setTimeout(loadVoices,250);
}

function updateGlobalVoice(name) {
    localStorage.setItem('global_audio_voice_id', name);
    previewVoice();
}

function previewVoice() {
    speak("The sport grew in popularity after it became legal.", 1);

function speak(text,rate=1){
    if(!('speechSynthesis'in window))return;
    const playUtterance = () => {
        const u=new SpeechSynthesisUtterance(text);
        u.lang='en-US'; u.rate=rate; u.pitch=1;
        const globalVoiceName = localStorage.getItem('global_audio_voice_id');
        const v = voices.find(x => x.name === globalVoiceName) || voices.find(x=>x.name===document.getElementById('voiceSelect')?.value) || englishVoices()[0];
        if(v) u.voice=v;
        speechSynthesis.speak(u);
    };
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); setTimeout(playUtterance, 100); } 
    else playUtterance();
}

function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,d=.06,vol=.03, type='sine'){
    try{
        const c=ac(),o=c.createOscillator(),g=c.createGain();
        o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+d);
    }catch(e){}
}
function completeSound(){[523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80))}
function errorSound(){beep(150, 0.15, 0.05, 'sawtooth');}
function fireworks(){const r=document.getElementById('practiceBurst')||document.getElementById('fireworks');r.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,rad=80+Math.random()*180;s.className='spark';s.style.left=(42+Math.random()*16)+'%';s.style.top=(32+Math.random()*24)+'%';s.style.background=['#0ea5e9','#38bdf8','#99f6e4','#0d9488','#7dd3fc'][i%5];s.style.setProperty('--dx',Math.cos(a)*rad+'px');s.style.setProperty('--dy',Math.sin(a)*rad+'px');r.appendChild(s)}setTimeout(()=>r.innerHTML='',1200)}

function getActiveList() {
    return contentBank[state.tab] || [];
}
function current(){
    const l = getActiveList();
    const item = l[state.practiceIndex] || l[0];
    return {
        target: state.practiceType === 'phrase' ? item.phrase : item.sentence,
        promptVi: state.practiceType === 'phrase' ? item.meaningVi : (sentenceTranslations[item.id] || item.meaningVi),
        audioText: state.practiceType === 'phrase' ? item.phrase : item.sentence,
        skill: state.tab.toUpperCase()
    };
}
function normalizeSpaces(str) { return str.replace(/\s+/g, ' '); }

function handleKeyInput(e) {
    if(state.completed || state.revealed) return;
    const c=current();
    const targetStr=normalizeSpaces(c.target);
    const typedStr=normalizeSpaces(e.target.value);
    
    let isValid = true;
    let errIdx = -1;
    for(let i=0; i<typedStr.length; i++) {
        if(typedStr[i].toLowerCase() !== targetStr[i]?.toLowerCase()) {
            isValid = false;
            errIdx = i;
            break;
        }
    }

    if(!isValid) {
        errorSound();
        e.target.value = typedStr.substring(0, errIdx); // Reject the wrong character completely
        state.input = e.target.value;
        state.errorIndex = errIdx; // Trigger visual shake
        updateTyping();
        
        // Auto-clear the error visual so user doesn't need to backspace
        clearTimeout(window.errorTimer);
        window.errorTimer = setTimeout(() => {
            state.errorIndex = -1;
            updateTyping();
        }, 350);
        return;
    }

    state.errorIndex = -1;
    state.input = typedStr;
    if (state.hintActive && typedStr.length >= state.hintEndIndex) {
        state.hintActive = false;
    }
    
    if(typedStr.length > 0){ beep(620+Math.min(typedStr.length,12)*24,.055,.022); }

    if(typedStr.toLowerCase() === targetStr.toLowerCase()){
        state.completed = true;
        state.revealed = true;
        state.input = c.target;
        e.target.value = c.target;
        if(!state.mastered.includes(c.target)) state.mastered.push(c.target);
        save();
        completeSound();
        setTimeout(fireworks,60);
    }
    updateTyping();
}

function giveHint() {
    if(state.completed || state.revealed) return;
    const c = current();
    const targetStr = normalizeSpaces(c.target);
    if(state.input.length < targetStr.length) {
        let startIdx = state.input.length;
        if (targetStr[startIdx] === ' ') startIdx++;
        let nextSpace = targetStr.indexOf(' ', startIdx);
        if (nextSpace === -1) nextSpace = targetStr.length;
        
        state.hintActive = true;
        state.hintEndIndex = nextSpace; // New state var
        updateTyping();
        setTimeout(() => document.getElementById('hiddenInput')?.focus(), 50);
    }
}

function updateTyping(){
    const c=current();
    const targetStr=normalizeSpaces(c.target);
    const typedStr=state.input;
    const totalLetters=targetStr.length;
    
    // VISUAL TEXT GENERATOR (Masking & Underlines)
    const visualBox = document.getElementById('visualInputBox');
    if (visualBox) {
        let html = '';
        for(let i=0; i<targetStr.length; i++) {
            let actualChar = targetStr[i];
            let isSpace = actualChar === ' ';
            let displayChar = isSpace ? '&nbsp;' : '*'; // Default mask
            
            if (i < typedStr.length) {
                // Typed correctly
                html += `<span class="char-box char-typed">${isSpace ? '&nbsp;' : typedStr[i]}</span>`;
            } else if (i === state.errorIndex) {
                // Wrong attempt at this pos
                html += `<span class="char-box char-error">${isSpace ? '&nbsp;' : actualChar}</span>`;
            } else if (state.hintActive && i >= typedStr.length && i < state.hintEndIndex) {
                // Hinting word
                html += `<span class="char-box char-hint">${actualChar}</span>`;
            } else {
                // Unrevealed state
                if (state.revealed || state.completed) {
                    html += `<span class="char-box char-untyped" style="border-bottom-color: transparent;">${isSpace ? '&nbsp;' : actualChar}</span>`;
                } else {
                    // Masked
                    html += `<span class="char-box char-untyped"><span class="char-masked">${displayChar}</span></span>`;
                }
            }
        }
        visualBox.innerHTML = html;
    }

    // PASTEL MINT BOTTOM PROGRESS BAR
    const progressBar = document.getElementById('purpleProgressBar');
    if (progressBar) {
        const percentage = (typedStr.length / totalLetters) * 100;
        progressBar.style.width = percentage + '%';
        if (state.completed) {
            progressBar.classList.replace('bg-primary-500', 'bg-emerald-500');
        } else {
            progressBar.classList.replace('bg-emerald-500', 'bg-primary-500');
        }
    }

    const wrapper = document.getElementById('inputWrapper');
    if(wrapper){
        if(state.completed) wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-200 rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.1)] text-emerald-800 cursor-text overflow-hidden transition-all duration-300";
        else if(state.revealed) wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl shadow-card cursor-text overflow-hidden transition-all duration-300";
        else wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-primary-100 rounded-2xl shadow-card cursor-text focus-within:border-primary-400 focus-within:shadow-[0_10px_30px_rgba(139,92,246,0.15)] transition-all duration-300 overflow-hidden group";
    }

    const hiddenInp = document.getElementById('hiddenInput');
    if(hiddenInp){
        hiddenInp.value = state.input;
        hiddenInp.disabled = state.completed || state.revealed;
    }
    
    const fb = document.getElementById('typingFeedback');
    if(fb){
        if(state.completed) fb.innerHTML='<span class="text-emerald-600 font-extrabold flex items-center justify-center gap-1">✓ Excellent!</span>';
        else if(state.revealed) fb.innerHTML=`<span class="text-slate-500 font-bold">Answer revealed. Listen and review.</span>`;
        else fb.innerHTML=`<span class="text-primary-600/80 font-bold tracking-widest text-[10px] uppercase">Type the hidden answer</span>`;
    }
}

function setViewMode(m) {
    state.viewMode = m;

function next(){
    const l=getActiveList();
    state.practiceIndex=(state.practiceIndex+1)%l.length;
    reset();
}
function prev(){
    const l=getActiveList();
    state.practiceIndex=(state.practiceIndex-1+l.length)%l.length;
    reset();
}
function retryItem(){
    state.input='';state.revealed=false;state.completed=false;state.hintActive=false;state.hintEndIndex=-1;state.errorIndex=-1;
    updateTyping();
    setTimeout(()=>document.getElementById('hiddenInput')?.focus(), 50);
}

function reveal(){state.revealed=true;state.completed=false;state.input=current().target;state.hintActive=false;state.errorIndex=-1;updateTyping();}
function reset(){
    state.input='';state.revealed=false;state.completed=false;state.hintActive=false;state.hintEndIndex=-1;state.errorIndex=-1;
    render();
    // Auto-play audio upon loading item
    speak(current().audioText, 1);

}

            </div>
            <div class="flex flex-wrap gap-2 p-1.5 bg-white border border-primary-100 rounded-[20px] shadow-sm">
              <button onclick="changeType('phrase')" class="px-6 py-3 rounded-2xl text-[13px] font-extrabold transition-all duration-200 ${state.practiceType==='phrase'?'bg-primary-50 text-primary-700 shadow-sm':'text-slate-500 hover:bg-slate-50'}">01. Phrases</button>
              <button onclick="changeType('sentence')" class="px-6 py-3 rounded-2xl text-[13px] font-extrabold transition-all duration-200 ${state.practiceType==='sentence'?'bg-primary-50 text-primary-700 shadow-sm':'text-slate-500 hover:bg-slate-50'}">02. Sentences</button>
            </div>
          </div>
          <section class="bg-white border border-primary-100/50 rounded-[36px] overflow-hidden relative shadow-card">
            <div id="practiceBurst" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
            <div class="px-8 py-5 border-b border-primary-50 flex justify-between items-center bg-white">
                <span class="text-[11px] font-extrabold tracking-widest text-slate-400">ITEM ${state.practiceIndex+1} / ${list.length}</span>
                <span class="px-4 py-1.5 rounded-xl bg-slate-50 border border-slate-100 text-slate-500 text-[10px] font-extrabold tracking-widest uppercase">Target Hidden</span>
            </div>
            
            <div class="p-8 md:p-12">
                <div class="text-center relative">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-primary-100/50 rounded-full animate-ping pointer-events-none"></div>
                    <button aria-label="Listen" onclick="speak('${esc(c.audioText)}',1); setTimeout(()=>document.getElementById('hiddenInput')?.focus(), 50);" class="relative w-24 h-24 rounded-full bg-slate-900 text-white flex items-center justify-center shadow-[0_12px_30px_rgba(15,23,42,0.35)] mx-auto hover:bg-slate-800 hover:scale-105 transition-all duration-300 z-10">
                        <span class="w-10 h-10 inline-block pl-1">${icon.play}</span>
                    </button>
                </div>
                
                <div class="mt-8 text-center">
                    <div class="text-[10px] font-extrabold tracking-widest uppercase text-primary-400/80 mb-2">${state.practiceType==='sentence'?'Full Full Vietnamese Sentence Meaning':'Meaning Clue'}</div>
                    <div class="text-xl md:text-2xl font-extrabold text-slate-800">${esc(c.promptVi)}</div>
                </div>

                <!-- The Input Element with MASKED logic and Pastel Mint Bottom Bar -->
                <div id="inputWrapper" class="relative w-full max-w-3xl mx-auto mt-10 bg-white border-2 border-primary-100 rounded-2xl shadow-sm cursor-text focus-within:border-primary-400 transition-all duration-300 overflow-hidden group" onclick="document.getElementById('hiddenInput')?.focus()">
                    <div id="visualInputBox" class="w-full text-center text-[26px] md:text-[32px] font-bold px-6 py-10 flex justify-center flex-wrap leading-[2.2]">
                        <!-- Visual characters injected by JS -->
                    </div>
                    <!-- Hidden real input capturing keystrokes -->
                    <input id="hiddenInput" value="${esc(state.input)}" oninput="handleKeyInput(event)" autocomplete="off" autocapitalize="off" spellcheck="false" class="absolute opacity-0 pointer-events-none w-full h-full top-0 left-0" ${state.completed||state.revealed?'disabled':''}>
                    
                    <!-- PASTEL MINT PROGRESS BAR -->
                    <div id="purpleProgressBar" class="absolute bottom-0 left-0 h-2 bg-primary-500 transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>

                <div id="typingFeedback" class="mt-6 text-center text-sm font-bold text-slate-400 h-6">Type exactly what you hear</div>
            </div>
            
            <div class="border-t border-primary-50 bg-white p-6 md:p-8 flex flex-wrap justify-between gap-4 items-center">
              <button onclick="prev()" class="px-6 py-3.5 rounded-2xl bg-white border-2 border-slate-100 text-[13px] font-extrabold text-slate-500 hover:border-slate-200 hover:bg-slate-50 transition">← Prev</button>
              <div class="flex flex-wrap gap-2.5 justify-center">
                <button onclick="speak('${esc(c.audioText)}',1); setTimeout(()=>document.getElementById('hiddenInput')?.focus(), 50);" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">${icon.volume}</span> Replay</button>
                <button onclick="retryItem()" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">${icon.rotate}</span> Redo</button>
                <button onclick="speak('${esc(c.audioText)}',.7); setTimeout(()=>document.getElementById('hiddenInput')?.focus(), 50);" class="px-6 py-3.5 rounded-2xl bg-slate-50 text-[13px] font-extrabold text-slate-700 flex items-center gap-2 hover:bg-slate-100 transition"><span class="w-4 h-4 text-slate-500">${icon.turtle}</span> Slow</button>
                ${!state.revealed?`<button onclick="giveHint()" class="px-6 py-3.5 rounded-2xl bg-primary-50 text-primary-700 text-[13px] font-extrabold hover:bg-primary-100 transition">Hint</button>`:''}
                ${!state.revealed?`<button onclick="reveal()" class="px-6 py-3.5 rounded-2xl bg-slate-100 text-slate-600 text-[13px] font-extrabold hover:bg-slate-200 transition">Reveal</button>`:''}
              </div>
              <button onclick="next()" class="px-10 py-3.5 rounded-2xl bg-slate-900 text-white text-[14px] font-extrabold shadow-lg hover:bg-slate-800 transition transform hover:-translate-y-0.5">Next →</button>
            </div>
          </section>
        </div>`;
    }
}

function render(){
    const content = state.tab === 'overview' ? overview() : skillView();
    document.getElementById('app').innerHTML=`<div class="min-h-screen flex">${nav()}<main class="flex-1 min-w-0 h-screen overflow-y-auto relative">${mobileTop()}${header()}<div class="max-w-[1400px] mx-auto p-5 md:p-8 lg:p-10 pb-28">${content}</div></main></div>`;
    loadVoices();
    if(state.viewMode === 'type') updateTyping(); // render initial state correctly
}

render();
</script>
</body>
</html>
