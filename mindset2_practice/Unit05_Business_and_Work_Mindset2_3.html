  modelAnswer: "The way people work has changed enormously over the last decade. While it used to be normal to commute to an office every day, an increasing number of employees now do their jobs from home instead, thanks to laptops, fast internet and smartphones. This shift brings clear benefits, but it also creates some new problems.\n\nThe biggest advantage of working from home is flexibility. Employees can organise their day around personal commitments, taking a short break whenever they need one, which is particularly valuable for parents or people who live a long way from their workplace. Because a laptop and an internet connection are often all that's required, staff can also apply for jobs with companies based anywhere in the world, rather than being limited to local employers.\n\nHome working also tends to reduce costs for both sides. Employees save money and time that would otherwise go towards commuting, while employers can spend less on office space and utilities. In addition, many people report feeling more comfortable and less stressed when working in a familiar environment.\n\nOn the other hand, working from home is not without its drawbacks. Office life provides regular social interaction, and without it, some employees — especially those who live alone — can start to feel isolated. Working at home also demands a good deal of self-discipline; without a manager or colleagues nearby, it is easy to get distracted or to blur the boundary between work and personal time, meaning people may end up working longer hours than they intended.\n\nIn conclusion, remote working offers real advantages in terms of flexibility and cost, but it can also lead to loneliness and a lack of self-discipline. Perhaps the ideal solution is a hybrid arrangement, combining a few days in the office with a few days at home, so that employees can enjoy the best of both worlds."

const transcripts = {
  t42: "Dr Lethbridge: Last week I covered employment topics such as contracts and income tax. Today, though, Dr Korpis and I want to look at something different — working for yourself. There are basically three routes people take: setting up a company, forming a partnership, or working as a sole trader. Each comes with its own legal and financial implications, so it's worth understanding the differences before choosing one.\n\nThe clearest distinction is around registration and tax. If you want to set up a limited liability company, you're legally required to register it with Companies House, the government body that oversees UK businesses. 'Limited liability' simply means that if the business runs into trouble and owes money, the owners only stand to lose what they've put into the business itself — not their personal savings or possessions — because in the eyes of the law, the company and its owners are separate. A sole trader, by contrast, doesn't need to register anything at all; you can just start trading. Partnerships sit somewhere in between: an unlimited (simple) partnership works much like being a sole trader, except there are two or more people sharing both the costs and the profits, whereas a limited liability partnership, or LLP, has to be registered just like a company. So, to sum up: with limited companies and LLPs, the business is legally separate from its owners, but with simple partnerships and sole traders, it isn't.\n\nThe other key difference comes down to money — both raising it and paying tax on it. Banks tend to trust registered companies more, so it's usually easier for a limited company to borrow money than it is for a sole trader. As for tax, companies pay corporation tax on their profits rather than income tax, and corporation tax rates are typically lower — which is one reason company structures can be more tax-efficient. Sole traders and partners, on the other hand, pay income tax on what they earn, and that rate can end up higher than corporation tax.",

  t43: "Dr Korpis: Thanks, Dr Lethbridge. Let's start with the sole trader — someone who runs a business entirely on their own. On the practical side, there's no need to register with Companies House, which also means a sole trader isn't legally treated the same way as a registered company. You can trade under pretty much any name you like without paying a fee, you don't need to register a business address, so working from home is perfectly fine, and there's no legal obligation to file financial accounts with Companies House either. All of this makes it by far the easiest and quickest way to get a business off the ground.\n\nBeing your own boss is another big draw — no one to answer to, full control over decisions, and you keep all your earnings rather than splitting them with a partner. That said, being a sole trader doesn't mean working entirely alone: you're still free to hire staff or contract other people, as long as you follow the relevant employment rules.\n\nOf course, there's a flip side too. As an employee, tax is deducted automatically from your salary each month, so you barely think about it. As a sole trader, though, you're self-employed, meaning you're responsible for tracking your own income, expenses and tax — which means filing an annual tax return that sets out what your business earned and spent over the year. On the plus side, you only pay tax on your profit after business expenses like travel, electricity or office supplies are deducted, so if you work from home, part of your electricity bill could genuinely count as a business cost.\n\nOne thing to watch for is that once your earnings pass a certain threshold, you move into a higher income-tax bracket — often higher than the corporation tax a company would pay. There's also 'unlimited liability' to consider: if you can't cover your business debts, your personal assets, including your house or car, could be at risk, since legally you and the business are one and the same. Finally, sole traders often find it hard to switch off — holidays and time away from work tend to be harder to come by than for someone in employment.\n\nThis route is especially common among skilled trades like builders, plumbers and electricians, and among people who naturally work solo, such as photographers or writers — though these days it's increasingly common among computer programmers, tutors and other professionals too. Overall, it remains one of the simplest ways to go into business for yourself.",

  t44: "Dr Lethbridge: Thank you. Now let's move on to partnerships — there are two types: a simple partnership and a limited liability partnership, or LLP. Setting up a simple partnership is just as easy as becoming a sole trader, with the one extra step of agreeing to go into business with someone else — that could be a married couple, close friends, or family members, for example a couple running a catering business together, or two mechanics leaving their jobs to open a garage. One clear benefit is that if one partner is ill or on holiday, the other can keep the business running, and partnerships also tend to find it easier than sole traders to secure a loan. Most partners start out with an informal understanding, though it's always safer to put a formal agreement in writing to head off future disputes.\n\nLike sole traders, each partner registers with the tax office as self-employed and files their own annual tax return. But because a simple partnership is unlimited, every partner shares responsibility for any debts — meaning personal assets are at risk if the business runs into financial trouble.\n\nAn LLP works a little differently. Partners still share income and expenses and pay tax individually, but — unlike a simple partnership — an LLP has to be formally registered with Companies House. That means at least two partners take on legal responsibility for the business, accounts and an annual return must be filed with Companies House, and getting these obligations wrong can even lead to prosecution, so it's important to understand exactly what's involved.\n\nLLPs particularly suit professionals who offer services — accountants, solicitors, consultants and financial advisers, for instance — partly because larger organisations often prefer to deal with a registered partnership or company rather than an informal one. An LLP gives partners the flexibility of a simple partnership while still protecting their personal assets — though if the partnership does well, its members will typically end up paying more tax overall than the owner of a limited company would.",

  t45: "Dr Korpis: Thanks, Dr Lethbridge. The final structure I want to cover is the limited liability company. Its owners are known as 'members' or 'shareholders', since they hold shares — units representing a portion of the company. Every business runs the risk of going bankrupt, meaning it can't pay its debts and has to close. With a limited company, as with an LLP, if the business fails, the owners only lose what they originally put in — not their personal property. That's the whole idea of 'limited liability': it caps how much of a business's debt can actually reach the owner personally. A sole trader doesn't have this protection — if their business goes under, their own house or belongings could be sold to cover the debts, because there's no legal separation between them and the business. With an LLP or limited company, however, only the business's own assets can be used to settle debts.\n\nJust like an LLP, a limited company must be registered with Companies House and have an official registered address where all company records are kept. Annual accounts and returns also have to be filed every year, so that anyone considering doing business with the company can check its financial position. There's more administration involved too — you need at least one shareholder and a managing director.\n\nOn tax, the company pays corporation tax on its profits, which works out considerably less than income tax once profits climb above roughly £50,000 — though if you also draw a salary from the company, that portion is taxed as personal income. As with the other structures, a tax assessment has to go to the tax office, but it's a corporation tax assessment rather than an income tax one, and shareholders must additionally file their own personal tax returns.\n\nBecause running a limited company involves a fair amount of complexity, it's generally worth getting advice from an accountant. Many people actually start out as sole traders and only convert to a limited company once the business has grown enough to justify it.",

  t46: "Dr Lethbridge: Let me pull all of this together. Setting up as a sole trader is cheap and simple — there's minimal admin, and you keep full control over every decision. The trade-off is that you could end up paying more tax than a limited company would, you're personally liable for any losses, and it can be harder to win valuable contracts without the protection of limited liability.\n\nPartnerships — whether simple or LLPs — bring more people into the decision-making process, which makes it easier to keep the business running if one partner is unavailable, and generally makes borrowing money more straightforward than for a sole trader. The downside is that liability is shared, which can complicate matters if partners disagree or the business needs to be wound up, and everything depends on partners trusting one another — if money problems arise, one partner could be left to deal with the fallout alone. One thing sole traders and partnerships do have in common, however, is tax: both must file an annual income tax return, treating each partner as an individual.\n\nComparing simple partnerships with LLPs specifically, LLPs are legally required to submit accounts and annual returns to Companies House, which simple partnerships don't have to do, and LLP partners' personal assets are protected from business debts, unlike in a simple partnership, where partners remain personally liable, just like sole traders.\n\nFinally, limited companies offer two clear advantages over both sole traders and partnerships: owners' liability is limited to business losses rather than personal ones, and because corporation tax usually undercuts income tax, the structure can also save money. The cost is more red tape — company accounts and an annual return must go to Companies House, and company records have to be kept at the registered address.",

  t47: "Dr Korpis: To wrap up, I'd like to run through three real-world style case studies showing these structures in practice, and suggest the best fit for each.\n\nFirst, Sanjay and Tanya want to launch a catering service delivering food to local businesses, taking daily orders and building an online ordering system, with plans to expand beyond their local area over time. Being a sole trader clearly isn't an option here, since there are two of them, so it comes down to a partnership or a limited company — the right choice depends on how much money they can raise and how many staff they'll need to prepare and deliver the food. Starting out as an LLP would probably suit them best, since it's typically easier to secure funding than as a simple partnership, and they could grow from there — outsourcing parts of the business like the website or deliveries at first, and later switching to a full limited company if they want to bring everything in-house and hire directly. The LLP route would let them focus more on growing the business early on, rather than getting bogged down in admin from day one.\n\nNext, Melissa and Jane are planning a website design service. Both studied software engineering and have worked as designers for major companies, so they already understand the field well, and Melissa's Master's in Business Administration gives her added confidence running the commercial side. They've saved over £3,000 for office space and £10,000 for equipment. Given their strong knowledge and experience, registering as a limited company and trading straight away would suit them well — they don't plan to hire anyone immediately, though the option is there later. Alternatively, they could start as a simple partnership and convert to a limited company as the business grows, but with their level of confidence and preparation, there's nothing stopping them from setting up the limited company from the outset.\n\nFinally, Barry is a keen motorbike rider with over five years' experience working for a courier company delivering parcels. He thinks he could do better working for himself. His employer currently supplies and maintains his bike, so going independent would mean buying and maintaining his own — not a problem, since he already owns three bikes personally. He's confident he can build up a client base through his existing contacts, but he's never been self-employed before, so he's unsure whether working as a sole trader is right for him. One option would be setting up a limited company with a family member acting purely as a 'sleeping partner' — someone who invests but doesn't get involved in running the business. He could also team up with other riders thinking of leaving the courier company, though he's not sure that arrangement would hold together long-term. On balance, the best route for Barry would be to start as a sole trader using his own bike, try it out for a year or two to see how it goes, and then decide later whether to convert to a limited company.",

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function attrJson(v){return esc(JSON.stringify(v));}
function nl2br(s){return esc(s).replace(/\n\n/g,'</p><p class="mt-4">').replace(/\n/g,'<br>');}
function speak(text,rate=1){
  if(!('speechSynthesis' in window) || !text) return;
  try{
    const synth = window.speechSynthesis;
    synth.cancel();
    setTimeout(()=>{
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang='en-GB'; u.rate=rate; u.pitch=1; u.volume=1;
      const v = voices.find(x=>x.voiceURI===state.voiceURI)
             || voices.find(x=>/^en-GB/i.test(x.lang))
             || voices.find(x=>/^en/i.test(x.lang))
             || voices[0];
      if(v) u.voice=v;
      u.onerror=()=>{};
      synth.speak(u);
    }, 60);
  }catch(e){}
}
function englishVoices(){ return voices.filter(v=>/^en/i.test(v.lang)); }
function loadVoices(){
  try{ voices = window.speechSynthesis.getVoices()||[]; }catch(e){ return; }
  const evs = englishVoices();
  if(!evs.length) return;
  if(!state.voiceURI || !evs.find(v=>v.voiceURI===state.voiceURI)){
    const best = evs.find(v=>/Google UK/i.test(v.name)) || evs.find(v=>/^en-GB/i.test(v.lang)) || evs.find(v=>/^en-US/i.test(v.lang)) || evs[0];
    if(best) state.voiceURI = best.voiceURI;
  }
  const sel = document.getElementById('voiceSelect');
  if(sel){
    sel.innerHTML = evs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===state.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  }
}

let selTranslateBtn=null;
function removeSelTranslateBtn(){ if(selTranslateBtn){ selTranslateBtn.remove(); selTranslateBtn=null; } }
function handleTextSelection(){
  setTimeout(()=>{
    const sel = window.getSelection ? window.getSelection() : null;
    const text = sel ? sel.toString().trim() : '';
    removeSelTranslateBtn();
    if(!text || text.length<2 || !sel.rangeCount) return;
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    if(!rect || (rect.width===0 && rect.height===0)) return;
    const btn = document.createElement('button');
    btn.id='selTranslateBtn';
    btn.innerHTML = `<span class="w-3.5 h-3.5 inline-flex">${icon.translate}</span> Dịch đoạn này`;
    btn.className = 'fixed z-[1000] px-3.5 py-2 rounded-xl bg-slate-900 text-white text-[11px] font-extrabold shadow-lg hover:bg-slate-800 flex items-center gap-1.5 whitespace-nowrap';
    btn.style.visibility = 'hidden';
    btn.style.top = '0px'; btn.style.left = '0px';
    btn.addEventListener('mousedown', e=>e.preventDefault());
    btn.addEventListener('click', ()=>{
      const url = 'https://translate.google.com/?sl=en&tl=vi&text='+encodeURIComponent(text)+'&op=translate';
      window.open(url, '_blank');
      removeSelTranslateBtn();
    });
    document.body.appendChild(btn);
    // position:fixed => toạ độ theo viewport (KHÔNG cộng scrollX/scrollY).
    // Căn giữa nút theo chiều ngang của vùng bôi đen, đặt ngay bên dưới; nếu không đủ chỗ thì lật lên trên.
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    let left = rect.left + rect.width/2 - bw/2;
    left = Math.min(Math.max(8, left), window.innerWidth - bw - 8);
    let top = rect.bottom + 8;
    if(top + bh > window.innerHeight - 8) top = rect.top - bh - 8;
    btn.style.left = left+'px'; btn.style.top = top+'px';
    btn.style.visibility = 'visible';
    selTranslateBtn = btn;
  },10);
}
document.addEventListener('mouseup', handleTextSelection);
document.addEventListener('touchend', handleTextSelection);
document.addEventListener('mousedown', e=>{ if(e.target.id!=='selTranslateBtn' && !e.target.closest?.('#selTranslateBtn')) removeSelTranslateBtn(); });

function fmtTime(s){ if(!isFinite(s)||s<0) s=0; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function updateAudioProgress(){
  const audio=document.getElementById('floatingAudio'), seek=document.getElementById('fpSeek');
  const cur=document.getElementById('fpCurrent'), dur=document.getElementById('fpDuration');
  if(!audio||!seek) return;
  if(isFinite(audio.duration) && audio.duration>0){

    seek.style.setProperty('--fp-progress', (audio.currentTime/audio.duration*100)+'%');
  }
  if(cur) cur.textContent = fmtTime(audio.currentTime);
  if(dur) dur.textContent = fmtTime(audio.duration);
}
function setPlayIcon(playing){ const el=document.getElementById('fpPlayIcon'); if(el) el.innerHTML = playing?icon.pause:icon.play; }
function playUnitAudio(src, title){

}
function toggleAudioPlay(){ const a=document.getElementById('floatingAudio'); if(!a||!a.src) return; if(a.paused) a.play().catch(()=>{}); else a.pause(); }

function skipAudio(sec){ const a=document.getElementById('floatingAudio'); if(a) a.currentTime=Math.max(0,Math.min((a.duration||0), a.currentTime+sec)); }
function setAudioRate(r){ const a=document.getElementById('floatingAudio'); if(a) a.playbackRate=parseFloat(r); }

function getActiveList(){ return vocabBank[state.tab] || []; }
function current(){
  const l = getActiveList();
  const item = l[state.practiceIndex] || l[0] || {phrase:'',meaningVi:'',sentence:'',sentenceVi:''};
  const isPhrase = state.practiceType === 'phrase';
  return {
    target: isPhrase ? item.phrase : item.sentence,
    promptVi: isPhrase ? item.meaningVi : item.sentenceVi,
    audioText: isPhrase ? item.phrase : item.sentence,
    kind: isPhrase ? 'PHRASE' : 'SENTENCE'
  };
}
function normalizeSpaces(str){ return String(str).replace(/\s+/g,' '); }
function resetPracticeState(){
  state.input=''; state.revealed=false; state.completed=false;
  state.hintActive=false; state.hintEndIndex=-1; state.errorIndex=-1;
}
function startTypeMode(){
  state.typeMode=true; state.practiceType='phrase'; state.practiceIndex=0;
  resetPracticeState(); render(); window.scrollTo({top:0,behavior:'smooth'});
  speak(current().audioText,1);
  setTimeout(()=>document.getElementById('hiddenInput')?.focus(),150);
}
function backFromType(){ state.typeMode=false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function changeType(t){
  state.practiceType=t; state.practiceIndex=0; resetPracticeState(); render();
  speak(current().audioText,1);
  setTimeout(()=>document.getElementById('hiddenInput')?.focus(),150);
}
function nextItem(){
  const l=getActiveList(); state.practiceIndex=(state.practiceIndex+1)%l.length; resetPracticeState(); render();
  speak(current().audioText,1);
  setTimeout(()=>document.getElementById('hiddenInput')?.focus(),150);
}
function prevItem(){
  const l=getActiveList(); state.practiceIndex=(state.practiceIndex-1+l.length)%l.length; resetPracticeState(); render();
  speak(current().audioText,1);
  setTimeout(()=>document.getElementById('hiddenInput')?.focus(),150);
}
function retryItem(){ resetPracticeState(); updateTyping(); setTimeout(()=>document.getElementById('hiddenInput')?.focus(),50); }
function revealItem(){
  state.revealed=true; state.completed=false; state.input=current().target;
  state.hintActive=false; state.errorIndex=-1; updateTyping();
}
function handleKeyInput(e){
  if(state.completed || state.revealed) return;
  const c=current();
  const targetStr=normalizeSpaces(c.target);
  const typedStr=normalizeSpaces(e.target.value);
  let isValid=true, errIdx=-1;
  for(let i=0;i<typedStr.length;i++){
    if(typedStr[i].toLowerCase() !== targetStr[i]?.toLowerCase()){ isValid=false; errIdx=i; break; }
  }
  if(!isValid){
    errorSound();
    e.target.value = typedStr.substring(0, errIdx);
    state.input = e.target.value;
    state.errorIndex = errIdx;
    updateTyping();
    clearTimeout(window.errorTimer);
    window.errorTimer = setTimeout(()=>{ state.errorIndex=-1; updateTyping(); }, 350);
    return;
  }
  state.errorIndex=-1;
  state.input=typedStr;
  if(state.hintActive && typedStr.length >= state.hintEndIndex) state.hintActive=false;
  if(typedStr.length>0) beep(620+Math.min(typedStr.length,12)*24,.055,.022);
  if(typedStr.toLowerCase() === targetStr.toLowerCase()){
    state.completed=true; state.revealed=true; state.input=c.target; e.target.value=c.target;
    if(!state.mastered.includes(c.target)) state.mastered.push(c.target);
    completeSound();
    setTimeout(fireworksBurst,60);
  }
  updateTyping();
}
function giveHint(){
  if(state.completed || state.revealed) return;
  const c=current();
  const targetStr=normalizeSpaces(c.target);
  if(state.input.length < targetStr.length){
    let startIdx=state.input.length;
    if(targetStr[startIdx]===' ') startIdx++;
    let nextSpace=targetStr.indexOf(' ', startIdx);
    if(nextSpace===-1) nextSpace=targetStr.length;
    state.hintActive=true; state.hintEndIndex=nextSpace;
    updateTyping();
    setTimeout(()=>document.getElementById('hiddenInput')?.focus(),50);
  }
}
function updateTyping(){
  const c=current();
  const targetStr=normalizeSpaces(c.target);
  const typedStr=state.input;
  const totalLetters=targetStr.length;
  const visualBox=document.getElementById('visualInputBox');
  if(visualBox){
    let html='';
    for(let i=0;i<targetStr.length;i++){
      const actualChar=targetStr[i];
      const isSpace=actualChar===' ';
      const displayChar=isSpace?'&nbsp;':'*';
      if(i<typedStr.length){
        html+=`<span class="char-box char-typed">${isSpace?'&nbsp;':esc(typedStr[i])}</span>`;
      }else if(i===state.errorIndex){
        html+=`<span class="char-box char-error">${isSpace?'&nbsp;':esc(actualChar)}</span>`;
      }else if(state.hintActive && i>=typedStr.length && i<state.hintEndIndex){
        html+=`<span class="char-box char-hint">${esc(actualChar)}</span>`;
      }else if(state.revealed||state.completed){
        html+=`<span class="char-box char-untyped" style="border-bottom-color:transparent;">${isSpace?'&nbsp;':esc(actualChar)}</span>`;
      }else{
        html+=`<span class="char-box char-untyped"><span class="char-masked">${displayChar}</span></span>`;
      }
    }
    visualBox.innerHTML=html;
  }
  const progressBar=document.getElementById('purpleProgressBar');
  if(progressBar){
    progressBar.style.width=((typedStr.length/totalLetters)*100)+'%';
    progressBar.classList.remove(state.completed?'bg-primary-500':'bg-emerald-500');
    progressBar.classList.add(state.completed?'bg-emerald-500':'bg-primary-500');
  }
  const wrapper=document.getElementById('inputWrapper');
  if(wrapper){
    if(state.completed) wrapper.className="relative w-full max-w-3xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-200 rounded-2xl shadow-sm text-emerald-800 cursor-text overflow-hidden transition-all duration-300";
    else if(state.revealed) wrapper.className="relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl shadow-sm cursor-text overflow-hidden transition-all duration-300";
    else wrapper.className="relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-primary-100 rounded-2xl shadow-sm cursor-text focus-within:border-primary-400 transition-all duration-300 overflow-hidden group";
  }
  const hiddenInp=document.getElementById('hiddenInput');
  if(hiddenInp){ hiddenInp.value=state.input; hiddenInp.disabled=state.completed||state.revealed; }
  const fb=document.getElementById('typingFeedback');
  if(fb){
    if(state.completed) fb.innerHTML='<span class="text-emerald-600 font-extrabold">✓ Chính xác!</span>';
    else if(state.revealed) fb.innerHTML='<span class="text-slate-500 font-bold">Đáp án đã hiện — nghe lại và ôn tập.</span>';
    else fb.innerHTML='<span class="text-primary-600/80 font-bold tracking-widest text-[10px] uppercase">Nghe và gõ lại đúng như con nghe được</span>';
  }
}
function ac(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function beep(freq,d=.06,vol=.03,type='sine'){
  try{
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+d);
  }catch(e){}
}
function completeSound(){ [523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80)); }
function errorSound(){ beep(150,0.15,0.05,'sawtooth'); }
function fireworksBurst(){
  const r=document.getElementById('practiceBurst');
  if(!r) return;
  r.innerHTML='';
  for(let i=0;i<44;i++){
    const s=document.createElement('span');
    const a=Math.random()*Math.PI*2, rad=80+Math.random()*180;
    s.className='spark';
    s.style.left=(42+Math.random()*16)+'%'; s.style.top=(32+Math.random()*24)+'%';
    s.style.background=['#0ea5e9','#38bdf8','#99f6e4','#0d9488','#7dd3fc'][i%5];
    s.style.setProperty('--dx',Math.cos(a)*rad+'px');
    s.style.setProperty('--dy',Math.sin(a)*rad+'px');
    r.appendChild(s);
  }
  setTimeout(()=>{ if(r) r.innerHTML=''; },1200);
}
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked=true;
  try{
    if('speechSynthesis' in window){ const d=new SpeechSynthesisUtterance(' '); d.volume=0; window.speechSynthesis.speak(d); }
    if(!audioCtx && (window.AudioContext||window.webkitAudioContext)) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){}
}

function checkMCQ(qid, chosen, answer){
  const wrap = document.getElementById(`opts_${qid}`);
  [...wrap.children].forEach((btn,i)=>{
    btn.classList.remove('opt-correct','opt-wrong');
    btn.disabled = true;
    if(i===answer) btn.classList.add('opt-correct');
    else if(i===chosen) btn.classList.add('opt-wrong');
  });
  const note = document.getElementById(`note_${qid}`);
  if(note) note.classList.remove('hidden');
}
function fillBlankBlock(template, answers, prefix){
  let i=0;
  return template.replace(/\{(\d+):([^}]+)\}/g, (m,num)=>{
    const idx=i++;
    return `<input type="text" id="${prefix}_${idx}" data-idx="${idx}" class="blank-input w-24 md:w-28 px-1" placeholder="${idx+1}">`;
  });
}
function checkFillBlanks(prefix, answers, resultId){
  let correct=0;
  answers.forEach((ans,idx)=>{
    const el = document.getElementById(`${prefix}_${idx}`);
    if(!el) return;
    const val = el.value.trim().toLowerCase();
    const ok = val === ans.toLowerCase();
    el.classList.remove('blank-correct','blank-wrong');
    el.classList.add(ok?'blank-correct':'blank-wrong');
    if(ok) correct++;
  });
  const r = document.getElementById(resultId);
  if(r) r.innerHTML = `Đúng ${correct}/${answers.length}. ${correct<answers.length?'Các ô màu đỏ là đáp án chưa đúng — con thử lại nhé!':'🎉 Chính xác hết rồi!'}`;
}
function revealFillBlanks(prefix, answers){
  answers.forEach((ans,idx)=>{
    const el = document.getElementById(`${prefix}_${idx}`);
    if(el){ el.value = ans; el.classList.remove('blank-wrong'); el.classList.add('blank-correct'); }
  });
}

function checkTF(prefix, idx, chosen, answer){
  const wrap = document.getElementById(`${prefix}_${idx}`);
  const ok = chosen===answer;
  [...wrap.children].forEach(b=>b.disabled=true);
  wrap.children[chosen?0:1].classList.add(ok?'opt-correct':'opt-wrong');

}
let matchState = {};
function matchingBlock(pairs, id){
  matchState[id] = { picked:null, done:new Set() };
  const rightShuffled = pairs.map((p,i)=>({...p, idx:i})).sort(()=>Math.random()-0.5);
  return `<div class="grid md:grid-cols-2 gap-6" id="matchwrap_${id}">
    <div class="space-y-2.5">
      <div class="text-[10px] font-extrabold uppercase tracking-widest text-primary-400 mb-1">Cột A</div>
      ${pairs.map((p,i)=>`<button onclick="pickMatch('${id}','L',${i})" data-side="L" data-i="${i}" class="match-item w-full text-left px-4 py-3 rounded-xl border-2 border-slate-100 bg-slate-50 font-semibold text-sm text-slate-600">${i+1}. ${esc(p.phrase)}</button>`).join('')}
    </div>
    <div class="space-y-2.5">
      <div class="text-[10px] font-extrabold uppercase tracking-widest text-primary-400 mb-1">Cột B</div>
      ${rightShuffled.map((p,i)=>`<button onclick="pickMatch('${id}','R',${p.idx})" data-side="R" data-i="${p.idx}" class="match-item w-full text-left px-4 py-3 rounded-xl border-2 border-slate-100 bg-slate-50 font-semibold text-sm text-slate-600">${String.fromCharCode(65+i)}. ${esc(p.match)}</button>`).join('')}
    </div>
  </div>
  <div id="matchmsg_${id}" class="mt-4 text-xs font-bold text-slate-400"></div>`;
}
function pickMatch(id, side, i){
  const st = matchState[id];
  const wrap = document.getElementById(`matchwrap_${id}`);
  const btn = wrap.querySelector(`[data-side="${side}"][data-i="${i}"]`);
  if(st.done.has(i) && side==='L') return;
  if(!st.picked){ st.picked = {side, i}; btn.classList.add('match-selected'); return; }
  if(st.picked.side===side){
    wrap.querySelector(`[data-side="${side}"][data-i="${st.picked.i}"]`).classList.remove('match-selected');
    st.picked = {side, i}; btn.classList.add('match-selected'); return;
  }
  const li = st.picked.side==='L'? st.picked.i : i;
  const ri = st.picked.side==='R'? st.picked.i : i;
  const lBtn = wrap.querySelector(`[data-side="L"][data-i="${li}"]`);
  const rBtn = wrap.querySelector(`[data-side="R"][data-i="${ri}"]`);
  lBtn.classList.remove('match-selected'); rBtn.classList.remove('match-selected');
  if(li===ri){
    lBtn.classList.add('match-done'); rBtn.classList.add('match-done');
    lBtn.disabled=true; rBtn.disabled=true;
    st.done.add(li);
    document.getElementById(`matchmsg_${id}`).textContent = `Đã nối đúng ${st.done.size} cặp 🎉`;
  }else{
    lBtn.classList.add('opt-wrong'); rBtn.classList.add('opt-wrong');
    setTimeout(()=>{lBtn.classList.remove('opt-wrong'); rBtn.classList.remove('opt-wrong');},600);
  }
  st.picked=null;
}

function checkAllCaseStudies(){
  let correct=0, total=0;
  ex06CaseStudies.forEach((c,ci)=>{
    c.items.forEach((it,i)=>{
      total++;
      const el=document.getElementById(`ex06l_${ci}_${i}`);
      if(!el) return;
      const ok = el.value.trim().toLowerCase()===it.answer.toLowerCase();
      el.classList.remove('blank-correct','blank-wrong');
      el.classList.add(ok?'blank-correct':'blank-wrong');
      if(ok) correct++;
    });
  });
  document.getElementById('ex06lresult').textContent = `Đúng ${correct}/${total}.`;
}

}
function header(){
  return `<header class="hidden lg:flex h-[76px] bg-white/85 backdrop-blur-xl border-b border-primary-50 px-8 items-center justify-between sticky top-0 z-30">
    <div>
      <div class="text-[10px] font-extrabold tracking-widest text-slate-400 uppercase">Mindset for IELTS 2 · Unit 05</div>
      <h1 class="text-lg font-extrabold text-slate-800 mt-0.5">${esc((tabs.find(t=>t[0]===state.tab)||['','Reading'])[1])}</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Giọng đọc</span>
      ${voiceSelectHtml(false)}
      <button onclick="previewVoice()" class="text-[10px] font-extrabold uppercase tracking-wider bg-primary-100 text-primary-700 px-4 py-2.5 rounded-xl hover:bg-primary-200 transition">🔊 Preview</button>
    </div>
  </header>`;
}
function nav(){
  return `<aside class="hidden lg:flex w-[260px] shrink-0 bg-white border-r border-primary-50 flex-col h-screen sticky top-0 z-50">
    <div class="px-7 py-8 border-b border-primary-50">
      <div class="text-[10px] font-extrabold tracking-[.2em] text-primary-500 uppercase">Mindset for IELTS · Book 2</div>
      <div class="text-2xl font-extrabold text-slate-800 mt-1">Unit 05</div>
      <div class="text-sm font-bold text-slate-400 mt-1.5">Business and Work</div>
    </div>
    <div class="p-4 flex-1 space-y-1">
      ${tabs.map(t=>`<button onclick="setTab('${t[0]}')" class="w-full text-left px-4 py-3.5 rounded-2xl mb-1 flex items-center gap-3 transition duration-200 ${state.tab===t[0]?'nav-active':'text-slate-500 hover:bg-primary-50 hover:text-primary-600'}"><span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${state.tab===t[0]?'bg-white/20':'bg-primary-50 text-primary-500'}"><span class="w-[18px] h-[18px] inline-flex">${icon[t[2]]}</span></span><span class="text-[14px] font-extrabold">${t[1]}</span></button>`).join('')}
    </div>
    <div class="p-5 border-t border-primary-50 text-[10px] text-slate-400 font-semibold leading-relaxed">💡 Bôi đen bất kỳ đoạn tiếng Anh nào trong bài để hiện nút dịch nhanh sang tiếng Việt.</div>
  </aside>`;
}
function mobileTop(){
  return `<div class="lg:hidden sticky top-0 z-40 glass border-b border-primary-100 px-5 py-4 shadow-sm space-y-3">
    <div class="flex items-center justify-between">
      <div><div class="text-[9px] font-extrabold tracking-widest text-primary-600 uppercase">Mindset for IELTS 2</div><div class="font-extrabold text-slate-800 text-sm">Unit 05 · Business and Work</div></div>
      <select onchange="setTab(this.value)" class="text-xs font-bold text-primary-700 border border-primary-200 rounded-xl px-3 py-2 bg-primary-50">
        ${tabs.map(t=>`<option value="${t[0]}" ${state.tab===t[0]?'selected':''}>${t[1]}</option>`).join('')}
      </select>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-[9px] font-extrabold text-slate-400 uppercase tracking-wider shrink-0">Giọng đọc</span>
      ${voiceSelectHtml(true)}
      <button onclick="previewVoice()" class="text-[10px] font-extrabold uppercase bg-primary-100 text-primary-700 px-3 py-2 rounded-xl shrink-0">🔊</button>
    </div>
  </div>`;
}
function content(){
  if(state.typeMode) return typeView();
  switch(state.tab){
    case 'reading': return reading();
    case 'writing': return writing();
    case 'listening': return listening();
    case 'speaking': return speaking();
    default: return reading();
  }
}
function render(){
  document.getElementById('app').innerHTML = `<div class="min-h-screen flex">${nav()}<main class="flex-1 min-w-0">${mobileTop()}${header()}<div class="max-w-[1200px] mx-auto p-5 md:p-8 lg:p-10 pb-28">${content()}</div></main></div>`;
  loadVoices();
  if(state.typeMode) requestAnimationFrame(updateTyping);
}
render();
</script>
</body>
</html>
