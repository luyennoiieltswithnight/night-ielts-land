// Helper for Tag Colors
function getTagStyle(type) {
    const t = type.toLowerCase();
    if (t.includes('noun')) return 'bg-blue-100 text-blue-700 border-blue-200';
    if (t.includes('verb')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
    if (t.includes('adjective') || t.includes('adj')) return 'bg-amber-100 text-amber-700 border-amber-200';
    if (t.includes('adverb')) return 'bg-orange-100 text-orange-700 border-orange-200';
    if (t.includes('phrase') || t.includes('chunk')) return 'bg-purple-100 text-purple-700 border-purple-200';
    if (t.includes('clause') || t.includes('linker') || t.includes('marker')) return 'bg-rose-100 text-rose-700 border-rose-200';
    return 'bg-slate-100 text-slate-600 border-slate-200';
}

let audioUnlocked = false;
function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance(' '); dummy.volume = 0;
        window.speechSynthesis.speak(dummy);
    }
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function save(){localStorage.setItem('esd_u01_mastered_full',JSON.stringify(state.mastered));}

function englishVoices(){return voices.filter(v=>/en(-|_)/i.test(v.lang))}

function loadVoices(){
    voices=speechSynthesis.getVoices()||[];
    const s=document.getElementById('voiceSelect');
    if(!s)return;
    const vs = englishVoices();
    s.innerHTML = vs.length ? vs.map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`).join('') : '<option>System Voice</option>';
    
    // Priority: Saved Global -> Google US -> en-US -> Fallback
    let savedGlobal = localStorage.getItem('global_audio_voice_id');
    let best = vs.find(v => v.name === savedGlobal) || 
               vs.find(v => v.name.includes('Google US English')) || 
               vs.find(v => v.lang === 'en-US') || vs[0];
    
    if(best) {
        s.value = best.name;
        // Mock global save
        if(!savedGlobal) localStorage.setItem('global_audio_voice_id', best.name);
    }
}
if ('speechSynthesis' in window) {
    speechSynthesis.onvoiceschanged=loadVoices;
    setTimeout(loadVoices,250);
}

function updateGlobalVoice(name) {
    localStorage.setItem('global_audio_voice_id', name);
    previewVoice();
}

    speak("Many modern cities are largely man-made environments.", 1);
}

function speak(text,rate=1){
    if(!('speechSynthesis'in window))return;
    const playUtterance = () => {
        const u=new SpeechSynthesisUtterance(text);
        u.lang='en-US'; u.rate=rate; u.pitch=1;
        const globalVoiceName = localStorage.getItem('global_audio_voice_id');
        const v = voices.find(x => x.name === globalVoiceName) || voices.find(x=>x.name===document.getElementById('voiceSelect')?.value) || englishVoices()[0];
        if(v) u.voice=v;
        speechSynthesis.speak(u);
    };
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); setTimeout(playUtterance, 100); } 
    else playUtterance();
}

function ac(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,d=.06,vol=.03, type='sine'){
    try{
        const c=ac(),o=c.createOscillator(),g=c.createGain();
        o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,c.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
        o.connect(g);g.connect(c.destination);
        o.start();o.stop(c.currentTime+d);
    }catch(e){}
}
function completeSound(){[523,659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.15,.05),i*80))}
function errorSound(){beep(150, 0.15, 0.05, 'sawtooth');}
function fireworks(){const r=document.getElementById('practiceBurst')||document.getElementById('fireworks');r.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('span'),a=Math.random()*Math.PI*2,rad=80+Math.random()*180;s.className='spark';s.style.left=(42+Math.random()*16)+'%';s.style.top=(32+Math.random()*24)+'%';s.style.background=['#ec4899','#f472b6','#fbcfe8','#8b5cf6','#0284c7'][i%5];s.style.setProperty('--dx',Math.cos(a)*rad+'px');s.style.setProperty('--dy',Math.sin(a)*rad+'px');r.appendChild(s)}setTimeout(()=>r.innerHTML='',1200)}

// ============================================================================
// 4. TYPING ENGINE LOGIC (MASKED ANSWER + PINK PROGRESS BAR)
// ============================================================================
function getActiveList() {
    return contentBank[state.tab] || [];
}
function current(){
    const l = getActiveList();
    const item = l[state.practiceIndex] || l[0];
    return {
        target: state.practiceType === 'phrase' ? item.phrase : item.sentence,
        promptVi: state.practiceType === 'phrase' ? item.meaningVi : (item.sentenceVi || item.meaningVi),
        audioText: state.practiceType === 'phrase' ? item.phrase : item.sentence,
        skill: state.tab.toUpperCase()
    };
}
function normalizeSpaces(str) { return str.replace(/\s+/g, ' '); }

function handleKeyInput(e) {
    if(state.completed || state.revealed) return;
    const c=current();
    const targetStr=normalizeSpaces(c.target);
    const typedStr=normalizeSpaces(e.target.value);
    
    let isValid = true;
    let errIdx = -1;
    for(let i=0; i<typedStr.length; i++) {
        if(typedStr[i].toLowerCase() !== targetStr[i]?.toLowerCase()) {
            isValid = false;
            errIdx = i;
            break;
        }
    }

    if(!isValid) {
        errorSound();
        e.target.value = typedStr.substring(0, errIdx); // Reject the wrong character completely
        state.input = e.target.value;
        state.errorIndex = errIdx; // Trigger visual shake
        updateTyping();
        
        // Auto-clear the error visual so user doesn't need to backspace
        clearTimeout(window.errorTimer);
        window.errorTimer = setTimeout(() => {
            state.errorIndex = -1;
            updateTyping();
        }, 350);
        return;
    }

    state.errorIndex = -1;
    state.input = typedStr;
    if (state.hintActive && typedStr.length >= state.hintEndIndex) {
        state.hintActive = false;
    }
    
    if(typedStr.length > 0){ beep(620+Math.min(typedStr.length,12)*24,.055,.022); }

    if(typedStr.toLowerCase() === targetStr.toLowerCase()){
        state.completed = true;
        state.revealed = true;
        state.input = c.target;
        e.target.value = c.target;
        if(!state.mastered.includes(c.target)) state.mastered.push(c.target);
        save();
        completeSound();
        setTimeout(fireworks,60);
    }
    updateTyping();
}

function giveHint() {
    if(state.completed || state.revealed) return;
    const c = current();
    const targetStr = normalizeSpaces(c.target);
    if(state.input.length < targetStr.length) {
        let startIdx = state.input.length;
        if (targetStr[startIdx] === ' ') startIdx++;
        let nextSpace = targetStr.indexOf(' ', startIdx);
        if (nextSpace === -1) nextSpace = targetStr.length;
        
        state.hintActive = true;
        state.hintEndIndex = nextSpace; // New state var
        updateTyping();
        setTimeout(() => document.getElementById('hiddenInput')?.focus(), 50);
    }
}

function updateTyping(){
    const c=current();
    const targetStr=normalizeSpaces(c.target);
    const typedStr=state.input;
    const totalLetters=targetStr.length;
    
    // VISUAL TEXT GENERATOR (Masking & Underlines)
    const visualBox = document.getElementById('visualInputBox');
    if (visualBox) {
        let html = '';
        for(let i=0; i<targetStr.length; i++) {
            let actualChar = targetStr[i];
            let isSpace = actualChar === ' ';
            let displayChar = isSpace ? '&nbsp;' : '*'; // Default mask
            
            if (i < typedStr.length) {
                // Typed correctly
                html += `<span class="char-box char-typed">${isSpace ? '&nbsp;' : typedStr[i]}</span>`;
            } else if (i === state.errorIndex) {
                // Wrong attempt at this pos
                html += `<span class="char-box char-error">${isSpace ? '&nbsp;' : actualChar}</span>`;
            } else if (state.hintActive && i >= typedStr.length && i < state.hintEndIndex) {
                // Hinting word
                html += `<span class="char-box char-hint">${actualChar}</span>`;
            } else {
                // Unrevealed state
                if (state.revealed || state.completed) {
                    html += `<span class="char-box char-untyped" style="border-bottom-color: transparent;">${isSpace ? '&nbsp;' : actualChar}</span>`;
                } else {
                    // Masked
                    html += `<span class="char-box char-untyped"><span class="char-masked">${displayChar}</span></span>`;
                }
            }
        }
        visualBox.innerHTML = html;
    }

    // PINK BOTTOM PROGRESS BAR
    const progressBar = document.getElementById('pinkProgressBar');
    if (progressBar) {
        const percentage = (typedStr.length / totalLetters) * 100;
        progressBar.style.width = percentage + '%';
        if (state.completed) {
            progressBar.classList.replace('bg-primary-500', 'bg-emerald-500');
        } else {
            progressBar.classList.replace('bg-emerald-500', 'bg-primary-500');
        }
    }

    const wrapper = document.getElementById('inputWrapper');
    if(wrapper){
        if(state.completed) wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-emerald-50 border-2 border-emerald-200 rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.1)] text-emerald-800 cursor-text overflow-hidden transition-all duration-300";
        else if(state.revealed) wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-slate-200 rounded-2xl shadow-card cursor-text overflow-hidden transition-all duration-300";
        else wrapper.className = "relative w-full max-w-3xl mx-auto mt-8 bg-white border-2 border-primary-100 rounded-2xl shadow-card cursor-text focus-within:border-primary-400 focus-within:shadow-[0_10px_30px_rgba(236,72,153,0.15)] transition-all duration-300 overflow-hidden group";
    }

    const hiddenInp = document.getElementById('hiddenInput');
    if(hiddenInp){
        hiddenInp.value = state.input;
        hiddenInp.disabled = state.completed || state.revealed;
    }
    
    const fb = document.getElementById('typingFeedback');
    if(fb){
        if(state.completed) fb.innerHTML='<span class="text-emerald-600 font-extrabold flex items-center justify-center gap-1">✓ Excellent!</span>';
        else if(state.revealed) fb.innerHTML=`<span class="text-slate-500 font-bold">Answer revealed. Listen and review.</span>`;
        else fb.innerHTML=`<span class="text-primary-600/80 font-bold tracking-widest text-[10px] uppercase">Type the hidden answer</span>`;
    }
}

// Navigation & Actions
function setTab(t){
    state.tab=t; 
    state.viewMode='learn'; 
    render();
}
function setViewMode(m) {
    state.viewMode = m;
    if (m === 'type') {
        state.practiceIndex = 0;
        state.practiceType = 'phrase';
        reset();
    }
    render();
}
function changeType(t){state.practiceType=t;state.practiceIndex=0;reset()}
function next(){
    const l=getActiveList();
    state.practiceIndex=(state.practiceIndex+1)%l.length;
    reset();
}
function prev(){
    const l=getActiveList();
    state.practiceIndex=(state.practiceIndex-1+l.length)%l.length;
    reset();
}
function retryItem(){
    state.input='';state.revealed=false;state.completed=false;state.hintActive=false;state.hintEndIndex=-1;state.errorIndex=-1;
    updateTyping();
    setTimeout(()=>document.getElementById('hiddenInput')?.focus(), 50);
}

function reveal(){state.revealed=true;state.completed=false;state.input=current().target;state.hintActive=false;state.errorIndex=-1;updateTyping();}
function reset(){
    state.input='';state.revealed=false;state.completed=false;state.hintActive=false;state.hintEndIndex=-1;state.errorIndex=-1;
    render();
    // Auto-play audio upon loading item
    speak(current().audioText, 1);
    setTimeout(()=>document.getElementById('hiddenInput')?.focus(),100);
}
