    <!-- Header dính (Sticky) -->
    <header class="glass-header sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <!-- Logo & Tên -->
                <div class="flex items-center gap-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-gradient-to-br from-brand-purple to-brand-pink rounded-2xl shadow-md flex items-center justify-center text-2xl text-white group-hover:rotate-12 group-hover:scale-110 transition-all duration-300">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">

                    <p class="text-sm font-bold text-gray-400">Thư mục</p>

                </div>
            </div>
            <!-- Card 2 -->
            <div class="bg-white p-5 rounded-3xl shadow-soft hover:shadow-md transition-shadow border border-gray-50 flex items-center gap-4">

                    <i class="fa-solid fa-file-signature"></i>
                </div>

            </div>
        </div>

        <!-- Main Content Area -->
        <div class="mt-10">
            
            <div class="space-y-6">

                        Kho Lưu Trữ

                </div>

                <!-- Thanh cuộn ngang chứa các Tabs (Mobile thân thiện) -->
                <div class="hide-scrollbar overflow-x-auto pb-2 -mx-4 px-4 sm:mx-0 sm:px-0">
                    <div class="flex gap-3" id="folder-tabs-container">
                        <!-- JS sẽ chèn Tabs vào đây -->
                    </div>
                </div>

                <!-- Khu vực danh sách bài test -->

    <!-- SCRIPT CHẠY GIAO DIỆN -->
    <script>
        // 1. Tính toán thống kê
        let totalTests = 0;
        LESSON_DATA.forEach(folder => totalTests += folder.tests.length);
        document.getElementById('total-tests').innerText = totalTests;
        document.getElementById('total-folders').innerText = LESSON_DATA.length;

        const tabsContainer = document.getElementById('folder-tabs-container');
        const testsContainer = document.getElementById('test-list-container');
        let currentFolderIndex = 0;

        // 2. Render Tabs (Nút bấm chọn thư mục)
        function renderFolders() {
            tabsContainer.innerHTML = '';
            LESSON_DATA.forEach((folder, index) => {
                const isActive = index === 0;
                
                // Style cho tab đang được chọn và không được chọn
                const baseClass = "flex-shrink-0 px-6 py-3 rounded-full cursor-pointer transition-all duration-300 font-bold whitespace-nowrap flex items-center gap-2 text-sm sm:text-base border-2";
                const activeClass = "bg-brand-purple border-brand-purple text-white shadow-md transform scale-105";
                const inactiveClass = "bg-white border-transparent text-gray-500 hover:bg-purple-50 hover:text-brand-purple";

                tabsContainer.innerHTML += `
                    <div class="folder-tab ${baseClass} ${isActive ? activeClass : inactiveClass}" 
                         onclick="changeFolder(${index}, this)">
                        <i class="${folder.icon}"></i> ${folder.name}
                    </div>
                `;
            });
            // Mặc định load nội dung folder đầu tiên
            renderTests(0);
        }

        // 3. Render Nội dung bài test bên trong Tab
        function renderTests(folderIndex) {
            const folder = LESSON_DATA[folderIndex];
            
            // Header của thư mục đang mở
            let html = `
                <div class="mb-6 pb-4 border-b border-gray-100 flex items-start gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-100 text-brand-purple flex items-center justify-center text-xl flex-shrink-0">
                        <i class="${folder.icon}"></i>
                    </div>
                    <div>
                        <h4 class="text-xl font-black text-gray-800">${folder.name}</h4>
                        <p class="text-gray-500 text-sm font-medium mt-1">${folder.description}</p>
                    </div>
                </div>
            `;

            if (folder.tests.length === 0) {
                // TRẠNG THÁI RỖNG (Empty State) Dễ thương
                html += `
                    <div class="flex flex-col items-center justify-center py-12 text-center animate-fade-in">
                        <div class="w-32 h-32 bg-gray-50 rounded-full flex items-center justify-center mb-4 relative">
                            <span class="text-6xl">🗂️</span>
                            <span class="absolute -bottom-2 -right-2 text-3xl">✨</span>
                        </div>
                        <h5 class="text-lg font-black text-gray-700 mb-2">Thư mục này đang trống</h5>
                        <p class="text-gray-400 font-medium mb-6">Chưa có bài kiểm tra nào được thêm vào đây.</p>
                        <button onclick="alert('Thêm test mới vào thư mục này')" class="px-6 py-2 bg-brand-pink text-white rounded-full font-bold hover:bg-pink-500 transition-colors shadow-sm">
                            + Thêm Test ngay
                        </button>
                    </div>
                `;
            } else {
                // DANH SÁCH TEST (Cards)
                html += `<div class="grid grid-cols-1 gap-4">`; // Bọc trong grid để các card cách đều
                
                folder.tests.forEach((test, idx) => {
                    // Dùng mảng màu pastel ngẫu nhiên cho icon bài test
                    const bgColors = ['bg-blue-100 text-blue-500', 'bg-green-100 text-green-500', 'bg-yellow-100 text-yellow-500', 'bg-pink-100 text-pink-500'];
                    const colorCombo = bgColors[idx % bgColors.length];

                    html += `
                        <div class="group bg-gray-50/50 hover:bg-white p-4 sm:p-5 rounded-2xl border border-gray-100 hover:border-brand-purple/30 transition-all duration-300 hover:shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 cursor-default relative overflow-hidden">
                            <!-- Vệt màu hover trang trí -->
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-brand-purple transform -translate-x-full group-hover:translate-x-0 transition-transform"></div>
                            
                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl flex-shrink-0 ${colorCombo}">
                                    <i class="fa-solid fa-file-lines"></i>
                                </div>
                                <div class="flex-1">
                                    <h5 class="font-bold text-gray-800 text-base sm:text-lg leading-tight group-hover:text-brand-purple transition-colors line-clamp-1">${test.title}</h5>
                                    <div class="flex items-center gap-3 mt-1.5 text-xs sm:text-sm font-semibold text-gray-400">
                                        <span class="flex items-center gap-1"><i class="fa-regular fa-calendar"></i> ${test.date}</span>
                                        <span class="w-1 h-1 rounded-full bg-gray-300"></span>
                                        <span class="flex items-center gap-1"><i class="fa-solid fa-list-ol"></i> ${test.questions} câu hỏi</span>
                                    </div>
                                </div>
                            </div>
                            
                            <a href="${test.link}" class="w-full sm:w-auto px-5 py-2.5 bg-white border-2 border-gray-100 text-gray-600 group-hover:bg-brand-purple group-hover:border-brand-purple group-hover:text-white rounded-xl font-bold text-sm text-center transition-all duration-300 shadow-sm flex-shrink-0">
                                Mở bài <i class="fa-solid fa-arrow-right ml-1 text-xs opacity-0 group-hover:opacity-100 transition-opacity transform group-hover:translate-x-1"></i>
                            </a>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }
            
            // Hiệu ứng fade in nhẹ khi đổi tab
            testsContainer.style.opacity = '0';
            setTimeout(() => {
                testsContainer.innerHTML = html;
                testsContainer.style.transition = 'opacity 0.3s ease';
                testsContainer.style.opacity = '1';
            }, 50);
        }

        // 4. Xử lý sự kiện click chuyển Tab
        function changeFolder(index, clickedElement) {
            if(currentFolderIndex === index) return;
            currentFolderIndex = index;

            // Xóa style Active ở tất cả tab
            const allTabs = document.querySelectorAll('.folder-tab');
            const baseClass = "flex-shrink-0 px-6 py-3 rounded-full cursor-pointer transition-all duration-300 font-bold whitespace-nowrap flex items-center gap-2 text-sm sm:text-base border-2";
            const inactiveClass = "bg-white border-transparent text-gray-500 hover:bg-purple-50 hover:text-brand-purple";
            
            allTabs.forEach(tab => {
                tab.className = `folder-tab ${baseClass} ${inactiveClass}`;
            });

            // Gắn style Active cho tab được click
            const activeClass = "bg-brand-purple border-brand-purple text-white shadow-md transform scale-105";
            clickedElement.className = `folder-tab ${baseClass} ${activeClass}`;

            // Render lại nội dung
            renderTests(index);
        }

        // Khởi chạy khi load trang
        renderFolders();
    </script>
</body>
