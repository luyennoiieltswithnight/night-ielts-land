<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nghe – Gõ · Night IELTS</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24242A">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--ink2:#34343C;--panel:#F4F4F7;--line:#EEEEF3;--mut:#6B6B78;--mut2:#9A9AA8;--lilac:#6C70DC;--lilac-l:#EDEEFD;--peach:#FF9E5E;--peach-l:#FFF1E7;--ac:#6C70DC;--ac-l:#EDEEFD;--ac-d:#4B4FC0}
body.zh{--ac:#C8102E;--ac-l:#FDECEE;--ac-d:#9E0B23}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9E9EF;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding:10px 10px calc(30px + env(safe-area-inset-bottom))}
button,input,textarea,select{font-family:inherit;color:inherit}
.zhf{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.frame{max-width:72rem;margin:0 auto;background:var(--ink);border-radius:28px;padding:6px;box-shadow:0 30px 70px -20px rgba(36,36,42,.55)}
header{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;color:#fff;flex-wrap:wrap}
header .home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;min-width:0}
header .logo{width:38px;height:38px;border-radius:999px;background:var(--ac);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,255,255,.1);flex:none}
header h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap}
header h1 small{display:block;font-size:11px;font-weight:600;color:#A9A9B8}
.seg{margin-left:auto;display:flex;background:var(--ink2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;color:#C9C9D6;font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink)}
.me{width:38px;height:38px;border-radius:999px;background:var(--ink2);border:0;color:#fff;cursor:pointer;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800}
.me img{width:100%;height:100%;object-fit:cover}
main{background:var(--panel);border-radius:22px;padding:18px}
@media(min-width:768px){main{padding:26px}}
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--ac);color:#fff;padding:22px 22px 24px;display:grid;gap:10px}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:999px;border:34px solid rgba(255,255,255,.12)}
.hero .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h2{margin:0;font-size:1.7rem;line-height:1.15;font-weight:800;max-width:30rem}
.hero p{margin:0;font-size:14px;line-height:1.55;opacity:.92;max-width:34rem}
/* big */ .hero .big{position:absolute;right:22px;bottom:10px;font-size:84px;font-weight:800;opacity:.16;line-height:1}
.hero .art{position:absolute;right:18px;bottom:0;height:88%;max-height:210px;width:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.hero .art2{position:absolute;right:190px;bottom:14px;height:44%;max-height:100px;width:auto;opacity:.95}
.hero h2,.hero p,.hero .k{position:relative;max-width:min(30rem,62%)}
@media(max-width:640px){.hero{padding-bottom:120px}.hero h2,.hero p,.hero .k{max-width:none}.hero .art{height:120px}.hero .art2{display:none}}
.lv .pic{position:absolute;right:10px;bottom:16px;height:84px;width:auto;opacity:.95;pointer-events:none}
.lv small{max-width:calc(100% - 80px)}
.lv .bar{margin-right:84px}
.empty img{height:120px;display:block;margin:0 auto 12px}
.drop.over{border-color:var(--ac);background:var(--ac-l);color:var(--ac)}
kbd{font:800 11px inherit;background:#fff;border:1px solid #D9D9E3;border-bottom-width:2px;border-radius:6px;padding:1px 6px}
@media(min-width:640px){.hero{padding:30px}.hero h2{font-size:2.2rem}}
.tabs{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;margin:18px 0 16px;overflow-x:auto;scrollbar-width:none;border:1.5px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;border:0;background:none;padding:11px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button.on{background:var(--ink);color:#fff}
@media(max-width:520px){.tabs button{padding:10px 8px;font-size:13px;gap:5px}.tabs button i{display:none}}
.h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:4px 2px 12px}
.h .dot{width:9px;height:9px;border-radius:99px;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lv{position:relative;text-align:left;border:0;cursor:pointer;background:#fff;border-radius:24px;padding:18px;min-height:150px;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);transition:transform .12s,border-color .12s}
.lv:hover{transform:translateY(-2px);border-color:#DCDDF6}
.lv .badge{width:52px;height:52px;border-radius:16px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.lv b{font-size:16px;margin-top:6px}
.lv small{color:var(--mut);font-size:12.5px;line-height:1.45}
.lv .bar{height:6px;background:var(--panel);border-radius:9px;overflow:hidden;margin-top:auto}
.lv .bar i{display:block;height:100%;border-radius:9px}
.lv .soon{position:absolute;right:14px;top:14px;font-size:11px;font-weight:800;background:var(--peach-l);color:#C2410C;padding:4px 10px;border-radius:99px}
.card{background:#fff;border-radius:24px;padding:18px;border:1.5px solid var(--line)}
@media(min-width:768px){.card{padding:22px}}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#fff;border:1.5px solid var(--line);margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.lesson:hover{border-color:#DCDDF6;background:#FAFAFE}
.lesson .n{width:40px;height:40px;border-radius:13px;background:var(--ac-l);color:var(--ac-d);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .t small{color:var(--mut);font-size:12px}
.lesson .go{width:34px;height:34px;border-radius:99px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none}
.lesson .del{border:0;background:none;color:#E11D48;width:32px;height:32px;border-radius:99px;cursor:pointer;flex:none}
.lesson .del:hover{background:#FFE4E6}
.back{border:0;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin-bottom:14px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin:18px 0 6px}
.lbl:first-child{margin-top:0}
.hint{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0 0 8px}
textarea,input[type=text],select{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14.5px;font-weight:500;outline:none;background:#fff;line-height:1.55}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--ac)}
textarea{min-height:170px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:99px;display:inline-block}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:99px;padding:13px 20px;font-weight:800;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff}
.btn.ac{background:var(--ac)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn.wide{width:100%}
.mode{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:99px;width:max-content;max-width:100%;margin-bottom:12px}
.mode button{border:0;background:none;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;color:var(--mut);cursor:pointer}
.mode button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(36,36,42,.08)}
.drop{border:2px dashed #D9D9E3;border-radius:18px;padding:16px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer;background:#FBFBFD}
.drop:hover{border-color:var(--ac);color:var(--ac)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs span{position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;background:var(--panel)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:99px;border:0;background:rgba(36,36,42,.75);color:#fff;font-size:11px;cursor:pointer}
.status{font-size:13px;line-height:1.5;margin-top:10px;min-height:18px}
.status.err{color:#E11D48}.status.ok{color:#047857}
.items{display:grid;gap:8px;margin-top:6px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:11px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff}
.it .lvb{font-size:11px;font-weight:800;color:#fff;border-radius:8px;padding:3px 7px;margin-top:2px}
.it b{font-size:14.5px}
.it .py{color:var(--ac-d);font-size:12.5px;font-weight:700}
.it .vi{color:var(--mut);font-size:12.5px}
.it .ex{font-size:13px;margin-top:4px;line-height:1.45}
.it .x{border:0;background:none;color:var(--mut2);cursor:pointer;width:28px;height:28px;border-radius:99px}
.it .x:hover{background:#FFE4E6;color:#E11D48}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:36px 16px;line-height:1.6}
.empty i{font-size:30px;color:#C9C9D6;display:block;margin-bottom:10px}
.two{display:grid;gap:14px}
@media(min-width:900px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
#player{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:2147483100;background:#E9E9EF;display:none;flex-direction:column}
#player.show{display:flex}
#player .bar{display:none;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--ink);color:#fff}
#player .bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#player .bar button{border:0;background:var(--ink2);color:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px}
#player iframe{flex:1;border:0;width:100%}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:3000;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.note{background:var(--peach-l);color:#9A3412;border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:10px}
.note a,.note button.lk{color:#C2410C;font-weight:800;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="frame">
  <header>
    <a class="home" href="index.html" title="Về trang chủ">
      <span class="logo"><i class="fa-solid fa-keyboard"></i></span>
      <h1>Nghe – Gõ<small>Night IELTS · nghe rồi gõ lại từng chữ</small></h1>
    </a>
    <div class="seg" role="tablist" aria-label="Ngôn ngữ">
      <button data-lang="en">English</button>
      <button data-lang="zh"><span class="zhf">中文</span></button>
    </div>
    <button class="me" id="meBtn" title="Tài khoản"><i class="fa-solid fa-user"></i></button>
  </header>
  <main>
    <section class="hero" id="hero"></section>
    <nav class="tabs" role="tablist">
      <button data-tab="courses"><i class="fa-solid fa-layer-group"></i>Khoá có sẵn</button>
      <button data-tab="create"><i class="fa-solid fa-wand-magic-sparkles"></i>Tự tạo bằng AI</button>
      <button data-tab="mine"><i class="fa-solid fa-bookmark"></i>Bài của tôi</button>
    </nav>
    <section id="view"></section>
  </main>
</div>

<div id="player"><div class="bar"><button id="pClose"><i class="fa-solid fa-arrow-left"></i>Thoát</button><b id="pTitle"></b></div><iframe id="pFrame" title="Bài luyện" allow="autoplay"></iframe></div>

<script src="luyengo/engine-en.js?v=20261110"></script>
<script src="luyengo/engine-zh.js?v=20261110"></script>
<script src="luyengo/from-course.js"></script>
<script src="night-login.js"></script>
<script src="night-plan.js?v=20261112a"></script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import * as A from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, updateDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const app = getApps().length ? getApp() : initializeApp({
  apiKey: 'AIzaSyCmeN49M4oI78ZPWDhMlbisDOLaMJp2mb8', authDomain: 'night-ielts-land.firebaseapp.com', projectId: 'night-ielts-land',
  storageBucket: 'night-ielts-land.firebasestorage.app', messagingSenderId: '408519436407', appId: '1:408519436407:web:a9f0b9ba23368b54427e72'
});
const auth = A.getAuth(app), db = getFirestore(app);

/* ---------- Cấu hình theo ngôn ngữ ---------- */
const LEVELS = {
  en: [['A1', '#10B981', 'green', 'Mới bắt đầu · từ quen thuộc hằng ngày'], ['A2', '#0EA5E9', 'blue', 'Sơ cấp · sinh hoạt, mua sắm, đi lại'], ['B1', '#6C70DC', 'indigo', 'Trung cấp · kể chuyện, nêu ý kiến'], ['B2', '#A855F7', 'violet', 'Trên trung cấp · IELTS 5.5–6.5'], ['C1', '#FF9E5E', 'orange', 'Nâng cao · IELTS 7.0+'], ['C2', '#E11D48', 'red', 'Thành thạo · học thuật, sắc thái']],
  zh: [['HSK1', '#10B981', 'green', '150 từ · chào hỏi, số đếm'], ['HSK2', '#0EA5E9', 'blue', '300 từ · đời sống hằng ngày'], ['HSK3', '#6C70DC', 'indigo', '600 từ · học tập, công việc'], ['HSK4', '#A855F7', 'violet', '1200 từ · bàn luận chủ đề rộng'], ['HSK5', '#FF9E5E', 'orange', '2500 từ · báo chí, phim ảnh'], ['HSK6', '#E11D48', 'red', '5000 từ · diễn đạt trôi chảy']]
};
const LESSONS_PER_COURSE = 20;
const IRA = 'khoahoc/img/ira/', ira = (n, cls) => `<img class="${cls || ''}" src="${IRA}${n}.webp" alt="" loading="lazy">`;
const LV_PIC = { A1: 'book_sakubun_kodomo_girl', A2: 'travel_people_pamphlet_0671', B1: 'communication_hanashiai_0612', B2: 'ryugakusei_woman', C1: 'daigakusei_woman_3256', C2: 'tensai_girl_8342',
  HSK1: 'zh_student', HSK2: 'food_ramen_4738', HSK3: 'norimono_panda_girl_5774', HSK4: 'zh_teacher', HSK5: 'zh_dragon', HSK6: 'character_hakase_9678' };
const T = {
  en: { name: 'Tiếng Anh', k: 'English · Listening Type', h: 'Nghe một lần, gõ lại từng chữ', p: 'Học từ và câu theo trình độ A1 → C2, hoặc dán bài đọc / chụp ảnh trang sách để AI lọc từ đúng trình độ của bạn.', big: 'Aa', art: 'study_english_ondoku_6827', art2: 'music_earphone_canal_2571' },
  zh: { name: 'Tiếng Trung', k: '中文 · 听写打字', h: 'Nghe rồi gõ pinyin từng chữ', p: 'Học từ và câu theo HSK 1 → 6, hoặc dán đoạn văn / chụp ảnh trang sách để AI lọc từ đúng cấp HSK bạn chọn.', big: '听', art: 'norimono_panda_girl_5774', art2: 'zh_dragon' }
};
const lvInfo = (lang, code) => LEVELS[lang].find(l => l[0] === code) || LEVELS[lang][0];

/* ---------- Trạng thái ---------- */
const S = { prog: {}, lang: 'en', tab: 'courses', course: null, nv: null, nvList: {}, udoc: null, user: null, role: 'guest', courses: {}, mine: null,
  mode: 'ai', text: '', imgs: [], levels: [], result: null, title: '', busy: false, status: '', statusCls: '', target: '' };
try { const q = new URLSearchParams(location.search); if (q.get('lang') === 'zh' || q.get('course') === 'tiengtrung') S.lang = 'zh'; if (['courses', 'create', 'mine'].includes(q.get('tab'))) S.tab = q.get('tab'); } catch (e) {}
try { if (!new URLSearchParams(location.search).get('lang')) S.lang = localStorage.getItem('luyengo-lang') === 'zh' ? 'zh' : S.lang; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isAdmin = () => S.role === 'admin';
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function needLogin(note) { NightLogin.open({ auth, authM: A, note: note || 'Đăng nhập để lưu bài và dùng AI tạo bài luyện.' }); }

/* ---------- Khung chung ---------- */
function renderShell() {
  document.body.classList.toggle('zh', S.lang === 'zh');
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.lang === S.lang));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const t = T[S.lang];
  $('#hero').innerHTML = `<span class="k">${t.k}</span><h2>${t.h}</h2><p>${t.p}</p>${ira(t.art2, 'art2')}${ira(t.art, 'art')}`;
  render();
}
function render() {
  const v = $('#view');
  if (S.tab === 'courses') v.innerHTML = S.course ? courseView() : coursesView();
  else if (S.tab === 'create') v.innerHTML = createView();
  else v.innerHTML = mineView();
  bind();
}

/* ---------- Khoá có sẵn ---------- */
async function loadCourses(force) {
  const lang = S.lang;
  if (S.courses[lang] && !force) return;
  S.courses[lang] = S.courses[lang] || {};
  try {
    const snap = await getDocs(query(collection(db, 'typeCourses'), where('lang', '==', lang)));
    const m = {}; snap.forEach(d => { m[d.data().level] = Object.assign({ id: d.id }, d.data()); });
    S.courses[lang] = m;
  } catch (e) { console.warn('typeCourses', e); }
  if (S.lang === lang && S.tab === 'courses') render();
}
function nvCoursesBlock() {
  return `<div class="h"><span class="dot" style="background:var(--peach)"></span>Từ vựng các khoá học Night IELTS</div><div class="grid" style="margin-bottom:26px">` +
    NVCourse.COURSES[S.lang].map(c => `<button class="lv" data-nv="${c.key}"><span class="badge" style="background:${c.col}"><i class="fa-solid fa-book-open"></i></span>
      <b>${esc(c.name)}</b><small>${esc(c.sub)}</small><small style="font-weight:800;color:${c.col}">Luyện gõ theo từng buổi</small>${ira(c.pic, 'pic')}</button>`).join('') + '</div>';
}
function coursesView() {
  if (S.nv) return nvCourseView();
  const m = S.courses[S.lang] || {};
  return nvCoursesBlock() + `<div class="h"><span class="dot"></span>Khoá ${T[S.lang].name} theo trình độ</div><div class="grid">` +
    LEVELS[S.lang].map(([code, col, , desc]) => {
      const n = ((m[code] && m[code].lessons) || []).length;

/* ---------- Tiến độ: lưu trên máy + tài khoản, mở lại là làm tiếp ---------- */
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function progOf(key) {
  if (!key) return null;
  const a = S.prog[key], b = lsGet('nvgo:' + key);
  if (a && b) return (a.at || 0) >= (b.at || 0) ? a : b;
  return a || b || null;
}
function pctOf(p) { if (!p || !p.n) return 0; return Math.round(((p.done && p.done.phrase || []).length + (p.done && p.done.sentence || []).length) / (p.n * 2) * 100); }
function progBadge(key) {
  const p = progOf(key); if (!p) return '';
  const pc = pctOf(p);
  return ` · <b style="color:${pc >= 100 ? '#047857' : 'var(--ac)'}">${pc >= 100 ? '✓ Hoàn thành' : 'Đã gõ ' + pc + '% · làm tiếp'}</b>`;
}
async function loadProg() {
  if (!S.user) return;
  try {
    const snap = await getDocs(query(collection(db, 'typeProgress'), where('uid', '==', S.user.uid)));
    snap.forEach(d => { const x = d.data(); if (x.key) S.prog[x.key] = x; });
    render();
  } catch (e) { console.warn('typeProgress', e); }
}
const progT = {};
window.addEventListener('message', e => {
  const m = e.data; if (!m || !m.nvProgress || !m.key || m.key !== S.pkey) return;
  const p = Object.assign({}, m.nvProgress, { at: Date.now(), title: $('#pTitle').textContent || '' });
  lsSet('nvgo:' + m.key, p); S.prog[m.key] = p;
  if (!S.user) return;
  clearTimeout(progT[m.key]);
  progT[m.key] = setTimeout(() => {
    setDoc(doc(db, 'typeProgress', S.user.uid + '__' + m.key.replace(/[\/#?]/g, '_')), Object.assign({ uid: S.user.uid, key: m.key, pct: pctOf(p) }, p)).catch(err => console.warn('save prog', err));
  }, 1500);
});

/* ---------- AI ---------- */
function groqCfg() { try { return JSON.parse(localStorage.getItem('nightIeltsGroqCfg') || '{}'); } catch (e) { return {}; } }

  if (opt.json) body.response_format = { type: 'json_object' };
  if (/gpt-oss/.test(body.model)) body.reasoning_effort = 'low';
  const url = 'https://api.groq.com/openai/v1/chat/completions';
  const init = { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, key ? { Authorization: 'Bearer ' + key } : {}), body: JSON.stringify(body) };
  const r = window.NightPlan && NightPlan.groqFetch ? await NightPlan.groqFetch(url, init, 'writing') : await fetch(url, init);
  if (!r.ok) throw new Error('AI đang bận, bạn chờ khoảng 1 phút rồi thử lại nhé.');
  const j = await r.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.82)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function readImages() {
  let out = '';
  for (let i = 0; i < S.imgs.length; i++) {
    setStatus(`<i class="fa-solid fa-spinner fa-spin"></i> Đang đọc chữ trong ảnh ${i + 1}/${S.imgs.length}…`);
    const t = await aiChat([{ role: 'user', content: [
      { type: 'text', text: 'Transcribe ALL the ' + (S.lang === 'zh' ? 'Chinese' : 'English') + ' text in this image exactly, in reading order, as plain text. No commentary, no translation.' },
      { type: 'image_url', image_url: { url: S.imgs[i] } }] }], { model: 'meta-llama/llama-4-scout-17b-16e-instruct', max: 3000 });
    out += (out ? '\n\n' : '') + t.trim();
  }
  return out;
}
const PROMPT_EN = `You are a lexicographer making listening-typing exercises for Vietnamese learners of English.
Classify vocabulary by CEFR level exactly as the Cambridge English Vocabulary Profile / Cambridge Dictionary does, for the SENSE used in the text.
From the TEXT, list EVERY word and multi-word expression (phrasal verbs, collocations, fixed phrases, idioms) whose CEFR level is one of LEVELS. Be exhaustive for those levels; do not include other levels. Skip names, numbers and function words unless they belong to LEVELS.
For each item:
- "phrase": dictionary form (e.g. "take part in", "reluctant").
- "level": its CEFR level (one of LEVELS).
- "meaningVi": short natural Vietnamese meaning for this sense.
- "sentence": the sentence from the TEXT where it appears (if longer than 22 words, shorten it naturally but keep the item inside it exactly as used).
- "sentenceVi": natural Vietnamese translation of that sentence.
Reply with ONLY JSON: {"items":[{"phrase":"","level":"","meaningVi":"","sentence":"","sentenceVi":""}]}`;
const PROMPT_ZH = `You are a lexicographer making listening-typing exercises for Vietnamese learners of Mandarin Chinese.
Classify words by HSK level using the official HSK 2.0 word lists (HSK1–HSK6).
From the TEXT, list EVERY word whose HSK level is one of LEVELS. Be exhaustive for those levels; do not include other levels. Skip names and numbers.
For each item:
- "hanzi": the word in simplified characters.
- "pinyin": pinyin with tone marks, ONE syllable per Chinese character, syllables separated by single spaces (e.g. "gōng jiāo chē").
- "level": "HSK1".."HSK6".
- "meaningVi": short Vietnamese meaning for this sense.
- "sentenceHanzi": the sentence from the TEXT containing the word (shorten to ≤ 20 characters if long, keeping the word).
- "sentencePinyin": pinyin of that sentence, ONE syllable per Chinese character (ignore punctuation), separated by single spaces.
- "sentenceVi": Vietnamese translation of the sentence.
Reply with ONLY JSON: {"items":[{"hanzi":"","pinyin":"","level":"","meaningVi":"","sentenceHanzi":"","sentencePinyin":"","sentenceVi":""}]}`;
function chunks(text, n) {
  const parts = text.split(/(?<=[.!?。！？\n])/), out = []; let cur = '';
  parts.forEach(p => { if ((cur + p).length > n && cur) { out.push(cur); cur = ''; } cur += p; });
  if (cur.trim()) out.push(cur);
  return out;
}
const hanCount = s => (String(s || '').match(/[一-鿿㐀-䶿]/g) || []).length;
const sylCount = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;
function parseJSON(t) { const m = String(t).match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : { items: [] }; }

async function generate() {
  S.text = ($('#srcText') || {}).value || S.text;
  if (!S.user) return needLogin('Đăng nhập để dùng AI tạo bài luyện.');
  if (!S.levels.length) return setStatus('Chọn ít nhất 1 mức từ muốn học nhé.', 'err');
  if (!S.text.trim() && !S.imgs.length) return setStatus('Dán văn bản hoặc thêm ảnh trước nhé.', 'err');
  S.busy = true; S.result = null; render();
  try {
    let text = S.text.trim();
    if (S.imgs.length) { const fromImg = await readImages(); text = (text ? text + '\n\n' : '') + fromImg; S.text = text; S.imgs = []; }
    const zh = S.lang === 'zh', parts = chunks(text, zh ? 900 : 2500).slice(0, 8), seen = new Set(), items = [];
    let bad = 0;
    for (let i = 0; i < parts.length; i++) {
      setStatus(`<i class="fa-solid fa-spinner fa-spin"></i> AI đang lọc từ ${parts.length > 1 ? `(phần ${i + 1}/${parts.length})` : ''}…`);
      const out = parseJSON(await aiChat([{ role: 'system', content: zh ? PROMPT_ZH : PROMPT_EN }, { role: 'user', content: 'LEVELS: ' + S.levels.join(', ') + '\n\nTEXT:\n' + parts[i] }], { json: true }));
      (out.items || []).forEach(x => {
        if (!S.levels.includes(String(x.level || '').toUpperCase().replace(/\s/g, ''))) return;
        const key = String(zh ? x.hanzi : x.phrase || '').trim().toLowerCase();
        if (!key || seen.has(key)) return;
        if (zh) {
          if (!x.sentenceHanzi || hanCount(x.hanzi) !== sylCount(x.pinyin) || hanCount(x.sentenceHanzi) !== sylCount(x.sentencePinyin)) { bad++; return; }
          items.push({ hanzi: x.hanzi.trim(), pinyinRaw: x.pinyin.trim(), meaningVi: x.meaningVi || '', sentenceHanzi: x.sentenceHanzi.trim(), sentencePinyinRaw: x.sentencePinyin.trim(), sentenceVi: x.sentenceVi || '', level: x.level.toUpperCase().replace(/\s/g, '') });
        } else {
          if (!x.sentence) return;
          items.push({ phrase: x.phrase.trim(), meaningVi: x.meaningVi || '', sentence: x.sentence.trim(), sentenceVi: x.sentenceVi || '', level: x.level.toUpperCase() });
        }
        seen.add(key);
      });
    }
    const order = LEVELS[S.lang].map(l => l[0]);
    items.sort((a, b) => order.indexOf(a.level) - order.indexOf(b.level));
    S.result = { items, levels: S.levels.slice() };
    S.status = items.length ? `Xong — ${items.length} mục thuộc ${S.levels.join(', ')}.${bad ? ` (Bỏ ${bad} mục AI ghi pinyin chưa khớp số chữ.)` : ''} Xem lại bên ${innerWidth < 900 ? 'dưới' : 'phải'} nhé.` : 'Văn bản này không có từ nào thuộc mức bạn chọn. Thử chọn thêm mức khác nhé.';
    S.statusCls = items.length ? 'ok' : 'err';
  } catch (e) {
    S.statusCls = 'err';
    S.status = e.code === 'PRO_ONLY' ? 'Tạo bài bằng AI dành cho tài khoản ⭐ Pro / 🌟 Astra và học sinh Night IELTS. <button class="lk" data-act="upgrade" style="color:inherit;text-decoration:underline;background:none;border:0;font-weight:800;cursor:pointer">Nâng cấp</button> — hoặc dùng "Nhập tay".' : esc(e.message || 'AI đang bận, bạn chờ khoảng 1 phút rồi thử lại nhé.');
  }
  S.busy = false; render();
}
function manual() {
  const raw = ($('#manText') || {}).value || ''; S.text = raw;
  const zh = S.lang === 'zh', items = [], errs = [];
  raw.split('\n').forEach((line, i) => {
    const t = line.trim(); if (!t || t[0] === '#') return;
    const p = t.split('/').map(x => x.trim());
    if (zh) {
      if (p.length < 5 || !p[0] || !p[1] || !p[3] || !p[4]) return errs.push(i + 1);
      items.push({ hanzi: p[0], pinyinRaw: p[1], meaningVi: p[2] || '', sentenceHanzi: p[3], sentencePinyinRaw: p[4], sentenceVi: p[5] || p[2] || '' });
    } else {
      if (p.length < 3 || !p[0] || !p[2]) return errs.push(i + 1);
      items.push({ phrase: p[0], meaningVi: p[1] || '', sentence: p[2], sentenceVi: p[3] || p[1] || '' });
    }
  });
  S.result = { items, levels: [] };
  S.status = items.length ? `Đã đọc ${items.length} mục.${errs.length ? ' Dòng thiếu dữ liệu: ' + errs.slice(0, 8).join(', ') + '.' : ''}` : 'Chưa đọc được dòng nào — kiểm tra lại định dạng nhé.';
  S.statusCls = items.length ? 'ok' : 'err';
  render();
}
async function addImages(files) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type));
  if (!list.length) return false;
  S.text = ($('#srcText') || {}).value ?? S.text;
  for (const f of list) { if (S.imgs.length >= 6) { toast('Tối đa 6 ảnh mỗi lần'); break; } try { S.imgs.push(await shrink(f)); } catch (e) {} }
  render(); toast('Đã thêm ảnh — bấm "Tạo bài luyện"');
  return true;
}
/* Dán ảnh từ bộ nhớ tạm (ảnh chụp màn hình, ảnh copy từ web…) khi đang ở tab Tự tạo */
document.addEventListener('paste', e => {
  if (S.tab !== 'create' || S.mode !== 'ai') return;
  const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file' && /^image\//.test(i.type)).map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addImages(files); }
});
function setStatus(h, cls) { S.status = h; S.statusCls = cls || ''; const el = $('#st'); if (el) { el.innerHTML = h; el.className = 'status ' + (cls || ''); } }
const clean = items => items.map(({ level, ...x }) => x);
const resColor = () => S.result.levels.length ? lvInfo(S.lang, S.result.levels[0])[2] : (S.lang === 'zh' ? 'red' : 'blue');

function needName() {
  const t = (S.title || '').trim();
  if (t) return t;
  const el = $('#nameIn'); if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.style.borderColor = '#E11D48'; }
  toast('Đặt tên bài trước nhé');

}
async function saveMine() {
  if (!S.user) return needLogin();
  const title = needName(); if (!title) return;
  try {
    await addDoc(collection(db, 'typeMine'), { uid: S.user.uid, lang: S.lang, title, levels: S.result.levels, items: S.result.items, at: Date.now() });

}
async function toCourse() {
  const level = $('#toCourse').value, title = needName();

  const id = S.lang + '-' + level, ref = doc(db, 'typeCourses', id);
  try {

    await setDoc(ref, { lang: S.lang, level, lessons: d.lessons, updatedAt: Date.now() });

    S.courses[S.lang] = null; S.target = ''; await loadCourses(true);

}
async function delCourseLesson(i) {
  const code = S.course, c = S.courses[S.lang][code]; if (!c || !confirmDel(c.lessons[i].title)) return;
  const lessons = c.lessons.slice(); lessons.splice(i, 1);
  await setDoc(doc(db, 'typeCourses', S.lang + '-' + code), { lang: S.lang, level: code, lessons, updatedAt: Date.now() });

function confirmDel(name) { return window.confirm('Xoá bài "' + name + '"?'); }

/* ---------- Sự kiện ---------- */
function bind() {
  const v = $('#view');
  v.querySelectorAll('[data-course]').forEach(b => b.onclick = () => { S.course = b.dataset.course; render(); });
  v.querySelectorAll('[data-nv]').forEach(b => b.onclick = () => { S.nv = b.dataset.nv; render(); loadNv(S.nv); });
  v.querySelectorAll('[data-nvl]').forEach(b => b.onclick = e => { if (!e.target.closest('[data-nvplant]')) openNv(S.nv, +b.dataset.nvl); });
  v.querySelectorAll('[data-nvplant]').forEach(b => b.onclick = async () => {
    try { const r = await NVCourse.lesson(S.nv, +b.dataset.nvplant); if (!r.items.length) return toast('Buổi này chưa có từ vựng'); const keep = S.lang; S.lang = r.lang; plant(r.items, r.title); S.lang = keep; }
    catch (e) { toast('Chưa lấy được từ vựng buổi này'); }
  });
  v.querySelectorAll('[data-open-course]').forEach(b => b.onclick = e => {
    if (e.target.closest('[data-del-course],[data-ren-course]')) return;
    const l = S.courses[S.lang][S.course].lessons[+b.dataset.openCourse];
    play(l.title, clean(l.items), lvInfo(S.lang, S.course)[2], undefined, `lv-${S.lang}-${S.course}-${l.at || b.dataset.openCourse}`);
  });
  v.querySelectorAll('[data-del-course]').forEach(b => b.onclick = () => delCourseLesson(+b.dataset.delCourse));
  v.querySelectorAll('[data-ren-course]').forEach(b => b.onclick = async () => {
    const code = S.course, c = S.courses[S.lang][code], i = +b.dataset.renCourse, t = (window.prompt('Tên mới cho bài:', c.lessons[i].title) || '').trim();
    if (!t) return;
    const lessons = c.lessons.slice(); lessons[i] = Object.assign({}, lessons[i], { title: t });
    await setDoc(doc(db, 'typeCourses', S.lang + '-' + code), { lang: S.lang, level: code, lessons, updatedAt: Date.now() });
    c.lessons = lessons; render();
  });
  v.querySelectorAll('[data-open-mine]').forEach(b => b.onclick = e => {

    const l = S.mine.find(m => m.id === b.dataset.openMine);
    play(l.title, clean(l.items), l.levels && l.levels[0] ? lvInfo(S.lang, l.levels[0])[2] : undefined, undefined, 'mine-' + l.id);
  });
  v.querySelectorAll('[data-plant-mine]').forEach(b => b.onclick = () => { const l = S.mine.find(m => m.id === b.dataset.plantMine); plant(l.items, l.title); });
  v.querySelectorAll('[data-ren-mine]').forEach(b => b.onclick = async () => {
    const l = S.mine.find(m => m.id === b.dataset.renMine), t = (window.prompt('Tên mới cho bài:', l.title) || '').trim();
    if (!t || t === l.title) return;
    try { await updateDoc(doc(db, 'typeMine', l.id), { title: t }); l.title = t; render(); } catch (e) { toast('Chưa đổi được tên: ' + e.message); }
  });
  v.querySelectorAll('[data-del-mine]').forEach(b => b.onclick = async () => {
    const l = S.mine.find(m => m.id === b.dataset.delMine); if (!confirmDel(l.title)) return;
    await deleteDoc(doc(db, 'typeMine', l.id)); S.mine = S.mine.filter(m => m !== l); render();
  });
  v.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { const c = b.dataset.lv; S.text = ($('#srcText') || {}).value ?? S.text; S.levels = S.levels.includes(c) ? S.levels.filter(x => x !== c) : S.levels.concat(c); render(); });
  v.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; S.status = ''; render(); });
  v.querySelectorAll('[data-rmimg]').forEach(b => b.onclick = e => { e.preventDefault(); S.imgs.splice(+b.dataset.rmimg, 1); render(); });
  v.querySelectorAll('[data-rmit]').forEach(b => b.onclick = () => { S.result.items.splice(+b.dataset.rmit, 1); render(); });
  const ni = $('#nameIn'); if (ni) ni.oninput = () => { S.title = ni.value; };
  const st = $('#srcText'); if (st) st.oninput = () => S.text = st.value;
  const im = $('#imgIn'); if (im) im.onchange = () => addImages(im.files);

  }
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = b.dataset.act;

    else if (a === 'save') saveMine();

    else if (a === 'toCourse') toCourse();
    else if (a === 'login') needLogin();

  });
  const up = v.querySelector('[data-act="upgrade"]'); if (up) up.onclick = () => window.NightPlan && NightPlan.openUpgrade('', 'pro');
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {

if (/[?&]oobCode=/.test(location.search)) NightLogin.complete(auth, A);
renderShell();
loadCourses();
(() => {
  const q = new URLSearchParams(location.search), key = q.get('course'), n = +q.get('n');
  if (!key) return;
  S.tab = 'courses'; S.nv = key; renderShell(); loadNv(key);
  if (n) {
    let tries = 0;
    const go = () => { if (S.authDone || ++tries > 40) openNv(key, n); else setTimeout(go, 250); };
    setTimeout(go, n <= COURSE_FREE ? 0 : 400);
  }
})();
