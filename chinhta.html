<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chép chính tả Listening · Night IELTS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#24242A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--ink:#24242A;--ink2:#34343C;--panel:#F4F4F7;--line:#EEEEF3;--mut:#6B6B78;--lilac:#6C70DC;--lilac-l:#EDEEFD;--peach:#FF9E5E;--gold:#FFD66B}
*{box-sizing:border-box}
html{background:#E9E9EF}
body{margin:0;background:#E9E9EF;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding:10px 10px calc(30px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
.frame{max-width:72rem;margin:0 auto;background:var(--ink);border-radius:28px;padding:6px;box-shadow:0 30px 70px -20px rgba(36,36,42,.55)}
header{display:flex;align-items:center;gap:12px;color:#fff;padding:10px 12px 14px}
header a.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px}
header h1{margin:0;font-size:17px;font-weight:800}header h1 small{display:block;font-size:11px;font-weight:600;color:#A9A9B8}
.astra{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFD66B,#FF9E5E);color:#3A2410;border-radius:999px;padding:7px 12px;font-weight:900;font-size:11.5px;letter-spacing:.06em}
.body{background:#fff;border-radius:24px;padding:22px}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border-radius:24px;padding:22px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#6C70DC 0%,#3A3D9C 45%,#24215F 100%)}
.hero h2{margin:0 0 6px;font-size:clamp(22px,3vw,30px);font-weight:900}.hero p{margin:0;color:#E0E1FF;line-height:1.55;font-size:14px;max-width:620px}
.hero img{height:130px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.steps span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.st{flex:1;min-width:150px;background:var(--panel);border-radius:18px;padding:12px 14px}.st small{display:block;color:var(--mut);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}.st b{font-size:24px;font-weight:900}
.missbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:14px 16px;background:linear-gradient(120deg,#FFF1F5,#FFF7ED);cursor:pointer;text-align:left;margin-bottom:16px}
.missbtn .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#FFE4E6;color:#BE123C;font-weight:900;font-size:16px;flex:none}.missbtn b{display:block;font-size:15px}.missbtn small{color:#9A3412}
.books{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.books button{border:0;border-radius:999px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;background:var(--panel)}.books button.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.test{border:2px solid var(--line);border-radius:22px;padding:14px}
.test h3{margin:0 0 10px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}.test h3 i{color:var(--lilac)}
.sec{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--panel);border-radius:14px;padding:10px 12px;margin-bottom:6px;cursor:pointer;text-align:left}
.sec:hover{background:var(--lilac-l)}.sec .k{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#fff;font-weight:900;font-size:13px;color:var(--lilac);flex:none}
.sec .t{flex:1;min-width:0}.sec .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sec .t small{color:var(--mut);font-size:11.5px}
.sec .bar{height:5px;border-radius:99px;background:#E4E4EC;margin-top:4px;overflow:hidden}.sec .bar i{display:block;height:100%;background:linear-gradient(90deg,#6C70DC,#9BE7A1)}
.sec.done .k{background:#22C55E;color:#fff}
.lock{text-align:center;padding:40px 16px}.lock img{height:150px}.lock h3{margin:10px 0 6px;font-size:22px}.lock p{color:var(--mut);max-width:460px;margin:0 auto 14px;line-height:1.55}
.go{border:0;border-radius:999px;padding:13px 20px;font-weight:900;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#FFD66B,#FF9E5E);color:#3A2410;display:inline-flex;align-items:center;gap:8px}
.wait{color:var(--mut);padding:30px;text-align:center}
@media(max-width:640px){.body{padding:14px}.hero{grid-template-columns:1fr;padding:18px}.hero img{display:none}header h1 small{display:none}}

html,body{background:radial-gradient(60% 50% at 0% 0%,#FFE3EC,transparent 70%),radial-gradient(55% 50% at 100% 0%,#DDF4FF,transparent 70%),radial-gradient(60% 55% at 100% 100%,#E3FBEF,transparent 70%),radial-gradient(60% 55% at 0% 100%,#FFF3C9,transparent 70%),#FFF8EE}
.frame{background:linear-gradient(135deg,#FF6B8B,#FF9F43 25%,#FECA57 45%,#1DD1A1 65%,#48C6EF 82%,#A78BFA);box-shadow:0 30px 70px -28px rgba(255,107,139,.55)}
header h1{text-shadow:0 1px 2px rgba(0,0,0,.18)}header h1 small{color:#fff;opacity:.9}
.hero{background:linear-gradient(120deg,#FF6B8B 0%,#FF9F43 40%,#A78BFA 100%)}.hero p{color:#fff}.hero b{color:#FFF3C9}
.st:nth-child(1){background:#E0F2FE}.st:nth-child(2){background:#DCFCE7}.st:nth-child(3){background:#FFE4EF}
.books button:nth-child(6n+1).on{background:#FF6B8B}.books button:nth-child(6n+2).on{background:#FF9F43}.books button:nth-child(6n+3).on{background:#10B981}.books button:nth-child(6n+4).on{background:#3B82F6}.books button:nth-child(6n+5).on{background:#8B5CF6}.books button:nth-child(6n).on{background:#EC4899}
.test{border-color:#F1ECFB}.test h3 i{color:#FF6B8B}
.sec:nth-of-type(1){background:#FFF0F3}.sec:nth-of-type(1) .k{color:#E11D48}.sec:nth-of-type(1) .bar i{background:linear-gradient(90deg,#FF6B8B,#FF9F43)}
.sec:nth-of-type(2){background:#FFF6E8}.sec:nth-of-type(2) .k{color:#C2410C}.sec:nth-of-type(2) .bar i{background:linear-gradient(90deg,#FF9F43,#FECA57)}
.sec:nth-of-type(3){background:#EBFBF3}.sec:nth-of-type(3) .k{color:#047857}.sec:nth-of-type(3) .bar i{background:linear-gradient(90deg,#10B981,#48C6EF)}
.sec:nth-of-type(4){background:#EEF4FF}.sec:nth-of-type(4) .k{color:#1D4ED8}.sec:nth-of-type(4) .bar i{background:linear-gradient(90deg,#3B82F6,#A78BFA)}
.sec:hover{filter:brightness(.97);transform:translateY(-1px)}.sec{transition:transform .15s}
.sec.done .k{background:#22C55E;color:#fff}
</style>
</head>
<body>
<div class="frame">
  <header>
    <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Trang chủ</a>
    <h1>Chép chính tả Listening<small>Nghe audio gốc của đề · gõ lại từng câu</small></h1>
    <span class="astra"><i class="fa-solid fa-star"></i> ASTRA</span>
  </header>
  <div class="body" id="main"><div class="wait"><i class="fa-solid fa-spinner fa-spin"></i> Đang kiểm tra tài khoản…</div></div>
</div>
<script src="night-plan.js?v=20261113a"></script>
<script src="luyengo/dictation.js?v=2"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var ls = function (k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
  var IMG = 'khoahoc/img/ira/';
  var S = { tests: [], book: ls('nv-dict-book') || '', docs: {} };

  function allMiss() {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('nv-dict-miss:') === 0) (ls(k) || []).forEach(function (x) { x.path = k.slice(13); out.push(x); }); }
    return out;
  }
  function prog(path, n) { return ls('nv-dict-hub:' + path + ':' + n) || null; }

  function locked() {
    $('#main').innerHTML = '<div class="lock"><img src="' + IMG + 'online_school_girl_9740.webp" alt=""><h3>Chép chính tả bằng audio gốc của đề</h3>' +
      '<p>Nghe từng câu thật của đề Cambridge rồi gõ lại — cách luyện nghe chi tiết hiệu quả nhất. Tính năng dành cho tài khoản <b>Astra</b>.</p>' +
      '<button class="go" id="up"><i class="fa-solid fa-star"></i> Nâng cấp Astra</button></div>';
    $('#up').onclick = function () { NightPlan.openUpgrade('Chép chính tả bằng audio gốc của đề Listening là tính năng của gói 🌟 Astra.', 'astra'); };
  }
  function render() {
    var books = []; S.tests.forEach(function (t) { if (books.indexOf(t.book) < 0) books.push(t.book); });
    if (!S.book || books.indexOf(S.book) < 0) S.book = books[0];
    var miss = allMiss(), doneSec = 0, totSec = S.tests.length * 4;
    S.tests.forEach(function (t) { [1, 2, 3, 4].forEach(function (n) { var p = prog(t.path, n); if (p && p.ok >= p.n) doneSec++; }); });
    $('#main').innerHTML =
      '<section class="hero"><div><h2>Nghe từng câu · gõ lại từng chữ</h2><p>Mỗi Section của đề được cắt sẵn thành từng câu bằng <b>audio gốc</b>. Nghe rồi gõ lại — câu nào nghe chưa ra sẽ tự vào “Câu nghe sai” để ôn tới khi thuộc.</p>' +
      '<div class="steps"><span>Enter: qua câu</span><span>Cmd/Ctrl + Shift: nghe lại</span><span>Chậm: phát 0.75x</span></div></div><img src="' + IMG + 'online_school_girl_9740.webp" alt=""></section>' +
      '<div class="stats"><div class="st"><small>Section đã chép xong</small><b>' + doneSec + '</b> / ' + totSec + '</div><div class="st"><small>Đề có sẵn</small><b>' + S.tests.length + '</b></div><div class="st"><small>Câu nghe sai</small><b style="color:#BE123C">' + miss.length + '</b></div></div>' +
      (miss.length ? '<button class="missbtn" id="missAll"><span class="n">' + miss.length + '</span><span><b>Ôn tất cả câu nghe sai</b><small>Gom từ mọi đề bạn đã chép · nghe đúng là tự gỡ khỏi danh sách</small></span><i class="fa-solid fa-chevron-right" style="margin-left:auto;color:#9A3412"></i></button>' : '') +
      '<div class="books">' + books.map(function (b) { return '<button data-b="' + b + '" class="' + (b === S.book ? 'on' : '') + '">' + b + '</button>'; }).join('') + '</div>' +
      '<div class="grid">' + S.tests.filter(function (t) { return t.book === S.book; }).map(function (t) {
        return '<div class="test"><h3><i class="fa-solid fa-headphones"></i>' + esc(t.book + ' · ' + t.title) + '</h3>' + [1, 2, 3, 4].map(function (n) {
          var p = prog(t.path, n), pct = p ? Math.round(p.ok / Math.max(1, p.n) * 100) : 0, dn = p && p.ok >= p.n;
          return '<button class="sec' + (dn ? ' done' : '') + '" data-p="' + t.path + '" data-n="' + n + '"><span class="k">' + (dn ? '<i class="fa-solid fa-check"></i>' : n) + '</span><span class="t"><b>Section ' + n + '</b><small>' + (p ? p.ok + '/' + p.n + ' câu đã chép' : 'Chưa chép') + '</small><div class="bar"><i style="width:' + pct + '%"></i></div></span></button>';
        }).join('') + '</div>';
      }).join('') + '</div>';
    document.querySelectorAll('[data-b]').forEach(function (b) { b.onclick = function () { S.book = b.dataset.b; ls('nv-dict-book', S.book); render(); }; });
    document.querySelectorAll('.sec').forEach(function (b) { b.onclick = function () { openSec(b.dataset.p, +b.dataset.n, b); }; });
    var mb = $('#missAll'); if (mb) mb.onclick = openMiss;
  }
  function loadDoc(path) {
    if (S.docs[path]) return S.docs[path];
    return (S.docs[path] = fetch(path).then(function (r) { return r.text(); }).then(function (h) {
      var d = new DOMParser().parseFromString(h, 'text/html'), m = h.match(/const AUDIO_SRC\s*=\s*"([^"]*)"/), base = new URL(path, location.href);
      var audio = m && m[1] ? new URL(m[1], base).href : '';
      return { doc: d, audio: audio, align: audio ? audio.replace(/-audio\.mp3$|\.mp3$/, '') + '-align.json' : '' };
    }));
  }
  function record(path) {
    return function (it, bad) {
      var key = 'nv-dict-miss:/' + path.replace(/^\//, ''), M = ls(key) || [], at = M.findIndex(function (x) { return x.s === it.s; });
      if (bad && at < 0) M.push({ s: it.s, who: it.who || '', t0: it.t0, t1: it.t1 });
      if (!bad && at >= 0 && it.review) M.splice(at, 1);
      ls(key, M);
      if (it.sec) { var pk = 'nv-dict-hub:' + path + ':' + it.sec, p = ls(pk) || { n: it.total, ok: 0, seen: {} }; p.n = it.total; p.seen = p.seen || {}; if (!p.seen[it.idx]) { p.seen[it.idx] = 1; p.ok = Object.keys(p.seen).length; } ls(pk, p); }
    };
  }
  function openSec(path, n, btn) {
    if (btn) btn.querySelector('small').textContent = 'Đang mở…';
    loadDoc(path).then(function (D) {
      return NVDict.timing(D.align).then(function (T) {
        var L = NVDict.attach(NVDict.sentences(D.doc, n), T, n);
        if (!L.length) { alert('Section này chưa có transcript.'); return render(); }
        var t = S.tests.find(function (x) { return x.path === path; }) || {};
        L.forEach(function (x, i) { x.tag = (t.book || '') + ' ' + (t.title || '') + ' · Section ' + n + ' · câu ' + (i + 1) + '/' + L.length; x.sec = n; x.idx = i; x.total = L.length; });
        NVDict.open({ title: 'Chép chính tả · ' + (t.book || '') + ' ' + (t.title || '') + ' · Section ' + n, items: L, audio: D.audio, onResult: record(path), onClose: render });
      });
    }).catch(function () { alert('Chưa mở được đề — kiểm tra mạng rồi thử lại nhé.'); render(); });
  }
  function openMiss() {
    var M = allMiss(); if (!M.length) return;
    /* gom theo đề: mỗi đề 1 audio */
    var by = {}; M.forEach(function (x) { (by[x.path] = by[x.path] || []).push(x); });
    var paths = Object.keys(by), path = paths[0], list = by[path].map(function (x, i, a) { return { s: x.s, who: x.who, t0: x.t0, t1: x.t1, review: 1, tag: 'Câu nghe sai ' + (i + 1) + '/' + a.length + (paths.length > 1 ? ' · đề 1/' + paths.length : '') }; });
    loadDoc(path.replace(/^\//, '')).then(function (D) {
      NVDict.open({ title: 'Ôn câu nghe sai', items: list, audio: D.audio, onResult: record(path.replace(/^\//, '')), onClose: render });
    });
  }
  /* khởi động: kiểm tra gói → tải danh sách đề */
  NVDict.canUse(true).then(function (ok) {
    if (!ok) return locked();
    return fetch('listening/manifest.json').then(function (r) { return r.json(); }).then(function (m) {
      var L = m.listening || {};
      Object.keys(L.cam || {}).sort(function (a, b) { return a - b; }).forEach(function (b) { Object.keys(L.cam[b]).forEach(function (n) { S.tests.push({ book: 'Cam ' + b, title: L.cam[b][n].title, path: L.cam[b][n].path }); }); });
      Object.keys(L.real || {}).forEach(function (b) { Object.keys(L.real[b]).forEach(function (n) { S.tests.push({ book: 'Real ' + b, title: L.real[b][n].title, path: L.real[b][n].path }); }); });
      render();
    });
  }).catch(function () { $('#main').innerHTML = '<div class="wait">Chưa tải được — kiểm tra mạng rồi tải lại trang.</div>'; });
})();
</script>
</body>
</html>
