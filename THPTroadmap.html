    <!-- Custom CSS for Animations, 3D & Dark UI Tweaks -->
    <style>
        body { 
            background-color: #050505; 
            /* Gradient lưới tối màu sang trọng */
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
            overflow-x: hidden; 
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* 3D Flip */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }

        // --- COMPONENTS ---

        // Scroll Reveal
        const Reveal = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.15, rootMargin: '0px 0px -20px 0px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div 
                    ref={ref} 
                    className={isVisible ? 'reveal-visible' : 'reveal-hidden'}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        // Bảng Tiến độ Tổng (Khởi tạo 0%)
        const ProgressDashboard = () => (
            <Reveal delay={200}>

                            </p>
                        </div>
                    </Reveal>

                    {/* Bảng Tiến độ Khởi điểm */}
                    <ProgressDashboard />

                    {/* Timeline Trục thời gian */}
                    <div className="relative pt-12 pb-24">
                        {/* Đường Neon dọc */}
                        <div className="absolute left-[11px] md:left-1/2 top-0 bottom-0 w-1 timeline-line md:-translate-x-1/2 rounded-full"></div>
                        
                        {/* Start Node */}
                        <div className="absolute left-[1px] md:left-1/2 top-0 w-6 h-6 bg-slate-800 border-[3px] border-cyan-400 rounded-full md:-translate-x-1/2 -mt-4 shadow-[0_0_15px_rgba(34,211,238,0.5)] z-20"></div>
                        <div className="absolute left-8 md:left-1/2 top-[-14px] md:ml-8 text-xs font-black tracking-[0.2em] text-cyan-400 drop-shadow-md">XUẤT PHÁT</div>

                        {/* Danh sách các Phase */}
                        <div className="space-y-20 md:space-y-32">
                            {ROADMAP_DATA.map((phase, index) => (
                                <PhaseCard key={phase.id} data={phase} index={index} />
                            ))}
                        </div>

                        {/* End Node */}
                        <div className="absolute left-[1px] md:left-1/2 bottom-0 w-6 h-6 bg-[#0B0F19] border-[3px] border-rose-500 rounded-full md:-translate-x-1/2 -mb-4 shadow-[0_0_15px_rgba(244,63,94,0.5)] z-20"></div>
                        <div className="absolute left-8 md:left-1/2 bottom-[-18px] md:ml-8 text-xs font-black tracking-[0.2em] text-rose-500 drop-shadow-md">ĐÍCH ĐẾN</div>
                    </div>
                    
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
